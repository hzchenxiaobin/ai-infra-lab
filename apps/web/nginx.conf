# web SPA 静态托管：/assets 长缓存，其余路径回退 index.html（BrowserRouter）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 不缓存（每次 revalidate，部署后立刻生效，未变走 304）；
    # 否则浏览器启发式缓存旧 index.html，部署后首访拿到旧版本、刷新才更新
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
