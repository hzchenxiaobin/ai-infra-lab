# docs 三分区静态托管：nginx 侧不做 SPA 回退（纯内容站，404 即 404）。
# 分区挂载：/learn（learn/dist）、/problems/gpu（problems-gpu/dist）、
# /problems（problems-algo/dist，base=/problems/；gpu 子路径优先匹配）。
# 图片随镜像分发（deployment §1 方案一），根 fs 只读。
#
# try_files 三段回退对齐统一 ID 无后缀 URL（contents.url）：
#   $uri            —— gpu 分区目录形态（easy/1-vector-add/index.html）
#   $uri/index.html —— 目录索引
#   $uri.html       —— learn/algo 平铺页（notes/x.html、algo/0001.html）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # 静态资产长缓存（VitePress 产物带内容哈希）
    location ~* \.(js|css|svg|png|jpg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # GPU 分区（/problems/gpu/...）优先于 algo 分区（/problems/...）匹配
    location /problems/gpu/ {
        try_files $uri $uri/index.html $uri.html =404;
    }

    location /learn/ {
        try_files $uri $uri/index.html $uri.html =404;
    }

    location /problems/ {
        try_files $uri $uri/index.html $uri.html =404;
    }

    location = / {
        return 404;
    }
}
