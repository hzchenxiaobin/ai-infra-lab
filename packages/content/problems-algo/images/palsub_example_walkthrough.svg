<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：s = "aaa"，逐中心计数累计 6</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">枚举 2n−1=5 个中心（外加越界的 (2,3) 贡献 0），每扩展成功一层 +1</text>

  <!-- ===== Table grid ===== -->
  <!-- columns: 中心[30,150] 类型[150,250] 扩展出的回文[250,440] 计得[440,500] 累计[500,580] -->
  <!-- header row y 58..88 -->
  <rect x="30" y="58" width="550" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="150" y1="58" x2="150" y2="88" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="250" y1="58" x2="250" y2="88" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="440" y1="58" x2="440" y2="88" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="500" y1="58" x2="500" y2="88" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="90"  y="78" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">中心</text>
  <text x="200" y="78" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">类型</text>
  <text x="345" y="78" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">扩展出的回文</text>
  <text x="470" y="78" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">计得</text>
  <text x="540" y="78" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">累计</text>

  <!-- 6 data rows, each 32 tall, starting y=88 -->
  <!-- row 1: (0,0) odd | "a" | 1 | 1 -->
  <rect x="30" y="88" width="550" height="32" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="90"  y="109" text-anchor="middle" font-size="11" fill="#333">(0,0)</text>
  <text x="200" y="109" text-anchor="middle" font-size="11" fill="#b85450">奇数</text>
  <text x="345" y="109" text-anchor="middle" font-size="11" fill="#333">"a"（半径 0）</text>
  <text x="470" y="109" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="540" y="109" text-anchor="middle" font-size="11" fill="#333">1</text>

  <!-- row 2: (0,1) even | "aa" | 1 | 2 -->
  <rect x="30" y="120" width="550" height="32" fill="#f7f9fc" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="90"  y="141" text-anchor="middle" font-size="11" fill="#333">(0,1)</text>
  <text x="200" y="141" text-anchor="middle" font-size="11" fill="#4a7a3a">偶数</text>
  <text x="345" y="141" text-anchor="middle" font-size="11" fill="#333">"aa"（s[0]==s[1]）</text>
  <text x="470" y="141" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="540" y="141" text-anchor="middle" font-size="11" fill="#333">2</text>

  <!-- row 3: (1,1) odd | "a","aaa" | 2 | 4  highlight (contributes 2) -->
  <rect x="30" y="152" width="550" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="90"  y="173" text-anchor="middle" font-size="11" fill="#333">(1,1)</text>
  <text x="200" y="173" text-anchor="middle" font-size="11" fill="#b85450">奇数</text>
  <text x="345" y="173" text-anchor="middle" font-size="11" fill="#333">"a"、"aaa"（两层）</text>
  <text x="470" y="173" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="540" y="173" text-anchor="middle" font-size="11" fill="#333">4</text>

  <!-- row 4: (1,2) even | "aa" | 1 | 5 -->
  <rect x="30" y="184" width="550" height="32" fill="#f7f9fc" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="90"  y="205" text-anchor="middle" font-size="11" fill="#333">(1,2)</text>
  <text x="200" y="205" text-anchor="middle" font-size="11" fill="#4a7a3a">偶数</text>
  <text x="345" y="205" text-anchor="middle" font-size="11" fill="#333">"aa"（s[1]==s[2]）</text>
  <text x="470" y="205" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="540" y="205" text-anchor="middle" font-size="11" fill="#333">5</text>

  <!-- row 5: (2,2) odd | "a" | 1 | 6  final answer -->
  <rect x="30" y="216" width="550" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="90"  y="237" text-anchor="middle" font-size="11" fill="#333">(2,2)</text>
  <text x="200" y="237" text-anchor="middle" font-size="11" fill="#b85450">奇数</text>
  <text x="345" y="237" text-anchor="middle" font-size="11" fill="#333">"a"（半径 0）</text>
  <text x="470" y="237" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="540" y="237" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">6 ✓</text>

  <!-- row 6: (2,3) even | 越界 | 0 | 6 -->
  <rect x="30" y="248" width="550" height="32" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="90"  y="269" text-anchor="middle" font-size="11" fill="#888">(2,3)</text>
  <text x="200" y="269" text-anchor="middle" font-size="11" fill="#4a7a3a">偶数</text>
  <text x="345" y="269" text-anchor="middle" font-size="11" fill="#888">—（right=3 越界，不进入循环）</text>
  <text x="470" y="269" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="540" y="269" text-anchor="middle" font-size="11" fill="#333">6</text>

  <!-- column separators for data rows -->
  <g stroke="#dddddd" stroke-width="1">
    <line x1="150" y1="88" x2="150" y2="280" filter="url(#rough2)"/>
    <line x1="250" y1="88" x2="250" y2="280" filter="url(#rough2)"/>
    <line x1="440" y1="88" x2="440" y2="280" filter="url(#rough2)"/>
    <line x1="500" y1="88" x2="500" y2="280" filter="url(#rough2)"/>
  </g>

  <!-- ===== Summary ===== -->
  <rect x="30" y="300" width="550" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="322" font-size="11" fill="#4a7a3a" font-weight="bold">结果：ans = 6，对应 "a","a","a","aa","aa","aaa"</text>
  <text x="50" y="342" font-size="10.5" fill="#555">• 3 个单字符 "a"（下标 0/1/2 各一个）、2 个 "aa"（[0..1] 与 [1..2]）分别计数</text>
  <text x="50" y="360" font-size="10.5" fill="#555">• 中心 (1,1) 贡献 2 个回文：半径 0 的 "a" + 半径 1 的 "aaa" → 一个中心可产生多个回文</text>
  <text x="50" y="376" font-size="10.5" fill="#4a7a3a">• 验证 Σ计得 = 1+1+2+1+1+0 = 6 ✓</text>
</svg>
