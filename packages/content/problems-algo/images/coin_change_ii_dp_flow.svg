<svg xmlns="http://www.w3.org/2000/svg" width="780" height="560" viewBox="0 0 780 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="780" height="560" fill="#fdfcf7"/>
  <text x="390" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">完全背包计数 DP 流程</text>
  <path d="M 250 42 Q 390 50 530 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 1. Start: init -->
  <g filter="url(#sk)">
    <rect x="270" y="62" width="240" height="44" rx="22" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="390" y="89" text-anchor="middle" font-size="12.5" fill="#2b6e9e">初始化 dp[0..amount]=0, dp[0]=1</text>
  <line x1="390" y1="106" x2="390" y2="128" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 2. outer loop coin -->
  <g filter="url(#sk)">
    <rect x="250" y="130" width="280" height="48" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="390" y="159" text-anchor="middle" font-size="12.5" fill="#2e6e2e">外层：for coin in coins</text>
  <line x1="390" y1="178" x2="390" y2="200" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 3. inner loop decision (diamond) -->
  <g filter="url(#sk)">
    <polygon points="390,202 520,252 390,302 260,252" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="390" y="248" text-anchor="middle" font-size="12" fill="#7a5415">内层 i = coin .. amount</text>
  <text x="390" y="266" text-anchor="middle" font-size="11" fill="#7a5415">（正序）</text>

  <!-- yes branch: do transfer -->
  <text x="540" y="246" font-size="11" fill="#2e6e2e" font-weight="bold">是</text>
  <line x1="520" y1="252" x2="560" y2="252" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="562" y="228" width="190" height="48" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="657" y="250" text-anchor="middle" font-size="11.5" fill="#2b6e9e" font-family="monospace">dp[i] += dp[i - coin]</text>
  <text x="657" y="266" text-anchor="middle" font-size="9.5" fill="#6a96c0">选这枚硬币的方案累加</text>

  <!-- loop back up to inner loop -->
  <path d="M 657 276 L 657 300 L 390 300" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="510" y="316" font-size="10" fill="#888">i++ → 继续内层</text>

  <!-- no branch: inner loop done -->
  <line x1="390" y1="302" x2="390" y2="324" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="400" y="318" font-size="11" fill="#b85450" font-weight="bold">否(内层完)</text>

  <!-- decision: more coins? -->
  <g filter="url(#sk)">
    <polygon points="390,326 500,366 390,406 280,366" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="390" y="370" text-anchor="middle" font-size="12" fill="#b03a3a">还有硬币?</text>

  <!-- yes: back to outer -->
  <text x="232" y="360" font-size="11" fill="#2e6e2e" font-weight="bold">是</text>
  <path d="M 280 366 L 220 366 L 220 154 L 250 154" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="150" y="260" font-size="10" fill="#888">换下一枚硬币</text>

  <!-- no: return -->
  <line x1="390" y1="406" x2="390" y2="430" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="408" y="424" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <g filter="url(#sk)">
    <rect x="290" y="432" width="200" height="44" rx="22" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="390" y="459" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-weight="bold">返回 dp[amount]</text>

  <!-- key note box -->
  <g filter="url(#sk)">
    <rect x="60" y="498" width="660" height="52" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="390" y="519" text-anchor="middle" font-size="11" fill="#444">
    <tspan font-weight="bold" fill="#2e6e2e">外层硬币</tspan> → 组合数 ·
    <tspan font-weight="bold" fill="#2b6e9e">内层正序</tspan> → 完全背包(硬币可重复用) ·
    <tspan font-weight="bold" fill="#b03a3a">dp[0]=1</tspan> 是递归基
  </text>
  <text x="390" y="538" text-anchor="middle" font-size="10" fill="#888">与 322(零钱兑换) 同框架，仅把 min 换成 +=，初值换 dp[0]=1</text>
</svg>
