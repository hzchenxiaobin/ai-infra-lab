<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">贪心直觉：结束越早，给后面留的空间越大</text>

  <!-- interval bars (Gantt-like). origin x=70, unit=40, values 0..10 -->
  <!-- A [1,10] the long one -->
  <rect x="110" y="70" width="360" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="118" y="87" font-size="12" fill="#b85450" font-weight="bold">A [1,10]</text>
  <text x="462" y="87" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold">右端=10</text>

  <!-- B [2,3] -->
  <rect x="150" y="104" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="60" y="121" text-anchor="end" font-size="11.5" fill="#446688" font-weight="bold">B [2,3]</text>
  <text x="196" y="121" font-size="11" fill="#446688">右端=3</text>

  <!-- C [4,5] -->
  <rect x="230" y="138" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="60" y="155" text-anchor="end" font-size="11.5" fill="#446688" font-weight="bold">C [4,5]</text>
  <text x="276" y="155" font-size="11" fill="#446688">右端=5</text>

  <!-- D [6,7] -->
  <rect x="310" y="172" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="60" y="189" text-anchor="end" font-size="11.5" fill="#446688" font-weight="bold">D [6,7]</text>
  <text x="356" y="189" font-size="11" fill="#446688">右端=7</text>

  <!-- number line -->
  <line x1="70" y1="214" x2="478" y2="214" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 478 214 L 470 210 L 470 218 Z" fill="#888" filter="url(#rough2)"/>
  <text x="486" y="218" font-size="10.5" fill="#888">x</text>
  <!-- ticks -->
  <g font-size="10.5" fill="#888" text-anchor="middle">
    <line x1="70" y1="210" x2="70" y2="220" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="70" y="234">0</text>
    <line x1="150" y1="210" x2="150" y2="220" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="150" y="234">2</text>
    <line x1="230" y1="210" x2="230" y2="220" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="230" y="234">4</text>
    <line x1="310" y1="210" x2="310" y2="220" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="310" y="234">6</text>
    <line x1="390" y1="210" x2="390" y2="220" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="390" y="234">8</text>
    <line x1="470" y1="210" x2="470" y2="220" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="470" y="234">10</text>
  </g>

  <!-- conclusion: correct (by end) -->
  <rect x="32" y="250" width="456" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="48" y="270" font-size="12" fill="#4a7a3a" font-weight="bold">✓ 按右端点排：B(3) → C(5) → D(7)，右端递增互不重叠</text>
  <text x="48" y="287" font-size="11" fill="#4a7a3a">保留 3 个区间；A 右端=10 最晚，被跳过</text>

  <!-- conclusion: wrong (by start, pick long) -->
  <rect x="32" y="304" width="456" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="48" y="324" font-size="12" fill="#b85450" font-weight="bold">✗ 若先选 A[1,10]：右端=10，挡住 B / C / D</text>
  <text x="48" y="341" font-size="11" fill="#b85450">只剩 1 个区间 → 这就是不能按左端点贪心的原因</text>
</svg>
