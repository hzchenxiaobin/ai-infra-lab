<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="920" height="560" fill="#fafafa"/>

  <text x="460" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例 2 走查：最优路径 下→右→右→下，2 次转向，总代价 20</text>
  <text x="460" y="60" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">grid = [[4,1,9],[3,2,5],[4,8,6]]，k = 2</text>

  <!-- grid 3x3, cell 82, origin (70,90) -->
  <g filter="url(#rough2)">
    <!-- path cells: (0,0),(1,0),(1,1),(1,2),(2,2) green; others dim -->
    <rect x="70" y="90" width="82" height="82" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="152" y="90" width="82" height="82" fill="#f0ede4" stroke="#cccccc" stroke-width="1.2"/>
    <rect x="234" y="90" width="82" height="82" fill="#f0ede4" stroke="#cccccc" stroke-width="1.2"/>
    <rect x="70" y="172" width="82" height="82" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="152" y="172" width="82" height="82" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="234" y="172" width="82" height="82" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="70" y="254" width="82" height="82" fill="#f0ede4" stroke="#cccccc" stroke-width="1.2"/>
    <rect x="152" y="254" width="82" height="82" fill="#f0ede4" stroke="#cccccc" stroke-width="1.2"/>
    <rect x="234" y="254" width="82" height="82" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>

  <!-- coordinates -->
  <g font-size="9" fill="#999999">
    <text x="76" y="104" filter="url(#rough2)">(0,0)</text>
    <text x="158" y="104" filter="url(#rough2)">(0,1)</text>
    <text x="240" y="104" filter="url(#rough2)">(0,2)</text>
    <text x="76" y="186" filter="url(#rough2)">(1,0)</text>
    <text x="158" y="186" filter="url(#rough2)">(1,1)</text>
    <text x="240" y="186" filter="url(#rough2)">(1,2)</text>
    <text x="76" y="268" filter="url(#rough2)">(2,0)</text>
    <text x="158" y="268" filter="url(#rough2)">(2,1)</text>
    <text x="240" y="268" filter="url(#rough2)">(2,2)</text>
  </g>

  <!-- values -->
  <g font-size="22" font-weight="bold">
    <text x="111" y="140" text-anchor="middle" fill="#2e5e2e" filter="url(#rough2)">4</text>
    <text x="193" y="140" text-anchor="middle" fill="#888888" filter="url(#rough2)">1</text>
    <text x="275" y="140" text-anchor="middle" fill="#888888" filter="url(#rough2)">9</text>
    <text x="111" y="222" text-anchor="middle" fill="#2e5e2e" filter="url(#rough2)">3</text>
    <text x="193" y="222" text-anchor="middle" fill="#2e5e2e" filter="url(#rough2)">2</text>
    <text x="275" y="222" text-anchor="middle" fill="#2e5e2e" filter="url(#rough2)">5</text>
    <text x="111" y="304" text-anchor="middle" fill="#888888" filter="url(#rough2)">4</text>
    <text x="193" y="304" text-anchor="middle" fill="#888888" filter="url(#rough2)">8</text>
    <text x="275" y="304" text-anchor="middle" fill="#2e5e2e" filter="url(#rough2)">6</text>
  </g>

  <!-- turn markers inside cells -->
  <text x="111" y="246" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">转向 1</text>
  <text x="275" y="246" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">转向 2</text>

  <!-- start / end -->
  <text x="111" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">起点</text>
  <text x="275" y="356" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">终点</text>

  <!-- path arrows -->
  <path d="M 111 136 L 111 202" stroke="#4a7a3a" stroke-width="2.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="126" y="176" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">下</text>
  <path d="M 120 213 L 182 213" stroke="#4a7a3a" stroke-width="2.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="148" y="204" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">右</text>
  <path d="M 202 213 L 264 213" stroke="#4a7a3a" stroke-width="2.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="230" y="204" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">右</text>
  <path d="M 275 222 L 275 288" stroke="#4a7a3a" stroke-width="2.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="290" y="262" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">下</text>

  <!-- legend -->
  <text x="70" y="396" font-size="11" fill="#888888" filter="url(#rough2)">绿色格子 = 最优路径经过的格子；绿色箭头 = 移动方向；橙色 = 方向发生变化（计一次转向）</text>

  <!-- right panel: step table -->
  <g filter="url(#rough2)">
    <rect x="430" y="90" width="460" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="660" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6a" filter="url(#rough2)">逐步演算（累计代价 / 转向数 t）</text>

  <g font-size="13" fill="#333333">
    <text x="450" y="156" filter="url(#rough2)">起点 (0,0)：代价 4，t = 0</text>
    <text x="450" y="188" filter="url(#rough2)">① (1,0) 下：4 + 3 = 7，t = 0（首步，尚无上一次方向）</text>
    <text x="450" y="220" filter="url(#rough2)">② (1,1) 右：7 + 2 = 9，t = 1（下→右，转向 1）</text>
    <text x="450" y="252" filter="url(#rough2)">③ (1,2) 右：9 + 5 = 14，t = 1（直行）</text>
    <text x="450" y="284" filter="url(#rough2)">④ (2,2) 下：14 + 6 = 20，t = 2（右→下，转向 2）</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="430" y="308" width="460" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="660" y="333" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e2e" filter="url(#rough2)">转向数 2 ≤ k = 2 ✓，答案 = 20</text>

  <!-- comparison -->
  <g filter="url(#rough2)">
    <rect x="430" y="368" width="460" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="450" y="392" font-size="12" fill="#7a5415" filter="url(#rough2)">对比：路径 右→右→下→下 的代价为 4+1+9+5+6 = 25</text>
  <text x="450" y="414" font-size="12" fill="#7a5415" filter="url(#rough2)">虽然只转 1 次弯，但绕进了贵格子 9，总代价反而更高</text>

  <!-- bottom note -->
  <g filter="url(#rough2)">
    <rect x="70" y="460" width="820" height="66" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="88" y="488" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">走查要点</text>
  <text x="88" y="510" font-size="11" fill="#444444" filter="url(#rough2)">累计代价把起点 4 与终点 6 都计入；首步「下」不算转向（起点没有上一次方向），之后每次方向变化才 +1</text>
</svg>
