<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">象的最少步数：颜色不变量 + 三类判定</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">每步 (r,c) → (r±d, c±d)，r+c 奇偶不变 ⟹ 永远待在同色格</text>

  <text x="40" y="72" font-size="12" fill="#333" font-weight="bold">示例 2：S=(4,2) → M=(3,1) → T=(1,3)，2 步</text>

  <g filter="url(#rough2)">
    <rect x="40" y="80" width="224" height="224" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="80" width="28" height="28" fill="#e8f0fe"/>
    <rect x="96" y="80" width="28" height="28" fill="#e8f0fe"/>
    <rect x="152" y="80" width="28" height="28" fill="#e8f0fe"/>
    <rect x="208" y="80" width="28" height="28" fill="#e8f0fe"/>
    <rect x="68" y="108" width="28" height="28" fill="#e8f0fe"/>
    <rect x="124" y="108" width="28" height="28" fill="#e8f0fe"/>
    <rect x="180" y="108" width="28" height="28" fill="#e8f0fe"/>
    <rect x="236" y="108" width="28" height="28" fill="#e8f0fe"/>
    <rect x="40" y="136" width="28" height="28" fill="#e8f0fe"/>
    <rect x="96" y="136" width="28" height="28" fill="#e8f0fe"/>
    <rect x="152" y="136" width="28" height="28" fill="#e8f0fe"/>
    <rect x="208" y="136" width="28" height="28" fill="#e8f0fe"/>
    <rect x="68" y="164" width="28" height="28" fill="#e8f0fe"/>
    <rect x="124" y="164" width="28" height="28" fill="#e8f0fe"/>
    <rect x="180" y="164" width="28" height="28" fill="#e8f0fe"/>
    <rect x="236" y="164" width="28" height="28" fill="#e8f0fe"/>
    <rect x="40" y="192" width="28" height="28" fill="#e8f0fe"/>
    <rect x="96" y="192" width="28" height="28" fill="#e8f0fe"/>
    <rect x="152" y="192" width="28" height="28" fill="#e8f0fe"/>
    <rect x="208" y="192" width="28" height="28" fill="#e8f0fe"/>
    <rect x="68" y="220" width="28" height="28" fill="#e8f0fe"/>
    <rect x="124" y="220" width="28" height="28" fill="#e8f0fe"/>
    <rect x="180" y="220" width="28" height="28" fill="#e8f0fe"/>
    <rect x="236" y="220" width="28" height="28" fill="#e8f0fe"/>
    <rect x="40" y="248" width="28" height="28" fill="#e8f0fe"/>
    <rect x="96" y="248" width="28" height="28" fill="#e8f0fe"/>
    <rect x="152" y="248" width="28" height="28" fill="#e8f0fe"/>
    <rect x="208" y="248" width="28" height="28" fill="#e8f0fe"/>
    <rect x="68" y="276" width="28" height="28" fill="#e8f0fe"/>
    <rect x="124" y="276" width="28" height="28" fill="#e8f0fe"/>
    <rect x="180" y="276" width="28" height="28" fill="#e8f0fe"/>
    <rect x="236" y="276" width="28" height="28" fill="#e8f0fe"/>
  </g>

  <rect x="68" y="136" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="82" y="155" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">S</text>
  <rect x="40" y="108" width="28" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="54" y="127" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">M</text>
  <rect x="96" y="80" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="99" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">T</text>

  <path d="M 66 140 L 52 128" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 56 112 L 96 92" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <text x="118" y="148" font-size="10" fill="#446688">S(4,2)</text>
  <text x="18" y="102" font-size="10" fill="#d6a040">M(3,1)</text>
  <text x="128" y="78" font-size="10" fill="#4a7a3a">T(1,3)</text>

  <rect x="40" y="318" width="224" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="152" y="333" text-anchor="middle" font-size="10.5" fill="#3a4a66">蓝色格：(r+c) 为偶数（与 S 同色）</text>

  <rect x="296" y="80" width="244" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="418" y="102" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">同一对角线 → 1 步</text>
  <text x="418" y="122" text-anchor="middle" font-size="10.5" fill="#555">|Δr| = |Δc|，一步直达</text>

  <rect x="296" y="152" width="244" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="418" y="174" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">同色、不同对角线 → 2 步</text>
  <text x="418" y="194" text-anchor="middle" font-size="10.5" fill="#555">经中转点 M（见构造图）</text>

  <rect x="296" y="224" width="244" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="418" y="246" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">异色 → -1（永不可达）</text>
  <text x="418" y="266" text-anchor="middle" font-size="10.5" fill="#555">r+c 奇偶不同，颜色不变量封锁</text>

  <rect x="296" y="296" width="244" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="418" y="314" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold">不变量：每步 r±d, c±d</text>
  <text x="418" y="330" text-anchor="middle" font-size="10.5" fill="#555">⟹ (r+c) 的奇偶性永不改变</text>

  <text x="152" y="386" text-anchor="middle" font-size="10" fill="#999">判定顺序：同格 0 → 同对角线 1 → 同色 2 → 否则 -1</text>
</svg>
