<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="350" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">核心观察：遥远 ⟺ 前缀值落在 t = P[j] − goal 的两侧</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">|sum − goal| ≥ k 拆成数轴上两条闭射线；nums 含负数 ⟹ 前缀和不单调 ⟹ 双指针失效</text>

  <!-- 三个区域的圆角矩形 -->
  <g filter="url(#rough2)">
    <rect x="60" y="120" width="180" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="240" y="120" width="120" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="360" y="120" width="160" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="150" y="140" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">P[i′] ≤ t−k</text>
  <text x="150" y="158" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">sum ≥ goal+k（和偏大）✓ 遥远</text>
  <text x="300" y="140" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">t−k &lt; P &lt; t+k</text>
  <text x="300" y="158" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">near：不遥远 ✗</text>
  <text x="440" y="140" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">P[i′] ≥ t+k</text>
  <text x="440" y="158" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">sum ≤ goal−k（和偏小）✓ 遥远</text>

  <!-- 数轴 -->
  <g filter="url(#rough2)">
    <line x1="52" y1="200" x2="516" y2="200" stroke="#666" stroke-width="1.6" marker-end="url(#arr)"/>
  </g>
  <text x="62" y="192" font-size="10" fill="#666" filter="url(#rough2)">前缀值轴 P →</text>

  <g filter="url(#rough2)" stroke="#446688" stroke-width="2">
    <line x1="240" y1="186" x2="240" y2="212"/>
    <line x1="300" y1="186" x2="300" y2="212"/>
    <line x1="360" y1="186" x2="360" y2="212"/>
  </g>
  <text x="240" y="228" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">t−k</text>
  <text x="300" y="228" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">t</text>
  <text x="360" y="228" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">t+k</text>
  <text x="300" y="244" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">（目标前缀值：sum = goal 时 P[i′] 应落的位置）</text>

  <!-- 结论框 -->
  <rect x="60" y="262" width="440" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="278" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a4a66" filter="url(#rough2)">等价变形：|P[j] − P[i′] − goal| ≥ k ⟺ P[i′] ≤ t−k 或 P[i′] ≥ t+k</text>
  <text x="280" y="293" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">「i′ &lt; j」+「值域范围」同时约束 ⟹ 离散化 + 树状数组（在线二维计数）</text>

  <rect x="60" y="308" width="440" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="280" y="327" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6a1a" filter="url(#rough2)">k = 0：两射线覆盖全轴 ⟹ 所有子数组都遥远，答案 n(n+1)/2（k ≥ 1 时两射线不交，可直接相加）</text>
</svg>
