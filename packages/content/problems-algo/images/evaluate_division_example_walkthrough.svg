<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：a/b=2, b/c=3 的五次查询</text>

  <!-- ===== Step 1: union(a,b,2) ===== -->
  <text x="30" y="56" font-size="12" fill="#446688" font-weight="bold">① union(a, b, 2.0)：parent[a]=b, weight[a]=2.0</text>
  <ellipse cx="80" cy="92" rx="22" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="80" y="98" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">a</text>
  <ellipse cx="200" cy="92" rx="22" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="98" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">b</text>
  <path d="M 102 92 L 178 92" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="84" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">w=2.0</text>

  <!-- ===== Step 2: union(b,c,3) ===== -->
  <text x="30" y="138" font-size="12" fill="#4a7a3a" font-weight="bold">② union(b, c, 3.0)：parent[b]=c, weight[b]=3.0</text>
  <ellipse cx="80" cy="174" rx="22" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="80" y="180" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">a</text>
  <ellipse cx="200" cy="174" rx="22" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="180" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">b</text>
  <ellipse cx="320" cy="174" rx="22" ry="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="180" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">c</text>
  <path d="M 102 174 L 178 174" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="166" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">w=2.0</text>
  <path d="M 222 174 L 298 174" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="260" y="166" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">w=3.0</text>

  <line x1="20" y1="208" x2="540" y2="208" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Queries table ===== -->
  <text x="30" y="232" font-size="12" fill="#d6a040" font-weight="bold">③ 依次回答查询：</text>

  <!-- table header -->
  <rect x="30" y="244" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="70" y="262" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">查询</text>
  <rect x="110" y="244" width="280" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="250" y="262" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">计算过程</text>
  <rect x="390" y="244" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="450" y="262" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">结果</text>

  <!-- row 1: a/c -->
  <rect x="30" y="272" width="80" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="290" text-anchor="middle" font-size="11" fill="#333">a / c</text>
  <rect x="110" y="272" width="280" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="290" text-anchor="middle" font-size="10.5" fill="#555">find(a) 压缩：w[a]=2×3=6；同根 c</text>
  <rect x="390" y="272" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="450" y="290" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">6.0 ✓</text>

  <!-- row 2: b/a -->
  <rect x="30" y="300" width="80" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="318" text-anchor="middle" font-size="11" fill="#333">b / a</text>
  <rect x="110" y="300" width="280" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="318" text-anchor="middle" font-size="10.5" fill="#555">w[b]/w[a] = 3.0 / 6.0</text>
  <rect x="390" y="300" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="450" y="318" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0.5 ✓</text>

  <!-- row 3: a/e -->
  <rect x="30" y="328" width="80" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="346" text-anchor="middle" font-size="11" fill="#333">a / e</text>
  <rect x="110" y="328" width="280" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="346" text-anchor="middle" font-size="10.5" fill="#555">e 不在 parent 表中（未知变量）</text>
  <rect x="390" y="328" width="120" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="450" y="346" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">-1.0</text>

  <!-- row 4: a/a -->
  <rect x="30" y="356" width="80" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="374" text-anchor="middle" font-size="11" fill="#333">a / a</text>
  <rect x="110" y="356" width="280" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="374" text-anchor="middle" font-size="10.5" fill="#555">同根：w[a]/w[a] = 6.0/6.0</text>
  <rect x="390" y="356" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="450" y="374" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1.0 ✓</text>

  <!-- row 5: x/x -->
  <rect x="30" y="384" width="80" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="402" text-anchor="middle" font-size="11" fill="#333">x / x</text>
  <rect x="110" y="384" width="280" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="402" text-anchor="middle" font-size="10.5" fill="#555">x 从未出现在 equations 中</text>
  <rect x="390" y="384" width="120" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="450" y="402" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">-1.0</text>

  <text x="280" y="430" text-anchor="middle" font-size="11" fill="#888">最终输出：[6.0, 0.5, -1.0, 1.0, -1.0]</text>
</svg>
