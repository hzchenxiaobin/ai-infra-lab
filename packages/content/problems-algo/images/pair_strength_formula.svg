<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">强度 = (a·b) / gcd(a,b)² = (a/g)·(b/g)</text>

  <!-- two numbers a, b -->
  <g filter="url(#rough2)">
    <rect x="60" y="70" width="80" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <text x="100" y="102" text-anchor="middle" font-size="20" fill="#446688">a</text>
    <rect x="200" y="70" width="80" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <text x="240" y="102" text-anchor="middle" font-size="20" fill="#446688">b</text>
  </g>
  <text x="170" y="102" text-anchor="middle" font-size="14" fill="#666" filter="url(#rough2)">选一对</text>

  <!-- factor out g -->
  <text x="270" y="150" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">令 g = gcd(a, b)，分解出公共因子</text>
  <g filter="url(#rough2)">
    <rect x="60" y="170" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="90" y="192" text-anchor="middle" font-size="13" fill="#d6a040">g</text>
    <text x="135" y="192" text-anchor="middle" font-size="14" fill="#333">×</text>
    <rect x="155" y="170" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="185" y="192" text-anchor="middle" font-size="13" fill="#4a7a3a">u</text>
    <text x="235" y="178" text-anchor="middle" font-size="9" fill="#888">a = g·u</text>

    <text x="270" y="192" text-anchor="middle" font-size="14" fill="#333">,</text>

    <rect x="290" y="170" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="320" y="192" text-anchor="middle" font-size="13" fill="#d6a040">g</text>
    <text x="365" y="192" text-anchor="middle" font-size="14" fill="#333">×</text>
    <rect x="385" y="170" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="415" y="192" text-anchor="middle" font-size="13" fill="#4a7a3a">v</text>
    <text x="465" y="178" text-anchor="middle" font-size="9" fill="#888">b = g·v</text>
  </g>
  <text x="270" y="226" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">u, v 互质（gcd(u,v) = 1）</text>

  <!-- formula collapse -->
  <path d="M100 124 L90 168" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M240 124 L320 168" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- strength = u*v, g cancels -->
  <rect x="120" y="250" width="300" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="278" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">强度 = (g·u)(g·v) / g² = u · v</text>
  <text x="270" y="299" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">公共因子 g 被约掉，只看互质的“核”</text>

  <!-- example -->
  <text x="270" y="335" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">例：6, 8 → g=2, u=3, v=4 → 强度 12</text>
</svg>
