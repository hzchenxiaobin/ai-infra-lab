<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="r6"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="61"/><feDisplacementMap in="SourceGraphic" scale="1.4"/></filter>
  </defs>
  <rect width="620" height="360" fill="#fafafa"/>
  <text x="310" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r6)">示例 1：mat 3×4，最大 k=2，面积 4</text>

  <!-- grid 3 rows x 4 cols, cell 44px -->
  <g filter="url(#r6)" font-size="13" font-family="monospace">
    <!-- row0: 1 1 1 0 -->
    <rect x="60" y="60" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="104" y="60" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="148" y="60" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="192" y="60" width="44" height="44" fill="#f5f5f5" stroke="#bbb"/>
    <text x="82" y="88" text-anchor="middle" fill="#333">1</text>
    <text x="126" y="88" text-anchor="middle" fill="#333">1</text>
    <text x="170" y="88" text-anchor="middle" fill="#333">1</text>
    <text x="214" y="88" text-anchor="middle" fill="#888">0</text>
    <!-- row1: 1 1 1 1 -->
    <rect x="60" y="104" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="104" y="104" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="148" y="104" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="192" y="104" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="82" y="132" text-anchor="middle" fill="#333">1</text>
    <text x="126" y="132" text-anchor="middle" fill="#333">1</text>
    <text x="170" y="132" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <text x="214" y="132" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <!-- row2: 0 0 1 1 -->
    <rect x="60" y="148" width="44" height="44" fill="#f5f5f5" stroke="#bbb"/>
    <rect x="104" y="148" width="44" height="44" fill="#f5f5f5" stroke="#bbb"/>
    <rect x="148" y="148" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="192" y="148" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="82" y="176" text-anchor="middle" fill="#888">0</text>
    <text x="126" y="176" text-anchor="middle" fill="#888">0</text>
    <text x="170" y="176" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <text x="214" y="176" text-anchor="middle" fill="#333" font-weight="bold">1</text>

    <!-- highlight square1 (0,0) 2x2 -->
    <rect x="60" y="60" width="88" height="88" fill="none" stroke="#b85450" stroke-width="2.5" rx="3"/>
    <text x="48" y="58" font-size="10" fill="#b85450">方块①</text>
    <!-- highlight square2 (1,2) 2x2 -->
    <rect x="148" y="104" width="88" height="88" fill="none" stroke="#d6a040" stroke-width="2.5" rx="3"/>
    <text x="150" y="210" font-size="10" fill="#d6a040">方块② (1,2)</text>
  </g>

  <!-- explanation -->
  <rect x="290" y="60" width="300" height="140" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#r6)"/>
  <text x="306" y="84" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#r6)">check(k=2) 判定过程</text>
  <text x="306" y="104" font-size="10" fill="#333" filter="url(#r6)">② 前缀和求 ok[r][c]：2×2 全 1 的左上角</text>
  <text x="306" y="120" font-size="10" fill="#333" filter="url(#r6)">　ok(0,0)✓ ok(0,1)✗(含0) ok(0,2)✗</text>
  <text x="306" y="136" font-size="10" fill="#333" filter="url(#r6)">　ok(1,0)✗ ok(1,1)✗ ok(1,2)✓</text>
  <text x="306" y="156" font-size="10" fill="#333" filter="url(#r6)">③ 列分割 j=1：方块①列⊆[0,1]?</text>
  <text x="306" y="172" font-size="10" fill="#4a7a3a" filter="url(#r6)">　prefC[0]=✓(方块①在列0,1)</text>
  <text x="306" y="188" font-size="10" fill="#4a7a3a" filter="url(#r6)">　sufC[2]=✓(方块②在列2,3)</text>

  <rect x="290" y="210" width="300" height="120" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#r6)"/>
  <text x="306" y="232" font-size="12" font-weight="bold" fill="#b85450" filter="url(#r6)">结论</text>
  <text x="306" y="252" font-size="11" fill="#333" filter="url(#r6)">列分割 j=1 处两侧各有一个 k=2 方块</text>
  <text x="306" y="270" font-size="11" fill="#333" filter="url(#r6)">→ check(2)=true</text>
  <text x="306" y="290" font-size="11" fill="#333" filter="url(#r6)">k=3 不可行（3 行不够放 2 个 3×3）</text>
  <text x="306" y="310" font-size="11" fill="#b85450" font-weight="bold" filter="url(#r6)">最大 k=2，面积 = 2² = 4 ✓</text>
</svg>
