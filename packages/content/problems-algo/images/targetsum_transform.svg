<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">转化：± 符号选择 ⇔ 选子集凑和</text>

  <!-- 原表达式 -->
  <text x="40" y="62" font-size="11.5" fill="#888">原问题：给每个数添 + 或 −</text>
  <rect x="40" y="72" width="500" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="95" text-anchor="middle" font-size="13" fill="#333">+1  +1  −1  +1  +1  =  3</text>

  <path d="M 290 110 L 290 128" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- P / N 分组 -->
  <rect x="40" y="132" width="240" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="160" y="151" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">P = 取 + 的元素 {1,1,1,1}</text>
  <text x="160" y="168" text-anchor="middle" font-size="11" fill="#333">sum(P) = 4</text>

  <rect x="300" y="132" width="240" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="420" y="151" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">N = 取 − 的元素 {1}</text>
  <text x="420" y="168" text-anchor="middle" font-size="11" fill="#333">sum(N) = 1</text>

  <path d="M 290 178 L 290 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 两个方程 -->
  <rect x="70" y="200" width="440" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290" y="221" text-anchor="middle" font-size="12.5" fill="#333">①  sum(P) − sum(N) = target</text>

  <rect x="70" y="238" width="440" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290" y="259" text-anchor="middle" font-size="12.5" fill="#333">②  sum(P) + sum(N) = S</text>

  <path d="M 290 272 L 290 290" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="285" font-size="10" fill="#888">①+② 消去 N</text>

  <!-- 推导结果 -->
  <rect x="60" y="294" width="460" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="320" text-anchor="middle" font-size="13.5" fill="#b85450" font-weight="bold">sum(P) = (S + target) / 2 = pos</text>

  <path d="M 290 336 L 290 354" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 背包计数 -->
  <rect x="50" y="358" width="480" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="378" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">0-1 背包计数</text>
  <text x="290" y="394" text-anchor="middle" font-size="11.5" fill="#333">选若干元素，和恰好 = pos 的方案数</text>

  <!-- 剪枝备注 -->
  <rect x="50" y="408" width="480" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="290" y="425" text-anchor="middle" font-size="10.5" fill="#555">剪枝：|target| &gt; S 或 (S+target) 为奇数 → 直接 0</text>
</svg>
