<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 510" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="660" height="510" fill="#fafafa"/>

  <text x="330" y="28" text-anchor="middle" font-size="16" fill="#444" font-weight="bold">例题：739 每日温度 — 递减栈找右侧更高</text>
  <text x="330" y="48" text-anchor="middle" font-size="11" fill="#888">T = [73, 74, 75, 71, 69, 72, 76, 73]，存下标，出栈时 answer[top] = i − top</text>

  <!-- temperature array header -->
  <g font-size="10" fill="#888">
    <text x="60" y="76" filter="url(#rough2)">下标</text>
    <text x="60" y="100" filter="url(#rough2)">温度</text>
  </g>
  <g font-size="11" fill="#333">
    <rect x="90" y="64" width="40" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="110" y="80" text-anchor="middle" filter="url(#rough2)">0</text>
    <rect x="134" y="64" width="40" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="154" y="80" text-anchor="middle" filter="url(#rough2)">1</text>
    <rect x="178" y="64" width="40" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="198" y="80" text-anchor="middle" filter="url(#rough2)">2</text>
    <rect x="222" y="64" width="40" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="242" y="80" text-anchor="middle" filter="url(#rough2)">3</text>
    <rect x="266" y="64" width="40" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="286" y="80" text-anchor="middle" filter="url(#rough2)">4</text>
    <rect x="310" y="64" width="40" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="330" y="80" text-anchor="middle" filter="url(#rough2)">5</text>
    <rect x="354" y="64" width="40" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="374" y="80" text-anchor="middle" filter="url(#rough2)">6</text>
    <rect x="398" y="64" width="40" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="418" y="80" text-anchor="middle" filter="url(#rough2)">7</text>

    <rect x="90" y="88" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="110" y="104" text-anchor="middle" filter="url(#rough2)">73</text>
    <rect x="134" y="88" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="154" y="104" text-anchor="middle" filter="url(#rough2)">74</text>
    <rect x="178" y="88" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="198" y="104" text-anchor="middle" filter="url(#rough2)">75</text>
    <rect x="222" y="88" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="242" y="104" text-anchor="middle" filter="url(#rough2)">71</text>
    <rect x="266" y="88" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="286" y="104" text-anchor="middle" filter="url(#rough2)">69</text>
    <rect x="310" y="88" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="330" y="104" text-anchor="middle" filter="url(#rough2)">72</text>
    <rect x="354" y="88" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="374" y="104" text-anchor="middle" filter="url(#rough2)">76</text>
    <rect x="398" y="88" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="418" y="104" text-anchor="middle" filter="url(#rough2)">73</text>
  </g>

  <text x="450" y="96" font-size="10" fill="#888" filter="url(#rough2)">answer =</text>
  <g font-size="11" fill="#333">
    <rect x="490" y="88" width="32" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="506" y="104" text-anchor="middle" filter="url(#rough2)">1</text>
    <rect x="524" y="88" width="32" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="540" y="104" text-anchor="middle" filter="url(#rough2)">1</text>
    <rect x="558" y="88" width="32" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="574" y="104" text-anchor="middle" filter="url(#rough2)">4</text>
    <rect x="592" y="88" width="32" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="608" y="104" text-anchor="middle" filter="url(#rough2)">2</text>
    <rect x="490" y="112" width="32" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="506" y="128" text-anchor="middle" filter="url(#rough2)">1</text>
    <rect x="524" y="112" width="32" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="540" y="128" text-anchor="middle" filter="url(#rough2)">1</text>
    <rect x="558" y="112" width="32" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="574" y="128" text-anchor="middle" filter="url(#rough2)">0</text>
    <rect x="592" y="112" width="32" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="608" y="128" text-anchor="middle" filter="url(#rough2)">0</text>
  </g>

  <!-- Step rows -->
  <text x="30" y="156" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">逐步演算（栈存下标，栈底→顶温度递减）：</text>

  <!-- step table -->
  <g font-size="10.5" fill="#333">
    <rect x="20" y="168" width="620" height="22" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="34" y="183" font-weight="bold" fill="#888" filter="url(#rough2)">步骤</text>
    <text x="90" y="183" font-weight="bold" fill="#888" filter="url(#rough2)">cur（i, T）</text>
    <text x="220" y="183" font-weight="bold" fill="#888" filter="url(#rough2)">动作</text>
    <text x="430" y="183" font-weight="bold" fill="#888" filter="url(#rough2)">栈（下标）</text>
    <text x="560" y="183" font-weight="bold" fill="#888" filter="url(#rough2)">answer 变化</text>

    <!-- helper to render rows -->
    <!-- step1 -->
    <text x="34" y="206" filter="url(#rough2)">1</text>
    <text x="90" y="206" filter="url(#rough2)">i=0, 73</text>
    <text x="220" y="206" fill="#446688" filter="url(#rough2)">栈空 → 入</text>
    <text x="430" y="206" fill="#446688" filter="url(#rough2)">[0]</text>
    <text x="560" y="206" fill="#888" filter="url(#rough2)">—</text>

    <text x="34" y="226" filter="url(#rough2)">2</text>
    <text x="90" y="226" filter="url(#rough2)">i=1, 74</text>
    <text x="220" y="226" fill="#4a7a3a" filter="url(#rough2)">74&gt;73 → pop 0</text>
    <text x="430" y="226" fill="#4a7a3a" filter="url(#rough2)">[1]</text>
    <text x="560" y="226" fill="#b85450" filter="url(#rough2)">ans[0]=1−0=1</text>

    <text x="34" y="246" filter="url(#rough2)">3</text>
    <text x="90" y="246" filter="url(#rough2)">i=2, 75</text>
    <text x="220" y="246" fill="#4a7a3a" filter="url(#rough2)">75&gt;74 → pop 1</text>
    <text x="430" y="246" fill="#4a7a3a" filter="url(#rough2)">[2]</text>
    <text x="560" y="246" fill="#b85450" filter="url(#rough2)">ans[1]=2−1=1</text>

    <text x="34" y="266" filter="url(#rough2)">4</text>
    <text x="90" y="266" filter="url(#rough2)">i=3, 71</text>
    <text x="220" y="266" fill="#446688" filter="url(#rough2)">71&lt;75 → 入</text>
    <text x="430" y="266" fill="#446688" filter="url(#rough2)">[2,3]</text>
    <text x="560" y="266" fill="#888" filter="url(#rough2)">—</text>

    <text x="34" y="286" filter="url(#rough2)">5</text>
    <text x="90" y="286" filter="url(#rough2)">i=4, 69</text>
    <text x="220" y="286" fill="#446688" filter="url(#rough2)">69&lt;71 → 入</text>
    <text x="430" y="286" fill="#446688" filter="url(#rough2)">[2,3,4]</text>
    <text x="560" y="286" fill="#888" filter="url(#rough2)">—</text>

    <text x="34" y="306" filter="url(#rough2)">6</text>
    <text x="90" y="306" filter="url(#rough2)">i=5, 72</text>
    <text x="220" y="306" fill="#4a7a3a" filter="url(#rough2)">72&gt;69 → pop 4</text>
    <text x="430" y="306" fill="#4a7a3a" filter="url(#rough2)">[2,3,5]</text>
    <text x="560" y="306" fill="#b85450" filter="url(#rough2)">ans[4]=5−4=1</text>

    <text x="34" y="326" filter="url(#rough2)">7</text>
    <text x="90" y="326" filter="url(#rough2)">（续）</text>
    <text x="220" y="326" fill="#4a7a3a" filter="url(#rough2)">72&gt;71 → pop 3</text>
    <text x="430" y="326" fill="#4a7a3a" filter="url(#rough2)">[2,5]</text>
    <text x="560" y="326" fill="#b85450" filter="url(#rough2)">ans[3]=5−3=2</text>

    <text x="34" y="346" filter="url(#rough2)">8</text>
    <text x="90" y="346" filter="url(#rough2)">i=6, 76</text>
    <text x="220" y="346" fill="#4a7a3a" filter="url(#rough2)">76&gt;72 → pop 5</text>
    <text x="430" y="346" fill="#4a7a3a" filter="url(#rough2)">[2,6]</text>
    <text x="560" y="346" fill="#b85450" filter="url(#rough2)">ans[5]=6−5=1</text>

    <text x="34" y="366" filter="url(#rough2)">9</text>
    <text x="90" y="366" filter="url(#rough2)">（续）</text>
    <text x="220" y="366" fill="#4a7a3a" filter="url(#rough2)">76&gt;75 → pop 2</text>
    <text x="430" y="366" fill="#4a7a3a" filter="url(#rough2)">[6]</text>
    <text x="560" y="366" fill="#b85450" filter="url(#rough2)">ans[2]=6−2=4</text>

    <text x="34" y="386" filter="url(#rough2)">10</text>
    <text x="90" y="386" filter="url(#rough2)">i=7, 73</text>
    <text x="220" y="386" fill="#446688" filter="url(#rough2)">73&lt;76 → 入</text>
    <text x="430" y="386" fill="#446688" filter="url(#rough2)">[6,7]</text>
    <text x="560" y="386" fill="#888" filter="url(#rough2)">—</text>

    <text x="34" y="406" filter="url(#rough2)">末</text>
    <text x="90" y="406" filter="url(#rough2)">遍历结束</text>
    <text x="220" y="406" fill="#888" filter="url(#rough2)">残留 [6,7] 无更高</text>
    <text x="430" y="406" fill="#888" filter="url(#rough2)">[]</text>
    <text x="560" y="406" fill="#888" filter="url(#rough2)">ans[6]=ans[7]=0</text>
  </g>

  <!-- bottom insight -->
  <rect x="20" y="430" width="620" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="34" y="450" font-size="10.5" fill="#444" filter="url(#rough2)">💡 关键瞬间：i=6（76°）一次性连弹 5、2 两个下标——它们在栈里「等」了好几步，</text>
  <text x="34" y="466" font-size="10.5" fill="#444" filter="url(#rough2)">   直到这个更大的 76 出现才被结算。这正是单调栈的本质：栈里留的都是「还没等到答案」的。</text>
  <text x="34" y="484" font-size="10.5" fill="#b85450" filter="url(#rough2)">⭐ 每个下标入栈 1 次、出栈 1 次，8 步遍历总共 8 次入 + 8 次出 = 16 次操作，均摊每元素 O(1)。</text>
</svg>
