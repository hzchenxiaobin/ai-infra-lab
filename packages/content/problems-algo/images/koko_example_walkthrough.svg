<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：piles = [3, 6, 7, 11]，h = 8，max = 11</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">在速度区间 [1, 11] 上二分，求最小可行 k</text>

  <!-- Table header -->
  <text x="36" y="82" font-size="12" fill="#444" font-weight="bold">步骤</text>
  <text x="90" y="82" font-size="12" fill="#444" font-weight="bold">lo</text>
  <text x="130" y="82" font-size="12" fill="#444" font-weight="bold">hi</text>
  <text x="168" y="82" font-size="12" fill="#444" font-weight="bold">mid</text>
  <text x="300" y="82" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">hours = Σ ⌈ pile / mid ⌉</text>
  <text x="430" y="82" font-size="12" fill="#444" font-weight="bold">判定</text>
  <text x="510" y="82" font-size="12" fill="#444" font-weight="bold">更新</text>

  <line x1="24" y1="90" x2="556" y2="90" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Step 1 -->
  <text x="36" y="112" font-size="11" fill="#333">1</text>
  <text x="90" y="112" font-size="11" fill="#333">1</text>
  <text x="130" y="112" font-size="11" fill="#333">11</text>
  <text x="168" y="112" font-size="11" fill="#333" font-weight="bold">6</text>
  <text x="300" y="112" text-anchor="middle" font-size="11" fill="#333">1 + 1 + 2 + 2 = <tspan font-weight="bold" fill="#4a7a3a">6</tspan></text>
  <text x="430" y="112" font-size="11" fill="#82b366">≤ 8 ✓</text>
  <text x="510" y="112" font-size="11" fill="#4a7a3a" font-weight="bold">ans=6, hi=5</text>

  <!-- Step 2 -->
  <text x="36" y="138" font-size="11" fill="#333">2</text>
  <text x="90" y="138" font-size="11" fill="#333">1</text>
  <text x="130" y="138" font-size="11" fill="#333">5</text>
  <text x="168" y="138" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="300" y="138" text-anchor="middle" font-size="11" fill="#333">1 + 2 + 3 + 4 = <tspan font-weight="bold" fill="#b85450">10</tspan></text>
  <text x="430" y="138" font-size="11" fill="#b85450">&gt; 8 ✗</text>
  <text x="510" y="138" font-size="11" fill="#b85450" font-weight="bold">lo=4</text>

  <!-- Step 3 -->
  <text x="36" y="164" font-size="11" fill="#333">3</text>
  <text x="90" y="164" font-size="11" fill="#333">4</text>
  <text x="130" y="164" font-size="11" fill="#333">5</text>
  <text x="168" y="164" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="300" y="164" text-anchor="middle" font-size="11" fill="#333">1 + 2 + 2 + 3 = <tspan font-weight="bold" fill="#4a7a3a">8</tspan></text>
  <text x="430" y="164" font-size="11" fill="#82b366">≤ 8 ✓</text>
  <text x="510" y="164" font-size="11" fill="#4a7a3a" font-weight="bold">ans=4, hi=3</text>

  <!-- Step 4 -->
  <text x="36" y="190" font-size="11" fill="#333">4</text>
  <text x="90" y="190" font-size="11" fill="#333">4</text>
  <text x="130" y="190" font-size="11" fill="#333">3</text>
  <text x="168" y="190" font-size="11" fill="#999">—</text>
  <text x="300" y="190" text-anchor="middle" font-size="11" fill="#999">lo &gt; hi，循环结束</text>
  <text x="430" y="190" font-size="11" fill="#999">—</text>
  <text x="510" y="190" font-size="11" fill="#d6a040" font-weight="bold">返回 ans</text>

  <!-- arrow pointing to result -->
  <path d="M 510 200 L 510 216" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- marker def -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <!-- interval narrowing visualization -->
  <text x="36" y="244" font-size="12" fill="#444" font-weight="bold">区间收缩：</text>

  <!-- step1 interval [1,11] -->
  <text x="36" y="268" font-size="10" fill="#888">①</text>
  <rect x="60" y="258" width="440" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <line x1="60" y1="256" x2="60" y2="276" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="250" text-anchor="middle" font-size="9" fill="#666">1</text>
  <line x1="500" y1="256" x2="500" y2="276" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="500" y="250" text-anchor="middle" font-size="9" fill="#666">11</text>
  <text x="260" y="270" text-anchor="middle" font-size="10" fill="#333">mid=6 → 可行 → 去左半找更小</text>

  <!-- step2 interval [1,5] -->
  <text x="36" y="296" font-size="10" fill="#888">②</text>
  <rect x="60" y="286" width="200" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <line x1="60" y1="284" x2="60" y2="304" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="280" text-anchor="middle" font-size="9" fill="#666">1</text>
  <line x1="260" y1="284" x2="260" y2="304" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="280" text-anchor="middle" font-size="9" fill="#666">5</text>
  <text x="160" y="298" text-anchor="middle" font-size="10" fill="#333">mid=3 → 太慢 → 去右半</text>

  <!-- step3 interval [4,5] -->
  <text x="36" y="324" font-size="10" fill="#888">③</text>
  <rect x="196" y="314" width="64" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <line x1="196" y1="312" x2="196" y2="332" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="196" y="308" text-anchor="middle" font-size="9" fill="#666">4</text>
  <line x1="260" y1="312" x2="260" y2="332" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="308" text-anchor="middle" font-size="9" fill="#666">5</text>
  <text x="228" y="326" text-anchor="middle" font-size="10" fill="#333">mid=4 → 可行 → hi=3</text>

  <!-- result box -->
  <rect x="60" y="352" width="460" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="374" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">答案 = 4（k=4 时恰好 8 小时吃完）</text>
  <text x="290" y="394" text-anchor="middle" font-size="11" fill="#888">每次验证 O(n)，二分 O(log max) 次 ⇒ 总 O(n log max)</text>

  <!-- legend -->
  <rect x="60" y="420" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="80" y="431" font-size="11" fill="#555">可行区间</text>
  <rect x="160" y="420" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="180" y="431" font-size="11" fill="#555">太慢区间</text>
  <rect x="260" y="420" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="280" y="431" font-size="11" fill="#555">初始区间</text>
</svg>
