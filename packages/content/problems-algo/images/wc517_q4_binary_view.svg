<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">二进制视角：×2 是补零，÷2 是去末位</text>

  <!-- v = 6 -->
  <text x="60" y="60" font-size="11.5" fill="#3a4a66" font-weight="bold">v = 6 = (110)₂</text>

  <rect x="60" y="70" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="78" y="90" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="96" y="70" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="114" y="90" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="132" y="70" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="150" y="90" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <text x="178" y="90" font-size="11" fill="#888">= 6</text>

  <!-- ops meaning -->
  <path d="M 210 85 L 250 85" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="254" y="62" width="280" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="394" y="80" text-anchor="middle" font-size="10.5" fill="#333">x → 2x：末尾补 0（110 → 1100）</text>
  <text x="394" y="98" text-anchor="middle" font-size="10.5" fill="#333">x → ⌊x/2⌋：去掉最后一位（110 → 11）</text>

  <!-- odd minus one -->
  <text x="60" y="140" font-size="11.5" fill="#b85450" font-weight="bold">先除后乘 = 奇数减一（第 II 版的新操作！）：3 → 1 → 2</text>

  <rect x="60" y="152" width="52" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="86" y="174" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">3</text>
  <text x="86" y="198" text-anchor="middle" font-size="9" fill="#888">(11)₂</text>

  <path d="M 112 164 L 148 164" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="130" y="157" text-anchor="middle" font-size="9.5" fill="#b85450">÷2</text>

  <rect x="150" y="152" width="52" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="176" y="174" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">1</text>
  <text x="176" y="198" text-anchor="middle" font-size="9" fill="#888">(1)₂</text>

  <path d="M 202 164 L 238 164" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="220" y="157" text-anchor="middle" font-size="9.5" fill="#b85450">×2</text>

  <rect x="240" y="152" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="266" y="174" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">2</text>
  <text x="266" y="198" text-anchor="middle" font-size="9" fill="#888">(10)₂</text>

  <rect x="310" y="152" width="224" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="422" y="170" text-anchor="middle" font-size="10" fill="#333">奇数 x：⌊x/2⌋×2 = x−1（末位 1 被丢掉）</text>
  <text x="422" y="188" text-anchor="middle" font-size="10" fill="#333">第 I 版（先乘后除）做不到这一点</text>

  <!-- reachable family -->
  <text x="60" y="232" font-size="11.5" fill="#3a4a66" font-weight="bold">可达集 = 去掉一个低位后缀，再补若干个 0：{(v &gt;&gt; p) &lt;&lt; q}</text>

  <text x="60" y="258" font-size="10.5" fill="#4a7a3a" font-weight="bold">核 6（p=0）：</text>
  <rect x="160" y="244" width="46" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="183" y="262" text-anchor="middle" font-size="10.5" fill="#333">6</text>
  <rect x="210" y="244" width="46" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="233" y="262" text-anchor="middle" font-size="10.5" fill="#333">12</text>
  <rect x="260" y="244" width="46" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="283" y="262" text-anchor="middle" font-size="10.5" fill="#333">24</text>
  <rect x="310" y="244" width="46" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="333" y="262" text-anchor="middle" font-size="10.5" fill="#333">48</text>
  <text x="362" y="262" font-size="10" fill="#888">×2、×4、×8…</text>

  <text x="60" y="292" font-size="10.5" fill="#446688" font-weight="bold">核 3（p=1）：</text>
  <rect x="160" y="278" width="46" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="183" y="296" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <rect x="210" y="278" width="46" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="233" y="296" text-anchor="middle" font-size="10.5" fill="#333">6</text>
  <rect x="260" y="278" width="46" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="283" y="296" text-anchor="middle" font-size="10.5" fill="#333">12</text>
  <rect x="310" y="278" width="46" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="333" y="296" text-anchor="middle" font-size="10.5" fill="#333">24</text>

  <text x="60" y="326" font-size="10.5" fill="#d6a040" font-weight="bold">核 1（p=2）：</text>
  <rect x="160" y="312" width="46" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="183" y="330" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <rect x="210" y="312" width="46" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="233" y="330" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <rect x="260" y="312" width="46" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="283" y="330" text-anchor="middle" font-size="10.5" fill="#333">4</text>
  <rect x="310" y="312" width="46" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="333" y="330" text-anchor="middle" font-size="10.5" fill="#333">8</text>
  <rect x="360" y="312" width="46" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="383" y="330" text-anchor="middle" font-size="10.5" fill="#333">16</text>

  <rect x="430" y="244" width="100" height="94" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="8" filter="url(#rough2)"/>
  <text x="480" y="266" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">v ≤ 500</text>
  <text x="480" y="284" text-anchor="middle" font-size="10" fill="#666">核至多 9 个</text>
  <text x="480" y="302" text-anchor="middle" font-size="10" fill="#666">每核倍增链</text>
  <text x="480" y="320" text-anchor="middle" font-size="10" fill="#666">≤ 13 步截断</text>
  <text x="480" y="336" text-anchor="middle" font-size="9.5" fill="#888">（终值 ≤ sum）</text>

  <text x="60" y="366" font-size="10.5" fill="#555">每个候选的代价 = p + q；同一终值取最小 p + q。</text>
  <text x="60" y="384" font-size="10.5" fill="#555">第 I 版的候选只是其中 p = 0 或 q = 0 的部分。</text>
</svg>
