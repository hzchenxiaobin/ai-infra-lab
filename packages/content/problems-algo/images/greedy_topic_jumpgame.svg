<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">例题演算：跳跃游戏 II（45），nums=[2,3,1,1,4]</text>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#888">贪心扩张右边界：每跳维护「当前一跳能到的最远」，到边界就 +1 跳并刷新边界</text>

  <!-- ===== array ===== -->
  <text x="20" y="76" font-size="11" fill="#888" filter="url(#rough2)">nums：</text>
  <rect x="70" y="62" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="84" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="134" y="62" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="164" y="84" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="198" y="62" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="228" y="84" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="262" y="62" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="292" y="84" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="326" y="62" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="356" y="84" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>

  <text x="100" y="110" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">i=0</text>
  <text x="164" y="110" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">i=1</text>
  <text x="228" y="110" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">i=2</text>
  <text x="292" y="110" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">i=3</text>
  <text x="356" y="110" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">i=4 终点</text>

  <!-- ===== Step-by-step ===== -->
  <!-- step 1 -->
  <text x="20" y="138" font-size="11" fill="#444" font-weight="bold" filter="url(#rough2)">第 1 跳：从 i=0 出发，能到 maxReach=0+2=2</text>
  <rect x="70" y="124" width="188" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" fill-opacity="0.5" filter="url(#rough2)"/>
  <text x="164" y="140" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">第1跳覆盖 [1,2]</text>
  <text x="20" y="158" font-size="10" fill="#888" filter="url(#rough2)">边界 end=2；i 走到 2 时该跳用尽 → jumps=1，进入第2跳</text>

  <!-- step 2 -->
  <text x="20" y="184" font-size="11" fill="#444" font-weight="bold" filter="url(#rough2)">第 2 跳：i=1..2 内扩张，maxReach=max(1+3, 2+1)=4</text>
  <rect x="134" y="170" width="252" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" fill-opacity="0.5" filter="url(#rough2)"/>
  <text x="260" y="186" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">第2跳覆盖到 i=4 ★</text>
  <text x="20" y="204" font-size="10" fill="#888" filter="url(#rough2)">i=1 贡献 1+3=4；i=2 贡献 2+1=3；maxReach=4 ≥ n-1 → 到终点</text>

  <!-- the greedy insight -->
  <rect x="30" y="218" width="580" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="320" y="238" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">贪心核心：不关心「具体跳到哪格」，只维护「最远能到哪」</text>
  <text x="44" y="258" font-size="10" fill="#555" filter="url(#rough2)">• 当前一跳的边界 end 内，所有 i 都可达；扫描时不断更新 maxReach = max(maxReach, i+nums[i])</text>
  <text x="44" y="274" font-size="10" fill="#555" filter="url(#rough2)">• 当 i 走到 end（当前一跳用尽），必须再跳一次：jumps++，新的 end = maxReach</text>
  <text x="44" y="290" font-size="10" fill="#888" filter="url(#rough2)">• 等价于 BFS 的「层」：每一跳就是一层，取尽当前层所有可达点，扩张出下一层的最远边界</text>

  <!-- ===== code skeleton ===== -->
  <rect x="30" y="314" width="580" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="320" y="334" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">代码骨架（O(n) 单遍扫描）</text>
  <rect x="44" y="342" width="552" height="52" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="52" y="358" font-size="10" fill="#333" font-family="monospace" filter="url(#rough2)">jumps=0; curEnd=0; maxReach=0;</text>
  <text x="52" y="372" font-size="10" fill="#333" font-family="monospace" filter="url(#rough2)">for i in 0..n-2: maxReach=max(maxReach,i+nums[i]);</text>
  <text x="52" y="386" font-size="10" fill="#333" font-family="monospace" filter="url(#rough2)">            if i==curEnd: jumps++; curEnd=maxReach  # 当前跳用尽，加一跳</text>

  <!-- ===== contrast with 55 ===== -->
  <rect x="30" y="410" width="580" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="44" y="428" font-size="10" fill="#555" filter="url(#rough2)">对比 [55. 跳跃游戏]（只判能否到）：只要 maxReach ≥ n-1 即 true，连 jumps 计数都不要</text>
  <text x="44" y="442" font-size="10" fill="#888" filter="url(#rough2)">两题共用「维护最远可达」骨架；45 多了「到边界就 +1 跳」的计数 → 等价于 BFS 层数</text>
</svg>
