<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="'Comic Sans MS','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="900" height="640" fill="#fafafa"/>

  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">位置–时间图：组轨迹 = 组内最右机器人的轨迹（示例 1）</text>
  <text x="90" y="72" font-size="12" fill="#666" filter="url(#rough2)">斜率 Δx/Δt = 速度 v（线越平，v 越大）</text>

  <!-- axes -->
  <path d="M 60 460 L 875 460" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 60 460 L 60 50" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="806" y="488" font-size="13" fill="#3a3a3a" filter="url(#rough2)">位置 position</text>
  <text x="26" y="66" font-size="13" fill="#3a3a3a" filter="url(#rough2)">时间 t</text>

  <!-- time gridlines -->
  <path d="M 60 350 L 860 350" stroke="#ddd" stroke-width="1" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <path d="M 60 240 L 860 240" stroke="#ddd" stroke-width="1" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <path d="M 60 130 L 860 130" stroke="#ddd" stroke-width="1" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <text x="26" y="354" font-size="11" fill="#999" filter="url(#rough2)">t=1</text>
  <text x="26" y="244" font-size="11" fill="#999" filter="url(#rough2)">t=2</text>
  <text x="26" y="134" font-size="11" fill="#999" filter="url(#rough2)">t=3</text>

  <!-- position tick labels at t=0 -->
  <text x="86" y="482" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="190" y="482" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="216" y="482" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="580" y="482" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">20</text>

  <!-- R1 trajectory: (1,v=4) from t=0 to t=2 -->
  <path d="M 86 460 L 294 240" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="100" y="322" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">R1 (1, v=4)</text>
  <!-- R1 hypothetical continuation after absorption -->
  <path d="M 294 240 L 398 130" stroke="#aaa" stroke-width="1.5" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <text x="404" y="178" font-size="10" fill="#999" filter="url(#rough2)">R1 假想轨迹（被吸收，不存在）</text>

  <!-- R2 merge arrow at t=0 -->
  <path d="M 188 446 L 212 446" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="244" y="442" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">t=0：R2 与 R3 间距 1 = d，立即合并</text>

  <!-- group {R1,R2,R3} trajectory = R3 trajectory -->
  <path d="M 216 460 L 372 130" stroke="#4a7a3a" stroke-width="3" fill="none" filter="url(#rough2)"/>
  <text x="306" y="322" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">幸存组 {R1,R2,R3}</text>
  <text x="318" y="340" font-size="11" fill="#4a7a3a" filter="url(#rough2)">轨迹 = R3 轨迹：6 + 2t</text>

  <!-- R4 trajectory -->
  <path d="M 580 460 L 814 130" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="610" y="100" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">R4 (20, v=3)：永不合并</text>

  <!-- merge point at t=2 -->
  <circle cx="294" cy="240" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="320" cy="240" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 294 256 L 320 256" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 294 252 L 294 260 M 320 252 L 320 260" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="352" y="246" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">t=2：间距缩到 d=1，R1 被吸收</text>
  <text x="352" y="264" font-size="10" fill="#b85450" filter="url(#rough2)">（在追上之前合并就已触发）</text>

  <!-- key observations box -->
  <rect x="60" y="505" width="780" height="122" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="82" y="533" font-size="14" font-weight="bold" fill="#7a5415" filter="url(#rough2)">核心观察</text>
  <text x="82" y="557" font-size="12" fill="#444" filter="url(#rough2)">① 组的轨迹恒等于其最右机器人的直线 x(t) = p + v·t —— 合并不改变幸存组轨迹</text>
  <text x="82" y="579" font-size="12" fill="#444" filter="url(#rough2)">② 间距连续变化：左侧「追上」右侧前必先缩到 ≤ d 而触发合并 ⇒ 永不超车</text>
  <text x="82" y="601" font-size="12" fill="#444" filter="url(#rough2)">③ 从右往左扫描时，每个机器人只需与最近的右侧幸存组（栈顶）判定一次</text>
</svg>
