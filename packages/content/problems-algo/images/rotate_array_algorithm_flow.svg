<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="440" height="470" fill="#fafafa"/>

  <text x="220" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">三步反转算法流程</text>

  <!-- Start: k %= n -->
  <rect x="110" y="42" width="220" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="220" y="64" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">预处理</text>
  <text x="220" y="82" text-anchor="middle" font-size="11" fill="#555">k = k % n   （处理 k ≥ n）</text>

  <path d="M 220 96 L 220 114" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 1 -->
  <rect x="80" y="118" width="280" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="220" y="140" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">① reverse(0, n−1)</text>
  <text x="220" y="160" text-anchor="middle" font-size="11" fill="#555">整体反转：AB → rev(B) rev(A)</text>

  <path d="M 220 178 L 220 196" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="80" y="200" width="280" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="220" y="222" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">② reverse(0, k−1)</text>
  <text x="220" y="242" text-anchor="middle" font-size="11" fill="#555">反转前 k 个：rev(B) rev(A) → B rev(A)</text>

  <path d="M 220 260 L 220 278" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="80" y="282" width="280" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="220" y="304" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">③ reverse(k, n−1)</text>
  <text x="220" y="324" text-anchor="middle" font-size="11" fill="#555">反转后 n−k 个：B rev(A) → B A</text>

  <path d="M 220 342 L 220 360" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- End -->
  <rect x="110" y="364" width="220" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="220" y="392" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">完成：nums 已右移 k 位</text>

  <!-- Complexity note -->
  <text x="220" y="438" text-anchor="middle" font-size="11" fill="#d6a040" font-style="italic">三次反转，每个元素至多交换两次 → O(n) 时间 / O(1) 空间</text>
</svg>
