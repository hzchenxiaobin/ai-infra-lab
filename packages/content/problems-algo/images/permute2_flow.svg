<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="500" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">全排列 II 算法流程：排序 + used + 同层去重</text>

  <!-- Start -->
  <ellipse cx="290" cy="58" rx="86" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="62" text-anchor="middle" font-size="11" fill="#333">backtrack(path, used)</text>
  <path d="M 290 76 L 290 90" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ① Termination -->
  <polygon points="290,94 410,132 290,170 170,132" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="128" text-anchor="middle" font-size="11" fill="#333">path.size == n ?</text>
  <text x="290" y="144" text-anchor="middle" font-size="10" fill="#888">(路径已满 = 叶子)</text>
  <path d="M 410 132 L 472 132" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="441" y="124" text-anchor="middle" font-size="10" fill="#82b366">是</text>
  <rect x="472" y="114" width="96" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="520" y="132" text-anchor="middle" font-size="11" fill="#333">ans.push_back</text>
  <text x="520" y="144" text-anchor="middle" font-size="11" fill="#333">(path); return</text>
  <path d="M 290 170 L 290 184" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="302" y="180" font-size="10" fill="#b85450">否</text>

  <!-- ② for loop -->
  <rect x="140" y="188" width="300" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="212" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">for (i = 0 .. n-1)：遍历每个候选</text>
  <path d="M 290 228 L 290 242" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ used[i] ? -->
  <polygon points="290,246 390,280 290,314 190,280" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="276" text-anchor="middle" font-size="11" fill="#333">used[i] ?</text>
  <text x="290" y="292" text-anchor="middle" font-size="10" fill="#888">(该数已选过)</text>
  <path d="M 390 280 L 452 280" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="421" y="272" text-anchor="middle" font-size="10" fill="#b85450">是</text>
  <rect x="452" y="264" width="66" height="32" rx="6" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="485" y="284" text-anchor="middle" font-size="11" fill="#888">continue</text>
  <path d="M 290 314 L 290 328" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="302" y="324" font-size="10" fill="#82b366">否</text>

  <!-- ④ dedup (NEW) -->
  <polygon points="290,332 408,372 290,412 172,372" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="366" text-anchor="middle" font-size="10" fill="#333">i&gt;0 &amp;&amp; nums[i]==nums[i-1]</text>
  <text x="290" y="382" text-anchor="middle" font-size="10" fill="#333">&amp;&amp; !used[i-1] ?</text>
  <text x="290" y="398" text-anchor="middle" font-size="9" fill="#b85450">(同层去重)</text>
  <path d="M 408 372 L 452 372" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="364" text-anchor="middle" font-size="10" fill="#b85450">是</text>
  <rect x="452" y="356" width="66" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="485" y="376" text-anchor="middle" font-size="11" fill="#b85450">continue</text>
  <path d="M 290 412 L 290 426" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="302" y="422" font-size="10" fill="#82b366">否</text>

  <!-- ⑤ select-recurse-undo -->
  <rect x="108" y="430" width="364" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="448" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">① used[i]=true; path.push_back(nums[i])</text>
  <text x="290" y="464" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">② backtrack(path, used)</text>
  <text x="290" y="478" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">③ path.pop_back(); used[i]=false</text>

  <!-- loop back to for -->
  <path d="M 108 456 L 56 456 L 56 208 L 140 208" stroke="#888" stroke-width="1.3" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="48" y="332" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 48 332)">撤销后试下一个</text>

  <text x="290" y="496" text-anchor="middle" font-size="10" fill="#888">相比 46 全排列，仅多一个红色去重菱形；其余结构与 used 数组法完全一致</text>
</svg>
