<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="640" height="440" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察:所有出现等间隔 = 位置列表是公差 d 的等差数列</text>

  <!-- ============ Row 1: 7 -> [0,1,2,3] 特别 ============ -->
  <rect x="28" y="58" width="170" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="113" y="78" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">7 → [0,1,2,3]</text>
  <line x1="214" y1="102" x2="536" y2="102" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="222" y1="94" x2="222" y2="110" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <line x1="266" y1="94" x2="266" y2="110" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <line x1="310" y1="94" x2="310" y2="110" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <line x1="354" y1="94" x2="354" y2="110" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="222" y="124" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">0</text>
  <text x="266" y="124" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">1</text>
  <text x="310" y="124" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">2</text>
  <text x="354" y="124" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">3</text>
  <path d="M 222 94 Q 244 64 266 94" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 266 94 Q 288 64 310 94" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 310 94 Q 332 64 354 94" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="244" y="72" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="288" y="72" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="332" y="72" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="560" y="100" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓ 特别</text>
  <text x="560" y="116" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">m=4 ≥ 3</text>

  <!-- ============ Row 2: 5 -> [3,5,7] 特别 ============ -->
  <rect x="28" y="138" width="170" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="113" y="158" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">5 → [3,5,7]</text>
  <line x1="214" y1="182" x2="536" y2="182" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="354" y1="174" x2="354" y2="190" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <line x1="442" y1="174" x2="442" y2="190" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <line x1="530" y1="174" x2="530" y2="190" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="354" y="204" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">3</text>
  <text x="442" y="204" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">5</text>
  <text x="530" y="204" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">7</text>
  <path d="M 354 174 Q 398 144 442 174" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 442 174 Q 486 144 530 174" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="398" y="152" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="486" y="152" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="560" y="180" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓ 特别</text>
  <text x="560" y="196" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">m=3</text>

  <!-- ============ Row 3: 3 -> [0,3,5,6] 间隔不全等 ============ -->
  <rect x="28" y="218" width="170" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="113" y="238" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">3 → [0,3,5,6]</text>
  <line x1="214" y1="262" x2="536" y2="262" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="222" y1="254" x2="222" y2="270" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <line x1="354" y1="254" x2="354" y2="270" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <line x1="442" y1="254" x2="442" y2="270" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <line x1="486" y1="254" x2="486" y2="270" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="222" y="284" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">0</text>
  <text x="354" y="284" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">3</text>
  <text x="442" y="284" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">5</text>
  <text x="486" y="284" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">6</text>
  <path d="M 222 254 Q 288 224 354 254" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 354 254 Q 398 224 442 254" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 442 254 Q 464 224 486 254" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="288" y="232" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">3</text>
  <text x="398" y="232" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">2</text>
  <text x="464" y="232" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="560" y="260" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗ 不特别</text>
  <text x="560" y="276" font-size="9.5" fill="#b85450" filter="url(#rough2)">间隔不全等</text>

  <!-- ============ Row 4: 8 -> [1,6] 次数不足 ============ -->
  <rect x="28" y="298" width="170" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="113" y="318" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6420" filter="url(#rough2)">8 → [1,6]</text>
  <line x1="214" y1="342" x2="536" y2="342" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="266" y1="334" x2="266" y2="350" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <line x1="486" y1="334" x2="486" y2="350" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="266" y="364" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">1</text>
  <text x="486" y="364" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">6</text>
  <path d="M 266 334 Q 376 304 486 334" fill="none" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="376" y="312" text-anchor="middle" font-size="10.5" fill="#8a6420" filter="url(#rough2)">5</text>
  <text x="560" y="340" font-size="12.5" font-weight="bold" fill="#8a6420" filter="url(#rough2)">✗ 不特别</text>
  <text x="560" y="356" font-size="9.5" fill="#8a6420" filter="url(#rough2)">次数 &lt; 3</text>

  <!-- ============ Bottom insight ============ -->
  <rect x="28" y="378" width="584" height="52" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="400" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">判定:m ≥ 3,且 d = p[1] − p[0] 时每个间隔 p[k+1] − p[k] == d</text>
  <text x="320" y="420" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">单值判定 O(m);所有值的位置总数 Σm = n → 整体 O(n)</text>
</svg>
