<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">find 路径压缩 + union 按秩合并</text>

  <!-- before: chain -->
  <text x="120" y="56" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">压缩前：find(3) 逐层上溯</text>
  <circle cx="120" cy="86" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="91" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <circle cx="120" cy="136" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="141" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <circle cx="120" cy="186" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="191" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <circle cx="120" cy="236" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="120" y="241" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <line x1="120" y1="101" x2="120" y2="121" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="120" y1="151" x2="120" y2="171" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="120" y1="201" x2="120" y2="221" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="160" font-size="10.5" fill="#b85450">3→2→1→0</text>
  <text x="150" y="174" font-size="10.5" fill="#b85450">深度 3，慢！</text>

  <!-- arrow middle -->
  <path d="M 230 160 L 310 160" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="152" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">路径压缩</text>

  <!-- after: star -->
  <text x="410" y="56" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">压缩后：全都直挂根 0</text>
  <circle cx="410" cy="236" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="410" y="241" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <circle cx="370" cy="96" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="370" y="101" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <circle cx="410" cy="86" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="410" y="91" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <circle cx="450" cy="96" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="450" y="101" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <path d="M 372 110 Q 390 170 405 222" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 410 101 L 410 221" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 448 110 Q 430 170 415 222" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="448" y="170" font-size="10.5" fill="#4a7a3a">深度 1</text>
  <text x="448" y="184" font-size="10.5" fill="#4a7a3a">下次 O(1)！</text>

  <!-- union by rank box -->
  <rect x="30" y="272" width="480" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="291" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">union：矮树挂到高树下（按秩合并）</text>
  <text x="270" y="306" text-anchor="middle" font-size="11" fill="#888">rank[root]，保证树高 ≈ log n</text>

  <rect x="30" y="320" width="480" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="340" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">两者搭配 → 均摊单次 find 近似 O(α(n))</text>
</svg>
