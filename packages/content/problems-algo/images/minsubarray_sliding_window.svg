<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">滑动窗口：双指针不回退，窗口和随扩缩单调变化</text>

  <!-- nums row -->
  <text x="30" y="74" font-size="12" fill="#888">nums:</text>
  <rect x="80" y="58" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="108" y="78" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="136" y="58" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="164" y="78" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="192" y="58" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="78" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="248" y="58" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="276" y="78" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="304" y="58" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="332" y="78" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="360" y="58" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="388" y="78" text-anchor="middle" font-size="12" fill="#333">3</text>

  <text x="108" y="104" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="164" y="104" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="220" y="104" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="276" y="104" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="332" y="104" text-anchor="middle" font-size="9" fill="#aaa">4</text>
  <text x="388" y="104" text-anchor="middle" font-size="9" fill="#aaa">5</text>

  <!-- window highlight [left, right] = [1, 4] -->
  <rect x="133" y="54" width="230" height="38" fill="none" stroke="#d6a040" stroke-width="2.2" rx="6" filter="url(#rough2)"/>

  <!-- left pointer -->
  <path d="M 164 116 L 164 96" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="164" y="130" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">left</text>

  <!-- right pointer -->
  <path d="M 332 116 L 332 96" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="332" y="130" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">right</text>

  <!-- sum box -->
  <rect x="150" y="148" width="260" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="173" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">窗口 [1..4] 和 = 3+1+2+4 = 10  ≥ 7 ✓</text>

  <!-- two monotonicity rules -->
  <rect x="40" y="214" width="230" height="108" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="155" y="238" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">右扩 right++</text>
  <text x="155" y="262" text-anchor="middle" font-size="11.5" fill="#333">加入 nums[right]</text>
  <text x="155" y="284" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">sum 只增不减 ↑</text>
  <text x="155" y="306" text-anchor="middle" font-size="10.5" fill="#888">窗口更长，可能命中</text>

  <rect x="290" y="214" width="230" height="108" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="405" y="238" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">左缩 left++</text>
  <text x="405" y="262" text-anchor="middle" font-size="11.5" fill="#333">移除 nums[left]</text>
  <text x="405" y="284" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">sum 只减不增 ↓</text>
  <text x="405" y="306" text-anchor="middle" font-size="10.5" fill="#888">窗口更短，尝试更优</text>

  <!-- bottom note -->
  <rect x="40" y="338" width="480" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="359" text-anchor="middle" font-size="11.5" fill="#333">前提：nums[i] &gt; 0 → 窗口和单调 → 两指针均只向右，O(n)</text>
</svg>
