<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">正难则反：相交对数 = 总对数 − 不相交对数</text>

  <!-- 顶部恒等式 -->
  <rect x="30" y="52" width="150" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="105" y="80" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">全部对 C(n,2)</text>
  <text x="196" y="80" text-anchor="middle" font-size="16" fill="#444" font-weight="bold">=</text>
  <rect x="212" y="52" width="160" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="292" y="80" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">相交对（答案）</text>
  <text x="388" y="80" text-anchor="middle" font-size="16" fill="#444" font-weight="bold">+</text>
  <rect x="404" y="52" width="126" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="467" y="80" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">不相交对</text>

  <!-- 核心观察 -->
  <rect x="30" y="112" width="500" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="136" font-size="11.5" fill="#333" font-weight="bold">关键刻画：不相交 ⟺ 一方完全在另一方左侧 ⟺ end_j &lt; start_i（严格小于）</text>
  <text x="50" y="158" font-size="11.5" fill="#333">以「右侧区间」为锚，数它左边有多少个区间 → 每个不相交对恰好被数一次，相交对零贡献</text>

  <!-- 流程 -->
  <rect x="60" y="202" width="460" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <circle cx="88" cy="225" r="12" fill="#446688" filter="url(#rough2)"/>
  <text x="88" y="229" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">1</text>
  <text x="112" y="222" font-size="12" fill="#333" font-weight="bold">排序：抽出所有区间的 end，排成有序表 E</text>
  <text x="112" y="239" font-size="10.5" fill="#667">E = [e(0) ≤ e(1) ≤ … ≤ e(n−1)]</text>

  <path d="M 290 250 L 290 272" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="276" width="460" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <circle cx="88" cy="301" r="12" fill="#446688" filter="url(#rough2)"/>
  <text x="88" y="305" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">2</text>
  <text x="112" y="298" font-size="12" fill="#333" font-weight="bold">二分：对每个 start_i，在 E 中 lower_bound 定位</text>
  <text x="112" y="316" font-size="10.5" fill="#667">落点下标 = 满足 end &lt; start_i 的区间个数（严格小于，一次 O(log n)）</text>

  <path d="M 290 328 L 290 350" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="354" width="460" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <circle cx="88" cy="379" r="12" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="88" y="383" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">3</text>
  <text x="112" y="376" font-size="12" fill="#333" font-weight="bold">容斥求和：S = Σ 计数（即全部不相交对的个数）</text>
  <text x="112" y="394" font-size="10.5" fill="#667">答案 = n(n−1)/2 − S</text>
</svg>
