<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：异或分组——拆开两个落单数</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">全体异或得 a⊕b → 取一个为 1 的位 → 按该位分组 → 各组异或得 a、b</text>

  <!-- ===== Step 1: XOR all ===== -->
  <rect x="20" y="56" width="520" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="34" y="76" font-size="11.5" fill="#3a4a66" font-weight="bold">① 全体异或：成对数抵消，只剩 a ⊕ b</text>

  <!-- array cells: 1 2 1 3 2 5 -->
  <g font-size="13">
    <rect x="60"  y="86" width="36" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="78"  y="108" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="96"  y="86" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="114" y="108" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="132" y="86" width="36" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="150" y="108" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="168" y="86" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="186" y="108" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
    <rect x="204" y="86" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="222" y="108" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="240" y="86" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="258" y="108" text-anchor="middle" fill="#d6a040" font-weight="bold">5</text>
  </g>

  <!-- pair brackets below cells -->
  <path d="M 62 124 L 62 130 L 168 130 L 168 124" stroke="#b85450" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <text x="115" y="142" text-anchor="middle" font-size="9" fill="#b85450">1⊕1=0 抵消</text>
  <path d="M 98 124 L 98 132 L 240 132 L 240 124" stroke="#4a7a3a" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <text x="187" y="144" text-anchor="middle" font-size="9" fill="#4a7a3a">2⊕2=0 抵消</text>

  <!-- arrow to result -->
  <path d="M 286 103 L 320 103" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="96" text-anchor="middle" font-size="9" fill="#888">⊕</text>

  <!-- result xor_all = 6 = 110 -->
  <rect x="324" y="86" width="100" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="374" y="108" text-anchor="middle" font-size="12" fill="#6a4a10" font-weight="bold">xor_all = 6</text>
  <text x="374" y="134" text-anchor="middle" font-size="11" fill="#6a4a10" font-family="monospace">= (110)₂ = 3⊕5</text>
  <text x="446" y="100" font-size="10" fill="#888">仍是 a⊕b</text>
  <text x="446" y="114" font-size="10" fill="#888">无法拆开</text>

  <!-- ===== Step 2: pick lowest set bit ===== -->
  <rect x="20" y="158" width="520" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="34" y="178" font-size="11.5" fill="#6a4a10" font-weight="bold">② 取最低位 1 作区分位：diff = xor_all &amp; (-xor_all)</text>

  <!-- binary bits of 6: 1 1 0 -->
  <g font-size="12" font-family="monospace">
    <rect x="120" y="190" width="32" height="32" fill="#fff" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="136" y="211" text-anchor="middle" fill="#333">1</text>
    <rect x="152" y="190" width="32" height="32" fill="#fff" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="168" y="211" text-anchor="middle" fill="#333">1</text>
    <rect x="184" y="190" width="32" height="32" fill="#fff" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="200" y="211" text-anchor="middle" fill="#333">0</text>
    <text x="136" y="234" text-anchor="middle" font-size="9" fill="#888">位2</text>
    <text x="168" y="234" text-anchor="middle" font-size="9" fill="#888">位1</text>
    <text x="200" y="234" text-anchor="middle" font-size="9" fill="#888">位0</text>
  </g>

  <!-- highlight lowest set bit (bit1) -->
  <rect x="152" y="190" width="32" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="168" y="211" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" font-family="monospace">1</text>

  <path d="M 224 206 L 268 206" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="246" y="200" text-anchor="middle" font-size="9" fill="#888">取最低位1</text>

  <rect x="272" y="190" width="120" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="332" y="211" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" font-family="monospace">diff = (010)₂ = 2</text>
  <text x="406" y="202" font-size="10" fill="#b85450">a、b 在此位不同</text>
  <text x="406" y="216" font-size="10" fill="#b85450">→ 可用作区分位</text>

  <!-- ===== Step 3: partition ===== -->
  <rect x="20" y="246" width="520" height="180" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="34" y="266" font-size="11.5" fill="#3a5a2a" font-weight="bold">③ 按区分位分组：每组各自异或，退化成 136 题</text>

  <!-- Group 0 (bit1 = 0): 1 1 5 -> 5 -->
  <text x="120" y="288" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">组0（位1=0）</text>
  <g font-size="13">
    <rect x="60"  y="296" width="34" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="77"  y="317" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="94"  y="296" width="34" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="111" y="317" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="128" y="296" width="34" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="145" y="317" text-anchor="middle" fill="#d6a040" font-weight="bold">5</text>
  </g>
  <text x="111" y="344" text-anchor="middle" font-size="9.5" fill="#888">1⊕1=0 抵消，剩 5</text>
  <path d="M 172 312 L 206 312" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="210" y="296" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="238" y="317" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold">5</text>

  <!-- Group 1 (bit1 = 1): 2 3 2 -> 3 -->
  <text x="120" y="372" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">组1（位1=1）</text>
  <g font-size="13">
    <rect x="60"  y="380" width="34" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="77"  y="401" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="94"  y="380" width="34" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="111" y="401" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
    <rect x="128" y="380" width="34" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="145" y="401" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
  </g>
  <text x="111" y="428" text-anchor="middle" font-size="9.5" fill="#888">2⊕2=0 抵消，剩 3</text>
  <path d="M 172 396 L 206 396" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="210" y="380" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="238" y="401" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold">3</text>

  <!-- final result box -->
  <rect x="300" y="332" width="220" height="68" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="410" y="356" text-anchor="middle" font-size="12" fill="#7a3a3a" font-weight="bold">两组合并即答案</text>
  <text x="410" y="378" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" font-family="monospace">[5, 3] ✓</text>
  <text x="410" y="394" text-anchor="middle" font-size="9.5" fill="#888">顺序任意</text>

  <!-- connector lines from groups to result -->
  <path d="M 266 312 L 290 312 L 290 350 L 300 350" stroke="#b85450" stroke-width="1" fill="none" stroke-dasharray="2,2" filter="url(#rough2)"/>
  <path d="M 266 396 L 290 396 L 290 366 L 300 366" stroke="#b85450" stroke-width="1" fill="none" stroke-dasharray="2,2" filter="url(#rough2)"/>
</svg>
