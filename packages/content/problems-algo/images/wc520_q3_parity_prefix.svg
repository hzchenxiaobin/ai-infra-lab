<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="410" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">前缀和 + 奇偶分桶:O(n) 求最小偶长度窗口和</text>

  <!-- ============ 第一行:例子与 T ============ -->
  <text x="60" y="80" font-size="12" fill="#555" filter="url(#rough2)">nums</text>
  <rect x="92" y="60" width="44" height="30" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="114" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="138" y="60" width="44" height="30" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="160" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="184" y="60" width="44" height="30" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="206" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="230" y="60" width="44" height="30" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="252" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>

  <path d="M 292 75 L 318 75" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="340" y="80" font-size="12" fill="#555" filter="url(#rough2)">w</text>
  <rect x="362" y="60" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="384" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">+1</text>
  <rect x="408" y="60" width="44" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">−5</text>
  <rect x="454" y="60" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="476" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">+2</text>
  <rect x="500" y="60" width="44" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="522" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">−4</text>

  <text x="320" y="112" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">前缀和 T = [0, 1, −4, −2, −6](T[c] = w[0..c−1] 之和;P = T[4] = −6;蓝色 = 偶下标,绿色 = 奇下标)</text>

  <!-- ============ 第二行:奇偶条件 + 双轨配对 ============ -->
  <text x="60" y="142" font-size="12.5" fill="#333" filter="url(#rough2)">偶窗口 [a, b] ⟺ 长度 b−a+1 为偶 ⟺ 令 c = b+1,则 c ≡ a (mod 2)</text>
  <text x="60" y="162" font-size="12.5" fill="#333" filter="url(#rough2)">S(a, b) = T[c] − T[a] ⟹ 固定 c,找「更早且同奇偶」的最大 T[a] 与之相减</text>

  <text x="76" y="204" text-anchor="end" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">偶下标轨</text>
  <line x1="96" y1="200" x2="580" y2="200" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="150" cy="200" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="205" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">T0=0</text>
  <circle cx="310" cy="200" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="205" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">T2=−4</text>
  <circle cx="470" cy="200" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="470" y="205" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">T4=−6</text>

  <path d="M 150 178 Q 310 148 460 176" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="310" y="152" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">T[4] − max{T[0], T[2]} = −6 − 0 = −6 ← 最小(窗口 [0..3])</text>

  <text x="76" y="256" text-anchor="end" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">奇下标轨</text>
  <line x1="96" y1="252" x2="580" y2="252" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="230" cy="252" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="257" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">T1=1</text>
  <circle cx="390" cy="252" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="257" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">T3=−2</text>

  <path d="M 230 274 Q 310 294 380 276" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="298" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">T[3] − max{T[1]} = −2 − 1 = −3(窗口 [1..2];另有 T[2]−T[0] = −4)</text>

  <!-- ============ 第三行:扫描流程 + 答案 ============ -->
  <rect x="40" y="312" width="176" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="128" y="330" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">① c 从 0 到 n 递增</text>
  <text x="128" y="345" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">T[c] 滚动维护即可</text>

  <path d="M 220 332 L 240 332" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="244" y="312" width="176" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="332" y="330" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">② m = min(m, T[c] − best[c%2])</text>
  <text x="332" y="345" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">先用:同奇偶且 a &lt; c ⟹ 长度 ≥ 2</text>

  <path d="M 424 332 L 444 332" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="448" y="312" width="152" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="524" y="330" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">③ best[c%2] = max(…, T[c])</text>
  <text x="524" y="345" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">后存:T[c] 入桶</text>

  <rect x="40" y="362" width="560" height="38" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="380" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">本例 m = −6 ⟹ 增益 = −2m = 12,答案 = P + max(0, −2m) = −6 + 12 = 6 ✓</text>
  <text x="320" y="396" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">(对应旋转 [0..3]:[1,5,2,4] → [5,2,4,1],脉冲值 5−2+4−1 = 6)</text>
</svg>
