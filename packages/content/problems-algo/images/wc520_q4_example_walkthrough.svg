<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 482" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="640" height="482" fill="#fafafa"/>
  <text x="320" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算:nums = [6, 5, 3](只看低 3 位,其余位全 0)</text>

  <!-- 元素行 -->
  <text x="121" y="42" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">b2  b1  b0</text>
  <text x="56" y="61" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">6 =</text>
  <rect x="92" y="46" width="20" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="102" y="61" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="114" y="46" width="20" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="124" y="61" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="136" y="46" width="20" height="20" rx="3" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="146" y="61" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="196" y="61" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">5 =</text>
  <rect x="232" y="46" width="20" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="242" y="61" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="254" y="46" width="20" height="20" rx="3" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="264" y="61" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <rect x="276" y="46" width="20" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="286" y="61" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <text x="336" y="61" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">3 =</text>
  <rect x="372" y="46" width="20" height="20" rx="3" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="382" y="61" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <rect x="394" y="46" width="20" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="404" y="61" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="416" y="46" width="20" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="426" y="61" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <text x="470" y="54" font-size="10.5" fill="#777" filter="url(#rough2)">f[S] = SOS 超集和</text>
  <text x="470" y="70" font-size="10.5" fill="#777" filter="url(#rough2)">(含 S 全部位的元素个数)</text>

  <!-- 位 b2 -->
  <rect x="36" y="84" width="568" height="68" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="48" y="96" width="46" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="71" y="111" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">位 b2</text>
  <text x="106" y="106" font-size="11.5" fill="#333" filter="url(#rough2)">f[{b2}] = 2(6、5 含 b2) → 试 j = 2</text>
  <text x="106" y="124" font-size="11.5" fill="#333" filter="url(#rough2)">链为空,新阈值检查 f[{b2}] = 2 ≥ 2 ✓</text>
  <text x="106" y="144" font-size="10.5" fill="#8a6420" filter="url(#rough2)">更新链:v = 2 → {b2}</text>
  <rect x="522" y="100" width="68" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="556" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">p = 2</text>

  <!-- 位 b1 -->
  <rect x="36" y="162" width="568" height="86" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="48" y="174" width="46" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="71" y="189" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">位 b1</text>
  <text x="106" y="184" font-size="11.5" fill="#333" filter="url(#rough2)">f[{b1}] = 2(6、3 含 b1) → 试 j = 2</text>
  <text x="106" y="202" font-size="11.5" fill="#b85450" filter="url(#rough2)">j = 2 ✗:阈值 v = 2 ≤ 2:f[{b2,b1}] = 1 &lt; 2(只有 6 兼有 b2、b1)</text>
  <text x="106" y="220" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">j = 1 ✓:C(1) = {b2}:f[{b2,b1}] = 1 ≥ 1(位置 0 需 {b2,b1})</text>
  <text x="106" y="240" font-size="10.5" fill="#8a6420" filter="url(#rough2)">更新链:v = 2 → {b2} , v = 1 → {b2,b1}</text>
  <rect x="522" y="178" width="68" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="556" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">p = 1</text>

  <!-- 位 b0 -->
  <rect x="36" y="258" width="568" height="86" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="48" y="270" width="46" height="22" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="71" y="285" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">位 b0</text>
  <text x="106" y="280" font-size="11.5" fill="#333" filter="url(#rough2)">f[{b0}] = 2(5、3 含 b0),但两次尝试都被挡下:</text>
  <text x="106" y="298" font-size="11.5" fill="#b85450" filter="url(#rough2)">j = 2 ✗:f[{b2,b0}] = 1 &lt; 2;j = 1 ✗:f[{b2,b1,b0}] = 0 &lt; 1</text>
  <text x="106" y="316" font-size="11.5" fill="#b85450" filter="url(#rough2)">位置 0 被钉死为 6(唯一含 {b2,b1}),而 6 不含 b0</text>
  <text x="106" y="336" font-size="10.5" fill="#8a6420" filter="url(#rough2)">链不变</text>
  <rect x="522" y="274" width="68" height="34" rx="6" fill="#f0f0f0" stroke="#999" stroke-width="2" filter="url(#rough2)"/>
  <text x="556" y="296" text-anchor="middle" font-size="13" font-weight="bold" fill="#777" filter="url(#rough2)">p = 0</text>

  <!-- 见证排列 -->
  <rect x="36" y="354" width="568" height="116" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="376" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">见证排列 perm = [6, 5, 3](按最终链逐块分配)</text>
  <rect x="86" y="388" width="120" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="146" y="412" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">6 = 110</text>
  <rect x="260" y="388" width="120" height="38" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="412" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6420" filter="url(#rough2)">5 = 101</text>
  <rect x="434" y="388" width="120" height="38" rx="6" fill="#f0f0f0" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="494" y="412" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#777" filter="url(#rough2)">3 = 011</text>
  <text x="146" y="444" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">位置 0 需 {b2,b1} ✓</text>
  <text x="320" y="444" text-anchor="middle" font-size="10.5" fill="#8a6420" filter="url(#rough2)">位置 1 需 {b2} ✓</text>
  <text x="494" y="444" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">位置 2 无需求</text>
  <text x="320" y="464" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">power[12..14] = [2, 1, 0],其余 12 位全为 0</text>
</svg>
