<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">二进制拆分：把指数 n 写成若干 2^k 之和</text>

  <!-- n = 10 line -->
  <text x="40" y="66" font-size="13" fill="#888">指数 n =</text>
  <rect x="120" y="50" width="50" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="145" y="71" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">10</text>

  <!-- binary representation -->
  <text x="210" y="66" font-size="13" fill="#888">二进制</text>
  <rect x="270" y="50" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="71" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="312" y="50" width="40" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="332" y="71" text-anchor="middle" font-size="14" fill="#999">0</text>
  <rect x="354" y="50" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="374" y="71" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="396" y="50" width="40" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="416" y="71" text-anchor="middle" font-size="14" fill="#999">0</text>
  <text x="446" y="71" font-size="13" fill="#888">= 8 + 2</text>

  <!-- place-value labels under bits -->
  <text x="290" y="100" text-anchor="middle" font-size="10" fill="#4a7a3a">2^3=8 ✓</text>
  <text x="332" y="100" text-anchor="middle" font-size="10" fill="#bbb">2^2</text>
  <text x="374" y="100" text-anchor="middle" font-size="10" fill="#4a7a3a">2^1=2 ✓</text>
  <text x="416" y="100" text-anchor="middle" font-size="10" fill="#bbb">2^0</text>

  <!-- arrow down -->
  <path d="M 280 112 L 280 130" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="124" font-size="11" fill="#446688">只取为 1 的位</text>

  <!-- squaring chain -->
  <text x="40" y="166" font-size="13" fill="#888">反复平方:</text>
  <rect x="110" y="150" width="64" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="142" y="171" text-anchor="middle" font-size="13" fill="#333">x^1</text>
  <path d="M 176 166 L 206 166" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="191" y="160" text-anchor="middle" font-size="9" fill="#888">平方</text>
  <rect x="208" y="150" width="64" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="240" y="171" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">x^2 ✓</text>
  <path d="M 274 166 L 304 166" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="289" y="160" text-anchor="middle" font-size="9" fill="#888">平方</text>
  <rect x="306" y="150" width="64" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="338" y="171" text-anchor="middle" font-size="13" fill="#333">x^4</text>
  <path d="M 372 166 L 402 166" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="387" y="160" text-anchor="middle" font-size="9" fill="#888">平方</text>
  <rect x="404" y="150" width="64" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="436" y="171" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">x^8 ✓</text>

  <!-- combine -->
  <text x="40" y="240" font-size="13" fill="#888">组合:</text>
  <rect x="110" y="222" width="96" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="158" y="245" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">x^8 · x^2</text>
  <text x="224" y="245" font-size="16" fill="#888">=</text>
  <rect x="246" y="222" width="96" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="294" y="245" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">x^10 ⭐</text>

  <!-- core idea -->
  <rect x="40" y="288" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="310" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">核心直觉：指数的二进制位 = 要累乘哪些 x^(2^k)</text>
  <text x="280" y="330" text-anchor="middle" font-size="11" fill="#888">x 不断平方得到 x^1, x^2, x^4, x^8 …；位为 1 就乘进 ans → O(log n)</text>
</svg>
