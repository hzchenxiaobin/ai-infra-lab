<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="r9"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="97"/><feDisplacementMap in="SourceGraphic" scale="1.4"/></filter>
  </defs>
  <rect width="620" height="420" fill="#fafafa"/>
  <text x="310" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r9)">示例 1：nums=[1,3,2,4]，查询 [0,3] → 2</text>

  <!-- nums row -->
  <text x="30" y="58" font-size="11" fill="#446688" filter="url(#r9)">nums</text>
  <g filter="url(#r9)" font-size="11" font-family="monospace">
    <rect x="70" y="44" width="44" height="28" fill="#e8f0fe" stroke="#446688"/><text x="92" y="62" text-anchor="middle">1</text>
    <rect x="114" y="44" width="44" height="28" fill="#e8f0fe" stroke="#446688"/><text x="136" y="62" text-anchor="middle">3</text>
    <rect x="158" y="44" width="44" height="28" fill="#e8f0fe" stroke="#446688"/><text x="180" y="62" text-anchor="middle">2</text>
    <rect x="202" y="44" width="44" height="28" fill="#e8f0fe" stroke="#446688"/><text x="224" y="62" text-anchor="middle">4</text>
  </g>
  <!-- peak row -->
  <text x="30" y="100" font-size="11" fill="#b85450" filter="url(#r9)">peak</text>
  <g filter="url(#r9)" font-size="11" font-family="monospace">
    <rect x="70" y="86" width="44" height="28" fill="#f5f5f5" stroke="#bbb"/><text x="92" y="104" text-anchor="middle" fill="#888">0</text>
    <rect x="114" y="86" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/><text x="136" y="104" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="158" y="86" width="44" height="28" fill="#e8f0fe" stroke="#446688"/><text x="180" y="104" text-anchor="middle">0</text>
    <rect x="202" y="86" width="44" height="28" fill="#f5f5f5" stroke="#bbb"/><text x="224" y="104" text-anchor="middle" fill="#888">0</text>
    <text x="92" y="128" text-anchor="middle" font-size="9" fill="#888">0</text>
    <text x="136" y="128" text-anchor="middle" font-size="9" fill="#888">1</text>
    <text x="180" y="128" text-anchor="middle" font-size="9" fill="#888">2</text>
    <text x="224" y="128" text-anchor="middle" font-size="9" fill="#888">3</text>
  </g>

  <!-- segment tree -->
  <text x="30" y="158" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#r9)">线段树合并（叶 cnt=0，pre0=suf0=all0=1 若 peak=0，否则 0）</text>
  <g filter="url(#r9)" font-size="10" font-family="monospace">
    <!-- leaves -->
    <rect x="70" y="170" width="50" height="34" rx="4" fill="#e8f0fe" stroke="#446688"/><text x="95" y="184" text-anchor="middle">[0]</text><text x="95" y="198" text-anchor="middle" fill="#888">p0=1</text>
    <rect x="124" y="170" width="50" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/><text x="149" y="184" text-anchor="middle">[1]</text><text x="149" y="198" text-anchor="middle" fill="#b85450">p0=0</text>
    <rect x="178" y="170" width="50" height="34" rx="4" fill="#e8f0fe" stroke="#446688"/><text x="203" y="184" text-anchor="middle">[2]</text><text x="203" y="198" text-anchor="middle" fill="#888">p0=1</text>
    <rect x="232" y="170" width="50" height="34" rx="4" fill="#e8f0fe" stroke="#446688"/><text x="257" y="184" text-anchor="middle">[3]</text><text x="257" y="198" text-anchor="middle" fill="#888">p0=1</text>
    <!-- level1 -->
    <rect x="80" y="220" width="100" height="34" rx="4" fill="#fff8e1" stroke="#d6a040"/><text x="130" y="234" text-anchor="middle">[0,1]</text><text x="130" y="248" text-anchor="middle" fill="#d6a040">suf0=0 cnt=0</text>
    <rect x="200" y="220" width="100" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a"/><text x="250" y="234" text-anchor="middle">[2,3]</text><text x="250" y="248" text-anchor="middle" fill="#4a7a3a">all0=1 cnt=0</text>
    <!-- root -->
    <rect x="130" y="276" width="120" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/><text x="190" y="294" text-anchor="middle" font-weight="bold">[0,3] 根</text><text x="190" y="310" text-anchor="middle" fill="#b85450" font-weight="bold">cnt = 2 ✓</text>
  </g>

  <!-- root merge detail -->
  <rect x="340" y="170" width="262" height="146" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#r9)"/>
  <text x="356" y="192" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#r9)">根节点合并演算</text>
  <text x="356" y="210" font-size="10" fill="#333" filter="url(#r9)">L=[0,1]: suf0=0, len=2</text>
  <text x="356" y="226" font-size="10" fill="#333" filter="url(#r9)">R=[2,3]: pre0=2, len=2, all0=1</text>
  <text x="356" y="244" font-size="10" fill="#333" filter="url(#r9)">a = min(L.len−1, L.suf0) = min(1,0)=0</text>
  <text x="356" y="260" font-size="10" fill="#333" filter="url(#r9)">b = min(R.len, 1+R.pre0) = min(2,3)=2</text>
  <text x="356" y="278" font-size="10" fill="#333" filter="url(#r9)">跨界无峰 = a·b+max(0,b−1)=0+1=1</text>
  <text x="356" y="296" font-size="10" fill="#333" filter="url(#r9)">跨界总数 = 2·2−1 = 3</text>
  <text x="356" y="312" font-size="11" fill="#b85450" font-weight="bold" filter="url(#r9)">跨界峰 = 3−1 = 2 → cnt=2 ✓</text>

  <!-- update example -->
  <rect x="20" y="338" width="580" height="72" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#r9)"/>
  <text x="36" y="360" font-size="12" font-weight="bold" fill="#446688" filter="url(#r9)">随后更新 nums[1]=1 → [1,1,2,4]</text>
  <text x="36" y="378" font-size="11" fill="#333" filter="url(#r9)">重算峰 k∈{0,1,2}∩[1,2] = {1,2}：peak[1]: 1&gt;1?否 → 0；peak[2]: 2&gt;1,2&gt;4?否 → 0</text>
  <text x="36" y="396" font-size="11" fill="#b85450" font-weight="bold" filter="url(#r9)">peak 全 0 → 再查 [0,3] 得 cnt=0 ✓</text>
</svg>
