<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">排序降序后：前 h 篇每篇被引次数 ≥ h</text>

  <!-- baseline -->
  <path d="M 50 300 L 500 300" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- bars: [6,5,3,1,0] descending, 18px per unit -->
  <!-- bar 0: value 6 -->
  <rect x="78" y="192" width="56" height="108" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="106" y="184" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">6</text>
  <text x="106" y="320" text-anchor="middle" font-size="10.5" fill="#888">第 1 篇</text>

  <!-- bar 1: value 5 -->
  <rect x="158" y="210" width="56" height="90" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="186" y="202" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">5</text>
  <text x="186" y="320" text-anchor="middle" font-size="10.5" fill="#888">第 2 篇</text>

  <!-- bar 2: value 3 -->
  <rect x="238" y="246" width="56" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="266" y="238" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="266" y="320" text-anchor="middle" font-size="10.5" fill="#888">第 3 篇</text>

  <!-- bar 3: value 1 -->
  <rect x="318" y="282" width="56" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="346" y="274" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <text x="346" y="320" text-anchor="middle" font-size="10.5" fill="#888">第 4 篇</text>

  <!-- bar 4: value 0 -->
  <rect x="398" y="294" width="56" height="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="426" y="286" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>
  <text x="426" y="320" text-anchor="middle" font-size="10.5" fill="#888">第 5 篇</text>

  <!-- h = 3 threshold line -->
  <path d="M 50 246 L 500 246" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6 4" fill="none" filter="url(#rough2)"/>
  <text x="510" y="250" font-size="11" fill="#d6a040" font-weight="bold">h = 3</text>

  <!-- brace / annotation for first 3 bars -->
  <path d="M 106 338 Q 106 350 186 352 Q 266 350 266 338" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="186" y="368" text-anchor="middle" font-size="11" fill="#4a7a3a">3 篇 ≥ 3 ✓</text>

  <!-- right side note -->
  <rect x="380" y="336" width="150" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="455" y="358" text-anchor="middle" font-size="11" fill="#444">其余 &lt; 3 → 不计入</text>

  <!-- top-left note -->
  <text x="56" y="58" font-size="11" fill="#888">citations = [3,0,6,1,5]</text>
  <text x="56" y="74" font-size="11" fill="#888">降序 → [6,5,3,1,0]</text>
</svg>
