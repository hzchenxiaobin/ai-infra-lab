<svg xmlns="http://www.w3.org/2000/svg" width="860" height="320" viewBox="0 0 860 320" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="860" height="320" fill="#fdfcf7"/>
  <text x="430" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">在数轴上扫描 [lower, upper]，缺口即缺失区间</text>
  <path d="M 280 40 Q 430 48 580 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- number line -->
  <line x1="80" y1="150" x2="780" y2="150" stroke="#446688" stroke-width="2" filter="url(#sk)"/>
  <polygon points="780,150 770,145 770,155" fill="#446688" filter="url(#sk)"/>
  <text x="788" y="154" font-size="12" fill="#446688">数轴</text>

  <!-- lower / upper markers -->
  <line x1="120" y1="138" x2="120" y2="162" stroke="#b85450" stroke-width="2" filter="url(#sk)"/>
  <text x="120" y="130" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">lower</text>
  <line x1="700" y1="138" x2="700" y2="162" stroke="#b85450" stroke-width="2" filter="url(#sk)"/>
  <text x="700" y="130" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">upper</text>

  <!-- present numbers (in nums, within range) -->
  <g font-size="11" fill="#2e6e2e" font-weight="bold">
    <g filter="url(#sk)"><circle cx="240" cy="150" r="9" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
    <text x="240" y="154" text-anchor="middle">3</text>
    <g filter="url(#sk)"><circle cx="420" cy="150" r="9" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
    <text x="420" y="154" text-anchor="middle">7</text>
    <g filter="url(#sk)"><circle cx="500" cy="150" r="9" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
    <text x="500" y="154" text-anchor="middle">9</text>
  </g>
  <text x="430" y="186" text-anchor="middle" font-size="10" fill="#2e6e2e">nums 中落在 [lower,upper] 的数（绿圈）</text>

  <!-- missing intervals (gaps) highlighted -->
  <g filter="url(#sk)">
    <rect x="120" y="214" width="114" height="22" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="177" y="230" text-anchor="middle" font-size="11" fill="#7a2828" font-weight="bold">[1,2]</text>

  <g filter="url(#sk)">
    <rect x="254" y="214" width="114" height="22" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="311" y="230" text-anchor="middle" font-size="11" fill="#7a2828" font-weight="bold">[4,6]</text>

  <g filter="url(#sk)">
    <rect x="434" y="214" width="50" height="22" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="459" y="230" text-anchor="middle" font-size="11" fill="#7a2828" font-weight="bold">[8,8]</text>

  <g filter="url(#sk)">
    <rect x="514" y="214" width="186" height="22" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="607" y="230" text-anchor="middle" font-size="11" fill="#7a2828" font-weight="bold">[10,12]</text>

  <!-- connectors from gaps down to intervals -->
  <path d="M 177 162 L 177 214" stroke="#b85450" stroke-width="1" stroke-dasharray="3 2" filter="url(#sk)"/>
  <path d="M 311 162 L 311 214" stroke="#b85450" stroke-width="1" stroke-dasharray="3 2" filter="url(#sk)"/>
  <path d="M 459 162 L 459 214" stroke="#b85450" stroke-width="1" stroke-dasharray="3 2" filter="url(#sk)"/>
  <path d="M 607 162 L 607 214" stroke="#b85450" stroke-width="1" stroke-dasharray="3 2" filter="url(#sk)"/>

  <!-- algorithm box -->
  <g filter="url(#sk)">
    <rect x="60" y="262" width="740" height="48" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="80" y="284" font-size="12" font-weight="bold" fill="#2b6e9e">算法：排序去重 → 维护 cur=lower → 遇到 nums 中的数 v：若 v&gt;cur 则输出 [cur, v−1]，cur=v+1 → 末尾若 cur≤upper 输出 [cur,upper]</text>
  <text x="80" y="302" font-size="11" fill="#666">时间 O(n log n)，空间 O(n)；范围外与重复值先剔除</text>
</svg>
