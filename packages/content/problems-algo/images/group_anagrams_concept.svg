<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：把「签名相同」的串归入同一桶</text>

  <!-- Input strings column label -->
  <text x="53" y="54" text-anchor="middle" font-size="11" fill="#888">输入 strs</text>

  <!-- Input cells: eat, tea, tan, ate, nat, bat -->
  <!-- eat -> aet (blue) -->
  <rect x="24" y="66" width="58" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="53" y="85" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">eat</text>
  <!-- tea -> aet (blue) -->
  <rect x="24" y="104" width="58" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="53" y="123" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">tea</text>
  <!-- tan -> ant (green) -->
  <rect x="24" y="142" width="58" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="53" y="161" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">tan</text>
  <!-- ate -> aet (blue) -->
  <rect x="24" y="180" width="58" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="53" y="199" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">ate</text>
  <!-- nat -> ant (green) -->
  <rect x="24" y="218" width="58" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="53" y="237" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">nat</text>
  <!-- bat -> abt (orange) -->
  <rect x="24" y="256" width="58" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="53" y="275" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">bat</text>

  <!-- Arrows from inputs to buckets -->
  <path d="M 82 80 Q 220 80 352 104" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 82 118 Q 220 118 352 114" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 82 156 Q 220 156 352 206" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 82 194 Q 220 194 352 122" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 82 232 Q 220 232 352 220" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 82 270 Q 220 270 352 300" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Bucket aet (blue) -->
  <rect x="355" y="58" width="185" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="448" y="80" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">签名 = aet</text>
  <rect x="366" y="96" width="50" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="391" y="113" text-anchor="middle" font-size="11.5" fill="#333">eat</text>
  <rect x="423" y="96" width="50" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="448" y="113" text-anchor="middle" font-size="11.5" fill="#333">tea</text>
  <rect x="480" y="96" width="50" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="505" y="113" text-anchor="middle" font-size="11.5" fill="#333">ate</text>
  <text x="448" y="142" text-anchor="middle" font-size="10" fill="#888">map["aet"] → 3 项</text>

  <!-- Bucket ant (green) -->
  <rect x="355" y="178" width="185" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="448" y="200" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">签名 = ant</text>
  <rect x="380" y="212" width="50" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="405" y="229" text-anchor="middle" font-size="11.5" fill="#333">tan</text>
  <rect x="465" y="212" width="50" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="490" y="229" text-anchor="middle" font-size="11.5" fill="#333">nat</text>

  <!-- Bucket abt (orange) -->
  <rect x="355" y="272" width="185" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="448" y="294" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">签名 = abt</text>
  <rect x="423" y="300" width="50" height="24" fill="#ffffff" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="448" y="317" text-anchor="middle" font-size="11.5" fill="#333">bat</text>

  <!-- Footer key idea -->
  <rect x="30" y="346" width="500" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="363" text-anchor="middle" font-size="11.5" fill="#444">异位词 ⇔ 规范化签名相同 → 用签名做哈希 key 自动成组</text>
</svg>
