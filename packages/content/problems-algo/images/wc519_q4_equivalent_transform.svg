<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="640" height="440" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">核心转化:内部值三分类,只需看「&lt; nums[j] 的最大值」</text>

  <!-- ============ 合规对 ============ -->
  <text x="70" y="62" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓ (0, 2):3 &lt; 4,内部 {1} 不在 (3, 4) 内</text>
  <g filter="url(#rough2)">
    <rect x="100" y="74" width="50" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.4"/>
    <rect x="160" y="74" width="50" height="36" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2"/>
    <rect x="220" y="74" width="50" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
  </g>
  <text x="125" y="97" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">3</text>
  <text x="185" y="97" text-anchor="middle" font-size="14" fill="#777" filter="url(#rough2)">1</text>
  <text x="245" y="97" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">4</text>
  <text x="125" y="124" text-anchor="middle" font-size="10" font-weight="bold" fill="#446688" filter="url(#rough2)">i=0</text>
  <text x="185" y="124" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">k=1</text>
  <text x="245" y="124" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">j=2</text>
  <text x="330" y="97" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">1 ≤ 3:落在「≤ nums[i]」区 ✓</text>

  <!-- ============ 违规对 ============ -->
  <text x="70" y="156" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗ (0, 4):3 &lt; 5,但内部 4 ∈ (3, 5) 一票否决</text>
  <g filter="url(#rough2)">
    <rect x="100" y="168" width="50" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.4"/>
    <rect x="160" y="168" width="50" height="36" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2"/>
    <rect x="220" y="168" width="50" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
    <rect x="280" y="168" width="50" height="36" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2"/>
    <rect x="340" y="168" width="50" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
  </g>
  <text x="125" y="191" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">3</text>
  <text x="185" y="191" text-anchor="middle" font-size="14" fill="#777" filter="url(#rough2)">1</text>
  <text x="245" y="191" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">4</text>
  <text x="305" y="191" text-anchor="middle" font-size="14" fill="#777" filter="url(#rough2)">2</text>
  <text x="365" y="191" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">5</text>
  <text x="125" y="218" text-anchor="middle" font-size="10" font-weight="bold" fill="#446688" filter="url(#rough2)">i=0</text>
  <text x="245" y="218" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">违规</text>
  <text x="365" y="218" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">j=4</text>
  <text x="430" y="191" font-size="11.5" fill="#b85450" filter="url(#rough2)">4 &gt; 3 且 4 &lt; 5</text>

  <!-- ============ 数轴三分类 ============ -->
  <text x="320" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">内部值的归宿(以 nums[i]=3, nums[j]=5 为例)</text>
  <g filter="url(#rough2)">
    <rect x="80" y="268" width="170" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="250" y="268" width="140" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="390" y="268" width="170" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="165" y="286" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">≤ nums[i]=3:安全 ✓</text>
  <text x="320" y="286" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">(3, 5) 开区间:违规 ✗</text>
  <text x="475" y="286" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">≥ nums[j]=5:安全 ✓</text>
  <g filter="url(#rough2)">
    <circle cx="130" cy="316" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="300" cy="316" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <circle cx="180" cy="316" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="130" y="321" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="180" y="321" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="300" y="321" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">4</text>
  <text x="320" y="348" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">内部值 1、2、4 的落点:只有 4 落进开区间,该对被否决</text>

  <!-- ============ 公式框 ============ -->
  <rect x="40" y="364" width="560" height="62" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="388" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">影子对 ⟺ nums[i] &lt; nums[j] 且 max{ nums[k] : i&lt;k&lt;j, nums[k] &lt; nums[j] } ≤ nums[i]</text>
  <text x="320" y="410" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">≥ nums[j] 的内部值天然安全,只需盯住「&lt; nums[j] 的最大者」是否 ≤ nums[i]</text>
</svg>
