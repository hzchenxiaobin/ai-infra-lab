<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold">示例演算：按右端点排序后逐区间决策</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#888">原始 [[1,2],[2,3],[3,4],[1,3]] → 排序后 [[1,2],[2,3],[1,3],[3,4]]</text>

  <!-- bars: origin x=80, unit=80, values 1..4 -> x = 80+(v-1)*80 -->
  <!-- Step 0: [1,2] keep -->
  <text x="72" y="76" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold">①[1,2]</text>
  <rect x="80" y="60" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="120" y="79" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">保留</text>
  <text x="340" y="79" font-size="11" fill="#555">首个直接保留</text>
  <text x="480" y="79" font-size="11" fill="#d6a040" font-weight="bold">end=2, rm=0</text>

  <!-- Step 1: [2,3] keep -->
  <text x="72" y="112" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold">②[2,3]</text>
  <rect x="160" y="96" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="200" y="115" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">保留</text>
  <text x="340" y="115" font-size="11" fill="#555">2 ≥ 2 ✓ 不重叠</text>
  <text x="480" y="115" font-size="11" fill="#d6a040" font-weight="bold">end=3, rm=0</text>

  <!-- Step 2: [1,3] remove -->
  <text x="72" y="148" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold">③[1,3]</text>
  <rect x="80" y="132" width="160" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="151" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">移除</text>
  <text x="340" y="151" font-size="11" fill="#555">1 &lt; 3 ✗ 重叠</text>
  <text x="480" y="151" font-size="11" fill="#b85450" font-weight="bold">end=3, rm=1</text>

  <!-- Step 3: [3,4] keep -->
  <text x="72" y="184" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold">④[3,4]</text>
  <rect x="240" y="168" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="187" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">保留</text>
  <text x="340" y="187" font-size="11" fill="#555">3 ≥ 3 ✓ 不重叠</text>
  <text x="480" y="187" font-size="11" fill="#d6a040" font-weight="bold">end=4, rm=1</text>

  <!-- number line -->
  <line x1="80" y1="216" x2="332" y2="216" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 332 216 L 324 212 L 324 220 Z" fill="#888" filter="url(#rough2)"/>
  <g font-size="10.5" fill="#888" text-anchor="middle">
    <line x1="80" y1="212" x2="80" y2="222" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="80" y="236">1</text>
    <line x1="160" y1="212" x2="160" y2="222" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="160" y="236">2</text>
    <line x1="240" y1="212" x2="240" y2="222" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="240" y="236">3</text>
    <line x1="320" y1="212" x2="320" y2="222" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="320" y="236">4</text>
  </g>
  <text x="206" y="254" text-anchor="middle" font-size="10.5" fill="#888" font-style="italic">区间端点（端点相触不算重叠）</text>

  <!-- conclusion -->
  <rect x="40" y="272" width="440" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="293" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">保留 3 个：[1,2]、[2,3]、[3,4] 互不重叠</text>
  <text x="260" y="311" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">最少移除 = 1（移除 [1,3]）</text>
</svg>
