<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：异或全体 → 取区分位 → 分组异或 → 返回</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">两次遍历 O(n)，仅用常数变量 O(1)</text>

  <text x="150" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">主流程</text>
  <text x="420" y="68" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">分组异或子过程</text>

  <!-- ===== Main flow (left) ===== -->
  <!-- start -->
  <rect x="80" y="78" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="100" text-anchor="middle" font-size="11" fill="#3a5a2a">xor_all = 0</text>

  <path d="M 150 112 L 150 128" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- first loop -->
  <rect x="74" y="130" width="152" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="152" text-anchor="middle" font-size="10.5" fill="#3a4a66">for x: xor_all ^= x</text>

  <path d="M 150 164 L 150 180" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- xor_all result -->
  <rect x="70" y="182" width="160" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="150" y="204" text-anchor="middle" font-size="10.5" fill="#6a4a10" font-weight="bold">xor_all = a ⊕ b</text>

  <path d="M 150 216 L 150 232" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diff -->
  <rect x="60" y="234" width="180" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="150" y="256" text-anchor="middle" font-size="10.5" fill="#7a3a3a" font-weight="bold">diff = xor_all &amp; (-xor_all)</text>

  <path d="M 150 268 L 150 284" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- a = 0 -->
  <rect x="100" y="286" width="100" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="306" text-anchor="middle" font-size="11" fill="#3a5a2a">a = 0</text>

  <path d="M 150 316 L 150 330" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- second loop header -->
  <rect x="74" y="332" width="152" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="353" text-anchor="middle" font-size="10.5" fill="#3a4a66">for x in nums</text>

  <!-- call to right sub -->
  <path d="M 226 348 L 312 348" stroke="#b85450" stroke-width="1" fill="none" stroke-dasharray="2,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="342" text-anchor="middle" font-size="9" fill="#b85450">判断并累加</text>

  <!-- loop back to second loop header -->
  <path d="M 150 364 L 150 376 L 36 376 L 36 348 L 74 348" stroke="#666" stroke-width="1" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="40" y="392" font-size="9" fill="#888">x++ 继续</text>

  <!-- after second loop -->
  <path d="M 150 364 L 150 402" stroke="none"/>
  <rect x="56" y="404" width="188" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="150" y="420" text-anchor="middle" font-size="10.5" fill="#6a4a10">b = xor_all ^ a</text>
  <text x="150" y="432" text-anchor="middle" font-size="10.5" fill="#6a4a10" font-weight="bold">return [a, b]</text>

  <!-- ===== Partition sub (right) ===== -->
  <!-- decision diamond -->
  <polygon points="420,300 532,348 420,396 308,348" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="420" y="344" text-anchor="middle" font-size="10" fill="#6a4a10">x &amp; diff ≠ 0 ?</text>
  <text x="420" y="360" text-anchor="middle" font-size="9" fill="#888">（区分位是否为1）</text>

  <!-- yes branch -->
  <path d="M 420 396 L 420 414" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="408" font-size="10" fill="#4a7a3a">是</text>
  <rect x="328" y="416" width="184" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="420" y="436" text-anchor="middle" font-size="10.5" fill="#3a5a2a" font-weight="bold">a ^= x （分入组1）</text>

  <!-- no branch -->
  <path d="M 308 348 L 288 348" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="342" font-size="10" fill="#b85450">否</text>
  <rect x="300" y="290" width="56" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="328" y="308" text-anchor="middle" font-size="9.5" fill="#7a3a3a">跳过</text>

  <!-- ===== Summary ===== -->
  <rect x="300" y="78" width="220" height="200" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="410" y="100" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">为什么有效</text>
  <text x="312" y="122" font-size="10" fill="#555">• 全体异或：成对数抵消</text>
  <text x="312" y="140" font-size="10" fill="#555">  剩 a⊕b（非0）</text>
  <text x="312" y="162" font-size="10" fill="#555">• a≠b ⇒ a⊕b 至少一位为1</text>
  <text x="312" y="180" font-size="10" fill="#555">  该位上 a、b 必不同</text>
  <text x="312" y="202" font-size="10" fill="#555">• 按该位分组：</text>
  <text x="312" y="220" font-size="10" fill="#555">  成对数同组抵消</text>
  <text x="312" y="238" font-size="10" fill="#555">  落单数被拆到不同组</text>
  <text x="312" y="260" font-size="10" fill="#3a5a2a" font-weight="bold">⇒ 每组退化成 136 题</text>
</svg>
