<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrowL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="460" height="520" fill="#fafafa"/>

  <text x="230" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">颜色分类算法流程</text>

  <!-- Init -->
  <rect x="80" y="42" width="300" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="64" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">初始化</text>
  <text x="230" y="82" text-anchor="middle" font-size="11" fill="#555">p0 = 0,  i = 0,  p2 = n − 1</text>

  <path d="M 230 96 L 230 114" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Loop check -->
  <polygon points="230,118 350,162 230,206 110,162" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="158" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i ≤ p2 ?</text>
  <text x="230" y="176" text-anchor="middle" font-size="10.5" fill="#777">未扫描段非空？</text>

  <!-- No -> done -->
  <path d="M 350 162 L 410 162 L 410 250" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="372" y="154" font-size="11" fill="#b85450" font-weight="bold">No</text>
  <rect x="320" y="254" width="130" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="385" y="279" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">完成，返回</text>

  <!-- Yes down -->
  <path d="M 230 206 L 230 224" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="248" y="220" font-size="11" fill="#82b366" font-weight="bold">Yes</text>

  <!-- read -->
  <rect x="100" y="228" width="260" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="230" y="253" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">检查 nums[i]</text>

  <path d="M 230 268 L 230 286" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- 3-way diamond -->
  <polygon points="230,290 360,344 230,398 100,344" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="340" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">nums[i] = ?</text>
  <text x="230" y="358" text-anchor="middle" font-size="10.5" fill="#777">0 / 1 / 2</text>

  <!-- ==0 branch: left -->
  <path d="M 100 344 L 50 344 L 50 410" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="62" y="336" font-size="10.5" fill="#446688" font-weight="bold">== 0</text>
  <rect x="6" y="414" width="130" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="71" y="436" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">换到左端</text>
  <text x="71" y="454" text-anchor="middle" font-size="10.5" fill="#555">swap(i, p0)</text>
  <text x="71" y="470" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">p0++, i++</text>

  <!-- ==1 branch: center -->
  <path d="M 230 398 L 230 414" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="252" y="410" font-size="10.5" fill="#4a7a3a" font-weight="bold">== 1</text>
  <rect x="165" y="418" width="130" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="230" y="440" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">留在中间</text>
  <text x="230" y="458" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">i++（跳过）</text>

  <!-- ==2 branch: right -->
  <path d="M 360 344 L 410 344 L 410 410" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="378" y="336" font-size="10.5" fill="#b85450" font-weight="bold">== 2</text>
  <rect x="324" y="414" width="130" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="389" y="436" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">换到右端</text>
  <text x="389" y="454" text-anchor="middle" font-size="10.5" fill="#555">swap(i, p2)</text>
  <text x="389" y="470" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">p2−−，i 不动</text>

  <!-- loop back from ==0 and ==1 and ==2 -->
  <path d="M 71 476 L 71 162 L 110 162" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <path d="M 230 468 L 230 484 L 145 484 L 145 162 L 130 162" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <path d="M 389 476 L 389 498 L 90 498 L 90 162 L 110 162" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrowR)" filter="url(#rough2)"/>

  <text x="230" y="514" text-anchor="middle" font-size="11" fill="#d6a040" font-style="italic">三个分支都回到循环顶部；i 单调不减、p2 单调不增</text>
</svg>
