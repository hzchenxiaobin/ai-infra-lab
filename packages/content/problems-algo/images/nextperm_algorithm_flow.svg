<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="460" height="560" fill="#fafafa"/>

  <text x="230" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">下一个排列算法流程</text>

  <!-- Step 1: find i -->
  <rect x="60" y="44" width="340" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="66" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">① 从右往左找首个 nums[i] &lt; nums[i+1]</text>
  <text x="230" y="84" text-anchor="middle" font-size="10.5" fill="#555">i = n−2；while i≥0 且 nums[i]≥nums[i+1]：i−−</text>

  <path d="M 230 104 L 230 120" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Diamond: i >= 0 ? -->
  <polygon points="230,124 340,164 230,204 120,164" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="160" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i ≥ 0 ?</text>
  <text x="230" y="178" text-anchor="middle" font-size="10" fill="#777">找到升序对了？</text>

  <!-- No -> reverse whole, end -->
  <path d="M 340 164 L 410 164 L 410 244" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="352" y="156" font-size="11" fill="#b85450" font-weight="bold">No</text>
  <rect x="320" y="248" width="130" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="385" y="268" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">已最大排列</text>
  <text x="385" y="284" text-anchor="middle" font-size="10.5" fill="#555">reverse(整个数组)</text>

  <!-- Yes down -->
  <path d="M 230 204 L 230 220" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="248" y="216" font-size="11" fill="#82b366" font-weight="bold">Yes</text>

  <!-- Step 2: find j -->
  <rect x="60" y="224" width="280" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="200" y="246" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 右侧找首个 nums[j] &gt; nums[i]</text>
  <text x="200" y="264" text-anchor="middle" font-size="10.5" fill="#555">j = n−1；while nums[j]≤nums[i]：j−−</text>
  <text x="200" y="278" text-anchor="middle" font-size="10" fill="#888">（右侧降序，此即大于 nums[i] 的最小值）</text>

  <path d="M 200 284 L 200 300" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 3: swap -->
  <rect x="60" y="304" width="280" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="200" y="332" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">③ 交换 nums[i] 与 nums[j]</text>

  <path d="M 200 352 L 200 368" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 4: reverse right -->
  <rect x="60" y="372" width="280" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="200" y="394" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">④ 反转 nums[i+1 .. n−1]</text>
  <text x="200" y="412" text-anchor="middle" font-size="10.5" fill="#555">双指针首尾对换，降序→升序</text>

  <path d="M 200 426 L 200 446" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- End -->
  <rect x="120" y="450" width="160" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="200" y="475" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">完成（原地修改）</text>

  <!-- No-branch merge to end -->
  <path d="M 385 292 L 385 470 L 280 470" stroke="#888" stroke-width="1.8" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="396" y="384" font-size="9.5" fill="#888" transform="rotate(-90 396 384)">回绕到最小排列</text>

  <!-- footer note -->
  <rect x="30" y="506" width="400" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="230" y="524" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">三次线性扫描并列 → O(n) 时间</text>
  <text x="230" y="540" text-anchor="middle" font-size="10.5" fill="#888">常数指针变量 + 原地反转 → O(1) 额外空间</text>
</svg>
