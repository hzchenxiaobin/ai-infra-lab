<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrowL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="460" height="500" fill="#fafafa"/>

  <text x="230" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">移动零算法流程</text>

  <!-- Init -->
  <rect x="90" y="42" width="280" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="64" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">初始化</text>
  <text x="230" y="82" text-anchor="middle" font-size="11" fill="#555">slow = 0</text>

  <path d="M 230 96 L 230 114" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Loop check -->
  <polygon points="230,118 340,160 230,202 120,160" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="156" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">fast &lt; n ?</text>
  <text x="230" y="174" text-anchor="middle" font-size="10.5" fill="#777">还有未扫描元素？</text>

  <!-- No -> go to fill zeros -->
  <path d="M 340 160 L 400 160 L 400 300" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="360" y="152" font-size="11" fill="#b85450" font-weight="bold">No</text>

  <!-- Yes down -->
  <path d="M 230 202 L 230 220" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="248" y="216" font-size="11" fill="#82b366" font-weight="bold">Yes</text>

  <!-- read x -->
  <rect x="110" y="224" width="240" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="230" y="249" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">x = nums[fast]</text>

  <path d="M 230 264 L 230 282" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Diamond: x != 0 ? -->
  <polygon points="230,286 340,332 230,378 120,332" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="328" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">nums[fast] != 0 ?</text>
  <text x="230" y="346" text-anchor="middle" font-size="10.5" fill="#777">是非零吗？</text>

  <!-- Yes: write & slow++ -->
  <path d="M 120 332 L 50 332 L 50 392" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="70" y="324" font-size="11" fill="#4a7a3a" font-weight="bold">Yes</text>
  <rect x="6" y="396" width="140" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="76" y="418" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">搬运 + 推进</text>
  <text x="76" y="436" text-anchor="middle" font-size="10.5" fill="#555">nums[slow] = x</text>
  <text x="76" y="452" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">slow++, fast++</text>

  <!-- No: just fast++ -->
  <path d="M 340 332 L 400 332 L 400 392" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="360" y="324" font-size="11" fill="#b85450" font-weight="bold">No</text>
  <rect x="316" y="396" width="140" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="386" y="418" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">跳过</text>
  <text x="386" y="436" text-anchor="middle" font-size="10.5" fill="#555">什么都不做</text>
  <text x="386" y="452" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">fast++</text>

  <!-- fill zeros box (from No-of-loop) -->
  <rect x="290" y="304" width="220" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="400" y="324" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">扫描结束</text>
  <text x="400" y="340" text-anchor="middle" font-size="11" fill="#555">补零：[slow, n) = 0</text>

  <!-- loop back from both branches -->
  <path d="M 76 456 L 76 160 L 120 160" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <path d="M 386 456 L 386 470 L 250 470 L 250 210 L 250 202" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- final -->
  <text x="230" y="490" text-anchor="middle" font-size="11" fill="#d6a040" font-style="italic">O(n) 时间，O(1) 空间，原地保序</text>
</svg>
