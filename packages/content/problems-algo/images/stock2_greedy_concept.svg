<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：把每段上涨都吃掉 = 累加所有正向差分</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">prices=[7,1,5,3,6,4]，绿线为上涨段，灰线为下跌段</text>

  <!-- ===== axes ===== -->
  <line x1="60" y1="270" x2="520" y2="270" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="60" y1="70" x2="60" y2="270" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="50" y="74" font-size="9" fill="#999">价</text>
  <text x="516" y="284" font-size="9" fill="#999">天</text>

  <!-- ===== y ticks ===== -->
  <g font-size="9" fill="#aaa">
    <text x="52" y="120" text-anchor="end">7</text>
    <text x="52" y="250" text-anchor="end">1</text>
  </g>

  <!-- ===== price polyline: 7,1,5,3,6,4 ===== -->
  <!-- x: 100,180,260,340,420,500 ; y = 270 - p*22 -->
  <!-- p=7->116 ; p=1->248 ; p=5->160 ; p=3->204 ; p=6->138 ; p=4->182 -->

  <!-- down segments (gray) -->
  <path d="M 100 116 L 180 248" stroke="#bbb" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 260 160 L 340 204" stroke="#bbb" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 420 138 L 500 182" stroke="#bbb" stroke-width="2" fill="none" filter="url(#rough2)"/>

  <!-- up segments (green, emphasized) -->
  <path d="M 180 248 L 260 160" stroke="#4a7a3a" stroke-width="3" fill="none" filter="url(#rough2)"/>
  <path d="M 340 204 L 420 138" stroke="#4a7a3a" stroke-width="3" fill="none" filter="url(#rough2)"/>

  <!-- points + labels -->
  <g font-size="10" fill="#446688" font-weight="bold">
    <circle cx="100" cy="116" r="3.4" fill="#446688" filter="url(#rough2)"/>
    <text x="100" y="106" text-anchor="middle">7</text>
    <circle cx="180" cy="248" r="3.4" fill="#4a7a3a" filter="url(#rough2)"/>
    <text x="180" y="264" text-anchor="middle" fill="#4a7a3a">1</text>
    <circle cx="260" cy="160" r="3.4" fill="#b85450" filter="url(#rough2)"/>
    <text x="260" y="150" text-anchor="middle" fill="#b85450">5</text>
    <circle cx="340" cy="204" r="3.4" fill="#4a7a3a" filter="url(#rough2)"/>
    <text x="340" y="220" text-anchor="middle" fill="#4a7a3a">3</text>
    <circle cx="420" cy="138" r="3.4" fill="#b85450" filter="url(#rough2)"/>
    <text x="420" y="128" text-anchor="middle" fill="#b85450">6</text>
    <circle cx="500" cy="182" r="3.4" fill="#446688" filter="url(#rough2)"/>
    <text x="500" y="198" text-anchor="middle">4</text>
  </g>

  <!-- gain annotations -->
  <g font-size="11" fill="#4a7a3a" font-weight="bold">
    <rect x="198" y="196" width="64" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="230" y="210" text-anchor="middle">+4</text>
    <rect x="358" y="162" width="64" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="390" y="176" text-anchor="middle">+3</text>
  </g>
  <g font-size="9" fill="#999">
    <text x="140" y="190" text-anchor="middle">−6 ✗</text>
    <text x="300" y="190" text-anchor="middle">−2 ✗</text>
    <text x="460" y="166" text-anchor="middle">−2 ✗</text>
  </g>

  <!-- ===== formula band ===== -->
  <rect x="40" y="296" width="460" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="316" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold">收益 = Σ max(prices[i] − prices[i−1], 0)</text>
  <text x="270" y="334" text-anchor="middle" font-size="10" fill="#8a6a20">= 0 + 4 + 0 + 3 + 0 = 7</text>
</svg>
