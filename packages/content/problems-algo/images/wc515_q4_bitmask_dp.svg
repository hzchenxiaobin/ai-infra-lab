<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">电梯请求 III：状压 DP（TSP 型）</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">dp[mask][j] = 处理完 mask 中请求、最后在 j 的最早时间</text>

  <text x="40" y="72" font-size="11" fill="#333" font-weight="bold">n=9, start=0, requests=[[0,8],[6,5]]，2 个请求</text>

  <rect x="40" y="88" width="100" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="90" y="113" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">start=0</text>
  <text x="90" y="78" text-anchor="middle" font-size="10" fill="#888">t=0</text>

  <rect x="200" y="88" width="100" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="250" y="113" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">floor=5</text>
  <text x="250" y="78" text-anchor="middle" font-size="10" fill="#888">req[1] arr=6</text>

  <rect x="360" y="88" width="100" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="410" y="113" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">floor=8</text>
  <text x="410" y="78" text-anchor="middle" font-size="10" fill="#888">req[0] arr=0</text>

  <path d="M 140 108 L 200 108" stroke="#666" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="170" y="100" text-anchor="middle" font-size="10" fill="#666">5s</text>

  <path d="M 300 108 L 360 108" stroke="#666" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="330" y="100" text-anchor="middle" font-size="10" fill="#666">3s</text>

  <text x="40" y="150" font-size="11" fill="#333" font-weight="bold">DP 状态转移：</text>

  <rect x="30" y="162" width="500" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="183" font-size="10.5" fill="#333">初始: dp[{j}][j] = max(arrival[j], |floor[j] - start|)</text>

  <rect x="30" y="198" width="500" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="219" font-size="10.5" fill="#333">转移: dp[mask|1&lt;&lt;j][j] = min(dp[mask][i] + |floor[j]-floor[i]|, arrival[j])</text>

  <rect x="30" y="234" width="500" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="255" font-size="10.5" fill="#333">答案: min over j of dp[full_mask][j]</text>

  <text x="40" y="288" font-size="11" fill="#333" font-weight="bold">示例演算：</text>

  <rect x="30" y="298" width="500" height="26" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="316" font-size="10" fill="#555">dp[{0}][0] = max(0, |8-0|) = 8</text>

  <rect x="30" y="326" width="500" height="26" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="344" font-size="10" fill="#555">dp[{1}][1] = max(6, |5-0|) = 6 (到达时间5 &lt; arrival 6，需等)</text>

  <rect x="30" y="354" width="500" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="372" font-size="10" fill="#555">dp[{0,1}][0] = max(0, 6+|8-5|) = max(0, 9) = 9</text>

  <rect x="30" y="382" width="500" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="50" y="400" font-size="10" fill="#4a7a3a" font-weight="bold">答案 = 9（路径: 0→5(等至t=6)→8(t=9)）</text>
</svg>
