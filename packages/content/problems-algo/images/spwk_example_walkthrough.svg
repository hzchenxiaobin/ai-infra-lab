<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [10,5,2,6]，k = 100，求乘积 &lt; 100 的子数组个数</text>

  <!-- index labels -->
  <text x="40" y="52" font-size="11" fill="#888">下标:</text>
  <text x="132" y="52" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">0</text>
  <text x="182" y="52" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">1</text>
  <text x="232" y="52" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">2</text>
  <text x="282" y="52" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">3</text>

  <!-- char cells -->
  <rect x="110" y="58" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="132" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">10</text>
  <rect x="160" y="58" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="182" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <rect x="210" y="58" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="232" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="260" y="58" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="282" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>

  <!-- table header -->
  <text x="36" y="118" font-size="12" fill="#444" font-weight="bold">步骤</text>
  <text x="100" y="118" font-size="12" fill="#444" font-weight="bold">right</text>
  <text x="176" y="118" font-size="12" fill="#444" font-weight="bold">nums[right]</text>
  <text x="262" y="118" font-size="12" fill="#444" font-weight="bold">prod</text>
  <text x="340" y="118" font-size="12" fill="#444" font-weight="bold">动作</text>
  <text x="462" y="118" font-size="12" fill="#444" font-weight="bold">新增子数组</text>
  <text x="572" y="118" font-size="12" fill="#444" font-weight="bold">add</text>
  <text x="612" y="118" font-size="12" fill="#444" font-weight="bold">ans</text>

  <line x1="24" y1="124" x2="630" y2="124" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 1 -->
  <text x="36" y="146" font-size="11" fill="#333">1</text>
  <text x="100" y="146" font-size="11" fill="#333">0</text>
  <text x="176" y="146" font-size="11" fill="#333" font-weight="bold">10</text>
  <text x="262" y="146" font-size="11" fill="#333">10</text>
  <text x="340" y="146" font-size="11" fill="#82b366">10&lt;100, 加入</text>
  <text x="462" y="146" font-size="11" fill="#4a7a3a" font-weight="bold">[10]</text>
  <text x="572" y="146" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="612" y="146" font-size="11" fill="#333" font-weight="bold">1</text>

  <!-- Row 2 -->
  <text x="36" y="170" font-size="11" fill="#333">2</text>
  <text x="100" y="170" font-size="11" fill="#333">1</text>
  <text x="176" y="170" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="262" y="170" font-size="11" fill="#333">50</text>
  <text x="340" y="170" font-size="11" fill="#82b366">50&lt;100, 加入</text>
  <text x="462" y="170" font-size="11" fill="#4a7a3a" font-weight="bold">[5], [10,5]</text>
  <text x="572" y="170" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="612" y="170" font-size="11" fill="#333" font-weight="bold">3</text>

  <!-- Row 3 -->
  <text x="36" y="194" font-size="11" fill="#333">3</text>
  <text x="100" y="194" font-size="11" fill="#333">2</text>
  <text x="176" y="194" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="262" y="194" font-size="11" fill="#333">100→10</text>
  <text x="340" y="194" font-size="11" fill="#b85450">100≥100, 收缩÷10</text>
  <text x="462" y="194" font-size="11" fill="#d6a040" font-weight="bold">[2], [5,2]</text>
  <text x="572" y="194" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="612" y="194" font-size="11" fill="#333" font-weight="bold">5</text>

  <!-- Row 4 -->
  <text x="36" y="218" font-size="11" fill="#333">4</text>
  <text x="100" y="218" font-size="11" fill="#333">3</text>
  <text x="176" y="218" font-size="11" fill="#333" font-weight="bold">6</text>
  <text x="262" y="218" font-size="11" fill="#333">60</text>
  <text x="340" y="218" font-size="11" fill="#82b366">60&lt;100, 加入</text>
  <text x="462" y="218" font-size="11" fill="#4a7a3a" font-weight="bold">[6],[2,6],[5,2,6]</text>
  <text x="572" y="218" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="612" y="218" font-size="11" fill="#333" font-weight="bold">8 ⭐</text>

  <!-- result box -->
  <rect x="70" y="244" width="500" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="320" y="266" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">答案 = 8（= 1 + 2 + 2 + 3，按右端点 right 累加）</text>
  <text x="320" y="284" text-anchor="middle" font-size="11" fill="#888">每轮累加 right − left + 1：以 right 结尾的合法子数组个数</text>

  <!-- legend -->
  <rect x="70" y="306" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="90" y="317" font-size="11" fill="#555">加入(合法)</text>
  <rect x="180" y="306" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="200" y="317" font-size="11" fill="#555">收缩 left</text>
  <rect x="280" y="306" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="300" y="317" font-size="11" fill="#555">结果</text>
  <text x="380" y="317" font-size="11" fill="#888">⭐ = 最终答案</text>
</svg>
