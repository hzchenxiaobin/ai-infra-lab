<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="900" height="400" fill="#fdfcf7"/>
  <text x="450" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">离线 BIT：按 r 扫描求区间不同数个数</text>
  <path d="M 310 40 Q 450 48 590 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- positions -->
  <text x="60" y="78" font-size="12" fill="#888" font-weight="bold">下标 i：</text>
  <g font-size="11" font-family="monospace">
    <text x="140" y="78" text-anchor="middle">0</text>
    <text x="200" y="78" text-anchor="middle">1</text>
    <text x="260" y="78" text-anchor="middle">2</text>
    <text x="320" y="78" text-anchor="middle">3</text>
  </g>
  <text x="60" y="104" font-size="12" fill="#888" font-weight="bold">nums：</text>
  <g font-size="13" font-family="monospace" font-weight="bold">
    <g filter="url(#sk)"><rect x="116" y="88" width="48" height="32" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4"/></g>
    <text x="140" y="110" text-anchor="middle" fill="#2b4a6e">1</text>
    <g filter="url(#sk)"><rect x="176" y="88" width="48" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
    <text x="200" y="110" text-anchor="middle" fill="#2e6e2e">2</text>
    <g filter="url(#sk)"><rect x="236" y="88" width="48" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
    <text x="260" y="110" text-anchor="middle" fill="#2e6e2e">2</text>
    <g filter="url(#sk)"><rect x="296" y="88" width="48" height="32" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4"/></g>
    <text x="320" y="110" text-anchor="middle" fill="#2b4a6e">1</text>
  </g>

  <!-- BIT state snapshots -->
  <text x="60" y="146" font-size="12" font-weight="bold" fill="#2b2b2b">扫描时 BIT（每个下标存 1 表示该位置是"当前值的最后一次出现"）</text>

  <!-- i=0 -->
  <text x="60" y="172" font-size="11" fill="#444" font-weight="bold">i=0 (值1)：</text>
  <g font-size="12" font-family="monospace">
    <g filter="url(#sk)"><rect x="116" y="158" width="48" height="26" rx="3" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4"/></g>
    <text x="140" y="176" text-anchor="middle" fill="#2b4a6e" font-weight="bold">1</text>
    <text x="176" y="176" fill="#bbb">0</text>
    <text x="236" y="176" fill="#bbb">0</text>
    <text x="296" y="176" fill="#bbb">0</text>
  </g>
  <text x="370" y="176" font-size="10" fill="#888">last[1]=0</text>

  <!-- i=1 -->
  <text x="60" y="204" font-size="11" fill="#444" font-weight="bold">i=1 (值2)：</text>
  <g font-size="12" font-family="monospace">
    <g filter="url(#sk)"><rect x="116" y="190" width="48" height="26" rx="3" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4"/></g>
    <text x="140" y="208" text-anchor="middle" fill="#2b4a6e" font-weight="bold">1</text>
    <g filter="url(#sk)"><rect x="176" y="190" width="48" height="26" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
    <text x="200" y="208" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>
    <text x="236" y="208" fill="#bbb">0</text>
    <text x="296" y="208" fill="#bbb">0</text>
  </g>
  <text x="370" y="208" font-size="10" fill="#888">last[2]=1</text>

  <!-- i=2 -->
  <text x="60" y="236" font-size="11" fill="#444" font-weight="bold">i=2 (值2)：</text>
  <g font-size="12" font-family="monospace">
    <g filter="url(#sk)"><rect x="116" y="222" width="48" height="26" rx="3" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4"/></g>
    <text x="140" y="240" text-anchor="middle" fill="#2b4a6e" font-weight="bold">1</text>
    <g filter="url(#sk)"><rect x="176" y="222" width="48" height="26" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
    <text x="200" y="240" text-anchor="middle" fill="#bbb" style="text-decoration:line-through">1</text>
    <g filter="url(#sk)"><rect x="236" y="222" width="48" height="26" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
    <text x="260" y="240" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>
    <text x="296" y="240" fill="#bbb">0</text>
  </g>
  <text x="370" y="240" font-size="10" fill="#b85450">last[2]: 1→2（旧位置清零）</text>

  <!-- i=3 -->
  <text x="60" y="268" font-size="11" fill="#444" font-weight="bold">i=3 (值1)：</text>
  <g font-size="12" font-family="monospace">
    <g filter="url(#sk)"><rect x="116" y="254" width="48" height="26" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
    <text x="140" y="272" text-anchor="middle" fill="#bbb" style="text-decoration:line-through">1</text>
    <text x="176" y="272" fill="#bbb">0</text>
    <g filter="url(#sk)"><rect x="236" y="254" width="48" height="26" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
    <text x="260" y="272" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>
    <g filter="url(#sk)"><rect x="296" y="254" width="48" height="26" rx="3" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4"/></g>
    <text x="320" y="272" text-anchor="middle" fill="#2b4a6e" font-weight="bold">1</text>
  </g>
  <text x="370" y="272" font-size="10" fill="#b85450">last[1]: 0→3</text>

  <!-- query result -->
  <g filter="url(#sk)">
    <rect x="470" y="294" width="400" height="86" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="490" y="318" font-size="12" font-weight="bold" fill="#2b6e9e">查询 distinct(l, r)</text>
  <text x="490" y="340" font-size="11" fill="#444" font-family="monospace">= BIT 区间和 [l, r]</text>
  <text x="490" y="360" font-size="11" fill="#444" font-family="monospace">distinct(0,3) = 1+0+1+1 = 3? </text>
  <text x="490" y="376" font-size="10" fill="#b03a3a">→ 示例：BIT[0..3]={0,0,1,1} 和=2 ✓</text>

  <!-- note -->
  <g filter="url(#sk)">
    <rect x="60" y="294" width="390" height="86" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="80" y="318" font-size="12" font-weight="bold" fill="#2b2b2b">规则</text>
  <text x="80" y="340" font-size="11" fill="#444">每遇到值 v：BIT 在 i 处 +1</text>
  <text x="80" y="358" font-size="11" fill="#444">若 last[v] 存在：BIT 在 last[v] 处 −1</text>
  <text x="80" y="376" font-size="11" fill="#2e6e2e" font-weight="bold">区间和 = 不同值个数（每值只计最后一次）</text>
</svg>
