<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="16" fill="#444" font-weight="bold">单调栈六大题型：差异在「找什么」与「结算写什么」</text>
  <text x="320" y="48" text-anchor="middle" font-size="11" fill="#888">骨架统一为「遍历 + while 弹栈 + 入栈」，仅单调方向、栈内容、结算动作随题而变。</text>

  <!-- Row 1 -->
  <rect x="20" y="64" width="195" height="110" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="117" y="86" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">① 下一个更大</text>
  <text x="34" y="106" font-size="10.5" fill="#555" filter="url(#rough2)">找右侧第一个更大元素</text>
  <text x="34" y="122" font-size="10.5" fill="#555" filter="url(#rough2)">递减栈，存下标</text>
  <text x="34" y="138" font-size="10.5" fill="#b85450" filter="url(#rough2)">结算：res[top]=cur 值</text>
  <text x="34" y="154" font-size="10.5" fill="#b85450" filter="url(#rough2)">或 i-top（距离）</text>
  <text x="34" y="170" font-size="10" fill="#888" filter="url(#rough2)">739 / 496 / 503 / 901</text>

  <rect x="225" y="64" width="195" height="110" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="322" y="86" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 两侧更小（矩形）</text>
  <text x="239" y="106" font-size="10.5" fill="#555" filter="url(#rough2)">找左右第一个更小作边界</text>
  <text x="239" y="122" font-size="10.5" fill="#555" filter="url(#rough2)">递增栈，存下标</text>
  <text x="239" y="138" font-size="10.5" fill="#b85450" filter="url(#rough2)">结算：h×(i-newTop-1)</text>
  <text x="239" y="154" font-size="10.5" fill="#b85450" filter="url(#rough2)">出栈即右界，新栈顶左界</text>
  <text x="239" y="170" font-size="10" fill="#888" filter="url(#rough2)">84 / 85 / 42（柱高版）</text>

  <rect x="430" y="64" width="195" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="527" y="86" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">③ 移位造最小串</text>
  <text x="444" y="106" font-size="10.5" fill="#555" filter="url(#rough2)">删/留若干位使字典序最小</text>
  <text x="444" y="122" font-size="10.5" fill="#555" filter="url(#rough2)">递增栈（值小优先）+ 贪心</text>
  <text x="444" y="138" font-size="10.5" fill="#b85450" filter="url(#rough2)">结算：弹大的留小的</text>
  <text x="444" y="154" font-size="10.5" fill="#b85450" filter="url(#rough2)">配额/计数控制能否弹</text>
  <text x="444" y="170" font-size="10" fill="#888" filter="url(#rough2)">402 / 316 / 1081 / 321</text>

  <!-- Row 2 -->
  <rect x="20" y="186" width="195" height="110" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="117" y="208" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">④ 贡献计数</text>
  <text x="34" y="228" font-size="10.5" fill="#555" filter="url(#rough2)">求所有子数组 min/max 之和</text>
  <text x="34" y="244" font-size="10.5" fill="#555" filter="url(#rough2)">递增栈找两侧严格更小</text>
  <text x="34" y="260" font-size="10.5" fill="#b85450" filter="url(#rough2)">结算：arr[i]×L×R</text>
  <text x="34" y="276" font-size="10.5" fill="#b85450" filter="url(#rough2)">L/R = 左右选择数</text>
  <text x="34" y="292" font-size="10" fill="#888" filter="url(#rough2)">907 / 2104 / 1856</text>

  <rect x="225" y="186" width="195" height="110" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="322" y="208" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">⑤ 环形数组</text>
  <text x="239" y="228" font-size="10.5" fill="#555" filter="url(#rough2)">数组首尾相连，绕回找</text>
  <text x="239" y="244" font-size="10.5" fill="#555" filter="url(#rough2)">遍历 2n + i%n 取模</text>
  <text x="239" y="260" font-size="10.5" fill="#b85450" filter="url(#rough2)">第一遍又弹又入</text>
  <text x="239" y="276" font-size="10.5" fill="#b85450" filter="url(#rough2)">第二遍只弹不入（清残留）</text>
  <text x="239" y="292" font-size="10" fill="#888" filter="url(#rough2)">503 / 918 / 828（环形）</text>

  <rect x="430" y="186" width="195" height="110" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="527" y="208" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⑥ 在线跨度合并</text>
  <text x="444" y="228" font-size="10.5" fill="#555" filter="url(#rough2)">流式数据，向前数连续≤</text>
  <text x="444" y="244" font-size="10.5" fill="#555" filter="url(#rough2)">递减栈，存 (值, span)</text>
  <text x="444" y="260" font-size="10.5" fill="#b85450" filter="url(#rough2)">结算：累加被弹的 span</text>
  <text x="444" y="276" font-size="10.5" fill="#b85450" filter="url(#rough2)">把历史压缩成聚合段</text>
  <text x="444" y="292" font-size="10" fill="#888" filter="url(#rough2)">901 股票价格跨度</text>

  <!-- sibling techniques -->
  <text x="20" y="322" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">相邻技巧（易混但非单调栈）：</text>

  <rect x="20" y="336" width="300" height="56" fill="#fff" stroke="#888" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="34" y="356" font-size="10.5" fill="#555" filter="url(#rough2)">• 单调队列：滑动窗口最值（239）</text>
  <text x="34" y="372" font-size="10.5" fill="#555" filter="url(#rough2)">  队头额外支持「滑出窗口」的过期</text>
  <text x="34" y="386" font-size="10.5" fill="#888" filter="url(#rough2)">  单调栈只进出，无「过期」概念</text>

  <rect x="330" y="336" width="295" height="56" fill="#fff" stroke="#888" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="344" y="356" font-size="10.5" fill="#555" filter="url(#rough2)">• 栈模拟碰撞（735 行星碰撞）</text>
  <text x="344" y="372" font-size="10.5" fill="#555" filter="url(#rough2)">  按规则消耗栈顶，不维护单调性</text>
  <text x="344" y="386" font-size="10.5" fill="#888" filter="url(#rough2)">  「栈」只是容器，不是单调栈</text>

  <!-- bottom -->
  <rect x="20" y="402" width="605" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="322" y="422" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">识别信号词：「下一个更大/更小」「左右第一个更X」「移除 k 位使最小」「柱状图/矩阵矩形」</text>
  <text x="322" y="440" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">→ 一律先想单调栈。配额/计数/哨兵是三类常见「附加约束」。</text>
</svg>
