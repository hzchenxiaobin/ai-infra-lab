<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="480" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：sorted nums = [5,4,3,3,2,2,1], k=4, target=5</text>
  <text x="270" y="42" text-anchor="middle" font-size="11" fill="#888">降序后逐个装桶；红字 = 本步新放入的数；满桶标 =5 ✓</text>

  <!-- column headers -->
  <g font-size="10.5" fill="#888" text-anchor="middle">
    <text x="36" y="64">步</text>
    <text x="76" y="64">放入</text>
    <text x="135" y="64">桶0</text>
    <text x="245" y="64">桶1</text>
    <text x="355" y="64">桶2</text>
    <text x="465" y="64">桶3</text>
  </g>

  <!-- ===== step 1: place 5 -> bucket0 full ===== -->
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <text x="36" y="92" font-size="10.5" fill="#4a7a3a">1</text>
    <rect x="60" y="78" width="32" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="76" y="96" fill="#b85450">5</text>
    <rect x="90" y="74" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
    <text x="135" y="96" fill="#b85450">5</text>
    <text x="170" y="88" font-size="9" fill="#4a7a3a">=5✓</text>
    <rect x="200" y="74" width="90" height="34" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="6" filter="url(#rough2)"/>
    <text x="245" y="96" font-size="10" fill="#bbb">空</text>
    <rect x="310" y="74" width="90" height="34" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="6" filter="url(#rough2)"/>
    <text x="355" y="96" font-size="10" fill="#bbb">空</text>
    <rect x="420" y="74" width="90" height="34" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="6" filter="url(#rough2)"/>
    <text x="465" y="96" font-size="10" fill="#bbb">空</text>
  </g>

  <!-- ===== step 2: place 4 -> bucket1 ===== -->
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <text x="36" y="132" font-size="10.5" fill="#4a7a3a">2</text>
    <rect x="60" y="118" width="32" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="76" y="136" fill="#b85450">4</text>
    <rect x="90" y="114" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
    <text x="135" y="136" fill="#446688">5</text>
    <rect x="200" y="114" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
    <text x="245" y="136" fill="#b85450">4</text>
    <text x="278" y="126" font-size="9" fill="#d6a040">余1</text>
    <rect x="310" y="114" width="90" height="34" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="6" filter="url(#rough2)"/>
    <text x="355" y="136" font-size="10" fill="#bbb">空</text>
    <rect x="420" y="114" width="90" height="34" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="6" filter="url(#rough2)"/>
    <text x="465" y="136" font-size="10" fill="#bbb">空</text>
  </g>

  <!-- ===== step 3: place 3 -> bucket2 ===== -->
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <text x="36" y="172" font-size="10.5" fill="#4a7a3a">3</text>
    <rect x="60" y="158" width="32" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="76" y="176" fill="#b85450">3</text>
    <rect x="90" y="154" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
    <text x="135" y="176" fill="#446688">5</text>
    <rect x="200" y="154" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
    <text x="245" y="176" fill="#446688">4</text>
    <rect x="310" y="154" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
    <text x="355" y="176" fill="#b85450">3</text>
    <text x="388" y="166" font-size="9" fill="#d6a040">余2</text>
    <rect x="420" y="154" width="90" height="34" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="6" filter="url(#rough2)"/>
    <text x="465" y="176" font-size="10" fill="#bbb">空</text>
  </g>

  <!-- ===== step 4: place 3 -> bucket3 ===== -->
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <text x="36" y="212" font-size="10.5" fill="#4a7a3a">4</text>
    <rect x="60" y="198" width="32" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="76" y="216" fill="#b85450">3</text>
    <rect x="90" y="194" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
    <text x="135" y="216" fill="#446688">5</text>
    <rect x="200" y="194" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
    <text x="245" y="216" fill="#446688">4</text>
    <rect x="310" y="194" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
    <text x="355" y="216" fill="#446688">3</text>
    <rect x="420" y="194" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
    <text x="465" y="216" fill="#b85450">3</text>
    <text x="498" y="206" font-size="9" fill="#d6a040">余2</text>
  </g>

  <!-- ===== step 5: place 2 -> bucket2 full ===== -->
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <text x="36" y="252" font-size="10.5" fill="#4a7a3a">5</text>
    <rect x="60" y="238" width="32" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="76" y="256" fill="#b85450">2</text>
    <rect x="90" y="234" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
    <text x="135" y="256" fill="#446688">5</text>
    <rect x="200" y="234" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
    <text x="245" y="256" fill="#446688">4</text>
    <rect x="310" y="234" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
    <text x="345" y="256" fill="#446688">3,</text>
    <text x="368" y="256" fill="#b85450">2</text>
    <text x="390" y="246" font-size="9" fill="#4a7a3a">=5✓</text>
    <rect x="420" y="234" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
    <text x="465" y="256" fill="#446688">3</text>
  </g>

  <!-- ===== step 6: place 2 -> bucket3 full ===== -->
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <text x="36" y="292" font-size="10.5" fill="#4a7a3a">6</text>
    <rect x="60" y="278" width="32" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="76" y="296" fill="#b85450">2</text>
    <rect x="90" y="274" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
    <text x="135" y="296" fill="#446688">5</text>
    <rect x="200" y="274" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
    <text x="245" y="296" fill="#446688">4</text>
    <rect x="310" y="274" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
    <text x="345" y="296" fill="#446688">3,</text>
    <text x="368" y="296" fill="#446688">2</text>
    <rect x="420" y="274" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
    <text x="455" y="296" fill="#446688">3,</text>
    <text x="478" y="296" fill="#b85450">2</text>
    <text x="500" y="286" font-size="9" fill="#4a7a3a">=5✓</text>
  </g>

  <!-- ===== step 7: place 1 -> bucket1 full -> done ===== -->
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <text x="36" y="332" font-size="10.5" fill="#4a7a3a">7</text>
    <rect x="60" y="318" width="32" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="76" y="336" fill="#b85450">1</text>
    <rect x="90" y="314" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
    <text x="135" y="336" fill="#446688">5</text>
    <rect x="200" y="314" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
    <text x="235" y="336" fill="#446688">4,</text>
    <text x="258" y="336" fill="#b85450">1</text>
    <text x="280" y="326" font-size="9" fill="#4a7a3a">=5✓</text>
    <rect x="310" y="314" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
    <text x="345" y="336" fill="#446688">3,</text>
    <text x="368" y="336" fill="#446688">2</text>
    <rect x="420" y="314" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
    <text x="455" y="336" fill="#446688">3,</text>
    <text x="478" y="336" fill="#446688">2</text>
  </g>

  <!-- ===== conclusion ===== -->
  <rect x="40" y="364" width="460" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="270" y="386" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4 桶全满：{5}, {4,1}, {3,2}, {3,2}，每桶和 = 5</text>

  <!-- ===== why desc sort helps ===== -->
  <rect x="40" y="408" width="460" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="60" y="428" font-size="11" fill="#d6a040" font-weight="bold">为什么降序？</text>
  <text x="60" y="444" font-size="10.5" fill="#555">大数（5,4,3,3）先各占一桶且容易触发超容早剪枝；</text>
  <text x="60" y="458" font-size="10.5" fill="#555">小数（2,2,1）留到后段，灵活填满每桶剩余的 1~2 容量。</text>
</svg>
