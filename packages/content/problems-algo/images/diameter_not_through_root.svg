<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">直径不一定经过根：本例折弯点在 A</text>

  <!-- root edge (gray, not on diameter) -->
  <line x1="260" y1="67" x2="180" y2="119" stroke="#b0b0b0" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- diameter path D -> B -> A -> C -> E -->
  <path d="M 90 275 L 120 200 L 180 125 L 250 200 L 290 275" stroke="#b85450" stroke-width="3" fill="none" filter="url(#rough2)"/>

  <!-- nodes -->
  <circle cx="260" cy="55" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="60" text-anchor="middle" font-size="13" fill="#333">R</text>
  <text x="300" y="58" font-size="10" fill="#888">右子树为空</text>

  <circle cx="180" cy="125" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="180" y="130" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">A</text>
  <text x="180" y="160" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">折弯点</text>

  <circle cx="120" cy="200" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="120" y="205" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">B</text>

  <circle cx="250" cy="200" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="205" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">C</text>

  <circle cx="90" cy="275" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="90" y="280" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">D</text>

  <circle cx="290" cy="275" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="290" y="280" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">E</text>

  <!-- comparison boxes -->
  <rect x="30" y="305" width="225" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="142" y="324" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">只在根算：dfs(A)+0 = 3</text>
  <text x="142" y="340" text-anchor="middle" font-size="10" fill="#b85450">✗ 漏掉 A 处的更长路径</text>

  <rect x="265" y="305" width="225" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="377" y="324" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">每节点都更新：4</text>
  <text x="377" y="340" text-anchor="middle" font-size="10" fill="#4a7a3a">✓ 在 A 处取到 dfs(B)+dfs(C)=4</text>
</svg>
