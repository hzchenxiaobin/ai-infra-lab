<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">两步构造：中转点 M 与 M′ 至少一个在棋盘内</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">同色 ⟹ u, v 为整数；不同对角线 ⟹ u≠0 且 v≠0</text>

  <g filter="url(#rough2)">
    <rect x="40" y="70" width="208" height="208" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
  </g>

  <g filter="url(#rough2)" stroke="#dddddd" stroke-width="1">
    <line x1="66" y1="70" x2="66" y2="278"/>
    <line x1="92" y1="70" x2="92" y2="278"/>
    <line x1="118" y1="70" x2="118" y2="278"/>
    <line x1="144" y1="70" x2="144" y2="278"/>
    <line x1="170" y1="70" x2="170" y2="278"/>
    <line x1="196" y1="70" x2="196" y2="278"/>
    <line x1="40" y1="96" x2="248" y2="96"/>
    <line x1="40" y1="122" x2="248" y2="122"/>
    <line x1="40" y1="148" x2="248" y2="148"/>
    <line x1="40" y1="174" x2="248" y2="174"/>
    <line x1="40" y1="200" x2="248" y2="200"/>
    <line x1="40" y1="226" x2="248" y2="226"/>
    <line x1="40" y1="252" x2="248" y2="252"/>
  </g>

  <rect x="222" y="122" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="235" y="140" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">S</text>

  <rect x="196" y="200" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="209" y="218" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">T</text>

  <rect x="170" y="174" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="183" y="192" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">M′</text>

  <rect x="248" y="148" width="26" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="261" y="166" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">M</text>
  <text x="288" y="152" font-size="10" fill="#b85450">列 9 越界 ✗</text>

  <path d="M 222 148 L 186 180" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 176 194 L 200 206" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 236 150 L 256 162" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <text x="235" y="118" font-size="10" fill="#446688" text-anchor="middle">S=(3,8)</text>
  <text x="209" y="244" font-size="10" fill="#4a7a3a" text-anchor="middle">T=(6,7)</text>
  <text x="168" y="170" font-size="10" fill="#d6a040" text-anchor="middle">M′=(5,6) ✓</text>

  <rect x="300" y="70" width="246" height="132" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="423" y="94" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold">中转点构造（Δr, Δc 为位移）</text>
  <text x="316" y="118" font-size="11" fill="#333">u = (Δr + Δc) / 2，v = (Δr − Δc) / 2</text>
  <text x="316" y="140" font-size="11" fill="#333">M  = S + (u, u)：S→M 主对角，M→T (v,−v)</text>
  <text x="316" y="162" font-size="11" fill="#333">M′ = S + (v,−v)：S→M′ 副对角，M′→T (u,u)</text>
  <text x="316" y="188" font-size="10.5" fill="#666">u=0 ⟺ 同副对角线；v=0 ⟺ 同主对角线</text>

  <rect x="300" y="216" width="246" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="423" y="238" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">至少一个中转点在棋盘内</text>
  <text x="316" y="258" font-size="10.5" fill="#555">若 M、M′ 均越界 ⟹ u + v ≥ 9 &gt; |Δr|，矛盾</text>
  <text x="316" y="272" font-size="10.5" fill="#555">（WLOG 0 ≤ |Δc| &lt; |Δr|，两候选行坐标必合法）</text>

  <text x="280" y="316" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">本例：S=(3,8), T=(6,7)，Δr=3, Δc=−1 ⟹ u=1, v=2</text>
  <text x="280" y="336" text-anchor="middle" font-size="10.5" fill="#888">M=(4,9) 越界弃用；走 M′=(5,6)：两步到达</text>
</svg>
