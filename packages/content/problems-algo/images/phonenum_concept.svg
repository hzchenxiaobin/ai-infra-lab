<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：每位数字 = 一层多叉树，回溯即 DFS</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">digits="23" → 第 0 层 3 叉(abc) × 第 1 层 3 叉(def) = 9 个叶节点</text>

  <!-- ===== left: phone keypad ===== -->
  <text x="70" y="74" font-size="12" fill="#446688" font-weight="bold">电话键盘映射</text>
  <g font-size="10" fill="#333">
    <rect x="40" y="82" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
    <text x="52" y="98" font-family="monospace" font-size="11" fill="#446688" font-weight="bold">2</text>
    <text x="72" y="100" font-size="9" fill="#555">abc</text>
    <rect x="40" y="114" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
    <text x="52" y="130" font-family="monospace" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
    <text x="72" y="132" font-size="9" fill="#555">def</text>
    <rect x="40" y="146" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
    <text x="52" y="162" font-family="monospace" font-size="11" fill="#d6a040" font-weight="bold">7</text>
    <text x="72" y="164" font-size="9" fill="#555">pqrs</text>
    <rect x="40" y="178" width="56" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
    <text x="52" y="194" font-family="monospace" font-size="11" fill="#b85450" font-weight="bold">9</text>
    <text x="72" y="196" font-size="9" fill="#555">wxyz</text>
  </g>
  <text x="68" y="228" font-size="9" fill="#888" text-anchor="middle">2,3,4,5,6,8 → 3 字母</text>
  <text x="68" y="242" font-size="9" fill="#888" text-anchor="middle">7,9 → 4 字母</text>

  <!-- ===== right: multi-way tree ===== -->
  <text x="380" y="74" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">回溯树（digits="23"）</text>

  <!-- root -->
  <ellipse cx="380" cy="98" rx="26" ry="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="102" text-anchor="middle" font-size="10" font-weight="bold">""</text>
  <text x="380" y="82" text-anchor="middle" font-size="9" fill="#888">root</text>

  <!-- level 0: a,b,c -->
  <path d="M 368 110 Q 320 130 285 148" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="320" y="132" font-size="11" fill="#4a7a3a" font-weight="bold">a</text>
  <path d="M 380 112 L 380 148" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="392" y="134" font-size="11" fill="#4a7a3a" font-weight="bold">b</text>
  <path d="M 392 110 Q 440 130 475 148" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="448" y="132" font-size="11" fill="#4a7a3a" font-weight="bold">c</text>

  <ellipse cx="278" cy="158" rx="22" ry="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="278" y="162" text-anchor="middle" font-size="9" font-weight="bold">"a"</text>
  <ellipse cx="380" cy="158" rx="22" ry="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="380" y="162" text-anchor="middle" font-size="9" font-weight="bold">"b"</text>
  <ellipse cx="482" cy="158" rx="22" ry="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="482" y="162" text-anchor="middle" font-size="9" font-weight="bold">"c"</text>
  <text x="380" y="146" text-anchor="middle" font-size="8" fill="#888">第 0 位 ↓</text>

  <!-- level 1: each → d,e,f (leaves) -->
  <!-- from "a" -->
  <path d="M 268 168 Q 250 184 240 198" stroke="#d6a040" stroke-width="1.3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 278 170 L 278 198" stroke="#d6a040" stroke-width="1.3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 288 168 Q 306 184 316 198" stroke="#d6a040" stroke-width="1.3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="222" y="202" width="36" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="240" y="215" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">ad</text>
  <rect x="260" y="202" width="36" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="278" y="215" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">ae</text>
  <rect x="298" y="202" width="36" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="316" y="215" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">af</text>

  <!-- from "b" -->
  <path d="M 370 168 Q 352 184 342 198" stroke="#d6a040" stroke-width="1.3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 380 170 L 380 198" stroke="#d6a040" stroke-width="1.3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 390 168 Q 408 184 418 198" stroke="#d6a040" stroke-width="1.3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="324" y="202" width="36" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="342" y="215" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">bd</text>
  <rect x="362" y="202" width="36" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="380" y="215" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">be</text>
  <rect x="400" y="202" width="36" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="418" y="215" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">bf</text>

  <!-- from "c" -->
  <path d="M 472 168 Q 454 184 444 198" stroke="#d6a040" stroke-width="1.3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 482 170 L 482 198" stroke="#d6a040" stroke-width="1.3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 492 168 Q 510 184 520 198" stroke="#d6a040" stroke-width="1.3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="426" y="202" width="36" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="444" y="215" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">cd</text>
  <rect x="464" y="202" width="36" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="482" y="215" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">ce</text>
  <rect x="502" y="202" width="36" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="520" y="215" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">cf</text>
  <text x="380" y="194" text-anchor="middle" font-size="8" fill="#888">第 1 位 ↓ 收集</text>

  <!-- ===== key insight box ===== -->
  <rect x="40" y="258" width="520" height="104" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="300" y="280" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">回溯三步：选择 → 递归 → 撤销</text>
  <text x="60" y="302" font-size="11" fill="#555">① <tspan font-family="monospace" fill="#446688">path.append(ch)</tspan>　 选择当前位的某个字母</text>
  <text x="60" y="320" font-size="11" fill="#555">② <tspan font-family="monospace" fill="#446688">dfs(i+1)</tspan>　　　 进入下一位继续选</text>
  <text x="60" y="338" font-size="11" fill="#555">③ <tspan font-family="monospace" fill="#446688">path.pop()</tspan>　　 撤销，让兄弟分支从同状态出发</text>
  <text x="60" y="354" font-size="10" fill="#888">无剪枝：每个叶节点都是合法答案；叶节点数 = 各位字母数之积</text>
</svg>
