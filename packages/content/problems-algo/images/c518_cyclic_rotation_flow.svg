<svg xmlns="http://www.w3.org/2000/svg" width="640" height="700" viewBox="0 0 640 700" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="640" height="700" fill="#fafafa"/>

  <text x="320" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：O(n) 滑动窗口</text>
  <path d="M 150 46 Q 320 54 490 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- step 1 -->
  <g filter="url(#rough2)"><rect x="170" y="70" width="300" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="320" y="92" text-anchor="middle" font-size="13" fill="#33526e" filter="url(#rough2)">读入 nums（n 为偶数）</text>
  <text x="320" y="112" text-anchor="middle" font-size="12" fill="#33526e" font-family="monospace" filter="url(#rough2)">h = n/2，total = Σ nums[i]</text>
  <path d="M 320 122 L 320 146" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2 -->
  <g filter="url(#rough2)"><rect x="170" y="152" width="300" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="320" y="174" text-anchor="middle" font-size="13" fill="#33526e" filter="url(#rough2)">初始化窗口 W = nums[0..h−1] 之和</text>
  <text x="320" y="194" text-anchor="middle" font-size="12" fill="#33526e" font-family="monospace" filter="url(#rough2)">ans = 0</text>
  <path d="M 320 204 L 320 228" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop diamond -->
  <g filter="url(#rough2)"><polygon points="320,236 470,278 320,320 170,278" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="320" y="274" text-anchor="middle" font-size="12" fill="#8a6510" font-family="monospace" filter="url(#rough2)">r = 0 .. n−1</text>
  <text x="320" y="292" text-anchor="middle" font-size="12" fill="#8a6510" font-family="monospace" filter="url(#rough2)">2·W &gt; total ?</text>

  <!-- yes branch -->
  <path d="M 470 278 L 530 278" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="536" y="252" width="84" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="578" y="274" text-anchor="middle" font-size="12" fill="#2e5e2e" filter="url(#rough2)">是：好移位</text>
  <text x="578" y="292" text-anchor="middle" font-size="12" fill="#2e5e2e" font-family="monospace" filter="url(#rough2)">ans++</text>
  <path d="M 578 304 L 578 420 Q 578 436 560 436 L 480 436" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- no branch -->
  <path d="M 320 320 L 320 356" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="336" y="344" font-size="11" fill="#888" filter="url(#rough2)">否</text>

  <!-- update -->
  <g filter="url(#rough2)"><rect x="130" y="362" width="380" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="320" y="384" text-anchor="middle" font-size="13" fill="#8a3540" filter="url(#rough2)">滑动窗口右移一步</text>
  <text x="320" y="404" text-anchor="middle" font-size="12" fill="#8a3540" font-family="monospace" filter="url(#rough2)">W = W − nums[r] + nums[(r+h) mod n]</text>

  <!-- loop back -->
  <path d="M 130 388 L 100 388 Q 84 388 84 372 L 84 278 L 164 278" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="92" y="260" font-size="11" fill="#666" filter="url(#rough2)">r+1</text>

  <!-- loop done -->
  <path d="M 320 414 L 320 448" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="336" y="438" font-size="11" fill="#888" filter="url(#rough2)">r 扫完 n 个起点</text>

  <!-- return -->
  <g filter="url(#rough2)"><rect x="190" y="454" width="260" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="320" y="484" text-anchor="middle" font-size="13" fill="#2e5e2e" font-weight="bold" font-family="monospace" filter="url(#rough2)">return ans</text>

  <!-- complexity box -->
  <g filter="url(#rough2)"><rect x="110" y="540" width="420" height="110" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/></g>
  <text x="130" y="566" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">复杂度</text>
  <text x="130" y="590" font-size="12" fill="#444" font-family="monospace" filter="url(#rough2)">时间 O(n)：每个起点只做一次判断 + O(1) 递推</text>
  <text x="130" y="612" font-size="12" fill="#444" font-family="monospace" filter="url(#rough2)">空间 O(1)：只需 W、total、ans 三个变量</text>
  <text x="130" y="634" font-size="11" fill="#b85450" filter="url(#rough2)">⚠ total 最大 1e14，必须用 64 位整数（long long）</text>
</svg>
