<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="21"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </filter>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <text x="290" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">tasks=[1,4,4], shifts=[9,1,4]</text>
  <text x="290" y="50" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">total=9，P=[0,1,5,9]，m=3</text>

  <!-- axis -->
  <line x1="60" y1="100" x2="520" y2="100" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#446688">
    <circle cx="60" cy="100" r="3" fill="#446688"/><text x="60" y="120" text-anchor="middle">0</text>
    <circle cx="180" cy="100" r="3" fill="#446688"/><text x="180" y="120" text-anchor="middle">1</text>
    <circle cx="300" cy="100" r="3" fill="#446688"/><text x="300" y="120" text-anchor="middle">5</text>
    <circle cx="420" cy="100" r="3" fill="#b85450"/><text x="420" y="120" text-anchor="middle" fill="#b85450">9</text>
  </g>
  <text x="445" y="120" font-size="11" fill="#888" filter="url(#rough2)">= total</text>

  <!-- shift 0 -->
  <text x="20" y="160" font-size="12" fill="#d6a040" filter="url(#rough2)">班次0 t=9</text>
  <path d="M60 145 L60 100" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="60" y="160" font-size="11" fill="#4a7a3a" filter="url(#rough2)">done 0→9 ≥total ✓ ans=0, done=0</text>

  <!-- shift 1 -->
  <text x="20" y="200" font-size="12" fill="#d6a040" filter="url(#rough2)">班次1 t=1</text>
  <path d="M60 185 L180 185 L180 100" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="200" font-size="11" fill="#b85450" filter="url(#rough2)">done 0→1 &lt;9；upper_bound(P,1)=2 → current=1</text>
  <text x="200" y="218" font-size="11" fill="#b85450" filter="url(#rough2)">ans = 3−1 = 2</text>

  <!-- shift 2 -->
  <text x="20" y="255" font-size="12" fill="#d6a040" filter="url(#rough2)">班次2 t=4</text>
  <path d="M180 240 L300 240 L300 100" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="255" font-size="11" fill="#b85450" filter="url(#rough2)">done 1→5 &lt;9；upper_bound(P,5)=3 → current=2</text>
  <text x="320" y="273" font-size="11" fill="#b85450" filter="url(#rough2)">ans = 3−2 = 1</text>

  <!-- result -->
  <rect x="60" y="300" width="460" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="328" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">ans = [0, 2, 1] ✓</text>
  <text x="290" y="350" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">upper_bound 在前缀和数组上二分定位“当前任务下标”</text>
</svg>
