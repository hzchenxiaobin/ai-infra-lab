<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="880" height="540" fill="#fdfcf7"/>
  <text x="440" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例 1 演算：绕开死亡组合的最短路径</text>
  <path d="M 310 40 Q 440 48 570 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- deadends row -->
  <text x="34" y="74" font-size="12" font-weight="bold" fill="#b85450">死亡组合：</text>
  <g font-size="11" fill="#b85450" text-anchor="middle">
    <g filter="url(#sk)"><rect x="108" y="60" width="52" height="22" rx="5" fill="#fdecee" stroke="#b85450" stroke-width="1.2"/></g>
    <text x="134" y="75">0201</text>
    <g filter="url(#sk)"><rect x="166" y="60" width="52" height="22" rx="5" fill="#fdecee" stroke="#b85450" stroke-width="1.2"/></g>
    <text x="192" y="75">0101</text>
    <g filter="url(#sk)"><rect x="224" y="60" width="52" height="22" rx="5" fill="#fdecee" stroke="#b85450" stroke-width="1.2"/></g>
    <text x="250" y="75">0102</text>
    <g filter="url(#sk)"><rect x="282" y="60" width="52" height="22" rx="5" fill="#fdecee" stroke="#b85450" stroke-width="1.2"/></g>
    <text x="308" y="75">1212</text>
    <g filter="url(#sk)"><rect x="340" y="60" width="52" height="22" rx="5" fill="#fdecee" stroke="#b85450" stroke-width="1.2"/></g>
    <text x="366" y="75">2002</text>
  </g>
  <!-- target badge -->
  <g filter="url(#sk)"><rect x="730" y="58" width="118" height="26" rx="6" fill="#fff0f3" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="789" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">target = 0202 ⭐</text>

  <!-- ===== BLOCKED 4-step attempt ===== -->
  <text x="34" y="112" font-size="13" font-weight="bold" fill="#b85450">✗ 直走 4 步的尝试：中间态全是死锁</text>
  <!-- nodes: 0000 -> 0100 -> 0200 -> 0201(dead) ->> 0202 -->
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <g filter="url(#sk)"><rect x="78" y="130" width="64" height="32" rx="6" fill="#eef3fb" stroke="#446688" stroke-width="1.4"/></g>
    <text x="110" y="151" fill="#34506e">0000</text>
    <g filter="url(#sk)"><rect x="232" y="130" width="64" height="32" rx="6" fill="#eef3fb" stroke="#446688" stroke-width="1.4"/></g>
    <text x="264" y="151" fill="#34506e">0100</text>
    <g filter="url(#sk)"><rect x="386" y="130" width="64" height="32" rx="6" fill="#eef3fb" stroke="#446688" stroke-width="1.4"/></g>
    <text x="418" y="151" fill="#34506e">0200</text>
    <g filter="url(#sk)"><rect x="540" y="130" width="64" height="32" rx="6" fill="#fdecee" stroke="#b85450" stroke-width="1.8"/></g>
    <text x="572" y="151" fill="#b85450">0201</text>
    <g filter="url(#sk)"><rect x="700" y="130" width="64" height="32" rx="6" fill="#fff" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="3 2"/></g>
    <text x="732" y="151" fill="#aaaaaa">0202</text>
  </g>
  <!-- arrows -->
  <path d="M 142 146 L 232 146" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  <path d="M 296 146 L 386 146" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  <path d="M 450 146 L 540 146" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="495" y="140" text-anchor="middle" font-size="10" fill="#b85450">踏进死锁</text>
  <!-- 0201 -> 0202 blocked -->
  <path d="M 604 146 L 700 146" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4 3"/>
  <text x="652" y="140" text-anchor="middle" font-size="10" fill="#b85450">✗ 已锁死</text>
  <!-- X over 0201 -->
  <g stroke="#b85450" stroke-width="2" filter="url(#sk)"><line x1="546" y1="134" x2="598" y2="158"/><line x1="598" y1="134" x2="546" y2="158"/></g>
  <text x="440" y="186" text-anchor="middle" font-size="11" fill="#7a5415">第2位 0→2、第4位 0→2 各需 2 步 = 理论 4 步；但 0201 / 0101 / 0102 全是死锁，4 步路径全被堵死</text>

  <!-- ===== FOUND shortest path 6 steps ===== -->
  <text x="34" y="226" font-size="13" font-weight="bold" fill="#2e6e2e">✓ BFS 找到的最短路径：6 步（借第1位绕到「1xxx」层）</text>

  <!-- step numbers -->
  <g font-size="11" fill="#6a9a6a" text-anchor="middle">
    <text x="78" y="258">步 0</text><text x="198" y="258">步 1</text><text x="318" y="258">步 2</text>
    <text x="438" y="258">步 3</text><text x="558" y="258">步 4</text><text x="678" y="258">步 5</text>
    <text x="798" y="258" font-weight="bold" fill="#b85450">步 6</text>
  </g>

  <!-- path nodes -->
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <g filter="url(#sk)"><rect x="46" y="270" width="64" height="32" rx="6" fill="#eef3fb" stroke="#446688" stroke-width="1.4"/></g>
    <text x="78" y="291" fill="#34506e">0000</text>
    <g filter="url(#sk)"><rect x="166" y="270" width="64" height="32" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
    <text x="198" y="291" fill="#2e6e2e">1000</text>
    <g filter="url(#sk)"><rect x="286" y="270" width="64" height="32" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
    <text x="318" y="291" fill="#2e6e2e">1100</text>
    <g filter="url(#sk)"><rect x="406" y="270" width="64" height="32" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
    <text x="438" y="291" fill="#2e6e2e">1200</text>
    <g filter="url(#sk)"><rect x="526" y="270" width="64" height="32" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
    <text x="558" y="291" fill="#2e6e2e">1201</text>
    <g filter="url(#sk)"><rect x="646" y="270" width="64" height="32" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
    <text x="678" y="291" fill="#2e6e2e">1202</text>
    <g filter="url(#sk)"><rect x="766" y="270" width="64" height="32" rx="6" fill="#fff0f3" stroke="#b85450" stroke-width="2"/></g>
    <text x="798" y="291" fill="#b85450">0202</text>
  </g>
  <!-- arrows -->
  <g stroke="#4a8e4a" stroke-width="1.6" fill="none">
    <path d="M 110 286 L 166 286" marker-end="url(#arg)"/>
    <path d="M 230 286 L 286 286" marker-end="url(#arg)"/>
    <path d="M 350 286 L 406 286" marker-end="url(#arg)"/>
    <path d="M 470 286 L 526 286" marker-end="url(#arg)"/>
    <path d="M 590 286 L 646 286" marker-end="url(#arg)"/>
    <path d="M 710 286 L 766 286" marker-end="url(#arg)"/>
  </g>

  <!-- wheel-move annotations -->
  <g font-size="10.5" fill="#5a5a5a" text-anchor="middle">
    <text x="138" y="322">轮1:0→1</text>
    <text x="258" y="322">轮2:0→1</text>
    <text x="378" y="322">轮2:1→2</text>
    <text x="498" y="322">轮4:0→1</text>
    <text x="618" y="322">轮4:1→2</text>
    <text x="738" y="322">轮1:1→0</text>
  </g>

  <!-- explanation boxes -->
  <g filter="url(#sk)">
    <rect x="34" y="346" width="812" height="62" rx="8" fill="#fffdf3" stroke="#c9a93a" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="440" y="368" text-anchor="middle" font-size="11.5" fill="#7a5415">第 2、4 位各需 +2，但中间态 x1x1 / x2x1 / x1x2 恰是死锁 →</text>
  <text x="440" y="388" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">「借」第 1 位拨到 1，绕到 1xxx 层把第 2、4 位拨到位，再拨回 0：多花的 2 步 = 绕开禁区的代价</text>

  <text x="440" y="438" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">BFS 无需任何人工分析，按层扩展即可自动探索出这条最短路 —— 这正是「状态空间搜索」的威力</text>

  <!-- layer strip -->
  <g font-size="10.5" fill="#34506e" text-anchor="middle">
    <text x="78" y="468">层0</text><text x="198" y="468">层1</text><text x="318" y="468">层2</text>
    <text x="438" y="468">层3</text><text x="558" y="468">层4</text><text x="678" y="468">层5</text>
    <text x="798" y="468" font-weight="bold" fill="#b85450">层6 ⭐</text>
  </g>
  <text x="440" y="492" text-anchor="middle" font-size="10.5" fill="#6a9a6a">每个状态只入队一次 → BFS 首次访问 0202 的层数（6）即最少拨动次数</text>
  <text x="440" y="516" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">答案 = 6</text>
</svg>
