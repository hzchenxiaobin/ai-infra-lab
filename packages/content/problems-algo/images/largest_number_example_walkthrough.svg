<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [3, 30, 34, 5, 9]</text>

  <!-- Original array -->
  <text x="50" y="74" font-size="11.5" fill="#888" font-weight="bold">原始</text>
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <rect x="110" y="54" width="54" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="137" y="76" fill="#446688">3</text>
    <rect x="170" y="54" width="54" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="197" y="76" fill="#446688">30</text>
    <rect x="230" y="54" width="54" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="257" y="76" fill="#446688">34</text>
    <rect x="290" y="54" width="54" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="317" y="76" fill="#446688">5</text>
    <rect x="350" y="54" width="54" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="377" y="76" fill="#446688">9</text>
  </g>

  <!-- arrow + sort label -->
  <path d="M270,92 L270,116" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="285" y="108" font-size="10.5" fill="#888">按 a+b &gt; b+a 排序</text>

  <!-- Sorted array -->
  <text x="50" y="148" font-size="11.5" fill="#4a7a3a" font-weight="bold">排序后</text>
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <rect x="110" y="128" width="54" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="137" y="150" fill="#4a7a3a">9</text>
    <rect x="170" y="128" width="54" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="197" y="150" fill="#4a7a3a">5</text>
    <rect x="230" y="128" width="54" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="257" y="150" fill="#4a7a3a">34</text>
    <rect x="290" y="128" width="54" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="317" y="150" fill="#4a7a3a">3</text>
    <rect x="350" y="128" width="54" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="377" y="150" fill="#4a7a3a">30</text>
  </g>

  <!-- Key comparisons -->
  <rect x="40" y="180" width="460" height="128" fill="#f0f0f0" stroke="#888" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="60" y="202" font-size="12" fill="#333" font-weight="bold">关键比较（决定相邻顺序）：</text>

  <text x="60" y="226" font-size="12" fill="#446688">9 vs 5：</text>
  <text x="135" y="226" font-size="12" fill="#333">"95" &gt; "59"</text>
  <text x="250" y="226" font-size="12" fill="#4a7a3a" font-weight="bold">⇒ 9 在 5 前</text>

  <text x="60" y="250" font-size="12" fill="#446688">34 vs 3：</text>
  <text x="135" y="250" font-size="12" fill="#333">"343" &gt; "334"</text>
  <text x="250" y="250" font-size="12" fill="#4a7a3a" font-weight="bold">⇒ 34 在 3 前</text>

  <text x="60" y="274" font-size="12" fill="#446688">3 vs 30：</text>
  <text x="135" y="274" font-size="12" fill="#333">"330" &gt; "303"</text>
  <text x="250" y="274" font-size="12" fill="#4a7a3a" font-weight="bold">⇒ 3 在 30 前</text>

  <text x="60" y="298" font-size="10.5" fill="#888">注：3 排在 30 前，正是字典序会判反的反例</text>

  <!-- Final result -->
  <rect x="40" y="324" width="460" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="346" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">拼接：9 5 34 3 30 → "9534330"</text>
  <text x="270" y="366" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">首位 "9" ≠ "0"，返回 "9534330" ✓</text>
</svg>
