<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="430" fill="#fafafa"/>

  <text x="300" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：nums = [1,1,2,3,3,4,4,8,8]</text>

  <!-- ===== Row 1 ===== -->
  <text x="36" y="118" font-size="13" fill="#555" filter="url(#rough2)">第 1 轮</text>
  <g font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">
    <text x="91" y="82">0</text><text x="137" y="82">1</text><text x="183" y="82">2</text>
    <text x="229" y="82">3</text><text x="275" y="82">4</text><text x="321" y="82">5</text>
    <text x="367" y="82">6</text><text x="413" y="82">7</text><text x="459" y="82">8</text>
  </g>
  <!-- markers L R M -->
  <g font-size="13" font-weight="bold" text-anchor="middle" filter="url(#rough2)">
    <text x="91" y="66" fill="#446688">L</text>
    <text x="275" y="66" fill="#d6a040">M</text>
    <text x="459" y="66" fill="#4a7a3a">R</text>
  </g>
  <g fill="none" stroke-width="1.2" filter="url(#rough2)">
    <path d="M91 70 L91 90" stroke="#446688"/>
    <path d="M275 70 L275 90" stroke="#d6a040"/>
    <path d="M459 70 L459 90" stroke="#4a7a3a"/>
  </g>
  <g stroke-width="1.5" filter="url(#rough2)">
    <rect x="70" y="92" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="116" y="92" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="162" y="92" width="42" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="208" y="92" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="254" y="92" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="300" y="92" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="346" y="92" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="392" y="92" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="438" y="92" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="91" y="120">1</text><text x="137" y="120">1</text>
    <text x="183" y="120" fill="#b85450" font-weight="bold">2</text>
    <text x="229" y="120">3</text><text x="275" y="120">3</text>
    <text x="321" y="120">4</text><text x="367" y="120">4</text>
    <text x="413" y="120">8</text><text x="459" y="120">8</text>
  </g>
  <text x="560" y="110" font-size="11" fill="#5a3a00" filter="url(#rough2)">mid=4(偶)</text>
  <text x="560" y="126" font-size="11" fill="#5a3a00" filter="url(#rough2)">3 ≠ 4</text>
  <text x="70" y="156" font-size="12" fill="#b85450" filter="url(#rough2)">配对错位 → right = mid = 4</text>

  <!-- ===== Row 2 ===== -->
  <text x="36" y="238" font-size="13" fill="#555" filter="url(#rough2)">第 2 轮</text>
  <g font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">
    <text x="91" y="202">0</text><text x="137" y="202">1</text><text x="183" y="202">2</text>
    <text x="229" y="202">3</text><text x="275" y="202">4</text><text x="321" y="202">5</text>
    <text x="367" y="202">6</text><text x="413" y="202">7</text><text x="459" y="202">8</text>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle" filter="url(#rough2)">
    <text x="91" y="186" fill="#446688">L</text>
    <text x="183" y="186" fill="#d6a040">M</text>
    <text x="275" y="186" fill="#4a7a3a">R</text>
  </g>
  <g fill="none" stroke-width="1.2" filter="url(#rough2)">
    <path d="M91 190 L91 210" stroke="#446688"/>
    <path d="M183 190 L183 210" stroke="#d6a040"/>
    <path d="M275 190 L275 210" stroke="#4a7a3a"/>
  </g>
  <g stroke-width="1.5" filter="url(#rough2)">
    <rect x="70" y="212" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="116" y="212" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="162" y="212" width="42" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="208" y="212" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="254" y="212" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="300" y="212" width="42" height="42" rx="4" fill="#eee" stroke="#bbb" stroke-dasharray="3 2"/>
    <rect x="346" y="212" width="42" height="42" rx="4" fill="#eee" stroke="#bbb" stroke-dasharray="3 2"/>
    <rect x="392" y="212" width="42" height="42" rx="4" fill="#eee" stroke="#bbb" stroke-dasharray="3 2"/>
    <rect x="438" y="212" width="42" height="42" rx="4" fill="#eee" stroke="#bbb" stroke-dasharray="3 2"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="91" y="240">1</text><text x="137" y="240">1</text>
    <text x="183" y="240" fill="#b85450" font-weight="bold">2</text>
    <text x="229" y="240">3</text><text x="275" y="240">3</text>
    <text x="321" y="240" fill="#aaa">4</text><text x="367" y="240" fill="#aaa">4</text>
    <text x="413" y="240" fill="#aaa">8</text><text x="459" y="240" fill="#aaa">8</text>
  </g>
  <text x="560" y="230" font-size="11" fill="#5a3a00" filter="url(#rough2)">mid=2(偶)</text>
  <text x="560" y="246" font-size="11" fill="#5a3a00" filter="url(#rough2)">2 ≠ 3</text>
  <text x="70" y="276" font-size="12" fill="#b85450" filter="url(#rough2)">配对错位 → right = mid = 2</text>

  <!-- ===== Row 3 ===== -->
  <text x="36" y="358" font-size="13" fill="#555" filter="url(#rough2)">第 3 轮</text>
  <g font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">
    <text x="91" y="322">0</text><text x="137" y="322">1</text><text x="183" y="322">2</text>
    <text x="229" y="322">3</text><text x="275" y="322">4</text><text x="321" y="322">5</text>
    <text x="367" y="322">6</text><text x="413" y="322">7</text><text x="459" y="322">8</text>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle" filter="url(#rough2)">
    <text x="84" y="306" fill="#446688">L</text>
    <text x="100" y="306" fill="#d6a040">M</text>
    <text x="183" y="306" fill="#4a7a3a">R</text>
  </g>
  <g fill="none" stroke-width="1.2" filter="url(#rough2)">
    <path d="M91 310 L91 330" stroke="#446688"/>
    <path d="M183 310 L183 330" stroke="#4a7a3a"/>
  </g>
  <g stroke-width="1.5" filter="url(#rough2)">
    <rect x="70" y="332" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="116" y="332" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="162" y="332" width="42" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="208" y="332" width="42" height="42" rx="4" fill="#eee" stroke="#bbb" stroke-dasharray="3 2"/>
    <rect x="254" y="332" width="42" height="42" rx="4" fill="#eee" stroke="#bbb" stroke-dasharray="3 2"/>
    <rect x="300" y="332" width="42" height="42" rx="4" fill="#eee" stroke="#bbb" stroke-dasharray="3 2"/>
    <rect x="346" y="332" width="42" height="42" rx="4" fill="#eee" stroke="#bbb" stroke-dasharray="3 2"/>
    <rect x="392" y="332" width="42" height="42" rx="4" fill="#eee" stroke="#bbb" stroke-dasharray="3 2"/>
    <rect x="438" y="332" width="42" height="42" rx="4" fill="#eee" stroke="#bbb" stroke-dasharray="3 2"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="91" y="360">1</text><text x="137" y="360">1</text>
    <text x="183" y="360" fill="#b85450" font-weight="bold">2</text>
    <text x="229" y="360" fill="#aaa">3</text><text x="275" y="360" fill="#aaa">3</text>
    <text x="321" y="360" fill="#aaa">4</text><text x="367" y="360" fill="#aaa">4</text>
    <text x="413" y="360" fill="#aaa">8</text><text x="459" y="360" fill="#aaa">8</text>
  </g>
  <text x="560" y="350" font-size="11" fill="#5a3a00" filter="url(#rough2)">mid=1 奇</text>
  <text x="560" y="366" font-size="11" fill="#5a3a00" filter="url(#rough2)">→mid=0</text>
  <text x="70" y="396" font-size="12" fill="#4a7a3a" filter="url(#rough2)">mid 调整为 0，nums[0]=1 == nums[1]=1 → 配对正常 → left = mid + 2 = 2</text>

  <!-- end -->
  <text x="300" y="422" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">left == right == 2 → 返回 nums[2] = 2 ✓</text>
</svg>
