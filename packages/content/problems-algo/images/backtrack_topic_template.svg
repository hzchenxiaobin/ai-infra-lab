<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">回溯通用模板：路径 + 选择列表 + 终止条件</text>

  <!-- ===== Left: code block ===== -->
  <rect x="30" y="50" width="300" height="360" fill="#ffffff" stroke="#bbb" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="44" y="72" font-size="11" fill="#888" filter="url(#rough2)">backtrack(路径, 选择列表):</text>

  <text x="44" y="98" font-size="11" fill="#b85450" filter="url(#rough2)">  if 满足终止条件:</text>
  <text x="60" y="115" font-size="11" fill="#555" filter="url(#rough2)">    res.add(路径的拷贝);</text>
  <text x="60" y="132" font-size="11" fill="#555" filter="url(#rough2)">    return;</text>

  <text x="44" y="160" font-size="11" fill="#4a7a3a" filter="url(#rough2)">  for 选择 in 选择列表:</text>
  <text x="60" y="178" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">    ① 做选择   (路径.add; 标记)</text>
  <text x="60" y="196" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">    ② backtrack(下一层)</text>
  <text x="60" y="214" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">    ③ 撤销选择 (路径.pop; 取消)</text>

  <line x1="44" y1="240" x2="316" y2="240" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="44" y="260" font-size="10" fill="#888" filter="url(#rough2)">关键三件套：</text>
  <text x="44" y="278" font-size="11" fill="#446688" filter="url(#rough2)">• path：当前已选的路径（栈）</text>
  <text x="44" y="296" font-size="11" fill="#4a7a3a" filter="url(#rough2)">• 选择列表：本层可选的候选</text>
  <text x="44" y="314" font-size="11" fill="#d6a040" filter="url(#rough2)">• 终止条件：path 满什么时收集</text>

  <rect x="40" y="338" width="280" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="54" y="358" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">⚠ 收集结果必须拷贝</text>
  <text x="54" y="374" font-size="10" fill="#888" filter="url(#rough2)">C++ push_back 自动拷贝；</text>
  <text x="54" y="388" font-size="10" fill="#888" filter="url(#rough2)">Python 必须 res.append(path[:])</text>

  <!-- ===== Right: three pieces ===== -->
  <text x="380" y="66" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">三个要素随题型变化：</text>

  <!-- path -->
  <rect x="360" y="82" width="250" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="485" y="102" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">path（路径）</text>
  <text x="370" y="120" font-size="10" fill="#666" filter="url(#rough2)">排列/组合/子集 → List[int]</text>
  <text x="370" y="134" font-size="10" fill="#666" filter="url(#rough2)">分割 IP/回文串 → List[String]</text>

  <path d="M 485 138 L 485 152" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- choice list -->
  <rect x="360" y="156" width="250" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="485" y="176" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">选择列表（本层 for 循环）</text>
  <text x="370" y="194" font-size="10" fill="#666" filter="url(#rough2)">全排列: 未 used 的全部候选</text>
  <text x="370" y="208" font-size="10" fill="#666" filter="url(#rough2)">组合/子集: start..n（靠 start 去重）</text>
  <text x="370" y="222" font-size="10" fill="#666" filter="url(#rough2)">数独/N皇后: 合法位置集合</text>

  <path d="M 485 226 L 485 240" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- termination -->
  <rect x="360" y="244" width="250" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="485" y="264" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">终止条件</text>
  <text x="370" y="282" font-size="10" fill="#666" filter="url(#rough2)">排列: path.size()==n</text>
  <text x="370" y="296" font-size="10" fill="#666" filter="url(#rough2)">组合/分割: 到串末尾就收</text>

  <!-- arrow back to path -->
  <path d="M 360 276 L 320 276 L 320 110 L 360 110" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- key insight box -->
  <rect x="360" y="324" width="250" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="485" y="344" text-anchor="middle" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">题型差异 = 选择列表怎么定</text>
  <text x="372" y="364" font-size="10" fill="#666" filter="url(#rough2)">排列: 顺序重要 → 每层扫全部</text>
  <text x="372" y="380" font-size="10" fill="#666" filter="url(#rough2)">组合/子集: 顺序不重要 → 加 start</text>
  <text x="372" y="396" font-size="10" fill="#666" filter="url(#rough2)">           start 只增不减天然去重</text>

  <text x="320" y="442" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">记住这套骨架，所有回溯题只是「换选择列表 + 换终止条件 + 加剪枝」</text>
</svg>
