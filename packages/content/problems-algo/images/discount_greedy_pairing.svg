<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="ar" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#b85450"/></marker>
  </defs>
  <rect width="580" height="360" fill="#fafafa"/>
  <text x="290" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#r)">贪心配对：大折扣配大价格（重排不等式）</text>

  <!-- prices row (sorted desc) -->
  <text x="30" y="78" font-size="12" fill="#446688" font-weight="bold" filter="url(#r)">价格降序 p↓</text>
  <g filter="url(#r)" font-size="12">
    <rect x="110" y="58" width="70" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="145" y="79" text-anchor="middle" fill="#333">30</text>
    <rect x="190" y="58" width="70" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="225" y="79" text-anchor="middle" fill="#333">21</text>
    <rect x="270" y="58" width="70" height="32" rx="5" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" stroke-dasharray="4 3"/>
    <text x="305" y="79" text-anchor="middle" fill="#888">10</text>
    <text x="360" y="79" fill="#888" font-size="11">（无折扣可用）</text>
  </g>

  <!-- discounts row (sorted desc) -->
  <text x="30" y="158" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#r)">折扣降序 d↓</text>
  <g filter="url(#r)" font-size="12">
    <rect x="110" y="138" width="70" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="145" y="159" text-anchor="middle" fill="#333">60%</text>
    <rect x="190" y="138" width="70" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="225" y="159" text-anchor="middle" fill="#333">50%</text>
  </g>

  <!-- pairing arrows -->
  <path d="M145 92 L145 134" stroke="#b85450" stroke-width="1.8" marker-end="url(#ar)" filter="url(#r)"/>
  <path d="M225 92 L225 134" stroke="#b85450" stroke-width="1.8" marker-end="url(#ar)" filter="url(#r)"/>

  <!-- result row -->
  <text x="30" y="230" font-size="12" fill="#b85450" font-weight="bold" filter="url(#r)">最终价</text>
  <g filter="url(#r)" font-size="12">
    <rect x="110" y="210" width="70" height="32" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="145" y="231" text-anchor="middle" fill="#b85450" font-weight="bold">12.0</text>
    <rect x="190" y="210" width="70" height="32" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="225" y="231" text-anchor="middle" fill="#b85450" font-weight="bold">10.5</text>
    <rect x="270" y="210" width="70" height="32" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="305" y="231" text-anchor="middle" fill="#d6a040" font-weight="bold">10</text>
  </g>
  <text x="370" y="231" font-size="12" fill="#333" filter="url(#r)">合计 = 32.5 ✓</text>

  <!-- key insight box -->
  <rect x="30" y="262" width="520" height="82" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#r)"/>
  <text x="48" y="286" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#r)">核心观察（重排不等式）</text>
  <text x="48" y="306" font-size="11" fill="#333" filter="url(#r)">要让 ∑ p·d/100 最大 ⇒ 同序配对：最大 p 配最大 d</text>
  <text x="48" y="324" font-size="11" fill="#333" filter="url(#r)">配对数 k = min(n, m)；折扣 d≥1 恒使价格下降，故能配尽配</text>
  <text x="48" y="340" font-size="11" fill="#888" filter="url(#r)">答案 = ∑prices − ∑(p[i]·d[i]/100)，i = 0..k−1</text>
</svg>
