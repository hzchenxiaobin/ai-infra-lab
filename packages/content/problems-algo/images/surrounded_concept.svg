<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：与边界 O 连通的 O 不会被围绕</text>
  <text x="260" y="48" text-anchor="middle" font-size="11" fill="#888">内部 O 若能"逃"到边界 → 安全；否则被 X 围住 → 翻成 X</text>

  <g filter="url(#rough2)" font-size="16" font-weight="bold">
    <!-- border highlight: dashed orange ring around the whole grid -->
    <rect x="56" y="86" width="184" height="184" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="6,4" rx="4"/>

    <!-- Row 0 (top border) -->
    <rect x="60" y="90" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="82" y="118" text-anchor="middle" fill="#446688">X</text>
    <rect x="104" y="90" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="126" y="118" text-anchor="middle" fill="#446688">X</text>
    <rect x="148" y="90" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="170" y="118" text-anchor="middle" fill="#446688">X</text>
    <rect x="192" y="90" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="214" y="118" text-anchor="middle" fill="#446688">X</text>

    <!-- Row 1 -->
    <rect x="60" y="134" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="82" y="162" text-anchor="middle" fill="#446688">X</text>
    <rect x="104" y="134" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="126" y="162" text-anchor="middle" fill="#b85450">O</text>
    <rect x="148" y="134" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="170" y="162" text-anchor="middle" fill="#b85450">O</text>
    <rect x="192" y="134" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="214" y="162" text-anchor="middle" fill="#446688">X</text>

    <!-- Row 2 -->
    <rect x="60" y="178" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="82" y="206" text-anchor="middle" fill="#446688">X</text>
    <rect x="104" y="178" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="126" y="206" text-anchor="middle" fill="#446688">X</text>
    <rect x="148" y="178" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="170" y="206" text-anchor="middle" fill="#b85450">O</text>
    <rect x="192" y="178" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="214" y="206" text-anchor="middle" fill="#446688">X</text>

    <!-- Row 3 (bottom border) -->
    <rect x="60" y="222" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="82" y="250" text-anchor="middle" fill="#446688">X</text>
    <rect x="104" y="222" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4"/>
    <text x="126" y="250" text-anchor="middle" fill="#4a7a3a">O</text>
    <rect x="148" y="222" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="170" y="250" text-anchor="middle" fill="#446688">X</text>
    <rect x="192" y="222" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="214" y="250" text-anchor="middle" fill="#446688">X</text>
  </g>

  <!-- annotations on the right -->
  <g filter="url(#rough2)" font-size="12">
    <!-- safe (green) -->
    <rect x="280" y="120" width="210" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="385" y="140" text-anchor="middle" fill="#4a7a3a" font-weight="bold">边界 O（安全）</text>
    <text x="385" y="156" text-anchor="middle" fill="#4a7a3a" font-size="11">贴边或连到边 → 保留</text>
    <path d="M 280 143 L 250 240" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)"/>

    <!-- captured (red) -->
    <rect x="280" y="180" width="210" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
    <text x="385" y="200" text-anchor="middle" fill="#b85450" font-weight="bold">内部 O（被围绕）</text>
    <text x="385" y="216" text-anchor="middle" fill="#b85450" font-size="11">不连边界 → 翻成 X</text>
    <path d="M 280 203 L 196 156" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)"/>

    <!-- border ring label -->
    <text x="148" y="80" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">↕ 边界（四条边）</text>
  </g>

  <text x="260" y="338" text-anchor="middle" font-size="11" fill="#888">蓝格=X｜绿格=边界连通的 O（安全）｜红格=被围绕的 O（将翻成 X）</text>
</svg>
