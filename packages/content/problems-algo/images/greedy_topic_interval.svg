<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="480" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">区间贪心：按「右端点」排序，每次选最早结束的不重叠区间</text>
  <text x="320" y="46" text-anchor="middle" font-size="11" fill="#888">直觉：结束越早，给后面留的空间越大 → 能选的越多（435/452/252/253/763 共用此套路）</text>

  <!-- ===== Left: wrong - sort by start ===== -->
  <text x="160" y="74" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 按左端点排序（或选最长的）</text>

  <!-- number line -->
  <line x1="60" y1="96" x2="300" y2="96" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 300 96 L 292 92 L 292 100 Z" fill="#888" filter="url(#rough2)"/>

  <!-- A [1,10] long interval -->
  <rect x="74" y="106" width="226" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="120" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">A [1,10]</text>

  <!-- B [2,3] -->
  <rect x="92" y="134" width="22" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="103" y="147" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">B</text>

  <!-- C [4,5] -->
  <rect x="138" y="134" width="22" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="149" y="147" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">C</text>

  <!-- D [6,7] -->
  <rect x="184" y="134" width="22" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="195" y="147" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">D</text>

  <!-- pick A first -->
  <text x="160" y="172" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">先选 A（左端点最小）</text>
  <rect x="60" y="182" width="248" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="184" y="200" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">A 挡住 [1,10]，B/C/D 全废</text>
  <text x="184" y="214" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">只选了 1 个 ✗</text>

  <!-- ===== Right: correct - sort by end ===== -->
  <text x="480" y="74" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 按右端点排序，选最早结束的</text>

  <line x1="380" y1="96" x2="620" y2="96" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 620 96 L 612 92 L 612 100 Z" fill="#888" filter="url(#rough2)"/>

  <!-- B [2,3] end=3 -->
  <rect x="412" y="106" width="22" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="423" y="120" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">B</text>
  <text x="423" y="138" text-anchor="middle" font-size="8" fill="#4a7a3a" filter="url(#rough2)">end=3</text>

  <!-- C [4,5] end=5 -->
  <rect x="458" y="106" width="22" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="469" y="120" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">C</text>
  <text x="469" y="138" text-anchor="middle" font-size="8" fill="#4a7a3a" filter="url(#rough2)">end=5</text>

  <!-- D [6,7] end=7 -->
  <rect x="504" y="106" width="22" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="515" y="120" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">D</text>
  <text x="515" y="138" text-anchor="middle" font-size="8" fill="#4a7a3a" filter="url(#rough2)">end=7</text>

  <!-- A [1,10] skipped -->
  <rect x="394" y="148" width="226" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="400" y="161" font-size="9" fill="#b85450" filter="url(#rough2)">A end=10 跳过</text>

  <text x="480" y="178" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">按 end 排序：B(3)→C(5)→D(7)</text>
  <rect x="380" y="186" width="248" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="504" y="204" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">选 B→C→D，互不重叠</text>
  <text x="504" y="218" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">选了 3 个 ✓（最优）</text>

  <!-- ===== Bottom: the template ===== -->
  <rect x="30" y="240" width="580" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="320" y="260" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">通用模板（选最多不重叠区间）</text>
  <rect x="50" y="268" width="540" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="320" y="284" text-anchor="middle" font-size="11" fill="#333" font-family="monospace" filter="url(#rough2)">sort(intervals, key=end); cnt=0; last=-∞; for x: if x.start≥last: cnt++; last=x.end</text>

  <!-- ===== Variants table ===== -->
  <rect x="30" y="306" width="580" height="148" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="320" y="326" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">同一套路的变体题</text>

  <text x="46" y="346" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">题号 / 题目</text>
  <text x="200" y="346" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">排序键</text>
  <text x="300" y="346" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">贪心策略</text>
  <text x="500" y="346" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">求什么</text>

  <line x1="44" y1="350" x2="596" y2="350" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <text x="46" y="366" font-size="10" fill="#333" filter="url(#rough2)">435 无重叠区间</text>
  <text x="200" y="366" font-size="10" fill="#4a7a3a" filter="url(#rough2)">右端点↑</text>
  <text x="300" y="366" font-size="10" fill="#555" filter="url(#rough2)">选最多不重叠</text>
  <text x="500" y="366" font-size="10" fill="#555" filter="url(#rough2)">删最少几个</text>

  <text x="46" y="382" font-size="10" fill="#333" filter="url(#rough2)">452 引爆气球</text>
  <text x="200" y="382" font-size="10" fill="#4a7a3a" filter="url(#rough2)">右端点↑</text>
  <text x="300" y="382" font-size="10" fill="#555" filter="url(#rough2)">一支箭贯穿一段</text>
  <text x="500" y="382" font-size="10" fill="#555" filter="url(#rough2)">最少几支箭</text>

  <text x="46" y="398" font-size="10" fill="#333" filter="url(#rough2)">252 会议室</text>
  <text x="200" y="398" font-size="10" fill="#4a7a3a" filter="url(#rough2)">右端点↑</text>
  <text x="300" y="398" font-size="10" fill="#555" filter="url(#rough2)">能开就开同一间</text>
  <text x="500" y="398" font-size="10" fill="#555" filter="url(#rough2)">能否全安排</text>

  <text x="46" y="414" font-size="10" fill="#333" filter="url(#rough2)">253 会议室II</text>
  <text x="200" y="414" font-size="10" fill="#d6a040" filter="url(#rough2)">开始↑+堆</text>
  <text x="300" y="414" font-size="10" fill="#555" filter="url(#rough2)">堆存各间结束时</text>
  <text x="500" y="414" font-size="10" fill="#555" filter="url(#rough2)">最少几间</text>

  <text x="46" y="430" font-size="10" fill="#333" filter="url(#rough2)">56 合并区间</text>
  <text x="200" y="430" font-size="10" fill="#4a7a3a" filter="url(#rough2)">左端点↑</text>
  <text x="300" y="430" font-size="10" fill="#555" filter="url(#rough2)">重叠就合并</text>
  <text x="500" y="430" font-size="10" fill="#555" filter="url(#rough2)">合并后列表</text>

  <text x="46" y="446" font-size="10" fill="#333" filter="url(#rough2)">763 划分字母</text>
  <text x="200" y="446" font-size="10" fill="#d6a040" filter="url(#rough2)">扫描+右界</text>
  <text x="300" y="446" font-size="10" fill="#555" filter="url(#rough2)">到当前右界就切</text>
  <text x="500" y="446" font-size="10" fill="#555" filter="url(#rough2)">最多几段</text>
</svg>
