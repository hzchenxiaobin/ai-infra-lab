<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">nums = [2, 3, 5]：枚举所有数对</text>

  <!-- header row -->
  <g filter="url(#rough2)">
    <rect x="40" y="60" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="80" y="80" text-anchor="middle" font-size="12" fill="#446688">数对</text>
    <rect x="120" y="60" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="160" y="80" text-anchor="middle" font-size="12" fill="#446688">g=gcd</text>
    <rect x="200" y="60" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="240" y="80" text-anchor="middle" font-size="12" fill="#446688">u, v</text>
    <rect x="280" y="60" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="330" y="80" text-anchor="middle" font-size="12" fill="#446688">强度 u·v</text>
  </g>

  <!-- rows -->
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <rect x="40" y="95" width="340" height="30" fill="#fafafa" stroke="#d8d8d8" stroke-width="1" rx="4"/>
    <text x="80" y="115" text-anchor="middle">(2,3)</text>
    <text x="160" y="115" text-anchor="middle">1</text>
    <text x="240" y="115" text-anchor="middle">2, 3</text>
    <text x="330" y="115" text-anchor="middle">6</text>

    <rect x="40" y="130" width="340" height="30" fill="#fafafa" stroke="#d8d8d8" stroke-width="1" rx="4"/>
    <text x="80" y="150" text-anchor="middle">(2,5)</text>
    <text x="160" y="150" text-anchor="middle">1</text>
    <text x="240" y="150" text-anchor="middle">2, 5</text>
    <text x="330" y="150" text-anchor="middle">10</text>

    <rect x="40" y="165" width="340" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="80" y="185" text-anchor="middle" fill="#b85450" font-weight="bold">(3,5)</text>
    <text x="160" y="185" text-anchor="middle" fill="#b85450">1</text>
    <text x="240" y="185" text-anchor="middle" fill="#b85450">3, 5</text>
    <text x="330" y="185" text-anchor="middle" fill="#b85450" font-weight="bold">15 ★max</text>
  </g>

  <!-- note -->
  <rect x="40" y="220" width="480" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="245" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">观察</text>
  <text x="60" y="268" font-size="12" fill="#333" filter="url(#rough2)">• 贪心“取最大两数”不一定最优</text>
  <text x="60" y="288" font-size="12" fill="#333" filter="url(#rough2)">• 反例 [6,10,15]：最大两数 10,15 → 强度 6</text>
  <text x="60" y="308" font-size="12" fill="#333" filter="url(#rough2)">  但 6,10 → g=2, u=3, v=5 → 强度 15（更大）</text>
</svg>
