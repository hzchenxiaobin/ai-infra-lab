<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">阈值 P / S：有效分割是连续区间</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">pg 只降不升 ⟹ pg[i]=G 是后缀 [P, m−1]；sg 只升不降 ⟹ sg[i]=G 是前缀 [0, S]</text>

  <g filter="url(#rough2)">
    <line x1="60" y1="300" x2="500" y2="300" stroke="#666" stroke-width="1.6" marker-end="url(#arrB)"/>
  </g>
  <text x="508" y="304" font-size="10" fill="#666">i</text>

  <g filter="url(#rough2)" stroke="#bbb" stroke-width="1">
    <line x1="60" y1="294" x2="60" y2="306"/>
    <line x1="120" y1="294" x2="120" y2="306"/>
    <line x1="180" y1="294" x2="180" y2="306"/>
    <line x1="240" y1="294" x2="240" y2="306"/>
    <line x1="300" y1="294" x2="300" y2="306"/>
    <line x1="360" y1="294" x2="360" y2="306"/>
    <line x1="420" y1="294" x2="420" y2="306"/>
  </g>
  <g font-size="10" fill="#666" text-anchor="middle">
    <text x="60" y="320">0</text>
    <text x="120" y="320">1</text>
    <text x="180" y="320">2</text>
    <text x="240" y="320">3</text>
    <text x="300" y="320">4</text>
    <text x="360" y="320">5</text>
    <text x="420" y="320">6</text>
    <text x="480" y="320">7</text>
  </g>

  <g filter="url(#rough2)" stroke-dasharray="6 4">
    <line x1="60" y1="230" x2="500" y2="230" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="506" y="234" font-size="11" fill="#b85450" font-weight="bold">G</text>

  <path d="M 60 100 L 180 100 L 180 165 L 300 165 L 300 230 L 500 230"
        fill="none" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="70" y="92" font-size="11" fill="#446688" font-weight="bold">pg[i]（前缀 gcd，只降不升）</text>

  <path d="M 60 230 L 420 230 L 420 165 L 500 165"
        fill="none" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="330" y="150" font-size="11" fill="#4a7a3a" font-weight="bold">sg[i]（后缀 gcd，只升不降）</text>

  <g filter="url(#rough2)" stroke="#d6a040" stroke-width="2" stroke-dasharray="5 4">
    <line x1="300" y1="230" x2="300" y2="300"/>
    <line x1="420" y1="230" x2="420" y2="300"/>
  </g>
  <text x="300" y="340" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">P = 4</text>
  <text x="420" y="340" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">S = 6</text>

  <g filter="url(#rough2)">
    <rect x="300" y="256" width="120" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
  </g>
  <text x="360" y="270" text-anchor="middle" font-size="10.5" fill="#8a6a1a" font-weight="bold">有效分割 [P, S−1]</text>

  <path d="M 300 250 L 360 250 L 360 246 M 420 250 L 360 250 L 360 246"
        stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <rect x="60" y="60" width="440" height="0" fill="none"/>

  <rect x="40" y="356" width="480" height="0" fill="none"/>

  <rect x="60" y="60" width="446" height="0" fill="none"/>

  <rect x="60" y="348" width="446" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="283" y="364" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">得分 = max(0, S − P)：本例 = 6 − 4 = 2（分割 4、5 有效）</text>

  <text x="480" y="290" text-anchor="middle" font-size="9.5" fill="#999">m = 8</text>
</svg>
