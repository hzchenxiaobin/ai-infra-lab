<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="460" height="540" fill="#fafafa"/>

  <text x="230" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">找到所有字母异位词算法流程</text>

  <!-- Init -->
  <rect x="70" y="42" width="320" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="64" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">初始化</text>
  <text x="230" y="82" text-anchor="middle" font-size="10.5" fill="#555">统计 p 频次 need[]，target = 非零项数</text>
  <text x="230" y="96" text-anchor="middle" font-size="10.5" fill="#555">win[] = 0, match = 0</text>

  <path d="M 230 102 L 230 118" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Loop check -->
  <polygon points="230,122 340,162 230,202 120,162" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="158" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i &lt; n ?</text>
  <text x="230" y="176" text-anchor="middle" font-size="10.5" fill="#777">未扫完 s？</text>

  <!-- No -> return ans -->
  <path d="M 340 162 L 400 162 L 400 250" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="358" y="154" font-size="11" fill="#b85450" font-weight="bold">No</text>
  <rect x="330" y="254" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="390" y="279" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return ans</text>

  <!-- Yes down -->
  <path d="M 230 202 L 230 218" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="248" y="214" font-size="11" fill="#82b366" font-weight="bold">Yes</text>

  <!-- in char -->
  <rect x="90" y="222" width="280" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="230" y="247" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">进入 s[i]：更新 win / match</text>

  <path d="M 230 262 L 230 278" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Diamond: i >= m ? -->
  <polygon points="230,282 330,322 230,362 130,322" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="318" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">i ≥ m ?</text>
  <text x="230" y="336" text-anchor="middle" font-size="10" fill="#777">窗口已满需离开？</text>

  <!-- Yes: leave char -->
  <path d="M 130 322 L 60 322 L 60 382" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="78" y="314" font-size="11" fill="#82b366" font-weight="bold">Yes</text>
  <rect x="6" y="386" width="170" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="91" y="406" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">离开 s[i−m]</text>
  <text x="91" y="422" text-anchor="middle" font-size="10.5" fill="#555">更新 win / match</text>

  <!-- No: skip leave -->
  <path d="M 330 322 L 390 322 L 390 382" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="350" y="314" font-size="11" fill="#b85450" font-weight="bold">No</text>
  <rect x="316" y="386" width="150" height="44" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="391" y="406" text-anchor="middle" font-size="11" fill="#555">窗口尚未满</text>
  <text x="391" y="422" text-anchor="middle" font-size="10.5" fill="#888">不离开字符</text>

  <!-- merge down -->
  <path d="M 91 430 L 91 452 L 200 452" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <path d="M 391 430 L 391 452 L 290 452" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrowR)" filter="url(#rough2)"/>

  <!-- Diamond: window full & match==target ? -->
  <polygon points="245,456 320,486 245,516 170,486" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="245" y="482" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">i ≥ m−1 且</text>
  <text x="245" y="496" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">match == target ?</text>

  <!-- Yes: record -->
  <path d="M 170 486 L 120 486 L 120 510" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="135" y="478" font-size="9.5" fill="#4a7a3a" font-weight="bold">Yes</text>
  <rect x="40" y="514" width="130" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="105" y="529" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">记录 i−m+1</text>

  <!-- loop back -->
  <path d="M 320 486 L 430 486 L 430 162 L 340 162" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <text x="424" y="324" font-size="9.5" fill="#888" transform="rotate(-90 424 324)">i++，回到循环</text>
</svg>
