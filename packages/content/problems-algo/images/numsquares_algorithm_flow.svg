<svg xmlns="http://www.w3.org/2000/svg" width="560" height="490" viewBox="0 0 560 490" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="560" height="490" fill="#fdfcf7"/>
  <text x="280" y="22" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">完全平方数：DP 算法流程</text>
  <path d="M 170 30 Q 280 38 390 30" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== main column connectors ===== -->
  <path d="M 260 70 L 260 78" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 260 114 L 260 130" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 260 162 L 260 176" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 260 224 L 260 246" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="270" y="240" font-size="10" fill="#7a5415" font-weight="bold">是</text>
  <path d="M 260 278 L 260 298" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 260 346 L 260 368" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="270" y="362" font-size="10" fill="#7a5415" font-weight="bold">是</text>
  <path d="M 260 404 L 260 426" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== loop-back: inner (j) on the right ===== -->
  <path d="M 315 442 L 400 442 L 400 322 L 312 322" stroke="#4a8e4a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="408" y="386" font-size="9" fill="#2e6e2e" font-weight="bold">j ← j+1</text>
  <text x="408" y="398" font-size="9" fill="#2e6e2e">重测内层</text>

  <!-- ===== loop-back: outer (i) on the left ===== -->
  <path d="M 160 322 L 60 322 L 60 200 L 208 200" stroke="#4a8edb" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="40" y="258" font-size="9" fill="#2b6e9e" font-weight="bold">i ← i+1</text>
  <text x="40" y="270" font-size="9" fill="#2b6e9e">重测外层</text>

  <!-- diamond1 No -> return -->
  <path d="M 310 200 L 365 200" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="328" y="194" font-size="10" fill="#b03a3a" font-weight="bold">否</text>
  <!-- return -> end -->
  <path d="M 430 216 L 430 238" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond2 No -> i=i+1 -->
  <path d="M 210 322 L 160 322" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="176" y="316" font-size="10" fill="#b03a3a" font-weight="bold">否</text>

  <!-- ===== Nodes ===== -->
  <g font-size="12" fill="#2b2b2b">
    <!-- Start -->
    <g filter="url(#sk)"><ellipse cx="260" cy="52" rx="44" ry="18" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
    <text x="260" y="56" text-anchor="middle" font-weight="bold" fill="#2e6e2e">开始</text>

    <!-- init -->
    <g filter="url(#sk)"><rect x="170" y="78" width="180" height="36" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
    <text x="260" y="101" text-anchor="middle">dp[0]=0；dp[1..n]=∞</text>

    <!-- i=1 -->
    <g filter="url(#sk)"><rect x="210" y="130" width="100" height="32" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
    <text x="260" y="151" text-anchor="middle">i = 1</text>

    <!-- Diamond1: i <= n ? -->
    <g filter="url(#sk)"><polygon points="260,176 310,200 260,224 210,200" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/></g>
    <text x="260" y="204" text-anchor="middle" font-size="11">i ≤ n ?</text>

    <!-- j=1 -->
    <g filter="url(#sk)"><rect x="210" y="246" width="100" height="32" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
    <text x="260" y="267" text-anchor="middle">j = 1</text>

    <!-- Diamond2: j*j <= i ? -->
    <g filter="url(#sk)"><polygon points="260,298 312,322 260,346 208,322" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/></g>
    <text x="260" y="326" text-anchor="middle" font-size="11">j·j ≤ i ?</text>

    <!-- dp = min -->
    <g filter="url(#sk)"><rect x="150" y="368" width="220" height="36" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
    <text x="260" y="391" text-anchor="middle">dp[i] = min(dp[i], dp[i−j·j]+1)</text>

    <!-- j = j+1 -->
    <g filter="url(#sk)"><rect x="205" y="426" width="110" height="32" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
    <text x="260" y="447" text-anchor="middle">j = j + 1</text>

    <!-- return dp[n] -->
    <g filter="url(#sk)"><rect x="365" y="184" width="130" height="32" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
    <text x="430" y="205" text-anchor="middle" fill="#b03a3a" font-weight="bold">返回 dp[n]</text>

    <!-- End -->
    <g filter="url(#sk)"><ellipse cx="430" cy="256" rx="40" ry="18" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
    <text x="430" y="260" text-anchor="middle" font-weight="bold" fill="#2e6e2e">结束</text>

    <!-- i = i+1 -->
    <g filter="url(#sk)"><rect x="60" y="306" width="100" height="32" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
    <text x="110" y="327" text-anchor="middle">i = i + 1</text>
  </g>
</svg>
