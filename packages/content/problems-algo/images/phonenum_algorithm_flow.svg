<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：回溯 dfs(i, path) + 循环选字母</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">时间 O(4ⁿ·n)，空间 O(n)；每分支结束 pop 回溯</text>

  <g font-size="10" fill="#333">
    <!-- Step 1: init + empty check -->
    <rect x="40" y="64" width="480" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="84" font-size="12" fill="#446688" font-weight="bold">① 初始化</text>
    <text x="130" y="84" font-family="monospace" font-size="10" fill="#555">if not digits: return []</text>
    <text x="130" y="100" font-family="monospace" font-size="10" fill="#555">ans=[]; path=[]; M={2:abc,...}; dfs(0)</text>

    <path d="M 280 116 L 280 130" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 2: base case -->
    <rect x="40" y="134" width="480" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="154" font-size="12" fill="#b85450" font-weight="bold">② 终止</text>
    <text x="110" y="154" font-family="monospace" font-size="10" fill="#555">if i == len(digits):</text>
    <text x="110" y="170" font-family="monospace" font-size="10" fill="#555">    ans.append("".join(path));  return</text>

    <path d="M 280 180 L 280 194" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 3: loop -->
    <rect x="40" y="198" width="480" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="218" font-size="12" fill="#4a7a3a" font-weight="bold">③ 遍历当前位的字母</text>
    <text x="240" y="218" font-family="monospace" font-size="10" fill="#555">for ch in M[digits[i]]:</text>
    <text x="54" y="240" font-family="monospace" font-size="10" fill="#4a7a3a">    path.append(ch)        # 选择</text>
    <text x="54" y="258" font-family="monospace" font-size="10" fill="#4a7a3a">    dfs(i + 1)             # 递归下一位</text>
    <text x="54" y="276" font-family="monospace" font-size="10" fill="#4a7a3a">    path.pop()             # 撤销</text>
    <text x="290" y="240" font-size="9" fill="#888">← append 与 pop 成对</text>
    <text x="290" y="258" font-size="9" fill="#888">　保证 path 是根到当前路径</text>

    <path d="M 280 292 L 280 306" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 4: done -->
    <rect x="40" y="310" width="480" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="331" font-size="12" fill="#4a7a3a" font-weight="bold">④ 返回</text>
    <text x="110" y="331" font-size="10" fill="#555">ans 即所有组合（叶节点数 = 字母数之积）</text>
  </g>

  <!-- key note 1 -->
  <rect x="40" y="354" width="480" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="54" y="374" font-size="11" fill="#d6a040" font-weight="bold">⚠️ 终止判 i == n（越界一格）</text>
  <text x="54" y="390" font-size="10" fill="#555">此时 path 长度恰为 n，收集完整组合；空串需入口特判返回 []</text>

  <!-- key note 2 -->
  <rect x="40" y="406" width="480" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="425" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">无剪枝：每个叶节点都合法；append/pop 是所有回溯题的通用不变式</text>
  <text x="280" y="440" text-anchor="middle" font-size="9" fill="#888">掌握此骨架 → 叠加剪枝(22)、used 去重(46) 即可覆盖枚举类回溯</text>
</svg>
