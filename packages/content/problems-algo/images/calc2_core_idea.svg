<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：运算符分两级 —— 乘除立即算，加减带符号入栈</text>

  <!-- Expression tokens -->
  <text x="40" y="62" font-size="12" fill="#888">表达式:</text>
  <rect x="96" y="46" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="68" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="160" y="46" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="68" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">+</text>
  <rect x="216" y="46" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="68" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="280" y="46" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="300" y="68" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">×</text>
  <rect x="336" y="46" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="68" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>

  <!-- legend: two precedence levels -->
  <rect x="430" y="46" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="450" y="58" font-size="11" fill="#555">+ − 低优先级</text>
  <rect x="430" y="66" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="450" y="78" font-size="11" fill="#555">× ÷ 高优先级</text>

  <!-- Step labels and stack snapshots -->
  <text x="40" y="120" font-size="11" fill="#888" font-weight="bold">读 3，前导符 +：</text>
  <text x="180" y="120" font-size="11" fill="#4a7a3a">+3 入栈（带符号记账）</text>
  <!-- stack1 -->
  <rect x="300" y="104" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="324" y="124" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <path d="M 324 138 L 324 150" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="40" y="172" font-size="11" fill="#888" font-weight="bold">读 2，前导符 +：</text>
  <text x="180" y="172" font-size="11" fill="#4a7a3a">+2 入栈</text>
  <!-- stack2 -->
  <rect x="300" y="156" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="324" y="176" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="300" y="186" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="324" y="206" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <path d="M 324 220 L 324 232" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="40" y="254" font-size="11" fill="#888" font-weight="bold">读 2，前导符 ×：</text>
  <text x="180" y="254" font-size="11" fill="#b85450" font-weight="bold">立即弹 2，算 2×2=4 入栈</text>
  <!-- stack3: pop 2, push 4 -->
  <rect x="300" y="238" width="48" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="324" y="258" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">4</text>
  <rect x="300" y="268" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="324" y="288" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <!-- final sum -->
  <path d="M 352 283 L 392 283" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="396" y="264" width="120" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="456" y="282" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">最后求和</text>
  <text x="456" y="298" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3 + 4 = 7</text>

  <!-- bottom callout -->
  <rect x="40" y="320" width="520" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="341" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">关键：用一个栈把「先乘除后加减」变成一遍扫描 —— 遇 × ÷ 就与栈顶结合，遇 + − 就带符号入栈</text>
  <text x="300" y="359" text-anchor="middle" font-size="11" fill="#888">加减只记录「该加多少 / 该减多少」，真正的求和推迟到最后一次性 sum</text>
</svg>
