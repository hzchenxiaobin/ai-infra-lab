<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">中点分治:跨段对的条件拆成两个「单侧量」L(i) 与 R(j)</text>

  <!-- ============ 段与中线 ============ -->
  <text x="320" y="62" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">在段 [l, r] 上取中点 m:同侧对递归,只统计 i ≤ m &lt; j 的跨段对</text>

  <g filter="url(#rough2)">
    <rect x="90" y="84" width="200" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="290" y="84" width="12" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="302" y="84" width="200" height="42" rx="6" fill="#fff4e6" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="190" y="110" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">左半 [l, m]</text>
  <text x="402" y="110" text-anchor="middle" font-size="12.5" fill="#8a6420" filter="url(#rough2)">右半 [m+1, r]</text>
  <text x="296" y="76" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">m</text>

  <g filter="url(#rough2)">
    <rect x="150" y="84" width="34" height="42" rx="4" fill="#446688" opacity="0.25"/>
    <rect x="360" y="84" width="34" height="42" rx="4" fill="#d6a040" opacity="0.25"/>
  </g>
  <text x="167" y="146" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">i</text>
  <text x="167" y="160" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">左端点</text>
  <text x="377" y="146" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6420" filter="url(#rough2)">j</text>
  <text x="377" y="160" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">右端点</text>
  <text x="240" y="146" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">← 左段 (i, m] →</text>
  <text x="460" y="146" text-anchor="middle" font-size="10" fill="#8a6420" filter="url(#rough2)">← 右段 [m+1, j) →</text>

  <!-- ============ L / R 定义 ============ -->
  <rect x="40" y="176" width="280" height="76" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="200" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">L(i) = 左段 (i, m] 中 &gt; nums[i] 的最小值</text>
  <text x="180" y="222" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">「左段里第一个比 nums[i] 大的值」</text>
  <text x="180" y="242" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">没有则记 +∞;从 m 向左用有序集合维护</text>

  <rect x="340" y="176" width="280" height="76" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="480" y="200" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6420" filter="url(#rough2)">R(j) = 右段 [m+1, j) 中 &lt; nums[j] 的最大值</text>
  <text x="480" y="222" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">「右段里最后一个比 nums[j] 小的值」</text>
  <text x="480" y="242" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">没有则记 −∞;从 m+1 向右用有序集合维护</text>

  <!-- ============ 四量不等式 ============ -->
  <rect x="40" y="268" width="580" height="88" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="294" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">跨段影子对 ⟺ R(j) ≤ nums[i] &lt; nums[j] ≤ L(i)</text>
  <text x="330" y="318" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">读法:左段中大于 nums[i] 的都必须 ≥ nums[j](不许落进开区间),</text>
  <text x="330" y="338" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">右段中小于 nums[j] 的都必须 ≤ nums[i] —— 两侧条件各自只依赖一端!</text>

  <!-- ============ 数点统计 ============ -->
  <rect x="40" y="372" width="580" height="84" rx="10" fill="#f0f0f8" stroke="#8866aa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="396" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#6a4a8a" filter="url(#rough2)">统计:左点 (x = nums[i], y = L(i)),查询矩形 x ∈ [R(j), nums[j]−1] × y ≥ nums[j]</text>
  <text x="330" y="418" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">查询按 nums[j] 降序、左点按 L(i) 降序,指针推进插入 BIT,区间求和 O(log)</text>
  <text x="330" y="440" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">⚠ 查询必须降序:{L(i) ≥ nums[j]} 的集合随 nums[j] 增大而缩小,升序会重复计入</text>
</svg>
