<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：prices=[1,3,2,8,4,9], fee=2 → cash[5]=8</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">操作序列：买@1 → 卖@8 → 买@4 → 卖@9，收益 5+3=8</text>

  <!-- ===== column headers ===== -->
  <g font-size="10" fill="#888">
    <text x="58" y="76" font-weight="bold">i:</text>
    <text x="110" y="76" text-anchor="middle">0</text>
    <text x="180" y="76" text-anchor="middle">1</text>
    <text x="250" y="76" text-anchor="middle">2</text>
    <text x="320" y="76" text-anchor="middle">3</text>
    <text x="390" y="76" text-anchor="middle">4</text>
    <text x="460" y="76" text-anchor="middle">5</text>
  </g>

  <!-- ===== price row ===== -->
  <g font-size="11">
    <text x="46" y="100" font-size="10" fill="#446688" font-weight="bold">price:</text>
    <rect x="90"  y="82" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="110" y="100" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="160" y="82" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="180" y="100" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
    <rect x="230" y="82" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="250" y="100" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <rect x="300" y="82" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="320" y="100" text-anchor="middle" fill="#446688" font-weight="bold">8</text>
    <rect x="370" y="82" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="390" y="100" text-anchor="middle" fill="#446688" font-weight="bold">4</text>
    <rect x="440" y="82" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="460" y="100" text-anchor="middle" fill="#446688" font-weight="bold">9</text>
  </g>

  <!-- ===== cash row ===== -->
  <g font-size="11">
    <text x="56" y="136" font-size="10" fill="#4a7a3a" font-weight="bold">cash:</text>
    <rect x="90"  y="118" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="110" y="136" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>
    <rect x="160" y="118" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="180" y="136" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>
    <rect x="230" y="118" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="250" y="136" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>
    <rect x="300" y="118" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="320" y="136" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>
    <rect x="370" y="118" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="390" y="136" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>
    <rect x="440" y="118" width="40" height="26" fill="#e6f4ea" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
    <text x="460" y="136" text-anchor="middle" fill="#b85450" font-weight="bold">8</text>
  </g>

  <!-- ===== hold row ===== -->
  <g font-size="11">
    <text x="54" y="172" font-size="10" fill="#b85450" font-weight="bold">hold:</text>
    <rect x="90"  y="154" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="110" y="172" text-anchor="middle" fill="#b85450" font-weight="bold">−1</text>
    <rect x="160" y="154" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="180" y="172" text-anchor="middle" fill="#b85450" font-weight="bold">−1</text>
    <rect x="230" y="154" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="250" y="172" text-anchor="middle" fill="#b85450" font-weight="bold">−1</text>
    <rect x="300" y="154" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="320" y="172" text-anchor="middle" fill="#b85450" font-weight="bold">−1</text>
    <rect x="370" y="154" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="390" y="172" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="440" y="154" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="460" y="172" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
  </g>

  <!-- ===== action row ===== -->
  <g font-size="10">
    <text x="50" y="208" font-size="10" fill="#666" font-weight="bold">操作:</text>
    <rect x="90"  y="190" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="110" y="206" text-anchor="middle" fill="#4a7a3a" font-weight="bold">买</text>
    <rect x="160" y="190" width="40" height="24" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="180" y="206" text-anchor="middle" fill="#999" font-weight="bold">歇</text>
    <rect x="230" y="190" width="40" height="24" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="250" y="206" text-anchor="middle" fill="#999" font-weight="bold">歇</text>
    <rect x="300" y="190" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="320" y="206" text-anchor="middle" fill="#b85450" font-weight="bold">卖</text>
    <rect x="370" y="190" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="390" y="206" text-anchor="middle" fill="#4a7a3a" font-weight="bold">买</text>
    <rect x="440" y="190" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="460" y="206" text-anchor="middle" fill="#b85450" font-weight="bold">卖</text>
  </g>

  <!-- ===== detail ===== -->
  <line x1="20" y1="228" x2="520" y2="228" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <g font-size="9" fill="#333">
    <text x="30" y="248" font-size="10" fill="#444" font-weight="bold">关键递推：</text>
    <text x="30" y="266" font-size="9" fill="#b85450">i=1,2: 卖出收益 hold+p−fee 均 ≤ 0，cash 保持 0 不卖</text>
    <text x="30" y="280" font-size="9" fill="#4a7a3a">i=3: cash = max(0, −1+8−2) = 5（卖在 8，扣费后净赚 5）</text>
    <text x="30" y="294" font-size="9" fill="#b85450">i=4: hold = max(−1, 5−4) = 1（用利润 cash=5 在低点重建仓位）</text>
    <text x="30" y="308" font-size="9" fill="#4a7a3a">i=5: cash = max(5, 1+9−2) = 8（卖在 9，再赚 3）</text>
  </g>

  <!-- ===== Result ===== -->
  <rect x="30" y="324" width="480" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="270" y="344" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">最终结果：cash[5] = 8（= (8−1−2) + (9−4−2) = 5 + 3）</text>
</svg>
