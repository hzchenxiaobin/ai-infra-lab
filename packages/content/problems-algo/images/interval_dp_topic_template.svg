<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="16" fill="#444" font-weight="bold">通用模板：枚举切点 k，把 [i,j] 拆成两段合并</text>

  <!-- ===== Top: the split mechanism ===== -->
  <text x="40" y="62" font-size="12" fill="#888">区间 [i, j] 上枚举切点 k（以 n=7, [i,j]=[1,5] 为例）:</text>

  <!-- string of cells -->
  <rect x="50" y="78" width="36" height="30" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="68" y="98" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="92" y="74" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="110" y="96" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">i</text>
  <rect x="134" y="78" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="152" y="98" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="176" y="78" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="194" y="98" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="218" y="78" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="236" y="98" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="260" y="74" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="278" y="96" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">j</text>
  <rect x="302" y="78" width="36" height="30" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="320" y="98" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">6</text>

  <!-- index labels -->
  <text x="110" y="122" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">下标 1</text>
  <text x="152" y="122" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">2</text>
  <text x="194" y="122" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">3</text>
  <text x="236" y="122" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">4</text>
  <text x="278" y="122" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">5</text>

  <!-- cut point k=2 (first split) -->
  <path d="M 152 130 L 152 150" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="152" y="146" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">k=2</text>

  <!-- left part [i,k] -->
  <rect x="92" y="158" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="122" y="174" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[i, k]</text>
  <!-- right part [k+1, j] -->
  <rect x="176" y="158" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="236" y="174" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[k+1, j]</text>

  <text x="122" y="196" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">dp[i][k]</text>
  <text x="236" y="196" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">dp[k+1][j]</text>

  <!-- cut point k=3 (second split) -->
  <path d="M 194 130 L 194 150" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="360" y="174" font-size="10" fill="#888" filter="url(#rough2)">← 枚举所有 k ∈ [i, j−1]，取最优切法</text>

  <!-- merge formula -->
  <rect x="60" y="212" width="520" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="320" y="234" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">dp[i][j] = min/max over k: dp[i][k] ⊕ dp[k+1][j] ⊕ cost(i, k, j)</text>
  <text x="320" y="250" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">⊕ = 合并运算（加法/max/min），cost = 本次合并代价</text>

  <!-- ===== Bottom: two equivalent fill orders ===== -->
  <text x="40" y="284" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">两种等价写法（都保证「更短子区间先算」）:</text>

  <!-- Write 1: by length -->
  <rect x="40" y="298" width="280" height="130" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="180" y="318" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">写法一：按长度递增（推荐）</text>
  <text x="50" y="340" font-size="10" fill="#4a7a3a" font-family="monospace" filter="url(#rough2)">for length in range(2, n+1):</text>
  <text x="50" y="356" font-size="10" fill="#4a7a3a" font-family="monospace" filter="url(#rough2)">    for i in range(n-length+1):</text>
  <text x="50" y="372" font-size="10" fill="#4a7a3a" font-family="monospace" filter="url(#rough2)">        j = i + length - 1</text>
  <text x="50" y="388" font-size="10" fill="#4a7a3a" font-family="monospace" filter="url(#rough2)">        for k in range(i, j):</text>
  <text x="50" y="404" font-size="10" fill="#4a7a3a" font-family="monospace" filter="url(#rough2)">            dp[i][j] = merge(...)</text>
  <text x="50" y="422" font-size="9" fill="#888" filter="url(#rough2)">语义清晰：长度 1→2→3...→n</text>

  <!-- Write 2: i desc, j asc -->
  <rect x="340" y="298" width="280" height="130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="480" y="318" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">写法二：i 倒序、j 正序</text>
  <text x="350" y="340" font-size="10" fill="#d6a040" font-family="monospace" filter="url(#rough2)">for i in range(n-1, -1, -1):</text>
  <text x="350" y="356" font-size="10" fill="#d6a040" font-family="monospace" filter="url(#rough2)">    for j in range(i+1, n):</text>
  <text x="350" y="372" font-size="10" fill="#d6a040" font-family="monospace" filter="url(#rough2)">        for k in range(i, j):</text>
  <text x="350" y="388" font-size="10" fill="#d6a040" font-family="monospace" filter="url(#rough2)">            dp[i][j] = merge(...)</text>
  <text x="350" y="410" font-size="9" fill="#888" filter="url(#rough2)">i 倒序 → dp[i+1][*] 已算（下一行）</text>
  <text x="350" y="424" font-size="9" fill="#888" filter="url(#rough2)">j 正序 → dp[i][k] 已算（同行左列）</text>

  <!-- bottom note -->
  <text x="320" y="448" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">回文型（无切点）同样适用：dp[i][j] 依赖 dp[i+1][j-1]（左下），i 倒序 + j 正序即可</text>
</svg>
