<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察:每位约束 = 「前 j 格都需要位 b」,需求沿位置递减成嵌套链</text>

  <!-- 括号:各位 power 值覆盖的前缀 -->
  <path d="M 56 114 V 70 H 334 V 114" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="195" y="64" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">p(b14) = 5:前 5 格都要位 14</text>
  <path d="M 56 114 V 84 H 226 V 114" fill="none" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="232" y="100" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">p(b13) = 3</text>
  <path d="M 56 114 V 98 H 110 V 114" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="116" y="112" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">p(b12) = 1</text>

  <!-- 位置格子 -->
  <rect x="56" y="118" width="54" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="83" y="145" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">{14,13,12}</text>
  <rect x="112" y="118" width="54" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="139" y="145" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">{14,13}</text>
  <rect x="168" y="118" width="54" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="195" y="145" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">{14,13}</text>
  <rect x="224" y="118" width="54" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="251" y="145" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">{14}</text>
  <rect x="280" y="118" width="54" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="307" y="145" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">{14}</text>
  <rect x="336" y="118" width="54" height="46" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="363" y="145" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">无</text>

  <text x="83" y="180" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="139" y="180" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="195" y="180" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <text x="251" y="180" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3</text>
  <text x="307" y="180" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4</text>
  <text x="363" y="180" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">5</text>
  <text x="195" y="200" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">perm 的位置 k(越靠前,需求的位集越大)</text>

  <!-- 右侧:阈值表 -->
  <text x="515" y="120" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">可行性 ⇔ 霍尔条件</text>
  <rect x="404" y="130" width="220" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="424" y="145" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6420" filter="url(#rough2)">阈值 v</text>
  <text x="500" y="145" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6420" filter="url(#rough2)">C(v)</text>
  <text x="588" y="145" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6420" filter="url(#rough2)">需满足</text>
  <rect x="404" y="154" width="220" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="424" y="169" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">5</text>
  <text x="500" y="169" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">{14}</text>
  <text x="588" y="169" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">cnt ≥ 5</text>
  <rect x="404" y="178" width="220" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="424" y="193" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">3</text>
  <text x="500" y="193" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">{14,13}</text>
  <text x="588" y="193" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">cnt ≥ 3</text>
  <rect x="404" y="202" width="220" height="22" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="424" y="217" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="500" y="217" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">{14,13,12}</text>
  <text x="588" y="217" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">cnt ≥ 1</text>

  <text x="515" y="244" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555" filter="url(#rough2)">D(k) = {b : p_b > k}(位置 k 的需求)</text>
  <text x="515" y="262" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">位置 k 要放一个「包含 D(k) 全部 1 位」</text>
  <text x="515" y="278" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">的元素;D(k) 随 k 单调缩小 ⇒ 嵌套链</text>

  <!-- 底部:霍尔条件 -->
  <rect x="36" y="300" width="568" height="84" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="324" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">霍尔条件:约束组可实现 ⇔ 对每个阈值 v 都有 cnt(C(v)) ≥ v</text>
  <text x="320" y="346" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">必要性:前 v 格都需要包含 C(v) 全部位的元素 ⇒ 这样的元素至少 v 个</text>
  <text x="320" y="368" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">充分性:从最靠前的块向前逐块分配,霍尔界保证每一块都够(SOS 预计算 cnt,查询 O(1))</text>
</svg>
