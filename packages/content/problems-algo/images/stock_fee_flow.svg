<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">DP 四步法：状态 → 转移 → 初始化 → 计算</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">与 309 同骨架，状态数从 3 降到 2（无冷冻期）</text>

  <g font-size="10" fill="#333">
    <!-- Step 1 -->
    <rect x="40" y="64" width="440" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="140" y="84" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① 状态定义</text>
    <text x="140" y="102" text-anchor="middle" font-size="9" fill="#555">cash[i] / hold[i]</text>
    <text x="140" y="118" text-anchor="middle" font-size="9" fill="#888">「第 i 天结束时处于两状态的最大收益」</text>
    <rect x="300" y="74" width="170" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="385" y="92" text-anchor="middle" font-size="9" fill="#4a7a3a">对比 309 冷冻期：</text>
    <text x="385" y="108" text-anchor="middle" font-size="9" fill="#4a7a3a">3 状态（持有/可买/冷冻）</text>

    <path d="M 260 130 L 260 144" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 2 -->
    <rect x="40" y="148" width="440" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="140" y="166" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">② 转移方程</text>
    <text x="150" y="184" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#555">cash=max(cash, hold+p−fee)</text>
    <text x="150" y="198" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#555">hold=max(hold, cash−p)</text>
    <text x="150" y="210" text-anchor="middle" font-size="8.5" fill="#888">「保持 / 跳入」取 max，卖出边扣 fee</text>
    <rect x="300" y="158" width="170" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="385" y="176" text-anchor="middle" font-size="9" fill="#d6a040">对比 309：</text>
    <text x="385" y="192" text-anchor="middle" font-family="monospace" font-size="8" fill="#d6a040">sold=hold+p（无 fee）</text>

    <path d="M 260 214 L 260 228" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 3 -->
    <rect x="40" y="232" width="440" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="140" y="252" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">③ 初始条件</text>
    <text x="150" y="272" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#555">hold[0]=−prices[0]</text>
    <text x="150" y="288" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#555">cash[0]=0</text>
    <rect x="300" y="242" width="170" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="385" y="260" text-anchor="middle" font-size="9" fill="#b85450">对比 309：</text>
    <text x="385" y="276" text-anchor="middle" font-family="monospace" font-size="9" fill="#b85450">多一个 sold[0]=0</text>

    <path d="M 260 298 L 260 312" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 4 -->
    <rect x="40" y="316" width="440" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="140" y="336" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">④ 计算顺序</text>
    <text x="150" y="354" text-anchor="middle" font-family="monospace" font-size="11" fill="#555">i = 1 → 2 → ... → n−1</text>
    <text x="150" y="370" text-anchor="middle" font-size="9" fill="#888">「自底向上 + 两变量滚动 O(1)」</text>
    <rect x="300" y="326" width="170" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="385" y="344" text-anchor="middle" font-size="9" fill="#446688">答案 = cash[n−1]：</text>
    <text x="385" y="360" text-anchor="middle" font-family="monospace" font-size="8" fill="#446688">无需取 max(free, sold)</text>
  </g>
</svg>
