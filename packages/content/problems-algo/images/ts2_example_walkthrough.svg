<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：numbers = [2,7,11,15]，target = 9</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">下标从 0 计，最终输出 +1</text>

  <!-- ===== Table header ===== -->
  <g font-size="11">
    <rect x="40" y="62" width="480" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="78" y="82" text-anchor="middle" fill="#223" font-weight="bold">步骤</text>
    <text x="148" y="82" text-anchor="middle" fill="#223" font-weight="bold">left</text>
    <text x="218" y="82" text-anchor="middle" fill="#223" font-weight="bold">right</text>
    <text x="300" y="82" text-anchor="middle" fill="#223" font-weight="bold">nums[l]+nums[r]</text>
    <text x="410" y="82" text-anchor="middle" fill="#223" font-weight="bold">与 9 比</text>
    <text x="488" y="82" text-anchor="middle" fill="#223" font-weight="bold">动作</text>
  </g>

  <!-- vertical separators -->
  <line x1="116" y1="62" x2="116" y2="252" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="180" y1="62" x2="180" y2="252" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="256" y1="62" x2="256" y2="252" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="364" y1="62" x2="364" y2="252" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="456" y1="62" x2="456" y2="252" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Row 1 ===== -->
  <rect x="40" y="92" width="480" height="52" fill="#fff" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>
  <text x="78" y="122" text-anchor="middle" font-size="12" fill="#223">1</text>
  <text x="148" y="116" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>
  <text x="148" y="132" text-anchor="middle" font-size="9" fill="#b85450">(值 2)</text>
  <text x="218" y="116" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="218" y="132" text-anchor="middle" font-size="9" fill="#4a7a3a">(值 15)</text>
  <text x="300" y="122" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2 + 15 = 17</text>
  <text x="410" y="122" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">17 &gt; 9</text>
  <text x="488" y="122" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">right--</text>

  <!-- ===== Row 2 ===== -->
  <rect x="40" y="144" width="480" height="52" fill="#fff" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>
  <text x="78" y="174" text-anchor="middle" font-size="12" fill="#223">2</text>
  <text x="148" y="168" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>
  <text x="148" y="184" text-anchor="middle" font-size="9" fill="#b85450">(值 2)</text>
  <text x="218" y="168" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="218" y="184" text-anchor="middle" font-size="9" fill="#4a7a3a">(值 11)</text>
  <text x="300" y="174" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2 + 11 = 13</text>
  <text x="410" y="174" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">13 &gt; 9</text>
  <text x="488" y="174" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">right--</text>

  <!-- ===== Row 3 (hit) ===== -->
  <rect x="40" y="196" width="480" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="78" y="227" text-anchor="middle" font-size="12" fill="#2a5a2a" font-weight="bold">3</text>
  <text x="148" y="221" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>
  <text x="148" y="237" text-anchor="middle" font-size="9" fill="#b85450">(值 2)</text>
  <text x="218" y="221" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="218" y="237" text-anchor="middle" font-size="9" fill="#4a7a3a">(值 7)</text>
  <text x="300" y="227" text-anchor="middle" font-size="12" fill="#2a5a2a" font-weight="bold">2 + 7 = 9</text>
  <text x="410" y="227" text-anchor="middle" font-size="12" fill="#2a5a2a" font-weight="bold">9 == 9</text>
  <text x="488" y="221" text-anchor="middle" font-size="11" fill="#2a5a2a" font-weight="bold">返回</text>
  <text x="488" y="237" text-anchor="middle" font-size="11" fill="#2a5a2a" font-weight="bold">[1,2] ⭐</text>

  <!-- ===== Bottom note ===== -->
  <rect x="40" y="270" width="480" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="56" y="290" font-size="11" fill="#7a5a10" font-weight="bold">关键：每步只淘汰一个不可能成为答案的元素</text>
  <text x="56" y="308" font-size="10.5" fill="#8a6a20">15 和最小值 2 相加都超了 → 15 必不是答案；11 同理。两步淘汰后 2+7 命中。</text>
  <text x="56" y="322" font-size="10.5" fill="#8a6a20">指针只增不减，合计至多 n−1 步，故 O(n)。</text>
</svg>
