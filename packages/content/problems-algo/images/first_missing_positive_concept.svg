<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrC" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：答案只可能在 [1, n+1]，把数字 i 归位到下标 i−1</text>

  <!-- Part 1: answer range -->
  <text x="40" y="62" font-size="12" fill="#446688" font-weight="bold">① 答案范围：长度 n 的数组，缺失正数必在 [1, n+1]</text>

  <rect x="56" y="74" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="74" y="94" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <rect x="96" y="74" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="114" y="94" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <rect x="136" y="74" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="154" y="94" text-anchor="middle" font-size="11.5" fill="#333">…</text>
  <rect x="176" y="74" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="194" y="94" text-anchor="middle" font-size="11.5" fill="#333">n</text>
  <rect x="226" y="74" width="52" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="252" y="94" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">n+1</text>
  <text x="292" y="94" font-size="11" fill="#888">1~n 各就各位才轮到 n+1</text>

  <!-- Part 2: mapping -->
  <text x="40" y="140" font-size="12" fill="#4a7a3a" font-weight="bold">② 归位规则：值 v (1≤v≤n) 应放在下标 v−1</text>

  <text x="74" y="172" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">值 v</text>
  <rect x="56" y="180" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="74" y="200" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">1</text>
  <rect x="96" y="180" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="114" y="200" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">2</text>
  <rect x="136" y="180" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="154" y="200" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">3</text>
  <rect x="176" y="180" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="194" y="200" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">4</text>

  <path d="M 74 212 L 74 238" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrC)" filter="url(#rough2)"/>
  <path d="M 114 212 L 114 238" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrC)" filter="url(#rough2)"/>
  <path d="M 154 212 L 154 238" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrC)" filter="url(#rough2)"/>
  <path d="M 194 212 L 194 238" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrC)" filter="url(#rough2)"/>

  <text x="256" y="230" font-size="10.5" fill="#b85450" font-weight="bold">v − 1</text>

  <text x="74" y="256" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">下标</text>
  <rect x="56" y="264" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="74" y="284" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">0</text>
  <rect x="96" y="264" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="114" y="284" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">1</text>
  <rect x="136" y="264" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="154" y="284" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">2</text>
  <rect x="176" y="264" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="194" y="284" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">3</text>

  <text x="232" y="284" font-size="11" fill="#4a7a3a">nums[v−1] = v</text>

  <!-- conclusion -->
  <rect x="32" y="306" width="456" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="48" y="328" font-size="12.5" fill="#4a7a3a" font-weight="bold">结论：归位后扫描，第一个 nums[i] ≠ i+1 的位置，答案就是 i+1</text>
  <text x="48" y="346" font-size="11" fill="#4a7a3a">≤0 或 &gt;n 的值直接忽略（它们不影响 [1,n] 范围内的判断）</text>
  <text x="48" y="360" font-size="11" fill="#4a7a3a">若 1~n 全部归位，答案为 n+1</text>
</svg>
