<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">三步反转：右移 k 位 = 把末尾 k 个搬到开头</text>
  <text x="290" y="42" text-anchor="middle" font-size="11" fill="#888">设 A = 前 n−k 个，B = 末尾 k 个，目标 AB → BA</text>

  <!-- Block labels A / B above row1 -->
  <text x="238" y="74" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">A (n−k)</text>
  <text x="392" y="74" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">B (k)</text>

  <!-- Row 1: 原数组 AB = [1,2,3,4,5,6,7] -->
  <rect x="6" y="84" width="120" height="34" fill="#f0f0f0" stroke="#888" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="66" y="106" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">原数组 AB</text>
  <!-- A cells blue: 1,2,3,4 -->
  <rect x="150" y="82" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="172" y="104" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="194" y="82" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="216" y="104" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="238" y="82" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="104" text-anchor="middle" font-size="13" fill="#333">3</text>
  <rect x="282" y="82" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="304" y="104" text-anchor="middle" font-size="13" fill="#333">4</text>
  <!-- B cells green: 5,6,7 -->
  <rect x="326" y="82" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="348" y="104" text-anchor="middle" font-size="13" fill="#333">5</text>
  <rect x="370" y="82" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="392" y="104" text-anchor="middle" font-size="13" fill="#333">6</text>
  <rect x="414" y="82" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="436" y="104" text-anchor="middle" font-size="13" fill="#333">7</text>

  <!-- Arrow 1 -->
  <path d="M 470 99 L 470 138" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="478" y="120" font-size="11" fill="#d6a040" font-weight="bold">① 整体反转</text>

  <!-- Row 2: rev(AB) = [7,6,5,4,3,2,1] all orange -->
  <rect x="6" y="146" width="120" height="34" fill="#f0f0f0" stroke="#888" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="66" y="168" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">rev(B) rev(A)</text>
  <rect x="150" y="144" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="172" y="166" text-anchor="middle" font-size="13" fill="#333">7</text>
  <rect x="194" y="144" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="216" y="166" text-anchor="middle" font-size="13" fill="#333">6</text>
  <rect x="238" y="144" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="166" text-anchor="middle" font-size="13" fill="#333">5</text>
  <rect x="282" y="144" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="304" y="166" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="326" y="144" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="348" y="166" text-anchor="middle" font-size="13" fill="#333">3</text>
  <rect x="370" y="144" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="392" y="166" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="414" y="144" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="436" y="166" text-anchor="middle" font-size="13" fill="#333">1</text>

  <!-- Arrow 2 -->
  <path d="M 470 161 L 470 200" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="478" y="182" font-size="11" fill="#b85450" font-weight="bold">② 反转前 k 个</text>

  <!-- Row 3: B rev(A) = [5,6,7,4,3,2,1] first3 red, last4 orange -->
  <rect x="6" y="208" width="120" height="34" fill="#f0f0f0" stroke="#888" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="66" y="230" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">B rev(A)</text>
  <rect x="150" y="206" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="172" y="228" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <rect x="194" y="206" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="216" y="228" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <rect x="238" y="206" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="228" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
  <rect x="282" y="206" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="304" y="228" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="326" y="206" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="348" y="228" text-anchor="middle" font-size="13" fill="#333">3</text>
  <rect x="370" y="206" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="392" y="228" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="414" y="206" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="436" y="228" text-anchor="middle" font-size="13" fill="#333">1</text>

  <!-- Arrow 3 -->
  <path d="M 470 223 L 470 262" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="478" y="244" font-size="11" fill="#446688" font-weight="bold">③ 反转后 n−k 个</text>

  <!-- Row 4: B A = [5,6,7,1,2,3,4] first3 red, last4 blue = 结果 -->
  <rect x="6" y="270" width="120" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="66" y="292" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">B A = 结果 ✓</text>
  <rect x="150" y="268" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="172" y="290" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <rect x="194" y="268" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="216" y="290" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <rect x="238" y="268" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="290" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
  <rect x="282" y="268" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="304" y="290" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="326" y="268" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="348" y="290" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="370" y="268" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="392" y="290" text-anchor="middle" font-size="13" fill="#333">3</text>
  <rect x="414" y="268" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="436" y="290" text-anchor="middle" font-size="13" fill="#333">4</text>

  <!-- Summary box -->
  <rect x="40" y="330" width="500" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="354" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">关键性质：rev(XY) = rev(Y) rev(X)，且反转是自逆运算</text>
  <text x="290" y="374" text-anchor="middle" font-size="11.5" fill="#555">AB → rev(B)rev(A) → B rev(A) → B A</text>
  <text x="290" y="392" text-anchor="middle" font-size="11" fill="#888">全程首尾双指针交换，O(n) 时间 / O(1) 空间</text>
</svg>
