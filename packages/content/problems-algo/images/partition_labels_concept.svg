<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：同一字母必须落在同一片段</text>
  <text x="270" y="46" text-anchor="middle" font-size="11" fill="#888">片段示例 “ababcbaca” —— 字母 ‘a’ 出现在下标 0, 2, 6, 8</text>

  <!-- cells row: 9 cells, width 44, start x=46 -->
  <!-- a b a b c b a c a ; 'a' cells (0,2,6,8) red, others blue -->
  <rect x="46"  y="66" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="68"  y="90" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="90"  y="66" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="90" text-anchor="middle" font-size="14" fill="#333">b</text>
  <rect x="134" y="66" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="156" y="90" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="178" y="66" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="90" text-anchor="middle" font-size="14" fill="#333">b</text>
  <rect x="222" y="66" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="244" y="90" text-anchor="middle" font-size="14" fill="#333">c</text>
  <rect x="266" y="66" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="288" y="90" text-anchor="middle" font-size="14" fill="#333">b</text>
  <rect x="310" y="66" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="332" y="90" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="354" y="66" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="376" y="90" text-anchor="middle" font-size="14" fill="#333">c</text>
  <rect x="398" y="66" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="420" y="90" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">a</text>

  <!-- index labels -->
  <text x="68"  y="116" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="112" y="116" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="156" y="116" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="200" y="116" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="244" y="116" text-anchor="middle" font-size="9" fill="#aaa">4</text>
  <text x="288" y="116" text-anchor="middle" font-size="9" fill="#aaa">5</text>
  <text x="332" y="116" text-anchor="middle" font-size="9" fill="#aaa">6</text>
  <text x="376" y="116" text-anchor="middle" font-size="9" fill="#aaa">7</text>
  <text x="420" y="116" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">8</text>

  <!-- red bracket spanning first 'a' (0) to last 'a' (8) -->
  <path d="M 68 130 Q 68 138 76 138 L 412 138 Q 420 138 420 130" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="244" y="134" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">‘a’ 首次(0) → 末次(8)，必须同属一个片段</text>

  <!-- wrong cut between cell 5 and cell 6, x = 266+44 = 310 -->
  <path d="M 310 60 L 310 150" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,3" fill="none" filter="url(#rough2)"/>
  <text x="312" y="172" text-anchor="start" font-size="10.5" fill="#b85450">✗ 在此切割：会拆散 ‘a’（0,2 留左、6,8 落右）</text>

  <!-- right cut after cell 8, x = 442 -->
  <path d="M 442 60 L 442 150" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="440" y="172" text-anchor="end" font-size="10.5" fill="#4a7a3a" font-weight="bold">✓ 在末次 ‘a’ 之后切割</text>

  <!-- conclusion box -->
  <rect x="40" y="200" width="460" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="270" y="224" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">推论：片段右边界 end ≥ 片段内每个字母的“最后出现位置”</text>
  <text x="270" y="244" text-anchor="middle" font-size="11.5" fill="#666">取最大值：end = max(end, last[s[i]])；当 i 走到 end 即可切一刀。</text>

  <!-- mini formula -->
  <rect x="40" y="276" width="460" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="298" text-anchor="middle" font-size="11.5" fill="#333">遍历时维护当前片段的 end：</text>
  <text x="270" y="320" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">若 i == end  →  此处是一个合法切点，记录长度 end−start+1</text>
</svg>
