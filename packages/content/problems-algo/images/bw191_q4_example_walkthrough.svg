<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 390" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="390" fill="#fafafa"/>
  <text x="280" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">示例演算：nums = [2, −1, 3]，goal = 2，k = 2</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">前缀值 P[−1]=0, P[0]=2, P[1]=1, P[2]=4；每步「先查后插」，答案 = 0+1+1 = 2</text>

  <!-- 表格：列边界 26|82|128|192|288|372|444|490|534 -->
  <g filter="url(#rough2)">
    <rect x="26" y="64" width="508" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <line x1="82" y1="64" x2="82" y2="292" stroke="#bbb" stroke-width="1"/>
    <line x1="128" y1="64" x2="128" y2="292" stroke="#bbb" stroke-width="1"/>
    <line x1="192" y1="64" x2="192" y2="292" stroke="#bbb" stroke-width="1"/>
    <line x1="288" y1="64" x2="288" y2="292" stroke="#bbb" stroke-width="1"/>
    <line x1="372" y1="64" x2="372" y2="292" stroke="#bbb" stroke-width="1"/>
    <line x1="444" y1="64" x2="444" y2="292" stroke="#bbb" stroke-width="1"/>
    <line x1="490" y1="64" x2="490" y2="292" stroke="#bbb" stroke-width="1"/>
    <rect x="26" y="64" width="508" height="228" fill="none" stroke="#446688" stroke-width="1.4"/>
    <line x1="26" y1="92" x2="534" y2="92" stroke="#446688" stroke-width="1"/>
    <line x1="26" y1="142" x2="534" y2="142" stroke="#ddd" stroke-width="1"/>
    <line x1="26" y1="192" x2="534" y2="192" stroke="#ddd" stroke-width="1"/>
    <line x1="26" y1="242" x2="534" y2="242" stroke="#ddd" stroke-width="1"/>
    <rect x="26" y="64" width="508" height="28" fill="#e8f0fe"/>
  </g>

  <text x="54" y="82" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3a4a66" filter="url(#rough2)">步骤</text>
  <text x="105" y="82" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3a4a66" filter="url(#rough2)">P[j]</text>
  <text x="160" y="82" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3a4a66" filter="url(#rough2)">t</text>
  <text x="240" y="82" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3a4a66" filter="url(#rough2)">已插入</text>
  <text x="330" y="82" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3a4a66" filter="url(#rough2)">左: ≤ t−k</text>
  <text x="408" y="82" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3a4a66" filter="url(#rough2)">右: ≥ t+k</text>
  <text x="467" y="82" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3a4a66" filter="url(#rough2)">ans</text>
  <text x="512" y="82" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3a4a66" filter="url(#rough2)">插入</text>

  <!-- 初始行 y=92..142 -->
  <text x="54" y="121" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">初始</text>
  <text x="105" y="121" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>
  <text x="160" y="121" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>
  <text x="240" y="121" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{0}</text>
  <text x="330" y="121" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>
  <text x="408" y="121" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>
  <text x="467" y="121" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="512" y="121" text-anchor="middle" font-size="11" fill="#8a6a1a" filter="url(#rough2)">0</text>

  <!-- j=0 行 y=142..192 -->
  <text x="54" y="171" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">j=0</text>
  <text x="105" y="171" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="160" y="171" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="240" y="171" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{0}</text>
  <text x="330" y="171" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">≤−2: 0 个</text>
  <text x="408" y="171" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">≥2: 0 个</text>
  <text x="467" y="171" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="512" y="171" text-anchor="middle" font-size="11" fill="#8a6a1a" filter="url(#rough2)">2</text>

  <!-- j=1 行 y=192..242 -->
  <text x="54" y="221" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">j=1</text>
  <text x="105" y="221" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="160" y="221" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">−1</text>
  <text x="240" y="221" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{0, 2}</text>
  <text x="330" y="221" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">≤−3: 0 个</text>
  <text x="408" y="221" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">≥1: 1 个（2✓）</text>
  <text x="467" y="221" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="512" y="221" text-anchor="middle" font-size="11" fill="#8a6a1a" filter="url(#rough2)">1</text>

  <!-- j=2 行 y=242..292 -->
  <text x="54" y="271" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">j=2</text>
  <text x="105" y="271" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="160" y="271" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="240" y="271" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{0, 2, 1}</text>
  <text x="330" y="271" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">≤0: 1 个（0✓）</text>
  <text x="408" y="271" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">≥4: 0 个</text>
  <text x="467" y="271" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="512" y="271" text-anchor="middle" font-size="11" fill="#8a6a1a" filter="url(#rough2)">4</text>

  <!-- 警示框 -->
  <rect x="26" y="308" width="508" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="330" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6a1a" filter="url(#rough2)">⚠ 先查后插：j=2 查询时 P[2]=4 尚未插入</text>
  <text x="280" y="349" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">若先插后查，4 ≥ t+k=4 会被误算（i′=j 的自配对不是子数组），错得 3</text>
</svg>
