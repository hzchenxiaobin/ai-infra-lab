<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="440" height="460" fill="#fafafa"/>

  <text x="220" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">跳跃游戏算法流程</text>

  <!-- Init -->
  <rect x="80" y="42" width="280" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="220" y="64" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">初始化</text>
  <text x="220" y="82" text-anchor="middle" font-size="11" fill="#555">maxReach = 0,  i = 0</text>

  <path d="M 220 96 L 220 114" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Loop check: i < n ? -->
  <polygon points="220,118 320,156 220,194 120,156" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="220" y="152" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i &lt; n ?</text>
  <text x="220" y="170" text-anchor="middle" font-size="10.5" fill="#777">未扫完？</text>

  <!-- No -> return true (survived all) -->
  <path d="M 320 156 L 390 156 L 390 234" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="340" y="148" font-size="11" fill="#b85450" font-weight="bold">No</text>
  <rect x="320" y="238" width="110" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="375" y="263" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return true</text>

  <!-- Yes down -->
  <path d="M 220 194 L 220 212" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="238" y="208" font-size="11" fill="#82b366" font-weight="bold">Yes</text>

  <!-- Diamond: i > maxReach ? -->
  <polygon points="220,216 320,256 220,296 120,256" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="252" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i &gt; maxReach ?</text>
  <text x="220" y="270" text-anchor="middle" font-size="10.5" fill="#777">当前下标不可达？</text>

  <!-- Yes: return false (gap) -->
  <path d="M 120 256 L 50 256 L 50 324" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="70" y="248" font-size="11" fill="#b85450" font-weight="bold">Yes</text>
  <rect x="6" y="328" width="120" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="66" y="353" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return false</text>

  <!-- No: update maxReach -->
  <path d="M 320 256 L 390 256 L 390 324" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="350" y="248" font-size="11" fill="#82b366" font-weight="bold">No</text>

  <rect x="200" y="328" width="240" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="320" y="353" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">maxReach = max(maxReach, i+nums[i])</text>

  <path d="M 320 368 L 320 386" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Diamond: maxReach >= n-1 ? -->
  <polygon points="320,390 400,420 320,440 240,420" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="416" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">maxReach ≥ n−1 ?</text>
  <text x="320" y="432" text-anchor="middle" font-size="9.5" fill="#777">已覆盖终点？</text>

  <!-- Yes: return true -->
  <path d="M 240 420 L 180 420 L 180 238" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="200" y="412" font-size="10" fill="#4a7a3a" font-weight="bold">Yes</text>

  <!-- No: i++ loop back -->
  <path d="M 400 420 L 430 420 L 430 156 L 320 156" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <text x="424" y="290" font-size="9.5" fill="#888" transform="rotate(-90 424 290)">No → i++，回到循环</text>

  <!-- footer -->
  <text x="220" y="452" text-anchor="middle" font-size="11" fill="#d6a040" font-style="italic">O(n) 时间，O(1) 空间</text>
</svg>
