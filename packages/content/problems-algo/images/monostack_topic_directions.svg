<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="16" fill="#444" font-weight="bold">两种方向：递减栈找「更大」，递增栈找「更小」</text>
  <text x="320" y="48" text-anchor="middle" font-size="11" fill="#888">口诀：找谁就跟谁反着排——找更大用递减栈（大者来弹小者），找更小用递增栈（小者来弹大者）。</text>

  <!-- ===== Left: 递减栈 ===== -->
  <rect x="30" y="68" width="280" height="370" fill="#fff" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="170" y="92" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">① 递减栈（栈底→顶 递减）</text>
  <text x="170" y="110" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">找「右侧第一个更大」</text>

  <text x="44" y="134" font-size="11" fill="#444" filter="url(#rough2)">栈状态（值从底到顶↓）：</text>

  <!-- stack cells -->
  <rect x="60" y="146" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="80" y="164" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>
  <rect x="104" y="146" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="124" y="164" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <rect x="148" y="146" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="168" y="164" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="196" y="162" font-size="10" fill="#888" filter="url(#rough2)">← 栈顶</text>

  <text x="44" y="196" font-size="11" fill="#444" filter="url(#rough2)">来一个 cur = 6（更大）：</text>

  <!-- cur arrow in -->
  <rect x="120" y="210" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="140" y="228" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">6</text>
  <path d="M 140 236 L 168 248" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <text x="44" y="262" font-size="10.5" fill="#b85450" filter="url(#rough2)">6 &gt; 3 → pop 3，res[3]=6 ✅</text>
  <text x="44" y="278" font-size="10.5" fill="#b85450" filter="url(#rough2)">6 &gt; 5 → pop 5，res[5]=6 ✅</text>
  <text x="44" y="294" font-size="10.5" fill="#446688" filter="url(#rough2)">6 &lt; 7 → 停，6 入栈</text>

  <!-- new stack -->
  <rect x="60" y="308" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="80" y="326" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>
  <rect x="104" y="308" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="124" y="326" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">6</text>
  <text x="152" y="324" font-size="10" fill="#888" filter="url(#rough2)">← 新栈顶</text>

  <text x="44" y="356" font-size="10.5" fill="#555" filter="url(#rough2)">代表题：739 每日温度、</text>
  <text x="44" y="370" font-size="10.5" fill="#555" filter="url(#rough2)">496/503 下一个更大元素、</text>
  <text x="44" y="384" font-size="10.5" fill="#555" filter="url(#rough2)">42 接雨水（右侧更高柱）</text>
  <text x="44" y="406" font-size="10" fill="#888" filter="url(#rough2)">结算：res[top]=cur 的值</text>
  <text x="44" y="420" font-size="10" fill="#888" filter="url(#rough2)">或距离 i-top（739）</text>

  <!-- ===== Right: 递增栈 ===== -->
  <rect x="330" y="68" width="280" height="370" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="470" y="92" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 递增栈（栈底→顶 递增）</text>
  <text x="470" y="110" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">找「右侧第一个更小」 / 两侧更小</text>

  <text x="344" y="134" font-size="11" fill="#444" filter="url(#rough2)">栈状态（值从底到顶↑）：</text>

  <rect x="360" y="146" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="380" y="164" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="404" y="146" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="424" y="164" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="448" y="146" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="468" y="164" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="496" y="162" font-size="10" fill="#888" filter="url(#rough2)">← 栈顶</text>

  <text x="344" y="196" font-size="11" fill="#444" filter="url(#rough2)">来一个 cur = 3（更小）：</text>

  <rect x="420" y="210" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="440" y="228" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <path d="M 440 236 L 468 248" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <text x="344" y="262" font-size="10.5" fill="#b85450" filter="url(#rough2)">3 &lt; 5 → pop 5，右边界=cur ✅</text>
  <text x="344" y="278" font-size="10.5" fill="#446688" filter="url(#rough2)">3 &gt; 2 → 停，3 入栈</text>
  <text x="344" y="294" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">pop 5 后新栈顶=2 即「左侧更小」</text>

  <rect x="360" y="308" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="380" y="326" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="404" y="308" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="424" y="326" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="448" y="308" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="468" y="326" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">3</text>
  <text x="496" y="324" font-size="10" fill="#888" filter="url(#rough2)">← 新栈顶</text>

  <text x="344" y="356" font-size="10.5" fill="#555" filter="url(#rough2)">代表题：84 柱状图最大矩形、</text>
  <text x="344" y="370" font-size="10.5" fill="#555" filter="url(#rough2)">85 最大矩形、907 子数组最小值、</text>
  <text x="344" y="384" font-size="10.5" fill="#555" filter="url(#rough2)">402/316 移位使结果最小</text>
  <text x="344" y="406" font-size="10" fill="#888" filter="url(#rough2)">两侧扫描：弹出时</text>
  <text x="344" y="420" font-size="10" fill="#888" filter="url(#rough2)">右界=cur，左界=新栈顶</text>

  <!-- bottom note -->
  <text x="320" y="456" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">⚠「递减 / 递增」描述的是栈底到栈顶的值走向；遇到等号是否弹，取决于题意要「严格」还是「非严格」。</text>
</svg>
