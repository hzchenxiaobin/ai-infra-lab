<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">迭代演算：x = 2, n = 10 (二进制 1010)</text>

  <!-- Table frame -->
  <rect x="30" y="44" width="500" height="38" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="68" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">轮次</text>
  <text x="185" y="68" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">N (二进制)</text>
  <text x="300" y="68" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">N&amp;1</text>
  <text x="395" y="68" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">ans</text>
  <text x="485" y="68" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">x</text>

  <!-- column separators -->
  <path d="M 130 44 L 130 360" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 240 44 L 240 360" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 350 44 L 350 360" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 440 44 L 440 360" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <!-- outer -->
  <rect x="30" y="44" width="500" height="316" fill="none" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- Row 0: 初始 -->
  <rect x="30" y="82" width="500" height="44" fill="#f5f5f5" filter="url(#rough2)"/>
  <text x="80" y="109" text-anchor="middle" font-size="12" fill="#555">初始</text>
  <text x="185" y="109" text-anchor="middle" font-size="13" fill="#333" font-family="'Comic Sans MS', monospace">1010</text>
  <text x="300" y="109" text-anchor="middle" font-size="12" fill="#999">—</text>
  <text x="395" y="109" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="485" y="109" text-anchor="middle" font-size="13" fill="#333">2</text>

  <!-- Row 1: 第1轮 N&1=0 -->
  <rect x="30" y="126" width="500" height="44" fill="#fff" filter="url(#rough2)"/>
  <text x="80" y="153" text-anchor="middle" font-size="12" fill="#555">第 1 轮</text>
  <text x="185" y="153" text-anchor="middle" font-size="13" fill="#333" font-family="'Comic Sans MS', monospace">101</text>
  <text x="300" y="153" text-anchor="middle" font-size="13" fill="#999" font-weight="bold">0</text>
  <text x="395" y="153" text-anchor="middle" font-size="13" fill="#999">1</text>
  <text x="485" y="153" text-anchor="middle" font-size="13" fill="#333">4</text>

  <!-- Row 2: 第2轮 N&1=1 (累乘) -->
  <rect x="30" y="170" width="500" height="44" fill="#fff8e1" filter="url(#rough2)"/>
  <text x="80" y="197" text-anchor="middle" font-size="12" fill="#555">第 2 轮</text>
  <text x="185" y="197" text-anchor="middle" font-size="13" fill="#333" font-family="'Comic Sans MS', monospace">10</text>
  <text x="300" y="197" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <text x="395" y="197" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">4</text>
  <text x="485" y="197" text-anchor="middle" font-size="13" fill="#333">16</text>
  <text x="395" y="160" text-anchor="middle" font-size="9" fill="#d6a040">ans *= x²</text>

  <!-- Row 3: 第3轮 N&1=0 -->
  <rect x="30" y="214" width="500" height="44" fill="#fff" filter="url(#rough2)"/>
  <text x="80" y="241" text-anchor="middle" font-size="12" fill="#555">第 3 轮</text>
  <text x="185" y="241" text-anchor="middle" font-size="13" fill="#333" font-family="'Comic Sans MS', monospace">1</text>
  <text x="300" y="241" text-anchor="middle" font-size="13" fill="#999" font-weight="bold">0</text>
  <text x="395" y="241" text-anchor="middle" font-size="13" fill="#999">4</text>
  <text x="485" y="241" text-anchor="middle" font-size="13" fill="#333">256</text>

  <!-- Row 4: 第4轮 N&1=1 (累乘) -->
  <rect x="30" y="258" width="500" height="44" fill="#fce4ec" filter="url(#rough2)"/>
  <text x="80" y="285" text-anchor="middle" font-size="12" fill="#555">第 4 轮</text>
  <text x="185" y="285" text-anchor="middle" font-size="13" fill="#333" font-family="'Comic Sans MS', monospace">0</text>
  <text x="300" y="285" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <text x="395" y="285" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1024</text>
  <text x="485" y="285" text-anchor="middle" font-size="12" fill="#999">65536</text>
  <text x="395" y="319" text-anchor="middle" font-size="9" fill="#d6a040">ans *= x⁸</text>

  <!-- separator -->
  <path d="M 30 314 L 530 314" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Result -->
  <rect x="30" y="314" width="500" height="46" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="80" y="342" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">结束</text>
  <text x="185" y="342" text-anchor="middle" font-size="12" fill="#999">N = 0</text>
  <text x="370" y="342" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">ans = 1024 = 2^10 ⭐</text>

  <!-- bottom note -->
  <text x="280" y="374" text-anchor="middle" font-size="11" fill="#888">累乘的恰好是 x² 与 x⁸ —— 正对应 n=10 中为 1 的两个二进制位</text>
</svg>
