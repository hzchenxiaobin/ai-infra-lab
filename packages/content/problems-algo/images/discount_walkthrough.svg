<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="r2"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="29"/><feDisplacementMap in="SourceGraphic" scale="1.4"/></filter>
  </defs>
  <rect width="580" height="340" fill="#fafafa"/>
  <text x="290" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r2)">示例演算：prices=[10,30,21], discounts=[50,60]</text>

  <!-- step1 sort -->
  <rect x="20" y="48" width="540" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r2)"/>
  <text x="36" y="70" font-size="12" font-weight="bold" fill="#446688" filter="url(#r2)">① 降序排序</text>
  <text x="36" y="90" font-size="11" fill="#333" filter="url(#r2)">p↓ = [30, 21, 10]　　d↓ = [60, 50]　　k = min(3,2) = 2</text>

  <!-- step2 pair -->
  <rect x="20" y="116" width="540" height="80" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#r2)"/>
  <text x="36" y="138" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#r2)">② 同序配对前 k 个</text>
  <g filter="url(#r2)" font-size="11">
    <text x="40" y="160" fill="#333">(30, 60) → 30 × 60 / 100 = 18.0</text>
    <text x="40" y="178" fill="#333">(21, 50) → 21 × 50 / 100 = 10.5</text>
    <text x="300" y="160" fill="#4a7a3a" font-weight="bold">减免合计 = 28.5</text>
    <text x="300" y="178" fill="#888">10 无折扣，原价保留</text>
  </g>

  <!-- step3 sum -->
  <rect x="20" y="208" width="540" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#r2)"/>
  <text x="36" y="230" font-size="12" font-weight="bold" fill="#b85450" filter="url(#r2)">③ 总价 = 原价之和 − 减免</text>
  <text x="36" y="250" font-size="11" fill="#333" filter="url(#r2)">∑p = 10 + 30 + 21 = 61　　答案 = 61 − 28.5 = 32.5 ✓</text>

  <!-- counter example -->
  <rect x="20" y="276" width="540" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="5 3" filter="url(#r2)"/>
  <text x="36" y="296" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#r2)">反例验证（错配会更差）</text>
  <text x="36" y="314" font-size="11" fill="#333" filter="url(#r2)">若 (30,50),(21,60) → 15 + 12.6 = 27.6 &lt; 28.5，总价 33.4 &gt; 32.5 → 非最优</text>
</svg>
