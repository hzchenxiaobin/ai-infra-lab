<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="720" height="430" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">示例 1 演算:nums = [3,1,4,2,5],分治三层统计出 5 对</text>

  <!-- ============ 第 1 层 ============ -->
  <text x="60" y="62" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">第 1 层:m = 2,左半 [3,1,4] | 右半 [2,5]</text>

  <!-- L/R 小表 -->
  <g filter="url(#rough2)">
    <rect x="60" y="74" width="34" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="94" y="74" width="44" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="138" y="74" width="44" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="60" y="98" width="34" height="24" rx="3" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="94" y="98" width="44" height="24" rx="3" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="138" y="98" width="44" height="24" rx="3" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="60" y="122" width="34" height="24" rx="3" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="94" y="122" width="44" height="24" rx="3" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="138" y="122" width="44" height="24" rx="3" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="60" y="146" width="34" height="24" rx="3" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="94" y="146" width="44" height="24" rx="3" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="138" y="146" width="44" height="24" rx="3" fill="#ffffff" stroke="#999" stroke-width="1"/>
  </g>
  <text x="77" y="90" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">i</text>
  <text x="116" y="90" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">nums</text>
  <text x="160" y="90" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">L(i)</text>
  <text x="77" y="114" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="116" y="114" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="160" y="114" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="77" y="138" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="116" y="138" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="160" y="138" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="77" y="162" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="116" y="162" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="160" y="162" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">∞</text>

  <g filter="url(#rough2)">
    <rect x="210" y="74" width="34" height="24" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="244" y="74" width="44" height="24" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="288" y="74" width="44" height="24" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="210" y="98" width="34" height="24" rx="3" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="244" y="98" width="44" height="24" rx="3" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="288" y="98" width="44" height="24" rx="3" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="210" y="122" width="34" height="24" rx="3" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="244" y="122" width="44" height="24" rx="3" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="288" y="122" width="44" height="24" rx="3" fill="#ffffff" stroke="#999" stroke-width="1"/>
  </g>
  <text x="227" y="90" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6420" filter="url(#rough2)">j</text>
  <text x="266" y="90" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6420" filter="url(#rough2)">nums</text>
  <text x="310" y="90" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6420" filter="url(#rough2)">R(j)</text>
  <text x="227" y="114" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="266" y="114" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="310" y="114" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">−∞</text>
  <text x="227" y="138" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="266" y="138" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="310" y="138" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>

  <!-- 跨段判定 -->
  <text x="380" y="82" font-size="11.5" font-weight="bold" fill="#555" filter="url(#rough2)">逐对检验 R(j) ≤ nums[i] &lt; nums[j] ≤ L(i):</text>
  <text x="400" y="108" font-size="11.5" fill="#b85450" filter="url(#rough2)">(0,3):3 &lt; 2 ✗</text>
  <text x="520" y="108" font-size="11.5" fill="#b85450" filter="url(#rough2)">(0,4):5 ≤ 4 ✗</text>
  <text x="400" y="130" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">(1,3):−∞ ≤ 1 &lt; 2 ≤ 4 ✓</text>
  <text x="520" y="130" font-size="11.5" fill="#b85450" filter="url(#rough2)">(1,4):2 ≤ 1 ✗</text>
  <text x="400" y="152" font-size="11.5" fill="#b85450" filter="url(#rough2)">(2,3):4 &lt; 2 ✗</text>
  <text x="520" y="152" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">(2,4):2 ≤ 4 &lt; 5 ≤ ∞ ✓</text>
  <rect x="380" y="162" width="300" height="26" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="530" y="180" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">第 1 层跨段:2 对 → (1,3)、(2,4)</text>

  <!-- ============ 第 2 层 ============ -->
  <text x="60" y="212" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">第 2 层:左半 [3,1,4] 取 m=1;右半 [2,5] 取 m=3</text>
  <text x="60" y="238" font-size="11.5" fill="#555" filter="url(#rough2)">左半跨段(L(0)=∞, L(1)=∞;R(2)=−∞):</text>
  <text x="330" y="238" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">(0,2):−∞ ≤ 3 &lt; 4 ≤ ∞ ✓</text>
  <text x="540" y="238" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">(1,2):✓</text>
  <text x="60" y="262" font-size="11.5" fill="#555" filter="url(#rough2)">右半跨段(L(3)=∞;R(4)=−∞):</text>
  <text x="330" y="262" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">(3,4):−∞ ≤ 2 &lt; 5 ≤ ∞ ✓</text>
  <rect x="60" y="274" width="580" height="26" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="350" y="292" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">第 2 层跨段:3 对 → (0,2)、(1,2)、(3,4)</text>

  <!-- ============ 第 3 层 ============ -->
  <text x="60" y="326" font-size="12.5" fill="#555" filter="url(#rough2)">第 3 层:段长 ≤ 2,跨段判定同理为空(如 [3,1] 内 (0,1):3 &lt; 1 ✗)</text>

  <!-- ============ 汇总 ============ -->
  <rect x="60" y="346" width="600" height="62" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="372" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">答案 = 2(第 1 层)+ 3(第 2 层)+ 0(第 3 层)= 5 ✓</text>
  <text x="360" y="396" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">每对 (i, j) 恰在「i 与 j 首次被中点分开」的那一层被统计,不重不漏</text>
</svg>
