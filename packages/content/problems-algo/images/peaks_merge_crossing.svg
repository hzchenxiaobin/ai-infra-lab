<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="r8"><feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="83"/><feDisplacementMap in="SourceGraphic" scale="1.4"/></filter>
    <marker id="ar8" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="460" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r8)">跨界子数组计数：总数 − 无峰跨界</text>

  <!-- merge picture: L | R -->
  <g filter="url(#r8)" font-size="11">
    <rect x="60" y="56" width="220" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="170" y="80" text-anchor="middle" fill="#446688">左 L = [lo, mid]</text>
    <rect x="290" y="56" width="220" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="400" y="80" text-anchor="middle" fill="#4a7a3a">右 R = [mid+1, hi]</text>
    <text x="280" y="52" text-anchor="middle" font-size="10" fill="#b85450">mid</text>
    <path d="M280 56 L280 100" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3 2"/>

    <!-- crossing subarray i in L, j in R -->
    <text x="170" y="116" text-anchor="middle" fill="#333">i ∈ [lo, mid]</text>
    <text x="400" y="116" text-anchor="middle" fill="#333">j ∈ [mid+1, hi]</text>
    <path d="M170 100 Q 285 130 400 100" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#ar8)"/>
    <text x="285" y="138" text-anchor="middle" font-size="10" fill="#d6a040">跨界 [i..j]，内部 = [i+1..mid] ∪ [mid+1..j−1]</text>
  </g>

  <!-- total crossing -->
  <rect x="20" y="156" width="600" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#r8)"/>
  <text x="36" y="178" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#r8)">跨界总数（j ≥ i+2）</text>
  <text x="36" y="196" font-size="11" fill="#333" filter="url(#r8)">= L.len · R.len − 1　（唯一不合法对是 i=mid, j=mid+1，j−i=1）</text>

  <!-- no-peak crossing -->
  <rect x="20" y="216" width="600" height="120" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#r8)"/>
  <text x="36" y="238" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#r8)">跨界无峰 = 左侧 [i+1..mid] 无峰 且 右侧 [mid+1..j−1] 无峰</text>
  <text x="36" y="258" font-size="11" fill="#333" filter="url(#r8)">i 的范围：i ∈ [i_min, mid]，i_min = max(lo, mid − L.suf0)</text>
  <text x="36" y="276" font-size="11" fill="#333" filter="url(#r8)">　→ a = mid − i_min = min(L.len − 1, L.suf0)</text>
  <text x="36" y="296" font-size="11" fill="#333" filter="url(#r8)">j 的范围：j ∈ [mid+1, j_max]，j_max = min(hi, mid + 1 + R.pre0)</text>
  <text x="36" y="314" font-size="11" fill="#333" filter="url(#r8)">　→ b = j_max − mid = min(R.len, 1 + R.pre0)</text>
  <text x="36" y="332" font-size="12" fill="#b85450" font-weight="bold" filter="url(#r8)">跨界无峰 = a·b + max(0, b−1)</text>

  <!-- final -->
  <rect x="20" y="346" width="600" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#r8)"/>
  <text x="36" y="368" font-size="12" font-weight="bold" fill="#b85450" filter="url(#r8)">跨界峰子数组 = (L.len·R.len − 1) − (a·b + max(0,b−1))</text>
  <text x="36" y="384" font-size="11" fill="#333" filter="url(#r8)">cnt = L.cnt + R.cnt + 跨界峰子数组　（合并 O(1)）</text>

  <!-- aggregate merge -->
  <rect x="20" y="400" width="600" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" stroke-dasharray="5 3" filter="url(#r8)"/>
  <text x="36" y="422" font-size="11" font-weight="bold" fill="#446688" filter="url(#r8)">其余字段</text>
  <text x="36" y="438" font-size="11" fill="#333" filter="url(#r8)">all0 = L.all0 ∧ R.all0；pre0 = L.pre0 + (L.all0 ? R.pre0 : 0)；suf0 = R.suf0 + (R.all0 ? L.suf0 : 0)</text>
</svg>
