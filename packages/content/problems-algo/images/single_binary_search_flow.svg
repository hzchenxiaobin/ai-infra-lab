<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
      <path d="M0 0 L7 3 L0 6 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="320" text-anchor="middle" font-size="0" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：偶数下标配对二分</text>

  <!-- start rect -->
  <rect x="185" y="19" width="190" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="46" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">left = 0，right = n − 1</text>

  <!-- start arrow (feeds into loop corner, no arrowhead) -->
  <path d="M280 61 L280 75" stroke="#555" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <!-- while diamond -->
  <path d="M280 78 L375 110 L280 142 L185 110 z" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="115" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">left &lt; right ?</text>

  <!-- No -> return -->
  <path d="M375 110 L393 110" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="384" y="102" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="395" y="89" width="150" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="470" y="116" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">返回 nums[left]</text>

  <!-- Yes -> mid -->
  <path d="M280 142 L280 178" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="164" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="175" y="180" width="210" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="206" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">mid = (left + right) // 2</text>

  <path d="M280 220 L280 248" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="140" y="250" width="280" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="276" text-anchor="middle" font-size="12" fill="#5a3a00" filter="url(#rough2)">若 mid 为奇数，mid −−（确保 mid 为偶数）</text>

  <path d="M280 290 L280 318" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- compare diamond -->
  <path d="M280 320 L390 354 L280 388 L170 354 z" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">nums[mid] ==</text>
  <text x="280" y="366" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">nums[mid+1] ?</text>

  <!-- Yes -> left = mid+2 -->
  <path d="M390 354 L403 354" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="412" y="346" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="405" y="333" width="130" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="470" y="360" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">left = mid + 2</text>

  <!-- No -> right = mid -->
  <path d="M170 354 L162 354" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="346" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="40" y="333" width="120" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="100" y="360" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">right = mid</text>

  <!-- branches down to junction (no arrowhead) -->
  <path d="M470 375 L470 415 L280 415" stroke="#555" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M100 375 L100 415 L280 415" stroke="#555" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <!-- big loop arrow back to while top -->
  <path d="M280 415 L20 415 L20 75 L280 75 L280 78" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="40" y="246" font-size="11" fill="#888" filter="url(#rough2)">循环</text>
</svg>
