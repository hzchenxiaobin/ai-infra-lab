<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：排序 + 拼接 + 全零特判</text>

  <!-- Step 1 -->
  <rect x="120" y="46" width="280" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="68" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">1. 整数 → 字符串</text>
  <text x="260" y="84" text-anchor="middle" font-size="11" fill="#446688">nums = [3,30,34,5,9] → strs</text>
  <path d="M260,94 L260,114" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="80" y="116" width="360" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="138" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">2. 自定义排序（降序）</text>
  <text x="260" y="156" text-anchor="middle" font-size="11" fill="#4a7a3a">比较函数：若 a+b &gt; b+a，则 a 排在 b 前</text>
  <text x="260" y="170" text-anchor="middle" font-size="10.5" fill="#888">（保证拼接后整体最大）</text>
  <path d="M260,178 L260,198" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="120" y="200" width="280" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="222" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">3. 排序结果</text>
  <text x="260" y="238" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">[9, 5, 34, 3, 30]</text>
  <path d="M260,248 L260,268" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4 -->
  <rect x="120" y="270" width="280" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="292" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">4. 顺序拼接为字符串</text>
  <text x="260" y="308" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">"9"+"5"+"34"+"3"+"30" = "9534330"</text>
  <path d="M260,318 L260,338" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="260,340 330,370 260,400 190,370" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="368" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">首位 == "0"?</text>
  <text x="260" y="382" text-anchor="middle" font-size="10" fill="#888">(全零)</text>

  <!-- Yes branch -->
  <path d="M190,370 L120,370" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="362" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">是</text>
  <rect x="20" y="352" width="96" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="68" y="375" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 "0"</text>

  <!-- No branch -->
  <path d="M330,370 L400,370" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="370" y="362" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="404" y="352" width="100" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="454" y="375" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回拼接结果</text>
</svg>
