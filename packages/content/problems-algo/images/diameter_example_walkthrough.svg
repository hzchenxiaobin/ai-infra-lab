<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 [1,2,3,4,5] 的递归演算</text>

  <!-- ===== Tree (left) ===== -->
  <line x1="140" y1="68" x2="80" y2="120" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="140" y1="68" x2="200" y2="120" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="80" y1="132" x2="50" y2="195" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="80" y1="132" x2="110" y2="195" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>

  <circle cx="140" cy="56" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="140" y="61" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <circle cx="80" cy="126" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="131" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <circle cx="200" cy="126" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="131" text-anchor="middle" font-size="13" fill="#333">3</text>
  <circle cx="50" cy="207" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="50" y="212" text-anchor="middle" font-size="13" fill="#333">4</text>
  <circle cx="110" cy="207" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="212" text-anchor="middle" font-size="13" fill="#333">5</text>

  <text x="125" y="250" text-anchor="middle" font-size="11" fill="#888">后序：先算 4、5，再算 2，再算 3，最后 1</text>

  <!-- ===== Table (right) ===== -->
  <!-- header -->
  <rect x="250" y="50" width="255" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="272" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">节点</text>
  <text x="312" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">l</text>
  <text x="350" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">r</text>
  <text x="390" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">l+r</text>
  <text x="432" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans</text>
  <text x="478" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">return</text>

  <!-- column separators -->
  <line x1="293" y1="50" x2="293" y2="208" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="331" y1="50" x2="331" y2="208" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="369" y1="50" x2="369" y2="208" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="411" y1="50" x2="411" y2="208" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="453" y1="50" x2="453" y2="208" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- rows -->
  <rect x="250" y="76" width="255" height="26" fill="#ffffff" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="250" y="102" width="255" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="250" y="128" width="255" height="26" fill="#ffffff" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="250" y="154" width="255" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="250" y="180" width="255" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- row 1: node 4 -->
  <text x="272" y="93" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="312" y="93" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="350" y="93" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="390" y="93" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="432" y="93" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="478" y="93" text-anchor="middle" font-size="11" fill="#333">1</text>

  <!-- row 2: node 5 -->
  <text x="272" y="119" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="312" y="119" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="350" y="119" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="390" y="119" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="432" y="119" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="478" y="119" text-anchor="middle" font-size="11" fill="#333">1</text>

  <!-- row 3: node 2 -->
  <text x="272" y="145" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="312" y="145" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="350" y="145" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="390" y="145" text-anchor="middle" font-size="11" fill="#82b366" font-weight="bold">2</text>
  <text x="432" y="145" text-anchor="middle" font-size="11" fill="#82b366" font-weight="bold">2</text>
  <text x="478" y="145" text-anchor="middle" font-size="11" fill="#333">2</text>

  <!-- row 4: node 3 -->
  <text x="272" y="171" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="312" y="171" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="350" y="171" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="390" y="171" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="432" y="171" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="478" y="171" text-anchor="middle" font-size="11" fill="#333">1</text>

  <!-- row 5: node 1 (highlighted) -->
  <text x="272" y="198" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="312" y="198" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="350" y="198" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="390" y="198" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="432" y="198" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="478" y="198" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>

  <!-- result -->
  <rect x="250" y="230" width="255" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="377" y="255" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">最终直径 ans = 3 ✓</text>
</svg>
