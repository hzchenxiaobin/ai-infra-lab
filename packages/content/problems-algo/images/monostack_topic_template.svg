<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="16" fill="#444" font-weight="bold">通用模板：遍历 → while 弹栈结算 → 入栈</text>
  <text x="320" y="48" text-anchor="middle" font-size="11" fill="#888">题型差异只在三处：单调方向、栈存下标还是值、结算时写什么（距离 / 值 / 面积 / 跨度）。</text>

  <!-- ===== Python block ===== -->
  <rect x="30" y="66" width="290" height="262" fill="#fff" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="44" y="86" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">Python 模板（递减栈找下一个更大）</text>
  <g font-family="'Bradley Hand', 'Comic Sans MS', monospace" font-size="11" fill="#333">
    <text x="44" y="108" filter="url(#rough2)">def nextGreater(nums):</text>
    <text x="44" y="124" filter="url(#rough2)">    n = len(nums)</text>
    <text x="44" y="140" filter="url(#rough2)">    res = [-1] * n</text>
    <text x="44" y="156" filter="url(#rough2)">    stack = []          # 存下标</text>
    <text x="44" y="172" filter="url(#rough2)">    for i in range(n):</text>
    <text x="44" y="188" filter="url(#rough2)">        # 栈非空 且 cur 破坏单调（更大）</text>
    <text x="44" y="204" filter="url(#rough2)">        while stack and \</text>
    <text x="44" y="218" filter="url(#rough2)">          nums[i] &gt; nums[stack[-1]]:</text>
    <text x="44" y="234" fill="#b85450" filter="url(#rough2)">            top = stack.pop()</text>
    <text x="44" y="248" fill="#b85450" filter="url(#rough2)">            res[top] = nums[i]   # ⭐结算</text>
    <text x="44" y="264" filter="url(#rough2)">        stack.append(i)   # 入栈，恢复单调</text>
    <text x="44" y="280" filter="url(#rough2)">    return res</text>
    <text x="44" y="304" font-size="10" fill="#888" filter="url(#rough2)">找下一个更小：把 &gt; 换成 &lt;（递增栈）</text>
    <text x="44" y="318" font-size="10" fill="#888" filter="url(#rough2)">算距离：res[top] = i - top（如 739）</text>
  </g>

  <!-- ===== C++ block ===== -->
  <rect x="335" y="66" width="290" height="262" fill="#fff" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="349" y="86" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">C++ 模板（递增栈找下一个更小）</text>
  <g font-family="'Bradley Hand', 'Comic Sans MS', monospace" font-size="11" fill="#333">
    <text x="349" y="108" filter="url(#rough2)">vector&lt;int&gt; nextSmaller(...){</text>
    <text x="349" y="124" filter="url(#rough2)">    int n = nums.size();</text>
    <text x="349" y="140" filter="url(#rough2)">    vector&lt;int&gt; res(n, -1);</text>
    <text x="349" y="156" filter="url(#rough2)">    stack&lt;int&gt; st;       // 存下标</text>
    <text x="349" y="172" filter="url(#rough2)">    for (int i=0;i&lt;n;i++){</text>
    <text x="349" y="188" filter="url(#rough2)">        // cur 更小 → 破坏递增</text>
    <text x="349" y="204" filter="url(#rough2)">        while(!st.empty() &amp;&amp;</text>
    <text x="349" y="218" filter="url(#rough2)">              nums[i]&lt;nums[st.top()]){</text>
    <text x="349" y="234" fill="#b85450" filter="url(#rough2)">            int top=st.top();st.pop();</text>
    <text x="349" y="248" fill="#b85450" filter="url(#rough2)">            res[top]=i;   // ⭐结算</text>
    <text x="349" y="264" filter="url(#rough2)">        }</text>
    <text x="349" y="280" filter="url(#rough2)">        st.push(i);</text>
    <text x="349" y="296" filter="url(#rough2)">    }</text>
    <text x="349" y="312" filter="url(#rough2)">}</text>
  </g>

  <!-- ===== 三件套变化表 ===== -->
  <text x="30" y="354" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">三件套随题型的变化：</text>

  <rect x="30" y="368" width="595" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <g font-size="10.5" fill="#333">
    <text x="44" y="386" font-weight="bold" fill="#d6a040" filter="url(#rough2)">题型</text>
    <text x="180" y="386" font-weight="bold" fill="#d6a040" filter="url(#rough2)">单调方向</text>
    <text x="300" y="386" font-weight="bold" fill="#d6a040" filter="url(#rough2)">栈存</text>
    <text x="400" y="386" font-weight="bold" fill="#d6a040" filter="url(#rough2)">结算写什么</text>
    <text x="540" y="386" font-weight="bold" fill="#d6a040" filter="url(#rough2)">代表题</text>

    <text x="44" y="404" filter="url(#rough2)">下一个更大</text>
    <text x="180" y="404" filter="url(#rough2)">递减（栈底→顶↓）</text>
    <text x="300" y="404" filter="url(#rough2)">下标</text>
    <text x="400" y="404" filter="url(#rough2)">值 或 i-top</text>
    <text x="540" y="404" filter="url(#rough2)">739/496/503</text>

    <text x="44" y="420" filter="url(#rough2)">柱状图最大矩形</text>
    <text x="180" y="420" filter="url(#rough2)">递增（栈底→顶↑）</text>
    <text x="300" y="420" filter="url(#rough2)">下标</text>
    <text x="400" y="420" filter="url(#rough2)">h × (i-newTop-1)</text>
    <text x="540" y="420" filter="url(#rough2)">84/85</text>

    <text x="44" y="436" filter="url(#rough2)">移位使结果最小</text>
    <text x="180" y="436" filter="url(#rough2)">递增（值越小越好）</text>
    <text x="300" y="436" filter="url(#rough2)">值(字符)</text>
    <text x="400" y="436" filter="url(#rough2)">拼字符串 + 配额</text>
    <text x="540" y="436" filter="url(#rough2)">402/316</text>

    <text x="44" y="452" filter="url(#rough2)">子数组最小值之和</text>
    <text x="180" y="452" filter="url(#rough2)">递增（两侧更小）</text>
    <text x="300" y="452" filter="url(#rough2)">下标</text>
    <text x="400" y="452" filter="url(#rough2)">arr[i]×L×R 贡献</text>
    <text x="540" y="452" filter="url(#rough2)">907</text>
  </g>
</svg>
