<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="880" height="560" fill="#fdfcf7"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">循环顺序决定：组合数 vs 排列数</text>
  <path d="M 300 42 Q 440 50 580 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="440" y="62" text-anchor="middle" font-size="11" fill="#888">amount = 5, coins = [1,2,5]</text>

  <!-- ===== LEFT: 组合数 ===== -->
  <g filter="url(#sk)">
    <rect x="30" y="80" width="400" height="450" rx="10" fill="#eef6ef" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="230" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">① 外层硬币 · 内层金额 → 组合数</text>

  <!-- pseudocode -->
  <g filter="url(#sk)">
    <rect x="50" y="120" width="360" height="78" rx="6" fill="#fbfefb" stroke="#7ab87a" stroke-width="1"/>
  </g>
  <g font-size="12" fill="#264" font-family="monospace">
    <text x="64" y="140">dp[0] = 1</text>
    <text x="64" y="158">for coin in coins:          # 外层硬币</text>
    <text x="64" y="176">    for i in range(coin, n+1): # 内层金额(正序)</text>
    <text x="64" y="194">        dp[i] += dp[i - coin]</text>
  </g>

  <!-- result badge -->
  <g filter="url(#sk)">
    <rect x="140" y="212" width="180" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="230" y="240" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e6e2e">dp[5] = 4</text>

  <!-- combinations list -->
  <text x="230" y="278" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">4 种组合（顺序无关）</text>
  <g font-size="12" fill="#346">
    <g filter="url(#sk)"><rect x="70" y="290" width="200" height="26" rx="5" fill="#fff" stroke="#9ec9a0" stroke-width="1"/></g>
    <text x="170" y="308" text-anchor="middle">5</text>
    <g filter="url(#sk)"><rect x="70" y="320" width="200" height="26" rx="5" fill="#fff" stroke="#9ec9a0" stroke-width="1"/></g>
    <text x="170" y="338" text-anchor="middle">2 + 2 + 1</text>
    <g filter="url(#sk)"><rect x="70" y="350" width="200" height="26" rx="5" fill="#fff" stroke="#9ec9a0" stroke-width="1"/></g>
    <text x="170" y="368" text-anchor="middle">2 + 1 + 1 + 1</text>
    <g filter="url(#sk)"><rect x="70" y="380" width="200" height="26" rx="5" fill="#fff" stroke="#9ec9a0" stroke-width="1"/></g>
    <text x="170" y="398" text-anchor="middle">1 + 1 + 1 + 1 + 1</text>
  </g>
  <text x="230" y="430" text-anchor="middle" font-size="10" fill="#5a8a5a">{2,2,1} 只算一次</text>
  <text x="230" y="448" text-anchor="middle" font-size="10" fill="#5a8a5a">不会出现 2+1+2 这种重复</text>
  <g filter="url(#sk)">
    <rect x="60" y="462" width="340" height="56" rx="6" fill="#fffdf3" stroke="#c9a93a" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="230" y="482" text-anchor="middle" font-size="10.5" fill="#7a5415">硬币按 coins 下标序「逐个纳入」</text>
  <text x="230" y="500" text-anchor="middle" font-size="10.5" fill="#7a5415">已轮过的不回头 → 顺序固定</text>

  <!-- ===== RIGHT: 排列数 ===== -->
  <g filter="url(#sk)">
    <rect x="450" y="80" width="400" height="450" rx="10" fill="#fef6e8" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="650" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">② 外层金额 · 内层硬币 → 排列数</text>

  <g filter="url(#sk)">
    <rect x="470" y="120" width="360" height="78" rx="6" fill="#fffef8" stroke="#d8b06a" stroke-width="1"/>
  </g>
  <g font-size="12" fill="#542" font-family="monospace">
    <text x="484" y="140">dp[0] = 1</text>
    <text x="484" y="158">for i in range(1, n+1):      # 外层金额</text>
    <text x="484" y="176">    for coin in coins:        # 内层硬币</text>
    <text x="484" y="194">        dp[i] += dp[i - coin]</text>
  </g>

  <g filter="url(#sk)">
    <rect x="560" y="212" width="180" height="44" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/>
  </g>
  <text x="650" y="240" text-anchor="middle" font-size="18" font-weight="bold" fill="#b8741a">dp[5] = 9</text>

  <text x="650" y="278" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">9 种排列（顺序有关）</text>
  <g font-size="11.5" fill="#542">
    <text x="490" y="304">5</text>
    <text x="490" y="324">2+2+1 / 2+1+2 / 1+2+2  (3种)</text>
    <text x="490" y="344">2+1+1+1 / 1+2+1+1 / 1+1+2+1 / 1+1+1+2 (4种)</text>
    <text x="490" y="364">1+1+1+1+1 (1种)</text>
  </g>
  <g filter="url(#sk)">
    <rect x="478" y="378" width="180" height="26" rx="5" fill="#fff" stroke="#e0b878" stroke-width="1"/>
  </g>
  <text x="568" y="396" text-anchor="middle" font-size="11" fill="#b8741a">合计 1+3+4+1 = 9</text>
  <text x="650" y="430" text-anchor="middle" font-size="10" fill="#a06a1a">同一组硬币不同顺序各算一次</text>
  <text x="650" y="448" text-anchor="middle" font-size="10" fill="#a06a1a">「最后一步用的是哪枚」被枚举</text>
  <g filter="url(#sk)">
    <rect x="480" y="462" width="340" height="56" rx="6" fill="#fffdf3" stroke="#c9a93a" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="650" y="482" text-anchor="middle" font-size="10.5" fill="#7a5415">固定金额 i，枚举最后一枚硬币</text>
  <text x="650" y="500" text-anchor="middle" font-size="10.5" fill="#7a5415">→ 末位不同即不同方案</text>

  <!-- bottom summary -->
  <text x="440" y="548" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">同一转移方程 dp[i] += dp[i-coin]，循环顺序不同 → 结果截然不同</text>
</svg>
