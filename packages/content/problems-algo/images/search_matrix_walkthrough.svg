<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrL2" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto">
      <path d="M9,0 L1,4.5 L9,9 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrD2" markerWidth="9" markerHeight="9" refX="4.5" refY="8" orient="auto">
      <path d="M0,0 L9,0 L4.5,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="600" height="500" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：target = 5，从右上角出发</text>

  <!-- ===== Matrix 5x5, origin x0=60 y0=64, cell 46x34 ===== -->
  <!-- col headers -->
  <text x="83"  y="58" text-anchor="middle" font-size="10" fill="#999">0</text>
  <text x="129" y="58" text-anchor="middle" font-size="10" fill="#999">1</text>
  <text x="175" y="58" text-anchor="middle" font-size="10" fill="#999">2</text>
  <text x="221" y="58" text-anchor="middle" font-size="10" fill="#999">3</text>
  <text x="267" y="58" text-anchor="middle" font-size="10" fill="#999">4</text>
  <!-- row headers -->
  <text x="50" y="85"  text-anchor="end" font-size="10" fill="#999">0</text>
  <text x="50" y="119" text-anchor="end" font-size="10" fill="#999">1</text>
  <text x="50" y="153" text-anchor="end" font-size="10" fill="#999">2</text>
  <text x="50" y="187" text-anchor="end" font-size="10" fill="#999">3</text>
  <text x="50" y="221" text-anchor="end" font-size="10" fill="#999">4</text>

  <!-- Row 0: 1 4(step4) 7(step3) 11(step2) 15(step1) -->
  <rect x="60"  y="64" width="46" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="83"  y="86" text-anchor="middle" font-size="13" fill="#999">1</text>
  <rect x="106" y="64" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="129" y="86" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="152" y="64" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="175" y="86" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
  <rect x="198" y="64" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="221" y="86" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">11</text>
  <rect x="244" y="64" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="267" y="86" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">15</text>

  <!-- Row 1: 2 5(found) 8 12 19 -->
  <rect x="60"  y="98" width="46" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="83"  y="120" text-anchor="middle" font-size="13" fill="#999">2</text>
  <rect x="106" y="98" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.6" rx="4" filter="url(#rough2)"/>
  <text x="129" y="120" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <rect x="152" y="98" width="46" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="175" y="120" text-anchor="middle" font-size="13" fill="#999">8</text>
  <rect x="198" y="98" width="46" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="221" y="120" text-anchor="middle" font-size="13" fill="#999">12</text>
  <rect x="244" y="98" width="46" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="267" y="120" text-anchor="middle" font-size="13" fill="#999">19</text>

  <!-- Row 2 -->
  <rect x="60"  y="132" width="46" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="83"  y="154" text-anchor="middle" font-size="13" fill="#999">3</text>
  <rect x="106" y="132" width="46" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="129" y="154" text-anchor="middle" font-size="13" fill="#999">6</text>
  <rect x="152" y="132" width="46" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="175" y="154" text-anchor="middle" font-size="13" fill="#999">9</text>
  <rect x="198" y="132" width="46" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="221" y="154" text-anchor="middle" font-size="13" fill="#999">16</text>
  <rect x="244" y="132" width="46" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="267" y="154" text-anchor="middle" font-size="13" fill="#999">22</text>

  <!-- Row 3 -->
  <rect x="60"  y="166" width="46" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="83"  y="188" text-anchor="middle" font-size="13" fill="#999">10</text>
  <rect x="106" y="166" width="46" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="129" y="188" text-anchor="middle" font-size="13" fill="#999">13</text>
  <rect x="152" y="166" width="46" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="175" y="188" text-anchor="middle" font-size="13" fill="#999">14</text>
  <rect x="198" y="166" width="46" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="221" y="188" text-anchor="middle" font-size="13" fill="#999">17</text>
  <rect x="244" y="166" width="46" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="267" y="188" text-anchor="middle" font-size="13" fill="#999">24</text>

  <!-- Row 4 -->
  <rect x="60"  y="200" width="46" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="83"  y="222" text-anchor="middle" font-size="13" fill="#999">18</text>
  <rect x="106" y="200" width="46" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="129" y="222" text-anchor="middle" font-size="13" fill="#999">21</text>
  <rect x="152" y="200" width="46" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="175" y="222" text-anchor="middle" font-size="13" fill="#999">23</text>
  <rect x="198" y="200" width="46" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="221" y="222" text-anchor="middle" font-size="13" fill="#999">26</text>
  <rect x="244" y="200" width="46" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="267" y="222" text-anchor="middle" font-size="13" fill="#999">30</text>

  <!-- path arrows along row 0 (left), then down to (1,1) -->
  <path d="M 240 81 L 153 81" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrL2)" filter="url(#rough2)"/>
  <path d="M 194 81 L 153 81" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrL2)" filter="url(#rough2)"/>
  <path d="M 148 81 L 107 81" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrL2)" filter="url(#rough2)"/>
  <path d="M 129 100 L 129 132" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrD2)" filter="url(#rough2)"/>

  <!-- step badges (numbered circles) -->
  <circle cx="284" cy="66" r="9" fill="#d6a040" filter="url(#rough2)"/>
  <text x="284" y="70" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">1</text>
  <circle cx="238" cy="66" r="9" fill="#d6a040" filter="url(#rough2)"/>
  <text x="238" y="70" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">2</text>
  <circle cx="192" cy="66" r="9" fill="#d6a040" filter="url(#rough2)"/>
  <text x="192" y="70" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">3</text>
  <circle cx="146" cy="66" r="9" fill="#d6a040" filter="url(#rough2)"/>
  <text x="146" y="70" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">4</text>
  <circle cx="146" cy="114" r="9" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="146" y="118" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">5</text>

  <!-- step table -->
  <text x="40"  y="266" font-size="12" fill="#444" font-weight="bold">步</text>
  <text x="90"  y="266" font-size="12" fill="#444" font-weight="bold">(row,col)</text>
  <text x="210" y="266" font-size="12" fill="#444" font-weight="bold">值</text>
  <text x="270" y="266" font-size="12" fill="#444" font-weight="bold">与 5 比较</text>
  <text x="420" y="266" font-size="12" fill="#444" font-weight="bold">动作</text>
  <line x1="30" y1="272" x2="570" y2="272" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <text x="40"  y="292" font-size="11" fill="#333">1</text>
  <text x="90"  y="292" font-size="11" fill="#333">(0,4)</text>
  <text x="210" y="292" font-size="11" fill="#333" font-weight="bold">15</text>
  <text x="270" y="292" font-size="11" fill="#b85450">15 &gt; 5</text>
  <text x="420" y="292" font-size="11" fill="#b85450">左移 col−−</text>

  <text x="40"  y="314" font-size="11" fill="#333">2</text>
  <text x="90"  y="314" font-size="11" fill="#333">(0,3)</text>
  <text x="210" y="314" font-size="11" fill="#333" font-weight="bold">11</text>
  <text x="270" y="314" font-size="11" fill="#b85450">11 &gt; 5</text>
  <text x="420" y="314" font-size="11" fill="#b85450">左移 col−−</text>

  <text x="40"  y="336" font-size="11" fill="#333">3</text>
  <text x="90"  y="336" font-size="11" fill="#333">(0,2)</text>
  <text x="210" y="336" font-size="11" fill="#333" font-weight="bold">7</text>
  <text x="270" y="336" font-size="11" fill="#b85450">7 &gt; 5</text>
  <text x="420" y="336" font-size="11" fill="#b85450">左移 col−−</text>

  <text x="40"  y="358" font-size="11" fill="#333">4</text>
  <text x="90"  y="358" font-size="11" fill="#333">(0,1)</text>
  <text x="210" y="358" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="270" y="358" font-size="11" fill="#4a7a3a">4 &lt; 5</text>
  <text x="420" y="358" font-size="11" fill="#4a7a3a">下移 row++</text>

  <text x="40"  y="380" font-size="11" fill="#333">5</text>
  <text x="90"  y="380" font-size="11" fill="#333">(1,1)</text>
  <text x="210" y="380" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="270" y="380" font-size="11" fill="#4a7a3a" font-weight="bold">5 == 5</text>
  <text x="420" y="380" font-size="11" fill="#4a7a3a" font-weight="bold">找到 ✓ return true</text>

  <!-- result box -->
  <rect x="40" y="404" width="520" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="426" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">答案 = true，仅 5 步即定位到 (1,1) = 5</text>
  <text x="300" y="446" text-anchor="middle" font-size="11" fill="#888">row 只增不减、col 只减不增 → 最多 m + n 步 → O(m + n)</text>

  <!-- legend -->
  <rect x="370" y="150" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
  <text x="390" y="161" font-size="10.5" fill="#555">途经点</text>
  <rect x="370" y="172" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
  <text x="390" y="183" font-size="10.5" fill="#555">命中目标</text>
  <rect x="470" y="150" width="14" height="14" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="490" y="161" font-size="10.5" fill="#555">未访问</text>
</svg>
