<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">环形加油站：每站净油量 diff[i] = gas[i] − cost[i]</text>

  <!-- route label -->
  <text x="36" y="62" font-size="11" fill="#888">环形路线 ↻</text>

  <!-- stations row: gas / cost -->
  <rect x="50" y="56" width="80" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="90" y="74" text-anchor="middle" font-size="11" fill="#333">站 0</text>
  <text x="90" y="92" text-anchor="middle" font-size="10" fill="#446688">g=1 c=3</text>

  <rect x="142" y="56" width="80" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="182" y="74" text-anchor="middle" font-size="11" fill="#333">站 1</text>
  <text x="182" y="92" text-anchor="middle" font-size="10" fill="#446688">g=2 c=4</text>

  <rect x="234" y="56" width="80" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="274" y="74" text-anchor="middle" font-size="11" fill="#333">站 2</text>
  <text x="274" y="92" text-anchor="middle" font-size="10" fill="#446688">g=3 c=5</text>

  <rect x="326" y="56" width="80" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="366" y="74" text-anchor="middle" font-size="11" fill="#333">站 3 ★</text>
  <text x="366" y="92" text-anchor="middle" font-size="10" fill="#4a7a3a">g=4 c=1</text>

  <rect x="418" y="56" width="80" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="458" y="74" text-anchor="middle" font-size="11" fill="#333">站 4</text>
  <text x="458" y="92" text-anchor="middle" font-size="10" fill="#446688">g=5 c=2</text>

  <!-- arrows between stations -->
  <path d="M 131 79 L 141 79" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 223 79 L 233 79" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 315 79 L 325 79" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 407 79 L 417 79" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop back arrow from 4 to 0 -->
  <path d="M 458 54 Q 458 26 280 22 Q 90 26 90 52" stroke="#888" stroke-width="1.4" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="274" y="18" text-anchor="middle" font-size="9.5" fill="#888">绕一圈回到起点</text>

  <!-- diff row -->
  <text x="36" y="132" font-size="11" fill="#888">diff:</text>
  <rect x="70" y="118" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="138" text-anchor="middle" font-size="12" fill="#333">−2</text>
  <rect x="162" y="118" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="138" text-anchor="middle" font-size="12" fill="#333">−2</text>
  <rect x="254" y="118" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="294" y="138" text-anchor="middle" font-size="12" fill="#333">−2</text>
  <rect x="346" y="118" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="386" y="138" text-anchor="middle" font-size="12" fill="#333">+3</text>
  <rect x="438" y="118" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="478" y="138" text-anchor="middle" font-size="12" fill="#333">+3</text>

  <!-- total sum box -->
  <rect x="150" y="170" width="260" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="197" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">Σ diff = −2−2−2+3+3 = 0 ≥ 0</text>

  <!-- conclusion boxes -->
  <rect x="40" y="232" width="230" height="118" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="155" y="256" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">若 Σ diff ≥ 0</text>
  <text x="155" y="280" text-anchor="middle" font-size="11.5" fill="#333">总油量 ≥ 总消耗</text>
  <text x="155" y="304" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">存在唯一解 ✓</text>
  <text x="155" y="326" text-anchor="middle" font-size="10.5" fill="#888">贪心一次遍历即可找到</text>

  <rect x="290" y="232" width="230" height="118" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="405" y="256" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">若 Σ diff &lt; 0</text>
  <text x="405" y="280" text-anchor="middle" font-size="11.5" fill="#333">总油量 &lt; 总消耗</text>
  <text x="405" y="304" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">必定无解 → 返回 −1</text>
  <text x="405" y="326" text-anchor="middle" font-size="10.5" fill="#888">绕一圈必然中途断油</text>
</svg>
