<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：按字符类型四向分支</text>

  <!-- Start -->
  <rect x="200" y="42" width="160" height="28" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="61" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">开始：cur="", num=0</text>
  <path d="M 280 70 L 280 86" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取字符 c -->
  <rect x="225" y="88" width="110" height="26" rx="6" fill="#fafafa" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="106" text-anchor="middle" font-size="11" fill="#333">取字符 c = s[i++]</text>
  <path d="M 280 114 L 280 128" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="280,130 344,162 280,194 216,162" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="160" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">c 的类型？</text>
  <text x="280" y="176" text-anchor="middle" font-size="9" fill="#888">isdigit / [ / 字母 / ]</text>

  <!-- fan-out arrows to four boxes -->
  <path d="M 250 178 C 200 196, 130 200, 80 208" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 268 190 C 250 200, 220 204, 207 208" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 292 190 C 310 200, 332 204, 342 208" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 310 178 C 360 196, 430 200, 478 208" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 1: 数字 -->
  <rect x="15" y="210" width="125" height="96" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="77" y="230" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">数字</text>
  <line x1="25" y1="238" x2="130" y2="238" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="77" y="258" text-anchor="middle" font-size="10" fill="#333">num = num×10</text>
  <text x="77" y="274" text-anchor="middle" font-size="10" fill="#333">      + int(c)</text>
  <text x="77" y="294" text-anchor="middle" font-size="9" fill="#888">累积多位</text>

  <!-- Box 2: '[' -->
  <rect x="145" y="210" width="125" height="96" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="207" y="230" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">'['</text>
  <line x1="155" y1="238" x2="260" y2="238" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="207" y="256" text-anchor="middle" font-size="10" fill="#333">strStack.push(cur)</text>
  <text x="207" y="272" text-anchor="middle" font-size="10" fill="#333">numStack.push(num)</text>
  <text x="207" y="290" text-anchor="middle" font-size="10" fill="#333">cur=""; num=0</text>

  <!-- Box 3: 字母 -->
  <rect x="280" y="210" width="125" height="96" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="342" y="230" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">字母</text>
  <line x1="290" y1="238" x2="395" y2="238" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="342" y="262" text-anchor="middle" font-size="11" fill="#333">cur += c</text>
  <text x="342" y="286" text-anchor="middle" font-size="9" fill="#888">拼到当前层</text>

  <!-- Box 4: ']' -->
  <rect x="415" y="210" width="130" height="96" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="480" y="230" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">']'</text>
  <line x1="425" y1="238" x2="535" y2="238" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="480" y="256" text-anchor="middle" font-size="10" fill="#333">k = numStack.pop()</text>
  <text x="480" y="272" text-anchor="middle" font-size="10" fill="#333">prev = strStack.pop()</text>
  <text x="480" y="292" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">cur = prev+cur×k</text>

  <!-- converge arrows down -->
  <path d="M 77 306 L 77 326 L 280 326" stroke="#666" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 207 306 L 207 326" stroke="#666" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 342 306 L 342 326" stroke="#666" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 480 306 L 480 326 L 280 326" stroke="#666" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 280 326 L 280 340" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: 还有字符? -->
  <polygon points="280,342 340,368 280,394 220,368" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="372" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">i &lt; n ?</text>

  <!-- 是: loop back up -->
  <path d="M 340 368 L 540 368 L 540 101 L 337 101" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="552" y="234" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" transform="rotate(90 552 234)">是 → 取下一字符</text>

  <!-- 否: 返回 cur -->
  <path d="M 280 394 L 280 408" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="215" y="410" width="130" height="26" rx="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="428" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">否 → 返回 cur</text>
</svg>
