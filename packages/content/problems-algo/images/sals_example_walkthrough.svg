<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="620" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [7, 2, 5, 10, 8]，k = 2，max = 10，sum = 32</text>
  <text x="310" y="44" text-anchor="middle" font-size="11" fill="#888">在上限区间 [10, 32] 上二分，贪心切分求最少段数 cnt</text>

  <!-- Table header -->
  <text x="30" y="76" font-size="11" fill="#444" font-weight="bold">步骤</text>
  <text x="74" y="76" font-size="11" fill="#444" font-weight="bold">lo</text>
  <text x="110" y="76" font-size="11" fill="#444" font-weight="bold">hi</text>
  <text x="146" y="76" font-size="11" fill="#444" font-weight="bold">mid</text>
  <text x="320" y="76" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">贪心切分（各段和）</text>
  <text x="450" y="76" font-size="11" fill="#444" font-weight="bold">cnt</text>
  <text x="498" y="76" font-size="11" fill="#444" font-weight="bold">判定</text>
  <text x="568" y="76" font-size="11" fill="#444" font-weight="bold">更新</text>

  <line x1="18" y1="84" x2="600" y2="84" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Step 1 -->
  <text x="30" y="104" font-size="11" fill="#333">1</text>
  <text x="74" y="104" font-size="11" fill="#333">10</text>
  <text x="110" y="104" font-size="11" fill="#333">32</text>
  <text x="146" y="104" font-size="11" fill="#333" font-weight="bold">21</text>
  <text x="320" y="104" text-anchor="middle" font-size="11" fill="#333">14 | <tspan font-weight="bold" fill="#d6a040">18</tspan></text>
  <text x="450" y="104" font-size="11" fill="#333">2</text>
  <text x="498" y="104" font-size="11" fill="#82b366">≤ 2 ✓</text>
  <text x="568" y="104" font-size="11" fill="#4a7a3a" font-weight="bold">ans=21,hi=20</text>

  <!-- Step 2 -->
  <text x="30" y="124" font-size="11" fill="#333">2</text>
  <text x="74" y="124" font-size="11" fill="#333">10</text>
  <text x="110" y="124" font-size="11" fill="#333">20</text>
  <text x="146" y="124" font-size="11" fill="#333" font-weight="bold">15</text>
  <text x="320" y="124" text-anchor="middle" font-size="11" fill="#333">14 | 10 | 8</text>
  <text x="450" y="124" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="498" y="124" font-size="11" fill="#b85450">&gt; 2 ✗</text>
  <text x="568" y="124" font-size="11" fill="#b85450" font-weight="bold">lo=16</text>

  <!-- Step 3 -->
  <text x="30" y="144" font-size="11" fill="#333">3</text>
  <text x="74" y="144" font-size="11" fill="#333">16</text>
  <text x="110" y="144" font-size="11" fill="#333">20</text>
  <text x="146" y="144" font-size="11" fill="#333" font-weight="bold">18</text>
  <text x="320" y="144" text-anchor="middle" font-size="11" fill="#333">14 | <tspan font-weight="bold" fill="#d6a040">18</tspan></text>
  <text x="450" y="144" font-size="11" fill="#333">2</text>
  <text x="498" y="144" font-size="11" fill="#82b366">≤ 2 ✓</text>
  <text x="568" y="144" font-size="11" fill="#4a7a3a" font-weight="bold">ans=18,hi=17</text>

  <!-- Step 4 -->
  <text x="30" y="164" font-size="11" fill="#333">4</text>
  <text x="74" y="164" font-size="11" fill="#333">16</text>
  <text x="110" y="164" font-size="11" fill="#333">17</text>
  <text x="146" y="164" font-size="11" fill="#333" font-weight="bold">16</text>
  <text x="320" y="164" text-anchor="middle" font-size="11" fill="#333">14 | 10 | 8</text>
  <text x="450" y="164" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="498" y="164" font-size="11" fill="#b85450">&gt; 2 ✗</text>
  <text x="568" y="164" font-size="11" fill="#b85450" font-weight="bold">lo=17</text>

  <!-- Step 5 -->
  <text x="30" y="184" font-size="11" fill="#333">5</text>
  <text x="74" y="184" font-size="11" fill="#333">17</text>
  <text x="110" y="184" font-size="11" fill="#333">17</text>
  <text x="146" y="184" font-size="11" fill="#333" font-weight="bold">17</text>
  <text x="320" y="184" text-anchor="middle" font-size="11" fill="#333">14 | 10 | 8</text>
  <text x="450" y="184" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="498" y="184" font-size="11" fill="#b85450">&gt; 2 ✗</text>
  <text x="568" y="184" font-size="11" fill="#b85450" font-weight="bold">lo=18</text>

  <!-- Step 6 -->
  <text x="30" y="204" font-size="11" fill="#333">6</text>
  <text x="74" y="204" font-size="11" fill="#999">18</text>
  <text x="110" y="204" font-size="11" fill="#999">17</text>
  <text x="146" y="204" font-size="11" fill="#999">—</text>
  <text x="320" y="204" text-anchor="middle" font-size="11" fill="#999">lo &gt; hi，循环结束</text>
  <text x="450" y="204" font-size="11" fill="#999">—</text>
  <text x="498" y="204" font-size="11" fill="#999">—</text>
  <text x="568" y="204" font-size="11" fill="#d6a040" font-weight="bold">返回 ans</text>

  <!-- arrow pointing to result -->
  <path d="M 568 214 L 568 230" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- interval narrowing visualization -->
  <text x="30" y="258" font-size="12" fill="#444" font-weight="bold">区间收缩：</text>

  <!-- step1 interval [10,32] -->
  <text x="30" y="282" font-size="10" fill="#888">①</text>
  <rect x="54" y="272" width="436" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <line x1="54" y1="270" x2="54" y2="290" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="54" y="264" text-anchor="middle" font-size="9" fill="#666">10</text>
  <line x1="490" y1="270" x2="490" y2="290" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490" y="264" text-anchor="middle" font-size="9" fill="#666">32</text>
  <text x="254" y="284" text-anchor="middle" font-size="10" fill="#333">mid=21 → 可行 → 去左半找更小</text>

  <!-- step2 interval [10,20] -->
  <text x="30" y="310" font-size="10" fill="#888">②</text>
  <rect x="54" y="300" width="272" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <line x1="54" y1="298" x2="54" y2="318" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="54" y="294" text-anchor="middle" font-size="9" fill="#666">10</text>
  <line x1="326" y1="298" x2="326" y2="318" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="326" y="294" text-anchor="middle" font-size="9" fill="#666">20</text>
  <text x="190" y="312" text-anchor="middle" font-size="10" fill="#333">mid=15 → 段太多 → 去右半</text>

  <!-- step3 interval [16,20] -->
  <text x="30" y="338" font-size="10" fill="#888">③</text>
  <rect x="218" y="328" width="108" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <line x1="218" y1="326" x2="218" y2="346" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="218" y="322" text-anchor="middle" font-size="9" fill="#666">16</text>
  <line x1="326" y1="326" x2="326" y2="346" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="326" y="322" text-anchor="middle" font-size="9" fill="#666">20</text>
  <text x="272" y="340" text-anchor="middle" font-size="10" fill="#333">mid=18 → 可行 → hi=17</text>

  <!-- result box -->
  <rect x="54" y="366" width="510" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="309" y="390" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">答案 = 18（limit=18 时切 [7,2,5] 与 [10,8]，最大段和 18）</text>
  <text x="309" y="412" text-anchor="middle" font-size="11" fill="#888">每次验证 O(n)，二分 O(log(sum−max)) 次 ⇒ 总 O(n log(sum−max))</text>

  <!-- legend -->
  <rect x="54" y="442" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="74" y="453" font-size="11" fill="#555">可行区间</text>
  <rect x="154" y="442" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="174" y="453" font-size="11" fill="#555">不可行区间</text>
  <rect x="264" y="442" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="284" y="453" font-size="11" fill="#555">初始区间</text>
</svg>
