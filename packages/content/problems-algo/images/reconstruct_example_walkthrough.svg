<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold">示例演算：逐人插入到位置 k</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#888">排序后 [[7,0],[7,1],[6,1],[5,0],[5,2],[4,4]] · 橙色 = 本次插入</text>

  <!-- Row 1: [7,0] @0 -->
  <text x="112" y="76" text-anchor="end" font-size="11" fill="#d6a040" font-weight="bold">①[7,0]@0</text>
  <rect x="120" y="58" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="145" y="76" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">7,0</text>
  <text x="182" y="76" font-size="10.5" fill="#888">res = [7,0]</text>

  <!-- Row 2: [7,1] @1 -->
  <text x="112" y="112" text-anchor="end" font-size="11" fill="#d6a040" font-weight="bold">②[7,1]@1</text>
  <rect x="120" y="94" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="145" y="112" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">7,0</text>
  <rect x="174" y="94" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="199" y="112" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">7,1</text>
  <text x="236" y="112" font-size="10.5" fill="#888">同身高 k 升序，放第 1 位</text>

  <!-- Row 3: [6,1] @1 -->
  <text x="112" y="148" text-anchor="end" font-size="11" fill="#d6a040" font-weight="bold">③[6,1]@1</text>
  <rect x="120" y="130" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="145" y="148" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">7,0</text>
  <rect x="174" y="130" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="199" y="148" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">6,1</text>
  <rect x="228" y="130" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="253" y="148" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">7,1</text>
  <text x="290" y="148" font-size="10.5" fill="#888">前面 1 个 ≥6 ✓</text>

  <!-- Row 4: [5,0] @0 -->
  <text x="112" y="184" text-anchor="end" font-size="11" fill="#d6a040" font-weight="bold">④[5,0]@0</text>
  <rect x="120" y="166" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="145" y="184" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">5,0</text>
  <rect x="174" y="166" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="199" y="184" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">7,0</text>
  <rect x="228" y="166" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="253" y="184" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">6,1</text>
  <rect x="282" y="166" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="307" y="184" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">7,1</text>
  <text x="344" y="184" font-size="10.5" fill="#888">前面 0 个 ≥5 ✓</text>

  <!-- Row 5: [5,2] @2 -->
  <text x="112" y="220" text-anchor="end" font-size="11" fill="#d6a040" font-weight="bold">⑤[5,2]@2</text>
  <rect x="120" y="202" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="145" y="220" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">5,0</text>
  <rect x="174" y="202" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="199" y="220" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">7,0</text>
  <rect x="228" y="202" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="253" y="220" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">5,2</text>
  <rect x="282" y="202" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="307" y="220" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">6,1</text>
  <rect x="336" y="202" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="361" y="220" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">7,1</text>
  <text x="398" y="220" font-size="10.5" fill="#888">前 2 个 ≥5 ✓</text>

  <!-- Row 6: [4,4] @4 -->
  <text x="112" y="256" text-anchor="end" font-size="11" fill="#d6a040" font-weight="bold">⑥[4,4]@4</text>
  <rect x="120" y="238" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="145" y="256" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">5,0</text>
  <rect x="174" y="238" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="199" y="256" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">7,0</text>
  <rect x="228" y="238" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="253" y="256" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">5,2</text>
  <rect x="282" y="238" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="307" y="256" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">6,1</text>
  <rect x="336" y="238" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="361" y="256" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">4,4</text>
  <rect x="390" y="238" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="415" y="256" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">7,1</text>
  <text x="452" y="256" font-size="10.5" fill="#888">前 4 个 ≥4 ✓</text>

  <!-- conclusion -->
  <rect x="32" y="280" width="456" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="48" y="302" font-size="12" fill="#4a7a3a" font-weight="bold">最终队列：[5,0],[7,0],[5,2],[6,1],[4,4],[7,1]</text>
  <text x="48" y="320" font-size="11" fill="#4a7a3a">逐位验证：末位 [7,1] 前面身高 ≥7 的恰 1 个（首位 7,0），符合 ✓</text>
  <text x="48" y="334" font-size="11" fill="#4a7a3a">每插入一个矮个，已就位高个的 k 永不被破坏</text>
</svg>
