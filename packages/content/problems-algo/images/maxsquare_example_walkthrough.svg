<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="340" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 演算：matrix → dp（值 = 以该格为右下角的最大边长）</text>

  <!-- matrix label -->
  <text x="50" y="68" font-size="12" fill="#888" font-weight="bold">matrix:</text>
  <!-- matrix grid 4x5, cell 36x36 -->
  <!-- row 0 -->
  <rect x="50" y="80" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="68" y="104" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="86" y="80" width="36" height="36" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="104" y="104" text-anchor="middle" font-size="14" fill="#999">0</text>
  <rect x="122" y="80" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="140" y="104" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="158" y="80" width="36" height="36" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="176" y="104" text-anchor="middle" font-size="14" fill="#999">0</text>
  <rect x="194" y="80" width="36" height="36" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="212" y="104" text-anchor="middle" font-size="14" fill="#999">0</text>
  <!-- row 1 -->
  <rect x="50" y="116" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="68" y="140" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="86" y="116" width="36" height="36" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="104" y="140" text-anchor="middle" font-size="14" fill="#999">0</text>
  <rect x="122" y="116" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="140" y="140" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="158" y="116" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="176" y="140" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="194" y="116" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="212" y="140" text-anchor="middle" font-size="14" fill="#333">1</text>
  <!-- row 2 -->
  <rect x="50" y="152" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="68" y="176" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="86" y="152" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="104" y="176" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="122" y="152" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="140" y="176" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="158" y="152" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="176" y="176" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="194" y="152" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="212" y="176" text-anchor="middle" font-size="14" fill="#333">1</text>
  <!-- row 3 -->
  <rect x="50" y="188" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="68" y="212" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="86" y="188" width="36" height="36" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="104" y="212" text-anchor="middle" font-size="14" fill="#999">0</text>
  <rect x="122" y="188" width="36" height="36" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="140" y="212" text-anchor="middle" font-size="14" fill="#999">0</text>
  <rect x="158" y="188" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="176" y="212" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="194" y="188" width="36" height="36" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="212" y="212" text-anchor="middle" font-size="14" fill="#999">0</text>

  <!-- arrow between -->
  <path d="M 244 152 L 322 152" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="283" y="144" text-anchor="middle" font-size="10.5" fill="#888">逐格填 dp</text>

  <!-- dp label -->
  <text x="330" y="68" font-size="12" fill="#888" font-weight="bold">dp:</text>
  <!-- dp grid 4x5, cell 36x36. Highlight 2x2 square rows1-2 cols2-3 (orange). -->
  <!-- row 0 -->
  <rect x="330" y="80" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="348" y="104" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="366" y="80" width="36" height="36" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="384" y="104" text-anchor="middle" font-size="14" fill="#999">0</text>
  <rect x="402" y="80" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="420" y="104" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="438" y="80" width="36" height="36" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="456" y="104" text-anchor="middle" font-size="14" fill="#999">0</text>
  <rect x="474" y="80" width="36" height="36" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="492" y="104" text-anchor="middle" font-size="14" fill="#999">0</text>
  <!-- row 1 -->
  <rect x="330" y="116" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="348" y="140" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="366" y="116" width="36" height="36" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="384" y="140" text-anchor="middle" font-size="14" fill="#999">0</text>
  <rect x="402" y="116" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="420" y="140" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="438" y="116" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="456" y="140" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="474" y="116" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="492" y="140" text-anchor="middle" font-size="14" fill="#333">1</text>
  <!-- row 2 -->
  <rect x="330" y="152" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="348" y="176" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="366" y="152" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="384" y="176" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="402" y="152" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="420" y="176" text-anchor="middle" font-size="14" fill="#333">1</text>
  <!-- (2,3) the key cell: thicker -->
  <rect x="438" y="152" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.8" rx="3" filter="url(#rough2)"/>
  <text x="456" y="176" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">2</text>
  <rect x="474" y="152" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="492" y="176" text-anchor="middle" font-size="14" fill="#333">2</text>
  <!-- row 3 -->
  <rect x="330" y="188" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="348" y="212" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="366" y="188" width="36" height="36" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="384" y="212" text-anchor="middle" font-size="14" fill="#999">0</text>
  <rect x="402" y="188" width="36" height="36" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="420" y="212" text-anchor="middle" font-size="14" fill="#999">0</text>
  <rect x="438" y="188" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="456" y="212" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="474" y="188" width="36" height="36" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="492" y="212" text-anchor="middle" font-size="14" fill="#999">0</text>

  <!-- annotation -->
  <rect x="40" y="252" width="500" height="68" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="290" y="278" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">关键格 (2,3)：上=1, 左=1, 左上=1 → min(1,1,1) + 1 = 2</text>
  <text x="290" y="298" text-anchor="middle" font-size="11.5" fill="#555">橙框 2×2 即「以 (2,3) 为右下角」的最大正方形；全程 maxSide = 2</text>
  <text x="290" y="314" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">答案 = maxSide² = 4</text>
</svg>
