<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">解码：个位是 width，前面是 d，切片得 x、y</text>

  <!-- example 1: 2522 -->
  <text x="60" y="66" font-size="12" fill="#3a4a66" font-weight="bold">例 1：nums[i] = 2522</text>

  <rect x="60" y="80" width="54" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="87" y="105" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">2</text>
  <rect x="114" y="80" width="54" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="141" y="105" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">5</text>
  <rect x="168" y="80" width="54" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="195" y="105" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">2</text>
  <rect x="222" y="80" width="54" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="249" y="105" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">2</text>

  <path d="M 87 122 L 87 140 M 222 122 L 222 140" stroke="#666" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 87 140 L 222 140" stroke="#666" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 152 140 L 152 152" stroke="#666" stroke-width="1" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="66" y="156" width="176" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="154" y="176" text-anchor="middle" font-size="11" fill="#333">d = 252（去掉个位）</text>

  <path d="M 249 122 L 249 152" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="266" y="156" width="130" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="331" y="176" text-anchor="middle" font-size="11" fill="#333">width = 2（个位）</text>

  <path d="M 242 186 L 242 208 L 260 208" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="266" y="192" width="96" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="314" y="206" text-anchor="middle" font-size="11" fill="#333">x = 25</text>
  <text x="314" y="219" text-anchor="middle" font-size="9" fill="#888">s[:2] 前 width 位</text>

  <path d="M 362 208 L 390 208" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="394" y="192" width="96" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="442" y="206" text-anchor="middle" font-size="11" fill="#333">y = 2</text>
  <text x="442" y="219" text-anchor="middle" font-size="9" fill="#888">s[2:] 剩余位</text>

  <rect x="66" y="234" width="424" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="278" y="254" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">解码值 = x^y = 25² = 625</text>

  <!-- example 2 -->
  <text x="60" y="292" font-size="12" fill="#3a4a66" font-weight="bold">例 2：2101 → width=1，d=210 → x=2，y=10 → 2^10 = 1024</text>
  <text x="60" y="312" font-size="12" fill="#3a4a66">总和 = 625 + 1024 = 1649（模 10⁹+7）</text>

  <rect x="60" y="330" width="440" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="345" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">x, y &lt; 10⁹ → x^y 的位数可达 90 亿</text>
  <text x="280" y="361" text-anchor="middle" font-size="10.5" fill="#555">不能算完整幂！全程模意义快速幂 O(log y)</text>
</svg>
