<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="640" height="450" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">枚举「根」= 前一半,镜像拼出全部回文数</text>

  <!-- 根 -->
  <rect x="52" y="118" width="150" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="127" y="144" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6420" filter="url(#rough2)">根 root = 123</text>

  <!-- 分叉箭头 -->
  <path d="M 210 128 Q 250 100 292 96" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 210 150 Q 250 180 292 184" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 偶数长度:123 | 321 -->
  <text x="420" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">偶数长度:root + reverse(root) = 123321</text>
  <g filter="url(#rough2)">
    <rect x="300" y="92" width="30" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="332" y="92" width="30" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="364" y="92" width="30" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <line x1="402" y1="86" x2="402" y2="130" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4"/>
    <rect x="410" y="92" width="30" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="442" y="92" width="30" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="474" y="92" width="30" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="315" y="113" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="347" y="113" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="379" y="113" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="425" y="113" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="457" y="113" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="489" y="113" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="402" y="76" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">镜像轴</text>

  <!-- 奇数长度:123 | 21 -->
  <text x="420" y="166" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">奇数长度:root + reverse(root 去末位) = 12321</text>
  <g filter="url(#rough2)">
    <rect x="300" y="180" width="30" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="332" y="180" width="30" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="364" y="180" width="30" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <line x1="402" y1="174" x2="402" y2="218" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4"/>
    <rect x="410" y="180" width="30" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="442" y="180" width="30" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="315" y="201" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="347" y="201" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="379" y="201" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6420" filter="url(#rough2)">3</text>
  <text x="425" y="201" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="457" y="201" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="379" y="228" text-anchor="middle" font-size="10" fill="#8a6420" filter="url(#rough2)">中间位 = 根的末位</text>

  <!-- 更多例子 -->
  <text x="320" y="248" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">root=1 → 11 与 1;root=10 → 1001 与 101;root=99999 → 999999999 与 9999999999(超上界丢弃)</text>

  <!-- 覆盖范围框 -->
  <rect x="40" y="268" width="560" height="76" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="294" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">root ∈ [1, 99999] 覆盖全部 ≤ 2.1×10⁹ 的回文数,约 12 万个</text>
  <text x="320" y="316" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">10 位回文的根是 5 位数;11 位回文最小为 10000000001,远超上界,无需更大</text>
  <text x="320" y="336" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">x ≤ 10⁹ 时,向上最近的同奇偶回文 ≤ 2000000002(偶)/ 999999999(奇)</text>

  <!-- 拆表 -->
  <rect x="40" y="362" width="272" height="70" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="176" y="386" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">奇回文表(有序)</text>
  <text x="176" y="408" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1, 3, 5, …, 121, 131, …,</text>
  <text x="176" y="424" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">999999999, 1000000001, …</text>

  <rect x="328" y="362" width="272" height="70" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="464" y="386" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">偶回文表(有序)</text>
  <text x="464" y="408" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2, 4, 6, 8, 22, 44, …,</text>
  <text x="464" y="424" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">…, 899999998, 2000000002</text>
</svg>
