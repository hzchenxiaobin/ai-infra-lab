<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
  </defs>
  <rect width="900" height="420" fill="#fdfcf7"/>
  <text x="450" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：两条件合取判定</text>
  <path d="M 330 40 Q 450 48 570 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- setup -->
  <g filter="url(#sk)">
    <rect x="60" y="60" width="780" height="56" rx="8" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="80" y="84" font-size="12" font-weight="bold" fill="#7a5415">输入：nums=[1,2,2,1], k=2</text>
  <text x="80" y="104" font-size="11" fill="#444" font-family="monospace">哈希 h(1)=A, h(2)=B；pref=[0, A, A^B, A, 0]</text>

  <!-- query table header -->
  <text x="60" y="142" font-size="12" font-weight="bold" fill="#2b2b2b">查询</text>
  <text x="160" y="142" font-size="12" font-weight="bold" fill="#2b2b2b">[l,r]</text>
  <text x="250" y="142" font-size="12" font-weight="bold" fill="#2b2b2b">子数组</text>
  <text x="370" y="142" font-size="12" font-weight="bold" fill="#2b2b2b">XOR=pref[r+1]^pref[l]</text>
  <text x="560" y="142" font-size="12" font-weight="bold" fill="#2b2b2b">全偶?</text>
  <text x="640" y="142" font-size="12" font-weight="bold" fill="#2b2b2b">distinct</text>
  <text x="740" y="142" font-size="12" font-weight="bold" fill="#2b2b2b">==k?</text>
  <text x="820" y="142" font-size="12" font-weight="bold" fill="#2b2b2b">结果</text>
  <line x1="50" y1="150" x2="870" y2="150" stroke="#aaa" stroke-width="1" filter="url(#sk)"/>

  <!-- row 1 -->
  <g font-size="11" fill="#444">
    <text x="60" y="174">Q0</text>
    <text x="160" y="174">[0,1]</text>
    <text x="250" y="174">[1,2]</text>
    <text x="370" y="174" font-family="monospace">pref[2]^pref[0]=A^B</text>
    <text x="560" y="174" fill="#b03a3a" font-weight="bold">≠0 否</text>
    <text x="640" y="174" fill="#888">—</text>
    <text x="740" y="174" fill="#888">—</text>
    <text x="820" y="174" fill="#b03a3a" font-weight="bold">false</text>
  </g>

  <!-- row 2 -->
  <g font-size="11" fill="#444">
    <text x="60" y="202">Q1</text>
    <text x="160" y="202">[0,3]</text>
    <text x="250" y="202">[1,2,2,1]</text>
    <text x="370" y="202" font-family="monospace">pref[4]^pref[0]=0^0=0</text>
    <text x="560" y="202" fill="#2e6e2e" font-weight="bold">=0 是</text>
    <text x="640" y="202" fill="#2e6e2e" font-weight="bold">2</text>
    <text x="740" y="202" fill="#2e6e2e" font-weight="bold">2==2 ✓</text>
    <text x="820" y="202" fill="#2e6e2e" font-weight="bold">true</text>
  </g>

  <!-- row 3 -->
  <g font-size="11" fill="#444">
    <text x="60" y="230">Q2</text>
    <text x="160" y="230">[1,2]</text>
    <text x="250" y="230">[2,2]</text>
    <text x="370" y="230" font-family="monospace">pref[3]^pref[1]=A^A=0</text>
    <text x="560" y="230" fill="#2e6e2e" font-weight="bold">=0 是</text>
    <text x="640" y="230" fill="#b03a3a" font-weight="bold">1</text>
    <text x="740" y="230" fill="#b03a3a" font-weight="bold">1≠2 ✗</text>
    <text x="820" y="230" fill="#b03a3a" font-weight="bold">false</text>
  </g>
  <line x1="50" y1="242" x2="870" y2="242" stroke="#aaa" stroke-width="1" filter="url(#sk)"/>

  <!-- combine logic -->
  <g filter="url(#sk)">
    <rect x="60" y="262" width="780" height="70" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="80" y="286" font-size="13" font-weight="bold" fill="#2b6e9e">合取判定</text>
  <text x="80" y="308" font-size="12" fill="#444" font-family="monospace">ans[i] = (pref[r+1] == pref[l])  AND  (distinct(l, r) == k)</text>
  <text x="80" y="326" font-size="11" fill="#888">XOR==0 用前缀异或 O(1)；distinct 用离线 BIT O(log n)</text>

  <!-- result -->
  <g filter="url(#sk)">
    <rect x="60" y="346" width="380" height="60" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="80" y="370" font-size="12" font-weight="bold" fill="#2e6e2e">最终结果</text>
  <text x="80" y="392" font-size="13" font-family="monospace" font-weight="bold" fill="#2e6e2e">[false, true, false]</text>

  <!-- complexity -->
  <g filter="url(#sk)">
    <rect x="460" y="346" width="380" height="60" rx="8" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="480" y="370" font-size="12" font-weight="bold" fill="#7a5415">复杂度</text>
  <text x="480" y="392" font-size="12" fill="#444" font-family="monospace">O((n + q) log n)，n,q ≤ 10^5</text>
</svg>
