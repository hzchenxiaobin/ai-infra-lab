<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：枚举 2n−1 中心 → 双指针扩展 → 每步 count+1</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">主循环枚举中心；expand 子过程每进入一次循环即得一个回文</text>

  <text x="120" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">主循环</text>
  <text x="420" y="68" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">expand 子过程</text>

  <!-- ===== Main loop (left) ===== -->
  <!-- start -->
  <rect x="60" y="78" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="120" y="100" text-anchor="middle" font-size="11" fill="#3a5a2a">开始：ans = 0</text>

  <path d="M 120 112 L 120 128" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- for loop header -->
  <rect x="56" y="130" width="128" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="120" y="152" text-anchor="middle" font-size="11" fill="#3a4a66">for i = 0 .. n−1</text>

  <path d="M 120 164 L 120 180" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- odd center -->
  <rect x="44" y="182" width="152" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="120" y="204" text-anchor="middle" font-size="10.5" fill="#7a3a3a">ans += expand(i, i)  奇</text>

  <path d="M 120 216 L 120 232" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- even center -->
  <rect x="40" y="234" width="160" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="120" y="256" text-anchor="middle" font-size="10.5" fill="#7a3a3a">ans += expand(i, i+1)  偶</text>

  <!-- loop back arrow to for header -->
  <path d="M 200 251 L 232 251 L 232 147 L 184 147" stroke="#666" stroke-width="1" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="238" y="200" font-size="9" fill="#888">i++ 继续</text>

  <!-- after loop -> return -->
  <path d="M 120 268 L 120 286" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="56" y="288" width="128" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="120" y="310" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">返回 ans</text>

  <!-- call arrow from odd box to expand sub -->
  <path d="M 196 199 L 312 150" stroke="#b85450" stroke-width="1" fill="none" stroke-dasharray="2,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="250" y="166" font-size="9" fill="#b85450">调用</text>

  <!-- ===== expand subroutine (right) ===== -->
  <rect x="316" y="78" width="208" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="420" y="100" text-anchor="middle" font-size="11" fill="#3a4a66">expand(l, r)：cnt = 0</text>

  <path d="M 420 112 L 420 130" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision diamond: in range and equal? -->
  <polygon points="420,132 532,176 420,220 308,176" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="420" y="172" text-anchor="middle" font-size="9.5" fill="#6a4a10">l≥0 且 r&lt;n</text>
  <text x="420" y="186" text-anchor="middle" font-size="9.5" fill="#6a4a10">且 s[l]==s[r]?</text>

  <!-- yes branch -> cnt++ -->
  <path d="M 420 220 L 420 240" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="234" font-size="10" fill="#4a7a3a">是</text>
  <rect x="324" y="242" width="192" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="420" y="264" text-anchor="middle" font-size="10.5" fill="#3a5a2a">cnt++; l−−; r++</text>

  <!-- loop back to decision -->
  <path d="M 516 259 L 548 259 L 548 176 L 532 176" stroke="#666" stroke-width="1" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- no branch -> return cnt -->
  <path d="M 308 176 L 268 176 L 268 320 L 316 320" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="170" font-size="10" fill="#b85450">否</text>
  <rect x="316" y="304" width="208" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="420" y="326" text-anchor="middle" font-size="11" fill="#3a5a2a">返回 cnt（回文个数）</text>

  <!-- ===== Summary ===== -->
  <rect x="30" y="356" width="500" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="50" y="376" font-size="10.5" fill="#6a4a10" font-weight="bold">关键：每次进入 expand 的 while 循环 = 一个新回文 s[l..r] → cnt+1。</text>
  <text x="50" y="394" font-size="10.5" fill="#6a4a10">奇偶中心共 2n−1 个，每个最多扩展 n/2 步 → 时间 O(n²)，空间 O(1)。</text>
</svg>
