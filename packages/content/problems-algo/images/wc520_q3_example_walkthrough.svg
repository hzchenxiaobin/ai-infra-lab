<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算:nums = [1, 5, 2]</text>

  <!-- ============ ① 原始脉冲值 ============ -->
  <text x="62" y="76" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">① 原始脉冲值</text>

  <text x="212" y="64" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">+</text>
  <text x="258" y="64" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">−</text>
  <text x="304" y="64" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">+</text>

  <rect x="190" y="68" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="212" y="89" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="236" y="68" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="258" y="89" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="282" y="68" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="304" y="89" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>

  <text x="212" y="116" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="258" y="116" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="304" y="116" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>

  <text x="400" y="90" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">P = 1 − 5 + 2 = −2</text>

  <!-- ============ ② 换成 w,枚举偶窗口 ============ -->
  <text x="62" y="164" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">② 换成 w,枚举偶数窗口</text>

  <text x="168" y="183" font-size="12" fill="#555" filter="url(#rough2)">w =</text>
  <rect x="190" y="156" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="212" y="177" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">+1</text>
  <rect x="236" y="156" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="258" y="177" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">−5</text>
  <rect x="282" y="156" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="304" y="177" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">+2</text>

  <path d="M 190 208 L 190 214 L 280 214 L 280 208" fill="none" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="235" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">窗口 [0,1]</text>

  <path d="M 236 226 L 236 232 L 326 232 L 326 226" fill="none" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="325" y="248" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">窗口 [1,2]</text>

  <text x="420" y="170" font-size="12.5" font-weight="bold" fill="#d6a040" filter="url(#rough2)">S(0,1) = (+1) + (−5) = −4 ← 最小</text>
  <text x="420" y="192" font-size="12.5" fill="#888" filter="url(#rough2)">S(1,2) = (−5) + (+2) = −3</text>
  <text x="420" y="214" font-size="12" fill="#555" filter="url(#rough2)">m = −4,增益 = −2m = +8</text>

  <!-- ============ ③ 旋转 [0..1] ============ -->
  <text x="62" y="290" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">③ 旋转最小窗口 [0..1]</text>

  <rect x="120" y="272" width="44" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="142" y="293" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="166" y="272" width="44" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="188" y="293" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="212" y="272" width="44" height="32" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="234" y="293" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>

  <path d="M 268 288 L 296 288" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="282" y="278" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">左移一位</text>

  <text x="322" y="268" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">+</text>
  <text x="368" y="268" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">−</text>
  <text x="414" y="268" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">+</text>
  <rect x="300" y="272" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="322" y="293" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="346" y="272" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="368" y="293" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="392" y="272" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="414" y="293" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>

  <text x="470" y="293" font-size="13.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">脉冲值 = 5 − 1 + 2 = 6</text>

  <!-- ============ 答案框 ============ -->
  <rect x="40" y="330" width="560" height="82" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="356" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">答案 = P − 2 × m = −2 − 2 × (−4) = −2 + 8 = 6 ✓</text>
  <text x="320" y="380" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">附示例 2:nums = [6,4,3] → w = [6,−4,3],最小偶窗口 [1,2],m = −1</text>
  <text x="320" y="400" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">答案 = 5 − 2 × (−1) = 7(旋转 [1..2] 得 [6,3,4],6−3+4 = 7)✓</text>
</svg>
