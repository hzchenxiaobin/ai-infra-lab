<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1：和为 8 的三条向下路径</text>

  <!-- neutral edges -->
  <path d="M 280 80 L 195 122" stroke="#bbbbbb" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 280 80 L 385 122" stroke="#bbbbbb" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 185 150 L 135 197" stroke="#bbbbbb" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 185 150 L 235 197" stroke="#bbbbbb" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 395 150 L 395 197" stroke="#bbbbbb" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 125 225 L 95 272" stroke="#bbbbbb" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 125 225 L 155 272" stroke="#bbbbbb" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 245 225 L 245 272" stroke="#bbbbbb" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- path 1 (red): 5 -> 3a -->
  <path d="M 185 150 L 135 197" stroke="#b85450" stroke-width="3.2" fill="none" filter="url(#rough2)"/>
  <!-- path 2 (orange): 5 -> 2 -> 1 -->
  <path d="M 185 150 L 235 197" stroke="#d6a040" stroke-width="3.2" fill="none" filter="url(#rough2)"/>
  <path d="M 245 225 L 245 272" stroke="#d6a040" stroke-width="3.2" fill="none" filter="url(#rough2)"/>
  <!-- path 3 (green): -3 -> 11 -->
  <path d="M 395 150 L 395 197" stroke="#4a7a3a" stroke-width="3.2" fill="none" filter="url(#rough2)"/>

  <!-- nodes -->
  <!-- 10 -->
  <circle cx="280" cy="65" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="70" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">10</text>
  <!-- 5 (shared endpoint of P1,P2) -->
  <circle cx="185" cy="135" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="185" y="140" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <!-- -3 (P3 start) -->
  <circle cx="395" cy="135" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="395" y="140" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">−3</text>
  <!-- 3a (P1 end) -->
  <circle cx="125" cy="210" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="125" y="215" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <!-- 2 (P2 mid) -->
  <circle cx="245" cy="210" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="245" y="215" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <!-- 11 (P3 end) -->
  <circle cx="395" cy="210" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="395" y="215" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">11</text>
  <!-- 3b -->
  <circle cx="85" cy="285" r="18" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="85" y="290" text-anchor="middle" font-size="12" fill="#999">3</text>
  <!-- -2 -->
  <circle cx="165" cy="285" r="18" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="165" y="290" text-anchor="middle" font-size="12" fill="#999">−2</text>
  <!-- 1 (P2 end) -->
  <circle cx="245" cy="285" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="245" y="290" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <!-- path labels -->
  <text x="150" y="180" font-size="11" fill="#b85450" font-weight="bold">5→3 = 8</text>
  <text x="200" y="262" font-size="11" fill="#d6a040" font-weight="bold">5→2→1 = 8</text>
  <text x="332" y="180" font-size="11" fill="#4a7a3a" font-weight="bold">−3→11 = 8</text>

  <!-- note box -->
  <rect x="40" y="330" width="480" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="352" text-anchor="middle" font-size="12" fill="#333">三处命中结束节点的前缀和都恰为 18，查询 18 − 8 = 10</text>
  <text x="280" y="372" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">命中根节点前缀和 10（出现 1 次）→ 每次贡献 1 条路径</text>
</svg>
