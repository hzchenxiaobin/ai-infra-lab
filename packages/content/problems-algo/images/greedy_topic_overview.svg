<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="16" fill="#444" font-weight="bold">贪心 = 每一步取「眼前最优」，期望拼出「全局最优」</text>
  <text x="320" y="48" text-anchor="middle" font-size="11" fill="#888">关键不是「敢不敢贪」，而是「能不能证明贪了不亏」——贪心选择性质 + 无后效性</text>

  <!-- ===== Left: the greedy loop ===== -->
  <text x="40" y="82" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">贪心循环：</text>

  <rect x="40" y="98" width="220" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="118" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① 看当前可选的候选</text>
  <text x="150" y="134" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（排序后通常是第一个/最大的）</text>

  <path d="M 150 142 L 150 156" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="160" width="220" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="180" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② 取「局部最优」的一个</text>
  <text x="150" y="196" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（不回头、不撤销）</text>

  <path d="M 150 204 L 150 218" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="222" width="220" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="242" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ 锁定，进入下一状态</text>
  <text x="150" y="258" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（已选的不再 reconsider）</text>

  <path d="M 150 266 L 150 280" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="284" width="220" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="304" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">④ 候选耗尽 → 拼成解</text>
  <text x="150" y="320" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（局部最优累加 = 全局解）</text>

  <!-- loop back -->
  <path d="M 40 306 L 18 306 L 18 120 L 40 120" stroke="#4a7a3a" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="10" y="216" font-size="9" fill="#4a7a3a" transform="rotate(-90 10 216)" filter="url(#rough2)">重复</text>

  <!-- ===== Right: correctness pillars ===== -->
  <text x="340" y="82" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">贪心正确的两根支柱：</text>

  <rect x="340" y="98" width="260" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="470" y="118" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">贪心选择性质</text>
  <text x="350" y="136" font-size="10" fill="#555" filter="url(#rough2)">存在一个最优解，它包含了</text>
  <text x="350" y="150" font-size="10" fill="#555" filter="url(#rough2)">贪心这一步选的那个元素。</text>
  <text x="350" y="166" font-size="10" fill="#888" filter="url(#rough2)">→ 「先选这个不亏」</text>

  <rect x="340" y="186" width="260" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="470" y="206" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">无后效性（最优子结构）</text>
  <text x="350" y="224" font-size="10" fill="#555" filter="url(#rough2)">做出选择后，剩余子问题</text>
  <text x="350" y="238" font-size="10" fill="#555" filter="url(#rough2)">的最优解 + 本次选择</text>
  <text x="350" y="252" font-size="10" fill="#555" filter="url(#rough2)">= 原问题最优解。</text>
  <text x="350" y="266" font-size="10" fill="#888" filter="url(#rough2)">→ 「当前选择不影响后续最优」</text>

  <!-- proof methods -->
  <rect x="340" y="274" width="260" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="470" y="292" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">两个常用证明武器</text>
  <text x="350" y="308" font-size="10" fill="#555" filter="url(#rough2)">• 交换论证：把任意解逐步换成贪心解</text>
  <text x="350" y="322" font-size="10" fill="#555" filter="url(#rough2)">• 反证法：假设更优 → 推出矛盾</text>

  <!-- warning -->
  <rect x="340" y="340" width="260" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="470" y="358" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠ 贪心不是万能的</text>
  <text x="350" y="374" font-size="10" fill="#555" filter="url(#rough2)">不具备上述性质时贪心会出错</text>
  <text x="350" y="388" font-size="10" fill="#555" filter="url(#rough2)">→ 该用 DP / 回溯（如 0-1 背包）</text>

  <!-- bottom note -->
  <text x="320" y="430" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">贪心题的难点不在写代码，而在「想到贪心策略」+「证明它对」</text>
  <text x="320" y="446" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">排序 + 扫描 / 排序 + 堆 是绝大多数贪心题的代码骨架</text>
</svg>
