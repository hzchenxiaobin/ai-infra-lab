<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="640" height="380" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">三个示例的演算:两步判定逐值过滤</text>

  <!-- ============ 示例 1 ============ -->
  <text x="60" y="66" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">示例 1:nums = [1,8,1,5,1,5,8,5] → 2</text>
  <g filter="url(#rough2)">
    <rect x="60" y="78" width="80" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="144" y="78" width="140" height="24" rx="4" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="288" y="78" width="90" height="24" rx="4" fill="#ffffff" stroke="#999" stroke-width="1"/>
  </g>
  <text x="100" y="95" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">值</text>
  <text x="214" y="95" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">位置列表(长度)</text>
  <text x="333" y="95" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">等间隔?</text>
  <g filter="url(#rough2)">
    <rect x="60" y="106" width="80" height="24" rx="4" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="144" y="106" width="140" height="24" rx="4" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="288" y="106" width="90" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="60" y="134" width="80" height="24" rx="4" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="144" y="134" width="140" height="24" rx="4" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="288" y="134" width="90" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="60" y="162" width="80" height="24" rx="4" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="144" y="162" width="140" height="24" rx="4" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="288" y="162" width="90" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="100" y="123" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="214" y="123" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[0, 2, 4](3)</text>
  <text x="333" y="123" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓ 特别</text>
  <text x="100" y="151" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8</text>
  <text x="214" y="151" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1, 6](2)</text>
  <text x="333" y="151" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗ 不是三次</text>
  <text x="100" y="179" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="214" y="179" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[3, 5, 7](3)</text>
  <text x="333" y="179" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓ 特别</text>
  <text x="440" y="123" font-size="11.5" fill="#555" filter="url(#rough2)">1 的间隔:2−0 = 2,4−2 = 2 ✓</text>
  <text x="440" y="151" font-size="11.5" fill="#555" filter="url(#rough2)">长度 ≠ 3,直接淘汰</text>
  <text x="440" y="179" font-size="11.5" fill="#555" filter="url(#rough2)">5 的间隔:5−3 = 2,7−5 = 2 ✓</text>

  <!-- ============ 示例 2 ============ -->
  <text x="60" y="222" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">示例 2:nums = [8,8,8,8] → 0</text>
  <text x="80" y="246" font-size="11.5" fill="#555" filter="url(#rough2)">8 → [0,1,2,3](4 次):「恰好三次」不满足,四次也一样淘汰</text>
  <text x="80" y="268" font-size="11.5" fill="#b85450" filter="url(#rough2)">⚠ 检查长度时不要写成 ≥ 3,「恰好」是硬条件</text>

  <!-- ============ 示例 3 ============ -->
  <text x="60" y="302" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">示例 3:nums = [8,6,6,8,8] → 0</text>
  <text x="80" y="326" font-size="11.5" fill="#555" filter="url(#rough2)">8 → [0,3,4]:三次 ✓,但 3−0 = 3 ≠ 4−3 = 1 ✗</text>
  <text x="80" y="348" font-size="11.5" fill="#555" filter="url(#rough2)">6 → [1,2]:两次 ✗ ⇒ 答案 0(等差判定:0 + 4 ≠ 2×3)</text>

  <rect x="440" y="222" width="160" height="60" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="520" y="246" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">复杂度</text>
  <text x="520" y="266" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">一遍扫描 O(n) + 逐值 O(1) 判定</text>
</svg>
