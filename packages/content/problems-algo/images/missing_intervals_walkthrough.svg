<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
  </defs>
  <rect width="860" height="340" fill="#fdfcf7"/>
  <text x="430" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：nums=[3,9,7], lower=1, upper=12</text>
  <path d="M 280 38 Q 430 46 580 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- step table header -->
  <text x="60" y="70" font-size="12" font-weight="bold" fill="#2b2b2b">步骤</text>
  <text x="160" y="70" font-size="12" font-weight="bold" fill="#2b2b2b">cur</text>
  <text x="240" y="70" font-size="12" font-weight="bold" fill="#2b2b2b">遇到 v</text>
  <text x="360" y="70" font-size="12" font-weight="bold" fill="#2b2b2b">动作</text>
  <text x="640" y="70" font-size="12" font-weight="bold" fill="#2b2b2b">输出区间</text>
  <line x1="50" y1="78" x2="800" y2="78" stroke="#aaa" stroke-width="1" filter="url(#sk)"/>

  <!-- rows -->
  <g font-size="12" fill="#444">
    <text x="60" y="102">0 初始</text>
    <text x="160" y="102" fill="#b85450" font-weight="bold">1</text>
    <text x="240" y="102">—</text>
    <text x="360" y="102">cur=lower=1</text>
    <text x="640" y="102" fill="#888">—</text>

    <text x="60" y="126">1</text>
    <text x="160" y="126" fill="#b85450" font-weight="bold">1</text>
    <text x="240" y="126" fill="#2e6e2e" font-weight="bold">3</text>
    <text x="360" y="126">v=3 &gt; cur=1 → 缺 [1,2]</text>
    <text x="640" y="126" fill="#b85450" font-weight="bold">[1,2]</text>

    <text x="60" y="150">2</text>
    <text x="160" y="150" fill="#b85450" font-weight="bold">4</text>
    <text x="240" y="150" fill="#2e6e2e" font-weight="bold">7</text>
    <text x="360" y="150">v=7 &gt; cur=4 → 缺 [4,6]</text>
    <text x="640" y="150" fill="#b85450" font-weight="bold">[4,6]</text>

    <text x="60" y="174">3</text>
    <text x="160" y="174" fill="#b85450" font-weight="bold">8</text>
    <text x="240" y="174" fill="#2e6e2e" font-weight="bold">9</text>
    <text x="360" y="174">v=9 &gt; cur=8 → 缺 [8,8]</text>
    <text x="640" y="174" fill="#b85450" font-weight="bold">[8,8]</text>

    <text x="60" y="198">4 末尾</text>
    <text x="160" y="198" fill="#b85450" font-weight="bold">10</text>
    <text x="240" y="198">—</text>
    <text x="360" y="198">cur=10 ≤ upper=12 → [10,12]</text>
    <text x="640" y="198" fill="#b85450" font-weight="bold">[10,12]</text>
  </g>

  <line x1="50" y1="210" x2="800" y2="210" stroke="#aaa" stroke-width="1" filter="url(#sk)"/>

  <!-- sorted input note -->
  <g filter="url(#sk)">
    <rect x="60" y="226" width="380" height="56" rx="8" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="80" y="250" font-size="12" font-weight="bold" fill="#7a5415">预处理</text>
  <text x="80" y="270" font-size="11" fill="#444" font-family="monospace">nums 去重 → 仅留 ∈[1,12] → 升序: [3, 7, 9]</text>

  <!-- result note -->
  <g filter="url(#sk)">
    <rect x="460" y="226" width="340" height="56" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="480" y="250" font-size="12" font-weight="bold" fill="#2e6e2e">最终结果</text>
  <text x="480" y="270" font-size="11" fill="#444" font-family="monospace">[[1,2],[4,6],[8,8],[10,12]]</text>

  <!-- edge case reminder -->
  <text x="60" y="312" font-size="11" fill="#888">边界：nums 全覆盖 [lower,upper] → 输出空；lower==upper 且缺失 → [[lower,lower]]</text>
</svg>
