<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">二分答案：阈值 mid 越大 → 距离 ≤ mid 的数对数 count(mid) 越多（单调递增）</text>

  <!-- ===== Pairs of sorted array ===== -->
  <text x="30" y="52" font-size="12" fill="#888">排序后 nums = [1, 2, 4, 7]，全部数对距离：</text>

  <!-- pair distance chips -->
  <rect x="40" y="64" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="68" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="68" y="102" text-anchor="middle" font-size="9" fill="#999">(0,1)</text>

  <rect x="106" y="64" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="134" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="134" y="102" text-anchor="middle" font-size="9" fill="#999">(1,2)</text>

  <rect x="172" y="64" width="56" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="200" y="102" text-anchor="middle" font-size="9" fill="#999">(0,2)</text>

  <rect x="238" y="64" width="56" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="266" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="266" y="102" text-anchor="middle" font-size="9" fill="#999">(2,3)</text>

  <rect x="304" y="64" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="332" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <text x="332" y="102" text-anchor="middle" font-size="9" fill="#999">(1,3)</text>

  <rect x="370" y="64" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="398" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
  <text x="398" y="102" text-anchor="middle" font-size="9" fill="#999">(0,3)</text>

  <text x="448" y="82" font-size="11" fill="#888">排序：[1,2,3,3,5,6]</text>
  <text x="448" y="98" font-size="11" fill="#d6a040" font-weight="bold">k=4 → 第4小 = 3</text>

  <!-- arrow down -->
  <path d="M 290 116 L 290 134" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="304" y="128" font-size="11" fill="#888">count(mid) 单调递增</text>

  <!-- ===== Monotonic curve ===== -->
  <line x1="70" y1="150" x2="70" y2="330" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="70" y1="330" x2="430" y2="330" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="64" y="156" text-anchor="end" font-size="10" fill="#888">count</text>
  <text x="434" y="334" font-size="10" fill="#888">mid →</text>
  <text x="64" y="334" text-anchor="end" font-size="9" fill="#999">0</text>

  <!-- y axis ticks -->
  <text x="64" y="304" text-anchor="end" font-size="9" fill="#aaa">4</text>
  <text x="64" y="200" text-anchor="end" font-size="9" fill="#aaa">6</text>

  <!-- increasing step-like curve: mid:0→cnt0, 1→1, 2→2, 3→4, 4→4, 5→5, 6→6 -->
  <!-- x: mid 0..6 mapped to 90..420 (55px each), y: cnt 0..6 mapped to 330..180 (25px each) -->
  <path d="M 90 330 L 90 305 L 145 305 L 145 280 L 200 280 L 200 230 L 310 230 L 310 205 L 365 205 L 365 180 L 420 180" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="260" y="222" font-size="11" fill="#446688" font-weight="bold">mid ↑ ⇒ count ↑</text>

  <!-- mid axis labels -->
  <text x="90" y="346" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="145" y="346" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="200" y="346" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="255" y="346" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">3</text>
  <text x="310" y="346" text-anchor="middle" font-size="9" fill="#aaa">4</text>
  <text x="365" y="346" text-anchor="middle" font-size="9" fill="#aaa">5</text>
  <text x="420" y="346" text-anchor="middle" font-size="9" fill="#aaa">6</text>

  <!-- k threshold line -->
  <line x1="70" y1="305" x2="430" y2="305" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="434" y="309" font-size="11" fill="#b85450" font-weight="bold">k = 4</text>

  <!-- answer point at mid=3 (count jumps to 4) -->
  <circle cx="255" cy="230" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="255" y1="230" x2="255" y2="330" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="255" y="362" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">mid* = 3</text>

  <!-- feasible / infeasible labels -->
  <text x="110" y="300" font-size="10" fill="#b85450">count &lt; k ✗</text>
  <text x="330" y="300" font-size="10" fill="#4a7a3a">count ≥ k ✓</text>

  <!-- right summary note -->
  <rect x="448" y="150" width="120" height="118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="508" y="174" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">答案空间</text>
  <text x="508" y="196" text-anchor="middle" font-size="11" fill="#666">mid ∈ [0, max−min]</text>
  <text x="508" y="216" text-anchor="middle" font-size="11" fill="#666">求最小的 mid</text>
  <text x="508" y="236" text-anchor="middle" font-size="11" fill="#666">使 count(mid) ≥ k</text>
  <text x="508" y="258" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">单调 ⇒ 可二分！</text>

  <!-- note about jump -->
  <rect x="70" y="372" width="440" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="290" y="386" text-anchor="middle" font-size="10" fill="#4a7a3a">mid=3 时 count 从 2 跳到 4（两个距离同为 3），故必须用 count ≥ k 而非 == k</text>
</svg>
