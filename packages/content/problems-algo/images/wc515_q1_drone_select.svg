<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">最近无人机：曼哈顿距离 + 飞行范围过滤</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">d = |x-tx| + |y-ty|，若 d &lt;= range 则可达，取距离最小者</text>

  <text x="40" y="72" font-size="11" fill="#333" font-weight="bold">drones = [[0,0,8],[2,2,9]], target = [3,4]</text>

  <rect x="30" y="82" width="500" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="60" y="102" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">下标</text>
  <text x="140" y="102" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">坐标</text>
  <text x="250" y="102" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">range</text>
  <text x="340" y="102" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">距离 d</text>
  <text x="440" y="102" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">可达?</text>
  <text x="510" y="102" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">选择</text>

  <rect x="30" y="110" width="500" height="28" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="130" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="140" y="130" text-anchor="middle" font-size="11" fill="#333">(0,0)</text>
  <text x="250" y="130" text-anchor="middle" font-size="11" fill="#333">8</text>
  <text x="340" y="130" text-anchor="middle" font-size="11" fill="#333">7</text>
  <text x="440" y="130" text-anchor="middle" font-size="11" fill="#4a7a3a">Yes (7&lt;=8)</text>
  <text x="510" y="130" text-anchor="middle" font-size="11" fill="#888">—</text>

  <rect x="30" y="138" width="500" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="60" y="158" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="140" y="158" text-anchor="middle" font-size="11" fill="#333">(2,2)</text>
  <text x="250" y="158" text-anchor="middle" font-size="11" fill="#333">9</text>
  <text x="340" y="158" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="440" y="158" text-anchor="middle" font-size="11" fill="#4a7a3a">Yes (3&lt;=9)</text>
  <text x="510" y="158" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Yes</text>

  <g stroke="#dddddd" stroke-width="1">
    <line x1="90" y1="82" x2="90" y2="166" filter="url(#rough2)"/>
    <line x1="200" y1="82" x2="200" y2="166" filter="url(#rough2)"/>
    <line x1="300" y1="82" x2="300" y2="166" filter="url(#rough2)"/>
    <line x1="390" y1="82" x2="390" y2="166" filter="url(#rough2)"/>
    <line x1="480" y1="82" x2="480" y2="166" filter="url(#rough2)"/>
  </g>

  <rect x="30" y="180" width="500" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="202" font-size="11" fill="#333" font-weight="bold">距离计算：d = |x-tx| + |y-ty|</text>
  <text x="50" y="220" font-size="10.5" fill="#555">drone[0]: |0-3| + |0-4| = 3+4 = 7</text>
  <text x="50" y="234" font-size="10.5" fill="#555">drone[1]: |2-3| + |2-4| = 1+2 = 3 (最小)</text>

  <rect x="30" y="248" width="500" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="270" font-size="11" fill="#4a7a3a" font-weight="bold">答案：返回下标 1（距离 3 最小）</text>
  <text x="50" y="288" font-size="10.5" fill="#555">一次遍历 O(n)，维护 best_dist 和 best_idx</text>

  <rect x="30" y="316" width="500" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="50" y="338" font-size="10.5" fill="#b85450" font-weight="bold">边界：无无人机可达时返回 -1</text>
  <text x="50" y="354" font-size="10.5" fill="#555">距离相同取最小下标：用 &lt; 而非 &lt;= 比较距离</text>
</svg>
