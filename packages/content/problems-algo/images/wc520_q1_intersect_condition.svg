<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 585" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="585" fill="#fafafa"/>
  <text x="320" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">闭区间相交判定:max(start) ≤ min(end)</text>

  <!-- ============ 情形 A:重叠相交 ============ -->
  <rect x="30" y="52" width="580" height="130" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="78" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">情形 A:普通重叠 → 相交 ✓</text>

  <!-- 数轴 -->
  <path d="M 70 140 L 600 140" stroke="#999" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="150" y1="134" x2="150" y2="146" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="230" y1="134" x2="230" y2="146" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="310" y1="134" x2="310" y2="146" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="390" y1="134" x2="390" y2="146" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="470" y1="134" x2="470" y2="146" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="550" y1="134" x2="550" y2="146" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="150" y="160" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="230" y="160" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="310" y="160" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="390" y="160" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4</text>
  <text x="470" y="160" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">5</text>
  <text x="550" y="160" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">6</text>

  <!-- 交集高亮带 [3,4] -->
  <rect x="310" y="88" width="80" height="52" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
  <text x="350" y="104" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">交集</text>
  <text x="350" y="118" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">[3,4]</text>

  <!-- 区间 A=[1,4] -->
  <rect x="150" y="92" width="240" height="16" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="87" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">[1, 4]</text>
  <!-- 区间 B=[3,6] -->
  <rect x="310" y="118" width="240" height="16" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="148" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">[3, 6]</text>

  <!-- ============ 情形 B:端点相切 ============ -->
  <rect x="30" y="196" width="580" height="130" rx="10" fill="#ffffff" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="222" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">情形 B:只共享一个端点 → 也算相交 ✓(本题最大陷阱)</text>

  <!-- 数轴 -->
  <path d="M 70 284 L 600 284" stroke="#999" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="150" y1="278" x2="150" y2="290" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="230" y1="278" x2="230" y2="290" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="310" y1="278" x2="310" y2="290" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="390" y1="278" x2="390" y2="290" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="470" y1="278" x2="470" y2="290" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="550" y1="278" x2="550" y2="290" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="150" y="304" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="230" y="304" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="310" y="304" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="390" y="304" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4</text>
  <text x="470" y="304" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">5</text>
  <text x="550" y="304" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">6</text>

  <!-- 切点高亮 -->
  <circle cx="230" cy="252" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="256" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">2</text>

  <!-- 区间 [1,2] -->
  <rect x="150" y="236" width="80" height="16" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="231" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">[1, 2]</text>
  <!-- 区间 [2,3] -->
  <rect x="230" y="262" width="80" height="16" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="292" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">[2, 3]</text>
  <text x="440" y="266" font-size="11" fill="#b85450" filter="url(#rough2)">公共点 x = 2,</text>
  <text x="440" y="282" font-size="11" fill="#b85450" filter="url(#rough2)">闭区间含端点 → 相交</text>

  <!-- ============ 情形 C:相离 ============ -->
  <rect x="30" y="340" width="580" height="130" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="366" font-size="13" font-weight="bold" fill="#888" filter="url(#rough2)">情形 C:中间有空隙 → 不相交 ✗</text>

  <!-- 数轴 -->
  <path d="M 70 428 L 600 428" stroke="#999" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="150" y1="422" x2="150" y2="434" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="230" y1="422" x2="230" y2="434" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="310" y1="422" x2="310" y2="434" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="390" y1="422" x2="390" y2="434" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="470" y1="422" x2="470" y2="434" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="550" y1="422" x2="550" y2="434" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="150" y="448" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="230" y="448" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="310" y="448" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="390" y="448" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4</text>
  <text x="470" y="448" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">5</text>
  <text x="550" y="448" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">6</text>

  <!-- 空隙标注 -->
  <path d="M 240 388 L 300 388" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="270" y="378" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">有空隙</text>

  <!-- 区间 [1,2] -->
  <rect x="150" y="396" width="80" height="16" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="391" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">[1, 2]</text>
  <!-- 区间 [3,4] -->
  <rect x="310" y="396" width="80" height="16" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="391" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">[3, 4]</text>
  <text x="430" y="412" font-size="11" fill="#888" filter="url(#rough2)">2 &lt; 3:左区间整体</text>
  <text x="430" y="428" font-size="11" fill="#888" filter="url(#rough2)">在右区间左侧</text>

  <!-- 公式框 -->
  <rect x="40" y="482" width="560" height="88" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="508" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">相交 ⟺ max(a, c) ≤ min(b, d) ⟺ a ≤ d 且 c ≤ b</text>
  <text x="320" y="532" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">不相交 ⟺ b &lt; c 或 d &lt; a(严格小于,端点相等不算相离)</text>
  <text x="320" y="556" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">一行判定,O(1) 检查每一对;情形 B 用等号 ≤ 正确覆盖</text>
</svg>
