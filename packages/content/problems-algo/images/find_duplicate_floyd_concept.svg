<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    <marker id="arL" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="900" height="480" fill="#fafafa"/>
  <text x="450" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">把数组当成链表：nums[i] 是节点 i 的"下一条边"</text>
  <path d="M 300 48 Q 450 56 600 48" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 顶部数组表 -->
  <text x="120" y="92" font-size="14" font-weight="bold" fill="#555">nums = [1, 3, 4, 2, 2]</text>
  <g filter="url(#sk)">
    <rect x="120" y="100" width="58" height="32" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="178" y="100" width="58" height="32" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="236" y="100" width="58" height="32" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="294" y="100" width="58" height="32" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="352" y="100" width="58" height="32" rx="4" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="149" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">1</text>
  <text x="207" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">3</text>
  <text x="265" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">4</text>
  <text x="323" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">2</text>
  <text x="381" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">2</text>
  <text x="149" y="150" text-anchor="middle" font-size="11" fill="#888">下标0</text>
  <text x="207" y="150" text-anchor="middle" font-size="11" fill="#888">下标1</text>
  <text x="265" y="150" text-anchor="middle" font-size="11" fill="#888">下标2</text>
  <text x="323" y="150" text-anchor="middle" font-size="11" fill="#888">下标3</text>
  <text x="381" y="150" text-anchor="middle" font-size="11" fill="#888">下标4</text>

  <!-- 区域标注 -->
  <text x="190" y="208" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">尾巴（环外）</text>
  <text x="640" y="208" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">环内</text>

  <!-- 节点 0 -->
  <g filter="url(#sk)">
    <ellipse cx="150" cy="260" rx="30" ry="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="150" y="266" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">0</text>

  <!-- 节点 1 -->
  <g filter="url(#sk)">
    <ellipse cx="300" cy="260" rx="30" ry="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="300" y="266" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">1</text>

  <!-- 节点 3 -->
  <g filter="url(#sk)">
    <ellipse cx="450" cy="260" rx="30" ry="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="450" y="266" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">3</text>

  <!-- 节点 2 = 环入口/重复数（强调红色） -->
  <g filter="url(#sk)">
    <ellipse cx="620" cy="260" rx="34" ry="27" fill="#fce4ec" stroke="#b85450" stroke-width="2.6"/>
  </g>
  <text x="620" y="267" text-anchor="middle" font-size="17" font-weight="bold" fill="#b85450">2</text>

  <!-- 节点 4 -->
  <g filter="url(#sk)">
    <ellipse cx="620" cy="392" rx="30" ry="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="620" y="398" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">4</text>

  <!-- 箭头 0->1 -->
  <path d="M 180 260 L 268 260" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>
  <!-- 箭头 1->3 -->
  <path d="M 330 260 L 418 260" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>
  <!-- 箭头 3->2 -->
  <path d="M 480 260 L 584 260" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>
  <!-- 箭头 2->4 (向下) -->
  <path d="M 620 288 L 620 366" stroke="#4a7a3a" stroke-width="1.9" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <!-- 箭头 4->2 (回环，红色虚线强调) -->
  <path d="M 590 392 Q 520 360 520 305 Q 520 262 586 260" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arR)" stroke-dasharray="5 4" filter="url(#sk)"/>

  <!-- 边标签 -->
  <text x="224" y="252" text-anchor="middle" font-size="10" fill="#888">nums[0]=1</text>
  <text x="374" y="252" text-anchor="middle" font-size="10" fill="#888">nums[1]=3</text>
  <text x="532" y="252" text-anchor="middle" font-size="10" fill="#888">nums[3]=2</text>
  <text x="642" y="330" font-size="10" fill="#888">nums[2]=4</text>
  <text x="498" y="330" text-anchor="end" font-size="10" fill="#b85450">nums[4]=2（回边）</text>

  <!-- 环入口强调标注 -->
  <path d="M 660 240 L 730 196" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="710" y="160" width="170" height="44" rx="8" fill="#fce4ec" stroke="#b85450"/>
  </g>
  <text x="795" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">环入口 = 节点 2</text>
  <text x="795" y="196" text-anchor="middle" font-size="12" fill="#b85450">= 重复数字</text>

  <!-- 快慢指针小图示 -->
  <text x="150" y="452" font-size="13" font-weight="bold" fill="#446688">🐢 slow 每走 1 步</text>
  <text x="150" y="470" font-size="13" font-weight="bold" fill="#4a7a3a">🐰 fast 每走 2 步</text>
  <g filter="url(#sk)">
    <rect x="430" y="436" width="360" height="36" rx="8" fill="#fffdf3" stroke="#d6a040"/>
  </g>
  <text x="610" y="459" text-anchor="middle" font-size="12" fill="#7a5415">n+1 条边塞进 n 个非零节点 ⟹ 必有环（鸽巢）</text>
</svg>
