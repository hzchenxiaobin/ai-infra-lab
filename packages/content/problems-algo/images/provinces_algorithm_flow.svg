<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">并查集解法流程</text>

  <!-- init -->
  <rect x="190" y="44" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="62" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">初始化</text>
  <text x="270" y="77" text-anchor="middle" font-size="10.5" fill="#666">parent[i]=i, count=n</text>
  <line x1="270" y1="84" x2="270" y2="104" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop -->
  <rect x="170" y="104" width="200" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="125" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">遍历所有 (i, j), i &lt; j</text>
  <line x1="270" y1="138" x2="270" y2="158" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision -->
  <path d="M 270 158 L 360 200 L 270 242 L 180 200 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="196" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">isConnected</text>
  <text x="270" y="212" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">[i][j]==1 ?</text>

  <!-- no branch -->
  <text x="120" y="196" font-size="11" fill="#888">否</text>
  <path d="M 180 200 L 130 200 L 130 124 L 170 124" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="92" y="118" font-size="10" fill="#888">跳过，继续下一对</text>

  <!-- yes branch -->
  <text x="380" y="196" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <line x1="360" y1="200" x2="410" y2="200" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="410" y="182" width="110" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="465" y="200" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">union(i, j)</text>
  <text x="465" y="214" text-anchor="middle" font-size="10" fill="#666">合并两集合</text>
  <line x1="465" y1="220" x2="465" y2="240" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- union detail -->
  <rect x="370" y="240" width="190" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="465" y="258" text-anchor="middle" font-size="10.5" fill="#333">ri=find(i), rj=find(j)</text>
  <text x="465" y="274" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">ri != rj ?</text>
  <text x="465" y="290" text-anchor="middle" font-size="10.5" fill="#4a7a3a">挂接 + count--</text>
  <path d="M 465 304 Q 465 330 360 330 L 270 330" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="324" font-size="10" fill="#888">回到循环</text>

  <!-- end -->
  <line x1="270" y1="330" x2="270" y2="346" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="170" y="346" width="200" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="365" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 count</text>
</svg>
