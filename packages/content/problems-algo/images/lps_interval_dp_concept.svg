<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">区间 DP：dp[i][j] = s[i..j] 的最长回文子序列长度</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">两端配对向内缩 +2；不配对则舍弃一端取较大</text>

  <!-- ===== string row s = b b b a b ===== -->
  <g font-size="13" fill="#333">
    <rect x="116" y="66" width="44" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="138" y="91" text-anchor="middle" fill="#4a7a3a" font-weight="bold">b</text>
    <rect x="160" y="66" width="44" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="182" y="91" text-anchor="middle" fill="#555">b</text>
    <rect x="204" y="66" width="44" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="226" y="91" text-anchor="middle" fill="#555">b</text>
    <rect x="248" y="66" width="44" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="270" y="91" text-anchor="middle" fill="#555">a</text>
    <rect x="292" y="66" width="44" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="314" y="91" text-anchor="middle" fill="#4a7a3a" font-weight="bold">b</text>
  </g>
  <!-- i / j pointers -->
  <text x="138" y="58" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">i</text>
  <text x="314" y="58" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">j</text>
  <!-- matched bracket -->
  <path d="M 132 108 Q 138 116 144 108" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 308 108 Q 314 116 320 108" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="226" y="128" text-anchor="middle" font-size="10" fill="#4a7a3a">s[i]==s[j]：首尾配对，内部 s[i+1..j-1]</text>

  <!-- ===== dependency mini-grid (left) ===== -->
  <text x="120" y="158" font-size="11" fill="#666" font-weight="bold">依赖方向（更短区间）</text>
  <g font-size="10" fill="#333">
    <!-- labels -->
    <text x="92" y="196" text-anchor="middle" font-size="9" fill="#888">i</text>
    <text x="92" y="232" text-anchor="middle" font-size="9" fill="#888">i+1</text>
    <text x="130" y="174" text-anchor="middle" font-size="9" fill="#888">j-1</text>
    <text x="180" y="174" text-anchor="middle" font-size="9" fill="#888">j</text>
    <!-- dp[i][j-1]  (left, same row) -->
    <rect x="108" y="184" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="130" y="203" text-anchor="middle" fill="#d6a040">左缩</text>
    <!-- dp[i][j]  (current, red) -->
    <rect x="158" y="184" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="180" y="203" text-anchor="middle" fill="#b85450" font-weight="bold">dp[i][j]</text>
    <!-- dp[i+1][j-1]  (inner, green) -->
    <rect x="108" y="220" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="130" y="239" text-anchor="middle" fill="#4a7a3a" font-weight="bold">内缩</text>
    <!-- dp[i+1][j]  (below) -->
    <rect x="158" y="220" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="180" y="239" text-anchor="middle" fill="#d6a040">下缩</text>
  </g>
  <!-- arrows into dp[i][j] -->
  <path d="M 154 198 L 156 198" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 150 222 L 174 214" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 180 218 L 180 214" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- ===== recurrence formulas (right) ===== -->
  <rect x="248" y="156" width="300" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="398" y="176" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">状态转移</text>
  <text x="260" y="198" font-family="monospace" font-size="11" fill="#4a7a3a">if s[i] == s[j]:</text>
  <text x="272" y="214" font-family="monospace" font-size="11" fill="#4a7a3a">dp[i][j] = dp[i+1][j-1] + 2</text>
  <text x="260" y="232" font-family="monospace" font-size="11" fill="#d6a040">else:</text>
  <text x="272" y="248" font-family="monospace" font-size="11" fill="#d6a040">dp[i][j] = max(dp[i+1][j], dp[i][j-1])</text>

  <!-- ===== boundary ===== -->
  <rect x="40" y="274" width="508" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="294" y="295" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">边界：dp[i][i] = 1（单字符）；dp[i][i-1] = 0（空串，i &gt; j）</text>

  <!-- ===== answer ===== -->
  <rect x="40" y="318" width="508" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="294" y="339" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">答案：dp[0][n-1]（整个串的最长回文子序列）</text>

  <!-- ===== fill order note ===== -->
  <rect x="40" y="360" width="508" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="294" y="378" text-anchor="middle" font-size="10" fill="#555">填表顺序：i 从 n-1 到 0（自下而上），j 从 i+1 到 n-1（自左而右）</text>
</svg>
