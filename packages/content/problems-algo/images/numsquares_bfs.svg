<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#888"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="470" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">BFS 建模为最短路径（n = 12）</text>
  <path d="M 190 38 Q 320 46 450 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="56" text-anchor="middle" font-size="10" fill="#888">每条边 = 加一个完全平方数；BFS 层序 = 最少个数</text>

  <!-- layer labels -->
  <g font-size="10" fill="#9a7a2a" font-weight="bold">
    <text x="22" y="74">步数0</text>
    <text x="22" y="164">步数1</text>
    <text x="22" y="269">步数2</text>
    <text x="22" y="389">步数3</text>
  </g>

  <!-- ===== Edges (draw first so nodes sit on top) ===== -->
  <!-- L0 -> L1 -->
  <path d="M 378 86 L 232 150" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="290" y="112" font-size="9" fill="#888">+1</text>
  <path d="M 400 88 L 400 148" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="412" y="122" font-size="9" fill="#b03a3a" font-weight="bold">+4</text>
  <path d="M 422 86 L 568 150" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="510" y="112" font-size="9" fill="#888">+9</text>

  <!-- L1 -> L2 -->
  <path d="M 208 178 L 132 249" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="150" y="210" font-size="9" fill="#888">+1</text>
  <path d="M 230 180 L 230 249" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="240" y="218" font-size="9" fill="#888">+4</text>
  <path d="M 252 178 L 318 249" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="300" y="210" font-size="9" fill="#888">+9</text>
  <path d="M 422 178 L 428 249" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="440" y="218" font-size="9" fill="#b03a3a" font-weight="bold">+4</text>

  <!-- L2 -> L3 -->
  <path d="M 110 283 L 92 369" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="78" y="328" font-size="9" fill="#888">+1</text>
  <path d="M 132 283 L 168 369" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="170" y="320" font-size="9" fill="#888">+4</text>
  <path d="M 152 283 L 258 369" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="220" y="318" font-size="9" fill="#888">+9</text>
  <path d="M 430 283 L 430 369" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="442" y="330" font-size="9" fill="#b03a3a" font-weight="bold">+4</text>

  <!-- ===== Nodes ===== -->
  <g font-size="12" font-weight="bold">
    <!-- L0: 0 (start, on path) -->
    <g filter="url(#sk)"><rect x="378" y="54" width="44" height="32" rx="6" fill="#eaf6ee" stroke="#b85450" stroke-width="2"/></g>
    <text x="400" y="75" text-anchor="middle" fill="#2e6e2e">0</text>

    <!-- L1 -->
    <g filter="url(#sk)"><rect x="208" y="148" width="44" height="32" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
    <text x="230" y="169" text-anchor="middle" fill="#2b6e9e">1</text>
    <g filter="url(#sk)"><rect x="378" y="148" width="44" height="32" rx="6" fill="#e8f0fa" stroke="#b85450" stroke-width="2"/></g>
    <text x="400" y="169" text-anchor="middle" fill="#2b6e9e">4</text>
    <g filter="url(#sk)"><rect x="548" y="148" width="44" height="32" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
    <text x="570" y="169" text-anchor="middle" fill="#2b6e9e">9</text>

    <!-- L2 -->
    <g filter="url(#sk)"><rect x="108" y="253" width="44" height="32" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
    <text x="130" y="274" text-anchor="middle" fill="#2b6e9e">2</text>
    <g filter="url(#sk)"><rect x="208" y="253" width="44" height="32" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
    <text x="230" y="274" text-anchor="middle" fill="#2b6e9e">5</text>
    <g filter="url(#sk)"><rect x="308" y="253" width="44" height="32" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
    <text x="330" y="274" text-anchor="middle" fill="#2b6e9e">10</text>
    <g filter="url(#sk)"><rect x="408" y="253" width="44" height="32" rx="6" fill="#e8f0fa" stroke="#b85450" stroke-width="2"/></g>
    <text x="430" y="274" text-anchor="middle" fill="#2b6e9e">8</text>

    <!-- L3 -->
    <g filter="url(#sk)"><rect x="68" y="373" width="44" height="32" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
    <text x="90" y="394" text-anchor="middle" fill="#2b6e9e">3</text>
    <g filter="url(#sk)"><rect x="146" y="373" width="44" height="32" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
    <text x="168" y="394" text-anchor="middle" fill="#2b6e9e">6</text>
    <g filter="url(#sk)"><rect x="236" y="373" width="44" height="32" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
    <text x="258" y="394" text-anchor="middle" fill="#2b6e9e">11</text>
    <!-- answer 12 -->
    <g filter="url(#sk)"><rect x="408" y="373" width="44" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
    <text x="430" y="394" text-anchor="middle" fill="#b03a3a">12</text>
  </g>

  <!-- answer note -->
  <g filter="url(#sk)">
    <rect x="470" y="372" width="158" height="34" rx="6" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="549" y="388" text-anchor="middle" font-size="10" fill="#7a5415" font-weight="bold">12 在第 3 层被发现</text>
  <text x="549" y="400" text-anchor="middle" font-size="9" fill="#7a5415">→ 答案 3（4+4+4）</text>

  <!-- legend -->
  <g font-size="9" fill="#888">
    <path d="M 60 446 L 92 446" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
    <text x="100" y="449">最短路径 0→4→8→12</text>
    <path d="M 270 446 L 302 446" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
    <text x="310" y="449">其它扩展边</text>
  </g>
</svg>
