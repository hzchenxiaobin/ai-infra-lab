<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：双栈暂存外层现场</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">遇 [ 把外层（字符串, 倍数）压栈；遇 ] 弹出并 prev + cur×k</text>

  <!-- ===== Left: nested structure ===== -->
  <text x="145" y="76" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">嵌套结构（外层包内层）</text>
  <g>
    <!-- outer box k=3 -->
    <rect x="40" y="88" width="210" height="140" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
    <text x="52" y="105" font-size="11" fill="#446688" font-weight="bold">外层 k=3</text>
    <text x="70" y="172" font-size="18" fill="#333">a</text>
    <text x="92" y="170" font-size="16" fill="#888">+</text>
    <!-- inner box k=2 -->
    <rect x="110" y="128" width="125" height="82" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
    <text x="120" y="145" font-size="11" fill="#d6a040" font-weight="bold">内层 k=2</text>
    <text x="172" y="188" text-anchor="middle" font-size="18" fill="#333">c</text>
  </g>

  <!-- ===== Right: stacks (state after reading inner '[') ===== -->
  <text x="420" y="76" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">读到内层 [ 后的栈状态</text>
  <g font-size="12" fill="#333">
    <!-- strStack -->
    <text x="340" y="100" text-anchor="middle" font-size="10" fill="#555">strStack</text>
    <rect x="310" y="108" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="340" y="127" text-anchor="middle" fill="#d6a040" font-weight="bold">"a"</text>
    <rect x="310" y="140" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="340" y="159" text-anchor="middle" fill="#446688">""</text>
    <text x="378" y="125" font-size="9" fill="#888">← top</text>
    <!-- numStack -->
    <text x="460" y="100" text-anchor="middle" font-size="10" fill="#555">numStack</text>
    <rect x="430" y="108" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="460" y="127" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
    <rect x="430" y="140" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="460" y="159" text-anchor="middle" fill="#446688">3</text>
    <text x="498" y="125" font-size="9" fill="#888">← top</text>
  </g>
  <!-- push annotation -->
  <path d="M 420 88 L 420 106" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="420" y="82" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">压栈 push</text>

  <!-- connector: inner box -> stacks -->
  <path d="M 235 169 C 270 169, 285 122, 308 122" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="262" y="112" font-size="9" fill="#b85450">("a",2) 入栈</text>

  <!-- ===== Bottom: formula box ===== -->
  <line x1="20" y1="244" x2="540" y2="244" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <rect x="40" y="258" width="480" height="82" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="280" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">遇 ] 弹栈：prev, k = pop()</text>
  <text x="280" y="306" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">cur ← prev + cur × k</text>
  <text x="280" y="328" text-anchor="middle" font-size="10" fill="#555">内层结果 cur 重复 k 次，拼到外层 prev 之后 → 外层暂存、内层先算</text>
</svg>
