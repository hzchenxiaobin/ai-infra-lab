<svg xmlns="http://www.w3.org/2000/svg" width="940" height="520" viewBox="0 0 940 520" font-family="'Comic Sans MS','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="940" height="520" fill="#fafafa"/>

  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例 1 演算：从右往左 + 栈（distance = 1）</text>

  <!-- legend -->
  <rect x="648" y="50" width="16" height="16" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="672" y="63" font-size="11" fill="#444" filter="url(#rough2)">幸存组（栈中）</text>
  <rect x="778" y="50" width="16" height="16" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="802" y="63" font-size="11" fill="#444" filter="url(#rough2)">被吸收</text>

  <!-- ============ Step 1: R4 ============ -->
  <text x="140" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">① 处理 R4</text>
  <rect x="65" y="98" width="150" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="140" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">R4：p=20, v=3</text>
  <text x="140" y="168" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">栈为空</text>
  <text x="140" y="188" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">直接入栈</text>

  <rect x="45" y="382" width="190" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="401" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">R4</text>
  <text x="140" y="419" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">轨迹 (20, 3)</text>
  <text x="14" y="410" font-size="10" fill="#888" filter="url(#rough2)">栈顶</text>

  <!-- ============ Step 2: R3 ============ -->
  <text x="375" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">② 处理 R3</text>
  <rect x="300" y="98" width="150" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="375" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">R3：p=6, v=2</text>
  <text x="375" y="162" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">与右邻 R4 间距 14 &gt; d</text>
  <text x="375" y="182" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">栈顶速度 3：v=2 ≤ 3，永不追上</text>
  <text x="375" y="202" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">→ 新幸存组入栈</text>

  <rect x="280" y="330" width="190" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="375" y="349" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">R3</text>
  <text x="375" y="367" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">轨迹 (6, 2)</text>
  <rect x="280" y="382" width="190" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="375" y="401" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">R4</text>
  <text x="375" y="419" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">轨迹 (20, 3)</text>
  <text x="249" y="358" font-size="10" fill="#888" filter="url(#rough2)">栈顶</text>

  <!-- ============ Step 3: R2 absorbed ============ -->
  <text x="610" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">③ 处理 R2</text>
  <rect x="535" y="98" width="150" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="610" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">R2：p=5, v=3</text>
  <text x="610" y="162" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">与右邻 R3 间距 = 1 ≤ d</text>
  <text x="610" y="182" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">→ t=0 被右邻的组带走，栈不变</text>
  <path d="M 690 122 Q 716 230 692 322" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <rect x="515" y="330" width="190" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="610" y="349" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">组 {R2,R3}</text>
  <text x="610" y="367" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">轨迹 (6, 2)</text>
  <rect x="515" y="382" width="190" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="610" y="401" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">R4</text>
  <text x="610" y="419" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">轨迹 (20, 3)</text>
  <text x="484" y="358" font-size="10" fill="#888" filter="url(#rough2)">栈顶</text>

  <!-- ============ Step 4: R1 absorbed ============ -->
  <text x="830" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">④ 处理 R1</text>
  <rect x="755" y="98" width="150" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="830" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">R1：p=1, v=4</text>
  <text x="830" y="162" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">与右邻 R2 间距 4 &gt; d，不被带走</text>
  <text x="830" y="182" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">栈顶速度 2：v=4 &gt; 2，t* = 2</text>
  <text x="830" y="202" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">→ 被吸收，栈不变</text>
  <path d="M 908 122 Q 928 230 910 322" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <rect x="735" y="330" width="190" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="830" y="349" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">组 {R1,R2,R3}</text>
  <text x="830" y="367" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">轨迹 (6, 2)</text>
  <rect x="735" y="382" width="190" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="830" y="401" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">R4</text>
  <text x="830" y="419" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">轨迹 (20, 3)</text>
  <text x="704" y="358" font-size="10" fill="#888" filter="url(#rough2)">栈顶</text>

  <!-- answer bar -->
  <rect x="170" y="458" width="600" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="470" y="487" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">答案 = 栈中组数 = 2：幸存组 {R1,R2,R3} 与 {R4}</text>
</svg>
