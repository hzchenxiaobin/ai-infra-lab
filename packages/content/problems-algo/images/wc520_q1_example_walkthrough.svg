<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="640" height="560" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">示例 2 演算:[[1,5],[2,4],[3,6]],逐对 O(1) 判定</text>

  <!-- ============ 上半部分:数轴与三个区间 ============ -->
  <!-- 数轴:y=230,值 v 映射 x = 80 + 70v -->
  <path d="M 70 230 L 590 230" stroke="#999" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="80"  y1="224" x2="80"  y2="236" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="150" y1="224" x2="150" y2="236" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="220" y1="224" x2="220" y2="236" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="290" y1="224" x2="290" y2="236" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="360" y1="224" x2="360" y2="236" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="430" y1="224" x2="430" y2="236" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="500" y1="224" x2="500" y2="236" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="570" y1="224" x2="570" y2="236" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80"  y="252" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="150" y="252" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="220" y="252" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="290" y="252" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="360" y="252" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4</text>
  <text x="430" y="252" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">5</text>
  <text x="500" y="252" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">6</text>
  <text x="570" y="252" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">7</text>

  <!-- 三个区间条 -->
  <rect x="150" y="66" width="280" height="18" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="58" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">A = [1, 5]</text>

  <rect x="220" y="112" width="140" height="18" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">B = [2, 4]</text>

  <rect x="290" y="158" width="210" height="18" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">C = [3, 6]</text>

  <!-- 两两交集带 -->
  <rect x="220" y="66" width="140" height="110" fill="#e6f4ea" opacity="0.35" filter="url(#rough2)"/>
  <text x="510" y="80" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">A∩B = [2,4]</text>
  <text x="510" y="96" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">A∩C = [3,5]</text>
  <text x="510" y="112" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">B∩C = [3,4]</text>

  <!-- ============ 下半部分:逐对判定表 ============ -->
  <text x="320" y="296" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">三对逐一检查:max(start) ≤ min(end)?</text>

  <!-- 表头 -->
  <rect x="90" y="312" width="120" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="332" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">下标对 (i, j)</text>
  <rect x="210" y="312" width="150" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="285" y="332" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">max(start)</text>
  <rect x="360" y="312" width="150" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="435" y="332" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">min(end)</text>
  <rect x="510" y="312" width="80" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="550" y="332" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">相交?</text>

  <!-- 行 1:(0,1) -->
  <rect x="90" y="348" width="120" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="150" y="368" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(0, 1) A,B</text>
  <rect x="210" y="348" width="150" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="285" y="368" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">max(1, 2) = 2</text>
  <rect x="360" y="348" width="150" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="435" y="368" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">min(5, 4) = 4</text>
  <rect x="510" y="348" width="80" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="550" y="368" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2≤4 ✓</text>

  <!-- 行 2:(0,2) -->
  <rect x="90" y="384" width="120" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="150" y="404" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(0, 2) A,C</text>
  <rect x="210" y="384" width="150" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="285" y="404" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">max(1, 3) = 3</text>
  <rect x="360" y="384" width="150" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="435" y="404" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">min(5, 6) = 5</text>
  <rect x="510" y="384" width="80" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="550" y="404" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">3≤5 ✓</text>

  <!-- 行 3:(1,2) -->
  <rect x="90" y="420" width="120" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="150" y="440" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(1, 2) B,C</text>
  <rect x="210" y="420" width="150" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="285" y="440" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">max(2, 3) = 3</text>
  <rect x="360" y="420" width="150" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="435" y="440" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">min(4, 6) = 4</text>
  <rect x="510" y="420" width="80" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="550" y="440" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">3≤4 ✓</text>

  <!-- 结论框 -->
  <rect x="40" y="472" width="560" height="66" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="500" text-anchor="middle" font-size="14" font-weight="bold" fill="#d6a040" filter="url(#rough2)">三对全部相交 → 答案 = 3</text>
  <text x="320" y="524" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">j 从 i+1 起枚举:每对恰好查一次,不重不漏</text>
</svg>
