<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <text x="290" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">nums=[1,2,1,2], a=3, b=2：v 与前缀 P</text>

  <!-- nums row -->
  <text x="40" y="68" font-size="12" fill="#666" filter="url(#rough2)">nums</text>
  <g filter="url(#rough2)" font-size="13">
    <rect x="80" y="55" width="50" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="105" y="74" text-anchor="middle" fill="#d6a040">1</text>
    <rect x="130" y="55" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="155" y="74" text-anchor="middle" fill="#4a7a3a">2</text>
    <rect x="180" y="55" width="50" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="205" y="74" text-anchor="middle" fill="#d6a040">1</text>
    <rect x="230" y="55" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="255" y="74" text-anchor="middle" fill="#4a7a3a">2</text>
  </g>
  <text x="300" y="74" font-size="11" fill="#888" filter="url(#rough2)">奇=橙 偶=绿</text>

  <!-- v row -->
  <text x="40" y="108" font-size="12" fill="#666" filter="url(#rough2)">v[i]</text>
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <text x="105" y="108" text-anchor="middle">−3</text>
    <text x="155" y="108" text-anchor="middle">+2</text>
    <text x="205" y="108" text-anchor="middle">−3</text>
    <text x="255" y="108" text-anchor="middle">+2</text>
  </g>

  <!-- P row -->
  <text x="40" y="150" font-size="12" fill="#666" filter="url(#rough2)">P[k]</text>
  <g filter="url(#rough2)" font-size="13">
    <rect x="55" y="135" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="80" y="154" text-anchor="middle" fill="#446688">0</text>
    <rect x="105" y="135" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="130" y="154" text-anchor="middle" fill="#446688">−3</text>
    <rect x="155" y="135" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="180" y="154" text-anchor="middle" fill="#446688">−1</text>
    <rect x="205" y="135" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="230" y="154" text-anchor="middle" fill="#446688">−4</text>
    <rect x="255" y="135" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="280" y="154" text-anchor="middle" fill="#446688">−2</text>
  </g>
  <text x="320" y="150" font-size="11" fill="#888" filter="url(#rough2)">P[0..4]</text>

  <!-- per r count -->
  <text x="40" y="195" font-size="12" fill="#666" filter="url(#rough2)">右端点 r</text>
  <g filter="url(#rough2)" font-size="12" fill="#333">
    <text x="105" y="195" text-anchor="middle">r=0</text>
    <text x="155" y="195" text-anchor="middle">r=1</text>
    <text x="205" y="195" text-anchor="middle">r=2</text>
    <text x="255" y="195" text-anchor="middle">r=3</text>
  </g>
  <text x="40" y="218" font-size="12" fill="#666" filter="url(#rough2)">lastOdd[r]</text>
  <g filter="url(#rough2)" font-size="12" fill="#333">
    <text x="105" y="218" text-anchor="middle">0</text>
    <text x="155" y="218" text-anchor="middle">0</text>
    <text x="205" y="218" text-anchor="middle">2</text>
    <text x="255" y="218" text-anchor="middle">2</text>
  </g>
  <text x="40" y="241" font-size="12" fill="#666" filter="url(#rough2)">P[r+1]</text>
  <g filter="url(#rough2)" font-size="12" fill="#b85450" font-weight="bold">
    <text x="105" y="241" text-anchor="middle">−3</text>
    <text x="155" y="241" text-anchor="middle">−1</text>
    <text x="205" y="241" text-anchor="middle">−4</text>
    <text x="255" y="241" text-anchor="middle">−2</text>
  </g>
  <text x="40" y="264" font-size="12" fill="#666" filter="url(#rough2)">满足 P[l]≥P[r+1] 的 l 数</text>
  <g filter="url(#rough2)" font-size="12" fill="#4a7a3a" font-weight="bold">
    <text x="105" y="264" text-anchor="middle">1</text>
    <text x="155" y="264" text-anchor="middle">1</text>
    <text x="205" y="264" text-anchor="middle">3</text>
    <text x="255" y="264" text-anchor="middle">2</text>
  </g>

  <!-- summary -->
  <rect x="40" y="285" width="500" height="75" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="312" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">合计 = 1+1+3+2 = 7 ✓</text>
  <text x="60" y="335" font-size="12" fill="#333" filter="url(#rough2)">• r=2 时 l 可取 0,1,2（含奇数），P 均 ≥ −4</text>
  <text x="60" y="353" font-size="12" fill="#333" filter="url(#rough2)">• r=3 时 l 只到 lastOdd=2：P[0]=0,P[2]=−4 ≥ −2？仅 0,−1 满足</text>
</svg>
