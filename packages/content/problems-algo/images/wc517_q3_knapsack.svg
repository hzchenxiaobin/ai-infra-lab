<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">分组背包演算：nums = [5, 6, 10]，sum = 4</text>

  <!-- candidate lists -->
  <text x="50" y="56" font-size="11" fill="#3a4a66" font-weight="bold">各元素候选（终值:代价）：</text>

  <rect x="50" y="66" width="160" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="130" y="86" text-anchor="middle" font-size="10.5" fill="#333">v=5 → 5:0, 2:1, 1:2</text>

  <rect x="222" y="66" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="302" y="86" text-anchor="middle" font-size="10.5" fill="#333">v=6 → 6:0, 3:1, 1:2</text>

  <rect x="394" y="66" width="160" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="474" y="86" text-anchor="middle" font-size="10.5" fill="#333">v=10 → 10:0, 5:1, 2:2, 1:3</text>

  <text x="50" y="118" font-size="10" fill="#888">（乘链 10、20、40… 全部超过 sum=4，被裁剪；除链到 1 为止）</text>

  <!-- dp table -->
  <text x="50" y="150" font-size="11.5" fill="#3a4a66" font-weight="bold">dp[s]：凑出恰好和 s 的最少操作数</text>

  <!-- header row -->
  <rect x="150" y="160" width="60" height="26" fill="#eeeeee" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="180" y="178" text-anchor="middle" font-size="10.5" fill="#666" font-weight="bold">dp[0]</text>
  <rect x="210" y="160" width="60" height="26" fill="#eeeeee" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="240" y="178" text-anchor="middle" font-size="10.5" fill="#666" font-weight="bold">dp[1]</text>
  <rect x="270" y="160" width="60" height="26" fill="#eeeeee" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="300" y="178" text-anchor="middle" font-size="10.5" fill="#666" font-weight="bold">dp[2]</text>
  <rect x="330" y="160" width="60" height="26" fill="#eeeeee" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="360" y="178" text-anchor="middle" font-size="10.5" fill="#666" font-weight="bold">dp[3]</text>
  <rect x="390" y="160" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="420" y="178" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">dp[4]</text>

  <!-- row labels -->
  <text x="140" y="212" text-anchor="end" font-size="10.5" fill="#555">初始</text>
  <text x="140" y="248" text-anchor="end" font-size="10.5" fill="#4a7a3a">处理 5</text>
  <text x="140" y="284" text-anchor="end" font-size="10.5" fill="#446688">处理 6</text>
  <text x="140" y="320" text-anchor="end" font-size="10.5" fill="#d6a040">处理 10</text>

  <!-- row: initial -->
  <rect x="150" y="194" width="60" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="180" y="213" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="210" y="194" width="60" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="240" y="213" text-anchor="middle" font-size="11" fill="#999">∞</text>
  <rect x="270" y="194" width="60" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="300" y="213" text-anchor="middle" font-size="11" fill="#999">∞</text>
  <rect x="330" y="194" width="60" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="360" y="213" text-anchor="middle" font-size="11" fill="#999">∞</text>
  <rect x="390" y="194" width="60" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="420" y="213" text-anchor="middle" font-size="11" fill="#999">∞</text>

  <!-- row: after 5 -->
  <rect x="150" y="230" width="60" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="180" y="249" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="210" y="230" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="249" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="270" y="230" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="249" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="330" y="230" width="60" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="360" y="249" text-anchor="middle" font-size="11" fill="#999">∞</text>
  <rect x="390" y="230" width="60" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="420" y="249" text-anchor="middle" font-size="11" fill="#999">∞</text>

  <!-- row: after 6 -->
  <rect x="150" y="266" width="60" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="180" y="285" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="210" y="266" width="60" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="240" y="285" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="270" y="266" width="60" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="300" y="285" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="330" y="266" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="285" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="390" y="266" width="60" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="420" y="285" text-anchor="middle" font-size="11" fill="#999">∞</text>

  <!-- row: after 10 -->
  <rect x="150" y="302" width="60" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="180" y="321" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="210" y="302" width="60" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="240" y="321" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="270" y="302" width="60" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="300" y="321" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="330" y="302" width="60" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="360" y="321" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="390" y="302" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="420" y="321" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>

  <!-- annotations -->
  <path d="M 300 262 Q 330 262 358 264" stroke="#446688" stroke-width="1.3" stroke-dasharray="3,2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="256" text-anchor="middle" font-size="9.5" fill="#446688">6→3（代价1）</text>

  <path d="M 300 298 Q 360 296 408 298" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="3,2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="356" y="292" text-anchor="middle" font-size="9.5" fill="#d6a040">10→2（代价2）：dp[2]+2 = 3</text>

  <!-- answer -->
  <rect x="40" y="348" width="480" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="60" y="368" font-size="11.5" fill="#4a7a3a" font-weight="bold">答案 dp[4] = 3：5÷2→2（1 次）+ 10÷2÷2→2（2 次），2 + 2 = 4</text>
  <text x="60" y="388" font-size="10.5" fill="#555">另一条等优路径：5→1（2 次）+ 6→3（1 次），1 + 3 = 4</text>
</svg>
