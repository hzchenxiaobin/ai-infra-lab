<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">状态机：三个状态 + 合法转移</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">持有 / 可买 / 冷冻，冷冻期内禁止买入</text>

  <!-- ===== Nodes ===== -->
  <g font-size="11">
    <!-- free 可买 -->
    <rect x="95" y="142" width="90" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
    <text x="140" y="166" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">可买 free</text>
    <text x="140" y="184" text-anchor="middle" font-size="9" fill="#446688">无股 · 非冷冻</text>

    <!-- hold 持有 -->
    <rect x="355" y="142" width="90" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
    <text x="400" y="166" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">持有 hold</text>
    <text x="400" y="184" text-anchor="middle" font-size="9" fill="#b85450">手上有股</text>

    <!-- sold 冷冻 -->
    <rect x="225" y="278" width="90" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
    <text x="270" y="302" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">冷冻 sold</text>
    <text x="270" y="320" text-anchor="middle" font-size="9" fill="#d6a040">刚卖 · 明天禁买</text>
  </g>

  <!-- ===== Edges ===== -->
  <!-- free -> hold : 买入 -->
  <path d="M 185 160 L 352 160" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="223" y="138" width="92" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="269" y="153" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">买入 −p</text>

  <!-- hold -> sold : 卖出 -->
  <path d="M 378 200 Q 340 245 312 280" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="318" y="232" width="86" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="361" y="247" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">卖出 +p</text>

  <!-- sold -> free : 冷冻结束 -->
  <path d="M 232 280 Q 200 245 168 200" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="138" y="232" width="96" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="186" y="247" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">冷冻期过</text>

  <!-- free self-loop : 休息 -->
  <path d="M 112 142 C 78 122, 60 150, 96 168" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="58" y="118" text-anchor="middle" font-size="9" fill="#666">休息</text>

  <!-- hold self-loop : 持有 -->
  <path d="M 428 142 C 462 122, 480 150, 444 168" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="482" y="118" text-anchor="middle" font-size="9" fill="#666">持有</text>

  <!-- ===== Forbidden edges note ===== -->
  <g font-size="9" fill="#b85450">
    <text x="270" y="210" text-anchor="middle" font-size="9" fill="#999">✗ 无 hold→free（须先卖） · ✗ 无 sold→hold（冷冻禁买）</text>
  </g>

  <!-- ===== Answer note ===== -->
  <rect x="60" y="350" width="420" height="22" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="270" y="365" text-anchor="middle" font-size="10" fill="#444">答案 = max(free, sold)：末日只取「不持有」两状态，hold 不参与</text>
</svg>
