<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">概念：一支箭 = x 轴上一个点，引爆所有覆盖该点的气球</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">气球看成闭区间，能被同一支箭引爆 ⇔ 区间有公共点</text>

  <!-- x axis -->
  <line x1="60" y1="312" x2="500" y2="312" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="508" y="316" font-size="11" fill="#888">x</text>
  <!-- ticks -->
  <g font-size="10" fill="#888" text-anchor="middle">
    <line x1="94"  y1="312" x2="94"  y2="318" stroke="#888" stroke-width="1"/>
    <text x="94"  y="330">1</text>
    <line x1="166" y1="312" x2="166" y2="318" stroke="#888" stroke-width="1"/>
    <text x="166" y="330">4</text>
    <line x1="262" y1="312" x2="262" y2="318" stroke="#888" stroke-width="1"/>
    <text x="262" y="330">8</text>
    <line x1="358" y1="312" x2="358" y2="318" stroke="#888" stroke-width="1"/>
    <text x="358" y="330">12</text>
    <line x1="454" y1="312" x2="454" y2="318" stroke="#888" stroke-width="1"/>
    <text x="454" y="330">16</text>
  </g>

  <!-- balloons (horizontal capsules), x_pix = 70 + x*24 -->
  <!-- [1,6] -->
  <rect x="94"  y="104" width="120" height="20" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="154" y="118" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">[1,6]</text>
  <!-- [2,8] -->
  <rect x="118" y="142" width="144" height="20" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="156" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">[2,8]</text>
  <!-- [7,12] -->
  <rect x="238" y="180" width="120" height="20" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="298" y="194" text-anchor="middle" font-size="11" fill="#2a4a66" font-weight="bold">[7,12]</text>
  <!-- [10,16] -->
  <rect x="310" y="218" width="144" height="20" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="382" y="232" text-anchor="middle" font-size="11" fill="#2a4a66" font-weight="bold">[10,16]</text>

  <!-- Arrow 1 at x=6 -> x_pix=214 -->
  <line x1="214" y1="305" x2="214" y2="96" stroke="#b85450" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="214" y="88" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">箭1 @ x=6</text>

  <!-- Arrow 2 at x=12 -> x_pix=358 -->
  <line x1="358" y1="305" x2="358" y2="170" stroke="#b85450" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="358" y="162" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">箭2 @ x=12</text>

  <!-- captions -->
  <rect x="40" y="346" width="480" height="26" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="280" y="363" text-anchor="middle" font-size="11" fill="#555">箭1 引爆 [1,6]、[2,8]；箭2 引爆 [7,12]、[10,16] → 共 2 支箭</text>
</svg>
