<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="480" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">例题演算：分发糖果（135），ratings=[1,0,2]</text>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#888">相邻孩子评分高的要得更多糖；单方向不满足 → 正反各扫一遍取 max</text>

  <!-- ===== Top: ratings array ===== -->
  <text x="40" y="76" font-size="11" fill="#888" filter="url(#rough2)">ratings：</text>
  <rect x="120" y="62" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="83" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="184" y="62" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="214" y="83" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="248" y="62" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="278" y="83" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="150" y="108" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">i=0</text>
  <text x="214" y="108" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">i=1</text>
  <text x="278" y="108" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">i=2</text>

  <!-- ===== Left→Right pass (left rule) ===== -->
  <text x="40" y="138" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">第 1 趟：从左到右（满足「右>左」）</text>
  <text x="40" y="154" font-size="10" fill="#888" filter="url(#rough2)">若 ratings[i]&gt;ratings[i-1]，则 candy[i]=candy[i-1]+1；否则=1</text>

  <!-- arrow L→R -->
  <path d="M 120 168 L 300 168" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- candy boxes after L->R -->
  <rect x="120" y="180" width="60" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="201" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="184" y="180" width="60" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="214" y="201" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="248" y="180" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="278" y="201" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>

  <text x="150" y="226" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">=1(默认)</text>
  <text x="214" y="226" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">0&lt;1→=1</text>
  <text x="278" y="226" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">2&gt;0→1+1=2 ✓</text>

  <!-- problem note -->
  <rect x="40" y="240" width="280" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="180" y="258" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠ 但 i=0 vs i=1：1&gt;0 却糖都=1</text>
  <text x="180" y="272" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">左规则没管「左&gt;右」→ 需第2趟</text>

  <!-- ===== Right→Left pass (right rule) ===== -->
  <text x="360" y="138" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">第 2 趟：从右到左（满足「左&gt;右」）</text>
  <text x="360" y="154" font-size="10" fill="#888" filter="url(#rough2)">若 ratings[i]&gt;ratings[i+1]，则 candy[i]=max(candy[i],candy[i+1]+1)</text>

  <!-- arrow R->L -->
  <path d="M 580 168 L 400 168" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="400" y="180" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="430" y="201" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="464" y="180" width="60" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="494" y="201" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="528" y="180" width="60" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="558" y="201" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2</text>

  <text x="430" y="226" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">1&gt;0→max(1,1+1)=2 ✓</text>
  <text x="494" y="226" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">0&lt;2→不动=1</text>
  <text x="558" y="226" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">=2(不变)</text>

  <rect x="360" y="240" width="280" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="500" y="258" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 两个方向都满足了</text>
  <text x="500" y="272" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">取 max 保证不破坏第1趟的约束</text>

  <!-- ===== Final result ===== -->
  <text x="40" y="304" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">最终糖果（两趟取 max）：</text>
  <rect x="180" y="290" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="210" y="311" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="244" y="290" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="274" y="311" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="308" y="290" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="338" y="311" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>

  <text x="400" y="311" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">合计 = 2+1+2 = 5</text>

  <!-- ===== why two passes ===== -->
  <rect x="30" y="338" width="580" height="124" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="320" y="358" text-anchor="middle" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">为什么要两趟？单向贪心的盲区</text>
  <text x="44" y="378" font-size="10" fill="#555" filter="url(#rough2)">• 约束是「相邻」双向的：rating 高的比左边多，也比右边多。单趟只能照顾一个方向</text>
  <text x="44" y="394" font-size="10" fill="#555" filter="url(#rough2)">• 第1趟保证「右&gt;左」时右边糖多；第2趟保证「左&gt;右」时左边糖多</text>
  <text x="44" y="410" font-size="10" fill="#555" filter="url(#rough2)">• 第2趟用 max(candy[i], candy[i+1]+1) 而非直接覆盖 → 不会破坏第1趟已满足的约束</text>
  <text x="44" y="426" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ 套路记忆：双向约束的贪心 = 正反各扫一遍 + 取 max/累加</text>
  <text x="44" y="448" font-size="10" fill="#888" filter="url(#rough2)">同类：134 加油站（单遍判总和+段内余量）、406 重建队列（按 h 降 k 升排序后插队）</text>
</svg>
