<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：root=[7,3,15,null,null,9,20]</text>

  <!-- BST 树 -->
  <text x="40" y="58" font-size="12" fill="#888">BST：</text>
  <circle cx="130" cy="92" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="130" y="96" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">7</text>

  <circle cx="80" cy="158" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="162" text-anchor="middle" font-size="11" fill="#333">3</text>
  <line x1="118" y1="104" x2="88" y2="146" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <circle cx="190" cy="158" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="162" text-anchor="middle" font-size="11" fill="#333">15</text>
  <line x1="142" y1="104" x2="182" y2="146" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>

  <circle cx="150" cy="224" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="150" y="228" text-anchor="middle" font-size="10" fill="#333">9</text>
  <line x1="183" y1="170" x2="156" y2="214" stroke="#4a7a3a" stroke-width="1.1" filter="url(#rough2)"/>

  <circle cx="235" cy="224" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="235" y="228" text-anchor="middle" font-size="10" fill="#333">20</text>
  <line x1="200" y1="170" x2="229" y2="214" stroke="#4a7a3a" stroke-width="1.1" filter="url(#rough2)"/>

  <!-- 栈演变 -->
  <text x="310" y="58" font-size="12" fill="#888">栈演变（底→顶，操作后）：</text>

  <!-- 构造 -->
  <text x="310" y="86" font-size="11" fill="#666">构造：</text>
  <rect x="360" y="70" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="377" y="87" text-anchor="middle" font-size="10" fill="#333">7</text>
  <rect x="396" y="70" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="413" y="87" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="440" y="86" font-size="10" fill="#888">← 顶</text>

  <!-- ① next→3 -->
  <text x="310" y="128" font-size="11" fill="#b85450">① next→3：</text>
  <rect x="360" y="112" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="377" y="129" text-anchor="middle" font-size="10" fill="#333">7</text>

  <!-- ② next→7 -->
  <text x="310" y="170" font-size="11" fill="#b85450">② next→7：</text>
  <rect x="360" y="154" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="377" y="171" text-anchor="middle" font-size="10" fill="#333">15</text>
  <rect x="396" y="154" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="413" y="171" text-anchor="middle" font-size="10" fill="#333">9</text>
  <text x="440" y="170" font-size="10" fill="#888">← 补15左链</text>

  <!-- ③ next→9 -->
  <text x="310" y="212" font-size="11" fill="#b85450">③ next→9：</text>
  <rect x="360" y="196" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="377" y="213" text-anchor="middle" font-size="10" fill="#333">15</text>

  <!-- ④ next→15 -->
  <text x="310" y="254" font-size="11" fill="#b85450">④ next→15：</text>
  <rect x="360" y="238" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="377" y="255" text-anchor="middle" font-size="10" fill="#333">20</text>
  <text x="400" y="254" font-size="10" fill="#888">← 补20左链</text>

  <!-- ⑤ next→20 -->
  <text x="310" y="296" font-size="11" fill="#b85450">⑤ next→20：</text>
  <text x="360" y="282" text-anchor="middle" font-size="10" fill="#999">栈空</text>

  <!-- 返回序列 -->
  <text x="310" y="338" font-size="12" fill="#446688" font-weight="bold">返回序列：</text>
  <rect x="360" y="322" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="374" y="338" text-anchor="middle" font-size="10" fill="#333">3</text>
  <path d="M 388 333 L 396 333" stroke="#666" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="398" y="322" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="412" y="338" text-anchor="middle" font-size="10" fill="#333">7</text>
  <path d="M 426 333 L 434 333" stroke="#666" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="436" y="322" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="450" y="338" text-anchor="middle" font-size="10" fill="#333">9</text>
  <path d="M 464 333 L 472 333" stroke="#666" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="474" y="322" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="488" y="338" text-anchor="middle" font-size="10" fill="#333">15</text>
  <path d="M 502 333 L 510 333" stroke="#666" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="512" y="322" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="526" y="338" text-anchor="middle" font-size="10" fill="#333">20</text>

  <!-- 弹栈箭头标注 -->
  <path d="M 415 92 L 396 120" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,3" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="418" y="108" font-size="9" fill="#b85450">弹3</text>

  <!-- 说明框 -->
  <rect x="40" y="370" width="500" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="60" y="392" font-size="12" fill="#333" font-weight="bold">中序 [3,7,9,15,20] 严格升序，迭代器逐个返回 ✓</text>
  <text x="60" y="410" font-size="11" fill="#555">弹栈顶即访问当前最小；若有右子树则补其左链，让「右-最左下」顶上成为新最小</text>
  <text x="60" y="428" font-size="11" fill="#b85450" font-weight="bold">空间 O(h)：栈最深 2 层；均摊 next() O(1)</text>
</svg>
