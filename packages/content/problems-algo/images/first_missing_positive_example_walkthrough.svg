<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrS" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold">示例演算：nums = [3,4,−1,1]，n = 4</text>
  <text x="270" y="42" text-anchor="middle" font-size="11" fill="#888">橙=本次交换 · 绿=已归位(nums[i]=i+1) · 灰=越界忽略</text>

  <!-- index header -->
  <text x="96" y="68" text-anchor="end" font-size="10.5" fill="#888">下标→</text>
  <text x="146" y="68" text-anchor="middle" font-size="10.5" fill="#888">0</text>
  <text x="190" y="68" text-anchor="middle" font-size="10.5" fill="#888">1</text>
  <text x="234" y="68" text-anchor="middle" font-size="10.5" fill="#888">2</text>
  <text x="278" y="68" text-anchor="middle" font-size="10.5" fill="#888">3</text>

  <!-- Row 0: initial -->
  <text x="96" y="96" text-anchor="end" font-size="11" fill="#555" font-weight="bold">初始</text>
  <rect x="124" y="78" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="146" y="97" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">3</text>
  <rect x="168" y="78" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="190" y="97" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">4</text>
  <rect x="212" y="78" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="234" y="97" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">−1</text>
  <rect x="256" y="78" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="278" y="97" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">1</text>
  <text x="312" y="96" font-size="10.5" fill="#888">i=0</text>

  <!-- Row 1: i=0, swap 0<->2 -->
  <text x="96" y="132" text-anchor="end" font-size="11" fill="#d6a040" font-weight="bold">① 交换0↔2</text>
  <rect x="124" y="114" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="146" y="133" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">−1</text>
  <rect x="168" y="114" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="190" y="133" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">4</text>
  <rect x="212" y="114" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="234" y="133" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">3</text>
  <rect x="256" y="114" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="278" y="133" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">1</text>
  <text x="312" y="132" font-size="10.5" fill="#d6a040">3 归位到下标2</text>
  <text x="312" y="146" font-size="10.5" fill="#888">nums[0]=−1 越界，i=1</text>

  <!-- Row 2: i=1, swap 1<->3 -->
  <text x="96" y="180" text-anchor="end" font-size="11" fill="#d6a040" font-weight="bold">② 交换1↔3</text>
  <rect x="124" y="162" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="146" y="181" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">−1</text>
  <rect x="168" y="162" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="181" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">1</text>
  <rect x="212" y="162" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="234" y="181" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">3</text>
  <rect x="256" y="162" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="278" y="181" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">4</text>
  <text x="312" y="180" font-size="10.5" fill="#d6a040">4 归位到下标3</text>
  <text x="312" y="194" font-size="10.5" fill="#888">nums[1]=1 待归位</text>

  <!-- Row 3: i=1, swap 1<->0 -->
  <text x="96" y="228" text-anchor="end" font-size="11" fill="#d6a040" font-weight="bold">③ 交换1↔0</text>
  <rect x="124" y="210" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="146" y="229" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">1</text>
  <rect x="168" y="210" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="229" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">−1</text>
  <rect x="212" y="210" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="234" y="229" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">3</text>
  <rect x="256" y="210" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="278" y="229" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">4</text>
  <text x="312" y="228" font-size="10.5" fill="#d6a040">1 归位到下标0</text>
  <text x="312" y="242" font-size="10.5" fill="#888">nums[1]=−1 越界，i=2</text>

  <!-- Row 4: i=2,3 no swap -->
  <text x="96" y="276" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold">④ i=2,3 跳过</text>
  <rect x="124" y="258" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="146" y="277" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">1</text>
  <rect x="168" y="258" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="190" y="277" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">−1</text>
  <rect x="212" y="258" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="234" y="277" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">3</text>
  <rect x="256" y="258" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="278" y="277" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">4</text>
  <text x="312" y="276" font-size="10.5" fill="#4a7a3a">3,4 已归位，无交换</text>

  <!-- Scan phase -->
  <text x="96" y="320" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold">⑤ 扫描</text>
  <rect x="124" y="302" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="146" y="321" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">1</text>
  <rect x="168" y="302" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="190" y="321" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">−1</text>
  <rect x="212" y="302" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="234" y="321" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">3</text>
  <rect x="256" y="302" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="278" y="321" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">4</text>
  <text x="312" y="316" font-size="10.5" fill="#4a7a3a">i=0: 1=0+1 ✓</text>
  <text x="312" y="330" font-size="10.5" fill="#b85450" font-weight="bold">i=1: −1 ≠ 2 → 返回 2</text>

  <!-- conclusion -->
  <rect x="32" y="346" width="476" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="48" y="368" font-size="12.5" fill="#b85450" font-weight="bold">结果：2</text>
  <text x="48" y="386" font-size="11" fill="#b85450">下标 1 的位置本该是 2，却是 −1，故缺失的最小正数是 2</text>
  <text x="48" y="400" font-size="11" fill="#b85450">每个元素最多被交换一次（归位后不再移动），总交换次数 ≤ n</text>
</svg>
