<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：转置 + 每行翻转（原地）</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">时间 O(n²)，空间 O(1)；两遍扫描，无需辅助矩阵</text>

  <g font-size="10" fill="#333">
    <!-- Step 1: transpose -->
    <rect x="40" y="64" width="440" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="84" font-size="12" fill="#446688" font-weight="bold">① 沿主对角线转置</text>
    <text x="54" y="104" font-family="monospace" font-size="10" fill="#555">for (int i = 0; i &lt; n; ++i)</text>
    <text x="70" y="120" font-family="monospace" font-size="10" fill="#555">for (int j = i + 1; j &lt; n; ++j)</text>
    <text x="86" y="136" font-family="monospace" font-size="10" fill="#b85450">swap(matrix[i][j], matrix[j][i]);</text>
    <text x="360" y="84" font-size="9" fill="#888">只走上三角</text>
    <text x="360" y="98" font-size="9" fill="#888">j 从 i+1 起</text>
    <text x="360" y="112" font-size="9" fill="#888">避免换两次</text>

    <path d="M 260 160 L 260 174" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 2: reverse each row -->
    <rect x="40" y="178" width="440" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="198" font-size="12" fill="#4a7a3a" font-weight="bold">② 每行左右翻转</text>
    <text x="54" y="218" font-family="monospace" font-size="10" fill="#555">for (int i = 0; i &lt; n; ++i)</text>
    <text x="70" y="234" font-family="monospace" font-size="10" fill="#b85450">reverse(matrix[i].begin(), matrix[i].end());</text>
    <text x="360" y="198" font-size="9" fill="#888">第 i 行首尾</text>
    <text x="360" y="212" font-size="9" fill="#888">对称交换</text>

    <path d="M 260 258 L 260 272" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 3: done -->
    <rect x="40" y="276" width="440" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="296" font-size="12" fill="#b85450" font-weight="bold">③ 完成</text>
    <text x="110" y="296" font-family="monospace" font-size="10" fill="#555">matrix 已原地旋转 90°，无需返回</text>
    <text x="110" y="310" font-size="9" fill="#888">两步均为原地操作，额外空间 O(1)</text>

    <!-- key insight -->
    <rect x="40" y="324" width="440" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
    <text x="260" y="344" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">拆成两个简单原语：转置 + 行翻转</text>
    <text x="260" y="360" text-anchor="middle" font-size="10" fill="#555">逆时针 90° 改为「转置 + 每列上下翻转」即可</text>
  </g>
</svg>
