<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">连胜段模型：每段贡献三角形数，段间垫一个跳过日</text>
  <text x="320" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">以 n = 9 的最优方案为例（示例 2）</text>

  <!-- ============ 天条 ============ -->
  <g filter="url(#rough2)">
    <rect x="60" y="64" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="110" y="64" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="160" y="64" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="210" y="64" width="46" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="260" y="64" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="310" y="64" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="83" y="85" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">+1</text>
  <text x="133" y="85" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">+2</text>
  <text x="183" y="85" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">+3</text>
  <text x="233" y="85" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">跳过</text>
  <text x="283" y="85" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">+1</text>
  <text x="333" y="85" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">+2</text>
  <text x="83" y="110" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">第1天</text>
  <text x="133" y="110" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">第2天</text>
  <text x="183" y="110" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">第3天</text>
  <text x="233" y="110" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">第4天</text>
  <text x="283" y="110" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">第5天</text>
  <text x="333" y="110" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">第6天</text>

  <!-- 括线 -->
  <path d="M 62 118 v 7 h 140 v -7" fill="none" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="132" y="142" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">连胜段① L₁=3，得分 T(3)=6</text>
  <path d="M 262 118 v 7 h 92 v -7" fill="none" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="308" y="142" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">连胜段② L₂=2，得分 T(2)=3</text>

  <!-- ============ 右侧公式 ============ -->
  <rect x="420" y="62" width="185" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="512" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">总分 = Σ T(Lᵢ)</text>
  <text x="512" y="103" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">= 6 + 3 = 9 ✓ 恰好 n</text>

  <rect x="420" y="128" width="185" height="66" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="512" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6420" filter="url(#rough2)">总天数 = Σ Lᵢ + (段数−1)</text>
  <text x="512" y="169" text-anchor="middle" font-size="11.5" fill="#8a6420" filter="url(#rough2)">= (3+2) + (2−1) = 6</text>
  <text x="512" y="186" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">跳过日也计入天数</text>

  <!-- ============ 记法重构 ============ -->
  <rect x="40" y="210" width="565" height="86" rx="10" fill="#fafafa" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="322" y="234" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">换个记法：每段花费 Lᵢ+1 天（段内 Lᵢ 天 + 段后 1 个「垫背」跳过日）</text>
  <text x="322" y="256" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">最后一段后面不用再跳，退还 1 天</text>
  <text x="322" y="282" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">总天数 = Σ (Lᵢ + 1) − 1 = (4+3) − 1 = 6</text>

  <!-- ============ 硬币视角 ============ -->
  <rect x="40" y="316" width="565" height="70" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="322" y="340" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">段长 L ↔ 一枚「三角形数硬币」：面值 T(L) = L(L+1)/2，铸造费 L+1</text>
  <text x="322" y="362" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">问题 = 用这些硬币恰好凑出面值 n，最小化铸造费总和</text>
  <text x="322" y="379" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">（每段可以重复，比如 [3,3] —— 完全背包！）</text>

  <text x="320" y="414" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">先别急着贪心：长段不一定最优，见下一张反例图</text>
</svg>
