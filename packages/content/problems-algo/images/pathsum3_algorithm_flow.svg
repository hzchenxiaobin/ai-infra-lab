<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr3" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：前缀和 + 哈希 + 回溯</text>

  <!-- start -->
  <rect x="180" y="46" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="260" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">dfs(node, cur)</text>
  <path d="M 260 80 L 260 96" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr3)" filter="url(#rough2)"/>

  <!-- diamond node==null? -->
  <path d="M 260 100 L 340 140 L 260 180 L 180 140 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="138" text-anchor="middle" font-size="11" fill="#333">node == null ?</text>
  <text x="260" y="154" text-anchor="middle" font-size="11" fill="#333"></text>
  <!-- yes branch -->
  <path d="M 340 140 L 400 140" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr3)" filter="url(#rough2)"/>
  <text x="350" y="134" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <rect x="400" y="124" width="92" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="446" y="145" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return</text>

  <!-- no branch down -->
  <path d="M 260 180 L 260 198" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr3)" filter="url(#rough2)"/>
  <text x="268" y="194" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- cur += node.val -->
  <rect x="170" y="200" width="180" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="222" text-anchor="middle" font-size="12" fill="#333">cur += node.val</text>
  <path d="M 260 234 L 260 250" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr3)" filter="url(#rough2)"/>

  <!-- ans += cnt[cur-target] -->
  <rect x="150" y="252" width="220" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="274" text-anchor="middle" font-size="12" fill="#333">ans += cnt[cur − target]　（先查）</text>
  <path d="M 260 286 L 260 302" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr3)" filter="url(#rough2)"/>

  <!-- cnt[cur] += 1 -->
  <rect x="170" y="304" width="180" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="326" text-anchor="middle" font-size="12" fill="#333">cnt[cur] += 1　（再写）</text>
  <path d="M 260 338 L 260 354" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr3)" filter="url(#rough2)"/>

  <!-- dfs children -->
  <rect x="140" y="356" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="378" text-anchor="middle" font-size="12" fill="#333">dfs(node.left) ; dfs(node.right)</text>
  <path d="M 260 390 L 260 406" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr3)" filter="url(#rough2)"/>

  <!-- backtrack -->
  <rect x="150" y="408" width="220" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="430" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold">cnt[cur] −= 1　（回溯撤销）</text>

  <!-- side annotation -->
  <path d="M 370 270 Q 420 270 420 360" stroke="#d6a040" stroke-width="1.3" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="424" y="318" font-size="10" fill="#8a6a20">写入后</text>
  <text x="424" y="332" font-size="10" fill="#8a6a20">必须撤销</text>
</svg>
