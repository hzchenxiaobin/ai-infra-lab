<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="600" height="430" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">交错合并：单步四指针操作</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">每轮从右半摘一个节点插到前半当前节点后面</text>

  <!-- ===== 合并前 ===== -->
  <text x="30" y="78" font-size="12" fill="#444" font-weight="bold">合并前</text>
  <g font-size="12">
    <!-- first half: 1→2→3→⊥ -->
    <rect x="140" y="66" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5" filter="url(#rough2)"/>
    <text x="161" y="86" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <line x1="182" y1="81" x2="198" y2="81" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="204" y="66" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="225" y="86" text-anchor="middle" fill="#333" font-weight="bold">2</text>
    <line x1="246" y1="81" x2="262" y2="81" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="268" y="66" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="289" y="86" text-anchor="middle" fill="#333" font-weight="bold">3</text>
    <text x="320" y="87" font-size="13" fill="#888">⊥</text>
    <!-- second half (reversed): 5→4 -->
    <rect x="140" y="120" width="42" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="5" filter="url(#rough2)"/>
    <text x="161" y="140" text-anchor="middle" fill="#b85450" font-weight="bold">5</text>
    <line x1="182" y1="135" x2="198" y2="135" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrRed)" filter="url(#rough2)"/>
    <rect x="204" y="120" width="42" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="225" y="140" text-anchor="middle" fill="#b85450" font-weight="bold">4</text>
    <!-- pointer labels -->
    <text x="100" y="86" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">first</text>
    <line x1="108" y1="90" x2="134" y2="81" stroke="#446688" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="100" y="140" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">second</text>
    <line x1="108" y1="136" x2="134" y2="135" stroke="#b85450" stroke-width="1.3" marker-end="url(#arrRed)" filter="url(#rough2)"/>
    <!-- tmp labels -->
    <text x="225" y="58" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">tmp1←first.next</text>
    <text x="225" y="166" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">tmp2←second.next</text>
  </g>

  <!-- ===== 四步操作 ===== -->
  <text x="30" y="194" font-size="12" fill="#444" font-weight="bold">四步改指针：</text>
  <rect x="30" y="200" width="540" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="42" y="218" font-size="11" fill="#333">① <tspan font-weight="bold" fill="#d6a040">tmp1 = first.next</tspan>　　② <tspan font-weight="bold" fill="#d6a040">tmp2 = second.next</tspan>　　（先存好后续入口）</text>
  <rect x="30" y="230" width="540" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="42" y="248" font-size="11" fill="#333">③ <tspan font-weight="bold" fill="#b85450">first.next = second</tspan>　④ <tspan font-weight="bold" fill="#b85450">second.next = tmp1</tspan>　（把 second 插到 first 后）</text>
  <rect x="30" y="260" width="540" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="42" y="278" font-size="11" fill="#333">⑤ <tspan font-weight="bold" fill="#4a7a3a">first = tmp1; second = tmp2</tspan>　（两指针同步各前进一步）</text>

  <!-- ===== 合并后（一轮） ===== -->
  <text x="30" y="318" font-size="12" fill="#444" font-weight="bold">一轮后</text>
  <g font-size="12">
    <rect x="110" y="306" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5" filter="url(#rough2)"/>
    <text x="131" y="326" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <line x1="152" y1="321" x2="168" y2="321" stroke="#b85450" stroke-width="2" marker-end="url(#arrRed)" filter="url(#rough2)"/>
    <rect x="174" y="306" width="42" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="5" filter="url(#rough2)"/>
    <text x="195" y="326" text-anchor="middle" fill="#b85450" font-weight="bold">5</text>
    <line x1="216" y1="321" x2="232" y2="321" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="238" y="306" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5" filter="url(#rough2)"/>
    <text x="259" y="326" text-anchor="middle" fill="#333" font-weight="bold">2</text>
    <line x1="280" y1="321" x2="296" y2="321" stroke="#446688" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="312" y="327" font-size="12" fill="#888">→ 3 ⊥</text>
    <!-- dangling second half 4 -->
    <rect x="380" y="306" width="42" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" rx="5" filter="url(#rough2)"/>
    <text x="401" y="326" text-anchor="middle" fill="#b85450" font-weight="bold">4</text>
    <text x="401" y="352" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">second→4 待插</text>
    <!-- pointer labels after -->
    <text x="131" y="356" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">first→2 继续</text>
  </g>

  <!-- footer -->
  <rect x="30" y="372" width="540" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="44" y="391" font-size="10" fill="#555">①② 必须在 ③④ 之前——先存住 first.next 和 second.next，否则改完指针就丢了后续入口。</text>
  <text x="44" y="407" font-size="10" fill="#555">每轮 right 半节点摘一个插到 first 后，两指针同步前进；右半先耗尽即结束。</text>
</svg>
