<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">移掉 K 位数字：单调栈 + 贪心 流程</text>

  <!-- Start -->
  <ellipse cx="250" cy="56" rx="104" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="60" text-anchor="middle" font-size="12" fill="#333">开始: st=[], 给定 k</text>

  <!-- arrow to A -->
  <path d="M 250 76 L 250 96" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond A: 还有数字 c ? -->
  <polygon points="250,100 348,138 250,176 152,138" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="134" text-anchor="middle" font-size="12" fill="#333">还有数字 c ?</text>
  <text x="250" y="150" text-anchor="middle" font-size="10" fill="#888">(逐位扫描)</text>

  <!-- A:Yes down to B -->
  <path d="M 250 176 L 250 214" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="262" y="200" font-size="11" fill="#82b366">是</text>

  <!-- Diamond B: pop condition -->
  <polygon points="250,218 370,256 250,294 130,256" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="250" text-anchor="middle" font-size="11" fill="#333">k&gt;0 且 栈非空</text>
  <text x="250" y="266" text-anchor="middle" font-size="11" fill="#333">且 栈顶 &gt; c ?</text>

  <!-- B:Yes -> pop box (left) -->
  <path d="M 130 256 L 108 256" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="248" text-anchor="middle" font-size="11" fill="#b85450">是</text>
  <rect x="12" y="234" width="96" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="252" text-anchor="middle" font-size="11" fill="#333">pop 栈顶</text>
  <text x="60" y="268" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">k −−</text>

  <!-- inner loop: pop box back up to B top -->
  <path d="M 60 234 L 60 206 L 250 206 L 250 216" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="155" y="200" text-anchor="middle" font-size="10" fill="#888">重判弹栈条件</text>

  <!-- B:No -> push box (down) -->
  <path d="M 250 294 L 250 318" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="262" y="310" font-size="11" fill="#82b366">否</text>
  <rect x="188" y="320" width="124" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="250" y="345" text-anchor="middle" font-size="12" fill="#333">push c 入栈</text>

  <!-- outer loop: push box back up to A (far left, dashed) -->
  <path d="M 188 340 L 8 340 L 8 138 L 150 138" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="8" y="238" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 8 238)">读下一个 c</text>

  <!-- A:No -> right to D -->
  <path d="M 348 138 L 392 138" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="370" y="130" text-anchor="middle" font-size="11" fill="#b85450">否</text>

  <!-- Diamond D: k > 0 ? (收尾) -->
  <polygon points="480,100 560,138 480,176 400,138" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="480" y="134" text-anchor="middle" font-size="12" fill="#333">k &gt; 0 ?</text>
  <text x="480" y="150" text-anchor="middle" font-size="10" fill="#888">(收尾)</text>

  <!-- D:Yes -> truncate box -->
  <path d="M 480 176 L 480 200" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="492" y="192" font-size="11" fill="#b85450">是</text>
  <rect x="416" y="202" width="128" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="480" y="227" text-anchor="middle" font-size="11" fill="#333">截掉末尾 k 个</text>

  <!-- truncate -> strip -->
  <path d="M 480 242 L 480 272" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D:No -> bypass down right to strip -->
  <path d="M 560 138 L 588 138 L 588 300 L 558 300" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="582" y="180" font-size="11" fill="#82b366">否</text>

  <!-- strip box -->
  <rect x="404" y="278" width="152" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="480" y="297" text-anchor="middle" font-size="11" fill="#333">去前导零(留至少一位)</text>
  <text x="480" y="314" text-anchor="middle" font-size="11" fill="#333">空则返回 "0"</text>

  <!-- strip -> return -->
  <path d="M 480 324 L 480 332" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="480" cy="354" rx="64" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="480" y="358" text-anchor="middle" font-size="12" fill="#333">返回结果字符串</text>
</svg>
