<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算:nums = [1,8,1,5,1,5,8,5]</text>

  <!-- array strip -->
  <g filter="url(#rough2)">
    <rect x="60" y="46" width="36" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="100" y="46" width="36" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="140" y="46" width="36" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="180" y="46" width="36" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="220" y="46" width="36" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="260" y="46" width="36" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="300" y="46" width="36" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="340" y="46" width="36" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="78" y="65" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1</text>
  <text x="118" y="65" text-anchor="middle" font-size="12" fill="#8a6420" filter="url(#rough2)">8</text>
  <text x="158" y="65" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1</text>
  <text x="198" y="65" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">5</text>
  <text x="238" y="65" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1</text>
  <text x="278" y="65" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">5</text>
  <text x="318" y="65" text-anchor="middle" font-size="12" fill="#8a6420" filter="url(#rough2)">8</text>
  <text x="358" y="65" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">5</text>
  <text x="78" y="86" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="118" y="86" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="158" y="86" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="198" y="86" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="238" y="86" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="278" y="86" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">5</text>
  <text x="318" y="86" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">6</text>
  <text x="358" y="86" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">7</text>

  <!-- answer box -->
  <rect x="440" y="46" width="176" height="56" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="528" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">答案 = 2</text>
  <text x="528" y="90" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">1 与 5 是特别的</text>

  <!-- table header -->
  <text x="78" y="110" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">值</text>
  <text x="196" y="110" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">出现下标</text>
  <text x="372" y="110" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">相邻间隔</text>
  <text x="500" y="110" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">判定</text>

  <!-- row 1: value 1 -->
  <rect x="52" y="120" width="536" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="78" y="141" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <text x="196" y="141" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[0,2,4]</text>
  <text x="372" y="141" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2,2</text>
  <text x="500" y="141" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓ 特别 (m=3)</text>

  <!-- row 2: value 5 -->
  <rect x="52" y="160" width="536" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="78" y="181" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">5</text>
  <text x="196" y="181" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[3,5,7]</text>
  <text x="372" y="181" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2,2</text>
  <text x="500" y="181" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓ 特别 (m=3)</text>

  <!-- row 3: value 8 -->
  <rect x="52" y="200" width="536" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="78" y="221" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6420" filter="url(#rough2)">8</text>
  <text x="196" y="221" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[1,6]</text>
  <text x="372" y="221" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="500" y="221" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6420" filter="url(#rough2)">✗ 只出现两次</text>

  <!-- pitfall box -->
  <rect x="40" y="250" width="560" height="126" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="62" y="276" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗ 陷阱:只查「首尾距离」是错的</text>
  <text x="62" y="302" font-size="11.5" fill="#555" filter="url(#rough2)">反例:某值出现于下标 [0,2,3,5,8],首尾距离 8 = (5−1)×2,看似等差</text>
  <text x="62" y="326" font-size="11.5" fill="#555" filter="url(#rough2)">但相邻间隔依次为 2,1,2,3,并不全等 → 该值不特别</text>
  <text x="62" y="358" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">正确判定:每个间隔都必须等于首间隔 d = p[1] − p[0]</text>
</svg>
