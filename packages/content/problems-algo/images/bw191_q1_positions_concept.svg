<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">「特别」= 恰好出现三次 + 三个下标成等差数列</text>

  <!-- ============ 左:位置列表 ============ -->
  <text x="170" y="68" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#446688" filter="url(#rough2)">按值收集出现位置</text>
  <text x="170" y="88" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">一遍扫描,值 → 下标列表</text>

  <!-- 数组条 -->
  <g filter="url(#rough2)">
    <rect x="40" y="104" width="30" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="72" y="104" width="30" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="104" y="104" width="30" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="136" y="104" width="30" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="168" y="104" width="30" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="200" y="104" width="30" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="232" y="104" width="30" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="264" y="104" width="30" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="55" y="123" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1</text>
  <text x="87" y="123" text-anchor="middle" font-size="12" fill="#8a6420" filter="url(#rough2)">8</text>
  <text x="119" y="123" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1</text>
  <text x="151" y="123" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">5</text>
  <text x="183" y="123" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1</text>
  <text x="215" y="123" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">5</text>
  <text x="247" y="123" text-anchor="middle" font-size="12" fill="#8a6420" filter="url(#rough2)">8</text>
  <text x="279" y="123" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">5</text>

  <text x="55" y="146" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="87" y="146" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="119" y="146" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="151" y="146" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>
  <text x="183" y="146" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">4</text>
  <text x="215" y="146" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">5</text>
  <text x="247" y="146" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">6</text>
  <text x="279" y="146" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">7</text>

  <!-- 汇聚箭头 -->
  <path d="M 55 152 Q 40 180 60 196" fill="none" stroke="#446688" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 87 152 Q 120 180 130 196" fill="none" stroke="#d6a040" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 151 152 Q 130 184 70 210" fill="none" stroke="#4a7a3a" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 位置列表 -->
  <rect x="52" y="196" width="110" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="107" y="215" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1 → [0, 2, 4]</text>
  <rect x="52" y="232" width="110" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="107" y="251" text-anchor="middle" font-size="12" fill="#8a6420" filter="url(#rough2)">8 → [1, 6]</text>
  <rect x="52" y="268" width="110" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="107" y="287" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">5 → [3, 5, 7]</text>

  <!-- ============ 右:两步判定 ============ -->
  <text x="480" y="68" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#446688" filter="url(#rough2)">对每个值做两步判定</text>

  <rect x="350" y="84" width="260" height="44" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="480" y="103" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">第一步:列表长度 == 3?</text>
  <text x="480" y="121" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">恰好三次,多一次少一次都不行</text>

  <rect x="350" y="144" width="260" height="60" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="480" y="166" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">第二步:p[1] − p[0] == p[2] − p[1]?</text>
  <text x="480" y="186" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">等价于 p[0] + p[2] == 2·p[1]</text>
  <text x="480" y="200" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">(中间下标是等差中项)</text>

  <!-- 判定示例 -->
  <rect x="350" y="222" width="260" height="110" rx="10" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="366" y="246" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1 → [0,2,4]:三次 ✓ 间隔 2=2 ✓</text>
  <text x="366" y="270" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5 → [3,5,7]:三次 ✓ 间隔 2=2 ✓</text>
  <text x="366" y="294" font-size="11.5" fill="#b85450" filter="url(#rough2)">8 → [1,6]:只有两次 ✗</text>
  <text x="366" y="318" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">答案 = 2</text>

  <rect x="40" y="330" width="280" height="26" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="180" y="348" text-anchor="middle" font-size="11" fill="#8a6420" filter="url(#rough2)">值域 1~100 也可用数组代替哈希表</text>

  <rect x="350" y="352" width="260" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="480" y="372" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">两步都过 → 计入答案;对全部值求和</text>
</svg>
