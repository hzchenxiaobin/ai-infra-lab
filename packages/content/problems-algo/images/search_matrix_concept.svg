<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrL" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto">
      <path d="M9,0 L1,4.5 L9,9 Z" fill="#b85450"/>
    </marker>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="4.5" refY="8" orient="auto">
      <path d="M0,0 L9,0 L4.5,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：从右上角出发，每比较一次必排除一行或一列</text>

  <!-- col index header -->
  <text x="116" y="58" text-anchor="middle" font-size="10" fill="#999">0</text>
  <text x="158" y="58" text-anchor="middle" font-size="10" fill="#999">1</text>
  <text x="200" y="58" text-anchor="middle" font-size="10" fill="#999">2</text>
  <text x="242" y="58" text-anchor="middle" font-size="10" fill="#999">3</text>
  <text x="284" y="58" text-anchor="middle" font-size="10" fill="#999">4</text>

  <!-- row index header -->
  <text x="80" y="84" text-anchor="end" font-size="10" fill="#999">0</text>
  <text x="80" y="116" text-anchor="end" font-size="10" fill="#999">1</text>
  <text x="80" y="148" text-anchor="end" font-size="10" fill="#999">2</text>
  <text x="80" y="180" text-anchor="end" font-size="10" fill="#999">3</text>
  <text x="80" y="212" text-anchor="end" font-size="10" fill="#999">4</text>

  <!-- ===== Matrix cells (5x5), origin x0=95 y0=64, cell 42x32 ===== -->
  <!-- Row 0: 1 4 7 11 | 15(start) -->
  <rect x="95"  y="64" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="116" y="85" text-anchor="middle" font-size="12" fill="#777">1</text>
  <rect x="137" y="64" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="158" y="85" text-anchor="middle" font-size="12" fill="#777">4</text>
  <rect x="179" y="64" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="200" y="85" text-anchor="middle" font-size="12" fill="#777">7</text>
  <rect x="221" y="64" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="242" y="85" text-anchor="middle" font-size="12" fill="#777">11</text>
  <!-- start cell (0,4)=15 -->
  <rect x="263" y="64" width="42" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="284" y="85" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">15</text>

  <!-- Row 1: 2 5 8 12 | 19 -->
  <rect x="95"  y="96" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="116" y="117" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="137" y="96" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="158" y="117" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="179" y="96" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="200" y="117" text-anchor="middle" font-size="12" fill="#333">8</text>
  <rect x="221" y="96" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="242" y="117" text-anchor="middle" font-size="12" fill="#333">12</text>
  <rect x="263" y="96" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="284" y="117" text-anchor="middle" font-size="12" fill="#777">19</text>

  <!-- Row 2: 3 6 9 16 | 22 -->
  <rect x="95"  y="128" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="116" y="149" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="137" y="128" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="158" y="149" text-anchor="middle" font-size="12" fill="#333">6</text>
  <rect x="179" y="128" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="200" y="149" text-anchor="middle" font-size="12" fill="#333">9</text>
  <rect x="221" y="128" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="242" y="149" text-anchor="middle" font-size="12" fill="#333">16</text>
  <rect x="263" y="128" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="284" y="149" text-anchor="middle" font-size="12" fill="#777">22</text>

  <!-- Row 3: 10 13 14 17 | 24 -->
  <rect x="95"  y="160" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="116" y="181" text-anchor="middle" font-size="12" fill="#333">10</text>
  <rect x="137" y="160" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="158" y="181" text-anchor="middle" font-size="12" fill="#333">13</text>
  <rect x="179" y="160" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="200" y="181" text-anchor="middle" font-size="12" fill="#333">14</text>
  <rect x="221" y="160" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="242" y="181" text-anchor="middle" font-size="12" fill="#333">17</text>
  <rect x="263" y="160" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="284" y="181" text-anchor="middle" font-size="12" fill="#777">24</text>

  <!-- Row 4: 18 21 23 26 | 30 -->
  <rect x="95"  y="192" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="116" y="213" text-anchor="middle" font-size="12" fill="#333">18</text>
  <rect x="137" y="192" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="158" y="213" text-anchor="middle" font-size="12" fill="#333">21</text>
  <rect x="179" y="192" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="200" y="213" text-anchor="middle" font-size="12" fill="#333">23</text>
  <rect x="221" y="192" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="242" y="213" text-anchor="middle" font-size="12" fill="#333">26</text>
  <rect x="263" y="192" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="284" y="213" text-anchor="middle" font-size="12" fill="#777">30</text>

  <!-- start label -->
  <text x="284" y="54" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">起点 (0,4)</text>

  <!-- LEFT arrow: target less than current, move left, eliminate column below -->
  <path d="M 258 80 L 110 80" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="184" y="40" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">target &lt; 15 → 左移 col−−</text>
  <text x="184" y="52" text-anchor="middle" font-size="9.5" fill="#b85450">该列下方都更大，整列排除</text>

  <!-- DOWN arrow: target greater than current, move down, eliminate row to left -->
  <path d="M 284 100 L 284 218" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="370" y="120" font-size="10.5" fill="#4a7a3a" font-weight="bold">target &gt; 15 → 下移 row++</text>
  <text x="370" y="134" font-size="9.5" fill="#4a7a3a">该行左侧都更小，整行排除</text>

  <!-- legend -->
  <rect x="370" y="150" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="390" y="161" font-size="10.5" fill="#555">被排除的列</text>
  <rect x="370" y="172" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="390" y="183" font-size="10.5" fill="#555">被排除的行</text>
  <rect x="370" y="194" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
  <text x="390" y="205" font-size="10.5" fill="#555">当前比较点</text>

  <!-- core idea box -->
  <rect x="40" y="248" width="480" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="272" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">为什么选右上角？因为它是「行的最大值」也是「列的最小值」</text>
  <text x="280" y="292" text-anchor="middle" font-size="11" fill="#666">行向右递增 → 当前值是本行最大，target 更大时整行都不够，下移；</text>
  <text x="280" y="308" text-anchor="middle" font-size="11" fill="#666">列向下递增 → 当前值是本列最小，target 更小时整列都太大，左移。</text>
  <text x="280" y="328" text-anchor="middle" font-size="11" fill="#888">每次比较必排除一行或一列 → 最多走 m + n 步 → O(m + n)</text>
</svg>
