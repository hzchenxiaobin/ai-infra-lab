<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">两级剪枝：健康区间早退 + 候选限制在 [S, P]</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">删掉一个元素只会让区间 gcd 变大或不变 —— 这是两个剪枝的共同根源</text>

  <text x="40" y="82" font-size="12.5" fill="#333" font-weight="bold">情形 A：S &gt; P（不移除已有非空有效区间）</text>

  <g filter="url(#rough2)">
    <line x1="60" y1="128" x2="500" y2="128" stroke="#666" stroke-width="1.6" marker-end="url(#arr)"/>
  </g>
  <text x="60" y="148" text-anchor="middle" font-size="10" fill="#666">0</text>
  <text x="500" y="148" text-anchor="middle" font-size="10" fill="#666">n−1</text>

  <g filter="url(#rough2)" stroke="#446688" stroke-width="2">
    <line x1="180" y1="118" x2="180" y2="138"/>
    <line x1="380" y1="118" x2="380" y2="138"/>
  </g>
  <text x="180" y="112" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">P</text>
  <text x="380" y="112" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">S</text>

  <g filter="url(#rough2)">
    <rect x="180" y="120" width="200" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
  </g>
  <text x="280" y="132" text-anchor="middle" font-size="10" fill="#8a6a1a" font-weight="bold">有效分割 [P, S−1]，得分 S−P</text>

  <rect x="60" y="158" width="440" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="176" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">定理 1：任何删除都不更优 ⟹ 直接返回 S − P（O(n) 收工）</text>

  <text x="40" y="222" font-size="12.5" fill="#333" font-weight="bold">情形 B：S ≤ P（不移除得分 0）</text>

  <g filter="url(#rough2)">
    <line x1="60" y1="268" x2="500" y2="268" stroke="#666" stroke-width="1.6" marker-end="url(#arr)"/>
  </g>
  <text x="60" y="288" text-anchor="middle" font-size="10" fill="#666">0</text>
  <text x="500" y="288" text-anchor="middle" font-size="10" fill="#666">n−1</text>

  <g filter="url(#rough2)" stroke="#446688" stroke-width="2">
    <line x1="150" y1="258" x2="150" y2="278"/>
    <line x1="410" y1="258" x2="410" y2="278"/>
  </g>
  <text x="150" y="252" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">S</text>
  <text x="410" y="252" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">P</text>

  <g filter="url(#rough2)">
    <rect x="150" y="260" width="260" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
  </g>
  <text x="280" y="272" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">候选删除位置 j ∈ [S, P]（闭区间，含两端）</text>

  <rect x="60" y="298" width="440" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="316" text-anchor="middle" font-size="11.5" fill="#8a6a1a" font-weight="bold">引理 3：区间外的删除满足 P′ ≥ P 且 S′ ≤ S ⟹ 得分仍为 0，跳过</text>

  <rect x="40" y="338" width="482" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="281" y="358" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">关键不等式：sg[i] = gcd(nums[i..j−1], nums[j], sg[j+1]) ≤ gcd(nums[i..j−1], sg[j+1])</text>
  <text x="281" y="378" text-anchor="middle" font-size="10.5" fill="#555">候选数最坏 O(n)（如 [4, 6, …, 6, 9]），但每个只需 O(log n) 评估</text>
</svg>
