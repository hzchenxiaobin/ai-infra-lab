<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8a6420"/>
    </marker>
  </defs>
  <rect width="640" height="500" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程:哈希分组 + 逐项等差判定</text>

  <!-- Node 1: scan -->
  <rect x="170" y="44" width="300" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="64" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">一遍扫描:pos[nums[i]] 追加下标 i</text>
  <text x="320" y="82" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">下标天然递增,无需排序</text>
  <path d="M 320 90 L 320 104" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Node 2: next value -->
  <rect x="170" y="106" width="300" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="128" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">取下一个值 v:p = pos[v],m = |p|</text>
  <path d="M 320 140 L 320 154" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond 3: m >= 3 ? -->
  <polygon points="320,156 452,194 320,232 188,194" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="190" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6420" filter="url(#rough2)">m ≥ 3 ?</text>
  <text x="320" y="206" text-anchor="middle" font-size="10" fill="#8a6420" filter="url(#rough2)">(至少出现三次)</text>
  <path d="M 188 194 H 118 V 123 H 166" fill="none" stroke="#d6a040" stroke-width="1.3" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="153" y="187" text-anchor="middle" font-size="10" fill="#8a6420" filter="url(#rough2)">次数不足</text>
  <text x="331" y="248" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 320 232 L 320 248" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- Node 4: gap check -->
  <rect x="148" y="250" width="344" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="270" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">d = p[1] − p[0];逐项检查 p[k+1] − p[k] == d</text>
  <text x="320" y="288" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">遇到不等的间隔立即判负退出</text>
  <path d="M 320 298 L 320 312" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- Diamond 5: all gaps == d ? -->
  <polygon points="320,314 448,352 320,390 192,352" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="348" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6420" filter="url(#rough2)">全部间隔 == d ?</text>
  <text x="320" y="364" text-anchor="middle" font-size="10" fill="#8a6420" filter="url(#rough2)">(等差判定)</text>
  <text x="459" y="345" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 448 352 H 474" stroke="#b85450" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="476" y="336" width="136" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="544" y="357" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗ v 不特别</text>
  <text x="331" y="406" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 320 390 L 320 406" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- Node 6: ans++ -->
  <rect x="170" y="408" width="300" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="431" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓ ans += 1,处理下一个值</text>

  <!-- loop back -->
  <path d="M 470 426 H 616 V 123 H 474" fill="none" stroke="#999" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="608" y="280" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">下一个值</text>

  <!-- bottom note -->
  <rect x="140" y="460" width="360" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="320" y="479" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">时间 O(n) 期望 / 排序分组 O(n log n);空间 O(n)</text>
</svg>
