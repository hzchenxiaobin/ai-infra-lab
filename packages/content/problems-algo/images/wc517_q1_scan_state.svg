<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 390" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="390" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">一次遍历：只记录上次出现下标 last[x]</text>

  <!-- flowchart -->
  <rect x="30" y="52" width="120" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="90" y="75" text-anchor="middle" font-size="11" fill="#333">扫描 i = 0..n−1</text>

  <path d="M 150 70 L 190 70" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="255,46 330,70 255,94 180,70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="255" y="66" text-anchor="middle" font-size="10.5" fill="#333">x 出现过 且</text>
  <text x="255" y="80" text-anchor="middle" font-size="10.5" fill="#333">last[x] ≠ i−1 ?</text>

  <path d="M 330 70 L 372 70" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="350" y="62" text-anchor="middle" font-size="10" fill="#b85450">是</text>

  <rect x="374" y="52" width="160" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="454" y="68" text-anchor="middle" font-size="10.5" fill="#333">dead 加入 x</text>
  <text x="454" y="82" text-anchor="middle" font-size="9.5" fill="#b85450">永久断裂，不可恢复</text>

  <path d="M 255 94 L 255 124" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="113" font-size="10" fill="#4a7a3a">否（首次出现或相邻）</text>

  <rect x="185" y="126" width="140" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="255" y="147" text-anchor="middle" font-size="11" fill="#333">更新 last[x] = i</text>

  <path d="M 454 88 L 454 142 L 327 142" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <path d="M 185 142 L 120 142 L 120 88 L 150 88" stroke="#666" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="98" y="135" font-size="9.5" fill="#888">下一个 i</text>

  <!-- answer box -->
  <rect x="150" y="186" width="260" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="209" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">答案 = 不同值个数 − |dead|</text>

  <!-- three-state machine -->
  <text x="280" y="254" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">三态视角：断裂不可逆</text>

  <rect x="60" y="282" width="110" height="40" fill="#eeeeee" stroke="#999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="115" y="307" text-anchor="middle" font-size="11.5" fill="#333">未出现</text>

  <rect x="235" y="282" width="90" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="307" text-anchor="middle" font-size="11.5" fill="#333">块中</text>

  <rect x="390" y="282" width="110" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="445" y="307" text-anchor="middle" font-size="11.5" fill="#333">已断裂</text>

  <path d="M 170 296 L 233 296" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="201" y="288" text-anchor="middle" font-size="9.5" fill="#555">首次出现</text>

  <path d="M 280 322 L 280 344 L 388 344 L 388 324" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="334" y="360" text-anchor="middle" font-size="9.5" fill="#b85450">再出现且 last[x] &lt; i−1</text>

  <path d="M 280 282 L 280 264 L 235 264" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="280" y="258" text-anchor="middle" font-size="9.5" fill="#4a7a3a">相邻出现（last[x] = i−1）保持块中</text>

  <rect x="60" y="330" width="150" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="135" y="352" text-anchor="middle" font-size="10" fill="#333">块中 / 未出现 = 特殊 ✓</text>
</svg>
