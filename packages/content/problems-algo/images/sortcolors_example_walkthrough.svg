<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [2,0,2,1,1,0]</text>

  <!-- column headers -->
  <text x="20" y="54" font-size="10.5" fill="#888" font-weight="bold">步</text>
  <text x="56" y="54" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">i</text>
  <text x="96" y="54" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">p0</text>
  <text x="136" y="54" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">p2</text>
  <text x="180" y="54" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">值</text>
  <text x="270" y="54" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">动作</text>
  <text x="450" y="54" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">数组状态</text>

  <line x1="10" y1="62" x2="550" y2="62" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- helper to render array inline as text with color coding via tspan not supported simply; use plain -->
  <!-- Row: init -->
  <text x="20" y="82" font-size="11" fill="#aaa">初始</text>
  <text x="56" y="82" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <text x="96" y="82" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <text x="136" y="82" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5</text>
  <text x="180" y="82" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <text x="270" y="82" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <text x="450" y="82" text-anchor="middle" font-size="11" fill="#333">[2,0,2,1,1,0]</text>

  <!-- Row 1: i=0, val=2, swap p2 -->
  <text x="20" y="104" font-size="11" fill="#333">1</text>
  <text x="56" y="104" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <text x="96" y="104" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <text x="136" y="104" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5→4</text>
  <rect x="170" y="92" width="20" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="180" y="106" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="270" y="104" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">swap(i,p2); p2−−; i 不动</text>
  <text x="450" y="104" text-anchor="middle" font-size="11" fill="#333">[0,0,2,1,1,2]</text>

  <!-- Row 2: i=0, val=0, swap p0 -->
  <text x="20" y="126" font-size="11" fill="#333">2</text>
  <text x="56" y="126" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0→1</text>
  <text x="96" y="126" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0→1</text>
  <text x="136" y="126" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <rect x="170" y="114" width="20" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="180" y="128" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <text x="270" y="126" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">swap(i,p0); p0++; i++</text>
  <text x="450" y="126" text-anchor="middle" font-size="11" fill="#333">[0,0,2,1,1,2]</text>

  <!-- Row 3: i=1, val=0, swap p0 -->
  <text x="20" y="148" font-size="11" fill="#333">3</text>
  <text x="56" y="148" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1→2</text>
  <text x="96" y="148" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1→2</text>
  <text x="136" y="148" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <rect x="170" y="136" width="20" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="180" y="150" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <text x="270" y="148" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">swap(i,p0); p0++; i++</text>
  <text x="450" y="148" text-anchor="middle" font-size="11" fill="#333">[0,0,2,1,1,2]</text>

  <!-- Row 4: i=2, val=2, swap p2 -->
  <text x="20" y="170" font-size="11" fill="#333">4</text>
  <text x="56" y="170" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="96" y="170" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <text x="136" y="170" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4→3</text>
  <rect x="170" y="158" width="20" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="180" y="172" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="270" y="170" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">swap(i,p2); p2−−; i 不动</text>
  <text x="450" y="170" text-anchor="middle" font-size="11" fill="#333">[0,0,1,1,2,2]</text>

  <!-- Row 5: i=2, val=1, skip -->
  <text x="20" y="192" font-size="11" fill="#333">5</text>
  <text x="56" y="192" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2→3</text>
  <text x="96" y="192" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <text x="136" y="192" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <rect x="170" y="180" width="20" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="180" y="194" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="270" y="192" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">跳过；i++</text>
  <text x="450" y="192" text-anchor="middle" font-size="11" fill="#333">[0,0,1,1,2,2]</text>

  <!-- Row 6: i=3, val=1, skip -->
  <text x="20" y="214" font-size="11" fill="#333">6</text>
  <text x="56" y="214" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3→4</text>
  <text x="96" y="214" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <text x="136" y="214" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <rect x="170" y="202" width="20" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="180" y="216" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="270" y="214" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">跳过；i++</text>
  <text x="450" y="214" text-anchor="middle" font-size="11" fill="#333">[0,0,1,1,2,2]</text>

  <line x1="10" y1="228" x2="550" y2="228" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row end: i=4 > p2=3 -->
  <text x="20" y="252" font-size="11" fill="#333" font-weight="bold">结束</text>
  <text x="56" y="252" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <text x="96" y="252" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <text x="136" y="252" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="180" y="252" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <text x="270" y="252" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">i(4) &gt; p2(3) → 退出</text>
  <text x="450" y="252" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">[0,0,1,1,2,2] ✓</text>

  <!-- before/after visual -->
  <text x="20" y="300" font-size="12" fill="#888" font-weight="bold">前：</text>
  <rect x="60" y="286" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="304" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="104" y="286" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="124" y="304" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="148" y="286" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="168" y="304" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="192" y="286" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="212" y="304" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="236" y="286" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="256" y="304" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="280" y="286" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="304" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>

  <text x="345" y="300" font-size="13" fill="#d6a040" font-weight="bold">→</text>

  <text x="370" y="300" font-size="12" fill="#888" font-weight="bold">后：</text>
  <rect x="410" y="286" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="427" y="304" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="448" y="286" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="465" y="304" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="486" y="286" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="503" y="304" text-anchor="middle" font-size="12" fill="#333">1</text>

  <rect x="410" y="318" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="427" y="336" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="448" y="318" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="465" y="336" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="486" y="318" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="503" y="336" text-anchor="middle" font-size="12" fill="#333">2</text>

  <!-- note -->
  <rect x="20" y="318" width="370" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="204" y="340" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">一趟扫描完成 0/1/2 归位 ✓</text>
  <text x="204" y="358" text-anchor="middle" font-size="11" fill="#888">注意步骤1、4 换2后 i 不动，重新检查换来值</text>

  <!-- legend -->
  <text x="20" y="388" font-size="10.5" fill="#888">图例：</text>
  <rect x="64" y="378" width="16" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="86" y="389" font-size="10.5" fill="#555">0</text>
  <rect x="104" y="378" width="16" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="126" y="389" font-size="10.5" fill="#555">1</text>
  <rect x="144" y="378" width="16" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="166" y="389" font-size="10.5" fill="#555">2</text>
  <rect x="184" y="378" width="16" height="14" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="206" y="389" font-size="10.5" fill="#555">未扫描</text>
</svg>
