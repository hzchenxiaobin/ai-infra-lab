<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="460" height="520" fill="#fafafa"/>

  <text x="230" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">寻找峰值：算法流程</text>

  <!-- Init -->
  <rect x="80" y="44" width="300" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="66" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">初始化</text>
  <text x="230" y="86" text-anchor="middle" font-size="11" fill="#555">left = 0,  right = n − 1</text>

  <path d="M 230 104 L 230 122" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Loop condition -->
  <polygon points="230,126 360,176 230,226 100,176" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="172" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">left &lt; right ?</text>
  <text x="230" y="190" text-anchor="middle" font-size="10.5" fill="#777">区间至少 2 个元素</text>

  <!-- No: exit -->
  <path d="M 360 176 L 410 176 L 410 470" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="368" y="168" font-size="11" fill="#b85450" font-weight="bold">No</text>

  <path d="M 230 226 L 230 246" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="240" y="240" font-size="11" fill="#82b366" font-weight="bold">Yes</text>

  <!-- mid -->
  <rect x="100" y="250" width="260" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="230" y="276" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">mid = left + (right − left) / 2</text>

  <path d="M 230 296 L 230 314" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Decision: nums[mid] vs nums[mid+1] -->
  <polygon points="230,318 370,366 230,414 90,366" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="362" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">nums[mid] &gt; nums[mid+1] ?</text>
  <text x="230" y="380" text-anchor="middle" font-size="10.5" fill="#777">看斜率方向</text>

  <!-- Yes: descending -> right = mid (left) -->
  <path d="M 90 366 L 40 366 L 40 432" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="50" y="358" font-size="11" fill="#b85450" font-weight="bold">Yes ↓</text>
  <rect x="-4" y="436" width="120" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="56" y="458" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">下降坡</text>
  <text x="56" y="476" text-anchor="middle" font-size="11" fill="#b85450">right = mid</text>

  <!-- No: ascending -> left = mid+1 (right) -->
  <path d="M 370 366 L 420 366 L 420 432" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="378" y="358" font-size="11" fill="#4a7a3a" font-weight="bold">No ↑</text>
  <rect x="350" y="436" width="120" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="410" y="458" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">上升坡</text>
  <text x="410" y="476" text-anchor="middle" font-size="11" fill="#4a7a3a">left = mid + 1</text>

  <!-- loop back -->
  <path d="M 56 486 L 56 506 L 230 506 L 230 176 L 230 126" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 410 486 L 410 506 L 230 506" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="150" y="500" font-size="9.5" fill="#aaa">折半后继续</text>

  <!-- return -->
  <rect x="340" y="452" width="116" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="398" y="470" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">return left</text>
  <text x="398" y="486" text-anchor="middle" font-size="9.5" fill="#888">区间收敛到 1 个</text>
  <path d="M 410 470 L 430 470 L 430 452" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="416" y="500" text-anchor="middle" font-size="9.5" fill="#d6a040" font-style="italic">O(log n), O(1)</text>
</svg>
