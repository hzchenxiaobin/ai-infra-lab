<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">一次遍历算法流程</text>

  <!-- init box -->
  <rect x="200" y="44" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="69" text-anchor="middle" font-size="12" fill="#333">total=0, tank=0, start=0</text>

  <path d="M 280 86 L 280 104" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop box -->
  <rect x="180" y="106" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="131" text-anchor="middle" font-size="12" fill="#333">for i = 0 .. n−1</text>

  <path d="M 280 148 L 280 168" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- accumulate box -->
  <rect x="150" y="170" width="260" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="195" text-anchor="middle" font-size="12" fill="#333">d = gas[i]−cost[i]; total += d; tank += d</text>

  <path d="M 280 212 L 280 232" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision diamond: tank < 0 ? -->
  <polygon points="280,234 360,276 280,318 200,276" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="272" text-anchor="middle" font-size="11.5" fill="#333">tank &lt; 0 ?</text>
  <text x="280" y="290" text-anchor="middle" font-size="10" fill="#888">(本段断油)</text>

  <!-- yes branch -->
  <path d="M 200 276 L 96 276 L 96 200" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="269" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <rect x="20" y="160" width="152" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="96" y="178" text-anchor="middle" font-size="11" fill="#333">start = i + 1</text>
  <text x="96" y="194" text-anchor="middle" font-size="11" fill="#333">tank = 0</text>

  <!-- yes box back to loop -->
  <path d="M 96 160 L 96 126 L 178 126" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- no branch -->
  <path d="M 360 276 L 464 276 L 464 126 L 382 126" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="412" y="269" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <text x="470" y="200" text-anchor="middle" font-size="10.5" fill="#4a7a3a">保持 start</text>

  <!-- after loop -->
  <path d="M 280 318 L 280 342" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- final decision -->
  <polygon points="280,344 370,376 280,408 190,376" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="380" text-anchor="middle" font-size="11.5" fill="#333">total &lt; 0 ?</text>

  <!-- total<0 -> -1 -->
  <path d="M 190 376 L 120 376" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="155" y="369" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <rect x="30" y="358" width="86" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="73" y="381" text-anchor="middle" font-size="12" fill="#333">return −1</text>

  <!-- total>=0 -> start -->
  <path d="M 370 376 L 440 376" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="405" y="369" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="446" y="358" width="100" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="496" y="381" text-anchor="middle" font-size="12" fill="#333">return start</text>
</svg>
