<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">电梯请求 II：区间 DP 最小化总惩罚</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">已访问集为排序后连续区间，dp[i][j][端点] 转移</text>

  <text x="40" y="72" font-size="11" fill="#333" font-weight="bold">requests = [1, 5], start = 4</text>

  <line x1="80" y1="200" x2="480" y2="200" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>

  <circle cx="200" cy="200" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="186" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="200" y="230" text-anchor="middle" font-size="10" fill="#888">a[0]</text>

  <circle cx="320" cy="200" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="186" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="320" y="230" text-anchor="middle" font-size="10" fill="#888">start</text>

  <circle cx="440" cy="200" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="440" y="186" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="440" y="230" text-anchor="middle" font-size="10" fill="#888">a[1]</text>

  <path d="M 320 200 L 440 200" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="192" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">+1s</text>

  <path d="M 440 200 L 200 200" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="168" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">+4s</text>

  <text x="40" y="252" font-size="11" fill="#333" font-weight="bold">DP 状态：dp[i][j][s]，s=0 在左端 a[i]，s=1 在右端 a[j]</text>

  <rect x="30" y="264" width="500" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="50" y="284" font-size="10.5" fill="#555">dp[i][j][s] = 已访问惩罚和 + 当前时间 * 未访问数</text>
  <text x="50" y="300" font-size="10.5" fill="#555">转移：扩端点，代价 += 距离 * 未访问数（含新点的未来惩罚）</text>
  <text x="50" y="314" font-size="10.5" fill="#555">初始：start 在 a[k] 则 dp[k][k]=0；否则 dp[i][i]=|a[i]-start|*m</text>

  <rect x="30" y="330" width="240" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="50" y="350" font-size="10.5" fill="#3a4a66" font-weight="bold">路径 A: 4→5→1</text>
  <text x="50" y="368" font-size="10" fill="#555">t(5)=1, t(1)=5</text>
  <text x="50" y="384" font-size="10" fill="#555">惩罚 = 1 + 5 = 6</text>
  <text x="50" y="396" font-size="10" fill="#4a7a3a" font-weight="bold">最优</text>

  <rect x="290" y="330" width="240" height="72" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="310" y="350" font-size="10.5" fill="#3a4a66" font-weight="bold">路径 B: 4→1→5</text>
  <text x="310" y="368" font-size="10" fill="#555">t(1)=3, t(5)=7</text>
  <text x="310" y="384" font-size="10" fill="#555">惩罚 = 3 + 7 = 10</text>
  <text x="310" y="396" font-size="10" fill="#b85450">次优</text>
</svg>
