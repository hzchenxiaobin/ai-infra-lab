<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：3[a2[c]] → accaccacc</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">四个关键快照：压栈 → 压栈 → 内层弹 → 外层弹</text>

  <!-- ===== Snapshot columns: x0 = 15, 155, 295, 435 ; width 120 ===== -->
  <!-- strStack at x0, numStack at x0+52 ; box w=44 h=24 ; baseline bottom y=176 -->

  <!-- Column 1: ① 3[ 之后 -->
  <text x="75" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① 读到 3[ 之后</text>
  <text x="37" y="98" text-anchor="middle" font-size="9" fill="#555">strStack</text>
  <text x="89" y="98" text-anchor="middle" font-size="9" fill="#555">numStack</text>
  <g font-size="12" fill="#333">
    <rect x="15" y="150" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="37" y="168" text-anchor="middle" fill="#446688">""</text>
    <rect x="67" y="150" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="89" y="168" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
  </g>
  <text x="75" y="206" text-anchor="middle" font-size="10" fill="#555">cur =</text>
  <rect x="35" y="214" width="80" height="26" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="232" text-anchor="middle" font-size="12" fill="#333">""</text>

  <!-- Column 2: ② 3[a2[ 之后 -->
  <text x="215" y="74" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">② 读到 3[a2[ 之后</text>
  <text x="177" y="98" text-anchor="middle" font-size="9" fill="#555">strStack</text>
  <text x="229" y="98" text-anchor="middle" font-size="9" fill="#555">numStack</text>
  <g font-size="12" fill="#333">
    <rect x="155" y="124" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="177" y="142" text-anchor="middle" fill="#d6a040" font-weight="bold">"a"</text>
    <rect x="155" y="150" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="177" y="168" text-anchor="middle" fill="#446688">""</text>
    <rect x="207" y="124" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="229" y="142" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
    <rect x="207" y="150" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="229" y="168" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
  </g>
  <text x="197" y="196" font-size="9" fill="#888">top↑</text>
  <text x="215" y="206" text-anchor="middle" font-size="10" fill="#555">cur =</text>
  <rect x="175" y="214" width="80" height="26" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="215" y="232" text-anchor="middle" font-size="12" fill="#333">""</text>

  <!-- Column 3: ③ 内层 ] 之后 -->
  <text x="355" y="74" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">③ 内层 ] 之后</text>
  <text x="317" y="98" text-anchor="middle" font-size="9" fill="#555">strStack</text>
  <text x="369" y="98" text-anchor="middle" font-size="9" fill="#555">numStack</text>
  <g font-size="12" fill="#333">
    <rect x="295" y="150" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="317" y="168" text-anchor="middle" fill="#446688">""</text>
    <rect x="347" y="150" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="369" y="168" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
  </g>
  <text x="355" y="206" text-anchor="middle" font-size="10" fill="#555">cur =</text>
  <rect x="310" y="214" width="90" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="355" y="232" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">"acc"</text>

  <!-- Column 4: ④ 外层 ] 之后 -->
  <text x="495" y="74" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">④ 外层 ] 之后</text>
  <text x="457" y="98" text-anchor="middle" font-size="9" fill="#555">strStack</text>
  <text x="509" y="98" text-anchor="middle" font-size="9" fill="#555">numStack</text>
  <g font-size="11" fill="#999">
    <rect x="435" y="150" width="44" height="26" fill="none" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
    <text x="457" y="168" text-anchor="middle" fill="#999">空</text>
    <rect x="487" y="150" width="44" height="26" fill="none" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
    <text x="509" y="168" text-anchor="middle" fill="#999">空</text>
  </g>
  <text x="495" y="206" text-anchor="middle" font-size="10" fill="#555">cur =</text>
  <rect x="430" y="214" width="130" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="495" y="232" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">"accaccacc"</text>

  <!-- ===== transition arrows between columns ===== -->
  <path d="M 122 163 L 150 163" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="136" y="156" text-anchor="middle" font-size="8" fill="#666">读 a,2,[</text>

  <path d="M 262 163 L 290 163" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="276" y="120" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">遇 ]</text>
  <text x="276" y="156" text-anchor="middle" font-size="8" fill="#b85450">a+c×2</text>

  <path d="M 402 163 L 430 163" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="416" y="120" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">遇 ]</text>
  <text x="416" y="156" text-anchor="middle" font-size="8" fill="#b85450">+acc×3</text>

  <!-- ===== Bottom annotation ===== -->
  <line x1="20" y1="262" x2="540" y2="262" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <rect x="40" y="278" width="480" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="302" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">栈的 LIFO = 括号的「最内层先算」</text>
  <text x="280" y="324" text-anchor="middle" font-size="11" fill="#333">③ 内层 ] 先把 "c" 展成 "cc"，拼回外层 "a" → "acc"</text>
  <text x="280" y="344" text-anchor="middle" font-size="11" fill="#333">④ 外层 ] 再把 "acc" 重复 3 次 → "accaccacc"</text>
  <text x="280" y="364" text-anchor="middle" font-size="10" fill="#555">每遇 ] 弹出的总是最近压入的内层现场，与括号嵌套顺序天然吻合</text>
</svg>
