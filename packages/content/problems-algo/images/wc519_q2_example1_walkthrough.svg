<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="720" height="400" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">示例 1 演算:偶回文表上二分,前驱后选取最近</text>

  <!-- 偶回文表片段 -->
  <text x="360" y="62" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">偶回文表(片段):… 2, 4, 6, 8 | 22, 44, 66, 88, 202, 212, …</text>
  <g filter="url(#rough2)">
    <rect x="120" y="74" width="38" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="162" y="74" width="38" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="204" y="74" width="38" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="246" y="74" width="38" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <rect x="304" y="74" width="38" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <rect x="346" y="74" width="38" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="388" y="74" width="38" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="430" y="74" width="38" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="139" y="94" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="181" y="94" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="223" y="94" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <text x="265" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">8</text>
  <text x="294" y="94" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">…</text>
  <text x="323" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">22</text>
  <text x="365" y="94" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">44</text>
  <text x="407" y="94" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">66</text>
  <text x="449" y="94" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">88</text>
  <text x="265" y="120" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">前驱方向</text>
  <text x="323" y="120" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">后继方向</text>
  <!-- 查询插入点 -->
  <path d="M 294 62 L 288 54 L 300 54 z" fill="#b85450" filter="url(#rough2)"/>
  <text x="294" y="48" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">10~16 都落在 8 与 22 之间</text>

  <!-- 演算表 -->
  <g filter="url(#rough2)">
    <rect x="60" y="140" width="80" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="142" y="140" width="140" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="284" y="140" width="140" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="426" y="140" width="100" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="528" y="140" width="90" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="100" y="162" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6420" filter="url(#rough2)">x</text>
  <text x="212" y="162" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6420" filter="url(#rough2)">前驱 8(差)</text>
  <text x="354" y="162" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6420" filter="url(#rough2)">后继 22(差)</text>
  <text x="476" y="162" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6420" filter="url(#rough2)">选谁</text>
  <text x="573" y="162" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6420" filter="url(#rough2)">代价</text>

  <g filter="url(#rough2)">
    <rect x="60" y="178" width="80" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="142" y="178" width="140" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="284" y="178" width="140" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="426" y="178" width="100" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="528" y="178" width="90" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>

    <rect x="60" y="216" width="80" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="142" y="216" width="140" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="284" y="216" width="140" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="426" y="216" width="100" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="528" y="216" width="90" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>

    <rect x="60" y="254" width="80" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="142" y="254" width="140" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="284" y="254" width="140" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="426" y="254" width="100" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="528" y="254" width="90" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>

    <rect x="60" y="292" width="80" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="142" y="292" width="140" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="284" y="292" width="140" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="426" y="292" width="100" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="528" y="292" width="90" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="100" y="200" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">10</text>
  <text x="212" y="200" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">8(差 2)✓</text>
  <text x="354" y="200" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">22(差 12)</text>
  <text x="476" y="200" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">8</text>
  <text x="573" y="200" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <text x="100" y="238" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">12</text>
  <text x="212" y="238" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">8(差 4)✓</text>
  <text x="354" y="238" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">22(差 10)</text>
  <text x="476" y="238" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">8</text>
  <text x="573" y="238" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>

  <text x="100" y="276" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">14</text>
  <text x="212" y="276" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">8(差 6)✓</text>
  <text x="354" y="276" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">22(差 8)</text>
  <text x="476" y="276" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">8</text>
  <text x="573" y="276" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>

  <text x="100" y="314" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">16</text>
  <text x="212" y="314" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">8(差 8)</text>
  <text x="354" y="314" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">22(差 6)✓</text>
  <text x="476" y="314" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">22</text>
  <text x="573" y="314" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>

  <!-- 底部结论 -->
  <rect x="60" y="348" width="600" height="40" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="373" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">总代价 = 1 + 2 + 3 + 3 = 9 ✓(前三者变 8,唯有 16 改投 22)</text>
</svg>
