<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">直觉：多数元素「抵消」不掉</text>

  <!-- Two camps: majority (blue 2) vs others (red) -->
  <text x="60" y="66" font-size="12.5" fill="#446688" font-weight="bold">多数元素阵营（2）×4</text>
  <text x="320" y="66" font-size="12.5" fill="#b85450" font-weight="bold">其他元素阵营 ×3</text>

  <!-- majority tokens (blue circles, 4) -->
  <circle cx="80" cy="100" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="105" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <circle cx="120" cy="100" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="105" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <circle cx="160" cy="100" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="105" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <circle cx="200" cy="100" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="105" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <!-- other tokens (red, 3) -->
  <circle cx="340" cy="100" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="340" y="105" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <circle cx="380" cy="100" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="105" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <circle cx="420" cy="100" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="420" y="105" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <!-- pairing arrows: 3 blue match 3 red, cancel out -->
  <path d="M 96 120 L 324 120" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" fill="none" filter="url(#rough2)"/>
  <path d="M 136 134 L 308 134" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" fill="none" filter="url(#rough2)"/>
  <path d="M 176 148 L 288 148" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" fill="none" filter="url(#rough2)"/>

  <text x="220" y="170" text-anchor="middle" font-size="11" fill="#888">3 对相互抵消（同归于尽）</text>

  <!-- after cancellation: one blue 2 left -->
  <text x="60" y="206" font-size="12" fill="#888">抵消后剩余：</text>
  <circle cx="200" cy="222" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="200" y="228" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <text x="240" y="228" font-size="12" fill="#d6a040" font-weight="bold">← 多数元素必然剩余！</text>

  <!-- key idea -->
  <rect x="40" y="252" width="440" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="273" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">过半元素 &gt; 其他所有元素之和</text>
  <text x="260" y="291" text-anchor="middle" font-size="11" fill="#555">逐一抵消后，多数元素必定还有剩余</text>

  <!-- footer -->
  <rect x="40" y="312" width="440" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="335" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">→ 用候选 + 净票数模拟「抵消」过程</text>
</svg>
