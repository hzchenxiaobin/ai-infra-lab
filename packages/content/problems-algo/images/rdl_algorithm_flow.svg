<svg xmlns="http://www.w3.org/2000/svg" width="880" height="640" viewBox="0 0 880 640" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arL" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="880" height="640" fill="#fafafa"/>
  <text x="440" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：单调栈逐字符处理</text>
  <path d="M 300 46 Q 440 54 580 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 开始 -->
  <g filter="url(#sk)">
    <rect x="360" y="64" width="160" height="38" rx="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="440" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">统计 cnt[c] = 各字符出现次数</text>
  <path d="M 440 104 L 440 124" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>

  <!-- 遍历循环 -->
  <g filter="url(#sk)">
    <rect x="320" y="128" width="240" height="38" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="440" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">for 每个字符 c in s：</text>
  <path d="M 440 168 L 440 188" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>

  <!-- cnt-- -->
  <g filter="url(#sk)">
    <rect x="340" y="192" width="200" height="36" rx="4" fill="#fff" stroke="#bbb"/>
  </g>
  <text x="440" y="215" text-anchor="middle" font-size="13" fill="#333">cnt[c] -= 1（后面还剩几个）</text>
  <path d="M 440 230 L 440 250" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>

  <!-- 决策菱形：已在栈中？ -->
  <g filter="url(#sk)">
    <path d="M 440 254 L 560 300 L 440 346 L 320 300 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="440" y="296" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">in_stack[c]？</text>
  <text x="440" y="312" text-anchor="middle" font-size="11" fill="#b85450">（c 已在栈里）</text>

  <!-- 是 -> 跳过 -->
  <path d="M 560 300 L 640 300" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="600" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">是</text>
  <g filter="url(#sk)">
    <rect x="644" y="282" width="150" height="36" rx="4" fill="#fce4ec" stroke="#b85450"/>
  </g>
  <text x="719" y="305" text-anchor="middle" font-size="12" fill="#b85450">跳过 continue</text>
  <path d="M 719 318 L 719 600 L 440 600" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arR)" stroke-dasharray="5 4" filter="url(#sk)"/>
  <text x="740" y="460" font-size="11" fill="#b85450">回到循环</text>

  <!-- 否 -> 向下 -->
  <path d="M 440 346 L 440 372" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>
  <text x="452" y="362" font-size="12" font-weight="bold" fill="#333">否</text>

  <!-- while 循环框 -->
  <g filter="url(#sk)">
    <rect x="280" y="376" width="320" height="36" rx="4" fill="#fff" stroke="#bbb"/>
  </g>
  <text x="440" y="399" text-anchor="middle" font-size="12" fill="#333">while 栈非空：</text>

  <!-- while 决策菱形 -->
  <g filter="url(#sk)">
    <path d="M 440 420 L 600 466 L 440 512 L 280 466 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="440" y="460" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">栈顶 &gt; c</text>
  <text x="440" y="476" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">且 cnt[栈顶] &gt; 0 ？</text>

  <!-- 是 -> 弹出 -->
  <path d="M 600 466 L 660 466" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="630" y="458" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">是</text>
  <g filter="url(#sk)">
    <rect x="664" y="448" width="170" height="38" rx="4" fill="#fff8e1" stroke="#d6a040"/>
  </g>
  <text x="749" y="464" text-anchor="middle" font-size="12" fill="#7a5415">弹出栈顶 top</text>
  <text x="749" y="480" text-anchor="middle" font-size="12" fill="#7a5415">in_stack[top] = false</text>
  <path d="M 749 486 L 749 530 L 440 530" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arO)" stroke-dasharray="5 4" filter="url(#sk)"/>
  <text x="700" y="522" font-size="11" fill="#7a5415">继续判栈顶</text>

  <!-- 否 -> 入栈 -->
  <path d="M 440 512 L 440 548" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>
  <text x="452" y="534" font-size="12" font-weight="bold" fill="#333">否</text>

  <g filter="url(#sk)">
    <rect x="340" y="552" width="200" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="440" y="570" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">c 入栈</text>
  <text x="440" y="586" text-anchor="middle" font-size="11" fill="#4a7a3a">in_stack[c] = true</text>
  <path d="M 440 592 L 440 608" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>

  <!-- 结束 -->
  <g filter="url(#sk)">
    <rect x="300" y="608" width="280" height="0" fill="none"/>
  </g>

  <!-- 返回结果（右下角） -->
  <g filter="url(#sk)">
    <rect x="60" y="556" width="240" height="58" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="180" y="578" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">遍历结束</text>
  <text x="180" y="598" text-anchor="middle" font-size="12" fill="#4a7a3a">栈底→栈顶拼接即答案</text>
  <path d="M 300 585 L 336 572" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>

  <text x="440" y="630" text-anchor="middle" font-size="12" fill="#888">两道"门"：① 在栈中直接跳过；② 栈顶更大但后面没了就不能弹。</text>
</svg>
