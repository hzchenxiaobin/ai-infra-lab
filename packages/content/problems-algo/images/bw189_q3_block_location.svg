<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">无限字符串：按块定位，块内定序</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">块 b 含 10b..10b+9，偶块递增、奇块递减</text>

  <text x="40" y="72" font-size="11" fill="#333" font-weight="bold">字符串开头：</text>

  <rect x="30" y="82" width="100" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="106" text-anchor="middle" font-size="11" fill="#333">123456789</text>
  <text x="80" y="130" text-anchor="middle" font-size="10" fill="#888">块0 (9位)</text>

  <rect x="140" y="82" width="160" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="106" text-anchor="middle" font-size="10" fill="#333">19181716151413121110</text>
  <text x="220" y="130" text-anchor="middle" font-size="10" fill="#888">块1 奇(20位)</text>

  <rect x="310" y="82" width="160" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="390" y="106" text-anchor="middle" font-size="10" fill="#333">20212223242526272829</text>
  <text x="390" y="130" text-anchor="middle" font-size="10" fill="#888">块2 偶(20位)</text>

  <text x="40" y="148" font-size="11" fill="#333" font-weight="bold">k = 15 的定位过程：</text>

  <rect x="30" y="160" width="500" height="32" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="180" font-size="10.5" fill="#555">1. k=15 &gt; 9（块0），减 9 得 k'=6</text>

  <rect x="30" y="194" width="500" height="32" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="214" font-size="10.5" fill="#555">2. d=2 位段：90*2*1=180 位，k'=6 在其中</text>

  <rect x="30" y="228" width="500" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="248" font-size="10.5" fill="#555">3. block_idx = (6-1)//20 = 0, offset = 5, b = 1(奇)</text>

  <rect x="30" y="262" width="500" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="282" font-size="10.5" fill="#555">4. num_idx = 5//2 = 2, digit_idx = 5%2 = 1</text>

  <rect x="30" y="296" width="500" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="50" y="316" font-size="10.5" fill="#4a7a3a" font-weight="bold">5. b 奇 → number = 10*1+9-2 = 17, str(17)[1] = '7'</text>

  <rect x="30" y="340" width="500" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="362" font-size="11" fill="#3a4a66" font-weight="bold">按位段定位：d 位数字的块共 9*10^(d-2) 个</text>
  <text x="50" y="380" font-size="10.5" fill="#555">每块 10*d 位，逐段减去总位数直到定位到目标段</text>
  <text x="50" y="396" font-size="10.5" fill="#555">k 达 10^15，最多 ~16 位段，O(log k) 定位</text>
</svg>
