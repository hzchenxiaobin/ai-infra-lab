<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：后序 DFS，自底向上汇总 (rob, not_rob)</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">时间 O(n)，空间 O(h)；每节点访问一次，无重复计算</text>

  <g font-size="10" fill="#333">
    <!-- Step 1: base case -->
    <rect x="40" y="64" width="480" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="84" font-size="12" fill="#b85450" font-weight="bold">① 递归终止</text>
    <text x="150" y="84" font-family="monospace" font-size="10" fill="#555">if node is None:</text>
    <text x="150" y="100" font-family="monospace" font-size="10" fill="#555">    return (0, 0)          # 空节点两态皆 0</text>

    <path d="M 280 112 L 280 126" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 2: recurse left -->
    <rect x="40" y="130" width="480" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="150" font-size="12" fill="#446688" font-weight="bold">② 递归左子</text>
    <text x="150" y="150" font-family="monospace" font-size="10" fill="#555">L = dfs(node.left)      # 得 (L.rob, L.not_rob)</text>
    <text x="150" y="166" font-size="9" fill="#888">先算完左子树全部节点，再回来</text>

    <path d="M 280 174 L 280 188" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 3: recurse right -->
    <rect x="40" y="192" width="480" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="212" font-size="12" fill="#446688" font-weight="bold">③ 递归右子</text>
    <text x="150" y="212" font-family="monospace" font-size="10" fill="#555">R = dfs(node.right)     # 得 (R.rob, R.not_rob)</text>
    <text x="150" y="228" font-size="9" fill="#888">左右子结果到手，本节点可算</text>

    <path d="M 280 236 L 280 250" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 4: combine -->
    <rect x="40" y="254" width="480" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="274" font-size="12" fill="#4a7a3a" font-weight="bold">④ 用子结果算本节点两态</text>
    <text x="54" y="294" font-family="monospace" font-size="10" fill="#d6a040">rob     = node.val + L.not_rob + R.not_rob   # 偷本节点，子必不偷</text>
    <text x="54" y="312" font-family="monospace" font-size="10" fill="#4a7a3a">not_rob = max(L.rob, L.not_rob)              # 不偷本节点</text>
    <text x="54" y="328" font-family="monospace" font-size="10" fill="#4a7a3a">           + max(R.rob, R.not_rob)             #    子各自取较优</text>
    <text x="300" y="294" font-size="9" fill="#888">← 父偷 → 子只取 not_rob</text>
    <text x="300" y="312" font-size="9" fill="#888">← 父不偷 → 子取 max</text>

    <path d="M 280 348 L 280 362" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 5: return -->
    <rect x="40" y="366" width="480" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="386" font-size="12" fill="#4a7a3a" font-weight="bold">⑤ 返回</text>
    <text x="110" y="386" font-family="monospace" font-size="10" fill="#555">return (rob, not_rob)   # 交给父节点使用</text>
    <text x="330" y="386" font-size="9" fill="#888">每个节点只算一次</text>
  </g>

  <!-- key note 1 -->
  <rect x="40" y="414" width="480" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="54" y="434" font-size="11" fill="#d6a040" font-weight="bold">⚠️ 后序（左→右→根）</text>
  <text x="200" y="434" font-size="10" fill="#555">必须先拿到子结果才能算父，故用后序；前序/中序都不行</text>

  <!-- key note 2 -->
  <rect x="40" y="456" width="480" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="474" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">入口：max(dfs(root)) 取两态较大者即答案</text>
  <text x="280" y="486" text-anchor="middle" font-size="9" fill="#888">树形 DP 通用模板：后序 + 每节点返回多状态元组</text>
</svg>
