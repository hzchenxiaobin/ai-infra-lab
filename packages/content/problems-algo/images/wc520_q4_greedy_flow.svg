<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程:SOS 预处理 → 逐位(高位→低位)「二分 + 霍尔判定」</text>

  <rect x="110" y="46" width="420" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="70" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">① SOS 超集和:f[m] = 含 m 全部位的元素个数</text>

  <path d="M 320 86 L 320 100" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="106" width="420" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="130" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">② 对位 b = 14, 13, …, 0 依次处理(字典序:高位优先)</text>

  <path d="M 320 146 L 320 160" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="166" width="420" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="184" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">③ 在 [0, f[{b}]] 上二分最大可行 j</text>
  <text x="320" y="202" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">(可行性对 j 单调:可行 ⇒ 更小也可行)</text>

  <path d="M 320 210 L 320 224" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="320,228 505,282 320,336 135,282" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6420" filter="url(#rough2)">④ 检查 mid 可行?</text>
  <text x="320" y="288" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(a) 每个已有阈值 v ≤ mid:f[C(v)∪{b}] ≥ v</text>
  <text x="320" y="306" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(b) 新阈值:f[C(mid)∪{b}] ≥ mid</text>

  <text x="152" y="264" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 132 282 C 72 282, 72 196, 106 196" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="72" y="240" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">hi = mid − 1</text>

  <text x="488" y="264" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 508 282 C 568 282, 568 196, 534 196" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="566" y="240" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">lo = mid</text>

  <path d="M 320 336 L 320 350" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="356" width="420" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="376" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">⑤ p_b = j;j 大于 0 时更新阈值链:</text>
  <text x="320" y="396" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">v ≤ j 的层 C(v) 并上位 b;插入 / 合并阈值 j</text>

  <path d="M 534 382 C 612 382, 612 126, 534 126" fill="none" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="616" y="316" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">下一位</text>

  <path d="M 320 408 L 320 422" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="332" y="420" font-size="10" fill="#555" filter="url(#rough2)">15 位全部处理完</text>

  <rect x="150" y="428" width="340" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="450" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">⑥ 输出 power[i] = p[14 − i]</text>
</svg>
