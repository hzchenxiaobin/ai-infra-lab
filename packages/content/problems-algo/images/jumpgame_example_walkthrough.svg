<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [3,2,1,0,4]，目标 maxReach ≥ 4</text>

  <!-- column headers -->
  <text x="20" y="54" font-size="10.5" fill="#888" font-weight="bold">步</text>
  <text x="56" y="54" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">i</text>
  <text x="100" y="54" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">nums[i]</text>
  <text x="180" y="54" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">i ≤ maxReach?</text>
  <text x="320" y="54" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">更新 maxReach</text>
  <text x="470" y="54" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">maxReach</text>

  <line x1="10" y1="62" x2="550" y2="62" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row init -->
  <text x="20" y="84" font-size="11" fill="#aaa">初始</text>
  <text x="56" y="84" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <text x="100" y="84" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <text x="180" y="84" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <text x="320" y="84" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <text x="470" y="84" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">0</text>

  <!-- Row 1: i=0, val=3, 0<=0, max(0,3)=3 -->
  <text x="20" y="108" font-size="11" fill="#333">1</text>
  <text x="56" y="108" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <rect x="88" y="96" width="24" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="100" y="110" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="180" y="108" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0 ≤ 0 ✓</text>
  <text x="320" y="108" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">max(0, 0+3) = 3</text>
  <text x="470" y="108" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>

  <!-- Row 2: i=1, val=2, 1<=3, max(3,3)=3 -->
  <text x="20" y="132" font-size="11" fill="#333">2</text>
  <text x="56" y="132" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="88" y="120" width="24" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="100" y="134" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="180" y="132" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1 ≤ 3 ✓</text>
  <text x="320" y="132" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">max(3, 1+2) = 3</text>
  <text x="470" y="132" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>

  <!-- Row 3: i=2, val=1, 2<=3, max(3,3)=3 -->
  <text x="20" y="156" font-size="11" fill="#333">3</text>
  <text x="56" y="156" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="88" y="144" width="24" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="100" y="158" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="180" y="156" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2 ≤ 3 ✓</text>
  <text x="320" y="156" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">max(3, 2+1) = 3</text>
  <text x="470" y="156" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>

  <!-- Row 4: i=3, val=0, 3<=3, max(3,3)=3, stuck -->
  <text x="20" y="180" font-size="11" fill="#333">4</text>
  <text x="56" y="180" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="88" y="168" width="24" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="100" y="182" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <text x="180" y="180" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3 ≤ 3 ✓</text>
  <text x="320" y="180" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">max(3, 3+0) = 3 卡住</text>
  <text x="470" y="180" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>

  <!-- Row 5: i=4, val=4, 4>3 fail -->
  <text x="20" y="204" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="56" y="204" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <rect x="88" y="192" width="24" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="100" y="206" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="180" y="204" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4 ≤ 3 ✗</text>
  <text x="320" y="204" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">断点 → 返回 false</text>
  <text x="470" y="204" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>

  <line x1="10" y1="218" x2="550" y2="218" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="60" y="236" width="440" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="261" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">i=4 不可达 → 无法到达终点，返回 false ✓</text>

  <!-- visual: array with maxReach bar -->
  <text x="20" y="306" font-size="12" fill="#888" font-weight="bold">nums：</text>
  <rect x="70" y="292" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="92" y="310" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="118" y="292" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="310" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="166" y="292" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="310" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="214" y="292" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="236" y="310" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="262" y="292" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="284" y="310" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>

  <!-- index labels -->
  <text x="92" y="332" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="140" y="332" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="188" y="332" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="236" y="332" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">3 卡点</text>
  <text x="284" y="332" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">4 终点</text>

  <!-- maxReach coverage bar -->
  <rect x="70" y="346" width="188" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="164" y="359" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">maxReach 覆盖 [0,3]</text>

  <!-- gap -->
  <path d="M 258 355 L 280 355" stroke="#b85450" stroke-width="2" stroke-dasharray="4,3" fill="none" filter="url(#rough2)"/>
  <text x="320" y="359" font-size="10.5" fill="#b85450" font-weight="bold">断点：到不了 4</text>

  <!-- footer -->
  <rect x="20" y="372" width="520" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="388" text-anchor="middle" font-size="11" fill="#444">对比 [2,3,1,1,4]：i=1 时 maxReach 推到 4 ≥ 4，提前 true</text>
</svg>
