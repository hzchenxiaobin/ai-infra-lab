<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：每个子集和 = total / k</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">把 n 个数装进 k 个容量相等的桶，每桶恰好装满</text>

  <!-- ===== Top: nums array ===== -->
  <text x="30" y="76" font-size="12" fill="#446688" font-weight="bold">数组 nums = [4, 3, 2, 3, 5, 2, 1]</text>
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <rect x="60"  y="86" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="80"  y="108" fill="#446688">4</text>
    <rect x="100" y="86" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="120" y="108" fill="#446688">3</text>
    <rect x="140" y="86" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="160" y="108" fill="#446688">2</text>
    <rect x="180" y="86" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="200" y="108" fill="#446688">3</text>
    <rect x="220" y="86" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="240" y="108" fill="#b85450">5</text>
    <rect x="260" y="86" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="280" y="108" fill="#446688">2</text>
    <rect x="300" y="86" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="320" y="108" fill="#446688">1</text>
  </g>

  <!-- ===== Formula box ===== -->
  <rect x="370" y="80" width="150" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="445" y="100" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">total = 20,  k = 4</text>
  <text x="445" y="118" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">target = 20 / 4 = 5</text>

  <!-- arrow down -->
  <path d="M 270 128 L 270 144" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="142" font-size="10" fill="#888">装进 4 个容量为 5 的桶</text>

  <!-- ===== Four buckets ===== -->
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <!-- bucket 0: {5} -->
    <rect x="50"  y="156" width="100" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
    <text x="100" y="176" font-size="10.5" fill="#4a7a3a">桶0</text>
    <rect x="64" y="184" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="81" y="204" fill="#b85450">5</text>
    <text x="130" y="204" font-size="11" fill="#4a7a3a">=5 ✓</text>

    <!-- bucket 1: {4,1} -->
    <rect x="160" y="156" width="100" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
    <text x="210" y="176" font-size="10.5" fill="#4a7a3a">桶1</text>
    <rect x="172" y="184" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="189" y="204" fill="#446688">4</text>
    <rect x="208" y="184" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="225" y="204" fill="#446688">1</text>
    <text x="240" y="220" font-size="10.5" fill="#4a7a3a">=5 ✓</text>

    <!-- bucket 2: {3,2} -->
    <rect x="270" y="156" width="100" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
    <text x="320" y="176" font-size="10.5" fill="#4a7a3a">桶2</text>
    <rect x="282" y="184" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="299" y="204" fill="#446688">3</text>
    <rect x="318" y="184" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="335" y="204" fill="#446688">2</text>
    <text x="350" y="220" font-size="10.5" fill="#4a7a3a">=5 ✓</text>

    <!-- bucket 3: {3,2} -->
    <rect x="380" y="156" width="100" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
    <text x="430" y="176" font-size="10.5" fill="#4a7a3a">桶3</text>
    <rect x="392" y="184" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="409" y="204" fill="#446688">3</text>
    <rect x="428" y="184" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="445" y="204" fill="#446688">2</text>
    <text x="460" y="220" font-size="10.5" fill="#4a7a3a">=5 ✓</text>
  </g>

  <!-- ===== Pruning summary ===== -->
  <line x1="20" y1="246" x2="520" y2="246" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <rect x="30" y="258" width="490" height="108" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="50" y="280" font-size="12" fill="#d6a040" font-weight="bold">三重剪枝（让 O(k^n) 在实际用例上极速收敛）：</text>
  <text x="50" y="302" font-size="11" fill="#555">① 降序排序：大数先放，浅层就触发超容失败，早剪枝</text>
  <text x="50" y="320" font-size="11" fill="#555">② 跳过同容量桶：buckets[i] == buckets[i-1] 时 continue，避免对称重复</text>
  <text x="50" y="338" font-size="11" fill="#555">③ 空桶失败即停：放进空桶后递归失败 → break，空桶彼此等价</text>
  <text x="50" y="358" font-size="11" fill="#b85450" font-weight="bold">前置特判：total%k≠0 或 max(nums)>target → 直接 false</text>
</svg>
