<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="520" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">进阶:相交对数 = 总对数 − 相离对数(补集计数)</text>

  <!-- ============ 上:补集等式 ============ -->
  <rect x="50" y="56" width="150" height="52" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="125" y="78" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">全部对</text>
  <text x="125" y="97" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">C(n, 2)</text>

  <text x="235" y="90" text-anchor="middle" font-size="24" font-weight="bold" fill="#333" filter="url(#rough2)">−</text>

  <rect x="265" y="56" width="170" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="78" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#d6a040" filter="url(#rough2)">相离对</text>
  <text x="350" y="97" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">end_i &lt; start_j(严格)</text>

  <text x="470" y="90" text-anchor="middle" font-size="24" font-weight="bold" fill="#333" filter="url(#rough2)">=</text>

  <rect x="500" y="56" width="130" height="52" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="565" y="78" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">相交对</text>
  <text x="565" y="97" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">答案</text>

  <!-- ============ 中:示例 1 双指针演示 ============ -->
  <text x="320" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">以示例 1 [[1,2],[2,3],[3,4]] 验证:数「严格小于每个 start 的 end 个数」</text>

  <!-- ends 行 -->
  <text x="70" y="182" font-size="12" fill="#888" filter="url(#rough2)">ends 排序:</text>
  <rect x="160" y="164" width="56" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="188" y="185" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="230" y="164" width="56" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="258" y="185" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="300" y="164" width="56" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="328" y="185" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>

  <!-- starts 行 -->
  <text x="70" y="262" font-size="12" fill="#888" filter="url(#rough2)">starts 排序:</text>
  <rect x="160" y="244" width="56" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="188" y="265" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="230" y="244" width="56" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="258" y="265" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="300" y="244" width="56" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="328" y="265" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>

  <!-- end=2 高亮被 start=3 数到 -->
  <path d="M 188 202 Q 250 224 318 240" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="238" y="222" font-size="10.5" fill="#b85450" filter="url(#rough2)">2 &lt; 3 ✓ 数到</text>

  <!-- 每个start的计数 -->
  <text x="188" y="298" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">end&lt;1: 0</text>
  <text x="258" y="298" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">end&lt;2: 0</text>
  <text x="328" y="298" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">end&lt;3: 1</text>
  <text x="430" y="265" font-size="12" fill="#333" filter="url(#rough2)">相离对 = 0+0+1 = 1</text>
  <text x="430" y="285" font-size="12" fill="#333" filter="url(#rough2)">([1,2] 与 [3,4])</text>

  <!-- 答案计算 -->
  <rect x="120" y="316" width="400" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="344" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">答案 = C(3,2) − 1 = 3 − 1 = 2 ✓</text>

  <!-- 公式框 -->
  <rect x="40" y="380" width="560" height="76" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="406" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">答案 = C(n,2) − Σⱼ #{ i : end_i &lt; start_j }</text>
  <text x="320" y="430" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">starts、ends 各自排序后双指针扫描 O(n log n);</text>
  <text x="320" y="448" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">值域只有 [0,100] 时,ends 桶计数 + 前缀和即可 O(n + V)</text>

  <!-- 提示框 -->
  <rect x="40" y="466" width="560" height="42" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="492" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">⚠ 相离必须「严格小于」:end_i = start_j 时两区间共享端点,算相交!</text>
</svg>
