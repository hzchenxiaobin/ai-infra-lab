<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">二分答案算法流程（在上限 limit 上二分）</text>

  <!-- Start node -->
  <ellipse cx="270" cy="62" rx="120" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="12" fill="#333">开始: lo=max(nums), hi=sum(nums), ans=hi</text>

  <!-- arrow down -->
  <path d="M 270 82 L 270 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: lo <= hi? -->
  <polygon points="270,104 370,150 270,196 170,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="146" text-anchor="middle" font-size="12" fill="#333">lo &lt;= hi ?</text>
  <text x="270" y="162" text-anchor="middle" font-size="11" fill="#666">(二分未结束)</text>

  <!-- No branch -> end -->
  <path d="M 370 150 L 452 150" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="408" y="142" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="486" cy="150" rx="46" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="486" y="154" text-anchor="middle" font-size="12" fill="#333">返回 ans</text>

  <!-- Yes branch down -->
  <path d="M 270 196 L 270 214" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="210" font-size="11" fill="#82b366">是</text>

  <!-- mid computation -->
  <rect x="150" y="218" width="240" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="240" text-anchor="middle" font-size="12" fill="#333">mid = (lo + hi) / 2  （候选上限）</text>

  <!-- arrow down -->
  <path d="M 270 252 L 270 270" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- greedy check -->
  <rect x="118" y="274" width="304" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="294" text-anchor="middle" font-size="12" fill="#333">贪心验证：顺序遍历，能放就放</text>
  <text x="270" y="312" text-anchor="middle" font-size="11" fill="#555">放不下另起一段 → 得最少段数 cnt</text>

  <!-- arrow down -->
  <path d="M 270 324 L 270 342" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: cnt <= k? -->
  <polygon points="270,346 380,392 270,438 160,392" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="388" text-anchor="middle" font-size="12" fill="#333">cnt &lt;= k ?</text>
  <text x="270" y="404" text-anchor="middle" font-size="11" fill="#666">(段数够吗)</text>

  <!-- Yes (feasible) -> try smaller -->
  <path d="M 160 392 L 100 392" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="130" y="384" text-anchor="middle" font-size="11" fill="#82b366">是</text>
  <rect x="14" y="372" width="84" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="390" text-anchor="middle" font-size="11" fill="#333">ans = mid</text>
  <text x="56" y="406" text-anchor="middle" font-size="11" fill="#555">hi = mid − 1</text>

  <!-- No (too many) -> try bigger -->
  <path d="M 380 392 L 440 392" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="384" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <rect x="442" y="372" width="84" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="484" y="398" text-anchor="middle" font-size="11" fill="#333">lo = mid + 1</text>

  <!-- loop back arrow from left box up to decision -->
  <path d="M 56 372 L 56 150 L 170 150" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="48" y="270" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 48 270)">继续二分</text>

  <!-- loop back arrow from right box up to decision -->
  <path d="M 484 372 L 484 150 L 370 150" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- summary note -->
  <text x="270" y="452" text-anchor="middle" font-size="11" fill="#888">关键：f(limit) 单调递减 → 满足二段性；每次 O(n) 贪心验证，共 O(log(sum−max)) 次</text>
</svg>
