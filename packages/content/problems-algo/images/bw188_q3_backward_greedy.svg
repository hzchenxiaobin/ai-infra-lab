<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">反向贪心：从末尾向左推导最小初始强度</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">need>0 时需保留 need+m[i] 给后续；need=0 时只需满足当前 req[i]</text>

  <text x="40" y="74" font-size="12" fill="#333" font-weight="bold">示例 1：monsters=[5,10,15], bonus=[0,10,0]</text>

  <rect x="200" y="88" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="230" y="113" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <text x="230" y="78" text-anchor="middle" font-size="10" fill="#888">m[0]=5, bonus=0</text>
  <text x="230" y="142" text-anchor="middle" font-size="10" fill="#888">req=max(0,5-0)=5</text>

  <rect x="290" y="88" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="320" y="113" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">10</text>
  <text x="320" y="78" text-anchor="middle" font-size="10" fill="#888">m[1]=10, bonus=10</text>
  <text x="320" y="142" text-anchor="middle" font-size="10" fill="#888">req=max(0,10-10)=0</text>

  <rect x="380" y="88" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="410" y="113" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">15</text>
  <text x="410" y="78" text-anchor="middle" font-size="10" fill="#888">m[2]=15, bonus=0</text>
  <text x="410" y="142" text-anchor="middle" font-size="10" fill="#888">req=max(0,15-0)=15</text>

  <path d="M 165 108 L 198 108" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="118" y="100" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">反向</text>
  <text x="118" y="114" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">推导</text>

  <line x1="380" y1="170" x2="380" y2="200" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <line x1="290" y1="170" x2="290" y2="200" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <line x1="200" y1="170" x2="200" y2="200" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="350" y="205" width="120" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="410" y="224" text-anchor="middle" font-size="11" fill="#333">need=0 → need=15</text>

  <rect x="260" y="240" width="120" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="320" y="259" text-anchor="middle" font-size="11" fill="#333">need>0 → 15+10=25</text>

  <rect x="170" y="275" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="294" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">need>0 → 25+5=30</text>

  <line x1="320" y1="233" x2="320" y2="240" stroke="#666" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <line x1="230" y1="268" x2="230" y2="275" stroke="#666" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <rect x="30" y="320" width="500" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="342" font-size="11" fill="#4a7a3a" font-weight="bold">递推：need=0; for i=n-1 downto 0: need = (need>0 ? need+m[i] : max(0,m[i]-bonus[i]))</text>
  <text x="50" y="360" font-size="10.5" fill="#555">need>0 时 need+m[i] > m[i] >= req[i]，自动满足当前约束，无需再取 max</text>
  <text x="50" y="376" font-size="10.5" fill="#555">bonus 用差分数组 O(n) 预处理区间加，整体 O(n) 一次反向遍历</text>
</svg>
