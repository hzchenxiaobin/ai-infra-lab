<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="660" height="480" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">例题演算：子集（78），nums=[1,2,3]，start 法</text>
  <text x="330" y="44" text-anchor="middle" font-size="11" fill="#888">每层从 start 往后选，每个节点（含内部）都收集一个子集；下潜后撤销回 start 再换下一个</text>

  <!-- ===== Top: recursion tree with path annotation ===== -->
  <!-- root -->
  <rect x="290" y="62" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="330" y="80" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">[]</text>
  <text x="402" y="78" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">← 收集 ✓</text>

  <!-- L1: pick 1 / 2 / 3 -->
  <path d="M 305 88 L 175 116" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 330 88 L 330 116" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 355 88 L 485 116" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="146" y="118" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="176" y="134" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[1]</text>
  <rect x="300" y="118" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="330" y="134" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[2]</text>
  <rect x="454" y="118" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="484" y="134" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[3]</text>
  <text x="210" y="134" font-size="8" fill="#888" filter="url(#rough2)">start=0选1</text>

  <!-- L2 from [1]: pick 2,3 -->
  <path d="M 168 142 L 130 168" stroke="#666" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 190 142 L 222 168" stroke="#666" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="98" y="170" width="64" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="130" y="185" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[1,2]</text>
  <rect x="190" y="170" width="64" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="222" y="185" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[1,3]</text>

  <!-- L3 from [1,2]: pick 3 -->
  <path d="M 130 192 L 130 214" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="96" y="216" width="68" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="231" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">[1,2,3]</text>
  <text x="172" y="231" font-size="8" fill="#888" filter="url(#rough2)">叶子</text>

  <!-- undo arrows -->
  <path d="M 164 227 Q 200 240 196 184" stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="208" y="252" font-size="8" fill="#b85450" filter="url(#rough2)">pop 3</text>

  <path d="M 254 184 Q 290 250 250 134" stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="262" y="262" font-size="8" fill="#b85450" filter="url(#rough2)">pop 2</text>

  <!-- right branch [2] → [2,3] -->
  <path d="M 330 142 L 330 168" stroke="#666" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="298" y="170" width="64" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="330" y="185" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[2,3]</text>

  <!-- note: [3] leaf already -->
  <text x="484" y="156" font-size="8" fill="#888" filter="url(#rough2)">start=2选3</text>
  <text x="484" y="168" font-size="8" fill="#888" filter="url(#rough2)">无后续</text>

  <!-- ===== Bottom: path timeline ===== -->
  <text x="40" y="300" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">path 栈随时间变化（绿=push，红=pop，⭐=收集）：</text>

  <!-- timeline row of states -->
  <g font-size="9" filter="url(#rough2)">
    <!-- step markers -->
    <text x="40" y="324" fill="#888">t1</text>
    <text x="120" y="324" fill="#888">t2</text>
    <text x="200" y="324" fill="#888">t3</text>
    <text x="280" y="324" fill="#888">t4</text>
    <text x="360" y="324" fill="#888">t5</text>
    <text x="440" y="324" fill="#888">t6</text>
    <text x="520" y="324" fill="#888">t7</text>
    <text x="600" y="324" fill="#888">t8</text>

    <!-- state boxes -->
    <rect x="36" y="332" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="66" y="348" text-anchor="middle" fill="#446688" font-weight="bold">[]⭐</text>
    <rect x="116" y="332" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="146" y="348" text-anchor="middle" fill="#333">[1]⭐</text>
    <rect x="196" y="332" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="226" y="348" text-anchor="middle" fill="#333">[1,2]⭐</text>
    <rect x="276" y="332" width="64" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="308" y="348" text-anchor="middle" fill="#d6a040" font-weight="bold">[1,2,3]⭐</text>
    <rect x="356" y="332" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="386" y="348" text-anchor="middle" fill="#333">[1,3]⭐</text>
    <rect x="436" y="332" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="466" y="348" text-anchor="middle" fill="#333">[2]⭐</text>
    <rect x="516" y="332" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="546" y="348" text-anchor="middle" fill="#333">[2,3]⭐</text>
    <rect x="596" y="332" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="626" y="348" text-anchor="middle" fill="#333">[3]⭐</text>

    <!-- arrows between -->
    <path d="M 96 344 L 116 344" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)"/>
    <path d="M 176 344 L 196 344" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)"/>
    <path d="M 256 344 L 276 344" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)"/>
    <path d="M 340 344 L 356 344" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)"/>
    <path d="M 416 344 L 436 344" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)"/>
    <path d="M 496 344 L 516 344" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)"/>
    <path d="M 576 344 L 596 344" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)"/>

    <!-- op labels -->
    <text x="106" y="372" text-anchor="middle" fill="#4a7a3a">push 1</text>
    <text x="186" y="372" text-anchor="middle" fill="#4a7a3a">push 2</text>
    <text x="266" y="372" text-anchor="middle" fill="#4a7a3a">push 3</text>
    <text x="348" y="372" text-anchor="middle" fill="#b85450">pop 3</text>
    <text x="426" y="372" text-anchor="middle" fill="#b85450">pop 2</text>
    <text x="506" y="372" text-anchor="middle" fill="#4a7a3a">push 3</text>
    <text x="586" y="372" text-anchor="middle" fill="#b85450">pop 3</text>
  </g>

  <!-- summary -->
  <rect x="36" y="392" width="588" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="330" y="412" text-anchor="middle" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">为什么每个节点都收集？</text>
  <text x="50" y="430" font-size="10" fill="#555" filter="url(#rough2)">• 子集问题的解分布在树的所有节点（不只是叶子）：空集 []、单元素 [1][2][3]、多元素 [1,2]… 都要收</text>
  <text x="50" y="446" font-size="10" fill="#555" filter="url(#rough2)">• 而「全排列」只在叶子收（path 满才完整）；「组合」在叶子收（path.size==k）—— 终止条件决定「在哪收」</text>
  <text x="50" y="460" font-size="10" fill="#888" filter="url(#rough2)">• start 只增不减 → 天然非递减 → 杜绝 [1,2] 与 [2,1] 这种重复，无需 used 数组</text>
</svg>
