<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：比值沿路径相乘</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">a/b=2, b/c=3  ⇒  a/c = a/b × b/c = 2 × 3 = 6</text>

  <!-- ===== Graph view: three nodes ===== -->
  <text x="30" y="74" font-size="12" fill="#446688" font-weight="bold">图视角：变量为节点，比值为带权边</text>

  <!-- node a -->
  <ellipse cx="90" cy="120" rx="26" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="90" y="126" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">a</text>
  <!-- node b -->
  <ellipse cx="270" cy="120" rx="26" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="126" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">b</text>
  <!-- node c -->
  <ellipse cx="450" cy="120" rx="26" ry="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="450" y="126" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">c</text>

  <!-- edge a->b (top arc, weight 2) -->
  <path d="M 112 110 Q 180 84 248 110" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="180" y="86" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">×2.0</text>
  <!-- edge b->a (bottom arc, weight 1/2) -->
  <path d="M 248 132 Q 180 158 112 132" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="156" text-anchor="middle" font-size="11" fill="#888">×0.5</text>

  <!-- edge b->c (top arc, weight 3) -->
  <path d="M 292 110 Q 360 84 428 110" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="360" y="86" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">×3.0</text>
  <!-- edge c->b (bottom arc, weight 1/3) -->
  <path d="M 428 132 Q 360 158 292 132" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="156" text-anchor="middle" font-size="11" fill="#888">×1/3</text>

  <!-- formula box -->
  <rect x="120" y="178" width="300" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="204" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">a/c = 路径上权重之积 = 2.0 × 3.0 = 6.0</text>

  <line x1="20" y1="236" x2="520" y2="236" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Union-Find view ===== -->
  <text x="30" y="262" font-size="12" fill="#4a7a3a" font-weight="bold">并查集视角：weight[x] = x / parent[x]</text>

  <!-- tree: c is root, b points to c, a points to b -->
  <ellipse cx="450" cy="306" rx="26" ry="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="450" y="312" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">c</text>
  <text x="450" y="346" text-anchor="middle" font-size="10" fill="#888">root (weight=1)</text>

  <ellipse cx="270" cy="306" rx="26" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="312" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">b</text>

  <ellipse cx="90" cy="306" rx="26" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="90" y="312" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">a</text>

  <!-- a -> b edge with weight 2 -->
  <path d="M 116 306 L 244 306" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="298" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">w=2.0</text>
  <!-- b -> c edge with weight 3 -->
  <path d="M 296 306 L 424 306" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="298" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">w=3.0</text>

  <text x="180" y="332" text-anchor="middle" font-size="10" fill="#888">a/b = w[a] = 2.0</text>
  <text x="360" y="332" text-anchor="middle" font-size="10" fill="#888">b/c = w[b] = 3.0</text>

  <!-- conclusion -->
  <rect x="60" y="354" width="420" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="270" y="369" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">查询 a/c：find 后 a 直接连到根 c，weight[a] 累乘为 2×3=6</text>
</svg>
