<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
  </defs>
  <rect width="880" height="400" fill="#fdfcf7"/>
  <text x="440" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：nums=[7,6,10,12,11], k=3</text>
  <path d="M 300 38 Q 440 46 580 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- factorization reference -->
  <g font-size="11" fill="#444" font-family="monospace">
    <text x="60" y="64" font-weight="bold" fill="#888">分解：</text>
    <text x="110" y="64">7→{7}</text>
    <text x="170" y="64">6→{2,3}</text>
    <text x="240" y="64">10→{2,5}</text>
    <text x="310" y="64">12→{2,3}</text>
    <text x="380" y="64">11→{11}</text>
  </g>

  <!-- step rows -->
  <text x="60" y="92" font-size="12" font-weight="bold" fill="#2b2b2b">step</text>
  <text x="120" y="92" font-size="12" font-weight="bold" fill="#2b2b2b">right</text>
  <text x="200" y="92" font-size="12" font-weight="bold" fill="#2b2b2b">并入集</text>
  <text x="330" y="92" font-size="12" font-weight="bold" fill="#2b2b2b">窗口并集</text>
  <text x="510" y="92" font-size="12" font-weight="bold" fill="#2b2b2b">|并集|</text>
  <text x="600" y="92" font-size="12" font-weight="bold" fill="#2b2b2b">left 动作</text>
  <text x="760" y="92" font-size="12" font-weight="bold" fill="#2b2b2b">最优长</text>
  <line x1="50" y1="100" x2="830" y2="100" stroke="#aaa" stroke-width="1" filter="url(#sk)"/>

  <g font-size="11" fill="#444">
    <text x="60" y="122">1</text>
    <text x="120" y="122">7</text>
    <text x="200" y="122">{7}</text>
    <text x="330" y="122">{7}</text>
    <text x="510" y="122" fill="#2e6e2e" font-weight="bold">1</text>
    <text x="600" y="122">无需收缩</text>
    <text x="760" y="122" fill="#b85450" font-weight="bold">1</text>

    <text x="60" y="144">2</text>
    <text x="120" y="144">6</text>
    <text x="200" y="144">{2,3}</text>
    <text x="330" y="144">{2,3,7}</text>
    <text x="510" y="144" fill="#2e6e2e" font-weight="bold">3</text>
    <text x="600" y="144">无需收缩</text>
    <text x="760" y="144" fill="#b85450" font-weight="bold">2</text>

    <text x="60" y="166">3</text>
    <text x="120" y="166">10</text>
    <text x="200" y="166">{2,5}</text>
    <text x="330" y="166">{2,3,5,7}</text>
    <text x="510" y="166" fill="#b03a3a" font-weight="bold">4 &gt; k</text>
    <text x="600" y="166" fill="#b03a3a">移除 7 → {2,3,5}</text>
    <text x="760" y="166" fill="#b85450" font-weight="bold">2</text>

    <text x="60" y="188">4</text>
    <text x="120" y="188">12</text>
    <text x="200" y="188">{2,3}</text>
    <text x="330" y="188">{2,3,5}</text>
    <text x="510" y="188" fill="#2e6e2e" font-weight="bold">3</text>
    <text x="600" y="188">无需收缩</text>
    <text x="760" y="188" fill="#b85450" font-weight="bold">3 ★</text>

    <text x="60" y="210">5</text>
    <text x="120" y="210">11</text>
    <text x="200" y="210">{11}</text>
    <text x="330" y="210">{2,3,5,11}</text>
    <text x="510" y="210" fill="#b03a3a" font-weight="bold">4 &gt; k</text>
    <text x="600" y="210" fill="#b03a3a">移除 6,10 → {2,3,11}</text>
    <text x="760" y="210" fill="#b85450" font-weight="bold">3</text>
  </g>
  <line x1="50" y1="222" x2="830" y2="222" stroke="#aaa" stroke-width="1" filter="url(#sk)"/>

  <!-- highlight best window -->
  <g filter="url(#sk)">
    <rect x="170" y="240" width="180" height="40" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="260" y="266" text-anchor="middle" font-size="14" font-family="monospace" font-weight="bold" fill="#2e6e2e">[6, 10, 12]</text>
  <text x="260" y="296" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">最长合法窗口，长度 3</text>

  <!-- shrink illustration -->
  <g filter="url(#sk)">
    <rect x="430" y="240" width="400" height="80" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="450" y="264" font-size="12" font-weight="bold" fill="#7a2828">收缩过程（step 5）</text>
  <text x="450" y="286" font-size="11" fill="#444" font-family="monospace">并入 11 → {2,3,5,11} |并集|=4&gt;3</text>
  <text x="450" y="306" font-size="11" fill="#444" font-family="monospace">移 left=6(并集-{2,3}) → 仍含 5 → 再移 10</text>
  <text x="450" y="326" font-size="11" fill="#2e6e2e" font-family="monospace" font-weight="bold">移 10 后 5 消失 → {2,3,11} |并集|=3 ✓</text>

  <!-- result -->
  <g filter="url(#sk)">
    <rect x="60" y="340" width="770" height="48" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="80" y="364" font-size="12" font-weight="bold" fill="#2b6e9e">答案 = max(最优长) = 3，对应子数组 [6,10,12]，并集 {2,3,5} 恰好 3 个不同质因数</text>
  <text x="80" y="380" font-size="11" fill="#666">注：cnt[p] 记"窗口内含 p 的元素个数"，降到 0 才从并集移除</text>
</svg>
