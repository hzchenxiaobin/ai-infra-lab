<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：s = "bbbab" 的区间 DP 填表</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">仅填上三角 i &lt;= j（下三角 i &gt; j 为空串 0），答案 dp[0][4] = 4</text>

  <!-- ===== grid ===== -->
  <g font-size="12" fill="#333">
    <!-- corner -->
    <rect x="110" y="66" width="50" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="135" y="86" text-anchor="middle" font-size="9" fill="#888">i \ j</text>
    <!-- col headers: b b b a b -->
    <rect x="160" y="66" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="185" y="86" text-anchor="middle" fill="#446688" font-weight="bold">b</text>
    <rect x="210" y="66" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="235" y="86" text-anchor="middle" fill="#446688" font-weight="bold">b</text>
    <rect x="260" y="66" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="285" y="86" text-anchor="middle" fill="#446688" font-weight="bold">b</text>
    <rect x="310" y="66" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="335" y="86" text-anchor="middle" fill="#446688" font-weight="bold">a</text>
    <rect x="360" y="66" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="385" y="86" text-anchor="middle" fill="#446688" font-weight="bold">b</text>

    <!-- row headers: b b b a b -->
    <rect x="110" y="98" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="135" y="118" text-anchor="middle" fill="#446688" font-weight="bold">b</text>
    <rect x="110" y="130" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="135" y="150" text-anchor="middle" fill="#446688" font-weight="bold">b</text>
    <rect x="110" y="162" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="135" y="182" text-anchor="middle" fill="#446688" font-weight="bold">b</text>
    <rect x="110" y="194" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="135" y="214" text-anchor="middle" fill="#446688" font-weight="bold">a</text>
    <rect x="110" y="226" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="135" y="246" text-anchor="middle" fill="#446688" font-weight="bold">b</text>

    <!-- row i=0: 1, 2, 3*, 3, 4* -->
    <rect x="160" y="98" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="185" y="118" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="210" y="98" width="50" height="32" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="235" y="118" text-anchor="middle" fill="#555">2</text>
    <rect x="260" y="98" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="285" y="118" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="310" y="98" width="50" height="32" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="335" y="118" text-anchor="middle" fill="#555">3</text>
    <rect x="360" y="98" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="385" y="118" text-anchor="middle" fill="#4a7a3a" font-weight="bold">4</text>

    <!-- row i=1: -, 1, 2, 2*, 3 -->
    <rect x="160" y="130" width="50" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="185" y="150" text-anchor="middle" fill="#bbb">—</text>
    <rect x="210" y="130" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="235" y="150" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="260" y="130" width="50" height="32" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="285" y="150" text-anchor="middle" fill="#555">2</text>
    <rect x="310" y="130" width="50" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="335" y="150" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
    <rect x="360" y="130" width="50" height="32" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="385" y="150" text-anchor="middle" fill="#555">3</text>

    <!-- row i=2: -, -, 1, 1, 3 -->
    <rect x="160" y="162" width="50" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="185" y="182" text-anchor="middle" fill="#bbb">—</text>
    <rect x="210" y="162" width="50" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="235" y="182" text-anchor="middle" fill="#bbb">—</text>
    <rect x="260" y="162" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="285" y="182" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="310" y="162" width="50" height="32" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="335" y="182" text-anchor="middle" fill="#555">1</text>
    <rect x="360" y="162" width="50" height="32" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="385" y="182" text-anchor="middle" fill="#555">3</text>

    <!-- row i=3: -, -, -, 1, 1 -->
    <rect x="160" y="194" width="50" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="185" y="214" text-anchor="middle" fill="#bbb">—</text>
    <rect x="210" y="194" width="50" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="235" y="214" text-anchor="middle" fill="#bbb">—</text>
    <rect x="260" y="194" width="50" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="285" y="214" text-anchor="middle" fill="#bbb">—</text>
    <rect x="310" y="194" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="335" y="214" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="360" y="194" width="50" height="32" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="385" y="214" text-anchor="middle" fill="#555">1</text>

    <!-- row i=4: -, -, -, -, 1 -->
    <rect x="160" y="226" width="50" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="185" y="246" text-anchor="middle" fill="#bbb">—</text>
    <rect x="210" y="226" width="50" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="235" y="246" text-anchor="middle" fill="#bbb">—</text>
    <rect x="260" y="226" width="50" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="285" y="246" text-anchor="middle" fill="#bbb">—</text>
    <rect x="310" y="226" width="50" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="335" y="246" text-anchor="middle" fill="#bbb">—</text>
    <rect x="360" y="226" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="385" y="246" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
  </g>

  <!-- arrow from dp[1][3] to dp[0][4] showing the +2 dependency -->
  <path d="M 335 162 Q 380 140 380 132" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="4,2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="372" y="158" font-size="9" fill="#4a7a3a" font-weight="bold">+2 配对</text>

  <!-- ===== legend / key steps (right) ===== -->
  <rect x="424" y="98" width="146" height="160" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="497" y="118" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">关键填表</text>
  <text x="432" y="136" font-size="9.5" fill="#4a7a3a">dp[0][1]=2  b==b +2</text>
  <text x="432" y="152" font-size="9.5" fill="#4a7a3a">dp[0][2]=3  b==b +2</text>
  <text x="432" y="168" font-size="9.5" fill="#d6a040">dp[2][3]=1  b≠a max</text>
  <text x="432" y="184" font-size="9.5" fill="#446688">dp[i][i]=1 边界</text>
  <text x="432" y="204" font-size="9.5" fill="#888">— 表示空串 0</text>
  <rect x="432" y="216" width="130" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="497" y="236" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">dp[0][4]=4 ✓</text>

  <!-- ===== answer box ===== -->
  <rect x="40" y="288" width="530" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="305" y="310" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">dp[0][4] = dp[1][3] + 2 = 2 + 2 = 4</text>
  <text x="305" y="326" text-anchor="middle" font-size="11" fill="#4a7a3a">首尾 b 配对，内部 s[1..3]="bba" 的 LPS=2，得 "bbbb"</text>

  <!-- ===== note ===== -->
  <rect x="40" y="344" width="530" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="56" y="364" font-size="11" fill="#446688" font-weight="bold">填表顺序观察：</text>
  <text x="56" y="382" font-size="10.5" fill="#444">沿对角线由短到长推进——先填主对角线（长度1），再填上一层（长度2）……</text>
  <text x="56" y="398" font-size="10.5" fill="#444">每格只依赖更短区间（左、下、左下），故 i 倒序、j 正序即可保证就绪。</text>
</svg>
