<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：k=2, prices=[3,2,6,5,0,3] → free[2]=7</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">最优操作：买@2 → 卖@6（赚4）→ 买@0 → 卖@3（赚3）= 7</text>

  <!-- ===== column headers (day index) ===== -->
  <g font-size="10" fill="#888">
    <text x="50" y="76" font-weight="bold">i:</text>
    <text x="120" y="76" text-anchor="middle">0</text>
    <text x="190" y="76" text-anchor="middle">1</text>
    <text x="260" y="76" text-anchor="middle">2</text>
    <text x="330" y="76" text-anchor="middle">3</text>
    <text x="400" y="76" text-anchor="middle">4</text>
    <text x="470" y="76" text-anchor="middle">5</text>
  </g>

  <!-- ===== price row ===== -->
  <g font-size="11">
    <text x="50" y="100" font-size="10" fill="#446688" font-weight="bold">price:</text>
    <rect x="98"  y="84" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="120" y="100" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
    <rect x="168" y="84" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/><text x="190" y="100" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <rect x="238" y="84" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/><text x="260" y="100" text-anchor="middle" fill="#446688" font-weight="bold">6</text>
    <rect x="308" y="84" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="330" y="100" text-anchor="middle" fill="#446688" font-weight="bold">5</text>
    <rect x="378" y="84" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/><text x="400" y="100" text-anchor="middle" fill="#446688" font-weight="bold">0</text>
    <rect x="448" y="84" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/><text x="470" y="100" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
  </g>

  <!-- ===== free[1] row ===== -->
  <g font-size="11">
    <text x="50" y="132" font-size="10" fill="#446688" font-weight="bold">free[1]:</text>
    <rect x="98"  y="116" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="120" y="132" text-anchor="middle" fill="#446688" font-weight="bold">0</text>
    <rect x="168" y="116" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="190" y="132" text-anchor="middle" fill="#446688" font-weight="bold">0</text>
    <rect x="238" y="116" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/><text x="260" y="132" text-anchor="middle" fill="#446688" font-weight="bold">4</text>
    <rect x="308" y="116" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="330" y="132" text-anchor="middle" fill="#446688" font-weight="bold">4</text>
    <rect x="378" y="116" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="400" y="132" text-anchor="middle" fill="#446688" font-weight="bold">4</text>
    <rect x="448" y="116" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="470" y="132" text-anchor="middle" fill="#446688" font-weight="bold">4</text>
  </g>

  <!-- ===== free[2] row ===== -->
  <g font-size="11">
    <text x="50" y="164" font-size="10" fill="#4a7a3a" font-weight="bold">free[2]:</text>
    <rect x="98"  y="148" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="120" y="164" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>
    <rect x="168" y="148" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="190" y="164" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>
    <rect x="238" y="148" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="260" y="164" text-anchor="middle" fill="#4a7a3a" font-weight="bold">4</text>
    <rect x="308" y="148" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="330" y="164" text-anchor="middle" fill="#4a7a3a" font-weight="bold">4</text>
    <rect x="378" y="148" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="400" y="164" text-anchor="middle" fill="#4a7a3a" font-weight="bold">4</text>
    <rect x="448" y="148" width="44" height="24" fill="#e6f4ea" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/><text x="470" y="164" text-anchor="middle" fill="#b85450" font-weight="bold">7</text>
  </g>

  <!-- ===== hold[1] row ===== -->
  <g font-size="11">
    <text x="50" y="196" font-size="10" fill="#b85450" font-weight="bold">hold[1]:</text>
    <rect x="98"  y="180" width="44" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="120" y="196" text-anchor="middle" fill="#b85450" font-weight="bold">−3</text>
    <rect x="168" y="180" width="44" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/><text x="190" y="196" text-anchor="middle" fill="#b85450" font-weight="bold">−2</text>
    <rect x="238" y="180" width="44" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="260" y="196" text-anchor="middle" fill="#b85450" font-weight="bold">−2</text>
    <rect x="308" y="180" width="44" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="330" y="196" text-anchor="middle" fill="#b85450" font-weight="bold">−2</text>
    <rect x="378" y="180" width="44" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/><text x="400" y="196" text-anchor="middle" fill="#b85450" font-weight="bold">0</text>
    <rect x="448" y="180" width="44" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="470" y="196" text-anchor="middle" fill="#b85450" font-weight="bold">0</text>
  </g>

  <!-- ===== hold[2] row ===== -->
  <g font-size="11">
    <text x="50" y="228" font-size="10" fill="#d6a040" font-weight="bold">hold[2]:</text>
    <rect x="98"  y="212" width="44" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="120" y="228" text-anchor="middle" fill="#d6a040" font-weight="bold">−3</text>
    <rect x="168" y="212" width="44" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="190" y="228" text-anchor="middle" fill="#d6a040" font-weight="bold">−2</text>
    <rect x="238" y="212" width="44" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="260" y="228" text-anchor="middle" fill="#d6a040" font-weight="bold">−2</text>
    <rect x="308" y="212" width="44" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="330" y="228" text-anchor="middle" fill="#d6a040" font-weight="bold">−1</text>
    <rect x="378" y="212" width="44" height="24" fill="#fff8e1" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/><text x="400" y="228" text-anchor="middle" fill="#b85450" font-weight="bold">4</text>
    <rect x="448" y="212" width="44" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="470" y="228" text-anchor="middle" fill="#d6a040" font-weight="bold">4</text>
  </g>

  <!-- ===== operation row ===== -->
  <g font-size="10">
    <text x="50" y="260" font-size="10" fill="#666" font-weight="bold">操作:</text>
    <rect x="98"  y="244" width="44" height="22" fill="#f6f6f6" stroke="#888" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="120" y="259" text-anchor="middle" fill="#666" font-weight="bold">休息</text>
    <rect x="168" y="244" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/><text x="190" y="259" text-anchor="middle" fill="#4a7a3a" font-weight="bold">买①</text>
    <rect x="238" y="244" width="44" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/><text x="260" y="259" text-anchor="middle" fill="#b85450" font-weight="bold">卖①</text>
    <rect x="308" y="244" width="44" height="22" fill="#f6f6f6" stroke="#888" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="330" y="259" text-anchor="middle" fill="#666" font-weight="bold">休息</text>
    <rect x="378" y="244" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/><text x="400" y="259" text-anchor="middle" fill="#4a7a3a" font-weight="bold">买②</text>
    <rect x="448" y="244" width="44" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/><text x="470" y="259" text-anchor="middle" fill="#b85450" font-weight="bold">卖②</text>
  </g>

  <!-- ===== detail notes ===== -->
  <line x1="20" y1="280" x2="520" y2="280" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <g font-size="9" fill="#333">
    <text x="30" y="300" font-size="10" fill="#444" font-weight="bold">关键递推：</text>
    <text x="30" y="316" font-size="9" fill="#446688">i=2: free[1]=max(0, hold[1]+6)=max(0,−2+6)=4（卖@6，完成第1笔）</text>
    <text x="30" y="330" font-size="9" fill="#b85450">i=4: hold[2]=max(−1, free[1]−0)=max(−1,4−0)=4（用第1笔利润在低点建第2笔仓）</text>
    <text x="30" y="344" font-size="9" fill="#4a7a3a">i=5: free[2]=max(4, hold[2]+3)=max(4,4+3)=7（卖@3，完成第2笔）</text>
  </g>

  <!-- ===== Result ===== -->
  <rect x="30" y="356" width="480" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="270" y="376" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">最终结果：free[2] = 7 = (6−2) + (3−0)</text>
</svg>
