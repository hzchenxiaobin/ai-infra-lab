<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="r3"><feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="ar3" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#446688"/></marker>
  </defs>
  <rect width="580" height="380" fill="#fafafa"/>
  <text x="290" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r3)">树的深度与权重：weight = nums[i]·(h − d + 1)</text>

  <!-- tree nodes: root 0 at depth1, children 1,2,3 at depth2, 4,5 under 2 at depth3 -->
  <g filter="url(#r3)" font-size="11">
    <!-- edges -->
    <path d="M170 78 L 100 150" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#ar3)"/>
    <path d="M170 78 L 230 150" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#ar3)"/>
    <path d="M170 78 L 360 150" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#ar3)"/>
    <path d="M230 162 L 170 240" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#ar3)"/>
    <path d="M230 162 L 300 240" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#ar3)"/>

    <!-- node 0 depth1 -->
    <circle cx="170" cy="68" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="170" y="72" text-anchor="middle" fill="#333" font-weight="bold">0</text>
    <text x="170" y="48" text-anchor="middle" fill="#446688">d=1 h=3</text>

    <!-- node1 depth2 -->
    <circle cx="95" cy="162" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="95" y="166" text-anchor="middle" fill="#333">1</text>
    <text x="95" y="146" text-anchor="middle" fill="#4a7a3a">d=2</text>

    <!-- node2 depth2 -->
    <circle cx="230" cy="162" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="230" y="166" text-anchor="middle" fill="#333">2</text>
    <text x="230" y="146" text-anchor="middle" fill="#4a7a3a">d=2</text>

    <!-- node3 depth2 -->
    <circle cx="365" cy="162" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="365" y="166" text-anchor="middle" fill="#333">3</text>
    <text x="365" y="146" text-anchor="middle" fill="#4a7a3a">d=2</text>

    <!-- node4 depth3 -->
    <circle cx="170" cy="252" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="170" y="256" text-anchor="middle" fill="#333">4</text>
    <text x="170" y="284" text-anchor="middle" fill="#b85450">d=3</text>

    <!-- node5 depth3 -->
    <circle cx="300" cy="252" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="300" y="256" text-anchor="middle" fill="#333">5</text>
    <text x="300" y="284" text-anchor="middle" fill="#b85450">d=3</text>
  </g>

  <!-- weight table -->
  <rect x="20" y="300" width="540" height="70" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#r3)"/>
  <text x="36" y="322" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#r3)">权重计算（h=3，系数 h−d+1）</text>
  <text x="36" y="340" font-size="10" fill="#333" filter="url(#r3)">节点0: 5·(3−1+1)=15　节点1: 2·(3−2+1)=4　节点2: 3·(3−2+1)=6　节点3: 1·2=2</text>
  <text x="36" y="358" font-size="10" fill="#333" filter="url(#r3)">节点4: 4·(3−3+1)=4　节点5: 6·1=6　　合计 = 15+4+6+2+4+6 = 37</text>
</svg>
