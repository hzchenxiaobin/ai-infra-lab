<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "226"  →  3 种解码</text>

  <!-- 表头 y=50 h=34 -->
  <rect x="30" y="50" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="75" y="72" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">步骤</text>
  <rect x="120" y="50" width="60" height="34" fill="#f6f6f6" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="150" y="72" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">f[0]</text>
  <rect x="180" y="50" width="60" height="34" fill="#f6f6f6" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="210" y="72" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">f[1]</text>
  <rect x="240" y="50" width="60" height="34" fill="#f6f6f6" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="270" y="72" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">f[2]</text>
  <rect x="300" y="50" width="60" height="34" fill="#f6f6f6" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="330" y="72" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">f[3]</text>
  <rect x="360" y="50" width="170" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="445" y="72" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">转移说明</text>

  <!-- 行1: 初始  y=84 -->
  <rect x="30" y="84" width="90" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="75" y="107" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">初始</text>
  <rect x="120" y="84" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="150" y="108" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="180" y="84" width="60" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="108" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <rect x="240" y="84" width="60" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="270" y="108" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <rect x="300" y="84" width="60" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="330" y="108" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <rect x="360" y="84" width="170" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="445" y="107" text-anchor="middle" font-size="10.5" fill="#555">f[0]=1 种子</text>

  <!-- 行2: i=1 '2'  y=120 -->
  <rect x="30" y="120" width="90" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="75" y="143" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i=1  '2'</text>
  <rect x="120" y="120" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="150" y="144" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="180" y="120" width="60" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="210" y="144" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="240" y="120" width="60" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="270" y="144" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <rect x="300" y="120" width="60" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="330" y="144" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <rect x="360" y="120" width="170" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="445" y="143" text-anchor="middle" font-size="10.5" fill="#333">取1位 '2'✓ → +f[0]</text>

  <!-- 行3: i=2 '2'  y=156 -->
  <rect x="30" y="156" width="90" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="75" y="179" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i=2  '2'</text>
  <rect x="120" y="156" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="150" y="180" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="180" y="156" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="210" y="180" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="240" y="156" width="60" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="270" y="180" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="300" y="156" width="60" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="330" y="180" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <rect x="360" y="156" width="170" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="445" y="173" text-anchor="middle" font-size="10" fill="#333">取1位 '2'✓ → +f[1]=1</text>
  <text x="445" y="186" text-anchor="middle" font-size="10" fill="#333">取2位 '22'✓ → +f[0]=1</text>

  <!-- 行4: i=3 '6' 答案行  y=192 -->
  <rect x="30" y="192" width="90" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="75" y="215" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">i=3  '6' ★</text>
  <rect x="120" y="192" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="150" y="216" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="180" y="192" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="210" y="216" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="240" y="192" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="270" y="216" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="300" y="192" width="60" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="330" y="217" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">3</text>
  <rect x="360" y="192" width="170" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="445" y="209" text-anchor="middle" font-size="10" fill="#333">取1位 '6'✓ → +f[2]=2</text>
  <text x="445" y="222" text-anchor="middle" font-size="10" fill="#333">取2位 '26'✓ → +f[1]=1</text>

  <!-- 图例 -->
  <rect x="30" y="244" width="20" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="56" y="255" font-size="10.5" fill="#555">已确定值</text>
  <rect x="120" y="244" width="20" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="146" y="255" font-size="10.5" fill="#555">本轮更新</text>
  <rect x="210" y="244" width="20" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="236" y="255" font-size="10.5" fill="#555">答案 f[n]</text>

  <!-- 三种解码 -->
  <rect x="30" y="278" width="500" height="86" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="296" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">对应 3 种解码方案</text>
  <text x="280" y="316" text-anchor="middle" font-size="11.5" fill="#333">2 2 6  →  B B F</text>
  <text x="280" y="334" text-anchor="middle" font-size="11.5" fill="#333">2 26   →  B Z</text>
  <text x="280" y="352" text-anchor="middle" font-size="11.5" fill="#333">22 6   →  V F</text>
</svg>
