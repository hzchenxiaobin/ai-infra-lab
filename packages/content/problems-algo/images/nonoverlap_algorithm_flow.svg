<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">按右端点排序 + 单遍扫描流程</text>

  <!-- Init -->
  <rect x="80" y="38" width="360" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="60" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">初始化</text>
  <text x="260" y="78" text-anchor="middle" font-size="11" fill="#555">按右端点升序排序；end = intervals[0][1]</text>
  <text x="260" y="93" text-anchor="middle" font-size="11" fill="#555">remove = 0,  i = 1</text>

  <path d="M 260 100 L 260 116" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Loop diamond: i < n ? -->
  <polygon points="260,120 370,160 260,200 150,160" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="156" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i &lt; n ?</text>
  <text x="260" y="173" text-anchor="middle" font-size="10.5" fill="#777">还有区间？</text>

  <!-- No -> return -->
  <path d="M 370 160 L 440 160 L 440 214" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="392" y="152" font-size="11" fill="#b85450" font-weight="bold">No</text>
  <rect x="370" y="218" width="140" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="440" y="237" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">扫描结束</text>
  <text x="440" y="254" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">return remove</text>

  <!-- Yes down -->
  <path d="M 260 200 L 260 218" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="276" y="214" font-size="11" fill="#82b366" font-weight="bold">Yes</text>

  <!-- Decision diamond: start >= end ? -->
  <polygon points="260,222 370,260 260,298 150,260" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="256" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">intervals[i][0] ≥ end ?</text>
  <text x="260" y="273" text-anchor="middle" font-size="10.5" fill="#777">与上一个保留区间重叠？</text>

  <!-- Yes (不重叠) -> 保留 -->
  <path d="M 150 260 L 90 260 L 90 320" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="108" y="252" font-size="11" fill="#4a7a3a" font-weight="bold">Yes</text>
  <rect x="20" y="324" width="140" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="90" y="346" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">保留该区间</text>
  <text x="90" y="365" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">end = intervals[i][1]</text>

  <!-- No (重叠) -> 移除 -->
  <path d="M 370 260 L 430 260 L 430 320" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="392" y="252" font-size="11" fill="#b85450" font-weight="bold">No</text>
  <rect x="360" y="324" width="140" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="430" y="346" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">移除该区间</text>
  <text x="430" y="365" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">remove += 1</text>

  <!-- loop-back: both branches merge, go up far left to loop diamond -->
  <path d="M 90 382 L 90 400 L 430 400" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <path d="M 430 382 L 430 400" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <path d="M 90 400 L 8 400 L 8 160 L 150 160" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <text x="20" y="280" font-size="10.5" fill="#888" font-style="italic" transform="rotate(-90 20 280)">i += 1，回到循环顶部</text>
</svg>
