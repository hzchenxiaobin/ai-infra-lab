<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">闭区间相交的判定：端点相接也算相交</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">[a,b] 与 [c,d] 相交 ⟺ a ≤ d 且 c ≤ b ⟺ max(a,c) ≤ min(b,d)</text>

  <!-- 组 1：重叠相交 -->
  <rect x="106" y="60" width="216" height="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="7" filter="url(#rough2)"/>
  <text x="214" y="71" text-anchor="middle" font-size="10" fill="#333">[1,5]</text>
  <rect x="214" y="78" width="162" height="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="7" filter="url(#rough2)"/>
  <text x="295" y="89" text-anchor="middle" font-size="10" fill="#333">[3,6]</text>
  <line x1="52" y1="104" x2="386" y2="104" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="52" y1="101" x2="52" y2="107" stroke="#999" filter="url(#rough2)"/>
  <line x1="106" y1="101" x2="106" y2="107" stroke="#999" filter="url(#rough2)"/>
  <line x1="160" y1="101" x2="160" y2="107" stroke="#999" filter="url(#rough2)"/>
  <line x1="214" y1="101" x2="214" y2="107" stroke="#999" filter="url(#rough2)"/>
  <line x1="268" y1="101" x2="268" y2="107" stroke="#999" filter="url(#rough2)"/>
  <line x1="322" y1="101" x2="322" y2="107" stroke="#999" filter="url(#rough2)"/>
  <line x1="376" y1="101" x2="376" y2="107" stroke="#999" filter="url(#rough2)"/>
  <text x="52" y="118" text-anchor="middle" font-size="9.5" fill="#999">0</text>
  <text x="106" y="118" text-anchor="middle" font-size="9.5" fill="#999">1</text>
  <text x="160" y="118" text-anchor="middle" font-size="9.5" fill="#999">2</text>
  <text x="214" y="118" text-anchor="middle" font-size="9.5" fill="#999">3</text>
  <text x="268" y="118" text-anchor="middle" font-size="9.5" fill="#999">4</text>
  <text x="322" y="118" text-anchor="middle" font-size="9.5" fill="#999">5</text>
  <text x="376" y="118" text-anchor="middle" font-size="9.5" fill="#999">6</text>
  <text x="400" y="78" font-size="12" fill="#4a7a3a" font-weight="bold">重叠 → 相交 ✓</text>
  <text x="400" y="96" font-size="10.5" fill="#777">交集 [3,5] 非空</text>

  <!-- 组 2：端点相接 -->
  <rect x="106" y="144" width="54" height="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="7" filter="url(#rough2)"/>
  <text x="133" y="155" text-anchor="middle" font-size="10" fill="#333">[1,2]</text>
  <rect x="160" y="162" width="54" height="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="7" filter="url(#rough2)"/>
  <text x="187" y="173" text-anchor="middle" font-size="10" fill="#333">[2,3]</text>
  <line x1="52" y1="188" x2="386" y2="188" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="52" y1="185" x2="52" y2="191" stroke="#999" filter="url(#rough2)"/>
  <line x1="106" y1="185" x2="106" y2="191" stroke="#999" filter="url(#rough2)"/>
  <line x1="160" y1="185" x2="160" y2="191" stroke="#999" filter="url(#rough2)"/>
  <line x1="214" y1="185" x2="214" y2="191" stroke="#999" filter="url(#rough2)"/>
  <line x1="268" y1="185" x2="268" y2="191" stroke="#999" filter="url(#rough2)"/>
  <line x1="322" y1="185" x2="322" y2="191" stroke="#999" filter="url(#rough2)"/>
  <line x1="376" y1="185" x2="376" y2="191" stroke="#999" filter="url(#rough2)"/>
  <text x="52" y="202" text-anchor="middle" font-size="9.5" fill="#999">0</text>
  <text x="106" y="202" text-anchor="middle" font-size="9.5" fill="#999">1</text>
  <text x="160" y="202" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">2</text>
  <text x="214" y="202" text-anchor="middle" font-size="9.5" fill="#999">3</text>
  <text x="268" y="202" text-anchor="middle" font-size="9.5" fill="#999">4</text>
  <text x="322" y="202" text-anchor="middle" font-size="9.5" fill="#999">5</text>
  <text x="376" y="202" text-anchor="middle" font-size="9.5" fill="#999">6</text>
  <circle cx="160" cy="199" r="8" fill="none" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="400" y="162" font-size="12" fill="#b07818" font-weight="bold">仅共享端点 → 相交 ✓</text>
  <text x="400" y="180" font-size="10.5" fill="#777">2 ∈ [1,2] 且 2 ∈ [2,3]</text>

  <!-- 组 3：完全分离 -->
  <rect x="106" y="228" width="54" height="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="7" filter="url(#rough2)"/>
  <text x="133" y="239" text-anchor="middle" font-size="10" fill="#333">[1,2]</text>
  <rect x="214" y="246" width="54" height="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="7" filter="url(#rough2)"/>
  <text x="241" y="257" text-anchor="middle" font-size="10" fill="#333">[3,4]</text>
  <text x="187" y="247" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">2 &lt; 3</text>
  <path d="M 164 254 L 210 254" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <line x1="52" y1="272" x2="386" y2="272" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="52" y1="269" x2="52" y2="275" stroke="#999" filter="url(#rough2)"/>
  <line x1="106" y1="269" x2="106" y2="275" stroke="#999" filter="url(#rough2)"/>
  <line x1="160" y1="269" x2="160" y2="275" stroke="#999" filter="url(#rough2)"/>
  <line x1="214" y1="269" x2="214" y2="275" stroke="#999" filter="url(#rough2)"/>
  <line x1="268" y1="269" x2="268" y2="275" stroke="#999" filter="url(#rough2)"/>
  <line x1="322" y1="269" x2="322" y2="275" stroke="#999" filter="url(#rough2)"/>
  <line x1="376" y1="269" x2="376" y2="275" stroke="#999" filter="url(#rough2)"/>
  <text x="52" y="286" text-anchor="middle" font-size="9.5" fill="#999">0</text>
  <text x="106" y="286" text-anchor="middle" font-size="9.5" fill="#999">1</text>
  <text x="160" y="286" text-anchor="middle" font-size="9.5" fill="#999">2</text>
  <text x="214" y="286" text-anchor="middle" font-size="9.5" fill="#999">3</text>
  <text x="268" y="286" text-anchor="middle" font-size="9.5" fill="#999">4</text>
  <text x="322" y="286" text-anchor="middle" font-size="9.5" fill="#999">5</text>
  <text x="376" y="286" text-anchor="middle" font-size="9.5" fill="#999">6</text>
  <text x="400" y="246" font-size="12" fill="#b85450" font-weight="bold">完全分离 → 不相交 ✗</text>
  <text x="400" y="264" font-size="10.5" fill="#777">end 2 &lt; start 3（严格小于）</text>

  <!-- 底部结论 -->
  <rect x="36" y="312" width="488" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="56" y="336" font-size="11.5" fill="#333" font-weight="bold">反面刻画：不相交 ⟺ 一方 end 严格小于另一方 start</text>
  <text x="56" y="356" font-size="11.5" fill="#333">端点相接（end = start）属于相交，所以反面计数必须用「&lt;」而不是「≤」</text>
  <text x="56" y="376" font-size="11.5" fill="#4a7a3a" font-weight="bold">→ 统计「完全在左侧」只需一次端点比较，比正面同时看两端更省事</text>
</svg>
