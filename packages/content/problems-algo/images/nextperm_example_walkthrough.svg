<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：[1,2,7,4,3,1] → [1,3,1,2,4,7]</text>

  <!-- ============ Row 1: Step ① find i ============ -->
  <text x="22" y="74" font-size="12" fill="#446688" font-weight="bold">① 找 i</text>
  <!-- cells: 1 2 7 4 3 1 -->
  <rect x="90" y="56" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="79" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="130" y="56" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="150" y="79" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="170" y="56" width="40" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="190" y="79" text-anchor="middle" font-size="13" fill="#333">7</text>
  <rect x="210" y="56" width="40" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="230" y="79" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="250" y="56" width="40" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="270" y="79" text-anchor="middle" font-size="13" fill="#333">3</text>
  <rect x="290" y="56" width="40" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="310" y="79" text-anchor="middle" font-size="13" fill="#333">1</text>
  <!-- index i label -->
  <text x="150" y="104" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">i=1</text>
  <text x="110" y="104" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="190" y="104" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="230" y="104" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="270" y="104" text-anchor="middle" font-size="9" fill="#aaa">4</text>
  <text x="310" y="104" text-anchor="middle" font-size="9" fill="#aaa">5</text>
  <text x="360" y="79" font-size="11" fill="#555">2 &lt; 7 ✓ 升序对，右侧降序</text>

  <path d="M 280 116 L 280 130" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- ============ Row 2: Step ② find j ============ -->
  <text x="22" y="156" font-size="12" fill="#4a7a3a" font-weight="bold">② 找 j</text>
  <rect x="90" y="138" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="161" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="130" y="138" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="161" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="170" y="138" width="40" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="190" y="161" text-anchor="middle" font-size="13" fill="#333">7</text>
  <rect x="210" y="138" width="40" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="230" y="161" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="250" y="138" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="270" y="161" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="290" y="138" width="40" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="310" y="161" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="270" y="186" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">j=4</text>
  <text x="360" y="161" font-size="11" fill="#555">从右：1≯2、3&gt;2 ✓</text>

  <path d="M 280 198 L 280 212" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- ============ Row 3: Step ③ swap ============ -->
  <text x="14" y="238" font-size="12" fill="#d6a040" font-weight="bold">③ 交换</text>
  <rect x="90" y="220" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="243" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="130" y="220" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="150" y="243" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="170" y="220" width="40" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="190" y="243" text-anchor="middle" font-size="13" fill="#333">7</text>
  <rect x="210" y="220" width="40" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="230" y="243" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="250" y="220" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="270" y="243" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="290" y="220" width="40" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="310" y="243" text-anchor="middle" font-size="13" fill="#333">1</text>
  <!-- swap curved arrow between cell 1 and cell 4 -->
  <path d="M 150 256 C 150 286 270 286 270 256" stroke="#d6a040" stroke-width="1.8" fill="none" stroke-dasharray="4,3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="210" y="298" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">swap(nums[1], nums[4])</text>
  <text x="360" y="243" font-size="11" fill="#555">→ [1,3,7,4,2,1]</text>

  <path d="M 280 308 L 280 322" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- ============ Row 4: Step ④ reverse right ============ -->
  <text x="10" y="350" font-size="12" fill="#446688" font-weight="bold">④ 反转右侧</text>
  <rect x="90" y="332" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="355" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="130" y="332" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="355" text-anchor="middle" font-size="13" fill="#333">3</text>
  <rect x="170" y="332" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="190" y="355" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="210" y="332" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="230" y="355" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="250" y="332" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="270" y="355" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="290" y="332" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="310" y="355" text-anchor="middle" font-size="13" fill="#333">7</text>
  <!-- reverse bracket over cells 2..5 -->
  <path d="M 172 328 L 172 322 L 328 322 L 328 328" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="250" y="316" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">reverse [7,4,2,1] → [1,2,4,7]</text>
  <text x="360" y="355" font-size="11" fill="#4a7a3a" font-weight="bold">= [1,3,1,2,4,7] ✓</text>

  <!-- footer result box -->
  <rect x="30" y="390" width="500" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="408" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">前缀 [1,3] 已最小、右侧取最小 → 刚好比原排列大一点</text>
  <text x="280" y="424" text-anchor="middle" font-size="10.5" fill="#888">[1,3,1,2,4,7] &gt; [1,2,7,4,3,1]，且无更小的"更大"方案</text>
</svg>
