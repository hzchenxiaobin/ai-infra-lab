<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">Lomuto 划分：pivot 归位到下标 i</text>

  <!-- invariant state: scanning j -->
  <text x="30" y="76" font-size="12" fill="#888">扫描中（j 从 lo 走到 hi−1）：</text>

  <!-- region labels -->
  <text x="60" y="118" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">≤ pivot</text>
  <text x="180" y="118" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">&gt; pivot</text>
  <text x="345" y="118" text-anchor="middle" font-size="10.5" fill="#888">未扫描</text>
  <text x="465" y="118" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">pivot</text>

  <!-- cells: [lo,i) green, [i,j) red, [j,hi) grey, hi orange -->
  <rect x="30" y="130" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="152" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="90" y="130" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="152" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="150" y="130" width="60" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="152" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="210" y="130" width="60" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="152" text-anchor="middle" font-size="12" fill="#333">6</text>
  <rect x="270" y="130" width="60" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="152" text-anchor="middle" font-size="12" fill="#aaa">?</text>
  <rect x="330" y="130" width="60" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="152" text-anchor="middle" font-size="12" fill="#aaa">?</text>
  <rect x="390" y="130" width="60" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="420" y="152" text-anchor="middle" font-size="12" fill="#aaa">?</text>
  <rect x="450" y="130" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="480" y="152" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>

  <!-- pointer labels -->
  <text x="90" y="186" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">i</text>
  <path d="M 90 190 L 90 168" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="270" y="186" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">j</text>
  <path d="M 270 190 L 270 168" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="480" y="186" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">hi</text>
  <path d="M 480 190 L 480 168" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- rule box -->
  <rect x="30" y="206" width="480" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="226" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">规则：若 nums[j] ≤ pivot，则 swap(nums[i], nums[j]) 并 i++</text>
  <text x="270" y="242" text-anchor="middle" font-size="10.5" fill="#555">循环结束后 swap(nums[i], nums[hi])，pivot 归位于 i</text>

  <!-- final state -->
  <text x="30" y="284" font-size="12" fill="#888">划分结束（pivot=4 归位到下标 i=3）：</text>
  <rect x="30" y="296" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="318" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="90" y="296" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="318" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="150" y="296" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="318" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="210" y="296" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="318" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="270" y="296" width="60" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="318" text-anchor="middle" font-size="12" fill="#333">6</text>
  <rect x="330" y="296" width="60" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="318" text-anchor="middle" font-size="12" fill="#333">5</text>

  <text x="60" y="348" text-anchor="middle" font-size="9" fill="#4a7a3a">≤ 4</text>
  <text x="120" y="348" text-anchor="middle" font-size="9" fill="#4a7a3a">≤ 4</text>
  <text x="180" y="348" text-anchor="middle" font-size="9" fill="#4a7a3a">≤ 4</text>
  <text x="240" y="348" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">p=3 ✓</text>
  <text x="300" y="348" text-anchor="middle" font-size="9" fill="#b85450">&gt; 4</text>
  <text x="360" y="348" text-anchor="middle" font-size="9" fill="#b85450">&gt; 4</text>

  <rect x="30" y="362" width="480" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="382" text-anchor="middle" font-size="11.5" fill="#444">随机选 pivot 与 hi 交换 → 划分 → 返回 i 作为 p</text>
</svg>
