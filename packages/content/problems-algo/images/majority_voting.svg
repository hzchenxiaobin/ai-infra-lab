<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">投票算法：candidate 与 count 的状态变化</text>

  <!-- Step type 1: count==0, pick new candidate -->
  <rect x="20" y="46" width="160" height="150" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="100" y="70" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">count == 0</text>
  <text x="100" y="92" text-anchor="middle" font-size="11" fill="#555">前段已抵消殆尽</text>
  <text x="100" y="110" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">换新候选</text>
  <rect x="40" y="124" width="120" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="100" y="143" text-anchor="middle" font-size="11" fill="#333">candidate = x</text>
  <text x="100" y="168" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">count = 1</text>
  <text x="100" y="186" text-anchor="middle" font-size="10" fill="#888">（重立山头）</text>

  <!-- Step type 2: x == candidate -->
  <rect x="200" y="46" width="160" height="150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="70" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">x == candidate</text>
  <text x="280" y="92" text-anchor="middle" font-size="11" fill="#555">遇到盟友</text>
  <text x="280" y="110" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">票数 +1</text>
  <rect x="220" y="124" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="143" text-anchor="middle" font-size="11" fill="#333">candidate 不变</text>
  <text x="280" y="168" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">count += 1</text>
  <text x="280" y="186" text-anchor="middle" font-size="10" fill="#888">（盟友加入）</text>

  <!-- Step type 3: x != candidate -->
  <rect x="380" y="46" width="160" height="150" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="460" y="70" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">x != candidate</text>
  <text x="460" y="92" text-anchor="middle" font-size="11" fill="#555">遇到对手</text>
  <text x="460" y="110" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">同归于尽</text>
  <rect x="400" y="124" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="460" y="143" text-anchor="middle" font-size="11" fill="#333">candidate 不变</text>
  <text x="460" y="168" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">count -= 1</text>
  <text x="460" y="186" text-anchor="middle" font-size="10" fill="#888">（一盟一敌抵消）</text>

  <!-- count trend mini-chart -->
  <text x="20" y="226" font-size="11.5" fill="#888" font-weight="bold">count 走势示意：</text>
  <line x1="20" y1="320" x2="540" y2="320" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="260" x2="540" y2="260" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="8" y="264" font-size="9" fill="#aaa">2</text>
  <text x="8" y="324" font-size="9" fill="#aaa">0</text>

  <!-- count polyline: up on ally, down on foe, hit 0 twice -->
  <path d="M 40 320 L 80 290 L 120 260 L 160 290 L 200 320 L 240 290 L 280 320 L 320 290 L 360 260 L 400 290 L 440 260 L 490 230"
        stroke="#d6a040" stroke-width="2.2" fill="none" stroke-linejoin="round" filter="url(#rough2)"/>

  <!-- markers at zero crossings -->
  <circle cx="200" cy="320" r="3.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="280" cy="320" r="3.5" fill="#b85450" filter="url(#rough2)"/>
  <text x="200" y="338" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">归零换帅</text>
  <text x="280" y="338" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">归零换帅</text>

  <!-- labels on segments -->
  <text x="100" y="284" text-anchor="middle" font-size="9" fill="#4a7a3a">+1</text>
  <text x="140" y="278" text-anchor="middle" font-size="9" fill="#4a7a3a">+1</text>
  <text x="180" y="304" text-anchor="middle" font-size="9" fill="#b85450">−1</text>
  <text x="260" y="304" text-anchor="middle" font-size="9" fill="#4a7a3a">+1</text>
  <text x="340" y="304" text-anchor="middle" font-size="9" fill="#4a7a3a">+1</text>

  <text x="280" y="356" text-anchor="middle" font-size="10.5" fill="#888">count 归零表示前段抵消殆尽 → 后缀仍是同构子问题</text>
  <text x="280" y="372" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">最终 candidate = 多数元素</text>
</svg>
