<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">哈希表：查 prefix − k 的历史频次</text>

  <!-- Left: array + current prefix -->
  <text x="40" y="60" font-size="12" fill="#888">nums =</text>
  <rect x="90" y="46" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="65" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="138" y="46" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="65" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="186" y="46" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="208" y="65" text-anchor="middle" font-size="12" fill="#333">3</text>

  <text x="40" y="96" font-size="11" fill="#777">↑ 当前在 j=1，加入 2 后</text>
  <rect x="40" y="106" width="190" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="135" y="128" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">当前前缀和 S = 3</text>

  <!-- query arrow to hashmap -->
  <path d="M 230 123 L 300 123" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="265" y="116" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">查 S−k</text>

  <!-- Right: hashmap count -->
  <rect x="300" y="60" width="190" height="150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="395" y="82" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">count（历史前缀和频次）</text>
  <line x1="312" y1="92" x2="478" y2="92" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>

  <text x="324" y="112" font-size="12" fill="#333">前缀和</text>
  <text x="430" y="112" font-size="12" fill="#333">次数</text>

  <rect x="316" y="120" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="346" y="137" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="402" y="120" width="44" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="424" y="137" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <rect x="316" y="150" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="346" y="167" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="402" y="150" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="424" y="167" text-anchor="middle" font-size="12" fill="#333">1</text>

  <text x="395" y="192" text-anchor="middle" font-size="10" fill="#777" font-style="italic">S−k = 3−3 = 0 → 命中 1 次</text>

  <!-- result row -->
  <path d="M 395 210 L 395 232" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="4,2" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="270" y="236" width="250" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="395" y="261" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">ans += count[S−k]  →  ans = 1</text>

  <!-- then write -->
  <rect x="40" y="236" width="210" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="145" y="261" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">然后写：count[S]++ （count[3]=1）</text>

  <!-- order note -->
  <rect x="40" y="300" width="440" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="322" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">⚠️ 顺序：先查 count[S−k]，再写 count[S]</text>
  <text x="260" y="342" text-anchor="middle" font-size="11" fill="#777">起点必须在终点之前；用「旧的」count 才正确</text>
</svg>
