<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    <marker id="arL" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="920" height="440" fill="#fafafa"/>
  <text x="460" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：nums=[1,1,1,2,2,3]，k=2（最小堆法）</text>
  <path d="M 280 44 Q 460 52 640 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="60" y="78" font-size="13" font-weight="bold" fill="#2b2b2b">频率统计：{1:3, 2:2, 3:1}，按最小堆（容量 k=2）逐个处理：</text>

  <!-- 表头 -->
  <g filter="url(#sk)">
    <rect x="40" y="92" width="70" height="40" rx="4" fill="#fffdf3" stroke="#9e9e9e"/>
    <rect x="110" y="92" width="150" height="40" rx="4" fill="#fffdf3" stroke="#9e9e9e"/>
    <rect x="260" y="92" width="160" height="40" rx="4" fill="#fffdf3" stroke="#9e9e9e"/>
    <rect x="420" y="92" width="240" height="40" rx="4" fill="#fffdf3" stroke="#9e9e9e"/>
    <rect x="660" y="92" width="220" height="40" rx="4" fill="#fffdf3" stroke="#9e9e9e"/>
  </g>
  <text x="75" y="116" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">步骤</text>
  <text x="185" y="116" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">(元素, 频率)</text>
  <text x="340" y="116" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">操作</text>
  <text x="540" y="116" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">堆状态（堆顶在前）</text>
  <text x="770" y="116" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">说明</text>

  <!-- 行1：初始 -->
  <g filter="url(#sk)">
    <g stroke="#bbb" fill="#fff">
      <rect x="40" y="132" width="70" height="40"/>
      <rect x="110" y="132" width="150" height="40"/>
      <rect x="260" y="132" width="160" height="40"/>
      <rect x="420" y="132" width="240" height="40" fill="#f7f7f7"/>
      <rect x="660" y="132" width="220" height="40"/>
    </g>
  </g>
  <text x="75" y="157" text-anchor="middle" font-size="12" fill="#333">初始</text>
  <text x="185" y="157" text-anchor="middle" font-size="12" fill="#999">—</text>
  <text x="340" y="157" text-anchor="middle" font-size="12" fill="#333">建空堆</text>
  <text x="540" y="157" text-anchor="middle" font-size="12" fill="#666">[ ]</text>
  <text x="770" y="157" text-anchor="middle" font-size="11" fill="#666">size=0</text>

  <!-- 行2：处理 1 -->
  <g filter="url(#sk)">
    <g stroke="#bbb" fill="#fff">
      <rect x="40" y="172" width="70" height="40"/>
      <rect x="110" y="172" width="150" height="40"/>
      <rect x="260" y="172" width="160" height="40"/>
      <rect x="420" y="172" width="240" height="40" fill="#eaf6ee"/>
      <rect x="660" y="172" width="220" height="40"/>
    </g>
  </g>
  <text x="75" y="197" text-anchor="middle" font-size="12" fill="#333">①</text>
  <text x="185" y="197" text-anchor="middle" font-size="12" fill="#333">(1, 3)</text>
  <text x="340" y="197" text-anchor="middle" font-size="12" fill="#2e6e2e">push</text>
  <text x="540" y="197" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">[(3, 1)]</text>
  <text x="770" y="197" text-anchor="middle" font-size="11" fill="#2e6e2e">size=1 ≤ 2，保留</text>

  <!-- 行3：处理 2 -->
  <g filter="url(#sk)">
    <g stroke="#bbb" fill="#fff">
      <rect x="40" y="212" width="70" height="40"/>
      <rect x="110" y="212" width="150" height="40"/>
      <rect x="260" y="212" width="160" height="40"/>
      <rect x="420" y="212" width="240" height="40" fill="#eaf6ee"/>
      <rect x="660" y="212" width="220" height="40"/>
    </g>
  </g>
  <text x="75" y="237" text-anchor="middle" font-size="12" fill="#333">②</text>
  <text x="185" y="237" text-anchor="middle" font-size="12" fill="#333">(2, 2)</text>
  <text x="340" y="237" text-anchor="middle" font-size="12" fill="#2e6e2e">push</text>
  <text x="540" y="237" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">[(2, 2), (3, 1)]</text>
  <text x="770" y="237" text-anchor="middle" font-size="11" fill="#2e6e2e">size=2，堆顶=(2,2)</text>

  <!-- 行4：处理 3 -->
  <g filter="url(#sk)">
    <g stroke="#bbb" fill="#fff">
      <rect x="40" y="252" width="70" height="40"/>
      <rect x="110" y="252" width="150" height="40"/>
      <rect x="260" y="252" width="160" height="40" fill="#fce4ec"/>
      <rect x="420" y="252" width="240" height="40" fill="#fce4ec"/>
      <rect x="660" y="252" width="220" height="40"/>
    </g>
  </g>
  <text x="75" y="277" text-anchor="middle" font-size="12" fill="#333">③</text>
  <text x="185" y="277" text-anchor="middle" font-size="12" fill="#333">(3, 1)</text>
  <text x="340" y="277" text-anchor="middle" font-size="12" fill="#b85450">push → pop</text>
  <text x="540" y="277" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">[(2, 2), (3, 1)]</text>
  <text x="770" y="277" text-anchor="middle" font-size="11" fill="#b85450">size=3&gt;2，弹出 (1,3)</text>

  <!-- 结果 -->
  <g filter="url(#sk)">
    <rect x="40" y="316" width="840" height="46" rx="8" fill="#fffdf3" stroke="#d6a040" stroke-dasharray="5 3"/>
  </g>
  <text x="60" y="344" font-size="13" font-weight="bold" fill="#7a5415">遍历结束，堆中元素 = [1, 2]（顺序无关），即频率前 2 高的元素。</text>

  <!-- 复杂度 -->
  <g filter="url(#sk)">
    <rect x="40" y="378" width="840" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a"/>
  </g>
  <text x="60" y="405" font-size="12" font-weight="bold" fill="#2e6e2e">时间 O(n + m·log k) ≈ O(n log k)，优于 O(n log n)；空间 O(n + k)。</text>
</svg>
