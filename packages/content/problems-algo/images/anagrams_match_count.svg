<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">窗口滑动：频次增量更新 + match 计数</text>

  <!-- ========= Before slide ========= -->
  <text x="20" y="56" font-size="12.5" fill="#446688" font-weight="bold">滑动前：窗口 "cba"，win == need，match = 3 ✓</text>

  <!-- window cells: c b a | e (next in) -->
  <rect x="40" y="68" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="87" text-anchor="middle" font-size="12" fill="#333">c</text>
  <rect x="84" y="68" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="104" y="87" text-anchor="middle" font-size="12" fill="#333">b</text>
  <rect x="128" y="68" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="87" text-anchor="middle" font-size="12" fill="#333">a</text>
  <rect x="180" y="68" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="87" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">e</text>
  <text x="200" y="112" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">即将进入</text>

  <!-- bracket window -->
  <path d="M 42 60 L 42 54 L 166 54 L 166 60" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="104" y="48" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">当前窗口</text>

  <!-- need / win table -->
  <text x="300" y="80" font-size="11" fill="#888" font-weight="bold">字母</text>
  <text x="360" y="80" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">need</text>
  <text x="420" y="80" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">win</text>
  <text x="480" y="80" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">相符?</text>

  <text x="300" y="100" font-size="11" fill="#333">a</text>
  <text x="360" y="100" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="420" y="100" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="480" y="100" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <text x="300" y="118" font-size="11" fill="#333">b</text>
  <text x="360" y="118" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="420" y="118" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="480" y="118" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <text x="300" y="136" font-size="11" fill="#333">c</text>
  <text x="360" y="136" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="420" y="136" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="480" y="136" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <text x="300" y="154" font-size="11" fill="#888">e</text>
  <text x="360" y="154" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="420" y="154" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="480" y="154" text-anchor="middle" font-size="11" fill="#aaa">—</text>

  <text x="300" y="178" font-size="11" fill="#d6a040" font-weight="bold">match = 3 / target 3</text>

  <!-- arrow down -->
  <path d="M 280 196 L 280 214" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD2)" filter="url(#rough2)"/>
  <defs>
    <marker id="arrD2" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>
  <text x="296" y="210" font-size="10.5" fill="#d6a040" font-weight="bold">滑动一格</text>

  <!-- ========= After slide ========= -->
  <text x="20" y="244" font-size="12.5" fill="#b85450" font-weight="bold">滑动后：窗口 "bae"，+e / −c，match = 2 ✗</text>

  <rect x="40" y="256" width="40" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="60" y="275" text-anchor="middle" font-size="11" fill="#ccc">c</text>
  <text x="60" y="300" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">已离开</text>
  <rect x="84" y="256" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="104" y="275" text-anchor="middle" font-size="12" fill="#333">b</text>
  <rect x="128" y="256" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="275" text-anchor="middle" font-size="12" fill="#333">a</text>
  <rect x="180" y="256" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="275" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">e</text>

  <path d="M 86 248 L 86 242 L 218 242 L 218 248" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="152" y="236" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">新窗口 "bae"</text>

  <!-- updated table -->
  <text x="300" y="268" font-size="11" fill="#888" font-weight="bold">字母</text>
  <text x="360" y="268" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">need</text>
  <text x="420" y="268" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">win</text>
  <text x="480" y="268" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">相符?</text>

  <text x="300" y="288" font-size="11" fill="#333">a</text>
  <text x="360" y="288" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="420" y="288" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="480" y="288" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <text x="300" y="306" font-size="11" fill="#333">b</text>
  <text x="360" y="306" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="420" y="306" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="480" y="306" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <text x="300" y="324" font-size="11" fill="#333">c</text>
  <text x="360" y="324" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="420" y="324" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <text x="480" y="324" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>

  <text x="300" y="342" font-size="11" fill="#888">e</text>
  <text x="360" y="342" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="420" y="342" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="480" y="342" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>

  <text x="300" y="366" font-size="11" fill="#b85450" font-weight="bold">match = 2 / target 3</text>

  <!-- note -->
  <rect x="40" y="380" width="500" height="14" fill="#fff8e1" stroke="none" rx="4" filter="url(#rough2)"/>
  <text x="290" y="392" text-anchor="middle" font-size="10.5" fill="#444">+e 使 e 从 0→1（不符）；−c 使 c 从 1→0（不符）；match 由 3 降到 2</text>
</svg>
