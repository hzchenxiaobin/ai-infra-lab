<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">旋转回文：枚举左旋 r + 逐对最小递增</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">左旋 r 次得 s', 对每对 s'[i],s'[n-1-i] 取 |a-b| 次递增</text>

  <text x="40" y="74" font-size="12" fill="#333" font-weight="bold">s = "abc"，枚举所有左旋：</text>

  <rect x="30" y="88" width="500" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="60" y="107" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">左旋 r</text>
  <text x="150" y="107" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">旋转后</text>
  <text x="280" y="107" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">配对</text>
  <text x="430" y="107" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">总代价 = r + 递增</text>

  <rect x="30" y="116" width="500" height="28" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="135" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="150" y="135" text-anchor="middle" font-size="11" fill="#333">"abc"</text>
  <text x="280" y="135" text-anchor="middle" font-size="11" fill="#333">a-c: |0-2|=2</text>
  <text x="430" y="135" text-anchor="middle" font-size="11" fill="#333">0+2=2</text>

  <rect x="30" y="144" width="500" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="60" y="163" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="150" y="163" text-anchor="middle" font-size="11" fill="#333">"bca"</text>
  <text x="280" y="163" text-anchor="middle" font-size="11" fill="#333">b-a: |1-0|=1</text>
  <text x="430" y="163" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1+1=2</text>

  <rect x="30" y="172" width="500" height="28" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="191" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="150" y="191" text-anchor="middle" font-size="11" fill="#333">"cab"</text>
  <text x="280" y="191" text-anchor="middle" font-size="11" fill="#333">c-b: |2-1|=1</text>
  <text x="430" y="191" text-anchor="middle" font-size="11" fill="#333">2+1=3</text>

  <g stroke="#dddddd" stroke-width="1">
    <line x1="100" y1="88" x2="100" y2="200" filter="url(#rough2)"/>
    <line x1="200" y1="88" x2="200" y2="200" filter="url(#rough2)"/>
    <line x1="380" y1="88" x2="380" y2="200" filter="url(#rough2)"/>
  </g>

  <rect x="30" y="216" width="500" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="238" font-size="11" fill="#333" font-weight="bold">配对代价推导：a, b 两字符只能递增（循环）到相同</text>
  <text x="50" y="256" font-size="10.5" fill="#555">递增 a 到 b 需 d 次，递增 b 到 a 需 26-d 次（绕圈）</text>
  <text x="50" y="272" font-size="10.5" fill="#555">故每对最小递增 = min(d, 26-d)，d = |pos(a) - pos(b)|</text>

  <rect x="30" y="292" width="500" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="314" font-size="11" fill="#4a7a3a" font-weight="bold">答案 = min over r of (r + sum min(d, 26-d))</text>
  <text x="50" y="332" font-size="10.5" fill="#555">O(n^2)：n 种左旋 × 每种 O(n) 配对，n &lt;= 2000 可过</text>
</svg>
