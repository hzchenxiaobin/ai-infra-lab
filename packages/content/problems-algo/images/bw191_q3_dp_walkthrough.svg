  <text x="36" y="92" font-size="10.5" fill="#888" filter="url(#rough2)">f[s]=</text>

  <!-- 还原箭头 -->
  <path d="M 614 108 Q 490 150 356 108" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="487" y="152" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">用一枚 3 号硬币：−T(3)=−6，费用+4</text>
  <path d="M 344 108 Q 218 180 92 108" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="218" y="172" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">再用一枚 3 号硬币：−6，费用+4 → 回到 0</text>

  <!-- 结论 -->
  <rect x="40" y="188" width="565" height="50" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="322" y="209" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6420" filter="url(#rough2)">f[12] = (3+1) + (3+1) = 8 → 总天数 = 8 − 1 = 7</text>
  <text x="322" y="228" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">顺带一读：f[10] = 5，10 = T(4) 是三角形数 → 单段 [4] 共 4 天</text>

  <!-- ============ 最终时间线 ============ -->
  <text x="52" y="272" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">还原出的最优方案 [3,3]：</text>
  <g filter="url(#rough2)">
    <rect x="52" y="282" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="100" y="282" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
