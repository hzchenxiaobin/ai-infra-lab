  <text x="266" y="303" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">+1</text>
  <text x="314" y="303" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">+2</text>
  <text x="362" y="303" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">+3</text>
  <rect x="404" y="282" width="200" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="504" y="303" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">6+6=12分，共 7 天 ✓</text>

  <text x="320" y="352" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">对照贪心 [4,1,1]：费用 (4+1)+(1+1)+(1+1) = 9 → 9 − 1 = 8 天</text>
  <text x="320" y="372" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">背包选出的 [3,3]：费用 8 → 7 天，整整省下 1 天 ✓</text>
</svg>
