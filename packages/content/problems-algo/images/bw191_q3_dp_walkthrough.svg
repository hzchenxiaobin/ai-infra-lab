  <text x="122" y="303" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">+2</text>
  <text x="170" y="303" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">+3</text>
