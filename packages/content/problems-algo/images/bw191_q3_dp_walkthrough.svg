  <text x="86" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="130" y="92" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">2</text>
  <text x="174" y="92" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">4</text>
