  <text x="306" y="92" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">7</text>
  <text x="350" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">4</text>
