<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：isConnected = [[1,1,0],[1,1,0],[0,0,1]]</text>

  <!-- table header -->
  <rect x="24" y="48" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="64" y="66" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">步骤 (i,j)</text>
  <rect x="104" y="48" width="150" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="179" y="66" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">parent 数组</text>
  <rect x="254" y="48" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="284" y="66" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">count</text>
  <rect x="314" y="48" width="200" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="414" y="66" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">操作说明</text>

  <!-- row 0: init -->
  <rect x="24" y="74" width="80" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="64" y="94" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">init</text>
  <rect x="104" y="74" width="150" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="179" y="94" text-anchor="middle" font-size="12" fill="#333">[0, 1, 2]</text>
  <rect x="254" y="74" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="284" y="94" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="314" y="74" width="200" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="414" y="94" text-anchor="middle" font-size="11" fill="#666">各自为根</text>

  <!-- row 1: (0,1) -->
  <rect x="24" y="104" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="64" y="124" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">(0,1) =1</text>
  <rect x="104" y="104" width="150" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="179" y="124" text-anchor="middle" font-size="12" fill="#333">[0, <tspan fill="#b85450" font-weight="bold">0</tspan>, 2]</text>
  <rect x="254" y="104" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="284" y="124" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="314" y="104" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="414" y="124" text-anchor="middle" font-size="11" fill="#4a7a3a">union：parent[1]=0</text>

  <!-- row 2: (0,2) -->
  <rect x="24" y="134" width="80" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="64" y="154" text-anchor="middle" font-size="11.5" fill="#888">(0,2) =0</text>
  <rect x="104" y="134" width="150" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="179" y="154" text-anchor="middle" font-size="12" fill="#888">[0, 0, 2]</text>
  <rect x="254" y="134" width="60" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="284" y="154" text-anchor="middle" font-size="12" fill="#888">2</text>
  <rect x="314" y="134" width="200" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="414" y="154" text-anchor="middle" font-size="11" fill="#aaa">不相连，跳过</text>

  <!-- row 3: (1,2) -->
  <rect x="24" y="164" width="80" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="64" y="184" text-anchor="middle" font-size="11.5" fill="#888">(1,2) =0</text>
  <rect x="104" y="164" width="150" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="179" y="184" text-anchor="middle" font-size="12" fill="#888">[0, 0, 2]</text>
  <rect x="254" y="164" width="60" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="284" y="184" text-anchor="middle" font-size="12" fill="#888">2</text>
  <rect x="314" y="164" width="200" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="414" y="184" text-anchor="middle" font-size="11" fill="#aaa">不相连，跳过</text>

  <!-- result -->
  <rect x="24" y="206" width="490" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="232" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">最终 count = 2 → 省份数 = 2</text>

  <!-- two provinces viz -->
  <text x="270" y="270" text-anchor="middle" font-size="11.5" fill="#888">省份 1：{0, 1}（根 0）　|　省份 2：{2}（根 2）</text>
  <circle cx="200" cy="312" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="317" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <circle cx="260" cy="312" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="317" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <line x1="216" y1="312" x2="244" y2="312" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="370" cy="312" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="370" y="317" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

  <rect x="40" y="344" width="460" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="270" y="362" text-anchor="middle" font-size="11" fill="#444">n=3 时只需看 i&lt;j 的 3 对，count 从 3 降到 2</text>
</svg>
