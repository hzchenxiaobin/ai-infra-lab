<svg xmlns="http://www.w3.org/2000/svg" width="940" height="600" viewBox="0 0 940 600" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="940" height="600" fill="#fafafa"/>
  <text x="470" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：s = "cbacdcbc" → "acdb"</text>
  <path d="M 320 44 Q 470 52 620 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 初始计数提示 -->
  <g filter="url(#sk)">
    <rect x="60" y="60" width="820" height="30" rx="6" fill="#f7faff" stroke="#446688"/>
  </g>
  <text x="470" y="80" text-anchor="middle" font-size="12" fill="#446688">初始计数 cnt：c=4, b=2, a=1, d=1　│　栈=[]，in_stack 全为 false</text>

  <!-- 表头 -->
  <g filter="url(#sk)">
    <rect x="60" y="100" width="820" height="32" rx="4" fill="#446688"/>
  </g>
  <text x="100" y="121" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">i</text>
  <text x="170" y="121" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">字符 c</text>
  <text x="290" y="121" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">cnt[c] 处理后</text>
  <text x="470" y="121" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">栈（底→顶）</text>
  <text x="720" y="121" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">动作</text>

  <!-- 行 i=0 -->
  <g filter="url(#sk)">
    <rect x="60" y="132" width="820" height="34" fill="#fff" stroke="#bbb"/>
  </g>
  <text x="100" y="154" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="170" y="154" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">c</text>
  <text x="290" y="154" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="470" y="154" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">[c]</text>
  <text x="720" y="154" text-anchor="middle" font-size="11" fill="#666">栈空，c 入栈</text>

  <!-- 行 i=1 -->
  <g filter="url(#sk)">
    <rect x="60" y="166" width="820" height="34" fill="#f7faff" stroke="#bbb"/>
  </g>
  <text x="100" y="188" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="170" y="188" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">b</text>
  <text x="290" y="188" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="470" y="188" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">[b]</text>
  <text x="720" y="188" text-anchor="middle" font-size="11" fill="#b85450">c&gt;b 且 cnt[c]=3&gt;0 ⟹ 弹 c；b 入栈</text>

  <!-- 行 i=2 -->
  <g filter="url(#sk)">
    <rect x="60" y="200" width="820" height="34" fill="#fff" stroke="#bbb"/>
  </g>
  <text x="100" y="222" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="170" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">a</text>
  <text x="290" y="222" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="470" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">[a]</text>
  <text x="720" y="222" text-anchor="middle" font-size="11" fill="#b85450">b&gt;a 且 cnt[b]=1&gt;0 ⟹ 弹 b；a 入栈</text>

  <!-- 行 i=3 -->
  <g filter="url(#sk)">
    <rect x="60" y="234" width="820" height="34" fill="#f7faff" stroke="#bbb"/>
  </g>
  <text x="100" y="256" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="170" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">c</text>
  <text x="290" y="256" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="470" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">[a, c]</text>
  <text x="720" y="256" text-anchor="middle" font-size="11" fill="#666">a&lt;c 不弹；c 入栈</text>

  <!-- 行 i=4 -->
  <g filter="url(#sk)">
    <rect x="60" y="268" width="820" height="34" fill="#fff" stroke="#bbb"/>
  </g>
  <text x="100" y="290" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="170" y="290" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">d</text>
  <text x="290" y="290" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="470" y="290" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">[a, c, d]</text>
  <text x="720" y="290" text-anchor="middle" font-size="11" fill="#666">c&lt;d 不弹；d 入栈</text>

  <!-- 行 i=5 -->
  <g filter="url(#sk)">
    <rect x="60" y="302" width="820" height="34" fill="#f7faff" stroke="#bbb"/>
  </g>
  <text x="100" y="324" text-anchor="middle" font-size="12" fill="#333">5</text>
  <text x="170" y="324" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">c</text>
  <text x="290" y="324" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="470" y="324" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">[a, c, d]</text>
  <text x="720" y="324" text-anchor="middle" font-size="11" fill="#d6a040">c 已在栈中 ⟹ 跳过</text>

  <!-- 行 i=6 关键行 -->
  <g filter="url(#sk)">
    <rect x="60" y="336" width="820" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="100" y="361" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">6</text>
  <text x="170" y="361" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">b</text>
  <text x="290" y="361" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="470" y="361" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">[a, c, d, b]</text>
  <text x="720" y="356" text-anchor="middle" font-size="11" fill="#b85450">d&gt;b 但 cnt[d]=0 ⟹ 不能弹！</text>
  <text x="720" y="370" text-anchor="middle" font-size="11" fill="#666">b 入栈</text>

  <!-- 行 i=7 -->
  <g filter="url(#sk)">
    <rect x="60" y="376" width="820" height="34" fill="#fff" stroke="#bbb"/>
  </g>
  <text x="100" y="398" text-anchor="middle" font-size="12" fill="#333">7</text>
  <text x="170" y="398" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">c</text>
  <text x="290" y="398" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="470" y="398" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">[a, c, d, b]</text>
  <text x="720" y="398" text-anchor="middle" font-size="11" fill="#d6a040">c 已在栈中 ⟹ 跳过</text>

  <!-- 关键说明框 -->
  <g filter="url(#sk)">
    <rect x="60" y="426" width="820" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="80" y="448" font-size="13" font-weight="bold" fill="#7a5415">★ 关键一步 i=6：</text>
  <text x="80" y="468" font-size="12" fill="#7a5415">栈顶 d 比 b 大，按"贪心"本应弹出 d；但 cnt[d]=0 表示 d 后面再也不会出现，弹出就永远丢了 d。</text>
  <text x="80" y="482" font-size="12" fill="#7a5415">所以"后面还有没有"是能否弹出的硬约束——这正是 cnt 维护的意义。</text>

  <!-- 结果 -->
  <text x="80" y="520" font-size="13" font-weight="bold" fill="#555">遍历结束，栈底→栈顶拼接：</text>
  <g filter="url(#sk)">
    <rect x="300" y="504" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="346" y="504" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="392" y="504" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="438" y="504" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="322" y="525" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">a</text>
  <text x="368" y="525" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">c</text>
  <text x="414" y="525" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">d</text>
  <text x="460" y="525" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">b</text>
  <path d="M 490 520 L 528 520" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="534" y="504" width="130" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="599" y="525" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a">"acdb" ✓</text>

  <text x="470" y="572" text-anchor="middle" font-size="12" fill="#888">每个字符至多入栈、出栈各一次，总耗时 O(n)；栈与计数表只占 O(∣Σ∣)=O(1)。</text>
</svg>
