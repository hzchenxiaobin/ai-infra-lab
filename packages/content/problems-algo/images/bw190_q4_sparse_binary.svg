<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="21"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">单候选 O(log n) 评估：稀疏表区间 gcd + 两次二分</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">gcd 幂等 ⟹ 稀疏表可像 ST 表求 max 一样重叠拼接</text>

  <g filter="url(#rough2)">
    <rect x="40" y="60" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
  </g>
  <text x="140" y="82" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold">预处理 pg / sg / G / P / S</text>

  <path d="M 140 94 L 140 116" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <path d="M 140 128 L 100 152 L 140 176 L 180 152 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="140" y="150" text-anchor="middle" font-size="10.5" fill="#8a6a1a" font-weight="bold">S &gt; P ?</text>
  <text x="140" y="164" text-anchor="middle" font-size="10.5" fill="#8a6a1a" font-weight="bold">(健康区间)</text>

  <g filter="url(#rough2)">
    <rect x="250" y="138" width="150" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
  </g>
  <text x="325" y="158" text-anchor="middle" font-size="11.5" fill="#2f5530" font-weight="bold">返回 S − P（O(n) 结束）</text>
  <path d="M 180 152 L 246 152" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="208" y="144" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <path d="M 140 178 L 140 202" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="196" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <g filter="url(#rough2)">
    <rect x="40" y="204" width="200" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
  </g>
  <text x="140" y="224" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">候选 j ∈ [S, P]，逐个评估 →</text>

  <g filter="url(#rough2)">
    <rect x="290" y="204" width="230" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
  </g>
  <text x="405" y="224" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">G′ = gcd(pg[j−1], sg[j+1])</text>

  <path d="M 240 219 L 286 219" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 405 234 L 405 254" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="290" y="256" width="230" height="58" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="8"/>
  </g>
  <text x="405" y="278" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">二分 P′：前缀 gcd 首次 = G′</text>
  <text x="405" y="296" text-anchor="middle" font-size="10" fill="#666">gcd(arr[0..i]) 随 i 单调不增</text>

  <path d="M 405 314 L 405 334" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="40" y="256" width="230" height="58" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
  </g>
  <text x="155" y="278" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">二分 S′：后缀 gcd 最后 = G′</text>
  <text x="155" y="296" text-anchor="middle" font-size="10" fill="#666">gcd(arr[i..m−1]) 随 i 单调不减</text>

  <path d="M 155 314 L 155 358 L 286 358" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 405 336 L 405 358 L 324 358" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="60" y="344" width="220" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
  </g>
  <text x="170" y="365" text-anchor="middle" font-size="11.5" fill="#8a6a1a" font-weight="bold">得分 = max(0, S′ − P′) → 取 max</text>

  <rect x="40" y="396" width="482" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="281" y="416" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">总复杂度 O(n log n)：稀疏表 O(n log n) 构建 + 每候选 O(log n) × O(1) 区间 gcd</text>
</svg>
