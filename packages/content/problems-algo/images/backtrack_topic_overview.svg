<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="16" fill="#444" font-weight="bold">回溯 = 在「决策树」上做 DFS，走到底就「撤销」回分叉点换条路</text>

  <!-- ===== Left: decision tree ===== -->
  <text x="40" y="62" font-size="12" fill="#888">决策树（构造一个排列，候选 1/2/3）:</text>

  <!-- root -->
  <ellipse cx="180" cy="86" rx="34" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="90" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">path=[]</text>

  <!-- L1 -->
  <path d="M 165 100 L 110 134" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 195 100 L 250 134" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="84" y="136" width="52" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="110" y="153" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">[1]</text>
  <rect x="224" y="136" width="52" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="250" y="153" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">[2]</text>

  <!-- L2 from [1] -->
  <path d="M 110 162 L 95 196" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 125 162 L 140 196" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="68" y="198" width="54" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="95" y="214" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[1,2]</text>
  <rect x="118" y="198" width="54" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="145" y="214" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[1,3]</text>

  <!-- leaves -->
  <path d="M 95 222 L 95 246" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="66" y="248" width="58" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="95" y="264" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">[1,2,3]</text>

  <!-- undo arrow from leaf back up -->
  <path d="M 124 260 Q 170 270 175 200 Q 178 160 150 150" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="186" y="232" font-size="10" fill="#b85450" filter="url(#rough2)">撤销 ↑</text>

  <text x="180" y="296" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">叶子 = 一个完整解；走到底就回退</text>

  <!-- ===== Right: the loop ===== -->
  <text x="430" y="62" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">回溯三步循环：</text>

  <rect x="430" y="78" width="180" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="520" y="98" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① 做 选择</text>
  <text x="520" y="114" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">path.add / 标记 used</text>

  <path d="M 520 124 L 520 138" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="430" y="142" width="180" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="520" y="162" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② 递归 下一层</text>
  <text x="520" y="178" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">backtrack(下一状态)</text>

  <path d="M 520 188 L 520 202" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="430" y="206" width="180" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="520" y="226" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ 撤销 选择</text>
  <text x="520" y="242" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">path.pop / 取消 used</text>

  <!-- undo -> select loop -->
  <path d="M 430 229 L 392 229 L 392 101 L 430 101" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="384" y="165" text-anchor="middle" font-size="10" fill="#b85450" transform="rotate(-90 384 165)" filter="url(#rough2)">回到分叉，换下一个候选</text>

  <!-- summary box -->
  <rect x="370" y="288" width="252" height="118" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="496" y="310" text-anchor="middle" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">一句话直觉</text>
  <text x="380" y="330" font-size="11" fill="#555" filter="url(#rough2)">• 根到叶一条路径 = 一个候选解</text>
  <text x="380" y="348" font-size="11" fill="#555" filter="url(#rough2)">• 「撤销」让一条 path 复用</text>
  <text x="380" y="366" font-size="11" fill="#555" filter="url(#rough2)">  去探索所有分支，不互相污染</text>
  <text x="380" y="386" font-size="11" fill="#888" filter="url(#rough2)">• 剪枝 = 提前砍掉必不合法的子树</text>

  <!-- bottom note -->
  <text x="320" y="426" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">所有回溯题 = 选一棵合适的决策树 + 在上面跑「选-递归-撤销」循环</text>
</svg>
