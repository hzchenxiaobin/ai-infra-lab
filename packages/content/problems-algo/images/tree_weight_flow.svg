<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="r4"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="41"/><feDisplacementMap in="SourceGraphic" scale="1.4"/></filter>
    <marker id="ar4" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r4)">算法流程：BFS/DFS 求 depth → 取 h → 累加权重</text>

  <!-- step1 build + dfs -->
  <rect x="20" y="48" width="520" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r4)"/>
  <text x="36" y="70" font-size="12" font-weight="bold" fill="#446688" filter="url(#r4)">① 建邻接表 + DFS 求每个节点 depth</text>
  <text x="36" y="90" font-size="11" fill="#333" filter="url(#r4)">depth[0]=1；递归子节点 v：depth[v] = depth[u] + 1</text>
  <text x="36" y="104" font-size="10" fill="#888" filter="url(#r4)">递归栈深可达 n，改 BFS 或手动栈防爆栈</text>

  <path d="M280 112 L280 124" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar4)" filter="url(#r4)"/>

  <!-- step2 height -->
  <rect x="20" y="128" width="520" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#r4)"/>
  <text x="36" y="150" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#r4)">② 取树高 h = max(depth[0..n−1])</text>
  <text x="36" y="168" font-size="11" fill="#333" filter="url(#r4)">一次遍历取最大值</text>

  <path d="M280 182 L280 194" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar4)" filter="url(#r4)"/>

  <!-- step3 sum -->
  <rect x="20" y="198" width="520" height="62" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#r4)"/>
  <text x="36" y="220" font-size="12" font-weight="bold" fill="#b85450" filter="url(#r4)">③ 累加 weight[i] = nums[i] · (h − depth[i] + 1)</text>
  <text x="36" y="240" font-size="11" fill="#333" filter="url(#r4)">系数 = h − d + 1 ≥ 1（因 d ≤ h）</text>
  <text x="36" y="254" font-size="11" fill="#333" filter="url(#r4)">∑ 可达 n·max(nums)·h ≈ 10^5·10^6·10^5 = 10^16 → 用 long long</text>

  <path d="M280 262 L280 274" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar4)" filter="url(#r4)"/>

  <!-- complexity -->
  <rect x="20" y="278" width="520" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="5 3" filter="url(#r4)"/>
  <text x="36" y="300" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#r4)">复杂度</text>
  <text x="36" y="318" font-size="11" fill="#333" filter="url(#r4)">时间 O(n)：建表 + 一次 DFS + 一次求最大 + 一次求和</text>
  <text x="36" y="334" font-size="11" fill="#333" filter="url(#r4)">空间 O(n)：邻接表 + depth 数组 + 递归栈</text>
</svg>
