<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察:一次旋转的增量 = −2 ×(某个偶数长度窗口的 w 和)</text>
  <text x="320" y="52" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">记 w[i] = (+1/−1) × nums[i](下标偶取 +,奇取 −),原脉冲值 P = Σ w[i],S(a,b) = w[a] + … + w[b]</text>

  <!-- ============ 左面板:偶数长度旋转 ============ -->
  <text x="160" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">偶数长度:旋转 [0..3]</text>

  <text x="63" y="100" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">+</text>
  <text x="111" y="100" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">−</text>
  <text x="159" y="100" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">+</text>
  <text x="207" y="100" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">−</text>

  <rect x="40" y="104" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="63" y="126" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="88" y="104" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="111" y="126" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <rect x="136" y="104" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="159" y="126" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <rect x="184" y="104" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="207" y="126" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">d</text>

  <text x="63" y="152" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="111" y="152" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="159" y="152" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="207" y="152" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>

  <path d="M 136 160 L 136 192" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="148" y="180" font-size="11" fill="#446688" filter="url(#rough2)">循环左移 [0..3]</text>

  <text x="63" y="202" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">+</text>
  <text x="111" y="202" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">−</text>
  <text x="159" y="202" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">+</text>
  <text x="207" y="202" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">−</text>

  <rect x="40" y="206" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="63" y="228" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <rect x="88" y="206" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="111" y="228" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <rect x="136" y="206" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="159" y="228" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">d</text>
  <rect x="184" y="206" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="207" y="228" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>

  <text x="160" y="270" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">每个元素都移动奇数距离 → 符号全部翻转</text>
  <text x="160" y="288" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">新贡献 = b−c+d−a = −(a−b+c−d)</text>

  <rect x="28" y="300" width="264" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="324" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6420" filter="url(#rough2)">Δ = −2 × S(l..r),窗口即旋转段</text>

  <!-- ============ 右面板:奇数长度旋转 ============ -->
  <text x="484" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">奇数长度:旋转 [0..2]</text>

  <text x="390" y="100" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">+</text>
  <text x="438" y="100" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">−</text>
  <text x="486" y="100" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">+</text>
  <text x="534" y="100" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">−</text>

  <rect x="368" y="104" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="390" y="126" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="416" y="104" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="438" y="126" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <rect x="464" y="104" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="486" y="126" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <rect x="512" y="104" width="44" height="34" rx="4" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="534" y="126" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">d</text>
  <text x="534" y="96" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">窗口外</text>

  <text x="390" y="152" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="438" y="152" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="486" y="152" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="534" y="152" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>

  <path d="M 438 160 L 438 192" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="450" y="180" font-size="11" fill="#446688" filter="url(#rough2)">循环左移 [0..2]</text>

  <text x="390" y="202" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">+</text>
  <text x="438" y="202" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">−</text>
  <text x="486" y="202" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">+</text>
  <text x="534" y="202" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">−</text>

  <rect x="368" y="206" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="390" y="228" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <rect x="416" y="206" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="438" y="228" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <rect x="464" y="206" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="486" y="228" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">a</text>
  <rect x="512" y="206" width="44" height="34" rx="4" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="534" y="228" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">d</text>

  <text x="484" y="270" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">b、c 各移 1 格 → 变号;a 从 0 跳到 2,奇偶不变</text>
  <text x="484" y="288" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">Δ = −2 × S(l+1..r),恰是更短的偶数窗口!</text>

  <rect x="356" y="300" width="264" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="484" y="324" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6420" filter="url(#rough2)">效果 ≡ 直接旋转偶数窗口 [l+1..r]</text>

  <!-- ============ 底部结论 ============ -->
  <rect x="40" y="352" width="560" height="62" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="376" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">一次旋转的可达增量 = { −2 × S(W) : W 为长度 ≥ 2 的偶数窗口 }(奇数长度旋转不产生新取值)</text>
  <text x="320" y="400" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">⇒ 只需考虑偶数窗口:答案 = P + max(0, −2 × min S(W))</text>
</svg>
