<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">nums=[1,2,1,2], a=3, b=2：BIT 逐 r 计数</text>
  <text x="300" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">P=[0,−3,−1,−4,−2]，离散 rank: −4→1, −3→2, −2→3, −1→4, 0→5</text>

  <!-- header -->
  <g filter="url(#rough2)" font-size="11" fill="#446688">
    <rect x="30" y="65" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="65" y="82" text-anchor="middle">r</text>
    <rect x="100" y="65" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="145" y="82" text-anchor="middle">lastOdd</text>
    <rect x="190" y="65" width="110" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="245" y="82" text-anchor="middle">新插入 P[l]</text>
    <rect x="300" y="65" width="90" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="345" y="82" text-anchor="middle">P[r+1]</text>
    <rect x="390" y="65" width="70" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="425" y="82" text-anchor="middle">rank</text>
    <rect x="460" y="65" width="110" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="515" y="82" text-anchor="middle">计数(累加)</text>
  </g>

  <!-- rows -->
  <g filter="url(#rough2)" font-size="11" fill="#333">
    <rect x="30" y="95" width="540" height="28" fill="#fafafa" stroke="#e0e0e0" rx="4"/>
    <text x="65" y="113" text-anchor="middle">0</text>
    <text x="145" y="113" text-anchor="middle">0</text>
    <text x="245" y="113" text-anchor="middle" fill="#4a7a3a">P[0]=0</text>
    <text x="345" y="113" text-anchor="middle" fill="#d6a040">−3</text>
    <text x="425" y="113" text-anchor="middle">2</text>
    <text x="515" y="113" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>

    <rect x="30" y="125" width="540" height="28" fill="#fafafa" stroke="#e0e0e0" rx="4"/>
    <text x="65" y="143" text-anchor="middle">1</text>
    <text x="145" y="143" text-anchor="middle">0</text>
    <text x="245" y="143" text-anchor="middle" fill="#888">—</text>
    <text x="345" y="143" text-anchor="middle" fill="#d6a040">−1</text>
    <text x="425" y="143" text-anchor="middle">4</text>
    <text x="515" y="143" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>

    <rect x="30" y="155" width="540" height="28" fill="#fafafa" stroke="#e0e0e0" rx="4"/>
    <text x="65" y="173" text-anchor="middle">2</text>
    <text x="145" y="173" text-anchor="middle">2</text>
    <text x="245" y="173" text-anchor="middle" fill="#4a7a3a">P[1]=−3,P[2]=−1</text>
    <text x="345" y="173" text-anchor="middle" fill="#d6a040">−4</text>
    <text x="425" y="173" text-anchor="middle">1</text>
    <text x="515" y="173" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>

    <rect x="30" y="185" width="540" height="28" fill="#fafafa" stroke="#e0e0e0" rx="4"/>
    <text x="65" y="203" text-anchor="middle">3</text>
    <text x="145" y="203" text-anchor="middle">2</text>
    <text x="245" y="203" text-anchor="middle" fill="#888">—</text>
    <text x="345" y="203" text-anchor="middle" fill="#d6a040">−2</text>
    <text x="425" y="203" text-anchor="middle">3</text>
    <text x="515" y="203" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
  </g>

  <!-- example r=2 detail -->
  <rect x="30" y="230" width="540" height="155" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="50" y="253" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">r=2 详解</text>
  <text x="50" y="275" font-size="11" fill="#333" filter="url(#rough2)">• lastOdd=2，补插 P[1]、P[2]，已插入 {P[0],P[1],P[2]} = {0,−3,−1}，共 3 个</text>
  <text x="50" y="295" font-size="11" fill="#333" filter="url(#rough2)">• 查 P[l] ≥ P[3]=−4：rank(−4)=1，prefix(rank−1)=prefix(0)=0</text>
  <text x="50" y="315" font-size="11" fill="#333" filter="url(#rough2)">• 计数 = total − 0 = 3 − 0 = 3 ✓（0,−3,−1 均 ≥ −4）</text>
  <text x="50" y="340" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">合计 = 1+1+3+2 = 7 ✓</text>
  <text x="50" y="362" font-size="11" fill="#666" filter="url(#rough2)">关键：lastOdd 单调 → l 只增不减；P[r+1] 永未插入 → 无自配</text>
</svg>
