<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="880" height="380" fill="#fdfcf7"/>
  <text x="440" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">滑动窗口 + 质因数并集计数器</text>
  <path d="M 300 40 Q 440 48 580 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- window bracket over array -->
  <text x="60" y="78" font-size="12" fill="#888" font-weight="bold">数组：</text>
  <g font-size="13" font-family="monospace" font-weight="bold">
    <g filter="url(#sk)"><rect x="110" y="86" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4"/></g>
    <text x="138" y="112" text-anchor="middle" fill="#2b4a6e">7</text>
    <g filter="url(#sk)"><rect x="170" y="86" width="56" height="40" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
    <text x="198" y="112" text-anchor="middle" fill="#2e6e2e">6</text>
    <g filter="url(#sk)"><rect x="230" y="86" width="56" height="40" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
    <text x="258" y="112" text-anchor="middle" fill="#2e6e2e">10</text>
    <g filter="url(#sk)"><rect x="290" y="86" width="56" height="40" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
    <text x="318" y="112" text-anchor="middle" fill="#2e6e2e">12</text>
    <g filter="url(#sk)"><rect x="350" y="86" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4"/></g>
    <text x="378" y="112" text-anchor="middle" fill="#2b4a6e">11</text>
  </g>

  <!-- window bracket -->
  <path d="M 168 132 L 164 140 L 352 140 L 348 132" stroke="#4a8e4a" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="258" y="156" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">窗口 [6,10,12]：并集 {2,3,5}，|并集|=3 ≤ k=3 ✓</text>

  <!-- left/right pointers -->
  <text x="198" y="174" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">↑ left</text>
  <text x="318" y="174" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">↑ right</text>

  <!-- counter table -->
  <text x="60" y="206" font-size="12" font-weight="bold" fill="#2b2b2b">质因数计数器 cnt[p]（窗口内含 p 的元素个数）</text>
  <line x1="60" y1="214" x2="560" y2="214" stroke="#aaa" stroke-width="1" filter="url(#sk)"/>
  <g font-size="12">
    <text x="80" y="234" fill="#888" font-weight="bold">质数 p</text>
    <text x="200" y="234" fill="#888" font-weight="bold">2</text>
    <text x="280" y="234" fill="#888" font-weight="bold">3</text>
    <text x="360" y="234" fill="#888" font-weight="bold">5</text>
    <text x="440" y="234" fill="#888" font-weight="bold">7</text>
    <text x="520" y="234" fill="#888" font-weight="bold">11</text>

    <text x="80" y="258" fill="#444">cnt[p]</text>
    <text x="200" y="258" fill="#2e6e2e" font-weight="bold">3</text>
    <text x="280" y="258" fill="#2e6e2e" font-weight="bold">2</text>
    <text x="360" y="258" fill="#2e6e2e" font-weight="bold">1</text>
    <text x="440" y="258" fill="#bbb">0</text>
    <text x="520" y="258" fill="#bbb">0</text>

    <text x="80" y="282" fill="#444">distinct</text>
    <text x="200" y="282" fill="#b85450" font-weight="bold" font-size="14">3</text>
    <text x="240" y="282" font-size="11" fill="#888">= 非零 cnt 的个数</text>
  </g>
  <line x1="60" y1="294" x2="560" y2="294" stroke="#aaa" stroke-width="1" filter="url(#sk)"/>

  <!-- rule box -->
  <g filter="url(#sk)">
    <rect x="590" y="86" width="260" height="120" rx="8" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="610" y="112" font-size="13" font-weight="bold" fill="#7a5415">滑动窗口规则</text>
  <text x="610" y="134" font-size="11" fill="#444">① right 右移，加入 nums[right] 的质因数</text>
  <text x="610" y="152" font-size="11" fill="#444">    cnt[p] 0→1 时 distinct++</text>
  <text x="610" y="172" font-size="11" fill="#b03a3a">② 若 distinct &gt; k：</text>
  <text x="610" y="190" font-size="11" fill="#444">    左移 left，移除 nums[left] 质因数</text>
  <text x="610" y="206" font-size="11" fill="#444">    cnt[p] 1→0 时 distinct−−</text>

  <!-- complexity -->
  <g filter="url(#sk)">
    <rect x="60" y="312" width="790" height="56" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="80" y="336" font-size="12" font-weight="bold" fill="#2b6e9e">关键：每个数 ≤ 10⁵ 最多 6 个不同质因数 → 每步增删 O(6) → 总时间 O(n)，筛 SPF 预处理 O(U log log U)</text>
  <text x="80" y="356" font-size="11" fill="#666">单调性：right 增大时合法最小 left 单调不降 → 双指针正确</text>
</svg>
