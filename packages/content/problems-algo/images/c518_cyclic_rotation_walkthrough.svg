<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="880" height="560" fill="#fafafa"/>

  <text x="440" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例 1 演算：nums = [1,2,3,4,5,6]，n = 6，h = 3，total = 21</text>
  <path d="M 150 46 Q 440 54 730 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <g font-size="12" font-weight="bold" fill="#555">
    <text x="90" y="86" text-anchor="middle" filter="url(#rough2)">r</text>
    <text x="240" y="86" text-anchor="middle" filter="url(#rough2)">窗口（前半段元素）</text>
    <text x="470" y="86" text-anchor="middle" filter="url(#rough2)">W[r] 递推</text>
    <text x="650" y="86" text-anchor="middle" filter="url(#rough2)">2·W[r] &gt; 21 ?</text>
    <text x="790" y="86" text-anchor="middle" filter="url(#rough2)">好移位?</text>
  </g>
  <path d="M 40 96 L 840 96" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- r=0 -->
  <g font-size="12">
    <text x="90" y="132" text-anchor="middle" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
    <g filter="url(#rough2)"><rect x="150" y="106" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
    <text x="170" y="126" text-anchor="middle" fill="#33526e">1</text>
    <g filter="url(#rough2)"><rect x="220" y="106" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
    <text x="240" y="126" text-anchor="middle" fill="#33526e">2</text>
    <g filter="url(#rough2)"><rect x="290" y="106" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
    <text x="310" y="126" text-anchor="middle" fill="#33526e">3</text>
    <text x="470" y="126" text-anchor="middle" fill="#333" font-family="monospace" filter="url(#rough2)">W[0] = 1+2+3 = 6</text>
    <text x="650" y="126" text-anchor="middle" fill="#b85450" font-family="monospace" filter="url(#rough2)">12 &gt; 21 ✗</text>
    <text x="790" y="126" text-anchor="middle" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  </g>
  <text x="240" y="156" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">− nums[0]=1，+ nums[3]=4</text>

  <!-- r=1 -->
  <g font-size="12">
    <text x="90" y="196" text-anchor="middle" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
    <g filter="url(#rough2)"><rect x="150" y="170" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
    <text x="170" y="190" text-anchor="middle" fill="#33526e">2</text>
    <g filter="url(#rough2)"><rect x="220" y="170" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
    <text x="240" y="190" text-anchor="middle" fill="#33526e">3</text>
    <g filter="url(#rough2)"><rect x="290" y="170" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
    <text x="310" y="190" text-anchor="middle" fill="#33526e">4</text>
    <text x="470" y="190" text-anchor="middle" fill="#333" font-family="monospace" filter="url(#rough2)">W[1] = 6 − 1 + 4 = 9</text>
    <text x="650" y="190" text-anchor="middle" fill="#b85450" font-family="monospace" filter="url(#rough2)">18 &gt; 21 ✗</text>
    <text x="790" y="190" text-anchor="middle" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  </g>
  <text x="240" y="220" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">− nums[1]=2，+ nums[4]=5</text>

  <!-- r=2 -->
  <g font-size="12">
    <text x="90" y="260" text-anchor="middle" fill="#2e5e2e" font-weight="bold" filter="url(#rough2)">2</text>
    <g filter="url(#rough2)"><rect x="150" y="234" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
    <text x="170" y="254" text-anchor="middle" fill="#2e5e2e" font-weight="bold">3</text>
    <g filter="url(#rough2)"><rect x="220" y="234" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
    <text x="240" y="254" text-anchor="middle" fill="#2e5e2e" font-weight="bold">4</text>
    <g filter="url(#rough2)"><rect x="290" y="234" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
    <text x="310" y="254" text-anchor="middle" fill="#2e5e2e" font-weight="bold">5</text>
    <text x="470" y="254" text-anchor="middle" fill="#333" font-family="monospace" filter="url(#rough2)">W[2] = 9 − 2 + 5 = 12</text>
    <text x="650" y="254" text-anchor="middle" fill="#2e5e2e" font-family="monospace" font-weight="bold" filter="url(#rough2)">24 &gt; 21 ✓</text>
    <text x="790" y="254" text-anchor="middle" fill="#2e5e2e" font-weight="bold" font-size="14" filter="url(#rough2)">✓</text>
  </g>
  <text x="240" y="284" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">− nums[2]=3，+ nums[5]=6</text>

  <!-- r=3 -->
  <g font-size="12">
    <text x="90" y="324" text-anchor="middle" fill="#2e5e2e" font-weight="bold" filter="url(#rough2)">3</text>
    <g filter="url(#rough2)"><rect x="150" y="298" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
    <text x="170" y="318" text-anchor="middle" fill="#2e5e2e" font-weight="bold">4</text>
    <g filter="url(#rough2)"><rect x="220" y="298" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
    <text x="240" y="318" text-anchor="middle" fill="#2e5e2e" font-weight="bold">5</text>
    <g filter="url(#rough2)"><rect x="290" y="298" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
    <text x="310" y="318" text-anchor="middle" fill="#2e5e2e" font-weight="bold">6</text>
    <text x="470" y="318" text-anchor="middle" fill="#333" font-family="monospace" filter="url(#rough2)">W[3] = 12 − 3 + 6 = 15</text>
    <text x="650" y="318" text-anchor="middle" fill="#2e5e2e" font-family="monospace" font-weight="bold" filter="url(#rough2)">30 &gt; 21 ✓</text>
    <text x="790" y="318" text-anchor="middle" fill="#2e5e2e" font-weight="bold" font-size="14" filter="url(#rough2)">✓</text>
  </g>
  <text x="240" y="348" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">− nums[3]=4，+ nums[(3+3) mod 6]=nums[0]=1（回绕）</text>

  <!-- r=4 -->
  <g font-size="12">
    <text x="90" y="388" text-anchor="middle" fill="#2e5e2e" font-weight="bold" filter="url(#rough2)">4</text>
    <g filter="url(#rough2)"><rect x="150" y="362" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
    <text x="170" y="382" text-anchor="middle" fill="#2e5e2e" font-weight="bold">5</text>
    <g filter="url(#rough2)"><rect x="220" y="362" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
    <text x="240" y="382" text-anchor="middle" fill="#2e5e2e" font-weight="bold">6</text>
    <g filter="url(#rough2)"><rect x="290" y="362" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
    <text x="310" y="382" text-anchor="middle" fill="#2e5e2e" font-weight="bold">1</text>
    <text x="470" y="382" text-anchor="middle" fill="#333" font-family="monospace" filter="url(#rough2)">W[4] = 15 − 4 + 1 = 12</text>
    <text x="650" y="382" text-anchor="middle" fill="#2e5e2e" font-family="monospace" font-weight="bold" filter="url(#rough2)">24 &gt; 21 ✓</text>
    <text x="790" y="382" text-anchor="middle" fill="#2e5e2e" font-weight="bold" font-size="14" filter="url(#rough2)">✓</text>
  </g>
  <text x="240" y="412" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">− nums[4]=5，+ nums[(4+3) mod 6]=nums[1]=2（回绕）</text>

  <!-- r=5 -->
  <g font-size="12">
    <text x="90" y="452" text-anchor="middle" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
    <g filter="url(#rough2)"><rect x="150" y="426" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
    <text x="170" y="446" text-anchor="middle" fill="#33526e">6</text>
    <g filter="url(#rough2)"><rect x="220" y="426" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
    <text x="240" y="446" text-anchor="middle" fill="#33526e">1</text>
    <g filter="url(#rough2)"><rect x="290" y="426" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
    <text x="310" y="446" text-anchor="middle" fill="#33526e">2</text>
    <text x="470" y="446" text-anchor="middle" fill="#333" font-family="monospace" filter="url(#rough2)">W[5] = 12 − 5 + 2 = 9</text>
    <text x="650" y="446" text-anchor="middle" fill="#b85450" font-family="monospace" filter="url(#rough2)">18 &gt; 21 ✗</text>
    <text x="790" y="446" text-anchor="middle" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  </g>

  <!-- 结论 -->
  <g filter="url(#rough2)">
    <rect x="150" y="478" width="580" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="440" y="502" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e" filter="url(#rough2)">r = 2, 3, 4 满足 2·W[r] &gt; total，共 3 个好移位</text>
  <text x="440" y="524" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">返回 ans = 3（与示例输出一致）</text>
</svg>
