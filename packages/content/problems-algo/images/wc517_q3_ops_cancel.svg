<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">先乘后除：一对「乘、除」整体抵消</text>

  <!-- pure multiply chain -->
  <text x="60" y="62" font-size="11.5" fill="#3a4a66" font-weight="bold">纯乘链（m 次，代价 m）：</text>

  <rect x="60" y="72" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="86" y="94" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">10</text>
  <path d="M 112 89 L 148 89" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="130" y="82" text-anchor="middle" font-size="10" fill="#446688">×2</text>

  <rect x="150" y="72" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="176" y="94" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">20</text>
  <path d="M 202 89 L 238 89" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="220" y="82" text-anchor="middle" font-size="10" fill="#446688">×2</text>

  <rect x="240" y="72" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="266" y="94" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">40</text>
  <path d="M 292 89 L 328 89" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="82" text-anchor="middle" font-size="10" fill="#446688">×2</text>

  <rect x="330" y="72" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="356" y="94" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">80</text>

  <text x="396" y="94" font-size="10.5" fill="#888">← 超过 sum 就没用了</text>

  <!-- pure divide chain -->
  <text x="60" y="142" font-size="11.5" fill="#3a4a66" font-weight="bold">纯除链（j 次，代价 j）：</text>

  <rect x="60" y="152" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="86" y="174" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">10</text>
  <path d="M 112 169 L 148 169" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="130" y="162" text-anchor="middle" font-size="10" fill="#4a7a3a">÷2</text>

  <rect x="150" y="152" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="176" y="174" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">5</text>
  <path d="M 202 169 L 238 169" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="220" y="162" text-anchor="middle" font-size="10" fill="#4a7a3a">÷2</text>

  <rect x="240" y="152" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="266" y="174" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">2</text>
  <path d="M 292 169 L 328 169" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="162" text-anchor="middle" font-size="10" fill="#4a7a3a">÷2</text>

  <rect x="330" y="152" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="356" y="174" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">1</text>
  <path d="M 382 169 L 418 169" stroke="#999" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="162" text-anchor="middle" font-size="10" fill="#999">÷2</text>

  <rect x="420" y="152" width="42" height="34" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="441" y="174" text-anchor="middle" font-size="12" fill="#888">0</text>
  <text x="474" y="174" font-size="10" fill="#999">跳过</text>

  <!-- mixed chain -->
  <text x="60" y="222" font-size="11.5" fill="#3a4a66" font-weight="bold">混合链（先乘后除，m + j 次）：</text>

  <rect x="60" y="232" width="52" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="86" y="254" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">10</text>
  <path d="M 112 249 L 148 249" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="130" y="242" text-anchor="middle" font-size="10" fill="#d6a040">×2</text>

  <rect x="150" y="232" width="52" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="176" y="254" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">20</text>
  <path d="M 202 249 L 238 249" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="220" y="242" text-anchor="middle" font-size="10" fill="#d6a040">×2</text>

  <rect x="240" y="232" width="52" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="266" y="254" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">40</text>
  <path d="M 292 249 L 328 249" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="242" text-anchor="middle" font-size="10" fill="#b85450">÷2</text>

  <rect x="330" y="232" width="52" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="356" y="254" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">20</text>
  <path d="M 382 249 L 418 249" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="242" text-anchor="middle" font-size="10" fill="#b85450">÷2</text>

  <rect x="420" y="232" width="52" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="446" y="254" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">10</text>
  <path d="M 472 249 L 508 249" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="490" y="242" text-anchor="middle" font-size="10" fill="#b85450">÷2</text>

  <rect x="500" y="232" width="42" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="521" y="254" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">5</text>

  <!-- cancel annotation -->
  <ellipse cx="176" cy="249" rx="30" ry="26" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <ellipse cx="356" cy="249" rx="30" ry="26" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 206 240 Q 280 216 326 240" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4,3" fill="none" filter="url(#rough2)"/>
  <text x="266" y="212" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">×2 与 ÷2 成对删去，终值不变、代价 −2</text>

  <!-- conclusion -->
  <rect x="40" y="300" width="480" height="84" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="60" y="324" font-size="11.5" fill="#333" font-weight="bold">结论（混合即纯）：</text>
  <text x="60" y="344" font-size="11" fill="#555">⌊v·2^m / 2^j⌋ = ⌊v·2^(m−1) / 2^(j−1)⌋（m, j ≥ 1），反复抵消后</text>
  <text x="60" y="362" font-size="11" fill="#555">任何混合终值 = 纯乘（m ≥ j 时 v·2^(m−j)）或纯除（m &lt; j 时 v·2^(j−m) 取整），</text>
  <text x="60" y="380" font-size="11" fill="#4a7a3a" font-weight="bold">且纯方案代价 |m−j| &lt; m + j。最优候选只需两条纯链。</text>
</svg>
