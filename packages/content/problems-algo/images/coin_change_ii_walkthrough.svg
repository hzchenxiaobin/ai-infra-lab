<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="860" height="560" fill="#fdfcf7"/>
  <text x="430" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：coins=[1,2,5], amount=5</text>
  <path d="M 280 42 Q 430 50 580 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- table header: amount columns -->
  <g font-size="11" fill="#888">
    <text x="120" y="92" font-weight="bold">处理硬币</text>
    <text x="252" y="92" text-anchor="middle" font-weight="bold">dp[0]</text>
    <text x="332" y="92" text-anchor="middle" font-weight="bold">dp[1]</text>
    <text x="412" y="92" text-anchor="middle" font-weight="bold">dp[2]</text>
    <text x="492" y="92" text-anchor="middle" font-weight="bold">dp[3]</text>
    <text x="572" y="92" text-anchor="middle" font-weight="bold">dp[4]</text>
    <text x="652" y="92" text-anchor="middle" font-weight="bold">dp[5]</text>
  </g>

  <!-- Row 1: 初始 -->
  <g filter="url(#sk)"><rect x="100" y="102" width="110" height="34" rx="5" fill="#f2f2f2" stroke="#aaa" stroke-width="1"/></g>
  <text x="155" y="124" text-anchor="middle" font-size="11" fill="#555">初始</text>
  <!-- cells: 1 0 0 0 0 0 -->
  <g font-size="12">
    <g filter="url(#sk)"><rect x="226" y="102" width="52" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
    <text x="252" y="124" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>
    <g filter="url(#sk)"><rect x="306" y="102" width="52" height="34" rx="4" fill="#fff" stroke="#bbb" stroke-width="1"/></g>
    <text x="332" y="124" text-anchor="middle" fill="#aaa">0</text>
    <g filter="url(#sk)"><rect x="386" y="102" width="52" height="34" rx="4" fill="#fff" stroke="#bbb" stroke-width="1"/></g>
    <text x="412" y="124" text-anchor="middle" fill="#aaa">0</text>
    <g filter="url(#sk)"><rect x="466" y="102" width="52" height="34" rx="4" fill="#fff" stroke="#bbb" stroke-width="1"/></g>
    <text x="492" y="124" text-anchor="middle" fill="#aaa">0</text>
    <g filter="url(#sk)"><rect x="546" y="102" width="52" height="34" rx="4" fill="#fff" stroke="#bbb" stroke-width="1"/></g>
    <text x="572" y="124" text-anchor="middle" fill="#aaa">0</text>
    <g filter="url(#sk)"><rect x="626" y="102" width="52" height="34" rx="4" fill="#fff" stroke="#bbb" stroke-width="1"/></g>
    <text x="652" y="124" text-anchor="middle" fill="#aaa">0</text>
  </g>

  <!-- Row 2: coin=1 -->
  <g filter="url(#sk)"><rect x="100" y="146" width="110" height="34" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="155" y="168" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">coin=1</text>
  <g font-size="12" fill="#2b6e9e">
    <g filter="url(#sk)"><rect x="226" y="146" width="52" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
    <text x="252" y="168" text-anchor="middle">1</text>
    <g filter="url(#sk)"><rect x="306" y="146" width="52" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
    <text x="332" y="168" text-anchor="middle">1</text>
    <g filter="url(#sk)"><rect x="386" y="146" width="52" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
    <text x="412" y="168" text-anchor="middle">1</text>
    <g filter="url(#sk)"><rect x="466" y="146" width="52" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
    <text x="492" y="168" text-anchor="middle">1</text>
    <g filter="url(#sk)"><rect x="546" y="146" width="52" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
    <text x="572" y="168" text-anchor="middle">1</text>
    <g filter="url(#sk)"><rect x="626" y="146" width="52" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
    <text x="652" y="168" text-anchor="middle">1</text>
  </g>
  <text x="710" y="168" font-size="9.5" fill="#888">全用1: 每种金额1种</text>

  <!-- Row 3: coin=2 -->
  <g filter="url(#sk)"><rect x="100" y="190" width="110" height="34" rx="5" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="155" y="212" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">coin=2</text>
  <g font-size="12">
    <g filter="url(#sk)"><rect x="226" y="190" width="52" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
    <text x="252" y="212" text-anchor="middle" fill="#2e6e2e">1</text>
    <g filter="url(#sk)"><rect x="306" y="190" width="52" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
    <text x="332" y="212" text-anchor="middle" fill="#2b6e9e">1</text>
    <g filter="url(#sk)"><rect x="386" y="190" width="52" height="34" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/></g>
    <text x="412" y="212" text-anchor="middle" fill="#7a5415" font-weight="bold">2</text>
    <g filter="url(#sk)"><rect x="466" y="190" width="52" height="34" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/></g>
    <text x="492" y="212" text-anchor="middle" fill="#7a5415" font-weight="bold">2</text>
    <g filter="url(#sk)"><rect x="546" y="190" width="52" height="34" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/></g>
    <text x="572" y="212" text-anchor="middle" fill="#7a5415" font-weight="bold">3</text>
    <g filter="url(#sk)"><rect x="626" y="190" width="52" height="34" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/></g>
    <text x="652" y="212" text-anchor="middle" fill="#7a5415" font-weight="bold">3</text>
  </g>
  <text x="710" y="206" font-size="9.5" fill="#888">叠加「含2」:</text>
  <text x="710" y="220" font-size="9.5" fill="#888">dp[i]+=dp[i-2]</text>

  <!-- Row 4: coin=5 -->
  <g filter="url(#sk)"><rect x="100" y="234" width="110" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="155" y="256" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">coin=5</text>
  <g font-size="12">
    <g filter="url(#sk)"><rect x="226" y="234" width="52" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
    <text x="252" y="256" text-anchor="middle" fill="#2e6e2e">1</text>
    <g filter="url(#sk)"><rect x="306" y="234" width="52" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
    <text x="332" y="256" text-anchor="middle" fill="#2b6e9e">1</text>
    <g filter="url(#sk)"><rect x="386" y="234" width="52" height="34" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1"/></g>
    <text x="412" y="256" text-anchor="middle" fill="#7a5415">2</text>
    <g filter="url(#sk)"><rect x="466" y="234" width="52" height="34" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1"/></g>
    <text x="492" y="256" text-anchor="middle" fill="#7a5415">2</text>
    <g filter="url(#sk)"><rect x="546" y="234" width="52" height="34" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1"/></g>
    <text x="572" y="256" text-anchor="middle" fill="#7a5415">3</text>
    <g filter="url(#sk)"><rect x="626" y="234" width="52" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
    <text x="652" y="256" text-anchor="middle" fill="#b03a3a" font-weight="bold">4</text>
  </g>
  <text x="710" y="250" font-size="9.5" fill="#888">dp[5]+=dp[0]</text>
  <text x="710" y="264" font-size="9.5" fill="#b03a3a" font-weight="bold">= 3+1 = 4 ✓</text>

  <!-- highlight final answer arrow -->
  <path d="M 678 251 Q 720 251 720 300" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="640" y="306" width="160" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="720" y="331" text-anchor="middle" font-size="14" fill="#b03a3a" font-weight="bold">答案 dp[5] = 4</text>

  <!-- detail: coin=2 transition explanation -->
  <g filter="url(#sk)">
    <rect x="60" y="368" width="740" height="68" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="430" y="390" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">看 coin=2 这一轮：dp[4] = 旧 dp[4] + dp[4-2] = 1 + dp[2]</text>
  <text x="430" y="408" text-anchor="middle" font-size="10.5" fill="#542">此时 dp[2] 已被本轮更新成 2（含「一枚2」），正序让 2 可重复用 → dp[4]=1+2=3</text>
  <text x="430" y="425" text-anchor="middle" font-size="10.5" fill="#b03a3a">若倒序，dp[4] 会引用上一轮的 dp[2]=1，得 1+1=2 → 退化成 0-1 背包（错）</text>

  <!-- 4 combinations -->
  <text x="430" y="460" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">dp[5]=4 对应四种组合</text>
  <g font-size="11.5" fill="#346">
    <g filter="url(#sk)"><rect x="70" y="472" width="150" height="28" rx="5" fill="#fff" stroke="#9ec9a0" stroke-width="1"/></g>
    <text x="145" y="491" text-anchor="middle">5</text>
    <g filter="url(#sk)"><rect x="235" y="472" width="150" height="28" rx="5" fill="#fff" stroke="#9ec9a0" stroke-width="1"/></g>
    <text x="310" y="491" text-anchor="middle">2 + 2 + 1</text>
    <g filter="url(#sk)"><rect x="400" y="472" width="150" height="28" rx="5" fill="#fff" stroke="#9ec9a0" stroke-width="1"/></g>
    <text x="475" y="491" text-anchor="middle">2 + 1 + 1 + 1</text>
    <g filter="url(#sk)"><rect x="565" y="472" width="220" height="28" rx="5" fill="#fff" stroke="#9ec9a0" stroke-width="1"/></g>
    <text x="675" y="491" text-anchor="middle">1 + 1 + 1 + 1 + 1</text>
  </g>
  <text x="430" y="528" text-anchor="middle" font-size="10.5" fill="#888">外层硬币→组合不重复 · 内层正序→硬币可叠加 → 完全背包计数</text>
</svg>
