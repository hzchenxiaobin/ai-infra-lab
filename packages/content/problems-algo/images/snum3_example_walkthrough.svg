<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="410" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：nums = [1,2,1,3,2,5]，按区分位分组异或</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">xor_all = 6 = (110)₂，diff = 2（第 1 位），逐元素分组并异或</text>

  <!-- ===== Table grid ===== -->
  <!-- header row y 58..88 -->
  <rect x="30" y="58" width="550" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="140" y1="58" x2="140" y2="88" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="250" y1="58" x2="250" y2="88" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="330" y1="58" x2="330" y2="88" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="420" y1="58" x2="420" y2="88" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="500" y1="58" x2="500" y2="88" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="85"  y="78" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">元素</text>
  <text x="195" y="78" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">二进制</text>
  <text x="290" y="78" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">第1位</text>
  <text x="375" y="78" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">分入</text>
  <text x="460" y="78" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">g0 异或</text>
  <text x="540" y="78" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">g1 异或</text>

  <!-- 7 data rows, each 32 tall, starting y=88 -->
  <!-- row 1: 初值 -->
  <rect x="30" y="88" width="550" height="32" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="85"  y="109" text-anchor="middle" font-size="11" fill="#888">初值</text>
  <text x="195" y="109" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="290" y="109" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="375" y="109" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="460" y="109" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">0</text>
  <text x="540" y="109" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">0</text>

  <!-- row 2: 1 | 001 | 0 | g0 | 1 | 0 -->
  <rect x="30" y="120" width="550" height="32" fill="#f7f9fc" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="85"  y="141" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="195" y="141" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">001</text>
  <text x="290" y="141" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="375" y="141" text-anchor="middle" font-size="11" fill="#b85450">g0</text>
  <text x="460" y="141" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">1</text>
  <text x="540" y="141" text-anchor="middle" font-size="11" fill="#888" font-family="monospace">0</text>

  <!-- row 3: 2 | 010 | 1 | g1 | 1 | 2 -->
  <rect x="30" y="152" width="550" height="32" fill="#f7f9fc" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="85"  y="173" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="195" y="173" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">010</text>
  <text x="290" y="173" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="375" y="173" text-anchor="middle" font-size="11" fill="#4a7a3a">g1</text>
  <text x="460" y="173" text-anchor="middle" font-size="11" fill="#888" font-family="monospace">1</text>
  <text x="540" y="173" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">2</text>

  <!-- row 4: 1 | 001 | 0 | g0 | 0(抵消) | 2  -- highlight 抵消 -->
  <rect x="30" y="184" width="550" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="85"  y="205" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="195" y="205" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">001</text>
  <text x="290" y="205" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="375" y="205" text-anchor="middle" font-size="11" fill="#b85450">g0</text>
  <text x="460" y="205" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" font-family="monospace">0 ←1⊕1</text>
  <text x="540" y="205" text-anchor="middle" font-size="11" fill="#888" font-family="monospace">2</text>

  <!-- row 5: 3 | 011 | 1 | g1 | 0 | 1 -->
  <rect x="30" y="216" width="550" height="32" fill="#f7f9fc" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="85"  y="237" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3</text>
  <text x="195" y="237" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">011</text>
  <text x="290" y="237" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="375" y="237" text-anchor="middle" font-size="11" fill="#4a7a3a">g1</text>
  <text x="460" y="237" text-anchor="middle" font-size="11" fill="#888" font-family="monospace">0</text>
  <text x="540" y="237" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">1</text>

  <!-- row 6: 2 | 010 | 1 | g1 | 0 | 3(抵消) -- highlight 抵消 -->
  <rect x="30" y="248" width="550" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="85"  y="269" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="195" y="269" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">010</text>
  <text x="290" y="269" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="375" y="269" text-anchor="middle" font-size="11" fill="#4a7a3a">g1</text>
  <text x="460" y="269" text-anchor="middle" font-size="11" fill="#888" font-family="monospace">0</text>
  <text x="540" y="269" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" font-family="monospace">3 ←2⊕2</text>

  <!-- row 7: 5 | 101 | 0 | g0 | 5 | 3 -- final -->
  <rect x="30" y="280" width="550" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="85"  y="301" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">5</text>
  <text x="195" y="301" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">101</text>
  <text x="290" y="301" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="375" y="301" text-anchor="middle" font-size="11" fill="#b85450">g0</text>
  <text x="460" y="301" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" font-family="monospace">5 ✓</text>
  <text x="540" y="301" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" font-family="monospace">3 ✓</text>

  <!-- column separators for data rows -->
  <g stroke="#dddddd" stroke-width="1">
    <line x1="140" y1="88" x2="140" y2="312" filter="url(#rough2)"/>
    <line x1="250" y1="88" x2="250" y2="312" filter="url(#rough2)"/>
    <line x1="330" y1="88" x2="330" y2="312" filter="url(#rough2)"/>
    <line x1="420" y1="88" x2="420" y2="312" filter="url(#rough2)"/>
    <line x1="500" y1="88" x2="500" y2="312" filter="url(#rough2)"/>
  </g>

  <!-- ===== Summary ===== -->
  <rect x="30" y="326" width="550" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="348" font-size="11" fill="#3a5a2a" font-weight="bold">结果：g0 = 5，g1 = 3 → 返回 [5, 3]（顺序任意）</text>
  <text x="50" y="368" font-size="10.5" fill="#555">• 抵消可见：两个 1 都进 g0（第 2、4 行）相互抵消为 0；两个 2 都进 g1（第 3、6 行）抵消为 0</text>
  <text x="50" y="386" font-size="10.5" fill="#555">• 落单数被拆开：3 落在 g1、5 落在 g0，各自成为本组唯一的孤数 → 各组异或即还原</text>
</svg>
