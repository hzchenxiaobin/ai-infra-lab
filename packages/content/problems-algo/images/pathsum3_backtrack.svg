<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">DFS + 回溯：cnt 只保留「当前栈路径」</text>

  <!-- tree -->
  <!-- node 10 -->
  <circle cx="150" cy="80" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="150" y="85" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">10</text>
  <!-- node 5 -->
  <circle cx="95" cy="160" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="95" y="165" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <!-- node -3 (sibling, greyed) -->
  <circle cx="210" cy="160" r="20" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="210" y="165" text-anchor="middle" font-size="13" fill="#999">−3</text>
  <!-- node 3 -->
  <circle cx="60" cy="240" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="60" y="245" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <!-- node 2 (greyed) -->
  <circle cx="130" cy="240" r="20" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="130" y="245" text-anchor="middle" font-size="13" fill="#999">2</text>

  <!-- edges: highlighted path -->
  <path d="M 150 100 L 100 142" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <path d="M 95 180 L 65 222" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <!-- edges: greyed -->
  <path d="M 150 100 L 200 142" stroke="#bbbbbb" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 95 180 L 125 222" stroke="#bbbbbb" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <text x="60" y="284" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">当前节点 B</text>
  <text x="210" y="200" font-size="10" fill="#999">兄弟分支(待访问)</text>

  <!-- current stack path label -->
  <path d="M 30 80 Q 18 160 40 240" stroke="#d6a040" stroke-width="1.4" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="22" y="160" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" transform="rotate(-78 22 160)">栈路径</text>

  <!-- cnt box -->
  <rect x="290" y="70" width="200" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="390" y="92" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">cnt（当前内容）</text>
  <text x="390" y="116" text-anchor="middle" font-size="12" fill="#333">{ 0:1, 10:1, 15:1 }</text>
  <text x="390" y="138" text-anchor="middle" font-size="10" fill="#666">虚根 + 10 + 5 的前缀和</text>
  <text x="390" y="156" text-anchor="middle" font-size="10" fill="#b85450">3 的 prefix=18 尚未写入</text>

  <!-- backtrack box -->
  <rect x="290" y="186" width="200" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="390" y="208" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold">回溯：cnt[cur] −−</text>
  <text x="390" y="232" text-anchor="middle" font-size="10" fill="#555">左右子树返回后，</text>
  <text x="390" y="248" text-anchor="middle" font-size="10" fill="#555">把当前节点前缀和移除</text>
  <text x="390" y="276" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">→ 访问 −3 时 cnt 已无 5</text>
  <text x="390" y="294" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">　兄弟分支互不干扰</text>

  <!-- arrow from cnt to backtrack -->
  <path d="M 390 166 L 390 184" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
</svg>
