<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="460" height="540" fill="#fafafa"/>

  <text x="230" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">搜索旋转排序数组算法流程</text>

  <!-- Init -->
  <rect x="80" y="42" width="300" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="64" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">初始化</text>
  <text x="230" y="82" text-anchor="middle" font-size="11" fill="#555">left = 0,  right = n − 1</text>

  <path d="M 230 96 L 230 114" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Loop check -->
  <polygon points="230,118 340,160 230,202 120,160" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="156" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">left ≤ right ?</text>
  <text x="230" y="174" text-anchor="middle" font-size="10.5" fill="#777">区间非空？</text>

  <!-- No -> -1 -->
  <path d="M 340 160 L 400 160 L 400 238" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="358" y="152" font-size="11" fill="#b85450" font-weight="bold">No</text>
  <rect x="318" y="242" width="130" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="383" y="267" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return −1</text>

  <!-- Yes down -->
  <path d="M 230 202 L 230 220" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="248" y="216" font-size="11" fill="#82b366" font-weight="bold">Yes</text>

  <!-- mid compute -->
  <rect x="100" y="224" width="260" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="230" y="249" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">mid = left + (right−left)/2</text>

  <path d="M 230 264 L 230 282" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- hit check -->
  <polygon points="230,286 330,322 230,358 130,322" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="320" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">nums[mid] == target ?</text>

  <!-- Yes hit -> return mid -->
  <path d="M 130 322 L 60 322 L 60 386" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="78" y="314" font-size="11" fill="#4a7a3a" font-weight="bold">Yes</text>
  <rect x="6" y="390" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="66" y="415" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return mid</text>

  <!-- No down -->
  <path d="M 230 358 L 230 376" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="248" y="372" font-size="11" fill="#b85450" font-weight="bold">No</text>

  <!-- Diamond: left half ordered? -->
  <polygon points="230,380 350,424 230,468 110,424" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="420" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">nums[left] ≤ nums[mid] ?</text>
  <text x="230" y="438" text-anchor="middle" font-size="10" fill="#777">左半有序？</text>

  <!-- Yes (left ordered) -->
  <path d="M 110 424 L 50 424 L 50 486" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="70" y="416" font-size="10.5" fill="#446688" font-weight="bold">Yes</text>
  <rect x="6" y="490" width="150" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="81" y="508" text-anchor="middle" font-size="9.5" fill="#555">target∈[left,mid)?</text>
  <text x="81" y="522" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">是→right=mid−1</text>

  <!-- No (right ordered) -->
  <path d="M 350 424 L 410 424 L 410 486" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="372" y="416" font-size="10.5" fill="#b85450" font-weight="bold">No</text>
  <rect x="310" y="490" width="150" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="385" y="508" text-anchor="middle" font-size="9.5" fill="#555">target∈(mid,right]?</text>
  <text x="385" y="522" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">是→left=mid+1</text>

  <!-- loop back -->
  <path d="M 81 530 L 81 535 L 230 535 L 230 540" stroke="#888" stroke-width="0" fill="none"/>
  <path d="M 81 530 L 81 545 L 430 545 L 430 160 L 340 160" stroke="#888" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <path d="M 385 530 L 385 545 L 430 545" stroke="#888" stroke-width="1.3" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <text x="230" y="528" text-anchor="middle" font-size="10" fill="#888" font-style="italic">两分支都回到循环顶部</text>
</svg>
