<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">有效前缀：|count0 - count1| &lt;= 1 即可重排为交替串</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">二进制串长 L 可重排成交替串，当且仅当 0 和 1 的数量之差不超过 1</text>

  <text x="40" y="80" font-size="12" fill="#333" font-weight="bold">s = "00101"，逐前缀统计：</text>

  <rect x="30" y="92" width="500" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="60" y="111" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">前缀</text>
  <text x="150" y="111" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">长度</text>
  <text x="230" y="111" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">c0</text>
  <text x="290" y="111" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">c1</text>
  <text x="370" y="111" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">|c0-c1|</text>
  <text x="470" y="111" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">有效?</text>

  <rect x="30" y="120" width="500" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="138" text-anchor="middle" font-size="11" fill="#333">"0"</text>
  <text x="150" y="138" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="230" y="138" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="290" y="138" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="370" y="138" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="470" y="138" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Yes</text>

  <rect x="30" y="146" width="500" height="26" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="164" text-anchor="middle" font-size="11" fill="#333">"00"</text>
  <text x="150" y="164" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="230" y="164" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="290" y="164" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="370" y="164" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="470" y="164" text-anchor="middle" font-size="11" fill="#b85450">No</text>

  <rect x="30" y="172" width="500" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="190" text-anchor="middle" font-size="11" fill="#333">"001"</text>
  <text x="150" y="190" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="230" y="190" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="290" y="190" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="370" y="190" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="470" y="190" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Yes</text>

  <rect x="30" y="198" width="500" height="26" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="216" text-anchor="middle" font-size="11" fill="#333">"0010"</text>
  <text x="150" y="216" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="230" y="216" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="290" y="216" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="370" y="216" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="470" y="216" text-anchor="middle" font-size="11" fill="#b85450">No</text>

  <rect x="30" y="224" width="500" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="242" text-anchor="middle" font-size="11" fill="#333">"00101"</text>
  <text x="150" y="242" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="230" y="242" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="290" y="242" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="370" y="242" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="470" y="242" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Yes</text>

  <g stroke="#dddddd" stroke-width="1">
    <line x1="100" y1="92" x2="100" y2="250" filter="url(#rough2)"/>
    <line x1="190" y1="92" x2="190" y2="250" filter="url(#rough2)"/>
    <line x1="270" y1="92" x2="270" y2="250" filter="url(#rough2)"/>
    <line x1="330" y1="92" x2="330" y2="250" filter="url(#rough2)"/>
    <line x1="420" y1="92" x2="420" y2="250" filter="url(#rough2)"/>
  </g>

  <rect x="30" y="270" width="500" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="292" font-size="11" fill="#333" font-weight="bold">重排示例："001" 的 c0=2, c1=1, |2-1|=1 &lt;= 1</text>
  <text x="50" y="310" font-size="10.5" fill="#555">两个 0 和一个 1，可排成 "010"（奇数位放多的那种字符）</text>
  <text x="50" y="326" font-size="10.5" fill="#555">偶数长度要求 c0==c1；奇数长度要求 |c0-c1|==1，合并即 |c0-c1|&lt;=1</text>

  <rect x="30" y="352" width="500" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="374" font-size="11" fill="#4a7a3a" font-weight="bold">答案：3 个有效前缀（"0"、"001"、"00101"）</text>
  <text x="50" y="392" font-size="10.5" fill="#555">逐字符累加 c0、c1，O(n) 一次遍历即可</text>
</svg>
