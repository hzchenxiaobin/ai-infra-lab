<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：gas=[1,2,3,4,5], cost=[3,4,5,1,2]</text>

  <!-- table header -->
  <rect x="30" y="44" width="540" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60"  y="63" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">i</text>
  <text x="120" y="63" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">diff</text>
  <text x="210" y="63" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">tank（累加）</text>
  <text x="320" y="63" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">动作</text>
  <text x="480" y="63" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">start</text>

  <!-- row i=0 -->
  <rect x="30" y="74" width="540" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60"  y="94" text-anchor="middle" font-size="11.5" fill="#333">0</text>
  <text x="120" y="94" text-anchor="middle" font-size="11.5" fill="#333">−2</text>
  <text x="210" y="94" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">−2 &lt; 0</text>
  <text x="320" y="94" text-anchor="middle" font-size="11.5" fill="#333">断油 → 跳过</text>
  <text x="480" y="94" text-anchor="middle" font-size="11.5" fill="#333">1</text>

  <!-- row i=1 -->
  <rect x="30" y="106" width="540" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60"  y="126" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="120" y="126" text-anchor="middle" font-size="11.5" fill="#333">−2</text>
  <text x="210" y="126" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">−2 &lt; 0</text>
  <text x="320" y="126" text-anchor="middle" font-size="11.5" fill="#333">断油 → 跳过</text>
  <text x="480" y="126" text-anchor="middle" font-size="11.5" fill="#333">2</text>

  <!-- row i=2 -->
  <rect x="30" y="138" width="540" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60"  y="158" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <text x="120" y="158" text-anchor="middle" font-size="11.5" fill="#333">−2</text>
  <text x="210" y="158" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">−2 &lt; 0</text>
  <text x="320" y="158" text-anchor="middle" font-size="11.5" fill="#333">断油 → 跳过</text>
  <text x="480" y="158" text-anchor="middle" font-size="11.5" fill="#333">3</text>

  <!-- row i=3 -->
  <rect x="30" y="170" width="540" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60"  y="190" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <text x="120" y="190" text-anchor="middle" font-size="11.5" fill="#333">+3</text>
  <text x="210" y="190" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">3 ≥ 0</text>
  <text x="320" y="190" text-anchor="middle" font-size="11.5" fill="#333">不断油 → 保持</text>
  <text x="480" y="190" text-anchor="middle" font-size="11.5" fill="#333">3</text>

  <!-- row i=4 -->
  <rect x="30" y="202" width="540" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60"  y="222" text-anchor="middle" font-size="11.5" fill="#333">4</text>
  <text x="120" y="222" text-anchor="middle" font-size="11.5" fill="#333">+3</text>
  <text x="210" y="222" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">6 ≥ 0</text>
  <text x="320" y="222" text-anchor="middle" font-size="11.5" fill="#333">不断油 → 保持</text>
  <text x="480" y="222" text-anchor="middle" font-size="11.5" fill="#333">3</text>

  <!-- total row -->
  <rect x="30" y="240" width="540" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="120" y="262" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">收尾判定</text>
  <text x="320" y="262" text-anchor="middle" font-size="11.5" fill="#333">total = −2−2−2+3+3 = 0 ≥ 0</text>
  <text x="480" y="262" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return 3 ⭐</text>

  <!-- verification box -->
  <rect x="30" y="288" width="540" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="50" y="310" font-size="11.5" fill="#446688" font-weight="bold">验证从 start=3 出发绕一圈：</text>
  <text x="50" y="330" font-size="11" fill="#333">3→4: 4−1=3 ； 4→0: 3+5−2=6 ； 0→1: 6+1−3=4 ； 1→2: 4+2−4=2 ； 2→3: 2+3−5=0</text>
  <text x="50" y="350" font-size="11" fill="#4a7a3a" font-weight="bold">回到起点 tank=0 ≥ 0，全程未断油，答案 3 正确 ✓</text>
</svg>
