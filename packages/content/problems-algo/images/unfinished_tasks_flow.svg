<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">每个班次的处理流程</text>

  <!-- start -->
  <rect x="60" y="60" width="120" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="120" y="85" text-anchor="middle" font-size="12" fill="#446688">读取班次时长 t</text>
  <path d="M180 80 L210 80" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision -->
  <polygon points="280,80 350,40 420,80 350,120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="78" text-anchor="middle" font-size="11" fill="#d6a040">done + t</text>
  <text x="350" y="93" text-anchor="middle" font-size="11" fill="#d6a040">≥ total ?</text>

  <!-- yes branch -->
  <path d="M350 120 L350 155" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="358" y="142" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="270" y="155" width="160" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="350" y="173" text-anchor="middle" font-size="11" fill="#4a7a3a">ans = 0</text>
  <text x="350" y="188" text-anchor="middle" font-size="11" fill="#4a7a3a">done = 0（重启）</text>

  <!-- no branch -->
  <path d="M280 80 L120 155" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="175" y="110" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="40" y="155" width="180" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="173" text-anchor="middle" font-size="11" fill="#b85450">done += t</text>
  <text x="130" y="190" text-anchor="middle" font-size="11" fill="#b85450">current = upper_bound(P,done)−1</text>
  <text x="130" y="205" text-anchor="middle" font-size="11" fill="#b85450">ans = m − current</text>

  <!-- merge to next -->
  <path d="M130 211 L130 240 L350 240 L350 211" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <rect x="170" y="250" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="275" text-anchor="middle" font-size="12" fill="#446688">输出 ans，进入下一班次</text>

  <!-- complexity -->
  <rect x="40" y="300" width="480" height="30" fill="#fafafa" stroke="#d8d8d8" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="60" y="320" font-size="12" fill="#666" filter="url(#rough2)">每次 upper_bound = O(log m)，共 k 个班次 → 总 O(k log m)</text>
</svg>
