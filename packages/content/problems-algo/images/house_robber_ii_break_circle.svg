<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">拆环为线：环形 → 两个线性子问题</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">首尾不能同时偷 → 剪开冲突边，分两种情况取 max</text>

  <!-- ===== Ring (circular houses) ===== -->
  <text x="105" y="72" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">环形排列</text>
  <g font-size="11">
    <!-- house 0 (top-left) -->
    <rect x="60" y="90" width="50" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="85" y="108" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">0</text>
    <text x="85" y="124" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>
    <!-- house 1 (top-right) -->
    <rect x="130" y="90" width="50" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="155" y="108" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">1</text>
    <text x="155" y="124" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">2</text>
    <!-- house 2 (bottom-right) -->
    <rect x="130" y="160" width="50" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="155" y="178" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="155" y="194" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">3</text>
    <!-- house 3 (bottom-left) -->
    <rect x="60" y="160" width="50" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="85" y="178" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">3</text>
    <text x="85" y="194" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>
  </g>
  <!-- ring edges -->
  <path d="M 110 112 L 130 112" stroke="#666" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 155 134 L 155 160" stroke="#666" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 130 182 L 110 182" stroke="#666" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <!-- conflict edge (0 <-> 3) dashed red -->
  <path d="M 85 160 L 85 134" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="48" y="150" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">冲突</text>
  <text x="48" y="162" text-anchor="middle" font-size="8" fill="#b85450">首尾相邻</text>

  <!-- scissors icon -->
  <text x="270" y="128" text-anchor="middle" font-size="22" fill="#888" filter="url(#rough2)">✂</text>
  <path d="M 210 145 L 330 145" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Case A: [0..n-2] ===== -->
  <text x="395" y="72" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">情况 A：不偷第 n-1 间</text>
  <text x="395" y="86" text-anchor="middle" font-size="9" fill="#888">在 [0..n-2] 上做线性 DP</text>
  <g font-size="11">
    <rect x="310" y="100" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="332" y="116" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">0</text>
    <text x="332" y="130" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>
    <rect x="356" y="100" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="378" y="116" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">1</text>
    <text x="378" y="130" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">2</text>
    <rect x="402" y="100" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="424" y="116" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="424" y="130" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">3</text>
    <!-- excluded house 3 -->
    <rect x="448" y="100" width="44" height="36" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" stroke-dasharray="4,3" filter="url(#rough2)"/>
    <text x="470" y="116" text-anchor="middle" font-size="9" fill="#bbb" font-weight="bold">3</text>
    <text x="470" y="130" text-anchor="middle" font-size="10" fill="#bbb" font-weight="bold">✗</text>
    <path d="M 354 118 L 356 118" stroke="#666" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
    <path d="M 400 118 L 402 118" stroke="#666" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  </g>
  <rect x="335" y="148" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="395" y="164" text-anchor="middle" font-family="monospace" font-size="11" fill="#446688" font-weight="bold">robA = 4</text>

  <!-- ===== Case B: [1..n-1] ===== -->
  <text x="395" y="200" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">情况 B：不偷第 0 间</text>
  <text x="395" y="214" text-anchor="middle" font-size="9" fill="#888">在 [1..n-1] 上做线性 DP</text>
  <g font-size="11">
    <rect x="310" y="228" width="44" height="36" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" stroke-dasharray="4,3" filter="url(#rough2)"/>
    <text x="332" y="244" text-anchor="middle" font-size="9" fill="#bbb" font-weight="bold">0</text>
    <text x="332" y="258" text-anchor="middle" font-size="10" fill="#bbb" font-weight="bold">✗</text>
    <rect x="356" y="228" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="378" y="244" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">1</text>
    <text x="378" y="258" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">2</text>
    <rect x="402" y="228" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="424" y="244" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="424" y="258" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="448" y="228" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="470" y="244" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">3</text>
    <text x="470" y="258" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>
    <path d="M 354 246 L 356 246" stroke="#666" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
    <path d="M 400 246 L 402 246" stroke="#666" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  </g>
  <rect x="335" y="276" width="120" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="395" y="292" text-anchor="middle" font-family="monospace" font-size="11" fill="#4a7a3a" font-weight="bold">robB = 3</text>

  <!-- ===== Max ===== -->
  <path d="M 395 174 L 395 196" stroke="none"/>
  <rect x="270" y="316" width="240" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="390" y="336" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">ans = max(robA, robB)</text>
  <text x="390" y="352" text-anchor="middle" font-family="monospace" font-size="11" fill="#555">= max(4, 3) = 4</text>
  <path d="M 395 300 L 395 316" stroke="#d6a040" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
