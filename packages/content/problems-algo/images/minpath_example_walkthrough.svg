<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：grid → dp 表逐格填入（行优先），右下角即答案</text>

  <!-- left: grid -->
  <text x="92" y="62" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">grid（输入）</text>
  <!-- row 0: path cells 1,3,1 -->
  <rect x="40" y="74" width="52" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="66" y="103" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="92" y="74" width="52" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="118" y="103" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">3</text>
  <rect x="144" y="74" width="52" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="103" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <!-- row 1: 1,5,1 (last is path) -->
  <rect x="40" y="118" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="66" y="147" text-anchor="middle" font-size="15" fill="#333">1</text>
  <rect x="92" y="118" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="147" text-anchor="middle" font-size="15" fill="#333">5</text>
  <rect x="144" y="118" width="52" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="147" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <!-- row 2: 4,2,1 (last is path) -->
  <rect x="40" y="162" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="66" y="191" text-anchor="middle" font-size="15" fill="#333">4</text>
  <rect x="92" y="162" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="191" text-anchor="middle" font-size="15" fill="#333">2</text>
  <rect x="144" y="162" width="52" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="191" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>

  <!-- optimal path on grid -->
  <path d="M 66 96 L 110 96" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 118 96 L 162 96" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 170 108 L 170 138" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 170 152 L 170 182" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- arrow between two grids -->
  <path d="M 210 142 L 250 142" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="230" y="134" text-anchor="middle" font-size="10.5" fill="#888">填表</text>

  <!-- right: dp -->
  <text x="366" y="62" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">dp（最小路径和）</text>
  <!-- row 0: 1,4,5 -->
  <rect x="290" y="74" width="52" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="316" y="103" text-anchor="middle" font-size="15" fill="#333">1</text>
  <rect x="342" y="74" width="52" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="368" y="103" text-anchor="middle" font-size="15" fill="#333">4</text>
  <rect x="394" y="74" width="52" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="420" y="103" text-anchor="middle" font-size="15" fill="#333">5</text>
  <!-- row 1: 2,7,6 -->
  <rect x="290" y="118" width="52" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="316" y="147" text-anchor="middle" font-size="15" fill="#333">2</text>
  <rect x="342" y="118" width="52" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="368" y="147" text-anchor="middle" font-size="15" fill="#333">7</text>
  <rect x="394" y="118" width="52" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="420" y="147" text-anchor="middle" font-size="15" fill="#333">6</text>
  <!-- row 2: 6,8,7 (answer) -->
  <rect x="290" y="162" width="52" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="316" y="191" text-anchor="middle" font-size="15" fill="#333">6</text>
  <rect x="342" y="162" width="52" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="368" y="191" text-anchor="middle" font-size="15" fill="#333">8</text>
  <rect x="394" y="162" width="52" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="420" y="191" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">7</text>

  <!-- fill order arrows on dp (row-major) -->
  <path d="M 316 96 L 360 96" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 368 96 L 412 96" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 420 108 L 316 140" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 316 140 L 360 140" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 368 140 L 412 140" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- note boxes -->
  <rect x="40" y="232" width="240" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="160" y="256" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">首行/首列：前缀累加</text>
  <text x="160" y="276" text-anchor="middle" font-size="11" fill="#555">dp[0][j]=dp[0][j−1]+g[0][j]</text>
  <text x="160" y="292" text-anchor="middle" font-size="11" fill="#555">dp[i][0]=dp[i−1][0]+g[i][0]</text>

  <rect x="290" y="232" width="240" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="410" y="256" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">内部格：取上/左较小者</text>
  <text x="410" y="276" text-anchor="middle" font-size="11" fill="#555">dp[1][1]=min(4,2)+5 = 7</text>
  <text x="410" y="292" text-anchor="middle" font-size="11" fill="#555">dp[2][2]=min(6,8)+1 = 7 ✓</text>

  <!-- bottom note -->
  <rect x="40" y="318" width="490" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="285" y="338" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">最优路径：1 → 3 → 1 → 1 → 1 = 7（右、右、下、下）</text>
  <text x="285" y="355" text-anchor="middle" font-size="10.5" fill="#888">网格含正数也可含 0，转移与符号无关；若有负数则不可走「负环」需另议</text>
</svg>
