<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="640" height="460" fill="#fafafa"/>
  <text x="320" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">把下标看成环:n 个循环相邻对,移位 = 在环上切一刀</text>

  <!-- 环 -->
  <circle cx="185" cy="250" r="100" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <!-- 读取方向箭头(顺时针) -->
  <path d="M 230 160 Q 248 168 258 182" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 节点 0(top): a -->
  <circle cx="185" cy="150" r="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="185" y="156" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">a</text>
  <text x="185" y="116" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">下标 0</text>

  <!-- 节点 1(right): b -->
  <circle cx="285" cy="250" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="285" y="256" text-anchor="middle" font-size="16" font-weight="bold" fill="#446688" filter="url(#rough2)">b</text>
  <text x="324" y="254" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">下标 1</text>

  <!-- 节点 2(bottom): c -->
  <circle cx="185" cy="350" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="185" y="356" text-anchor="middle" font-size="16" font-weight="bold" fill="#446688" filter="url(#rough2)">c</text>
  <text x="185" y="392" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">下标 2</text>

  <!-- 节点 3(left): a -->
  <circle cx="85" cy="250" r="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="85" y="256" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">a</text>
  <text x="48" y="254" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">下标 3</text>

  <!-- 循环对标注 -->
  <text x="292" y="158" font-size="11" fill="#999" filter="url(#rough2)">对(0,1):a≠b</text>
  <text x="292" y="352" font-size="11" fill="#999" filter="url(#rough2)">对(1,2):b≠c</text>
  <text x="30" y="352" font-size="11" fill="#999" filter="url(#rough2)">对(2,3):c≠a</text>
  <text x="28" y="158" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">对(3,0):a=a ✓</text>

  <!-- 切口:r = 2,断开对 (1,2) -->
  <line x1="242" y1="307" x2="270" y2="335" stroke="#b85450" stroke-width="2.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="300" y="312" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">✂ 切口 r = 2</text>
  <text x="300" y="330" font-size="10" fill="#b85450" filter="url(#rough2)">断开对 (1,2)</text>

  <!-- 右上说明框 -->
  <rect x="350" y="70" width="270" height="118" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="368" y="96" font-size="12" font-weight="bold" fill="#8a6420" filter="url(#rough2)">切口在下标 r−1 与 r 之间</text>
  <text x="368" y="120" font-size="11" fill="#555" filter="url(#rough2)">⇒ 移位 r 恰好断开循环对 (r−1, r)</text>
  <text x="368" y="142" font-size="11" fill="#555" filter="url(#rough2)">其余 n−1 个循环对全部保留,</text>
  <text x="368" y="162" font-size="11" fill="#555" filter="url(#rough2)">成为移位串的 n−1 个相邻对</text>

  <!-- 公式框 -->
  <rect x="350" y="206" width="270" height="104" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="368" y="232" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">score(r) = C − [断开的对相等]</text>
  <text x="368" y="256" font-size="11" fill="#555" filter="url(#rough2)">C = 环上字符相等的循环对总数</text>
  <text x="368" y="278" font-size="11" fill="#555" filter="url(#rough2)">本例 C = 1(仅对 (3,0) 相等)</text>
  <text x="368" y="298" font-size="11" fill="#4a7a3a" filter="url(#rough2)">对 (1,2) 不相等 ⇒ 不扣分</text>

  <!-- 底部结果框 -->
  <rect x="40" y="404" width="560" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="431" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">r = 2 ⇒ 移位串 caab:c≠a, a=a ✓, a≠b ⇒ score = 1 = C − 0</text>
</svg>
