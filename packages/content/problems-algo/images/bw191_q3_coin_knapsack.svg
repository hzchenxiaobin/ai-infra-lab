<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">完全背包：面值 T(L) 的硬币，铸造费 L+1，无限件</text>

  <!-- ============ 左：硬币清单 ============ -->
  <text x="170" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">硬币清单（段长 L）</text>
  <g filter="url(#rough2)">
    <!-- 表头行 -->
    <rect x="50" y="74" width="90" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="142" y="74" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="188" y="74" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="234" y="74" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="280" y="74" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <!-- 行1 面值 -->
    <rect x="50" y="106" width="90" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="142" y="106" width="44" height="30" rx="4" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="188" y="106" width="44" height="30" rx="4" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="234" y="106" width="44" height="30" rx="4" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="280" y="106" width="44" height="30" rx="4" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2"/>
    <!-- 行2 费用 -->
    <rect x="50" y="138" width="90" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="142" y="138" width="44" height="30" rx="4" fill="#fafafa" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="188" y="138" width="44" height="30" rx="4" fill="#fafafa" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="234" y="138" width="44" height="30" rx="4" fill="#fafafa" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="280" y="138" width="44" height="30" rx="4" fill="#fafafa" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="95" y="94" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">段长 L</text>
  <text x="95" y="126" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">面值 T(L)</text>
  <text x="95" y="158" text-anchor="middle" font-size="11.5" fill="#8a6420" filter="url(#rough2)">费用 L+1</text>
  <text x="164" y="94" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1</text>
  <text x="210" y="94" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">2</text>
  <text x="256" y="94" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">3</text>
  <text x="302" y="94" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">4</text>
  <text x="164" y="126" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="210" y="126" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="256" y="126" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">6</text>
  <text x="302" y="126" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">10</text>
  <text x="164" y="158" text-anchor="middle" font-size="12" fill="#8a6420" filter="url(#rough2)">2</text>
  <text x="210" y="158" text-anchor="middle" font-size="12" fill="#8a6420" filter="url(#rough2)">3</text>
  <text x="256" y="158" text-anchor="middle" font-size="12" fill="#8a6420" filter="url(#rough2)">4</text>
  <text x="302" y="158" text-anchor="middle" font-size="12" fill="#8a6420" filter="url(#rough2)">5</text>
  <text x="350" y="126" font-size="12" fill="#888" filter="url(#rough2)">⋯</text>

  <rect x="50" y="186" width="292" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="196" y="208" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">面值 1, 3, 6, 10, 15, 21, …（三角形数）</text>
  <text x="196" y="230" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">同一面值可重复使用：[3,3] = 两枚「3 号硬币」</text>

  <rect x="50" y="262" width="292" height="66" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="196" y="286" text-anchor="middle" font-size="11.5" fill="#8a6420" filter="url(#rough2)">硬币种数 = 满足 T(L) ≤ n 的最大 L</text>
  <text x="196" y="308" text-anchor="middle" font-size="11.5" fill="#8a6420" filter="url(#rough2)">n = 10⁵ 时仅 446 种（T(446)=99681）= O(√n)</text>

  <!-- ============ 右：DP 流程 ============ -->
  <text x="490" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">DP 转移（正序 = 无限件）</text>

  <rect x="375" y="74" width="230" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">初始化：f[0] = 0</text>
  <text x="490" y="108" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">f[s] = +∞（s &gt; 0，恰好装满）</text>

  <path d="M 490 118 v 18" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="500" y="134" font-size="10" fill="#888" filter="url(#rough2)">枚举段长 L，正序扫 s</text>

  <rect x="375" y="142" width="230" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490" y="161" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">f[s] = min( f[s],</text>
  <text x="490" y="179" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">f[s − T(L)] + (L+1) )</text>

  <path d="M 490 192 v 18" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="375" y="216" width="230" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="490" y="235" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">答案 = f[n] − 1</text>
  <text x="490" y="253" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">（退还最后一段的垫背跳过日）</text>

  <rect x="375" y="282" width="230" height="46" rx="8" fill="#fafafa" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="490" y="301" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">时间 O(n·√n)：446 种硬币 ×</text>
  <text x="490" y="319" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">O(n) 转移 ≈ 3×10⁷；空间 O(n)</text>

  <text x="320" y="366" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">「恰好装满」的最少费用 —— 零钱兑换 322 题的完全背包原型</text>
  <text x="320" y="386" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">L=1 的硬币面值 1 先处理，此后所有状态可达，无 +∞ 残留</text>
</svg>
