<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="500" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="16" fill="#444" font-weight="bold">区间 DP 四大题型：按操作语义分类</text>

  <!-- ===== Row 1: Merge type ===== -->
  <rect x="30" y="50" width="280" height="180" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="170" y="74" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">① 合并型</text>
  <text x="170" y="92" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">切点 k = 「最后合并哪个」</text>

  <!-- mini diagram: [i k] + [k+1 j] -> [i,j] -->
  <rect x="50" y="105" width="44" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="72" y="120" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">[i,k]</text>
  <text x="100" y="120" font-size="11" fill="#888" filter="url(#rough2)">+</text>
  <rect x="110" y="105" width="56" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="138" y="120" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">[k+1,j]</text>
  <path d="M 172 116 L 196 116" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="200" y="105" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="225" y="120" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">[i,j]</text>

  <text x="50" y="146" font-size="10" fill="#555" filter="url(#rough2)">dp[i][j] = max over k:</text>
  <text x="50" y="162" font-size="10" fill="#4a7a3a" font-family="monospace" filter="url(#rough2)">  dp[i][k]+dp[k][j]+cost(i,k,j)</text>
  <text x="50" y="184" font-size="10" fill="#888" filter="url(#rough2)">复杂度 O(n³)，甜区 n≤500</text>
  <text x="50" y="202" font-size="10" fill="#333" filter="url(#rough2)">代表：戳气球312、合并石头1000</text>
  <text x="50" y="218" font-size="10" fill="#333" filter="url(#rough2)">      矩阵链乘、三角剖分1039</text>

  <!-- ===== Row 1: Palindrome type ===== -->
  <rect x="330" y="50" width="280" height="180" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="470" y="74" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">② 回文型</text>
  <text x="470" y="92" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">无切点，两端缩进</text>

  <!-- mini diagram: i and j pair -->
  <rect x="360" y="105" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="374" y="120" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="400" y="120" font-size="9" fill="#888" filter="url(#rough2)">...</text>
  <rect x="430" y="105" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="444" y="120" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">j</text>
  <path d="M 374 127 L 444 127" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="470" y="120" font-size="9" fill="#d6a040" filter="url(#rough2)">配对?</text>

  <text x="350" y="146" font-size="10" fill="#555" filter="url(#rough2)">s[i]==s[j]: dp[i+1][j-1]</text>
  <text x="350" y="162" font-size="10" fill="#555" filter="url(#rough2)">s[i]!=s[j]: min(左,右)+1</text>
  <text x="350" y="184" font-size="10" fill="#888" filter="url(#rough2)">复杂度 O(n²)，可滚动 O(n) 空间</text>
  <text x="350" y="202" font-size="10" fill="#333" filter="url(#rough2)">代表：最少插入1312、LPS516</text>
  <text x="350" y="218" font-size="10" fill="#333" filter="url(#rough2)">      最长回文子串5、回文子串647</text>

  <!-- ===== Row 2: Game type ===== -->
  <rect x="30" y="250" width="280" height="180" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="170" y="274" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">③ 博弈型</text>
  <text x="170" y="292" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">无切点，两端取（Minimax）</text>

  <!-- mini diagram: take left or right -->
  <rect x="50" y="305" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="64" y="320" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="90" y="320" font-size="9" fill="#888" filter="url(#rough2)">...</text>
  <rect x="120" y="305" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="134" y="320" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">j</text>
  <text x="160" y="320" font-size="9" fill="#446688" filter="url(#rough2)">← 二选一</text>

  <text x="50" y="346" font-size="10" fill="#555" filter="url(#rough2)">dp[i][j] = max(</text>
  <text x="50" y="362" font-size="10" fill="#446688" font-family="monospace" filter="url(#rough2)">  nums[i]-dp[i+1][j],</text>
  <text x="50" y="378" font-size="10" fill="#446688" font-family="monospace" filter="url(#rough2)">  nums[j]-dp[i][j-1])</text>
  <text x="50" y="400" font-size="10" fill="#888" filter="url(#rough2)">「-dp」= 对手最优 = 我的负最优</text>
  <text x="50" y="418" font-size="10" fill="#333" filter="url(#rough2)">代表：石子游戏877/1140、486</text>

  <!-- ===== Row 2: Partition type ===== -->
  <rect x="330" y="250" width="280" height="180" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="470" y="274" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">④ 分割型</text>
  <text x="470" y="292" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">切点 k = 「最后一刀切在哪」</text>

  <!-- mini diagram: cut at k -->
  <rect x="350" y="305" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="390" y="320" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">前缀 [0,k]</text>
  <path d="M 432 316 L 448 316" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="452" y="305" width="80" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="492" y="320" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">后缀 [k+1,i]</text>
  <text x="392" y="340" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">↑ 第 j 刀</text>

  <text x="350" y="360" font-size="10" fill="#555" filter="url(#rough2)">dp[i] = min over k:</text>
  <text x="350" y="376" font-size="10" fill="#b85450" font-family="monospace" filter="url(#rough2)">  dp[k-1]+1 (若 s[k..i] 合法)</text>
  <text x="350" y="398" font-size="10" fill="#888" filter="url(#rough2)">常配「预处理表」两阶段</text>
  <text x="350" y="416" font-size="10" fill="#333" filter="url(#rough2)">代表：分割回文串II 132、131</text>
  <text x="350" y="432" font-size="10" fill="#333" filter="url(#rough2)">      单词拆分139、1278</text>

  <!-- bottom legend -->
  <rect x="40" y="450" width="560" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="320" y="468" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">判断有无切点：转移方程里有 `for k in range(i,j)` → 有切点（O(n³)）；只看两端缩进 → 无切点（O(n²)）</text>
  <text x="320" y="482" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">回文型/博弈型无切点；合并型/分割型有切点（分割型常退化为一维前缀 DP + 区间预处理表）</text>
</svg>
