<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="480" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "AABABBA", k = 1</text>
  <text x="270" y="42" text-anchor="middle" font-size="11" fill="#888">蓝框=窗口内，灰框=窗外；每步显示收缩后的窗口</text>

  <!-- index header: cells at x=50+i*44, width 44 -->
  <g font-size="10.5" fill="#888" text-anchor="middle">
    <text x="72" y="62">0</text><text x="116" y="62">1</text><text x="160" y="62">2</text>
    <text x="204" y="62">3</text><text x="248" y="62">4</text><text x="292" y="62">5</text><text x="336" y="62">6</text>
  </g>

  <!-- Step rows. rowTop(r) = 72 + r*50. cell y = rowTop, h=30 -->
  <!-- r=0: window [0,0] -->
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <text x="40" y="92" font-size="10.5" fill="#4a7a3a">r0</text>
    <rect x="50" y="76" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="72" y="97" fill="#446688">A</text>
    <rect x="94" y="76" width="44" height="30" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
    <text x="116" y="97" fill="#bbb">A</text>
    <rect x="138" y="76" width="44" height="30" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
    <text x="160" y="97" fill="#bbb">B</text>
    <rect x="182" y="76" width="44" height="30" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
    <text x="204" y="97" fill="#bbb">A</text>
    <rect x="226" y="76" width="44" height="30" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
    <text x="248" y="97" fill="#bbb">B</text>
    <rect x="270" y="76" width="44" height="30" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
    <text x="292" y="97" fill="#bbb">B</text>
    <rect x="314" y="76" width="44" height="30" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
    <text x="336" y="97" fill="#bbb">A</text>
  </g>
  <text x="380" y="97" font-size="11" fill="#4a7a3a" font-weight="bold">扩张 ✓ size=1</text>
  <text x="500" y="97" font-size="11" fill="#d6a040" font-weight="bold">len=1</text>

  <!-- r=1: window [0,1] -->
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <text x="40" y="142" font-size="10.5" fill="#4a7a3a">r1</text>
    <rect x="50" y="126" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="72" y="147" fill="#446688">A</text>
    <rect x="94" y="126" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="116" y="147" fill="#446688">A</text>
    <rect x="138" y="126" width="44" height="30" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
    <text x="160" y="147" fill="#bbb">B</text>
    <rect x="182" y="126" width="44" height="30" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
    <text x="204" y="147" fill="#bbb">A</text>
    <rect x="226" y="126" width="44" height="30" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
    <text x="248" y="147" fill="#bbb">B</text>
    <rect x="270" y="126" width="44" height="30" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
    <text x="292" y="147" fill="#bbb">B</text>
    <rect x="314" y="126" width="44" height="30" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
    <text x="336" y="147" fill="#bbb">A</text>
  </g>
  <text x="380" y="147" font-size="11" fill="#4a7a3a" font-weight="bold">扩张 ✓ size=2</text>
  <text x="500" y="147" font-size="11" fill="#d6a040" font-weight="bold">len=2</text>

  <!-- r=2: window [0,2] AAB -->
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <text x="40" y="192" font-size="10.5" fill="#4a7a3a">r2</text>
    <rect x="50" y="176" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="72" y="197" fill="#446688">A</text>
    <rect x="94" y="176" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="116" y="197" fill="#446688">A</text>
    <rect x="138" y="176" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="160" y="197" fill="#446688">B</text>
    <rect x="182" y="176" width="44" height="30" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
    <text x="204" y="197" fill="#bbb">A</text>
    <rect x="226" y="176" width="44" height="30" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
    <text x="248" y="197" fill="#bbb">B</text>
    <rect x="270" y="176" width="44" height="30" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
    <text x="292" y="197" fill="#bbb">B</text>
    <rect x="314" y="176" width="44" height="30" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
    <text x="336" y="197" fill="#bbb">A</text>
  </g>
  <text x="380" y="197" font-size="11" fill="#4a7a3a" font-weight="bold">扩张 ✓ 3−2=1</text>
  <text x="500" y="197" font-size="11" fill="#d6a040" font-weight="bold">len=3</text>

  <!-- r=3: window [0,3] AABA -->
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <text x="40" y="242" font-size="10.5" fill="#4a7a3a">r3</text>
    <rect x="50" y="226" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="72" y="247" fill="#446688">A</text>
    <rect x="94" y="226" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="116" y="247" fill="#446688">A</text>
    <rect x="138" y="226" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="160" y="247" fill="#446688">B</text>
    <rect x="182" y="226" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="204" y="247" fill="#446688">A</text>
    <rect x="226" y="226" width="44" height="30" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
    <text x="248" y="247" fill="#bbb">B</text>
    <rect x="270" y="226" width="44" height="30" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
    <text x="292" y="247" fill="#bbb">B</text>
    <rect x="314" y="226" width="44" height="30" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
    <text x="336" y="247" fill="#bbb">A</text>
  </g>
  <text x="380" y="247" font-size="11" fill="#4a7a3a" font-weight="bold">扩张 ✓ 4−3=1</text>
  <text x="500" y="247" font-size="11" fill="#d6a040" font-weight="bold">len=4</text>

  <!-- r=4: illegal -> shift left 0->1, window [1,4] ABAB -->
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <text x="40" y="292" font-size="10.5" fill="#b85450">r4</text>
    <rect x="50" y="276" width="44" height="30" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
    <text x="72" y="297" fill="#bbb">A</text>
    <rect x="94" y="276" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="116" y="297" fill="#446688">A</text>
    <rect x="138" y="276" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="160" y="297" fill="#446688">B</text>
    <rect x="182" y="276" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="204" y="297" fill="#446688">A</text>
    <rect x="226" y="276" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="248" y="297" fill="#446688">B</text>
    <rect x="270" y="276" width="44" height="30" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
    <text x="292" y="297" fill="#bbb">B</text>
    <rect x="314" y="276" width="44" height="30" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
    <text x="336" y="297" fill="#bbb">A</text>
  </g>
  <text x="380" y="297" font-size="11" fill="#b85450" font-weight="bold">非法 → left++</text>
  <text x="500" y="297" font-size="11" fill="#d6a040" font-weight="bold">len=4</text>

  <!-- r=5: illegal -> shift left 1->2, window [2,5] BABB -->
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <text x="40" y="342" font-size="10.5" fill="#b85450">r5</text>
    <rect x="50" y="326" width="44" height="30" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
    <text x="72" y="347" fill="#bbb">A</text>
    <rect x="94" y="326" width="44" height="30" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
    <text x="116" y="347" fill="#bbb">A</text>
    <rect x="138" y="326" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="160" y="347" fill="#446688">B</text>
    <rect x="182" y="326" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="204" y="347" fill="#446688">A</text>
    <rect x="226" y="326" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="248" y="347" fill="#446688">B</text>
    <rect x="270" y="326" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="292" y="347" fill="#446688">B</text>
    <rect x="314" y="326" width="44" height="30" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
    <text x="336" y="347" fill="#bbb">A</text>
  </g>
  <text x="380" y="347" font-size="11" fill="#b85450" font-weight="bold">非法 → left++</text>
  <text x="500" y="347" font-size="11" fill="#d6a040" font-weight="bold">len=4</text>

  <!-- r=6: illegal -> shift left 2->3, window [3,6] ABBA -->
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <text x="40" y="392" font-size="10.5" fill="#b85450">r6</text>
    <rect x="50" y="376" width="44" height="30" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
    <text x="72" y="397" fill="#bbb">A</text>
    <rect x="94" y="376" width="44" height="30" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
    <text x="116" y="397" fill="#bbb">A</text>
    <rect x="138" y="376" width="44" height="30" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
    <text x="160" y="397" fill="#bbb">B</text>
    <rect x="182" y="376" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="204" y="397" fill="#446688">A</text>
    <rect x="226" y="376" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="248" y="397" fill="#446688">B</text>
    <rect x="270" y="376" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="292" y="397" fill="#446688">B</text>
    <rect x="314" y="376" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="336" y="397" fill="#446688">A</text>
  </g>
  <text x="380" y="397" font-size="11" fill="#b85450" font-weight="bold">非法 → left++</text>
  <text x="500" y="397" font-size="11" fill="#d6a040" font-weight="bold">len=4</text>

  <!-- conclusion -->
  <rect x="40" y="424" width="460" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="270" y="445" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">窗口峰值出现在 r=3："AABA" → "AAAA"</text>
  <text x="270" y="462" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">答案 maxLen = 4</text>
</svg>
