<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrDown" markerWidth="10" markerHeight="10" refX="5" refY="9" orient="auto">
      <path d="M 0 0 L 5 10 L 10 0 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">重排链表 = 找中点 → 反转右半 → 交错合并</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">三步都在原链表上原地完成，只用 O(1) 额外指针</text>

  <!-- pipeline down arrows -->
  <line x1="64" y1="118" x2="64" y2="138" stroke="#888" stroke-width="1.5" marker-end="url(#arrDown)" filter="url(#rough2)"/>
  <line x1="64" y1="194" x2="64" y2="214" stroke="#888" stroke-width="1.5" marker-end="url(#arrDown)" filter="url(#rough2)"/>
  <line x1="64" y1="270" x2="64" y2="290" stroke="#888" stroke-width="1.5" marker-end="url(#arrDown)" filter="url(#rough2)"/>

  <!-- ===== Row 1: 原链表 1→2→3→4→5 ===== -->
  <text x="24" y="96" font-size="12" fill="#444" font-weight="bold">原链表</text>
  <g font-size="12">
    <rect x="110" y="76" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="131" y="96" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <line x1="152" y1="91" x2="168" y2="91" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="174" y="76" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="195" y="96" text-anchor="middle" fill="#333" font-weight="bold">2</text>
    <line x1="216" y1="91" x2="232" y2="91" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="238" y="76" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="259" y="96" text-anchor="middle" fill="#333" font-weight="bold">3</text>
    <line x1="280" y1="91" x2="296" y2="91" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="302" y="76" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="323" y="96" text-anchor="middle" fill="#333" font-weight="bold">4</text>
    <line x1="344" y1="91" x2="360" y2="91" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="366" y="76" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="387" y="96" text-anchor="middle" fill="#333" font-weight="bold">5</text>
  </g>

  <!-- ===== Row 2: ① 找中点并断开 ===== -->
  <text x="24" y="166" font-size="12" fill="#444" font-weight="bold">① 找中点</text>
  <text x="24" y="180" font-size="10" fill="#888">并断开</text>
  <g font-size="12">
    <rect x="110" y="148" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="131" y="168" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <line x1="152" y1="163" x2="168" y2="163" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="174" y="148" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="195" y="168" text-anchor="middle" fill="#333" font-weight="bold">2</text>
    <line x1="216" y1="163" x2="232" y2="163" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="238" y="148" width="42" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="5" filter="url(#rough2)"/>
    <text x="259" y="168" text-anchor="middle" fill="#333" font-weight="bold">3</text>
    <text x="259" y="142" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">slow</text>
    <!-- cut indicator -->
    <line x1="291" y1="144" x2="291" y2="182" stroke="#b85450" stroke-width="1.8" stroke-dasharray="3,2" filter="url(#rough2)"/>
    <text x="291" y="139" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">断</text>
    <rect x="302" y="148" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="323" y="168" text-anchor="middle" fill="#333" font-weight="bold">4</text>
    <line x1="344" y1="163" x2="360" y2="163" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
    <rect x="366" y="148" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="387" y="168" text-anchor="middle" fill="#333" font-weight="bold">5</text>
    <text x="323" y="142" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">右半</text>
  </g>

  <!-- ===== Row 3: ② 反转右半 5→4 ===== -->
  <text x="24" y="242" font-size="12" fill="#444" font-weight="bold">② 反转右半</text>
  <g font-size="12">
    <rect x="110" y="224" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="131" y="244" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <line x1="152" y1="239" x2="168" y2="239" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="174" y="224" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="195" y="244" text-anchor="middle" fill="#333" font-weight="bold">2</text>
    <line x1="216" y1="239" x2="232" y2="239" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="238" y="224" width="42" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="259" y="244" text-anchor="middle" fill="#333" font-weight="bold">3</text>
    <line x1="291" y1="220" x2="291" y2="258" stroke="#b85450" stroke-width="1.8" stroke-dasharray="3,2" filter="url(#rough2)"/>
    <text x="291" y="215" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">断</text>
    <rect x="302" y="224" width="42" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="5" filter="url(#rough2)"/>
    <text x="323" y="244" text-anchor="middle" fill="#b85450" font-weight="bold">5</text>
    <line x1="344" y1="239" x2="360" y2="239" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrRed)" filter="url(#rough2)"/>
    <rect x="366" y="224" width="42" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="387" y="244" text-anchor="middle" fill="#b85450" font-weight="bold">4</text>
    <text x="323" y="218" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">反转后</text>
  </g>

  <!-- ===== Row 4: ③ 交错合并 1→5→2→4→3 ===== -->
  <text x="24" y="318" font-size="12" fill="#444" font-weight="bold">③ 交错合并</text>
  <g font-size="12">
    <rect x="110" y="300" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="131" y="320" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <line x1="152" y1="315" x2="168" y2="315" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrRed)" filter="url(#rough2)"/>
    <rect x="174" y="300" width="42" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="5" filter="url(#rough2)"/>
    <text x="195" y="320" text-anchor="middle" fill="#b85450" font-weight="bold">5</text>
    <line x1="216" y1="315" x2="232" y2="315" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="238" y="300" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="259" y="320" text-anchor="middle" fill="#333" font-weight="bold">2</text>
    <line x1="280" y1="315" x2="296" y2="315" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrRed)" filter="url(#rough2)"/>
    <rect x="302" y="300" width="42" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="323" y="320" text-anchor="middle" fill="#b85450" font-weight="bold">4</text>
    <line x1="344" y1="315" x2="360" y2="315" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="366" y="300" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="387" y="320" text-anchor="middle" fill="#333" font-weight="bold">3</text>
  </g>
  <text x="300" y="346" text-anchor="middle" font-size="10" fill="#888">蓝=前半  红=反转后的右半  橙=中点(前半末节点)</text>

  <!-- footer -->
  <rect x="30" y="362" width="540" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="44" y="382" font-size="11" fill="#4a7a3a" font-weight="bold">关键观察：</text>
  <text x="44" y="400" font-size="10" fill="#555">把"重排"拆成三个独立原子操作——找中点(876)、反转(206)、合并。</text>
  <text x="44" y="415" font-size="10" fill="#555">前半长度 ≥ 后半，合并时右半先耗尽，while(second) 自然结束，无需特判。</text>
</svg>
