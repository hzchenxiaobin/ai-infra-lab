<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">电梯请求 I：依次处理，累加楼层差</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">从 0 层出发，每步耗时 |当前 - 目标| 秒，已在目标层则 0 秒</text>

  <text x="40" y="74" font-size="12" fill="#333" font-weight="bold">n = 5, requests = [2, 1, 4, 3]</text>

  <rect x="40" y="90" width="40" height="250" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="340" text-anchor="middle" font-size="10" fill="#888">楼层</text>
  <text x="60" y="102" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="60" y="152" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="60" y="202" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="60" y="252" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="60" y="302" text-anchor="middle" font-size="11" fill="#333">0</text>
  <line x1="70" y1="97" x2="70" y2="307" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <rect x="110" y="294" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="312" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="130" y="338" text-anchor="middle" font-size="10" fill="#888">起点</text>

  <path d="M 150 307 Q 175 200 190 207" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="260" font-size="10" fill="#b85450" font-weight="bold">+2s</text>

  <rect x="190" y="194" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="212" text-anchor="middle" font-size="11" fill="#333">2</text>

  <path d="M 230 207 L 260 247" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="240" y="220" font-size="10" fill="#b85450" font-weight="bold">+1s</text>

  <rect x="260" y="244" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="262" text-anchor="middle" font-size="11" fill="#333">1</text>

  <path d="M 300 247 Q 330 150 360 97" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="180" font-size="10" fill="#b85450" font-weight="bold">+3s</text>

  <rect x="360" y="94" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="112" text-anchor="middle" font-size="11" fill="#333">4</text>

  <path d="M 400 97 L 430 147" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="118" font-size="10" fill="#b85450" font-weight="bold">+1s</text>

  <rect x="430" y="144" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="450" y="162" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="450" y="188" text-anchor="middle" font-size="10" fill="#4a7a3a">终点</text>

  <rect x="30" y="292" width="480" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="314" font-size="12" fill="#4a7a3a" font-weight="bold">总时间 = 2 + 1 + 3 + 1 = 7 秒</text>
  <text x="50" y="334" font-size="10.5" fill="#555">ans = sum(|requests[i] - prev|), prev 初始为 0</text>
</svg>
