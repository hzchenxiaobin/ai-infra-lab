<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">状态分层：交易次数 = 第三个维度</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">每上一层多用一笔交易，买入消耗一笔、卖出在同一层内完成</text>

  <!-- ===== Layer 2 (top) ===== -->
  <g font-size="11">
    <rect x="115" y="88" width="90" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
    <text x="160" y="110" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">hold[2]</text>
    <text x="160" y="128" text-anchor="middle" font-size="9" fill="#b85450">第2笔·持有</text>

    <rect x="335" y="88" width="90" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
    <text x="380" y="110" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">free[2]</text>
    <text x="380" y="128" text-anchor="middle" font-size="9" fill="#446688">第2笔·空仓</text>
  </g>

  <!-- ===== Layer 1 (mid) ===== -->
  <g font-size="11">
    <rect x="115" y="188" width="90" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
    <text x="160" y="210" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">hold[1]</text>
    <text x="160" y="228" text-anchor="middle" font-size="9" fill="#b85450">第1笔·持有</text>

    <rect x="335" y="188" width="90" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
    <text x="380" y="210" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">free[1]</text>
    <text x="380" y="228" text-anchor="middle" font-size="9" fill="#446688">第1笔·空仓</text>
  </g>

  <!-- ===== Layer 0 (base) ===== -->
  <g font-size="11">
    <rect x="225" y="288" width="90" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
    <text x="270" y="310" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">free[0]</text>
    <text x="270" y="328" text-anchor="middle" font-size="9" fill="#4a7a3a">基底 ≡ 0 · 不持有</text>
  </g>

  <!-- ===== buy edges (green, consume a transaction, go up-left) ===== -->
  <!-- free[0] -> hold[1] -->
  <path d="M 250 290 Q 200 250 175 242" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="186" y="262" width="104" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="238" y="276" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">买入 −p（用第1笔）</text>

  <!-- free[1] -> hold[2] -->
  <path d="M 365 188 Q 300 150 175 142" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="246" y="158" width="104" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="298" y="172" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">买入 −p（用第2笔）</text>

  <!-- ===== sell edges (red, within layer, hold -> free) ===== -->
  <!-- hold[1] -> free[1] -->
  <path d="M 207 214 L 332 214" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <rect x="232" y="196" width="74" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="269" y="209" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">卖出 +p</text>

  <!-- hold[2] -> free[2] -->
  <path d="M 207 114 L 332 114" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <rect x="232" y="96" width="74" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="269" y="109" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">卖出 +p</text>

  <!-- ===== rest self-loops ===== -->
  <path d="M 348 188 C 332 172, 348 160, 362 178" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="346" y="166" text-anchor="middle" font-size="8" fill="#666">休息</text>
  <path d="M 128 188 C 112 172, 128 160, 142 178" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="126" y="166" text-anchor="middle" font-size="8" fill="#666">持有</text>

  <!-- ===== layer rails ===== -->
  <text x="60" y="118" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">第2层</text>
  <text x="60" y="218" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">第1层</text>
  <text x="60" y="318" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">第0层</text>

  <!-- ===== note ===== -->
  <rect x="40" y="350" width="460" height="22" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="270" y="365" text-anchor="middle" font-size="10" fill="#444">k 层 = 至多 k 笔交易；hold[0]≡−∞（0 笔不能持有）；答案取 free[k]</text>
</svg>
