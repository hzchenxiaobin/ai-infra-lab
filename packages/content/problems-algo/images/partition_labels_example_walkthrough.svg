<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="480" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = “ababcbacadefegdehijhklij”</text>
  <text x="300" y="42" text-anchor="middle" font-size="11" fill="#888">每次 i 走到 end 即切一刀；★ 标出锁定 end 的字符</text>

  <!-- Panel 1: ababcbaca, 9 cells, width 40, start x=46 -->
  <text x="46" y="74" font-size="12" fill="#446688" font-weight="bold">片段①  i: 0 → 8</text>
  <rect x="46"  y="82" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="66"  y="104" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="86"  y="82" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="106" y="104" text-anchor="middle" font-size="13" fill="#333">b</text>
  <rect x="126" y="82" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="146" y="104" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="166" y="82" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="186" y="104" text-anchor="middle" font-size="13" fill="#333">b</text>
  <rect x="206" y="82" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="226" y="104" text-anchor="middle" font-size="13" fill="#333">c</text>
  <rect x="246" y="82" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="266" y="104" text-anchor="middle" font-size="13" fill="#333">b</text>
  <rect x="286" y="82" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="306" y="104" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="326" y="82" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="346" y="104" text-anchor="middle" font-size="13" fill="#333">c</text>
  <rect x="366" y="82" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="386" y="104" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">a★</text>
  <text x="386" y="76" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">last a@8</text>
  <!-- bracket -->
  <path d="M 46 128 Q 46 136 54 136 L 398 136 Q 406 136 406 128" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="226" y="156" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">end=8（被 ‘a’ 锁定）  长度 = 9  ✓</text>

  <!-- Panel 2: defegde, 7 cells, start x=120 -->
  <text x="120" y="196" font-size="12" fill="#446688" font-weight="bold">片段②  i: 9 → 15</text>
  <rect x="120" y="204" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="226" text-anchor="middle" font-size="13" fill="#333">d</text>
  <rect x="160" y="204" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="180" y="226" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">e</text>
  <rect x="200" y="204" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="226" text-anchor="middle" font-size="13" fill="#333">f</text>
  <rect x="240" y="204" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="226" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">e</text>
  <rect x="280" y="204" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="226" text-anchor="middle" font-size="13" fill="#333">g</text>
  <rect x="320" y="204" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="226" text-anchor="middle" font-size="13" fill="#333">d</text>
  <rect x="360" y="204" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="380" y="226" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">e★</text>
  <text x="380" y="198" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">last e@15</text>
  <path d="M 120 250 Q 120 258 128 258 L 392 258 Q 400 258 400 250" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="260" y="278" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">end=15（被 ‘e’ 锁定）  长度 = 7  ✓</text>

  <!-- Panel 3: hijhklij, 8 cells, start x=100 -->
  <text x="100" y="318" font-size="12" fill="#446688" font-weight="bold">片段③  i: 16 → 23</text>
  <rect x="100" y="326" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="348" text-anchor="middle" font-size="13" fill="#333">h</text>
  <rect x="140" y="326" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="348" text-anchor="middle" font-size="13" fill="#333">i</text>
  <rect x="180" y="326" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="200" y="348" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">j★</text>
  <text x="200" y="320" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">last j@23</text>
  <rect x="220" y="326" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="348" text-anchor="middle" font-size="13" fill="#333">h</text>
  <rect x="260" y="326" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="348" text-anchor="middle" font-size="13" fill="#333">k</text>
  <rect x="300" y="326" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="348" text-anchor="middle" font-size="13" fill="#333">l</text>
  <rect x="340" y="326" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="348" text-anchor="middle" font-size="13" fill="#333">i</text>
  <rect x="380" y="326" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="400" y="348" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">j</text>
  <path d="M 100 372 Q 100 380 108 380 L 412 380 Q 420 380 420 372" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="260" y="400" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">end=23（被 ‘j’ 锁定）  长度 = 8  ✓</text>

  <!-- answer box -->
  <rect x="60" y="424" width="480" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="300" y="451" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">答案 = [9, 7, 8]</text>
</svg>
