<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 370" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="600" height="370" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：三指针从后往前归并</text>

  <!-- ===== Start oval ===== -->
  <ellipse cx="300" cy="54" rx="44" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="58" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">开始</text>
  <path d="M 300 71 L 300 84" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Init box ===== -->
  <rect x="180" y="87" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="108" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">初始化 p1 = m−1, p2 = n−1, p = m+n−1</text>
  <path d="M 300 121 L 300 138" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Diamond 1: p2 >= 0 ? ===== -->
  <polygon points="300,140 376,164 300,188 224,164" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="168" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">p2 ≥ 0 ?</text>

  <!-- 否 -> End -->
  <path d="M 376 164 L 426 164" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="402" y="158" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  <ellipse cx="486" cy="164" rx="58" ry="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="486" y="160" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">结束</text>
  <text x="486" y="175" text-anchor="middle" font-size="9.5" fill="#b85450">nums1 已有序</text>

  <!-- 是 -> down -->
  <path d="M 300 188 L 300 214" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="206" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- ===== Diamond 2: p1>=0 && nums1[p1]>nums2[p2] ? ===== -->
  <polygon points="300,220 404,250 300,280 196,250" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="247" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">p1≥0 且</text>
  <text x="300" y="262" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">nums1[p1]&gt;nums2[p2]?</text>

  <!-- 是 -> right box -->
  <path d="M 404 250 L 438 250" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="422" y="244" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="440" y="229" width="124" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="502" y="246" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">nums1[p]=nums1[p1]</text>
  <text x="502" y="261" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">p1−−; p−−</text>

  <!-- 否 -> left box -->
  <path d="M 196 250 L 162 250" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="244" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  <rect x="36" y="229" width="124" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="98" y="246" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">nums1[p]=nums2[p2]</text>
  <text x="98" y="261" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">p2−−; p−−</text>

  <!-- ===== merge connectors ===== -->
  <path d="M 502 271 L 502 320" stroke="#888" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 98 271 L 98 320" stroke="#888" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 98 320 L 502 320" stroke="#888" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- ===== return loop back to Diamond 1 ===== -->
  <path d="M 98 320 L 24 320 L 24 164 L 222 164" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="42" y="312" font-size="10.5" fill="#d6a040" font-weight="bold">循环</text>
  <text x="24" y="150" text-anchor="middle" font-size="9.5" fill="#d6a040">回到判断</text>

  <!-- ===== note ===== -->
  <rect x="120" y="338" width="360" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="355" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">循环只在 p2≥0 时进行：nums2 耗尽即结束</text>
</svg>
