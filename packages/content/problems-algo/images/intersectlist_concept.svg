<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
    <marker id="arro" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>
  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">双指针「换头」：把两条不等长链表拼成等长</text>

  <!-- ===== A 独有段 (a=2) ===== -->
  <text x="40" y="66" font-size="11" fill="#446688" font-weight="bold">headA</text>
  <g filter="url(#rough2)">
    <rect x="80" y="58" width="40" height="28" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="100" y="77" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <line x1="120" y1="72" x2="150" y2="72" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="156" y="58" width="40" height="28" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="176" y="77" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <path d="M 196 86 Q 230 110 244 138" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== B 独有段 (b=3) ===== -->
  <text x="40" y="276" font-size="11" fill="#4a7a3a" font-weight="bold">headB</text>
  <g filter="url(#rough2)">
    <rect x="80" y="262" width="40" height="28" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="100" y="281" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <line x1="120" y1="276" x2="150" y2="276" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="156" y="262" width="40" height="28" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="176" y="281" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <line x1="196" y1="276" x2="226" y2="276" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="232" y="262" width="40" height="28" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="252" y="281" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <path d="M 272 262 Q 280 230 270 188" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== 相交点 + 共享后缀 (c=3) ===== -->
  <g filter="url(#rough2)">
    <rect x="248" y="150" width="44" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
  </g>
  <text x="270" y="171" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">8</text>
  <line x1="292" y1="166" x2="322" y2="166" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="328" y="150" width="40" height="32" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="348" y="171" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <line x1="368" y1="166" x2="398" y2="166" stroke="#b85450" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="404" y="150" width="40" height="32" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="424" y="171" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <line x1="444" y1="166" x2="472" y2="166" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="486" y="171" font-size="11" fill="#888">∅</text>
  <text x="270" y="142" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">相交点</text>

  <!-- ===== 区段长度标注 a / b / c ===== -->
  <text x="138" y="50" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">a = 2（A 独有）</text>
  <text x="176" y="312" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">b = 3（B 独有）</text>
  <text x="360" y="142" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">c = 3（共享后缀）</text>

  <!-- ===== 换头跳转虚线 ===== -->
  <path d="M 486 158 Q 540 60 120 60" stroke="#d6a040" stroke-width="1.4" fill="none" stroke-dasharray="5,4" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="540" y="100" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">pA 走完 A→换头到 headB</text>

  <path d="M 250 296 Q 30 300 80 270" stroke="#9c6ade" stroke-width="1.4" fill="none" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="36" y="330" font-size="10" fill="#9c6ade" font-weight="bold">pB 走完 B→换头到 headA</text>

  <!-- ===== 路径等长结论 ===== -->
  <g filter="url(#rough2)">
    <rect x="60" y="330" width="480" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="300" y="348" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">pA 路径 a+c+b  =  pB 路径 b+c+a  =  a+b+c</text>
  <text x="300" y="364" text-anchor="middle" font-size="11" fill="#555">步数相同 → 同步抵达相交点（或同为 ∅）</text>
</svg>
