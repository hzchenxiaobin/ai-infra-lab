<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="500" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">贪心六大题型：差异在「排序键」与「局部最优策略」</text>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#888">代码骨架高度统一：排序 + 单遍扫描 / 排序 + 堆，难点在想到正确的贪心角度</text>

  <!-- center hub -->
  <ellipse cx="320" cy="108" rx="90" ry="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="106" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">贪心骨架</text>
  <text x="320" y="122" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">排序 + 扫描 / 堆</text>

  <!-- 6 categories: 3 left, 3 right -->
  <!-- ① 区间调度 -->
  <path d="M 240 100 L 175 76" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="20" y="52" width="160" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="100" y="72" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">① 区间调度</text>
  <text x="28" y="88" font-size="9" fill="#666" filter="url(#rough2)">排序键: 右端点↑</text>
  <text x="28" y="98" font-size="9" fill="#666" filter="url(#rough2)">435/452/252/56/763</text>

  <!-- ② 跳跃/覆盖 -->
  <path d="M 238 112 L 175 148" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="20" y="124" width="160" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="100" y="144" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">② 跳跃/区间覆盖</text>
  <text x="28" y="160" font-size="9" fill="#666" filter="url(#rough2)">维护最远可达 maxReach</text>
  <text x="28" y="170" font-size="9" fill="#666" filter="url(#rough2)">55/45/763</text>

  <!-- ③ 分配/双向扫 -->
  <path d="M 242 122 L 175 222" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="20" y="198" width="160" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="100" y="218" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">③ 分配/双向扫</text>
  <text x="28" y="234" font-size="9" fill="#666" filter="url(#rough2)">左→右 + 右→左 取max</text>
  <text x="28" y="244" font-size="9" fill="#666" filter="url(#rough2)">135/134/406</text>

  <!-- ④ 排序贪心(比较器) -->
  <path d="M 400 100 L 465 76" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="460" y="52" width="160" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="540" y="72" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">④ 排序贪心</text>
  <text x="468" y="88" font-size="9" fill="#666" filter="url(#rough2)">自定义比较器</text>
  <text x="468" y="98" font-size="9" fill="#666" filter="url(#rough2)">179/406/ largestNumber</text>

  <!-- ⑤ 贪心+堆/资源调度 -->
  <path d="M 402 112 L 465 148" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="460" y="124" width="160" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="540" y="144" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">⑤ 贪心 + 堆</text>
  <text x="468" y="160" font-size="9" fill="#666" filter="url(#rough2)">排序解锁 + 堆取最优</text>
  <text x="468" y="170" font-size="9" fill="#666" filter="url(#rough2)">502/621/767/659</text>

  <!-- ⑥ 数学/配面值 -->
  <path d="M 398 122 L 465 222" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="460" y="198" width="160" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="540" y="218" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">⑥ 数学/构造</text>
  <text x="468" y="234" font-size="9" fill="#666" filter="url(#rough2)">贪心配面值/切成3</text>
  <text x="468" y="244" font-size="9" fill="#666" filter="url(#rough2)">12/13/343</text>

  <!-- ===== bottom: detail rows ===== -->
  <rect x="20" y="276" width="600" height="206" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="320" y="296" text-anchor="middle" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">各题型核心要点</text>

  <text x="36" y="316" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">① 区间调度</text>
  <text x="36" y="330" font-size="9" fill="#555" filter="url(#rough2)">按右端点排序，维护 last_end；新区间 start≥last_end 就选</text>
  <text x="36" y="342" font-size="9" fill="#888" filter="url(#rough2)">变体: 求删几个(435) / 合并(56) / 几间房(253用堆)</text>

  <text x="36" y="362" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">② 跳跃/覆盖</text>
  <text x="36" y="376" font-size="9" fill="#555" filter="url(#rough2)">扫一遍维护 maxReach = max(maxReach, i+nums[i])</text>
  <text x="36" y="388" font-size="9" fill="#888" filter="url(#rough2)">55判能否到终点；45用「分段扩张」计最少跳数</text>

  <text x="36" y="408" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">③ 分配/双向扫</text>
  <text x="36" y="422" font-size="9" fill="#555" filter="url(#rough2)">单方向不满足时，正反各扫一遍取 max/累加</text>
  <text x="36" y="434" font-size="9" fill="#888" filter="url(#rough2)">135糖果: 左规则+右规则取max；134加油站: 单遍判总和</text>

  <text x="330" y="316" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">④ 排序贪心(比较器)</text>
  <text x="330" y="330" font-size="9" fill="#555" filter="url(#rough2)">定义「谁该排前面」的比较函数，排完直接取</text>
  <text x="330" y="342" font-size="9" fill="#888" filter="url(#rough2)">179拼接大数 a+b vs b+a；406按h降k升插队</text>

  <text x="330" y="362" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">⑤ 贪心 + 堆</text>
  <text x="330" y="376" font-size="9" fill="#555" filter="url(#rough2)">排序让候选按某维度推进，堆在已解锁候选里取极值</text>
  <text x="330" y="388" font-size="9" fill="#888" filter="url(#rough2)">502按资本解锁+大顶堆取利润；621桶思想+公式</text>

  <text x="330" y="408" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">⑥ 数学/构造</text>
  <text x="330" y="422" font-size="9" fill="#555" filter="url(#rough2)">问题有数学结构时，贪心配固定面值表/切分最优</text>
  <text x="330" y="434" font-size="9" fill="#888" filter="url(#rough2)">12罗马: 13面值贪心找零；343拆分: 尽量切成3</text>

  <text x="320" y="462" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">⚠ 还有一类「二分答案 + 贪心验证」(875/1011/410)：贪心做 check(mid)，归到二分专题</text>
  <text x="320" y="476" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">Kadane 最大子数组和(53) 也可视为「累加和为负就重置」的贪心</text>
</svg>
