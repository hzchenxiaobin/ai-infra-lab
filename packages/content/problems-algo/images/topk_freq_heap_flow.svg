<svg xmlns="http://www.w3.org/2000/svg" width="920" height="460" viewBox="0 0 920 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arL" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="920" height="460" fill="#fafafa"/>
  <text x="460" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">前 K 高频元素：最小堆算法流程</text>
  <path d="M 300 44 Q 460 52 620 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ① 统计频率 -->
  <g filter="url(#sk)">
    <rect x="380" y="70" width="160" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="460" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">① 哈希表统计频率</text>
  <text x="460" y="108" text-anchor="middle" font-size="11" fill="#666">freq[x]++，O(n)</text>

  <path d="M 460 116 L 460 138" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>

  <!-- ② 遍历 -->
  <g filter="url(#sk)">
    <rect x="370" y="140" width="180" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="460" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">② 遍历每个 (元素, 频率)</text>

  <path d="M 460 180 L 460 202" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>

  <!-- ③ 入堆 -->
  <g filter="url(#sk)">
    <rect x="370" y="204" width="180" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="460" y="229" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">③ push 进最小堆</text>

  <path d="M 460 244 L 460 268" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>

  <!-- 判断菱形 -->
  <g filter="url(#sk)">
    <polygon points="460,270 560,316 460,362 360,316" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="460" y="312" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">堆大小 &gt; k ？</text>
  <text x="460" y="328" text-anchor="middle" font-size="10" fill="#999">(size &gt; k)</text>

  <!-- Yes 分支：弹出 -->
  <path d="M 360 316 L 230 316" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>
  <text x="300" y="308" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">是</text>
  <g filter="url(#sk)">
    <rect x="70" y="294" width="160" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="150" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">弹出堆顶 pop()</text>
  <text x="150" y="332" text-anchor="middle" font-size="11" fill="#b85450">淘汰频率最小的，O(log k)</text>
  <!-- 弹出后回到遍历 -->
  <path d="M 150 294 Q 150 220 368 160" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arL)" stroke-dasharray="5 3" filter="url(#sk)"/>
  <text x="180" y="200" font-size="10" fill="#999">继续下一个</text>

  <!-- No 分支：继续 -->
  <path d="M 560 316 L 690 316" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>
  <text x="625" y="308" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">否</text>
  <g filter="url(#sk)">
    <rect x="690" y="294" width="170" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="775" y="316" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">堆未满，保留</text>
  <text x="775" y="332" text-anchor="middle" font-size="11" fill="#2e6e2e">直接进入下一个</text>
  <path d="M 775 294 Q 775 220 552 160" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arL)" stroke-dasharray="5 3" filter="url(#sk)"/>

  <!-- ④ 输出 -->
  <path d="M 460 362 L 460 390" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>
  <text x="540" y="380" font-size="11" fill="#666">遍历结束</text>
  <g filter="url(#sk)">
    <rect x="360" y="392" width="200" height="46" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="460" y="414" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">④ 输出堆中所有元素</text>
  <text x="460" y="430" text-anchor="middle" font-size="11" fill="#2e6e2e">即为频率前 K 高的元素</text>
</svg>
