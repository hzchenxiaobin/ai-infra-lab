<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="480" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">回溯六大题型：差异在「选择列表」与「start 怎么传」</text>
  <text x="320" y="46" text-anchor="middle" font-size="11" fill="#888">顺序重要 → 排列型（每层扫全部）；顺序不重要 → 组合/子集型（靠 start 去重）</text>

  <!-- center hub -->
  <ellipse cx="320" cy="120" rx="78" ry="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="118" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">回溯骨架</text>
  <text x="320" y="132" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">选-递归-撤销</text>

  <!-- 6 category boxes around hub: 3 left, 3 right -->
  <!-- left col -->
  <!-- 1 全排列 -->
  <path d="M 250 112 L 180 92" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="30" y="68" width="150" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="105" y="86" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">① 全排列</text>
  <text x="38" y="102" font-size="9" fill="#666" filter="url(#rough2)">start: 不用，每层扫全部</text>
  <text x="38" y="112" font-size="9" fill="#666" filter="url(#rough2)">终止: path.size==n</text>

  <!-- 2 组合 -->
  <path d="M 248 124 L 180 168" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="30" y="144" width="150" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="105" y="162" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">② 组合</text>
  <text x="38" y="178" font-size="9" fill="#666" filter="url(#rough2)">start: 传 i+1（不重复选）</text>
  <text x="38" y="188" font-size="9" fill="#666" filter="url(#rough2)">终止: path.size==k</text>

  <!-- 3 子集 -->
  <path d="M 252 132 L 180 240" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="30" y="216" width="150" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="105" y="234" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">③ 子集</text>
  <text x="38" y="250" font-size="9" fill="#666" filter="url(#rough2)">start: 传 i+1；每节点都收</text>
  <text x="38" y="260" font-size="9" fill="#666" filter="url(#rough2)">终止: start 走到末尾</text>

  <!-- right col -->
  <!-- 4 分割 -->
  <path d="M 390 112 L 460 92" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="460" y="68" width="150" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="535" y="86" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">④ 分割</text>
  <text x="468" y="102" font-size="9" fill="#666" filter="url(#rough2)">start: 传切割终点 i+1</text>
  <text x="468" y="112" font-size="9" fill="#666" filter="url(#rough2)">终止: 切到串尾</text>

  <!-- 5 搜索 -->
  <path d="M 392 124 L 460 168" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="460" y="144" width="150" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="535" y="162" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">⑤ 网格/图搜索</text>
  <text x="468" y="178" font-size="9" fill="#666" filter="url(#rough2)">候选: 四邻/八邻合法格</text>
  <text x="468" y="188" font-size="9" fill="#666" filter="url(#rough2)">终止: 走到目标/无路</text>

  <!-- 6 括号/构造 -->
  <path d="M 388 132 L 460 240" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="460" y="216" width="150" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="535" y="234" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">⑥ 括号/构造</text>
  <text x="468" y="250" font-size="9" fill="#666" filter="url(#rough2)">候选: ( 与 ) 两分支</text>
  <text x="468" y="260" font-size="9" fill="#666" filter="url(#rough2)">剪枝: 右不能超左</text>

  <!-- ===== bottom: representative problems ===== -->
  <rect x="30" y="290" width="580" height="170" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="320" y="312" text-anchor="middle" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">代表题速查（同色块对应上图）</text>

  <!-- 3 columns of mini lists -->
  <text x="50" y="332" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">排列 / 分割（绿）</text>
  <text x="50" y="348" font-size="10" fill="#666" filter="url(#rough2)">46 全排列 · 47 全排列II</text>
  <text x="50" y="362" font-size="10" fill="#666" filter="url(#rough2)">131 分割回文串</text>
  <text x="50" y="376" font-size="10" fill="#666" filter="url(#rough2)">93 复原 IP 地址</text>

  <text x="50" y="398" font-size="10" fill="#888" filter="url(#rough2)">选择列表特点：</text>
  <text x="50" y="414" font-size="10" fill="#666" filter="url(#rough2)">每层从头扫到尾</text>
  <text x="50" y="430" font-size="10" fill="#666" filter="url(#rough2)">用 used[] 防同路径重复</text>
  <text x="50" y="446" font-size="10" fill="#666" filter="url(#rough2)">分割型 start = 切点+1</text>

  <text x="250" y="332" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">组合 / 搜索（橙）</text>
  <text x="250" y="348" font-size="10" fill="#666" filter="url(#rough2)">77 组合 · 39 组合总和</text>
  <text x="250" y="362" font-size="10" fill="#666" filter="url(#rough2)">40 组合总和II · 216</text>
  <text x="250" y="376" font-size="10" fill="#666" filter="url(#rough2)">79 单词搜索 · 51 N皇后</text>
  <text x="250" y="390" font-size="10" fill="#666" filter="url(#rough2)">37 解数独</text>

  <text x="250" y="412" font-size="10" fill="#888" filter="url(#rough2)">选择列表特点：</text>
  <text x="250" y="428" font-size="10" fill="#666" filter="url(#rough2)">从 start 扫到尾</text>
  <text x="250" y="444" font-size="10" fill="#666" filter="url(#rough2)">可重复选传 i，否则 i+1</text>

  <text x="450" y="332" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">子集 / 括号（红）</text>
  <text x="450" y="348" font-size="10" fill="#666" filter="url(#rough2)">78 子集 · 90 子集II</text>
  <text x="450" y="362" font-size="10" fill="#666" filter="url(#rough2)">22 括号生成</text>

  <text x="450" y="384" font-size="10" fill="#888" filter="url(#rough2)">子集: 每个节点都收集</text>
  <text x="450" y="400" font-size="10" fill="#666" filter="url(#rough2)">（不止叶子！）</text>
  <text x="450" y="422" font-size="10" fill="#888" filter="url(#rough2)">括号: 两个候选 ( )</text>
  <text x="450" y="438" font-size="10" fill="#666" filter="url(#rough2)">靠剪枝保合法</text>
</svg>
