<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 2 演算：nums = [6, 3]，sum = 8</text>

  <!-- candidates for 6 -->
  <text x="50" y="58" font-size="11" fill="#3a4a66" font-weight="bold">元素 6 的候选（核 → 倍增链）：</text>

  <rect x="50" y="68" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="125" y="88" text-anchor="middle" font-size="10.5" fill="#333">核 6：6:0</text>

  <rect x="206" y="68" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="281" y="88" text-anchor="middle" font-size="10.5" fill="#333">核 3：3:1（6:2 弃）</text>

  <rect x="362" y="68" width="170" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="447" y="88" text-anchor="middle" font-size="10.5" fill="#333">核 1：1:2, 2:3, 4:4, 8:5</text>

  <!-- candidates for 3 -->
  <text x="50" y="122" font-size="11" fill="#3a4a66" font-weight="bold">元素 3 的候选：</text>

  <rect x="50" y="132" width="230" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="165" y="152" text-anchor="middle" font-size="10.5" fill="#333">核 3：3:0, 6:1</text>

  <rect x="288" y="132" width="244" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="410" y="152" text-anchor="middle" font-size="10.5" fill="#333">核 1：1:1, 2:2, 4:3, 8:4</text>

  <!-- highlight 3->2 -->
  <rect x="356" y="124" width="52" height="46" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4,3" rx="8" filter="url(#rough2)"/>
  <text x="466" y="118" font-size="10" fill="#b85450" font-weight="bold">3 → 2：p=1, q=1</text>
  <text x="466" y="132" font-size="9.5" fill="#b85450">÷2 再 ×2，代价 2</text>

  <!-- dp after 6 -->
  <text x="50" y="190" font-size="11.5" fill="#3a4a66" font-weight="bold">处理完 6 后的 dp（只列非 ∞ 项）：</text>

  <rect x="50" y="200" width="500" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="70" y="220" font-size="10.5" fill="#333">dp[6]=0&#160;&#160;&#160;dp[3]=1&#160;&#160;&#160;dp[1]=2&#160;&#160;&#160;dp[2]=3&#160;&#160;&#160;dp[4]=4&#160;&#160;&#160;dp[8]=5</text>

  <!-- dp after 3 -->
  <text x="50" y="252" font-size="11.5" fill="#3a4a66" font-weight="bold">处理元素 3：枚举其候选做松弛：</text>

  <rect x="50" y="262" width="240" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="170" y="284" text-anchor="middle" font-size="10.5" fill="#333">候选 2（代价 2）：dp[8] ≤ dp[6] + 2 = 2</text>

  <rect x="302" y="262" width="240" height="34" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="422" y="284" text-anchor="middle" font-size="10.5" fill="#555">候选 8（代价 4）：dp[8] ≤ 0+4 = 4</text>

  <path d="M 170 296 L 170 316" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- final answer -->
  <rect x="50" y="320" width="240" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="170" y="338" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">dp[8] = 2（最优）</text>
  <text x="170" y="356" text-anchor="middle" font-size="10" fill="#555">其余候选均不更优</text>

  <!-- path illustration -->
  <rect x="50" y="368" width="500" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="70" y="388" font-size="11" fill="#333" font-weight="bold">最优方案：6 不动（0 次）+ 3 ÷2 → 1，1 ×2 → 2（2 次），6 + 2 = 8</text>
  <text x="70" y="405" font-size="10.5" fill="#555">对比第 I 版：3 无法先除后乘地变 2，此路不通 → 那边返回 −1。</text>
</svg>
