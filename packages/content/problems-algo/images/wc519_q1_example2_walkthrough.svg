<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="380" fill="#fafafa"/>
  <text x="360" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">示例 2 演算:先对每行左移,再对每列上移</text>

  <!-- ============ 网格 A:原始 ============ -->
  <text x="127" y="64" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">原始 grid</text>
  <rect x="60" y="90" width="42" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="81" y="117" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <rect x="106" y="90" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="127" y="117" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="152" y="90" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="173" y="117" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="60" y="136" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="81" y="163" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <rect x="106" y="136" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="127" y="163" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <rect x="152" y="136" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="173" y="163" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>
  <rect x="60" y="182" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="81" y="209" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7</text>
  <rect x="106" y="182" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="127" y="209" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">8</text>
  <rect x="152" y="182" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="173" y="209" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">9</text>

  <!-- 箭头 1 -->
  <path d="M 202 157 L 284 157" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="244" y="146" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">每行左移</text>
  <text x="244" y="174" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">rowShift=[1,2,0]</text>

  <!-- ============ 网格 B:行左移后 ============ -->
  <text x="373" y="64" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">行左移后</text>
  <text x="296" y="115" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">k=1</text>
  <text x="296" y="161" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">k=2</text>
  <text x="296" y="207" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">k=0</text>
  <rect x="306" y="90" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="327" y="117" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="352" y="90" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="373" y="117" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="398" y="90" width="42" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="419" y="117" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <rect x="306" y="136" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="327" y="163" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>
  <rect x="352" y="136" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="373" y="163" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <rect x="398" y="136" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="419" y="163" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <rect x="306" y="182" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="327" y="209" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7</text>
  <rect x="352" y="182" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="373" y="209" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">8</text>
  <rect x="398" y="182" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="419" y="209" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">9</text>

  <!-- 箭头 2 -->
  <path d="M 448 157 L 546 157" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="498" y="146" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">每列上移</text>
  <text x="498" y="174" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">colShift=[2,2,1]</text>

  <!-- ============ 网格 C:列上移后 ============ -->
  <text x="627" y="64" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">列上移后 = 答案</text>
  <text x="581" y="82" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">k=2</text>
  <text x="627" y="82" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">k=2</text>
  <text x="673" y="82" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">k=1</text>
  <rect x="560" y="90" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="581" y="117" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7</text>
  <rect x="606" y="90" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="627" y="117" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">8</text>
  <rect x="652" y="90" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="673" y="117" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <rect x="560" y="136" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="581" y="163" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="606" y="136" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="627" y="163" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="652" y="136" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="673" y="163" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">9</text>
  <rect x="560" y="182" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="581" y="209" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>
  <rect x="606" y="182" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="627" y="209" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <rect x="652" y="182" width="42" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="673" y="209" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>

  <!-- 底部说明 -->
  <rect x="48" y="252" width="646" height="106" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="371" y="280" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">元素 1 的轨迹:(0,0) —行 0 左移 1→ (0,2) —列 2 上移 1→ (2,2)</text>
  <text x="371" y="306" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">关键:行移位后落到哪一列,后续就用那一列的 colShift 上移</text>
  <text x="371" y="330" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">(0−1+3)%3 = 2 → 第 2 列;(0−1+3)%3 = 2 → 第 2 行 ⇒ 1 最终落在右下角 ✓</text>
</svg>
