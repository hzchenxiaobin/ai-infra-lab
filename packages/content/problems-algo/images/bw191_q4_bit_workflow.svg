<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">算法流程：扫描 j，树状数组上「先查后插」</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">BIT 维护「已出现前缀值」的值域计数；k = 0 特判返回 n(n+1)/2</text>

  <text x="46" y="74" font-size="10.5" font-weight="bold" fill="#8a6a1a" filter="url(#rough2)">初始：BIT 插入 P[−1] = 0</text>

  <!-- 循环容器（虚线） -->
  <rect x="44" y="82" width="240" height="216" rx="10" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="164" y="98" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">for j = 0 … n−1</text>

  <rect x="64" y="108" width="200" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="164" y="130" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3a4a66" filter="url(#rough2)">① 计算 t = P[j] − goal</text>

  <g filter="url(#rough2)">
    <line x1="164" y1="144" x2="164" y2="158" stroke="#666" stroke-width="1.4" marker-end="url(#arr)"/>
  </g>

  <rect x="64" y="162" width="200" height="72" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="164" y="182" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3a5a2a" filter="url(#rough2)">② 查两次 BIT 前缀和</text>
  <text x="164" y="201" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">ans += cntLE(t−k)</text>
  <text x="164" y="218" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">     + (j+1) − cntLE(t+k−1)</text>

  <g filter="url(#rough2)">
    <line x1="164" y1="234" x2="164" y2="248" stroke="#666" stroke-width="1.4" marker-end="url(#arr)"/>
  </g>

  <rect x="64" y="252" width="200" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="164" y="274" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6a1a" filter="url(#rough2)">③ 插入 rank(P[j]) 到 BIT</text>

  <!-- 回边 -->
  <path d="M 62 270 C 16 270, 16 126, 62 126" fill="none" stroke="#999" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="22" y="202" font-size="9.5" fill="#888" filter="url(#rough2)">j+1</text>

  <!-- 右侧：离散化 -->
  <text x="420" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">离散化 vals（升序去重，含 P[−1]=0）</text>
  <g filter="url(#rough2)">
    <rect x="318" y="96" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="352" y="96" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="386" y="96" width="34" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="420" y="96" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="454" y="96" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="488" y="96" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="335" y="114" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">−3</text>
  <text x="369" y="114" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">−2</text>
  <text x="403" y="114" text-anchor="middle" font-size="11" fill="#8a6a1a" filter="url(#rough2)">0</text>
  <text x="437" y="114" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>
  <text x="471" y="114" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">3</text>
  <text x="505" y="114" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">4</text>
  <text x="335" y="138" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="369" y="138" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="403" y="138" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>
  <text x="437" y="138" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">4</text>
  <text x="471" y="138" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">5</text>
  <text x="505" y="138" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">6</text>
  <text x="505" y="152" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">rank</text>

  <path d="M 448 168 C 448 158, 442 150, 436 144" fill="none" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="182" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">upper_bound(vals, x) → r：≤ x 的值个数</text>
  <text x="420" y="197" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">（阈值 t±k 不进 vals，二分换算 rank 即可）</text>

  <!-- BIT -->
  <text x="420" y="222" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">BIT（下标 = rank，存已插入计数）</text>
  <g filter="url(#rough2)">
    <rect x="318" y="230" width="34" height="26" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <rect x="352" y="230" width="34" height="26" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <rect x="386" y="230" width="34" height="26" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <rect x="420" y="230" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="454" y="230" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="488" y="230" width="34" height="26" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <text x="335" y="248" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">1</text>
  <text x="369" y="248" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">1</text>
  <text x="403" y="248" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">1</text>
  <text x="437" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a4a66" filter="url(#rough2)">3</text>
  <text x="471" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a4a66" filter="url(#rough2)">0</text>
  <text x="505" y="248" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <path d="M 471 262 C 462 272, 448 272, 440 262" fill="none" stroke="#446688" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="286" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">query(r)：r → r−lowbit(r) → … → 0 一路累加</text>
  <text x="420" y="301" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">如 query(5) = bit[5] + bit[4] = 0 + 3 = 3</text>

  <!-- 先查后插警示 -->
  <rect x="296" y="316" width="240" height="72" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="416" y="336" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">⚠ 先查后插</text>
  <text x="416" y="353" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">查询时 BIT 恰含 {P[−1], …, P[j−1]}，</text>
  <text x="416" y="367" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">即全部 i′ &lt; j 的前缀值；若先插 P[j]，</text>
  <text x="416" y="381" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">i′ = j 的「自配对」会被误计入</text>
</svg>
