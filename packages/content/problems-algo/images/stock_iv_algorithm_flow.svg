<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：先判无限次，再 2D 滚动 DP</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">k 过大时退化，避免 O(nk) 退化成 O(n²) 甚至爆内存</text>

  <!-- ===== start ===== -->
  <rect x="210" y="60" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="270" y="80" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">输入 k, prices</text>
  <line x1="270" y1="90" x2="270" y2="108" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== n==0 guard ===== -->
  <rect x="200" y="110" width="140" height="28" fill="#f6f6f6" stroke="#888" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="270" y="128" text-anchor="middle" font-size="10" fill="#444">n==0 ? 返回 0</text>
  <line x1="270" y1="138" x2="270" y2="156" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== decision diamond ===== -->
  <polygon points="270,158 360,200 270,242 180,200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="196" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">k ≥ n/2 ?</text>
  <text x="270" y="212" text-anchor="middle" font-size="9" fill="#d6a040">交易次数上限 ≥ 天数一半</text>

  <!-- ===== yes branch -> unlimited greedy ===== -->
  <line x1="360" y1="200" x2="438" y2="200" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="194" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="440" y="178" width="92" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="486" y="198" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">无限次交易</text>
  <text x="486" y="214" text-anchor="middle" font-size="9" fill="#4a7a3a">贪心累加正差</text>

  <!-- ===== no branch -> DP ===== -->
  <line x1="270" y1="242" x2="270" y2="262" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="256" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- init box -->
  <rect x="150" y="264" width="240" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="283" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">初始化 free[0..k]=0，hold[0..k]=−∞</text>
  <line x1="270" y1="294" x2="270" y2="310" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop box -->
  <rect x="120" y="312" width="300" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="330" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">遍历每天 p：快照 prev_free</text>
  <text x="270" y="348" text-anchor="middle" font-size="9" fill="#b85450">j=1..k: hold[j]=max(hold[j], prev_free[j−1]−p); free[j]=max(free[j], hold[j]+p)</text>
  <line x1="270" y1="356" x2="270" y2="372" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return -->
  <rect x="200" y="374" width="140" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="389" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回 free[k]</text>
</svg>
