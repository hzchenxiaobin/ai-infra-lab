<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="600" height="430" fill="#fafafa"/>
  <text x="300" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">示例 1 演算:s = 「aab」, k = 1 → 答案 2</text>

  <!-- 顶部提示 -->
  <rect x="40" y="48" width="520" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="300" y="72" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">环上相等对 C = 1(仅 (0,1) 的 a=a);score(r) = C − [s[(r−1+n) mod n] = s[r]]</text>

  <!-- 表头 -->
  <text x="52" y="112" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">移位 r</text>
  <text x="187" y="112" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">移位串与相邻对</text>
  <text x="332" y="112" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">被断开的循环对</text>
  <text x="452" y="112" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">得分</text>
  <text x="540" y="112" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">= k?</text>

  <!-- ===== 行 1: r = 0 → aab ===== -->
  <text x="52" y="157" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">r = 0</text>
  <rect x="100" y="130" width="44" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="122" y="156" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">a</text>
  <text x="151" y="156" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">=</text>
  <rect x="158" y="130" width="44" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="156" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">a</text>
  <text x="209" y="156" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">≠</text>
  <rect x="216" y="130" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="238" y="156" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">b</text>
  <text x="332" y="156" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">(2,0): b≠a,不扣分</text>
  <text x="452" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <text x="540" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <!-- ===== 行 2: r = 1 → aba ===== -->
  <text x="52" y="242" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">r = 1</text>
  <rect x="100" y="215" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="122" y="241" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">a</text>
  <text x="151" y="241" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">≠</text>
  <rect x="158" y="215" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="241" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">b</text>
  <text x="209" y="241" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">≠</text>
  <rect x="216" y="215" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="238" y="241" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">a</text>
  <text x="332" y="241" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">(0,1): a=a,扣 1 分</text>
  <text x="452" y="241" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">0</text>
  <text x="540" y="241" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- ===== 行 3: r = 2 → baa ===== -->
  <text x="52" y="327" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">r = 2</text>
  <rect x="100" y="300" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="122" y="326" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">b</text>
  <text x="151" y="326" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">≠</text>
  <rect x="158" y="300" width="44" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="326" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">a</text>
  <text x="209" y="326" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">=</text>
  <rect x="216" y="300" width="44" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="238" y="326" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">a</text>
  <text x="332" y="326" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">(1,2): a≠b,不扣分</text>
  <text x="452" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <text x="540" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <!-- 底部答案框 -->
  <rect x="40" y="362" width="520" height="46" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="390" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">得分等于 k = 1 的移位:r = 0 与 r = 2 ⇒ 答案 = 2</text>
</svg>
