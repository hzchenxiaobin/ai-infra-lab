<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：排序 → 扫描，遇到未覆盖区间就新射一支箭</text>

  <!-- Start -->
  <rect x="250" y="40" width="100" height="28" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="59" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">开始</text>

  <!-- Sort -->
  <rect x="180" y="86" width="240" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="108" text-anchor="middle" font-size="11" fill="#2a4a66">按右端点 x_end 升序排序 points</text>

  <!-- Init -->
  <rect x="170" y="134" width="260" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="156" text-anchor="middle" font-size="11" fill="#2a4a66">arrows = 1；arrow_pos = points[0][1]</text>

  <!-- Diamond1: 还有未处理气球? center (300,210) w=210 h=66 -->
  <polygon points="300,177 405,210 300,243 195,210" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="207" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold">还有未处理气球?</text>
  <text x="300" y="221" text-anchor="middle" font-size="9" fill="#888">(i &lt; n)</text>

  <!-- Diamond2: start > arrow_pos? center (300,312) w=240 h=66 -->
  <polygon points="300,279 420,312 300,345 180,312" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="309" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold">points[i][0] &gt; arrow_pos ?</text>
  <text x="300" y="323" text-anchor="middle" font-size="9" fill="#888">当前箭覆盖不到?</text>

  <!-- arrows++ box (Yes, right) -->
  <rect x="450" y="294" width="140" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="520" y="316" text-anchor="middle" font-size="10" fill="#8a3a36">arrows++; arrow_pos=end</text>

  <!-- skip box (No, left) -->
  <rect x="40" y="294" width="120" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="100" y="316" text-anchor="middle" font-size="11" fill="#3a5a2a">跳过（已覆盖）</text>

  <!-- i++ box -->
  <rect x="255" y="382" width="90" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="401" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold">i++</text>

  <!-- 返回 box (Diamond1 No) -->
  <rect x="450" y="194" width="120" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="510" y="215" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">返回 arrows</text>
  <!-- 结束 -->
  <rect x="466" y="240" width="88" height="26" rx="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="510" y="257" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">结束</text>

  <!-- arrows: Start -> Sort -->
  <line x1="300" y1="68" x2="300" y2="84" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- Sort -> Init -->
  <line x1="300" y1="120" x2="300" y2="132" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- Init -> Diamond1 -->
  <line x1="300" y1="168" x2="300" y2="175" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- Diamond1 -> Diamond2 (Yes, down) -->
  <line x1="300" y1="243" x2="300" y2="277" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="308" y="262" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <!-- Diamond1 -> 返回 (No, right) -->
  <line x1="405" y1="210" x2="448" y2="210" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="418" y="202" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <!-- 返回 -> 结束 -->
  <line x1="510" y1="226" x2="510" y2="238" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond2 -> arrows++ (Yes, right) -->
  <line x1="420" y1="312" x2="448" y2="312" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="304" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <!-- Diamond2 -> skip (No, left) -->
  <line x1="180" y1="312" x2="162" y2="312" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="166" y="304" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- arrows++ -> i++ (down then left) -->
  <path d="M 520 330 L 520 397 L 347 397" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- skip -> i++ (down then right) -->
  <path d="M 100 330 L 100 397 L 253 397" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop back: i++ -> far left -> up -> Diamond1 left -->
  <path d="M 255 397 L 20 397 L 20 210 L 193 210" fill="none" stroke="#666" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="30" y="300" font-size="10" fill="#888" font-weight="bold" transform="rotate(-90 30 300)">继续下一气球</text>

  <!-- note -->
  <rect x="120" y="430" width="360" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="300" y="449" text-anchor="middle" font-size="10" fill="#555">关键：端点相接（start == arrow_pos）算被覆盖，故用严格 &gt;</text>
</svg>
