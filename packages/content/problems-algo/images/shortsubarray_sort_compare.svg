<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="300" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">思路一：排序后逐位比对，从两端找首个不同</text>

  <!-- original array -->
  <text x="34" y="76" font-size="12" fill="#888">原数组</text>
  <rect x="86" y="60" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="80" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="136" y="60" width="48" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="80" text-anchor="middle" font-size="13" fill="#333">6</text>
  <rect x="186" y="60" width="48" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="80" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="236" y="60" width="48" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="80" text-anchor="middle" font-size="13" fill="#333">8</text>
  <rect x="286" y="60" width="48" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="80" text-anchor="middle" font-size="13" fill="#333">10</text>
  <rect x="336" y="60" width="48" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="80" text-anchor="middle" font-size="13" fill="#333">9</text>
  <rect x="386" y="60" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="80" text-anchor="middle" font-size="13" fill="#333">15</text>

  <!-- sorted copy -->
  <text x="34" y="160" font-size="12" fill="#888">排序后</text>
  <rect x="86" y="144" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="164" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="136" y="144" width="48" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="164" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="186" y="144" width="48" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="164" text-anchor="middle" font-size="13" fill="#333">6</text>
  <rect x="236" y="144" width="48" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="164" text-anchor="middle" font-size="13" fill="#333">8</text>
  <rect x="286" y="144" width="48" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="164" text-anchor="middle" font-size="13" fill="#333">9</text>
  <rect x="336" y="144" width="48" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="164" text-anchor="middle" font-size="13" fill="#333">10</text>
  <rect x="386" y="144" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="164" text-anchor="middle" font-size="13" fill="#333">15</text>

  <!-- index labels -->
  <text x="110" y="196" text-anchor="middle" font-size="10" fill="#999">0</text>
  <text x="160" y="196" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <text x="210" y="196" text-anchor="middle" font-size="10" fill="#999">2</text>
  <text x="260" y="196" text-anchor="middle" font-size="10" fill="#999">3</text>
  <text x="310" y="196" text-anchor="middle" font-size="10" fill="#999">4</text>
  <text x="360" y="196" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">5</text>
  <text x="410" y="196" text-anchor="middle" font-size="10" fill="#999">6</text>

  <!-- left arrow to index 1 -->
  <path d="M 70 224 L 150 224" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="110" y="240" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">start=1（首个不同）</text>

  <!-- right arrow to index 5 -->
  <path d="M 450 224 L 370 224" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="410" y="240" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">end=5（末个不同）</text>

  <!-- result note -->
  <rect x="120" y="256" width="280" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="278" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">长度 = end − start + 1 = 5（O(n log n)）</text>
</svg>
