<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">两状态机：空仓 / 持有（无限次交易，无手续费）</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">与含手续费(714)同骨架，仅卖出边无 −fee</text>

  <!-- ===== Nodes ===== -->
  <g font-size="11">
    <!-- cash 空仓 -->
    <rect x="95" y="150" width="100" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
    <text x="145" y="175" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">空仓 cash</text>
    <text x="145" y="194" text-anchor="middle" font-size="9" fill="#4a7a3a">无股 · 可买</text>

    <!-- hold 持有 -->
    <rect x="345" y="150" width="100" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
    <text x="395" y="175" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">持有 hold</text>
    <text x="395" y="194" text-anchor="middle" font-size="9" fill="#b85450">手上有股</text>
  </g>

  <!-- ===== Edges ===== -->
  <!-- cash -> hold : 买入 -->
  <path d="M 195 175 L 342 175" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="232" y="148" width="76" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="270" y="163" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">买入 −p</text>

  <!-- hold -> cash : 卖出 -->
  <path d="M 345 183 L 198 183" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="232" y="192" width="76" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="270" y="207" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">卖出 +p</text>

  <!-- cash self-loop : 休息 -->
  <path d="M 120 150 C 86 128, 64 158, 102 178" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="62" y="124" text-anchor="middle" font-size="9" fill="#666">空仓休息</text>

  <!-- hold self-loop : 持有 -->
  <path d="M 420 150 C 454 128, 476 158, 438 178" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="478" y="124" text-anchor="middle" font-size="9" fill="#666">继续持有</text>

  <!-- ===== transfer equations ===== -->
  <line x1="40" y1="236" x2="500" y2="236" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <g font-size="10" fill="#333">
    <text x="60" y="258" font-size="11" fill="#444" font-weight="bold">转移方程（每天取「保持 / 跳入」较大值）：</text>
    <text x="80" y="280" fill="#4a7a3a">cash[i] = max(cash[i−1],  hold[i−1] + p)</text>
    <text x="80" y="298" fill="#b85450">hold[i] = max(hold[i−1],  cash[i−1] − p)</text>
    <text x="80" y="316" fill="#888" font-size="9">初值：cash[0] = 0,  hold[0] = −prices[0]</text>
  </g>

  <!-- ===== Answer note ===== -->
  <rect x="60" y="328" width="420" height="22" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="270" y="343" text-anchor="middle" font-size="10" fill="#444">答案 = cash[n−1]：把 fee 设为 0 即 714 的特例</text>
</svg>
