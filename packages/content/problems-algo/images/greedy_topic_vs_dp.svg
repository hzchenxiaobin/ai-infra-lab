<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">贪心 vs DP vs 回溯：怎么选算法？</text>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#888">贪心快但需证明；DP 通用但费空间；回溯枚举所有解但慢。看「问什么」+「有无最优子结构」</text>

  <!-- ===== decision tree ===== -->
  <ellipse cx="320" cy="78" rx="86" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="82" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">题目要求是什么？</text>

  <!-- branch 1: list all -->
  <path d="M 250 86 L 130 120" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="40" y="122" width="180" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="130" y="140" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">「列出所有方案」</text>
  <text x="130" y="155" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">所有排列/组合/分割</text>

  <path d="M 130 162 L 130 184" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="50" y="186" width="160" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="130" y="206" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ 回溯</text>

  <!-- branch 2: count/optimal -->
  <path d="M 320 98 L 320 120" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="230" y="122" width="180" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="320" y="140" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">「最优值 / 能否 / 多少种」</text>
  <text x="320" y="155" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">max/min/计数</text>

  <!-- sub: has optimal substructure? -->
  <path d="M 320 162 L 320 184" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="220" y="186" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="320" y="206" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">有最优子结构 + 子问题重叠？</text>

  <!-- yes -> DP or greedy -->
  <path d="M 270 218 L 230 240" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="248" y="236" font-size="9" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <path d="M 370 218 L 410 240" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="392" y="236" font-size="9" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- greedy vs DP -->
  <rect x="150" y="242" width="160" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="230" y="260" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">还能证明贪心选择性质？</text>
  <text x="230" y="274" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">局部最优=全局最优</text>

  <path d="M 200 282 L 170 304" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="178" y="300" font-size="9" fill="#4a7a3a" filter="url(#rough2)">能</text>
  <path d="M 260 282 L 290 304" stroke="#d6a040" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="300" font-size="9" fill="#d6a040" filter="url(#rough2)">不能</text>

  <rect x="110" y="306" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="170" y="328" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ 贪心</text>

  <rect x="240" y="306" width="120" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="300" y="328" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">→ DP</text>

  <!-- no substructure -> brute/backtrack with memo -->
  <rect x="410" y="242" width="180" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="500" y="260" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">子问题不重叠</text>
  <text x="500" y="274" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">或规模小</text>
  <path d="M 500 282 L 500 304" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="430" y="306" width="140" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="500" y="328" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ 回溯+记忆化</text>

  <!-- ===== bottom: complexity comparison ===== -->
  <rect x="30" y="352" width="580" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="320" y="372" text-anchor="middle" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">复杂度与适用对比</text>
  <text x="44" y="390" font-size="10" fill="#555" filter="url(#rough2)">• 贪心：O(n log n)（排序）或 O(n)，最快；但需证明，错了不好查</text>
  <text x="44" y="406" font-size="10" fill="#555" filter="url(#rough2)">• DP：O(n²)/O(n·m)，通用稳妥；需状态定义 + 转移方程，费空间</text>
  <text x="44" y="422" font-size="10" fill="#555" filter="url(#rough2)">• 回溯：O(2ⁿ)/O(n!)，最慢；枚举全部解，甜区 n≤20</text>
</svg>
