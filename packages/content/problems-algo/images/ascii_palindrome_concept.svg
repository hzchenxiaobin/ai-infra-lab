<svg xmlns="http://www.w3.org/2000/svg" width="780" height="300" viewBox="0 0 780 300" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="780" height="300" fill="#fdfcf7"/>
  <text x="390" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">字符 → ASCII → 8 位二进制 → 拼接</text>
  <path d="M 240 38 Q 390 46 540 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- char box -->
  <g filter="url(#sk)"><rect x="60" y="74" width="70" height="56" rx="6" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="95" y="112" text-anchor="middle" font-size="26" font-weight="bold" fill="#2b4a6e">f</text>
  <text x="95" y="148" text-anchor="middle" font-size="10" fill="#888">字符</text>

  <path d="M 134 102 L 178 102" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ASCII value -->
  <g filter="url(#sk)"><rect x="184" y="74" width="90" height="56" rx="6" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.6"/></g>
  <text x="229" y="112" text-anchor="middle" font-size="22" font-weight="bold" fill="#7a5415">102</text>
  <text x="229" y="148" text-anchor="middle" font-size="10" fill="#888">ASCII 值</text>

  <path d="M 278 102 L 322 102" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 8-bit binary -->
  <g filter="url(#sk)"><rect x="328" y="74" width="190" height="56" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="423" y="112" text-anchor="middle" font-size="20" font-family="monospace" font-weight="bold" fill="#2e6e2e">01100110</text>
  <text x="423" y="148" text-anchor="middle" font-size="10" fill="#888">8 位二进制（补前导零）</text>

  <path d="M 520 102 L 564 102" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- concatenation -->
  <g filter="url(#sk)"><rect x="570" y="74" width="180" height="56" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="660" y="108" text-anchor="middle" font-size="14" font-family="monospace" font-weight="bold" fill="#7a2828">01100110…</text>
  <text x="660" y="128" text-anchor="middle" font-size="10" fill="#888">拼接所有字符的二进制</text>

  <!-- note box -->
  <g filter="url(#sk)">
    <rect x="60" y="178" width="690" height="96" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="80" y="204" font-size="13" font-weight="bold" fill="#2b2b2b">关键点</text>
  <text x="80" y="228" font-size="12" fill="#444">① 必须补到 8 位（前导零不能省），否则位数不对齐无法判回文</text>
  <text x="80" y="250" font-size="12" fill="#444">② 拼接后整串长度 = 8 × len(s)，直接首尾双指针判回文即可</text>
  <text x="80" y="270" font-size="11" fill="#888">小写字母 ASCII 范围 97~122，二进制均以 0110 / 0111 开头</text>
</svg>
