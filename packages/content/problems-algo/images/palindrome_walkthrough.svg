<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="600" height="430" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：1→2→3→2→1（奇数链）</text>

  <!-- ===== ① 找前中点 ===== -->
  <text x="40" y="64" font-size="12" fill="#888" font-weight="bold">① 找前中点：fast 到尾，slow 停在 3</text>
  <g font-size="13">
    <rect x="120" y="78" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="144" y="98" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <line x1="168" y1="93" x2="192" y2="93" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

    <rect x="196" y="78" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="220" y="98" text-anchor="middle" fill="#333" font-weight="bold">2</text>
    <line x1="244" y1="93" x2="268" y2="93" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

    <rect x="272" y="78" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
    <text x="296" y="98" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <line x1="320" y1="93" x2="344" y2="93" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

    <rect x="348" y="78" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="372" y="98" text-anchor="middle" fill="#333" font-weight="bold">2</text>
    <line x1="396" y1="93" x2="420" y2="93" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

    <rect x="424" y="78" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="448" y="98" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <line x1="472" y1="93" x2="496" y2="93" stroke="#446688" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="506" y="98" font-size="11" fill="#888">∅</text>
  </g>
  <text x="296" y="128" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">↑ slow（前半末尾）</text>

  <!-- ===== ② 反转后半段 ===== -->
  <text x="40" y="168" font-size="12" fill="#888" font-weight="bold">② 反转 slow.next 起的后半段：2→1 ⇒ 1→2</text>
  <g font-size="13">
    <rect x="120" y="182" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="144" y="202" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <line x1="168" y1="197" x2="192" y2="197" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="196" y="182" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="220" y="202" text-anchor="middle" fill="#333" font-weight="bold">2</text>
    <line x1="244" y1="197" x2="268" y2="197" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="272" y="182" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
    <text x="296" y="202" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>

    <text x="346" y="200" font-size="11" fill="#888">前半段</text>

    <text x="404" y="200" font-size="14" fill="#d6a040" font-weight="bold">|</text>

    <rect x="430" y="182" width="48" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="454" y="202" text-anchor="middle" fill="#8a6a20" font-weight="bold">1</text>
    <line x1="478" y1="197" x2="502" y2="197" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arrO)" filter="url(#rough2)"/>
    <rect x="506" y="182" width="48" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="530" y="202" text-anchor="middle" fill="#8a6a20" font-weight="bold">2</text>
  </g>
  <text x="530" y="228" text-anchor="middle" font-size="9" fill="#888">后半反转后</text>

  <!-- ===== ③ 比较 ===== -->
  <text x="40" y="262" font-size="12" fill="#888" font-weight="bold">③ p1、p2 同步走比较，中间的 3 被自动跳过</text>
  <g font-size="13">
    <text x="40" y="294" font-size="11" fill="#446688" font-weight="bold">p1:</text>
    <rect x="80" y="278" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="104" y="298" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <line x1="128" y1="293" x2="152" y2="293" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="156" y="278" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="180" y="298" text-anchor="middle" fill="#333" font-weight="bold">2</text>
    <line x1="204" y1="293" x2="228" y2="293" stroke="#446688" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="232" y="278" width="48" height="30" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="3,3" rx="6" filter="url(#rough2)"/>
    <text x="256" y="298" text-anchor="middle" fill="#bbb" font-weight="bold">3</text>

    <text x="40" y="340" font-size="11" fill="#d6a040" font-weight="bold">p2:</text>
    <rect x="80" y="324" width="48" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="104" y="344" text-anchor="middle" fill="#8a6a20" font-weight="bold">1</text>
    <line x1="128" y1="339" x2="152" y2="339" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arrO)" filter="url(#rough2)"/>
    <rect x="156" y="324" width="48" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="180" y="344" text-anchor="middle" fill="#8a6a20" font-weight="bold">2</text>
    <line x1="204" y1="339" x2="228" y2="339" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrO)" filter="url(#rough2)"/>
    <text x="240" y="344" font-size="11" fill="#888">∅</text>
  </g>

  <text x="300" y="294" font-size="11" fill="#4a7a3a" font-weight="bold">1 == 1 ✓</text>
  <text x="300" y="340" font-size="11" fill="#4a7a3a" font-weight="bold">2 == 2 ✓</text>
  <text x="300" y="316" font-size="10" fill="#aaa">（中间 3 不参与比较）</text>

  <rect x="380" y="300" width="200" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="480" y="318" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">p2 走到 ∅，全程相等</text>
  <text x="480" y="334" text-anchor="middle" font-size="11" fill="#4a7a3a">→ 回文 ✓</text>

  <!-- ===== ④ 恢复 ===== -->
  <text x="40" y="384" font-size="12" fill="#888" font-weight="bold">④ 恢复：slow.next = reverse(second)，链表还原如初</text>
  <g font-size="13">
    <rect x="120" y="398" width="48" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
    <text x="144" y="414" text-anchor="middle" fill="#333" font-size="11" font-weight="bold">1</text>
    <rect x="176" y="398" width="48" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
    <text x="200" y="414" text-anchor="middle" fill="#333" font-size="11" font-weight="bold">2</text>
    <rect x="232" y="398" width="48" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
    <text x="256" y="414" text-anchor="middle" fill="#4a7a3a" font-size="11" font-weight="bold">3</text>
    <rect x="288" y="398" width="48" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
    <text x="312" y="414" text-anchor="middle" fill="#333" font-size="11" font-weight="bold">2</text>
    <rect x="344" y="398" width="48" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
    <text x="368" y="414" text-anchor="middle" fill="#333" font-size="11" font-weight="bold">1</text>
    <line x1="168" y1="409" x2="174" y2="409" stroke="#446688" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
    <line x1="224" y1="409" x2="230" y2="409" stroke="#446688" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
    <line x1="280" y1="409" x2="286" y2="409" stroke="#446688" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
    <line x1="336" y1="409" x2="342" y2="409" stroke="#446688" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  </g>
  <text x="410" y="414" font-size="11" fill="#4a7a3a" font-weight="bold">原结构复原 ✓</text>
</svg>
