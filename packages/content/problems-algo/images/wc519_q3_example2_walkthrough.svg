<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="640" height="560" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">示例 2 演算:窗口总对数 7 − 等值假对 3 = 4</text>

  <!-- 数组 -->
  <g filter="url(#rough2)">
    <rect x="80" y="56" width="50" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <rect x="150" y="56" width="50" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="220" y="56" width="50" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <rect x="290" y="56" width="50" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <rect x="360" y="56" width="50" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="105" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">6</text>
  <text x="175" y="80" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7</text>
  <text x="245" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">6</text>
  <text x="315" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">6</text>
  <text x="385" y="80" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7</text>

  <text x="105" y="108" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="175" y="108" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="245" y="108" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="315" y="108" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="385" y="108" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4</text>

  <!-- next_smaller 行 -->
  <text x="60" y="128" font-size="11" fill="#888" filter="url(#rough2)">nxt:</text>
  <text x="105" y="128" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">5</text>
  <text x="175" y="128" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">2</text>
  <text x="245" y="128" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">5</text>
  <text x="315" y="128" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">5</text>
  <text x="385" y="128" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">5</text>

  <!-- 窗口横条 -->
  <text x="60" y="168" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">① 窗口总对数 weak</text>
  <text x="60" y="186" font-size="10" fill="#888" filter="url(#rough2)">j 落在 (i, nxt[i]) 内即计入</text>

  <text x="68" y="212" font-size="11" fill="#555" filter="url(#rough2)">i=0</text>
  <rect x="150" y="202" width="260" height="15" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="422" y="214" font-size="11" fill="#446688" filter="url(#rough2)">j=1..4,长 4</text>

  <text x="68" y="238" font-size="11" fill="#555" filter="url(#rough2)">i=1</text>
  <text x="160" y="240" font-size="11" fill="#999" filter="url(#rough2)">空(nxt=2,窗口 (1,2) 无下标)</text>

  <text x="68" y="264" font-size="11" fill="#555" filter="url(#rough2)">i=2</text>
  <rect x="290" y="254" width="120" height="15" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="422" y="266" font-size="11" fill="#446688" filter="url(#rough2)">j=3..4,长 2</text>

  <text x="68" y="290" font-size="11" fill="#555" filter="url(#rough2)">i=3</text>
  <rect x="360" y="280" width="50" height="15" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="422" y="292" font-size="11" fill="#446688" filter="url(#rough2)">j=4,长 1</text>

  <text x="68" y="316" font-size="11" fill="#555" filter="url(#rough2)">i=4</text>
  <text x="160" y="318" font-size="11" fill="#999" filter="url(#rough2)">空</text>

  <rect x="60" y="330" width="440" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">weak = 4 + 0 + 2 + 1 + 0 = 7(含 nums[j] = nums[i] 的假对)</text>

  <!-- 等值分组 -->
  <text x="60" y="392" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">② 按(值, next_smaller)分组,组内任取一对都是假对</text>

  <rect x="60" y="404" width="280" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="426" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">组(值 6, nxt 5):下标 {0, 2, 3}</text>
  <text x="200" y="446" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">C(3,2) = 3:(0,2)(0,3)(2,3) 全是 6=6 假对</text>

  <rect x="356" y="404" width="120" height="52" rx="8" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="416" y="426" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">组(7, 2):{1}</text>
  <text x="416" y="446" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">0 对</text>

  <rect x="492" y="404" width="120" height="52" rx="8" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="552" y="426" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">组(7, 5):{4}</text>
  <text x="552" y="446" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">0 对</text>

  <text x="60" y="482" font-size="11" fill="#555" filter="url(#rough2)">同组 ⟺ 同值且同 next_smaller ⟺ 两下标互在对方窗口内且等值(引理 3)</text>
  <text x="60" y="500" font-size="11" fill="#555" filter="url(#rough2)">equal = 3 + 0 + 0 = 3</text>

  <!-- 结论 -->
  <rect x="60" y="516" width="552" height="34" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="336" y="538" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">答案 = weak − equal = 7 − 3 = 4 ✓(与示例输出一致)</text>
</svg>
