<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrowL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L1,4 L8,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="440" height="500" fill="#fafafa"/>

  <text x="220" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">右上角搜索算法流程</text>

  <!-- Init -->
  <rect x="110" y="40" width="220" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="220" y="62" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">初始化</text>
  <text x="220" y="80" text-anchor="middle" font-size="11" fill="#555">row = 0, col = n − 1（右上角）</text>

  <path d="M 220 94 L 220 112" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Loop cond -->
  <rect x="80" y="116" width="280" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="220" y="135" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">while row &lt; m 且 col ≥ 0</text>
  <text x="220" y="151" text-anchor="middle" font-size="10.5" fill="#777">指针未越界就继续</text>

  <path d="M 220 164 L 220 184" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Diamond1: == target? -->
  <polygon points="220,189 330,232 220,275 110,232" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="220" y="228" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">matrix[r][c] == target ?</text>
  <text x="220" y="246" text-anchor="middle" font-size="10.5" fill="#777">相等吗？</text>

  <!-- Yes branch -> return true -->
  <path d="M 330 232 L 390 232" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <text x="350" y="225" font-size="11" fill="#4a7a3a" font-weight="bold">Yes</text>
  <rect x="348" y="252" width="88" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="392" y="271" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">return true</text>
  <text x="392" y="286" text-anchor="middle" font-size="9.5" fill="#4a7a3a">命中</text>

  <!-- No branch -> down to diamond2 -->
  <path d="M 220 275 L 220 300" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="232" y="293" font-size="11" fill="#b85450" font-weight="bold">No</text>

  <!-- Diamond2: > target? -->
  <polygon points="220,305 330,348 220,391 110,348" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="220" y="344" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">matrix[r][c] &gt; target ?</text>
  <text x="220" y="362" text-anchor="middle" font-size="10.5" fill="#777">比目标大吗？</text>

  <!-- Yes (left): move left, decrement col -->
  <path d="M 110 348 L 60 348" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowL)" filter="url(#rough2)"/>
  <text x="80" y="341" font-size="11" fill="#b85450" font-weight="bold">Yes</text>
  <rect x="12" y="328" width="92" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="58" y="347" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">col−−</text>
  <text x="58" y="362" text-anchor="middle" font-size="9.5" fill="#b85450">整列排除，左移</text>

  <!-- No (right) -> row++ -->
  <path d="M 330 348 L 380 348" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <text x="345" y="341" font-size="11" fill="#4a7a3a" font-weight="bold">No</text>
  <rect x="336" y="328" width="92" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="382" y="347" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">row++</text>
  <text x="382" y="362" text-anchor="middle" font-size="9.5" fill="#446688">整行排除，下移</text>

  <!-- merge arrows back to loop cond -->
  <path d="M 58 328 L 58 168 L 76 168" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <path d="M 382 328 L 382 168 L 364 168" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrowL)" filter="url(#rough2)"/>

  <!-- loop exit note -->
  <path d="M 80 138 L 40 138 L 40 412" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="48" y="100" font-size="9.5" fill="#888">越界</text>
  <rect x="60" y="416" width="320" height="44" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="220" y="435" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">循环结束（指针越界）→ return false</text>
  <text x="220" y="451" text-anchor="middle" font-size="10" fill="#888">最多 m + n 次比较，O(m + n) / O(1)</text>

  <text x="220" y="486" text-anchor="middle" font-size="10" fill="#d6a040" font-style="italic">左下角作起点亦可：target&gt;当前则右移，target&lt;当前则上移</text>
</svg>
