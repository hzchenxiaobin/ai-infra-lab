<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" font-family="'Comic Sans MS','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="760" height="540" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">机器人 i 是否被吸收：两级判定（从右往左）</text>
  <text x="40" y="116" font-size="10" fill="#888" filter="url(#rough2)">g = 栈顶 = i 右侧最近的幸存组，轨迹已固定</text>

  <!-- start -->
  <rect x="190" y="48" width="380" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">从右往左取机器人 i（栈 = 右侧幸存组）</text>
  <path d="M 380 92 L 380 122" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond 1: t=0 chain -->
  <polygon points="380,126 540,172 380,218 220,172" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="168" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#rough2)">与右邻 i+1 的初始间距</text>
  <text x="380" y="186" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#rough2)">≤ d ?</text>

  <!-- yes -> carried at t=0 -->
  <path d="M 540 172 L 570 172" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="544" y="162" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="574" y="148" width="170" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="659" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">t=0 被右邻带走</text>
  <text x="659" y="186" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">跳过，栈不变</text>

  <!-- no -> diamond 2 -->
  <path d="M 380 218 L 380 262" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="394" y="248" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">否（gap &gt; d 自动成立）</text>

  <polygon points="380,266 540,312 380,358 220,312" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="308" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#rough2)">间距是否线性缩小？</text>
  <text x="380" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#rough2)">vᵢ &gt; g.v ?</text>

  <!-- yes -> absorb at t* -->
  <path d="M 540 312 L 570 312" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="544" y="302" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="574" y="288" width="170" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="659" y="308" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">t* 时刻并入 g</text>
  <text x="659" y="326" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">t* = (gap−d)/(vᵢ−g.v)</text>

  <!-- no -> push new group -->
  <path d="M 380 358 L 380 392" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="394" y="382" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否（永不追上）</text>
  <rect x="230" y="396" width="300" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="423" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">i 作为新幸存组入栈</text>

  <!-- converge to next -->
  <path d="M 659 196 L 659 482 M 659 336 L 659 482" stroke="#3a3a3a" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 659 482 L 659 500 L 552 500" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 380 440 L 380 474" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="212" y="478" width="336" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="505" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">处理下一个 i；扫描结束 → 答案 = 栈大小</text>
</svg>
