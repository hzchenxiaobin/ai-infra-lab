<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">元素 v = 10 的候选集（设 sum = 50）</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">终值 : 代价 —— 同一终值保留最小代价，终值 0 与 &gt; sum 的丢弃</text>

  <!-- divide chain -->
  <text x="60" y="78" font-size="11.5" fill="#4a7a3a" font-weight="bold">纯除链：</text>

  <rect x="60" y="90" width="76" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="98" y="109" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">10</text>
  <text x="98" y="126" text-anchor="middle" font-size="9.5" fill="#4a7a3a">代价 0</text>

  <path d="M 136 112 L 164 112" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="105" text-anchor="middle" font-size="9.5" fill="#4a7a3a">÷2</text>

  <rect x="166" y="90" width="76" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="204" y="109" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <text x="204" y="126" text-anchor="middle" font-size="9.5" fill="#4a7a3a">代价 1</text>

  <path d="M 242 112 L 270 112" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="256" y="105" text-anchor="middle" font-size="9.5" fill="#4a7a3a">÷2</text>

  <rect x="272" y="90" width="76" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="109" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <text x="310" y="126" text-anchor="middle" font-size="9.5" fill="#4a7a3a">代价 2</text>

  <path d="M 348 112 L 376 112" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="362" y="105" text-anchor="middle" font-size="9.5" fill="#4a7a3a">÷2</text>

  <rect x="378" y="90" width="76" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="416" y="109" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="416" y="126" text-anchor="middle" font-size="9.5" fill="#4a7a3a">代价 3</text>

  <path d="M 454 112 L 482 112" stroke="#999" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="484" y="90" width="56" height="44" fill="#eeeeee" stroke="#999" stroke-width="1.1" rx="8" filter="url(#rough2)"/>
  <text x="512" y="109" text-anchor="middle" font-size="12" fill="#888">0</text>
  <text x="512" y="126" text-anchor="middle" font-size="9" fill="#999">丢弃</text>

  <!-- multiply chain -->
  <text x="60" y="172" font-size="11.5" fill="#446688" font-weight="bold">纯乘链：</text>

  <rect x="60" y="184" width="76" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="98" y="203" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">10</text>
  <text x="98" y="220" text-anchor="middle" font-size="9.5" fill="#446688">代价 0 ✓</text>

  <path d="M 136 206 L 164 206" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="199" text-anchor="middle" font-size="9.5" fill="#446688">×2</text>

  <rect x="166" y="184" width="76" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="204" y="203" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">20</text>
  <text x="204" y="220" text-anchor="middle" font-size="9.5" fill="#446688">代价 1</text>

  <path d="M 242 206 L 270 206" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="256" y="199" text-anchor="middle" font-size="9.5" fill="#446688">×2</text>

  <rect x="272" y="184" width="76" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="203" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">40</text>
  <text x="310" y="220" text-anchor="middle" font-size="9.5" fill="#446688">代价 2</text>

  <path d="M 348 206 L 376 206" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="362" y="199" text-anchor="middle" font-size="9.5" fill="#b85450">×2</text>

  <rect x="378" y="184" width="76" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="416" y="203" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">80</text>
  <text x="416" y="220" text-anchor="middle" font-size="9.5" fill="#b85450">&gt; 50 截断</text>

  <!-- notes -->
  <rect x="40" y="252" width="480" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="60" y="274" font-size="11" fill="#333" font-weight="bold">去重合并：{10:0, 5:1, 2:2, 1:3, 20:1, 40:2} 共 6 个候选</text>
  <text x="60" y="292" font-size="10.5" fill="#555">每个元素的候选数 ≈ log₂v + log₂(sum/v) ≤ 9 + 13，平均约 12 个</text>
  <text x="60" y="310" font-size="10.5" fill="#555">（对比：不去重的混合 (m, j) 组合有上百个，且有冗余）</text>
</svg>
