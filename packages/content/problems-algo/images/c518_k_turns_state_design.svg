<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 660" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="920" height="660" fill="#fafafa"/>

  <text x="460" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">状态设计：把「方向 + 转向数」一起装进状态 (r, c, d, t)</text>
  <path d="M 230 46 Q 460 54 690 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- Panel 1: position -->
  <text x="141" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">① 位置 (r, c)：所在格子</text>
  <g filter="url(#rough2)">
    <rect x="75" y="100" width="44" height="44" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
    <rect x="119" y="100" width="44" height="44" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
    <rect x="163" y="100" width="44" height="44" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
    <rect x="75" y="144" width="44" height="44" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
    <rect x="119" y="144" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="163" y="144" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="75" y="188" width="44" height="44" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
    <rect x="119" y="188" width="44" height="44" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
    <rect x="163" y="188" width="44" height="44" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  </g>
  <text x="141" y="171" text-anchor="middle" font-size="10" font-weight="bold" fill="#446688" filter="url(#rough2)">(r,c)</text>
  <text x="185" y="171" text-anchor="middle" font-size="9" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">(nr,nc)</text>
  <path d="M 145 166 L 175 166" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="141" y="252" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">走向相邻格 (nr, nc)</text>

  <!-- Panel 2: direction -->
  <text x="462" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">② 方向 d：上一步怎么走进来的</text>
  <g filter="url(#rough2)">
    <rect x="320" y="104" width="64" height="56" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="396" y="104" width="64" height="56" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="472" y="104" width="64" height="56" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="548" y="104" width="64" height="56" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="352" y="130" text-anchor="middle" font-size="18" fill="#446688" filter="url(#rough2)">↑</text>
  <text x="428" y="130" text-anchor="middle" font-size="18" fill="#446688" filter="url(#rough2)">↓</text>
  <text x="504" y="130" text-anchor="middle" font-size="18" fill="#446688" filter="url(#rough2)">←</text>
  <text x="580" y="130" text-anchor="middle" font-size="18" fill="#446688" filter="url(#rough2)">→</text>
  <text x="352" y="152" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">d=0 上</text>
  <text x="428" y="152" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">d=1 下</text>
  <text x="504" y="152" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">d=2 左</text>
  <text x="580" y="152" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">d=3 右</text>
  <text x="462" y="186" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">同一个格子、不同进入方向是不同状态</text>

  <!-- Panel 3: turns layers -->
  <text x="755" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">③ 转向数 t ∈ [0, k]</text>
  <g filter="url(#rough2)">
    <rect x="660" y="100" width="180" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="668" y="140" width="180" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="676" y="200" width="180" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="750" y="121" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#rough2)">t = 0（尚未转向）</text>
  <text x="758" y="161" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#rough2)">t = 1</text>
  <text x="762" y="192" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">⋮</text>
  <text x="766" y="221" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#rough2)">t = k（预算用完）</text>
  <text x="755" y="252" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">每层都是完整的 位置 × 方向</text>

  <!-- arrows from panels to state box -->
  <path d="M 170 236 C 210 262, 240 274, 275 286" stroke="#aaaaaa" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 462 192 C 462 230, 460 258, 460 284" stroke="#aaaaaa" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 745 258 C 700 272, 665 280, 628 288" stroke="#aaaaaa" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- state box -->
  <g filter="url(#rough2)">
    <rect x="210" y="290" width="500" height="58" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="460" y="315" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6a" filter="url(#rough2)">状态 (r, c, d, t)</text>
  <text x="460" y="336" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">到达 (r,c)、上一步方向为 d、已用 t 次转向时的最小代价 dist</text>

  <!-- transition -->
  <text x="460" y="392" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">状态转移：从 (r, c, d, t) 沿方向 d′ 走一格到 (nr, nc)</text>

  <g filter="url(#rough2)">
    <rect x="70" y="420" width="190" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="165" y="447" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6a" filter="url(#rough2)">S = (r, c, d, t)</text>
  <text x="165" y="469" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">已累计代价 dist[S]</text>

  <g filter="url(#rough2)">
    <rect x="670" y="420" width="190" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="765" y="447" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e" filter="url(#rough2)">S′ = (nr, nc, d′, t′)</text>
  <text x="765" y="469" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">新代价 dist[S] + grid[nr][nc]</text>

  <path d="M 262 436 C 400 404, 530 404, 666 436" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="464" y="412" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">d′ = d（直行）：t′ = t</text>

  <path d="M 262 470 C 400 506, 530 506, 666 470" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="464" y="522" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">d′ ≠ d（转向）：t′ = t + 1</text>

  <text x="464" y="458" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333" filter="url(#rough2)">边权 = grid[nr][nc] ≥ 0</text>

  <!-- condition box -->
  <g filter="url(#rough2)">
    <rect x="240" y="540" width="440" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="460" y="567" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#rough2)">仅当 t′ ≤ k 时才松弛入堆，否则丢弃该转移</text>

  <!-- key insight -->
  <g filter="url(#rough2)">
    <rect x="60" y="602" width="800" height="44" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="76" y="629" font-size="12" fill="#444444" filter="url(#rough2)">关键洞察：转向数决定后续还能不能拐 → 必须放入状态；格子代价 ≥ 0 → 边权非负 → Dijkstra 可直接求解</text>
</svg>
