<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="r5"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="53"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="ar5" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="600" height="380" fill="#fafafa"/>
  <text x="300" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r5)">两正方形不重叠 ⟺ 可被水平线或竖直线分隔</text>

  <!-- left: two squares non-overlapping, separable by vertical line -->
  <text x="40" y="62" font-size="12" font-weight="bold" fill="#446688" filter="url(#r5)">列可分隔（竖线）</text>
  <g filter="url(#r5)" font-size="10" font-family="monospace">
    <rect x="50" y="78" width="22" height="22" fill="#e8f0fe" stroke="#446688"/>
    <rect x="72" y="78" width="22" height="22" fill="#e8f0fe" stroke="#446688"/>
    <rect x="50" y="100" width="22" height="22" fill="#e8f0fe" stroke="#446688"/>
    <rect x="72" y="100" width="22" height="22" fill="#e8f0fe" stroke="#446688"/>
    <rect x="150" y="78" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a"/>
    <rect x="172" y="78" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a"/>
    <rect x="150" y="100" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a"/>
    <rect x="172" y="100" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a"/>
    <path d="M138 70 L138 132" stroke="#b85450" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="125" y="146" fill="#b85450">竖线</text>
  </g>

  <!-- right: separable by horizontal line -->
  <text x="330" y="62" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#r5)">行可分隔（水平线）</text>
  <g filter="url(#r5)" font-size="10" font-family="monospace">
    <rect x="340" y="78" width="22" height="22" fill="#e8f0fe" stroke="#446688"/>
    <rect x="362" y="78" width="22" height="22" fill="#e8f0fe" stroke="#446688"/>
    <rect x="440" y="78" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a"/>
    <rect x="462" y="78" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a"/>
    <rect x="340" y="118" width="22" height="22" fill="#e8f0fe" stroke="#446688"/>
    <rect x="362" y="118" width="22" height="22" fill="#e8f0fe" stroke="#446688"/>
    <rect x="440" y="118" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a"/>
    <rect x="462" y="118" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a"/>
    <path d="M325 108 L490 108" stroke="#b85450" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="495" y="112" fill="#b85450">水平线</text>
  </g>

  <!-- insight box -->
  <rect x="20" y="160" width="560" height="100" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#r5)"/>
  <text x="36" y="184" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#r5)">关键观察：两个轴对齐正方形不共享单元格</text>
  <text x="36" y="204" font-size="11" fill="#333" filter="url(#r5)">⟺ 行区间不相交  或  列区间不相交</text>
  <text x="36" y="222" font-size="11" fill="#333" filter="url(#r5)">⟺ 存在一条水平线或竖直线把两方块分在两侧</text>
  <text x="36" y="240" font-size="11" fill="#b85450" filter="url(#r5)">→ 只需对每个 k 检查所有「行分割 / 列分割」即可</text>
  <text x="36" y="254" font-size="11" fill="#888" filter="url(#r5)">　用四方向前缀数组 O(mn) 判定，配合二分 k → O(mn log min(m,n))</text>

  <!-- binary search monotonicity -->
  <rect x="20" y="276" width="560" height="86" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#r5)"/>
  <text x="36" y="298" font-size="12" font-weight="bold" fill="#b85450" filter="url(#r5)">单调性 → 二分最大 k</text>
  <text x="36" y="318" font-size="11" fill="#333" filter="url(#r5)">若存在两个不重叠 k×k 全 1 正方形，则取其左上 (k−1)×(k−1) 子块</text>
  <text x="36" y="336" font-size="11" fill="#333" filter="url(#r5)">仍全 1 且不重叠 ⟹ k−1 也可行。故可行性关于 k 单调。</text>
  <text x="36" y="354" font-size="11" fill="#b85450" filter="url(#r5)">二分 k ∈ [1, min(m,n)]，最大可行 k，答案 = k²（无可行则 0）</text>
</svg>
