<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 7 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">直径在某个节点处「折弯」</text>

  <!-- Non-path edges (light) -->
  <line x1="170" y1="150" x2="210" y2="230" stroke="#b0b0b0" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Highlighted diameter path: 4 -> 2 -> 1 -> 3 -->
  <path d="M 130 230 L 170 150 L 260 70 L 350 150" stroke="#b85450" stroke-width="3" fill="none" filter="url(#rough2)"/>

  <!-- Nodes (path nodes in red/orange) -->
  <circle cx="260" cy="70" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="260" y="75" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <circle cx="170" cy="150" r="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="170" y="155" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>

  <circle cx="350" cy="150" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="350" y="155" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>

  <circle cx="130" cy="230" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="130" y="235" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>

  <circle cx="210" cy="230" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="235" text-anchor="middle" font-size="14" fill="#333">5</text>

  <!-- Bend point annotation -->
  <text x="300" y="62" font-size="11" fill="#b85450" font-weight="bold">折弯点</text>
  <path d="M 296 66 L 282 66" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- Edge labels -->
  <text x="120" y="200" font-size="10" fill="#b85450">1 边</text>
  <text x="150" y="118" font-size="10" fill="#b85450">1 边</text>
  <text x="318" y="118" font-size="10" fill="#b85450">1 边</text>
  <text x="180" y="200" font-size="9" fill="#888">不在路径上</text>

  <!-- Formula box -->
  <rect x="40" y="285" width="440" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="308" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">经过 node 的路径边数 = dfs(left) + dfs(right)</text>
  <text x="260" y="330" text-anchor="middle" font-size="12" fill="#555">本例：dfs(2) + dfs(3) = 2 + 1 = 3 ✓</text>
</svg>
