<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="440" height="500" fill="#fafafa"/>

  <text x="220" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">和为 K 的子数组：算法流程</text>

  <!-- Init -->
  <rect x="90" y="40" width="260" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="220" y="62" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">初始化</text>
  <text x="220" y="82" text-anchor="middle" font-size="11" fill="#555">count = {0:1}, ans = 0, S = 0</text>

  <path d="M 220 100 L 220 118" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Loop entry -->
  <rect x="80" y="122" width="280" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="220" y="142" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">for x in nums</text>
  <text x="220" y="158" text-anchor="middle" font-size="10.5" fill="#555">遍历每个元素</text>

  <path d="M 220 170 L 220 188" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- S += x -->
  <rect x="110" y="192" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="220" y="217" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">S += x</text>

  <path d="M 220 236 L 220 254" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Diamond: S-k in count? -->
  <polygon points="220,258 340,304 220,350 100,304" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="220" y="300" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">count 中有 S−k ?</text>
  <text x="220" y="318" text-anchor="middle" font-size="10.5" fill="#777">之前存在该前缀和？</text>

  <!-- Yes branch -->
  <path d="M 100 304 L 50 304 L 50 360" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="62" y="297" font-size="11" fill="#82b366" font-weight="bold">Yes</text>
  <rect x="6" y="364" width="110" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="61" y="386" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">累加答案</text>
  <text x="61" y="404" text-anchor="middle" font-size="10" fill="#555">ans += count[S−k]</text>

  <!-- No branch -->
  <path d="M 340 304 L 390 304 L 390 360" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="362" y="297" font-size="11" fill="#b85450" font-weight="bold">No</text>
  <rect x="324" y="364" width="110" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="379" y="386" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">跳过</text>
  <text x="379" y="404" text-anchor="middle" font-size="10" fill="#555">命中数为 0</text>

  <!-- merge to write -->
  <path d="M 61 420 L 61 442 L 160 442" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <path d="M 379 420 L 379 442 L 280 442" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrowR)" filter="url(#rough2)"/>

  <!-- write count[S] -->
  <rect x="100" y="426" width="240" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="220" y="451" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">count[S] += 1   （先查再写）</text>

  <!-- loop back -->
  <path d="M 340 446 L 410 446 L 410 144 L 360 144" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <text x="416" y="300" font-size="9.5" fill="#aaa" transform="rotate(-90 416 300)">循环</text>

  <!-- final -->
  <text x="220" y="488" text-anchor="middle" font-size="11" fill="#d6a040" font-style="italic">遍历结束 → return ans  （O(n), O(n)）</text>
</svg>
