<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="300" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：原始棋盘 → 标记边界连通块 → 翻转结果</text>

  <g filter="url(#rough2)" font-size="14" font-weight="bold">
    <!-- ===== Panel A: original ===== -->
    <text x="92" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① 原始棋盘</text>
    <!-- row0 -->
    <rect x="24" y="80" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="41" y="103" text-anchor="middle" fill="#446688">X</text>
    <rect x="58" y="80" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="75" y="103" text-anchor="middle" fill="#446688">X</text>
    <rect x="92" y="80" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="109" y="103" text-anchor="middle" fill="#446688">X</text>
    <rect x="126" y="80" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="143" y="103" text-anchor="middle" fill="#446688">X</text>
    <!-- row1 -->
    <rect x="24" y="114" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="41" y="137" text-anchor="middle" fill="#446688">X</text>
    <rect x="58" y="114" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/><text x="75" y="137" text-anchor="middle" fill="#d6a040">O</text>
    <rect x="92" y="114" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/><text x="109" y="137" text-anchor="middle" fill="#d6a040">O</text>
    <rect x="126" y="114" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="143" y="137" text-anchor="middle" fill="#446688">X</text>
    <!-- row2 -->
    <rect x="24" y="148" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="41" y="171" text-anchor="middle" fill="#446688">X</text>
    <rect x="58" y="148" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="75" y="171" text-anchor="middle" fill="#446688">X</text>
    <rect x="92" y="148" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/><text x="109" y="171" text-anchor="middle" fill="#d6a040">O</text>
    <rect x="126" y="148" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="143" y="171" text-anchor="middle" fill="#446688">X</text>
    <!-- row3 -->
    <rect x="24" y="182" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="41" y="205" text-anchor="middle" fill="#446688">X</text>
    <rect x="58" y="182" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/><text x="75" y="205" text-anchor="middle" fill="#d6a040">O</text>
    <rect x="92" y="182" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="109" y="205" text-anchor="middle" fill="#446688">X</text>
    <rect x="126" y="182" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="143" y="205" text-anchor="middle" fill="#446688">X</text>

    <!-- arrow A->B -->
    <path d="M 168 165 L 196 165" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="182" y="156" text-anchor="middle" font-size="9" fill="#666">边界DFS</text>

    <!-- ===== Panel B: marked ===== -->
    <text x="270" y="72" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">② 标记：边界连通的 O → #</text>
    <!-- row0 -->
    <rect x="202" y="80" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="219" y="103" text-anchor="middle" fill="#446688">X</text>
    <rect x="236" y="80" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="253" y="103" text-anchor="middle" fill="#446688">X</text>
    <rect x="270" y="80" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="287" y="103" text-anchor="middle" fill="#446688">X</text>
    <rect x="304" y="80" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="321" y="103" text-anchor="middle" fill="#446688">X</text>
    <!-- row1 -->
    <rect x="202" y="114" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="219" y="137" text-anchor="middle" fill="#446688">X</text>
    <rect x="236" y="114" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/><text x="253" y="137" text-anchor="middle" fill="#d6a040">O</text>
    <rect x="270" y="114" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/><text x="287" y="137" text-anchor="middle" fill="#d6a040">O</text>
    <rect x="304" y="114" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="321" y="137" text-anchor="middle" fill="#446688">X</text>
    <!-- row2 -->
    <rect x="202" y="148" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="219" y="171" text-anchor="middle" fill="#446688">X</text>
    <rect x="236" y="148" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="253" y="171" text-anchor="middle" fill="#446688">X</text>
    <rect x="270" y="148" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/><text x="287" y="171" text-anchor="middle" fill="#d6a040">O</text>
    <rect x="304" y="148" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="321" y="171" text-anchor="middle" fill="#446688">X</text>
    <!-- row3: (3,1) marked # -->
    <rect x="202" y="182" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="219" y="205" text-anchor="middle" fill="#446688">X</text>
    <rect x="236" y="182" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3"/><text x="253" y="205" text-anchor="middle" fill="#4a7a3a">#</text>
    <rect x="270" y="182" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="287" y="205" text-anchor="middle" fill="#446688">X</text>
    <rect x="304" y="182" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="321" y="205" text-anchor="middle" fill="#446688">X</text>

    <!-- arrow B->C -->
    <path d="M 346 165 L 374 165" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="360" y="156" text-anchor="middle" font-size="9" fill="#666">扫描翻转</text>

    <!-- ===== Panel C: final ===== -->
    <text x="448" y="72" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">③ 翻转：O→X，#→O</text>
    <!-- row0 -->
    <rect x="380" y="80" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="397" y="103" text-anchor="middle" fill="#446688">X</text>
    <rect x="414" y="80" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="431" y="103" text-anchor="middle" fill="#446688">X</text>
    <rect x="448" y="80" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="465" y="103" text-anchor="middle" fill="#446688">X</text>
    <rect x="482" y="80" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="499" y="103" text-anchor="middle" fill="#446688">X</text>
    <!-- row1: flipped (1,1)(1,2) -->
    <rect x="380" y="114" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="397" y="137" text-anchor="middle" fill="#446688">X</text>
    <rect x="414" y="114" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3"/><text x="431" y="137" text-anchor="middle" fill="#b85450">X</text>
    <rect x="448" y="114" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3"/><text x="465" y="137" text-anchor="middle" fill="#b85450">X</text>
    <rect x="482" y="114" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="499" y="137" text-anchor="middle" fill="#446688">X</text>
    <!-- row2: flipped (2,2) -->
    <rect x="380" y="148" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="397" y="171" text-anchor="middle" fill="#446688">X</text>
    <rect x="414" y="148" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="431" y="171" text-anchor="middle" fill="#446688">X</text>
    <rect x="448" y="148" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3"/><text x="465" y="171" text-anchor="middle" fill="#b85450">X</text>
    <rect x="482" y="148" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="499" y="171" text-anchor="middle" fill="#446688">X</text>
    <!-- row3: (3,1) restored O -->
    <rect x="380" y="182" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="397" y="205" text-anchor="middle" fill="#446688">X</text>
    <rect x="414" y="182" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3"/><text x="431" y="205" text-anchor="middle" fill="#4a7a3a">O</text>
    <rect x="448" y="182" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="465" y="205" text-anchor="middle" fill="#446688">X</text>
    <rect x="482" y="182" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="499" y="205" text-anchor="middle" fill="#446688">X</text>
  </g>

  <!-- legend -->
  <g filter="url(#rough2)" font-size="11">
    <rect x="60" y="244" width="18" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="2"/>
    <text x="84" y="255" fill="#666">原 O</text>
    <rect x="140" y="244" width="18" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="2"/>
    <text x="164" y="255" fill="#666"># = 安全(连边界)</text>
    <rect x="290" y="244" width="18" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2"/>
    <text x="314" y="255" fill="#666">新 X = 被围绕翻掉的 O</text>
    <rect x="470" y="244" width="18" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="2"/>
    <text x="494" y="255" fill="#666">保住的 O</text>
  </g>
  <text x="270" y="284" text-anchor="middle" font-size="11" fill="#888">只有底边 (3,1) 与边界连通 → 标 # → 还原为 O；其余内部 O 不连边界 → 翻成 X</text>
</svg>
