<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程</text>

  <!-- Start -->
  <ellipse cx="260" cy="50" rx="44" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="55" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">开始</text>

  <path d="M 260 70 L 260 88" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 1 -->
  <rect x="70" y="90" width="380" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="112" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">从左到右扫描，维护左侧最大 maxSeen</text>
  <text x="260" y="132" text-anchor="middle" font-size="12" fill="#444">若 nums[i] &lt; maxSeen，则 end = i</text>

  <path d="M 260 148 L 260 166" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="70" y="168" width="380" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="190" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">从右到左扫描，维护右侧最小 minSeen</text>
  <text x="260" y="210" text-anchor="middle" font-size="12" fill="#444">若 nums[i] &gt; minSeen，则 start = i</text>

  <path d="M 260 226 L 260 244" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Diamond -->
  <polygon points="260,244 334,282 260,320 186,282" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="287" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">end == −1 ?</text>

  <!-- yes branch -->
  <path d="M 334 282 L 392 282" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="360" y="276" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="392" y="262" width="118" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="451" y="287" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 0</text>

  <!-- no branch -->
  <path d="M 260 320 L 260 348" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="276" y="338" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="130" y="350" width="260" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="375" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">返回 end − start + 1</text>
</svg>
