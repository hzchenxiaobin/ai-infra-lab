<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：prices=[1,2,3,0,2] 递推到 sold[4]=3</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">操作序列：买@1 → 卖@2 → 冷冻 → 买@0 → 卖@2，收益 1+2=3</text>

  <!-- ===== column headers ===== -->
  <g font-size="10" fill="#888">
    <text x="60" y="76" font-weight="bold">i:</text>
    <text x="110" y="76" text-anchor="middle">0</text>
    <text x="180" y="76" text-anchor="middle">1</text>
    <text x="250" y="76" text-anchor="middle">2</text>
    <text x="320" y="76" text-anchor="middle">3</text>
    <text x="390" y="76" text-anchor="middle">4</text>
  </g>

  <!-- ===== price row ===== -->
  <g font-size="11">
    <text x="60" y="100" font-size="10" fill="#446688" font-weight="bold">price:</text>
    <rect x="90"  y="82" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="110" y="100" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="160" y="82" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="180" y="100" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <rect x="230" y="82" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="250" y="100" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
    <rect x="300" y="82" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="320" y="100" text-anchor="middle" fill="#446688" font-weight="bold">0</text>
    <rect x="370" y="82" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="390" y="100" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
  </g>

  <!-- ===== hold row ===== -->
  <g font-size="11">
    <text x="60" y="136" font-size="10" fill="#b85450" font-weight="bold">hold:</text>
    <rect x="90"  y="118" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="110" y="136" text-anchor="middle" fill="#b85450" font-weight="bold">−1</text>
    <rect x="160" y="118" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="180" y="136" text-anchor="middle" fill="#b85450" font-weight="bold">−1</text>
    <rect x="230" y="118" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="250" y="136" text-anchor="middle" fill="#b85450" font-weight="bold">−1</text>
    <rect x="300" y="118" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="320" y="136" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="370" y="118" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="390" y="136" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
  </g>

  <!-- ===== free row ===== -->
  <g font-size="11">
    <text x="60" y="172" font-size="10" fill="#4a7a3a" font-weight="bold">free:</text>
    <rect x="90"  y="154" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="110" y="172" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>
    <rect x="160" y="154" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="180" y="172" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>
    <rect x="230" y="154" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="250" y="172" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="300" y="154" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="320" y="172" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="370" y="154" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="390" y="172" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
  </g>

  <!-- ===== sold row ===== -->
  <g font-size="11">
    <text x="60" y="208" font-size="10" fill="#d6a040" font-weight="bold">sold:</text>
    <rect x="90"  y="190" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="110" y="208" text-anchor="middle" fill="#d6a040" font-weight="bold">0</text>
    <rect x="160" y="190" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="180" y="208" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <rect x="230" y="190" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="250" y="208" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
    <rect x="300" y="190" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="320" y="208" text-anchor="middle" fill="#d6a040" font-weight="bold">−1</text>
    <rect x="370" y="190" width="40" height="26" fill="#fff8e1" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
    <text x="390" y="208" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
  </g>

  <!-- ===== action row ===== -->
  <g font-size="10">
    <text x="60" y="244" font-size="10" fill="#666" font-weight="bold">操作:</text>
    <rect x="90"  y="226" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="110" y="242" text-anchor="middle" fill="#4a7a3a" font-weight="bold">买</text>
    <rect x="160" y="226" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="180" y="242" text-anchor="middle" fill="#b85450" font-weight="bold">卖</text>
    <rect x="230" y="226" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="250" y="242" text-anchor="middle" fill="#d6a040" font-weight="bold">冷冻</text>
    <rect x="300" y="226" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="320" y="242" text-anchor="middle" fill="#4a7a3a" font-weight="bold">买</text>
    <rect x="370" y="226" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="390" y="242" text-anchor="middle" fill="#b85450" font-weight="bold">卖</text>
  </g>

  <!-- ===== detail ===== -->
  <line x1="20" y1="262" x2="520" y2="262" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <g font-size="9" fill="#333">
    <text x="30" y="282" font-size="10" fill="#444" font-weight="bold">关键递推：</text>
    <text x="30" y="300" font-size="9" fill="#d6a040">i=1: sold = hold[0]+2 = −1+2 = 1（卖在 2，进冷冻）</text>
    <text x="30" y="314" font-size="9" fill="#4a7a3a">i=2: free = max(0, 1) = 1（冷冻期过）；hold 不动</text>
    <text x="30" y="328" font-size="9" fill="#b85450">i=3: hold = max(−1, 1−0) = 1（用利润在低点抄底）</text>
  </g>

  <!-- ===== Result ===== -->
  <rect x="30" y="340" width="480" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="270" y="360" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">最终结果：max(free[4], sold[4]) = max(2, 3) = 3</text>
</svg>
