<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">工位最大间隔：左端贪左 + 右端贪右 + 二分</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">left[i] 尽早分配前 i+1 人，right[i] 尽晚分配后 n-i 人，二分最大间隔</text>

  <text x="40" y="72" font-size="11" fill="#333" font-weight="bold">skill="cbc", station="cbcdbc"，位置: c=[0,2,5], b=[1,4]</text>

  <line x1="40" y1="160" x2="520" y2="160" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>

  <circle cx="80" cy="160" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="145" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">c</text>
  <text x="80" y="186" text-anchor="middle" font-size="9" fill="#888">0</text>

  <circle cx="160" cy="160" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="145" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">b</text>
  <text x="160" y="186" text-anchor="middle" font-size="9" fill="#888">1</text>

  <circle cx="240" cy="160" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="240" y="145" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">c</text>
  <text x="240" y="186" text-anchor="middle" font-size="9" fill="#888">2</text>

  <circle cx="320" cy="160" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="145" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">d</text>
  <text x="320" y="186" text-anchor="middle" font-size="9" fill="#888">3</text>

  <circle cx="400" cy="160" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="400" y="145" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">b</text>
  <text x="400" y="186" text-anchor="middle" font-size="9" fill="#888">4</text>

  <circle cx="480" cy="160" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="480" y="145" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">c</text>
  <text x="480" y="186" text-anchor="middle" font-size="9" fill="#888">5</text>

  <text x="40" y="210" font-size="10" fill="#3a4a66" font-weight="bold">left[]（贪左）:</text>
  <rect x="120" y="200" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="150" y="216" text-anchor="middle" font-size="10" fill="#333">left[0]=0</text>
  <rect x="240" y="200" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="270" y="216" text-anchor="middle" font-size="10" fill="#333">left[1]=1</text>
  <rect x="360" y="200" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="390" y="216" text-anchor="middle" font-size="10" fill="#333">left[2]=2</text>

  <text x="40" y="250" font-size="10" fill="#3a4a66" font-weight="bold">right[]（贪右）:</text>
  <rect x="120" y="240" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="150" y="256" text-anchor="middle" font-size="10" fill="#333">right[0]=2</text>
  <rect x="240" y="240" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="270" y="256" text-anchor="middle" font-size="10" fill="#333">right[1]=4</text>
  <rect x="360" y="240" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="390" y="256" text-anchor="middle" font-size="10" fill="#333">right[2]=5</text>

  <path d="M 390 232 L 420 210" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="280" width="500" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="302" font-size="11" fill="#333" font-weight="bold">二分检查 G：是否存在切分点 i 使 right[i+1] - left[i] &gt;= G</text>
  <text x="50" y="320" font-size="10.5" fill="#555">i=0: right[1]-left[0] = 4-0 = 4; i=1: right[2]-left[1] = 5-1 = 4</text>

  <rect x="30" y="346" width="500" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="368" font-size="11" fill="#4a7a3a" font-weight="bold">答案 G = 4（路径 [0, 1, 5]，间隔 [1, 4]，最大 4）</text>
  <text x="50" y="382" font-size="10.5" fill="#555">O(n log m) 预处理 + O(n log m) 二分检查</text>
</svg>
