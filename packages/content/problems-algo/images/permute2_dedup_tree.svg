<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="480" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">全排列 II：排序后同层去重剪枝（nums = [1,1,2]）</text>

  <!-- Root [] -->
  <rect x="288" y="42" width="64" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="60" text-anchor="middle" font-size="12" fill="#333">path=[]</text>

  <!-- ===== Layer 1 (position 0) ===== -->
  <!-- to [1]0 valid -->
  <path d="M 300 70 L 130 126" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="190" y="92" font-size="10" fill="#82b366">选nums[0]</text>
  <rect x="95" y="126" width="70" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="130" y="144" text-anchor="middle" font-size="12" fill="#333">[1]</text>

  <!-- to [1]1 PRUNED -->
  <path d="M 320 70 L 320 126" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="332" y="100" font-size="10" fill="#b85450">选nums[1]</text>
  <rect x="285" y="126" width="70" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="320" y="144" text-anchor="middle" font-size="12" fill="#b85450">[1] ✗</text>

  <!-- to [2]2 valid -->
  <path d="M 340 70 L 510 126" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="445" y="92" font-size="10" fill="#82b366">选nums[2]</text>
  <rect x="475" y="126" width="70" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="510" y="144" text-anchor="middle" font-size="12" fill="#333">[2]</text>

  <!-- prune reason for root-layer -->
  <rect x="214" y="168" width="212" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="320" y="184" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">✗ 横向同层：nums[1]==nums[0]</text>
  <text x="320" y="197" text-anchor="middle" font-size="10" fill="#b85450">且 !used[0] → 整棵子树重复，剪掉</text>

  <!-- ===== Layer 2 under [1]0 ===== -->
  <path d="M 120 154 L 70 236" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="70" y="196" font-size="10" fill="#82b366">选nums[1]</text>
  <rect x="30" y="236" width="80" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="70" y="254" text-anchor="middle" font-size="12" fill="#333">[1,1]</text>

  <path d="M 145 154 L 180 236" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="176" y="196" font-size="10" fill="#82b366">选nums[2]</text>
  <rect x="145" y="236" width="80" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="185" y="254" text-anchor="middle" font-size="12" fill="#333">[1,2]</text>

  <!-- legit reuse note -->
  <rect x="8" y="274" width="128" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="72" y="290" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">纵向复用：used[0]=T</text>
  <text x="72" y="303" text-anchor="middle" font-size="10" fill="#4a7a3a">不剪枝，合法凑 [1,1,2]</text>

  <!-- ===== Layer 2 under [2]2 ===== -->
  <path d="M 500 154 L 455 236" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="455" y="196" font-size="10" fill="#82b366">选nums[0]</text>
  <rect x="420" y="236" width="80" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="460" y="254" text-anchor="middle" font-size="12" fill="#333">[2,1]</text>

  <path d="M 525 154 L 560 236" stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="556" y="196" font-size="10" fill="#b85450">选nums[1]</text>
  <rect x="525" y="236" width="80" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="565" y="254" text-anchor="middle" font-size="12" fill="#b85450">[2,1] ✗</text>

  <!-- ===== Layer 3 leaves ===== -->
  <path d="M 70 264 L 70 326" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="22" y="326" width="96" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="70" y="344" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">[1,1,2] ✓</text>

  <path d="M 185 264 L 185 326" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="137" y="326" width="96" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="185" y="344" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">[1,2,1] ✓</text>

  <path d="M 460 264 L 460 326" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="412" y="326" width="96" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="460" y="344" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">[2,1,1] ✓</text>

  <!-- ===== Legend ===== -->
  <rect x="30" y="392" width="580" height="72" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="48" y="414" font-size="12" fill="#333" font-weight="bold">关键：</text>
  <rect x="110" y="404" width="16" height="12" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="132" y="414" font-size="11" fill="#555">合法排列（叶子）</text>
  <rect x="250" y="404" width="16" height="12" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="272" y="414" font-size="11" fill="#555">同层去重剪枝</text>
  <rect x="380" y="404" width="16" height="12" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="402" y="414" font-size="11" fill="#555">中间节点</text>
  <text x="48" y="438" font-size="11" fill="#555">剪枝条件：<tspan font-family="monospace" fill="#b85450">i&gt;0 &amp;&amp; nums[i]==nums[i-1] &amp;&amp; !used[i-1]</tspan></text>
  <text x="48" y="456" font-size="11" fill="#555">排序使相同值相邻 → 同层遇到重复值即跳过，重复子树不展开 → 共 3 个不重复排列</text>
</svg>
