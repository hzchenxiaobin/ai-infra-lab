<svg xmlns="http://www.w3.org/2000/svg" width="820" height="320" viewBox="0 0 820 320" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arL" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 z" fill="#b85450"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="820" height="320" fill="#fdfcf7"/>
  <text x="410" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：s = "ff" → 回文判定</text>
  <path d="M 260 38 Q 410 46 560 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- two char blocks -->
  <text x="120" y="76" text-anchor="middle" font-size="11" fill="#888">字符 f</text>
  <g filter="url(#sk)"><rect x="80" y="84" width="80" height="44" rx="6" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="120" y="114" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b4a6e">f</text>

  <text x="260" y="76" text-anchor="middle" font-size="11" fill="#888">字符 f</text>
  <g filter="url(#sk)"><rect x="220" y="84" width="80" height="44" rx="6" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="260" y="114" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b4a6e">f</text>

  <!-- binary rows -->
  <text x="120" y="150" text-anchor="middle" font-size="11" fill="#888">102 = 01100110</text>
  <g font-size="15" font-family="monospace" font-weight="bold">
    <g filter="url(#sk)"><rect x="80" y="160" width="20" height="28" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
    <text x="90" y="180" text-anchor="middle" fill="#2e6e2e">0</text>
    <g filter="url(#sk)"><rect x="102" y="160" width="20" height="28" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
    <text x="112" y="180" text-anchor="middle" fill="#2e6e2e">1</text>
    <g filter="url(#sk)"><rect x="124" y="160" width="20" height="28" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
    <text x="134" y="180" text-anchor="middle" fill="#2e6e2e">1</text>
    <g filter="url(#sk)"><rect x="146" y="160" width="20" height="28" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
    <text x="156" y="180" text-anchor="middle" fill="#2e6e2e">0</text>
    <g filter="url(#sk)"><rect x="168" y="160" width="20" height="28" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
    <text x="178" y="180" text-anchor="middle" fill="#2e6e2e">0</text>
    <g filter="url(#sk)"><rect x="190" y="160" width="20" height="28" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
    <text x="200" y="180" text-anchor="middle" fill="#2e6e2e">1</text>
    <g filter="url(#sk)"><rect x="212" y="160" width="20" height="28" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
    <text x="222" y="180" text-anchor="middle" fill="#2e6e2e">1</text>
    <g filter="url(#sk)"><rect x="234" y="160" width="20" height="28" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
    <text x="244" y="180" text-anchor="middle" fill="#2e6e2e">0</text>
    <g filter="url(#sk)"><rect x="256" y="160" width="20" height="28" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
    <text x="266" y="180" text-anchor="middle" fill="#2e6e2e">0</text>
  </g>

  <!-- second char binary -->
  <text x="260" y="150" text-anchor="middle" font-size="11" fill="#888">102 = 01100110</text>
  <g font-size="15" font-family="monospace" font-weight="bold">
    <g filter="url(#sk)"><rect x="220" y="160" width="20" height="28" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
    <text x="230" y="180" text-anchor="middle" fill="#2e6e2e">0</text>
    <g filter="url(#sk)"><rect x="242" y="160" width="20" height="28" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
    <text x="252" y="180" text-anchor="middle" fill="#2e6e2e">1</text>
    <g filter="url(#sk)"><rect x="264" y="160" width="20" height="28" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
    <text x="274" y="180" text-anchor="middle" fill="#2e6e2e">1</text>
    <g filter="url(#sk)"><rect x="286" y="160" width="20" height="28" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
    <text x="296" y="180" text-anchor="middle" fill="#2e6e2e">0</text>
    <g filter="url(#sk)"><rect x="308" y="160" width="20" height="28" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
    <text x="318" y="180" text-anchor="middle" fill="#2e6e2e">0</text>
    <g filter="url(#sk)"><rect x="330" y="160" width="20" height="28" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
    <text x="340" y="180" text-anchor="middle" fill="#2e6e2e">1</text>
    <g filter="url(#sk)"><rect x="352" y="160" width="20" height="28" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
    <text x="362" y="180" text-anchor="middle" fill="#2e6e2e">1</text>
    <g filter="url(#sk)"><rect x="374" y="160" width="20" height="28" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
    <text x="384" y="180" text-anchor="middle" fill="#2e6e2e">0</text>
    <g filter="url(#sk)"><rect x="396" y="160" width="20" height="28" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
    <text x="406" y="180" text-anchor="middle" fill="#2e6e2e">0</text>
  </g>

  <!-- mirror arrows: left[0] vs right[15], etc -->
  <path d="M 90 196 Q 240 246 406 196" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arR)" marker-start="url(#arL)" filter="url(#sk)"/>
  <path d="M 112 196 Q 258 232 384 196" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arR)" marker-start="url(#arL)" filter="url(#sk)"/>
  <text x="248" y="250" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">首尾配对全相等 → 回文 ✓</text>

  <!-- result box -->
  <g filter="url(#sk)"><rect x="470" y="84" width="300" height="116" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="490" y="110" font-size="13" font-weight="bold" fill="#2e6e2e">判定流程</text>
  <text x="490" y="134" font-size="12" fill="#444" font-family="monospace">拼接串 = 01100110 01100110</text>
  <text x="490" y="156" font-size="12" fill="#444" font-family="monospace">双指针 i,j 首尾比较</text>
  <text x="490" y="178" font-size="12" fill="#b03a3a" font-weight="bold">全部相等 → true</text>

  <!-- note -->
  <g filter="url(#sk)">
    <rect x="470" y="214" width="300" height="84" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="490" y="240" font-size="12" font-weight="bold" fill="#2b2b2b">小技巧</text>
  <text x="490" y="262" font-size="11" fill="#444">Python: bin(x)[2:].zfill(8)</text>
  <text x="490" y="282" font-size="11" fill="#444">直接 t == t[::-1] 判回文</text>
</svg>
