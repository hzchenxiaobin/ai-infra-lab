<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="480" fill="#fafafa"/>
  <text x="320" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">循环移位 = 下标取模映射:行向左、列向上</text>

  <!-- ============ 左面板:行左移 ============ -->
  <text x="170" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">行左移 k = 1(n = 4)</text>

  <!-- 方向箭头:整体向左 -->
  <path d="M 205 88 L 95 88" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="80" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">整体向左移 1 位</text>

  <!-- 移位前的行 -->
  <text x="46" y="119" font-size="12" fill="#888" filter="url(#rough2)">前</text>
  <rect x="66" y="98" width="42" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="87" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">a</text>
  <rect x="110" y="98" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="131" y="120" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <rect x="154" y="98" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="175" y="120" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>
  <rect x="198" y="98" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="219" y="120" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">d</text>

  <!-- a 的环绕轨迹 -->
  <path d="M 87 138 Q 145 172 215 178" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="130" y="166" font-size="10" fill="#b85450" filter="url(#rough2)">a 绕到末尾</text>

  <!-- 移位后的行 -->
  <text x="46" y="219" font-size="12" fill="#888" filter="url(#rough2)">后</text>
  <rect x="66" y="198" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="87" y="220" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <rect x="110" y="198" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="131" y="220" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>
  <rect x="154" y="198" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="175" y="220" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">d</text>
  <rect x="198" y="198" width="42" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="219" y="220" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">a</text>

  <!-- 列号刻度 -->
  <text x="87" y="248" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="131" y="248" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="175" y="248" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="219" y="248" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>

  <text x="170" y="272" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">第 j 列元素 → 第 (j−k+n) % n 列</text>
  <text x="170" y="292" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">a:第 0 列 → 第 (0−1+4)%4 = 3 列 ✓</text>

  <!-- ============ 右面板:列上移 ============ -->
  <text x="480" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">列上移 k = 1(n = 4)</text>

  <!-- 方向箭头:整体向上 -->
  <path d="M 400 242 L 400 100" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="418" y="176" font-size="10" fill="#888" filter="url(#rough2)">整体向上</text>
  <text x="418" y="190" font-size="10" fill="#888" filter="url(#rough2)">移 1 位</text>

  <!-- 移位前的列 -->
  <text x="380" y="80" font-size="12" fill="#888" filter="url(#rough2)">前</text>
  <rect x="392" y="88" width="34" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="409" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">a</text>
  <rect x="392" y="128" width="34" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="409" y="152" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <rect x="392" y="168" width="34" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="409" y="192" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>
  <rect x="392" y="208" width="34" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="409" y="232" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">d</text>

  <!-- a 的环绕轨迹 -->
  <path d="M 432 106 Q 466 172 516 230" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="452" y="150" font-size="10" fill="#b85450" filter="url(#rough2)">a 绕到底部</text>

  <!-- 移位后的列 -->
  <text x="560" y="80" font-size="12" fill="#888" filter="url(#rough2)">后</text>
  <rect x="544" y="88" width="34" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="561" y="112" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <rect x="544" y="128" width="34" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="561" y="152" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>
  <rect x="544" y="168" width="34" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="561" y="192" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">d</text>
  <rect x="544" y="208" width="34" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="561" y="232" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">a</text>

  <text x="480" y="272" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">第 i 行元素 → 第 (i−k+n) % n 行</text>
  <text x="480" y="292" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">a:第 0 行 → 第 (0−1+4)%4 = 3 行 ✓</text>

  <!-- 公式框 -->
  <rect x="40" y="312" width="560" height="86" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="338" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">「读来源」比「写目标」更顺手:新格子的值从哪来?</text>
  <text x="320" y="364" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">行左移 k:new[i][j] = grid[i][(j + k) % n]</text>
  <text x="320" y="386" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">列上移 k:new[i][j] = grid[(i + k) % n][j]</text>

  <!-- 提示框 -->
  <rect x="40" y="414" width="560" height="52" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="436" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">每次移位只动一行 / 一列;先做完全部行移位,再做列移位</text>
  <text x="320" y="456" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">取模自动处理环绕,k = 0 也天然成立,无需任何特判</text>
</svg>
