<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">质量守恒：像二进制一样进位</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">第 k 级字母质量 2^k；两个第 k 级 → 一个第 k+1 级，2·2^k = 2^(k+1)</text>

  <text x="40" y="78" font-size="12" fill="#333" font-weight="bold">字母的「面值」：</text>

  <g filter="url(#rough2)">
    <rect x="40" y="88" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="98" y="88" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="156" y="88" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="214" y="88" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
  </g>
  <text x="57" y="106" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold">a</text>
  <text x="115" y="106" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold">b</text>
  <text x="173" y="106" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold">c</text>
  <text x="231" y="106" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold">d</text>
  <text x="57" y="128" text-anchor="middle" font-size="10" fill="#666">1</text>
  <text x="115" y="128" text-anchor="middle" font-size="10" fill="#666">2</text>
  <text x="173" y="128" text-anchor="middle" font-size="10" fill="#666">4</text>
  <text x="231" y="128" text-anchor="middle" font-size="10" fill="#666">8</text>
  <text x="270" y="106" font-size="12" fill="#888">…… 直到 z = 2^25</text>

  <g filter="url(#rough2)">
    <rect x="330" y="84" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="364" y="84" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
  </g>
  <text x="345" y="101" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">a</text>
  <text x="379" y="101" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">a</text>
  <path d="M 402 96 L 424 96" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="412" y="86" font-size="9" fill="#888">合并</text>
  <g filter="url(#rough2)">
    <rect x="434" y="84" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
  </g>
  <text x="451" y="101" text-anchor="middle" font-size="11" fill="#8a6a1a" font-weight="bold">b</text>
  <text x="402" y="122" font-size="10" fill="#666">1 + 1 = 2</text>

  <text x="40" y="164" font-size="12" fill="#333" font-weight="bold">x = 5 的变换过程（总质量恒为 5）：</text>

  <g filter="url(#rough2)">
    <rect x="40" y="176" width="130" height="30" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="6"/>
  </g>
  <text x="105" y="196" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">aaaaa</text>
  <text x="105" y="222" text-anchor="middle" font-size="10" fill="#888">1+1+1+1+1</text>

  <path d="M 174 190 L 204 190" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="189" y="182" font-size="9" fill="#888">aa→b</text>

  <g filter="url(#rough2)">
    <rect x="208" y="176" width="104" height="30" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="6"/>
  </g>
  <text x="260" y="196" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">baaa</text>
  <text x="260" y="222" text-anchor="middle" font-size="10" fill="#888">2+1+1+1</text>

  <path d="M 316 190 L 346 190" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="331" y="182" font-size="9" fill="#888">aa→b</text>

  <g filter="url(#rough2)">
    <rect x="350" y="176" width="78" height="30" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="6"/>
  </g>
  <text x="389" y="196" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">bba</text>
  <text x="389" y="222" text-anchor="middle" font-size="10" fill="#888">2+2+1</text>

  <path d="M 432 190 L 462 190" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="447" y="182" font-size="9" fill="#888">bb→c</text>

  <g filter="url(#rough2)">
    <rect x="466" y="176" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6"/>
  </g>
  <text x="494" y="196" text-anchor="middle" font-size="12.5" fill="#8a6a1a" font-weight="bold">ca</text>
  <text x="494" y="222" text-anchor="middle" font-size="10" fill="#888">4+1</text>

  <rect x="40" y="244" width="482" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="60" y="266" font-size="11.5" fill="#3a4a66" font-weight="bold">任何操作不改变总质量 ⟹ 可达串的总质量恒等于 x</text>
  <text x="60" y="286" font-size="10.5" fill="#555">操作就是二进制进位：1111…（x 个 1）不断逢二进一</text>

  <rect x="40" y="308" width="482" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="60" y="330" font-size="11.5" fill="#4a7a3a" font-weight="bold">字典序最大 = 贪心：每一步选质量不超过剩余值的最大字母</text>
  <text x="60" y="350" font-size="10.5" fill="#555">首位尽量大（c 优于 ba…），退化为 x 的二进制表示（高位 → 低位）</text>
</svg>
