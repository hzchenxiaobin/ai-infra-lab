<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">区间 DP 算法流程：i 倒序、j 正序填表</text>

  <!-- 1. init -->
  <rect x="190" y="38" width="220" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="61" text-anchor="middle" font-size="11" fill="#333">初始化 dp 全 0，dp[i][i] = 1</text>
  <path d="M 300 76 L 300 92" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. i = n-1 -->
  <rect x="235" y="92" width="130" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="300" y="112" text-anchor="middle" font-size="11" fill="#333">i = n - 1</text>
  <path d="M 300 124 L 300 138" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. diamond i >= 0 ? -->
  <polygon points="300,138 376,170 300,202 224,170" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="174" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">i &gt;= 0 ?</text>
  <!-- No -> return -->
  <path d="M 376 170 L 430 170" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="164" font-size="10" fill="#888">否</text>
  <rect x="430" y="154" width="150" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="505" y="174" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return dp[0][n-1]</text>
  <!-- Yes down -->
  <path d="M 300 202 L 300 216" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="308" y="214" font-size="10" fill="#888">是</text>

  <!-- 4. j = i+1 -->
  <rect x="235" y="216" width="130" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="300" y="236" text-anchor="middle" font-size="11" fill="#333">j = i + 1</text>
  <path d="M 300 248 L 300 262" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 5. diamond j < n ? -->
  <polygon points="300,262 376,294 300,326 224,294" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="298" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">j &lt; n ?</text>
  <!-- No -> i = i-1 (left) -->
  <path d="M 224 294 L 150 294" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="186" y="288" font-size="10" fill="#888">否</text>
  <rect x="40" y="278" width="110" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="95" y="298" text-anchor="middle" font-size="11" fill="#333">i = i - 1</text>
  <!-- loop back up to diamond i>=0 (left edge) -->
  <path d="M 95 278 L 95 170 L 224 170" stroke="#666" stroke-width="1.4" fill="none" stroke-dasharray="4,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- Yes down -->
  <path d="M 300 326 L 300 340" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="308" y="338" font-size="10" fill="#888">是</text>

  <!-- 6. diamond s[i]==s[j] ? -->
  <polygon points="300,340 392,372 300,404 208,372" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="376" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">s[i]==s[j]?</text>

  <!-- left branch: match -->
  <path d="M 208 372 L 150 372" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="366" font-size="10" fill="#4a7a3a">是</text>
  <rect x="30" y="356" width="120" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="90" y="376" text-anchor="middle" font-size="10" fill="#4a7a3a">dp[i+1][j-1] + 2</text>

  <!-- right branch: no match -->
  <path d="M 392 372 L 450 372" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="408" y="366" font-size="10" fill="#d6a040">否</text>
  <rect x="450" y="356" width="140" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="520" y="376" text-anchor="middle" font-size="10" fill="#d6a040">max(下, 左)</text>

  <!-- both merge to j = j+1 (bottom) -->
  <path d="M 90 388 L 90 428 L 235 428" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 520 388 L 520 428 L 365 428" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="235" y="414" width="130" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="300" y="433" text-anchor="middle" font-size="11" fill="#333">j = j + 1</text>
  <!-- loop back up to diamond j<n (right edge) -->
  <path d="M 365 428 L 560 428 L 560 294 L 376 294" stroke="#666" stroke-width="1.4" fill="none" stroke-dasharray="4,2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="300" y="452" text-anchor="middle" font-size="10" fill="#888">虚线箭头表示循环回跳；填表保证算大区间时更短区间已就绪</text>
</svg>
