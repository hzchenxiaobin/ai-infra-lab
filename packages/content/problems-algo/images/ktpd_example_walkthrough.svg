<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [1, 2, 4, 7]，k = 4，max−min = 6</text>
  <text x="310" y="44" text-anchor="middle" font-size="11" fill="#888">在阈值区间 [0, 6] 上二分，双指针统计距离 ≤ mid 的数对数 cnt</text>

  <!-- Table header -->
  <text x="30" y="76" font-size="11" fill="#444" font-weight="bold">步骤</text>
  <text x="74" y="76" font-size="11" fill="#444" font-weight="bold">lo</text>
  <text x="110" y="76" font-size="11" fill="#444" font-weight="bold">hi</text>
  <text x="146" y="76" font-size="11" fill="#444" font-weight="bold">mid</text>
  <text x="300" y="76" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">双指针计数（各 i 的贡献）</text>
  <text x="430" y="76" font-size="11" fill="#444" font-weight="bold">cnt</text>
  <text x="476" y="76" font-size="11" fill="#444" font-weight="bold">判定</text>
  <text x="560" y="76" font-size="11" fill="#444" font-weight="bold">更新</text>

  <line x1="18" y1="84" x2="600" y2="84" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Step 1 -->
  <text x="30" y="104" font-size="11" fill="#333">1</text>
  <text x="74" y="104" font-size="11" fill="#333">0</text>
  <text x="110" y="104" font-size="11" fill="#333">6</text>
  <text x="146" y="104" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="300" y="104" text-anchor="middle" font-size="11" fill="#333">2 + 1 + 1 + 0</text>
  <text x="430" y="104" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="476" y="104" font-size="11" fill="#82b366">≥ 4 ✓</text>
  <text x="560" y="104" font-size="11" fill="#4a7a3a" font-weight="bold">ans=3,hi=2</text>

  <!-- Step 2 -->
  <text x="30" y="124" font-size="11" fill="#333">2</text>
  <text x="74" y="124" font-size="11" fill="#333">0</text>
  <text x="110" y="124" font-size="11" fill="#333">2</text>
  <text x="146" y="124" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="300" y="124" text-anchor="middle" font-size="11" fill="#333">1 + 0 + 0 + 0</text>
  <text x="430" y="124" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="476" y="124" font-size="11" fill="#b85450">&lt; 4 ✗</text>
  <text x="560" y="124" font-size="11" fill="#b85450" font-weight="bold">lo=2</text>

  <!-- Step 3 -->
  <text x="30" y="144" font-size="11" fill="#333">3</text>
  <text x="74" y="144" font-size="11" fill="#333">2</text>
  <text x="110" y="144" font-size="11" fill="#333">2</text>
  <text x="146" y="144" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="300" y="144" text-anchor="middle" font-size="11" fill="#333">1 + 1 + 0 + 0</text>
  <text x="430" y="144" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="476" y="144" font-size="11" fill="#b85450">&lt; 4 ✗</text>
  <text x="560" y="144" font-size="11" fill="#b85450" font-weight="bold">lo=3</text>

  <!-- Step 4 -->
  <text x="30" y="164" font-size="11" fill="#333">4</text>
  <text x="74" y="164" font-size="11" fill="#999">3</text>
  <text x="110" y="164" font-size="11" fill="#999">2</text>
  <text x="146" y="164" font-size="11" fill="#999">—</text>
  <text x="300" y="164" text-anchor="middle" font-size="11" fill="#999">lo &gt; hi，循环结束</text>
  <text x="430" y="164" font-size="11" fill="#999">—</text>
  <text x="476" y="164" font-size="11" fill="#999">—</text>
  <text x="560" y="164" font-size="11" fill="#d6a040" font-weight="bold">返回 ans</text>

  <!-- arrow pointing to result -->
  <path d="M 560 174 L 560 190" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- interval narrowing visualization -->
  <text x="30" y="218" font-size="12" fill="#444" font-weight="bold">区间收缩：</text>

  <!-- step1 interval [0,6] -->
  <text x="30" y="242" font-size="10" fill="#888">①</text>
  <rect x="54" y="232" width="436" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <line x1="54" y1="230" x2="54" y2="250" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="54" y="224" text-anchor="middle" font-size="9" fill="#666">0</text>
  <line x1="490" y1="230" x2="490" y2="250" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490" y="224" text-anchor="middle" font-size="9" fill="#666">6</text>
  <text x="254" y="244" text-anchor="middle" font-size="10" fill="#333">mid=3 → cnt=4 ≥ k → 可行 → 去左半找更小</text>

  <!-- step2 interval [0,2] -->
  <text x="30" y="270" font-size="10" fill="#888">②</text>
  <rect x="54" y="260" width="144" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <line x1="54" y1="258" x2="54" y2="278" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="54" y="252" text-anchor="middle" font-size="9" fill="#666">0</text>
  <line x1="198" y1="258" x2="198" y2="278" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="198" y="252" text-anchor="middle" font-size="9" fill="#666">2</text>
  <text x="126" y="272" text-anchor="middle" font-size="10" fill="#333">mid=1 → cnt=1 &lt; k → 不够 → 去右半</text>

  <!-- step3 interval [2,2] -->
  <text x="30" y="298" font-size="10" fill="#888">③</text>
  <rect x="198" y="288" width="0" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <line x1="198" y1="286" x2="198" y2="306" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="198" y="282" text-anchor="middle" font-size="9" fill="#666">2</text>
  <text x="340" y="300" text-anchor="middle" font-size="10" fill="#333">mid=2 → cnt=2 &lt; k → 不够 → lo=3（收窄到空）</text>

  <!-- result box -->
  <rect x="54" y="324" width="510" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="309" y="348" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">答案 = 3（mid=3 时恰有 4 个数对距离 ≤ 3，且 mid&lt;3 时不足 4 个）</text>
  <text x="309" y="370" text-anchor="middle" font-size="11" fill="#888">排序 O(n log n) + 二分 O(log W) 次每次 O(n) ⇒ 总 O(n log n + n log W)</text>

  <!-- count detail note -->
  <rect x="54" y="398" width="510" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="309" y="418" text-anchor="middle" font-size="11" fill="#4a7a3a">第1轮各 i 贡献：i=0 得 (0,1),(0,2)=2；i=1 得 (1,2)=1；i=2 得 (2,3)=1</text>
  <text x="309" y="434" text-anchor="middle" font-size="11" fill="#4a7a3a">mid=3 时 count 从 2 跳到 4（距离 3 出现两次）⇒ 用 ≥ k 判定才不漏</text>
</svg>
