<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="560" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：root=[-10,9,20,15,7] → 最大路径和 42</text>

  <!-- Tree -->
  <text x="30" y="56" font-size="12" fill="#888">二叉树（节点上方标 gain 返回值）：</text>

  <!-- -10 root -->
  <circle cx="320" cy="90" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="95" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">-10</text>
  <text x="320" y="64" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">gain=25</text>

  <!-- 9 -->
  <circle cx="200" cy="160" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="165" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">9</text>
  <text x="200" y="134" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">gain=9</text>
  <line x1="304" y1="104" x2="216" y2="146" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- 20 (turning point, highlight) -->
  <circle cx="440" cy="160" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="440" y="165" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">20</text>
  <text x="440" y="132" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">gain=35</text>
  <text x="440" y="118" text-anchor="middle" font-size="10" fill="#b85450">⭐拐点</text>
  <line x1="336" y1="104" x2="422" y2="146" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- 15 -->
  <circle cx="380" cy="240" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="380" y="245" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">15</text>
  <text x="380" y="216" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">gain=15</text>
  <line x1="428" y1="176" x2="392" y2="224" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- 7 -->
  <circle cx="500" cy="240" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="500" y="245" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">7</text>
  <text x="500" y="216" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">gain=7</text>
  <line x1="456" y1="178" x2="488" y2="224" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- highlight path 15->20->7 -->
  <path d="M 380 258 L 440 178 L 500 258" stroke="#b85450" stroke-width="3" fill="none" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="540" y="180" font-size="11" fill="#b85450" font-weight="bold">15→20→7</text>
  <text x="540" y="196" font-size="11" fill="#b85450" font-weight="bold">= 42 ⭐</text>

  <!-- Trace table -->
  <text x="30" y="296" font-size="12" fill="#444" font-weight="bold">后序遍历逐节点计算（自底向上）：</text>

  <!-- table header -->
  <rect x="30" y="306" width="580" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80" y="324" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">节点</text>
  <text x="190" y="324" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">left_gain</text>
  <text x="300" y="324" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">right_gain</text>
  <text x="430" y="324" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">拐弯路径 → ans</text>
  <text x="565" y="324" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">return gain</text>

  <!-- rows -->
  <text x="80" y="346" text-anchor="middle" font-size="10" fill="#333">9</text>
  <text x="190" y="346" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="300" y="346" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="430" y="346" text-anchor="middle" font-size="10" fill="#333">9+0+0=9 → ans=9</text>
  <text x="565" y="346" text-anchor="middle" font-size="10" fill="#4a7a3a">9</text>

  <text x="80" y="366" text-anchor="middle" font-size="10" fill="#333">15</text>
  <text x="190" y="366" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="300" y="366" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="430" y="366" text-anchor="middle" font-size="10" fill="#333">15+0+0=15 → ans=15</text>
  <text x="565" y="366" text-anchor="middle" font-size="10" fill="#4a7a3a">15</text>

  <text x="80" y="386" text-anchor="middle" font-size="10" fill="#333">7</text>
  <text x="190" y="386" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="300" y="386" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="430" y="386" text-anchor="middle" font-size="10" fill="#333">7+0+0=7 → ans=15</text>
  <text x="565" y="386" text-anchor="middle" font-size="10" fill="#4a7a3a">7</text>

  <!-- row 20 highlight -->
  <rect x="32" y="394" width="576" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="80" y="410" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">20</text>
  <text x="190" y="410" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">15</text>
  <text x="300" y="410" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">7</text>
  <text x="430" y="410" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">20+15+7=42 → ans=42 ⭐</text>
  <text x="565" y="410" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">35</text>

  <text x="80" y="436" text-anchor="middle" font-size="10" fill="#333">-10</text>
  <text x="190" y="436" text-anchor="middle" font-size="10" fill="#888">9</text>
  <text x="300" y="436" text-anchor="middle" font-size="10" fill="#888">35</text>
  <text x="430" y="436" text-anchor="middle" font-size="10" fill="#333">-10+9+35=34 → ans=42</text>
  <text x="565" y="436" text-anchor="middle" font-size="10" fill="#4a7a3a">25</text>

  <!-- table borders -->
  <line x1="30" y1="332" x2="610" y2="332" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="446" x2="610" y2="446" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- conclusion -->
  <rect x="30" y="468" width="580" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="490" font-size="12" fill="#444" font-weight="bold">结论：</text>
  <text x="50" y="510" font-size="11" fill="#555">• 节点 20 处左右贡献均正（15、7），同时接上形成 15→20→7 = 42，为全局最优。</text>
  <text x="50" y="526" font-size="11" fill="#555">• 节点 -10 拼出 9→-10→35 = 34，不及 42，ans 不变；它返回 25 给父（此处为根，无父）。</text>
</svg>
