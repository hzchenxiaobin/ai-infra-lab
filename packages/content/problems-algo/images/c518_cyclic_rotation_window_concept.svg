<svg xmlns="http://www.w3.org/2000/svg" width="780" height="520" viewBox="0 0 780 520" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="780" height="520" fill="#fafafa"/>

  <text x="390" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">循环移位 = 双倍数组上的定长滑动窗口</text>
  <path d="M 190 46 Q 390 54 590 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== 原数组 nums ===== -->
  <text x="60" y="96" font-size="12" font-weight="bold" fill="#888" filter="url(#rough2)">nums:</text>
  <g font-size="13">
    <g filter="url(#rough2)"><rect x="130" y="76" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
    <text x="153" y="98" text-anchor="middle" fill="#33526e" font-weight="bold">1</text>
    <g filter="url(#rough2)"><rect x="176" y="76" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
    <text x="199" y="98" text-anchor="middle" fill="#33526e" font-weight="bold">2</text>
    <g filter="url(#rough2)"><rect x="222" y="76" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
    <text x="245" y="98" text-anchor="middle" fill="#33526e" font-weight="bold">3</text>
    <g filter="url(#rough2)"><rect x="268" y="76" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
    <text x="291" y="98" text-anchor="middle" fill="#33526e" font-weight="bold">4</text>
    <g filter="url(#rough2)"><rect x="314" y="76" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
    <text x="337" y="98" text-anchor="middle" fill="#33526e" font-weight="bold">5</text>
    <g filter="url(#rough2)"><rect x="360" y="76" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
    <text x="383" y="98" text-anchor="middle" fill="#33526e" font-weight="bold">6</text>
  </g>
  <g font-size="10" fill="#999">
    <text x="153" y="70" text-anchor="middle" filter="url(#rough2)">0</text>
    <text x="199" y="70" text-anchor="middle" filter="url(#rough2)">1</text>
    <text x="245" y="70" text-anchor="middle" filter="url(#rough2)">2</text>
    <text x="291" y="70" text-anchor="middle" filter="url(#rough2)">3</text>
    <text x="337" y="70" text-anchor="middle" filter="url(#rough2)">4</text>
    <text x="383" y="70" text-anchor="middle" filter="url(#rough2)">5</text>
  </g>
  <text x="430" y="96" font-size="11" fill="#888" filter="url(#rough2)">n = 6，h = n/2 = 3</text>

  <path d="M 268 118 Q 268 132 268 144" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="136" font-size="11" fill="#666" filter="url(#rough2)">拼接一份副本，环变直线</text>

  <!-- ===== 双倍数组 nums+nums ===== -->
  <text x="40" y="188" font-size="12" font-weight="bold" fill="#888" filter="url(#rough2)">nums+nums:</text>
  <g font-size="13">
    <g filter="url(#rough2)"><rect x="130" y="168" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
    <text x="153" y="190" text-anchor="middle" fill="#33526e" font-weight="bold">1</text>
    <g filter="url(#rough2)"><rect x="176" y="168" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
    <text x="199" y="190" text-anchor="middle" fill="#33526e" font-weight="bold">2</text>
    <g filter="url(#rough2)"><rect x="222" y="168" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
    <text x="245" y="190" text-anchor="middle" fill="#33526e" font-weight="bold">3</text>
    <g filter="url(#rough2)"><rect x="268" y="168" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
    <text x="291" y="190" text-anchor="middle" fill="#33526e" font-weight="bold">4</text>
    <g filter="url(#rough2)"><rect x="314" y="168" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
    <text x="337" y="190" text-anchor="middle" fill="#33526e" font-weight="bold">5</text>
    <g filter="url(#rough2)"><rect x="360" y="168" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
    <text x="383" y="190" text-anchor="middle" fill="#33526e" font-weight="bold">6</text>
    <g filter="url(#rough2)"><rect x="406" y="168" width="46" height="34" rx="4" fill="#f5f2ea" stroke="#bbb" stroke-width="1" stroke-dasharray="4 3"/></g>
    <text x="429" y="190" text-anchor="middle" fill="#999">1</text>
    <g filter="url(#rough2)"><rect x="452" y="168" width="46" height="34" rx="4" fill="#f5f2ea" stroke="#bbb" stroke-width="1" stroke-dasharray="4 3"/></g>
    <text x="475" y="190" text-anchor="middle" fill="#999">2</text>
    <g filter="url(#rough2)"><rect x="498" y="168" width="46" height="34" rx="4" fill="#f5f2ea" stroke="#bbb" stroke-width="1" stroke-dasharray="4 3"/></g>
    <text x="521" y="190" text-anchor="middle" fill="#999">3</text>
    <g filter="url(#rough2)"><rect x="544" y="168" width="46" height="34" rx="4" fill="#f5f2ea" stroke="#bbb" stroke-width="1" stroke-dasharray="4 3"/></g>
    <text x="567" y="190" text-anchor="middle" fill="#999">4</text>
    <g filter="url(#rough2)"><rect x="590" y="168" width="46" height="34" rx="4" fill="#f5f2ea" stroke="#bbb" stroke-width="1" stroke-dasharray="4 3"/></g>
    <text x="613" y="190" text-anchor="middle" fill="#999">5</text>
    <g filter="url(#rough2)"><rect x="636" y="168" width="46" height="34" rx="4" fill="#f5f2ea" stroke="#bbb" stroke-width="1" stroke-dasharray="4 3"/></g>
    <text x="659" y="190" text-anchor="middle" fill="#999">6</text>
  </g>
  <text x="538" y="162" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">复制的第二份（下标 = 原下标 + n）</text>

  <!-- 窗口 r=0 -->
  <path d="M 128 216 L 124 222 L 272 222 L 268 216" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="199" y="238" text-anchor="middle" font-size="11" fill="#33526e" font-weight="bold" filter="url(#rough2)">r=0：窗口 {1,2,3}，W[0] = 6</text>

  <!-- 窗口 r=4（跨界） -->
  <path d="M 312 216 L 308 226 L 458 226 L 454 216" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="383" y="242" text-anchor="middle" font-size="11" fill="#2e5e2e" font-weight="bold" filter="url(#rough2)">r=4：窗口 {5,6,1}，W[4] = 12（跨界落在副本上）</text>

  <!-- 递推说明 -->
  <g filter="url(#rough2)">
    <rect x="60" y="262" width="660" height="104" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="82" y="288" font-size="13" font-weight="bold" fill="#8a6510" filter="url(#rough2)">窗口右移一步 = 移出一个元素 + 移入一个元素</text>
  <text x="82" y="312" font-size="12" fill="#444" font-family="monospace" filter="url(#rough2)">W[r+1] = W[r] − nums[r] + nums[(r+h) mod n]</text>
  <text x="82" y="334" font-size="11" fill="#666" filter="url(#rough2)">每个窗口和 O(1) 递推，无需真建双倍数组，用模运算取元素即可</text>
  <text x="82" y="354" font-size="11" fill="#666" filter="url(#rough2)">移位 r 的前半段恰好是双倍数组上 [r, r+h) 的窗口</text>

  <!-- 关键等价 -->
  <g filter="url(#rough2)">
    <rect x="60" y="386" width="660" height="100" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="82" y="412" font-size="13" font-weight="bold" fill="#2e5e2e" filter="url(#rough2)">关键等价（total = 数组总和，与移位无关）</text>
  <text x="82" y="438" font-size="13" fill="#333" filter="url(#rough2)">后半段之和 = total − W[r]</text>
  <text x="82" y="462" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">好移位 ⟺ W[r] &gt; total − W[r] ⟺ 2·W[r] &gt; total</text>
</svg>
