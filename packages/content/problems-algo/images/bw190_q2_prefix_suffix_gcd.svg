<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">有效分割 ⟺ 前缀 gcd 与后缀 gcd 同时等于全局 gcd</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">若两侧相等为 g，则 g = gcd(g,g) = gcd(整个数组) = G</text>

  <text x="40" y="76" font-size="12" fill="#333" font-weight="bold">不移除：nums = [10, 30, 15, 10]，G = 5</text>

  <g filter="url(#rough2)" font-size="11">
    <rect x="40" y="86" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="130" y="86" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="220" y="86" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="310" y="86" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="85" y="104" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold">10</text>
  <text x="175" y="104" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold">30</text>
  <text x="265" y="104" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold">15</text>
  <text x="355" y="104" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold">10</text>

  <text x="418" y="104" font-size="11" fill="#888">下标 0 1 2 3</text>

  <text x="40" y="134" font-size="10.5" fill="#446688" font-weight="bold">pg[i]（前缀 gcd）</text>
  <g filter="url(#rough2)">
    <rect x="40" y="140" width="90" height="24" fill="#ffffff" stroke="#446688" stroke-width="1"/>
    <rect x="130" y="140" width="90" height="24" fill="#ffffff" stroke="#446688" stroke-width="1"/>
    <rect x="220" y="140" width="90" height="24" fill="#ffffff" stroke="#446688" stroke-width="1"/>
    <rect x="310" y="140" width="90" height="24" fill="#ffffff" stroke="#446688" stroke-width="1"/>
  </g>
  <text x="85" y="157" text-anchor="middle" font-size="11" fill="#446688">10</text>
  <text x="175" y="157" text-anchor="middle" font-size="11" fill="#446688">10</text>
  <text x="265" y="157" text-anchor="middle" font-size="11" fill="#446688">5</text>
  <text x="355" y="157" text-anchor="middle" font-size="11" fill="#446688">5</text>

  <text x="40" y="192" font-size="10.5" fill="#4a7a3a" font-weight="bold">sg[i]（后缀 gcd）</text>
  <g filter="url(#rough2)">
    <rect x="40" y="198" width="90" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1"/>
    <rect x="130" y="198" width="90" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1"/>
    <rect x="220" y="198" width="90" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1"/>
    <rect x="310" y="198" width="90" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1"/>
  </g>
  <text x="85" y="215" text-anchor="middle" font-size="11" fill="#4a7a3a">5</text>
  <text x="175" y="215" text-anchor="middle" font-size="11" fill="#4a7a3a">5</text>
  <text x="265" y="215" text-anchor="middle" font-size="11" fill="#4a7a3a">5</text>
  <text x="355" y="215" text-anchor="middle" font-size="11" fill="#4a7a3a">10</text>

  <text x="40" y="248" font-size="10.5" fill="#555" font-weight="bold">分割 i 处比较 pg[i] 与 sg[i+1]：</text>
  <text x="85" y="268" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗ 10≠5</text>
  <text x="175" y="268" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗ 10≠5</text>
  <text x="265" y="268" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗ 5≠10</text>
  <text x="420" y="268" font-size="11" fill="#b85450" font-weight="bold">得分 0</text>

  <text x="40" y="308" font-size="12" fill="#333" font-weight="bold">移除 15（下标 2）：arr = [10, 30, 10]，G′ = 10</text>

  <g filter="url(#rough2)">
    <rect x="40" y="318" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="160" y="318" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="280" y="318" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="100" y="336" text-anchor="middle" font-size="11.5" fill="#2f5530" font-weight="bold">10</text>
  <text x="220" y="336" text-anchor="middle" font-size="11.5" fill="#2f5530" font-weight="bold">30</text>
  <text x="340" y="336" text-anchor="middle" font-size="11.5" fill="#2f5530" font-weight="bold">10</text>

  <text x="40" y="366" font-size="10.5" fill="#555">pg′ = [10, 10, 10]，sg′ = [10, 10, 10]：</text>
  <text x="100" y="386" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 10=10</text>
  <text x="220" y="386" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 10=10</text>
  <text x="430" y="386" font-size="11.5" fill="#4a7a3a" font-weight="bold">得分 2 ← 答案</text>

  <text x="280" y="412" text-anchor="middle" font-size="10" fill="#999">删掉「坏元素」后全局 gcd 抬升，前后缀 gcd 曲线重合，分割全部有效</text>
</svg>
