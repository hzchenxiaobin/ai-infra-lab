<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">配对下标奇偶性：单一元素是「翻转点」</text>

  <!-- index labels -->
  <g font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">
    <text x="67" y="92">0</text><text x="119" y="92">1</text><text x="171" y="92">2</text>
    <text x="223" y="92">3</text><text x="275" y="92">4</text><text x="327" y="92">5</text>
    <text x="379" y="92">6</text><text x="431" y="92">7</text><text x="483" y="92">8</text>
  </g>

  <!-- cells -->
  <g stroke-width="1.5" filter="url(#rough2)">
    <rect x="44" y="104" width="46" height="44" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="96" y="104" width="46" height="44" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="148" y="104" width="46" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="200" y="104" width="46" height="44" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="252" y="104" width="46" height="44" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="304" y="104" width="46" height="44" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="356" y="104" width="46" height="44" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="408" y="104" width="46" height="44" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="460" y="104" width="46" height="44" rx="4" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <g font-size="15" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="67" y="132">1</text><text x="119" y="132">1</text>
    <text x="171" y="132" fill="#b85450" font-weight="bold">2</text>
    <text x="223" y="132">3</text><text x="275" y="132">3</text>
    <text x="327" y="132">4</text><text x="379" y="132">4</text>
    <text x="431" y="132">8</text><text x="483" y="132">8</text>
  </g>

  <!-- single marker -->
  <text x="171" y="74" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">唯一出现一次</text>
  <path d="M171 78 L171 100" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>

  <!-- pair brackets below cells -->
  <g fill="none" stroke-width="1.6" filter="url(#rough2)">
    <path d="M44 162 L44 172 L142 172 L142 162" stroke="#446688"/>
    <path d="M200 162 L200 172 L298 172 L298 162" stroke="#4a7a3a"/>
    <path d="M304 162 L304 172 L402 172 L402 162" stroke="#4a7a3a"/>
    <path d="M408 162 L408 172 L506 172 L506 162" stroke="#4a7a3a"/>
  </g>
  <g font-size="11" text-anchor="middle" filter="url(#rough2)">
    <text x="93" y="190" fill="#446688">偶, 奇</text>
    <text x="93" y="204" fill="#446688">single 之前</text>
    <text x="353" y="190" fill="#4a7a3a">奇, 偶</text>
    <text x="353" y="204" fill="#4a7a3a">single 之后</text>
  </g>

  <!-- rule box -->
  <rect x="50" y="232" width="460" height="142" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="258" text-anchor="middle" font-size="14" fill="#8a5a00" filter="url(#rough2)">判定规则：对偶数下标 i，比较 nums[i] 与 nums[i+1]</text>
  <text x="72" y="290" font-size="13" fill="#5a3a00" filter="url(#rough2)">• 若 nums[i] == nums[i+1]：配对正常 → 单一元素在 i 的右侧</text>
  <text x="72" y="318" font-size="13" fill="#5a3a00" filter="url(#rough2)">• 若 nums[i] != nums[i+1]：配对错位 → 单一元素在 ≤ i（含 i）</text>
  <text x="72" y="350" font-size="12" fill="#8a6a30" filter="url(#rough2)">单一元素会使其后所有配对的「起始下标」奇偶翻转，这就是二分的单调依据。</text>
</svg>
