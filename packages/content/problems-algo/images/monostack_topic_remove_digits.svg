<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="660" height="470" fill="#fafafa"/>

  <text x="330" y="28" text-anchor="middle" font-size="16" fill="#444" font-weight="bold">例题：402 移掉 K 位数字 — 递减栈 + 贪心 + 配额</text>
  <text x="330" y="48" text-anchor="middle" font-size="11" fill="#888">num = "1432219"，k = 3。让小数字尽量占高位：栈顶更大且还能删 → 弹（删一个），最后栈里即最小数</text>

  <!-- input -->
  <text x="30" y="80" font-size="11" fill="#444" filter="url(#rough2)">输入串：</text>
  <g font-size="12" fill="#333">
    <rect x="100" y="66" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="117" y="84" text-anchor="middle" filter="url(#rough2)">1</text>
    <rect x="136" y="66" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="153" y="84" text-anchor="middle" filter="url(#rough2)">4</text>
    <rect x="172" y="66" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="189" y="84" text-anchor="middle" filter="url(#rough2)">3</text>
    <rect x="208" y="66" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="225" y="84" text-anchor="middle" filter="url(#rough2)">2</text>
    <rect x="244" y="66" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="261" y="84" text-anchor="middle" filter="url(#rough2)">2</text>
    <rect x="280" y="66" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="297" y="84" text-anchor="middle" filter="url(#rough2)">1</text>
    <rect x="316" y="66" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="333" y="84" text-anchor="middle" filter="url(#rough2)">9</text>
  </g>

  <!-- steps -->
  <text x="30" y="120" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">逐步演算（栈存字符，保持递增；k 为剩余可删数）：</text>

  <rect x="20" y="132" width="620" height="220" fill="#fff" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <g font-size="10.5" fill="#333">
    <text x="34" y="152" font-weight="bold" fill="#d6a040" filter="url(#rough2)">读入</text>
    <text x="110" y="152" font-weight="bold" fill="#d6a040" filter="url(#rough2)">while 弹栈条件</text>
    <text x="290" y="152" font-weight="bold" fill="#d6a040" filter="url(#rough2)">动作</text>
    <text x="430" y="152" font-weight="bold" fill="#d6a040" filter="url(#rough2)">栈（结果串）</text>
    <text x="570" y="152" font-weight="bold" fill="#d6a040" filter="url(#rough2)">剩余 k</text>

    <text x="34" y="174" filter="url(#rough2)">'1'</text>
    <text x="110" y="174" fill="#888" filter="url(#rough2)">栈空</text>
    <text x="290" y="174" fill="#446688" filter="url(#rough2)">入栈</text>
    <text x="430" y="174" fill="#446688" filter="url(#rough2)">1</text>
    <text x="570" y="174" filter="url(#rough2)">3</text>

    <text x="34" y="194" filter="url(#rough2)">'4'</text>
    <text x="110" y="194" fill="#888" filter="url(#rough2)">4 &gt; 1，不弹</text>
    <text x="290" y="194" fill="#446688" filter="url(#rough2)">入栈</text>
    <text x="430" y="194" fill="#446688" filter="url(#rough2)">1 4</text>
    <text x="570" y="194" filter="url(#rough2)">3</text>

    <text x="34" y="214" fill="#b85450" filter="url(#rough2)">'3'</text>
    <text x="110" y="214" fill="#b85450" filter="url(#rough2)">3 &lt; 4 且 k&gt;0</text>
    <text x="290" y="214" fill="#b85450" filter="url(#rough2)">pop '4'（删），k--；再入</text>
    <text x="430" y="214" fill="#446688" filter="url(#rough2)">1 3</text>
    <text x="570" y="214" fill="#b85450" filter="url(#rough2)">2</text>

    <text x="34" y="234" fill="#b85450" filter="url(#rough2)">'2'</text>
    <text x="110" y="234" fill="#b85450" filter="url(#rough2)">2 &lt; 3 且 k&gt;0</text>
    <text x="290" y="234" fill="#b85450" filter="url(#rough2)">pop '3'（删），k--；再入</text>
    <text x="430" y="234" fill="#446688" filter="url(#rough2)">1 2</text>
    <text x="570" y="234" fill="#b85450" filter="url(#rough2)">1</text>

    <text x="34" y="254" filter="url(#rough2)">'2'</text>
    <text x="110" y="254" fill="#888" filter="url(#rough2)">2 = 2，不弹（非严格）</text>
    <text x="290" y="254" fill="#446688" filter="url(#rough2)">入栈</text>
    <text x="430" y="254" fill="#446688" filter="url(#rough2)">1 2 2</text>
    <text x="570" y="254" filter="url(#rough2)">1</text>

    <text x="34" y="274" fill="#b85450" filter="url(#rough2)">'1'</text>
    <text x="110" y="274" fill="#b85450" filter="url(#rough2)">1 &lt; 2 且 k&gt;0</text>
    <text x="290" y="274" fill="#b85450" filter="url(#rough2)">pop '2'（删），k--；再入</text>
    <text x="430" y="274" fill="#446688" filter="url(#rough2)">1 2 1</text>
    <text x="570" y="274" fill="#b85450" filter="url(#rough2)">0</text>

    <text x="34" y="294" filter="url(#rough2)">'9'</text>
    <text x="110" y="294" fill="#888" filter="url(#rough2)">k=0，不再弹</text>
    <text x="290" y="294" fill="#446688" filter="url(#rough2)">入栈</text>
    <text x="430" y="294" fill="#446688" filter="url(#rough2)">1 2 1 9</text>
    <text x="570" y="294" filter="url(#rough2)">0</text>

    <text x="34" y="318" fill="#d6a040" font-weight="bold" filter="url(#rough2)">收尾</text>
    <text x="110" y="318" fill="#888" filter="url(#rough2)">k=0，无残留可删</text>
    <text x="290" y="318" fill="#4a7a3a" filter="url(#rough2)">栈即答案（去前导 0）</text>
    <text x="430" y="318" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">"1219"</text>
    <text x="570" y="318" fill="#888" filter="url(#rough2)">—</text>
  </g>

  <!-- insight boxes -->
  <rect x="20" y="368" width="305" height="90" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="34" y="388" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">贪心直觉：高位优先放小</text>
  <text x="34" y="406" font-size="10" fill="#555" filter="url(#rough2)">从高位到低位，只要「前一位更大</text>
  <text x="34" y="420" font-size="10" fill="#555" filter="url(#rough2)">且还能删」，就删前一位——</text>
  <text x="34" y="434" font-size="10" fill="#555" filter="url(#rough2)">让小的数字尽量顶到高位。</text>
  <text x="34" y="450" font-size="10" fill="#888" filter="url(#rough2)">单调栈把「找前一位更大」压成 O(1)。</text>

  <rect x="335" y="368" width="305" height="90" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="349" y="388" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">两个附加约束（与纯单调栈的区别）</text>
  <text x="349" y="406" font-size="10" fill="#555" filter="url(#rough2)">① 配额 k：弹一次 k−1，k=0 就只能入栈</text>
  <text x="349" y="420" font-size="10" fill="#555" filter="url(#rough2)">② 收尾：若 k&gt;0，从栈尾再删 k 个</text>
  <text x="349" y="434" font-size="10" fill="#555" filter="url(#rough2)">（末尾必然递增，删大的留小的）</text>
  <text x="349" y="450" font-size="10" fill="#888" filter="url(#rough2)">316 去除重复字母：把 k 换成「剩余计数」</text>
</svg>
