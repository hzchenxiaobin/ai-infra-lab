<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">贪心构造：二进制位 → 字母</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">第 k 位置 1 ⟹ 输出字母 chr('a' + k)；从最高位到最低位</text>

  <text x="40" y="76" font-size="12" fill="#333" font-weight="bold">位值映射：</text>

  <g filter="url(#rough2)">
    <rect x="130" y="62" width="42" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="188" y="62" width="42" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="246" y="62" width="42" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="304" y="62" width="42" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="362" y="62" width="56" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
  </g>
  <text x="151" y="80" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">0→a</text>
  <text x="209" y="80" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">1→b</text>
  <text x="267" y="80" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">2→c</text>
  <text x="325" y="80" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">3→d</text>
  <text x="390" y="80" text-anchor="middle" font-size="11" fill="#8a6a1a" font-weight="bold">25→z</text>
  <text x="436" y="80" font-size="11" fill="#888">（k ≤ 25 封顶）</text>

  <text x="40" y="120" font-size="12" fill="#333" font-weight="bold">示例对照：</text>

  <g filter="url(#rough2)">
    <rect x="130" y="106" width="40" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <rect x="170" y="106" width="40" height="26" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4 3"/>
    <rect x="210" y="106" width="40" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="150" y="124" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold">1</text>
  <text x="190" y="124" text-anchor="middle" font-size="11.5" fill="#bbb">0</text>
  <text x="230" y="124" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold">1</text>
  <text x="266" y="118" font-size="9.5" fill="#888">位 2 / 1 / 0</text>
  <path d="M 272 122 L 302 122" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="310" y="106" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="356" y="106" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
  </g>
  <text x="330" y="124" text-anchor="middle" font-size="12" fill="#2f5530" font-weight="bold">c</text>
  <text x="376" y="124" text-anchor="middle" font-size="12" fill="#2f5530" font-weight="bold">a</text>
  <text x="416" y="124" font-size="11.5" fill="#444" font-weight="bold">5 = 101₂ → "ca"</text>

  <g filter="url(#rough2)">
    <rect x="130" y="144" width="40" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <rect x="170" y="144" width="40" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <rect x="210" y="144" width="40" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="150" y="162" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold">1</text>
  <text x="190" y="162" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold">1</text>
  <text x="230" y="162" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold">1</text>
  <path d="M 258 158 L 288 158" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="296" y="144" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="334" y="144" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="372" y="144" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
  </g>
  <text x="313" y="162" text-anchor="middle" font-size="12" fill="#2f5530" font-weight="bold">c</text>
  <text x="351" y="162" text-anchor="middle" font-size="12" fill="#2f5530" font-weight="bold">b</text>
  <text x="389" y="162" text-anchor="middle" font-size="12" fill="#2f5530" font-weight="bold">a</text>
  <text x="428" y="162" font-size="11.5" fill="#444" font-weight="bold">7 = 111₂ → "cba"</text>

  <g filter="url(#rough2)">
    <rect x="130" y="182" width="40" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <rect x="170" y="182" width="40" height="26" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4 3"/>
    <rect x="210" y="182" width="40" height="26" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4 3"/>
    <rect x="250" y="182" width="40" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="150" y="200" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold">1</text>
  <text x="190" y="200" text-anchor="middle" font-size="11.5" fill="#bbb">0</text>
  <text x="230" y="200" text-anchor="middle" font-size="11.5" fill="#bbb">0</text>
  <text x="270" y="200" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold">1</text>
  <path d="M 298 196 L 328 196" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="336" y="182" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="382" y="182" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
  </g>
  <text x="356" y="200" text-anchor="middle" font-size="12" fill="#2f5530" font-weight="bold">d</text>
  <text x="402" y="200" text-anchor="middle" font-size="12" fill="#2f5530" font-weight="bold">a</text>
  <text x="440" y="200" font-size="11.5" fill="#444" font-weight="bold">9 = 1001₂ → "da"</text>

  <rect x="40" y="232" width="482" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="281" y="256" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">封顶：x ≥ 2^26 时最高位没有对应字母！</text>
  <text x="281" y="278" text-anchor="middle" font-size="11" fill="#555">k 取 min(25, ⌊log₂x⌋)：2^26 = 2^25 + 2^25 拆成两个 "z"</text>

  <rect x="40" y="306" width="482" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="281" y="328" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">while x &gt; 0: 取 k = min(25, x.bit_length()−1)，输出字母，x −= 2^k</text>
  <text x="281" y="348" text-anchor="middle" font-size="10.5" fill="#555">每个询问 O(27)，总复杂度 O(27n)；验证：2^26 → "zz"，2^26+5 → "zzca"</text>

  <text x="280" y="388" text-anchor="middle" font-size="10" fill="#999">一道伪装成字符串题的进制题</text>
</svg>
