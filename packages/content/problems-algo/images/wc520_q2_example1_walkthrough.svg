<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 1 演算：intervals = [[1,2],[2,3],[3,4]]</text>

  <!-- E 数组 -->
  <text x="56" y="67" font-size="11.5" fill="#444" font-weight="bold">end 排序得 E =</text>
  <rect x="170" y="48" width="52" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="196" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="226" y="48" width="52" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="252" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="282" y="48" width="52" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="308" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <text x="346" y="67" font-size="10.5" fill="#888">（全部 end 的有序表）</text>

  <!-- 数轴 -->
  <rect x="192" y="110" width="72" height="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="7" filter="url(#rough2)"/>
  <text x="228" y="121" text-anchor="middle" font-size="10" fill="#333">[1,2]</text>
  <rect x="264" y="130" width="72" height="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="7" filter="url(#rough2)"/>
  <text x="300" y="141" text-anchor="middle" font-size="10" fill="#333">[2,3]</text>
  <rect x="336" y="150" width="72" height="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="7" filter="url(#rough2)"/>
  <text x="372" y="161" text-anchor="middle" font-size="10" fill="#333">[3,4]</text>
  <line x1="140" y1="176" x2="440" y2="176" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="192" y1="173" x2="192" y2="179" stroke="#999" filter="url(#rough2)"/>
  <line x1="264" y1="173" x2="264" y2="179" stroke="#999" filter="url(#rough2)"/>
  <line x1="336" y1="173" x2="336" y2="179" stroke="#999" filter="url(#rough2)"/>
  <line x1="408" y1="173" x2="408" y2="179" stroke="#999" filter="url(#rough2)"/>
  <text x="192" y="192" text-anchor="middle" font-size="10" fill="#999">1</text>
  <text x="264" y="192" text-anchor="middle" font-size="10" fill="#999">2</text>
  <text x="336" y="192" text-anchor="middle" font-size="10" fill="#999">3</text>
  <text x="408" y="192" text-anchor="middle" font-size="10" fill="#999">4</text>
  <text x="290" y="208" text-anchor="middle" font-size="11" fill="#b85450">[1,2] 与 [3,4]：end 2 &lt; start 3 → 唯一的不相交对</text>

  <!-- 二分演算表 -->
  <rect x="40" y="216" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="85" y="234" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">start_i</text>
  <rect x="130" y="216" width="150" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="205" y="234" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">lower_bound 落点</text>
  <rect x="280" y="216" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="335" y="234" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">计数</text>
  <rect x="390" y="216" width="130" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="455" y="234" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">备注</text>

  <rect x="40" y="242" width="90" height="24" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="85" y="259" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="130" y="242" width="150" height="24" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="205" y="259" text-anchor="middle" font-size="10.5" fill="#333">E[0]=2 ≥ 1 → 0</text>
  <rect x="280" y="242" width="110" height="24" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="335" y="259" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="390" y="242" width="130" height="24" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="455" y="259" text-anchor="middle" font-size="10" fill="#777">没有更小的 end</text>

  <rect x="40" y="266" width="90" height="24" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="85" y="283" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="130" y="266" width="150" height="24" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="205" y="283" text-anchor="middle" font-size="10.5" fill="#333">E[0]=2 ≥ 2 → 0</text>
  <rect x="280" y="266" width="110" height="24" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="335" y="283" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="390" y="266" width="130" height="24" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="455" y="283" text-anchor="middle" font-size="10" fill="#777">端点相等不算 &lt;</text>

  <rect x="40" y="290" width="90" height="24" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="85" y="307" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="130" y="290" width="150" height="24" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="205" y="307" text-anchor="middle" font-size="10.5" fill="#333">E[0]=2 &lt; 3 → 1</text>
  <rect x="280" y="290" width="110" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="335" y="307" text-anchor="middle" font-size="11" fill="#b07818" font-weight="bold">1</text>
  <rect x="390" y="290" width="130" height="24" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="455" y="307" text-anchor="middle" font-size="10" fill="#777">只有 end=2 计入</text>

  <!-- 结论 -->
  <rect x="40" y="326" width="480" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="60" y="350" font-size="11.5" fill="#333">S = 0 + 0 + 1 = 1 → 不相交对只有 {[1,2], [3,4]}</text>
  <text x="60" y="372" font-size="11.5" fill="#4a7a3a" font-weight="bold">答案 = C(3,2) − S = 3 − 1 = 2 ✓（两对端点相接的区间都保留在相交中）</text>
</svg>
