<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>
  <text x="270" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">双指针「换头」算法流程</text>

  <!-- Start -->
  <g filter="url(#rough2)">
    <rect x="150" y="48" width="240" height="42" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="270" y="74" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">pA = headA，pB = headB</text>
  <line x1="270" y1="90" x2="270" y2="116" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <g filter="url(#rough2)">
    <polygon points="270,118 380,178 270,238 160,178" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7"/>
  </g>
  <text x="270" y="172" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">pA == pB ?</text>
  <text x="270" y="190" text-anchor="middle" font-size="10" fill="#888">（引用相等）</text>

  <!-- Yes branch -> return -->
  <line x1="380" y1="178" x2="430" y2="178" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="170" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <g filter="url(#rough2)">
    <rect x="434" y="150" width="96" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="482" y="174" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return pA</text>
  <text x="482" y="192" text-anchor="middle" font-size="10" fill="#555">相交点 或 null</text>

  <!-- No branch -> update -->
  <line x1="270" y1="238" x2="270" y2="262" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="254" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <g filter="url(#rough2)">
    <rect x="110" y="264" width="320" height="68" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="270" y="288" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">各走一步，到尾就换头：</text>
  <text x="270" y="308" text-anchor="middle" font-size="12" fill="#446688">pA = pA ? pA-&gt;next : headB</text>
  <text x="270" y="325" text-anchor="middle" font-size="12" fill="#4a7a3a">pB = pB ? pB-&gt;next : headA</text>

  <!-- loop back arrow -->
  <path d="M 110 298 Q 60 298 60 178 Q 60 158 158 178" stroke="#9c6ade" stroke-width="1.5" fill="none" marker-end="url(#arr)" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="48" y="240" text-anchor="middle" font-size="10" fill="#9c6ade" font-weight="bold">回</text>
  <text x="48" y="254" text-anchor="middle" font-size="10" fill="#9c6ade" font-weight="bold">到</text>
  <text x="48" y="268" text-anchor="middle" font-size="10" fill="#9c6ade" font-weight="bold">判</text>
  <text x="48" y="282" text-anchor="middle" font-size="10" fill="#9c6ade" font-weight="bold">定</text>

  <!-- termination note -->
  <g filter="url(#rough2)">
    <rect x="60" y="350" width="420" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="270" y="368" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">每个指针最多换头一次：步数同步 → 必同时终止，不会死循环</text>
  <text x="270" y="384" text-anchor="middle" font-size="10" fill="#555">相交：同时到相交点；不相交：同时到 ∅（pA==pB==null）</text>
</svg>
