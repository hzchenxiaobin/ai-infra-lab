<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">两个关键观察:±2 不变奇偶;回文数奇偶由首位决定</text>

  <!-- ============ 左面板:奇偶墙 ============ -->
  <text x="170" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">一次操作 ±2:奇偶是一堵墙</text>

  <!-- 数轴 -->
  <line x1="50" y1="150" x2="290" y2="150" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 290 150 L 280 145 L 280 155 z" fill="#446688" filter="url(#rough2)"/>

  <!-- 刻度:121 123 125 127 129 -->
  <rect x="58" y="140" width="40" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="78" y="157" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">121</text>
  <text x="78" y="182" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">奇回文 ✓</text>

  <text x="123" y="140" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">123</text>
  <line x1="123" y1="145" x2="123" y2="155" stroke="#999" stroke-width="1" filter="url(#rough2)"/>

  <rect x="130" y="140" width="40" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="150" y="157" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">125</text>
  <text x="150" y="132" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">x(奇)</text>

  <text x="198" y="140" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">127</text>
  <line x1="198" y1="145" x2="198" y2="155" stroke="#999" stroke-width="1" filter="url(#rough2)"/>

  <text x="272" y="140" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">129</text>
  <line x1="272" y1="145" x2="272" y2="155" stroke="#999" stroke-width="1" filter="url(#rough2)"/>

  <!-- ±2 箭头 -->
  <path d="M 140 168 Q 128 178 122 172" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="192" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">−2</text>
  <path d="M 160 168 Q 172 178 178 172" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="184" y="192" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">+2</text>

  <!-- 偶数不可达 -->
  <text x="170" y="222" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗ 122、124 等偶数永远到不了</text>
  <text x="170" y="240" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">步长为 2 ⇒ 目标必须与 x 同奇偶</text>
  <text x="170" y="258" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">x=125 的最近奇回文:121(代价 2)</text>

  <!-- ============ 右面板:回文奇偶 = 首位 ============ -->
  <text x="480" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">回文数:首位 = 个位</text>

  <!-- 121 -->
  <rect x="382" y="94" width="26" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="395" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6420" filter="url(#rough2)">1</text>
  <rect x="410" y="94" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="423" y="112" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="438" y="94" width="26" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="451" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6420" filter="url(#rough2)">1</text>
  <text x="500" y="112" font-size="12" fill="#555" filter="url(#rough2)">首位 1(奇)⇒ 奇数</text>

  <!-- 45654 -->
  <rect x="356" y="138" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="369" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">4</text>
  <rect x="384" y="138" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="397" y="156" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="412" y="138" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="425" y="156" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <rect x="440" y="138" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="453" y="156" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="468" y="138" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="481" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">4</text>
  <text x="508" y="156" font-size="12" fill="#555" filter="url(#rough2)">首位 4(偶)⇒ 偶数</text>

  <!-- 8998 -->
  <rect x="374" y="182" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="387" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">8</text>
  <rect x="402" y="182" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="415" y="200" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>
  <rect x="430" y="182" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="443" y="200" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>
  <rect x="458" y="182" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="471" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">8</text>
  <text x="508" y="200" font-size="12" fill="#555" filter="url(#rough2)">首位 8(偶)⇒ 偶数</text>

  <text x="480" y="238" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">个位由首位决定 ⇒ 奇偶看首位即可</text>
  <text x="480" y="258" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">⚠ 别因「偶数位回文整除 11」误判:</text>
  <text x="480" y="274" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">22 偶、33 奇,仍由首位决定</text>

  <!-- 底部:独立性与代价公式 -->
  <rect x="40" y="296" width="560" height="88" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="322" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">「不同元素可以变成不同的回文整数」⇒ 无冲突约束,逐元素独立取最近</text>
  <text x="320" y="348" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">代价(x → t) = |t − x| / 2,其中 t 是与 x 同奇偶的正回文数</text>
  <text x="320" y="372" text-anchor="middle" font-size="12.5" fill="#8a6420" filter="url(#rough2)">答案 = 每个元素「最近同奇偶回文」代价之和</text>
</svg>
