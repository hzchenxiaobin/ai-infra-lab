<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "cbaebabacd", p = "abc", m = 3</text>

  <!-- column headers -->
  <text x="20" y="54" font-size="10.5" fill="#888" font-weight="bold">步</text>
  <text x="60" y="54" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">窗口右端 i</text>
  <text x="150" y="54" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">子串</text>
  <text x="250" y="54" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">进入/离开</text>
  <text x="390" y="54" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">match</text>
  <text x="480" y="54" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">合法?</text>
  <text x="550" y="54" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">记录</text>

  <line x1="10" y1="62" x2="570" y2="62" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 0: init window [c,b,a] i=2 -->
  <text x="20" y="84" font-size="11" fill="#333">0</text>
  <text x="60" y="84" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="120" y="72" width="60" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="150" y="86" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">cba</text>
  <text x="250" y="84" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">先填满 3 格</text>
  <text x="390" y="84" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="480" y="84" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="550" y="84" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>

  <!-- Row 1: i=3 bae -->
  <text x="20" y="108" font-size="11" fill="#333">1</text>
  <text x="60" y="108" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="120" y="96" width="60" height="20" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="150" y="110" text-anchor="middle" font-size="10.5" fill="#333">bae</text>
  <text x="250" y="108" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">+e / −c</text>
  <text x="390" y="108" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>
  <text x="480" y="108" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <text x="550" y="108" text-anchor="middle" font-size="11" fill="#aaa">—</text>

  <!-- Row 2: i=4 aeb -->
  <text x="20" y="132" font-size="11" fill="#333">2</text>
  <text x="60" y="132" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <rect x="120" y="120" width="60" height="20" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="150" y="134" text-anchor="middle" font-size="10.5" fill="#333">aeb</text>
  <text x="250" y="132" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">+b / −b</text>
  <text x="390" y="132" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>
  <text x="480" y="132" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <text x="550" y="132" text-anchor="middle" font-size="11" fill="#aaa">—</text>

  <!-- Row 3: i=5 eba -->
  <text x="20" y="156" font-size="11" fill="#333">3</text>
  <text x="60" y="156" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <rect x="120" y="144" width="60" height="20" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="150" y="158" text-anchor="middle" font-size="10.5" fill="#333">eba</text>
  <text x="250" y="156" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">+a / −a</text>
  <text x="390" y="156" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>
  <text x="480" y="156" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <text x="550" y="156" text-anchor="middle" font-size="11" fill="#aaa">—</text>

  <!-- Row 4: i=6 bab -->
  <text x="20" y="180" font-size="11" fill="#333">4</text>
  <text x="60" y="180" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>
  <rect x="120" y="168" width="60" height="20" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="150" y="182" text-anchor="middle" font-size="10.5" fill="#333">bab</text>
  <text x="250" y="180" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">+b / −e</text>
  <text x="390" y="180" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <text x="480" y="180" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <text x="550" y="180" text-anchor="middle" font-size="11" fill="#aaa">—</text>

  <!-- Row 5: i=7 aba -->
  <text x="20" y="204" font-size="11" fill="#333">5</text>
  <text x="60" y="204" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7</text>
  <rect x="120" y="192" width="60" height="20" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="150" y="206" text-anchor="middle" font-size="10.5" fill="#333">aba</text>
  <text x="250" y="204" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">+a / −b</text>
  <text x="390" y="204" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <text x="480" y="204" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <text x="550" y="204" text-anchor="middle" font-size="11" fill="#aaa">—</text>

  <!-- Row 6: i=8 bac HIT -->
  <text x="20" y="228" font-size="11" fill="#333">6</text>
  <text x="60" y="228" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">8</text>
  <rect x="120" y="216" width="60" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="150" y="230" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">bac</text>
  <text x="250" y="228" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">+c / −b</text>
  <text x="390" y="228" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="480" y="228" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="550" y="228" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">6</text>

  <!-- Row 7: i=9 acd -->
  <text x="20" y="252" font-size="11" fill="#333">7</text>
  <text x="60" y="252" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">9</text>
  <rect x="120" y="240" width="60" height="20" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="150" y="254" text-anchor="middle" font-size="10.5" fill="#333">acd</text>
  <text x="250" y="252" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">+d / −a</text>
  <text x="390" y="252" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>
  <text x="480" y="252" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <text x="550" y="252" text-anchor="middle" font-size="11" fill="#aaa">—</text>

  <line x1="10" y1="266" x2="570" y2="266" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="80" y="282" width="420" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="305" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">返回 [0, 6] ✓</text>

  <!-- visual: s with two highlighted windows -->
  <text x="20" y="346" font-size="12" fill="#888" font-weight="bold">s =</text>
  <rect x="50" y="332" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="65" y="349" text-anchor="middle" font-size="11" fill="#333">c</text>
  <rect x="82" y="332" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="97" y="349" text-anchor="middle" font-size="11" fill="#333">b</text>
  <rect x="114" y="332" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="129" y="349" text-anchor="middle" font-size="11" fill="#333">a</text>
  <rect x="146" y="332" width="30" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="161" y="349" text-anchor="middle" font-size="11" fill="#aaa">e</text>
  <rect x="178" y="332" width="30" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="193" y="349" text-anchor="middle" font-size="11" fill="#aaa">b</text>
  <rect x="210" y="332" width="30" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="225" y="349" text-anchor="middle" font-size="11" fill="#aaa">a</text>
  <rect x="242" y="332" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="257" y="349" text-anchor="middle" font-size="11" fill="#333">b</text>
  <rect x="274" y="332" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="289" y="349" text-anchor="middle" font-size="11" fill="#333">a</text>
  <rect x="306" y="332" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="321" y="349" text-anchor="middle" font-size="11" fill="#333">c</text>
  <rect x="338" y="332" width="30" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="353" y="349" text-anchor="middle" font-size="11" fill="#aaa">d</text>

  <text x="65" y="372" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">↑ 索引0</text>
  <text x="257" y="372" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">↑ 索引6</text>

  <!-- footer note -->
  <rect x="40" y="386" width="500" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="406" text-anchor="middle" font-size="11.5" fill="#444">每步只 +1 / −1 增量更新 win 与 match</text>
  <text x="290" y="422" text-anchor="middle" font-size="11" fill="#888">match == target(=3) 时窗口为异位词，记录起点 i−m+1</text>
</svg>
