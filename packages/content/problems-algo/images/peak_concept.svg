<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">沿斜率上升方向走，必达峰值</text>

  <!-- -inf cliffs -->
  <text x="34" y="92" text-anchor="middle" font-size="11" fill="#aaa">−∞</text>
  <path d="M48 90 L 62 90 L 62 200" stroke="#bbb" stroke-width="1.5" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="526" y="92" text-anchor="middle" font-size="11" fill="#aaa">−∞</text>
  <path d="M498 90 L 512 90 L 512 200" stroke="#bbb" stroke-width="1.5" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- baseline -->
  <line x1="62" y1="238" x2="498" y2="238" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- the polyline: nums = [1,2,1,3,5,6,4] -->
  <path d="M70,220 L140,194 L210,220 L280,168 L350,116 L420,90 L490,142"
        stroke="#446688" stroke-width="2.4" fill="none" filter="url(#rough2)"/>

  <!-- point dots -->
  <circle cx="70" cy="220" r="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="140" cy="194" r="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="210" cy="220" r="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="280" cy="168" r="5" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="350" cy="116" r="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="420" cy="90" r="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <circle cx="490" cy="142" r="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- value labels above points -->
  <text x="70"  y="234" text-anchor="middle" font-size="10.5" fill="#888">1</text>
  <text x="140" y="186" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">2</text>
  <text x="210" y="234" text-anchor="middle" font-size="10.5" fill="#888">1</text>
  <text x="280" y="160" text-anchor="middle" font-size="11" fill="#888">3</text>
  <text x="350" y="108" text-anchor="middle" font-size="10.5" fill="#888">5</text>
  <text x="420" y="82"  text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">6</text>
  <text x="490" y="134" text-anchor="middle" font-size="10.5" fill="#888">4</text>

  <!-- index labels below baseline -->
  <text x="70"  y="254" text-anchor="middle" font-size="9.5" fill="#aaa">0</text>
  <text x="140" y="254" text-anchor="middle" font-size="9.5" fill="#aaa">1</text>
  <text x="210" y="254" text-anchor="middle" font-size="9.5" fill="#aaa">2</text>
  <text x="280" y="254" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">3</text>
  <text x="350" y="254" text-anchor="middle" font-size="9.5" fill="#aaa">4</text>
  <text x="420" y="254" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">5</text>
  <text x="490" y="254" text-anchor="middle" font-size="9.5" fill="#aaa">6</text>

  <!-- mid marker at idx3 -->
  <path d="M280 262 L280 272" stroke="#446688" stroke-width="1.5" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="280" y="284" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">mid</text>

  <!-- peak callout -->
  <path d="M420 76 L470 60" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="478" y="56" font-size="10.5" fill="#b85450" font-weight="bold">峰值</text>

  <!-- two-case panels -->
  <!-- Ascending case -->
  <rect x="40" y="300" width="230" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="155" y="322" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">上升坡：nums[mid] &lt; nums[mid+1]</text>
  <path d="M70 350 L150 350" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="100" y="343" font-size="10" fill="#4a7a3a">↑ 往高处走</text>
  <text x="155" y="368" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">left = mid + 1 （向右）</text>

  <!-- Descending case -->
  <rect x="290" y="300" width="230" height="78" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="405" y="322" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">下降坡：nums[mid] &gt; nums[mid+1]</text>
  <path d="M490 350 L410 350" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="455" y="343" font-size="10" fill="#b85450">↑ 往高处走</text>
  <text x="405" y="368" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">right = mid （向左）</text>
</svg>
