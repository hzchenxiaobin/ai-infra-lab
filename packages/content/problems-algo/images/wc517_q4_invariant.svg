<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 390" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="390" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">代价不变量：当前值 = (v &gt;&gt; p) &lt;&lt; q，且已用步数 k ≥ p + q</text>

  <!-- lattice -->
  <text x="70" y="66" font-size="11" fill="#666">q（补零数）↑</text>
  <line x1="90" y1="300" x2="90" y2="80" stroke="#999" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="90" y1="300" x2="330" y2="300" stroke="#999" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="320" font-size="11" fill="#666">p（去位深度）→</text>

  <!-- grid dots (p = 0..3, q = 0..3) -->
  <g fill="#bbb">
    <circle cx="120" cy="300" r="3"/><circle cx="180" cy="300" r="3"/><circle cx="240" cy="300" r="3"/><circle cx="300" cy="300" r="3"/>
    <circle cx="120" cy="240" r="3"/><circle cx="180" cy="240" r="3"/><circle cx="240" cy="240" r="3"/><circle cx="300" cy="240" r="3"/>
    <circle cx="120" cy="180" r="3"/><circle cx="180" cy="180" r="3"/><circle cx="240" cy="180" r="3"/><circle cx="300" cy="180" r="3"/>
    <circle cx="120" cy="120" r="3"/><circle cx="180" cy="120" r="3"/><circle cx="240" cy="120" r="3"/><circle cx="300" cy="120" r="3"/>
  </g>

  <!-- start state -->
  <circle cx="120" cy="300" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="304" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">(0,0)</text>
  <text x="120" y="330" text-anchor="middle" font-size="9" fill="#888">v</text>

  <!-- multiply move -->
  <path d="M 128 288 L 168 252" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="122" y="262" font-size="9.5" fill="#446688" font-weight="bold">×2 → (p, q+1)</text>

  <!-- divide with q>=1 -->
  <path d="M 132 246 L 172 282" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="196" y="252" font-size="9.5" fill="#4a7a3a" font-weight="bold">÷2（q≥1）→ (p, q−1)</text>

  <!-- divide with q=0 -->
  <path d="M 138 300 L 162 300" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="150" y="288" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">÷2（q=0）</text>
  <text x="168" y="316" font-size="9.5" fill="#d6a040" font-weight="bold">→ (p+1, 0)</text>

  <!-- manhattan diagonal -->
  <path d="M 120 240 L 180 300 M 120 180 L 240 300 M 180 240 L 300 300" stroke="#b85450" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="248" y="186" font-size="9.5" fill="#b85450">斜线：p + q = 常数</text>
  <text x="248" y="200" font-size="9.5" fill="#b85450">每步至多跨一条</text>

  <!-- right panel: rules -->
  <rect x="360" y="60" width="180" height="112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="378" y="82" font-size="10.5" fill="#333" font-weight="bold">状态 (p, q) 的三种转移：</text>
  <text x="378" y="102" font-size="10" fill="#446688">×2：q 增加 1</text>
  <text x="378" y="120" font-size="10" fill="#4a7a3a">÷2 且 q≥1：q 减少 1</text>
  <text x="378" y="138" font-size="10" fill="#d6a040">÷2 且 q=0：p 增加 1</text>
  <text x="378" y="160" font-size="9.5" fill="#555">每步 p+q 至多 +1（÷2 还会减少）</text>

  <!-- invariant box -->
  <rect x="360" y="188" width="180" height="86" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="378" y="210" font-size="10.5" fill="#333" font-weight="bold">下界（不变量）：</text>
  <text x="378" y="228" font-size="10" fill="#555">k 步后到达 (p, q)，</text>
  <text x="378" y="244" font-size="10" fill="#555">则 k ≥ p + q</text>
  <text x="378" y="264" font-size="9.5" fill="#555">（曼哈顿距离 ≤ 实际步数）</text>

  <!-- construction box -->
  <rect x="60" y="336" width="480" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="78" y="356" font-size="11" fill="#4a7a3a" font-weight="bold">上界（构造）：先除 p 次再乘 q 次，恰好 p + q 步实现 (v &gt;&gt; p) &lt;&lt; q</text>
  <text x="78" y="374" font-size="11" fill="#333" font-weight="bold">⇒ 最少代价 = min{ p + q : (v &gt;&gt; p) &lt;&lt; q = t }</text>
</svg>
