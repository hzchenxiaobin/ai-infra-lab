<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="6"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">把“比例比较”改写成“前缀和符号比较”</text>

  <!-- condition box -->
  <rect x="40" y="55" width="480" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="80" font-size="13" fill="#333" filter="url(#rough2)">有效子数组：y &gt; 0 且  x / y ≤ a / b</text>
  <text x="60" y="102" font-size="13" fill="#446688" filter="url(#rough2)">⟺ (y&gt;0) 且 x·b ≤ y·a    （a,b,y 均 &gt; 0）</text>
  <text x="60" y="120" font-size="13" fill="#b85450" filter="url(#rough2)">⟺ (y&gt;0) 且 x·b − y·a ≤ 0</text>

  <!-- transform -->
  <text x="280" y="150" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">令 v[i] = b（偶）/ −a（奇），前缀 P[k]=Σv[0..k-1]</text>
  <g filter="url(#rough2)">
    <rect x="40" y="165" width="120" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="100" y="188" text-anchor="middle" font-size="12" fill="#4a7a3a">偶数 → +b</text>
    <rect x="180" y="165" width="120" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="240" y="188" text-anchor="middle" font-size="12" fill="#d6a040">奇数 → −a</text>
  </g>
  <text x="350" y="188" font-size="12" fill="#333" filter="url(#rough2)">子数组 [l,r] 的 x·b−y·a = P[r+1] − P[l]</text>

  <!-- final condition -->
  <rect x="40" y="220" width="480" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="247" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">计数 (l, r)：P[r+1] ≤ P[l]  且  [l,r] 含 ≥1 个奇数</text>
  <text x="280" y="268" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">“含奇数” ⟺ l ≤ lastOdd[r]</text>

  <!-- method -->
  <rect x="40" y="295" width="480" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="318" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">Q2 (n≤1000)：O(n²)</text>
  <text x="60" y="338" font-size="12" fill="#333" filter="url(#rough2)">枚举每个右端点 r，从右往左扫 l，累计 x,y</text>
  <text x="60" y="356" font-size="12" fill="#333" filter="url(#rough2)">遇到奇数即记 y&gt;0，检查 x·b ≤ y·a</text>
</svg>
