<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrU" markerWidth="8" markerHeight="8" refX="4" refY="1" orient="auto">
      <path d="M0,8 L4,1 L8,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">三种值的不同交换动作</text>

  <!-- ========= Case A: nums[i]==0 ========= -->
  <rect x="20" y="40" width="520" height="110" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <rect x="20" y="40" width="520" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="57" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">A. nums[i] == 0：换到左端，i 可前进 ✓</text>

  <!-- before: ...1...|0|... -->
  <text x="40" y="84" font-size="10.5" fill="#888">前：</text>
  <rect x="80" y="72" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="98" y="87" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="120" y="72" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="138" y="87" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <rect x="160" y="72" width="36" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="178" y="87" text-anchor="middle" font-size="11" fill="#aaa">?</text>

  <text x="98" y="112" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">p0</text>
  <path d="M 98 108 L 98 96" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arrU)" filter="url(#rough2)"/>
  <text x="138" y="112" text-anchor="middle" font-size="9.5" fill="#888" font-weight="bold">i</text>
  <path d="M 138 108 L 138 96" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arrU)" filter="url(#rough2)"/>

  <text x="220" y="87" font-size="11" fill="#d6a040" font-weight="bold">swap(i, p0)</text>
  <path d="M 215 83 L 200 83" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrU)" filter="url(#rough2)"/>

  <!-- after -->
  <text x="40" y="132" font-size="10.5" fill="#888">后：</text>
  <rect x="80" y="120" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="98" y="135" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <rect x="120" y="120" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="138" y="135" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="160" y="120" width="36" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="178" y="135" text-anchor="middle" font-size="11" fill="#aaa">?</text>
  <text x="220" y="135" font-size="10.5" fill="#4a7a3a" font-weight="bold">p0++, i++（换来的是1，可前进）</text>

  <!-- ========= Case B: nums[i]==1 ========= -->
  <rect x="20" y="160" width="520" height="80" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <rect x="20" y="160" width="520" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="177" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">B. nums[i] == 1：本该在中间，直接跳过</text>

  <rect x="120" y="192" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="138" y="207" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="138" y="228" text-anchor="middle" font-size="9.5" fill="#888" font-weight="bold">i</text>
  <path d="M 138 224 L 138 216" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arrU)" filter="url(#rough2)"/>
  <text x="190" y="207" font-size="11" fill="#4a7a3a" font-weight="bold">什么都不做，i++</text>

  <!-- ========= Case C: nums[i]==2 ========= -->
  <rect x="20" y="250" width="520" height="150" fill="#ffffff" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <rect x="20" y="250" width="520" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="267" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">C. nums[i] == 2：换到右端，i 不动 ⚠️</text>

  <!-- before -->
  <text x="40" y="294" font-size="10.5" fill="#888">前：</text>
  <rect x="120" y="282" width="36" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="138" y="297" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="160" y="282" width="36" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="178" y="297" text-anchor="middle" font-size="11" fill="#aaa">?</text>
  <rect x="200" y="282" width="36" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="218" y="297" text-anchor="middle" font-size="11" fill="#aaa" font-weight="bold">?</text>

  <text x="138" y="322" text-anchor="middle" font-size="9.5" fill="#888" font-weight="bold">i</text>
  <path d="M 138 318 L 138 306" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arrU)" filter="url(#rough2)"/>
  <text x="218" y="322" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">p2</text>
  <path d="M 218 318 L 218 306" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arrU)" filter="url(#rough2)"/>

  <text x="270" y="297" font-size="11" fill="#d6a040" font-weight="bold">swap(i, p2)</text>

  <!-- after -->
  <text x="40" y="354" font-size="10.5" fill="#888">后：</text>
  <rect x="120" y="342" width="36" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="138" y="357" text-anchor="middle" font-size="11" fill="#aaa" font-weight="bold">?</text>
  <rect x="160" y="342" width="36" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="178" y="357" text-anchor="middle" font-size="11" fill="#aaa">?</text>
  <rect x="200" y="342" width="36" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="218" y="357" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="260" y="357" font-size="10.5" fill="#b85450" font-weight="bold">p2--，i 不动</text>
  <text x="260" y="375" font-size="10" fill="#b85450">（换来的值未知，需重新检查）</text>

  <text x="138" y="384" text-anchor="middle" font-size="9.5" fill="#888" font-weight="bold">i 不动</text>
  <path d="M 138 380 L 138 366" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arrU)" filter="url(#rough2)"/>
</svg>
