<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">双加油机 DP：状态 = (i, fuel0, d0, d1)</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">d0/d1 为加油机相对当前允许时刻的剩余忙碌时间（0=空闲），fuel1 可由 fuel0 推导</text>

  <rect x="40" y="64" width="220" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="86" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold">加油机 0</text>
  <text x="60" y="108" font-size="11" fill="#333">fuel0: 剩余燃料</text>
  <text x="60" y="126" font-size="11" fill="#333">d0: 距空闲的秒数</text>
  <text x="60" y="146" font-size="10" fill="#888">d0=0 表示当前空闲</text>
  <text x="60" y="158" font-size="10" fill="#888">d0>0 表示需等 d0 秒</text>

  <rect x="300" y="64" width="220" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="410" y="86" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold">加油机 1</text>
  <text x="320" y="108" font-size="11" fill="#333">fuel1 = f0+f1-prefix[i]-fuel0</text>
  <text x="320" y="126" font-size="11" fill="#333">d1: 距空闲的秒数</text>
  <text x="320" y="146" font-size="10" fill="#888">同 d0，省去一维状态</text>

  <text x="280" y="186" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">车辆 i 选泵 j：需 fuel[j] &gt;= demand[i] 且 wait = d[j] &lt;= W</text>

  <rect x="40" y="200" width="240" height="90" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="160" y="222" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">选泵 0（wait = d0）</text>
  <text x="55" y="242" font-size="10.5" fill="#555">fuel0 -= demand[i]</text>
  <text x="55" y="258" font-size="10.5" fill="#555">d0_new = demand[i]</text>
  <text x="55" y="274" font-size="10.5" fill="#555">d0==0: d1 不变（允许时刻不变）</text>
  <text x="55" y="286" font-size="10.5" fill="#555">d0>0: d1=max(0, d1-d0)（时刻推进 d0）</text>

  <rect x="300" y="200" width="240" height="90" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="420" y="222" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">选泵 1（wait = d1）</text>
  <text x="315" y="242" font-size="10.5" fill="#555">fuel0 不变</text>
  <text x="315" y="258" font-size="10.5" fill="#555">d1_new = demand[i]</text>
  <text x="315" y="274" font-size="10.5" fill="#555">d1==0: d0 不变</text>
  <text x="315" y="286" font-size="10.5" fill="#555">d1>0: d0=max(0, d0-d1)</text>

  <rect x="30" y="306" width="500" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="50" y="326" font-size="11" fill="#333" font-weight="bold">关键：d0, d1 &lt;= max(demand) &lt;= 20，故每次等待 &lt;= 20</text>
  <text x="50" y="344" font-size="10.5" fill="#555">答案在 [0, 20] 中，先 DP 求最大服务数 K，再二分 W 检查能否服务 K 辆且 wait &lt;= W</text>

  <rect x="30" y="368" width="500" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="50" y="388" font-size="10.5" fill="#3a4a66">状态空间：i(51) * fuel0(51) * d0(21) * d1(21) ~ 1.1M，二分 ~6 轮，C++ 轻松通过</text>
  <text x="50" y="402" font-size="10.5" fill="#555">Python 用 BFS + visited 集合，只访问可达状态</text>
</svg>
