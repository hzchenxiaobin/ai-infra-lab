<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">从后往前双指针：取较大者放到末尾空位</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">nums1 末尾预留 n 个空位，从右端往左填，写入与读取方向相反</text>

  <!-- ===== nums1 row ===== -->
  <text x="30" y="92" font-size="12" fill="#446688" font-weight="bold">nums1:</text>

  <!-- buffer bracket above cells 3-5 -->
  <path d="M 222 60 L 222 54 L 368 54 L 368 60" stroke="#d6a040" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="295" y="48" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">预留空位 (n=3)</text>

  <g font-size="12">
    <rect x="70" y="66" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="95" y="86" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="120" y="66" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="145" y="86" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <rect x="170" y="66" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="195" y="86" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
    <rect x="220" y="66" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="245" y="86" text-anchor="middle" fill="#d6a040">0</text>
    <rect x="270" y="66" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="295" y="86" text-anchor="middle" fill="#d6a040">0</text>
    <rect x="320" y="66" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="345" y="86" text-anchor="middle" fill="#d6a040">0</text>
  </g>

  <!-- m bracket below cells 0-2 -->
  <path d="M 72 100 L 72 106 L 218 106 L 218 100" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="145" y="120" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">真实元素 (m=3)</text>

  <!-- pointers p1 and p below nums1 -->
  <text x="195" y="140" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">p1 ↑</text>
  <text x="345" y="140" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">p ↑</text>

  <!-- ===== nums2 row ===== -->
  <text x="30" y="172" font-size="12" fill="#4a7a3a" font-weight="bold">nums2:</text>
  <g font-size="12">
    <rect x="70" y="156" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="95" y="176" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="120" y="156" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="145" y="176" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>
    <rect x="170" y="156" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="195" y="176" text-anchor="middle" fill="#4a7a3a" font-weight="bold">6</text>
  </g>
  <text x="195" y="202" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">p2 ↑</text>

  <!-- ===== Rule box ===== -->
  <rect x="30" y="220" width="500" height="58" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="44" y="242" font-size="11.5" fill="#444" font-weight="bold">规则：每次取较大者写入 nums1[p]，p 与所选指针各左移一位</text>
  <text x="44" y="262" font-family="monospace" font-size="10.5" fill="#446688">if (p1≥0 且 nums1[p1] &gt; nums2[p2]):  nums1[p]=nums1[p1]; p1−−</text>
  <text x="44" y="276" font-family="monospace" font-size="10.5" fill="#4a7a3a">else:                              nums1[p]=nums2[p2]; p2−−</text>

  <!-- ===== Safety box ===== -->
  <rect x="30" y="292" width="500" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="314" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">为什么安全：写入位置 p 始终在 p1 右侧</text>
  <text x="280" y="332" text-anchor="middle" font-size="11" fill="#555">空位从右往左被消耗，nums1 真实元素从左往右才被读取</text>
  <text x="280" y="350" text-anchor="middle" font-size="11" fill="#555">两个方向相反 → 写入只会落在“已读过”或“原本空位”上，永不覆盖未读数据</text>
</svg>
