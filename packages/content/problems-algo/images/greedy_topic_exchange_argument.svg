<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">交换论证：把「任意最优解」逐步改造成「贪心解」，且目标值不变差</text>
  <text x="320" y="46" text-anchor="middle" font-size="11" fill="#888">例：区间调度选最多不重叠区间（435/452 系），贪心策略 = 按右端点排序每次选最早结束的</text>

  <!-- ===== Step 1: arbitrary optimal solution ===== -->
  <text x="40" y="76" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">步骤 1：任取一个最优解 OPT</text>
  <rect x="40" y="84" width="560" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="104" font-size="11" fill="#555" filter="url(#rough2)">OPT 选了若干区间（不一定按右端点排序选的），但它选的个数 = 最优值</text>
  <!-- intervals chosen in OPT -->
  <rect x="80" y="112" width="50" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="105" y="126" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">P₁</text>
  <rect x="150" y="112" width="50" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="175" y="126" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">P₂</text>
  <rect x="220" y="112" width="50" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="245" y="126" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">P₃</text>
  <text x="290" y="126" font-size="10" fill="#888" filter="url(#rough2)">…（OPT 的选择，按结束时间排列）</text>

  <!-- ===== Step 2: compare first pick ===== -->
  <text x="40" y="162" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">步骤 2：对比贪心选的第一个 G₁ 与 OPT 的第一个 P₁</text>
  <rect x="40" y="170" width="560" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="190" font-size="11" fill="#555" filter="url(#rough2)">• 贪心 G₁ 是所有区间中右端点最小的 → end(G₁) ≤ end(P₁)</text>
  <text x="56" y="208" font-size="11" fill="#555" filter="url(#rough2)">• 用 G₁ 替换 P₁：G₁ 结束更早（或同时），不会与 P₂ 重叠 → 替换后仍合法</text>
  <text x="56" y="226" font-size="11" fill="#555" filter="url(#rough2)">• 区间数不变（换一），仍是合法解且个数 = 最优值 ✓</text>
  <text x="56" y="242" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ 关键：end(G₁) ≤ end(P₁) 保证替换不破坏后续</text>

  <!-- visualize swap -->
  <rect x="80" y="250" width="60" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="110" y="264" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">G₁</text>
  <path d="M 140 260 L 165 260" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="152" y="254" font-size="8" fill="#4a7a3a" filter="url(#rough2)">替换</text>
  <rect x="170" y="250" width="60" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="200" y="264" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">P₁ 删</text>
  <rect x="240" y="250" width="50" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="265" y="264" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">P₂</text>
  <rect x="300" y="250" width="50" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="325" y="264" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">P₃</text>
  <text x="370" y="264" font-size="9" fill="#888" filter="url(#rough2)">… G₁,P₂,P₃,… 仍合法</text>

  <!-- ===== Step 3: induct ===== -->
  <text x="40" y="294" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">步骤 3：归纳 —— 对第 2,3,… 个选择重复替换</text>
  <rect x="40" y="302" width="560" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="322" font-size="11" fill="#555" filter="url(#rough2)">• 替换前 k 个后，OPT 的前缀 = 贪心的前缀 G₁…Gₖ，且 end(Gₖ) ≤ end(Pₖ)</text>
  <text x="56" y="340" font-size="11" fill="#555" filter="url(#rough2)">• 贪心第 k+1 步选的是「end(Gₖ) 之后右端点最小的」→ end(G_{k+1}) ≤ end(P_{k+1})，可替换</text>
  <text x="56" y="358" font-size="11" fill="#555" filter="url(#rough2)">• 逐个替换，最终 OPT 被改造成完全的贪心解，区间数始终不变 ✓</text>

  <!-- ===== conclusion ===== -->
  <rect x="40" y="376" width="560" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="320" y="398" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">结论：任意最优解都能被改造成贪心解，且个数不减少</text>
  <text x="56" y="418" font-size="10" fill="#555" filter="url(#rough2)">→ 贪心解的个数 ≥ 最优值；又贪心解是合法解，个数 ≤ 最优值；故贪心解个数 = 最优值 ✅</text>
  <text x="56" y="434" font-size="10" fill="#888" filter="url(#rough2)">交换论证的核心：每次替换「不破坏合法性、不减少数量」，把任意最优「扭」成贪心解</text>
</svg>
