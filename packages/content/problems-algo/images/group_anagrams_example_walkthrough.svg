<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：strs = ["eat","tea","tan","ate","nat","bat"]</text>

  <!-- Header row -->
  <rect x="16" y="46" width="548" height="30" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="40" y="66" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">步骤</text>
  <text x="100" y="66" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">输入 s</text>
  <text x="180" y="66" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">排序签名 key</text>
  <text x="400" y="66" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">哈希表 map 状态</text>

  <!-- column dividers -->
  <line x1="70" y1="46" x2="70" y2="350" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="130" y1="46" x2="130" y2="350" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="232" y1="46" x2="232" y2="350" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 1: eat -->
  <rect x="16" y="78" width="548" height="40" fill="#f7f9fc" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="103" text-anchor="middle" font-size="12" fill="#555">1</text>
  <text x="100" y="103" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">eat</text>
  <rect x="148" y="86" width="64" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="180" y="103" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">aet</text>
  <text x="244" y="103" font-size="11.5" fill="#333"><tspan fill="#446688" font-weight="bold">aet</tspan> → [eat]</text>

  <!-- Row 2: tea -->
  <rect x="16" y="120" width="548" height="40" fill="#ffffff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="145" text-anchor="middle" font-size="12" fill="#555">2</text>
  <text x="100" y="145" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">tea</text>
  <rect x="148" y="128" width="64" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="180" y="145" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">aet</text>
  <text x="244" y="145" font-size="11.5" fill="#333"><tspan fill="#446688" font-weight="bold">aet</tspan> → [eat, <tspan fill="#b85450" font-weight="bold">tea</tspan>]</text>

  <!-- Row 3: tan -->
  <rect x="16" y="162" width="548" height="40" fill="#f7f9fc" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="187" text-anchor="middle" font-size="12" fill="#555">3</text>
  <text x="100" y="187" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">tan</text>
  <rect x="148" y="170" width="64" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="180" y="187" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">ant</text>
  <text x="244" y="187" font-size="11.5" fill="#333"><tspan fill="#446688" font-weight="bold">aet</tspan> → [eat, tea]　<tspan fill="#4a7a3a" font-weight="bold">ant</tspan> → [<tspan fill="#b85450" font-weight="bold">tan</tspan>]</text>

  <!-- Row 4: ate -->
  <rect x="16" y="204" width="548" height="40" fill="#ffffff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="229" text-anchor="middle" font-size="12" fill="#555">4</text>
  <text x="100" y="229" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ate</text>
  <rect x="148" y="212" width="64" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="180" y="229" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">aet</text>
  <text x="244" y="229" font-size="11.5" fill="#333"><tspan fill="#446688" font-weight="bold">aet</tspan> → [eat, tea, <tspan fill="#b85450" font-weight="bold">ate</tspan>]　<tspan fill="#4a7a3a" font-weight="bold">ant</tspan> → [tan]</text>

  <!-- Row 5: nat -->
  <rect x="16" y="246" width="548" height="40" fill="#f7f9fc" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="271" text-anchor="middle" font-size="12" fill="#555">5</text>
  <text x="100" y="271" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">nat</text>
  <rect x="148" y="254" width="64" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="180" y="271" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">ant</text>
  <text x="244" y="271" font-size="11.5" fill="#333"><tspan fill="#446688" font-weight="bold">aet</tspan> → [eat, tea, ate]　<tspan fill="#4a7a3a" font-weight="bold">ant</tspan> → [tan, <tspan fill="#b85450" font-weight="bold">nat</tspan>]</text>

  <!-- Row 6: bat -->
  <rect x="16" y="288" width="548" height="40" fill="#ffffff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="313" text-anchor="middle" font-size="12" fill="#555">6</text>
  <text x="100" y="313" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">bat</text>
  <rect x="148" y="296" width="64" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="180" y="313" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">abt</text>
  <text x="244" y="313" font-size="11" fill="#333"><tspan fill="#446688" font-weight="bold">aet</tspan> → [eat, tea, ate]　<tspan fill="#4a7a3a" font-weight="bold">ant</tspan> → [tan, nat]　<tspan fill="#d6a040" font-weight="bold">abt</tspan> → [<tspan fill="#b85450" font-weight="bold">bat</tspan>]</text>

  <!-- footer -->
  <rect x="16" y="340" width="548" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="290" y="360" text-anchor="middle" font-size="11.5" fill="#444">遍历结束 → map.values() = [[eat,tea,ate], [tan,nat], [bat]] ✓</text>
</svg>
