<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">影子对 = 区间 [i, j] 的最小值恰在左端,且右端更大</text>

  <!-- ============ 正例 ============ -->
  <text x="70" y="66" font-size="13.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓ 正例:(i, j) = (1, 4)</text>
  <text x="500" y="66" font-size="11" fill="#999" filter="url(#rough2)">nums = [3,1,4,1,5]</text>

  <!-- 弧线 -->
  <path d="M 185 96 Q 275 66 365 96" fill="none" stroke="#446688" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="100" y="102" width="50" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="160" y="102" width="50" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.4"/>
    <rect x="220" y="102" width="50" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="280" y="102" width="50" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="340" y="102" width="50" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
  </g>
  <text x="125" y="126" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="185" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <text x="245" y="126" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <text x="305" y="126" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="365" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6420" filter="url(#rough2)">5</text>

  <text x="125" y="154" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="185" y="154" text-anchor="middle" font-size="10" font-weight="bold" fill="#446688" filter="url(#rough2)">i=1</text>
  <text x="245" y="154" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="305" y="154" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="365" y="154" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a6420" filter="url(#rough2)">j=4</text>

  <text x="440" y="112" font-size="11" fill="#4a7a3a" filter="url(#rough2)">内部 4、1 全 ≥ nums[i]=1 ✓</text>
  <text x="440" y="132" font-size="11" fill="#4a7a3a" filter="url(#rough2)">nums[i]=1 &lt; nums[j]=5 ✓</text>
  <text x="440" y="152" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">⇒ 是影子对</text>

  <!-- ============ 反例 ============ -->
  <text x="70" y="196" font-size="13.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗ 反例:(i, j) = (0, 2)</text>

  <path d="M 125 226 Q 185 196 245 226" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="100" y="232" width="50" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.4"/>
    <rect x="160" y="232" width="50" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
    <rect x="220" y="232" width="50" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
  </g>
  <text x="125" y="256" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">3</text>
  <text x="185" y="256" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="245" y="256" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6420" filter="url(#rough2)">4</text>

  <text x="125" y="284" text-anchor="middle" font-size="10" font-weight="bold" fill="#446688" filter="url(#rough2)">i=0</text>
  <text x="185" y="284" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">k=1</text>
  <text x="245" y="284" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a6420" filter="url(#rough2)">j=2</text>

  <text x="320" y="242" font-size="11" fill="#555" filter="url(#rough2)">nums[0]=3 &lt; nums[2]=4 ✓</text>
  <text x="320" y="262" font-size="11" fill="#b85450" filter="url(#rough2)">但 k=1:nums[1]=1 &lt; 3,一票否决 ✗</text>
  <text x="320" y="282" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">⇒ 不是影子对</text>

  <!-- ============ 等价刻画 ============ -->
  <rect x="40" y="310" width="560" height="104" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="338" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">等价刻画:min(nums[i..j]) = nums[i] 且 nums[j] &gt; nums[i]</text>
  <text x="320" y="364" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">「内部无更小」+「右端更大」= 左端恰是区间最小值</text>
  <text x="320" y="388" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">窗口刻画:i &lt; j &lt; next_smaller[i] 且 nums[j] &gt; nums[i]</text>
  <text x="320" y="408" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">next_smaller[i] = 右侧第一个严格更小值的下标,不存在则取 n</text>
</svg>
