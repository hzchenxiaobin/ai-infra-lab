<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">二分答案：上限 limit 越大 → 所需段数 f(limit) 越少（单调递减）</text>

  <!-- ===== Array split ===== -->
  <text x="40" y="52" font-size="12" fill="#888">数组 nums:</text>
  <line x1="80" y1="150" x2="440" y2="150" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- segment 1: [7,2,5] = 14 -->
  <rect x="96" y="110" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="116" y="135" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
  <rect x="140" y="110" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="135" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="184" y="110" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="204" y="135" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <text x="160" y="100" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">和=14</text>

  <!-- segment 2: [10,8] = 18 -->
  <rect x="276" y="110" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="296" y="135" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">10</text>
  <rect x="320" y="110" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="340" y="135" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>
  <text x="318" y="100" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">和=18（最大段）</text>

  <!-- cut marker -->
  <line x1="240" y1="100" x2="240" y2="160" stroke="#b85450" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="240" y="92" text-anchor="middle" font-size="10" fill="#b85450">切断</text>

  <text x="116" y="166" text-anchor="middle" font-size="10" fill="#999">第 1 段</text>
  <text x="318" y="166" text-anchor="middle" font-size="10" fill="#999">第 2 段</text>

  <!-- arrow down -->
  <path d="M 280 178 L 280 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="190" font-size="11" fill="#888">f(limit) 单调递减</text>

  <!-- ===== Monotonic curve ===== -->
  <line x1="80" y1="210" x2="80" y2="360" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="80" y1="360" x2="380" y2="360" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="216" text-anchor="end" font-size="10" fill="#888">段数</text>
  <text x="384" y="364" font-size="10" fill="#888">limit →</text>
  <text x="74" y="364" text-anchor="end" font-size="10" fill="#999">0</text>

  <!-- y axis ticks -->
  <text x="74" y="234" text-anchor="end" font-size="9" fill="#aaa">n</text>
  <line x1="78" y1="330" x2="82" y2="330" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="74" y="334" text-anchor="end" font-size="9" fill="#aaa">1</text>

  <!-- decreasing step-like curve -->
  <path d="M 90 236 L 150 236 L 150 270 L 210 270 L 210 300 L 270 300 L 270 330 L 370 330" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="150" y="256" font-size="11" fill="#446688" font-weight="bold">limit ↑ ⇒ f ↓</text>

  <!-- k threshold line -->
  <line x1="80" y1="300" x2="380" y2="300" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="384" y="304" font-size="11" fill="#b85450" font-weight="bold">k = 2</text>

  <!-- answer point at limit=18 -->
  <circle cx="210" cy="300" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="210" y1="300" x2="210" y2="360" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="210" y="376" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">limit* = 18</text>

  <!-- feasible / infeasible labels -->
  <text x="110" y="294" font-size="10" fill="#b85450">段太多 ✗</text>
  <text x="300" y="294" font-size="10" fill="#4a7a3a">可行 ✓</text>

  <!-- right summary note -->
  <rect x="392" y="222" width="150" height="118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="467" y="246" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">答案空间</text>
  <text x="467" y="268" text-anchor="middle" font-size="11" fill="#666">limit ∈ [max, sum]</text>
  <text x="467" y="288" text-anchor="middle" font-size="11" fill="#666">求最小的 limit</text>
  <text x="467" y="306" text-anchor="middle" font-size="11" fill="#666">使 f(limit) ≤ k</text>
  <text x="467" y="328" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">单调 ⇒ 可二分！</text>
</svg>
