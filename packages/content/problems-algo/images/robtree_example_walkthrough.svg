<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：root = [3,2,3,null,3,null,1] → 答案 7</text>
  <text x="310" y="42" text-anchor="middle" font-size="11" fill="#888">自底向上为每节点算 (rob, not_rob)，根节点取 max(7, 6) = 7</text>

  <!-- ===== tree with annotations ===== -->
  <text x="160" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">后序标注 (rob, not_rob)</text>

  <!-- root: 3  -> (7,6) -->
  <ellipse cx="160" cy="96" rx="22" ry="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="160" y="101" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040">3</text>
  <rect x="196" y="84" width="66" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="229" y="101" text-anchor="middle" font-family="monospace" font-size="11" fill="#b85450" font-weight="bold">(7, 6)</text>

  <!-- edges -->
  <path d="M 148 108 Q 120 124 96 142" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 172 108 Q 200 124 224 142" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- left child: 2 -> (2,3) -->
  <ellipse cx="92" cy="152" rx="20" ry="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="92" y="157" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">2</text>
  <rect x="124" y="140" width="58" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="153" y="157" text-anchor="middle" font-family="monospace" font-size="10" fill="#446688" font-weight="bold">(2, 3)</text>

  <!-- right child: 3 -> (3,1) -->
  <ellipse cx="228" cy="152" rx="20" ry="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="228" y="157" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">3</text>
  <rect x="260" y="140" width="58" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="289" y="157" text-anchor="middle" font-family="monospace" font-size="10" fill="#446688" font-weight="bold">(3, 1)</text>

  <!-- edges to leaves (2 -> right leaf 3; 3 -> right leaf 1) -->
  <path d="M 104 164 Q 118 182 132 200" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 240 164 Q 254 182 268 200" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- null children hints -->
  <text x="74" y="200" text-anchor="middle" font-size="9" fill="#bbb" font-style="italic">null</text>
  <text x="210" y="200" text-anchor="middle" font-size="9" fill="#bbb" font-style="italic">null</text>

  <!-- leaf 3 -> (3,0) -->
  <ellipse cx="136" cy="210" rx="18" ry="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="136" y="215" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">3</text>
  <rect x="164" y="198" width="54" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="191" y="215" text-anchor="middle" font-family="monospace" font-size="10" fill="#4a7a3a" font-weight="bold">(3, 0)</text>

  <!-- leaf 1 -> (1,0) -->
  <ellipse cx="272" cy="210" rx="18" ry="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="272" y="215" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">1</text>
  <rect x="300" y="198" width="54" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="327" y="215" text-anchor="middle" font-family="monospace" font-size="10" fill="#4a7a3a" font-weight="bold">(1, 0)</text>

  <!-- bottom-up arrow -->
  <path d="M 320 250 Q 250 270 180 286" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)" stroke-dasharray="4 3"/>
  <text x="300" y="266" font-size="10" fill="#d6a040" font-weight="bold">自底向上</text>

  <!-- ===== computation table (right) ===== -->
  <text x="470" y="66" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">逐节点计算</text>

  <!-- header -->
  <rect x="380" y="78" width="220" height="22" fill="#446688" filter="url(#rough2)"/>
  <text x="400" y="94" font-size="9" fill="#fff" font-weight="bold">节点</text>
  <text x="448" y="94" font-size="9" fill="#fff" font-weight="bold">rob</text>
  <text x="500" y="94" font-size="9" fill="#fff" font-weight="bold">not_rob</text>
  <text x="560" y="94" font-size="9" fill="#fff" font-weight="bold">取值</text>

  <!-- rows -->
  <g font-size="10" fill="#333">
    <rect x="380" y="100" width="220" height="24" fill="#e6f4ea" stroke="#cfd8dc" stroke-width="0.8" filter="url(#rough2)"/>
    <text x="400" y="116" fill="#4a7a3a" font-weight="bold">叶 3</text>
    <text x="448" y="116" font-family="monospace">3+0+0</text>
    <text x="500" y="116" font-family="monospace">0+0</text>
    <text x="560" y="116" font-family="monospace" font-weight="bold">(3,0)</text>

    <rect x="380" y="124" width="220" height="24" fill="#e6f4ea" stroke="#cfd8dc" stroke-width="0.8" filter="url(#rough2)"/>
    <text x="400" y="140" fill="#4a7a3a" font-weight="bold">叶 1</text>
    <text x="448" y="140" font-family="monospace">1+0+0</text>
    <text x="500" y="140" font-family="monospace">0+0</text>
    <text x="560" y="140" font-family="monospace" font-weight="bold">(1,0)</text>

    <rect x="380" y="148" width="220" height="24" fill="#e8f0fe" stroke="#cfd8dc" stroke-width="0.8" filter="url(#rough2)"/>
    <text x="400" y="164" fill="#446688" font-weight="bold">节点 2</text>
    <text x="448" y="164" font-family="monospace">2+0+0</text>
    <text x="500" y="164" font-family="monospace">0+max(3,0)</text>
    <text x="560" y="164" font-family="monospace" font-weight="bold">(2,3)</text>

    <rect x="380" y="172" width="220" height="24" fill="#e8f0fe" stroke="#cfd8dc" stroke-width="0.8" filter="url(#rough2)"/>
    <text x="400" y="188" fill="#446688" font-weight="bold">节点 3</text>
    <text x="448" y="188" font-family="monospace">3+0+0</text>
    <text x="500" y="188" font-family="monospace">0+max(1,0)</text>
    <text x="560" y="188" font-family="monospace" font-weight="bold">(3,1)</text>

    <rect x="380" y="196" width="220" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="400" y="214" fill="#d6a040" font-weight="bold">根 3</text>
    <text x="448" y="214" font-family="monospace">3+3+1</text>
    <text x="500" y="214" font-family="monospace">3+3</text>
    <text x="560" y="214" font-family="monospace" font-weight="bold">(7,6)</text>
  </g>

  <!-- ===== bottom result ===== -->
  <rect x="30" y="296" width="560" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="310" y="318" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">答案 = max(根.rob, 根.not_rob) = max(7, 6) = 7</text>
  <text x="310" y="338" text-anchor="middle" font-size="11" fill="#555">最优方案：偷根(3) + 偷左子树最优(3) + 偷右子树最优(1) = 3 + 3 + 1 = 7</text>
  <text x="310" y="352" text-anchor="middle" font-size="10" fill="#888">根.rob=7 用的是两子节点的 not_rob：node2.not_rob=3、node3.not_rob=1，互不冲突</text>

  <!-- ===== bottom insight ===== -->
  <rect x="30" y="372" width="560" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="310" y="394" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">为什么根.rob=7 用子节点的 not_rob？</text>
  <text x="46" y="414" font-size="11" fill="#555">偷根节点 → 根的子节点（2 和 3）都不能偷 → 只能取它们的 not_rob：node2.not_rob=3（即偷孙叶 3）、node3.not_rob=1（偷孙叶 1）。</text>
  <text x="46" y="432" font-size="11" fill="#555">根节点与孙叶不相邻，可同时偷 → 3(根) + 3(孙) + 1(孙) = 7，全局最优。</text>
</svg>
