<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">快速幂演算：2^10 mod (10⁹+7)</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">10 = (1010)₂，按位处理：base 不断平方，位为 1 时把 base 乘进 res</text>

  <!-- exponent bits -->
  <text x="80" y="76" font-size="11" fill="#3a4a66" font-weight="bold">指数二进制：</text>
  <rect x="180" y="60" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="197" y="78" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="216" y="60" width="34" height="26" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="233" y="78" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="252" y="60" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="269" y="78" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="288" y="60" width="34" height="26" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="305" y="78" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="336" y="78" font-size="10" fill="#888">高位 → 低位</text>

  <!-- squaring chain -->
  <text x="80" y="120" font-size="11" fill="#3a4a66" font-weight="bold">base 平方链：</text>

  <rect x="70" y="130" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="98" y="152" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <path d="M 126 147 L 160 147" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="143" y="140" text-anchor="middle" font-size="9" fill="#888">²</text>

  <rect x="162" y="130" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="190" y="152" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <path d="M 218 147 L 252 147" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="235" y="140" text-anchor="middle" font-size="9" fill="#888">²</text>

  <rect x="254" y="130" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="282" y="152" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">16</text>
  <path d="M 310 147 L 344 147" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="327" y="140" text-anchor="middle" font-size="9" fill="#888">²</text>

  <rect x="346" y="130" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="374" y="152" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">256</text>
  <path d="M 402 147 L 436 147" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="419" y="140" text-anchor="middle" font-size="9" fill="#888">²</text>

  <rect x="438" y="130" width="70" height="34" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="473" y="152" text-anchor="middle" font-size="11" fill="#555">65536…</text>

  <!-- res accumulation -->
  <text x="80" y="200" font-size="11" fill="#3a4a66" font-weight="bold">res 累乘：</text>

  <rect x="70" y="210" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="105" y="232" text-anchor="middle" font-size="12" fill="#333">1</text>

  <path d="M 140 227 L 180 227" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="220" text-anchor="middle" font-size="9" fill="#4a7a3a">bit=1 ×4</text>

  <rect x="182" y="210" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="217" y="232" text-anchor="middle" font-size="12" fill="#333">4</text>

  <path d="M 252 227 L 292 227" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="220" text-anchor="middle" font-size="9" fill="#4a7a3a">bit=1 ×256</text>

  <rect x="294" y="210" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="334" y="232" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">1024 ✓</text>

  <text x="396" y="232" font-size="10.5" fill="#555">= 4 × 256</text>

  <!-- table -->
  <text x="80" y="278" font-size="11" fill="#3a4a66" font-weight="bold">逐位表格：</text>
  <rect x="80" y="286" width="440" height="76" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <line x1="80" y1="306" x2="520" y2="306" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="80" y1="326" x2="520" y2="326" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="80" y1="346" x2="520" y2="346" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="230" y1="286" x2="230" y2="362" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="370" y1="286" x2="370" y2="362" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="155" y="300" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">轮次（低→高）</text>
  <text x="300" y="300" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">base</text>
  <text x="445" y="300" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">res</text>
  <text x="155" y="321" text-anchor="middle" font-size="10" fill="#333">bit0 = 0</text>
  <text x="300" y="321" text-anchor="middle" font-size="10" fill="#333">2 → 4</text>
  <text x="445" y="321" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="155" y="341" text-anchor="middle" font-size="10" fill="#333">bit1 = 1</text>
  <text x="300" y="341" text-anchor="middle" font-size="10" fill="#333">4 → 16</text>
  <text x="445" y="341" text-anchor="middle" font-size="10" fill="#333">1 × 4 = 4</text>
  <text x="155" y="359" text-anchor="middle" font-size="10" fill="#333">bit2/bit3</text>
  <text x="300" y="359" text-anchor="middle" font-size="10" fill="#333">16 → 256</text>
  <text x="445" y="359" text-anchor="middle" font-size="10" fill="#333">4 × 256 = 1024</text>
</svg>
