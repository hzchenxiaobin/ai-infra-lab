<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [1,1,1,1,1], target = 3, pos = 4</text>

  <!-- 表格参数: label列 x=40 w=110 (center 95); 数据列 w=76 从 x=150 起 -->
  <!-- 数据列中心: 188 264 340 416 492 -->
  <!-- 表头 y=50 h=34 -->
  <rect x="40" y="50" width="110" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="72" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">处理 num</text>

  <rect x="150" y="50" width="76" height="34" fill="#f6f6f6" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="188" y="72" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">dp[0]</text>
  <rect x="226" y="50" width="76" height="34" fill="#f6f6f6" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="264" y="72" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">dp[1]</text>
  <rect x="302" y="50" width="76" height="34" fill="#f6f6f6" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="340" y="72" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">dp[2]</text>
  <rect x="378" y="50" width="76" height="34" fill="#f6f6f6" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="416" y="72" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">dp[3]</text>
  <rect x="454" y="50" width="76" height="34" fill="#f6f6f6" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="492" y="72" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">dp[4]</text>

  <!-- 行1: 初始  y=84 h=38 -->
  <rect x="40" y="84" width="110" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="95" y="108" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">初始</text>
  <rect x="150" y="84" width="76" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="188" y="109" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="226" y="84" width="76" height="38" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="264" y="109" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <rect x="302" y="84" width="76" height="38" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="340" y="109" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <rect x="378" y="84" width="76" height="38" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="416" y="109" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <rect x="454" y="84" width="76" height="38" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="492" y="109" text-anchor="middle" font-size="12" fill="#aaa">0</text>

  <!-- 行2: 第1个1  y=122 -->
  <rect x="40" y="122" width="110" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="95" y="146" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">第 1 个 1</text>
  <rect x="150" y="122" width="76" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="188" y="147" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="226" y="122" width="76" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="264" y="147" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="302" y="122" width="76" height="38" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="340" y="147" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <rect x="378" y="122" width="76" height="38" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="416" y="147" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <rect x="454" y="122" width="76" height="38" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="492" y="147" text-anchor="middle" font-size="12" fill="#aaa">0</text>

  <!-- 行3: 第2个1  y=160 -->
  <rect x="40" y="160" width="110" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="95" y="184" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">第 2 个 1</text>
  <rect x="150" y="160" width="76" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="188" y="185" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="226" y="160" width="76" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="264" y="185" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="302" y="160" width="76" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="340" y="185" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="378" y="160" width="76" height="38" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="416" y="185" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <rect x="454" y="160" width="76" height="38" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="492" y="185" text-anchor="middle" font-size="12" fill="#aaa">0</text>

  <!-- 行4: 第3个1  y=198 -->
  <rect x="40" y="198" width="110" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="95" y="222" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">第 3 个 1</text>
  <rect x="150" y="198" width="76" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="188" y="223" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="226" y="198" width="76" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="264" y="223" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="302" y="198" width="76" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="340" y="223" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="378" y="198" width="76" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="416" y="223" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="454" y="198" width="76" height="38" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="492" y="223" text-anchor="middle" font-size="12" fill="#aaa">0</text>

  <!-- 行5: 第4个1  y=236 -->
  <rect x="40" y="236" width="110" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="95" y="260" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">第 4 个 1</text>
  <rect x="150" y="236" width="76" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="188" y="261" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="226" y="236" width="76" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="264" y="261" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="302" y="236" width="76" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="340" y="261" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <rect x="378" y="236" width="76" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="416" y="261" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="454" y="236" width="76" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="492" y="261" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <!-- 行6: 第5个1  y=274  答案行 -->
  <rect x="40" y="274" width="110" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="95" y="298" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">第 5 个 1 ★</text>
  <rect x="150" y="274" width="76" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="188" y="299" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="226" y="274" width="76" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="264" y="299" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <rect x="302" y="274" width="76" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="340" y="299" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">10</text>
  <rect x="378" y="274" width="76" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="416" y="299" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">10</text>
  <rect x="454" y="274" width="76" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="492" y="299" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">5</text>

  <!-- 图例 + 说明 -->
  <rect x="40" y="324" width="22" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="68" y="337" font-size="10.5" fill="#555">种子 dp[0]</text>
  <rect x="150" y="324" width="22" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="178" y="337" font-size="10.5" fill="#555">本轮更新</text>
  <rect x="260" y="324" width="22" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="288" y="337" font-size="10.5" fill="#555">答案 dp[pos]</text>

  <text x="280" y="362" text-anchor="middle" font-size="10.5" fill="#888">每处理一个 1，j 从 4↓1 倒序：dp[j] += dp[j−1]</text>
  <text x="280" y="380" text-anchor="middle" font-size="10.5" fill="#888">最终 dp = [1,5,10,10,5] 即杨辉三角第 5 行，C(5,4)=5</text>
</svg>
