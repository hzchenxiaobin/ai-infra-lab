<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 880" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="740" height="880" fill="#fafafa"/>

  <text x="370" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">状态扩展 Dijkstra 算法流程</text>
  <path d="M 230 42 Q 370 50 510 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- start -->
  <g filter="url(#rough2)">
    <rect x="190" y="56" width="360" height="42" rx="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="370" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6a" filter="url(#rough2)">开始：dist 全部初始化为 ∞</text>
  <path d="M 370 98 L 370 118" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init -->
  <g filter="url(#rough2)">
    <rect x="150" y="122" width="440" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="370" y="144" text-anchor="middle" font-size="12" fill="#2b4a6a" filter="url(#rough2)">起点尚无方向：枚举四个首步方向 d</text>
  <text x="370" y="164" text-anchor="middle" font-size="12" fill="#2b4a6a" filter="url(#rough2)">dist[nr][nc][d][0] = grid[0][0] + grid[nr][nc]，入堆</text>
  <path d="M 370 178 L 370 204" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond 1: heap non-empty -->
  <g filter="url(#rough2)">
    <polygon points="370,208 480,250 370,292 260,250" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="370" y="255" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#rough2)">堆非空？</text>

  <!-- no -> answer -->
  <path d="M 480 250 L 516 250" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="498" y="240" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="520" y="218" width="200" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="620" y="241" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415" filter="url(#rough2)">答案 = min dist[m−1][n−1][d][t]</text>
  <text x="620" y="261" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#rough2)">（d 任意，t ≤ k）；全 ∞ 则 −1</text>
  <path d="M 620 280 L 620 306" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="560" y="310" width="120" height="38" rx="19" fill="#f0ede4" stroke="#888888" stroke-width="1.4"/>
  </g>
  <text x="620" y="334" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">结束</text>

  <!-- yes -> pop -->
  <path d="M 370 292 L 370 326" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="390" y="314" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="190" y="330" width="360" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="370" y="356" text-anchor="middle" font-size="12" fill="#2b4a6a" filter="url(#rough2)">取出堆顶：最小代价状态 (r, c, d, t)</text>
  <path d="M 370 372 L 370 402" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond 2: stale -->
  <g filter="url(#rough2)">
    <polygon points="370,406 550,448 370,490 190,448" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="370" y="443" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#rough2)">过期堆元素？</text>
  <text x="370" y="462" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#rough2)">cost &gt; dist[r][c][d][t]</text>

  <!-- stale yes -> back to diamond1 via left bus x=70 -->
  <path d="M 190 448 C 120 448, 70 410, 70 340 L 70 250 L 254 250" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="96" y="430" font-size="11" fill="#b85450" filter="url(#rough2)">是：丢弃</text>

  <!-- no -> enumerate -->
  <path d="M 370 490 L 370 516" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="390" y="508" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="150" y="520" width="440" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="370" y="546" text-anchor="middle" font-size="12" fill="#2b4a6a" filter="url(#rough2)">枚举四个方向 d′，计算相邻格 (nr, nc) = (r,c) + d′</text>
  <path d="M 370 562 L 370 588" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond 3: out of bounds -->
  <g filter="url(#rough2)">
    <polygon points="370,592 520,632 370,672 220,632" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="370" y="637" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#rough2)">(nr, nc) 越界？</text>

  <!-- oob yes -> skip, back to enumerate -->
  <path d="M 520 632 L 556 632" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="538" y="622" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="560" y="610" width="150" height="42" rx="8" fill="#f0ede4" stroke="#999999" stroke-width="1.3"/>
  </g>
  <text x="635" y="636" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">跳过该方向</text>
  <path d="M 662 610 C 700 580, 680 548, 594 543" stroke="#999999" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- no -> diamond 4 -->
  <path d="M 370 672 L 370 700" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="390" y="692" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <polygon points="370,704 545,748 370,792 195,748" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="370" y="743" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#rough2)">t′ = t + [d′ ≠ d]</text>
  <text x="370" y="762" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#rough2)">≤ k ？</text>

  <!-- turns exceeded -> discard -->
  <path d="M 545 748 L 560 748" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="552" y="738" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="564" y="726" width="150" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="639" y="745" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">转向超限</text>
  <text x="639" y="762" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">丢弃该转移</text>

  <!-- yes -> relax -->
  <path d="M 370 792 L 370 816" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="390" y="810" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="130" y="820" width="480" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="370" y="841" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e2e" filter="url(#rough2)">松弛：若 cost + grid[nr][nc] &lt; dist[nr][nc][d′][t′]</text>
  <text x="370" y="860" text-anchor="middle" font-size="12" fill="#2e5e2e" filter="url(#rough2)">更新 dist，并把新状态 (nr, nc, d′, t′) 入堆</text>

  <!-- back edge to diamond1 via bus x=30 -->
  <path d="M 130 845 L 30 845 L 30 250 L 254 250" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="36" y="560" font-size="10" fill="#4a7a3a" transform="rotate(-90 36 560)" filter="url(#rough2)">处理完当前状态，回到取堆顶</text>
</svg>
