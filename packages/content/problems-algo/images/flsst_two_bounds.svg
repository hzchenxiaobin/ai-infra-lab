<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">两次二分：分别向左 / 向右收缩</text>

  <!-- ============ Top: find first (left) ============ -->
  <text x="60" y="54" font-size="12.5" fill="#4a7a3a" font-weight="bold">找左端点 first：命中后 → 向左</text>

  <!-- array for find-first -->
  <rect x="60" y="64" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="82" y="83" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="108" y="64" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="83" text-anchor="middle" font-size="11" fill="#333">7</text>
  <rect x="156" y="64" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="83" text-anchor="middle" font-size="11" fill="#333">7</text>
  <rect x="204" y="64" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="226" y="83" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">8</text>
  <rect x="252" y="64" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="274" y="83" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">8</text>
  <rect x="300" y="64" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="322" y="83" text-anchor="middle" font-size="11" fill="#333">10</text>

  <!-- mid at index 4 (value 8), hit, go left -->
  <text x="274" y="112" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">mid=4 命中</text>
  <path d="M 274 116 L 274 98" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <!-- arrow pointing left -->
  <path d="M 248 132 L 210 132" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="229" y="126" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">继续往左</text>

  <text x="60" y="152" font-size="11" fill="#555">记录 ans=mid，再 right = mid − 1</text>
  <text x="60" y="170" font-size="11" fill="#4a7a3a" font-weight="bold">→ 直到区间为空，ans 即第一个 8 的下标</text>

  <!-- ============ Bottom: find last (right) ============ -->
  <text x="60" y="216" font-size="12.5" fill="#b85450" font-weight="bold">找右端点 last：命中后 → 向右</text>

  <!-- array for find-last -->
  <rect x="60" y="226" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="82" y="245" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="108" y="226" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="245" text-anchor="middle" font-size="11" fill="#333">7</text>
  <rect x="156" y="226" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="245" text-anchor="middle" font-size="11" fill="#333">7</text>
  <rect x="204" y="226" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="226" y="245" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">8</text>
  <rect x="252" y="226" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="274" y="245" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">8</text>
  <rect x="300" y="226" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="322" y="245" text-anchor="middle" font-size="11" fill="#333">10</text>

  <!-- mid at index 3 (value 8), hit, go right -->
  <text x="226" y="274" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">mid=3 命中</text>
  <path d="M 226 278 L 226 260" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <path d="M 250 294 L 290 294" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="270" y="288" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">继续往右</text>

  <text x="60" y="314" font-size="11" fill="#555">记录 ans=mid，再 left = mid + 1</text>
  <text x="60" y="332" font-size="11" fill="#b85450" font-weight="bold">→ 直到区间为空，ans 即最后一个 8 的下标</text>

  <!-- ============ Side note: cannot return early ============ -->
  <rect x="370" y="200" width="160" height="160" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="450" y="226" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">⚠️ 常见坑</text>
  <text x="382" y="250" font-size="10.5" fill="#555">命中 target 时若直接</text>
  <text x="382" y="266" font-size="10.5" fill="#555">return mid，得到的只是</text>
  <text x="382" y="282" font-size="10.5" fill="#555">「任意一个」匹配位置，</text>
  <text x="382" y="298" font-size="10.5" fill="#555">而非边界。</text>
  <text x="382" y="322" font-size="10.5" fill="#333" font-weight="bold">必须记录候选 ans</text>
  <text x="382" y="338" font-size="10.5" fill="#333" font-weight="bold">并继续收缩！</text>

  <!-- footer -->
  <rect x="20" y="376" width="500" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="398" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">两次二分均为 O(log n)，合计 O(log n)，空间 O(1)</text>
  <text x="270" y="416" text-anchor="middle" font-size="11" fill="#888">first 找不到则 last 不必再查；可短路返回 [-1,-1]</text>
</svg>
