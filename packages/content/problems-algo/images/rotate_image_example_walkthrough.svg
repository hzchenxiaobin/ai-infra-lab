<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 310" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="310" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：4×4 矩阵两步旋转</text>
  <text x="270" y="42" text-anchor="middle" font-size="11" fill="#888">原矩阵 →（转置）→ 转置矩阵 →（每行翻转）→ 旋转结果</text>

  <!-- ===== M1 original ===== -->
  <text x="94" y="80" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">原矩阵</text>
  <g font-size="12" fill="#333">
    <!-- diagonal blue -->
    <rect x="30" y="90" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="46" y="110" text-anchor="middle">1</text>
    <rect x="62" y="122" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="78" y="142" text-anchor="middle">6</text>
    <rect x="94" y="154" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="110" y="174" text-anchor="middle">11</text>
    <rect x="126" y="186" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="142" y="206" text-anchor="middle">16</text>
    <!-- upper triangle orange -->
    <rect x="62" y="90" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="78" y="110" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
    <rect x="94" y="90" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="110" y="110" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
    <rect x="126" y="90" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="142" y="110" text-anchor="middle" fill="#d6a040" font-weight="bold">4</text>
    <rect x="94" y="122" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="110" y="142" text-anchor="middle" fill="#d6a040" font-weight="bold">7</text>
    <rect x="126" y="122" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="142" y="142" text-anchor="middle" fill="#d6a040" font-weight="bold">8</text>
    <rect x="126" y="154" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="142" y="174" text-anchor="middle" fill="#d6a040" font-weight="bold">12</text>
    <!-- lower triangle green -->
    <rect x="30" y="122" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="46" y="142" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>
    <rect x="30" y="154" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="46" y="174" text-anchor="middle" fill="#4a7a3a" font-weight="bold">9</text>
    <rect x="62" y="154" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="78" y="174" text-anchor="middle" fill="#4a7a3a" font-weight="bold">10</text>
    <rect x="30" y="186" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="46" y="206" text-anchor="middle" fill="#4a7a3a" font-weight="bold">13</text>
    <rect x="62" y="186" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="78" y="206" text-anchor="middle" fill="#4a7a3a" font-weight="bold">14</text>
    <rect x="94" y="186" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="110" y="206" text-anchor="middle" fill="#4a7a3a" font-weight="bold">15</text>
    <!-- main diagonal -->
    <line x1="30" y1="90" x2="158" y2="218" stroke="#446688" stroke-width="1.4" stroke-dasharray="4,3" filter="url(#rough2)"/>
    <!-- swap示意 2↔5 -->
    <path d="M 78 90 C 50 70, 10 120, 30 122" stroke="#b85450" stroke-width="1.1" fill="none" stroke-dasharray="3,2" marker-end="url(#arrr)" filter="url(#rough2)"/>
    <text x="6" y="104" font-size="8" fill="#b85450">2↔5</text>
  </g>

  <!-- arrow1 -->
  <path d="M 164 154 L 196 154" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="140" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">转置</text>
  <text x="180" y="170" text-anchor="middle" font-size="8" fill="#888">6 次互换</text>

  <!-- ===== M2 transposed ===== -->
  <text x="264" y="80" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">转置后</text>
  <g font-size="12" fill="#333">
    <rect x="200" y="90" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="216" y="110" text-anchor="middle">1</text>
    <rect x="232" y="122" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="248" y="142" text-anchor="middle">6</text>
    <rect x="264" y="154" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="280" y="174" text-anchor="middle">11</text>
    <rect x="296" y="186" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="312" y="206" text-anchor="middle">16</text>
    <!-- upper now green -->
    <rect x="232" y="90" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="248" y="110" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>
    <rect x="264" y="90" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="280" y="110" text-anchor="middle" fill="#4a7a3a" font-weight="bold">9</text>
    <rect x="296" y="90" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="312" y="110" text-anchor="middle" fill="#4a7a3a" font-weight="bold">13</text>
    <rect x="264" y="122" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="280" y="142" text-anchor="middle" fill="#4a7a3a" font-weight="bold">10</text>
    <rect x="296" y="122" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="312" y="142" text-anchor="middle" fill="#4a7a3a" font-weight="bold">14</text>
    <rect x="296" y="154" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="312" y="174" text-anchor="middle" fill="#4a7a3a" font-weight="bold">15</text>
    <!-- lower now orange -->
    <rect x="200" y="122" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="216" y="142" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
    <rect x="200" y="154" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="216" y="174" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
    <rect x="232" y="154" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="248" y="174" text-anchor="middle" fill="#d6a040" font-weight="bold">7</text>
    <rect x="200" y="186" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="216" y="206" text-anchor="middle" fill="#d6a040" font-weight="bold">4</text>
    <rect x="232" y="186" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="248" y="206" text-anchor="middle" fill="#d6a040" font-weight="bold">8</text>
    <rect x="264" y="186" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="280" y="206" text-anchor="middle" fill="#d6a040" font-weight="bold">12</text>
    <!-- mirror double arrow on top row -->
    <path d="M 204 84 L 324 84" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
    <path d="M 324 80 L 204 80" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  </g>

  <!-- arrow2 -->
  <path d="M 334 154 L 366 154" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="350" y="140" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">行翻转</text>
  <text x="350" y="170" text-anchor="middle" font-size="8" fill="#888">每行逆序</text>

  <!-- ===== M3 final ===== -->
  <text x="434" y="80" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">旋转 90°</text>
  <g font-size="12" fill="#333">
    <!-- top row red: reversed first column 13,9,5,1 -->
    <rect x="370" y="90" width="32" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/><text x="386" y="110" text-anchor="middle" font-weight="bold" fill="#b85450">13</text>
    <rect x="402" y="90" width="32" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/><text x="418" y="110" text-anchor="middle" font-weight="bold" fill="#b85450">9</text>
    <rect x="434" y="90" width="32" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/><text x="450" y="110" text-anchor="middle" font-weight="bold" fill="#b85450">5</text>
    <rect x="466" y="90" width="32" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/><text x="482" y="110" text-anchor="middle" font-weight="bold" fill="#b85450">1</text>
    <rect x="370" y="122" width="32" height="32" fill="#f4f4f4" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/><text x="386" y="142" text-anchor="middle">14</text>
    <rect x="402" y="122" width="32" height="32" fill="#f4f4f4" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/><text x="418" y="142" text-anchor="middle">10</text>
    <rect x="434" y="122" width="32" height="32" fill="#f4f4f4" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/><text x="450" y="142" text-anchor="middle">6</text>
    <rect x="466" y="122" width="32" height="32" fill="#f4f4f4" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/><text x="482" y="142" text-anchor="middle">2</text>
    <rect x="370" y="154" width="32" height="32" fill="#f4f4f4" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/><text x="386" y="174" text-anchor="middle">15</text>
    <rect x="402" y="154" width="32" height="32" fill="#f4f4f4" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/><text x="418" y="174" text-anchor="middle">11</text>
    <rect x="434" y="154" width="32" height="32" fill="#f4f4f4" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/><text x="450" y="174" text-anchor="middle">7</text>
    <rect x="466" y="154" width="32" height="32" fill="#f4f4f4" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/><text x="482" y="174" text-anchor="middle">3</text>
    <rect x="370" y="186" width="32" height="32" fill="#f4f4f4" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/><text x="386" y="206" text-anchor="middle">16</text>
    <rect x="402" y="186" width="32" height="32" fill="#f4f4f4" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/><text x="418" y="206" text-anchor="middle">12</text>
    <rect x="434" y="186" width="32" height="32" fill="#f4f4f4" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/><text x="450" y="206" text-anchor="middle">8</text>
    <rect x="466" y="186" width="32" height="32" fill="#f4f4f4" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/><text x="482" y="206" text-anchor="middle">4</text>
  </g>

  <!-- bottom insight -->
  <line x1="20" y1="232" x2="520" y2="232" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <rect x="40" y="246" width="460" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="270" y="266" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">观察：原第 1 列 [13,9,5,1] 倒序后 = 结果第 1 行 [13,9,5,1]</text>
  <text x="270" y="284" text-anchor="middle" font-size="10" fill="#555">转置把列变行，行翻转正好把「倒序」补上 → 两步合成顺时针 90°</text>
</svg>
