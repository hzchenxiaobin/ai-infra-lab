<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="14"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="360" fill="#fafafa"/>

  <text x="290" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">把任务序列看成一条“累计工作量”时间轴</text>

  <!-- task bars -->
  <text x="30" y="78" font-size="12" fill="#666" filter="url(#rough2)">任务</text>
  <g filter="url(#rough2)" font-size="12">
    <rect x="70" y="62" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="100" y="82" text-anchor="middle" fill="#446688">t₀</text>
    <rect x="130" y="62" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="160" y="82" text-anchor="middle" fill="#446688">t₁</text>
    <rect x="190" y="62" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="220" y="82" text-anchor="middle" fill="#446688">t₂</text>
    <rect x="250" y="62" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="280" y="82" text-anchor="middle" fill="#446688">…</text>
    <rect x="310" y="62" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="340" y="82" text-anchor="middle" fill="#446688">tₘ₋₁</text>
  </g>

  <!-- prefix axis -->
  <line x1="70" y1="140" x2="370" y2="140" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#446688">
    <circle cx="70" cy="140" r="3" fill="#446688"/>
    <text x="70" y="158" text-anchor="middle">0</text>
    <circle cx="130" cy="140" r="3" fill="#446688"/>
    <text x="130" y="158" text-anchor="middle">s₁</text>
    <circle cx="190" cy="140" r="3" fill="#446688"/>
    <text x="190" y="158" text-anchor="middle">s₂</text>
    <circle cx="250" cy="140" r="3" fill="#446688"/>
    <text x="250" y="158" text-anchor="middle">…</text>
    <circle cx="370" cy="140" r="3" fill="#b85450"/>
    <text x="370" y="158" text-anchor="middle" fill="#b85450">total</text>
  </g>
  <text x="430" y="146" font-size="11" fill="#888" filter="url(#rough2)">前缀和 P[k]=Σ₀..k₋₁ tᵢ</text>

  <!-- done marker -->
  <text x="30" y="200" font-size="12" fill="#d6a040" filter="url(#rough2)">done</text>
  <path d="M230 140 L230 200" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="4,3" fill="none" filter="url(#rough2)"/>
  <polygon points="230,140 224,150 236,150" fill="#d6a040" filter="url(#rough2)"/>
  <text x="238" y="195" font-size="11" fill="#d6a040" filter="url(#rough2)">当前进度</text>

  <!-- shift t adds -->
  <rect x="230" y="215" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="233" text-anchor="middle" font-size="12" fill="#d6a040">+ 班次时长 t</text>
  <path d="M270 215 L270 175" stroke="#d6a040" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="3,2"/>

  <!-- decision -->
  <rect x="40" y="260" width="500" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="60" y="285" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">判定</text>
  <text x="60" y="305" font-size="12" fill="#333" filter="url(#rough2)">• done + t ≥ total → 全部完成，ans=0，done 归 0（剩余时间丢弃）</text>
  <text x="60" y="323" font-size="12" fill="#333" filter="url(#rough2)">• 否则 done += t；current = upper_bound(P, done)−1；ans = m − current</text>
</svg>
