<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：每个节点返回 (偷, 不偷) 二元组，父子状态制约</text>
  <text x="310" y="44" text-anchor="middle" font-size="11" fill="#888">偷父节点 → 子节点必不偷；不偷父节点 → 子节点随意</text>

  <!-- ===== left: tree of houses ===== -->
  <text x="130" y="74" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">房屋排成二叉树</text>

  <!-- root 3 -->
  <ellipse cx="130" cy="100" rx="22" ry="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="130" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040">3</text>

  <!-- edges to level1 -->
  <path d="M 118 112 Q 95 128 78 146" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 142 112 Q 165 128 182 146" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- left child 2 -->
  <ellipse cx="74" cy="156" rx="20" ry="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="74" y="161" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">2</text>
  <!-- right child 3 -->
  <ellipse cx="186" cy="156" rx="20" ry="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="186" y="161" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">3</text>

  <!-- edges to level2 (2 has right child 3; 3 has right child 1) -->
  <path d="M 86 166 Q 100 182 112 198" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 198 166 Q 212 182 224 198" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <ellipse cx="116" cy="208" rx="20" ry="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="116" y="213" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">3</text>
  <ellipse cx="228" cy="208" rx="20" ry="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="228" y="213" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">1</text>

  <text x="130" y="244" text-anchor="middle" font-size="10" fill="#888">相邻 = 父子相连，父子不能同偷</text>
  <text x="130" y="258" text-anchor="middle" font-size="10" fill="#888">（兄弟之间无约束）</text>

  <!-- ===== right: state combination ===== -->
  <text x="430" y="74" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">节点返回 (rob, not_rob)</text>

  <!-- node box -->
  <rect x="350" y="92" width="160" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="430" y="110" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">节点 node</text>
  <text x="430" y="128" text-anchor="middle" font-family="monospace" font-size="11" fill="#555">返回 (rob, not_rob)</text>
  <text x="430" y="142" text-anchor="middle" font-size="9" fill="#888">两值，不存单一最优</text>

  <!-- arrow down -->
  <path d="M 430 150 L 430 162" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- rob case -->
  <rect x="330" y="168" width="200" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="430" y="186" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">偷 node</text>
  <text x="340" y="204" font-family="monospace" font-size="10" fill="#555">rob = node.val</text>
  <text x="340" y="218" font-family="monospace" font-size="10" fill="#555">     + L.not_rob + R.not_rob</text>
  <text x="450" y="204" font-size="9" fill="#888">子必不偷</text>

  <!-- not_rob case -->
  <rect x="330" y="234" width="200" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="430" y="252" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">不偷 node</text>
  <text x="340" y="270" font-family="monospace" font-size="10" fill="#555">not_rob = max(L) + max(R)</text>
  <text x="340" y="284" font-size="9" fill="#888">子各自取较优，互不干涉</text>

  <!-- ===== bottom key insight ===== -->
  <rect x="30" y="300" width="560" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="310" y="322" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">为什么返回二元组而不是一个值？</text>
  <text x="46" y="342" font-size="11" fill="#555">① 父节点「偷」时需要子节点的 <tspan font-family="monospace" fill="#b85450">not_rob</tspan>；「不偷」时需要子节点的 <tspan font-family="monospace" fill="#4a7a3a">max(rob, not_rob)</tspan>。</text>
  <text x="46" y="360" font-size="11" fill="#555">② 若子节点只返回一个最优值，父节点无法区分该值是否包含子节点本身——后效性无法消除。</text>
  <text x="46" y="378" font-size="11" fill="#555">③ 返回 (偷, 不偷) 两态，把「子节点是否被偷」编码进返回值，父节点按需取用，无后效性。</text>
</svg>
