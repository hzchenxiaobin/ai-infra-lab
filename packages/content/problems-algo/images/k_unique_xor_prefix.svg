<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="900" height="360" fill="#fdfcf7"/>
  <text x="450" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">随机哈希 + 前缀异或：判定"全部偶数次"</text>
  <path d="M 310 40 Q 450 48 590 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- hash assignment -->
  <g filter="url(#sk)">
    <rect x="60" y="64" width="280" height="76" rx="8" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="80" y="88" font-size="12" font-weight="bold" fill="#7a5415">① 给每个值分配随机 64 位哈希</text>
  <text x="80" y="110" font-size="11" fill="#444" font-family="monospace">h(1) = A, h(2) = B, h(3) = C ...</text>
  <text x="80" y="128" font-size="10" fill="#888">A/B/C 为独立均匀随机 64 位整数</text>

  <!-- prefix xor table -->
  <text x="380" y="88" font-size="12" font-weight="bold" fill="#2b6e9e">② 前缀异或 pref[i]</text>
  <g font-size="11" font-family="monospace">
    <text x="380" y="110" fill="#888">pref[0]=0</text>
    <text x="380" y="128" fill="#444">pref[i]=pref[i−1] ^ h(nums[i−1])</text>
  </g>

  <!-- key property -->
  <g filter="url(#sk)">
    <rect x="60" y="158" width="780" height="74" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="80" y="182" font-size="13" font-weight="bold" fill="#2e6e2e">关键性质：值 v 出现偶数次 → h(v) 被异或偶数次 → 抵消为 0；奇数次 → 留下 h(v)</text>
  <text x="80" y="204" font-size="12" fill="#444" font-family="monospace">XOR(l,r) = pref[r+1] ^ pref[l] = 所有"奇数次出现"值的哈希异或</text>
  <text x="80" y="222" font-size="12" fill="#b03a3a" font-weight="bold">XOR(l,r) == 0  ⟺  所有值均出现偶数次（whp，碰撞概率 2^-64）</text>

  <!-- example nums row -->
  <text x="60" y="256" font-size="12" fill="#888" font-weight="bold">nums =</text>
  <g font-size="13" font-family="monospace" font-weight="bold">
    <g filter="url(#sk)"><rect x="120" y="240" width="48" height="32" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4"/></g>
    <text x="144" y="262" text-anchor="middle" fill="#2b4a6e">1</text>
    <g filter="url(#sk)"><rect x="170" y="240" width="48" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
    <text x="194" y="262" text-anchor="middle" fill="#2e6e2e">2</text>
    <g filter="url(#sk)"><rect x="220" y="240" width="48" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
    <text x="244" y="262" text-anchor="middle" fill="#2e6e2e">2</text>
    <g filter="url(#sk)"><rect x="270" y="240" width="48" height="32" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4"/></g>
    <text x="294" y="262" text-anchor="middle" fill="#2b4a6e">1</text>
  </g>
  <text x="332" y="262" font-size="11" fill="#888">（1,2,2,1）</text>

  <!-- pref row -->
  <text x="60" y="298" font-size="12" fill="#888" font-weight="bold">pref =</text>
  <g font-size="12" font-family="monospace">
    <text x="130" y="298" fill="#888">0</text>
    <text x="180" y="298" fill="#444">A</text>
    <text x="230" y="298" fill="#444">A^B</text>
    <text x="280" y="298" fill="#444">A</text>
    <text x="324" y="298" fill="#b85450" font-weight="bold">0</text>
  </g>

  <!-- query illustration -->
  <g filter="url(#sk)">
    <rect x="430" y="240" width="410" height="92" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="450" y="264" font-size="12" font-weight="bold" fill="#7a2828">查询 [0,3]：全偶数次？</text>
  <text x="450" y="286" font-size="11" fill="#444" font-family="monospace">XOR = pref[4] ^ pref[0] = 0 ^ 0 = 0</text>
  <text x="450" y="306" font-size="11" fill="#2e6e2e" font-weight="bold">→ 1 出现 2 次，2 出现 2 次，全偶 ✓</text>
  <text x="450" y="324" font-size="10" fill="#888">还需 distinct(0,3)==k 才完全合法</text>
</svg>
