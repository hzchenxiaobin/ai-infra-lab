<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="640" height="440" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">贪心反例：取最长连胜段不一定最优（n = 12）</text>

  <!-- ============ 方案A ============ -->
  <text x="52" y="66" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">方案A：最长段优先 [4,1,1]</text>
  <g filter="url(#rough2)">
    <rect x="52" y="76" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="96" y="76" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="140" y="76" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="184" y="76" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="228" y="76" width="40" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="272" y="76" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="316" y="76" width="40" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="360" y="76" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="72" y="97" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">+1</text>
  <text x="116" y="97" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">+2</text>
  <text x="160" y="97" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">+3</text>
  <text x="204" y="97" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">+4</text>
  <text x="248" y="97" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">跳</text>
  <text x="292" y="97" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">+1</text>
  <text x="336" y="97" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">跳</text>
  <text x="380" y="97" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">+1</text>
  <rect x="428" y="76" width="176" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="516" y="97" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">10+1+1=12分，8天 ✗</text>

  <!-- ============ 方案B ============ -->
  <text x="52" y="148" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">方案B：两条中等连胜 [3,3]</text>
  <g filter="url(#rough2)">
    <rect x="52" y="158" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="96" y="158" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="140" y="158" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="184" y="158" width="40" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="228" y="158" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="272" y="158" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="316" y="158" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="72" y="179" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">+1</text>
  <text x="116" y="179" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">+2</text>
  <text x="160" y="179" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">+3</text>
  <text x="204" y="179" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">跳</text>
  <text x="248" y="179" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">+1</text>
  <text x="292" y="179" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">+2</text>
  <text x="336" y="179" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">+3</text>
  <rect x="384" y="158" width="220" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="494" y="179" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">6+6=12分，7天 ✓ 更快</text>

  <!-- ============ 为什么 ============ -->
  <rect x="40" y="216" width="565" height="104" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="322" y="242" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6420" filter="url(#rough2)">为什么长段会吃亏？</text>
  <text x="322" y="264" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">长段每天得分多（第 i 天得 i 分），但「恰好 n 分」逼你用小段补零头：</text>
  <text x="322" y="284" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">主段 4 剩 r=2，只能拆成 [1,1]，两枚小硬币各带 1 个垫背跳过日；</text>
  <text x="322" y="304" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">把主段砍成 3，余下 6 恰好又是一枚「3 号硬币」——省下整整 1 天</text>

  <!-- ============ 更多反例 ============ -->
  <rect x="40" y="340" width="565" height="66" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="322" y="364" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">n=64：[8,7]=16天 &lt; 主段10的 17天；n=90：[9,9]=19天 &lt; 主段12的 20天</text>
  <text x="322" y="388" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">反贪心花样太多 —— 老老实实动态规划</text>

  <text x="320" y="428" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">注：[3,3] 说明同一「段长」可以重复使用 → 完全背包而非 01 背包</text>
</svg>
