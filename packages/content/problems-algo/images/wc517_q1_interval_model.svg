<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">特殊整数：出现位置必须铺满一个连续区间</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">nums = [3, 3, 1, 2, 2, 1]</text>

  <!-- array boxes -->
  <rect x="60" y="64" width="66" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="93" y="90" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">3</text>
  <rect x="136" y="64" width="66" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="169" y="90" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">3</text>
  <rect x="212" y="64" width="66" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="245" y="90" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>
  <rect x="288" y="64" width="66" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="321" y="90" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">2</text>
  <rect x="364" y="64" width="66" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="397" y="90" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">2</text>
  <rect x="440" y="64" width="66" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="473" y="90" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>

  <text x="93" y="120" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="169" y="120" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="245" y="120" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="321" y="120" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="397" y="120" text-anchor="middle" font-size="10" fill="#888">4</text>
  <text x="473" y="120" text-anchor="middle" font-size="10" fill="#888">5</text>

  <!-- interval bars -->
  <text x="60" y="152" font-size="11" fill="#4a7a3a" font-weight="bold">3 的区间 [0, 1]：全是 3 ✓ 特殊</text>
  <rect x="60" y="160" width="142" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="7" filter="url(#rough2)"/>

  <text x="60" y="196" font-size="11" fill="#b85450" font-weight="bold">1 的区间 [2, 5]：中间混入了 2 ✗ 断裂</text>
  <rect x="212" y="204" width="294" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="7" filter="url(#rough2)"/>
  <path d="M 288 212 L 288 226 M 372 212 L 372 226" stroke="#b85450" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="330" y="238" text-anchor="middle" font-size="10" fill="#b85450">空洞里是 2，不是 1</text>

  <text x="60" y="270" font-size="11" fill="#4a7a3a" font-weight="bold">2 的区间 [3, 4]：全是 2 ✓ 特殊</text>
  <rect x="288" y="278" width="142" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="7" filter="url(#rough2)"/>

  <!-- summary -->
  <rect x="40" y="310" width="480" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="60" y="334" font-size="11.5" fill="#333" font-weight="bold">判定只需「上次出现下标」：i = 5 处 1 再度出现，last[1] = 2 ≠ 4 = i−1，</text>
  <text x="60" y="352" font-size="11.5" fill="#333">两次出现之间必然隔着非 1 的元素 → 区间断裂，1 永久不特殊。</text>
  <text x="60" y="372" font-size="11.5" fill="#4a7a3a" font-weight="bold">答案 = 不同值 3 个（{3,1,2}）− dead 1 个（{1}）= 2</text>
</svg>
