<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：dist=[1,3,2], speed=4, hoursBefore=2</text>

  <text x="40" y="48" font-size="10" fill="#888" filter="url(#rough2)">H = round(2×100) = 200, 阈值 = H×speed = 200×4 = 800</text>

  <!-- ===== DP Table ===== -->
  <!-- Column headers: j = 0, 1, 2 -->
  <text x="180" y="74" text-anchor="middle" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">j=0</text>
  <text x="290" y="74" text-anchor="middle" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">j=1</text>
  <text x="400" y="74" text-anchor="middle" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">j=2</text>

  <!-- Row 0: ride 0 (dist=1) -->
  <text x="100" y="104" text-anchor="end" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">ride 0 (d=1)</text>

  <rect x="140" y="84" width="80" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="107" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="250" y="84" width="80" height="36" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="290" y="107" text-anchor="middle" font-size="11" fill="#ccc" filter="url(#rough2)">—</text>

  <rect x="360" y="84" width="80" height="36" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="400" y="107" text-anchor="middle" font-size="11" fill="#ccc" filter="url(#rough2)">—</text>

  <!-- Row 1: ride 1 (dist=3) -->
  <text x="100" y="154" text-anchor="end" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">ride 1 (d=3)</text>

  <rect x="140" y="134" width="80" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="157" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="180" y="128" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">⌈1/4⌉×4+3</text>

  <rect x="250" y="134" width="80" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="157" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="290" y="128" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">1+3</text>

  <rect x="360" y="134" width="80" height="36" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="400" y="157" text-anchor="middle" font-size="11" fill="#ccc" filter="url(#rough2)">—</text>

  <!-- Row 2: ride 2 (dist=2, last) -->
  <text x="100" y="204" text-anchor="end" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">ride 2 (d=2)</text>

  <rect x="140" y="184" width="80" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="207" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">10</text>
  <text x="180" y="178" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">⌈7/4⌉×4+2</text>

  <!-- Answer cell: dp[2][1] = 6 -->
  <rect x="250" y="184" width="80" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="207" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="290" y="178" text-anchor="middle" font-size="8" fill="#4a7a3a" filter="url(#rough2)">min(⌈4/4⌉×4+2, 7+2)</text>

  <rect x="360" y="184" width="80" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="400" y="207" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="400" y="178" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">4+2</text>

  <!-- ===== Check section ===== -->
  <text x="40" y="244" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">检查 dp[2][j] × 100 ≤ 800：</text>

  <!-- j=0 check -->
  <rect x="50" y="256" width="140" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="120" y="275" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">j=0: 10×100=1000 ✗</text>

  <!-- j=1 check -->
  <rect x="210" y="256" width="140" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="275" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">j=1: 6×100=600 ✓</text>

  <!-- j=2 check -->
  <rect x="370" y="256" width="140" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="440" y="275" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">j=2: 6×100=600 ✓</text>

  <!-- Arrow to answer -->
  <path d="M 280 284 L 280 300" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Answer -->
  <rect x="170" y="304" width="220" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="325" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = 1（最小跳过数）</text>

  <!-- ===== Trace explanation ===== -->
  <rect x="40" y="350" width="480" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="368" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">j=1 的路径：ride 0 → 跳过 rest 0 → ride 1 → 不跳 rest 1 → ride 2</text>
  <text x="280" y="383" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">距离 = 1 →(skip)→ 1+3=4 →(⌈4/4⌉×4=4)→ 4+2=6, 时间 = 6/4 = 1.5h ≤ 2h ✓</text>
</svg>
