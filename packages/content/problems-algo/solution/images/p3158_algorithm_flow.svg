<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：单趟扫描，置位或异或二分叉</text>

  <rect x="195" y="38" width="130" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="58" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">seen = 0，ans = 0</text>

  <path d="M 260 68 L 260 84" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="195" y="88" width="130" height="30" fill="#f1f1f1" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="260" y="108" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">取下一个数 x</text>

  <path d="M 260 118 L 260 132" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,136 352,172 260,208 168,172" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="166" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">seen 的第 x 位</text>
  <text x="260" y="184" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">是 1 吗？</text>

  <path d="M 352 172 L 388 172" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="368" y="162" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <path d="M 168 172 L 132 172" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="152" y="162" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="392" y="156" width="112" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="448" y="176" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">seen |= 1 &lt;&lt; x</text>

  <rect x="18" y="156" width="114" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="75" y="176" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">ans ^= x</text>

  <path d="M 448 188 C 448 220 390 226 340 230" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 345 230 L 322 232" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 75 188 C 75 224 160 232 200 234" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 198 234 L 216 235" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,222 322,254 260,286 198,254" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="258" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">还有数吗？</text>

  <text x="337" y="243" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">有</text>
  <path d="M 322 254 C 430 254 474 210 474 103 L 334 103" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 260 286 L 260 304" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="278" y="300" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">没有</text>

  <rect x="192" y="308" width="136" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="328" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <rect x="32" y="352" width="456" height="22" fill="none" stroke="none"/>
  <text x="260" y="368" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每步只做一次移位判定 + 一次置位/异或，全程 O(n)</text>
</svg>
