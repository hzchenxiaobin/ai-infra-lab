<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrF2789" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">贪心算法流程：从右向左一趟扫描</text>

  <!-- Start -->
  <rect x="180" y="40" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="11" fill="#333">开始：s = nums[n−1], i = n−2</text>
  <line x1="260" y1="74" x2="260" y2="92" stroke="#888" stroke-width="1.4" marker-end="url(#arrF2789)" filter="url(#rough2)"/>

  <!-- Decision diamond: i >= 0 ? -->
  <polygon points="260,94 360,138 260,182 160,138" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="134" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">i ≥ 0 ?</text>
  <text x="260" y="150" text-anchor="middle" font-size="10" fill="#888">(还有元素)</text>

  <!-- No -> return s -->
  <line x1="160" y1="138" x2="76" y2="138" stroke="#888" stroke-width="1.4" marker-end="url(#arrF2789)" filter="url(#rough2)"/>
  <text x="118" y="132" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="20" y="120" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="48" y="142" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">返回 s</text>

  <!-- Yes -->
  <line x1="260" y1="182" x2="260" y2="200" stroke="#888" stroke-width="1.4" marker-end="url(#arrF2789)" filter="url(#rough2)"/>
  <text x="272" y="196" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Inner decision: nums[i] <= s ? -->
  <polygon points="260,202 360,246 260,290 160,246" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="250" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">nums[i] ≤ s ?</text>

  <!-- Yes: merge -->
  <line x1="160" y1="246" x2="116" y2="246" stroke="#888" stroke-width="1.4" marker-end="url(#arrF2789)" filter="url(#rough2)"/>
  <text x="140" y="240" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="24" y="228" width="92" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="70" y="250" text-anchor="middle" font-size="10" fill="#333">s ← s + nums[i]</text>

  <!-- No: reset -->
  <line x1="360" y1="246" x2="404" y2="246" stroke="#888" stroke-width="1.4" marker-end="url(#arrF2789)" filter="url(#rough2)"/>
  <text x="382" y="240" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="404" y="228" width="92" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="450" y="250" text-anchor="middle" font-size="10" fill="#333">s ← nums[i]</text>

  <!-- converge to i = i - 1 -->
  <path d="M 70 264 L 70 312 L 450 312 L 450 264" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <line x1="260" y1="312" x2="260" y2="324" stroke="#888" stroke-width="1.4" marker-end="url(#arrF2789)" filter="url(#rough2)"/>
  <rect x="200" y="324" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="344" text-anchor="middle" font-size="11" fill="#333">i ← i − 1</text>

  <!-- loop back to top diamond -->
  <path d="M 260 356 L 260 380 L 478 380 L 478 94 L 362 94" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrF2789)" filter="url(#rough2)"/>
  <text x="430" y="374" text-anchor="middle" font-size="10" fill="#888">回到 i≥0?</text>

  <!-- note -->
  <rect x="40" y="402" width="440" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="60" y="422" font-size="10" fill="#666">每步 s 严格递增（合并加正数 / 重置为更大的 nums[i]）</text>
  <text x="60" y="438" font-size="10" fill="#4a7a3a" font-weight="bold">故循环结束时 s 即最大值，无需额外维护 ans</text>
</svg>
