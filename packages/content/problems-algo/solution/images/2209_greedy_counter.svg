<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">贪心反例：floor = "10111101", carpetLen = 4, numCarpets = 2</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888">白色砖块下标 {0,2,3,4,5,7}；“铺最密集窗口”贪心得 1，最优得 0</text>

  <!-- index axis -->
  <text x="60" y="80" font-size="10" fill="#888" text-anchor="end">下标</text>
  <text x="91" y="80" text-anchor="middle" font-size="9.5" fill="#888">0</text>
  <text x="133" y="80" text-anchor="middle" font-size="9.5" fill="#888">1</text>
  <text x="175" y="80" text-anchor="middle" font-size="9.5" fill="#888">2</text>
  <text x="217" y="80" text-anchor="middle" font-size="9.5" fill="#888">3</text>
  <text x="259" y="80" text-anchor="middle" font-size="9.5" fill="#888">4</text>
  <text x="301" y="80" text-anchor="middle" font-size="9.5" fill="#888">5</text>
  <text x="343" y="80" text-anchor="middle" font-size="9.5" fill="#888">6</text>
  <text x="385" y="80" text-anchor="middle" font-size="9.5" fill="#888">7</text>

  <!-- ===== Row 1: Greedy (red frame) ===== -->
  <rect x="44" y="92" width="400" height="118" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)" opacity="0.35"/>
  <text x="56" y="110" font-size="11.5" fill="#b85450" font-weight="bold">贪心：先铺最密集窗口 [2,5]（4 块白）</text>

  <!-- carpet A (orange) over [2,5] : tiles 2..5 -> x 154..322 -->
  <rect x="152" y="120" width="172" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="238" y="131" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">地毯① [2,5]</text>

  <!-- carpet B (blue) over [0,3] : tiles 0..3 -> x 70..238 -->
  <rect x="70" y="138" width="172" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="156" y="149" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">地毯② [0,3]（与①重叠 2,3）</text>

  <!-- tiles row -->
  <!-- t0 white -->
  <rect x="70" y="158" width="42" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="91" y="178" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <!-- t1 black -->
  <rect x="112" y="158" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="133" y="178" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <!-- t2 white -->
  <rect x="154" y="158" width="42" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="178" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <!-- t3 white -->
  <rect x="196" y="158" width="42" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="217" y="178" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <!-- t4 white -->
  <rect x="238" y="158" width="42" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="259" y="178" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <!-- t5 white -->
  <rect x="280" y="158" width="42" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="301" y="178" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <!-- t6 black -->
  <rect x="322" y="158" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="343" y="178" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <!-- t7 white UNCOVERED -->
  <rect x="364" y="158" width="42" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="385" y="178" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <!-- X mark on tile 7 -->
  <path d="M370,162 L402,186 M402,162 L370,186" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>

  <text x="260" y="204" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">剩余未覆盖白色 = 1（下标 7）</text>

  <!-- ===== Row 2: Optimal (green frame) ===== -->
  <rect x="44" y="226" width="400" height="118" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)" opacity="0.35"/>
  <text x="56" y="244" font-size="11.5" fill="#4a7a3a" font-weight="bold">最优：分铺两端 [0,3] ∪ [4,7]，拼满整段</text>

  <!-- carpet A (blue) over [0,3] : x 70..238 -->
  <rect x="70" y="254" width="172" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="156" y="265" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">地毯① [0,3]</text>

  <!-- carpet B (orange) over [4,7] : x 238..406 -->
  <rect x="238" y="272" width="172" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="324" y="283" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">地毯② [4,7]</text>

  <!-- tiles row -->
  <rect x="70" y="292" width="42" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="91" y="312" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <rect x="112" y="292" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="133" y="312" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <rect x="154" y="292" width="42" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="312" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <rect x="196" y="292" width="42" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="217" y="312" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <rect x="238" y="292" width="42" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="259" y="312" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <rect x="280" y="292" width="42" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="301" y="312" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <rect x="322" y="292" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="343" y="312" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <rect x="364" y="292" width="42" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="385" y="312" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>

  <text x="260" y="338" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">剩余未覆盖白色 = 0（6 块全盖住）</text>

  <!-- legend -->
  <rect x="460" y="92" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="478" y="103" font-size="9" fill="#666">地毯①</text>
  <rect x="460" y="112" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="478" y="123" font-size="9" fill="#666">地毯②</text>
  <rect x="460" y="132" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="478" y="143" font-size="9" fill="#666">白砖</text>
  <rect x="460" y="152" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="478" y="163" font-size="9" fill="#666">黑砖</text>

  <text x="260" y="368" text-anchor="middle" font-size="10" fill="#aaa">贪心把地毯堆在中段，浪费重叠部分；最优分铺两端合围全部白色</text>
</svg>
