<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：固定右端点，向左扩展时 AND 只会把 1 变成 0</text>

  <text x="44" y="65" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">nums =</text>

  <rect x="105" y="46" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="131" y="65" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="167" y="46" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="193" y="65" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="229" y="46" width="52" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="255" y="65" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">3</text>

  <text x="131" y="88" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="193" y="88" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="255" y="88" text-anchor="middle" font-size="9.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">2</text>

  <path d="M 255 94 L 255 110" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="268" y="108" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">固定右端点 i = 2（x = 3）</text>

  <text x="281" y="114" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">bit1</text>
  <text x="307" y="114" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">bit0</text>

  <rect x="60" y="118" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="77" y="134" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="140" y="134" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">AND = 3</text>
  <rect x="270" y="118" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="281" y="133" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="296" y="118" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="307" y="133" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>

  <path d="M 118 145 L 118 159" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="130" y="156" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">向左扩一格：整体 AND 上 2</text>

  <rect x="60" y="162" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="77" y="178" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="98" y="162" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="115" y="178" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="140" y="178" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">AND = 2</text>
  <rect x="270" y="162" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="281" y="177" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="296" y="162" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="307" y="177" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="326" y="177" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">← bit0 被熄灭</text>

  <path d="M 118 189 L 118 203" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="130" y="200" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">向左扩一格：整体 AND 上 1</text>

  <rect x="60" y="206" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="77" y="222" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="98" y="206" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="115" y="222" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="136" y="206" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="153" y="222" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="182" y="222" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">AND = 0</text>
  <rect x="270" y="206" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="281" y="221" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="296" y="206" width="22" height="22" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="307" y="221" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">0</text>
  <text x="326" y="221" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">← bit1 被熄灭</text>

  <rect x="32" y="246" width="456" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="266" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">递推：ands(i) = [ (x, 1) ] 并上 [ (v AND x, c) | (v, c) ∈ ands(i−1) ]，同值条目合并计数</text>
  <text x="260" y="284" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">条目含义：以 i 结尾、AND 值为 v 的左端点恰有 c 个；单元素子数组自带 1 个左端点</text>

  <rect x="32" y="306" width="456" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="328" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">值每变化一次 ⇔ 至少熄灭一个比特；比特一旦熄灭，永不复燃（与 3171 的 OR 恰好镜像）</text>
  <text x="260" y="348" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">值域 &lt; 2^30，全程只有 30 个比特可供熄灭 ⇒ 列表至多 30 项</text>
  <text x="260" y="368" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">于是 Θ(n²) 个子数组被压缩成 O(30n) 个 (值, 个数) 状态——枚举右端点即全覆盖</text>
</svg>
