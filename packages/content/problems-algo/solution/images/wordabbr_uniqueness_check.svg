<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="300" y="34" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">唯一性判定：缩写 → 单词集合，看是否有「其他词」</text>

  <!-- 左列标签 -->
  <text x="40" y="76" font-size="13" fill="#446688" filter="url(#rough2)">dictionary</text>
  <text x="400" y="76" font-size="13" fill="#4a7a3a" filter="url(#rough2)">abbr_map（预处理）</text>

  <!-- 左列字典词 -->
  <rect x="40" y="92" width="110" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="113" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">deer</text>
  <rect x="40" y="132" width="110" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="153" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">door</text>
  <rect x="40" y="172" width="110" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="193" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">cake</text>
  <rect x="40" y="212" width="110" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="233" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">card</text>

  <!-- 右列缩写桶 -->
  <!-- d2r 桶：高亮（含两个不同词） -->
  <rect x="360" y="86" width="200" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="460" y="106" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">"d2r"</text>
  <text x="460" y="128" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">{ deer, door }</text>
  <text x="460" y="144" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">两个不同词 → 易冲突</text>

  <!-- c2e 桶 -->
  <rect x="360" y="166" width="200" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="460" y="186" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">"c2e"</text>
  <text x="460" y="208" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">{ cake }</text>

  <!-- c2d 桶 -->
  <rect x="360" y="234" width="200" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="460" y="254" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">"c2d"</text>
  <text x="460" y="276" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">{ card }</text>

  <!-- 连线：deer / door -> d2r -->
  <path d="M 150 108 Q 255 100 360 110" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 150 148 Q 255 130 360 118" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <!-- cake -> c2e -->
  <path d="M 150 188 Q 255 188 360 190" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <!-- card -> c2d -->
  <path d="M 150 228 Q 255 245 360 258" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- 底部判定规则 -->
  <rect x="40" y="312" width="520" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="336" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">isUnique(word)：算 a = abbr(word)；取 s = mp[a]</text>
  <text x="300" y="358" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">唯一 ⟺ s 中不存在「≠ word 的」其他词</text>
  <text x="300" y="376" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">等价写法：not (s − {word})　·　存集合而非计数，重复同词不破坏唯一</text>
</svg>
