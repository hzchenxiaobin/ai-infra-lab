<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：每行 / 每列都是 1..n 的排列</text>

  <!-- ====== Valid matrix 3x3 ====== -->
  <text x="180" y="58" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓ 有效矩阵 n=3</text>

  <!-- Row highlight band (row 1: 3,1,2) -->
  <rect x="90" y="72" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0" rx="4" filter="url(#rough2)" opacity="0.55"/>

  <!-- Column highlight band (col 1: 2,1,3) -->
  <rect x="150" y="72" width="40" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="0" rx="4" filter="url(#rough2)" opacity="0.45"/>

  <!-- matrix cells -->
  <!-- row0: 1 2 3 -->
  <rect x="90" y="72" width="40" height="40" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="97" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="150" y="72" width="40" height="40" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="97" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <rect x="210" y="72" width="40" height="40" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="97" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">3</text>
  <!-- row1: 3 1 2 (highlighted row) -->
  <rect x="90" y="112" width="40" height="40" fill="#ffffff" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="137" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">3</text>
  <rect x="150" y="112" width="40" height="40" fill="#ffffff" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="137" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="210" y="112" width="40" height="40" fill="#ffffff" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="137" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <!-- row2: 2 3 1 -->
  <rect x="90" y="152" width="40" height="40" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="177" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <rect x="150" y="152" width="40" height="40" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="177" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">3</text>
  <rect x="210" y="152" width="40" height="40" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="177" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>

  <!-- row annotation -->
  <path d="M 270 132 L 300 132" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="306" y="136" font-size="11" fill="#4a7a3a" font-weight="bold">行 = {1,2,3} ✓</text>

  <!-- col annotation -->
  <path d="M 170 208 L 170 232" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="176" y="248" font-size="11" fill="#446688" font-weight="bold">列 = {1,2,3} ✓</text>

  <!-- ====== Invalid matrix 3x3 ====== -->
  <text x="430" y="58" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗ 无效矩阵 n=3</text>

  <!-- failing row band (row0: 1,1,1) -->
  <rect x="340" y="72" width="180" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="0" rx="4" filter="url(#rough2)" opacity="0.55"/>

  <!-- row0: 1 1 1 -->
  <rect x="340" y="72" width="40" height="40" fill="#ffffff" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="360" y="97" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="400" y="72" width="40" height="40" fill="#ffffff" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="420" y="97" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="460" y="72" width="40" height="40" fill="#ffffff" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="480" y="97" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <!-- row1: 1 2 3 -->
  <rect x="340" y="112" width="40" height="40" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="137" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="400" y="112" width="40" height="40" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="420" y="137" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <rect x="460" y="112" width="40" height="40" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="480" y="137" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">3</text>
  <!-- row2: 1 2 3 -->
  <rect x="340" y="152" width="40" height="40" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="177" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="400" y="152" width="40" height="40" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="420" y="177" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <rect x="460" y="152" width="40" height="40" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="480" y="177" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">3</text>

  <!-- failing row annotation -->
  <path d="M 520 92 L 548 92" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="425" y="222" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">行0 = {1}，缺 2、3 ✗</text>

  <!-- Core idea box -->
  <rect x="40" y="276" width="480" height="104" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="302" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">等价判定：有效矩阵 ⇔ 每行 / 每列恰为 {1,2,…,n} 的排列</text>
  <text x="280" y="324" text-anchor="middle" font-size="11" fill="#666">n×n 矩阵有 n 行 + n 列共 2n 条线，每条线都须包含 1..n 全部整数</text>
  <text x="280" y="346" text-anchor="middle" font-size="11" fill="#666">值域恰好 1..n 且长度恰好 n → 「无重复 + 无缺失」即排列</text>
  <text x="280" y="368" text-anchor="middle" font-size="11" fill="#888">用 seen 数组标记每条线的出现情况，一趟扫描即可判定</text>
</svg>
