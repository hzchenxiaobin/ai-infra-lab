<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：三种典型情形</text>

  <!-- =================== Panel A: insert =================== -->
  <rect x="14" y="40" width="186" height="380" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="14" y="40" width="186" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="107" y="59" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">A：插入 s="ab" t="acb"</text>

  <!-- s row -->
  <text x="28" y="96" font-size="10" fill="#446688">s</text>
  <rect x="48" y="82" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="65" y="100" text-anchor="middle" font-size="12" fill="#333">a</text>
  <rect x="84" y="82" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="101" y="100" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">b</text>
  <text x="124" y="100" font-size="11" fill="#aaa">∅</text>

  <!-- t row -->
  <text x="28" y="136" font-size="10" fill="#446688">t</text>
  <rect x="48" y="122" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="65" y="140" text-anchor="middle" font-size="12" fill="#333">a</text>
  <rect x="84" y="122" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="101" y="140" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">c</text>
  <rect x="120" y="122" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="137" y="140" text-anchor="middle" font-size="12" fill="#333">b</text>

  <!-- i marker -->
  <path d="M101 154 L101 168" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="101" y="180" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">i=1 分歧</text>

  <!-- reasoning -->
  <rect x="26" y="194" width="162" height="124" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="107" y="212" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">m=2, n=3 → n−m=1</text>
  <text x="34" y="230" font-size="9.5" fill="#666">i=0: s[0]=a == t[0]=a ✓</text>
  <text x="34" y="246" font-size="9.5" fill="#b85450" font-weight="bold">i=1: s[1]=b ≠ t[1]=c ✗</text>
  <text x="34" y="266" font-size="9.5" fill="#4a7a3a" font-weight="bold">等长？否 → 插入分支</text>
  <text x="34" y="284" font-size="9.5" fill="#666">比 s[1:] 与 t[2:]</text>
  <text x="34" y="300" font-size="9.5" fill="#666">"b" == "b" ✓</text>

  <rect x="40" y="330" width="134" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="107" y="352" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return true</text>
  <text x="107" y="384" text-anchor="middle" font-size="9" fill="#aaa" font-style="italic">在 i 处插入 c 即得 t</text>

  <!-- =================== Panel B: replace =================== -->
  <rect x="208" y="40" width="186" height="380" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="208" y="40" width="186" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="301" y="59" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">B：替换 s="cab" t="cad"</text>

  <text x="222" y="96" font-size="10" fill="#446688">s</text>
  <rect x="242" y="82" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="259" y="100" text-anchor="middle" font-size="12" fill="#333">c</text>
  <rect x="278" y="82" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="295" y="100" text-anchor="middle" font-size="12" fill="#333">a</text>
  <rect x="314" y="82" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="331" y="100" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">b</text>

  <text x="222" y="136" font-size="10" fill="#446688">t</text>
  <rect x="242" y="122" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="259" y="140" text-anchor="middle" font-size="12" fill="#333">c</text>
  <rect x="278" y="122" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="295" y="140" text-anchor="middle" font-size="12" fill="#333">a</text>
  <rect x="314" y="122" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="331" y="140" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">d</text>

  <path d="M331 154 L331 168" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="331" y="180" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">i=2 分歧</text>

  <rect x="220" y="194" width="162" height="124" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="301" y="212" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">m=3, n=3 → 等长</text>
  <text x="228" y="230" font-size="9.5" fill="#666">i=0: c == c ✓</text>
  <text x="228" y="246" font-size="9.5" fill="#666">i=1: a == a ✓</text>
  <text x="228" y="266" font-size="9.5" fill="#b85450" font-weight="bold">i=2: b ≠ d ✗</text>
  <text x="228" y="284" font-size="9.5" fill="#d6a040" font-weight="bold">等长？是 → 替换分支</text>
  <text x="228" y="300" font-size="9.5" fill="#666">s[3:]="" == t[3:]="" ✓</text>

  <rect x="234" y="330" width="134" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="301" y="352" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">return true</text>
  <text x="301" y="384" text-anchor="middle" font-size="9" fill="#aaa" font-style="italic">把 b 换成 d 即得 t</text>

  <!-- =================== Panel C: zero edit =================== -->
  <rect x="402" y="40" width="186" height="380" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="402" y="40" width="186" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="495" y="59" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">C：零编辑 s="abc" t="abc"</text>

  <text x="416" y="96" font-size="10" fill="#446688">s</text>
  <rect x="436" y="82" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="453" y="100" text-anchor="middle" font-size="12" fill="#333">a</text>
  <rect x="472" y="82" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="489" y="100" text-anchor="middle" font-size="12" fill="#333">b</text>
  <rect x="508" y="82" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="525" y="100" text-anchor="middle" font-size="12" fill="#333">c</text>

  <text x="416" y="136" font-size="10" fill="#446688">t</text>
  <rect x="436" y="122" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="453" y="140" text-anchor="middle" font-size="12" fill="#333">a</text>
  <rect x="472" y="122" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="489" y="140" text-anchor="middle" font-size="12" fill="#333">b</text>
  <rect x="508" y="122" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="525" y="140" text-anchor="middle" font-size="12" fill="#333">c</text>

  <text x="495" y="172" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">全程无分歧</text>

  <rect x="414" y="194" width="162" height="124" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="495" y="212" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">m=3, n=3 → 等长</text>
  <text x="422" y="230" font-size="9.5" fill="#666">i=0: a == a ✓</text>
  <text x="422" y="246" font-size="9.5" fill="#666">i=1: b == b ✓</text>
  <text x="422" y="266" font-size="9.5" fill="#666">i=2: c == c ✓</text>
  <text x="422" y="286" font-size="9.5" fill="#4a7a3a" font-weight="bold">循环走完，没找到分歧</text>
  <text x="422" y="302" font-size="9.5" fill="#b85450" font-weight="bold">走收尾分支</text>

  <rect x="428" y="330" width="134" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="495" y="348" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">m+1==n ?</text>
  <text x="495" y="360" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3+1==3 → false</text>
  <text x="495" y="384" text-anchor="middle" font-size="9" fill="#aaa" font-style="italic">距离为 0，不是 1</text>

  <!-- bottom summary -->
  <rect x="14" y="432" width="572" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="452" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">三例覆盖：长度差 1 走插入分支、等长走替换分支、无分歧走收尾判定 m+1==n</text>
</svg>
