<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">树状数组：统计 head→目标 间的存活元素</text>

  <!-- ===== Case A: prev < cur ===== -->
  <text x="30" y="54" font-size="12" fill="#4a7a3a" font-weight="bold">情况 A：prev &lt; cur（不绕回）</text>
  <text x="30" y="70" font-size="9" fill="#888">区间 [prev, cur) = [2, 5)，统计其中存活数</text>

  <!-- cells pos 0..6, prev=2, cur=5 -->
  <!-- pos 0 -->
  <rect x="30" y="86" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="52" y="107" text-anchor="middle" font-size="11" fill="#333">0</text>
  <!-- pos 1 -->
  <rect x="80" y="86" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="102" y="107" text-anchor="middle" font-size="11" fill="#333">1</text>
  <!-- pos 2 = prev (deleted) -->
  <rect x="130" y="86" width="44" height="32" fill="#eeeeee" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="107" text-anchor="middle" font-size="11" fill="#999">2</text>
  <text x="152" y="80" text-anchor="middle" font-size="9" fill="#999">prev✕</text>
  <!-- pos 3 alive counted -->
  <rect x="180" y="86" width="44" height="32" fill="#d0e3fa" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="202" y="107" text-anchor="middle" font-size="11" fill="#333">3</text>
  <!-- pos 4 alive counted -->
  <rect x="230" y="86" width="44" height="32" fill="#d0e3fa" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="252" y="107" text-anchor="middle" font-size="11" fill="#333">4</text>
  <!-- pos 5 = cur target -->
  <rect x="280" y="86" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="302" y="107" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="302" y="80" text-anchor="middle" font-size="9" fill="#b85450">cur 目标</text>
  <!-- pos 6 -->
  <rect x="330" y="86" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="352" y="107" text-anchor="middle" font-size="11" fill="#333">6</text>

  <!-- bracket below counted [3,4] (alive between prev and cur, exclusive) -->
  <path d="M 180 128 Q 180 140 220 140 Q 260 140 260 128" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="156" text-anchor="middle" font-size="9" fill="#446688">存活 2 个 → 旋转 2 次</text>

  <!-- formula A -->
  <rect x="400" y="86" width="150" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="475" y="104" text-anchor="middle" font-size="10" fill="#555">moves =</text>
  <text x="475" y="118" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">S(cur-1) − S(prev-1)</text>

  <!-- ===== Case B: prev > cur (wrap) ===== -->
  <text x="30" y="200" font-size="12" fill="#b85450" font-weight="bold">情况 B：prev &gt; cur（绕回，环形）</text>
  <text x="30" y="216" font-size="9" fill="#888">区间 [prev, cur) = [5, 2)，跨过末尾绕回首部</text>

  <!-- cells pos 0..6, prev=5, cur=2 -->
  <!-- pos 0 alive counted -->
  <rect x="30" y="232" width="44" height="32" fill="#d0e3fa" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="52" y="253" text-anchor="middle" font-size="11" fill="#333">0</text>
  <!-- pos 1 alive counted -->
  <rect x="80" y="232" width="44" height="32" fill="#d0e3fa" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="102" y="253" text-anchor="middle" font-size="11" fill="#333">1</text>
  <!-- pos 2 = cur target -->
  <rect x="130" y="232" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="253" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="152" y="226" text-anchor="middle" font-size="9" fill="#b85450">cur</text>
  <!-- pos 3 alive not counted -->
  <rect x="180" y="232" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="253" text-anchor="middle" font-size="11" fill="#333">3</text>
  <!-- pos 4 alive not counted -->
  <rect x="230" y="232" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="252" y="253" text-anchor="middle" font-size="11" fill="#333">4</text>
  <!-- pos 5 = prev deleted -->
  <rect x="280" y="232" width="44" height="32" fill="#eeeeee" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="302" y="253" text-anchor="middle" font-size="11" fill="#999">5</text>
  <text x="302" y="226" text-anchor="middle" font-size="9" fill="#999">prev✕</text>
  <!-- pos 6 alive counted -->
  <rect x="330" y="232" width="44" height="32" fill="#d0e3fa" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="352" y="253" text-anchor="middle" font-size="11" fill="#333">6</text>

  <!-- wrap arrow from pos6 back to pos0 -->
  <path d="M 374 248 Q 400 248 400 276 Q 400 300 52 300 Q 30 300 30 276" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="210" y="318" text-anchor="middle" font-size="9" fill="#b85450">绕回：[5,6] 段 + [0,1] 段</text>

  <!-- formula B -->
  <rect x="400" y="232" width="150" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="475" y="250" text-anchor="middle" font-size="10" fill="#555">moves =</text>
  <text x="475" y="266" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">(S(n−1)−S(prev−1))</text>
  <text x="475" y="278" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">+ S(cur−1)</text>

  <!-- legend -->
  <rect x="30" y="350" width="500" height="40" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <rect x="44" y="362" width="14" height="14" fill="#eeeeee" stroke="#999" filter="url(#rough2)"/>
  <text x="64" y="374" font-size="9" fill="#555">prev 已删(不计)</text>
  <rect x="170" y="362" width="14" height="14" fill="#d0e3fa" stroke="#446688" filter="url(#rough2)"/>
  <text x="190" y="374" font-size="9" fill="#555">存活且被跳过(计)</text>
  <rect x="300" y="362" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="374" font-size="9" fill="#555">cur 目标(不计)</text>
  <rect x="410" y="362" width="14" height="14" fill="#e8f0fe" stroke="#446688" filter="url(#rough2)"/>
  <text x="430" y="374" font-size="9" fill="#555">存活不在区间</text>
</svg>
