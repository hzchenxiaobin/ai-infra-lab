<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="840" height="360" fill="#fafafa"/>

  <text x="420" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">示例演算：isWater = [[0,0,1],[1,0,0],[0,0,0]]</text>
  <text x="420" y="50" text-anchor="middle" font-size="11" fill="#888">多源 BFS 逐层扩展，每层高度 +1，最终输出 [[1,1,0],[0,1,1],[1,2,2]]</text>

  <!-- ===== Layer 0 ===== -->
  <text x="100" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">Layer 0（初始）</text>
  <g font-size="13">
    <g filter="url(#rough2)">
      <!-- Row 0: - - 0 -->
      <rect x="40" y="90" width="36" height="36" fill="#fff" stroke="#ccc" rx="3"/><text x="58" y="113" text-anchor="middle" fill="#ccc">-</text>
      <rect x="76" y="90" width="36" height="36" fill="#fff" stroke="#ccc" rx="3"/><text x="94" y="113" text-anchor="middle" fill="#ccc">-</text>
      <rect x="112" y="90" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3"/><text x="130" y="113" text-anchor="middle" fill="#446688" font-weight="bold">0</text>
      <!-- Row 1: 0 - - -->
      <rect x="40" y="126" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3"/><text x="58" y="149" text-anchor="middle" fill="#446688" font-weight="bold">0</text>
      <rect x="76" y="126" width="36" height="36" fill="#fff" stroke="#ccc" rx="3"/><text x="94" y="149" text-anchor="middle" fill="#ccc">-</text>
      <rect x="112" y="126" width="36" height="36" fill="#fff" stroke="#ccc" rx="3"/><text x="130" y="149" text-anchor="middle" fill="#ccc">-</text>
      <!-- Row 2: - - - -->
      <rect x="40" y="162" width="36" height="36" fill="#fff" stroke="#ccc" rx="3"/><text x="58" y="185" text-anchor="middle" fill="#ccc">-</text>
      <rect x="76" y="162" width="36" height="36" fill="#fff" stroke="#ccc" rx="3"/><text x="94" y="185" text-anchor="middle" fill="#ccc">-</text>
      <rect x="112" y="162" width="36" height="36" fill="#fff" stroke="#ccc" rx="3"/><text x="130" y="185" text-anchor="middle" fill="#ccc">-</text>
    </g>
  </g>
  <text x="94" y="220" text-anchor="middle" font-size="10" fill="#446688">水域入队</text>
  <text x="94" y="236" text-anchor="middle" font-size="9" fill="#888" font-family="monospace">q: [(0,2),(1,0)]</text>

  <!-- Arrow -->
  <path d="M 160 150 L 210 150" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Layer 1 ===== -->
  <text x="290" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">Layer 1</text>
  <g font-size="13">
    <g filter="url(#rough2)">
      <!-- Row 0: 1 1 0 -->
      <rect x="230" y="90" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" rx="3"/><text x="248" y="113" text-anchor="middle" fill="#4a7a3a">1</text>
      <rect x="266" y="90" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" rx="3"/><text x="284" y="113" text-anchor="middle" fill="#4a7a3a">1</text>
      <rect x="302" y="90" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3"/><text x="320" y="113" text-anchor="middle" fill="#446688" font-weight="bold">0</text>
      <!-- Row 1: 0 1 1 -->
      <rect x="230" y="126" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3"/><text x="248" y="149" text-anchor="middle" fill="#446688" font-weight="bold">0</text>
      <rect x="266" y="126" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" rx="3"/><text x="284" y="149" text-anchor="middle" fill="#4a7a3a">1</text>
      <rect x="302" y="126" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" rx="3"/><text x="320" y="149" text-anchor="middle" fill="#4a7a3a">1</text>
      <!-- Row 2: 1 - - -->
      <rect x="230" y="162" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" rx="3"/><text x="248" y="185" text-anchor="middle" fill="#4a7a3a">1</text>
      <rect x="266" y="162" width="36" height="36" fill="#fff" stroke="#ccc" rx="3"/><text x="284" y="185" text-anchor="middle" fill="#ccc">-</text>
      <rect x="302" y="162" width="36" height="36" fill="#fff" stroke="#ccc" rx="3"/><text x="320" y="185" text-anchor="middle" fill="#ccc">-</text>
    </g>
  </g>
  <text x="284" y="220" text-anchor="middle" font-size="10" fill="#4a7a3a">4 邻居赋值 h=1</text>
  <text x="284" y="236" text-anchor="middle" font-size="9" fill="#888" font-family="monospace">q: [(0,1),(1,1),(1,2),(2,0)]</text>

  <!-- Arrow -->
  <path d="M 350 150 L 400 150" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Layer 2 ===== -->
  <text x="480" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040">Layer 2（完成）</text>
  <g font-size="13">
    <g filter="url(#rough2)">
      <!-- Row 0: 1 1 0 -->
      <rect x="420" y="90" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" rx="3"/><text x="438" y="113" text-anchor="middle" fill="#4a7a3a">1</text>
      <rect x="456" y="90" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" rx="3"/><text x="474" y="113" text-anchor="middle" fill="#4a7a3a">1</text>
      <rect x="492" y="90" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3"/><text x="510" y="113" text-anchor="middle" fill="#446688" font-weight="bold">0</text>
      <!-- Row 1: 0 1 1 -->
      <rect x="420" y="126" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3"/><text x="438" y="149" text-anchor="middle" fill="#446688" font-weight="bold">0</text>
      <rect x="456" y="126" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" rx="3"/><text x="474" y="149" text-anchor="middle" fill="#4a7a3a">1</text>
      <rect x="492" y="126" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" rx="3"/><text x="510" y="149" text-anchor="middle" fill="#4a7a3a">1</text>
      <!-- Row 2: 1 2 2 -->
      <rect x="420" y="162" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" rx="3"/><text x="438" y="185" text-anchor="middle" fill="#4a7a3a">1</text>
      <rect x="456" y="162" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/><text x="474" y="185" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
      <rect x="492" y="162" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/><text x="510" y="185" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
    </g>
  </g>
  <text x="474" y="220" text-anchor="middle" font-size="10" fill="#d6a040">最后 2 格赋值 h=2</text>
  <text x="474" y="236" text-anchor="middle" font-size="9" fill="#888" font-family="monospace">q 空，结束</text>

  <!-- ===== Queue evolution detail ===== -->
  <g filter="url(#rough2)">
    <rect x="580" y="86" width="240" height="200" rx="8" fill="#fffdf3" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="700" y="108" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b">队列演化与高度赋值</text>
  <g font-size="9" fill="#444" font-family="monospace">
    <text x="596" y="128">Layer 0:</text>
    <text x="660" y="128" fill="#446688">q = [(0,2), (1,0)]</text>
    <text x="660" y="140" fill="#888">← 水域入队，h=0</text>

    <text x="596" y="160">pop (0,2):</text>
    <text x="660" y="160" fill="#4a7a3a">→ (0,1) h=1, (1,2) h=1</text>
    <text x="596" y="176">pop (1,0):</text>
    <text x="660" y="176" fill="#4a7a3a">→ (1,1) h=1, (2,0) h=1</text>

    <text x="596" y="198">Layer 1:</text>
    <text x="660" y="198" fill="#4a7a3a">q = [(0,1),(1,2),(1,1),(2,0)]</text>

    <text x="596" y="218">pop (0,1): 邻居已访问</text>
    <text x="596" y="232">pop (1,2): 邻居已访问</text>
    <text x="596" y="246">pop (1,1): → (2,1) h=2</text>
    <text x="596" y="260">pop (2,0): → (2,1) 已访问</text>

    <text x="596" y="278" fill="#d6a040" font-weight="bold">Layer 2: (2,1) h=2, (2,2) h=2</text>
  </g>

  <!-- Bottom note -->
  <g filter="url(#rough2)">
    <rect x="40" y="280" width="520" height="62" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <g font-size="10" fill="#444">
    <text x="56" y="300"><tspan font-weight="bold" fill="#2e6e2e">关键性质</tspan>：每个格子被最近的源点先到达（BFS 最短路径性质），首次赋值即为最优高度</text>
    <text x="56" y="318">高度 = height[父节点] + 1，无需显式记录层数——父节点的高度已经编码了距离信息</text>
    <text x="56" y="336">最大高度 = max(BFS 距离) = 网格中离水域最远格子的距离，本题结果 max = 2</text>
  </g>
</svg>
