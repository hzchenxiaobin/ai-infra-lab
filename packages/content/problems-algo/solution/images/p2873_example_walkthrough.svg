<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [12, 6, 1, 2, 7] → 77</text>

  <!-- header row -->
  <rect x="38" y="48" width="484" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="62" y="69" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">k</text>
  <text x="110" y="69" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">nums[k]</text>
  <text x="230" y="69" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">先结算 maxDiff×nums[k]</text>
  <text x="368" y="69" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">更新 maxDiff</text>
  <text x="464" y="69" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">ans</text>

  <!-- row k=1 -->
  <rect x="38" y="84" width="484" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="62" y="106" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="110" y="106" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <text x="230" y="106" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">—（maxDiff 尚无效）</text>
  <text x="368" y="106" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">12−6 = 6</text>
  <text x="464" y="106" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>

  <!-- row k=2 -->
  <rect x="38" y="122" width="484" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="62" y="144" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="110" y="144" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="230" y="144" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6 × 1 = 6</text>
  <text x="368" y="144" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">max(6, 12−1) = 11</text>
  <text x="464" y="144" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>

  <!-- row k=3 -->
  <rect x="38" y="160" width="484" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="62" y="182" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="110" y="182" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="230" y="182" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">11 × 2 = 22</text>
  <text x="368" y="182" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">max(11, 12−2) = 11</text>
  <text x="464" y="182" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">22</text>

  <!-- row k=4 highlighted -->
  <rect x="38" y="198" width="484" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="62" y="220" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="110" y="220" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="230" y="220" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">11 × 7 = 77 ★</text>
  <text x="368" y="220" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">max(11, 12−7) = 11</text>
  <text x="464" y="220" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">77</text>

  <!-- preMax note -->
  <rect x="38" y="250" width="484" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="271" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">全程 preMax 保持 12（下标 0 的 12 是永远的前缀最大）</text>

  <!-- conclusion -->
  <rect x="76" y="300" width="408" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="325" text-anchor="middle" font-size="12.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">命中三元组 (0, 2, 4)：(12 − 1) × 7 = 77</text>
</svg>
