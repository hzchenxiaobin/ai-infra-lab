<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：单数一趟双聚合，数组打擂台平局累加</text>

  <!-- 左上：单数双聚合 -->
  <g filter="url(#rough2)">
    <rect x="20" y="40" width="250" height="118" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="145" y="60" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold">① 单数：一趟剥位双聚合</text>

    <rect x="38" y="74" width="36" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
    <text x="56" y="95" text-anchor="middle" font-size="14" fill="#333">5</text>

    <rect x="80" y="74" width="36" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="98" y="95" text-anchor="middle" font-size="14" fill="#8a3030" font-weight="bold">7</text>

    <rect x="122" y="74" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="140" y="95" text-anchor="middle" font-size="14" fill="#2f5d24" font-weight="bold">2</text>

    <rect x="164" y="74" width="36" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
    <text x="182" y="95" text-anchor="middle" font-size="14" fill="#333">4</text>

    <text x="98" y="120" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">↑mx</text>
    <text x="140" y="120" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">↑mn</text>

    <text x="145" y="148" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold">range = mx − mn = 7 − 2 = 5</text>
  </g>

  <!-- 右上：剥位循环 -->
  <g filter="url(#rough2)">
    <rect x="290" y="40" width="250" height="118" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="415" y="60" text-anchor="middle" font-size="11.5" fill="#8a6d1a" font-weight="bold">② 一个数位喂两个累加器</text>
    <text x="304" y="80" font-size="10.5" fill="#8a6d1a">mx = 0, mn = 9　# 值域哨兵</text>
    <text x="304" y="96" font-size="10.5" fill="#8a6d1a">while t &gt; 0:</text>
    <text x="304" y="112" font-size="10.5" fill="#8a6d1a">　d = t % 10; mx = max(mx, d)</text>
    <text x="304" y="128" font-size="10.5" fill="#8a6d1a">　mn = min(mn, d); t //= 10</text>
    <text x="415" y="149" text-anchor="middle" font-size="10" fill="#8a6d1a" font-weight="bold">→ 一趟同时攒出 max / min 数位</text>
  </g>

  <!-- 连接箭头 -->
  <path d="M 145 162 L 145 176" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 415 162 L 415 176" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 底部：打擂台演算表 -->
  <g filter="url(#rough2)">
    <rect x="20" y="178" width="520" height="146" rx="10" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
    <text x="280" y="198" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">③ 数组层打擂台：&gt; 重置 · == 累加 · &lt; 跳过</text>

    <!-- 表头 -->
    <rect x="32" y="206" width="496" height="22" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1"/>
    <text x="60" y="221" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">数值</text>
    <text x="145" y="221" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">数位</text>
    <text x="215" y="221" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">mx</text>
    <text x="265" y="221" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">mn</text>
    <text x="320" y="221" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">range</text>
    <text x="400" y="221" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">判定</text>
    <text x="495" y="221" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">sum</text>

    <!-- 行 1：5724 登基 -->
    <rect x="32" y="230" width="496" height="28" fill="#fce4ec" stroke="#d8a0a0" stroke-width="1"/>
    <text x="60" y="249" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">5724</text>
    <text x="145" y="249" text-anchor="middle" font-size="11" fill="#333">5, 7, 2, 4</text>
    <text x="215" y="249" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">7</text>
    <text x="265" y="249" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="320" y="249" text-anchor="middle" font-size="11" fill="#333">5</text>
    <text x="400" y="249" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5 &gt; −1 登基</text>
    <text x="495" y="249" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5724（重置）</text>

    <!-- 行 2：111 跳过 -->
    <rect x="32" y="260" width="496" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
    <text x="60" y="279" text-anchor="middle" font-size="11.5" fill="#333">111</text>
    <text x="145" y="279" text-anchor="middle" font-size="11" fill="#333">1, 1, 1</text>
    <text x="215" y="279" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="265" y="279" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="320" y="279" text-anchor="middle" font-size="11" fill="#333">0</text>
    <text x="400" y="279" text-anchor="middle" font-size="11" fill="#888">0 &lt; 5 跳过</text>
    <text x="495" y="279" text-anchor="middle" font-size="11" fill="#333">5724</text>

    <!-- 行 3：350 入伙 -->
    <rect x="32" y="290" width="496" height="28" fill="#e6f4ea" stroke="#a0c8a0" stroke-width="1"/>
    <text x="60" y="309" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">350</text>
    <text x="145" y="309" text-anchor="middle" font-size="11" fill="#333">3, 5, 0</text>
    <text x="215" y="309" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5</text>
    <text x="265" y="309" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>
    <text x="320" y="309" text-anchor="middle" font-size="11" fill="#333">5</text>
    <text x="400" y="309" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">5 == 5 入伙</text>
    <text x="495" y="309" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">6074 ✓</text>
  </g>

  <!-- 左下：登基清账警示 -->
  <g filter="url(#rough2)">
    <rect x="20" y="334" width="250" height="76" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="145" y="354" text-anchor="middle" font-size="11.5" fill="#8a3030" font-weight="bold">⚠️ 登基必须清账</text>
    <text x="145" y="372" text-anchor="middle" font-size="10" fill="#8a3030">sum = x 是赋值，不是 +=</text>
    <text x="145" y="388" text-anchor="middle" font-size="10" fill="#8a3030">新王登基 ⇒ 旧 best 的达成者整体出局</text>
    <text x="145" y="404" text-anchor="middle" font-size="10" fill="#8a3030">漏写会把已被淘汰的数也算进去</text>
  </g>

  <!-- 右下：值域提示 -->
  <g filter="url(#rough2)">
    <rect x="290" y="334" width="250" height="76" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="415" y="354" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold">💡 值域只有 0 ~ 9</text>
    <text x="415" y="372" text-anchor="middle" font-size="10" fill="#2f5d24">上界 9 − 0（如 90），下界 0（如 111）</text>
    <text x="415" y="388" text-anchor="middle" font-size="10" fill="#2f5d24">⇒ 可用 bucket[10] 按范围分桶累加</text>
    <text x="415" y="404" text-anchor="middle" font-size="10" fill="#2f5d24">第 k 大 / 中位数等变形问法一并答掉</text>
  </g>
</svg>
