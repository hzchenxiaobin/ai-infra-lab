<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：n = 12 Alice 赢；n = 19 Alice 输</text>

  <!-- ===== 例 A：n = 12 ===== -->
  <rect x="60" y="42" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="62" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">n = 12 → true ✓</text>

  <!-- 表头 -->
  <rect x="55" y="88" width="40" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="105" text-anchor="middle" font-size="9.5" fill="#555" font-weight="bold" filter="url(#rough2)">手次</text>
  <rect x="95" y="88" width="70" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="130" y="105" text-anchor="middle" font-size="9.5" fill="#555" font-weight="bold" filter="url(#rough2)">玩家</text>
  <rect x="165" y="88" width="60" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="195" y="105" text-anchor="middle" font-size="9.5" fill="#555" font-weight="bold" filter="url(#rough2)">该移 k</text>
  <rect x="225" y="88" width="180" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="315" y="105" text-anchor="middle" font-size="9.5" fill="#555" font-weight="bold" filter="url(#rough2)">操作</text>
  <rect x="405" y="88" width="60" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="435" y="105" text-anchor="middle" font-size="9.5" fill="#555" font-weight="bold" filter="url(#rough2)">剩余</text>

  <!-- 行1 -->
  <rect x="55" y="116" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="75" y="135" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">1</text>
  <rect x="95" y="116" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="130" y="135" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">Alice</text>
  <rect x="165" y="116" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="195" y="135" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">10</text>
  <rect x="225" y="116" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="315" y="135" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">12 ≥ 10 → 移走 ✓</text>
  <rect x="405" y="116" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="435" y="135" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">2</text>

  <!-- 行2（卡壳） -->
  <rect x="55" y="148" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="75" y="167" text-anchor="middle" font-size="10.5" fill="#8f3a36" filter="url(#rough2)">2</text>
  <rect x="95" y="148" width="70" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="130" y="167" text-anchor="middle" font-size="10.5" fill="#8f3a36" filter="url(#rough2)">Bob</text>
  <rect x="165" y="148" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="195" y="167" text-anchor="middle" font-size="10.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">9</text>
  <rect x="225" y="148" width="180" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="315" y="167" text-anchor="middle" font-size="10" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">2 &lt; 9 ✗ Bob 卡壳</text>
  <rect x="405" y="148" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="435" y="167" text-anchor="middle" font-size="10.5" fill="#8f3a36" filter="url(#rough2)">2</text>

  <text x="480" y="167" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">→true</text>

  <!-- ===== 例 B：n = 19 ===== -->
  <rect x="60" y="206" width="180" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="226" text-anchor="middle" font-size="12" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">n = 19 → false ✗</text>

  <!-- 表头 -->
  <rect x="55" y="252" width="40" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="269" text-anchor="middle" font-size="9.5" fill="#555" font-weight="bold" filter="url(#rough2)">手次</text>
  <rect x="95" y="252" width="70" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="130" y="269" text-anchor="middle" font-size="9.5" fill="#555" font-weight="bold" filter="url(#rough2)">玩家</text>
  <rect x="165" y="252" width="60" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="195" y="269" text-anchor="middle" font-size="9.5" fill="#555" font-weight="bold" filter="url(#rough2)">该移 k</text>
  <rect x="225" y="252" width="180" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="315" y="269" text-anchor="middle" font-size="9.5" fill="#555" font-weight="bold" filter="url(#rough2)">操作</text>
  <rect x="405" y="252" width="60" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="435" y="269" text-anchor="middle" font-size="9.5" fill="#555" font-weight="bold" filter="url(#rough2)">剩余</text>

  <!-- 行1 -->
  <rect x="55" y="280" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="75" y="299" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">1</text>
  <rect x="95" y="280" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="130" y="299" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">Alice</text>
  <rect x="165" y="280" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="195" y="299" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">10</text>
  <rect x="225" y="280" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="315" y="299" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">19 ≥ 10 → 移走 ✓</text>
  <rect x="405" y="280" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="435" y="299" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">9</text>

  <!-- 行2 -->
  <rect x="55" y="312" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="75" y="331" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">2</text>
  <rect x="95" y="312" width="70" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="130" y="331" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">Bob</text>
  <rect x="165" y="312" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="195" y="331" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">9</text>
  <rect x="225" y="312" width="180" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="315" y="331" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">9 ≥ 9 → 移走 ✓</text>
  <rect x="405" y="312" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="435" y="331" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">0</text>

  <!-- 行3（卡壳） -->
  <rect x="55" y="344" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="75" y="363" text-anchor="middle" font-size="10.5" fill="#8f3a36" filter="url(#rough2)">3</text>
  <rect x="95" y="344" width="70" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="130" y="363" text-anchor="middle" font-size="10.5" fill="#8f3a36" filter="url(#rough2)">Alice</text>
  <rect x="165" y="344" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="195" y="363" text-anchor="middle" font-size="10.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="225" y="344" width="180" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="315" y="363" text-anchor="middle" font-size="10" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">0 &lt; 8 ✗ Alice 卡壳</text>
  <rect x="405" y="344" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="435" y="363" text-anchor="middle" font-size="10.5" fill="#8f3a36" filter="url(#rough2)">0</text>

  <text x="480" y="363" font-size="10" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">→false</text>

  <!-- 口诀 -->
  <rect x="45" y="404" width="430" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="422" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">口诀：数一数能完整走完几手 m ——</text>
  <text x="260" y="438" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">m 为奇（1, 3, 5, 7）→ Alice 赢；m 为偶（含 0）→ Alice 输</text>
</svg>
