<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="660" height="440" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="330" y="26" text-anchor="middle" font-size="14.5" fill="#333" font-weight="bold" filter="url(#rough2)">
    示例演算：values=[9,8,8,7,6], labels=[0,0,0,1,1], numWanted=3, useLimit=1
  </text>

  <!-- ===== 表头 ===== -->
  <g filter="url(#rough2)">
    <rect x="20" y="46" width="120" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="140" y="46" width="90" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="230" y="46" width="70" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="300" y="46" width="70" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="370" y="46" width="70" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="440" y="46" width="80" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="520" y="46" width="60" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="580" y="46" width="60" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">
    <text x="80"  y="66">物品(v,l)</text>
    <text x="185" y="66">决策</text>
    <text x="265" y="66">cnt[0]</text>
    <text x="335" y="66">cnt[1]</text>
    <text x="405" y="66">picked</text>
    <text x="480" y="66">说明</text>
    <text x="550" y="66">ans</text>
    <text x="610" y="66">步</text>
  </g>

  <!-- ===== 行 1: (9,0) 选入 ===== -->
  <g filter="url(#rough2)">
    <rect x="20" y="82" width="120" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="140" y="82" width="90" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="230" y="82" width="70" height="34" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2"/>
    <rect x="300" y="82" width="70" height="34" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2"/>
    <rect x="370" y="82" width="70" height="34" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2"/>
    <rect x="440" y="82" width="80" height="34" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2"/>
    <rect x="520" y="82" width="60" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="580" y="82" width="60" height="34" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <g font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="80"  y="104">(9, 0)</text>
    <text x="185" y="104" fill="#4a7a3a" font-weight="bold">✅ 选入</text>
    <text x="265" y="104">0→1</text>
    <text x="335" y="104">0</text>
    <text x="405" y="104">1</text>
    <text x="480" y="104">标签 0 未满</text>
    <text x="550" y="104" fill="#4a7a3a" font-weight="bold">9</text>
    <text x="610" y="104">1</text>
  </g>

  <!-- ===== 行 2: (8,0) 跳过 ===== -->
  <g filter="url(#rough2)">
    <rect x="20" y="118" width="120" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4,3"/>
    <rect x="140" y="118" width="90" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4,3"/>
    <rect x="230" y="118" width="70" height="34" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2"/>
    <rect x="300" y="118" width="70" height="34" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2"/>
    <rect x="370" y="118" width="70" height="34" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2"/>
    <rect x="440" y="118" width="80" height="34" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2"/>
    <rect x="520" y="118" width="60" height="34" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2"/>
    <rect x="580" y="118" width="60" height="34" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <g font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="80"  y="140">(8, 0)</text>
    <text x="185" y="140" fill="#b85450" font-weight="bold">❌ 跳过</text>
    <text x="265" y="140">1</text>
    <text x="335" y="140">0</text>
    <text x="405" y="140">1</text>
    <text x="480" y="140">标签 0 已满</text>
    <text x="550" y="140">9</text>
    <text x="610" y="140">2</text>
  </g>

  <!-- ===== 行 3: (8,0) 跳过 ===== -->
  <g filter="url(#rough2)">
    <rect x="20" y="154" width="120" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4,3"/>
    <rect x="140" y="154" width="90" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4,3"/>
    <rect x="230" y="154" width="70" height="34" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2"/>
    <rect x="300" y="154" width="70" height="34" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2"/>
    <rect x="370" y="154" width="70" height="34" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2"/>
    <rect x="440" y="154" width="80" height="34" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2"/>
    <rect x="520" y="154" width="60" height="34" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2"/>
    <rect x="580" y="154" width="60" height="34" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <g font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="80"  y="176">(8, 0)</text>
    <text x="185" y="176" fill="#b85450" font-weight="bold">❌ 跳过</text>
    <text x="265" y="176">1</text>
    <text x="335" y="176">0</text>
    <text x="405" y="176">1</text>
    <text x="480" y="176">标签 0 已满</text>
    <text x="550" y="176">9</text>
    <text x="610" y="176">3</text>
  </g>

  <!-- ===== 行 4: (7,1) 选入 ===== -->
  <g filter="url(#rough2)">
    <rect x="20" y="190" width="120" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="140" y="190" width="90" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="230" y="190" width="70" height="34" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2"/>
    <rect x="300" y="190" width="70" height="34" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2"/>
    <rect x="370" y="190" width="70" height="34" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2"/>
    <rect x="440" y="190" width="80" height="34" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2"/>
    <rect x="520" y="190" width="60" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="580" y="190" width="60" height="34" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <g font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="80"  y="212">(7, 1)</text>
    <text x="185" y="212" fill="#4a7a3a" font-weight="bold">✅ 选入</text>
    <text x="265" y="212">1</text>
    <text x="335" y="212">0→1</text>
    <text x="405" y="212">2</text>
    <text x="480" y="212">标签 1 未满</text>
    <text x="550" y="212" fill="#4a7a3a" font-weight="bold">16</text>
    <text x="610" y="212">4</text>
  </g>

  <!-- ===== 行 5: (6,1) 跳过 ===== -->
  <g filter="url(#rough2)">
    <rect x="20" y="226" width="120" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4,3"/>
    <rect x="140" y="226" width="90" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4,3"/>
    <rect x="230" y="226" width="70" height="34" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2"/>
    <rect x="300" y="226" width="70" height="34" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2"/>
    <rect x="370" y="226" width="70" height="34" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2"/>
    <rect x="440" y="226" width="80" height="34" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2"/>
    <rect x="520" y="226" width="60" height="34" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2"/>
    <rect x="580" y="226" width="60" height="34" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <g font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="80"  y="248">(6, 1)</text>
    <text x="185" y="248" fill="#b85450" font-weight="bold">❌ 跳过</text>
    <text x="265" y="248">1</text>
    <text x="335" y="248">1</text>
    <text x="405" y="248">2</text>
    <text x="480" y="248">标签 1 已满</text>
    <text x="550" y="248">16</text>
    <text x="610" y="248">5</text>
  </g>

  <!-- ===== 说明箭头：从行1 cnt[0]→行2 跳过原因 ===== -->
  <path d="M 265 116 L 265 118" stroke="#b85450" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- ===== 结论框 ===== -->
  <rect x="40" y="280" width="580" height="56" rx="10" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="304" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">
    picked = 2 &lt; numWanted = 3，但所有标签名额已耗尽
  </text>
  <text x="330" y="324" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">
    合法大值已全部选完（标签 0 满、标签 1 满），无法再选
  </text>

  <!-- ===== Result box ===== -->
  <rect x="40" y="352" width="580" height="68" rx="10" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="378" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">
    ans = 9 + 7 = 16 ✓
  </text>
  <text x="330" y="400" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">
    两个值 8 被标签 0 名额挡住，值 6 被标签 1 名额挡住
  </text>
</svg>
