<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：3 个 spam 举报日 → 2 个有效日 → AVG = 75.00</text>

  <!-- ===== Day 07-02 ===== -->
  <rect x="20" y="46" width="180" height="180" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="110" y="66" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2019-07-02</text>

  <text x="32" y="84" font-size="8" fill="#888">spam 举报行：</text>
  <rect x="32" y="88" width="156" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="60" y="100" text-anchor="middle" font-size="8" fill="#333">post 3</text>
  <text x="140" y="100" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">spam</text>

  <text x="32" y="118" font-size="8" fill="#888">LEFT JOIN Removals：</text>
  <rect x="32" y="122" width="156" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="60" y="134" text-anchor="middle" font-size="8" fill="#333">post 3</text>
  <text x="140" y="134" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">b.post=3 ✓</text>

  <text x="32" y="152" font-size="8" fill="#333">total = <tspan fill="#b85450" font-weight="bold">1</tspan>，removed = <tspan fill="#b85450" font-weight="bold">1</tspan></text>
  <rect x="32" y="158" width="156" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="173" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1 × 100 / 1 = 100%</text>

  <text x="32" y="196" font-size="8" fill="#888">post 3 在 Removals → 已删</text>
  <text x="110" y="212" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">100%</text>

  <!-- ===== Day 07-04 ===== -->
  <rect x="210" y="46" width="180" height="180" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="66" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2019-07-04</text>

  <text x="222" y="84" font-size="8" fill="#888">spam 举报行：</text>
  <rect x="222" y="88" width="156" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="252" y="100" text-anchor="middle" font-size="8" fill="#333">post 2</text>
  <text x="340" y="100" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">spam</text>

  <rect x="222" y="106" width="156" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="252" y="118" text-anchor="middle" font-size="8" fill="#333">post 4</text>
  <text x="340" y="118" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">spam</text>

  <text x="222" y="136" font-size="8" fill="#888">LEFT JOIN Removals：</text>
  <rect x="222" y="140" width="156" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="252" y="151" text-anchor="middle" font-size="7.5" fill="#333">post 2</text>
  <text x="340" y="151" text-anchor="middle" font-size="7.5" fill="#4a7a3a" font-weight="bold">b.post=2 ✓</text>

  <rect x="222" y="156" width="156" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="252" y="167" text-anchor="middle" font-size="7.5" fill="#333">post 4</text>
  <text x="340" y="167" text-anchor="middle" font-size="7.5" fill="#b85450" font-weight="bold">NULL ✗</text>

  <text x="222" y="182" font-size="8" fill="#333">total = <tspan fill="#b85450" font-weight="bold">2</tspan>，removed = <tspan fill="#b85450" font-weight="bold">1</tspan></text>
  <rect x="222" y="188" width="156" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="300" y="203" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">1 × 100 / 2 = 50%</text>

  <text x="222" y="222" font-size="7.5" fill="#888">post 4 未在 Removals → 未删</text>

  <!-- ===== Day 07-03 (excluded) ===== -->
  <rect x="400" y="46" width="180" height="180" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="8" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="490" y="66" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">2019-07-03（排除）</text>

  <text x="412" y="84" font-size="8" fill="#888">举报行：</text>
  <rect x="412" y="88" width="156" height="16" fill="#f0f0f0" stroke="#bbb" stroke-width="0.6" rx="3" filter="url(#rough2)"/>
  <text x="445" y="100" text-anchor="middle" font-size="8" fill="#888">post 2</text>
  <text x="525" y="100" text-anchor="middle" font-size="8" fill="#888">racism</text>

  <rect x="412" y="106" width="156" height="16" fill="#f0f0f0" stroke="#bbb" stroke-width="0.6" rx="3" filter="url(#rough2)"/>
  <text x="445" y="118" text-anchor="middle" font-size="8" fill="#888">post 5</text>
  <text x="525" y="118" text-anchor="middle" font-size="8" fill="#888">racism</text>

  <text x="412" y="138" font-size="8" fill="#b85450" font-weight="bold">无 spam 举报！</text>
  <rect x="412" y="144" width="156" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="490" y="158" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">WHERE extra='spam'</text>
  <text x="490" y="169" text-anchor="middle" font-size="8" fill="#b85450">过滤后 0 行</text>

  <text x="412" y="186" font-size="8" fill="#888">该日不进入 GROUP BY</text>
  <text x="412" y="200" font-size="8" fill="#888">→ 不算 0%，直接排除</text>
  <text x="490" y="218" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">（跳过）</text>

  <!-- ===== AVG box ===== -->
  <path d="M110 236 L240 236" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M300 236 L300 236" stroke="#d6a040" stroke-width="1.5" fill="none"/>
  <path d="M300 236 L460 236" stroke="#bbb" stroke-width="1" stroke-dasharray="4 3" fill="none"/>

  <rect x="120" y="246" width="360" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="268" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">外层 AVG + ROUND</text>
  <text x="300" y="288" text-anchor="middle" font-size="11" fill="#333">AVG(100, 50) = (100 + 50) / 2 = <tspan fill="#b85450" font-weight="bold">75</tspan></text>
  <text x="300" y="308" text-anchor="middle" font-size="11" fill="#333">ROUND(75, 2) = <tspan fill="#b85450" font-weight="bold">75.00</tspan></text>

  <!-- ===== Final output ===== -->
  <path d="M300 322 L300 346" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <rect x="180" y="346" width="240" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="363" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">average_daily_percent</text>
  <text x="300" y="380" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">75.00</text>

  <!-- ===== Key takeaway ===== -->
  <rect x="20" y="400" width="560" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="40" y="420" font-size="9.5" fill="#333">• <tspan fill="#d6a040" font-weight="bold">remove_date 与 action_date 无需相等</tspan>——只看帖子是否出现在 Removals 表中（"we do not care about the remove dates"）</text>
  <text x="40" y="436" font-size="9.5" fill="#333">• <tspan fill="#4a7a3a" font-weight="bold">无 spam 举报的日期被 WHERE 过滤掉</tspan>，不进分组、不计 0%；AVG 分母 = 有效天数 = 2，而非全部天数</text>
  <text x="40" y="450" font-size="9" fill="#888">　07-01 无任何举报、07-03 仅 racism → 均排除；只有 07-02 与 07-04 参与平均</text>
</svg>
