<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 22 (10110) 逐位扫描</text>

  <!-- ===== Header row ===== -->
  <rect x="30" y="48" width="480" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="60" y="68" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">轮次</text>
  <text x="130" y="68" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">pos</text>
  <text x="200" y="68" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">n&amp;1</text>
  <text x="335" y="68" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">动作</text>
  <text x="435" y="68" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">last</text>
  <text x="495" y="68" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">ans</text>

  <!-- ===== Row 1: pos=0, n&1=0, skip ===== -->
  <rect x="30" y="82" width="480" height="34" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="60" y="104" text-anchor="middle" font-size="11.5" fill="#888" font-weight="bold">1</text>
  <text x="130" y="104" text-anchor="middle" font-size="11.5" fill="#333">0</text>
  <rect x="184" y="86" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="200" y="104" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <text x="335" y="104" text-anchor="middle" font-size="11" fill="#888">跳过</text>
  <text x="435" y="104" text-anchor="middle" font-size="11.5" fill="#888">−1</text>
  <text x="495" y="104" text-anchor="middle" font-size="11.5" fill="#888">0</text>

  <!-- ===== Row 2: pos=1, n&1=1, first 1 ===== -->
  <rect x="30" y="120" width="480" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="60" y="142" text-anchor="middle" font-size="11.5" fill="#888" font-weight="bold">2</text>
  <text x="130" y="142" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <rect x="184" y="124" width="32" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="142" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <text x="335" y="142" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">首个 1，记 last</text>
  <text x="435" y="142" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">1</text>
  <text x="495" y="142" text-anchor="middle" font-size="11.5" fill="#888">0</text>

  <!-- ===== Row 3: pos=2, n&1=1, ans=1 ===== -->
  <rect x="30" y="158" width="480" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="60" y="180" text-anchor="middle" font-size="11.5" fill="#888" font-weight="bold">3</text>
  <text x="130" y="180" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <rect x="184" y="162" width="32" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="180" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <text x="335" y="180" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">ans=max(0, 2−1)=1</text>
  <text x="435" y="180" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">2</text>
  <text x="495" y="180" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">1</text>

  <!-- ===== Row 4: pos=3, n&1=0, skip ===== -->
  <rect x="30" y="196" width="480" height="34" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="60" y="218" text-anchor="middle" font-size="11.5" fill="#888" font-weight="bold">4</text>
  <text x="130" y="218" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <rect x="184" y="200" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="200" y="218" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <text x="335" y="218" text-anchor="middle" font-size="11" fill="#888">跳过</text>
  <text x="435" y="218" text-anchor="middle" font-size="11.5" fill="#888">2</text>
  <text x="495" y="218" text-anchor="middle" font-size="11.5" fill="#888">1</text>

  <!-- ===== Row 5: pos=4, n&1=1, ans=2 ===== -->
  <rect x="30" y="234" width="480" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="256" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">5</text>
  <text x="130" y="256" text-anchor="middle" font-size="11.5" fill="#333">4</text>
  <rect x="184" y="238" width="32" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="256" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <text x="335" y="256" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">ans=max(1, 4−2)=2</text>
  <text x="435" y="256" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">4</text>
  <text x="495" y="256" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">2</text>

  <!-- arrow to result -->
  <path d="M 270 272 Q 270 286 270 296" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- result box -->
  <rect x="90" y="302" width="360" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="325" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">n = 0 退出，返回 ans = 2 ✓</text>

  <!-- bottom note 1 -->
  <rect x="50" y="354" width="440" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="270" y="372" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">从低位扫到高位，每遇 1 用 pos−last 更新最大间距</text>
  <text x="270" y="388" text-anchor="middle" font-size="11" fill="#d6a040">两对相邻 1：（位1,位2）间距 1 →（位2,位4）间距 2</text>

  <!-- bottom note 2 -->
  <rect x="50" y="406" width="440" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="270" y="424" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">last=−1 作哨兵：首个 1 不算间距，只记位置</text>
  <text x="270" y="440" text-anchor="middle" font-size="11" fill="#446688">避免误用 last=0 与 pos=0 算出虚假间距 0</text>
</svg>
