<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">坐标 (i, j) 处的苹果数 = |i| + |j|</text>
  <text x="300" y="48" text-anchor="middle" font-size="11" fill="#888">以 (0,0) 为中心的正方形花园，k=2 时覆盖 [-2,2]×[-2,2]</text>

  <!-- garden square background (k=2) -->
  <rect x="150" y="90" width="300" height="300" rx="4" fill="#e6f4ea" fill-opacity="0.5" stroke="#4a7a3a" stroke-width="2.5" stroke-dasharray="6 4" filter="url(#rough2)"/>

  <!-- axis labels -->
  <text x="300" y="82" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">← 边长 = 2k = 4 →</text>
  <text x="142" y="244" text-anchor="end" font-size="10" fill="#4a7a3a" font-weight="bold">边长</text>
  <text x="142" y="256" text-anchor="end" font-size="10" fill="#4a7a3a" font-weight="bold">= 2k</text>
  <text x="142" y="268" text-anchor="end" font-size="10" fill="#4a7a3a" font-weight="bold">= 4</text>

  <!-- grid points: 5x5 from (-2,-2) to (2,2), each cell 60px -->
  <!-- j = 2 (top row, y=110) -->
  <g font-size="11" text-anchor="middle">
    <!-- row j=2 -->
    <circle cx="180" cy="110" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="180" y="114" fill="#d6a040">4</text>
    <circle cx="240" cy="110" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="240" y="114" fill="#d6a040">3</text>
    <circle cx="300" cy="110" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="300" y="114" fill="#d6a040" font-weight="bold">2</text>
    <circle cx="360" cy="110" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="360" y="114" fill="#d6a040">3</text>
    <circle cx="420" cy="110" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="420" y="114" fill="#d6a040">4</text>

    <!-- row j=1 (y=170) -->
    <circle cx="180" cy="170" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="180" y="174" fill="#d6a040">3</text>
    <circle cx="240" cy="170" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="240" y="174" fill="#d6a040" font-weight="bold">2</text>
    <circle cx="300" cy="170" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="300" y="174" fill="#d6a040" font-weight="bold">1</text>
    <circle cx="360" cy="170" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="360" y="174" fill="#d6a040" font-weight="bold">2</text>
    <circle cx="420" cy="170" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="420" y="174" fill="#d6a040">3</text>

    <!-- row j=0 (y=230, center) -->
    <circle cx="180" cy="230" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="180" y="234" fill="#d6a040" font-weight="bold">2</text>
    <circle cx="240" cy="230" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="240" y="234" fill="#d6a040" font-weight="bold">1</text>
    <circle cx="300" cy="230" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
    <text x="300" y="234" fill="#446688" font-weight="bold">0</text>
    <circle cx="360" cy="230" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="360" y="234" fill="#d6a040" font-weight="bold">1</text>
    <circle cx="420" cy="230" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="420" y="234" fill="#d6a040" font-weight="bold">2</text>

    <!-- row j=-1 (y=290) -->
    <circle cx="180" cy="290" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="180" y="294" fill="#d6a040">3</text>
    <circle cx="240" cy="290" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="240" y="294" fill="#d6a040" font-weight="bold">2</text>
    <circle cx="300" cy="290" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="300" y="294" fill="#d6a040" font-weight="bold">1</text>
    <circle cx="360" cy="290" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="360" y="294" fill="#d6a040" font-weight="bold">2</text>
    <circle cx="420" cy="290" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="420" y="294" fill="#d6a040">3</text>

    <!-- row j=-2 (y=350) -->
    <circle cx="180" cy="350" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="180" y="354" fill="#d6a040">4</text>
    <circle cx="240" cy="350" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="240" y="354" fill="#d6a040">3</text>
    <circle cx="300" cy="350" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="300" y="354" fill="#d6a040" font-weight="bold">2</text>
    <circle cx="360" cy="350" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="360" y="354" fill="#d6a040">3</text>
    <circle cx="420" cy="350" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="420" y="354" fill="#d6a040">4</text>
  </g>

  <!-- axis labels for coordinates -->
  <text x="300" y="392" text-anchor="middle" font-size="10" fill="#888">i 轴 →</text>
  <text x="460" y="234" font-size="10" fill="#888">j 轴 ↓</text>

  <!-- coordinate labels on edges -->
  <text x="180" y="404" text-anchor="middle" font-size="9" fill="#888">i=-2</text>
  <text x="300" y="404" text-anchor="middle" font-size="9" fill="#888">i=0</text>
  <text x="420" y="404" text-anchor="middle" font-size="9" fill="#888">i=2</text>

  <!-- summary box -->
  <rect x="40" y="416" width="520" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="60" y="438" font-size="12" fill="#444">k=2 时: S(2) = 2×2×3×5 = 60 个苹果, 周长 = 8×2 = 16</text>

  <!-- center marker -->
  <text x="300" y="208" text-anchor="middle" font-size="9" fill="#446688">(0,0)</text>
</svg>
