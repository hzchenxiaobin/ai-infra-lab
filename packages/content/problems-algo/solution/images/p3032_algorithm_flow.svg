<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 490" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="490" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：外层枚举 [a, b]，内层位掩码查重</text>

  <!-- outer loop banner -->
  <rect x="60" y="38" width="290" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="205" y="60" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">外层循环：x 依个取遍 [a, b] ↻</text>

  <path d="M 200 72 L 200 88" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- init -->
  <rect x="100" y="92" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="200" y="112" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">mask = 0，y = x（取副本）</text>

  <path d="M 200 124 L 200 140" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- take last digit -->
  <rect x="115" y="144" width="170" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="200" y="164" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">d = y % 10（取出末位）</text>

  <path d="M 200 176 L 200 192" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- decision: repeated? -->
  <path d="M 200 196 L 288 232 L 200 268 L 112 232 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="228" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">mask 第 d 位</text>
  <text x="200" y="246" text-anchor="middle" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">已置 1？（重复？）</text>

  <!-- yes: invalid -->
  <path d="M 288 232 L 344 232" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="316" y="224" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="348" y="216" width="110" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="403" y="236" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">y 非法 ✗ 跳过</text>

  <!-- no: register -->
  <path d="M 200 268 L 200 284" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="216" y="282" text-anchor="start" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="105" y="288" width="190" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="200" y="308" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">mask |= 1&lt;&lt;d；y /= 10</text>

  <path d="M 200 320 L 200 336" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- decision: digits left? -->
  <path d="M 200 340 L 258 372 L 200 404 L 142 372 Z" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="368" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">y &gt; 0 ?</text>
  <text x="200" y="386" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">（还有位没查）</text>

  <!-- yes: loop back to take digit -->
  <path d="M 258 372 C 330 372, 330 166, 289 164" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="312" y="254" text-anchor="start" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">是（取下一位）</text>

  <!-- no: count -->
  <path d="M 200 404 L 200 420" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="216" y="418" text-anchor="start" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否（查完）</text>
  <rect x="145" y="424" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="200" y="443" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans += 1 ✓</text>

  <!-- invalid flows to next x -->
  <path d="M 403 248 L 403 410" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 255 439 L 326 439" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="330" y="414" width="146" height="32" fill="#ffffff" stroke="#999" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="403" y="434" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">内层结束，下一个 x ↻</text>

  <!-- loop back to outer banner -->
  <path d="M 476 430 C 508 430, 508 55, 356 55" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="497" y="248" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">↻</text>

  <!-- bottom note -->
  <rect x="60" y="460" width="400" height="26" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="477" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">每个数至多 4 位 → 总代价 O((b−a+1)·d)，b ≤ 1000 时常数级。</text>
</svg>
