<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">示例演算：nums = [1, 3, 5, 4, 7]</text>
  <text x="310" y="48" text-anchor="middle" font-size="11" fill="#888">初始 cur = 1, best = 1（单个元素天然是长度 1 的递增段）</text>

  <text x="40" y="92" font-size="12" fill="#888" font-weight="bold">步 i</text>
  <text x="40" y="130" font-size="11" fill="#888">比较</text>
  <text x="40" y="168" font-size="11" fill="#888">动作</text>
  <text x="40" y="206" font-size="11" fill="#888">cur</text>
  <text x="40" y="244" font-size="11" fill="#888">best</text>

  <g filter="url(#rough2)">
    <rect x="110" y="76" width="96" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6"/>
    <rect x="210" y="76" width="96" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6"/>
    <rect x="310" y="76" width="96" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6"/>
    <rect x="410" y="76" width="96" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6"/>
  </g>
  <text x="158" y="99" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i=1</text>
  <text x="258" y="99" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i=2</text>
  <text x="358" y="99" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i=3</text>
  <text x="458" y="99" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i=4</text>

  <text x="158" y="134" text-anchor="middle" font-size="11" fill="#4a7a3a">3&gt;1 递增</text>
  <text x="258" y="134" text-anchor="middle" font-size="11" fill="#4a7a3a">5&gt;3 递增</text>
  <text x="358" y="134" text-anchor="middle" font-size="11" fill="#b85450">4&lt;5 断裂</text>
  <text x="458" y="134" text-anchor="middle" font-size="11" fill="#4a7a3a">7&gt;4 递增</text>

  <text x="158" y="172" text-anchor="middle" font-size="11" fill="#4a7a3a">续接 +1</text>
  <text x="258" y="172" text-anchor="middle" font-size="11" fill="#4a7a3a">续接 +1</text>
  <text x="358" y="172" text-anchor="middle" font-size="11" fill="#b85450">重置 =1</text>
  <text x="458" y="172" text-anchor="middle" font-size="11" fill="#4a7a3a">续接 +1</text>

  <g filter="url(#rough2)">
    <rect x="130" y="188" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5"/>
    <rect x="230" y="188" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5"/>
    <rect x="330" y="188" width="56" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="5"/>
    <rect x="430" y="188" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5"/>
  </g>
  <text x="158" y="209" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <text x="258" y="209" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <text x="330" y="209" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="458" y="209" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <g filter="url(#rough2)">
    <rect x="130" y="226" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="5"/>
    <rect x="230" y="226" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5"/>
    <rect x="330" y="226" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="5"/>
    <rect x="430" y="226" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="5"/>
  </g>
  <text x="158" y="247" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <text x="258" y="247" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">3 ★</text>
  <text x="358" y="247" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <text x="458" y="247" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <rect x="110" y="276" width="396" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="308" y="301" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">best = 3 → 对应递增段 [1, 3, 5]</text>

  <rect x="110" y="330" width="396" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="308" y="355" text-anchor="middle" font-size="11" fill="#555">注意：[1,3,5,7] 虽升序但不连续（5 与 7 被 4 隔开）→ 不算</text>

  <rect x="40" y="386" width="540" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="408" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">全程一次遍历：每步 O(1)，总 O(n)；cur/best 各一变量，O(1) 空间</text>
  <text x="310" y="424" text-anchor="middle" font-size="10.5" fill="#888">断裂处重置 cur=1 而非 0 —— 单元素本身即长度为 1 的递增段</text>
</svg>
