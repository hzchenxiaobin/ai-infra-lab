<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一次遍历增量计数</text>

  <!-- Start oval -->
  <ellipse cx="260" cy="62" rx="80" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="67" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始遍历 s</text>

  <!-- arrow start -> decision -->
  <path d="M 260 84 L 260 108" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond: c == '1'? -->
  <polygon points="260,110 350,150 260,190 170,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="154" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">c == '1' ?</text>

  <!-- Yes branch label -->
  <text x="158" y="146" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <!-- arrow diamond left -> consec++ -->
  <path d="M 170 150 L 140 150 L 140 178" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- No branch label -->
  <text x="362" y="146" text-anchor="start" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <!-- arrow diamond right -> consec=0 -->
  <path d="M 350 150 L 380 150 L 380 188" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- consec++ rect (yes branch) -->
  <rect x="80" y="180" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="140" y="205" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">consec++</text>

  <!-- arrow consec++ -> ans += consec -->
  <path d="M 140 220 L 140 248" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ans += consec rect -->
  <rect x="60" y="250" width="160" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="140" y="275" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans = (ans+consec) % MOD</text>

  <!-- consec = 0 rect (no branch) -->
  <rect x="320" y="190" width="120" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="380" y="215" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">consec = 0</text>

  <!-- merge arrows down to "还有字符?" -->
  <path d="M 140 290 L 140 320 L 260 320" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 380 230 L 380 320 L 260 320" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 260 320 L 260 338" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond: 还有字符? -->
  <polygon points="260,340 340,370 260,400 180,370" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="374" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">还有字符?</text>

  <!-- Yes (loop back) label -->
  <text x="172" y="366" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <!-- loop back arrow: left from diamond, up the far left, back to top decision -->
  <path d="M 180 370 L 40 370 L 40 130 L 168 130" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="50" y="250" font-size="10" fill="#4a7a3a" font-weight="bold">取下一个</text>
  <text x="50" y="264" font-size="10" fill="#4a7a3a" font-weight="bold">字符 c</text>

  <!-- No label -->
  <text x="352" y="366" text-anchor="start" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M 340 370 L 410 370 L 410 398" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- End oval: return ans -->
  <ellipse cx="410" cy="418" rx="62" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="410" y="423" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">return ans</text>
</svg>
