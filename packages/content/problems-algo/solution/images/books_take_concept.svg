<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：强制等差数列 + 断点 + 单调栈</text>

  <text x="74" y="72" text-anchor="end" font-size="11" fill="#888">books[]</text>

  <rect x="84" y="50" width="72" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="74" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>

  <rect x="164" y="50" width="72" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="200" y="74" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">10</text>

  <rect x="244" y="50" width="72" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="280" y="74" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">10</text>

  <rect x="324" y="50" width="72" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="360" y="74" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">10</text>

  <rect x="404" y="50" width="72" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="440" y="74" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">6</text>

  <text x="120" y="104" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <text x="200" y="104" text-anchor="middle" font-size="11" fill="#446688">9</text>
  <text x="280" y="104" text-anchor="middle" font-size="11" fill="#446688">8</text>
  <text x="360" y="104" text-anchor="middle" font-size="11" fill="#446688">7</text>
  <text x="440" y="104" text-anchor="middle" font-size="11" fill="#446688">2</text>
  <text x="280" y="116" text-anchor="middle" font-size="10" fill="#999">↑ books[k] − k</text>

  <path d="M 60 124 L 500 124" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <text x="74" y="148" text-anchor="end" font-size="11" fill="#888">take[]</text>

  <rect x="84" y="132" width="72" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="156" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">1</text>

  <rect x="164" y="132" width="72" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="200" y="156" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">3</text>

  <rect x="244" y="132" width="72" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="280" y="156" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">4</text>

  <rect x="324" y="132" width="72" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="360" y="156" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">5</text>

  <rect x="404" y="132" width="72" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="440" y="156" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">6</text>

  <text x="120" y="186" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">j（断点）</text>
  <text x="120" y="200" text-anchor="middle" font-size="10" fill="#999">books[j]=1</text>
  <text x="120" y="212" text-anchor="middle" font-size="10" fill="#999">&lt; 强制值 2</text>
  <text x="120" y="224" text-anchor="middle" font-size="10" fill="#d6a040">dp[j] 独立 ←</text>

  <path d="M 164 182 L 164 176 L 476 176 L 476 182" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="320" y="194" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">强制等差：3, 4, 5, 6（公差 = 1）</text>
  <text x="440" y="186" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">i</text>

  <path d="M 60 250 L 500 250" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <text x="280" y="278" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">断点条件：books[j] &lt; books[i] − (i − j)</text>
  <path d="M 210 290 L 350 290" stroke="#b85450" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="280" y="312" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">⟺ books[j] − j &lt; books[i] − i</text>
  <text x="280" y="330" text-anchor="middle" font-size="11.5" fill="#888">两侧同时减 j，化距离差为值差</text>

  <rect x="80" y="348" width="400" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="368" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">→ 单调栈维护 books[k] − k 的严格递增序列</text>
  <text x="280" y="384" text-anchor="middle" font-size="11" fill="#888">弹出 books[k]−k ≥ books[i]−i 的下标，栈顶即断点 j</text>
</svg>
