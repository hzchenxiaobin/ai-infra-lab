  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">report（宽表）</text>
  <rect x="78" y="48" width="404" height="70" fill="#ffffff" stroke="#888888" stroke-width="1.2" rx="6" filter="url(#rough2)"/>

  <rect x="84" y="54" width="92" height="22" fill="#f0f0f0" stroke="#888888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
