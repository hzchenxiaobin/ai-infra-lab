<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：strings = [abc, bcd, acef, xyz, az, ba, a, z]</text>

  <!-- header -->
  <text x="32" y="46" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">步</text>
  <text x="84" y="46" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">s</text>
  <text x="144" y="46" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">key</text>
  <text x="360" y="46" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">哈希桶变化</text>
  <line x1="14" y1="52" x2="546" y2="52" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 1: abc / abc / 新建 -->
  <rect x="14" y="58" width="532" height="28" fill="#fff8e1" stroke="none" rx="4" filter="url(#rough2)"/>
  <text x="32" y="76" text-anchor="middle" font-size="11" fill="#888">1</text>
  <rect x="64" y="60" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="84" y="76" text-anchor="middle" font-size="11" fill="#333">abc</text>
  <rect x="124" y="60" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="144" y="76" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">abc</text>
  <text x="184" y="76" font-size="11" fill="#d6a040" font-weight="bold">新建桶</text>
  <text x="234" y="76" font-size="11" fill="#555">abc → [ abc ]</text>

  <!-- Row 2: bcd / abc / 追加 -->
  <rect x="14" y="92" width="532" height="28" fill="#f6fff8" stroke="none" rx="4" filter="url(#rough2)"/>
  <text x="32" y="110" text-anchor="middle" font-size="11" fill="#888">2</text>
  <rect x="64" y="94" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="84" y="110" text-anchor="middle" font-size="11" fill="#333">bcd</text>
  <rect x="124" y="94" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="144" y="110" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">abc</text>
  <text x="184" y="110" font-size="11" fill="#4a7a3a" font-weight="bold">追加</text>
  <text x="234" y="110" font-size="11" fill="#555">abc → [ abc, bcd ]</text>

  <!-- Row 3: acef / acef / 新建 -->
  <rect x="14" y="126" width="532" height="28" fill="#fff8e1" stroke="none" rx="4" filter="url(#rough2)"/>
  <text x="32" y="144" text-anchor="middle" font-size="11" fill="#888">3</text>
  <rect x="64" y="128" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="84" y="144" text-anchor="middle" font-size="11" fill="#333">acef</text>
  <rect x="124" y="128" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="144" y="144" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">acef</text>
  <text x="184" y="144" font-size="11" fill="#d6a040" font-weight="bold">新建桶</text>
  <text x="234" y="144" font-size="11" fill="#555">acef → [ acef ]</text>

  <!-- Row 4: xyz / abc / 追加 -->
  <rect x="14" y="160" width="532" height="28" fill="#f6fff8" stroke="none" rx="4" filter="url(#rough2)"/>
  <text x="32" y="178" text-anchor="middle" font-size="11" fill="#888">4</text>
  <rect x="64" y="162" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="84" y="178" text-anchor="middle" font-size="11" fill="#333">xyz</text>
  <rect x="124" y="162" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="144" y="178" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">abc</text>
  <text x="184" y="178" font-size="11" fill="#4a7a3a" font-weight="bold">追加</text>
  <text x="234" y="178" font-size="11" fill="#555">abc → [ abc, bcd, xyz ]</text>

  <!-- Row 5: az / az / 新建 -->
  <rect x="14" y="194" width="532" height="28" fill="#fff8e1" stroke="none" rx="4" filter="url(#rough2)"/>
  <text x="32" y="212" text-anchor="middle" font-size="11" fill="#888">5</text>
  <rect x="64" y="196" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="84" y="212" text-anchor="middle" font-size="11" fill="#333">az</text>
  <rect x="124" y="196" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="144" y="212" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">az</text>
  <text x="184" y="212" font-size="11" fill="#d6a040" font-weight="bold">新建桶</text>
  <text x="234" y="212" font-size="11" fill="#555">az → [ az ]</text>

  <!-- Row 6: ba / az / 追加 -->
  <rect x="14" y="228" width="532" height="28" fill="#f6fff8" stroke="none" rx="4" filter="url(#rough2)"/>
  <text x="32" y="246" text-anchor="middle" font-size="11" fill="#888">6</text>
  <rect x="64" y="230" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="84" y="246" text-anchor="middle" font-size="11" fill="#333">ba</text>
  <rect x="124" y="230" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="144" y="246" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">az</text>
  <text x="184" y="246" font-size="11" fill="#4a7a3a" font-weight="bold">追加</text>
  <text x="234" y="246" font-size="11" fill="#555">az → [ az, ba ]</text>

  <!-- Row 7: a / a / 新建 -->
  <rect x="14" y="262" width="532" height="28" fill="#fff8e1" stroke="none" rx="4" filter="url(#rough2)"/>
  <text x="32" y="280" text-anchor="middle" font-size="11" fill="#888">7</text>
  <rect x="64" y="264" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="84" y="280" text-anchor="middle" font-size="11" fill="#333">a</text>
  <rect x="124" y="264" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="144" y="280" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a</text>
  <text x="184" y="280" font-size="11" fill="#d6a040" font-weight="bold">新建桶</text>
  <text x="234" y="280" font-size="11" fill="#555">a → [ a ]</text>

  <!-- Row 8: z / a / 追加 -->
  <rect x="14" y="296" width="532" height="28" fill="#f6fff8" stroke="none" rx="4" filter="url(#rough2)"/>
  <text x="32" y="314" text-anchor="middle" font-size="11" fill="#888">8</text>
  <rect x="64" y="298" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="84" y="314" text-anchor="middle" font-size="11" fill="#333">z</text>
  <rect x="124" y="298" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="144" y="314" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a</text>
  <text x="184" y="314" font-size="11" fill="#4a7a3a" font-weight="bold">追加</text>
  <text x="234" y="314" font-size="11" fill="#555">a → [ a, z ]</text>

  <!-- final result -->
  <rect x="14" y="338" width="532" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="358" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">最终 4 组（map.values()）</text>
  <text x="280" y="376" text-anchor="middle" font-size="11" fill="#555">{abc, bcd, xyz} · {acef} · {az, ba} · {a, z}</text>
</svg>
