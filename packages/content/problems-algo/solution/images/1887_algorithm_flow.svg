<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 510" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="510" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：排序 + 一遍扫描累计层数</text>

  <!-- Start node -->
  <ellipse cx="280" cy="56" rx="120" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="12" fill="#333">开始：输入 nums</text>

  <!-- Arrow down to sort -->
  <path d="M 280 76 L 280 92" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Sort box -->
  <rect x="180" y="96" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="121" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">升序排序 nums</text>

  <!-- Arrow down -->
  <path d="M 280 136 L 280 152" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init box -->
  <rect x="170" y="156" width="220" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="181" text-anchor="middle" font-size="12" fill="#333">ans = 0, cnt = 0, i = 1</text>

  <!-- Arrow down to D1 -->
  <path d="M 280 196 L 280 214" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D1: i < n ? -->
  <polygon points="280,218 370,252 280,286 190,252" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="256" text-anchor="middle" font-size="12" fill="#333">i &lt; n ?</text>

  <!-- D1 No -> return ans (right) -->
  <path d="M 370 252 L 410 252" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="388" y="244" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <rect x="410" y="230" width="130" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="475" y="250" text-anchor="middle" font-size="10" fill="#333">遍历完毕</text>
  <text x="475" y="266" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 ans</text>

  <!-- D1 Yes -> D2 (down) -->
  <path d="M 280 286 L 280 308" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="304" font-size="11" fill="#82b366">是</text>

  <!-- D2: nums[i] != nums[i-1] ? -->
  <polygon points="280,312 390,346 280,380 170,346" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="11" fill="#333">nums[i] ≠ nums[i-1] ?</text>

  <!-- D2 Yes -> cnt++ (left) -->
  <path d="M 170 346 L 130 346" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="338" text-anchor="middle" font-size="11" fill="#82b366">是</text>
  <rect x="30" y="324" width="100" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="80" y="344" text-anchor="middle" font-size="10" fill="#333">进入新值层</text>
  <text x="80" y="360" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">cnt++</text>

  <!-- D2 No -> skip label (right small) -->
  <path d="M 390 346 L 420 346" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="405" y="338" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <rect x="420" y="324" width="110" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="475" y="344" text-anchor="middle" font-size="10" fill="#333">同值层</text>
  <text x="475" y="360" text-anchor="middle" font-size="10" fill="#446688">cnt 不变</text>

  <!-- merge: both branches down to ans+=cnt box -->
  <path d="M 80 368 L 80 408 L 280 408" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 475 368 L 475 408 L 280 408" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ans += cnt box -->
  <rect x="170" y="396" width="220" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="421" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">ans += cnt</text>

  <!-- Arrow down to i++ box -->
  <path d="M 280 436 L 280 456" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i++ box -->
  <rect x="220" y="460" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="480" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">i++</text>

  <!-- i++ loop back to D1 -->
  <path d="M 340 475 L 460 475 L 460 252" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="470" y="370" font-size="10" fill="#888" transform="rotate(-90 470 370)">下一元素</text>
</svg>
