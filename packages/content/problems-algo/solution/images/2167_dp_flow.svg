<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">DP 状态转移流程</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">left[] 从左到右递推，right[] 从右到左递推，最后枚举分割点合并</text>

  <!-- ===== Left DP section ===== -->
  <text x="30" y="66" font-size="11" fill="#446688" font-weight="bold">left[i]：处理 s[0..i] 全部 '1' 的最小代价</text>

  <!-- left[i-1] box -->
  <rect x="35" y="78" width="75" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="72" y="97" text-anchor="middle" font-size="11" fill="#333">left[i−1]</text>

  <!-- Arrow to choice 1 -->
  <path d="M 110 88 L 155 88" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Choice 1: direct removal -->
  <rect x="155" y="76" width="145" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="227" y="94" text-anchor="middle" font-size="10" fill="#333">直删 s[i]：left[i−1] + c</text>

  <!-- Arrow to left[i] from choice 1 -->
  <path d="M 300 90 L 360 90" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Choice 2: left removal -->
  <rect x="155" y="112" width="145" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="227" y="130" text-anchor="middle" font-size="10" fill="#333">左删全部：i + 1</text>

  <!-- Arrow to left[i] from choice 2 -->
  <path d="M 300 126 L 360 108" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- left[i] box -->
  <rect x="360" y="88" width="75" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="397" y="107" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">left[i]</text>

  <!-- min label -->
  <text x="335" y="82" text-anchor="middle" font-size="9" fill="#888">min</text>

  <!-- Separator -->
  <path d="M 20 158 L 500 158" stroke="#ddd" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <!-- ===== Right DP section ===== -->
  <text x="30" y="178" font-size="11" fill="#4a7a3a" font-weight="bold">right[i]：处理 s[i..n−1] 全部 '1' 的最小代价</text>

  <!-- right[i+1] box -->
  <rect x="35" y="190" width="75" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="72" y="209" text-anchor="middle" font-size="11" fill="#333">right[i+1]</text>

  <!-- Arrow to choice 1 -->
  <path d="M 110 200 L 155 200" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Choice 1: direct removal -->
  <rect x="155" y="188" width="145" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="227" y="206" text-anchor="middle" font-size="10" fill="#333">直删 s[i]：right[i+1] + c</text>

  <!-- Arrow to right[i] from choice 1 -->
  <path d="M 300 202 L 360 202" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Choice 2: right removal -->
  <rect x="155" y="224" width="145" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="227" y="242" text-anchor="middle" font-size="10" fill="#333">右删全部：n − i</text>

  <!-- Arrow to right[i] from choice 2 -->
  <path d="M 300 238 L 360 220" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- right[i] box -->
  <rect x="360" y="200" width="75" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="397" y="219" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">right[i]</text>

  <text x="335" y="194" text-anchor="middle" font-size="9" fill="#888">min</text>

  <!-- ===== Merge section ===== -->
  <path d="M 397 232 L 397 258" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- Answer formula box -->
  <rect x="55" y="260" width="410" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="280" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans = min (left[i] + right[i+1])</text>
  <text x="260" y="298" text-anchor="middle" font-size="10" fill="#666">枚举分割点 i ∈ [−1, n−1]；c = 2 if s[i]='1' else 0</text>

  <!-- Footer -->
  <text x="260" y="328" text-anchor="middle" font-size="10" fill="#888">两趟 O(n) 扫描 + 一次 O(n) 合并 → 总 O(n) 时间，O(n) 空间</text>
  <text x="260" y="346" text-anchor="middle" font-size="9.5" fill="#aaa">可优化至 O(1) 空间：将代价拆为 g(l)+h(r) 独立项，反向扫描维护 h 的前缀最小</text>
</svg>
