<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：按对角线 i+j=d 分组，偶数 d 向↗、奇数 d 向↙</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888">同一条对角线上 i+j 恒定；方向按 d 奇偶交替，逐条拼接即得输出</text>

  <!-- ===== 3x3 matrix, cell 50, origin x=70 y=78 ===== -->
  <!-- even d (0,2,4) = blue ; odd d (1,3) = green ; centers col 95,145,195 ; row 103,153,203 -->
  <g font-size="16" fill="#333">
    <!-- row 0 -->
    <rect x="70" y="78" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="95" y="110" text-anchor="middle">1</text>
    <rect x="120" y="78" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="145" y="110" text-anchor="middle">2</text>
    <rect x="170" y="78" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="195" y="110" text-anchor="middle">3</text>
    <!-- row 1 -->
    <rect x="70" y="128" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="95" y="160" text-anchor="middle">4</text>
    <rect x="120" y="128" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="145" y="160" text-anchor="middle">5</text>
    <rect x="170" y="128" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="195" y="160" text-anchor="middle">6</text>
    <!-- row 2 -->
    <rect x="70" y="178" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="95" y="210" text-anchor="middle">7</text>
    <rect x="120" y="178" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="145" y="210" text-anchor="middle">8</text>
    <rect x="170" y="178" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="195" y="210" text-anchor="middle">9</text>
  </g>

  <!-- small d=k labels in cell top-right corners -->
  <g font-size="8" fill="#888">
    <text x="117" y="88" text-anchor="end">d=0</text>
    <text x="167" y="88" text-anchor="end">d=1</text>
    <text x="217" y="88" text-anchor="end">d=2</text>
    <text x="117" y="138" text-anchor="end">d=1</text>
    <text x="167" y="138" text-anchor="end">d=2</text>
    <text x="217" y="138" text-anchor="end">d=3</text>
    <text x="117" y="188" text-anchor="end">d=2</text>
    <text x="167" y="188" text-anchor="end">d=3</text>
    <text x="217" y="188" text-anchor="end">d=4</text>
  </g>

  <!-- row/col index hints -->
  <text x="60" y="108" text-anchor="end" font-size="9" fill="#aaa">i=0</text>
  <text x="60" y="158" text-anchor="end" font-size="9" fill="#aaa">i=1</text>
  <text x="60" y="208" text-anchor="end" font-size="9" fill="#aaa">i=2</text>

  <!-- ===== diagonal cards on right ===== -->
  <text x="380" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">逐条对角线（按 d 升序）</text>

  <!-- d=0 ↗ [1]  cy=103 -->
  <text x="252" y="107" font-size="11" fill="#446688" font-weight="bold">d=0</text>
  <line x1="298" y1="110" x2="324" y2="96" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="345" y="107" font-size="11" fill="#446688">[ 1 ]</text>

  <!-- d=1 ↙ [2,4]  cy=133 -->
  <text x="252" y="137" font-size="11" fill="#4a7a3a" font-weight="bold">d=1</text>
  <line x1="324" y1="126" x2="298" y2="140" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="345" y="137" font-size="11" fill="#4a7a3a">[ 2, 4 ]</text>

  <!-- d=2 ↗ [7,5,3]  cy=163 -->
  <text x="252" y="167" font-size="11" fill="#446688" font-weight="bold">d=2</text>
  <line x1="298" y1="170" x2="324" y2="156" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="345" y="167" font-size="11" fill="#446688">[ 7, 5, 3 ]</text>

  <!-- d=3 ↙ [6,8]  cy=193 -->
  <text x="252" y="197" font-size="11" fill="#4a7a3a" font-weight="bold">d=3</text>
  <line x1="324" y1="186" x2="298" y2="200" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="345" y="197" font-size="11" fill="#4a7a3a">[ 6, 8 ]</text>

  <!-- d=4 ↗ [9]  cy=223 -->
  <text x="252" y="227" font-size="11" fill="#446688" font-weight="bold">d=4</text>
  <line x1="298" y1="230" x2="324" y2="216" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="345" y="227" font-size="11" fill="#446688">[ 9 ]</text>

  <!-- concatenation arrow -->
  <path d="M 380 244 L 380 266" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="392" y="260" font-size="10" fill="#b85450" font-weight="bold">拼接</text>

  <!-- ===== output array ===== -->
  <text x="60" y="276" font-size="10" fill="#888">输出 ans：</text>
  <g font-size="12">
    <!-- 1 B -->
    <rect x="100" y="282" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="120" y="302" text-anchor="middle" fill="#2a4a66">1</text>
    <!-- 2 G -->
    <rect x="142" y="282" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="162" y="302" text-anchor="middle" fill="#3a5a2a">2</text>
    <!-- 4 G -->
    <rect x="184" y="282" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="204" y="302" text-anchor="middle" fill="#3a5a2a">4</text>
    <!-- 7 B -->
    <rect x="226" y="282" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="246" y="302" text-anchor="middle" fill="#2a4a66">7</text>
    <!-- 5 B -->
    <rect x="268" y="282" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="288" y="302" text-anchor="middle" fill="#2a4a66">5</text>
    <!-- 3 B -->
    <rect x="310" y="282" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="330" y="302" text-anchor="middle" fill="#2a4a66">3</text>
    <!-- 6 G -->
    <rect x="352" y="282" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="372" y="302" text-anchor="middle" fill="#3a5a2a">6</text>
    <!-- 8 G -->
    <rect x="394" y="282" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="414" y="302" text-anchor="middle" fill="#3a5a2a">8</text>
    <!-- 9 B -->
    <rect x="436" y="282" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="456" y="302" text-anchor="middle" fill="#2a4a66">9</text>
  </g>

  <!-- legend + caption -->
  <rect x="40" y="328" width="480" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="56" y="340" width="14" height="11" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="76" y="350" font-size="10" fill="#555">偶数 d →↗（行减列增）</text>
  <rect x="220" y="340" width="14" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="240" y="350" font-size="10" fill="#555">奇数 d →↙（行增列减）</text>
  <text x="280" y="364" text-anchor="middle" font-size="10" fill="#555">i+j 相同即同对角线；d 从 0 到 m+n−2，奇偶交替决定方向</text>
</svg>
