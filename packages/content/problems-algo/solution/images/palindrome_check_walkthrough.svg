<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "abcda"，pref = [0, 1, 3, 7, 15, 14]</text>

  <!-- pref row illustration -->
  <text x="40" y="58" font-size="11" fill="#888" font-weight="bold">pref：</text>
  <rect x="90" y="44" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <text x="140" y="62" font-size="9" fill="#aaa">[0]</text>
  <rect x="170" y="44" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="195" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="220" y="62" font-size="9" fill="#aaa">[1]</text>
  <rect x="250" y="44" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="275" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="300" y="62" font-size="9" fill="#aaa">[2]</text>
  <rect x="330" y="44" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="355" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7</text>
  <text x="380" y="62" font-size="9" fill="#aaa">[3]</text>
  <rect x="410" y="44" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="435" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">15</text>
  <text x="465" y="62" font-size="9" fill="#aaa">[4]</text>
  <rect x="490" y="44" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="515" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">14</text>
  <text x="545" y="62" font-size="9" fill="#aaa">[5]</text>

  <!-- query table header -->
  <rect x="30" y="86" width="520" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="70" y="106" text-anchor="middle" font-size="10.5" fill="#444" font-weight="bold">query</text>
  <text x="150" y="106" text-anchor="middle" font-size="10.5" fill="#444" font-weight="bold">子串</text>
  <text x="240" y="106" text-anchor="middle" font-size="10.5" fill="#444" font-weight="bold">mask = XOR</text>
  <text x="330" y="106" text-anchor="middle" font-size="10.5" fill="#444" font-weight="bold">odd</text>
  <text x="400" y="106" text-anchor="middle" font-size="10.5" fill="#444" font-weight="bold">need=⌊odd/2⌋</text>
  <text x="490" y="106" text-anchor="middle" font-size="10.5" fill="#444" font-weight="bold">need&lt;=k ?</text>

  <!-- row 1 -->
  <rect x="30" y="118" width="520" height="28" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="136" text-anchor="middle" font-size="10" fill="#333">[3,3,0]</text>
  <text x="150" y="136" text-anchor="middle" font-size="10" fill="#333">"d"</text>
  <text x="240" y="136" text-anchor="middle" font-size="10" fill="#333">15^7=8</text>
  <text x="330" y="136" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="400" y="136" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="490" y="136" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">0&lt;=0 ✓</text>

  <!-- row 2 -->
  <rect x="30" y="148" width="520" height="28" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="166" text-anchor="middle" font-size="10" fill="#333">[1,2,0]</text>
  <text x="150" y="166" text-anchor="middle" font-size="10" fill="#333">"bc"</text>
  <text x="240" y="166" text-anchor="middle" font-size="10" fill="#333">7^1=6</text>
  <text x="330" y="166" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="400" y="166" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="490" y="166" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">1&lt;=0 ✗</text>

  <!-- row 3 -->
  <rect x="30" y="178" width="520" height="28" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="196" text-anchor="middle" font-size="10" fill="#333">[0,3,1]</text>
  <text x="150" y="196" text-anchor="middle" font-size="10" fill="#333">"abcd"</text>
  <text x="240" y="196" text-anchor="middle" font-size="10" fill="#333">15^0=15</text>
  <text x="330" y="196" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="400" y="196" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="490" y="196" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">2&lt;=1 ✗</text>

  <!-- row 4 -->
  <rect x="30" y="208" width="520" height="28" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="226" text-anchor="middle" font-size="10" fill="#333">[0,3,2]</text>
  <text x="150" y="226" text-anchor="middle" font-size="10" fill="#333">"abcd"</text>
  <text x="240" y="226" text-anchor="middle" font-size="10" fill="#333">15^0=15</text>
  <text x="330" y="226" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="400" y="226" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="490" y="226" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">2&lt;=2 ✓</text>

  <!-- row 5 -->
  <rect x="30" y="238" width="520" height="28" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="256" text-anchor="middle" font-size="10" fill="#333">[0,4,1]</text>
  <text x="150" y="256" text-anchor="middle" font-size="10" fill="#333">"abcda"</text>
  <text x="240" y="256" text-anchor="middle" font-size="10" fill="#333">14^0=14</text>
  <text x="330" y="256" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="400" y="256" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="490" y="256" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">1&lt;=1 ✓</text>

  <!-- result -->
  <rect x="30" y="278" width="520" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="304" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">answer = [true, false, false, true, true]</text>

  <!-- key insight boxes -->
  <rect x="30" y="332" width="250" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="155" y="352" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">观察 1：mask 只需奇偶性</text>
  <text x="42" y="372" font-size="10" fill="#444">"abcd" 4 字符全奇频 → odd=4</text>
  <text x="42" y="390" font-size="10" fill="#444">需 ⌊4/2⌋=2 次替换修两对</text>
  <text x="42" y="408" font-size="10" fill="#444">k=1 不够 ✗，k=2 够 ✓</text>
  <text x="42" y="428" font-size="10" fill="#888">同一子串不同 k → 不同答案</text>

  <rect x="300" y="332" width="250" height="110" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="425" y="352" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">观察 2：XOR 抵消成对字符</text>
  <text x="312" y="372" font-size="10" fill="#444">"abcda" 中 a 出现 2 次</text>
  <text x="312" y="390" font-size="10" fill="#444">bit0 两次 XOR 自动抵消 → 0</text>
  <text x="312" y="408" font-size="10" fill="#444">剩 b,c,d 奇 → odd=3</text>
  <text x="312" y="428" font-size="10" fill="#b85450" font-weight="bold">⌊3/2⌋=1，中间放 1 个奇即可</text>
</svg>
