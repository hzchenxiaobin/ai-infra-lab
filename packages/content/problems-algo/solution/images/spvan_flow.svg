<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">状压 BFS 算法流程</text>

  <!-- Step 1: init -->
  <rect x="150" y="48" width="260" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="70" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① 初始化：多源入队</text>
  <text x="280" y="88" text-anchor="middle" font-size="11" fill="#555">对所有 i ∈ [0,n)：入队 (i, 1&lt;&lt;i)，标记 visited</text>

  <path d="M 280 100 L 280 124" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: pop layer -->
  <rect x="150" y="128" width="260" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="150" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">② 按层弹出状态 (u, mask)</text>
  <text x="280" y="168" text-anchor="middle" font-size="11" fill="#555">一层一层处理，steps 记录当前层数</text>

  <path d="M 280 180 L 280 200" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: mask == full? -->
  <polygon points="280,204 380,244 280,284 180,244" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="240" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">mask ==</text>
  <text x="280" y="256" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">(1&lt;&lt;n)-1 ?</text>

  <!-- Yes branch -->
  <path d="M 380 244 L 440 244" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="398" y="238" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <rect x="442" y="218" width="100" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="492" y="240" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回</text>
  <text x="492" y="258" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">steps</text>

  <!-- No branch -->
  <path d="M 280 284 L 280 308" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="300" font-size="11" fill="#666">否</text>

  <!-- Step 3: expand neighbors -->
  <rect x="120" y="312" width="320" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="334" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">③ 遍历 u 的邻居 v</text>
  <text x="280" y="352" text-anchor="middle" font-size="11" fill="#555">nxt = mask | (1&lt;&lt;v)</text>
  <text x="280" y="368" text-anchor="middle" font-size="11" fill="#555">若 !visited[v][nxt]：入队并标记</text>

  <path d="M 280 374 L 280 396" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: layer done -->
  <rect x="150" y="400" width="260" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="424" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">④ 本层处理完，steps += 1</text>

  <!-- loop back arrow -->
  <path d="M 150 420 Q 60 420 60 154 L 60 154 Q 60 154 148 154" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="70" y="290" font-size="10" fill="#4a7a3a" font-weight="bold">回到 ②</text>
  <text x="70" y="304" font-size="10" fill="#888">处理下一层</text>

  <!-- Footnote -->
  <text x="280" y="458" text-anchor="middle" font-size="10" fill="#888">无权图按层 BFS：首次弹出 mask=full 的层数即最短边数</text>
</svg>
