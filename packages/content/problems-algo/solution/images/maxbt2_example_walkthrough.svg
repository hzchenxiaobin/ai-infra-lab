<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arro" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="580" height="470" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：val=5（篡位新根）与 val=3（下行落叶）</text>

  <!-- ============ 示例 1 ============ -->
  <text x="20" y="50" font-size="12" fill="#b85450" font-weight="bold">示例 1：root=[4,1,3,null,null,2]，val=5</text>

  <!-- before tree -->
  <text x="100" y="66" text-anchor="middle" font-size="10" fill="#888">原树</text>
  <line x1="88" y1="84" x2="74" y2="108" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="112" y1="84" x2="126" y2="108" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="120" y1="128" x2="112" y2="152" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
  <circle cx="100" cy="78" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="83" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">4</text>
  <circle cx="70" cy="118" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="122" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <circle cx="130" cy="118" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="122" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
  <circle cx="114" cy="162" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="114" y="166" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">2</text>

  <!-- arrow -->
  <path d="M 160 98 L 220 98" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="190" y="90" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">5 &gt; 4</text>
  <text x="190" y="112" text-anchor="middle" font-size="9" fill="#d6a040">篡位为新根</text>

  <!-- after tree -->
  <text x="330" y="66" text-anchor="middle" font-size="10" fill="#888">插入后 [5,4,null,1,3,null,null,2]</text>
  <line x1="320" y1="84" x2="306" y2="108" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="296" y1="128" x2="286" y2="152" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="308" y1="128" x2="320" y2="152" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="316" y1="172" x2="308" y2="196" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="330" cy="78" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="330" y="83" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">5</text>
  <circle cx="300" cy="118" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="122" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">4</text>
  <circle cx="282" cy="162" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="282" y="166" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">1</text>
  <circle cx="322" cy="162" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="322" y="166" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">3</text>
  <circle cx="306" cy="204" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="306" y="208" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">2</text>

  <!-- step annotation ex1 -->
  <rect x="440" y="78" width="128" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="452" y="96" font-size="10" fill="#d6a040" font-weight="bold">递归第 1 层</text>
  <text x="452" y="112" font-size="10" fill="#555">node=4, 5&gt;4</text>
  <text x="452" y="126" font-size="10" fill="#555">→ ① 篡位</text>

  <!-- divider -->
  <line x1="20" y1="230" x2="560" y2="230" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ============ 示例 2 ============ -->
  <text x="20" y="252" font-size="12" fill="#b85450" font-weight="bold">示例 2：root=[5,2,4,null,1]，val=3</text>

  <!-- before tree with descent path -->
  <text x="100" y="268" text-anchor="middle" font-size="10" fill="#888">原树（右脊 5→4 高亮）</text>
  <line x1="88" y1="286" x2="74" y2="310" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="112" y1="286" x2="126" y2="310" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <line x1="80" y1="330" x2="88" y2="354" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
  <circle cx="100" cy="280" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="100" y="285" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">5</text>
  <circle cx="70" cy="320" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="324" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <circle cx="130" cy="320" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="130" y="324" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">4</text>
  <circle cx="92" cy="364" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="92" y="368" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">1</text>

  <!-- descent arrows -->
  <text x="148" y="296" font-size="9" fill="#b85450" font-weight="bold">①3&lt;5</text>
  <text x="148" y="334" font-size="9" fill="#b85450" font-weight="bold">②3&lt;4</text>

  <!-- arrow -->
  <path d="M 160 300 L 220 300" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="190" y="292" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">下行</text>
  <text x="190" y="314" text-anchor="middle" font-size="9" fill="#d6a040">落为 4 的右子</text>

  <!-- after tree -->
  <text x="330" y="268" text-anchor="middle" font-size="10" fill="#888">插入后 [5,2,4,null,1,null,3]</text>
  <line x1="318" y1="286" x2="304" y2="310" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="342" y1="286" x2="356" y2="310" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="306" y1="330" x2="316" y2="354" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="360" y1="330" x2="372" y2="354" stroke="#999" stroke-width="1.1" filter="url(#rough2)"/>
  <circle cx="330" cy="280" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="285" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">5</text>
  <circle cx="300" cy="320" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="324" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <circle cx="360" cy="320" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="324" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">4</text>
  <circle cx="316" cy="364" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="316" y="368" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">1</text>
  <circle cx="378" cy="364" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="378" y="368" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3</text>

  <!-- step annotation ex2 -->
  <rect x="440" y="280" width="128" height="92" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="452" y="298" font-size="10" fill="#446688" font-weight="bold">递归第 1 层</text>
  <text x="452" y="312" font-size="10" fill="#555">node=5, 3&lt;5</text>
  <text x="452" y="324" font-size="10" fill="#555">→ ② 下行到 4</text>
  <text x="452" y="344" font-size="10" fill="#4a7a3a" font-weight="bold">递归第 2 层</text>
  <text x="452" y="358" font-size="10" fill="#555">node=4, 3&lt;4</text>
  <text x="452" y="370" font-size="10" fill="#555">→ ③ 落叶</text>

  <!-- bottom compare -->
  <rect x="20" y="392" width="540" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="290" y="414" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">对照：val=5 在第一层即「更大」篡位为根；val=3 一路「更小」下行到底落为叶子</text>
  <text x="290" y="434" text-anchor="middle" font-size="10" fill="#3a5a2a">val 插入深度 = 右脊上「第一个比 val 小的节点」位置；右脊即 val 的左侧最近更大值链</text>
</svg>
