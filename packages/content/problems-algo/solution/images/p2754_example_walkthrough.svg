<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：f.bindPolyfill({ x: 10 })(5) → 50</text>

  <!-- Step 1: define f -->
  <rect x="30" y="42" width="460" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="48" y="63" font-size="12" fill="#333" font-weight="bold">① 定义函数</text>
  <text x="160" y="63" font-size="11" fill="#555">function f(multiplier) { return this.x * multiplier; }</text>
  <text x="48" y="79" font-size="9" fill="#aaa">this.x 未绑定，直接调用返回 NaN</text>

  <path d="M 260 86 L 260 104" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 2: bind -->
  <rect x="30" y="108" width="460" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="48" y="130" font-size="12" fill="#333" font-weight="bold">② 绑定上下文</text>
  <text x="160" y="130" font-size="11" fill="#555">const bound = f.bindPolyfill({ x: 10 })</text>
  <text x="48" y="150" font-size="10" fill="#4a7a3a">闭包捕获：fn = f, obj = { x: 10 }</text>
  <text x="300" y="150" font-size="10" fill="#888">→ 返回箭头函数</text>

  <path d="M 260 164 L 260 182" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Step 3: call bound(5) -->
  <rect x="30" y="186" width="460" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="48" y="208" font-size="12" fill="#333" font-weight="bold">③ 调用 bound(5)</text>
  <text x="170" y="208" font-size="11" fill="#555">args = [5]</text>
  <text x="48" y="228" font-size="10" fill="#b85450" font-weight="bold">执行：fn.call(obj, ...args) → f.call({ x: 10 }, 5)</text>

  <path d="M 260 242 L 260 260" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Step 4: resolve this.x -->
  <rect x="30" y="264" width="220" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="48" y="286" font-size="12" fill="#333" font-weight="bold">④ this 绑定为 obj</text>
  <text x="48" y="306" font-size="11" fill="#b85450">this.x = obj.x = 10</text>

  <!-- arrow to result -->
  <path d="M 250 292 L 280 292" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Step 5: result -->
  <rect x="280" y="264" width="210" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="385" y="288" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">⑤ 返回 10 × 5</text>
  <text x="385" y="310" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">= 50 ✓</text>

  <!-- Key insight box -->
  <rect x="30" y="338" width="460" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="48" y="358" font-size="11" fill="#333" font-weight="bold">关键：箭头函数无自己的 this</text>
  <text x="48" y="376" font-size="10" fill="#555">箭头函数内的 this 来自 bindPolyfill 的 this（= f），obj 通过闭包变量传入</text>
</svg>
