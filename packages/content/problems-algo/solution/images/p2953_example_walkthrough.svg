<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：word = "igigee"，k = 2</text>

  <!-- 字符串与相邻差 -->
  <rect x="110" y="38" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="59" text-anchor="middle" font-size="13" fill="#333">i</text>
  <rect x="150" y="38" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="59" text-anchor="middle" font-size="13" fill="#333">g</text>
  <rect x="190" y="38" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="59" text-anchor="middle" font-size="13" fill="#333">i</text>
  <rect x="230" y="38" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="59" text-anchor="middle" font-size="13" fill="#333">g</text>
  <rect x="270" y="38" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="59" text-anchor="middle" font-size="13" fill="#333">e</text>
  <rect x="310" y="38" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="59" text-anchor="middle" font-size="13" fill="#333">e</text>

  <text x="150" y="86" text-anchor="middle" font-size="11" fill="#4a7a3a">2</text>
  <text x="190" y="86" text-anchor="middle" font-size="11" fill="#4a7a3a">2</text>
  <text x="230" y="86" text-anchor="middle" font-size="11" fill="#4a7a3a">2</text>
  <text x="270" y="86" text-anchor="middle" font-size="11" fill="#4a7a3a">2</text>
  <text x="310" y="86" text-anchor="middle" font-size="11" fill="#4a7a3a">0</text>

  <text x="280" y="108" text-anchor="middle" font-size="11" fill="#555">相邻差全部 ≤ 2 → 整串一段（长 6），m 至多 3</text>

  <!-- m = 1 -->
  <text x="30" y="140" font-size="12" fill="#446688" font-weight="bold">m=1，win=2</text>

  <rect x="150" y="148" width="50" height="30" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="168" text-anchor="middle" font-size="12" fill="#777">ig</text>
  <rect x="208" y="148" width="50" height="30" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="233" y="168" text-anchor="middle" font-size="12" fill="#777">gi</text>
  <rect x="266" y="148" width="50" height="30" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="291" y="168" text-anchor="middle" font-size="12" fill="#777">ig</text>
  <rect x="324" y="148" width="50" height="30" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="349" y="168" text-anchor="middle" font-size="12" fill="#777">ge</text>
  <rect x="382" y="148" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="407" y="168" text-anchor="middle" font-size="12" fill="#333">ee</text>

  <text x="407" y="194" text-anchor="middle" font-size="11" fill="#4a7a3a">e×2 → valid=1=m ✓ +1</text>
  <text x="233" y="194" text-anchor="middle" font-size="11" fill="#999">其余无「单字符 ×2」</text>

  <!-- m = 2 -->
  <text x="30" y="226" font-size="12" fill="#446688" font-weight="bold">m=2，win=4</text>

  <rect x="150" y="234" width="74" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="187" y="254" text-anchor="middle" font-size="12" fill="#333">igig</text>
  <rect x="236" y="234" width="74" height="30" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="273" y="254" text-anchor="middle" font-size="12" fill="#777">gige</text>
  <rect x="322" y="234" width="74" height="30" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="359" y="254" text-anchor="middle" font-size="12" fill="#777">igee</text>

  <text x="187" y="280" text-anchor="middle" font-size="11" fill="#4a7a3a">i×2, g×2 → valid=2=m ✓ +1</text>
  <text x="310" y="280" text-anchor="middle" font-size="11" fill="#999">种类数 ≠ 2 或计数非 k</text>

  <!-- m = 3 -->
  <text x="30" y="312" font-size="12" fill="#446688" font-weight="bold">m=3，win=6</text>

  <rect x="150" y="320" width="112" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="206" y="340" text-anchor="middle" font-size="12" fill="#333">igigee</text>

  <text x="206" y="366" text-anchor="middle" font-size="11" fill="#4a7a3a">i×2, g×2, e×2 → valid=3=m ✓ +1</text>

  <!-- 汇总 -->
  <rect x="170" y="386" width="220" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="407" text-anchor="middle" font-size="13" fill="#333">ans = 1 + 1 + 1 = 3 ✓</text>
</svg>
