<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#444" font-weight="bold" filter="url(#rough2)">O(1) 贪心流程：算三个实效单价，先配对后单补</text>

  <!-- 开始 -->
  <ellipse cx="260" cy="50" rx="44" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="55" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">开始</text>
  <path d="M 260 66 L 260 80" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 输入 -->
  <rect x="140" y="84" width="240" height="26" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="101" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">读入 cost1, cost2, costBoth, need1, need2</text>
  <path d="M 260 110 L 260 124" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- k -->
  <rect x="140" y="128" width="240" height="26" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="145" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">k ← min(need1, need2)</text>
  <path d="M 260 154 L 260 168" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 三个单价 -->
  <path d="M 260 168 L 260 176" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 100 176 L 100 184 M 260 176 L 260 184 M 420 176 L 420 184" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="30" y="188" width="140" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="100" y="207" text-anchor="middle" font-size="10.5" fill="#8a3a34" font-weight="bold">cPair ←</text>
    <text x="100" y="223" text-anchor="middle" font-size="9.5" fill="#8a3a34">min(costBoth,</text>
    <text x="100" y="236" text-anchor="middle" font-size="9.5" fill="#8a3a34">cost1 + cost2)</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="190" y="188" width="140" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="260" y="207" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold">only1 ←</text>
    <text x="260" y="223" text-anchor="middle" font-size="9.5" fill="#8a6d1f">min(cost1,</text>
    <text x="260" y="236" text-anchor="middle" font-size="9.5" fill="#8a6d1f">costBoth)</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="350" y="188" width="140" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="420" y="207" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold">only2 ←</text>
    <text x="420" y="223" text-anchor="middle" font-size="9.5" fill="#2f5d24">min(cost2,</text>
    <text x="420" y="236" text-anchor="middle" font-size="9.5" fill="#2f5d24">costBoth)</text>
  </g>

  <!-- 汇合箭头 -->
  <path d="M 100 244 L 100 258 L 260 258 L 260 266 M 260 258 L 260 266 M 420 244 L 420 258" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 260 262 L 260 270" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 公式 -->
  <rect x="55" y="274" width="410" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="293" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">ans ← k·cPair + (need1−k)·only1 + (need2−k)·only2</text>
  <path d="M 260 304 L 260 316" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 返回 -->
  <ellipse cx="260" cy="332" rx="44" ry="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="336" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <!-- 溢出警示 -->
  <g filter="url(#rough2)">
    <rect x="392" y="60" width="118" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="451" y="78" text-anchor="middle" font-size="9.5" fill="#8a3a34" font-weight="bold">⚠ 中间乘积约</text>
    <text x="451" y="92" text-anchor="middle" font-size="9.5" fill="#8a3a34" font-weight="bold">4×10¹⁵ 量级</text>
    <text x="451" y="105" text-anchor="middle" font-size="9.5" fill="#8a3a34">C++ 用 long long</text>
  </g>
</svg>
