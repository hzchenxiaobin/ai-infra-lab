<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1 演算：每次加边后重算一遍 dist</text>

  <rect x="30" y="48" width="460" height="168" fill="none" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <path d="M 120 48 L 120 216" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 210 48 L 210 216" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 420 48 L 420 216" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 252 48 L 252 216" stroke="#c8cfd8" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 294 48 L 294 216" stroke="#c8cfd8" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 336 48 L 336 216" stroke="#c8cfd8" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 378 48 L 378 216" stroke="#c8cfd8" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 30 80 L 490 80" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 30 114 L 490 114" stroke="#446688" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 30 148 L 490 148" stroke="#446688" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 30 182 L 490 182" stroke="#446688" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <text x="75" y="68" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">阶段</text>
  <text x="165" y="68" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">新增道路</text>
  <text x="315" y="68" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">dist[0…4]</text>
  <text x="455" y="68" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">answer</text>

  <text x="75" y="101" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#rough2)">初始</text>
  <text x="165" y="101" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">—</text>
  <text x="231" y="101" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="273" y="101" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="315" y="101" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="357" y="101" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="399" y="101" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="455" y="101" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">—</text>

  <text x="75" y="135" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#rough2)">查询 ①</text>
  <text x="165" y="135" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">(2,4)</text>
  <text x="231" y="135" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="273" y="135" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="315" y="135" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="357" y="135" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <ellipse cx="399" cy="131" rx="10" ry="9" fill="none" stroke="#b85450" stroke-width="1.3" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="399" y="135" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="455" y="135" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>

  <text x="75" y="169" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#rough2)">查询 ②</text>
  <text x="165" y="169" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">(0,2)</text>
  <text x="231" y="169" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="273" y="169" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <ellipse cx="315" cy="165" rx="10" ry="9" fill="none" stroke="#b85450" stroke-width="1.3" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="315" y="169" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <ellipse cx="357" cy="165" rx="10" ry="9" fill="none" stroke="#b85450" stroke-width="1.3" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="357" y="169" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <ellipse cx="399" cy="165" rx="10" ry="9" fill="none" stroke="#b85450" stroke-width="1.3" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="399" y="169" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="455" y="169" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>

  <text x="75" y="203" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#rough2)">查询 ③</text>
  <text x="165" y="203" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">(0,4)</text>
  <text x="231" y="203" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="273" y="203" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="315" y="203" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="357" y="203" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <ellipse cx="399" cy="199" rx="10" ry="9" fill="none" stroke="#b85450" stroke-width="1.3" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="399" y="203" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="455" y="203" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="30" y="230" width="460" height="118" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="254" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">三个看点</text>
  <text x="260" y="276" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">答案 4→3→2→1 单调不增：边只增不减，路径越来越多</text>
  <text x="260" y="296" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">查询 ② 只加一条 (0,2)，dist[2…4] 却全被拉低：影响向后传导</text>
  <text x="260" y="316" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">影响面难以局部圈定 → 干脆每次整图重跑 BFS</text>
  <text x="260" y="336" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">dist[3] 与答案无关，只是 BFS 顺带的副产品</text>
</svg>
