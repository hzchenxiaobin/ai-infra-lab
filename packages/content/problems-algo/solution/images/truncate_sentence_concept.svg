<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="600" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：第 k 个空格即截断点（k = 4）</text>

  <!-- Word 1: Hello (kept - green) -->
  <rect x="40" y="70" width="70" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="75" y="95" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">Hello</text>
  <text x="75" y="124" text-anchor="middle" font-size="10" fill="#4a7a3a">词 1</text>

  <!-- space 1 -->
  <rect x="110" y="70" width="16" height="40" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="118" y="95" text-anchor="middle" font-size="10" fill="#aaa">·</text>
  <text x="118" y="124" text-anchor="middle" font-size="9" fill="#aaa">sp1</text>

  <!-- Word 2: how -->
  <rect x="126" y="70" width="50" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="151" y="95" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">how</text>
  <text x="151" y="124" text-anchor="middle" font-size="10" fill="#4a7a3a">词 2</text>

  <!-- space 2 -->
  <rect x="176" y="70" width="16" height="40" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="184" y="95" text-anchor="middle" font-size="10" fill="#aaa">·</text>
  <text x="184" y="124" text-anchor="middle" font-size="9" fill="#aaa">sp2</text>

  <!-- Word 3: are -->
  <rect x="192" y="70" width="50" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="217" y="95" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">are</text>
  <text x="217" y="124" text-anchor="middle" font-size="10" fill="#4a7a3a">词 3</text>

  <!-- space 3 -->
  <rect x="242" y="70" width="16" height="40" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="250" y="95" text-anchor="middle" font-size="10" fill="#aaa">·</text>
  <text x="250" y="124" text-anchor="middle" font-size="9" fill="#aaa">sp3</text>

  <!-- Word 4: you (last kept - bold green) -->
  <rect x="258" y="70" width="50" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="283" y="95" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">you</text>
  <text x="283" y="124" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">词 4</text>

  <!-- space 4: CUT POINT (red) -->
  <rect x="308" y="64" width="20" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="318" y="95" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✂</text>
  <text x="318" y="130" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">第4个空格</text>
  <text x="318" y="144" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">= 截断点</text>

  <!-- Word 5: Contestant (dropped - greyed) -->
  <rect x="328" y="70" width="110" height="40" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <text x="383" y="95" text-anchor="middle" font-size="13" fill="#aaa" font-weight="bold">Contestant</text>
  <text x="383" y="124" text-anchor="middle" font-size="10" fill="#aaa">词 5（丢弃）</text>

  <!-- Scissors cut line (vertical dashed) -->
  <path d="M 318 50 L 318 168" stroke="#b85450" stroke-width="2" stroke-dasharray="6,4" fill="none" filter="url(#rough2)"/>

  <!-- Kept bracket -->
  <path d="M 40 160 Q 40 168 46 168 L 308 168 Q 308 160 308 168" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="174" y="184" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">保留：s[0..i-1] = 前 k 个单词</text>

  <!-- Result box -->
  <rect x="120" y="200" width="320" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="140" y="222" font-size="11" fill="#555">返回：</text>
  <text x="185" y="223" font-size="13" fill="#4a7a3a" font-weight="bold">"Hello how are you"</text>

  <!-- Core idea box -->
  <rect x="40" y="252" width="520" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="278" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">关键直觉：单词边界 = 空格位置</text>
  <text x="300" y="300" text-anchor="middle" font-size="11" fill="#666">单词间「单个空格、无多余空格」⇒ 第 k 个空格左侧即前 k 个单词</text>
  <text x="300" y="318" text-anchor="middle" font-size="11" fill="#666">cnt == k 时 return s[0..i-1]；无第 k 个空格则 return s</text>
  <text x="300" y="336" text-anchor="middle" font-size="10" fill="#888">一次线性扫描 + 提前返回，辅助空间 O(1)</text>
</svg>
