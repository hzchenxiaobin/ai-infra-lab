<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：best 沿树下跌，每条下跌边就地补差</text>

  <!-- 左：演示树 -->
  <text x="24" y="52" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">演示树（圈内为 cost）cost = [2,1,6,1,4]</text>

  <!-- 树边：红 = 下跌边，蓝 = 持平边 -->
  <path d="M105,122 L70,160" stroke="#b85450" stroke-width="2.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M138,114 L208,166" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M56,200 L45,240" stroke="#b85450" stroke-width="2.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M78,195 L118,243" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 下跌边上的补差标注 -->
  <text x="102" y="136" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">+1</text>
  <text x="70" y="224" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">+3</text>

  <!-- 节点 0（根） -->
  <circle cx="120" cy="100" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <text x="150" y="98" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">best 8</text>

  <!-- 节点 1（被补差，红） -->
  <circle cx="65" cy="180" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="65" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <text x="8" y="178" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">best 7</text>

  <!-- 节点 2（叶，蓝） -->
  <circle cx="218" cy="180" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="218" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">6</text>
  <text x="246" y="176" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">best 8</text>
  <text x="218" y="214" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">得分 8</text>

  <!-- 节点 3（被补差，红） -->
  <circle cx="42" cy="262" r="19" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="42" y="267" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <text x="70" y="256" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">best 4</text>
  <text x="42" y="296" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">得分 4</text>

  <!-- 节点 4（叶，蓝） -->
  <circle cx="128" cy="262" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="128" y="267" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>
  <text x="156" y="256" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">best 7</text>
  <text x="128" y="296" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">得分 7</text>

  <text x="24" y="316" font-size="9.5" fill="#b85450" filter="url(#rough2)">红边 = 下跌边（best 下降），+n 为就地补差量；红圈 = 被增加的节点</text>

  <!-- 右：三步读图 -->
  <text x="280" y="52" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">三步读图</text>

  <rect x="280" y="62" width="235" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="397" y="80" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333" filter="url(#rough2)">① 路径得分 4 / 7 / 8</text>
  <text x="397" y="97" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">终值取 T = 8（最大路径和）</text>

  <path d="M397,106 L397,114" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="280" y="116" width="235" height="58" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="397" y="134" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333" filter="url(#rough2)">② best(v) = 经过 v 的最大得分</text>
  <text x="397" y="151" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">沿树单调不增：8 → 7 → 4</text>
  <text x="397" y="167" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">（只在红边处下跌）</text>

  <path d="M397,174 L397,182" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="280" y="184" width="235" height="62" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="397" y="202" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333" filter="url(#rough2)">③ 每条下跌边就地补差</text>
  <text x="397" y="219" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">(0,1)：8→7 ⇒ 节点 1 加 1</text>
  <text x="397" y="236" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">(1,3)：7→4 ⇒ 节点 3 加 3</text>

  <path d="M397,246 L397,254" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="280" y="256" width="235" height="56" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="397" y="274" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333" filter="url(#rough2)">④ 验证：4+1+3 = 8 ✓</text>
  <text x="397" y="291" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">7+1 = 8 ✓，8 不变 ✓</text>
  <text x="397" y="307" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">答案 = 下跌边条数 = 2</text>

  <!-- 底部洞察 -->
  <rect x="25" y="326" width="490" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="346" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333" filter="url(#rough2)">best 沿树单调不增；每条下跌边 (p,v) 必须在 v 的子树内就地补 best(p)−best(v)</text>
  <text x="270" y="363" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">根到叶路径上的增量望远镜求和 = T − S(叶) ⇒ 所有终值恰为 T</text>
  <text x="270" y="380" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">不同下跌边强制的节点互不相同 ⇒ 上界 = 下界 = 下跌边条数</text>
</svg>
