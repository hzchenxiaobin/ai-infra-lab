<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：words = ["abc","car","ada","racecar","cool"]</text>

  <!-- ====== Row 0: abc - not palindrome ====== -->
  <text x="36" y="68" font-size="11" fill="#444" font-weight="bold">words[0] = "abc"</text>
  <rect x="160" y="54" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="76" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>
  <rect x="200" y="54" width="40" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="76" text-anchor="middle" font-size="15" fill="#999">b</text>
  <rect x="240" y="54" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="76" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">c</text>
  <text x="180" y="48" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">l↓</text>
  <text x="260" y="48" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">r↓</text>
  <text x="330" y="76" font-size="11" fill="#b85450" font-weight="bold">→ 'a' ≠ 'c'，非回文，跳过</text>

  <!-- divider -->
  <path d="M 30 104 L 530 104" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ====== Row 1: car - not palindrome ====== -->
  <text x="36" y="134" font-size="11" fill="#444" font-weight="bold">words[1] = "car"</text>
  <rect x="160" y="120" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="142" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">c</text>
  <rect x="200" y="120" width="40" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="142" text-anchor="middle" font-size="15" fill="#999">a</text>
  <rect x="240" y="120" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="142" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">r</text>
  <text x="180" y="114" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">l↓</text>
  <text x="260" y="114" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">r↓</text>
  <text x="330" y="142" font-size="11" fill="#b85450" font-weight="bold">→ 'c' ≠ 'r'，非回文，跳过</text>

  <!-- divider -->
  <path d="M 30 170 L 530 170" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ====== Row 2: ada - palindrome! ====== -->
  <text x="36" y="200" font-size="11" fill="#4a7a3a" font-weight="bold">words[2] = "ada"</text>
  <!-- step a: l=0,r=2 compare a vs a -->
  <rect x="160" y="186" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="208" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>
  <rect x="200" y="186" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="220" y="208" text-anchor="middle" font-size="15" fill="#d6a040">d</text>
  <rect x="240" y="186" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="208" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>
  <text x="180" y="180" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">l↓</text>
  <text x="260" y="180" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">r↓</text>
  <text x="330" y="208" font-size="11" fill="#4a7a3a" font-weight="bold">→ 'a' == 'a' ✅ 收拢</text>

  <!-- step b: l=1, r=1 stop -->
  <rect x="160" y="232" width="40" height="34" fill="#e8f0fe" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="254" text-anchor="middle" font-size="15" fill="#999">a</text>
  <rect x="200" y="232" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="254" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">d</text>
  <rect x="240" y="232" width="40" height="34" fill="#e8f0fe" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="254" text-anchor="middle" font-size="15" fill="#999">a</text>
  <text x="220" y="226" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">l=r↓</text>
  <text x="330" y="254" font-size="11" fill="#4a7a3a" font-weight="bold">→ l ≥ r 停止，是回文 ✓</text>

  <!-- divider -->
  <path d="M 30 282 L 530 282" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ====== Remaining words skipped ====== -->
  <text x="36" y="312" font-size="11" fill="#888" font-weight="bold">words[3..4]</text>
  <rect x="160" y="298" width="280" height="34" fill="#f4f4f4" stroke="#ccc" stroke-width="1.2" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="300" y="320" text-anchor="middle" font-size="11" fill="#888">已命中短路返回，无需检查 "racecar"/"cool"</text>

  <!-- ====== Result ====== -->
  <path d="M 30 348 L 530 348" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="120" y="360" width="320" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="381" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">返回 "ada" ✓（第 3 个词，仅比 2 对字符）</text>
</svg>
