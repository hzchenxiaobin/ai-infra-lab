<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [4,4,4,5,6]</text>

  <!-- nums array -->
  <text x="118" y="60" text-anchor="end" font-size="11.5" fill="#888">nums:</text>
  <rect x="154" y="40" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="176" y="62" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="206" y="40" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="228" y="62" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="258" y="40" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="310" y="40" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="332" y="62" text-anchor="middle" font-size="13" fill="#333">5</text>
  <rect x="362" y="40" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="384" y="62" text-anchor="middle" font-size="13" fill="#333">6</text>
  <text x="176" y="86" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="228" y="86" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="280" y="86" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="332" y="86" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="384" y="86" text-anchor="middle" font-size="10" fill="#888">4</text>
  <text x="424" y="60" font-size="10" fill="#446688">← [4,4]</text>
  <text x="424" y="74" font-size="10" fill="#d6a040">← [4,5,6]</text>

  <!-- table frame -->
  <rect x="30" y="98" width="500" height="210" fill="none" stroke="#cfcfcf" stroke-width="1.2" rx="6" filter="url(#rough2)"/>

  <!-- header -->
  <rect x="30" y="98" width="500" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="65" y="116" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">i</text>
  <text x="175" y="116" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">末段子段</text>
  <text x="350" y="116" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">三类检查</text>
  <text x="490" y="116" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">dp[i]</text>
  <line x1="100" y1="98" x2="100" y2="308" stroke="#cfcfcf" stroke-width="1" filter="url(#rough2)"/>
  <line x1="250" y1="98" x2="250" y2="308" stroke="#cfcfcf" stroke-width="1" filter="url(#rough2)"/>
  <line x1="450" y1="98" x2="450" y2="308" stroke="#cfcfcf" stroke-width="1" filter="url(#rough2)"/>

  <!-- row i=0 -->
  <text x="65" y="138" text-anchor="middle" font-size="11.5" fill="#333">0</text>
  <text x="175" y="138" text-anchor="middle" font-size="11" fill="#888">—（空前缀）</text>
  <text x="350" y="138" text-anchor="middle" font-size="11" fill="#888">基准</text>
  <text x="490" y="138" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">T</text>
  <line x1="30" y1="146" x2="530" y2="146" stroke="#e8e8e8" stroke-width="1" filter="url(#rough2)"/>

  <!-- row i=1 -->
  <text x="65" y="164" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="175" y="164" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="350" y="164" text-anchor="middle" font-size="11" fill="#999">i&lt;2，无法成段</text>
  <text x="490" y="164" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">F</text>
  <line x1="30" y1="172" x2="530" y2="172" stroke="#e8e8e8" stroke-width="1" filter="url(#rough2)"/>

  <!-- row i=2 -->
  <rect x="30" y="172" width="500" height="26" fill="#e6f4ea" opacity="0.5" filter="url(#rough2)"/>
  <text x="65" y="190" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <text x="175" y="190" text-anchor="middle" font-size="11" fill="#446688">[4,4]</text>
  <text x="350" y="190" text-anchor="middle" font-size="11" fill="#4a7a3a">①4=4 ✓ ∧ dp0 ✓</text>
  <text x="490" y="190" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">T</text>
  <line x1="30" y1="198" x2="530" y2="198" stroke="#e8e8e8" stroke-width="1" filter="url(#rough2)"/>

  <!-- row i=3 -->
  <rect x="30" y="198" width="500" height="26" fill="#e6f4ea" opacity="0.5" filter="url(#rough2)"/>
  <text x="65" y="216" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <text x="175" y="216" text-anchor="middle" font-size="11" fill="#446688">[4,4,4]</text>
  <text x="350" y="216" text-anchor="middle" font-size="11" fill="#4a7a3a">②4=4=4 ✓ ∧ dp0 ✓</text>
  <text x="490" y="216" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">T</text>
  <line x1="30" y1="224" x2="530" y2="224" stroke="#e8e8e8" stroke-width="1" filter="url(#rough2)"/>

  <!-- row i=4 -->
  <rect x="30" y="224" width="500" height="26" fill="#fce4ec" opacity="0.45" filter="url(#rough2)"/>
  <text x="65" y="242" text-anchor="middle" font-size="11.5" fill="#333">4</text>
  <text x="175" y="242" text-anchor="middle" font-size="11" fill="#888">[4,5]/[4,4,5]</text>
  <text x="350" y="242" text-anchor="middle" font-size="11" fill="#b85450">①②③ 全不成立</text>
  <text x="490" y="242" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">F</text>
  <line x1="30" y1="250" x2="530" y2="250" stroke="#e8e8e8" stroke-width="1" filter="url(#rough2)"/>

  <!-- row i=5 -->
  <rect x="30" y="250" width="500" height="26" fill="#e6f4ea" opacity="0.5" filter="url(#rough2)"/>
  <text x="65" y="268" text-anchor="middle" font-size="11.5" fill="#333">5</text>
  <text x="175" y="268" text-anchor="middle" font-size="11" fill="#d6a040">[4,5,6]</text>
  <text x="350" y="268" text-anchor="middle" font-size="11" fill="#4a7a3a">③4→5→6 连续 ✓ ∧ dp2 ✓</text>
  <text x="490" y="268" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">T</text>

  <!-- result row -->
  <rect x="30" y="278" width="500" height="30" fill="#e8f0fe" opacity="0.6" filter="url(#rough2)"/>
  <text x="65" y="297" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">答案</text>
  <text x="350" y="297" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">回溯 dp5←③←dp2←①←dp0 → [4,4]+[4,5,6]</text>
  <text x="490" y="297" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">true</text>

  <!-- bottom notes -->
  <text x="30" y="332" font-size="10.5" fill="#555">• dp[i] 命中时只记 true，回溯时按「哪类合法 + 前缀下标」反推划分（①→i−2，②③→i−3）</text>
  <text x="30" y="350" font-size="10.5" fill="#555">• i=4 落空：末段 [4,5]/[4,4,5] 三类皆不满足；但整体仍 true，因 i=5 经 ③ 接力成功</text>
</svg>
