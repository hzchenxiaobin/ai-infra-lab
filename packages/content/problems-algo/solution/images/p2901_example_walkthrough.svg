<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="520" height="410" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：words = [abc, abd, bbd, xyz]，groups = [1, 2, 1, 2]</text>

  <!-- 表头 -->
  <rect x="24" y="46" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="44" y="67" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i</text>
  <rect x="64" y="46" width="66" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="97" y="67" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">words</text>
  <rect x="130" y="46" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="156" y="67" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">组</text>
  <rect x="182" y="46" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="206" y="67" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">dp</text>
  <rect x="230" y="46" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="258" y="67" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">from</text>
  <rect x="286" y="46" width="212" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="392" y="67" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">检查过程</text>

  <!-- 行 0 -->
  <rect x="24" y="82" width="40" height="40" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="44" y="107" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="64" y="82" width="66" height="40" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="97" y="107" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">abc</text>
  <rect x="130" y="82" width="52" height="40" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="156" y="107" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="182" y="82" width="48" height="40" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="206" y="107" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="230" y="82" width="56" height="40" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="258" y="107" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">−1</text>
  <rect x="286" y="82" width="212" height="40" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="392" y="107" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">起点，单个词即合法</text>

  <!-- 行 1 -->
  <rect x="24" y="126" width="40" height="40" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="44" y="151" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="64" y="126" width="66" height="40" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="97" y="151" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">abd</text>
  <rect x="130" y="126" width="52" height="40" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="156" y="151" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="182" y="126" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="206" y="151" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <rect x="230" y="126" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="258" y="151" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <rect x="286" y="126" width="212" height="40" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="392" y="145" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">abc → abd：组 1≠2，等长</text>
  <text x="392" y="160" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">汉明 = 1（c≠d）✓</text>

  <!-- 行 2 -->
  <rect x="24" y="170" width="40" height="40" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="44" y="195" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="64" y="170" width="66" height="40" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="97" y="195" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">bbd</text>
  <rect x="130" y="170" width="52" height="40" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="156" y="195" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="182" y="170" width="48" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="206" y="195" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">3</text>
  <rect x="230" y="170" width="56" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="258" y="195" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1</text>
  <rect x="286" y="170" width="212" height="40" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="392" y="184" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">abc 组同 ✗；abd → bbd 汉明 = 1 ✓</text>
  <text x="392" y="200" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">dp = dp[1] + 1 = 3</text>

  <!-- 行 3 -->
  <rect x="24" y="214" width="40" height="40" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="44" y="239" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="64" y="214" width="66" height="40" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="97" y="239" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">xyz</text>
  <rect x="130" y="214" width="52" height="40" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="156" y="239" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="182" y="214" width="48" height="40" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="206" y="239" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="230" y="214" width="56" height="40" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="258" y="239" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">−1</text>
  <rect x="286" y="214" width="212" height="40" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="392" y="233" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">与 abc/abd/bbd 汉明均 = 3 ✗</text>
  <text x="392" y="249" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">谁也接不上，独自成链</text>

  <!-- 回溯示意 -->
  <rect x="30" y="272" width="460" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="296" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">end = 2（dp 最大值 3）→ 沿 from 回溯：bbd → abd → abc</text>
  <text x="260" y="318" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">反转得答案 [abc, abd, bbd]，长度 3</text>

  <path d="M 200 345 C 180 370 150 370 140 356" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="260" y="360" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">xyz 的 dp = 1 印证了「贪心拿组值不同的词」并不够——</text>
  <text x="260" y="378" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">必须用 DP 同时权衡三个约束才能保证全局最长</text>
</svg>
