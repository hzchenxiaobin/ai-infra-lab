<svg xmlns="http://www.w3.org/2000/svg" width="920" height="480" viewBox="0 0 920 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="920" height="480" fill="#fafafa"/>
  <text x="460" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">懒标记数组：increment 记账，pop 结算下传</text>
  <path d="M 290 42 Q 460 50 630 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="460" y="70" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">stack 存原值（不动），add 存"待结算增量"；increment 只改一个 add，pop 时把 add 顶层下传一层</text>

  <!-- 左：stack 原值 -->
  <text x="180" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">stack（原值，永不改）</text>
  <text x="180" y="120" text-anchor="middle" font-size="10" fill="#666" filter="url(#sk)">push(1), push(2), push(3)</text>

  <!-- stack boxes (vertical, top = high index) -->
  <g filter="url(#sk)">
    <rect x="130" y="132" width="100" height="34" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="130" y="170" width="100" height="34" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="130" y="208" width="100" height="34" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="180" y="154" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#sk)">3</text>
  <text x="180" y="192" text-anchor="middle" font-size="14" fill="#333" filter="url(#sk)">2</text>
  <text x="180" y="230" text-anchor="middle" font-size="14" fill="#333" filter="url(#sk)">1</text>
  <text x="236" y="154" font-size="10" fill="#b85450" filter="url(#sk)">栈顶 i=2</text>
  <text x="236" y="230" font-size="10" fill="#666" filter="url(#sk)">栈底 i=0</text>
  <text x="60" y="154" font-size="10" fill="#888" filter="url(#sk)">index 2</text>
  <text x="60" y="192" font-size="10" fill="#888" filter="url(#sk)">index 1</text>
  <text x="60" y="230" font-size="10" fill="#888" filter="url(#sk)">index 0</text>

  <!-- 中：add 懒标记 -->
  <text x="460" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">add（懒标记，同步等高）</text>
  <text x="460" y="120" text-anchor="middle" font-size="10" fill="#666" filter="url(#sk)">两次 increment 后的状态</text>

  <g filter="url(#sk)">
    <rect x="410" y="132" width="100" height="34" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="410" y="170" width="100" height="34" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="410" y="208" width="100" height="34" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="460" y="154" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#sk)">100</text>
  <text x="460" y="192" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold" filter="url(#sk)">100</text>
  <text x="460" y="230" text-anchor="middle" font-size="14" fill="#333" filter="url(#sk)">0</text>
  <text x="516" y="154" font-size="10" fill="#d6a040" filter="url(#sk)">inc(5,100) 记这</text>
  <text x="516" y="192" font-size="10" fill="#d6a040" filter="url(#sk)">inc(2,100) 记这</text>
  <text x="516" y="230" font-size="10" fill="#888" filter="url(#sk)">无增量</text>

  <!-- 增量下传箭头：add[2] -> add[1] -->
  <path d="M 410 149 L 360 149 L 360 187 L 410 187" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="5 3" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="300" y="170" font-size="10" fill="#b85450" filter="url(#sk)">pop 时</text>
  <text x="300" y="184" font-size="10" fill="#b85450" filter="url(#sk)">下传一层</text>

  <!-- pop 结算说明 -->
  <g filter="url(#sk)">
    <rect x="40" y="262" width="260" height="56" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="170" y="284" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a2828" filter="url(#sk)">pop()：结算 + 下传</text>
  <text x="170" y="302" text-anchor="middle" font-size="11" fill="#444" filter="url(#sk)">返回 stack[i] + add[i]</text>
  <text x="170" y="316" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#sk)">add[i-1] += add[i]（下传）</text>

  <!-- increment 记账说明 -->
  <g filter="url(#sk)">
    <rect x="330" y="262" width="260" height="56" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="460" y="284" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">increment(k, val)：只记账</text>
  <text x="460" y="302" text-anchor="middle" font-size="11" fill="#444" filter="url(#sk)">i = min(k, n) - 1</text>
  <text x="460" y="316" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#sk)">add[i] += val（O(1) 不动 stack）</text>

  <!-- 真实值公式 -->
  <g filter="url(#sk)">
    <rect x="620" y="262" width="260" height="56" rx="6" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="750" y="284" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">真实值 = stack[i] + Σadd[t≥i]</text>
  <text x="750" y="302" text-anchor="middle" font-size="11" fill="#444" filter="url(#sk)">stack[0]=1+(0+100+100)=201</text>
  <text x="750" y="316" text-anchor="middle" font-size="11" fill="#444" filter="url(#sk)">stack[2]=3+100=103</text>

  <!-- 底部不变量 -->
  <g filter="url(#sk)">
    <rect x="60" y="346" width="800" height="118" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/>
  </g>
  <text x="460" y="370" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心不变量：add[i] = "应当加到 stack[0..i]、尚未下传的增量"</text>
  <text x="80" y="394" font-size="11" fill="#444" filter="url(#sk)">① increment(k, val) 只在 add[min(k,n)-1] 记一笔，覆盖 0..i 整段前缀 —— O(1) 而非 O(k)</text>
  <text x="80" y="414" font-size="11" fill="#444" filter="url(#sk)">② pop 第 i 层时把 add[i] 下传给 add[i-1]：弹出元素带走自己那份，剩余元素继续持有</text>
  <text x="80" y="434" font-size="11" fill="#444" filter="url(#sk)">③ 每个 add 标记一生只被下传一次，故 pop 均摊 O(1) —— 与 232 懒倒栈同构</text>
  <text x="80" y="454" font-size="11" fill="#4a7a3a" filter="url(#sk)">④ 本质是"一维线段树只有一条链"的退化版：add[i]=节点 i 的 lazy 标记，pop=push_down</text>
</svg>
