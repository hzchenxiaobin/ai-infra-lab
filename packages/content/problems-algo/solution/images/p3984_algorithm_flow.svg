<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#666" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <!-- 开始 -->
  <rect x="215" y="16" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="14" filter="url(#rough2)"/>
  <text x="260" y="35" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">开始</text>
  <path d="M 260 44 L 260 56" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 预处理 -->
  <rect x="85" y="58" width="350" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="76" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">预处理：前缀和 P；试除 √x 枚举每个元素</text>
  <text x="260" y="94" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">的约数 d &gt; 1，pos[d] ← 可整除下标列表</text>
  <path d="M 260 104 L 260 114" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 候选集 -->
  <rect x="115" y="116" width="290" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="135" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">候选集 = 所有约数（pos 的键）∪ {2}</text>
  <path d="M 260 144 L 260 154" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形：还有候选 k？ -->
  <polygon points="260,156 340,188 260,220 180,188" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="193" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">还有候选 k？</text>

  <path d="M 340 188 L 396 188" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="364" y="181" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="400" y="166" width="108" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="454" y="184" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">返回 (D*·k*)</text>
  <text x="454" y="201" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">mod (10⁹+7)</text>

  <path d="M 260 220 L 260 230" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="271" y="228" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 菱形：pos[k] 为空？ -->
  <polygon points="260,232 335,262 260,292 185,262" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="267" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">pos[k] 为空？</text>

  <path d="M 185 262 L 156 262" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="169" y="255" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="24" y="246" width="130" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="89" y="266" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">D ← −min(nums)</text>

  <path d="M 335 262 L 352 262" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="344" y="255" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="356" y="238" width="156" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="434" y="257" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">压缩 Kadane（沿 pos[k]）</text>
  <text x="434" y="276" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">g ← nums[p] + max(0, g − gap)</text>

  <!-- 汇合到更新最优 -->
  <path d="M 89 278 L 89 322 L 146 322" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 434 288 L 434 322 L 376 322" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="306" width="220" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="326" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">更新最优：D 更大，或平局取更小 k</text>

  <!-- 回边 -->
  <path d="M 260 338 L 260 362 L 14 362 L 14 188 L 176 188" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="137" y="356" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">下一个候选 k</text>

  <!-- 底部注释 -->
  <text x="260" y="396" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">总工作量 = Σ d(nums[i]) ≤ 240n ≈ 2.4×10⁵；试除枚举约数 ≤ 10⁶ 步</text>
  <text x="260" y="414" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">比较全程用原始值、最后才取模；C++ 负数取模须 +p 再 %p</text>
</svg>
