<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：arr = [1,2,3,4,5,6,7,8]，最长斐波那契子序列 [1,2,3,5,8]，答案 = 5</text>

  <!-- arr array with indices -->
  <text x="30" y="56" font-size="10" fill="#888">下标</text>
  <text x="30" y="84" font-size="10" fill="#888">arr</text>

  <!-- index row -->
  <rect x="50" y="46" width="44" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="72" y="61" text-anchor="middle" font-size="10" fill="#888">0</text>
  <rect x="96" y="46" width="44" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="118" y="61" text-anchor="middle" font-size="10" fill="#888">1</text>
  <rect x="142" y="46" width="44" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="164" y="61" text-anchor="middle" font-size="10" fill="#888">2</text>
  <rect x="188" y="46" width="44" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="210" y="61" text-anchor="middle" font-size="10" fill="#888">3</text>
  <rect x="234" y="46" width="44" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="256" y="61" text-anchor="middle" font-size="10" fill="#888">4</text>
  <rect x="280" y="46" width="44" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="302" y="61" text-anchor="middle" font-size="10" fill="#888">5</text>
  <rect x="326" y="46" width="44" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="348" y="61" text-anchor="middle" font-size="10" fill="#888">6</text>
  <rect x="372" y="46" width="44" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="394" y="61" text-anchor="middle" font-size="10" fill="#888">7</text>

  <!-- value row: highlight 1,2,3,5,8 -->
  <rect x="50" y="72" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="72" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="96" y="72" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="118" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="142" y="72" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="164" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="188" y="72" width="44" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="210" y="92" text-anchor="middle" font-size="13" fill="#aaa">4</text>
  <rect x="234" y="72" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="256" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <rect x="280" y="72" width="44" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="302" y="92" text-anchor="middle" font-size="13" fill="#aaa">6</text>
  <rect x="326" y="72" width="44" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="348" y="92" text-anchor="middle" font-size="13" fill="#aaa">7</text>
  <rect x="372" y="72" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="394" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>

  <!-- chain arrows: 1->2->3->5->8 -->
  <path d="M 94 87 L 96 87" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 140 87 L 142 87" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 186 87 Q 210 100 232 87" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 278 87 Q 320 100 370 87" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <text x="430" y="60" font-size="10" fill="#4a7a3a">绿色 = 选中</text>
  <text x="430" y="76" font-size="10" fill="#b85450">红色箭头 = 斐波那契递推</text>
  <text x="430" y="92" font-size="10" fill="#888">1+2=3, 2+3=5, 3+5=8</text>

  <!-- dp transition table -->
  <text x="280" y="128" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">关键 DP 状态转移（沿链 [1,2,3,5,8]）</text>

  <!-- table header -->
  <rect x="40" y="140" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="158" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">状态 (i,j)</text>
  <rect x="124" y="140" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="184" y="158" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">target=arr[j]-arr[i]</text>
  <rect x="248" y="140" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="288" y="158" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">k = idx[t]</text>
  <rect x="332" y="140" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="382" y="158" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">dp[i][j]</text>
  <rect x="436" y="140" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="476" y="158" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">转移来源</text>

  <!-- row (0,1) -->
  <rect x="40" y="170" width="80" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="80" y="187" text-anchor="middle" font-size="10" fill="#888">(0, 1)</text>
  <rect x="124" y="170" width="120" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="184" y="187" text-anchor="middle" font-size="10" fill="#888">—（i=0 无前驱）</text>
  <rect x="248" y="170" width="80" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="288" y="187" text-anchor="middle" font-size="10" fill="#888">—</text>
  <rect x="332" y="170" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="382" y="187" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="436" y="170" width="80" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="476" y="187" text-anchor="middle" font-size="10" fill="#888">基值</text>

  <!-- row (1,2) -->
  <rect x="40" y="200" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="217" text-anchor="middle" font-size="10" fill="#333">(1, 2)</text>
  <rect x="124" y="200" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="184" y="217" text-anchor="middle" font-size="10" fill="#333">3 − 2 = 1</text>
  <rect x="248" y="200" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="288" y="217" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="332" y="200" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="382" y="217" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="436" y="200" width="80" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="476" y="217" text-anchor="middle" font-size="10" fill="#888">dp[0][1]+1</text>

  <!-- row (2,4) -->
  <rect x="40" y="230" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="80" y="247" text-anchor="middle" font-size="10" fill="#333">(2, 4)</text>
  <rect x="124" y="230" width="120" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="184" y="247" text-anchor="middle" font-size="10" fill="#333">5 − 3 = 2</text>
  <rect x="248" y="230" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="288" y="247" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="332" y="230" width="100" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="382" y="247" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <rect x="436" y="230" width="80" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="476" y="247" text-anchor="middle" font-size="10" fill="#888">dp[1][2]+1</text>

  <!-- row (4,7) -->
  <rect x="40" y="260" width="80" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="277" text-anchor="middle" font-size="10" fill="#333">(4, 7)</text>
  <rect x="124" y="260" width="120" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="184" y="277" text-anchor="middle" font-size="10" fill="#333">8 − 5 = 3</text>
  <rect x="248" y="260" width="80" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="288" y="277" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="332" y="260" width="100" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="382" y="277" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">5</text>
  <rect x="436" y="260" width="80" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="476" y="277" text-anchor="middle" font-size="10" fill="#888">dp[2][4]+1</text>

  <!-- answer box -->
  <rect x="120" y="304" width="320" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="330" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">ans = max(dp[i][j]) = 5 ≥ 3 → 返回 5</text>

  <!-- note -->
  <rect x="40" y="356" width="480" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="60" y="378" font-size="11" fill="#4a7a3a" font-weight="bold">链的延伸过程：</text>
  <text x="60" y="398" font-size="11" fill="#444">dp[0][1]=2 → dp[1][2]=3 → dp[2][4]=4 → dp[4][7]=5</text>
  <text x="60" y="416" font-size="11" fill="#444">每次 arr[k]+arr[i]=arr[j] 成立，链长 +1，前驱状态 dp[k][i] 已在更早的 (k,i) 算好</text>
</svg>
