<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心直觉：函数是一等值——createHelloWorld 返回的是「一个函数」而非字符串</text>

  <!-- Outer scope: createHelloWorld() -->
  <rect x="40" y="52" width="320" height="190" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="60" y="76" font-size="13" fill="#446688" font-weight="bold">createHelloWorld()  ← 外层函数</text>

  <!-- inner function -->
  <rect x="64" y="96" width="276" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="84" y="118" font-size="12" fill="#4a7a3a" font-weight="bold">返回的内层函数 f(...args)</text>
  <text x="84" y="138" font-size="11" fill="#333">无论收到什么参数，都返回</text>
  <text x="84" y="156" font-size="13" fill="#b85450" font-weight="bold">"Hello World"</text>
  <text x="84" y="172" font-size="10" fill="#888">args 被完全忽略</text>

  <!-- return arrow -->
  <text x="370" y="132" font-size="11" fill="#b85450" font-weight="bold">return →</text>
  <path d="M 360 136 L 432 136" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>

  <!-- returned closure lives outside -->
  <rect x="432" y="96" width="148" height="80" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="506" y="120" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回的函数 f</text>
  <text x="506" y="138" text-anchor="middle" font-size="11" fill="#333">= 一个常量函数</text>
  <text x="506" y="154" text-anchor="middle" font-size="10" fill="#888">外部可 f(...) 反复调用</text>

  <!-- args ignored -->
  <path d="M 506 176 L 506 210 L 340 210 L 340 196" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="206" text-anchor="middle" font-size="11" fill="#888">调用时传任意参数都被丢弃</text>

  <!-- key insight box -->
  <rect x="60" y="262" width="520" height="44" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="320" y="280" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">关键：createHelloWorld() 的返回值本身是个「函数」</text>
  <text x="320" y="296" text-anchor="middle" font-size="11" fill="#888">要先用 f = createHelloWorld() 拿到函数，再 f() 调用它——两步</text>

  <!-- contrast: wrong approach -->
  <rect x="60" y="320" width="520" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="320" y="340" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">⚠️ 常见错误：return "Hello World" 直接返回字符串</text>
  <text x="320" y="358" text-anchor="middle" font-size="11" fill="#888">那样 f = createHelloWorld() 得到的是字符串，再 f() 会报「f is not a function」</text>

  <text x="300" y="390" text-anchor="middle" font-size="11" fill="#888">对照 2620 计数器：那里闭包「记住可变状态」，这里闭包「记住常量」——常量甚至无需捕获</text>
</svg>
