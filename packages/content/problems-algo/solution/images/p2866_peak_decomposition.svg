<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：枚举峰值 i，左右两半独立求最优</text>
  <text x="310" y="48" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">以 maxHeights = [6,5,3,9,2,7]，峰值 i = 3 为例</text>

  <!-- half labels -->
  <text x="217" y="72" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">非递减 ↗</text>
  <text x="434" y="72" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">非递增 ↘</text>

  <!-- constraint symbols between cells -->
  <text x="186" y="88" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">≤</text>
  <text x="248" y="88" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">≤</text>
  <text x="310" y="88" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">≤</text>
  <text x="372" y="88" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">≥</text>
  <text x="434" y="88" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">≥</text>

  <!-- array cells -->
  <rect x="128" y="96" width="54" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="155" y="123" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>
  <rect x="190" y="96" width="54" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="217" y="123" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <rect x="252" y="96" width="54" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="279" y="123" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="314" y="96" width="54" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="341" y="123" text-anchor="middle" font-size="15" fill="#8a6420" font-weight="bold" filter="url(#rough2)">9</text>
  <rect x="376" y="96" width="54" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="403" y="123" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="438" y="96" width="54" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="465" y="123" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7</text>

  <!-- indices -->
  <text x="155" y="156" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="217" y="156" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">1</text>
  <text x="279" y="156" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">2</text>
  <text x="341" y="156" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">3</text>
  <text x="403" y="156" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">4</text>
  <text x="465" y="156" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">5</text>
  <text x="341" y="174" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">峰</text>

  <!-- group labels -->
  <text x="217" y="202" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">左半：left[3] = 18</text>
  <text x="434" y="202" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">右半：right[3] = 13</text>

  <!-- recurrence box -->
  <rect x="60" y="222" width="500" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="246" text-anchor="middle" font-size="13" fill="#8a6420" font-weight="bold" filter="url(#rough2)">递推：left[i] = left[j] + h·(i − j)</text>
  <text x="310" y="266" text-anchor="middle" font-size="11" fill="#8a6420" filter="url(#rough2)">j 为 i 左侧第一个 maxHeights[j] &lt; h 的下标，(j, i] 整段压平成 h</text>

  <!-- answer box -->
  <rect x="60" y="296" width="500" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="320" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">合并：ans = max( left[i] + right[i] − maxHeights[i] )</text>
  <text x="310" y="340" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">峰被 left / right 各算一次，要减掉一份；right 从右往左同理</text>

  <text x="310" y="382" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">⚠️ 高度和最高可达 10⁵ × 10⁹ = 10¹⁴，必须用 64 位整数</text>
</svg>
