<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：单遍遍历 + 元音判定 + 对冲计数</text>

  <!-- Start: init -->
  <rect x="180" y="46" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">初始化</text>
  <text x="260" y="78" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">cnt = 0, i = 0</text>

  <path d="M 260 88 L 260 106" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop back arrow (from i++ to here) drawn later, placeholder note -->
  <text x="372" y="112" font-size="9" fill="#aaa" filter="url(#rough2)">← 循环回跳</text>

  <!-- Decision: i < n ? -->
  <polygon points="260,110 340,150 260,190 180,150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="146" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">i &lt; n ?</text>
  <text x="260" y="162" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">是否未遍历完</text>

  <!-- No branch: return -->
  <path d="M 340 150 L 430 150" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="384" y="144" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="430" y="130" width="76" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="468" y="148" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回</text>
  <text x="468" y="162" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">cnt == 0</text>

  <!-- Yes branch: down -->
  <path d="M 260 190 L 260 208" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="204" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- Decision: s[i] 是元音? -->
  <polygon points="260,212 340,252 260,292 180,252" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="248" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">s[i] 是元音?</text>
  <text x="260" y="264" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">查集合 O(1)</text>

  <!-- No branch: skip to i++ -->
  <path d="M 340 252 L 400 252 L 400 360" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="246" text-anchor="middle" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- Yes branch: down -->
  <path d="M 260 292 L 260 308" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="304" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- Decision: i < n/2 ? -->
  <polygon points="260,312 340,344 260,376 180,344" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="340" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">i &lt; n/2 ?</text>
  <text x="260" y="356" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">前半 or 后半</text>

  <!-- Yes (left): cnt += 1 -->
  <path d="M 180 344 L 120 344" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="338" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="56" y="324" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="88" y="342" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">前半</text>
  <text x="88" y="356" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">cnt += 1</text>

  <!-- No (right): cnt -= 1 -->
  <path d="M 340 344 L 400 344" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="338" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="400" y="324" width="64" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="432" y="342" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">后半</text>
  <text x="432" y="356" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">cnt -= 1</text>

  <!-- merge to i++ -->
  <path d="M 88 364 L 88 392 L 260 392" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 432 364 L 432 392 L 260 392" stroke="#666" stroke-width="2" fill="none" filter="url(#rough2)"/>

  <!-- i++ -->
  <rect x="200" y="392" width="120" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="415" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">i += 1</text>

  <!-- loop back arrow: from i++ up to i<n? decision -->
  <path d="M 200 410 L 60 410 L 60 150 L 180 150" stroke="#666" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="44" y="280" font-size="9" fill="#aaa" filter="url(#rough2)">循环</text>

  <!-- Footer -->
  <text x="260" y="456" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">每个字符 O(1) 判定 —— 总复杂度 O(n) / O(1)</text>
</svg>
