<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">
    核心观察：奇偶位掩码判定伪回文
  </text>
  <text x="280" y="50" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">
    能重排成回文 ⟺ 至多一个数字出现奇数次
  </text>

  <!-- ===== 示例 A：路径 [2,3,3] ===== -->
  <rect x="30" y="68" width="500" height="140" rx="10" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="44" y="88" font-size="13" fill="#2a5a2a" filter="url(#rough2)">路径 [2, 3, 3]</text>

  <!-- 路径节点 -->
  <rect x="60"  y="100" width="34" height="30" rx="5" fill="#fff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="77"  y="120" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="104" y="100" width="34" height="30" rx="5" fill="#fff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="121" y="120" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="148" y="100" width="34" height="30" rx="5" fill="#fff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="165" y="120" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <line x1="94" y1="115" x2="104" y2="115" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="138" y1="115" x2="148" y2="115" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="210" y="121" font-size="12" fill="#2a5a2a" filter="url(#rough2)">频次：2→1 次(奇)，3→2 次(偶)</text>

  <!-- 掩码寄存器 9 位，位 d 对应数字 d -->
  <text x="44" y="158" font-size="12" fill="#333" filter="url(#rough2)">奇偶掩码 mask（位 d = 数字 d 的奇偶）</text>
  <g filter="url(#rough2)">
    <!-- digit labels 1..9 -->
    <rect x="60"  y="166" width="36" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="78"  y="184" text-anchor="middle" font-size="13" fill="#b85450">1</text>
    <rect x="98"  y="166" width="36" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="116" y="184" text-anchor="middle" font-size="13" fill="#d6a040">2</text>
    <rect x="136" y="166" width="36" height="26" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="154" y="184" text-anchor="middle" font-size="13" fill="#888">3</text>
    <rect x="174" y="166" width="36" height="26" rx="4" fill="#fff" stroke="#999" stroke-width="1.2"/>
    <text x="192" y="184" text-anchor="middle" font-size="12" fill="#aaa">4</text>
    <rect x="212" y="166" width="36" height="26" rx="4" fill="#fff" stroke="#999" stroke-width="1.2"/>
    <text x="230" y="184" text-anchor="middle" font-size="12" fill="#aaa">5</text>
    <rect x="250" y="166" width="36" height="26" rx="4" fill="#fff" stroke="#999" stroke-width="1.2"/>
    <text x="268" y="184" text-anchor="middle" font-size="12" fill="#aaa">6</text>
    <rect x="288" y="166" width="36" height="26" rx="4" fill="#fff" stroke="#999" stroke-width="1.2"/>
    <text x="306" y="184" text-anchor="middle" font-size="12" fill="#aaa">7</text>
    <rect x="326" y="166" width="36" height="26" rx="4" fill="#fff" stroke="#999" stroke-width="1.2"/>
    <text x="344" y="184" text-anchor="middle" font-size="12" fill="#aaa">8</text>
    <rect x="364" y="166" width="36" height="26" rx="4" fill="#fff" stroke="#999" stroke-width="1.2"/>
    <text x="382" y="184" text-anchor="middle" font-size="12" fill="#aaa">9</text>
  </g>
  <text x="60"  y="208" font-size="11" fill="#888" filter="url(#rough2)">值</text>
  <text x="78"  y="208" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <text x="116" y="208" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">1</text>
  <text x="154" y="208" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>

  <rect x="430" y="166" width="86" height="30" rx="6" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="473" y="186" text-anchor="middle" font-size="13" fill="#fff" filter="url(#rough2)">1 奇频 ✓</text>

  <!-- ===== 示例 B：路径 [2,3,1] ===== -->
  <rect x="30" y="226" width="500" height="140" rx="10" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="44" y="246" font-size="13" fill="#8a3a3a" filter="url(#rough2)">路径 [2, 3, 1]</text>

  <rect x="60"  y="258" width="34" height="30" rx="5" fill="#fff" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="77"  y="278" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="104" y="258" width="34" height="30" rx="5" fill="#fff" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="121" y="278" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="148" y="258" width="34" height="30" rx="5" fill="#fff" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="165" y="278" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <line x1="94" y1="273" x2="104" y2="273" stroke="#b85450" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="138" y1="273" x2="148" y2="273" stroke="#b85450" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="210" y="279" font-size="12" fill="#8a3a3a" filter="url(#rough2)">频次：1→1，2→1，3→1（全奇）</text>

  <text x="44" y="316" font-size="12" fill="#333" filter="url(#rough2)">奇偶掩码 mask</text>
  <g filter="url(#rough2)">
    <rect x="60"  y="324" width="36" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="78"  y="342" text-anchor="middle" font-size="13" fill="#b85450">1</text>
    <rect x="98"  y="324" width="36" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="116" y="342" text-anchor="middle" font-size="13" fill="#b85450">2</text>
    <rect x="136" y="324" width="36" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="154" y="342" text-anchor="middle" font-size="13" fill="#b85450">3</text>
    <rect x="174" y="324" width="36" height="26" rx="4" fill="#fff" stroke="#999" stroke-width="1.2"/>
    <text x="192" y="342" text-anchor="middle" font-size="12" fill="#aaa">4</text>
    <rect x="212" y="324" width="36" height="26" rx="4" fill="#fff" stroke="#999" stroke-width="1.2"/>
    <text x="230" y="342" text-anchor="middle" font-size="12" fill="#aaa">5</text>
    <rect x="250" y="324" width="36" height="26" rx="4" fill="#fff" stroke="#999" stroke-width="1.2"/>
    <text x="268" y="342" text-anchor="middle" font-size="12" fill="#aaa">6</text>
    <rect x="288" y="324" width="36" height="26" rx="4" fill="#fff" stroke="#999" stroke-width="1.2"/>
    <text x="306" y="342" text-anchor="middle" font-size="12" fill="#aaa">7</text>
    <rect x="326" y="324" width="36" height="26" rx="4" fill="#fff" stroke="#999" stroke-width="1.2"/>
    <text x="344" y="342" text-anchor="middle" font-size="12" fill="#aaa">8</text>
    <rect x="364" y="324" width="36" height="26" rx="4" fill="#fff" stroke="#999" stroke-width="1.2"/>
    <text x="382" y="342" text-anchor="middle" font-size="12" fill="#aaa">9</text>
  </g>
  <text x="78"  y="366" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="116" y="366" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="154" y="366" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1</text>

  <rect x="430" y="324" width="86" height="30" rx="6" fill="#b85450" filter="url(#rough2)"/>
  <text x="473" y="344" text-anchor="middle" font-size="13" fill="#fff" filter="url(#rough2)">3 奇频 ✗</text>

  <!-- 底部判定技巧 -->
  <rect x="30" y="378" width="500" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="396" text-anchor="middle" font-size="12" fill="#224" filter="url(#rough2)">
    判定：mask &amp; (mask − 1) == 0  ⟺  至多一个 1 位  ⟺  伪回文
  </text>
</svg>
