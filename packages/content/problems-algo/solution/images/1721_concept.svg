<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8edb"/>
    </marker>
  </defs>
  <rect width="880" height="360" fill="#fdfcf7"/>

  <text x="440" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">交换链表中的节点：双指针一趟定位正/倒数第 k</text>
  <path d="M 270 40 Q 440 48 610 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="440" y="62" text-anchor="middle" font-size="12" fill="#666">head = [1,2,3,4,5], k = 2（正数第 2 = 值 2，倒数第 2 = 值 4）</text>

  <!-- linked list row -->
  <g filter="url(#sk)"><rect x="40" y="96" width="50" height="40" rx="4" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.2"/></g>
  <text x="65" y="120" text-anchor="middle" font-size="11" fill="#888">head</text>

  <g filter="url(#sk)"><rect x="130" y="96" width="60" height="40" rx="4" fill="#fff" stroke="#ddd" stroke-width="1.2"/></g>
  <text x="160" y="120" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">1</text>

  <g filter="url(#sk)"><rect x="240" y="96" width="60" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
  <text x="270" y="120" text-anchor="middle" font-size="14" fill="#2b6e9e" font-weight="bold">2</text>

  <g filter="url(#sk)"><rect x="350" y="96" width="60" height="40" rx="4" fill="#fff" stroke="#ddd" stroke-width="1.2"/></g>
  <text x="380" y="120" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">3</text>

  <g filter="url(#sk)"><rect x="460" y="96" width="60" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="490" y="120" text-anchor="middle" font-size="14" fill="#a06a10" font-weight="bold">4</text>

  <g filter="url(#sk)"><rect x="570" y="96" width="60" height="40" rx="4" fill="#fff" stroke="#ddd" stroke-width="1.2"/></g>
  <text x="600" y="120" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">5</text>
  <text x="650" y="120" font-size="11" fill="#888">→ null</text>

  <path d="M 90 116 L 126 116" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 190 116 L 236 116" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 300 116 L 346 116" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 410 116 L 456 116" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 520 116 L 566 116" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 630 116 L 670 116" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- first pointer (k-th from beginning) -->
  <text x="270" y="158" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">first：正数第 k</text>
  <path d="M 270 152 L 270 138" stroke="#2b6e9e" stroke-width="1" fill="none" stroke-dasharray="3 2" filter="url(#sk)"/>
  <text x="270" y="174" text-anchor="middle" font-size="10" fill="#2b6e9e">先走 k−1 步</text>

  <!-- second pointer (k-th from end) -->
  <text x="490" y="158" text-anchor="middle" font-size="12" fill="#a06a10" font-weight="bold">second：倒数第 k</text>
  <path d="M 490 152 L 490 138" stroke="#a06a10" stroke-width="1" fill="none" stroke-dasharray="3 2" filter="url(#sk)"/>
  <text x="490" y="174" text-anchor="middle" font-size="10" fill="#a06a10">first 到尾时停</text>

  <!-- two phases -->
  <text x="60" y="214" font-size="13" font-weight="bold" fill="#2b6e9e">① first 从 head 先走 k−1 步 → 落在正数第 k（此即第一个交换点）</text>
  <text x="60" y="238" font-size="13" font-weight="bold" fill="#a06a10">② second 从 head 出发，与 first 同速推进；first.next == null 时 second 落在倒数第 k（第二个交换点）</text>
  <text x="60" y="262" font-size="13" font-weight="bold" fill="#b85450">③ 交换 first.val 与 second.val，返回 head</text>

  <!-- equivalence note -->
  <g filter="url(#sk)"><rect x="60" y="282" width="760" height="58" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <text x="80" y="306" font-size="12" fill="#2e6e2e">⭐ 与 [19. 删除倒数第 N 个节点] 同源：都是「fast 先发制造间距」。</text>
  <text x="80" y="326" font-size="12" fill="#2e6e2e">   区别：19 题先发 n 步拿「前驱」以便删除；本题先发 k−1 步拿「正数第 k」本身，再让 second 跟随到「倒数第 k」。</text>
</svg>
