<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：段首质数 / 段尾非质数 + 前缀和优化</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">s = "23542185131" 的一种完美分割：2354 | 218 | 5131</text>

  <!-- ===== String row: 11 cells, width 36, start x=82, y=64 ===== -->
  <g font-size="14" fill="#333" text-anchor="middle">
    <!-- seg1: idx0..3 -->
    <rect x="80" y="62" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="98" y="83">2</text>
    <rect x="116" y="62" width="36" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="134" y="83">3</text>
    <rect x="152" y="62" width="36" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="170" y="83">5</text>
    <rect x="188" y="62" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="206" y="83">4</text>
    <!-- seg2: idx4..6 -->
    <rect x="224" y="62" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="242" y="83">2</text>
    <rect x="260" y="62" width="36" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="278" y="83">1</text>
    <rect x="296" y="62" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="314" y="83">8</text>
    <!-- seg3: idx7..10 -->
    <rect x="332" y="62" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="350" y="83">5</text>
    <rect x="368" y="62" width="36" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="386" y="83">1</text>
    <rect x="404" y="62" width="36" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
    <text x="422" y="83">3</text>
    <rect x="440" y="62" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="458" y="83">1</text>
  </g>

  <!-- segment brackets + labels -->
  <path d="M 82 100 L 82 106 L 224 106 L 224 100" stroke="#888" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 224 100 L 224 106 L 332 106 L 332 100" stroke="#888" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 332 100 L 332 106 L 476 106 L 476 100" stroke="#888" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="153" y="122" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">段1 2354</text>
  <text x="278" y="122" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">段2 218</text>
  <text x="404" y="122" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">段3 5131</text>

  <!-- legend -->
  <rect x="120" y="134" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="140" y="145" font-size="10.5" fill="#4a7a3a">段首 = 质数（2,3,5,7）</text>
  <rect x="300" y="134" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="320" y="145" font-size="10.5" fill="#b85450">段尾 = 非质数（1,4,6,8,9）</text>

  <!-- recurrence box -->
  <rect x="30" y="160" width="500" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="184" text-anchor="middle" font-size="12" fill="#333">状态 dp[i][j] = 前 i 个字符分成 j 个合法段的方案数</text>
  <text x="280" y="206" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">dp[i][j] = [s[i−1] 非质数] · Σ (p ≤ i−L 且 s[p] 质数) dp[p][j−1]</text>

  <!-- prefix sum explanation box -->
  <rect x="30" y="234" width="500" height="84" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="44" y="258" font-size="11.5" fill="#333">• 段首“质数”只依赖起点 p，p 落在前缀区间 [0, i−L] → <tspan fill="#446688" font-weight="bold">前缀和</tspan></text>
  <text x="60" y="278" font-size="11" fill="#555">S[t] = Σ (p≤t 且 s[p]质数) dp[p][j−1]，每层 O(n) 滚动累加</text>
  <text x="44" y="300" font-size="11.5" fill="#333">• 段尾“非质数”只依赖终点 i → <tspan fill="#b85450" font-weight="bold">单点判定</tspan> O(1)</text>

  <!-- conclusion -->
  <rect x="80" y="332" width="400" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="12" filter="url(#rough2)"/>
  <text x="280" y="354" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">两约束彼此独立 → 每次转移降为 O(1)</text>
  <text x="280" y="372" text-anchor="middle" font-size="11.5" fill="#b85450">总复杂度 O(n·k)，空间 O(n)（滚动数组）</text>

  <text x="280" y="410" text-anchor="middle" font-size="10" fill="#888">minLength = L；k 段则最终答案 = dp[n][k]</text>
</svg>
