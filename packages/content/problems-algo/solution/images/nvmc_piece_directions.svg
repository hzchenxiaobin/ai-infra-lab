<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">棋子移动方向：车 / 象 / 后</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">每步沿选定方向走 1 格，步数 1–7（含原地不动共 8 种可能）</text>

  <g filter="url(#rough2)" font-size="11">

    <!-- ===== Rook (车) at (1,1) — left board ===== -->
    <text x="95" y="74" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">车 rook</text>
    <text x="95" y="90" text-anchor="middle" font-size="9" fill="#888">4 方向（水平+竖直）</text>

    <!-- mini 4x4 grid -->
    <g stroke="#bbb" stroke-width="1" fill="none">
      <rect x="40" y="100" width="120" height="120" fill="#fff"/>
      <line x1="70" y1="100" x2="70" y2="220"/>
      <line x1="100" y1="100" x2="100" y2="220"/>
      <line x1="130" y1="100" x2="130" y2="220"/>
      <line x1="40" y1="130" x2="160" y2="130"/>
      <line x1="40" y1="160" x2="160" y2="160"/>
      <line x1="40" y1="190" x2="160" y2="190"/>
    </g>

    <!-- rook piece -->
    <rect x="43" y="193" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="55" y="210" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">车</text>

    <!-- direction arrows from (1,1)=bottom-left cell center (55,205) -->
    <path d="M 55 195 L 55 115" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" stroke-dasharray="4,3"/>
    <path d="M 65 205 L 145 205" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" stroke-dasharray="4,3"/>
    <text x="62" y="112" font-size="9" fill="#446688">↑ 上</text>
    <text x="148" y="200" font-size="9" fill="#446688">→ 右</text>

    <!-- rook count badge -->
    <rect x="38" y="230" width="124" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6"/>
    <text x="100" y="246" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">角角：1+7+7 = 15 种</text>


    <!-- ===== Bishop (象) at center — middle board ===== -->
    <text x="280" y="74" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">象 bishop</text>
    <text x="280" y="90" text-anchor="middle" font-size="9" fill="#888">4 方向（斜对角）</text>

    <g stroke="#bbb" stroke-width="1" fill="none">
      <rect x="220" y="100" width="120" height="120" fill="#fff"/>
      <line x1="250" y1="100" x2="250" y2="220"/>
      <line x1="280" y1="100" x2="280" y2="220"/>
      <line x1="310" y1="100" x2="310" y2="220"/>
      <line x1="220" y1="130" x2="340" y2="130"/>
      <line x1="220" y1="160" x2="340" y2="160"/>
      <line x1="220" y1="190" x2="340" y2="190"/>
    </g>

    <!-- bishop piece at center (2,2) -->
    <rect x="253" y="163" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="265" y="180" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">象</text>

    <!-- 4 diagonal arrows from center (265,175) -->
    <path d="M 258 168 L 228 138" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" stroke-dasharray="4,3"/>
    <path d="M 272 168 L 302 138" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" stroke-dasharray="4,3"/>
    <path d="M 258 182 L 228 212" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" stroke-dasharray="4,3"/>
    <path d="M 272 182 L 302 212" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" stroke-dasharray="4,3"/>

    <!-- bishop count badge -->
    <rect x="218" y="230" width="124" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6"/>
    <text x="280" y="246" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">中心：1+4+4+3+2 种</text>


    <!-- ===== Queen (后) at (1,1) — right board ===== -->
    <text x="465" y="74" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">后 queen</text>
    <text x="465" y="90" text-anchor="middle" font-size="9" fill="#888">8 方向（车+象合集）</text>

    <g stroke="#bbb" stroke-width="1" fill="none">
      <rect x="400" y="100" width="120" height="120" fill="#fff"/>
      <line x1="430" y1="100" x2="430" y2="220"/>
      <line x1="460" y1="100" x2="460" y2="220"/>
      <line x1="490" y1="100" x2="490" y2="220"/>
      <line x1="400" y1="130" x2="520" y2="130"/>
      <line x1="400" y1="160" x2="520" y2="160"/>
      <line x1="400" y1="190" x2="520" y2="190"/>
    </g>

    <!-- queen piece at (1,1) -->
    <rect x="403" y="193" width="24" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <text x="415" y="210" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">后</text>

    <!-- arrows: up, right, up-right diag -->
    <path d="M 415 195 L 415 115" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" stroke-dasharray="4,3"/>
    <path d="M 425 205 L 505 205" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" stroke-dasharray="4,3"/>
    <path d="M 425 195 L 505 115" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" stroke-dasharray="4,3"/>

    <!-- queen count badge -->
    <rect x="398" y="230" width="124" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6"/>
    <text x="460" y="246" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">角角：1+7+7+7 = 22 种</text>

  </g>

  <!-- ===== Move encoding box ===== -->
  <rect x="30" y="270" width="500" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="290" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">移动 = (起点, 方向 dr/​dc, 步数 steps)，步数 0 = 原地不动</text>
  <text x="280" y="306" text-anchor="middle" font-size="10" fill="#555">t 时刻位置 = (sr + dr·min(t,steps), sc + dc·min(t,steps))，到达终点后停在原地</text>
  <text x="280" y="320" text-anchor="middle" font-size="10" fill="#888">每枚棋子最多 ~28 种移动（后在中心），n ≤ 4 → DFS 枚举组合可行</text>

  <!-- legend -->
  <g filter="url(#rough2)" font-size="9" fill="#666">
    <rect x="40" y="350" width="12" height="12" fill="#e8f0fe" stroke="#446688" rx="2"/>
    <text x="58" y="360">车：水平/竖直</text>
    <rect x="160" y="350" width="12" height="12" fill="#e6f4ea" stroke="#4a7a3a" rx="2"/>
    <text x="178" y="360">象：斜对角</text>
    <rect x="260" y="350" width="12" height="12" fill="#fff8e1" stroke="#d6a040" rx="2"/>
    <text x="278" y="360">后：车+象（8 方向）</text>
    <text x="420" y="360" fill="#888">虚线箭头 = 可选方向</text>
  </g>
</svg>
