<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">k 个连通分量 + 冗余线缆 → 拔线重连</text>

  <!-- ===== Top: 3 components ===== -->
  <rect x="20" y="44" width="500" height="130" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="270" y="64" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">初始网络：6 台计算机，3 个连通分量</text>

  <!-- Component A: {0,1,2,3} with redundant edge (1,2) -->
  <circle cx="90" cy="110" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="90" y="115" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <circle cx="170" cy="110" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="115" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <circle cx="170" cy="155" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="160" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <circle cx="90" cy="155" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="90" y="160" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>

  <!-- tree edges (green) -->
  <line x1="106" y1="110" x2="154" y2="110" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <line x1="170" y1="126" x2="170" y2="139" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <line x1="106" y1="155" x2="154" y2="155" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <!-- redundant edge (0,3) red dashed -->
  <path d="M 90 126 Q 70 132 90 139" stroke="#b85450" stroke-width="2.5" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="50" y="136" font-size="9.5" fill="#b85450" font-weight="bold">冗余</text>

  <!-- Component B: {4} -->
  <circle cx="310" cy="130" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="135" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>

  <!-- Component C: {5} -->
  <circle cx="430" cy="130" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="135" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>

  <text x="130" y="184" text-anchor="middle" font-size="10" fill="#4a7a3a">分量 ①（4 节点 4 边，1 条冗余）</text>
  <text x="310" y="162" text-anchor="middle" font-size="10" fill="#d6a040">分量 ②</text>
  <text x="430" y="162" text-anchor="middle" font-size="10" fill="#d6a040">分量 ③</text>

  <!-- arrow down: move cables -->
  <line x1="270" y1="178" x2="270" y2="206" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="196" font-size="11" fill="#b85450" font-weight="bold">拔冗余线 → 连孤岛</text>

  <!-- ===== Bottom: all connected ===== -->
  <rect x="20" y="208" width="500" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="270" y="228" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">操作 2 次后：全部连通（k−1 = 3−1 = 2）</text>

  <!-- all 6 nodes connected in a tree -->
  <circle cx="90" cy="270" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="90" y="275" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <circle cx="170" cy="270" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="275" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <circle cx="170" cy="315" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="320" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <circle cx="90" cy="315" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="90" y="320" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <circle cx="310" cy="270" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="275" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <circle cx="430" cy="270" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="275" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>

  <!-- tree edges -->
  <line x1="106" y1="270" x2="154" y2="270" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <line x1="170" y1="286" x2="170" y2="299" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <line x1="106" y1="315" x2="154" y2="315" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <!-- moved cables (red, now solid) -->
  <line x1="186" y1="270" x2="294" y2="270" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <line x1="326" y1="270" x2="414" y2="270" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="240" y="260" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">重连①</text>
  <text x="370" y="260" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">重连②</text>

  <!-- summary box -->
  <rect x="30" y="338" width="480" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="270" y="358" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">关键：连通分量数 k → 需 k−1 次操作</text>
  <text x="270" y="376" text-anchor="middle" font-size="10.5" fill="#666">冗余线缆 = m − (n − k) ≥ k − 1（当 m ≥ n−1 时必然够用）</text>
</svg>
