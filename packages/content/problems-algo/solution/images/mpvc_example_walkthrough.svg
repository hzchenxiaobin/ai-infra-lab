<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="300" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：示例 1 一次遍历建聚合表</text>
  <text x="270" y="46" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">每行展示处理第 i 个三元组后 total[c] 与 best[c] 的状态</text>

  <!-- table header -->
  <rect x="30" y="58" width="460" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="50" y="73" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">i</text>
  <text x="105" y="73" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">创作者</text>
  <text x="170" y="73" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">视频 id</text>
  <text x="230" y="73" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">播放量</text>
  <text x="305" y="73" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">total[c] (后)</text>
  <text x="420" y="73" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">best[c] (后)</text>

  <!-- row i=0 -->
  <rect x="30" y="82" width="460" height="22" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="97" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="105" y="97" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">alice</text>
  <text x="170" y="97" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">one</text>
  <text x="230" y="97" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="305" y="97" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">alice = 5</text>
  <text x="420" y="97" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">one (5)</text>

  <!-- row i=1 -->
  <rect x="30" y="104" width="460" height="22" rx="4" fill="#f6f6f6" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="119" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="105" y="119" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">bob</text>
  <text x="170" y="119" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">two</text>
  <text x="230" y="119" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">10</text>
  <text x="305" y="119" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">bob = 10</text>
  <text x="420" y="119" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">two (10)</text>

  <!-- row i=2 -->
  <rect x="30" y="126" width="460" height="22" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="141" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="105" y="141" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">alice</text>
  <text x="170" y="141" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">three</text>
  <text x="230" y="141" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="305" y="141" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">alice = 10</text>
  <text x="420" y="141" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">one (5) 保留</text>

  <!-- row i=3 -->
  <rect x="30" y="148" width="460" height="22" rx="4" fill="#f6f6f6" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="163" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="105" y="163" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">chris</text>
  <text x="170" y="163" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">four</text>
  <text x="230" y="163" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="305" y="163" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">chris = 4</text>
  <text x="420" y="163" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">four (4)</text>

  <!-- summary box -->
  <rect x="30" y="178" width="460" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="198" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">循环结束：maxPop = 10</text>
  <text x="260" y="216" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">total[alice] = 10、total[bob] = 10  ⟹  选中 alice、bob</text>

  <!-- answer box -->
  <rect x="30" y="230" width="460" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="252" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">alice：one、three 平票 5，one 字典序更小 → one</text>
  <text x="260" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">答案 = [[alice, one], [bob, two]]</text>
</svg>
