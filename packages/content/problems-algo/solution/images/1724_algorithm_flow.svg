<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    算法流程：构造（建树）+ 查询（LCA 判瓶颈）
  </text>

  <!-- ===== 构建阶段 ===== -->
  <rect x="30" y="40" width="500" height="250" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="50" y="60" font-size="13" fill="#446688" filter="url(#rough2)">构造函数 DistanceLimitedPathsFinder(n, edgeList)</text>

  <!-- 步骤 1 -->
  <rect x="60" y="76" width="440" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="97" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① 边按权值 w 升序排序</text>

  <line x1="280" y1="108" x2="280" y2="124" stroke="#446688" stroke-width="1.5" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- 步骤 2 -->
  <rect x="60" y="126" width="440" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="147" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② 初始化 KRT 森林：n 个叶节点，w[i]=0；uf[i]=i</text>

  <line x1="280" y1="158" x2="280" y2="174" stroke="#446688" stroke-width="1.5" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- 步骤 3 决策菱形 -->
  <polygon points="280,176 410,212 280,248 150,212" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="206" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ 遍历边(u,v,w)</text>
  <text x="280" y="222" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">ru=find(u), rv=find(v)</text>
  <text x="280" y="238" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">ru == rv ?</text>

  <!-- Yes 分支（右） -->
  <line x1="410" y1="212" x2="470" y2="212" stroke="#446688" stroke-width="1.5" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="440" y="206" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="470" y="198" width="70" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="505" y="217" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">跳过</text>

  <!-- No 分支（下） -->
  <line x1="280" y1="248" x2="280" y2="262" stroke="#446688" stroke-width="1.5" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="296" y="258" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- 步骤 4 -->
  <rect x="60" y="262" width="440" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="277" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">④ 建虚点 t：w[t]=w；t 指向 ru、rv 为子；uf 合并以 t 为新根</text>

  <!-- 步骤 5 -->
  <rect x="60" y="294" width="440" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="312" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">⑤ 全部边处理后，对 KRT 森林 DFS 预处理 up[v][k]、depth[v]（binary lifting）</text>

  <!-- ===== 查询阶段 ===== -->
  <rect x="30" y="340" width="500" height="120" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="50" y="360" font-size="13" fill="#b85450" filter="url(#rough2)">查询 query(p, q, limit) —— 在线 O(log n)</text>

  <rect x="60" y="372" width="440" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="390" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">⑥ l = LCA(p, q)（binary lifting，按 depth 对齐 + 跳 2^k）</text>

  <line x1="280" y1="400" x2="280" y2="412" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- 判定 -->
  <polygon points="280,414 360,434 280,454 200,434" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="432" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">w[l] &lt; limit ?</text>
  <text x="280" y="446" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">true / false</text>

  <text x="380" y="438" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓ 连通</text>
  <text x="120" y="438" font-size="11" fill="#b85450" filter="url(#rough2)">✗ 不连通</text>
</svg>
