<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：二分能力阈值 c，贪心验证能否抢够 k 间</text>

  <!-- ===== Left: street + threshold + greedy ===== -->
  <text x="40" y="56" font-size="12" fill="#888">nums = [2, 3, 5, 9], k = 2</text>

  <!-- value axis label -->
  <text x="28" y="200" text-anchor="middle" font-size="11" fill="#888" transform="rotate(-90 28 200)">金额</text>

  <!-- base line -->
  <line x1="60" y1="320" x2="420" y2="320" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- threshold c = 5 (dashed) -->
  <line x1="60" y1="240" x2="420" y2="240" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="426" y="244" font-size="12" fill="#d6a040" font-weight="bold">c = 5</text>

  <!-- House 0: value 2 (height 32) robbed -->
  <rect x="80" y="288" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="108" y="312" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <text x="108" y="338" text-anchor="middle" font-size="10" fill="#888">idx0</text>
  <text x="108" y="280" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">抢✓</text>

  <!-- House 1: value 3 (height 48) robbable but greedy skips (adjacent) -->
  <rect x="160" y="272" width="56" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="188" y="304" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <text x="188" y="338" text-anchor="middle" font-size="10" fill="#888">idx1</text>
  <text x="188" y="264" text-anchor="middle" font-size="11" fill="#888">跳过</text>

  <!-- House 2: value 5 (height 80) robbed -->
  <rect x="240" y="240" width="56" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="268" y="286" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <text x="268" y="338" text-anchor="middle" font-size="10" fill="#888">idx2</text>
  <text x="268" y="232" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">抢✓</text>

  <!-- House 3: value 9 (height 144) above threshold -->
  <rect x="320" y="176" width="56" height="144" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="348" y="254" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">9</text>
  <text x="348" y="338" text-anchor="middle" font-size="10" fill="#888">idx3</text>
  <text x="348" y="168" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">&gt;c</text>

  <!-- greedy arrows: idx0 -> idx2 (skip idx1) -->
  <path d="M 136 300 Q 188 360 240 300" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- count result box -->
  <rect x="70" y="352" width="300" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="220" y="367" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">贪心抢 2 间 ≥ k=2 → check(5) = true</text>

  <!-- ===== Right: monotonicity note ===== -->
  <rect x="440" y="60" width="125" height="160" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="502" y="84" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">f(c) 单调</text>
  <text x="450" y="108" font-size="10.5" fill="#444">c ↑ ⟹ 阈值放宽，</text>
  <text x="450" y="124" font-size="10.5" fill="#444">可选房增多，</text>
  <text x="450" y="140" font-size="10.5" fill="#444">贪心抢的间数</text>
  <text x="450" y="156" font-size="10.5" fill="#444">f(c) 不降。</text>
  <text x="450" y="184" font-size="10.5" fill="#b85450" font-weight="bold">二段性：</text>
  <text x="450" y="200" font-size="10.5" fill="#444">小 c 不可行，</text>
  <text x="450" y="216" font-size="10.5" fill="#444">大 c 可行 →</text>
  <text x="450" y="232" font-size="10.5" fill="#444">二分最小可行 c。</text>

  <!-- mini step plot -->
  <line x1="455" y1="270" x2="555" y2="270" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="455" y1="270" x2="455" y2="232" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 455 266 L 475 266 L 475 252 L 510 252 L 510 240 L 545 240 L 545 234 L 555 234" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <line x1="455" y1="246" x2="555" y2="246" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="558" y="250" font-size="9" fill="#b85450">k</text>
  <text x="455" y="284" font-size="9" fill="#888">c→</text>
</svg>
