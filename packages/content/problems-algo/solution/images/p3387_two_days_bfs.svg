<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 432"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="432" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：两天各是一张森林，两遍 BFS + 一张倒数表</text>
  <text x="260" y="37" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">示例 1：第 1 天 EUR→USD→JPY；第 2 天 JPY→USD→CHF→EUR</text>

  <!-- 第 1 天 框 -->
  <rect x="20" y="46" width="480" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="34" y="64" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">第 1 天 · 图 1</text>
  <text x="120" y="64" font-size="9.5" fill="#33506b" filter="url(#rough2)">BFS from EUR（每条边双向，反向 = 1/r）</text>

  <rect x="40" y="76" width="64" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="72" y="95" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">EUR</text>
  <rect x="228" y="76" width="64" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="95" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">USD</text>
  <rect x="416" y="76" width="64" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="448" y="95" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">JPY</text>

  <path d="M 106 90 L 224 90" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="165" y="83" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">×2.0</text>
  <path d="M 294 90 L 412 90" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="353" y="83" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">×3.0</text>

  <text x="72" y="124" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">d₁ = 1.0</text>
  <text x="260" y="124" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">d₁ = 2.0</text>
  <text x="448" y="124" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">d₁ = 6.0</text>

  <!-- 中间汇合说明 -->
  <rect x="58" y="152" width="404" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="172" text-anchor="middle" font-size="11" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">枚举中间货币 X：ans = max d₁[X] / d₂[X]</text>
  <text x="260" y="190" text-anchor="middle" font-size="10" fill="#7a5a10" filter="url(#rough2)">第 2 天 X→EUR 的倍率 = 1/d₂[X]（路径唯一，反程逐边取倒数）</text>
  <text x="260" y="212" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">X = JPY：6 ÷ (1/120) = 720 ★</text>
  <path d="M 448 108 L 448 132 L 448 132" fill="none" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- 第 2 天 框 -->
  <rect x="20" y="238" width="480" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="34" y="256" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">第 2 天 · 图 2</text>
  <text x="120" y="256" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">还是从 EUR 出发 BFS（沿反向边：×1/6、×1/5、×1/4）</text>

  <rect x="28" y="268" width="58" height="28" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="57" y="287" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">EUR</text>
  <rect x="154" y="268" width="58" height="28" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="183" y="287" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">CHF</text>
  <rect x="280" y="268" width="58" height="28" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="309" y="287" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">USD</text>
  <rect x="406" y="268" width="58" height="28" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="435" y="287" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">JPY</text>

  <path d="M 88 282 L 150 282" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="119" y="275" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">×1/6</text>
  <path d="M 214 282 L 276 282" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="245" y="275" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">×1/5</text>
  <path d="M 340 282 L 402 282" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="371" y="275" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">×1/4</text>

  <text x="57" y="316" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">d₂ = 1</text>
  <text x="183" y="316" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">d₂ = 1/6</text>
  <text x="309" y="316" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">d₂ = 1/30</text>
  <text x="435" y="316" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">d₂ = 1/120</text>

  <!-- 第 2 天 JPY 与说明框的关联虚线 -->
  <path d="M 435 296 C 435 230 380 214 320 214" fill="none" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arro)" filter="url(#rough2)"/>

  <!-- 候选卡片 -->
  <text x="260" y="352" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">枚举所有 X（取 d₁、d₂ 都有的货币）：</text>
  <rect x="30" y="362" width="140" height="40" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="100" y="378" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">X = EUR：1/1 = 1</text>
  <text x="100" y="393" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">（两天都不动，保底）</text>
  <rect x="190" y="362" width="140" height="40" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="378" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">X = USD：2/(1/30) = 60</text>
  <text x="260" y="393" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">（第 2 天换不回则跳过）</text>
  <rect x="350" y="362" width="140" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="420" y="378" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">X = JPY：6/(1/120) = 720</text>
  <text x="420" y="393" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">★ 最大值，即答案</text>

  <text x="260" y="422" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">森林无环 ⇒ 任意两货币路径唯一 ⇒ 首达即最优、倒数即反程</text>
</svg>
