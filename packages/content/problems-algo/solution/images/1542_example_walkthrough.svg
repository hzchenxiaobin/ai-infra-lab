<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "3242415"  预期 ans = 5</text>

  <!-- s row -->
  <text x="20" y="58" font-size="11" fill="#888">s:</text>
  <g filter="url(#rough2)">
    <rect x="118" y="42" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="162" y="42" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="206" y="42" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <rect x="250" y="42" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="294" y="42" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <rect x="338" y="42" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="382" y="42" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
  </g>
  <text x="140" y="61" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="184" y="61" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="228" y="61" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <text x="272" y="61" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="316" y="61" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <text x="360" y="61" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="404" y="61" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <text x="140" y="84" text-anchor="middle" font-size="9" fill="#aaa">i=0</text>
  <text x="184" y="84" text-anchor="middle" font-size="9" fill="#aaa">i=1</text>
  <text x="228" y="84" text-anchor="middle" font-size="9" fill="#aaa">i=2</text>
  <text x="272" y="84" text-anchor="middle" font-size="9" fill="#aaa">i=3</text>
  <text x="316" y="84" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">i=4★</text>
  <text x="360" y="84" text-anchor="middle" font-size="9" fill="#aaa">i=5</text>
  <text x="404" y="84" text-anchor="middle" font-size="9" fill="#aaa">i=6</text>

  <!-- table header -->
  <rect x="20" y="100" width="580" height="26" fill="#446688" rx="4" filter="url(#rough2)"/>
  <text x="50" y="118" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">i</text>
  <text x="92" y="118" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">ch</text>
  <text x="150" y="118" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">mask</text>
  <text x="240" y="118" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">情形一命中</text>
  <text x="380" y="118" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">情形二命中（取最长）</text>
  <text x="520" y="118" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">ans</text>

  <!-- rows -->
  <g font-size="10.5" fill="#333" filter="url(#rough2)">
    <!-- row 0 -->
    <rect x="20" y="126" width="580" height="22" fill="#ffffff" stroke="#ddd" stroke-width="0.8"/>
    <text x="50" y="141" text-anchor="middle">0</text>
    <text x="92" y="141" text-anchor="middle">3</text>
    <text x="150" y="141" text-anchor="middle">8</text>
    <text x="240" y="141" text-anchor="middle" fill="#aaa">—</text>
    <text x="380" y="141" text-anchor="middle" fill="#b85450">8⊕8=0 @−1 → len 1</text>
    <text x="520" y="141" text-anchor="middle" font-weight="bold">1</text>
    <!-- row 1 -->
    <rect x="20" y="148" width="580" height="22" fill="#f7f7f7" stroke="#ddd" stroke-width="0.8"/>
    <text x="50" y="163" text-anchor="middle">1</text>
    <text x="92" y="163" text-anchor="middle">2</text>
    <text x="150" y="163" text-anchor="middle">12</text>
    <text x="240" y="163" text-anchor="middle" fill="#aaa">—</text>
    <text x="380" y="163" text-anchor="middle" fill="#b85450">12⊕4=8 @0 → len 1</text>
    <text x="520" y="163" text-anchor="middle" font-weight="bold">1</text>
    <!-- row 2 -->
    <rect x="20" y="170" width="580" height="22" fill="#ffffff" stroke="#ddd" stroke-width="0.8"/>
    <text x="50" y="185" text-anchor="middle">2</text>
    <text x="92" y="185" text-anchor="middle">4</text>
    <text x="150" y="185" text-anchor="middle">28</text>
    <text x="240" y="185" text-anchor="middle" fill="#aaa">—</text>
    <text x="380" y="185" text-anchor="middle" fill="#b85450">28⊕16=12 @1 → len 1</text>
    <text x="520" y="185" text-anchor="middle" font-weight="bold">1</text>
    <!-- row 3 -->
    <rect x="20" y="192" width="580" height="22" fill="#f7f7f7" stroke="#ddd" stroke-width="0.8"/>
    <text x="50" y="207" text-anchor="middle">3</text>
    <text x="92" y="207" text-anchor="middle">2</text>
    <text x="150" y="207" text-anchor="middle">24</text>
    <text x="240" y="207" text-anchor="middle" fill="#aaa">—</text>
    <text x="380" y="207" text-anchor="middle" fill="#b85450">24⊕16=8 @0 → len 3</text>
    <text x="520" y="207" text-anchor="middle" font-weight="bold">3</text>
    <!-- row 4 highlight -->
    <rect x="20" y="214" width="580" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <text x="50" y="229" text-anchor="middle" font-weight="bold">4</text>
    <text x="92" y="229" text-anchor="middle" font-weight="bold">4</text>
    <text x="150" y="229" text-anchor="middle" font-weight="bold">8</text>
    <text x="240" y="229" text-anchor="middle" fill="#4a7a3a">@0 → len 4</text>
    <text x="380" y="229" text-anchor="middle" fill="#b85450" font-weight="bold">8⊕8=0 @−1 → len 5 ★</text>
    <text x="520" y="229" text-anchor="middle" font-weight="bold" fill="#b85450">5</text>
    <!-- row 5 -->
    <rect x="20" y="236" width="580" height="22" fill="#f7f7f7" stroke="#ddd" stroke-width="0.8"/>
    <text x="50" y="251" text-anchor="middle">5</text>
    <text x="92" y="251" text-anchor="middle">1</text>
    <text x="150" y="251" text-anchor="middle">10</text>
    <text x="240" y="251" text-anchor="middle" fill="#aaa">—</text>
    <text x="380" y="251" text-anchor="middle" fill="#b85450">10⊕2=8 @0 → len 5</text>
    <text x="520" y="251" text-anchor="middle" font-weight="bold">5</text>
    <!-- row 6 -->
    <rect x="20" y="258" width="580" height="22" fill="#ffffff" stroke="#ddd" stroke-width="0.8"/>
    <text x="50" y="273" text-anchor="middle">6</text>
    <text x="92" y="273" text-anchor="middle">5</text>
    <text x="150" y="273" text-anchor="middle">42</text>
    <text x="240" y="273" text-anchor="middle" fill="#aaa">—</text>
    <text x="380" y="273" text-anchor="middle" fill="#b85450">42⊕32=10 @5 → len 1</text>
    <text x="520" y="273" text-anchor="middle" font-weight="bold">5</text>
  </g>

  <!-- bracket spanning s[0..4] -->
  <path d="M 118 300 Q 118 312 126 312 L 332 312 Q 340 312 340 300" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="225" y="306" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">i=4 命中空前缀 −1 → s[0..4]="32424" 长度 5</text>

  <!-- note box -->
  <rect x="40" y="328" width="540" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="310" y="350" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">i=4 关键：翻入第二个 4 后 mask 回到 8（与 i=0 相同）</text>
  <text x="310" y="370" text-anchor="middle" font-size="11" fill="#333">情形一：first[8]=0 → s[1..4]="2424" 全偶，len 4</text>
  <text x="310" y="390" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">情形二：first[8⊕8]=first[0]=−1 → s[0..4] 恰一奇(3)，len 5</text>
  <text x="310" y="410" text-anchor="middle" font-size="11" fill="#4a7a3a">→ 枚举「差一位」目标才覆盖奇长回文，这是情形二的价值</text>
</svg>
