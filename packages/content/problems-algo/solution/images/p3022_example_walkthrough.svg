<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [3,5,3,2,7]，k = 2 → 答案 3</text>
  <text x="310" y="44" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">full = 3|5|3|2|7 = 7 = 111₂；cur = 当前段 AND（二进制），括号内为累计 cnt</text>
  <text x="310" y="61" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">切段 = 段已与 mask 不相交（0 操作）｜ 吞并 = 并给下一段（1 操作）｜ 尾并 = 尾段并入上一段（1 操作）</text>

  <!-- Row: bit 2 -->
  <rect x="40" y="74" width="100" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="90" y="91" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">bit 2（值 4）</text>
  <text x="90" y="106" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">试探 mask=100</text>

  <rect x="244" y="74" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="89" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="270" y="103" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">cur=011</text>
  <text x="270" y="126" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">切段</text>

  <rect x="300" y="74" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="326" y="89" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="326" y="103" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">cur=101</text>
  <text x="326" y="126" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">吞并(1)</text>

  <rect x="356" y="74" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="382" y="89" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="382" y="103" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">cur=001</text>
  <text x="382" y="126" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">切段</text>

  <rect x="412" y="74" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="438" y="89" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="438" y="103" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">cur=010</text>
  <text x="438" y="126" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">切段</text>

  <rect x="468" y="74" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="494" y="89" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <text x="494" y="103" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">cur=111</text>
  <text x="494" y="126" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">尾并(2)</text>

  <text x="382" y="146" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">cnt = 2 ≤ k = 2 ✓ → bit 2 清零（划分 [3] [5,3] [2,7] → 3,1,2）</text>

  <!-- Row: bit 1 -->
  <rect x="40" y="168" width="100" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="90" y="185" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">bit 1（值 2）</text>
  <text x="90" y="200" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">试探 mask=110</text>

  <rect x="244" y="168" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="183" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="270" y="197" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">cur=011</text>
  <text x="270" y="220" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">吞并(1)</text>

  <rect x="300" y="168" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="326" y="183" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="326" y="197" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">cur=001</text>
  <text x="326" y="220" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">切段</text>

  <rect x="356" y="168" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="382" y="183" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="382" y="197" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">cur=011</text>
  <text x="382" y="220" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">吞并(2)</text>

  <rect x="412" y="168" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="438" y="183" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="438" y="197" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">cur=010</text>
  <text x="438" y="220" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">吞并(3)</text>

  <rect x="468" y="168" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="494" y="183" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <text x="494" y="197" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">cur=010</text>
  <text x="494" y="220" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">尾并(4)</text>

  <text x="382" y="240" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">cnt = 4 &gt; k = 2 ✗ → bit 1 留在答案</text>

  <!-- Row: bit 0 -->
  <rect x="40" y="262" width="100" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="90" y="279" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">bit 0（值 1）</text>
  <text x="90" y="294" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">试探 mask=101</text>

  <rect x="244" y="262" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="277" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="270" y="291" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">cur=011</text>
  <text x="270" y="314" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">吞并(1)</text>

  <rect x="300" y="262" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="326" y="277" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="326" y="291" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">cur=001</text>
  <text x="326" y="314" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">吞并(2)</text>

  <rect x="356" y="262" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="382" y="277" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="382" y="291" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">cur=001</text>
  <text x="382" y="314" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">吞并(3)</text>

  <rect x="412" y="262" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="438" y="277" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="438" y="291" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">cur=000</text>
  <text x="438" y="314" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">切段</text>

  <rect x="468" y="262" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="494" y="277" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <text x="494" y="291" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">cur=111</text>
  <text x="494" y="314" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">尾并(4)</text>

  <text x="382" y="334" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">cnt = 4 &gt; k = 2 ✗ → bit 0 留在答案</text>

  <!-- Summary -->
  <rect x="40" y="352" width="540" height="88" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="310" y="376" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">cleared = 100₂（只有 bit 2 清掉）</text>
  <text x="310" y="398" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">答案 = full &amp; ~cleared = 111₂ &amp; 011₂ = 011₂ = 3 ✓</text>
  <text x="310" y="420" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">对照：划分 [3] [5,3] [2,7] → 段值 3,1,2 → OR = 3 | 1 | 2 = 3，与官方示例一致</text>
</svg>
