<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="360" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：多种情形对照</text>

  <!-- column separators -->
  <line x1="100" y1="48" x2="100" y2="248" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="180" y1="48" x2="180" y2="248" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="270" y1="48" x2="270" y2="248" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="380" y1="48" x2="380" y2="248" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="500" y1="48" x2="500" y2="248" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- header -->
  <rect x="25" y="48" width="565" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="62" y="66" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">s</text>
  <text x="140" y="66" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">goal</text>
  <text x="225" y="66" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">s==goal?</text>
  <text x="325" y="66" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">diff 下标</text>
  <text x="440" y="66" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">判定</text>
  <text x="545" y="66" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">结果</text>

  <!-- row 1: ab / ba -> true -->
  <rect x="25" y="78" width="565" height="32" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="62" y="99" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">"ab"</text>
  <text x="140" y="99" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">"ba"</text>
  <text x="225" y="99" text-anchor="middle" font-size="11" fill="#555">否</text>
  <text x="325" y="99" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">[0, 1]</text>
  <text x="440" y="99" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">2处+交叉相等</text>
  <rect x="505" y="84" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="545" y="99" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">true ✓</text>

  <!-- row 2: aa / aa -> true (duplicate) -->
  <rect x="25" y="112" width="565" height="32" fill="#f6f8fa" stroke="#ddd" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="62" y="133" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">"aa"</text>
  <text x="140" y="133" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">"aa"</text>
  <text x="225" y="133" text-anchor="middle" font-size="11" fill="#555">是</text>
  <text x="325" y="133" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="440" y="133" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">有重复字符</text>
  <rect x="505" y="118" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="545" y="133" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">true ✓</text>

  <!-- row 3: ab / ab -> false (no dup) -->
  <rect x="25" y="146" width="565" height="32" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="62" y="167" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">"ab"</text>
  <text x="140" y="167" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">"ab"</text>
  <text x="225" y="167" text-anchor="middle" font-size="11" fill="#555">是</text>
  <text x="325" y="167" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="440" y="167" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">无重复字符</text>
  <rect x="505" y="152" width="80" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="545" y="167" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">false ✗</text>

  <!-- row 4: ab / ca -> false (cross fail) -->
  <rect x="25" y="180" width="565" height="32" fill="#f6f8fa" stroke="#ddd" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="62" y="201" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">"ab"</text>
  <text x="140" y="201" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">"ca"</text>
  <text x="225" y="201" text-anchor="middle" font-size="11" fill="#555">否</text>
  <text x="325" y="201" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">[0, 1]</text>
  <text x="440" y="201" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">2处但交叉不等</text>
  <rect x="505" y="186" width="80" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="545" y="201" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">false ✗</text>

  <!-- row 5: abc / adc -> false (count != 2) -->
  <rect x="25" y="214" width="565" height="32" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="62" y="235" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">"abc"</text>
  <text x="140" y="235" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">"adc"</text>
  <text x="225" y="235" text-anchor="middle" font-size="11" fill="#555">否</text>
  <text x="325" y="235" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">[1]</text>
  <text x="440" y="235" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">仅1处不同</text>
  <rect x="505" y="220" width="80" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="545" y="235" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">false ✗</text>

  <!-- bottom note -->
  <rect x="120" y="270" width="360" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="300" y="289" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">关键：先按 s==goal 分两支</text>
  <text x="300" y="305" text-anchor="middle" font-size="10.5" fill="#446688">相同串查重复 · 不同串查「恰好2处且交叉相等」</text>
</svg>
