<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="480" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：从 (tx, ty) 逆向走链，每轮撤销一步</text>

  <!-- 初始化 -->
  <g filter="url(#rough2)">
    <rect x="140" y="34" width="220" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="250" y="52" text-anchor="middle" font-size="11" fill="#33455e" font-weight="bold">x, y = (tx, ty)，moves = 0</text>
    <text x="250" y="70" text-anchor="middle" font-size="9.5" fill="#33455e">特判：起点=目标 ⟹ 0；起点=(0,0) ⟹ −1</text>
  </g>
  <path d="M 250 80 L 250 94" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D1 命中起点 -->
  <g filter="url(#rough2)">
    <polygon points="250,96 328,126 250,156 172,126" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="250" y="130" text-anchor="middle" font-size="10.5" fill="#33455e" font-weight="bold">(x,y) = (sx,sy)?</text>
  </g>
  <path d="M 328 126 L 392 126" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="118" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="396" y="110" width="104" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="448" y="130" text-anchor="middle" font-size="11.5" fill="#2a5a2a" font-weight="bold">返回 moves</text>
  </g>
  <path d="M 250 156 L 250 172" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D2 跌破起点 -->
  <g filter="url(#rough2)">
    <polygon points="250,174 334,204 250,234 166,204" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="250" y="200" text-anchor="middle" font-size="10" fill="#33455e" font-weight="bold">x &lt; sx</text>
    <text x="250" y="215" text-anchor="middle" font-size="10" fill="#33455e" font-weight="bold">或 y &lt; sy ?</text>
  </g>
  <path d="M 334 204 L 392 204" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="363" y="196" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="396" y="188" width="104" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
    <text x="448" y="208" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">返回 −1</text>
  </g>
  <path d="M 250 234 L 250 250" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D3 对角线 -->
  <g filter="url(#rough2)">
    <polygon points="250,252 322,280 250,308 178,280" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="250" y="284" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold">x = y ?</text>
  </g>
  <path d="M 322 280 L 348 280" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="335" y="272" text-anchor="middle" font-size="9.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="352" y="254" width="158" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="431" y="271" text-anchor="middle" font-size="9" fill="#8a6d1f">s = 起点非零坐标</text>
    <text x="431" y="285" text-anchor="middle" font-size="9" fill="#8a6d1f">x = s·2^k ⟹ 返回</text>
    <text x="431" y="299" text-anchor="middle" font-size="9" fill="#8a6d1f">moves+1+k，否则 −1</text>
  </g>
  <path d="M 250 308 L 250 324" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 撤销一步 -->
  <g filter="url(#rough2)">
    <rect x="76" y="326" width="348" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="250" y="345" text-anchor="middle" font-size="10.5" fill="#2a5a2a" font-weight="bold">撤销一步（不妨设 x ≥ y，否则对称交换）</text>
    <text x="250" y="362" text-anchor="middle" font-size="9.5" fill="#2a5a2a">x ≥ 2y ⟹ x 奇则 −1，偶则 x ÷= 2（翻倍型）</text>
    <text x="250" y="379" text-anchor="middle" font-size="9.5" fill="#2a5a2a">y &lt; x &lt; 2y ⟹ x −= y（累加型）</text>
  </g>
  <path d="M 250 392 L 250 406" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- moves++ 回边 -->
  <g filter="url(#rough2)">
    <rect x="170" y="408" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="250" y="427" text-anchor="middle" font-size="11" fill="#33455e" font-weight="bold">moves += 1，循环继续</text>
  </g>
  <path d="M 170 423 L 44 423 L 44 126 L 166 126" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="34" y="270" font-size="9" fill="#666" text-anchor="middle" transform="rotate(-90 34 270)" filter="url(#rough2)">未命中 ⟹ 继续撤销</text>

  <!-- 底部说明 -->
  <g filter="url(#rough2)">
    <rect x="60" y="450" width="400" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
    <text x="260" y="467" text-anchor="middle" font-size="10" fill="#8a6d1f">链长 O(log)：翻倍 ≤ 30 步 + 辗转相减 ≈ 45 步，全程无需取模批量</text>
  </g>
</svg>
