<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="380" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：FROM Tweets → WHERE CHAR_LENGTH &gt; 15 → SELECT tweet_id</text>

  <!-- Step 1: FROM -->
  <rect x="20" y="54" width="160" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="100" y="76" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">① FROM Tweets</text>
  <text x="100" y="94" text-anchor="middle" font-size="9.5" fill="#333">读取全部推文行</text>
  <text x="100" y="110" text-anchor="middle" font-size="9" fill="#888">tweet_id | content</text>

  <path d="M182 90 L218 90" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 2: WHERE -->
  <rect x="220" y="54" width="260" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="350" y="76" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">② WHERE 过滤</text>
  <text x="350" y="94" text-anchor="middle" font-size="9.5" fill="#333">CHAR_LENGTH(content) &gt; 15</text>
  <text x="350" y="110" text-anchor="middle" font-size="9" fill="#888">逐行算字符数，保留无效推文</text>

  <path d="M482 90 L518 90" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 3: SELECT -->
  <rect x="520" y="54" width="100" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="570" y="76" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">③ SELECT</text>
  <text x="570" y="94" text-anchor="middle" font-size="9.5" fill="#333">tweet_id</text>
  <text x="570" y="110" text-anchor="middle" font-size="9" fill="#888">仅投影 ID 列</text>

  <!-- Arrow down to result -->
  <path d="M350 128 L350 152" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Result table -->
  <rect x="200" y="156" width="300" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="350" y="178" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">结果（tweet_id）</text>

  <rect x="240" y="186" width="220" height="22" fill="#fafafa" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="350" y="202" text-anchor="middle" font-size="9.5" fill="#888">tweet_id</text>

  <text x="350" y="230" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- SQL execution order -->
  <rect x="20" y="156" width="160" height="92" fill="#fafafa" stroke="#999" stroke-width="1.2" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="100" y="178" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">SQL 执行顺序</text>
  <text x="35" y="198" font-size="9.5" fill="#555">FROM → WHERE</text>
  <text x="35" y="214" font-size="9.5" fill="#555">→ SELECT</text>
  <text x="35" y="232" font-size="9" fill="#888">WHERE 在 SELECT 前</text>
  <text x="35" y="244" font-size="9" fill="#888">可用未投影列 content</text>

  <!-- ===== Bottom: key points ===== -->
  <rect x="20" y="266" width="600" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="320" y="290" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">关键要点</text>
  <text x="40" y="312" font-size="10.5" fill="#333">① CHAR_LENGTH(content) 在 WHERE 阶段逐行计算字符数（含空格）</text>
  <text x="40" y="332" font-size="10.5" fill="#333">② 严格 &gt; 15 保留：长度恰为 15 的推文有效，不满足条件被丢弃</text>
  <text x="40" y="352" font-size="10.5" fill="#333">③ SELECT 只投影 tweet_id，content 仅用于过滤不输出（谓词下推）</text>
</svg>
