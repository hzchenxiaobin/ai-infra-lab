<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="880" height="440" fill="#fafafa"/>

  <text x="440" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：push 与 pop</text>
  <path d="M 290 40 Q 440 48 590 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== LEFT: push(val) ===== -->
  <text x="200" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">push(val)</text>

  <!-- step 1 -->
  <g filter="url(#sk)">
    <rect x="60" y="86" width="280" height="44" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="200" y="104" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">① 频率 +1</text>
  <text x="200" y="120" text-anchor="middle" font-size="11" fill="#444">f = ++freq[val]</text>

  <path d="M 200 130 L 200 148" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- step 2 -->
  <g filter="url(#sk)">
    <rect x="60" y="150" width="280" height="44" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="200" y="168" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">② 压入对应频率桶</text>
  <text x="200" y="184" text-anchor="middle" font-size="11" fill="#444">group[f].push(val)</text>

  <path d="M 200 194 L 200 212" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- step 3 -->
  <g filter="url(#sk)">
    <rect x="60" y="214" width="280" height="44" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="200" y="232" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">③ 更新最大频率</text>
  <text x="200" y="248" text-anchor="middle" font-size="11" fill="#444">maxFreq = max(maxFreq, f)</text>

  <path d="M 200 258 L 200 276" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- done -->
  <g filter="url(#sk)">
    <ellipse cx="200" cy="296" rx="46" ry="20" fill="#f5f5f5" stroke="#888" stroke-width="1.3"/>
  </g>
  <text x="200" y="300" text-anchor="middle" font-size="12" fill="#444">完成</text>

  <!-- ===== RIGHT: pop() ===== -->
  <text x="640" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">pop()</text>

  <!-- step 1 -->
  <g filter="url(#sk)">
    <rect x="500" y="86" width="280" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="640" y="104" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">① 取最大频率桶栈顶</text>
  <text x="640" y="120" text-anchor="middle" font-size="11" fill="#444">x = group[maxFreq].pop()</text>

  <path d="M 640 130 L 640 148" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- step 2 -->
  <g filter="url(#sk)">
    <rect x="500" y="150" width="280" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="640" y="168" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">② 频率 -1</text>
  <text x="640" y="184" text-anchor="middle" font-size="11" fill="#444">freq[x]--</text>

  <path d="M 640 194 L 640 212" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- step 3: decision -->
  <g filter="url(#sk)">
    <path d="M 640 214 L 740 246 L 640 278 L 540 246 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="640" y="240" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">group[maxFreq]</text>
  <text x="640" y="256" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">为空?</text>

  <!-- yes branch -->
  <text x="486" y="250" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <path d="M 540 246 L 460 246" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="320" y="224" width="140" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="390" y="242" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">maxFreq--</text>
  <text x="390" y="258" text-anchor="middle" font-size="10" fill="#888">(下一非空桶)</text>

  <!-- no branch -->
  <text x="660" y="296" font-size="11" fill="#2e6e2e" font-weight="bold">否</text>
  <path d="M 640 278 L 640 308" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- merge -->
  <path d="M 390 268 Q 390 320 580 326" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 640 308 L 640 326" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <ellipse cx="640" cy="346" rx="60" ry="20" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="640" y="350" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">return x</text>

  <!-- invariant note -->
  <g filter="url(#sk)">
    <rect x="40" y="386" width="800" height="44" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/>
  </g>
  <text x="60" y="406" font-size="11" fill="#444">不变式：group[f] 的栈顶 = 最晚达到频率 f 的值。maxFreq 桶的栈顶即「频率最高且最接近栈顶」的元素。</text>
  <text x="60" y="422" font-size="10" fill="#888" font-style="italic">push 只会往更高的桶压；pop 只从当前最高桶取，桶空就降 maxFreq——maxFreq 单调「爬升后下降」，绝不跳过空层。</text>
</svg>
