<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：nums = [0, 0, 1, 0, 1, 1, 1, 1]</text>

  <text x="280" y="52" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">下标 0–7，基准 = index 3 (值 0)，x = query(0,1,2,3) = 2</text>

  <text x="22" y="82" font-size="11" fill="#446688" filter="url(#rough2)">值</text>
  <rect x="50" y="68" width="55" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="77" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">0</text>
  <rect x="105" y="68" width="55" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="132" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">0</text>
  <rect x="160" y="68" width="55" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="187" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <rect x="215" y="68" width="55" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="242" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">0</text>
  <rect x="270" y="68" width="55" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="297" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <rect x="325" y="68" width="55" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="352" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <rect x="380" y="68" width="55" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="407" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <rect x="435" y="68" width="55" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="462" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>

  <text x="22" y="118" font-size="11" fill="#446688" filter="url(#rough2)">下标</text>
  <text x="77" y="118" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">0</text>
  <text x="132" y="118" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">1</text>
  <text x="187" y="118" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">2</text>
  <text x="242" y="118" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">3 ★</text>
  <text x="297" y="118" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">4</text>
  <text x="352" y="118" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">5</text>
  <text x="407" y="118" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">6</text>
  <text x="462" y="118" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">7</text>

  <text x="22" y="150" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">① 循环 i=4..7</text>
  <text x="180" y="150" font-size="10" fill="#666" filter="url(#rough2)">query(0,1,2,i) vs x=2</text>

  <rect x="22" y="158" width="516" height="22" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="40" y="173" font-size="10" fill="#333" filter="url(#rough2)">i</text>
  <text x="80" y="173" font-size="10" fill="#333" filter="url(#rough2)">4</text>
  <text x="130" y="173" font-size="10" fill="#333" filter="url(#rough2)">5</text>
  <text x="180" y="173" font-size="10" fill="#333" filter="url(#rough2)">6</text>
  <text x="230" y="173" font-size="10" fill="#333" filter="url(#rough2)">7</text>
  <text x="300" y="173" font-size="10" fill="#333" filter="url(#rough2)">返回值</text>
  <text x="370" y="173" font-size="10" fill="#333" filter="url(#rough2)">0, 0, 0, 0（均≠2）</text>
  <text x="490" y="173" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">b=4, k=7</text>

  <text x="22" y="200" font-size="10" fill="#4a7a3a" filter="url(#rough2)">nums[4..7]=1 ≠ nums[3]=0 → 全归入"不同组" b</text>

  <line x1="22" y1="212" x2="538" y2="212" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <text x="22" y="232" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">② 判定 0, 1, 2</text>
  <text x="180" y="232" font-size="10" fill="#666" filter="url(#rough2)">y = query(0,1,2,4) = 0</text>

  <rect x="22" y="240" width="516" height="62" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="40" y="258" font-size="10" fill="#333" filter="url(#rough2)">比较</text>
  <text x="170" y="258" font-size="10" fill="#333" filter="url(#rough2)">query(1,2,3,4)</text>
  <text x="290" y="258" font-size="10" fill="#333" filter="url(#rough2)">= 0 == y</text>
  <text x="380" y="258" font-size="10" fill="#4a7a3a" filter="url(#rough2)">→ nums[0]=nums[3]</text>
  <text x="490" y="258" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">a=2</text>

  <text x="170" y="278" font-size="10" fill="#333" filter="url(#rough2)">query(0,2,3,4)</text>
  <text x="290" y="278" font-size="10" fill="#333" filter="url(#rough2)">= 0 == y</text>
  <text x="380" y="278" font-size="10" fill="#4a7a3a" filter="url(#rough2)">→ nums[1]=nums[3]</text>
  <text x="490" y="278" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">a=3</text>

  <text x="170" y="298" font-size="10" fill="#333" filter="url(#rough2)">query(0,1,3,4)</text>
  <text x="290" y="298" font-size="10" fill="#333" filter="url(#rough2)">= 2 ≠ y</text>
  <text x="380" y="298" font-size="10" fill="#b85450" filter="url(#rough2)">→ nums[2]≠nums[3]</text>
  <text x="490" y="298" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">b=5, k=2</text>

  <line x1="22" y1="318" x2="538" y2="318" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <text x="22" y="340" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">③ 分组统计</text>

  <rect x="30" y="352" width="240" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="150" y="372" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">A 组（= nums[3] = 0）</text>
  <text x="150" y="390" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">下标 {0, 1, 3}</text>
  <text x="150" y="404" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">a = 3</text>

  <rect x="290" y="352" width="240" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="410" y="372" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">B 组（≠ nums[3] = 1）</text>
  <text x="410" y="390" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">下标 {2, 4, 5, 6, 7}</text>
  <text x="410" y="404" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">b = 5</text>

  <rect x="130" y="422" width="300" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="441" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">b &gt; a → 多数是 1，返回 k = 2 ✓</text>
</svg>
