<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：哈希表 = 每条消息的「上次打印时间」</text>
  <text x="290" y="46" text-anchor="middle" font-size="11" fill="#888">只需一个 HashMap&lt;message, lastTimestamp&gt;，O(1) 查 / O(1) 更新</text>

  <!-- ===== 左侧：输入流 ===== -->
  <text x="40" y="82" font-size="12" fill="#444" font-weight="bold">输入流</text>
  <text x="40" y="96" font-size="10" fill="#888">(timestamp, message)</text>

  <rect x="40" y="108" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="127" text-anchor="middle" font-size="11" fill="#333">(11, "foo")</text>

  <rect x="40" y="144" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="163" text-anchor="middle" font-size="11" fill="#333">(12, "bar")</text>

  <text x="100" y="190" text-anchor="middle" font-size="10" fill="#888">…</text>

  <!-- 查表箭头 -->
  <line x1="162" y1="122" x2="222" y2="122" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="172" y="114" font-size="10" fill="#446688" font-weight="bold">查表</text>

  <!-- ===== 中部：HashMap ===== -->
  <text x="300" y="82" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">HashMap</text>

  <!-- 表头 -->
  <rect x="230" y="92" width="140" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="270" y="111" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">message</text>
  <text x="330" y="111" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">lastTs</text>

  <!-- 行 1: foo -->
  <rect x="230" y="122" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="265" y="141" text-anchor="middle" font-size="11" fill="#333">"foo"</text>
  <rect x="300" y="122" width="70" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="335" y="141" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>

  <!-- 行 2: bar -->
  <rect x="230" y="152" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="265" y="171" text-anchor="middle" font-size="11" fill="#333">"bar"</text>
  <rect x="300" y="152" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="335" y="171" text-anchor="middle" font-size="11" fill="#333">2</text>

  <!-- 行 3: baz -->
  <rect x="230" y="182" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="265" y="201" text-anchor="middle" font-size="11" fill="#333">"baz"</text>
  <rect x="300" y="182" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="335" y="201" text-anchor="middle" font-size="11" fill="#333">5</text>

  <!-- 查表结果 → 判定箭头 -->
  <line x1="372" y1="136" x2="432" y2="136" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="382" y="128" font-size="10" fill="#446688" font-weight="bold">判定</text>

  <!-- ===== 右侧：10 秒窗口判定 ===== -->
  <text x="510" y="82" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">10 秒窗口</text>

  <!-- 时间轴 -->
  <line x1="440" y1="170" x2="560" y2="170" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="444" y="184" font-size="10" fill="#888">lastTs</text>
  <text x="446" y="162" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <!-- 禁止区间 [1, 11) -->
  <rect x="446" y="166" width="96" height="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="494" y="160" text-anchor="middle" font-size="9" fill="#b85450">禁止区间 [1, 11)</text>
  <!-- 释放点 -->
  <line x1="542" y1="162" x2="542" y2="178" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="548" y="162" font-size="10" fill="#4a7a3a" font-weight="bold">11</text>
  <text x="548" y="184" font-size="9" fill="#4a7a3a">可打印</text>

  <!-- 判定规则 -->
  <rect x="430" y="196" width="130" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="495" y="210" text-anchor="middle" font-size="10" fill="#333">ts − lastTs ≥ 10 ?</text>
  <text x="495" y="224" text-anchor="middle" font-size="9" fill="#888">是 → 打印并更新</text>

  <!-- ===== 底部：两种结果 ===== -->
  <text x="40" y="256" font-size="12" fill="#444" font-weight="bold">判定结果：</text>

  <rect x="40" y="266" width="250" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="54" y="285" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 可打印（ts − last ≥ 10）</text>
  <text x="54" y="302" font-size="10" fill="#555">→ 更新 map[msg] = ts，返回 true</text>

  <rect x="310" y="266" width="250" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="324" y="285" font-size="11" fill="#b85450" font-weight="bold">✗ 不可打印（ts − last &lt; 10）</text>
  <text x="324" y="302" font-size="10" fill="#555">→ 不更新，返回 false</text>

  <!-- ===== 关键提示 ===== -->
  <rect x="30" y="328" width="530" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="44" y="349" font-size="11" fill="#4a7a3a" font-weight="bold">关键观察：</text>
  <text x="44" y="367" font-size="10" fill="#555">① 每条消息独立限速 → 用 message 作哈希键，lastTimestamp 作值</text>
  <text x="44" y="382" font-size="10" fill="#555">② 10 秒窗口 = 「ts − last ≥ 10」这一个不等式，无需队列/排序</text>
  <text x="44" y="397" font-size="10" fill="#555">③ 时间戳单调递增 → last 只会被更大的值覆盖，天然正确</text>
</svg>
