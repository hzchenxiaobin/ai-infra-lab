<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrD" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：两步走，无条件分支</text>

  <!-- ===== Stage 1: 入口 ===== -->
  <rect x="40" y="48" width="480" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="68" font-size="11" fill="#446688" font-weight="bold">入口</text>
  <text x="100" y="68" font-size="11" fill="#333">给定 node（题目保证非尾节点 → node.next 非空）</text>
  <!-- mini chain ... -> [node:1] -> [next:9] -> ... -->
  <text x="180" y="98" font-size="10" fill="#888">…</text>
  <rect x="200" y="84" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="225" y="99" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">node</text>
  <line x1="250" y1="95" x2="284" y2="95" stroke="#446688" stroke-width="1.4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="284" y="84" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="309" y="99" text-anchor="middle" font-size="10" fill="#333">next</text>
  <text x="346" y="98" font-size="10" fill="#888">…</text>

  <!-- arrow down -->
  <path d="M280 114 L280 138" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <circle cx="280" cy="126" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="130" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">①</text>

  <!-- ===== Stage 2: 复制值 ===== -->
  <rect x="40" y="142" width="480" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="56" y="162" font-size="11" fill="#d6a040" font-weight="bold">复制值</text>
  <text x="100" y="162" font-size="11" fill="#333" font-weight="bold">node.val = node.next.val</text>
  <text x="270" y="162" font-size="10" fill="#888">把后继的值搬到 node 上</text>
  <!-- mini chain: node now holds next's value, both same -->
  <text x="180" y="192" font-size="10" fill="#888">…</text>
  <rect x="200" y="178" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="225" y="193" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">9</text>
  <line x1="250" y1="189" x2="284" y2="189" stroke="#446688" stroke-width="1.4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="284" y="178" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="309" y="193" text-anchor="middle" font-size="10" fill="#333">9</text>
  <text x="346" y="192" font-size="10" fill="#888">…</text>
  <text x="400" y="193" font-size="9" fill="#d6a040">两个连续相同值</text>

  <!-- arrow down -->
  <path d="M280 208 L280 232" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <circle cx="280" cy="220" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="224" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">②</text>

  <!-- ===== Stage 3: 跳过后继 ===== -->
  <rect x="40" y="236" width="480" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="56" y="256" font-size="11" fill="#b85450" font-weight="bold">跳过后继</text>
  <text x="110" y="256" font-size="11" fill="#333" font-weight="bold">node.next = node.next.next</text>
  <text x="290" y="256" font-size="10" fill="#888">丢弃真后继（它已多余）</text>
  <!-- mini chain: node -> ... (next dropped) -->
  <text x="180" y="286" font-size="10" fill="#888">…</text>
  <rect x="200" y="272" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="225" y="287" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">9</text>
  <line x1="250" y1="283" x2="300" y2="283" stroke="#446688" stroke-width="1.4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="316" y="286" font-size="10" fill="#888">…</text>
  <!-- dropped next -->
  <rect x="330" y="272" width="40" height="22" fill="#eee" stroke="#bbb" stroke-width="1" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="350" y="287" text-anchor="middle" font-size="10" fill="#bbb">9</text>
  <line x1="332" y1="274" x2="368" y2="292" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- arrow down -->
  <path d="M280 302 L280 326" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== Stage 4: 结束 ===== -->
  <rect x="40" y="330" width="480" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="56" y="350" font-size="11" fill="#4a7a3a" font-weight="bold">结束</text>
  <text x="100" y="350" font-size="11" fill="#333">原地修改完成，从 head 看值序列已删除 node（函数无返回值）</text>
  <text x="100" y="366" font-size="10" fill="#888">时间 O(1) · 空间 O(1) · 前提：node 非尾节点</text>

  <!-- takeaway -->
  <rect x="40" y="384" width="480" height="12" fill="none"/>
</svg>
