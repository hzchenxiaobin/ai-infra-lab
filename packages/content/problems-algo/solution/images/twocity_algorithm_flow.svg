<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="560" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">
    算法流程：算 diff → 排序 → 前 n 取 aCost、后 n 取 bCost
  </text>

  <!-- Start -->
  <ellipse cx="280" cy="60" rx="150" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    开始: ans = 0, n = len(costs) / 2
  </text>
  <path d="M 280 80 L 280 98" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- compute diff -->
  <rect x="110" y="102" width="340" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="122" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    对每个 i: diff[i] = aCostᵢ − bCostᵢ
  </text>
  <path d="M 280 132 L 280 150" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- sort -->
  <rect x="110" y="154" width="340" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="174" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    按 diff 升序排序（最负在前 = 改派 a 最省）
  </text>
  <path d="M 280 184 L 280 202" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init i -->
  <rect x="210" y="206" width="140" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="225" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i = 0</text>
  <path d="M 280 234 L 280 252" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 1: i < 2n ? -->
  <polygon points="280,256 380,296 280,336 180,296" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="293" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i &lt; 2n ?</text>
  <text x="280" y="309" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">(还有人未派)</text>

  <!-- No branch -> return -->
  <path d="M 380 296 L 462 296" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="418" y="288" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <ellipse cx="496" cy="296" rx="48" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="496" y="300" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 ans</text>

  <!-- Yes down to decision 2 -->
  <path d="M 280 336 L 280 356" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="350" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- Decision 2: i < n ? -->
  <polygon points="280,360 380,400 280,440 180,400" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="397" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i &lt; n ?</text>
  <text x="280" y="413" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">(前 n 还是后 n)</text>

  <!-- Yes (left) -> aCost -->
  <path d="M 180 400 L 105 400 L 105 438" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="392" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="40" y="442" width="130" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="105" y="462" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">
    ans += aCostᵢ
  </text>

  <!-- No (right) -> bCost -->
  <path d="M 380 400 L 455 400 L 455 438" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="392" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">否</text>
  <rect x="390" y="442" width="130" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="455" y="462" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">
    ans += bCostᵢ
  </text>

  <!-- merge to i++ -->
  <path d="M 105 474 L 105 492 L 280 492 L 280 510" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 455 474 L 455 492 L 280 492" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- i++ -->
  <rect x="210" y="514" width="140" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="533" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i = i + 1</text>

  <!-- loop back: from i++ left, around far left, up to decision1 left point -->
  <path d="M 210 528 L 24 528 L 24 296 L 180 296" stroke="#888" stroke-width="1.5"
        fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="14" y="412" font-size="10.5" fill="#888" transform="rotate(-90 14 412)" filter="url(#rough2)">继续扫描下一人</text>
</svg>
