<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="500" fill="#fafafa"/>

  <text x="290" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：s = 1001101，模拟 4 步 = 扫描计数 1 + 3 = 4</text>
  <text x="290" y="40" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">橙 = 本步被移动的 1，红 = 被跨过的 0，绿 = 其余的 1</text>

  <!-- Panel A: greedy simulation -->
  <rect x="22" y="52" width="536" height="286" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">① 贪心模拟：每次操作最左的「10」</text>

  <!-- row 0: 1001101 -->
  <text x="92" y="102" text-anchor="end" font-size="9.5" fill="#888" filter="url(#rough2)">初始</text>
  <rect x="100" y="86" width="26" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="113" y="102" text-anchor="middle" font-size="12" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="129" y="86" width="26" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="102" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">0</text>
  <rect x="158" y="86" width="26" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="171" y="102" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">0</text>
  <rect x="187" y="86" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="102" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="216" y="86" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="229" y="102" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="245" y="86" width="26" height="24" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="258" y="102" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="274" y="86" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="287" y="102" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <path d="M 200 110 L 200 128" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="124" font-size="10" fill="#555" filter="url(#rough2)">① i=0：一次跳过 2 个 0</text>

  <!-- row 1: 0011101 -->
  <text x="92" y="148" text-anchor="end" font-size="9.5" fill="#888" filter="url(#rough2)">① 后</text>
  <rect x="100" y="132" width="26" height="24" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="113" y="148" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="129" y="132" width="26" height="24" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="142" y="148" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="158" y="132" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="171" y="148" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="187" y="132" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="148" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="216" y="132" width="26" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="229" y="148" text-anchor="middle" font-size="12" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="245" y="132" width="26" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="258" y="148" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">0</text>
  <rect x="274" y="132" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="287" y="148" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <path d="M 200 156 L 200 174" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="170" font-size="10" fill="#555" filter="url(#rough2)">② i=4：跳过 1 个 0</text>

  <!-- row 2: 0011011 -->
  <text x="92" y="194" text-anchor="end" font-size="9.5" fill="#888" filter="url(#rough2)">② 后</text>
  <rect x="100" y="178" width="26" height="24" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="113" y="194" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="129" y="178" width="26" height="24" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="142" y="194" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="158" y="178" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="171" y="194" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="187" y="178" width="26" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="194" text-anchor="middle" font-size="12" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="216" y="178" width="26" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="229" y="194" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">0</text>
  <rect x="245" y="178" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="258" y="194" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="274" y="178" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="287" y="194" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <path d="M 200 202 L 200 220" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="216" font-size="10" fill="#555" filter="url(#rough2)">③ i=3：跳过 1 个 0</text>

  <!-- row 3: 0010111 -->
  <text x="92" y="240" text-anchor="end" font-size="9.5" fill="#888" filter="url(#rough2)">③ 后</text>
  <rect x="100" y="224" width="26" height="24" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="113" y="240" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="129" y="224" width="26" height="24" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="142" y="240" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="158" y="224" width="26" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="171" y="240" text-anchor="middle" font-size="12" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="187" y="224" width="26" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="240" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">0</text>
  <rect x="216" y="224" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="229" y="240" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="245" y="224" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="258" y="240" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="274" y="224" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="287" y="240" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <path d="M 200 248 L 200 266" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="262" font-size="10" fill="#555" filter="url(#rough2)">④ i=2：跳过 1 个 0</text>

  <!-- row 4: 0001111 -->
  <text x="92" y="286" text-anchor="end" font-size="9.5" fill="#888" filter="url(#rough2)">④ 后</text>
  <rect x="100" y="270" width="26" height="24" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="113" y="286" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="129" y="270" width="26" height="24" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="142" y="286" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="158" y="270" width="26" height="24" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="171" y="286" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="187" y="270" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="286" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="216" y="270" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="229" y="286" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="245" y="270" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="258" y="286" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="274" y="270" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="287" y="286" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="320" y="286" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 无「10」残留，共 4 次</text>

  <text x="290" y="312" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">②③④ 跨的是同一个 0（原下标 5）：它左边的 3 个 1 逐个跨它（+3）</text>
  <text x="290" y="328" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">① 一次跨完原下标 1-2 的 0 段（+1）→ 每段 0 恰被左侧全部 1 各跨一次</text>

  <!-- Panel B: scan table -->
  <rect x="22" y="350" width="536" height="140" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="370" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 等价计数：一遍扫描，遇「新 0 段开头」累加 ones</text>

  <rect x="60" y="378" width="456" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="60" y="398" width="456" height="20" fill="#fff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="60" y="418" width="456" height="20" fill="#fff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="60" y="438" width="456" height="20" fill="#fff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <rect x="180" y="378" width="56" height="80" fill="#fff8e1" opacity="0.8" filter="url(#rough2)"/>
  <rect x="404" y="378" width="56" height="80" fill="#fff8e1" opacity="0.8" filter="url(#rough2)"/>

  <text x="92" y="392" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="92" y="412" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">s[i]</text>
  <text x="92" y="432" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">ones</text>
  <text x="92" y="452" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">ans</text>

  <text x="152" y="392" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="208" y="392" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="264" y="392" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="320" y="392" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="376" y="392" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="432" y="392" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="488" y="392" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">6</text>

  <text x="152" y="412" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="208" y="412" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="264" y="412" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="320" y="412" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="376" y="412" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="432" y="412" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="488" y="412" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <text x="152" y="432" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="208" y="432" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="264" y="432" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="320" y="432" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="376" y="432" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="432" y="432" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="488" y="432" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>

  <text x="152" y="452" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="208" y="452" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="264" y="452" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="320" y="452" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="376" y="452" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="432" y="452" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="488" y="452" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>

  <text x="290" y="478" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">i=1、i=5 都是「s[i-1]='1' 且 s[i]='0'」的新 0 段开头：分别 ans += 1、ans += 3 → 答案 4</text>
</svg>
