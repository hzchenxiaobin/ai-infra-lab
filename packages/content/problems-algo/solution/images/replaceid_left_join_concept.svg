<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="470" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">LEFT JOIN：保留全部员工，无唯一标识码则填 NULL</text>

  <!-- Employees table (left) -->
  <text x="100" y="56" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">Employees（左表）</text>
  <rect x="30" y="62" width="140" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="52" y="80" font-size="10" fill="#333">id</text>
  <text x="115" y="80" font-size="10" fill="#333">name</text>
  <line x1="80" y1="62" x2="80" y2="90" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="90" width="140" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="52" y="106" font-size="10" fill="#333">1</text>
  <text x="115" y="106" font-size="10" fill="#333">Alice</text>
  <line x1="80" y1="90" x2="80" y2="114" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="114" width="140" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="52" y="130" font-size="10" fill="#333">7</text>
  <text x="115" y="130" font-size="10" fill="#333">Bob</text>
  <line x1="80" y1="114" x2="80" y2="138" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="138" width="140" height="24" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="52" y="154" font-size="10" fill="#333">11</text>
  <text x="115" y="154" font-size="10" fill="#333">Meir</text>
  <line x1="80" y1="138" x2="80" y2="162" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="162" width="140" height="24" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="52" y="178" font-size="10" fill="#333">90</text>
  <text x="115" y="178" font-size="10" fill="#333">Winston</text>
  <line x1="80" y1="162" x2="80" y2="186" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="186" width="140" height="24" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="52" y="202" font-size="10" fill="#333">3</text>
  <text x="115" y="202" font-size="10" fill="#333">Jonathan</text>
  <line x1="80" y1="186" x2="80" y2="210" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="100" y="226" text-anchor="middle" font-size="9.5" fill="#d6a040">↑ Alice/Bob 无匹配（橙色）</text>

  <!-- EmployeeUNI table (right) -->
  <text x="480" y="56" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">EmployeeUNI（右表）</text>
  <rect x="410" y="62" width="140" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="432" y="80" font-size="10" fill="#333">id</text>
  <text x="500" y="80" font-size="10" fill="#333">unique_id</text>
  <line x1="460" y1="62" x2="460" y2="90" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="410" y="138" width="140" height="24" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="432" y="154" font-size="10" fill="#333">11</text>
  <text x="500" y="154" font-size="10" fill="#333">2</text>
  <line x1="460" y1="138" x2="460" y2="162" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="410" y="162" width="140" height="24" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="432" y="178" font-size="10" fill="#333">90</text>
  <text x="500" y="178" font-size="10" fill="#333">3</text>
  <line x1="460" y1="162" x2="460" y2="186" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="410" y="186" width="140" height="24" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="432" y="202" font-size="10" fill="#333">3</text>
  <text x="500" y="202" font-size="10" fill="#333">1</text>
  <line x1="460" y1="186" x2="460" y2="210" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Join arrows: ON e.id = u.id -->
  <path d="M170 150 L410 150" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M170 174 L410 174" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M170 198 L410 198" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <text x="290" y="144" text-anchor="middle" font-size="9.5" fill="#446688">ON e.id = u.id</text>

  <!-- Result table (bottom) -->
  <text x="290" y="252" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">结果（LEFT JOIN 产出，5 行）</text>
  <rect x="120" y="258" width="340" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="276" font-size="10" fill="#333">unique_id</text>
  <text x="320" y="276" font-size="10" fill="#333">name</text>
  <line x1="240" y1="258" x2="240" y2="286" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="120" y="286" width="340" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="175" y="301" font-size="10" fill="#b85450" font-weight="bold">null</text>
  <text x="320" y="301" font-size="10" fill="#333">Alice</text>
  <line x1="240" y1="286" x2="240" y2="308" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="120" y="308" width="340" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="175" y="323" font-size="10" fill="#b85450" font-weight="bold">null</text>
  <text x="320" y="323" font-size="10" fill="#333">Bob</text>
  <line x1="240" y1="308" x2="240" y2="330" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="120" y="330" width="340" height="22" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="175" y="345" font-size="10" fill="#333">2</text>
  <text x="320" y="345" font-size="10" fill="#333">Meir</text>
  <line x1="240" y1="330" x2="240" y2="352" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="120" y="352" width="340" height="22" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="175" y="367" font-size="10" fill="#333">3</text>
  <text x="320" y="367" font-size="10" fill="#333">Winston</text>
  <line x1="240" y1="352" x2="240" y2="374" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="120" y="374" width="340" height="22" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="175" y="389" font-size="10" fill="#333">1</text>
  <text x="320" y="389" font-size="10" fill="#333">Jonathan</text>
  <line x1="240" y1="374" x2="240" y2="396" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Callout for NULL rows -->
  <path d="M175 402 L175 422" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="60" y="426" width="460" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="448" text-anchor="middle" font-size="10.5" fill="#333">Alice/Bob 在 EmployeeUNI 中无记录，LEFT JOIN 仍保留该行，unique_id 填 null</text>
</svg>
