<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD2" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
      <path d="M0,0 L5,8 L10,0" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：逐格贪心填 min(行剩余, 列剩余)</text>

  <!-- Step 1: init -->
  <rect x="170" y="52" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="79" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">初始化 m×n 矩阵全 0</text>

  <path d="M 270 96 L 270 120" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrD2)" filter="url(#rough2)"/>

  <!-- Step 2: loop header -->
  <rect x="120" y="124" width="300" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="151" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">for i in 0..m-1,  for j in 0..n-1</text>

  <path d="M 270 168 L 270 192" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrD2)" filter="url(#rough2)"/>

  <!-- Step 3: compute min (diamond) -->
  <polygon points="270,196 380,236 270,276 160,236" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="232" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">x = min(rowSum[i],</text>
  <text x="270" y="248" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">colSum[j])</text>

  <path d="M 270 276 L 270 300" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrD2)" filter="url(#rough2)"/>

  <!-- Step 4: assign + subtract -->
  <rect x="110" y="304" width="320" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="326" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">matrix[i][j] = x</text>
  <text x="270" y="346" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">rowSum[i] -= x;  colSum[j] -= x</text>

  <!-- Loop back arrow -->
  <path d="M 432 332 Q 470 332 470 200 Q 470 146 422 146" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrD2)" filter="url(#rough2)"/>
  <text x="486" y="240" text-anchor="middle" font-size="10" fill="#4a7a3a">下一格</text>

  <path d="M 270 360 L 270 384" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrD2)" filter="url(#rough2)"/>

  <!-- Step 5: return -->
  <rect x="170" y="388" width="200" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="406" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">返回 matrix</text>

  <!-- Left side note -->
  <rect x="20" y="206" width="120" height="64" fill="#f0f7ff" stroke="#446688" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="80" y="226" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">关键不变量</text>
  <text x="80" y="242" text-anchor="middle" font-size="9.5" fill="#888">Σ行剩余 = Σ列剩余</text>
  <text x="80" y="256" text-anchor="middle" font-size="9.5" fill="#888">同步扣 x 保持</text>
  <text x="80" y="270" text-anchor="middle" font-size="9.5" fill="#888">最后一格自然相等</text>
</svg>
