<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="32" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">示例演算：main=9, add=10</text>

  <!-- 表头 -->
  <rect x="30" y="50" width="480" height="32" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="71" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">阶段</text>
  <text x="210" y="71" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">main</text>
  <text x="320" y="71" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">add</text>
  <text x="440" y="71" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">距离</text>

  <!-- 初始 -->
  <rect x="30" y="84" width="480" height="32" fill="#fafafa"
        stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="90" y="105" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">初始</text>
  <text x="210" y="105" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>
  <text x="320" y="105" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">10</text>
  <text x="440" y="105" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>

  <!-- 第1轮 -->
  <rect x="30" y="118" width="480" height="32" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="139" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">烧5+回流1</text>
  <text x="210" y="139" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="320" y="139" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>
  <text x="440" y="139" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">50</text>

  <!-- 第2轮 -->
  <rect x="30" y="152" width="480" height="32" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="173" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">烧5+回流1</text>
  <text x="210" y="173" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="320" y="173" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>
  <text x="440" y="173" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">100</text>

  <!-- 剩余 -->
  <rect x="30" y="186" width="480" height="32" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="207" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">烧剩 1 升</text>
  <text x="210" y="207" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="320" y="207" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>
  <text x="440" y="207" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">110</text>

  <!-- 结论框 -->
  <rect x="30" y="240" width="480" height="50" fill="#fce4ec"
        stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="262" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">2 轮 × 50 + 剩 1 × 10 = 110 km</text>
  <text x="270" y="282" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">= 10 × (9 + 2) , 其中 2 = min((9-1)//4, 10)</text>

  <!-- 公式提示 -->
  <text x="270" y="320" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">距离 = 10 × ( main + min((main-1)//4, add) )</text>
  <path d="M150,330 L390,330" stroke="#446688" stroke-width="1.5" stroke-dasharray="4 4" filter="url(#rough2)"/>
</svg>
