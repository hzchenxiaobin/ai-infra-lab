<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">游程编码 (RLE)：相邻相同字符合并为 (字符, 次数) 组</text>

  <!-- S string with colored groups -->
  <text x="40" y="61" font-size="12" fill="#888">S =</text>

  <rect x="80" y="44" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="94" y="63" text-anchor="middle" font-size="13" fill="#333">h</text>

  <rect x="108" y="44" width="84" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="63" text-anchor="middle" font-size="13" fill="#333">eee</text>

  <rect x="192" y="44" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="63" text-anchor="middle" font-size="13" fill="#333">ll</text>

  <rect x="248" y="44" width="84" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="63" text-anchor="middle" font-size="13" fill="#333">ooo</text>

  <!-- RLE representation -->
  <text x="40" y="101" font-size="12" fill="#888">RLE:</text>

  <rect x="80" y="84" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="103" text-anchor="middle" font-size="12" fill="#333">(h, 1)</text>

  <rect x="145" y="84" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="103" text-anchor="middle" font-size="12" fill="#333">(e, 3)</text>

  <rect x="210" y="84" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="103" text-anchor="middle" font-size="12" fill="#333">(l, 2)</text>

  <rect x="275" y="84" width="60" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="305" y="103" text-anchor="middle" font-size="12" fill="#333">(o, 3)</text>

  <!-- Section title for cases -->
  <text x="260" y="134" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">扩张判定规则（逐组比较 S_cnt 与 word_cnt）</text>

  <!-- Case 1: equal (green) -->
  <rect x="15" y="144" width="155" height="106" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="92" y="164" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">情况 1：相等</text>
  <text x="92" y="184" text-anchor="middle" font-size="10.5" fill="#444">S_cnt == word_cnt</text>
  <text x="92" y="202" text-anchor="middle" font-size="10.5" fill="#444">不需扩张，直接匹配</text>
  <text x="92" y="224" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 匹配</text>
  <text x="92" y="242" text-anchor="middle" font-size="9.5" fill="#888">例: l — 2 == 2</text>

  <!-- Case 2: extendable (blue) -->
  <rect x="180" y="144" width="155" height="106" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="257" y="164" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">情况 2：可扩张</text>
  <text x="257" y="184" text-anchor="middle" font-size="10.5" fill="#444">S_cnt &gt; word_cnt</text>
  <text x="257" y="202" text-anchor="middle" font-size="10.5" fill="#444">且 S_cnt ≥ 3</text>
  <text x="257" y="224" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">✓ 匹配</text>
  <text x="257" y="242" text-anchor="middle" font-size="9.5" fill="#888">例: e — 1→3, 3≥3</text>

  <!-- Case 3: not extendable (red) -->
  <rect x="345" y="144" width="155" height="106" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="422" y="164" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">情况 3：不可扩张</text>
  <text x="422" y="184" text-anchor="middle" font-size="10.5" fill="#444">S_cnt &gt; word_cnt</text>
  <text x="422" y="202" text-anchor="middle" font-size="10.5" fill="#444">但 S_cnt &lt; 3</text>
  <text x="422" y="224" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗ 不匹配</text>
  <text x="422" y="242" text-anchor="middle" font-size="9.5" fill="#888">例: l — 1→2, 2&lt;3</text>

  <!-- Bottom note -->
  <rect x="40" y="266" width="440" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="288" text-anchor="middle" font-size="11" fill="#444">关键约束：扩张操作只能将字母组扩展到长度 ≥ 3</text>
  <text x="260" y="306" text-anchor="middle" font-size="11" fill="#444">因此 S_cnt &gt; word_cnt 时，必须 S_cnt ≥ 3 才合法</text>
  <text x="260" y="324" text-anchor="middle" font-size="10" fill="#888">（S_cnt &lt; word_cnt 永远不合法：只能加字符不能删）</text>
</svg>
