<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 408" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="408" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [6, 5, 7, 8] 的全部 10 个子数组</text>

  <!-- header row -->
  <rect x="44" y="40" width="432" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="88" y="56" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">[l, r]</text>
  <text x="184" y="56" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">删除内容</text>
  <text x="301" y="56" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">剩余元素</text>
  <text x="421" y="56" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">判定</text>

  <!-- data rows: 7 green (ok) then 3 red (fail) -->
  <rect x="44" y="64" width="432" height="26" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="44" y="90" width="432" height="26" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="44" y="116" width="432" height="26" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="44" y="142" width="432" height="26" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="44" y="168" width="432" height="26" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="44" y="194" width="432" height="26" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="44" y="220" width="432" height="26" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="44" y="246" width="432" height="26" fill="#fce4ec" filter="url(#rough2)"/>
  <rect x="44" y="272" width="432" height="26" fill="#fce4ec" filter="url(#rough2)"/>
  <rect x="44" y="298" width="432" height="26" fill="#fce4ec" filter="url(#rough2)"/>

  <!-- row 1: [0,0] -->
  <text x="88" y="82" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">[0, 0]</text>
  <text x="184" y="82" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">[6]</text>
  <text x="301" y="82" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">[5, 7, 8]</text>
  <text x="421" y="82" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <!-- row 2: [0,1] -->
  <text x="88" y="108" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">[0, 1]</text>
  <text x="184" y="108" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">[6, 5]</text>
  <text x="301" y="108" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">[7, 8]</text>
  <text x="421" y="108" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <!-- row 3: [0,2] -->
  <text x="88" y="134" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">[0, 2]</text>
  <text x="184" y="134" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">[6, 5, 7]</text>
  <text x="301" y="134" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">[8]</text>
  <text x="421" y="134" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <!-- row 4: [0,3] -->
  <text x="88" y="160" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">[0, 3]</text>
  <text x="184" y="160" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">[6, 5, 7, 8]</text>
  <text x="301" y="160" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">[]（空也算递增）</text>
  <text x="421" y="160" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <!-- row 5: [1,1] -->
  <text x="88" y="186" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">[1, 1]</text>
  <text x="184" y="186" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">[5]</text>
  <text x="301" y="186" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">[6, 7, 8]</text>
  <text x="421" y="186" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <!-- row 6: [1,2] -->
  <text x="88" y="212" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">[1, 2]</text>
  <text x="184" y="212" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">[5, 7]</text>
  <text x="301" y="212" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">[6, 8]</text>
  <text x="421" y="212" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <!-- row 7: [1,3] -->
  <text x="88" y="238" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">[1, 3]</text>
  <text x="184" y="238" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">[5, 7, 8]</text>
  <text x="301" y="238" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">[6]</text>
  <text x="421" y="238" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <!-- row 8: [2,2] -->
  <text x="88" y="264" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">[2, 2]</text>
  <text x="184" y="264" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">[7]</text>
  <text x="301" y="264" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">[6, 5, 8]</text>
  <text x="421" y="264" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 6 &gt; 5</text>

  <!-- row 9: [2,3] -->
  <text x="88" y="290" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">[2, 3]</text>
  <text x="184" y="290" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">[7, 8]</text>
  <text x="301" y="290" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">[6, 5]</text>
  <text x="421" y="290" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 6 &gt; 5</text>

  <!-- row 10: [3,3] -->
  <text x="88" y="316" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">[3, 3]</text>
  <text x="184" y="316" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">[8]</text>
  <text x="301" y="316" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">[6, 5, 7]</text>
  <text x="421" y="316" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 6 &gt; 5</text>

  <!-- column separators & table border -->
  <line x1="132" y1="40" x2="132" y2="324" stroke="#b8c4d0" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="236" y1="40" x2="236" y2="324" stroke="#b8c4d0" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="366" y1="40" x2="366" y2="324" stroke="#b8c4d0" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="44" y="40" width="432" height="284" fill="none" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>

  <!-- summary box -->
  <rect x="44" y="344" width="432" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="364" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">7 个 ✓ —— 与示例输出一致</text>
  <text x="260" y="382" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">3 个 ✗ 全部栽在：保留部分内部有断崖（6 &gt; 5）</text>
</svg>
