<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：nums = [2,0,2]，queries = [[0,2,1],[0,2,1],[1,1,3]]</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">对每个 k 做一次 check：差分打点 → 前缀和 cov → 逐位与 nums 比较</text>

  <!-- 表头 -->
  <rect x="24" y="54" width="130" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="89" y="72" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">下标 →</text>
  <rect x="158" y="54" width="92" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="204" y="72" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="254" y="54" width="92" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="300" y="72" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="350" y="54" width="92" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="396" y="72" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="446" y="54" width="52" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="472" y="72" text-anchor="middle" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">判定</text>

  <!-- nums 行 -->
  <rect x="24" y="86" width="130" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="89" y="105" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">nums（目标）</text>
  <rect x="158" y="86" width="92" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="204" y="105" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="254" y="86" width="92" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="300" y="105" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="350" y="86" width="92" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="396" y="105" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="446" y="86" width="52" height="30" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="472" y="105" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">−</text>

  <!-- k=0 行 -->
  <rect x="24" y="120" width="130" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="89" y="140" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">k=0 · cov</text>
  <rect x="158" y="120" width="92" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="204" y="140" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">0 &lt; 2 ✗</text>
  <rect x="254" y="120" width="92" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="300" y="140" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">0 ≥ 0 ✓</text>
  <rect x="350" y="120" width="92" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="396" y="140" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">0 &lt; 2 ✗</text>
  <rect x="446" y="120" width="52" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="472" y="140" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <!-- k=1 行 -->
  <rect x="24" y="156" width="130" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="89" y="176" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">k=1 · cov</text>
  <rect x="158" y="156" width="92" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="204" y="176" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">1 &lt; 2 ✗</text>
  <rect x="254" y="156" width="92" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="300" y="176" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1 ≥ 0 ✓</text>
  <rect x="350" y="156" width="92" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="396" y="176" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">1 &lt; 2 ✗</text>
  <rect x="446" y="156" width="52" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="472" y="176" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <!-- k=2 行（答案） -->
  <rect x="24" y="192" width="130" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="89" y="213" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">k=2 · cov</text>
  <rect x="158" y="192" width="92" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="204" y="213" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2 ≥ 2 ✓</text>
  <rect x="254" y="192" width="92" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="300" y="213" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2 ≥ 0 ✓</text>
  <rect x="350" y="192" width="92" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="396" y="213" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2 ≥ 2 ✓</text>
  <rect x="446" y="192" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="472" y="207" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="472" y="220" text-anchor="middle" font-size="9" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">答案</text>

  <!-- k=3 行（可行但非最小） -->
  <rect x="24" y="230" width="130" height="32" fill="#f7fbf7" stroke="#9cb89c" stroke-width="1" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="89" y="250" text-anchor="middle" font-size="10.5" fill="#7a9a7a" filter="url(#rough2)">k=3 · cov</text>
  <rect x="158" y="230" width="92" height="32" fill="#f7fbf7" stroke="#9cb89c" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="204" y="250" text-anchor="middle" font-size="10" fill="#7a9a7a" filter="url(#rough2)">2 ≥ 2 ✓</text>
  <rect x="254" y="230" width="92" height="32" fill="#f7fbf7" stroke="#9cb89c" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="300" y="250" text-anchor="middle" font-size="10" fill="#7a9a7a" filter="url(#rough2)">5 ≥ 0 ✓</text>
  <rect x="350" y="230" width="92" height="32" fill="#f7fbf7" stroke="#9cb89c" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="396" y="250" text-anchor="middle" font-size="10" fill="#7a9a7a" filter="url(#rough2)">2 ≥ 2 ✓</text>
  <rect x="446" y="230" width="52" height="32" fill="#f7fbf7" stroke="#9cb89c" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="472" y="250" text-anchor="middle" font-size="9" fill="#7a9a7a" filter="url(#rough2)">✓ 非最小</text>

  <!-- 单调性注 -->
  <path d="M 60 260 L 60 132" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="260" y="278" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">k 增大 → cov 逐位只增不减；第 3 条查询（val=3）全落在本来就为 0 的下标 1 上，帮不上忙</text>

  <!-- 底部结论 -->
  <rect x="24" y="290" width="472" height="64" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="34" y="308" font-size="10.5" fill="#333" filter="url(#rough2)">二分轨迹（q = 3，区间 [0, 3]）：check(1) = ✗ → lo = 2；check(2) = ✓ → hi = 2 → 答案 2</text>
  <text x="34" y="326" font-size="10.5" fill="#333" filter="url(#rough2)">示例 2：check(q) 得 cov = [1, 3, 3, 2]，下标 0 的 1 &lt; 4 → 全部查询都不够 → 返回 −1</text>
  <text x="34" y="344" font-size="10.5" fill="#666" filter="url(#rough2)">边界：nums 全零 → check(0) 直接成立，答案 0；k = 0 也是合法取值</text>
</svg>
