<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="540" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">网格照明算法流程</text>

  <!-- 开始 -->
  <ellipse cx="280" cy="56" rx="50" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="61" text-anchor="middle" font-size="12" fill="#333">输入 n, lamps, queries</text>

  <path d="M 280 74 L 280 92" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤1：建表 -->
  <rect x="80" y="96" width="400" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="118" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">步骤 1：建表（遍历 lamps）</text>
  <text x="280" y="138" text-anchor="middle" font-size="10.5" fill="#555">对每个 (r,c)：若 lampSet.insert 成功（去重）</text>
  <text x="280" y="150" text-anchor="middle" font-size="10.5" fill="#555">→ rowCnt[r]++、colCnt[c]++、diag1[r−c]++、diag2[r+c]++</text>

  <path d="M 280 154 L 280 172" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤2：遍历查询 -->
  <rect x="120" y="176" width="320" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="199" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">步骤 2：遍历每个 query (r, c)</text>

  <path d="M 280 214 L 280 232" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定照亮 -->
  <polygon points="280,236 410,276 280,316 150,276" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="270" text-anchor="middle" font-size="10.5" fill="#333">四个计数表</text>
  <text x="280" y="285" text-anchor="middle" font-size="10.5" fill="#333">任一 &gt; 0 ?</text>
  <text x="280" y="300" text-anchor="middle" font-size="10" fill="#888">row/col/diag1/diag2</text>

  <!-- 是 / 否 -->
  <text x="300" y="250" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <text x="150" y="270" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- ans = 1 -->
  <path d="M 280 316 L 280 336" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="200" y="340" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="235" y="359" text-anchor="middle" font-size="11" fill="#333">ans=1</text>

  <path d="M 150 276 L 100 276 L 100 340" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="65" y="340" width="70" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="359" text-anchor="middle" font-size="11" fill="#333">ans=0</text>

  <!-- 汇合到关灯 -->
  <path d="M 235 368 L 235 388" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 100 368 L 100 378 L 235 378" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 步骤3：关灯 3x3 -->
  <rect x="60" y="392" width="440" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="413" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">步骤 3：关闭 (r,c) 的 3×3 邻域灯</text>
  <text x="280" y="431" text-anchor="middle" font-size="10.5" fill="#555">遍历 9 格 (nr,nc)：越界跳过；</text>
  <text x="280" y="445" text-anchor="middle" font-size="10.5" fill="#555">若 (nr,nc) ∈ lampSet → erase 并 4 表各 −1</text>

  <path d="M 280 456 L 280 474" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 回到下一个 query -->
  <polygon points="280,478 340,498 280,518 220,498" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="502" text-anchor="middle" font-size="10" fill="#333">还有</text>
  <text x="280" y="514" text-anchor="middle" font-size="10" fill="#333">query?</text>

  <!-- 循环回上 -->
  <path d="M 220 498 L 60 498 L 60 194 L 120 194" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="40" y="350" font-size="9.5" fill="#888" transform="rotate(-90 40 350)">是 → 下一个</text>

  <!-- 否 → 返回 -->
  <path d="M 340 498 L 510 498 L 510 56" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="518" y="280" font-size="9.5" fill="#888" transform="rotate(90 518 280)">否 → 返回 ans</text>

</svg>
