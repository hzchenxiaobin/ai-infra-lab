<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">交换两个节点 → 中序序列出现逆序</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">BST 中序本应严格递增；两个值错位后，序列里出现 1 或 2 处 prev &gt; cur</text>

  <!-- ===== Top: correct BST ===== -->
  <rect x="20" y="58" width="520" height="150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="142" y="78" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">合法 BST ✅</text>

  <!-- tree: 2 root, left 1, right 3, 3.right 4 -->
  <g font-size="12" filter="url(#rough2)">
    <circle cx="142" cy="108" r="17" fill="#fff" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="142" y="113" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <circle cx="92" cy="158" r="15" fill="#fff" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="92" y="163" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <circle cx="192" cy="158" r="15" fill="#fff" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="192" y="163" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <circle cx="232" cy="192" r="13" fill="#fff" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="232" y="197" text-anchor="middle" fill="#4a7a3a" font-weight="bold">4</text>
    <path d="M 130 122 L 104 144" stroke="#4a7a3a" stroke-width="1.3" fill="none"/>
    <path d="M 154 122 L 180 144" stroke="#4a7a3a" stroke-width="1.3" fill="none"/>
    <path d="M 204 172 L 222 180" stroke="#4a7a3a" stroke-width="1.3" fill="none"/>
  </g>

  <!-- inorder strip: 1,2,3,4 all green ascending -->
  <text x="400" y="78" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">中序序列</text>
  <g font-size="12" filter="url(#rough2)">
    <rect x="300" y="92" width="38" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="319" y="111" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <path d="M 340 106 L 354 106" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arrG)"/>
    <rect x="356" y="92" width="38" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="375" y="111" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <path d="M 396 106 L 410 106" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arrG)"/>
    <rect x="412" y="92" width="38" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="431" y="111" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <path d="M 452 106 L 466 106" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arrG)"/>
    <rect x="468" y="92" width="38" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="487" y="111" text-anchor="middle" fill="#4a7a3a" font-weight="bold">4</text>
  </g>
  <text x="400" y="140" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">严格递增：1 &lt; 2 &lt; 3 &lt; 4</text>
  <text x="400" y="156" text-anchor="middle" font-size="9" fill="#555">相邻差均为正 → 合法</text>
  <text x="400" y="184" text-anchor="middle" font-size="10" fill="#4a7a3a">（交换 2 与 3 的值后呢？↓）</text>

  <!-- ===== Bottom: swapped BST ===== -->
  <rect x="20" y="218" width="520" height="170" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="142" y="238" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">错位 BST ⚠️（2↔3 交换）</text>

  <!-- tree: 2 root, left 1, right 3(now holds value 2), 3.right 4(now holds value 3) -->
  <!-- after swap: root=2 unchanged; node '3' now val=2; node '4' now val=3 -->
  <g font-size="12" filter="url(#rough2)">
    <circle cx="142" cy="268" r="17" fill="#fff" stroke="#b85450" stroke-width="1.8"/>
    <text x="142" y="273" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <circle cx="92" cy="318" r="15" fill="#fff" stroke="#b85450" stroke-width="1.5"/>
    <text x="92" y="323" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <!-- swapped node: was 3, now 2 -->
    <circle cx="192" cy="318" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="192" y="323" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
    <!-- swapped node: was 4's pos holds 3 -->
    <circle cx="232" cy="352" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="232" y="357" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
    <path d="M 130 282 L 104 304" stroke="#b85450" stroke-width="1.3" fill="none"/>
    <path d="M 154 282 L 180 304" stroke="#b85450" stroke-width="1.3" fill="none"/>
    <path d="M 204 332 L 222 340" stroke="#b85450" stroke-width="1.3" fill="none"/>
  </g>
  <text x="142" y="378" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">两个橙色节点的值被交换</text>

  <!-- inorder strip: 1,2,3,4 -> swapped -> 1,3,2,4 ; inversion at 3>2 -->
  <text x="400" y="238" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">中序序列（出现逆序）</text>
  <g font-size="12" filter="url(#rough2)">
    <rect x="270" y="252" width="34" height="28" fill="#fff" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <text x="287" y="271" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <path d="M 306 266 L 320 266" stroke="#b85450" stroke-width="1" fill="none" marker-end="url(#arrR)"/>

    <!-- first = 3 (prev of inversion) -->
    <rect x="322" y="252" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <text x="339" y="271" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
    <text x="339" y="248" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">first</text>

    <!-- inversion arrow 3 -> 2 -->
    <path d="M 358 266 L 372 266" stroke="#b85450" stroke-width="2.4" fill="none" marker-end="url(#arrR)"/>
    <text x="365" y="258" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">逆序</text>

    <!-- second = 2 (cur of inversion) -->
    <rect x="374" y="252" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <text x="391" y="271" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
    <text x="391" y="248" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">second</text>

    <path d="M 410 266 L 424 266" stroke="#b85450" stroke-width="1" fill="none" marker-end="url(#arrR)"/>
    <rect x="426" y="252" width="34" height="28" fill="#fff" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <text x="443" y="271" text-anchor="middle" fill="#b85450" font-weight="bold">4</text>
  </g>

  <rect x="260" y="300" width="280" height="76" fill="#fff" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="400" y="320" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">逆序：prev(3) &gt; cur(2)</text>
  <text x="400" y="338" text-anchor="middle" font-size="10" fill="#555">first = 逆序的前驱（较大值）</text>
  <text x="400" y="354" text-anchor="middle" font-size="10" fill="#555">second = 逆序的当前（较小值）</text>
  <text x="400" y="370" text-anchor="middle" font-size="9" fill="#888">交换 first.val 与 second.val 即恢复</text>
</svg>
