<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [5, 4, 0, 3, 1, 6, 2]</text>

  <!-- index header -->
  <text x="36" y="56" font-size="9.5" fill="#aaa">下标</text>
  <text x="80" y="52" text-anchor="middle" font-size="9" fill="#bbb">0</text>
  <text x="120" y="52" text-anchor="middle" font-size="9" fill="#bbb">1</text>
  <text x="160" y="52" text-anchor="middle" font-size="9" fill="#bbb">2</text>
  <text x="200" y="52" text-anchor="middle" font-size="9" fill="#bbb">3</text>
  <text x="240" y="52" text-anchor="middle" font-size="9" fill="#bbb">4</text>
  <text x="280" y="52" text-anchor="middle" font-size="9" fill="#bbb">5</text>
  <text x="320" y="52" text-anchor="middle" font-size="9" fill="#bbb">6</text>

  <!-- ===== Row 1: initial ===== -->
  <text x="36" y="82" font-size="10.5" fill="#888" font-weight="bold">初始</text>
  <rect x="60" y="64" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="80" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <rect x="100" y="64" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="120" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="140" y="64" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="160" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="180" y="64" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="200" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="220" y="64" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="240" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="260" y="64" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <rect x="300" y="64" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="320" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <path d="M 200 98 L 200 112" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="380" y="108" font-size="10.5" fill="#4a7a3a" font-weight="bold">i=0：沿环 0 → 5 → 6 → 2 → 0</text>

  <!-- ===== Row 2: after i=0 (cycle {0,5,6,2}, cnt=4) ===== -->
  <text x="36" y="134" font-size="10.5" fill="#4a7a3a" font-weight="bold">i=0</text>
  <text x="36" y="148" font-size="9.5" fill="#4a7a3a">cnt=4</text>
  <!-- marked cells: 0,2,5,6 -> -1 (red) ; 1,3,4 still original (blue) -->
  <rect x="60" y="116" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="136" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−1</text>
  <rect x="100" y="116" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="120" y="136" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="140" y="116" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="136" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−1</text>
  <rect x="180" y="116" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="200" y="136" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="220" y="116" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="240" y="136" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="260" y="116" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="136" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−1</text>
  <rect x="300" y="116" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="136" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−1</text>

  <path d="M 200 150 L 200 164" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="380" y="160" font-size="10.5" fill="#446688" font-weight="bold">i=1：沿环 1 → 4 → 1</text>

  <!-- ===== Row 3: after i=1 (cycle {1,4}, cnt=2) ===== -->
  <text x="36" y="186" font-size="10.5" fill="#446688" font-weight="bold">i=1</text>
  <text x="36" y="200" font-size="9.5" fill="#446688">cnt=2</text>
  <rect x="60" y="168" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="80" y="188" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−1</text>
  <rect x="100" y="168" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="188" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−1</text>
  <rect x="140" y="168" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="160" y="188" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−1</text>
  <rect x="180" y="168" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="200" y="188" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="220" y="168" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="240" y="188" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−1</text>
  <rect x="260" y="168" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="188" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−1</text>
  <rect x="300" y="168" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="320" y="188" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−1</text>

  <path d="M 200 202 L 200 216" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="380" y="212" font-size="10.5" fill="#446688" font-weight="bold">i=3：自环 3 → 3</text>

  <!-- ===== Row 4: after i=3 (all marked, cnt=1) ===== -->
  <text x="36" y="238" font-size="10.5" fill="#446688" font-weight="bold">i=3</text>
  <text x="36" y="252" font-size="9.5" fill="#446688">cnt=1</text>
  <rect x="60" y="220" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="80" y="240" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−1</text>
  <rect x="100" y="220" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="120" y="240" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−1</text>
  <rect x="140" y="220" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="160" y="240" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−1</text>
  <rect x="180" y="220" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="240" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−1</text>
  <rect x="220" y="220" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="240" y="240" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−1</text>
  <rect x="260" y="220" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="240" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−1</text>
  <rect x="300" y="220" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="320" y="240" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−1</text>

  <text x="380" y="238" font-size="10" fill="#888">i=4,5,6 均为 −1</text>
  <text x="380" y="252" font-size="10" fill="#888">→ 全部跳过</text>

  <!-- ===== Result ===== -->
  <path d="M 200 254 L 200 280" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="80" y="288" width="380" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="308" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">最长环 = {0, 5, 6, 2}，长度 4</text>
  <text x="270" y="326" text-anchor="middle" font-size="11" fill="#555">每个元素恰好被标记一次 ⇒ 总工作量 O(n)</text>

  <text x="270" y="362" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">ans = 4 ✓</text>

  <!-- legend -->
  <rect x="60" y="384" width="16" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="82" y="394" font-size="9.5" fill="#666">未访问</text>
  <rect x="140" y="384" width="16" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="162" y="394" font-size="9.5" fill="#666">已标记 −1</text>
  <rect x="240" y="384" width="16" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="2" filter="url(#rough2)"/>
  <text x="262" y="394" font-size="9.5" fill="#666">最长环</text>
</svg>
