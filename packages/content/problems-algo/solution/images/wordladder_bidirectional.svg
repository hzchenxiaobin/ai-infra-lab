<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">双向 BFS：从两端同时扩展，中间相遇</text>

  <!-- Direction labels -->
  <text x="100" y="52" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">正向 BFS →</text>
  <text x="460" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">← 反向 BFS</text>

  <!-- Forward BFS nodes (left side, green) -->
  <!-- hit -->
  <rect x="40" y="170" width="46" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="63" y="187" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">hit</text>

  <!-- hot -->
  <rect x="140" y="170" width="46" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="163" y="187" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">hot</text>

  <!-- dot -->
  <rect x="240" y="140" width="46" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="263" y="157" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">dot</text>

  <!-- lot -->
  <rect x="240" y="200" width="46" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="263" y="217" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">lot</text>

  <!-- Backward BFS nodes (right side, blue) -->
  <!-- cog -->
  <rect x="474" y="170" width="46" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="497" y="187" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">cog</text>

  <!-- dog -->
  <rect x="374" y="140" width="46" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="397" y="157" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">dog</text>

  <!-- log -->
  <rect x="374" y="200" width="46" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="397" y="217" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">log</text>

  <!-- Forward edges (green arrows, left to right) -->
  <path d="M 86 183 L 140 183" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 186 178 L 240 155" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 186 188 L 240 211" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Backward edges (blue arrows, right to left) -->
  <path d="M 474 183 L 420 183" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 420 178 L 374 155" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 420 188 L 374 211" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Meeting point highlights (orange dashed circles around dot-dog and lot-log) -->
  <ellipse cx="310" cy="153" rx="48" ry="18" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="310" y="130" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">相遇!</text>

  <ellipse cx="310" cy="213" rx="48" ry="18" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="310" y="246" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">相遇!</text>

  <!-- Meeting edges (dot↔dog, lot↔log) -->
  <path d="M 286 153 L 374 153" stroke="#d6a040" stroke-width="2" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <path d="M 286 213 L 374 213" stroke="#d6a040" stroke-width="2" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>

  <!-- Expansion step labels -->
  <text x="63" y="222" text-anchor="middle" font-size="10" fill="#4a7a3a">step 0</text>
  <text x="163" y="222" text-anchor="middle" font-size="10" fill="#4a7a3a">step 1</text>
  <text x="263" y="245" text-anchor="middle" font-size="10" fill="#4a7a3a">step 2</text>
  <text x="397" y="245" text-anchor="middle" font-size="10" fill="#446688">step 1</text>
  <text x="497" y="222" text-anchor="middle" font-size="10" fill="#446688">step 0</text>

  <!-- Bottom explanation -->
  <rect x="40" y="270" width="480" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="292" text-anchor="middle" font-size="12" fill="#444">每轮只扩展较小的一侧 → 两端相遇即最短</text>
  <text x="280" y="310" text-anchor="middle" font-size="11" fill="#555">单向 BFS: 搜索树宽度 b^d     双向 BFS: 2 × b^(d/2)</text>
  <text x="280" y="326" text-anchor="middle" font-size="10" fill="#888">d=4 步, b≈25 → 单向 390k 节点 vs 双向 ~100 节点</text>

  <!-- Legend -->
  <rect x="80" y="350" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" rx="2" filter="url(#rough2)"/>
  <text x="100" y="362" font-size="11" fill="#555">正向</text>
  <rect x="150" y="350" width="14" height="14" fill="#e8f0fe" stroke="#446688" rx="2" filter="url(#rough2)"/>
  <text x="170" y="362" font-size="11" fill="#555">反向</text>
  <rect x="220" y="350" width="14" height="14" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="3,2" rx="2" filter="url(#rough2)"/>
  <text x="240" y="362" font-size="11" fill="#555">相遇</text>
  <text x="300" y="362" font-size="10" fill="#888">正向 2 步 + 反向 1 步 + 相遇 1 边 = 4 边 → 序列长度 5</text>
</svg>
