<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：检测相邻字符对，是否出现 "01"</text>

  <!-- ====== Example 1: s = "1001" → false ====== -->
  <text x="56" y="66" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">示例 1：s = "1001"</text>

  <!-- 4 cells -->
  <g font-size="14" fill="#333" text-anchor="middle">
    <rect x="120" y="52" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="142" y="76" filter="url(#rough2)">1</text>
    <rect x="164" y="52" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="186" y="76" filter="url(#rough2)">0</text>
    <rect x="208" y="52" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="230" y="76" filter="url(#rough2)">0</text>
    <rect x="252" y="52" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="274" y="76" filter="url(#rough2)">1</text>
  </g>
  <!-- index labels -->
  <g font-size="10" fill="#888" text-anchor="middle">
    <text x="142" y="48" filter="url(#rough2)">0</text>
    <text x="186" y="48" filter="url(#rough2)">1</text>
    <text x="230" y="48" filter="url(#rough2)">2</text>
    <text x="274" y="48" filter="url(#rough2)">3</text>
  </g>

  <!-- pair scan rows -->
  <g font-size="11" fill="#555">
    <text x="56" y="112" filter="url(#rough2)">对 (0,1): "10"</text>
    <text x="220" y="112" fill="#888" filter="url(#rough2)">非 "01"，继续</text>
    <text x="56" y="132" filter="url(#rough2)">对 (1,2): "00"</text>
    <text x="220" y="132" fill="#888" filter="url(#rough2)">非 "01"，继续</text>
    <text x="56" y="152" filter="url(#rough2)">对 (2,3): <tspan fill="#b85450" font-weight="bold">"01"</tspan></text>
    <text x="220" y="152" fill="#b85450" font-weight="bold" filter="url(#rough2)">命中！→ 第二段 1 出现</text>
  </g>

  <!-- highlight the "01" pair on the cells -->
  <rect x="206" y="50" width="92" height="40" fill="none" stroke="#b85450" stroke-width="2.4" rx="6" filter="url(#rough2)"/>

  <!-- result for example 1 -->
  <rect x="120" y="170" width="176" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="208" y="190" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">两段 1 → 返回 false</text>

  <!-- ====== Example 2: s = "110" → true ====== -->
  <text x="320" y="66" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">示例 2：s = "110"</text>

  <!-- 3 cells -->
  <g font-size="14" fill="#333" text-anchor="middle">
    <rect x="360" y="52" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="382" y="76" filter="url(#rough2)">1</text>
    <rect x="404" y="52" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="426" y="76" filter="url(#rough2)">1</text>
    <rect x="448" y="52" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="470" y="76" filter="url(#rough2)">0</text>
  </g>
  <g font-size="10" fill="#888" text-anchor="middle">
    <text x="382" y="48" filter="url(#rough2)">0</text>
    <text x="426" y="48" filter="url(#rough2)">1</text>
    <text x="470" y="48" filter="url(#rough2)">2</text>
  </g>

  <!-- pair scan rows -->
  <g font-size="11" fill="#555">
    <text x="320" y="112" filter="url(#rough2)">对 (0,1): "11"</text>
    <text x="470" y="112" fill="#888" filter="url(#rough2)">非 "01"</text>
    <text x="320" y="132" filter="url(#rough2)">对 (1,2): "10"</text>
    <text x="470" y="132" fill="#888" filter="url(#rough2)">非 "01"</text>
    <text x="320" y="152" filter="url(#rough2)">遍历完成</text>
    <text x="470" y="152" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">未命中</text>
  </g>

  <!-- result for example 2 -->
  <rect x="360" y="170" width="132" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="426" y="190" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">一段 1 → true</text>

  <!-- ====== summary ====== -->
  <path d="M 40 232 L 520 232" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="56" y="256" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">规律：</text>
  <text x="56" y="278" font-size="11.5" fill="#555" filter="url(#rough2)">• 只关心相邻 <tspan fill="#b85450" font-weight="bold">"01"</tspan> 对：0 之后紧跟 1 ⇒ 1 的段数 +1（开启新段）</text>
  <text x="56" y="298" font-size="11.5" fill="#555" filter="url(#rough2)">• 因 s[0]='1'，初始已有一段；只要不再出现 "01"，段数恒为 1</text>
  <text x="56" y="318" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⇒ 段数 ≤ 1 ⇔ 子串 "01" 不存在 ⇔ s 形如 1*0*</text>
</svg>
