<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：逐格填表，每格存 (max, min) 二元组</text>

  <!-- ===== Step 1: Initialize ===== -->
  <rect x="30" y="50" width="160" height="55" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="110" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① 初始化起点</text>
  <text x="110" y="87" text-anchor="middle" font-size="10" fill="#555">dp_max[0][0] = grid[0][0]</text>
  <text x="110" y="100" text-anchor="middle" font-size="10" fill="#555">dp_min[0][0] = grid[0][0]</text>

  <!-- arrow -->
  <path d="M 190 77 L 220 77" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: Iterate ===== -->
  <rect x="220" y="50" width="170" height="55" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="305" y="70" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">② 逐行从左到右遍历</text>
  <text x="305" y="87" text-anchor="middle" font-size="10" fill="#555">跳过 (0,0)，按 i=0..R−1, j=0..C−1</text>
  <text x="305" y="100" text-anchor="middle" font-size="10" fill="#555">每个 (i,j) 只看上方和左方</text>

  <!-- arrow -->
  <path d="M 390 77 L 420 77" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: Collect candidates ===== -->
  <rect x="420" y="50" width="130" height="55" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="485" y="70" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">③ 收集候选值</text>
  <text x="485" y="87" text-anchor="middle" font-size="10" fill="#555">上方 (max,min)·g[i][j]</text>
  <text x="485" y="100" text-anchor="middle" font-size="10" fill="#555">左方 (max,min)·g[i][j]</text>

  <!-- ===== Core: cell diagram ===== -->
  <text x="280" y="140" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">每个格子的状态转移</text>

  <!-- top predecessor -->
  <rect x="220" y="155" width="50" height="35" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="245" y="170" text-anchor="middle" font-size="9" fill="#888">上方</text>
  <text x="245" y="182" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">(i−1,j)</text>

  <!-- left predecessor -->
  <rect x="155" y="200" width="50" height="35" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="215" text-anchor="middle" font-size="9" fill="#888">左方</text>
  <text x="180" y="227" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">(i,j−1)</text>

  <!-- current cell -->
  <rect x="220" y="200" width="50" height="35" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="245" y="215" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">当前</text>
  <text x="245" y="227" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">(i,j)</text>

  <!-- arrows -->
  <path d="M 245 190 L 245 198" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 207 217 L 218 217" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- candidate computation -->
  <rect x="300" y="180" width="200" height="70" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="400" y="198" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">候选集合 =</text>
  <text x="400" y="214" text-anchor="middle" font-size="9" fill="#555">{dp_max[top]·g, dp_min[top]·g,</text>
  <text x="400" y="227" text-anchor="middle" font-size="9" fill="#555"> dp_max[left]·g, dp_min[left]·g}</text>
  <text x="400" y="243" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">g = grid[i][j]</text>

  <!-- arrow to result -->
  <path d="M 245 237 L 245 258" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="170" y="260" width="150" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="245" y="278" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">dp_max = max(候选)</text>
  <text x="245" y="293" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">dp_min = min(候选)</text>

  <!-- ===== Step 4: Answer ===== -->
  <path d="M 245 302 L 245 320" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="100" y="322" width="290" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="245" y="342" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">④ 取终点 dp_max[R−1][C−1]</text>
  <text x="245" y="358" text-anchor="middle" font-size="10" fill="#555">若 ≥ 0 → 返回 dp_max % (10⁹+7)</text>
  <text x="245" y="373" text-anchor="middle" font-size="10" fill="#555">若 &lt; 0 → 返回 −1（无非负积路径）</text>
</svg>
