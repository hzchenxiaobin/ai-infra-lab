<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：n = 50ml → 2 单位，求 dp(2, 2)</text>

  <!-- Root node -->
  <rect x="200" y="36" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="57" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">dp(2, 2)</text>

  <!-- 4 branch arrows -->
  <path d="M 260 68 Q 200 78 90 96" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 260 68 Q 240 78 220 96" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 260 68 Q 280 78 350 96" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 260 68 Q 320 78 460 96" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Branch 1: op1 (a-4, b) -->
  <rect x="24" y="100" width="132" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="90" y="118" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">操作 1 (4, 0)</text>
  <text x="90" y="134" text-anchor="middle" font-size="10" fill="#444">dp(−2, 2)</text>
  <text x="90" y="152" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">= 1.0</text>

  <!-- Branch 2: op2 (a-3, b-1) -->
  <rect x="164" y="100" width="132" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="230" y="118" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">操作 2 (3, 1)</text>
  <text x="230" y="134" text-anchor="middle" font-size="10" fill="#444">dp(−1, 1)</text>
  <text x="230" y="152" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">= 1.0</text>

  <!-- Branch 3: op3 (a-2, b-2) -->
  <rect x="304" y="100" width="132" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="370" y="118" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">操作 3 (2, 2)</text>
  <text x="370" y="134" text-anchor="middle" font-size="10" fill="#444">dp(0, 0)</text>
  <text x="370" y="152" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">= 0.5</text>

  <!-- Branch 4: op4 (a-1, b-3) -->
  <rect x="444" y="100" width="64" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="476" y="118" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">操作4(1,3)</text>
  <text x="476" y="134" text-anchor="middle" font-size="9" fill="#444">dp(1, −1)</text>
  <text x="476" y="152" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">= 0.0</text>

  <!-- explanations -->
  <text x="90" y="176" text-anchor="middle" font-size="9" fill="#888">A 空 · B 有</text>
  <text x="230" y="176" text-anchor="middle" font-size="9" fill="#888">A 空 · B 有</text>
  <text x="370" y="176" text-anchor="middle" font-size="9" fill="#888">同时空</text>
  <text x="476" y="176" text-anchor="middle" font-size="9" fill="#888">B 空 · A 有</text>

  <!-- merge arrows -->
  <path d="M 90 160 Q 90 186 200 202" stroke="#d6a040" stroke-width="1.2" fill="none" stroke-dasharray="4,2" filter="url(#rough2)"/>
  <path d="M 230 160 Q 230 186 240 202" stroke="#d6a040" stroke-width="1.2" fill="none" stroke-dasharray="4,2" filter="url(#rough2)"/>
  <path d="M 370 160 Q 370 186 280 202" stroke="#d6a040" stroke-width="1.2" fill="none" stroke-dasharray="4,2" filter="url(#rough2)"/>
  <path d="M 476 160 Q 476 186 320 202" stroke="#d6a040" stroke-width="1.2" fill="none" stroke-dasharray="4,2" filter="url(#rough2)"/>

  <!-- result box -->
  <rect x="60" y="204" width="400" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="226" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">dp(2, 2) = ¼ × (1.0 + 1.0 + 0.5 + 0.0)</text>
  <text x="260" y="248" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">= 0.25 × 2.5 = 0.625</text>

  <!-- key insight -->
  <rect x="70" y="276" width="380" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="296" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">关键：a 或 b ≤ 0 即视为空</text>
  <text x="260" y="314" text-anchor="middle" font-size="10" fill="#555">「不足则尽供」→ 部分单位向上取整</text>
  <text x="260" y="332" text-anchor="middle" font-size="9" fill="#888">50ml = ⌈50 / 25⌉ = 2 单位 · 操作 4 供 B 3 单位但只有 2 → B 空</text>
</svg>
