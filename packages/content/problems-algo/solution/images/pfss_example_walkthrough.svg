<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="940" height="480" fill="#fdfcf7"/>

  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：words = ["apple", "ae"]</text>
  <path d="M 300 42 Q 470 50 640 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="470" y="58" text-anchor="middle" font-size="11" fill="#888">查询 f("a", "e")：两个词都以 'a' 开头、'e' 结尾，返回最大下标 1</text>

  <!-- ===== words row ===== -->
  <g filter="url(#sk)">
    <rect x="120" y="78" width="150" height="30" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="195" y="98" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">apple  [i=0]</text>

  <g filter="url(#sk)">
    <rect x="330" y="78" width="120" height="30" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="390" y="98" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">ae  [i=1]</text>

  <!-- ===== wrapped keys that share "e#a" prefix ===== -->
  <text x="470" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">含后缀 "e" 的包装串（均以 e#a… 开头）</text>

  <!-- apple[0] : e#apple -->
  <g filter="url(#sk)">
    <rect x="120" y="148" width="260" height="34" rx="6" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.2"/>
  </g>
  <text x="140" y="170" font-size="12" fill="#2e6e2e" font-weight="bold">[0]</text>
  <text x="170" y="170" font-size="13" fill="#b85450" font-weight="bold">e</text>
  <text x="186" y="170" font-size="13" fill="#a06820" font-weight="bold">#</text>
  <text x="202" y="170" font-size="13" fill="#b85450" font-weight="bold">a</text>
  <text x="218" y="170" font-size="13" fill="#888">p p l e</text>
  <text x="290" y="170" font-size="10" fill="#888">(e#apple)</text>

  <!-- ae[1] : e#ae -->
  <g filter="url(#sk)">
    <rect x="120" y="192" width="260" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="140" y="214" font-size="12" fill="#b85450" font-weight="bold">[1]</text>
  <text x="170" y="214" font-size="13" fill="#b85450" font-weight="bold">e</text>
  <text x="186" y="214" font-size="13" fill="#a06820" font-weight="bold">#</text>
  <text x="202" y="214" font-size="13" fill="#b85450" font-weight="bold">a</text>
  <text x="218" y="214" font-size="13" fill="#888">e</text>
  <text x="250" y="214" font-size="10" fill="#888">(e#ae)</text>

  <text x="470" y="170" font-size="10" fill="#888">← 共享前缀</text>
  <text x="470" y="214" font-size="10" fill="#888">← 共享前缀</text>

  <!-- ===== weight evolution table ===== -->
  <text x="690" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">路径 e → # → a 上节点 weight 演化</text>

  <g filter="url(#sk)">
    <rect x="560" y="148" width="320" height="180" rx="6" fill="#f6f6f6" stroke="#ccc" stroke-width="1"/>
  </g>

  <!-- header -->
  <text x="612" y="172" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold">步骤</text>
  <text x="690" y="172" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold">node 'e'</text>
  <text x="770" y="172" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold">node '#'</text>
  <text x="850" y="172" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold">node 'a'</text>
  <path d="M 575 180 L 885 180" stroke="#ccc" stroke-width="1" filter="url(#sk)"/>

  <!-- row: init -->
  <text x="612" y="200" text-anchor="middle" font-size="10" fill="#888">初始</text>
  <text x="690" y="200" text-anchor="middle" font-size="10" fill="#888">-1</text>
  <text x="770" y="200" text-anchor="middle" font-size="10" fill="#888">-1</text>
  <text x="850" y="200" text-anchor="middle" font-size="10" fill="#888">-1</text>

  <!-- row: after apple[0] -->
  <text x="612" y="226" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">插 apple[0]</text>
  <text x="690" y="226" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">0</text>
  <text x="770" y="226" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">0</text>
  <text x="850" y="226" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">0</text>

  <!-- row: after ae[1] -->
  <text x="612" y="252" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">插 ae[1]</text>
  <text x="690" y="252" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <text x="770" y="252" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <text x="850" y="252" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>

  <path d="M 575 262 L 885 262" stroke="#ccc" stroke-width="1" filter="url(#sk)"/>

  <!-- row: query -->
  <g filter="url(#sk)">
    <rect x="572" y="270" width="200" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="672" y="290" text-anchor="middle" font-size="10" fill="#a06820" font-weight="bold">f("a","e") 走 "e#a" 停于 'a'</text>

  <g filter="url(#sk)">
    <rect x="785" y="270" width="90" height="30" rx="6" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.5"/>
  </g>
  <text x="830" y="290" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">return 1</text>

  <!-- ===== shared path visualization (bottom) ===== -->
  <text x="470" y="356" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">共享路径：两条包装串在 e → # → a 三节点重合，'a' 之后分叉</text>

  <!-- path nodes -->
  <g filter="url(#sk)">
    <circle cx="180" cy="400" r="20" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="180" y="405" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">e</text>
  <text x="180" y="436" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">w=1</text>

  <path d="M 200 400 L 300 400" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <circle cx="320" cy="400" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="320" y="405" text-anchor="middle" font-size="11" fill="#a06820" font-weight="bold">#</text>
  <text x="320" y="436" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">w=1</text>

  <path d="M 340 400 L 440 400" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <circle cx="465" cy="400" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
  </g>
  <text x="465" y="405" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">a</text>
  <text x="465" y="436" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">w=1 ← 查询命中</text>

  <!-- fork: apple continues p p l e -->
  <path d="M 480 386 Q 540 372 580 372" stroke="#2e8b57" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="600" y="376" font-size="10" fill="#2e6e2e">p→p→l→e  (apple, i=0)</text>

  <!-- fork: ae continues e -->
  <path d="M 480 414 Q 540 428 580 428" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="600" y="432" font-size="10" fill="#b85450">e  (ae, i=1)</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="40" y="452" width="860" height="22" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="0.8"/>
  </g>
  <text x="470" y="468" text-anchor="middle" font-size="10" fill="#2b6e9e">💡 下标升序插入 → 同路径节点 weight 被 later index 覆盖 → 查询自然返回「满足前缀+后缀的最大下标」</text>
</svg>
