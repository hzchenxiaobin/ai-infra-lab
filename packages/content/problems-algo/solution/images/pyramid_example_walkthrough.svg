<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：成功与失败两条路径</text>

  <!-- ===== Example 1: Success ===== -->
  <rect x="20" y="40" width="240" height="340" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="140" y="60" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">示例 1：bottom="BCD" → true</text>
  <text x="140" y="76" text-anchor="middle" font-size="9" fill="#888">allowed = ["BCC","CDE","CEA","FFF"]</text>

  <!-- Step 1: bottom BCD -->
  <text x="35" y="96" font-size="9" fill="#4a7a3a" font-weight="bold">Step 1: 底层 BCD</text>
  <rect x="60" y="104" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="78" y="124" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">B</text>
  <rect x="100" y="104" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="118" y="124" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">C</text>
  <rect x="140" y="104" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="158" y="124" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">D</text>

  <!-- Look up pairs -->
  <text x="35" y="150" font-size="9" fill="#555">查 trans：</text>
  <rect x="35" y="156" width="95" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="82" y="170" text-anchor="middle" font-size="9" fill="#555">(B,C)→[C]</text>
  <rect x="135" y="156" width="95" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="182" y="170" text-anchor="middle" font-size="9" fill="#555">(C,D)→[E]</text>

  <!-- Arrow down -->
  <path d="M 140 180 L 140 192" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG3)" filter="url(#rough2)"/>

  <!-- Step 2: middle CE -->
  <text x="35" y="204" font-size="9" fill="#4a7a3a" font-weight="bold">Step 2: 第2层 CE</text>
  <rect x="82" y="212" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="100" y="232" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">C</text>
  <rect x="122" y="212" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="140" y="232" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">E</text>

  <!-- Look up pair -->
  <text x="35" y="258" font-size="9" fill="#555">查 trans：</text>
  <rect x="80" y="264" width="100" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="130" y="278" text-anchor="middle" font-size="9" fill="#555">(C,E)→[A]</text>

  <!-- Arrow down -->
  <path d="M 130 288 L 130 300" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG3)" filter="url(#rough2)"/>

  <!-- Step 3: top A -->
  <text x="35" y="312" font-size="9" fill="#4a7a3a" font-weight="bold">Step 3: 顶层 A (len=1)</text>
  <rect x="112" y="320" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="130" y="340" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">A</text>

  <!-- Result -->
  <rect x="50" y="360" width="180" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="374" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return True ✓</text>

  <!-- ===== Example 2: Failure ===== -->
  <rect x="280" y="40" width="240" height="340" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="400" y="60" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">示例 2：bottom="AAAA" → false</text>
  <text x="400" y="76" text-anchor="middle" font-size="9" fill="#888">allowed = ["AAB","AAC","BCD","BBE","DEF"]</text>

  <!-- Step 1: bottom AAAA -->
  <text x="295" y="96" font-size="9" fill="#b85450" font-weight="bold">Step 1: 底层 AAAA</text>
  <rect x="310" y="104" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="326" y="123" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">A</text>
  <rect x="346" y="104" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="362" y="123" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">A</text>
  <rect x="382" y="104" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="398" y="123" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">A</text>
  <rect x="418" y="104" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="434" y="123" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">A</text>

  <!-- trans lookup -->
  <text x="295" y="148" font-size="9" fill="#555">查 trans：</text>
  <rect x="295" y="154" width="100" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="345" y="168" text-anchor="middle" font-size="9" fill="#555">(A,A)→[B,C]</text>
  <text x="402" y="168" font-size="9" fill="#888">每对都有2个候选</text>

  <!-- Step 2: try branch BBB -->
  <path d="M 370 178 L 370 190" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR3)" filter="url(#rough2)"/>

  <text x="295" y="200" font-size="9" fill="#b85450" font-weight="bold">分支①: BBB</text>
  <rect x="318" y="208" width="32" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="334" y="226" text-anchor="middle" font-size="12" fill="#b85450">B</text>
  <rect x="354" y="208" width="32" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="370" y="226" text-anchor="middle" font-size="12" fill="#b85450">B</text>
  <rect x="390" y="208" width="32" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="406" y="226" text-anchor="middle" font-size="12" fill="#b85450">B</text>

  <rect x="320" y="240" width="100" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="370" y="253" text-anchor="middle" font-size="9" fill="#d6a040">(B,B)→[E]</text>

  <path d="M 370 262 L 370 274" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arrR3)" filter="url(#rough2)"/>

  <text x="335" y="288" font-size="9" fill="#b85450" font-weight="bold">EE</text>
  <rect x="354" y="278" width="32" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="370" y="296" text-anchor="middle" font-size="12" fill="#b85450">E</text>
  <rect x="390" y="278" width="32" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="406" y="296" text-anchor="middle" font-size="12" fill="#b85450">E</text>

  <rect x="318" y="310" width="110" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="373" y="323" text-anchor="middle" font-size="9" fill="#b85450">(E,E)→ ∅ 无候选！</text>

  <!-- X mark -->
  <path d="M 455 224 L 470 239 M 470 224 L 455 239" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="462" y="250" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">✗</text>

  <!-- Other branches also fail -->
  <text x="295" y="340" font-size="9" fill="#888">分支② BBC, ③ BCB... 同理：</text>
  <text x="295" y="354" font-size="9" fill="#888">总会在某层遇到 (X,X) 无候选</text>

  <rect x="310" y="362" width="180" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="400" y="376" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return False ✗</text>
</svg>
