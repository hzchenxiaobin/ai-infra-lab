  <rect x="414" y="156" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="434" y="175" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">7</text>

  <rect x="456" y="156" width="40" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>

  <rect x="520" y="158" width="100" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="570" y="175" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">新涂 = 1</text>

  <!-- Explanation for Day 2 -->
  <rect x="60" y="210" width="540" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="330" y="232" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">第 2 天详解：query([5,8]) → 5,6 已涂(v=2) → 新涂 = 3−2 = 1（只有格 7）</text>
  <text x="330" y="252" text-anchor="middle" font-size="11" fill="#888">modify 后格 7 标记为已涂，整个 [1,8) 全部涂完</text>
  <text x="330" y="270" text-anchor="middle" font-size="10" fill="#aaa">红色=本次查询区间内已有涂色，蓝色=本次新涂格子</text>

  <!-- Result summary -->
  <text x="40" y="316" font-size="12" fill="#555" font-weight="bold">最终结果：</text>

  <rect x="120" y="304" width="120" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="180" y="325" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans = [3, 3, 1]</text>

  <!-- Day-by-day table -->
  <text x="40" y="366" font-size="11" fill="#555" font-weight="bold">逐日汇总：</text>

  <rect x="120" y="352" width="100" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="170" y="369" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">区间</text>

  <rect x="222" y="352" width="100" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="272" y="369" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">总长</text>

  <rect x="324" y="352" width="100" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="374" y="369" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">已涂 v</text>

  <rect x="426" y="352" width="100" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="476" y="369" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">新涂</text>

  <!-- row 0 -->
  <rect x="120" y="378" width="100" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
