  <text x="374" y="417" text-anchor="middle" font-size="10" fill="#555">0</text>
  <rect x="426" y="402" width="100" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="476" y="417" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">3</text>

  <!-- row 2 -->
  <rect x="120" y="426" width="100" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="170" y="441" text-anchor="middle" font-size="10" fill="#555">[5,8)</text>
