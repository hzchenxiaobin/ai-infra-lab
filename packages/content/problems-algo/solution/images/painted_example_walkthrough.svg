<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="460" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：paint = [[1,4],[4,7],[5,8]] → ans = [3,3,1]</text>

  <!-- Day 0 -->
  <text x="40" y="68" font-size="12" fill="#555" font-weight="bold">第 0 天 [1,4)：</text>

  <rect x="120" y="56" width="40" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="140" y="75" text-anchor="middle" font-size="10" fill="#aaa">0</text>

  <rect x="162" y="56" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="182" y="75" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>

  <rect x="204" y="56" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="224" y="75" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>

  <rect x="246" y="56" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="266" y="75" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>

  <rect x="288" y="56" width="40" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="308" y="75" text-anchor="middle" font-size="10" fill="#aaa">4</text>

  <rect x="330" y="56" width="40" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="350" y="75" text-anchor="middle" font-size="10" fill="#aaa">5</text>

  <rect x="372" y="56" width="40" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="392" y="75" text-anchor="middle" font-size="10" fill="#aaa">6</text>

  <rect x="414" y="56" width="40" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="434" y="75" text-anchor="middle" font-size="10" fill="#aaa">7</text>

  <rect x="456" y="56" width="40" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="476" y="75" text-anchor="middle" font-size="10" fill="#aaa">8</text>

  <rect x="520" y="58" width="100" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="570" y="75" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">新涂 = 3</text>

  <!-- Day 1 -->
  <text x="40" y="118" font-size="12" fill="#555" font-weight="bold">第 1 天 [4,7)：</text>

  <rect x="120" y="106" width="40" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="162" y="106" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="204" y="106" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="246" y="106" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>

  <rect x="288" y="106" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="308" y="125" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">4</text>

  <rect x="330" y="106" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="350" y="125" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">5</text>

  <rect x="372" y="106" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
