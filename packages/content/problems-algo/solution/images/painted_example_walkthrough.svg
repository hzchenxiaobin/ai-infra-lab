  <rect x="414" y="106" width="40" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="456" y="106" width="40" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>

  <rect x="520" y="108" width="100" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="570" y="125" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">新涂 = 3</text>

  <!-- Day 2 -->
  <text x="40" y="168" font-size="12" fill="#555" font-weight="bold">第 2 天 [5,8)：</text>

  <rect x="120" y="156" width="40" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="162" y="156" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
