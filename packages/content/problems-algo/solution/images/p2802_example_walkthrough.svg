<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：k = 10 → ?</text>

  <!-- Step 1: find c -->
  <rect x="40" y="50" width="480" height="72" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="72" font-size="13" fill="#4a7a3a" filter="url(#rough2)">① 定位数 c（2ᶜ⁺¹−2 ≥ k？）</text>
  <text x="56" y="92" font-size="12" fill="#333" filter="url(#rough2)">c=1：2²−2=2 &lt; 10 ✗</text>
  <text x="220" y="92" font-size="12" fill="#333" filter="url(#rough2)">c=2：2³−2=6 &lt; 10 ✗</text>
  <text x="380" y="92" font-size="12" fill="#b85450" filter="url(#rough2)">c=3：2⁴−2=14 ≥ 10 ✓</text>
  <text x="56" y="112" font-size="12" fill="#888" filter="url(#rough2)">累计：≤1位有2个，≤2位有6个，≤3位有14个 → k=10 落在 3 位组</text>

  <path d="M280,122 L280,140" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: compute idx -->
  <rect x="40" y="142" width="480" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="164" font-size="13" fill="#d6a040" filter="url(#rough2)">② 算层内序号 idx</text>
  <text x="56" y="184" font-size="12" fill="#333" filter="url(#rough2)">idx = k − 2ᶜ + 1 = 10 − 2³ + 1 = 10 − 8 + 1 = 3</text>
  <text x="56" y="200" font-size="11" fill="#888" filter="url(#rough2)">（3 位组的第 4 个，0-indexed = 3）</text>

  <path d="M280,204 L280,222" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: binary mapping -->
  <rect x="40" y="224" width="480" height="72" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="246" font-size="13" fill="#b85450" filter="url(#rough2)">③ idx → c 位二进制 → 映射</text>
  <text x="56" y="266" font-size="12" fill="#333" filter="url(#rough2)">idx=3 → 二进制 11 → 补零到 3 位 = 0 1 1</text>

  <!-- mapping boxes -->
  <rect x="80" y="276" width="46" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="103" y="295" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <path d="M128,290 L150,290" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150" y="276" width="46" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="173" y="295" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>

  <rect x="220" y="276" width="46" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="243" y="295" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <path d="M268,290 L290,290" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="290" y="276" width="46" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="313" y="295" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>

  <rect x="360" y="276" width="46" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="383" y="295" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <path d="M408,290 L430,290" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="430" y="276" width="46" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="453" y="295" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>

  <path d="M280,296 L280,318" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Result -->
  <rect x="180" y="320" width="200" height="46" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="280" y="348" text-anchor="middle" font-size="20" fill="#b85450" filter="url(#rough2)">答案 = 477</text>

  <!-- verify note -->
  <text x="280" y="388" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">验证：4, 7, 44, 47, 74, 77, 444, 447, 474, 477 → 第 10 个 = 477 ✓</text>
</svg>
