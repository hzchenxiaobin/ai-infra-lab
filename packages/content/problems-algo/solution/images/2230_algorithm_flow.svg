<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：FROM → WHERE（双谓词 AND）→ DISTINCT user_id</text>

  <!-- ===== Procedure wrapper (dashed box around everything) ===== -->
  <rect x="20" y="36" width="540" height="312" fill="none" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="6 4" rx="10" filter="url(#rough2)"/>
  <rect x="30" y="30" width="300" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="180" y="43" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">CREATE PROCEDURE find_valid_users(startDate, endDate, minAmount)</text>

  <!-- ===== Step 1: FROM Purchases ===== -->
  <rect x="60" y="60" width="200" height="52" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="160" y="78" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">FROM Purchases</text>
  <text x="160" y="94" text-anchor="middle" font-size="8" fill="#888">读取全部购买记录</text>
  <text x="160" y="106" text-anchor="middle" font-size="8" fill="#888">4 行</text>

  <!-- Arrow down -->
  <path d="M 160 112 L 160 134" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: WHERE time_stamp BETWEEN ===== -->
  <rect x="30" y="138" width="260" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="160" y="156" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">WHERE time_stamp BETWEEN</text>
  <text x="160" y="170" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">startDate AND endDate</text>
  <text x="160" y="184" text-anchor="middle" font-size="7" fill="#888">DATE → 00:00:00 隐式转换（SARGable）</text>

  <!-- AND connector -->
  <text x="290" y="172" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">AND</text>

  <!-- ===== Step 3: AND amount >= minAmount ===== -->
  <rect x="310" y="138" width="240" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="430" y="158" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">amount &gt;= minAmount</text>
  <text x="430" y="172" text-anchor="middle" font-size="7" fill="#888">单次购买金额达标</text>
  <text x="430" y="184" text-anchor="middle" font-size="7" fill="#888">非累计（行级谓词）</text>

  <!-- Arrow down merge -->
  <path d="M 160 196 L 160 218" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 430 196 L 430 210 C 430 218, 280 218, 165 216" stroke="#666" stroke-width="1.2" fill="none" stroke-dasharray="3 3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Intermediate: filtered rows -->
  <rect x="50" y="222" width="220" height="64" fill="#fff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="160" y="238" text-anchor="middle" font-size="9" fill="#666">双谓词过滤后的「合格行」</text>
  <text x="160" y="252" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">user 3, 03-18, 4523</text>
  <text x="160" y="266" text-anchor="middle" font-size="7" fill="#888">仅 1 行同时满足时间 + 金额</text>
  <text x="160" y="278" text-anchor="middle" font-size="7" fill="#b85450">其余 3 行被 AND 过滤丢弃</text>

  <!-- Arrow right to distinct -->
  <path d="M 270 254 L 312 254" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 4: DISTINCT user_id (NOT COUNT) ===== -->
  <rect x="316" y="222" width="240" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="436" y="240" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">SELECT DISTINCT user_id</text>
  <text x="436" y="254" text-anchor="middle" font-size="8" fill="#666">同一用户多次合格只留一行</text>
  <text x="436" y="266" text-anchor="middle" font-size="8" fill="#888">{3} → 去重后一行</text>
  <text x="436" y="278" text-anchor="middle" font-size="7" fill="#b85450">≠ COUNT(DISTINCT)：取列表而非计数</text>

  <!-- Arrow down merge to result -->
  <path d="M 436 286 L 436 306" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 160 286 L 160 306 C 160 314, 300 314, 430 308" stroke="#666" stroke-width="1.2" fill="none" stroke-dasharray="3 3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 5: ORDER BY user_id ===== -->
  <rect x="296" y="310" width="280" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="436" y="330" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">ORDER BY user_id ASC</text>

  <!-- ===== Result: result set ===== -->
  <path d="M 436 342 L 436 360" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="376" y="364" width="120" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="436" y="378" text-anchor="middle" font-size="8" fill="#4a7a3a">结果集（多行）</text>
  <text x="436" y="392" text-anchor="middle" font-size="8" fill="#888">user_id</text>
  <text x="436" y="406" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">3</text>

  <!-- ===== SQL clause order note ===== -->
  <rect x="30" y="364" width="250" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="155" y="380" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">与 2205 的关键差异</text>
  <text x="155" y="394" font-size="7" fill="#888">• 2205: RETURN(SELECT COUNT(DISTINCT..))</text>
  <text x="155" y="406" font-size="7" fill="#888">• 2230: SELECT DISTINCT user_id（无 RETURN）</text>
  <text x="155" y="418" font-size="7" fill="#b85450">• 函数返回标量，过程返回结果集</text>
</svg>
