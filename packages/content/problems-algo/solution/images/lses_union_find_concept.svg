<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：等价类 = 并查集，根始终取字典序最小</text>

  <!-- s1 and s2 pairing -->
  <text x="20" y="58" font-size="11" fill="#888">s1 =</text>
  <rect x="60" y="44" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="75" y="61" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">p</text>
  <rect x="92" y="44" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="107" y="61" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="124" y="44" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="139" y="61" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">r</text>
  <rect x="156" y="44" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="171" y="61" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">k</text>
  <rect x="188" y="44" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="203" y="61" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">e</text>
  <rect x="220" y="44" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="235" y="61" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">r</text>

  <text x="20" y="96" font-size="11" fill="#888">s2 =</text>
  <rect x="60" y="82" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="75" y="99" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">m</text>
  <rect x="92" y="82" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="107" y="99" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">o</text>
  <rect x="124" y="82" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="139" y="99" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">r</text>
  <rect x="156" y="82" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="171" y="99" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">r</text>
  <rect x="188" y="82" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="203" y="99" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">i</text>
  <rect x="220" y="82" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="235" y="99" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">s</text>

  <!-- pairing arrows -->
  <text x="270" y="72" font-size="10.5" fill="#888">↕ 逐位等价</text>
  <line x1="75" y1="70" x2="75" y2="80" stroke="#888" stroke-width="1.3" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <line x1="107" y1="70" x2="107" y2="80" stroke="#888" stroke-width="1.3" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <line x1="139" y1="70" x2="139" y2="80" stroke="#888" stroke-width="1.3" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <line x1="171" y1="70" x2="171" y2="80" stroke="#888" stroke-width="1.3" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <line x1="203" y1="70" x2="203" y2="80" stroke="#888" stroke-width="1.3" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <line x1="235" y1="70" x2="235" y2="80" stroke="#888" stroke-width="1.3" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- equivalence classes -->
  <text x="270" y="128" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">传递闭包 → 等价类</text>

  <!-- class {m,p} -->
  <rect x="40" y="142" width="100" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="90" y="162" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">{m, p}</text>
  <circle cx="68" cy="178" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="68" y="182" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">m</text>
  <text x="68" y="200" text-anchor="middle" font-size="8.5" fill="#b85450">根↓</text>
  <circle cx="112" cy="178" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="112" y="182" text-anchor="middle" font-size="11" fill="#333">p</text>
  <path d="M112,170 Q90,162 74,172" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- class {a,o} -->
  <rect x="150" y="142" width="100" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="200" y="162" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">{a, o}</text>
  <circle cx="178" cy="178" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="178" y="182" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a</text>
  <text x="178" y="200" text-anchor="middle" font-size="8.5" fill="#b85450">根↓</text>
  <circle cx="222" cy="178" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="222" y="182" text-anchor="middle" font-size="11" fill="#333">o</text>
  <path d="M222,170 Q200,162 184,172" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- class {k,r,s} -->
  <rect x="260" y="142" width="130" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="325" y="162" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">{k, r, s}</text>
  <circle cx="285" cy="178" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="285" y="182" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">k</text>
  <text x="285" y="200" text-anchor="middle" font-size="8.5" fill="#b85450">根↓</text>
  <circle cx="325" cy="178" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="325" y="182" text-anchor="middle" font-size="11" fill="#333">r</text>
  <circle cx="365" cy="178" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="365" y="182" text-anchor="middle" font-size="11" fill="#333">s</text>
  <path d="M325,170 Q305,164 291,172" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M365,170 Q345,164 291,172" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- class {e,i} -->
  <rect x="400" y="142" width="100" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="450" y="162" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">{e, i}</text>
  <circle cx="428" cy="178" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="428" y="182" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">e</text>
  <text x="428" y="200" text-anchor="middle" font-size="8.5" fill="#b85450">根↓</text>
  <circle cx="472" cy="178" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="472" y="182" text-anchor="middle" font-size="11" fill="#333">i</text>
  <path d="M472,170 Q450,162 434,172" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- key idea box -->
  <rect x="30" y="214" width="480" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="237" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">union 时：让字典序小的字符当根</text>
  <text x="270" y="255" text-anchor="middle" font-size="11.5" fill="#555">parent[较大] = 较小　→　find(x) 恒返回类内最小字符</text>

  <!-- result box -->
  <rect x="30" y="282" width="480" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="306" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">baseStr 每个字符 → find(c) → 拼接即答案</text>

  <rect x="30" y="332" width="480" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="352" text-anchor="middle" font-size="11" fill="#444">无需按秩合并：用「字典序最小」替代 rank 作为合并策略</text>
</svg>
