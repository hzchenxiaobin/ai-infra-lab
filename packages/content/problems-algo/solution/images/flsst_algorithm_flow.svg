<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrowL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="460" height="540" fill="#fafafa"/>

  <text x="230" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">查找区间流程（以找 first 为例）</text>

  <!-- Init -->
  <rect x="80" y="42" width="300" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="64" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">初始化</text>
  <text x="230" y="82" text-anchor="middle" font-size="11" fill="#555">left=0, right=n−1, ans=−1</text>

  <path d="M 230 96 L 230 114" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Loop check -->
  <polygon points="230,118 340,160 230,202 120,160" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="156" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">left ≤ right ?</text>
  <text x="230" y="174" text-anchor="middle" font-size="10.5" fill="#777">区间非空？</text>

  <!-- No -> return -->
  <path d="M 340 160 L 400 160 L 400 240" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="358" y="152" font-size="11" fill="#b85450" font-weight="bold">No</text>
  <rect x="310" y="244" width="140" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="380" y="269" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return ans</text>

  <!-- Yes down -->
  <path d="M 230 202 L 230 220" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="248" y="216" font-size="11" fill="#82b366" font-weight="bold">Yes</text>

  <!-- mid compute -->
  <rect x="100" y="224" width="260" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="230" y="249" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">mid = left + (right−left)/2</text>

  <path d="M 230 264 L 230 282" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- compare diamond -->
  <polygon points="230,286 370,342 230,398 90,342" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="338" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">比较 nums[mid] 与 target</text>

  <!-- == branch: center -->
  <path d="M 230 398 L 230 416" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="252" y="410" font-size="10.5" fill="#d6a040" font-weight="bold">==</text>
  <rect x="120" y="420" width="220" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="440" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">ans = mid（记录候选）</text>
  <text x="230" y="458" text-anchor="middle" font-size="11" fill="#4a7a3a">right = mid − 1（继续往左）</text>

  <!-- < branch: left side -->
  <path d="M 90 342 L 40 342 L 40 420" stroke="#446688" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="60" y="334" font-size="10.5" fill="#446688" font-weight="bold">&lt; target</text>
  <rect x="4" y="424" width="110" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="59" y="440" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">答案在右</text>
  <text x="59" y="456" text-anchor="middle" font-size="10.5" fill="#555">left = mid+1</text>

  <!-- > branch: right side -->
  <path d="M 370 342 L 420 342 L 420 420" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="384" y="334" font-size="10.5" fill="#b85450" font-weight="bold">&gt; target</text>
  <rect x="346" y="424" width="110" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="401" y="440" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">答案在左</text>
  <text x="401" y="456" text-anchor="middle" font-size="10.5" fill="#555">right = mid−1</text>

  <!-- loop back from both branches to loop check -->
  <path d="M 59 424 L 59 160 L 120 160" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <path d="M 401 424 L 401 160 L 340 160" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrowL)" filter="url(#rough2)"/>

  <!-- footer -->
  <text x="230" y="498" text-anchor="middle" font-size="11" fill="#d6a040" font-style="italic">找 last 对称：命中时 left = mid + 1（继续往右）</text>
  <text x="230" y="518" text-anchor="middle" font-size="11" fill="#888">两次二分各 O(log n)，合计 O(log n)，空间 O(1)</text>
</svg>
