<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [3, 4, 5, 1, 2]</text>

  <!-- column headers -->
  <text x="40" y="58" font-size="10.5" fill="#888" font-weight="bold">步骤</text>
  <text x="90" y="58" font-size="10.5" fill="#888" font-weight="bold">left</text>
  <text x="130" y="58" font-size="10.5" fill="#888" font-weight="bold">right</text>
  <text x="180" y="58" font-size="10.5" fill="#888" font-weight="bold">mid</text>
  <text x="240" y="58" font-size="10.5" fill="#888" font-weight="bold">数组 (L…R)</text>
  <text x="430" y="58" font-size="10.5" fill="#888" font-weight="bold">比较</text>
  <text x="530" y="58" font-size="10.5" fill="#888" font-weight="bold">动作</text>

  <!-- separator -->
  <line x1="30" y1="66" x2="545" y2="66" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 1: left=0 right=4 mid=2 -->
  <text x="40" y="100" font-size="11" fill="#333">1</text>
  <text x="90" y="100" font-size="11" fill="#446688" font-weight="bold">0</text>
  <text x="130" y="100" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <text x="180" y="100" font-size="11" fill="#d6a040" font-weight="bold">2</text>
  <!-- array boxes 3 4 5 1 2 : idx0..4, highlight L=0 R=4 mid=2 -->
  <g filter="url(#rough2)">
    <rect x="240" y="84" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="276" y="84" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="312" y="84" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="348" y="84" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="384" y="84" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
  </g>
  <text x="257" y="102" text-anchor="middle" font-size="11" fill="#446688">3</text>
  <text x="293" y="102" text-anchor="middle" font-size="11" fill="#446688">4</text>
  <text x="329" y="102" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">5</text>
  <text x="365" y="102" text-anchor="middle" font-size="11" fill="#446688">1</text>
  <text x="401" y="102" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="430" y="100" font-size="10.5" fill="#333">5 &gt; 2</text>
  <text x="530" y="100" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">left=3</text>

  <!-- Row 2: left=3 right=4 mid=3 -->
  <text x="40" y="166" font-size="11" fill="#333">2</text>
  <text x="90" y="166" font-size="11" fill="#446688" font-weight="bold">3</text>
  <text x="130" y="166" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <text x="180" y="166" font-size="11" fill="#d6a040" font-weight="bold">3</text>
  <g filter="url(#rough2)">
    <rect x="240" y="150" width="34" height="26" fill="#f4f4f4" stroke="#ccc" stroke-width="1.2" rx="4"/>
    <rect x="276" y="150" width="34" height="26" fill="#f4f4f4" stroke="#ccc" stroke-width="1.2" rx="4"/>
    <rect x="312" y="150" width="34" height="26" fill="#f4f4f4" stroke="#ccc" stroke-width="1.2" rx="4"/>
    <rect x="348" y="150" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="384" y="150" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
  </g>
  <text x="257" y="168" text-anchor="middle" font-size="10.5" fill="#bbb">3</text>
  <text x="293" y="168" text-anchor="middle" font-size="10.5" fill="#bbb">4</text>
  <text x="329" y="168" text-anchor="middle" font-size="10.5" fill="#bbb">5</text>
  <text x="365" y="168" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <text x="401" y="168" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="430" y="166" font-size="10.5" fill="#333">1 &lt; 2</text>
  <text x="530" y="166" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">right=3</text>

  <!-- Row 3: end -->
  <text x="40" y="232" font-size="11" fill="#333" font-weight="bold">结束</text>
  <text x="90" y="232" font-size="11" fill="#446688" font-weight="bold">3</text>
  <text x="130" y="232" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="180" y="232" font-size="11" fill="#888">—</text>
  <g filter="url(#rough2)">
    <rect x="348" y="216" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
  </g>
  <text x="365" y="234" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="430" y="232" font-size="10.5" fill="#888">left==right</text>
  <text x="530" y="232" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">返回 1</text>

  <!-- legend -->
  <line x1="30" y1="268" x2="545" y2="268" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="40" y="284" width="16" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="62" y="295" font-size="10" fill="#666">区间内</text>
  <rect x="120" y="284" width="16" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="142" y="295" font-size="10" fill="#666">mid</text>
  <rect x="190" y="284" width="16" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="212" y="295" font-size="10" fill="#666">right 端点</text>
  <rect x="280" y="284" width="16" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="302" y="295" font-size="10" fill="#666">最终答案</text>
  <rect x="370" y="284" width="16" height="14" fill="#f4f4f4" stroke="#ccc" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="392" y="295" font-size="10" fill="#666">已收缩出区间</text>

  <text x="280" y="332" text-anchor="middle" font-size="11" fill="#555">每轮比较 nums[mid] 与 nums[right]，区间折半 → O(log n)</text>
  <text x="280" y="352" text-anchor="middle" font-size="10.5" fill="#888">关键：mid 向下取整偏向 left，故 left=mid+1 必推进，不会死循环</text>
</svg>
