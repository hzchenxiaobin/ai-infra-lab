<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：贡献法——把「对方案求和」翻转为「对格子对计数」</text>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">固定格子对 {p, q} 被同时占据的方案数 = C(mn−2, k−2)</text>

  <!-- 左侧：交换求和顺序 -->
  <g filter="url(#rough2)">
    <rect x="18" y="56" width="204" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="120" y="76" text-anchor="middle" font-size="10.5" fill="#33506b">按方案统计（方案数天文数字 ✗）</text>
    <text x="120" y="96" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33506b">ans = Σ(方案) Σ(棋子对) dist</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 120 110 L 120 136" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arr)"/>
    <text x="132" y="128" font-size="9.5" fill="#4a7a3a">交换求和顺序</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="18" y="140" width="204" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="120" y="160" text-anchor="middle" font-size="10.5" fill="#2f5d24">按格子对统计（贡献法 ✓）</text>
    <text x="120" y="180" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5d24">ans = Σ(格子对) dist × 方案数</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="18" y="204" width="204" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3" rx="8"/>
    <text x="120" y="223" text-anchor="middle" font-size="10" fill="#8f3a35">固定 {p,q} 有子 → 其余 k−2 子</text>
    <text x="120" y="242" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">在 mn−2 格任选 → C(mn−2, k−2)</text>
  </g>

  <!-- 右侧：网格示意 -->
  <text x="360" y="52" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">m×n 网格（示意 4×4）</text>
  <g filter="url(#rough2)">
    <rect x="292" y="58" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <rect x="326" y="58" width="34" height="34" fill="#ffffff" stroke="#9db4c9" stroke-width="1.2" rx="4"/>
    <rect x="360" y="58" width="34" height="34" fill="#ffffff" stroke="#9db4c9" stroke-width="1.2" rx="4"/>
    <rect x="394" y="58" width="34" height="34" fill="#ffffff" stroke="#9db4c9" stroke-width="1.2" rx="4"/>
    <rect x="292" y="92" width="34" height="34" fill="#ffffff" stroke="#9db4c9" stroke-width="1.2" rx="4"/>
    <rect x="326" y="92" width="34" height="34" fill="#ffffff" stroke="#9db4c9" stroke-width="1.2" rx="4"/>
    <rect x="360" y="92" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <rect x="394" y="92" width="34" height="34" fill="#ffffff" stroke="#9db4c9" stroke-width="1.2" rx="4"/>
    <rect x="292" y="126" width="34" height="34" fill="#ffffff" stroke="#9db4c9" stroke-width="1.2" rx="4"/>
    <rect x="326" y="126" width="34" height="34" fill="#ffffff" stroke="#9db4c9" stroke-width="1.2" rx="4"/>
    <rect x="360" y="126" width="34" height="34" fill="#ffffff" stroke="#9db4c9" stroke-width="1.2" rx="4"/>
    <rect x="394" y="126" width="34" height="34" fill="#ffffff" stroke="#9db4c9" stroke-width="1.2" rx="4"/>
    <rect x="292" y="160" width="34" height="34" fill="#ffffff" stroke="#9db4c9" stroke-width="1.2" rx="4"/>
    <rect x="326" y="160" width="34" height="34" fill="#ffffff" stroke="#9db4c9" stroke-width="1.2" rx="4"/>
    <rect x="360" y="160" width="34" height="34" fill="#ffffff" stroke="#9db4c9" stroke-width="1.2" rx="4"/>
    <rect x="394" y="160" width="34" height="34" fill="#ffffff" stroke="#9db4c9" stroke-width="1.2" rx="4"/>
    <circle cx="309" cy="77" r="9" fill="#b85450"/>
    <circle cx="377" cy="111" r="9" fill="#d6a040"/>
    <text x="296" y="71" font-size="9.5" font-weight="bold" fill="#b85450">p</text>
    <text x="364" y="105" font-size="9.5" font-weight="bold" fill="#8a6d1f">q</text>
    <path d="M 309 77 L 309 111 L 366 111" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrR)"/>
    <text x="316" y="99" font-size="9.5" fill="#b85450">Δr = 1</text>
    <text x="336" y="124" font-size="9.5" fill="#b85450">Δc = 2</text>
  </g>
  <text x="360" y="212" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">dist(p,q) = |Δr| + |Δc| = 1 + 2 = 3</text>
  <g filter="url(#rough2)">
    <text x="474" y="98" text-anchor="middle" font-size="9.5" fill="#55677d">棋子无差别</text>
    <text x="474" y="114" text-anchor="middle" font-size="9.5" fill="#55677d">⇒ 选格子集合</text>
    <text x="474" y="130" text-anchor="middle" font-size="9.5" fill="#55677d">用组合 C</text>
  </g>

  <!-- 底部：行列分离 -->
  <text x="260" y="262" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">T = 所有格子对距离和 → 按 |Δr| + |Δc| 行列分离：</text>

  <g filter="url(#rough2)">
    <rect x="18" y="274" width="158" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="97" y="292" text-anchor="middle" font-size="10" font-weight="bold" fill="#33506b">行方向（每对行 → n² 格子对）</text>
    <text x="97" y="312" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">n² · m(m−1)(m+1)/6</text>
    <text x="97" y="326" text-anchor="middle" font-size="9" fill="#55677d">Σ d(m−d) 的闭式</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="186" y="274" width="158" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="265" y="292" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f5d24">列方向（每对列 → m² 格子对）</text>
    <text x="265" y="312" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">m² · n(n−1)(n+1)/6</text>
    <text x="265" y="326" text-anchor="middle" font-size="9" fill="#4a6a3f">与行方向完全对称</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="354" y="274" width="148" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="428" y="292" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a6d1f">每对格子的出现次数</text>
    <text x="428" y="312" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">C(mn−2, k−2)</text>
    <text x="428" y="326" text-anchor="middle" font-size="9" fill="#8a6d1f">与 p、q 是谁无关</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="344" width="440" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.5" stroke-dasharray="6 4" rx="10"/>
    <text x="260" y="364" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">ans = C(mn−2, k−2) × [ n²·m(m²−1)/6 + m²·n(n²−1)/6 ] mod (10⁹+7)</text>
  </g>
</svg>
