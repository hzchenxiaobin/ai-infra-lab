<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">逐步演算：words = ["pay","attention","practice","attend"], pref = "at"</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">每个词：长度守卫 → 逐位比较 → 判定是否前缀</text>

  <!-- Table outer frame -->
  <rect x="30" y="58" width="460" height="180" fill="none" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- Column dividers -->
  <line x1="70" y1="58" x2="70" y2="238" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="230" y1="58" x2="230" y2="238" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="310" y1="58" x2="310" y2="238" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="410" y1="58" x2="410" y2="238" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- Header row divider -->
  <line x1="30" y1="86" x2="490" y2="86" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- Header background -->
  <rect x="31" y="59" width="458" height="26" fill="#e8f0fe" stroke="none" filter="url(#rough2)"/>

  <!-- Header text -->
  <text x="50" y="77" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">#</text>
  <text x="150" y="77" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">word</text>
  <text x="270" y="77" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">len≥m?</text>
  <text x="360" y="77" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">逐位比较</text>
  <text x="450" y="77" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">是前缀?</text>

  <!-- Row 1: pay -->
  <rect x="31" y="87" width="458" height="38" fill="#fce4ec" stroke="none" filter="url(#rough2)"/>
  <line x1="30" y1="125" x2="490" y2="125" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="110" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">1</text>
  <text x="80" y="110" font-size="10.5" fill="#333">pay</text>
  <text x="270" y="110" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">3≥2 ✓</text>
  <text x="360" y="110" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">p≠a ✗</text>
  <text x="450" y="110" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗ 否</text>

  <!-- Row 2: attention -->
  <rect x="31" y="125" width="458" height="38" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
  <line x1="30" y1="163" x2="490" y2="163" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="148" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">2</text>
  <text x="80" y="148" font-size="10.5" fill="#333">attention</text>
  <text x="270" y="148" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">9≥2 ✓</text>
  <text x="360" y="148" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">a=a, t=t ✓</text>
  <text x="450" y="148" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 是</text>

  <!-- Row 3: practice -->
  <rect x="31" y="163" width="458" height="38" fill="#fce4ec" stroke="none" filter="url(#rough2)"/>
  <line x1="30" y1="201" x2="490" y2="201" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="186" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">3</text>
  <text x="80" y="186" font-size="10.5" fill="#333">practice</text>
  <text x="270" y="186" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">8≥2 ✓</text>
  <text x="360" y="186" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">p≠a ✗</text>
  <text x="450" y="186" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗ 否</text>

  <!-- Row 4: attend -->
  <rect x="31" y="201" width="458" height="37" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
  <text x="50" y="224" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">4</text>
  <text x="80" y="224" font-size="10.5" fill="#333">attend</text>
  <text x="270" y="224" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">6≥2 ✓</text>
  <text x="360" y="224" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">a=a, t=t ✓</text>
  <text x="450" y="224" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 是</text>

  <!-- ===== Result box ===== -->
  <rect x="70" y="252" width="380" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="272" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">ans = 2（attention、attend）→ 答案</text>
  <text x="260" y="288" text-anchor="middle" font-size="10.5" fill="#555">pay、practice 在首位 p≠a 即被拒绝，第 2 位无需比较</text>

  <!-- ===== Insight box ===== -->
  <rect x="40" y="308" width="440" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="326" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">关键：长度守卫先过滤短词，逐位比较首个不等即 break</text>
  <text x="260" y="340" text-anchor="middle" font-size="10" fill="#555">O(1) 空间扫描，无需切出子串副本</text>
</svg>
