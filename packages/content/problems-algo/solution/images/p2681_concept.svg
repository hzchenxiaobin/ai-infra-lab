<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：排序后固定 max=min 对，中间随意取</text>

  <!-- sorted array label -->
  <text x="30" y="74" font-size="12" fill="#888">排序后:</text>

  <!-- i=0 min (green) -->
  <rect x="98" y="58" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="128" y="82" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="128" y="108" text-anchor="middle" font-size="10" fill="#4a7a3a">min nums[i]</text>

  <!-- middle 3 (yellow) -->
  <rect x="164" y="58" width="60" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="194" y="82" text-anchor="middle" font-size="14" fill="#333">2</text>
  <rect x="230" y="58" width="60" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="82" text-anchor="middle" font-size="14" fill="#333">3</text>
  <rect x="296" y="58" width="60" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="326" y="82" text-anchor="middle" font-size="14" fill="#333">5</text>

  <!-- j=4 max (red) -->
  <rect x="362" y="58" width="60" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="392" y="82" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">7</text>
  <text x="392" y="108" text-anchor="middle" font-size="10" fill="#b85450">max nums[j]</text>

  <!-- index labels under cells -->
  <text x="128" y="124" text-anchor="middle" font-size="10" fill="#999">i=0</text>
  <text x="194" y="124" text-anchor="middle" font-size="10" fill="#999">1</text>
  <text x="260" y="124" text-anchor="middle" font-size="10" fill="#999">2</text>
  <text x="326" y="124" text-anchor="middle" font-size="10" fill="#999">3</text>
  <text x="392" y="124" text-anchor="middle" font-size="10" fill="#999">j=4</text>

  <!-- bracket over middle elements: from x=164 to x=356 -->
  <path d="M 164 138 L 164 146 L 356 146 L 356 138" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="260" y="166" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">中间 j−i−1 = 3 个元素</text>
  <text x="260" y="183" text-anchor="middle" font-size="11" fill="#888">每个「选 / 不选」自由组合 → 2³ = 8 组</text>

  <!-- dashed arrow from min to max -->
  <path d="M 128 200 L 392 200" stroke="#446688" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="260" y="216" text-anchor="middle" font-size="11" fill="#446688">这 8 组的力量全部相同</text>

  <!-- formula box -->
  <rect x="60" y="234" width="400" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="256" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">力量 = nums[j]² · nums[i]</text>
  <text x="260" y="274" text-anchor="middle" font-size="11" fill="#888">与中间选了谁无关，只由 min / max 决定</text>

  <!-- summary -->
  <rect x="60" y="298" width="400" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">枚举所有 i&lt;j 对（贡献 2^(j−i−1)·nums[i]·nums[j]²）+ 每个单元素 nums[j]³</text>
  <text x="260" y="336" text-anchor="middle" font-size="11" fill="#888">单元素 i=j 不套 2 的幂，单独计入</text>
</svg>
