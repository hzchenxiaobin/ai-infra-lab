<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 640"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="640" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：预排序 + 四重枚举逐层剪枝，产出天然有序</text>

  <!-- start -->
  <g filter="url(#rough2)">
    <rect x="196" y="34" width="168" height="30" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="280" y="54" text-anchor="middle" font-size="13" fill="#8a6d1a">w ← sorted(words)</text>
  </g>
  <path d="M 280 64 L 280 84" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- enumerate top -->
  <g filter="url(#rough2)">
    <rect x="196" y="88" width="168" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="108" text-anchor="middle" font-size="13" fill="#33506b">枚举 top = w[i]</text>
  </g>
  <path d="M 280 118 L 280 140" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond 1: left -->
  <g filter="url(#rough2)">
    <polygon points="280,144 392,196 280,248 168,196" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="280" y="188" text-anchor="middle" font-size="12.5" fill="#33506b" font-weight="bold">枚举 left = w[j]</text>
    <text x="280" y="206" text-anchor="middle" font-size="11" fill="#33506b">j ≠ i 且 w[j][0]==w[i][0] ?</text>
  </g>
  <path d="M 392 196 L 436 196" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="414" y="188" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="440" y="180" width="104" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="492" y="200" text-anchor="middle" font-size="12" fill="#a04040">continue：换 j</text>
  </g>
  <path d="M 280 248 L 280 270" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="293" y="264" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- diamond 2: right -->
  <g filter="url(#rough2)">
    <polygon points="280,272 392,324 280,376 168,324" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="280" y="316" text-anchor="middle" font-size="12.5" fill="#33506b" font-weight="bold">枚举 right = w[k]</text>
    <text x="280" y="334" text-anchor="middle" font-size="11" fill="#33506b">k ∉ {i,j} 且 w[k][0]==w[i][3] ?</text>
  </g>
  <path d="M 392 324 L 436 324" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="414" y="316" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="440" y="308" width="104" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="492" y="328" text-anchor="middle" font-size="12" fill="#a04040">continue：换 k</text>
  </g>
  <path d="M 280 376 L 280 398" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="293" y="392" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- diamond 3: bottom -->
  <g filter="url(#rough2)">
    <polygon points="280,400 398,454 280,508 162,454" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="280" y="436" text-anchor="middle" font-size="12.5" fill="#33506b" font-weight="bold">枚举 bottom = w[l]</text>
    <text x="280" y="454" text-anchor="middle" font-size="10.5" fill="#33506b">w[l][0]==w[j][3] 且 w[l][3]==w[k][3]</text>
    <text x="280" y="472" text-anchor="middle" font-size="11" fill="#33506b">且 l ∉ {i,j,k} ?</text>
  </g>
  <path d="M 398 454 L 440 454" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="419" y="446" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="444" y="438" width="100" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="494" y="458" text-anchor="middle" font-size="12" fill="#a04040">continue：换 l</text>
  </g>
  <path d="M 280 508 L 280 530" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="293" y="524" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- collect -->
  <g filter="url(#rough2)">
    <rect x="180" y="534" width="200" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="280" y="555" text-anchor="middle" font-size="12.5" fill="#2f5d24">收集 [top, left, right, bottom]</text>
  </g>
  <path d="M 280 566 L 280 586" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- end -->
  <g filter="url(#rough2)">
    <rect x="178" y="590" width="204" height="30" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="280" y="610" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold">返回 res —— 天然字典序 ✓</text>
  </g>

  <!-- loop back -->
  <path d="M 180 550 L 104 550 L 104 103 L 192 103" stroke="#7a8aa0" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="98" y="322" text-anchor="end" font-size="10.5" fill="#666" filter="url(#rough2)">四重循环</text>
  <text x="98" y="338" text-anchor="end" font-size="10.5" fill="#666" filter="url(#rough2)">穷举穷尽</text>

  <text x="280" y="632" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">n ≤ 15 ⟹ 至多 15×14×13×12 = 32760 次 O(1) 检验（官方 hint：Use bruteforce）</text>
</svg>
