<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：并发计时与 await 挂起的配合</text>

  <!-- ===== Example 1 ===== -->
  <text x="60" y="60" font-size="13" fill="#446688" font-weight="bold">示例 1：t1=20ms → 2, t2=60ms → 5</text>

  <!-- Timeline labels -->
  <text x="60" y="90" font-size="10" fill="#888">promise1</text>
  <text x="60" y="130" font-size="10" fill="#888">promise2</text>
  <text x="60" y="170" font-size="10" fill="#888">await</text>

  <!-- timeline baseline -->
  <line x1="140" y1="85" x2="520" y2="85" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="140" y1="125" x2="520" y2="125" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- time markers -->
  <text x="140" y="200" font-size="9" fill="#aaa">0</text>
  <text x="260" y="200" font-size="9" fill="#aaa">20ms</text>
  <text x="420" y="200" font-size="9" fill="#aaa">60ms</text>

  <!-- promise1 bar (0 to 20ms → resolve 2) -->
  <rect x="140" y="78" width="120" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="270" y="89" font-size="10" fill="#446688" font-weight="bold">→ 2 ✓</text>

  <!-- promise2 bar (0 to 60ms → resolve 5) -->
  <rect x="140" y="118" width="280" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="430" y="129" font-size="10" fill="#446688" font-weight="bold">→ 5 ✓</text>

  <!-- await sequence: await p1 (0-20ms), then await p2 (20-60ms) -->
  <rect x="140" y="158" width="120" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="155" y="169" font-size="9" fill="#d6a040">await p1</text>

  <rect x="260" y="158" width="160" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="275" y="169" font-size="9" fill="#d6a040">await p2 (剩余40ms)</text>

  <!-- result -->
  <rect x="440" y="152" width="70" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="475" y="170" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2+5=7</text>

  <!-- annotation -->
  <text x="320" y="186" font-size="9" fill="#888">总耗时 = max(20, 60) = 60ms（非 20+60=80ms）</text>

  <!-- divider -->
  <line x1="40" y1="215" x2="520" y2="215" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <!-- ===== Example 2 ===== -->
  <text x="60" y="240" font-size="13" fill="#446688" font-weight="bold">示例 2：t1=50ms → 10, t2=30ms → -12</text>

  <text x="60" y="270" font-size="10" fill="#888">promise1</text>
  <text x="60" y="310" font-size="10" fill="#888">promise2</text>
  <text x="60" y="350" font-size="10" fill="#888">await</text>

  <line x1="140" y1="265" x2="520" y2="265" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="140" y1="305" x2="520" y2="305" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- time markers -->
  <text x="140" y="385" font-size="9" fill="#aaa">0</text>
  <text x="320" y="385" font-size="9" fill="#aaa">30ms</text>
  <text x="440" y="385" font-size="9" fill="#aaa">50ms</text>

  <!-- promise1 bar (0 to 50ms → resolve 10) -->
  <rect x="140" y="258" width="300" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="450" y="269" font-size="10" fill="#446688" font-weight="bold">→ 10 ✓</text>

  <!-- promise2 bar (0 to 30ms → resolve -12) -->
  <rect x="140" y="298" width="180" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="330" y="309" font-size="10" fill="#446688" font-weight="bold">→ -12 ✓</text>

  <!-- await sequence: await p1 (0-50ms), then await p2 (instant, already resolved) -->
  <rect x="140" y="338" width="300" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="155" y="349" font-size="9" fill="#d6a040">await p1 (50ms)</text>

  <rect x="440" y="338" width="10" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="458" y="349" font-size="9" fill="#4a7a3a">立即取 -12</text>

  <!-- result -->
  <rect x="470" y="332" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="500" y="350" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">10-12=-2</text>

  <!-- annotation -->
  <text x="340" y="372" font-size="9" fill="#888">promise2 在 30ms 已 resolve，await p1 后立刻取到 b，无额外等待</text>
</svg>
