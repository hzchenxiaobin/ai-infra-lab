<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="540" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一次遍历 + 双条件更新</text>

  <!-- Start -->
  <ellipse cx="270" cy="60" rx="44" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="65" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">开始</text>

  <line x1="270" y1="80" x2="270" y2="96" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init ans = nums[0] -->
  <rect x="150" y="100" width="240" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="120" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">ans = nums[0]</text>
  <text x="270" y="136" text-anchor="middle" font-size="10.5" fill="#888">用首个元素初始化候选</text>

  <line x1="270" y1="144" x2="270" y2="160" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop header -->
  <rect x="120" y="164" width="300" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="189" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">遍历 num ∈ nums</text>

  <line x1="270" y1="204" x2="270" y2="224" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 1: |num| < |ans| ? -->
  <polygon points="270,228 392,272 270,316 148,272" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="266" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">|num| &lt; |ans| ?</text>
  <text x="270" y="282" text-anchor="middle" font-size="10.5" fill="#888">距离更近？</text>

  <!-- Yes branch: left/down to update -->
  <line x1="148" y1="272" x2="100" y2="272" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="264" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <line x1="100" y1="272" x2="100" y2="350" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- No branch: right to Decision 2 -->
  <line x1="392" y1="272" x2="440" y2="272" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="418" y="264" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">否</text>
  <line x1="440" y1="272" x2="440" y2="328" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 2: |num| == |ans| 且 num > ans ? -->
  <polygon points="440,332 514,364 440,396 366,364" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="440" y="360" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">|num|==|ans|</text>
  <text x="440" y="374" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">且 num&gt;ans ?</text>

  <!-- D2 Yes: down-left to update box -->
  <path d="M 440 396 Q 440 410 300 410 Q 200 410 200 396" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="380" y="402" font-size="10.5" fill="#4a7a3a" font-weight="bold">是（平局取大）</text>

  <!-- D2 No: skip -->
  <path d="M 366 364 Q 320 364 300 364" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="318" y="356" font-size="10.5" fill="#b85450" font-weight="bold">否，跳过</text>

  <!-- Update box (ans = num) -->
  <rect x="100" y="350" width="180" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="190" y="372" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">ans = num</text>
  <text x="190" y="388" text-anchor="middle" font-size="10.5" fill="#4a7a3a">更新候选为更优解</text>

  <!-- loop back arrow: from update box up-right to loop header -->
  <path d="M 280 373 Q 470 373 470 184 Q 470 174 420 184" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="5 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="486" y="280" font-size="10.5" fill="#888">下一个</text>
  <text x="486" y="294" font-size="10.5" fill="#888">num</text>

  <!-- exit path: from loop header to return -->
  <path d="M 120 184 Q 60 184 60 230 Q 60 460 150 460" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="50" y="300" font-size="10.5" fill="#888" font-weight="bold">遍历</text>
  <text x="50" y="314" font-size="10.5" fill="#888" font-weight="bold">结束</text>

  <!-- return ans -->
  <rect x="150" y="442" width="240" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="467" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">return ans</text>

  <line x1="270" y1="482" x2="270" y2="498" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- End -->
  <ellipse cx="270" cy="516" rx="40" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="521" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">结束</text>
</svg>
