<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心直觉：slice 天然处理「最后一块不满」的情况</text>

  <!-- Original array label -->
  <text x="60" y="64" font-size="12" fill="#446688" font-weight="bold">arr = [1, 9, 6, 3, 2]</text>

  <!-- Original array boxes -->
  <g filter="url(#rough2)">
    <rect x="60" y="72" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="80" y="95" text-anchor="middle" font-size="13" fill="#333">1</text>
    <rect x="100" y="72" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="120" y="95" text-anchor="middle" font-size="13" fill="#333">9</text>
    <rect x="140" y="72" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="160" y="95" text-anchor="middle" font-size="13" fill="#333">6</text>
    <rect x="180" y="72" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="200" y="95" text-anchor="middle" font-size="13" fill="#333">3</text>
    <rect x="220" y="72" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="240" y="95" text-anchor="middle" font-size="13" fill="#333">2</text>
  </g>

  <!-- slice(0,3) bracket -->
  <path d="M 62 118 Q 62 128 80 128 L 160 128 Q 178 128 178 118" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="120" y="146" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">slice(0, 3)</text>
  <path d="M 120 152 L 120 180" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- slice(3,6) bracket -->
  <path d="M 182 118 Q 182 128 200 128 L 258 128 Q 276 128 276 118" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="229" y="146" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">slice(3, 6)</text>
  <text x="229" y="160" text-anchor="middle" font-size="9" fill="#888">只有2个元素，越界自动截断</text>
  <path d="M 229 166 L 229 180" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>

  <!-- Result chunks -->
  <text x="60" y="196" font-size="12" fill="#b85450" font-weight="bold">结果：[[1,9,6], [3,2]]</text>

  <!-- Chunk 1 -->
  <g filter="url(#rough2)">
    <rect x="60" y="206" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="80" y="229" text-anchor="middle" font-size="13" fill="#333">1</text>
    <rect x="100" y="206" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="120" y="229" text-anchor="middle" font-size="13" fill="#333">9</text>
    <rect x="140" y="206" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="160" y="229" text-anchor="middle" font-size="13" fill="#333">6</text>
  </g>
  <text x="100" y="260" text-anchor="middle" font-size="11" fill="#446688">第 1 块（满 3）</text>

  <!-- Chunk 2 -->
  <g filter="url(#rough2)">
    <rect x="200" y="206" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="220" y="229" text-anchor="middle" font-size="13" fill="#333">3</text>
    <rect x="240" y="206" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="260" y="229" text-anchor="middle" font-size="13" fill="#333">2</text>
    <rect x="280" y="206" width="40" height="36" fill="#fff" stroke="#ccc" stroke-width="1" rx="4" stroke-dasharray="4,3"/>
    <text x="300" y="229" text-anchor="middle" font-size="11" fill="#ccc">∅</text>
  </g>
  <text x="240" y="260" text-anchor="middle" font-size="11" fill="#4a7a3a">第 2 块（只有 2，虚位留空）</text>

  <!-- Key insight box -->
  <rect x="60" y="282" width="480" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="304" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">关键：arr.slice(i, i+size) 会自动把越界部分截断</text>
  <text x="300" y="322" text-anchor="middle" font-size="11" fill="#888">不用判断「最后一块」——slice 天然处理，end 超过 length 就只取到末尾</text>

  <!-- empty array note -->
  <rect x="60" y="344" width="480" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="362" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">边界：arr = [] 时 Math.ceil(0/size) = 0 → Array.from 产空数组</text>
  <text x="300" y="378" text-anchor="middle" font-size="11" fill="#888">for 循环写法同理：i=0 < 0 为假，循环不进入，返回 []</text>
</svg>
