<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 7 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：CASE WHEN + MOD + max_id 兜底</text>

  <!-- Step 1: FROM Seat -->
  <rect x="60" y="44" width="140" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="130" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① FROM Seat</text>
  <text x="130" y="76" text-anchor="middle" font-size="10" fill="#555">读取全部行 + 求 max_id</text>

  <path d="M 130 88 L 130 108" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: CASE decision diamond -->
  <polygon points="130,112,230,160,130,208,30,160" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="130" y="152" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">② id 奇偶?</text>
  <text x="130" y="168" text-anchor="middle" font-size="10" fill="#555">MOD(id, 2)</text>
  <text x="130" y="182" text-anchor="middle" font-size="10" fill="#555">+ 是否末位</text>

  <!-- branch: odd + not last -->
  <path d="M 30 160 L 10 160 L 10 240" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="14" y="200" font-size="9" fill="#4a7a3a">奇 &amp; 非末</text>
  <rect x="10" y="244" width="120" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="70" y="262" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">new_id = id + 1</text>
  <text x="70" y="278" text-anchor="middle" font-size="9" fill="#555">与下一位交换</text>

  <!-- branch: even -->
  <path d="M 230 160 L 250 160 L 250 240" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="238" y="200" font-size="9" fill="#446688">偶</text>
  <rect x="190" y="244" width="120" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="250" y="262" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">new_id = id − 1</text>
  <text x="250" y="278" text-anchor="middle" font-size="9" fill="#555">与上一位交换</text>

  <!-- branch: odd + last -->
  <path d="M 130 208 L 130 240" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="138" y="226" font-size="9" fill="#b85450">奇 &amp; 末位</text>
  <rect x="350" y="244" width="120" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="410" y="262" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">new_id = id</text>
  <text x="410" y="278" text-anchor="middle" font-size="9" fill="#555">保留不变</text>
  <path d="M 250 266 L 345 266" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- merge -->
  <path d="M 70 290 L 70 310" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 250 290 L 250 310" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 410 290 L 410 310" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: SELECT new_id, student ORDER BY new_id -->
  <rect x="60" y="314" width="400" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="330" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">③ SELECT (new_id AS id, student) FROM above</text>
  <text x="260" y="346" text-anchor="middle" font-size="10" fill="#555">ORDER BY new_id 升序输出</text>

  <path d="M 260 358 L 260 372" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- output -->
  <rect x="170" y="376" width="180" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="390" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">输出：交换后的 id, student</text>
</svg>
