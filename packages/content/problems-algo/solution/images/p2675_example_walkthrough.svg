<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例 3 演算：嵌套对象 → 矩阵</text>

  <!-- ===== Input ===== -->
  <rect x="40" y="42" width="560" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="320" y="63" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">输入：[ {"a":{"b":1,"c":2}}, {"a":{"b":3,"d":4}} ]</text>

  <!-- ===== Step 1: Flatten ===== -->
  <text x="320" y="96" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">① getKeys 递归拍平</text>

  <!-- obj 0 -->
  <rect x="30" y="108" width="270" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="44" y="126" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">obj₀ = {"a":{"b":1,"c":2}}</text>
  <text x="44" y="142" font-size="10" fill="#555" filter="url(#rough2)">  key "a" → 子对象 → 递归</text>
  <text x="44" y="156" font-size="10" fill="#555" filter="url(#rough2)">    "b"→叶子→返回[''] → 前缀 "a"+"."+"b"</text>
  <text x="44" y="170" font-size="10" fill="#555" filter="url(#rough2)">    "c"→叶子→返回[''] → 前缀 "a"+"."+"c"</text>

  <!-- obj 1 -->
  <rect x="340" y="108" width="270" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="354" y="126" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">obj₁ = {"a":{"b":3,"d":4}}</text>
  <text x="354" y="142" font-size="10" fill="#555" filter="url(#rough2)">  key "a" → 子对象 → 递归</text>
  <text x="354" y="156" font-size="10" fill="#555" filter="url(#rough2)">    "b"→叶子→ ["a.b"]</text>
  <text x="354" y="170" font-size="10" fill="#555" filter="url(#rough2)">    "d"→叶子→ ["a.d"]</text>

  <!-- arrow down -->
  <path d="M 320 180 L 320 194" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: Collect + Sort ===== -->
  <text x="320" y="212" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">② 收集 + 排序</text>

  <rect x="100" y="220" width="440" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="320" y="241" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Set{a.b, a.c} ∪ Set{a.b, a.d} → sort → [a.b, a.c, a.d]</text>

  <!-- arrow down -->
  <path d="M 320 254 L 320 268" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: Build matrix ===== -->
  <text x="320" y="286" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">③ getValue 逐格填充</text>

  <!-- matrix table -->
  <!-- header -->
  <rect x="120" y="298" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="170" y="316" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">a.b</text>
  <rect x="220" y="298" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="270" y="316" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">a.c</text>
  <rect x="320" y="298" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="370" y="316" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">a.d</text>

  <!-- row 0 -->
  <rect x="120" y="326" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="170" y="344" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="220" y="326" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="270" y="344" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="320" y="326" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="370" y="344" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">""</text>

  <!-- row 1 -->
  <rect x="120" y="354" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="170" y="372" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="220" y="354" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="270" y="372" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">""</text>
  <rect x="320" y="354" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="370" y="372" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>

  <!-- annotations -->
  <text x="110" y="316" text-anchor="end" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">列头</text>
  <text x="110" y="344" text-anchor="end" font-size="9" fill="#4a7a3a" filter="url(#rough2)">obj₀</text>
  <text x="110" y="372" text-anchor="end" font-size="9" fill="#4a7a3a" filter="url(#rough2)">obj₁</text>

  <!-- note about empty string -->
  <rect x="440" y="326" width="170" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="525" y="346" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">路径不存在 → ""</text>
  <text x="525" y="360" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">obj₀ 没有 a.d</text>
  <text x="525" y="374" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">obj₁ 没有 a.c</text>

  <!-- bottom note -->
  <rect x="40" y="394" width="560" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="320" y="409" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">输出：[["a.b","a.c","a.d"],[1,2,""],[3,"",4]]</text>
</svg>
