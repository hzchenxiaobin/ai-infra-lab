<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="580" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：离线排序累积候选 + 有序集合二分找最近房间号</text>

  <!-- ===== Top-left: rooms sorted by size desc ===== -->
  <text x="150" y="58" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">① 房间按 size 降序排</text>

  <text x="36" y="86" font-size="10" fill="#888" filter="url(#rough2)">号,面积</text>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="80" y="76" width="64" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="112" y="93" fill="#446688" font-weight="bold">3,5</text>
    <rect x="150" y="76" width="64" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="182" y="93" fill="#446688" font-weight="bold">1,4</text>
    <rect x="220" y="76" width="64" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="252" y="93" fill="#446688" font-weight="bold">2,3</text>
    <rect x="80" y="108" width="64" height="26" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="112" y="125" fill="#aaa">5,2</text>
    <rect x="150" y="108" width="64" height="26" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="182" y="125" fill="#aaa">4,1</text>
  </g>
  <text x="150" y="152" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">游标 ptr 从顶部向下推进</text>
  <path d="M 150 156 L 150 168" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- ===== Top-right: queries sorted by minSize desc ===== -->
  <text x="430" y="58" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 查询按 minSize 降序排</text>

  <text x="316" y="86" font-size="10" fill="#888" filter="url(#rough2)">pref,min,idx</text>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="360" y="76" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="400" y="93" fill="#4a7a3a" font-weight="bold">2,5,#2</text>
    <rect x="446" y="76" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="486" y="93" fill="#4a7a3a" font-weight="bold">2,4,#1</text>
    <rect x="360" y="108" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="400" y="125" fill="#4a7a3a" font-weight="bold">2,3,#0</text>
  </g>
  <text x="430" y="152" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">minSize 越小 → 候选越多</text>

  <!-- ===== Middle: arrow down to candidate set ===== -->
  <path d="M 150 172 L 150 188" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 430 140 L 430 188" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Middle: candidate set (sorted by id) ===== -->
  <rect x="60" y="192" width="460" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="78" y="208" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">③ 候选集 S（按 id 升序，只增不减）</text>
  <text x="78" y="226" font-size="10" fill="#555" filter="url(#rough2)">游标把 size ≥ 当前 minSize 的房间号逐个 insert，已入集的永远留下</text>

  <!-- candidate set visualization: {1, 2, 3} -->
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="120" y="248" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="142" y="267" fill="#446688" font-weight="bold">1</text>
    <rect x="180" y="248" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="202" y="267" fill="#446688" font-weight="bold">2</text>
    <rect x="240" y="248" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="262" y="267" fill="#446688" font-weight="bold">3</text>
  </g>
  <text x="320" y="267" font-size="10" fill="#888" filter="url(#rough2)">← 有序集合 (std::set / SortedList)</text>

  <!-- ===== Bottom: binary search closest ===== -->
  <text x="290" y="300" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">④ lower_bound(preferred) + 前驱 → 二分找最接近值</text>

  <!-- preferred target marker between 1 and 2 (for pref=... illustrate) -->
  <text x="150" y="300" font-size="10" fill="#4a7a3a" filter="url(#rough2)">preferred</text>
  <path d="M 162 296 L 162 280" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- lo / hi annotation -->
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <rect x="120" y="312" width="44" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="142" y="327" fill="#d6a040" font-weight="bold">lo</text>
    <rect x="180" y="312" width="44" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="202" y="327" fill="#d6a040" font-weight="bold">hi</text>
  </g>
  <text x="320" y="327" font-size="10" fill="#888" filter="url(#rough2)">prev(it) 与 *it 两个夹板候选</text>

  <!-- distance comparison -->
  <rect x="60" y="348" width="460" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="368" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">比较 |lo − preferred| 与 |hi − preferred|，取更近者；平局取更小 id（lo）</text>

  <!-- footer insight -->
  <rect x="40" y="394" width="500" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="414" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">为什么离线排序有效？</text>
  <text x="56" y="432" font-size="10" fill="#555" filter="url(#rough2)">minSize 降序 → 候选集只增不减，每个房间至多入集一次（ptr 单调推进）。</text>
  <text x="56" y="448" font-size="10" fill="#555" filter="url(#rough2)">有序集合支持 O(log n) 插入与 lower_bound，把「找最接近值」从 O(n) 降到 O(log n)。</text>
</svg>
