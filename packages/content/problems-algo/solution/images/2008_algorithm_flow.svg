<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">算法流程：双栈扫描（值栈 + 运算符栈）</text>

  <!-- Step 1: init -->
  <rect x="160" y="46" width="240" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">① 初始化 st=[]（值栈） op=[]（符栈）</text>
  <text x="280" y="79" text-anchor="middle" font-size="10" fill="#666">每个元素为 (val, cost) 二元组</text>

  <path d="M 280 86 L 280 100" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: scan char -->
  <rect x="130" y="104" width="300" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="129" text-anchor="middle" font-size="12" fill="#335" font-weight="bold">② 逐字符扫描 expression</text>

  <path d="M 280 144 L 280 158" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Decision: char type -->
  <polygon points="280,162 430,222 280,282 130,222" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="210" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold">字符类型？</text>
  <text x="280" y="228" text-anchor="middle" font-size="10.5" fill="#888">'0'/'1' | '&amp;'/'|' | '(' | ')'</text>

  <!-- Branch 1: digit -->
  <path d="M 130 222 L 60 222 L 60 300" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="84" y="216" font-size="10" fill="#4a7a3a" font-weight="bold">数字</text>
  <rect x="14" y="304" width="100" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="64" y="324" text-anchor="middle" font-size="10.5" fill="#3a5a2a" font-weight="bold">压入 st</text>
  <text x="64" y="340" text-anchor="middle" font-size="10" fill="#555">(digit, 1)</text>
  <text x="64" y="354" text-anchor="middle" font-size="9.5" fill="#888">叶子代价=1</text>

  <!-- Branch 2: operator -->
  <path d="M 130 222 L 130 370" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="140" y="240" font-size="10" fill="#446688" font-weight="bold">&amp; / |</text>
  <rect x="124" y="374" width="150" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="199" y="394" text-anchor="middle" font-size="10.5" fill="#335" font-weight="bold">先清栈顶同级运算</text>
  <text x="199" y="410" text-anchor="middle" font-size="9.5" fill="#666">while op顶∈{&amp;,|}:</text>
  <text x="199" y="424" text-anchor="middle" font-size="9.5" fill="#666">  弹出求值 merge</text>
  <text x="199" y="438" text-anchor="middle" font-size="9.5" fill="#666">再压入该运算符</text>

  <!-- Branch 3: open paren -->
  <path d="M 430 222 L 430 300" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="442" y="240" font-size="10" fill="#d6a040" font-weight="bold">(</text>
  <rect x="380" y="304" width="100" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="430" y="322" text-anchor="middle" font-size="10.5" fill="#a87020" font-weight="bold">压入 op</text>
  <text x="430" y="338" text-anchor="middle" font-size="9.5" fill="#888">作为屏障</text>

  <!-- Branch 4: close paren -->
  <path d="M 430 222 L 500 222 L 500 300" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="478" y="216" font-size="10" fill="#b85450" font-weight="bold">)</text>
  <rect x="446" y="304" width="104" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="498" y="324" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">清栈到 '('</text>
  <text x="498" y="340" text-anchor="middle" font-size="9.5" fill="#666">弹出 '(' 屏障</text>
  <text x="498" y="354" text-anchor="middle" font-size="9.5" fill="#888">括号内已归约</text>

  <!-- loop back to step 2 -->
  <path d="M 64 360 L 64 124 L 130 124" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arrD)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <path d="M 199 446 L 199 470 L 380 470 L 380 124 L 410 124" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arrD)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <path d="M 498 360 L 498 470 L 380 470" stroke="#888" stroke-width="1.3" fill="none" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <text x="280" y="490" text-anchor="middle" font-size="9.5" fill="#aaa">扫描结束后：清空剩余运算符 → 返回 st[0].cost</text>
</svg>
