<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：ones/twos 双掩码 = 每个值各自的「模 3 计数器」</text>
  <text x="260" y="38" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">示例 1 · nums = [2,2,3,2,5,5,5,7,7] —— 值 3 出现 1 次、值 7 出现 2 次、值 2/5 各 3 次</text>

  <!-- ============ Panel 1: 值 → 值域位 ============ -->
  <text x="40" y="66" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">① 值 v 压成「值域位」b = 1 &lt;&lt; v</text>

  <g filter="url(#rough2)">
    <rect x="160" y="78" width="30" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="190" y="78" width="30" height="24" fill="#f7f7f7" stroke="#aaa" stroke-width="1.2" rx="4"/>
    <rect x="220" y="78" width="30" height="24" fill="#f7f7f7" stroke="#aaa" stroke-width="1.2" rx="4"/>
    <rect x="250" y="78" width="30" height="24" fill="#f7f7f7" stroke="#aaa" stroke-width="1.2" rx="4"/>
    <rect x="280" y="78" width="30" height="24" fill="#f7f7f7" stroke="#aaa" stroke-width="1.2" rx="4"/>
    <rect x="310" y="78" width="30" height="24" fill="#f7f7f7" stroke="#aaa" stroke-width="1.2" rx="4"/>
    <rect x="340" y="78" width="30" height="24" fill="#f7f7f7" stroke="#aaa" stroke-width="1.2" rx="4"/>
    <rect x="370" y="78" width="30" height="24" fill="#f7f7f7" stroke="#aaa" stroke-width="1.2" rx="4"/>
    <text x="175" y="95" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold">1</text>
    <text x="205" y="95" text-anchor="middle" font-size="12" fill="#999">0</text>
    <text x="235" y="95" text-anchor="middle" font-size="12" fill="#999">0</text>
    <text x="265" y="95" text-anchor="middle" font-size="12" fill="#999">0</text>
    <text x="295" y="95" text-anchor="middle" font-size="12" fill="#999">0</text>
    <text x="325" y="95" text-anchor="middle" font-size="12" fill="#999">0</text>
    <text x="355" y="95" text-anchor="middle" font-size="12" fill="#999">0</text>
    <text x="385" y="95" text-anchor="middle" font-size="12" fill="#999">0</text>
    <text x="175" y="114" text-anchor="middle" font-size="8" fill="#8a6d1f">位7</text>
    <text x="205" y="114" text-anchor="middle" font-size="8" fill="#999">位6</text>
    <text x="235" y="114" text-anchor="middle" font-size="8" fill="#999">位5</text>
    <text x="265" y="114" text-anchor="middle" font-size="8" fill="#999">位4</text>
    <text x="295" y="114" text-anchor="middle" font-size="8" fill="#999">位3</text>
    <text x="325" y="114" text-anchor="middle" font-size="8" fill="#999">位2</text>
    <text x="355" y="114" text-anchor="middle" font-size="8" fill="#999">位1</text>
    <text x="385" y="114" text-anchor="middle" font-size="8" fill="#999">位0</text>
  </g>
  <text x="430" y="88" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">值 7 → b = 1&lt;&lt;7</text>
  <text x="430" y="102" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">（第 7 位置 1）</text>

  <!-- ============ Panel 2: 状态环 ============ -->
  <text x="40" y="144" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 每遇到一次 v：(ones 第 v 位, twos 第 v 位) 沿状态环走一步</text>

  <!-- 状态 A -->
  <g filter="url(#rough2)">
    <rect x="150" y="152" width="190" height="40" fill="#f7f7f7" stroke="#aaa" stroke-width="1.5" rx="8"/>
    <text x="245" y="168" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">(0,0)</text>
    <text x="245" y="183" text-anchor="middle" font-size="9.5" fill="#888">未出现 · 或满 3 归零</text>
  </g>

  <path d="M 245 192 L 245 218" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="254" y="209" font-size="9.5" fill="#666" filter="url(#rough2)">+v · 第 1 次出现</text>

  <!-- 状态 B -->
  <g filter="url(#rough2)">
    <rect x="150" y="220" width="190" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="245" y="237" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">(1,0) · ones 含 v</text>
    <text x="245" y="253" text-anchor="middle" font-size="9.5" fill="#446688">恰好出现 1 次</text>
  </g>
  <path d="M 150 241 L 114 241" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="110" y="238" text-anchor="end" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">answer[0]</text>
  <text x="110" y="251" text-anchor="end" font-size="8" fill="#446688" filter="url(#rough2)">恰好一次之和</text>

  <path d="M 245 262 L 245 288" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="254" y="279" font-size="9.5" fill="#666" filter="url(#rough2)">+v · 第 2 次出现</text>

  <!-- 状态 C -->
  <g filter="url(#rough2)">
    <rect x="150" y="290" width="190" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="245" y="307" text-anchor="middle" font-size="12" fill="#2a5a2a" font-weight="bold">(0,1) · twos 含 v</text>
    <text x="245" y="323" text-anchor="middle" font-size="9.5" fill="#2a5a2a">恰好出现 2 次</text>
  </g>
  <path d="M 150 311 L 114 311" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="110" y="308" text-anchor="end" font-size="10" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">answer[1]</text>
  <text x="110" y="321" text-anchor="end" font-size="8" fill="#2a5a2a" filter="url(#rough2)">恰好两次之和</text>

  <!-- 满 3 回环 -->
  <path d="M 340 311 L 445 311 L 445 172 L 344 172" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="452" y="238" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">第 3 次出现</text>
  <text x="452" y="252" font-size="9.5" fill="#b85450" filter="url(#rough2)">threes 命中</text>
  <text x="452" y="266" font-size="9.5" fill="#b85450" filter="url(#rough2)">双双清零</text>

  <text x="245" y="352" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">⚠️ 出现 4 次会绕回 (1,0)——「每个元素至多出现 3 次」正是这套电路的前提</text>

  <!-- ============ 结果框 ============ -->
  <g filter="url(#rough2)">
    <rect x="60" y="362" width="400" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="260" y="382" text-anchor="middle" font-size="10" fill="#2a5a2a" font-weight="bold">终态：ones = {3} → answer[0] = 3；twos = {7} → answer[1] = 7 → 返回 [3, 7]</text>
  </g>
</svg>
