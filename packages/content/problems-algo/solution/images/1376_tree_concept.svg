<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：通知并行下传，总时间 = 最长根→叶路径的 informTime 之和</text>
  <text x="320" y="46" text-anchor="middle" font-size="11" fill="#888">父节点在 informTime[u] 内同时通知所有直属下属；瓶颈在最深的那条链（红）</text>

  <!-- ====== Tree edges (drawn first) ====== -->
  <!-- 0 -> 1 -->
  <path d="M 300 108 L 196 182" stroke="#888" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <!-- 0 -> 2 (red, longest branch) -->
  <path d="M 340 108 L 444 182" stroke="#b85450" stroke-width="2.8" fill="none" filter="url(#rough2)"/>
  <!-- 1 -> 3 -->
  <path d="M 164 208 L 124 278" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <!-- 1 -> 4 -->
  <path d="M 196 208 L 228 278" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <!-- 2 -> 5 (red) -->
  <path d="M 440 208 L 388 278" stroke="#b85450" stroke-width="2.6" fill="none" filter="url(#rough2)"/>
  <!-- 2 -> 6 (red) -->
  <path d="M 460 208 L 460 278" stroke="#b85450" stroke-width="2.6" fill="none" filter="url(#rough2)"/>
  <!-- 2 -> 7 (red) -->
  <path d="M 480 208 L 532 278" stroke="#b85450" stroke-width="2.6" fill="none" filter="url(#rough2)"/>

  <!-- ====== Nodes ====== -->
  <!-- root 0 -->
  <ellipse cx="320" cy="95" rx="26" ry="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="320" y="91" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="320" y="107" text-anchor="middle" font-size="9" fill="#5a8a5a">t=3</text>
  <text x="320" y="76" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">headID</text>

  <!-- node 1 -->
  <ellipse cx="180" cy="195" rx="24" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="191" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">1</text>
  <text x="180" y="206" text-anchor="middle" font-size="9" fill="#5577aa">t=2</text>

  <!-- node 2 (red, bottleneck) -->
  <ellipse cx="460" cy="195" rx="24" ry="22" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="460" y="191" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">2</text>
  <text x="460" y="206" text-anchor="middle" font-size="9" fill="#a85a56">t=4</text>

  <!-- leaves (informTime=0) -->
  <ellipse cx="120" cy="295" rx="18" ry="16" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="120" y="300" text-anchor="middle" font-size="12" fill="#888">3</text>

  <ellipse cx="240" cy="295" rx="18" ry="16" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="240" y="300" text-anchor="middle" font-size="12" fill="#888">4</text>

  <ellipse cx="380" cy="295" rx="18" ry="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="300" text-anchor="middle" font-size="12" fill="#b85450">5</text>

  <ellipse cx="460" cy="295" rx="18" ry="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="460" y="300" text-anchor="middle" font-size="12" fill="#b85450">6</text>

  <ellipse cx="540" cy="295" rx="18" ry="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="540" y="300" text-anchor="middle" font-size="12" fill="#b85450">7</text>

  <!-- path-sum annotations under leaves -->
  <text x="120" y="328" text-anchor="middle" font-size="10" fill="#888">3+2 = 5</text>
  <text x="240" y="328" text-anchor="middle" font-size="10" fill="#888">3+2 = 5</text>
  <text x="460" y="328" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3+4 = 7 ← 最长</text>

  <!-- ====== formula box ====== -->
  <rect x="40" y="350" width="560" height="70" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="374" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">总时间 = max { Σ informTime[u] : u ∈ root→leaf 路径 }</text>
  <text x="320" y="394" text-anchor="middle" font-size="11" fill="#666">DFS(u) = informTime[u] + max{ DFS(v) : v ∈ children(u) }（叶子 max 为 0）</text>
  <text x="320" y="411" text-anchor="middle" font-size="11" fill="#666">答案 = DFS(headID)；本例 = 3 + max(2, 4) = 7</text>
</svg>
