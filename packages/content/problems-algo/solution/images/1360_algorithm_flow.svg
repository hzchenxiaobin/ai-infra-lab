<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrC" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="480" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：日期 → 序号 → 做差</text>

  <rect x="170" y="44" width="180" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="65" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">输入 date1, date2 (字符串)</text>
  <path d="M260,76 L260,96" stroke="#446688" stroke-width="1.5" marker-end="url(#arrC)" fill="none" filter="url(#rough2)"/>

  <rect x="160" y="98" width="200" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="119" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">解析 YYYY-MM-DD → Y,M,D</text>
  <path d="M260,130 L260,150" stroke="#446688" stroke-width="1.5" marker-end="url(#arrC)" fill="none" filter="url(#rough2)"/>

  <text x="120" y="168" font-size="11" fill="#888" filter="url(#rough2)">对每个 date 重复 ↓</text>

  <rect x="40" y="176" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="197" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">① 完整年天数</text>
  <text x="140" y="222" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">(Y−1971)×365 + leap(Y−1)−leap(1970)</text>

  <rect x="280" y="176" width="200" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="197" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">② 当年第几天</text>
  <text x="380" y="222" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">prefix[M−1] + D − 1</text>

  <path d="M140,228 L200,248" stroke="#446688" stroke-width="1.5" marker-end="url(#arrC)" fill="none" filter="url(#rough2)"/>
  <path d="M380,228 L320,248" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arrC)" fill="none" filter="url(#rough2)"/>

  <polygon points="260,248 340,278 260,308 180,278" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="276" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">闰年 ∧ M&gt;2 ?</text>
  <text x="260" y="292" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">+1 修正</text>

  <path d="M180,278 L120,278" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="148" y="270" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M340,278 L400,278" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="372" y="270" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="60" y="296" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="316" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">total += 1</text>

  <rect x="340" y="296" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="400" y="316" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">total 不变</text>

  <path d="M120,326 L200,346" stroke="#446688" stroke-width="1.5" marker-end="url(#arrC)" fill="none" filter="url(#rough2)"/>
  <path d="M400,326 L320,346" stroke="#446688" stroke-width="1.5" marker-end="url(#arrC)" fill="none" filter="url(#rough2)"/>

  <rect x="170" y="344" width="180" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="365" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">得到 elapsed(date)</text>
  <path d="M260,376 L260,396" stroke="#446688" stroke-width="1.5" marker-end="url(#arrC)" fill="none" filter="url(#rough2)"/>

  <rect x="130" y="398" width="260" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="419" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">返回 |elapsed(date1) − elapsed(date2)|</text>

  <path d="M260,430 L260,450" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>

  <rect x="190" y="452" width="140" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="467" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">输出天数差 ✓</text>
</svg>
