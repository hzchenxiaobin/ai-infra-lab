<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold">示例演算：按右端点排序后逐数对决策</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#888">原始 [[1,2],[7,8],[4,5]] → 排序后 [[1,2],[4,5],[7,8]]</text>

  <!-- bars: origin x=80, unit=40, values 0..10 -> x = 80 + value*40 -->
  <!-- Step 0: [1,2] select -->
  <text x="72" y="76" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold">①[1,2]</text>
  <rect x="120" y="60" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="140" y="79" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">选</text>
  <text x="200" y="79" font-size="11" fill="#555">首个直接选入链</text>
  <text x="476" y="79" text-anchor="end" font-size="11" fill="#d6a040" font-weight="bold">end=2, cnt=1</text>

  <!-- Step 1: [4,5] select -->
  <text x="72" y="112" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold">②[4,5]</text>
  <rect x="240" y="96" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="115" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">选</text>
  <text x="320" y="115" font-size="11" fill="#555">4 &gt; 2 ✓ 可跟随</text>
  <text x="476" y="115" text-anchor="end" font-size="11" fill="#d6a040" font-weight="bold">end=5, cnt=2</text>

  <!-- Step 2: [7,8] select -->
  <text x="72" y="148" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold">③[7,8]</text>
  <rect x="360" y="132" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="380" y="151" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">选</text>
  <text x="440" y="151" font-size="11" fill="#555">7 &gt; 5 ✓</text>
  <text x="476" y="167" text-anchor="end" font-size="11" fill="#d6a040" font-weight="bold">end=8, cnt=3</text>

  <!-- number line -->
  <line x1="80" y1="184" x2="488" y2="184" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 488 184 L 480 180 L 480 188 Z" fill="#888" filter="url(#rough2)"/>
  <g font-size="10.5" fill="#888" text-anchor="middle">
    <line x1="120" y1="180" x2="120" y2="190" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="120" y="204">1</text>
    <line x1="160" y1="180" x2="160" y2="190" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="160" y="204">2</text>
    <line x1="240" y1="180" x2="240" y2="190" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="240" y="204">4</text>
    <line x1="280" y1="180" x2="280" y2="190" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="280" y="204">5</text>
    <line x1="360" y1="180" x2="360" y2="190" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="360" y="204">7</text>
    <line x1="400" y1="180" x2="400" y2="190" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="400" y="204">8</text>
  </g>
  <text x="284" y="222" text-anchor="middle" font-size="10.5" fill="#888" font-style="italic">数对端点（链要求前对右端 &lt; 后对左端）</text>

  <!-- conclusion -->
  <rect x="40" y="240" width="440" height="78" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="262" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">链：[1,2] → [4,5] → [7,8]</text>
  <text x="260" y="282" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">最长链长 = 3 ✓</text>
  <text x="260" y="302" text-anchor="middle" font-size="10.5" fill="#888">关键：每个被选数对的左端严格大于上一个右端</text>
</svg>
