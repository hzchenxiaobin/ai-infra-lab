<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="410" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">二维树状数组：tree[i][j] 管辖一个 lowbit(i)×lowbit(j) 的矩形</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">matrix 1..4 × 1..4  (1-indexed)</text>

  <!-- 列标号 c=1..4 -->
  <text x="149" y="72" text-anchor="middle" font-size="10" fill="#999">c=1</text>
  <text x="187" y="72" text-anchor="middle" font-size="10" fill="#999">2</text>
  <text x="225" y="72" text-anchor="middle" font-size="10" fill="#999">3</text>
  <text x="263" y="72" text-anchor="middle" font-size="10" fill="#999">4</text>
  <!-- 行标号 r=1..4 -->
  <text x="122" y="103" text-anchor="end" font-size="10" fill="#999">r=1</text>
  <text x="122" y="141" text-anchor="end" font-size="10" fill="#999">2</text>
  <text x="122" y="179" text-anchor="end" font-size="10" fill="#999">3</text>
  <text x="122" y="217" text-anchor="end" font-size="10" fill="#999">4</text>

  <!-- 网格背景 -->
  <rect x="130" y="80" width="152" height="152" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 区域填充（半透明，位于网格线下层） -->
  <!-- tree[4][4]: 整张表 [1,4]×[1,4] 橙 -->
  <rect x="130" y="80" width="152" height="152" fill="#fff8e1" opacity="0.35" filter="url(#rough2)"/>
  <!-- tree[2][3]: [1,2]×[3,3] 绿 -->
  <rect x="206" y="80" width="38" height="76" fill="#e6f4ea" opacity="0.6" filter="url(#rough2)"/>
  <!-- tree[3][2]: [3,3]×[1,2] 蓝 -->
  <rect x="130" y="156" width="76" height="38" fill="#e8f0fe" opacity="0.7" filter="url(#rough2)"/>

  <!-- 网格线（竖） -->
  <path d="M168 80 V232 M206 80 V232 M244 80 V232" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>
  <!-- 网格线（横） -->
  <path d="M130 118 H282 M130 156 H282 M130 194 H282" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>

  <!-- 区域边框（上层，仅描边） -->
  <rect x="130" y="80" width="152" height="152" fill="none" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="206" y="80" width="38" height="76" fill="none" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="130" y="156" width="76" height="38" fill="none" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>

  <!-- 单元格数值 -->
  <text x="149" y="103" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <text x="187" y="103" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">2</text>
  <text x="225" y="103" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="263" y="103" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">4</text>
  <text x="149" y="141" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">5</text>
  <text x="187" y="141" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">6</text>
  <text x="225" y="141" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="263" y="141" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">8</text>
  <text x="149" y="179" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="187" y="179" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">10</text>
  <text x="225" y="179" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">11</text>
  <text x="263" y="179" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">12</text>
  <text x="149" y="217" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">13</text>
  <text x="187" y="217" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">14</text>
  <text x="225" y="217" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">15</text>
  <text x="263" y="217" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">16</text>

  <!-- 右侧图例 callout -->
  <rect x="312" y="84" width="250" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="324" y="104" font-size="11" fill="#d6a040" font-weight="bold">tree[4][4]</text>
  <text x="324" y="120" font-size="10" fill="#444">管辖 [1,4]×[1,4] · lowbit 4×4 · 和=136</text>

  <rect x="312" y="136" width="250" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="324" y="156" font-size="11" fill="#4a7a3a" font-weight="bold">tree[2][3]</text>
  <text x="324" y="172" font-size="10" fill="#444">管辖 [1,2]×[3,3] · lowbit 2×1 · 和=3+7=10</text>

  <rect x="312" y="188" width="250" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="324" y="208" font-size="11" fill="#446688" font-weight="bold">tree[3][2]</text>
  <text x="324" y="224" font-size="10" fill="#444">管辖 [3,3]×[1,2] · lowbit 1×2 · 和=9+10=19</text>

  <!-- 底部公式框 -->
  <rect x="30" y="252" width="540" height="142" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="300" y="276" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">核心：二维 BIT = 行方向 BIT × 列方向 BIT</text>
  <text x="300" y="300" text-anchor="middle" font-size="12" fill="#444">tree[i][j] = Σ matrix[i−lb(i)+1 .. i][j−lb(j)+1 .. j]</text>
  <text x="300" y="322" text-anchor="middle" font-size="12" fill="#444">query(i,j)：外层 x−=lb(x) 拆行，内层 y−=lb(y) 拆列</text>
  <text x="300" y="344" text-anchor="middle" font-size="12" fill="#444">add(i,j,Δ)：外层 x+=lb(x) 找祖先行，内层 y+=lb(y) 找祖先列</text>
  <text x="300" y="370" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">两重 lowbit 各 O(log)，合计 O(log m · log n)</text>
  <text x="300" y="386" text-anchor="middle" font-size="10" fill="#888">sumRegion 用四角容斥（同 304），但 Q(i,j) 改为在线 O(log²) 计算</text>
</svg>
