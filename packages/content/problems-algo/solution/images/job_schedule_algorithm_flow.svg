<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrF" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">算法流程：排序 → 逐工作 DP → 二分找 j → 取 max</text>

  <!-- Step 1 -->
  <rect x="150" y="44" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="65" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">① 按 endTime 升序排序</text>
  <path d="M 270 80 L 270 96" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Step 2: init -->
  <rect x="150" y="100" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="121" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">② dp[0] = 0，i = 1</text>
  <path d="M 270 136 L 270 152" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Step 3: loop check -->
  <polygon points="270,156 370,190 270,224 170,190" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="186" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">i ≤ n ?</text>

  <!-- No: exit -->
  <path d="M 370 190 L 430 190" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="384" y="184" font-size="9.5" fill="#666" font-weight="bold">否</text>
  <rect x="434" y="174" width="96" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="482" y="190" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">返回 dp[n]</text>
  <text x="482" y="202" text-anchor="middle" font-size="9" fill="#4a7a3a">最大报酬</text>

  <!-- Yes: continue -->
  <path d="M 270 224 L 270 240" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="284" y="236" font-size="9.5" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Step 4: binary search -->
  <rect x="120" y="244" width="300" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="261" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">③ 二分找 j：最大的 endTime[j] ≤ startTime[i]</text>
  <text x="270" y="276" text-anchor="middle" font-size="9.5" fill="#d6a040">在 endTime[1..i-1] 上二分</text>
  <path d="M 270 286 L 270 302" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Step 5: dp transition -->
  <rect x="80" y="306" width="380" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="270" y="324" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">④ dp[i] = max( dp[i-1], profit[i] + dp[j] )</text>
  <text x="270" y="340" text-anchor="middle" font-size="9.5" fill="#4a7a3a">不选 i（继承）  /  选 i（报酬 + j 的最优）</text>
  <text x="270" y="352" text-anchor="middle" font-size="9" fill="#888">j=0 时 dp[0]=0，表示前面无可用工作</text>
  <path d="M 270 358 L 270 374" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Step 6: i++ -->
  <rect x="180" y="378" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="399" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">⑤ i++，回到②</text>

  <!-- loop back arrow -->
  <path d="M 180 395 L 100 395 L 100 190 L 168 190" stroke="#666" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- bottom note -->
  <rect x="30" y="424" width="480" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="50" y="442" font-size="10" fill="#333">💡 dp[i] 始终非降（max 操作保证）→ 选 i 时只需查 dp[j]，</text>
  <text x="50" y="456" font-size="10" fill="#333">j 是「与 i 不冲突的最近工作」，排好序即可二分 O(log n)</text>
</svg>
