<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">核心观察：abbr 中字母逐字比对，数字表示跳过 word 中相应长度的子串</text>

  <!-- abbr row label -->
  <text x="50" y="100" font-size="12" fill="#888" font-weight="bold">abbr:</text>
  <text x="50" y="116" font-size="10" fill="#888">j→</text>

  <!-- abbr tokens: s, 10, n -->
  <rect x="64" y="84" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="82" y="108" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">s</text>
  <text x="82" y="74" text-anchor="middle" font-size="9" fill="#888">j=0</text>

  <!-- 10 : skip box covering word cells 1..10 -->
  <rect x="104" y="84" width="360" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="284" y="108" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">10</text>
  <text x="284" y="74" text-anchor="middle" font-size="9" fill="#d6a040">j=1~2  数字段</text>

  <rect x="468" y="84" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="486" y="108" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">n</text>
  <text x="486" y="74" text-anchor="middle" font-size="9" fill="#888">j=3</text>

  <!-- connector lines from abbr letters down to word letters -->
  <path d="M 82 122 L 82 168" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 486 122 L 486 168" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- word row label -->
  <text x="50" y="192" font-size="12" fill="#888" font-weight="bold">word:</text>
  <text x="50" y="208" font-size="10" fill="#888">i→</text>

  <!-- word cells: s u b s t i t u t i o n  (12 cells, 36 wide) -->
  <!-- cell 0: s (matched, blue) -->
  <rect x="64" y="172" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="82" y="196" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">s</text>
  <text x="82" y="220" text-anchor="middle" font-size="9" fill="#888">i=0</text>

  <!-- cells 1..10: skipped (orange tint) -->
  <rect x="104" y="172" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="122" y="196" text-anchor="middle" font-size="13" fill="#999">u</text>
  <rect x="140" y="172" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="158" y="196" text-anchor="middle" font-size="13" fill="#999">b</text>
  <rect x="176" y="172" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="194" y="196" text-anchor="middle" font-size="13" fill="#999">s</text>
  <rect x="212" y="172" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="230" y="196" text-anchor="middle" font-size="13" fill="#999">t</text>
  <rect x="248" y="172" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="266" y="196" text-anchor="middle" font-size="13" fill="#999">i</text>
  <rect x="284" y="172" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="302" y="196" text-anchor="middle" font-size="13" fill="#999">t</text>
  <rect x="320" y="172" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="338" y="196" text-anchor="middle" font-size="13" fill="#999">u</text>
  <rect x="356" y="172" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="374" y="196" text-anchor="middle" font-size="13" fill="#999">t</text>
  <rect x="392" y="172" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="410" y="196" text-anchor="middle" font-size="13" fill="#999">i</text>
  <rect x="428" y="172" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="446" y="196" text-anchor="middle" font-size="13" fill="#999">o</text>

  <!-- cell 11: n (matched, blue) -->
  <rect x="464" y="172" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="482" y="196" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">n</text>
  <text x="482" y="220" text-anchor="middle" font-size="9" fill="#888">i=11</text>

  <!-- i jump arrow: from i=0 to i=11 across the skipped region -->
  <path d="M 100 232 L 464 232" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="6,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="282" y="248" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">i += 10  （跳过被替换的 10 个字母）</text>

  <!-- legend / rules box -->
  <rect x="40" y="268" width="480" height="116" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="292" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">匹配规则</text>
  <text x="56" y="314" font-size="11" fill="#555">• abbr 为字母：必须与 word[i] 严格相等，否则不匹配；i++, j++</text>
  <text x="56" y="334" font-size="11" fill="#555">• abbr 为数字：解析出完整整数 k，i += k（跳过 word 中 k 个字母）；仅 j 前进</text>
  <text x="56" y="354" font-size="11" fill="#b85450" font-weight="bold">• 禁止前导零："0" 与 "01" 均非法（被替换子串非空，长度 ≥ 1）</text>
  <text x="56" y="374" font-size="11" fill="#555">• 末态校验：i 与 j 必须同时到达各自串尾，否则长度对不上</text>
</svg>
