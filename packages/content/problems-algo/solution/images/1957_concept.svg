<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：连续段独立分解，每段至多保留 2 个</text>

  <!-- Input label -->
  <text x="60" y="78" font-size="11" fill="#888">s =</text>

  <!-- 9 char cells: l e e e t c o d e -->
  <g font-size="13" fill="#333" text-anchor="middle">
    <!-- run1: l -->
    <rect x="120" y="64" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="137" y="84">l</text>
    <!-- run2: e e e (3rd e = deleted) -->
    <rect x="154" y="64" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="171" y="84">e</text>
    <rect x="188" y="64" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="205" y="84">e</text>
    <rect x="222" y="64" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="239" y="84" fill="#b85450">e</text>
    <!-- run3: t -->
    <rect x="256" y="64" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="273" y="84">t</text>
    <!-- run4: c -->
    <rect x="290" y="64" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="307" y="84">c</text>
    <!-- run5: o -->
    <rect x="324" y="64" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="341" y="84">o</text>
    <!-- run6: d -->
    <rect x="358" y="64" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="375" y="84">d</text>
    <!-- run7: e -->
    <rect x="392" y="64" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="409" y="84">e</text>
  </g>

  <!-- strikethrough on the deleted 3rd e -->
  <path d="M 224 70 L 254 88" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <!-- Run brackets + lengths -->
  <g stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)">
    <path d="M 120 102 L 120 96 L 154 96 L 154 102"/>
    <path d="M 154 102 L 154 96 L 256 96 L 256 102"/>
    <path d="M 256 102 L 256 96 L 290 96 L 290 102"/>
    <path d="M 290 102 L 290 96 L 324 96 L 324 102"/>
    <path d="M 324 102 L 324 96 L 358 96 L 358 102"/>
    <path d="M 358 102 L 358 96 L 392 96 L 392 102"/>
    <path d="M 392 102 L 392 96 L 426 96 L 426 102"/>
  </g>
  <g font-size="10.5" fill="#888" text-anchor="middle">
    <text x="137" y="116">L=1</text>
    <text x="205" y="116" fill="#d6a040" font-weight="bold">L=3</text>
    <text x="273" y="116">L=1</text>
    <text x="307" y="116">L=1</text>
    <text x="341" y="116">L=1</text>
    <text x="375" y="116">L=1</text>
    <text x="409" y="116">L=1</text>
  </g>

  <!-- Arrow down -->
  <path d="M 273 130 L 273 156" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="288" y="148" font-size="11" fill="#b85450" font-weight="bold">每段保留 min(L, 2) 个</text>

  <!-- Result row: leetcode (8 chars) -->
  <text x="60" y="188" font-size="11" fill="#888">结果 =</text>
  <g font-size="13" fill="#333" text-anchor="middle">
    <rect x="120" y="174" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="137" y="194">l</text>
    <rect x="154" y="174" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="171" y="194">e</text>
    <rect x="188" y="174" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="205" y="194">e</text>
    <rect x="222" y="174" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="239" y="194">t</text>
    <rect x="256" y="174" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="273" y="194">c</text>
    <rect x="290" y="174" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="307" y="194">o</text>
    <rect x="324" y="174" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="341" y="194">d</text>
    <rect x="358" y="174" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="375" y="194">e</text>
  </g>
  <text x="402" y="194" font-size="11" fill="#4a7a3a" font-weight="bold">= "leetcode"</text>

  <!-- Divider -->
  <path d="M 40 230 L 520 230" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Key insight: runs independent -->
  <text x="60" y="256" font-size="12" fill="#555" font-weight="bold">为什么能独立分解？</text>
  <text x="60" y="278" font-size="11" fill="#555">① 不同段由不同字符组成，跨段边界不可能凑出「三个连续相同」；</text>
  <text x="60" y="296" font-size="11" fill="#555">② 因此约束只在段内生效：长度 L 的段最多保留 2 个，删 max(0, L−2) 个；</text>
  <text x="60" y="314" font-size="11" fill="#555">③ 各段互不干扰 → 总删除数 = Σ max(0, Lᵢ − 2)，贪心逐段裁剪即最优。</text>

  <!-- Formula box -->
  <rect x="60" y="336" width="440" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="358" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">每段保留 min(L, 2) 个 ⟺ 局部规则：仅当结果末两位都 ≠ 当前字符时才追加</text>

  <!-- note -->
  <text x="60" y="400" font-size="10.5" fill="#888">同一段内字符完全相同，故「保留哪几个」不影响结果串 → 答案唯一。</text>
  <text x="60" y="418" font-size="10.5" fill="#888">本题即 80 题「保留至多 2 个重复」的字符串/无序连续段版本。</text>
</svg>
