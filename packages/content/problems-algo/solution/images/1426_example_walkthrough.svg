<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：arr = [1, 3, 2, 3, 5, 0]</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">先建集合 {0,1,2,3,5}，再逐位置查 x+1 是否在集合中</text>

  <!-- ===== Pass 1: build set ===== -->
  <text x="40" y="70" font-size="12" fill="#446688" font-weight="bold">第一趟：建集合 seen</text>

  <!-- table header -->
  <rect x="40" y="78" width="100" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="90" y="94" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">处理元素 x</text>
  <rect x="140" y="78" width="380" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="330" y="94" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">集合 seen（累积）</text>

  <!-- rows: x=1,3,2,3,5,0 -->
  <!-- row1 x=1 -->
  <rect x="40" y="104" width="100" height="22" rx="3" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="90" y="119" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="140" y="104" width="380" height="22" rx="3" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="160" y="119" font-size="11" fill="#4a7a3a">{ 1 }</text>

  <!-- row2 x=3 -->
  <rect x="40" y="126" width="100" height="22" rx="3" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="90" y="141" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="140" y="126" width="380" height="22" rx="3" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="160" y="141" font-size="11" fill="#4a7a3a">{ 1, 3 }</text>

  <!-- row3 x=2 -->
  <rect x="40" y="148" width="100" height="22" rx="3" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="90" y="163" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="140" y="148" width="380" height="22" rx="3" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="160" y="163" font-size="11" fill="#4a7a3a">{ 1, 2, 3 }</text>

  <!-- row4 x=3 (dup) -->
  <rect x="40" y="170" width="100" height="22" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="90" y="185" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="140" y="170" width="380" height="22" rx="3" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="160" y="185" font-size="11" fill="#4a7a3a">{ 1, 2, 3 }</text>
  <text x="300" y="185" font-size="10" fill="#d6a040">← 重复，不变</text>

  <!-- row5 x=5 -->
  <rect x="40" y="192" width="100" height="22" rx="3" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="90" y="207" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="140" y="192" width="380" height="22" rx="3" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="160" y="207" font-size="11" fill="#4a7a3a">{ 1, 2, 3, 5 }</text>

  <!-- row6 x=0 -->
  <rect x="40" y="214" width="100" height="22" rx="3" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="90" y="229" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="140" y="214" width="380" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="160" y="229" font-size="11" fill="#4a7a3a" font-weight="bold">{ 0, 1, 2, 3, 5 }  ★ 建表完成</text>

  <!-- arrow down to pass 2 -->
  <path d="M 280 238 L 280 256" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== Pass 2: count ===== -->
  <text x="40" y="278" font-size="12" fill="#b85450" font-weight="bold">第二趟：遍历原 arr，查 x+1 ∈ seen？</text>

  <!-- table header -->
  <rect x="40" y="286" width="50" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="65" y="302" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">x</text>
  <rect x="90" y="286" width="60" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="120" y="302" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">x+1</text>
  <rect x="150" y="286" width="150" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="225" y="302" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">在 seen 中?</text>
  <rect x="300" y="286" width="100" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="350" y="302" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">计入?</text>
  <rect x="400" y="286" width="60" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="430" y="302" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">ans</text>

  <!-- rows: 1,3,2,3,5,0 -->
  <!-- x=1 -> 2 in seen yes -->
  <rect x="40" y="310" width="50" height="20" rx="3" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="324" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <rect x="90" y="310" width="60" height="20" rx="3" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="120" y="324" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <rect x="150" y="310" width="150" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="225" y="324" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="300" y="310" width="100" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="350" y="324" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="400" y="310" width="60" height="20" rx="3" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="430" y="324" text-anchor="middle" font-size="10.5" fill="#333">1</text>

  <!-- x=3 -> 4 no -->
  <rect x="40" y="330" width="50" height="20" rx="3" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="344" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <rect x="90" y="330" width="60" height="20" rx="3" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="120" y="344" text-anchor="middle" font-size="10.5" fill="#333">4</text>
  <rect x="150" y="330" width="150" height="20" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="225" y="344" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">✗</text>
  <rect x="300" y="330" width="100" height="20" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="350" y="344" text-anchor="middle" font-size="10.5" fill="#b85450">—</text>
  <rect x="400" y="330" width="60" height="20" rx="3" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="430" y="344" text-anchor="middle" font-size="10.5" fill="#333">1</text>

  <!-- x=2 -> 3 yes -->
  <rect x="40" y="350" width="50" height="20" rx="3" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="364" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <rect x="90" y="350" width="60" height="20" rx="3" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="120" y="364" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <rect x="150" y="350" width="150" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="225" y="364" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="300" y="350" width="100" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="350" y="364" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="400" y="350" width="60" height="20" rx="3" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="430" y="364" text-anchor="middle" font-size="10.5" fill="#333">2</text>

  <!-- x=3 -> 4 no -->
  <rect x="40" y="370" width="50" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="65" y="384" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <rect x="90" y="370" width="60" height="20" rx="3" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="120" y="384" text-anchor="middle" font-size="10.5" fill="#333">4</text>
  <rect x="150" y="370" width="150" height="20" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="225" y="384" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">✗</text>
  <rect x="300" y="370" width="100" height="20" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="350" y="384" text-anchor="middle" font-size="10.5" fill="#b85450">—</text>
  <rect x="400" y="370" width="60" height="20" rx="3" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="430" y="384" text-anchor="middle" font-size="10.5" fill="#333">2</text>

  <!-- x=5 -> 6 no  & x=0 -> 1 yes  (compressed into note) -->
  <rect x="40" y="390" width="50" height="20" rx="3" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="404" text-anchor="middle" font-size="10.5" fill="#333">5</text>
  <rect x="90" y="390" width="60" height="20" rx="3" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="120" y="404" text-anchor="middle" font-size="10.5" fill="#333">6</text>
  <rect x="150" y="390" width="150" height="20" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="225" y="404" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">✗</text>
  <rect x="300" y="390" width="100" height="20" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="350" y="404" text-anchor="middle" font-size="10.5" fill="#b85450">—</text>
  <rect x="400" y="390" width="60" height="20" rx="3" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="430" y="404" text-anchor="middle" font-size="10.5" fill="#333">2</text>

  <!-- final result note (x=0 row inline) -->
  <rect x="465" y="390" width="80" height="20" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="505" y="404" text-anchor="middle" font-size="10" fill="#555">x=0→1 ✓ ans=3</text>
</svg>
