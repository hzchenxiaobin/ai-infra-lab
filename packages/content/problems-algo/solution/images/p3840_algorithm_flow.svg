<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="280" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：滚动两变量的三分支线性 DP</text>

  <!-- 开始 -->
  <rect x="185" y="38" width="190" height="30" rx="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="57" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2a5a20" filter="url(#rough2)">开始：p2 = 0，p1 = 0，i = 0</text>

  <path d="M 280 68 L 280 86" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 1：i < n ? -->
  <polygon points="210,116 280,86 350,116 280,146" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="121" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a4a68" filter="url(#rough2)">i &lt; n ?</text>
  <path d="M 350 116 L 424 116" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="378" y="108" font-size="11" fill="#888" filter="url(#rough2)">否</text>
  <rect x="428" y="100" width="122" height="32" rx="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="489" y="120" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2a5a20" filter="url(#rough2)">返回 p1（答案）</text>
  <text x="290" y="164" font-size="11" fill="#888" filter="url(#rough2)">是</text>

  <!-- 分支 ①② -->
  <rect x="168" y="172" width="224" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="193" text-anchor="middle" font-size="12.5" fill="#2a4a68" filter="url(#rough2)">cur = max(p1, nums[i] + p2)</text>
  <path d="M 280 146 L 280 170" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 206 L 280 232" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 2：异色？ -->
  <polygon points="150,268 280,236 410,268 280,300" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="260" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">i &gt; 0 且</text>
  <text x="280" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">colors[i] ≠ colors[i−1] ?</text>
  <path d="M 410 268 L 444 268" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="418" y="260" font-size="11" fill="#888" filter="url(#rough2)">是</text>
  <rect x="448" y="250" width="102" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="499" y="265" text-anchor="middle" font-size="11" font-weight="bold" fill="#a03028" filter="url(#rough2)">cur = max(cur,</text>
  <text x="499" y="279" text-anchor="middle" font-size="11" font-weight="bold" fill="#a03028" filter="url(#rough2)">nums[i] + p1)</text>
  <path d="M 499 286 L 499 318 L 294 318" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="262" y="322" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">否</text>

  <!-- 滚动前进 -->
  <path d="M 280 300 L 280 328" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150" y="330" width="260" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="351" text-anchor="middle" font-size="12.5" fill="#2a4a68" filter="url(#rough2)">p2 ← p1；p1 ← cur；i ← i + 1</text>

  <!-- 循环回边 -->
  <path d="M 150 347 L 78 347 L 78 116 L 202 116" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="70" y="240" font-size="11" fill="#888" transform="rotate(-90 70 240)" text-anchor="middle" filter="url(#rough2)">下一间房</text>

  <!-- 底部提示 -->
  <rect x="100" y="372" width="360" height="24" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="388" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">总和上界 10⁵ × 10⁵ = 10¹⁰ ⇒ C++ 记得用 long long</text>
</svg>
