<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">连通网络操作次数 — 算法流程</text>

  <!-- input -->
  <rect x="170" y="44" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="62" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">输入：n 台计算机，m 条线缆</text>
  <text x="270" y="77" text-anchor="middle" font-size="10.5" fill="#666">connections = [[u,v], ...]</text>
  <line x1="270" y1="84" x2="270" y2="104" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision: m < n-1 ? -->
  <path d="M 270 104 L 390 146 L 270 188 L 150 146 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="142" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">m &lt; n−1 ?</text>
  <text x="270" y="158" text-anchor="middle" font-size="10" fill="#888">线缆不足连通 n 节点</text>

  <!-- yes: return -1 -->
  <text x="405" y="142" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <line x1="390" y1="146" x2="436" y2="146" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="436" y="128" width="92" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="482" y="145" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 -1</text>
  <text x="482" y="159" text-anchor="middle" font-size="10" fill="#888">不可能连通</text>

  <!-- no: init union-find -->
  <text x="120" y="142" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <line x1="150" y1="146" x2="110" y2="146" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="14" y="128" width="96" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="62" y="145" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">初始化</text>
  <text x="62" y="159" text-anchor="middle" font-size="10" fill="#666">count = n</text>

  <line x1="62" y1="166" x2="62" y2="194" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 62 194 Q 62 210 170 210" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop -->
  <rect x="150" y="198" width="240" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="219" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">遍历每条边 (u, v) ∈ connections</text>
  <line x1="270" y1="232" x2="270" y2="252" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- find -->
  <rect x="140" y="252" width="260" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="270" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">ru = find(u), rv = find(v)</text>
  <text x="270" y="284" text-anchor="middle" font-size="10" fill="#666">带路径压缩找根</text>
  <line x1="270" y1="290" x2="270" y2="308" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision: ru == rv ? -->
  <path d="M 270 308 L 370 348 L 270 388 L 170 348 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="344" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">ru == rv ?</text>
  <text x="270" y="360" text-anchor="middle" font-size="10" fill="#888">已同根</text>

  <!-- yes: skip (redundant) -->
  <text x="385" y="344" font-size="11" fill="#d6a040" font-weight="bold">是</text>
  <line x1="370" y1="348" x2="420" y2="348" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="420" y="330" width="104" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="472" y="347" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">跳过</text>
  <text x="472" y="361" text-anchor="middle" font-size="10" fill="#888">冗余线缆</text>
  <!-- back to loop from skip -->
  <path d="M 472 330 Q 472 216 390 216" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- no: union, count-- -->
  <text x="120" y="344" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <line x1="170" y1="348" x2="120" y2="348" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="14" y="330" width="106" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="67" y="347" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">union(u,v)</text>
  <text x="67" y="361" text-anchor="middle" font-size="10" fill="#666">count−−</text>
  <!-- back to loop from union -->
  <path d="M 67 330 Q 67 216 150 216" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- end: return count - 1 -->
  <rect x="150" y="404" width="240" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="424" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">返回 count − 1（= 连通分量数 k − 1）</text>
</svg>
