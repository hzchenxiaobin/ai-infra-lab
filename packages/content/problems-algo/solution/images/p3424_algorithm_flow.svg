<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：两条路线各算一遍，取较省者</text>

  <!-- 开始 -->
  <ellipse cx="260" cy="50" rx="84" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="55" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">输入 arr, brr, k</text>

  <!-- 分叉箭头 -->
  <path d="M 202 57 L 140 88" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 318 57 L 380 88" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 路线一 -->
  <rect x="30" y="92" width="212" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="136" y="110" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">路线一：不重排（原位对齐）</text>
  <text x="136" y="128" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">A = Σ|arr[i]−brr[i]|</text>

  <!-- 路线二 -->
  <rect x="278" y="92" width="212" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="384" y="110" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">路线二：花 k 任意重排</text>
  <text x="384" y="128" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">C = Σ|a↑[i]−b↑[i]|，B = k + C</text>

  <!-- 汇合箭头 -->
  <path d="M 136 138 L 218 172" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 384 138 L 302 172" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- min 汇聚盒 -->
  <rect x="160" y="176" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="200" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 min(A, k + C)</text>

  <!-- 示例演算 -->
  <rect x="30" y="232" width="460" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="252" text-anchor="middle" font-size="9.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">示例 1（k=2）：A = 14+11+10 = 35</text>
  <text x="260" y="271" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">排序后 C = 2+7+2 = 11 → B = 2+11 = 13 → 答案 min(35, 13) = 13</text>

  <!-- 提示卡 -->
  <rect x="30" y="296" width="222" height="48" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="141" y="316" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">时间 O(n log n)：排序主导</text>
  <text x="141" y="334" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">空间 O(n)：两份排序拷贝</text>

  <rect x="268" y="296" width="222" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="379" y="316" text-anchor="middle" font-size="9.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">⚠ k ≤ 2×10¹⁰，总代价 ≤ 4×10¹⁰</text>
  <text x="379" y="334" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">C++ 累加器 / 返回值用 long long</text>

  <text x="260" y="358" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">两条路线独立计算，一遍扫描各自出结果，无需互相嵌套</text>
</svg>
