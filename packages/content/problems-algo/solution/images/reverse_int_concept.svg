<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">整数反转：逐位「弹出」与「压入」机制（以 x = 123 为例）</text>

  <!-- ===== Snapshot 1: x=123, pop 3, rev=3 ===== -->
  <text x="40" y="62" font-size="12" fill="#446688" font-weight="bold">第 1 步</text>
  <text x="120" y="62" font-size="11" fill="#888">弹出末位 d = 3，砍掉后 x = 12</text>

  <!-- x row: 1 2 [3] -->
  <rect x="120" y="72" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="137" y="94" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="156" y="72" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="173" y="94" text-anchor="middle" font-size="14" fill="#333">2</text>
  <rect x="192" y="72" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="209" y="94" text-anchor="middle" font-size="14" fill="#333">3</text>
  <text x="236" y="92" font-size="11" fill="#d6a040">← 弹出</text>

  <!-- arrow: d moves down to rev -->
  <path d="M 209 110 L 209 142" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="220" y="130" font-size="11" fill="#d6a040">d = 3</text>

  <!-- rev row: [3] -->
  <rect x="192" y="146" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="209" y="168" text-anchor="middle" font-size="14" fill="#333">3</text>
  <text x="236" y="166" font-size="11" fill="#4a7a3a">压入</text>
  <text x="290" y="168" font-size="11" fill="#666">rev = 0×10 + 3 = 3</text>

  <!-- divider -->
  <path d="M 40 196 L 520 196" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Snapshot 2: x=12, pop 2, rev=32 ===== -->
  <text x="40" y="218" font-size="12" fill="#446688" font-weight="bold">第 2 步</text>
  <text x="120" y="218" font-size="11" fill="#888">弹出末位 d = 2，砍掉后 x = 1</text>

  <rect x="120" y="228" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="137" y="250" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="156" y="228" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="173" y="250" text-anchor="middle" font-size="14" fill="#333">2</text>
  <text x="200" y="248" font-size="11" fill="#d6a040">← 弹出</text>

  <path d="M 173 266 L 173 298" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="184" y="286" font-size="11" fill="#d6a040">d = 2</text>

  <rect x="156" y="302" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="173" y="324" text-anchor="middle" font-size="14" fill="#888">3</text>
  <rect x="192" y="302" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="209" y="324" text-anchor="middle" font-size="14" fill="#333">2</text>
  <text x="236" y="322" font-size="11" fill="#4a7a3a">压入</text>
  <text x="290" y="324" font-size="11" fill="#666">rev = 3×10 + 2 = 32</text>

  <path d="M 40 352 L 520 352" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Snapshot 3: x=1, pop 1, rev=321 ===== -->
  <text x="40" y="374" font-size="12" fill="#446688" font-weight="bold">第 3 步</text>
  <text x="120" y="374" font-size="11" fill="#888">弹出末位 d = 1，x 归 0，循环结束 → rev = 321</text>

  <rect x="120" y="384" width="34" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="173" y="394" font-size="11" fill="#d6a040">已空</text>

  <rect x="156" y="384" width="34" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="173" y="394" text-anchor="middle" font-size="11" fill="#888">3</text>
  <rect x="192" y="384" width="34" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="209" y="394" text-anchor="middle" font-size="11" fill="#888">2</text>
  <rect x="228" y="384" width="34" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="245" y="394" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="276" y="394" font-size="11" fill="#666">→ rev = 32×10 + 1 = 321 ✓</text>
</svg>
