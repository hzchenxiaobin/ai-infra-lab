<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14.5" fill="#555" font-weight="bold">核心观察：公共值是「切换点」，段内只能走一条轨道</text>

  <!-- nums1 label -->
  <text x="40" y="74" font-size="12.5" fill="#446688" font-weight="bold">nums1</text>
  <!-- nums2 label -->
  <text x="40" y="214" font-size="12.5" fill="#446688" font-weight="bold">nums2</text>

  <!-- ===== Segment A: before value 4 ===== -->
  <!-- bracket for seg A nums1 -->
  <rect x="78" y="52" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="73" text-anchor="middle" font-size="13" fill="#333">2</text>

  <!-- ===== Junction value 4 (nums1) ===== -->
  <rect x="138" y="52" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="73" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>

  <!-- ===== Segment B: between 4 and 8 ===== -->
  <rect x="198" y="52" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="73" text-anchor="middle" font-size="13" fill="#333">5</text>

  <!-- ===== Junction value 8 (nums1) ===== -->
  <rect x="258" y="52" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="73" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>

  <!-- ===== Segment C: after 8 ===== -->
  <rect x="318" y="52" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="73" text-anchor="middle" font-size="13" fill="#333">10</text>

  <!-- nums2 cells: 4,6,8,9 aligned under matching x -->
  <!-- empty cell before 4 -->
  <rect x="78" y="192" width="44" height="32" fill="none" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3" rx="4" filter="url(#rough2)"/>
  <text x="100" y="213" text-anchor="middle" font-size="11" fill="#bbb">∅</text>

  <!-- Junction value 4 (nums2) -->
  <rect x="138" y="192" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="213" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>

  <!-- Segment B nums2: 6 -->
  <rect x="198" y="192" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="213" text-anchor="middle" font-size="13" fill="#333">6</text>

  <!-- Junction value 8 (nums2) -->
  <rect x="258" y="192" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="213" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>

  <!-- Segment C nums2: 9 -->
  <rect x="318" y="192" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="213" text-anchor="middle" font-size="13" fill="#333">9</text>

  <!-- Vertical dashed lines at junctions connecting the two tracks -->
  <path d="M 160 84 L 160 192" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5,4" fill="none" filter="url(#rough2)"/>
  <path d="M 280 84 L 280 192" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5,4" fill="none" filter="url(#rough2)"/>

  <!-- switch arrows at junctions -->
  <text x="172" y="140" font-size="10.5" fill="#d6a040" font-weight="bold">可切换</text>
  <text x="292" y="140" font-size="10.5" fill="#d6a040" font-weight="bold">可切换</text>

  <!-- Segment labels with sums -->
  <!-- Seg A -->
  <rect x="74" y="106" width="52" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="100" y="121" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">段 A</text>
  <text x="100" y="136" text-anchor="middle" font-size="9.5" fill="#555">max(2,0)=2</text>

  <!-- Seg B -->
  <rect x="194" y="106" width="52" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="220" y="121" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">段 B</text>
  <text x="220" y="136" text-anchor="middle" font-size="9.5" fill="#555">max(5,6)=6</text>

  <!-- Seg C -->
  <rect x="314" y="106" width="52" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="340" y="121" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">段 C</text>
  <text x="340" y="136" text-anchor="middle" font-size="9.5" fill="#555">max(10,9)=10</text>

  <!-- Legend -->
  <rect x="400" y="52" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="420" y="64" font-size="10.5" fill="#555">公共值=切换点</text>

  <rect x="400" y="74" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="420" y="86" font-size="10.5" fill="#555">段内元素</text>

  <rect x="400" y="96" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="420" y="108" font-size="10.5" fill="#555">取较大段和</text>

  <!-- Bottom explanation -->
  <rect x="50" y="248" width="460" height="110" fill="#fff" stroke="#ddd" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="64" y="270" font-size="11.5" fill="#333" font-weight="bold">关键直觉：</text>
  <text x="64" y="290" font-size="11" fill="#555">• 公共值（4、8）把两条轨道切成若干「段」，段与段之间只能在公共值处切换</text>
  <text x="64" y="308" font-size="11" fill="#555">• 一段内部无法切换 → 该段得分只能是「nums1 段和」或「nums2 段和」二选一</text>
  <text x="64" y="326" font-size="11" fill="#555">• 贪心：每段取较大者 max(sum1, sum2)，再叠加公共值（只算一次）</text>
  <text x="64" y="346" font-size="11" fill="#b85450" font-weight="bold">总分 = Σ max(段1和, 段2和) + Σ 公共值</text>
</svg>
