<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：逐根钢筋滚动更新 dp</text>

  <!-- 1. 初始化 -->
  <rect x="190" y="44" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">dp = {0: 0}（空支架，diff=0）</text>
  <path d="M 280 78 L 280 96" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. for 每根钢筋 -->
  <rect x="175" y="98" width="210" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="120" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">for r in rods：</text>
  <path d="M 280 132 L 280 150" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. 复制快照 -->
  <rect x="175" y="152" width="210" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="174" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">cur = dp（快照副本）</text>
  <path d="M 280 186 L 280 204" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4. 遍历旧状态 -->
  <rect x="155" y="206" width="250" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="228" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">for (diff, taller) in cur：</text>
  <path d="M 280 240 L 280 258" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 5. 三个分支 -->
  <!-- 不用 -->
  <path d="M 280 258 L 120 280" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="268" font-size="10" fill="#d6a040">不用</text>
  <rect x="40" y="280" width="120" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="100" y="300" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">保留原 dp[diff]</text>
  <text x="100" y="316" text-anchor="middle" font-size="10" fill="#888">（已由快照覆盖）</text>

  <!-- 放高侧 -->
  <path d="M 280 258 L 280 280" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="272" font-size="10" fill="#446688">放高侧</text>
  <rect x="210" y="280" width="140" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="280" y="300" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">dp[diff+r] =</text>
  <text x="280" y="316" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">max(…, taller+r)</text>

  <!-- 放低侧 -->
  <path d="M 280 258 L 440 280" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="268" font-size="10" fill="#4a7a3a">放低侧</text>
  <rect x="380" y="280" width="140" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="450" y="300" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">分 r≤diff / r&gt;diff</text>
  <text x="450" y="316" text-anchor="middle" font-size="10" fill="#4a7a3a">更新对应新 diff</text>

  <!-- 汇合 -->
  <path d="M 100 324 L 100 344 L 450 344 L 450 324" stroke="#666" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 280 324 L 280 344" stroke="#666" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 280 344 L 280 362" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 内层循环结束 -->
  <polygon points="280,364 360,394 280,424 200,394" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="398" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">cur 遍历完?</text>
  <path d="M 200 394 L 160 394 L 160 228 L 155 228" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="312" font-size="10" fill="#b85450">否，取下个状态</text>

  <path d="M 280 424 L 280 442" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="436" font-size="10" fill="#888">rods 遍历完</text>

  <!-- 返回 -->
  <rect x="200" y="444" width="160" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="464" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">return dp[0]</text>
</svg>
