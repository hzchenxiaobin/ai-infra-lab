<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="540" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 演算：scores=[5,2,9,8,4]，最优序列 [0,1,2,3] = 24</text>

  <!-- ===== Left: graph ===== -->
  <rect x="20" y="44" width="280" height="240" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="160" y="64" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">原图（节点标号:分数）</text>

  <!-- node 0 (score 5) -->
  <ellipse cx="70" cy="120" rx="24" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="70" y="118" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <text x="70" y="134" text-anchor="middle" font-size="9" fill="#888">5</text>

  <!-- node 1 (score 2) -->
  <ellipse cx="160" cy="100" rx="24" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="160" y="98" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="160" y="114" text-anchor="middle" font-size="9" fill="#888">2</text>

  <!-- node 2 (score 9) -->
  <ellipse cx="250" cy="120" rx="24" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="250" y="118" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="250" y="134" text-anchor="middle" font-size="9" fill="#888">9</text>

  <!-- node 3 (score 8) -->
  <ellipse cx="200" cy="200" rx="24" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="200" y="198" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="200" y="214" text-anchor="middle" font-size="9" fill="#888">8</text>

  <!-- node 4 (score 4) -->
  <ellipse cx="110" cy="240" rx="24" ry="22" fill="#fafafa" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="238" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <text x="110" y="254" text-anchor="middle" font-size="9" fill="#888">4</text>

  <!-- edges (highlight best path 0-1-2-3 in red) -->
  <path d="M 92 116 L 136 104" stroke="#b85450" stroke-width="3" fill="none" filter="url(#rough2)"/>
  <path d="M 184 104 L 226 116" stroke="#b85450" stroke-width="3" fill="none" filter="url(#rough2)"/>
  <path d="M 234 138 L 218 178" stroke="#b85450" stroke-width="3" fill="none" filter="url(#rough2)"/>

  <!-- other edges grey -->
  <path d="M 88 132 L 230 226" stroke="#ccc" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 168 120 L 192 178" stroke="#ccc" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 232 138 L 124 226" stroke="#ccc" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- best path label -->
  <rect x="40" y="264" width="240" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="160" y="276" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">红线 = 最优路径 0−1−2−3（5+2+9+8=24）</text>

  <!-- ===== Right: top-3 neighbor table ===== -->
  <rect x="320" y="44" width="300" height="240" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="470" y="64" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">各节点 top3 邻居（按分数降序）</text>

  <!-- table header -->
  <text x="350" y="88" font-size="10" fill="#888" font-weight="bold">节点</text>
  <text x="430" y="88" font-size="10" fill="#888" font-weight="bold">邻居:分数</text>

  <!-- rows -->
  <rect x="338" y="94" width="264" height="22" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="354" y="109" font-size="10" fill="#333" font-weight="bold">0</text>
  <text x="430" y="109" font-size="10" fill="#333">2:9, 1:2</text>

  <rect x="338" y="118" width="264" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="354" y="133" font-size="10" fill="#333" font-weight="bold">1</text>
  <text x="430" y="133" font-size="10" fill="#333">2:9, 3:8, 0:5</text>

  <rect x="338" y="142" width="264" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="354" y="157" font-size="10" fill="#333" font-weight="bold">2</text>
  <text x="430" y="157" font-size="10" fill="#333">3:8, 0:5, 4:4</text>

  <rect x="338" y="166" width="264" height="22" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="354" y="181" font-size="10" fill="#333" font-weight="bold">3</text>
  <text x="430" y="181" font-size="10" fill="#333">2:9, 1:2</text>

  <rect x="338" y="190" width="264" height="22" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="354" y="205" font-size="10" fill="#333" font-weight="bold">4</text>
  <text x="430" y="205" font-size="10" fill="#333">2:9</text>

  <!-- highlight middle edge row -->
  <rect x="338" y="220" width="264" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="470" y="238" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">枚举中间边 (1,2)：</text>
  <text x="470" y="254" text-anchor="middle" font-size="9" fill="#888">a ∈ top3(1)\{2} = {3,0}</text>
  <text x="470" y="266" text-anchor="middle" font-size="9" fill="#888">d ∈ top3(2)\{1} = {3,0,4}</text>

  <!-- ===== Bottom: enumeration of (1,2) middle edge ===== -->
  <rect x="20" y="300" width="600" height="220" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="320" y="322" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">枚举中间边 (1,2) 的 9 组 (a,d)（b=1, c=2）</text>

  <!-- table header -->
  <text x="80" y="346" font-size="10" fill="#888" font-weight="bold">a (b=1 邻居)</text>
  <text x="220" y="346" font-size="10" fill="#888" font-weight="bold">d (c=2 邻居)</text>
  <text x="360" y="346" font-size="10" fill="#888" font-weight="bold">四元组</text>
  <text x="500" y="346" font-size="10" fill="#888" font-weight="bold">分数</text>

  <!-- rows -->
  <rect x="40" y="352" width="560" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="80" y="368" font-size="10" fill="#333">3</text>
  <text x="220" y="368" font-size="10" fill="#333">3</text>
  <text x="360" y="368" font-size="10" fill="#b85450">重复 ✗</text>
  <text x="500" y="368" font-size="10" fill="#888">—</text>

  <rect x="40" y="376" width="560" height="22" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="80" y="392" font-size="10" fill="#333">3</text>
  <text x="220" y="392" font-size="10" fill="#333">0</text>
  <text x="360" y="392" font-size="10" fill="#333">{3,1,2,0}</text>
  <text x="500" y="392" font-size="10" fill="#333">8+2+9+5=24</text>

  <rect x="40" y="400" width="560" height="22" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="80" y="416" font-size="10" fill="#333">3</text>
  <text x="220" y="416" font-size="10" fill="#333">4</text>
  <text x="360" y="416" font-size="10" fill="#333">{3,1,2,4}</text>
  <text x="500" y="416" font-size="10" fill="#333">8+2+9+4=23</text>

  <rect x="40" y="424" width="560" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="80" y="440" font-size="10" fill="#333" font-weight="bold">0</text>
  <text x="220" y="440" font-size="10" fill="#333" font-weight="bold">3</text>
  <text x="360" y="440" font-size="10" fill="#4a7a3a" font-weight="bold">{0,1,2,3} ✓</text>
  <text x="500" y="440" font-size="10" fill="#4a7a3a" font-weight="bold">5+2+9+8=24 ★</text>

  <rect x="40" y="448" width="560" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="80" y="464" font-size="10" fill="#333">0</text>
  <text x="220" y="464" font-size="10" fill="#333">0</text>
  <text x="360" y="464" font-size="10" fill="#b85450">重复 ✗</text>
  <text x="500" y="464" font-size="10" fill="#888">—</text>

  <rect x="40" y="472" width="560" height="22" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="80" y="488" font-size="10" fill="#333">0</text>
  <text x="220" y="488" font-size="10" fill="#333">4</text>
  <text x="360" y="488" font-size="10" fill="#333">{0,1,2,4}</text>
  <text x="500" y="488" font-size="10" fill="#333">5+2+9+4=20</text>

  <!-- conclusion -->
  <rect x="40" y="500" width="560" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="512" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">该边最大 24；遍历所有边后全局最大仍 24 → 返回 24</text>
</svg>
