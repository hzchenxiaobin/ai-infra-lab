<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="680" fill="#fafafa"/>

  <!-- ===== changeRating section ===== -->
  <text x="300" y="28" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">changeRating(food, newRating)：erase 旧 + insert 新 + 更新评分表</text>

  <ellipse cx="300" cy="62" rx="120" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="66" text-anchor="middle" font-size="12" fill="#333">changeRating(food, newRating)</text>

  <path d="M 300 82 L 300 106" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="180" y="110" width="240" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="130" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">cuisine = foodCuisine[food]</text>
  <text x="300" y="148" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">oldR = foodRating[food]</text>

  <path d="M 300 160 L 300 184" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="300,188 392,228 300,268 208,228" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="224" text-anchor="middle" font-size="12" fill="#333">newR == oldR?</text>
  <text x="300" y="240" text-anchor="middle" font-size="10" fill="#888">（评分未变）</text>

  <!-- yes -> no-op -->
  <path d="M 392 228 L 470 228" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="432" y="220" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <rect x="470" y="204" width="118" height="48" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="529" y="224" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">无操作</text>
  <text x="529" y="240" text-anchor="middle" font-size="9" fill="#999">直接返回</text>

  <!-- no -> continue -->
  <path d="M 300 268 L 300 292" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="316" y="284" font-size="11" fill="#82b366" font-weight="bold">否</text>

  <rect x="170" y="294" width="260" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="319" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">erase { −oldR, food } 于 cuisineSet[cuisine]</text>

  <path d="M 300 334 L 300 358" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="360" width="260" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="385" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">insert { −newR, food } 于 cuisineSet[cuisine]</text>

  <path d="M 300 400 L 300 424" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="200" y="426" width="200" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="451" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">foodRating[food] = newR</text>

  <!-- divider -->
  <line x1="40" y1="490" x2="560" y2="490" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <!-- ===== highestRated section ===== -->
  <text x="300" y="514" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">highestRated(cuisine)：跳过陈旧堆顶，返回当前最高分食物名</text>

  <ellipse cx="300" cy="548" rx="120" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="552" text-anchor="middle" font-size="12" fill="#333">highestRated(cuisine)</text>

  <path d="M 300 566 L 300 588" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="300,592 404,628 300,664 196,628" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="624" text-anchor="middle" font-size="11" fill="#333">堆顶评分 ≠ 记录?</text>
  <text x="300" y="640" text-anchor="middle" font-size="9" fill="#888">（陈旧条目）</text>

  <!-- yes -> pop, loop back -->
  <path d="M 196 628 L 130 628 L 130 606 L 196 610" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="620" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <text x="150" y="602" text-anchor="middle" font-size="10" fill="#b85450">heappop 弹出</text>

  <!-- no -> return -->
  <path d="M 404 628 L 470 628" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="436" y="620" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="470" y="610" width="118" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="529" y="635" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">返回堆顶食物名</text>
</svg>
