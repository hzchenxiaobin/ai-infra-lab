<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：nums = [0, 3, 2, 1, 3, 2]，n = 4（示例 2）</text>
  <text x="260" y="40" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">每步 cnt[v] 加一；从 1 冲到 2 的瞬间，捣蛋鬼现形</text>

  <!-- 表头 -->
  <rect x="70" y="52" width="364" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="88" y="68" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="124" y="68" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">v</text>
  <text x="161" y="68" text-anchor="middle" font-size="9" fill="#333" font-weight="bold" filter="url(#rough2)">cnt[0]</text>
  <text x="199" y="68" text-anchor="middle" font-size="9" fill="#333" font-weight="bold" filter="url(#rough2)">cnt[1]</text>
  <text x="237" y="68" text-anchor="middle" font-size="9" fill="#333" font-weight="bold" filter="url(#rough2)">cnt[2]</text>
  <text x="275" y="68" text-anchor="middle" font-size="9" fill="#333" font-weight="bold" filter="url(#rough2)">cnt[3]</text>
  <text x="364" y="68" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">ans</text>

  <!-- 行 0：i=0 v=0 cnt=[1,0,0,0] -->
  <text x="88" y="93" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">0</text>
  <text x="124" y="93" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="144" y="81" width="34" height="22" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="182" y="81" width="34" height="22" rx="3" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="220" y="81" width="34" height="22" rx="3" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="258" y="81" width="34" height="22" rx="3" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="161" y="96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="199" y="96" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="237" y="96" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="275" y="96" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="364" y="93" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">[]</text>

  <!-- 行 1：i=1 v=3 cnt=[1,0,0,1] -->
  <text x="88" y="127" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">1</text>
  <text x="124" y="127" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="144" y="115" width="34" height="22" rx="3" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="182" y="115" width="34" height="22" rx="3" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="220" y="115" width="34" height="22" rx="3" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="258" y="115" width="34" height="22" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="161" y="130" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="199" y="130" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="237" y="130" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="275" y="130" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="364" y="127" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">[]</text>

  <!-- 行 2：i=2 v=2 cnt=[1,0,1,1] -->
  <text x="88" y="161" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">2</text>
  <text x="124" y="161" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="144" y="149" width="34" height="22" rx="3" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="182" y="149" width="34" height="22" rx="3" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="220" y="149" width="34" height="22" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="258" y="149" width="34" height="22" rx="3" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="161" y="164" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="199" y="164" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="237" y="164" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="275" y="164" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="364" y="161" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">[]</text>

  <!-- 行 3：i=3 v=1 cnt=[1,1,1,1] -->
  <text x="88" y="195" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">3</text>
  <text x="124" y="195" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="144" y="183" width="34" height="22" rx="3" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="182" y="183" width="34" height="22" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="220" y="183" width="34" height="22" rx="3" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="258" y="183" width="34" height="22" rx="3" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="161" y="198" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="199" y="198" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="237" y="198" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="275" y="198" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="364" y="195" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">[]</text>

  <!-- 行 4：i=4 v=3 cnt=[1,1,1,2] → 收集 3 -->
  <text x="88" y="229" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="124" y="229" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="144" y="217" width="34" height="22" rx="3" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="182" y="217" width="34" height="22" rx="3" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="220" y="217" width="34" height="22" rx="3" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="258" y="217" width="34" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="161" y="232" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="199" y="232" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="237" y="232" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="275" y="232" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="364" y="229" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">[3]</text>

  <!-- 行 5：i=5 v=2 cnt=[1,1,2,2] → 收集 2 -->
  <text x="88" y="263" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="124" y="263" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="144" y="251" width="34" height="22" rx="3" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="182" y="251" width="34" height="22" rx="3" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="220" y="251" width="34" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="258" y="251" width="34" height="22" rx="3" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="161" y="266" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="199" y="266" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="237" y="266" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="275" y="266" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="364" y="263" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">[3, 2]</text>

  <!-- 行分隔线与外框 -->
  <path d="M 70 110 L 434 110 M 70 144 L 434 144 M 70 178 L 434 178 M 70 212 L 434 212 M 70 246 L 434 246 M 70 280 L 434 280" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="70" y="52" width="364" height="228" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 右侧批注：第二次露面 -->
  <path d="M 444 226 L 296 226" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 444 260 L 258 260" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="452" y="224" text-anchor="start" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">第二次</text>
  <text x="452" y="236" text-anchor="start" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">露面 ✓</text>
  <text x="452" y="258" text-anchor="start" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">第二次</text>
  <text x="452" y="270" text-anchor="start" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">露面 ✓</text>

  <!-- 底部要点框 -->
  <rect x="55" y="300" width="410" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="320" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">前 4 步：每个数字首次露面，cnt 被均匀填成 [1, 1, 1, 1]</text>
  <text x="260" y="339" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">第 5、6 步：计数 1→2 的瞬间就地收集 → 捣蛋鬼 = [3, 2]</text>
</svg>
