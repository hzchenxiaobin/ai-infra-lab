<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="430" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：10 通电话分两组排名，前三 × 2 = 6 行输出</text>

  <rect x="25" y="40" width="270" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="160" y="59" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">incoming 组（duration 降序）</text>

  <rect x="25" y="76" width="270" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="40" y="96" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">Michael</text>
  <text x="150" y="96" font-size="10" fill="#446688" filter="url(#rough2)">rk 1 ✓</text>
  <text x="283" y="96" text-anchor="end" font-size="10.5" fill="#2e5c22" filter="url(#rough2)">420s → 00:07:00</text>

  <rect x="25" y="112" width="270" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="40" y="132" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">Jane</text>
  <text x="150" y="132" font-size="10" fill="#446688" filter="url(#rough2)">rk 2 ✓</text>
  <text x="283" y="132" text-anchor="end" font-size="10.5" fill="#2e5c22" filter="url(#rough2)">300s → 00:05:00</text>

  <rect x="25" y="148" width="270" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="40" y="168" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">Emily</text>
  <text x="150" y="168" font-size="10" fill="#446688" filter="url(#rough2)">rk 3 ✓</text>
  <text x="283" y="168" text-anchor="end" font-size="10.5" fill="#2e5c22" filter="url(#rough2)">180s → 00:03:00</text>

  <rect x="25" y="184" width="270" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.2" stroke-dasharray="5 3" rx="4" filter="url(#rough2)"/>
  <text x="40" y="204" font-size="10.5" fill="#888" filter="url(#rough2)">Alice</text>
  <text x="150" y="204" font-size="10" fill="#999" filter="url(#rough2)">rk 4 ✗</text>
  <text x="283" y="204" text-anchor="end" font-size="10.5" fill="#999" filter="url(#rough2)">150s</text>

  <rect x="25" y="220" width="270" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.2" stroke-dasharray="5 3" rx="4" filter="url(#rough2)"/>
  <text x="40" y="240" font-size="10.5" fill="#888" filter="url(#rough2)">John</text>
  <text x="150" y="240" font-size="10" fill="#999" filter="url(#rough2)">rk 5 ✗</text>
  <text x="283" y="240" text-anchor="end" font-size="10.5" fill="#999" filter="url(#rough2)">120s</text>

  <rect x="285" y="40" width="270" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="420" y="59" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">outgoing 组（duration 降序）</text>

  <rect x="285" y="76" width="270" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="300" y="96" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">Alice</text>
  <text x="410" y="96" font-size="10" fill="#4a7a3a" filter="url(#rough2)">rk 1 ✓</text>
  <text x="543" y="96" text-anchor="end" font-size="10.5" fill="#2e5c22" filter="url(#rough2)">360s → 00:06:00</text>

  <rect x="285" y="112" width="270" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="300" y="132" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">Emily</text>
  <text x="410" y="132" font-size="10" fill="#4a7a3a" filter="url(#rough2)">rk 2 ✓</text>
  <text x="543" y="132" text-anchor="end" font-size="10.5" fill="#2e5c22" filter="url(#rough2)">280s → 00:04:40</text>

  <rect x="285" y="148" width="270" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="300" y="168" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">Jane</text>
  <text x="410" y="168" font-size="10" fill="#4a7a3a" filter="url(#rough2)">rk 3 ✓</text>
  <text x="543" y="168" text-anchor="end" font-size="10.5" fill="#2e5c22" filter="url(#rough2)">240s → 00:04:00</text>

  <rect x="285" y="184" width="270" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.2" stroke-dasharray="5 3" rx="4" filter="url(#rough2)"/>
  <text x="300" y="204" font-size="10.5" fill="#888" filter="url(#rough2)">Michael</text>
  <text x="410" y="204" font-size="10" fill="#999" filter="url(#rough2)">rk 4 ✗</text>
  <text x="543" y="204" text-anchor="end" font-size="10.5" fill="#999" filter="url(#rough2)">200s</text>

  <rect x="285" y="220" width="270" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.2" stroke-dasharray="5 3" rx="4" filter="url(#rough2)"/>
  <text x="300" y="240" font-size="10.5" fill="#888" filter="url(#rough2)">John</text>
  <text x="410" y="240" font-size="10" fill="#999" filter="url(#rough2)">rk 5 ✗</text>
  <text x="543" y="240" text-anchor="end" font-size="10.5" fill="#999" filter="url(#rough2)">180s</text>

  <path d="M 290 258 L 290 274" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="272" font-size="10" fill="#666" filter="url(#rough2)">ORDER BY type 升序 → incoming 组在前</text>

  <rect x="25" y="282" width="170" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="110" y="302" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">Michael · incoming</text>
  <text x="110" y="322" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">00:07:00</text>

  <rect x="205" y="282" width="170" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="302" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">Jane · incoming</text>
  <text x="290" y="322" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">00:05:00</text>

  <rect x="385" y="282" width="170" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="470" y="302" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">Emily · incoming</text>
  <text x="470" y="322" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">00:03:00</text>

  <rect x="25" y="342" width="170" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="110" y="362" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">Alice · outgoing</text>
  <text x="110" y="382" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">00:06:00</text>

  <rect x="205" y="342" width="170" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="362" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">Emily · outgoing</text>
  <text x="290" y="382" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">00:04:40</text>

  <rect x="385" y="342" width="170" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="470" y="362" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">Jane · outgoing</text>
  <text x="470" y="382" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">00:04:00</text>

  <text x="290" y="416" text-anchor="middle" font-size="10" fill="#a06a10" filter="url(#rough2)">💡 Emily、Jane 在两条泳道里名次各不相同——PARTITION BY type 的独立排名语义</text>
</svg>
