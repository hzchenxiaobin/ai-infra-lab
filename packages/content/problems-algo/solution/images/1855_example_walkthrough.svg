<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    示例演算：nums1 = [55,30,5,4,2]，nums2 = [100,20,10,10,5]
  </text>

  <!-- table header -->
  <g filter="url(#rough2)">
    <rect x="20" y="48" width="560" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="50" y="68" text-anchor="middle" font-size="12" fill="#333">i</text>
    <text x="110" y="68" text-anchor="middle" font-size="12" fill="#333">nums1[i]</text>
    <text x="200" y="68" text-anchor="middle" font-size="12" fill="#333">j 起始</text>
    <text x="330" y="68" text-anchor="middle" font-size="12" fill="#333">推进过程</text>
    <text x="450" y="68" text-anchor="middle" font-size="12" fill="#333">R_i=j−1</text>
    <text x="535" y="68" text-anchor="middle" font-size="12" fill="#333">距离</text>

    <line x1="80" y1="48" x2="80" y2="78" stroke="#446688" stroke-width="1"/>
    <line x1="140" y1="48" x2="140" y2="78" stroke="#446688" stroke-width="1"/>
    <line x1="260" y1="48" x2="260" y2="78" stroke="#446688" stroke-width="1"/>
    <line x1="400" y1="48" x2="400" y2="78" stroke="#446688" stroke-width="1"/>
    <line x1="500" y1="48" x2="500" y2="78" stroke="#446688" stroke-width="1"/>
  </g>

  <!-- row i=0 -->
  <g filter="url(#rough2)">
    <rect x="20" y="78" width="560" height="44" fill="#ffffff" stroke="#446688" stroke-width="1"/>
    <text x="50" y="105" text-anchor="middle" font-size="12" fill="#333">0</text>
    <text x="110" y="105" text-anchor="middle" font-size="12" fill="#333">55</text>
    <text x="200" y="105" text-anchor="middle" font-size="12" fill="#333">0</text>
    <text x="330" y="100" text-anchor="middle" font-size="11" fill="#333">100≥55→j=1;</text>
    <text x="330" y="116" text-anchor="middle" font-size="11" fill="#b85450">20&lt;55 停</text>
    <text x="450" y="105" text-anchor="middle" font-size="12" fill="#4a7a3a">0</text>
    <text x="535" y="105" text-anchor="middle" font-size="12" fill="#333">0</text>
  </g>

  <!-- row i=1 -->
  <g filter="url(#rough2)">
    <rect x="20" y="122" width="560" height="44" fill="#fce4ec" stroke="#446688" stroke-width="1"/>
    <text x="50" y="149" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="110" y="149" text-anchor="middle" font-size="12" fill="#333">30</text>
    <text x="200" y="149" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="330" y="144" text-anchor="middle" font-size="11" fill="#b85450">20&lt;30 停</text>
    <text x="330" y="160" text-anchor="middle" font-size="11" fill="#888">无合法 j</text>
    <text x="450" y="149" text-anchor="middle" font-size="12" fill="#888">0</text>
    <text x="535" y="149" text-anchor="middle" font-size="12" fill="#888">—</text>
  </g>

  <!-- row i=2 (highlight) -->
  <g filter="url(#rough2)">
    <rect x="20" y="166" width="560" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="50" y="195" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="110" y="195" text-anchor="middle" font-size="12" fill="#333">5</text>
    <text x="200" y="195" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="330" y="188" text-anchor="middle" font-size="11" fill="#333">10≥5→j=3; 10≥5→j=4;</text>
    <text x="330" y="204" text-anchor="middle" font-size="11" fill="#4a7a3a">5≥5→j=5 越界 停</text>
    <text x="450" y="195" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">4</text>
    <text x="535" y="195" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">2</text>
  </g>

  <!-- row i=3 -->
  <g filter="url(#rough2)">
    <rect x="20" y="216" width="560" height="44" fill="#ffffff" stroke="#446688" stroke-width="1"/>
    <text x="50" y="243" text-anchor="middle" font-size="12" fill="#333">3</text>
    <text x="110" y="243" text-anchor="middle" font-size="12" fill="#333">4</text>
    <text x="200" y="243" text-anchor="middle" font-size="12" fill="#333">5</text>
    <text x="330" y="243" text-anchor="middle" font-size="11" fill="#888">j=m，不推进</text>
    <text x="450" y="243" text-anchor="middle" font-size="12" fill="#4a7a3a">4</text>
    <text x="535" y="243" text-anchor="middle" font-size="12" fill="#333">1</text>
  </g>

  <!-- row i=4 -->
  <g filter="url(#rough2)">
    <rect x="20" y="260" width="560" height="44" fill="#ffffff" stroke="#446688" stroke-width="1"/>
    <text x="50" y="287" text-anchor="middle" font-size="12" fill="#333">4</text>
    <text x="110" y="287" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="200" y="287" text-anchor="middle" font-size="12" fill="#333">5</text>
    <text x="330" y="287" text-anchor="middle" font-size="11" fill="#888">j=m，不推进</text>
    <text x="450" y="287" text-anchor="middle" font-size="12" fill="#4a7a3a">4</text>
    <text x="535" y="287" text-anchor="middle" font-size="12" fill="#333">0</text>
  </g>

  <!-- vertical gridlines for body -->
  <g filter="url(#rough2)" stroke="#ddd" stroke-width="1">
    <line x1="80" y1="78" x2="80" y2="304"/>
    <line x1="140" y1="78" x2="140" y2="304"/>
    <line x1="260" y1="78" x2="260" y2="304"/>
    <line x1="400" y1="78" x2="400" y2="304"/>
    <line x1="500" y1="78" x2="500" y2="304"/>
  </g>

  <!-- result box -->
  <rect x="80" y="335" width="440" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="360" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    ans = max(0, 0, 2, 1, 0) = 2
  </text>
  <text x="300" y="382" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">
    最优下标对 (i, j) = (2, 4)：nums1[2]=5 ≤ nums2[4]=5
  </text>
  <text x="300" y="402" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">
    注意：i=2 时阈值骤降，j 一路推到越界；i=3,4 沿用 j=5 不回退
  </text>

  <!-- j movement annotation -->
  <text x="300" y="438" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">
    j 全程轨迹：0→1→2→3→4→5（只增不减，共推进 5 = m 次）
  </text>
</svg>
