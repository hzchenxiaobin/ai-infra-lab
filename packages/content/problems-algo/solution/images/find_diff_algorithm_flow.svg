<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：两遍 XOR — 先扫 s 再扫 t，剩值即答案</text>

  <!-- Start -->
  <ellipse cx="270" cy="62" rx="110" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="12" fill="#333">开始: ans = 0</text>

  <path d="M 270 82 L 270 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 1: XOR s chars -->
  <rect x="150" y="104" width="240" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="124" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">遍历 s 的每个字符 ch</text>
  <text x="270" y="142" text-anchor="middle" font-size="11" fill="#555">ans ^= ch</text>

  <path d="M 270 152 L 270 172" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: s 还有字符? -->
  <polygon points="270,176 410,228 270,280 130,228" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="224" text-anchor="middle" font-size="12" fill="#333">s 还有</text>
  <text x="270" y="240" text-anchor="middle" font-size="12" fill="#333">未处理字符?</text>

  <!-- Yes -> loop back -->
  <path d="M 130 228 L 80 228 L 80 128 L 150 128" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="178" text-anchor="middle" font-size="11" fill="#82b366" transform="rotate(-90 100 178)">是，继续</text>

  <!-- No -> down -->
  <path d="M 270 280 L 270 300" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="296" font-size="11" fill="#b85450">否</text>

  <!-- Step 2: XOR t chars -->
  <rect x="150" y="304" width="240" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="324" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">遍历 t 的每个字符 ch</text>
  <text x="270" y="342" text-anchor="middle" font-size="11" fill="#555">ans ^= ch</text>

  <path d="M 270 352 L 270 372" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: t 还有字符? -->
  <polygon points="270,376 390,418 270,460 150,418" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="414" text-anchor="middle" font-size="12" fill="#333">t 还有字符?</text>

  <!-- Yes -> loop back to step 2 -->
  <path d="M 390 418 L 460 418 L 460 328 L 390 328" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="476" y="378" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 476 378)">是，继续</text>

  <!-- No -> return -->
  <path d="M 150 418 L 96 418" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="124" y="410" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="64" cy="418" rx="42" ry="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="64" y="414" text-anchor="middle" font-size="11" fill="#333">返回</text>
  <text x="64" y="430" text-anchor="middle" font-size="11" fill="#333">(char)ans</text>
</svg>
