<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "ababab"（n = 6）逐位构造 π 数组</text>

  <!-- Table header -->
  <rect x="20" y="40" width="520" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="55" y="58" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">i</text>
  <text x="125" y="58" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">s[i]</text>
  <text x="215" y="58" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">j = π[i−1]</text>
  <text x="335" y="58" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">比较 s[i] ↔ s[j]</text>
  <text x="470" y="58" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">π[i]</text>

  <!-- Column dividers -->
  <path d="M 90 40 L 90 256" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <path d="M 160 40 L 160 256" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <path d="M 270 40 L 270 256" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <path d="M 400 40 L 400 256" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Row i=0: base case -->
  <rect x="20" y="70" width="520" height="30" fill="#f8f8f8" stroke="#ddd" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="55" y="89" text-anchor="middle" font-size="11" fill="#555">0</text>
  <text x="125" y="89" text-anchor="middle" font-size="11" fill="#335" font-weight="bold">a</text>
  <text x="215" y="89" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <text x="335" y="89" text-anchor="middle" font-size="10.5" fill="#888" font-style="italic">基准（单字符）</text>
  <text x="470" y="89" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">0</text>

  <!-- Row i=1: b vs a, mismatch -->
  <rect x="20" y="100" width="520" height="30" fill="#fce4ec" stroke="#e0c0c0" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="55" y="119" text-anchor="middle" font-size="11" fill="#555">1</text>
  <text x="125" y="119" text-anchor="middle" font-size="11" fill="#335" font-weight="bold">b</text>
  <text x="215" y="119" text-anchor="middle" font-size="11" fill="#555">0</text>
  <text x="335" y="119" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">'b' vs 'a'  ✗</text>
  <text x="470" y="119" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">0</text>

  <!-- Row i=2: a vs a, match -->
  <rect x="20" y="130" width="520" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="55" y="149" text-anchor="middle" font-size="11" fill="#555">2</text>
  <text x="125" y="149" text-anchor="middle" font-size="11" fill="#335" font-weight="bold">a</text>
  <text x="215" y="149" text-anchor="middle" font-size="11" fill="#555">0</text>
  <text x="335" y="149" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">'a' vs 'a'  ✓ → j=1</text>
  <text x="470" y="149" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">1</text>

  <!-- Row i=3: b vs b, match -->
  <rect x="20" y="160" width="520" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="55" y="179" text-anchor="middle" font-size="11" fill="#555">3</text>
  <text x="125" y="179" text-anchor="middle" font-size="11" fill="#335" font-weight="bold">b</text>
  <text x="215" y="179" text-anchor="middle" font-size="11" fill="#555">1</text>
  <text x="335" y="179" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">'b' vs 'b'  ✓ → j=2</text>
  <text x="470" y="179" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">2</text>

  <!-- Row i=4: a vs a, match -->
  <rect x="20" y="190" width="520" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="55" y="209" text-anchor="middle" font-size="11" fill="#555">4</text>
  <text x="125" y="209" text-anchor="middle" font-size="11" fill="#335" font-weight="bold">a</text>
  <text x="215" y="209" text-anchor="middle" font-size="11" fill="#555">2</text>
  <text x="335" y="209" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">'a' vs 'a'  ✓ → j=3</text>
  <text x="470" y="209" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">3</text>

  <!-- Row i=5: b vs b, match — ANSWER -->
  <rect x="20" y="220" width="520" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="55" y="240" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">5</text>
  <text x="125" y="240" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">b</text>
  <text x="215" y="240" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">3</text>
  <text x="335" y="240" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">'b' vs 'b'  ✓ → j=4</text>
  <text x="470" y="240" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4 ★</text>

  <!-- Result box for ababab -->
  <rect x="60" y="262" width="440" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="284" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold">π[5] = 4  →  最长快乐前缀 = s[0:4] = "abab"</text>

  <!-- divider -->
  <path d="M 40 310 L 520 310" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ====== Mini: level ====== -->
  <text x="280" y="330" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">对照：s = "level"（n = 5）</text>

  <!-- 5 char boxes w=44, start x=170 -->
  <rect x="170" y="340" width="44" height="36" fill="#fff" stroke="#999" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="192" y="363" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">l</text>
  <rect x="214" y="340" width="44" height="36" fill="#fff" stroke="#999" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="236" y="363" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">e</text>
  <rect x="258" y="340" width="44" height="36" fill="#fff" stroke="#999" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="280" y="363" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">v</text>
  <rect x="302" y="340" width="44" height="36" fill="#fff" stroke="#999" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="324" y="363" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">e</text>
  <!-- last box highlighted: s[4]='l' matches s[0]='l' -->
  <rect x="346" y="340" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="368" y="363" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold">l</text>

  <!-- π values -->
  <text x="192" y="392" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="236" y="392" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="280" y="392" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="324" y="392" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="368" y="392" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="280" y="410" text-anchor="middle" font-size="10.5" fill="#a87020">π = [0,0,0,0,1]  →  答案 "l"</text>
</svg>
