<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">二分查找算法流程：找首个 缺失数 ≥ k 的下标</text>

  <!-- Start -->
  <rect x="210" y="46" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="15" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">left=0, right=n−1</text>

  <path d="M 270 76 L 270 92" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop condition -->
  <polygon points="270,96 370,136 270,176 170,136" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="132" text-anchor="middle" font-size="11" fill="#333">left ≤ right ?</text>
  <text x="270" y="148" text-anchor="middle" font-size="10" fill="#888">(区间非空)</text>

  <!-- No branch -->
  <path d="M 370 136 L 430 136" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="130" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="430" y="122" width="90" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="475" y="141" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return k+left</text>

  <!-- Yes branch -->
  <path d="M 270 176 L 270 196" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="278" y="190" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- mid computation -->
  <rect x="190" y="200" width="160" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="219" text-anchor="middle" font-size="11" fill="#333">mid = left + (right−left)/2</text>

  <path d="M 270 228 L 270 244" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: missing < k ? -->
  <polygon points="270,248 390,288 270,328 150,288" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="284" text-anchor="middle" font-size="11" fill="#333">arr[mid]−mid−1</text>
  <text x="270" y="300" text-anchor="middle" font-size="11" fill="#333">&lt; k ?</text>

  <!-- Yes: go right -->
  <path d="M 390 288 L 440 288 L 440 136 L 370 136" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="398" y="282" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="440" y="232" width="84" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="482" y="249" text-anchor="middle" font-size="10.5" fill="#446688">left = mid+1</text>
  <text x="500" y="200" font-size="9.5" fill="#888">缺失不够，</text>
  <text x="500" y="212" font-size="9.5" fill="#888">往右找</text>

  <!-- No: go left (candidate) -->
  <path d="M 150 288 L 100 288 L 100 136 L 170 136" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="282" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="16" y="232" width="84" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="58" y="249" text-anchor="middle" font-size="10.5" fill="#446688">right = mid−1</text>
  <text x="28" y="200" font-size="9.5" fill="#888">缺失够了，</text>
  <text x="28" y="212" font-size="9.5" fill="#888">往左找更早的</text>

  <!-- Key insight box -->
  <rect x="40" y="360" width="460" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="382" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">不变量：left 左侧全部 缺失数 &lt; k，left 及右侧全部 ≥ k</text>
  <text x="270" y="398" text-anchor="middle" font-size="10.5" fill="#555">循环结束时 left 即首个 ≥ k 的下标 → ans = k + left</text>
</svg>
