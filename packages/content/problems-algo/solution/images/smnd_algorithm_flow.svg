<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：先求交集，有则取最小公共位，无则各取最小拼两位</text>

  <!-- Step 1: build sets -->
  <rect x="200" y="50" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="300" y="75" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">s1 = set(nums1)，s2 = set(nums2)</text>

  <path d="M 300 92 L 300 110" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: intersection -->
  <rect x="200" y="114" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="300" y="139" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">common = s1 ∩ s2</text>

  <path d="M 300 156 L 300 174" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="300,180 420,228 300,276 180,228" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="224" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">common 非空？</text>
  <text x="300" y="242" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(s1 ∩ s2 ≠ ∅)</text>

  <!-- Yes branch (left) -->
  <path d="M 180 228 L 120 228 L 120 300" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="138" y="220" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="36" y="304" width="168" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="120" y="326" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">return min(common)</text>
  <text x="120" y="344" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">最小公共位（一位数）</text>

  <!-- No branch (right) -->
  <path d="M 420 228 L 480 228 L 480 300" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="446" y="220" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="396" y="304" width="168" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="480" y="326" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a,b = min(nums1), min(nums2)</text>
  <text x="480" y="344" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">return min(a·10+b, b·10+a)</text>
</svg>
