<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：两种操作的本质 —— 0 左移聚集 + 配对消灭</text>

  <!-- ===== Operation 1 ===== -->
  <text x="140" y="58" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">操作 1：00 → 10（消灭一个 0）</text>

  <!-- before -->
  <g filter="url(#rough2)">
    <rect x="84" y="72" width="28" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="112" y="72" width="28" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="98" y="92" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">0</text>
    <text x="126" y="92" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">0</text>
  </g>
  <path d="M 140 110 L 140 132" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="148" y="126" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">op1</text>

  <!-- after -->
  <g filter="url(#rough2)">
    <rect x="84" y="138" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="112" y="138" width="28" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="98" y="158" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="126" y="158" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">0</text>
  </g>
  <text x="150" y="156" font-size="10" fill="#4a7a3a" filter="url(#rough2)">左 0→1，右 0 保留</text>

  <!-- Op1 insight -->
  <rect x="40" y="178" width="220" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="52" y="196" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">本质：两个 0 配对</text>
  <text x="52" y="210" font-size="10" fill="#555" filter="url(#rough2)">→ 左 0 变 1，右 0 留下</text>
  <text x="52" y="224" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">0 总数 −1，存活 0 右移 1</text>

  <!-- ===== Operation 2 ===== -->
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">操作 2：10 → 01（0 左移一格）</text>

  <!-- before -->
  <g filter="url(#rough2)">
    <rect x="364" y="72" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="392" y="72" width="28" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="378" y="92" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="406" y="92" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">0</text>
  </g>
  <path d="M 420 110 L 420 132" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="428" y="126" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">op2</text>

  <!-- after -->
  <g filter="url(#rough2)">
    <rect x="364" y="138" width="28" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="392" y="138" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="378" y="158" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">0</text>
    <text x="406" y="158" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>
  </g>
  <text x="430" y="156" font-size="10" fill="#446688" filter="url(#rough2)">0 与左邻 1 交换</text>

  <!-- Op2 insight -->
  <rect x="320" y="178" width="220" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="332" y="196" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">本质：0 穿过左边的 1</text>
  <text x="332" y="210" font-size="10" fill="#555" filter="url(#rough2)">→ 0 向左移动一格</text>
  <text x="332" y="224" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">0 总数不变，用于聚集</text>

  <!-- ===== Strategy: gather + collapse ===== -->
  <text x="280" y="262" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">策略：先把所有 0 聚到首个 0 处，再逐对消灭</text>

  <!-- gather row -->
  <text x="50" y="290" font-size="10" fill="#888" filter="url(#rough2)">① 聚集：</text>
  <g filter="url(#rough2)" font-size="13" font-weight="bold" text-anchor="middle">
    <rect x="92" y="278" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="104" y="295" fill="#4a7a3a">1</text>
    <rect x="116" y="278" width="24" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3"/>
    <text x="128" y="295" fill="#b85450">0</text>
    <rect x="140" y="278" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="152" y="295" fill="#4a7a3a">1</text>
    <rect x="164" y="278" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="176" y="295" fill="#4a7a3a">1</text>
    <rect x="188" y="278" width="24" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3"/>
    <text x="200" y="295" fill="#b85450">0</text>
    <rect x="212" y="278" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="224" y="295" fill="#4a7a3a">1</text>
  </g>
  <text x="246" y="295" font-size="10" fill="#888" filter="url(#rough2)">原串 010010</text>

  <path d="M 150 308 L 150 326" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="158" y="322" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">op2 聚集</text>

  <!-- gathered -->
  <text x="50" y="350" font-size="10" fill="#888" filter="url(#rough2)">② 成块：</text>
  <g filter="url(#rough2)" font-size="13" font-weight="bold" text-anchor="middle">
    <rect x="92" y="338" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="104" y="355" fill="#4a7a3a">1</text>
    <rect x="116" y="338" width="24" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3"/>
    <text x="128" y="355" fill="#b85450">0</text>
    <rect x="140" y="338" width="24" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3"/>
    <text x="152" y="355" fill="#b85450">0</text>
    <rect x="164" y="338" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="176" y="355" fill="#4a7a3a">1</text>
    <rect x="188" y="338" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="200" y="355" fill="#4a7a3a">1</text>
    <rect x="212" y="338" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="224" y="355" fill="#4a7a3a">1</text>
  </g>
  <text x="246" y="355" font-size="10" fill="#888" filter="url(#rough2)">0 连续成块</text>

  <path d="M 150 368 L 150 386" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="158" y="382" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">op1 消灭</text>

  <!-- collapsed -->
  <text x="50" y="410" font-size="10" fill="#888" filter="url(#rough2)">③ 结果：</text>
  <g filter="url(#rough2)" font-size="13" font-weight="bold" text-anchor="middle">
    <rect x="92" y="398" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="104" y="415" fill="#4a7a3a">1</text>
    <rect x="116" y="398" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="128" y="415" fill="#4a7a3a">1</text>
    <rect x="140" y="398" width="24" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3"/>
    <text x="152" y="415" fill="#b85450">0</text>
    <rect x="164" y="398" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="176" y="415" fill="#4a7a3a">1</text>
    <rect x="188" y="398" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="200" y="415" fill="#4a7a3a">1</text>
    <rect x="212" y="398" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="224" y="415" fill="#4a7a3a">1</text>
  </g>
  <text x="246" y="415" font-size="10" fill="#888" filter="url(#rough2)">仅剩 1 个 0</text>

  <!-- ===== Formula box ===== -->
  <rect x="300" y="278" width="240" height="148" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="312" y="298" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">结论（c ≥ 1 时）</text>
  <text x="312" y="318" font-size="10" fill="#555" filter="url(#rough2)">p = 首个 0 的下标</text>
  <text x="312" y="334" font-size="10" fill="#555" filter="url(#rough2)">c = 0 的总个数</text>
  <text x="312" y="356" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">最终唯一的 0 落在</text>
  <rect x="312" y="364" width="120" height="26" fill="#fff" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="372" y="382" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">位置 p + c − 1</text>
  <text x="312" y="404" font-size="10" fill="#555" filter="url(#rough2)">其余位全为 1</text>
  <text x="312" y="418" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">c = 0 时原串已最大</text>

  <!-- Footer -->
  <text x="280" y="450" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">首个 0 只能向右“吃”掉其余 0，每吃一个右移 1 格 → 极限位置 p+c−1</text>
</svg>
