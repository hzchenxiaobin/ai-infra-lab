<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：句子首尾相接成循环串 s，游标按行推进并对齐词界</text>

  <!-- ===== sentence words ===== -->
  <text x="24" y="64" font-size="12" fill="#888">sentence =</text>
  <rect x="110" y="48" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="68" text-anchor="middle" font-size="13" fill="#333">a</text>
  <rect x="158" y="48" width="64" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="68" text-anchor="middle" font-size="13" fill="#333">bcd</text>
  <rect x="230" y="48" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="68" text-anchor="middle" font-size="13" fill="#333">e</text>

  <!-- arrow down -->
  <path d="M 190 82 L 190 98" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="94" font-size="10" fill="#888">join + 末尾空格</text>

  <!-- ===== cyclic string s ===== -->
  <text x="24" y="124" font-size="12" fill="#888">s =</text>
  <!-- 8 char boxes: a(0) _(1) b(2) c(3) d(4) _(5) e(6) _(7) -->
  <!-- box width 42, start x=70 -->
  <rect x="70" y="108" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="91" y="129" text-anchor="middle" font-size="13" fill="#333">a</text>
  <rect x="112" y="108" width="42" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="133" y="129" text-anchor="middle" font-size="12" fill="#888">·</text>
  <rect x="154" y="108" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="129" text-anchor="middle" font-size="13" fill="#333">b</text>
  <rect x="196" y="108" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="217" y="129" text-anchor="middle" font-size="13" fill="#333">c</text>
  <rect x="238" y="108" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="259" y="129" text-anchor="middle" font-size="13" fill="#333">d</text>
  <rect x="280" y="108" width="42" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="301" y="129" text-anchor="middle" font-size="12" fill="#888">·</text>
  <rect x="322" y="108" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="343" y="129" text-anchor="middle" font-size="13" fill="#333">e</text>
  <rect x="364" y="108" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="385" y="129" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">·</text>

  <!-- index labels -->
  <text x="91" y="156" text-anchor="middle" font-size="9" fill="#999">0</text>
  <text x="133" y="156" text-anchor="middle" font-size="9" fill="#999">1</text>
  <text x="175" y="156" text-anchor="middle" font-size="9" fill="#999">2</text>
  <text x="217" y="156" text-anchor="middle" font-size="9" fill="#999">3</text>
  <text x="259" y="156" text-anchor="middle" font-size="9" fill="#999">4</text>
  <text x="301" y="156" text-anchor="middle" font-size="9" fill="#999">5</text>
  <text x="343" y="156" text-anchor="middle" font-size="9" fill="#999">6</text>
  <text x="385" y="156" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">7</text>

  <!-- m label -->
  <text x="430" y="129" font-size="12" fill="#b85450" font-weight="bold">m = 8</text>
  <text x="430" y="146" font-size="10" fill="#888">末尾空格</text>
  <text x="430" y="160" font-size="10" fill="#888">让循环自然</text>

  <!-- ===== cyclic wrap arrow ===== -->
  <path d="M 406 124 Q 470 124 470 200 Q 470 250 270 250 Q 70 250 70 200 Q 70 150 70 144" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="478" y="190" font-size="10" fill="#b85450">首尾相接</text>
  <text x="478" y="204" font-size="10" fill="#b85450">循环重复</text>

  <!-- ===== one row snap demo ===== -->
  <text x="24" y="200" font-size="12" fill="#888">第 0 行 cols=6：</text>
  <!-- 6 cells representing a row, show a bcd _ (indices 0..5) -->
  <rect x="70" y="184" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="91" y="203" text-anchor="middle" font-size="12" fill="#333">a</text>
  <rect x="112" y="184" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="133" y="203" text-anchor="middle" font-size="11" fill="#888">·</text>
  <rect x="154" y="184" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="203" text-anchor="middle" font-size="12" fill="#333">b</text>
  <rect x="196" y="184" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="217" y="203" text-anchor="middle" font-size="12" fill="#333">c</text>
  <rect x="238" y="184" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="259" y="203" text-anchor="middle" font-size="12" fill="#333">d</text>
  <rect x="280" y="184" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="301" y="203" text-anchor="middle" font-size="11" fill="#888">·</text>

  <!-- arrow: cur += 6 lands at idx6 'e' (in word) -> snap back to 5 -->
  <path d="M 280 218 L 280 232" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- snap explanation -->
  <rect x="60" y="236" width="420" height="44" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="254" text-anchor="middle" font-size="11" fill="#333">cur += cols 后若 s[cur%m] 落在词中（非空格）</text>
  <text x="270" y="270" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">→ 回退 cur 到最近词尾空格，保证不切词</text>

  <!-- ===== bottom insight ===== -->
  <rect x="40" y="296" width="460" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="270" y="318" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">每行只做：cur += cols，再对齐到单词边界</text>
  <text x="270" y="338" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">答案 = cur // m　（游标走过的整句数）</text>
</svg>
