<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：单次遍历，按操作类型更新 depth</text>

  <!-- Start -->
  <ellipse cx="280" cy="50" rx="100" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="54" text-anchor="middle" font-size="11" fill="#333">depth = 0，i = 0</text>

  <path d="M 280 68 L 280 80" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i < n? diamond: center (280, 104) -->
  <polygon points="280,80 384,104 280,128 176,104" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="100" text-anchor="middle" font-size="11" fill="#333">i &lt; n ?</text>
  <text x="280" y="116" text-anchor="middle" font-size="10" fill="#888">(还有日志?)</text>

  <!-- No -> return depth -->
  <path d="M 384 104 L 440 104" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="412" y="96" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <rect x="440" y="86" width="100" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="490" y="104" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回 depth</text>
  <text x="490" y="118" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">⭐</text>

  <!-- Yes -> down -->
  <path d="M 280 128 L 280 142" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="138" font-size="10" fill="#82b366">是</text>

  <!-- log[i] type? diamond: center (280, 168) -->
  <polygon points="280,142 400,168 280,194 160,168" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="164" text-anchor="middle" font-size="11" fill="#333">log[i] 类型?</text>
  <text x="280" y="180" text-anchor="middle" font-size="10" fill="#888">(分支判定)</text>

  <!-- Branch 1: ../ -> left -->
  <path d="M 160 168 L 90 168 L 90 210" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="160" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">"../"</text>
  <rect x="30" y="212" width="120" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="90" y="230" text-anchor="middle" font-size="10" fill="#333">depth =</text>
  <text x="90" y="246" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">max(0, depth−1)</text>

  <!-- Branch 2: ./ -> down (skip) -->
  <path d="M 280 194 L 280 212" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="208" font-size="10" fill="#d6a040" font-weight="bold">"./"</text>
  <rect x="220" y="212" width="120" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="238" text-anchor="middle" font-size="11" fill="#888">(无操作，跳过)</text>

  <!-- Branch 3: x/ -> right -->
  <path d="M 400 168 L 470 168 L 470 210" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="160" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">"x/"</text>
  <rect x="410" y="212" width="120" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="470" y="238" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">depth += 1</text>

  <!-- All branches converge to i++ -->
  <path d="M 90 252 L 90 320 L 280 320" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 280 252 L 280 320" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 470 252 L 470 320 L 280 320" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i++ box: center (280, 336) -->
  <rect x="200" y="322" width="160" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="343" text-anchor="middle" font-size="11" fill="#333">i++，回到循环</text>

  <!-- loop back arrow from i++ to i<n? -->
  <path d="M 200 338 L 56 338 L 56 104 L 176 104" stroke="#888" stroke-width="1.2" stroke-dasharray="5,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="48" y="220" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 48 220)">下一条日志</text>

  <!-- Note -->
  <rect x="110" y="378" width="340" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="398" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">⚠️ 三分支汇聚，./ 直接跳过，max 保证 depth 不为负</text>
</svg>
