<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="8" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="ary" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2e6e2e"/>
    </marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="860" height="560" fill="#fdfcf7"/>
  <text x="430" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">两个操作的算法流程</text>
  <path d="M 320 46 Q 430 54 540 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Left: change ===== -->
  <g filter="url(#sk)"><rect x="40" y="70" width="370" height="460" rx="12" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="225" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">change(index, number)</text>

  <g filter="url(#sk)"><rect x="70" y="118" width="310" height="48" rx="8" fill="#fff" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="225" y="148" text-anchor="middle" font-size="12" fill="#555">① idx2num[index] = number</text>
  <text x="225" y="162" text-anchor="middle" font-size="10" fill="#888">（覆盖旧值；哈希表 O(1)）</text>
  <path d="M 225 170 L 225 188" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="70" y="190" width="310" height="48" rx="8" fill="#fff" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="225" y="220" text-anchor="middle" font-size="12" fill="#555">② heaps[number].push(index)</text>
  <text x="225" y="234" text-anchor="middle" font-size="10" fill="#888">（最小堆上浮；O(log n)）</text>
  <path d="M 225 242 L 225 260" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="70" y="262" width="310" height="56" rx="8" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="4 3"/></g>
  <text x="225" y="284" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">return</text>
  <text x="225" y="302" text-anchor="middle" font-size="10.5" fill="#555">不主动从旧 number 的堆里删 index</text>
  <text x="225" y="316" text-anchor="middle" font-size="10" fill="#888">旧堆残留 = 延迟删除的代价</text>

  <g filter="url(#sk)"><rect x="70" y="338" width="310" height="170" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <text x="225" y="362" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">为什么不在 change 里删旧堆？</text>
  <text x="90" y="384" font-size="10.5" fill="#555">• 堆不支持 O(log n) 删任意元素</text>
  <text x="90" y="402" font-size="10.5" fill="#555">• 强删需借助 set / 索引堆，常数更大</text>
  <text x="90" y="420" font-size="10.5" fill="#555">• 延迟删：把清理成本摊到 find</text>
  <text x="90" y="438" font-size="10.5" fill="#555">• 每条记录至多被弹一次，总成本有界</text>
  <text x="90" y="458" font-size="10.5" fill="#888">→ 写多读少 / 频繁 change 的场景尤其受益</text>
  <text x="90" y="486" font-size="10" fill="#b03a3a" font-weight="bold">关键不变式：idx2num 是唯一真值源</text>

  <!-- ===== Right: find ===== -->
  <g filter="url(#sk)"><rect x="450" y="70" width="370" height="460" rx="12" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="635" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">find(number)</text>

  <g filter="url(#sk)"><rect x="480" y="118" width="310" height="48" rx="8" fill="#fff" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <text x="635" y="148" text-anchor="middle" font-size="12" fill="#555">① 取 h = heaps[number]</text>
  <text x="635" y="162" text-anchor="middle" font-size="10" fill="#888">（不存在或为空 → 直接返回 −1）</text>
  <path d="M 635 170 L 635 188" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond decision -->
  <g filter="url(#sk)"><polygon points="635,190 760,240 635,290 510,240" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="635" y="232" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b03a3a">h 非空 且</text>
  <text x="635" y="250" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b03a3a">idx2num[h.top()]≠number?</text>
  <text x="635" y="270" text-anchor="middle" font-size="10" fill="#888">堆顶过期？</text>

  <!-- yes branch: pop, loop back -->
  <path d="M 760 240 Q 820 240 820 200 Q 820 160 760 150 L 790 150" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="818" y="200" text-anchor="middle" font-size="10.5" fill="#b03a3a" font-weight="bold">是</text>
  <g filter="url(#sk)"><rect x="660" y="300" width="240" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="780" y="322" text-anchor="middle" font-size="11.5" fill="#b03a3a">h.pop() 弹掉过期堆顶 → 回到判定</text>
  <path d="M 780 334 Q 780 360 700 360 Q 635 360 635 290" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>

  <!-- no branch: -->
  <path d="M 510 240 Q 470 240 470 300 L 470 360" stroke="#2e6e2e" stroke-width="1.8" fill="none" marker-end="url(#ary)" filter="url(#sk)"/>
  <text x="466" y="232" text-anchor="end" font-size="10.5" fill="#2e6e2e" font-weight="bold">否</text>

  <g filter="url(#sk)"><polygon points="635,360 760,410 635,460 510,410" fill="#fff" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="635" y="406" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">h 是否非空？</text>
  <text x="635" y="424" text-anchor="middle" font-size="10" fill="#888">（刚弹空也算）</text>

  <path d="M 510 410 Q 480 410 480 458" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 760 410 Q 790 410 790 458" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="478" y="430" text-anchor="end" font-size="10.5" fill="#888">否</text>
  <text x="792" y="430" font-size="10.5" fill="#2e6e2e">是</text>

  <g filter="url(#sk)"><rect x="450" y="460" width="60" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="480" y="485" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a">−1</text>
  <text x="480" y="516" text-anchor="middle" font-size="10" fill="#888">系统中无此数</text>

  <g filter="url(#sk)"><rect x="760" y="460" width="80" height="40" rx="6" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="800" y="486" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">h.top()</text>
  <text x="800" y="516" text-anchor="middle" font-size="10" fill="#888">最小下标</text>

  <text x="430" y="550" text-anchor="middle" font-size="10.5" fill="#888">find 的清理循环每弹一项均摊 O(log n)，全生命周期总弹出 ≤ 总压入，整体摊还高效</text>
</svg>
