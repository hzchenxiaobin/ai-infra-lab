<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n=3, wells=[1,2,2], pipes=[[1,2,1],[2,3,1]]</text>

  <!-- ===== Top: all edges sorted ===== -->
  <rect x="20" y="40" width="520" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="58" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">全部边按费用升序排列（井边用虚线框）</text>

  <rect x="40" y="66" width="84" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="82" y="84" text-anchor="middle" font-size="9.5" fill="#333">(0,1,1)</text>

  <rect x="134" y="66" width="84" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="176" y="84" text-anchor="middle" font-size="9.5" fill="#333">(1,2,1)</text>

  <rect x="228" y="66" width="84" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="270" y="84" text-anchor="middle" font-size="9.5" fill="#333">(2,3,1)</text>

  <rect x="322" y="66" width="84" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="364" y="84" text-anchor="middle" font-size="9.5" fill="#333">(0,2,2)</text>

  <rect x="416" y="66" width="84" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="458" y="84" text-anchor="middle" font-size="9.5" fill="#333">(0,3,2)</text>

  <line x1="280" y1="104" x2="280" y2="124" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Bottom: Kruskal steps table ===== -->
  <rect x="20" y="128" width="520" height="260" fill="#fff" stroke="#ccc" stroke-width="1.2" rx="10" filter="url(#rough2)"/>

  <!-- table header -->
  <rect x="30" y="138" width="500" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="154" font-size="10" fill="#446688" font-weight="bold">步骤</text>
  <text x="110" y="154" font-size="10" fill="#446688" font-weight="bold">边</text>
  <text x="200" y="154" font-size="10" fill="#446688" font-weight="bold">find(u) vs find(v)</text>
  <text x="320" y="154" font-size="10" fill="#446688" font-weight="bold">动作</text>
  <text x="410" y="154" font-size="10" fill="#446688" font-weight="bold">count / ans</text>

  <!-- step 1 -->
  <rect x="30" y="166" width="500" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="50" y="184" font-size="9.5" fill="#333">1</text>
  <text x="110" y="184" font-size="9.5" fill="#d6a040" font-weight="bold">(0,1,1) 井</text>
  <text x="200" y="184" font-size="9.5" fill="#333">0 ≠ 1</text>
  <text x="320" y="184" font-size="9.5" fill="#4a7a3a" font-weight="bold">union ✓</text>
  <text x="410" y="184" font-size="9.5" fill="#333">1 / 1</text>

  <!-- step 2 -->
  <rect x="30" y="196" width="500" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="50" y="214" font-size="9.5" fill="#333">2</text>
  <text x="110" y="214" font-size="9.5" fill="#4a7a3a" font-weight="bold">(1,2,1) 管</text>
  <text x="200" y="214" font-size="9.5" fill="#333">{0,1} ≠ 2</text>
  <text x="320" y="214" font-size="9.5" fill="#4a7a3a" font-weight="bold">union ✓</text>
  <text x="410" y="214" font-size="9.5" fill="#333">2 / 2</text>

  <!-- step 3 -->
  <rect x="30" y="226" width="500" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="50" y="244" font-size="9.5" fill="#333">3</text>
  <text x="110" y="244" font-size="9.5" fill="#4a7a3a" font-weight="bold">(2,3,1) 管</text>
  <text x="200" y="244" font-size="9.5" fill="#333">{0,1,2} ≠ 3</text>
  <text x="320" y="244" font-size="9.5" fill="#4a7a3a" font-weight="bold">union ✓ 完成</text>
  <text x="410" y="244" font-size="9.5" fill="#b85450" font-weight="bold">3=n / 3 ⭐</text>

  <!-- step 4: skipped -->
  <rect x="30" y="256" width="500" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="50" y="274" font-size="9.5" fill="#333">4</text>
  <text x="110" y="274" font-size="9.5" fill="#d6a040">(0,2,2) 井</text>
  <text x="200" y="274" font-size="9.5" fill="#333">—</text>
  <text x="320" y="274" font-size="9.5" fill="#b85450">已提前返回</text>
  <text x="410" y="274" font-size="9.5" fill="#888">—</text>

  <!-- step 5: skipped -->
  <rect x="30" y="286" width="500" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="50" y="304" font-size="9.5" fill="#333">5</text>
  <text x="110" y="304" font-size="9.5" fill="#d6a040">(0,3,2) 井</text>
  <text x="200" y="304" font-size="9.5" fill="#333">—</text>
  <text x="320" y="304" font-size="9.5" fill="#b85450">已提前返回</text>
  <text x="410" y="304" font-size="9.5" fill="#888">—</text>

  <!-- result -->
  <rect x="30" y="326" width="500" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="280" y="346" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">MST 选边：(0,1,1) + (1,2,1) + (2,3,1) = 3</text>
  <text x="280" y="364" text-anchor="middle" font-size="10" fill="#888">村 1 建井(cost 1) → 管 1-2(cost 1) → 管 2-3(cost 1)，村 2/3 接管不建井</text>
</svg>
