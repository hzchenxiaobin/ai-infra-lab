<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：用 freq &lt; k 的字符切分</text>

  <!-- String s = ababbc, k = 2 -->
  <text x="40" y="56" font-size="11.5" fill="#888" font-weight="bold">字符串 s = “ababbc”，k = 2</text>

  <!-- 6 char boxes: a b a b b c -->
  <rect x="110" y="64" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="86" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>

  <rect x="160" y="64" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="185" y="86" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>

  <rect x="210" y="64" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="235" y="86" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>

  <rect x="260" y="64" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="285" y="86" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>

  <rect x="310" y="64" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="335" y="86" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>

  <!-- c in red -->
  <rect x="360" y="64" width="50" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="385" y="86" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">c</text>

  <!-- Frequency table -->
  <text x="40" y="124" font-size="11.5" fill="#888" font-weight="bold">整串字符频率：</text>

  <rect x="150" y="110" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="190" y="129" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">a : 2 ✓</text>

  <rect x="240" y="110" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="129" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">b : 3 ✓</text>

  <rect x="330" y="110" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="380" y="129" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">c : 1 &lt; k ✗</text>

  <!-- Key insight -->
  <rect x="50" y="158" width="420" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="180" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">c 在整串只出现 1 次 &lt; k=2</text>
  <text x="260" y="200" text-anchor="middle" font-size="11" fill="#555">→ 任何含 c 的子串里，c 最多 1 次 &lt; k</text>
  <text x="260" y="220" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">→ c 绝不可能出现在合法子串中！</text>

  <!-- c acts as a wall -->
  <text x="40" y="256" font-size="11.5" fill="#888" font-weight="bold">把 c 当“墙”，切出墙之间的段：</text>

  <!-- segment ababb (green) -->
  <rect x="70" y="266" width="160" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="150" y="288" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">ababb</text>

  <!-- wall c (red) -->
  <rect x="240" y="262" width="40" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="289" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">c</text>
  <text x="260" y="320" text-anchor="middle" font-size="9.5" fill="#b85450">墙</text>

  <!-- empty segment -->
  <rect x="290" y="266" width="60" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="320" y="288" text-anchor="middle" font-size="11" fill="#999">（空）</text>

  <!-- recurse arrow on ababb -->
  <path d="M 150 300 L 150 318" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="100" y="320" width="100" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="150" y="337" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">递归 divide</text>

  <!-- Conclusion box -->
  <rect x="50" y="360" width="420" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="380" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">结论：freq&lt;k 的字符是天然分隔符，合法子串只在各段内部</text>
</svg>
