<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：枚举起点 i → 延伸终点 j → 哈希集合去重</text>

  <!-- nums label -->
  <text x="44" y="68" font-size="12" fill="#888" font-weight="bold">nums =</text>

  <!-- nums cells: 2 3 3 2 2, divisible (by p=2) highlighted -->
  <rect x="90" y="52" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="112" y="74" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="134" y="52" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="156" y="74" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="178" y="52" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="74" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="222" y="52" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="244" y="74" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="266" y="52" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="288" y="74" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>

  <!-- index header -->
  <text x="112" y="46" text-anchor="middle" font-size="9.5" fill="#888">0</text>
  <text x="156" y="46" text-anchor="middle" font-size="9.5" fill="#888">1</text>
  <text x="200" y="46" text-anchor="middle" font-size="9.5" fill="#888">2</text>
  <text x="244" y="46" text-anchor="middle" font-size="9.5" fill="#888">3</text>
  <text x="288" y="46" text-anchor="middle" font-size="9.5" fill="#888">4</text>

  <!-- legend -->
  <rect x="330" y="56" width="16" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="352" y="66" font-size="10.5" fill="#555">能被 p 整除</text>
  <rect x="330" y="74" width="16" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="352" y="84" font-size="10.5" fill="#555">不可整除</text>

  <!-- left part: for each i, extend j -->
  <text x="44" y="124" font-size="12" fill="#4a7a3a" font-weight="bold">① 每个 i 起点向右延伸 j：</text>

  <!-- i=0 window -->
  <rect x="90" y="138" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="134" y="138" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="178" y="138" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="222" y="138" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="112" y="156" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="156" y="156" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="200" y="156" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="244" y="156" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="76" y="156" text-anchor="end" font-size="10" fill="#4a7a3a" font-weight="bold">i=0,j=3</text>
  <text x="276" y="156" font-size="10" fill="#b85450" font-weight="bold">divCnt=2 ≤ k=2 ✓</text>

  <!-- i=0, j=4 (break) -->
  <rect x="90" y="172" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="134" y="172" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="178" y="172" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="222" y="172" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="266" y="172" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="76" y="190" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold">i=0,j=4</text>
  <text x="316" y="190" font-size="10" fill="#b85450" font-weight="bold">divCnt=3 &gt; k → break!</text>

  <!-- break hint -->
  <text x="44" y="216" font-size="10.5" fill="#d6a040" font-weight="bold">💡 divCnt 单调不减，超过 k 即可 break，不必再延伸</text>

  <!-- right part: hash set dedup -->
  <text x="44" y="252" font-size="12" fill="#4a7a3a" font-weight="bold">② 子数组序列化后丢入哈希集合去重：</text>

  <!-- set box -->
  <rect x="60" y="266" width="460" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="290" y="286" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">seen 集合（存 tuple / vector 序列）</text>
  <line x1="74" y1="294" x2="506" y2="294" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>

  <text x="78" y="312" font-size="11" fill="#333">(2,)</text>
  <text x="78" y="330" font-size="11" fill="#333">(2,3)</text>
  <text x="78" y="348" font-size="11" fill="#333">(2,3,3)</text>

  <text x="170" y="312" font-size="11" fill="#333">(2,3,3,2)</text>
  <text x="170" y="330" font-size="11" fill="#333">(3,)</text>
  <text x="170" y="348" font-size="11" fill="#333">(3,3)</text>

  <text x="270" y="312" font-size="11" fill="#333">(3,3,2)</text>
  <text x="270" y="330" font-size="11" fill="#333">(3,3,2,2)</text>
  <text x="270" y="348" font-size="11" fill="#333">(3,2)</text>

  <text x="380" y="312" font-size="11" fill="#333">(3,2,2)</text>
  <text x="380" y="330" font-size="11" fill="#333">(2,2)</text>
  <text x="380" y="348" font-size="11" fill="#888" font-style="italic">…共 11 个</text>

  <!-- arrow from nums to set -->
  <path d="M 200 206 Q 200 240 290 266" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="210" y="240" font-size="10" fill="#4a7a3a">序列化</text>

  <!-- footer -->
  <rect x="40" y="370" width="480" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="387" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">两步：divCnt 超限即 break 剪枝 + 元组入集合自动去重，答案 = |seen|</text>
</svg>
