<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 620" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="620" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">算法流程：排序 → 取查询 → k 扩展 → j 收缩 → ans=n−cnt.size()</text>

  <!-- Start -->
  <rect x="195" y="42" width="150" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="270" y="63" text-anchor="middle" font-size="12" fill="#333">开始：读入 n, logs, x, queries</text>

  <path d="M 270 76 L 270 94" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Init: sort + qs + cnt -->
  <rect x="110" y="96" width="320" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="116" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">初始化</text>
  <text x="270" y="132" text-anchor="middle" font-size="10" fill="#555">logs 按 time 排序；qs=(queries[i],i) 按 r 排序</text>
  <text x="270" y="146" text-anchor="middle" font-size="10" fill="#555">cnt=哈希表；j = k = 0</text>

  <path d="M 270 152 L 270 170" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Loop diamond: 还有未处理查询? -->
  <polygon points="270,172 382,216 270,260 158,216" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="212" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">qs 中还有查询?</text>
  <text x="270" y="228" text-anchor="middle" font-size="10" fill="#888">（按 r 升序依次取）</text>

  <!-- No branch -> return -->
  <path d="M 382 216 L 440 216" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="412" y="210" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="440" y="200" width="86" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="483" y="221" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">返回 ans</text>

  <!-- Yes branch down -->
  <path d="M 270 260 L 270 278" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="284" y="272" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Take query (r,i), l=r-x -->
  <rect x="150" y="280" width="240" height="44" fill="#f4f4f4" stroke="#888" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="270" y="298" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">取出 q = (r, i)，令 l = r − x</text>
  <text x="270" y="314" text-anchor="middle" font-size="10" fill="#888">窗口 = 闭区间 [l, r]</text>

  <path d="M 270 324 L 270 342" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- k expand -->
  <rect x="110" y="344" width="320" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="364" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">k 扩展（右端加入）</text>
  <text x="270" y="380" text-anchor="middle" font-size="10" fill="#555">while k&lt;len 且 logs[k].time ≤ r：</text>
  <text x="270" y="394" text-anchor="middle" font-size="10" fill="#555">cnt[logs[k].id] += 1；k += 1</text>

  <path d="M 270 400 L 270 418" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- j shrink -->
  <rect x="110" y="420" width="320" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="440" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">j 收缩（左端移除，先加后删）</text>
  <text x="270" y="456" text-anchor="middle" font-size="10" fill="#555">while j&lt;len 且 logs[j].time &lt; l：</text>
  <text x="270" y="470" text-anchor="middle" font-size="10" fill="#555">cnt[logs[j].id] −= 1；归零则删键</text>
  <text x="270" y="478" text-anchor="middle" font-size="9" fill="#888">j += 1</text>

  <path d="M 270 484 L 270 502" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- compute ans -->
  <rect x="120" y="504" width="300" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="524" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">记录答案</text>
  <text x="270" y="540" text-anchor="middle" font-size="10" fill="#555">ans[i] = n − cnt.size()  （无请求数 = 总数 − 有请求数）</text>

  <!-- loop back arrow: from ans box up to decision diamond on the left -->
  <path d="M 120 526 L 60 526 L 60 216 L 158 216" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)" stroke-dasharray="5,3"/>
  <text x="40" y="376" font-size="10" fill="#446688" font-weight="bold">回</text>
  <text x="40" y="390" font-size="10" fill="#446688" font-weight="bold">到</text>
  <text x="40" y="404" font-size="10" fill="#446688" font-weight="bold">判</text>
  <text x="40" y="418" font-size="10" fill="#446688" font-weight="bold">定</text>

  <!-- Complexity note -->
  <rect x="20" y="566" width="500" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="270" y="586" text-anchor="middle" font-size="10" fill="#555">· 排序 logs O(L log L)、排序 qs O(Q log Q)；j、k 各遍历 logs 一次 O(L)</text>
  <text x="270" y="602" text-anchor="middle" font-size="10" fill="#555">· 每查询均摊 O(1)；空间 O(L+Q)。整体 O((L+Q) log(L+Q) + L + Q)</text>
</svg>
