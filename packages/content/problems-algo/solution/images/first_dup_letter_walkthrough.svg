<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "abccbaacz" 逐步执行</text>

  <!-- table outer frame -->
  <rect x="50" y="46" width="470" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <!-- column dividers for header -->
  <line x1="110" y1="46" x2="110" y2="80" stroke="#446688" stroke-width="1.2"/>
  <line x1="165" y1="46" x2="165" y2="80" stroke="#446688" stroke-width="1.2"/>
  <line x1="325" y1="46" x2="325" y2="80" stroke="#446688" stroke-width="1.2"/>
  <line x1="405" y1="46" x2="405" y2="80" stroke="#446688" stroke-width="1.2"/>
  <!-- header texts -->
  <text x="80" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">i</text>
  <text x="137" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">s[i]</text>
  <text x="245" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">seen（处理前）</text>
  <text x="365" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">命中?</text>
  <text x="462" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">动作</text>

  <!-- row 0: i=0, a, ∅, 否, seen={a} -->
  <rect x="50" y="80" width="470" height="34" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="110" y1="80" x2="110" y2="114" stroke="#446688" stroke-width="1"/>
  <line x1="165" y1="80" x2="165" y2="114" stroke="#446688" stroke-width="1"/>
  <line x1="325" y1="80" x2="325" y2="114" stroke="#446688" stroke-width="1"/>
  <line x1="405" y1="80" x2="405" y2="114" stroke="#446688" stroke-width="1"/>
  <text x="80" y="102" text-anchor="middle" font-size="12.5" fill="#333">0</text>
  <text x="137" y="102" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <text x="245" y="102" text-anchor="middle" font-size="12" fill="#888">∅</text>
  <text x="365" y="102" text-anchor="middle" font-size="12" fill="#4a7a3a">否</text>
  <text x="462" y="102" text-anchor="middle" font-size="12" fill="#333">seen = {a}</text>

  <!-- row 1: i=1, b, {a}, 否, seen={a,b} -->
  <rect x="50" y="114" width="470" height="34" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="110" y1="114" x2="110" y2="148" stroke="#446688" stroke-width="1"/>
  <line x1="165" y1="114" x2="165" y2="148" stroke="#446688" stroke-width="1"/>
  <line x1="325" y1="114" x2="325" y2="148" stroke="#446688" stroke-width="1"/>
  <line x1="405" y1="114" x2="405" y2="148" stroke="#446688" stroke-width="1"/>
  <text x="80" y="136" text-anchor="middle" font-size="12.5" fill="#333">1</text>
  <text x="137" y="136" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <text x="245" y="136" text-anchor="middle" font-size="12" fill="#333">{a}</text>
  <text x="365" y="136" text-anchor="middle" font-size="12" fill="#4a7a3a">否</text>
  <text x="462" y="136" text-anchor="middle" font-size="12" fill="#333">seen = {a,b}</text>

  <!-- row 2: i=2, c, {a,b}, 否, seen={a,b,c} -->
  <rect x="50" y="148" width="470" height="34" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="110" y1="148" x2="110" y2="182" stroke="#446688" stroke-width="1"/>
  <line x1="165" y1="148" x2="165" y2="182" stroke="#446688" stroke-width="1"/>
  <line x1="325" y1="148" x2="325" y2="182" stroke="#446688" stroke-width="1"/>
  <line x1="405" y1="148" x2="405" y2="182" stroke="#446688" stroke-width="1"/>
  <text x="80" y="170" text-anchor="middle" font-size="12.5" fill="#333">2</text>
  <text x="137" y="170" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>
  <text x="245" y="170" text-anchor="middle" font-size="12" fill="#333">{a,b}</text>
  <text x="365" y="170" text-anchor="middle" font-size="12" fill="#4a7a3a">否</text>
  <text x="462" y="170" text-anchor="middle" font-size="12" fill="#333">seen = {a,b,c}</text>

  <!-- row 3: i=3, c, {a,b,c}, 是 (HIGHLIGHT RED), 返回 'c' ✓ -->
  <rect x="50" y="182" width="470" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <line x1="110" y1="182" x2="110" y2="222" stroke="#b85450" stroke-width="1.2"/>
  <line x1="165" y1="182" x2="165" y2="222" stroke="#b85450" stroke-width="1.2"/>
  <line x1="325" y1="182" x2="325" y2="222" stroke="#b85450" stroke-width="1.2"/>
  <line x1="405" y1="182" x2="405" y2="222" stroke="#b85450" stroke-width="1.2"/>
  <text x="80" y="207" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">3</text>
  <text x="137" y="207" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">c</text>
  <text x="245" y="207" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">{a,b,c}</text>
  <text x="365" y="207" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">是</text>
  <text x="462" y="207" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 'c' ✓</text>

  <!-- bottom note -->
  <text x="50" y="252" font-size="11.5" fill="#555">第二次出现下标：'a'→5, 'b'→4, 'c'→3；最小为 3，故 'c' 即答案。</text>
  <text x="50" y="272" font-size="11" fill="#888">从左到右扫描，i=3 首次命中，无需继续往后看 a(6)/c(7)/z(8)。</text>
</svg>
