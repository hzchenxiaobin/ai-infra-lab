<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
    <marker id="arrOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#d6a040" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：从右向左遍历，计数达 3 即插点</text>

  <!-- Step 1: special case -->
  <rect x="160" y="46" width="200" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">若 n == 0，直接返回 "0"</text>
  <path d="M 260 80 L 260 94" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: init -->
  <rect x="140" y="96" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="118" text-anchor="middle" font-size="11" fill="#333">s = str(n)；res = []；cnt = 0</text>
  <path d="M 260 130 L 260 142" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop container (dashed) -->
  <rect x="44" y="146" width="432" height="186" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="5,3" rx="10" filter="url(#rough2)"/>
  <text x="60" y="164" font-size="10" fill="#888" font-weight="bold">↻ 循环体：i 从 len(s)-1 → 0（从右向左）</text>

  <!-- Step 3: append digit -->
  <rect x="150" y="174" width="220" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="195" text-anchor="middle" font-size="11" fill="#333">res.append(s[i])；cnt += 1</text>
  <path d="M 260 206 L 260 218" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: diamond decision -->
  <polygon points="260,220 360,254 260,288 160,254" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="252" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">cnt == 3</text>
  <text x="260" y="266" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">且 i &gt; 0 ?</text>

  <!-- Yes branch (right) -->
  <text x="380" y="250" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">是</text>
  <path d="M 360 254 L 388 254" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>
  <rect x="390" y="236" width="82" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="431" y="252" text-anchor="middle" font-size="10" fill="#333">res.append('.')</text>
  <text x="431" y="266" text-anchor="middle" font-size="10" fill="#333">cnt = 0</text>
  <!-- Yes box down then left to merge -->
  <path d="M 431 274 L 431 300 L 260 300" stroke="#d6a040" stroke-width="1.3" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- No branch (down) -->
  <text x="276" y="304" text-anchor="start" font-size="11" fill="#888" font-weight="bold">否</text>
  <path d="M 260 288 L 260 300" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- merge note -->
  <text x="260" y="316" text-anchor="middle" font-size="9.5" fill="#888">（取下一位 i−1，回到循环顶部）</text>

  <!-- Exit arrow (loop ends) -->
  <path d="M 260 332 L 260 346" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="342" text-anchor="start" font-size="9.5" fill="#888">i &lt; 0 退出</text>

  <!-- Step 5: reverse and join -->
  <rect x="130" y="348" width="260" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="370" text-anchor="middle" font-size="11" fill="#333">reverse(res)；拼接为字符串</text>
  <path d="M 260 382 L 260 394" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Return -->
  <rect x="180" y="396" width="160" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="418" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return 结果字符串</text>

  <!-- Why reverse callout -->
  <rect x="392" y="348" width="118" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="451" y="366" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">为何要 reverse？</text>
  <text x="451" y="380" text-anchor="middle" font-size="9" fill="#444">从右向左追加</text>
  <text x="451" y="391" text-anchor="middle" font-size="9" fill="#444">得到的是逆序串</text>
</svg>
