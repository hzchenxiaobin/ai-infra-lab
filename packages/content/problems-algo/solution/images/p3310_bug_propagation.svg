<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">传染闭包：可疑集合 = 从 k 出发沿调用边可达的方法</text>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">示例 2：n=5，k=0，invocations=[[1,2],[0,2],[0,1],[3,4]]</text>

  <!-- 可疑集合虚线圈 -->
  <ellipse cx="185" cy="168" rx="132" ry="95" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="7,5" filter="url(#rough2)"/>
  <text x="185" y="66" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">可疑集合 S —— 整组待删</text>

  <!-- 调用边 -->
  <path d="M 124 202 L 252 192" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 112 191 L 144 131" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 167 128 L 257 176" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 421 137 L 444 207" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- 节点 -->
  <circle cx="105" cy="210" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="105" y="215" text-anchor="middle" font-size="13" fill="#7a3530" font-weight="bold" filter="url(#rough2)">0</text>
  <circle cx="155" cy="115" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="155" y="120" text-anchor="middle" font-size="13" fill="#7a3530" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="270" cy="190" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="195" text-anchor="middle" font-size="13" fill="#7a3530" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="415" cy="120" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="415" y="125" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <circle cx="448" cy="225" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="448" y="230" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- k 徽章 + 注记 -->
  <circle cx="66" cy="222" r="11" fill="#b85450" filter="url(#rough2)"/>
  <text x="66" y="226" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold" filter="url(#rough2)">k</text>
  <text x="108" y="250" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">（bug 源头）</text>
  <text x="432" y="92" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">圈外：安然无恙</text>
  <text x="459" y="174" font-size="9" fill="#666" filter="url(#rough2)">调用</text>

  <!-- 底部结论 -->
  <rect x="34" y="290" width="452" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="312" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">传染规则：a 调用 b ⇒ b 直接 / 间接可疑 —— 只顺流、不逆流，成环也不怕（已标记就跳过）</text>
  <text x="260" y="332" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">S = k 在调用图上的「可达集合」⇒ 一次 BFS / DFS 顺带全部标记，O(n + m)</text>
</svg>
