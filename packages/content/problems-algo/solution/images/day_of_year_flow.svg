<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：解析 → 闰年判定 → 查前缀和 → 修正 → 返回</text>

  <!-- Box 1: parse -->
  <rect x="140" y="44" width="240" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="67" text-anchor="middle" font-size="12" fill="#333">① 解析 date → Y, M, D (stoi + substr)</text>

  <path d="M 260 80 L 260 92" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 2: leap year -->
  <rect x="140" y="92" width="240" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="115" text-anchor="middle" font-size="10.5" fill="#333">② leap = (Y%4==0 ∧ Y%100≠0) ∨ Y%400==0</text>

  <path d="M 260 128 L 260 140" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 3: prefix lookup -->
  <rect x="140" y="140" width="240" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="163" text-anchor="middle" font-size="12" fill="#333">③ base = prefix[M−1]  (平年前缀和表)</text>

  <path d="M 260 176 L 260 188" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: leap ∧ M>2? -->
  <polygon points="260,190 345,214 260,238 175,214" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="218" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">leap ∧ M&gt;2?</text>

  <!-- Yes branch (right) -->
  <path d="M 345 214 L 370 214" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="358" y="208" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="372" y="198" width="100" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="422" y="218" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">base += 1</text>
  <path d="M 422 230 L 422 260 L 260 260" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- No branch (down) -->
  <path d="M 260 238 L 260 260" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="272" y="252" text-anchor="start" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- Arrow merge→box4 -->
  <path d="M 260 260 L 260 272" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 4: return -->
  <rect x="140" y="272" width="240" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="295" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">④ return base + D</text>

  <text x="260" y="332" text-anchor="middle" font-size="11" fill="#888">全程 O(1)：解析 O(1) + 闰年判定 O(1) + 查表 O(1) + 修正 O(1)</text>
</svg>
