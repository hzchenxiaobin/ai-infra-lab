<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：DFS 索引下传 + 叶子判末位 + || 短路</text>

  <!-- entry -->
  <rect x="210" y="42" width="140" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">dfs(node, i)</text>
  <path d="M 280 74 L 280 92" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision 1: node == null -->
  <polygon points="280,96 360,136 280,176 200,136" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="132" text-anchor="middle" font-size="11" fill="#333">node == null</text>
  <text x="280" y="148" text-anchor="middle" font-size="11" fill="#333">或 i 越界?</text>
  <!-- yes -> false -->
  <path d="M 200 136 L 120 136 L 120 168" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="150" y="128" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="76" y="170" width="88" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="120" y="188" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return false</text>
  <!-- no -> down -->
  <path d="M 280 176 L 280 198" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="190" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- decision 2: val mismatch -->
  <polygon points="280,202 372,244 280,286 188,244" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="240" text-anchor="middle" font-size="11" fill="#333">node.val</text>
  <text x="280" y="256" text-anchor="middle" font-size="11" fill="#333">!= arr[i] ?</text>
  <!-- yes -> false -->
  <path d="M 188 244 L 120 244 L 120 276" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="150" y="236" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="76" y="278" width="88" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="120" y="296" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return false</text>
  <!-- no -> down -->
  <path d="M 280 286 L 280 308" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="300" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- decision 3: leaf? -->
  <polygon points="280,312 366,350 280,388 194,350" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="346" text-anchor="middle" font-size="11" fill="#333">叶子?</text>
  <text x="280" y="362" text-anchor="middle" font-size="10" fill="#888">(左右都空)</text>
  <!-- yes -> return i == len-1 -->
  <path d="M 194 350 L 150 350 L 150 372" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="172" y="342" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="62" y="374" width="176" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="150" y="394" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return i == len(arr)-1</text>

  <!-- no -> internal: recurse -->
  <path d="M 366 350 L 430 350" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="398" y="342" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">否</text>
  <rect x="432" y="320" width="116" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="490" y="342" text-anchor="middle" font-size="10" fill="#333">内部节点</text>
  <text x="490" y="358" text-anchor="middle" font-size="10" fill="#333">下传 i+1</text>
  <text x="490" y="372" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">dfs(L,i+1)||dfs(R,i+1)</text>

  <!-- note box -->
  <rect x="432" y="120" width="116" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="490" y="138" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">三重短路</text>
  <text x="490" y="156" text-anchor="middle" font-size="9" fill="#555">① 空节点/越界 → false</text>
  <text x="490" y="170" text-anchor="middle" font-size="9" fill="#555">② 值不等 → false</text>
  <text x="490" y="184" text-anchor="middle" font-size="9" fill="#555">③ 叶子判 i==末位</text>
  <text x="490" y="200" text-anchor="middle" font-size="9" fill="#555">|| 命中即停</text>
</svg>
