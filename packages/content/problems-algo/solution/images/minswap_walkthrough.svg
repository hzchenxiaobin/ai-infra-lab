<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s1="xy", s2="yx" → 2 次交换</text>

  <!-- Step 0: Initial state -->
  <text x="30" y="56" font-size="12" fill="#555" font-weight="bold">初始状态</text>
  <text x="30" y="74" font-size="11" fill="#888">s1:</text>
  <rect x="70" y="60" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="88" y="79" text-anchor="middle" font-size="13" fill="#333">x</text>
  <rect x="108" y="60" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="126" y="79" text-anchor="middle" font-size="13" fill="#333">y</text>

  <text x="30" y="100" font-size="11" fill="#888">s2:</text>
  <rect x="70" y="86" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="88" y="105" text-anchor="middle" font-size="13" fill="#b85450">y</text>
  <rect x="108" y="86" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="126" y="105" text-anchor="middle" font-size="13" fill="#d6a040">x</text>

  <text x="160" y="79" font-size="10" fill="#b85450">xy型</text>
  <text x="160" y="105" font-size="10" fill="#d6a040">yx型</text>

  <rect x="230" y="66" width="260" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="360" y="87" text-anchor="middle" font-size="11" fill="#444">xy=1, yx=1, 总失配=2（偶数）✓</text>

  <!-- Arrow down -->
  <path d="M 280 112 L 280 126" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 1: First swap -->
  <text x="30" y="146" font-size="12" fill="#555" font-weight="bold">第 1 次交换：s1[0](x) ↔ s2[0](y)</text>

  <!-- Before swap with arrow -->
  <text x="30" y="170" font-size="11" fill="#888">s1:</text>
  <rect x="70" y="156" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="88" y="175" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">x</text>
  <rect x="108" y="156" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="126" y="175" text-anchor="middle" font-size="13" fill="#333">y</text>

  <text x="30" y="196" font-size="11" fill="#888">s2:</text>
  <rect x="70" y="182" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="88" y="201" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">y</text>
  <rect x="108" y="182" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="126" y="201" text-anchor="middle" font-size="13" fill="#d6a040">x</text>

  <path d="M 88 184 L 88 158" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="3,2" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <path d="M 160 190 L 200 190" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- After swap -->
  <text x="220" y="170" font-size="11" fill="#888">→ s1:</text>
  <rect x="260" y="156" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="278" y="175" text-anchor="middle" font-size="13" fill="#4a7a3a">y</text>
  <rect x="298" y="156" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="316" y="175" text-anchor="middle" font-size="13" fill="#333">y</text>

  <text x="220" y="196" font-size="11" fill="#888">→ s2:</text>
  <rect x="260" y="182" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="278" y="201" text-anchor="middle" font-size="13" fill="#4a7a3a">x</text>
  <rect x="298" y="182" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="316" y="201" text-anchor="middle" font-size="13" fill="#d6a040">x</text>

  <text x="350" y="175" font-size="10" fill="#4a7a3a">✓ 位置0已匹配</text>
  <text x="350" y="201" font-size="10" fill="#d6a040">位置1: 变成 yx型</text>

  <!-- Arrow down -->
  <path d="M 280 216 L 280 230" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: Second swap -->
  <text x="30" y="250" font-size="12" fill="#555" font-weight="bold">第 2 次交换：s1[0](y) ↔ s2[1](x)</text>

  <text x="30" y="274" font-size="11" fill="#888">s1:</text>
  <rect x="70" y="260" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="88" y="279" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">y</text>
  <rect x="108" y="260" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="126" y="279" text-anchor="middle" font-size="13" fill="#333">y</text>

  <text x="30" y="300" font-size="11" fill="#888">s2:</text>
  <rect x="70" y="286" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="88" y="305" text-anchor="middle" font-size="13" fill="#4a7a3a">x</text>
  <rect x="108" y="286" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="126" y="305" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">x</text>

  <path d="M 88 262 L 126 288" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="3,2" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <path d="M 160 294 L 200 294" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- After swap -->
  <text x="220" y="274" font-size="11" fill="#888">→ s1:</text>
  <rect x="260" y="260" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="278" y="279" text-anchor="middle" font-size="13" fill="#4a7a3a">x</text>
  <rect x="298" y="260" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="316" y="279" text-anchor="middle" font-size="13" fill="#4a7a3a">y</text>

  <text x="220" y="300" font-size="11" fill="#888">→ s2:</text>
  <rect x="260" y="286" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="278" y="305" text-anchor="middle" font-size="13" fill="#4a7a3a">x</text>
  <rect x="298" y="286" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="316" y="305" text-anchor="middle" font-size="13" fill="#4a7a3a">y</text>

  <text x="350" y="294" font-size="11" fill="#4a7a3a" font-weight="bold">✓ s1 == s2!</text>

  <!-- Summary -->
  <rect x="60" y="338" width="440" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="356" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">公式验证：xy=1, yx=1 → 1//2 + 1//2 + 2×(1%2) = 0+0+2 = 2 ✓</text>
  <text x="280" y="372" text-anchor="middle" font-size="11" fill="#888">1个xy + 1个yx 无法直接配对，先转化为2个同类型再用1次修复</text>

  <!-- Another example -->
  <rect x="60" y="398" width="440" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="416" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">另一例：s1="xx", s2="yy" → xy=2, yx=0 → 2//2+0//2+0 = 1</text>
  <text x="280" y="432" text-anchor="middle" font-size="11" fill="#888">两个xy型，1次交换 s1[0]↔s2[1] 即可全部修复</text>
</svg>
