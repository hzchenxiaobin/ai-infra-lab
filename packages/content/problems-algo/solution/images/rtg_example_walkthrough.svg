<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：9 行输入 → 每日聚合 → 补齐 (F,3)=0 → 累计求和</text>

  <!-- ============ Panel 1: Input Scores ============ -->
  <text x="95" y="48" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① 输入 Scores（9 行）</text>

  <!-- header -->
  <rect x="18" y="56" width="160" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="42" y="70" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">name</text>
  <text x="82" y="70" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">g</text>
  <text x="108" y="70" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">day</text>
  <text x="150" y="70" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">pts</text>
  <line x1="62" y1="56" x2="62" y2="76" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="92" y1="56" x2="92" y2="76" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="124" y1="56" x2="124" y2="76" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- 9 rows, 16px each, starting y=76 -->
  <rect x="18" y="76" width="160" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="42" y="87" text-anchor="middle" font-size="8" fill="#4a7a3a">Aron</text>
  <text x="82" y="87" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">F</text>
  <text x="108" y="87" text-anchor="middle" font-size="8" fill="#4a7a3a">1</text>
  <text x="150" y="87" text-anchor="middle" font-size="8" fill="#4a7a3a">17</text>

  <rect x="18" y="92" width="160" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="42" y="103" text-anchor="middle" font-size="8" fill="#4a7a3a">Alice</text>
  <text x="82" y="103" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">F</text>
  <text x="108" y="103" text-anchor="middle" font-size="8" fill="#4a7a3a">1</text>
  <text x="150" y="103" text-anchor="middle" font-size="8" fill="#4a7a3a">23</text>

  <rect x="18" y="108" width="160" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="42" y="119" text-anchor="middle" font-size="8" fill="#4a7a3a">Bajkal</text>
  <text x="82" y="119" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">F</text>
  <text x="108" y="119" text-anchor="middle" font-size="8" fill="#4a7a3a">1</text>
  <text x="150" y="119" text-anchor="middle" font-size="8" fill="#4a7a3a">17</text>

  <rect x="18" y="124" width="160" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="42" y="135" text-anchor="middle" font-size="8" fill="#446688">Aron</text>
  <text x="82" y="135" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">M</text>
  <text x="108" y="135" text-anchor="middle" font-size="8" fill="#446688">1</text>
  <text x="150" y="135" text-anchor="middle" font-size="8" fill="#446688">36</text>

  <rect x="18" y="140" width="160" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="42" y="151" text-anchor="middle" font-size="8" fill="#4a7a3a">Alice</text>
  <text x="82" y="151" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">F</text>
  <text x="108" y="151" text-anchor="middle" font-size="8" fill="#4a7a3a">2</text>
  <text x="150" y="151" text-anchor="middle" font-size="8" fill="#4a7a3a">35</text>

  <rect x="18" y="156" width="160" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="42" y="167" text-anchor="middle" font-size="8" fill="#446688">Bajkal</text>
  <text x="82" y="167" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">M</text>
  <text x="108" y="167" text-anchor="middle" font-size="8" fill="#446688">2</text>
  <text x="150" y="167" text-anchor="middle" font-size="8" fill="#446688">99</text>

  <rect x="18" y="172" width="160" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="42" y="183" text-anchor="middle" font-size="8" fill="#4a7a3a">Aron</text>
  <text x="82" y="183" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">F</text>
  <text x="108" y="183" text-anchor="middle" font-size="8" fill="#4a7a3a">2</text>
  <text x="150" y="183" text-anchor="middle" font-size="8" fill="#4a7a3a">14</text>

  <rect x="18" y="188" width="160" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="42" y="199" text-anchor="middle" font-size="8" fill="#446688">Alice</text>
  <text x="82" y="199" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">M</text>
  <text x="108" y="199" text-anchor="middle" font-size="8" fill="#446688">3</text>
  <text x="150" y="199" text-anchor="middle" font-size="8" fill="#446688">87</text>

  <rect x="18" y="204" width="160" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="42" y="215" text-anchor="middle" font-size="8" fill="#446688">Bajkal</text>
  <text x="82" y="215" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">M</text>
  <text x="108" y="215" text-anchor="middle" font-size="8" fill="#446688">3</text>
  <text x="150" y="215" text-anchor="middle" font-size="8" fill="#446688">17</text>

  <text x="98" y="234" text-anchor="middle" font-size="8.5" fill="#555">注意：第 3 天<tspan fill="#b85450" font-weight="bold">无 F</tspan>记录</text>

  <!-- arrow panel1 -> panel2 -->
  <path d="M180 140 L196 140" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="188" y="133" text-anchor="middle" font-size="7.5" fill="#d6a040">GROUP</text>

  <!-- ============ Panel 2: daily aggregation ============ -->
  <text x="278" y="48" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">② 每日聚合 daily（5 行 + 缺口）</text>

  <rect x="208" y="56" width="140" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="240" y="70" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">gender</text>
  <text x="290" y="70" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">day</text>
  <text x="330" y="70" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">pts</text>
  <line x1="268" y1="56" x2="268" y2="76" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="310" y1="56" x2="310" y2="76" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <rect x="208" y="76" width="140" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="240" y="89" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">F</text>
  <text x="290" y="89" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="330" y="89" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">57</text>

  <rect x="208" y="94" width="140" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="240" y="107" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">F</text>
  <text x="290" y="107" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="330" y="107" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">49</text>

  <!-- gap row -->
  <rect x="208" y="112" width="140" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" stroke-dasharray="3,2" rx="2" filter="url(#rough2)"/>
  <text x="240" y="125" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">F</text>
  <text x="290" y="125" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">3</text>
  <text x="330" y="125" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">—</text>
  <text x="354" y="125" font-size="8" fill="#b85450" font-weight="bold">缺</text>

  <rect x="208" y="130" width="140" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="240" y="143" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">M</text>
  <text x="290" y="143" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">1</text>
  <text x="330" y="143" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">36</text>

  <rect x="208" y="148" width="140" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="240" y="161" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">M</text>
  <text x="290" y="161" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">2</text>
  <text x="330" y="161" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">99</text>

  <rect x="208" y="166" width="140" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="240" y="179" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">M</text>
  <text x="290" y="179" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">3</text>
  <text x="330" y="179" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">104</text>

  <rect x="208" y="192" width="140" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="206" font-size="8.5" fill="#333">CROSS JOIN 补齐</text>
  <text x="220" y="218" font-size="8.5" fill="#333">(F,3) ← COALESCE(0)</text>
  <text x="220" y="229" font-size="8" fill="#d6a040" font-weight="bold">网格变成 6 行</text>

  <!-- arrow panel2 -> panel3 -->
  <path d="M350 158 L372 158" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="361" y="151" text-anchor="middle" font-size="7.5" fill="#d6a040">SUM</text>
  <text x="361" y="168" text-anchor="middle" font-size="7.5" fill="#d6a040">OVER</text>

  <!-- ============ Panel 3: output ============ -->
  <text x="465" y="48" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">③ 累计输出（6 行）</text>

  <rect x="385" y="56" width="160" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="415" y="70" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">gender</text>
  <text x="455" y="70" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">day</text>
  <text x="510" y="70" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">total</text>
  <line x1="440" y1="56" x2="440" y2="76" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="475" y1="56" x2="475" y2="76" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <rect x="385" y="76" width="160" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="415" y="89" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">F</text>
  <text x="455" y="89" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="510" y="89" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">57</text>

  <rect x="385" y="94" width="160" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="415" y="107" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">F</text>
  <text x="455" y="107" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="510" y="107" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">106</text>

  <!-- the carry row -->
  <rect x="385" y="112" width="160" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
  <text x="415" y="125" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">F</text>
  <text x="455" y="125" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">3</text>
  <text x="510" y="125" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">106</text>
  <text x="552" y="125" font-size="7.5" fill="#d6a040" font-weight="bold">沿用</text>

  <rect x="385" y="130" width="160" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="415" y="143" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">M</text>
  <text x="455" y="143" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">1</text>
  <text x="510" y="143" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">36</text>

  <rect x="385" y="148" width="160" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="415" y="161" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">M</text>
  <text x="455" y="161" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">2</text>
  <text x="510" y="161" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">135</text>

  <rect x="385" y="166" width="160" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="415" y="179" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">M</text>
  <text x="455" y="179" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">3</text>
  <text x="510" y="179" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">239</text>

  <!-- cumulative calc annotations on right -->
  <text x="465" y="200" text-anchor="middle" font-size="8" fill="#555">累计计算（按 gender 分区）：</text>
  <rect x="395" y="206" width="150" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="404" y="220" font-size="8" fill="#4a7a3a">F: 57 → 57+49 → +0</text>
  <text x="404" y="232" font-size="8" fill="#4a7a3a">   = 57, 106, 106</text>
  <text x="404" y="246" font-size="8" fill="#446688">M: 36 → 36+99 → +104</text>
  <text x="404" y="258" font-size="8" fill="#446688">   = 36, 135, 239</text>
  <text x="404" y="272" font-size="8" fill="#d6a040" font-weight="bold">F3 沿用 106 ✓</text>

  <!-- bottom note -->
  <rect x="18" y="296" width="524" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="36" y="314" font-size="10" fill="#333">9 行输入 → GROUP BY 聚合成 5 行（每(g,d)一行）→ CROSS JOIN 补成 6 行网格（(F,3) 填 0）→</text>
  <text x="36" y="330" font-size="10" fill="#333">SUM OVER 累计：F 得 57/106/<tspan fill="#d6a040" font-weight="bold">106(沿用)</tspan>，M 得 36/135/239。关键在不漏 <tspan fill="#b85450" font-weight="bold">(F,3)</tspan> 这一行。</text>

  <!-- extra space filler note -->
  <rect x="18" y="350" width="524" height="98" fill="#fafafa" stroke="none"/>
  <text x="280" y="372" text-anchor="middle" font-size="10" fill="#888">同色按性别区分：F（绿） / M（蓝）；缺口（红虚）→ 补齐（橙）→ 沿用（橙）</text>
</svg>
