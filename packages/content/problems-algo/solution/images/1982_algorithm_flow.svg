<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 680" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="680" fill="#fafafa"/>

  <text x="290" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">从子集和还原数组：分治配对算法流程</text>

  <!-- N1 start -->
  <ellipse cx="290" cy="52" rx="150" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="56" text-anchor="middle" font-size="11" fill="#333">dfs(n, sums)  // sums 已升序排序</text>
  <path d="M 290 72 L 290 86" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- N2 diamond n==1? -->
  <polygon points="290,88 380,118 290,148 200,118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="122" text-anchor="middle" font-size="12" fill="#333">n == 1 ?</text>
  <!-- Yes -> base box (right) -->
  <path d="M 380 118 L 410 118" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="395" y="110" text-anchor="middle" font-size="11" fill="#82b366">是</text>
  <rect x="410" y="92" width="150" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="485" y="111" text-anchor="middle" font-size="10.5" fill="#333">基准：{a,b} 必含 0</text>
  <text x="485" y="127" text-anchor="middle" font-size="10.5" fill="#333">→ 返回 [另一值]</text>
  <text x="485" y="142" text-anchor="middle" font-size="10" fill="#b85450">否则返回 None</text>

  <!-- No down -->
  <path d="M 290 148 L 290 164" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="302" y="160" font-size="11" fill="#b85450">否</text>

  <!-- N3 diamond all zero? -->
  <polygon points="290,166 380,196 290,226 200,196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="200" text-anchor="middle" font-size="12" fill="#333">sums 全为 0 ?</text>
  <path d="M 380 196 L 410 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="395" y="188" text-anchor="middle" font-size="11" fill="#82b366">是</text>
  <rect x="410" y="176" width="150" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="485" y="201" text-anchor="middle" font-size="11" fill="#333">返回 [0] × n</text>

  <path d="M 290 226 L 290 242" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="302" y="238" font-size="11" fill="#b85450">否</text>

  <!-- N4 box d -->
  <rect x="170" y="244" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="266" text-anchor="middle" font-size="11.5" fill="#333">d = sums[1] − sums[0]   (= 最小 |元素|)</text>
  <path d="M 290 278 L 290 292" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- N5 loop box -->
  <rect x="170" y="294" width="240" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="316" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">for x ∈ { d, −d }：尝试两种符号</text>
  <path d="M 290 328 L 290 342" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- N6 partition box -->
  <rect x="150" y="344" width="280" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="363" text-anchor="middle" font-size="11" fill="#333">计数器按 (v, v+d) 贪心配对，构建 L_new</text>
  <text x="290" y="380" text-anchor="middle" font-size="10.5" fill="#888">x &gt; 0 保留 v（小）；x &lt; 0 保留 v+d（大）</text>
  <path d="M 290 390 L 290 404" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- N7 diamond pair ok & 0 in L? -->
  <polygon points="290,406 385,440 290,474 195,440" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="436" text-anchor="middle" font-size="11.5" fill="#333">配对完整</text>
  <text x="290" y="452" text-anchor="middle" font-size="11.5" fill="#333">且 0 ∈ L_new ?</text>
  <!-- No -> loop back (left) -->
  <path d="M 195 440 L 40 440 L 40 311 L 168 311" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="40" y="380" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 40 380)">失败→换符号</text>
  <text x="186" y="432" text-anchor="end" font-size="11" fill="#b85450">否</text>

  <path d="M 290 474 L 290 488" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="302" y="484" font-size="11" fill="#82b366">是</text>

  <!-- N8 recurse box -->
  <rect x="170" y="490" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="512" text-anchor="middle" font-size="11.5" fill="#333">sub = dfs(n − 1, L_new)</text>
  <path d="M 290 524 L 290 538" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- N9 diamond sub != None? -->
  <polygon points="290,540 375,572 290,604 205,572" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="576" text-anchor="middle" font-size="12" fill="#333">sub ≠ None ?</text>
  <!-- No -> loop back (left, inner) -->
  <path d="M 205 572 L 62 572 L 62 318 L 168 318" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="62" y="460" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 62 460)">空→换符号</text>
  <text x="196" y="564" text-anchor="end" font-size="11" fill="#b85450">否</text>

  <path d="M 290 604 L 290 618" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="302" y="614" font-size="11" fill="#82b366">是</text>

  <!-- N10 end -->
  <rect x="170" y="620" width="240" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="645" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">返回 [x] + sub ⭐</text>

  <text x="290" y="672" text-anchor="middle" font-size="10" fill="#888">两符号皆失败 → 返回 None（题面保证至少一解，剪枝后实际只走合法分支）</text>
</svg>
