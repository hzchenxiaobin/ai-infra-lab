<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">流程：拆段 → KMP 建 nxt 表 → 枚举 a 链式推进</text>

  <!-- 行 1：预处理 -->
  <rect x="25" y="38" width="140" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="95" y="55" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">按 * 拆 p</text>
  <text x="95" y="70" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">A · B · C</text>

  <rect x="190" y="38" width="140" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="55" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">KMP ×3 求</text>
  <text x="260" y="70" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">三段全部出现</text>

  <rect x="355" y="38" width="140" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="425" y="55" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">倒扫 s 建 nxt</text>
  <text x="425" y="70" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">= i 起最早出现</text>

  <path d="M 165 58 L 188 58" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 330 58 L 353 58" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 主箭头：nxt 表 → 枚举 -->
  <path d="M 425 78 L 425 95 L 95 95 L 95 126" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 行 2：枚举 a -->
  <rect x="25" y="128" width="140" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="95" y="154" text-anchor="middle" font-size="12" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">枚举 a = 0 … n</text>

  <polygon points="260,114 345,150 260,186 175,150" fill="#fff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="155" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">nxtA[a] == a ?</text>

  <rect x="390" y="128" width="115" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="447" y="147" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">b = nxtB</text>
  <text x="447" y="163" text-anchor="middle" font-size="11.5" fill="#a07020" font-weight="bold" filter="url(#rough2)">[a + |A|]</text>

  <path d="M 165 150 L 173 150" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 345 150 L 388 150" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="367" y="142" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <!-- 否：a++ 回边 -->
  <path d="M 260 114 L 260 102 L 118 102 L 118 126" fill="none" stroke="#888" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="189" y="98" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">否 · a++</text>

  <!-- b → b==INF? -->
  <path d="M 447 172 L 447 200" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 行 3 -->
  <polygon points="440,202 505,240 440,278 375,240" fill="#fff" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="440" y="245" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">b == INF ?</text>

  <rect x="190" y="218" width="140" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="237" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">c = nxtC</text>
  <text x="260" y="253" text-anchor="middle" font-size="11.5" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">[b + |B|]</text>

  <polygon points="95,202 163,240 95,278 27,240" fill="#fff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="95" y="245" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">c == INF ?</text>

  <path d="M 375 240 L 332 240" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="353" y="232" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 190 240 L 165 240" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 95 278 L 95 300" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="104" y="293" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- 行 4 -->
  <rect x="22" y="302" width="180" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="112" y="320" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">ans = min(ans,</text>
  <text x="112" y="336" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">c + |C| − a)</text>

  <rect x="330" y="302" width="175" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="417" y="320" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">break / 枚举完</text>
  <text x="417" y="336" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">输出 INF ? −1 : ans</text>

  <!-- b==INF 是 → 输出 -->
  <path d="M 440 278 L 440 300" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="449" y="293" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <!-- c==INF 是 → 输出（绕行弧线） -->
  <path d="M 27 240 C 60 285, 190 292, 326 318" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="112" y="283" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">是 · break</text>

  <!-- a++ 回边 -->
  <path d="M 112 344 L 112 354 L 6 354 L 6 150 L 23 150" fill="none" stroke="#888" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="32" y="349" font-size="10.5" fill="#888" filter="url(#rough2)">a++</text>
  <!-- 枚举自然结束 → 输出（虚线） -->
  <path d="M 202 323 L 326 323" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="264" y="316" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">枚举结束</text>
</svg>
