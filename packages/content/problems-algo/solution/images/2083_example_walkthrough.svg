<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：s = "abcba"</text>
  <text x="320" y="42" text-anchor="middle" font-size="10.5" fill="#888">逐步维护 cnt[c]，ans += cnt[c]，观察增量贡献</text>

  <!-- Table header -->
  <rect x="30" y="58" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="55" y="76" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i</text>

  <rect x="84" y="58" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="107" y="76" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">s[i]</text>

  <rect x="134" y="58" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="174" y="76" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">cnt[c]++</text>

  <rect x="218" y="58" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="278" y="76" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">贡献 = cnt[c]</text>

  <rect x="342" y="58" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="382" y="76" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans</text>

  <rect x="426" y="58" width="184" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="518" y="76" text-anchor="middle" font-size="10" fill="#666">对应的合法子串</text>

  <!-- Row 0: i=0, s[0]='a', cnt['a']=1, contrib=1, ans=1 -->
  <rect x="30" y="90" width="50" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="55" y="110" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="84" y="90" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="107" y="110" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  <rect x="134" y="90" width="80" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="174" y="110" text-anchor="middle" font-size="11" fill="#333">a: 0→1</text>
  <rect x="218" y="90" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="278" y="110" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="342" y="90" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="382" y="110" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="436" y="110" font-size="10" fill="#666">"a"（自身）</text>

  <!-- Row 1: i=1, s[1]='b', cnt['b']=1, contrib=1, ans=2 -->
  <rect x="30" y="122" width="50" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="55" y="142" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="84" y="122" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="107" y="142" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>
  <rect x="134" y="122" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="174" y="142" text-anchor="middle" font-size="11" fill="#333">b: 0→1</text>
  <rect x="218" y="122" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="278" y="142" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="342" y="122" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="382" y="142" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="436" y="142" font-size="10" fill="#666">"b"（自身）</text>

  <!-- Row 2: i=2, s[2]='c', cnt['c']=1, contrib=1, ans=3 -->
  <rect x="30" y="154" width="50" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="55" y="174" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="84" y="154" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="107" y="174" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">c</text>
  <rect x="134" y="154" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="174" y="174" text-anchor="middle" font-size="11" fill="#333">c: 0→1</text>
  <rect x="218" y="154" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="278" y="174" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="342" y="154" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="382" y="174" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="436" y="174" font-size="10" fill="#666">"c"（自身）</text>

  <!-- Row 3: i=3, s[3]='b', cnt['b']=2, contrib=2, ans=5 -->
  <rect x="30" y="186" width="50" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="55" y="206" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="84" y="186" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="2" filter="url(#rough2)"/>
  <text x="107" y="206" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>
  <rect x="134" y="186" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="174" y="206" text-anchor="middle" font-size="11" fill="#333">b: 1→2</text>
  <rect x="218" y="186" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="278" y="206" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="342" y="186" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="382" y="206" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="436" y="200" font-size="10" fill="#666">"b"（自身）</text>
  <text x="436" y="214" font-size="10" fill="#666">"bcb"（与 i=1 配对）</text>

  <!-- Row 4: i=4, s[4]='a', cnt['a']=2, contrib=2, ans=7 -->
  <rect x="30" y="218" width="50" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="55" y="238" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="84" y="218" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="2" filter="url(#rough2)"/>
  <text x="107" y="238" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  <rect x="134" y="218" width="80" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="174" y="238" text-anchor="middle" font-size="11" fill="#333">a: 1→2</text>
  <rect x="218" y="218" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="278" y="238" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="342" y="218" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="2" filter="url(#rough2)"/>
  <text x="382" y="238" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">7</text>
  <text x="436" y="232" font-size="10" fill="#666">"a"（自身）</text>
  <text x="436" y="246" font-size="10" fill="#666">"abcba"（与 i=0 配对）</text>

  <!-- Bottom insight box -->
  <rect x="40" y="278" width="560" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="320" y="298" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">关键洞察：cnt[c] 在自增后的值 = 以当前下标 i 为右端点的合法子串数</text>
  <text x="320" y="316" text-anchor="middle" font-size="10.5" fill="#555">首次出现 c：cnt=1，只有自身单字符子串</text>
  <text x="320" y="332" text-anchor="middle" font-size="10.5" fill="#555">第 k 次出现 c：cnt=k，可与此前 k−1 个位置各配一次 + 自身 = k 个</text>

  <!-- Verification note -->
  <rect x="40" y="352" width="560" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="320" y="370" text-anchor="middle" font-size="10.5" fill="#333">验证：a 出现 2 次 → 1+2=3；b 出现 2 次 → 1+2=3；c 出现 1 次 → 1</text>
  <text x="320" y="386" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">总和 = 3 + 3 + 1 = 7 ✅ 与示例一致</text>
</svg>
