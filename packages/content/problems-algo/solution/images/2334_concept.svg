<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">核心观察：以每个元素为最小值的最宽区间，再判定 value × 长度 &gt; threshold</text>

  <!-- labels -->
  <text x="40" y="62" font-size="11" fill="#888">下标:</text>
  <text x="40" y="96" font-size="12" fill="#888">nums:</text>

  <!-- index labels -->
  <text x="138" y="62" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">0</text>
  <text x="198" y="62" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">1</text>
  <text x="258" y="62" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">2</text>
  <text x="318" y="62" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">3</text>
  <text x="378" y="62" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">4</text>

  <!-- cells: index 0 (value 1, left-smaller, gray) -->
  <rect x="110" y="70" width="56" height="42" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="138" y="98" text-anchor="middle" font-size="14" fill="#999" font-weight="bold">1</text>
  <!-- index 1 (value 3, span start, green) -->
  <rect x="170" y="70" width="56" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="198" y="98" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <!-- index 2 (value 4, in span, green) -->
  <rect x="230" y="70" width="56" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="258" y="98" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <!-- index 3 (value 3, span end, green) -->
  <rect x="290" y="70" width="56" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="318" y="98" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <!-- index 4 (value 1, right-smaller, gray) -->
  <rect x="350" y="70" width="56" height="42" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="378" y="98" text-anchor="middle" font-size="14" fill="#999" font-weight="bold">1</text>

  <!-- i=1 marker (below cell 1) -->
  <path d="M 198 120 L 198 116" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="198" y="134" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">i=1 (min=3)</text>

  <!-- left[1] = 0 arrow (from below cell 0 up to cell 0) -->
  <path d="M 138 168 L 138 116" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="138" y="184" text-anchor="middle" font-size="10" fill="#446688">左第一个更小</text>
  <text x="138" y="198" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">left[1]=0 (值1)</text>

  <!-- right[1] = 4 arrow (from below cell 4 up to cell 4) -->
  <path d="M 378 168 L 378 116" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="378" y="184" text-anchor="middle" font-size="10" fill="#446688">右第一个更小</text>
  <text x="378" y="198" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">right[1]=4 (值1)</text>

  <!-- span bracket [1,3] -->
  <path d="M 170 220 Q 170 230 178 230 L 240 230 Q 248 230 248 220" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <line x1="170" y1="218" x2="170" y2="114" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <line x1="346" y1="218" x2="346" y2="114" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <path d="M 346 220 Q 346 230 338 230 L 256 230 Q 248 230 248 220" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="258" y="248" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">最宽区间 [1,3]，长度 = 3 − 0 − 1 = 3</text>

  <!-- formula box -->
  <rect x="440" y="70" width="148" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="514" y="90" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">结算量 = min × 长度</text>
  <text x="514" y="112" text-anchor="middle" font-size="11" fill="#666">= nums[i] × len</text>
  <text x="514" y="132" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">= 3 × 3 = 9</text>
  <text x="514" y="150" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">9 &gt; 6 = threshold ✓</text>

  <!-- monotonic stack note -->
  <rect x="40" y="270" width="548" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="314" y="290" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">单调栈 O(n) 求每个 i 的「左右第一个更小」</text>
  <text x="314" y="307" text-anchor="middle" font-size="11" fill="#666">值严格递增栈，弹出所有 ≥ nums[i] 后栈顶即答案</text>

  <!-- general principle callout -->
  <rect x="40" y="330" width="548" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="314" y="352" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">对每个 i：若 nums[i] × len_i &gt; threshold，则 len_i 是合法大小</text>
  <text x="314" y="372" text-anchor="middle" font-size="11" fill="#666">取所有合法 len_i 的最大值；与 84/1856 同构（结算量 min×len，加阈值判定）</text>
</svg>
