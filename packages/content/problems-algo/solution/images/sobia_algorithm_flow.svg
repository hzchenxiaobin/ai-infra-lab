<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：预处理左右数组 → 单遍判定三档美丽值</text>

  <!-- 1. 预处理 left_max -->
  <rect x="150" y="46" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="64" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">① 预处理 left_max[ ]</text>
  <text x="270" y="80" text-anchor="middle" font-size="10" fill="#555">从左扫：left_max[i]=max(left_max[i−1], nums[i−1])</text>

  <path d="M 270 86 L 270 104" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. 预处理 right_min -->
  <rect x="150" y="104" width="240" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="122" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">② 预处理 right_min[ ]</text>
  <text x="270" y="138" text-anchor="middle" font-size="10" fill="#555">从右扫：right_min[i]=min(right_min[i+1], nums[i+1])</text>

  <path d="M 270 144 L 270 162" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. 遍历 i -->
  <rect x="150" y="162" width="240" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="184" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">③ for i = 1 … n−2</text>

  <path d="M 270 196 L 270 214" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4. 判定 beauty==2 -->
  <polygon points="270,214 388,254 270,294 152,254" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="250" text-anchor="middle" font-size="11" fill="#333">left_max[i] &lt; nums[i]</text>
  <text x="270" y="266" text-anchor="middle" font-size="11" fill="#333">且 nums[i] &lt; right_min[i] ?</text>
  <text x="270" y="282" text-anchor="middle" font-size="9.5" fill="#888">(严格大于左全部 &amp; 小于右全部)</text>

  <!-- 是 → +2 -->
  <path d="M 388 254 L 460 254" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="450" y="238" width="76" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="488" y="258" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">ans += 2</text>

  <!-- 否 ↓ -->
  <path d="M 270 294 L 270 312" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="308" font-size="10" fill="#b85450">否 ↓</text>

  <!-- 5. 判定 beauty==1 -->
  <polygon points="270,312 388,352 270,392 152,352" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="348" text-anchor="middle" font-size="11" fill="#333">nums[i−1] &lt; nums[i]</text>
  <text x="270" y="364" text-anchor="middle" font-size="11" fill="#333">且 nums[i] &lt; nums[i+1] ?</text>
  <text x="270" y="380" text-anchor="middle" font-size="9.5" fill="#888">(只看相邻三元素)</text>

  <!-- 是 → +1 -->
  <path d="M 388 352 L 460 352" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="450" y="336" width="76" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="488" y="356" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">ans += 1</text>

  <!-- 否 → +0 -->
  <path d="M 152 352 L 80 352" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="40" y="336" width="60" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="70" y="356" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">+0</text>

  <!-- 回到③ 循环 -->
  <path d="M 270 392 L 270 410 L 70 410 L 70 179 L 148 179" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="50" y="300" font-size="10" fill="#888" font-weight="bold">下一个 i</text>

  <!-- 终点 -->
  <path d="M 270 410 L 270 428" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="190" y="428" width="160" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="448" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">遍历结束 → return ans</text>

  <!-- 右侧说明 -->
  <rect x="408" y="40" width="120" height="180" fill="none" stroke="none"/>
  <rect x="412" y="44" width="120" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="472" y="62" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">预处理代价</text>
  <text x="472" y="78" text-anchor="middle" font-size="9.5" fill="#555">两次单遍扫描</text>
  <text x="472" y="94" text-anchor="middle" font-size="10" fill="#333">O(n) / O(n)</text>

  <rect x="412" y="112" width="120" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="472" y="130" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">判定代价</text>
  <text x="472" y="146" text-anchor="middle" font-size="9.5" fill="#555">每个 i 查两张表</text>
  <text x="472" y="162" text-anchor="middle" font-size="10" fill="#333">O(1) · 共 O(n)</text>

  <rect x="412" y="180" width="120" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="472" y="205" text-anchor="middle" font-size="10" fill="#a87020" font-weight="bold">三档互斥：2 &gt; 1 &gt; 0</text>
</svg>
