<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：dfs(node) 返回子树中 &gt; m 的最小候选（无则 −1）</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">m = root.val（全局最小，由特殊性质保证）</text>

  <!-- 入口 -->
  <rect x="220" y="58" width="120" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="78" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">调用 dfs(node)</text>
  <line x1="280" y1="88" x2="280" y2="104" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定 1: node == null -->
  <path d="M 280 108 L 380 142 L 280 176 L 180 142 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="140" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">node 为空?</text>
  <text x="280" y="156" text-anchor="middle" font-size="10" fill="#888">(递归叶子的孩子时)</text>

  <!-- 是 → return -1 -->
  <line x1="380" y1="142" x2="430" y2="142" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="398" y="136" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="430" y="128" width="110" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="485" y="147" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return −1</text>

  <!-- 否 → 下一个判定 -->
  <line x1="280" y1="176" x2="280" y2="192" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="188" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- 判定 2: node.val > m -->
  <path d="M 280 196 L 380 230 L 280 264 L 180 230 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="228" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">node.val &gt; m?</text>
  <text x="280" y="244" text-anchor="middle" font-size="10" fill="#888">✂ 剪枝判定</text>

  <!-- 是 → return node.val (剪枝) -->
  <line x1="380" y1="230" x2="430" y2="230" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="398" y="224" font-size="10" fill="#d6a040" font-weight="bold">是</text>
  <rect x="430" y="216" width="110" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="485" y="235" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold">return node.val</text>

  <!-- 否 → 下一个 -->
  <line x1="280" y1="264" x2="280" y2="280" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="276" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- 判定 3: 叶子? -->
  <path d="M 280 284 L 380 318 L 280 352 L 180 318 Z" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="316" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">无孩子?</text>
  <text x="280" y="332" text-anchor="middle" font-size="10" fill="#888">val==m 且是叶子</text>

  <!-- 是 → return -1 -->
  <line x1="380" y1="318" x2="430" y2="318" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="398" y="312" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="430" y="304" width="110" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="485" y="323" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return −1</text>

  <!-- 否 → 递归左右 -->
  <line x1="280" y1="352" x2="280" y2="368" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="364" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- 递归 + 合并 -->
  <rect x="120" y="372" width="320" height="88" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="394" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">a = dfs(node.left)　b = dfs(node.right)</text>
  <line x1="140" y1="404" x2="420" y2="404" stroke="#cdd6e4" stroke-width="1" filter="url(#rough2)"/>
  <text x="140" y="424" font-size="11" fill="#555">都为 −1 → return −1；仅一个有效 → 取有效者</text>
  <text x="140" y="444" font-size="11" fill="#555">两者都有效 → return min(a, b) ⭐</text>
</svg>
