<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="700" height="560" fill="#fdfcf7"/>
  <text x="350" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">K 连续位翻转：算法流程</text>
  <path d="M 220 40 Q 350 48 480 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)">
    <ellipse cx="350" cy="72" rx="60" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="350" y="77" text-anchor="middle" font-size="12" fill="#2b4a7a" font-weight="bold">开始：flip=0, ans=0</text>
  <path d="M 350 92 L 350 108" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- init loop -->
  <g filter="url(#sk)">
    <rect x="280" y="110" width="140" height="40" rx="6" fill="#fff" stroke="#888" stroke-width="1.3"/>
  </g>
  <text x="350" y="135" text-anchor="middle" font-size="12" fill="#333">i = 0 → n−1（遍历）</text>
  <path d="M 350 150 L 350 166" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- decision: i >= k? remove expired -->
  <g filter="url(#sk)">
    <path d="M 350 168 L 460 210 L 350 252 L 240 210 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="350" y="206" text-anchor="middle" font-size="11" fill="#7a5415">i ≥ k ?</text>
  <text x="350" y="222" text-anchor="middle" font-size="10" fill="#888">撤销 i−k 的翻转</text>
  <!-- yes branch: flip ^= diff[i-k] -->
  <path d="M 460 210 L 540 210" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="468" y="204" font-size="10" fill="#4a7a3a">是</text>
  <g filter="url(#sk)">
    <rect x="540" y="192" width="140" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="610" y="215" text-anchor="middle" font-size="11" fill="#2e6e2e">flip ⊕= diff[i−k]</text>
  <!-- no branch: skip -->
  <text x="332" y="266" font-size="10" fill="#888">否</text>

  <!-- compute effective bit -->
  <path d="M 350 252 L 350 276" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="270" y="278" width="160" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="350" y="303" text-anchor="middle" font-size="11" fill="#2b4a7a">flip ⊕= diff[i]; cur = nums[i] ⊕ flip</text>
  <path d="M 350 318 L 350 334" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- decision: cur == 0? -->
  <g filter="url(#sk)">
    <path d="M 350 336 L 450 376 L 350 416 L 250 376 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="350" y="380" text-anchor="middle" font-size="11" fill="#b03a3a">cur == 0 ?</text>
  <!-- no: skip to loop end -->
  <path d="M 250 376 L 180 376 L 180 130 L 280 130" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)" stroke-dasharray="4 3"/>
  <text x="186" y="370" font-size="10" fill="#888">否（已是 1，跳过）</text>

  <!-- yes branch -->
  <path d="M 450 376 L 540 376" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="468" y="370" font-size="10" fill="#b85450">是</text>
  <!-- decision: i > n - k? -->
  <g filter="url(#sk)">
    <path d="M 600 376 L 680 410 L 600 444 L 520 410 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="600" y="406" text-anchor="middle" font-size="10" fill="#7a5415">i &gt; n−k ?</text>
  <text x="600" y="420" text-anchor="middle" font-size="9" fill="#888">窗口放不下</text>
  <!-- yes: return -1 -->
  <path d="M 680 410 L 680 470" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="688" y="440" font-size="10" fill="#b85450">是</text>
  <g filter="url(#sk)">
    <ellipse cx="680" cy="486" rx="46" ry="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="680" y="491" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold">返回 −1</text>

  <!-- no: flip -->
  <path d="M 520 410 L 440 410" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="500" y="404" font-size="10" fill="#4a7a3a">否</text>
  <g filter="url(#sk)">
    <rect x="280" y="430" width="160" height="56" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="360" y="450" text-anchor="middle" font-size="11" fill="#2e6e2e">flip ⊕= 1; diff[i+k] ⊕= 1</text>
  <text x="360" y="470" text-anchor="middle" font-size="11" fill="#2e6e2e">ans++</text>
  <!-- back to loop -->
  <path d="M 280 458 L 180 458 L 180 130 L 280 130" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)" stroke-dasharray="4 3"/>

  <!-- loop end -->
  <path d="M 350 150 L 350 150" stroke="none"/>
  <!-- return ans -->
  <g filter="url(#sk)">
    <ellipse cx="350" cy="528" rx="60" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="350" y="533" text-anchor="middle" font-size="12" fill="#2b4a7a" font-weight="bold">返回 ans</text>
  <path d="M 280 130 L 200 130 L 200 528 L 290 528" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)" stroke-dasharray="4 3"/>
  <text x="206" y="124" font-size="10" fill="#888">遍历结束</text>
</svg>
