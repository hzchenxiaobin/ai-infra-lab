<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：每个 arr[i] 产生一对 (arr[i]-k, arr[i]+k)，间距恰为 2k</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888">nums 的最小值必属 lower，其搭档 = min + 2k 必在 nums 中</text>

  <!-- ===== Top: pairing structure ===== -->
  <rect x="40" y="58" width="440" height="78" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="78" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">配对结构：arr[i] → { lower[i], higher[i] }</text>

  <!-- arr node -->
  <ellipse cx="90" cy="108" rx="34" ry="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="90" y="112" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">arr[i]</text>

  <!-- arrows to lower / higher -->
  <path d="M 70 122 L 150 122" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 110 122 L 190 122" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- lower box -->
  <rect x="150" y="98" width="86" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="193" y="118" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">arr[i] − k</text>

  <!-- higher box -->
  <rect x="240" y="98" width="86" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="283" y="118" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">arr[i] + k</text>

  <!-- gap bracket -->
  <path d="M 236 96 L 236 86 L 326 86 L 326 96" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="281" y="80" text-anchor="middle" font-size="10.5" fill="#666">间距 = 2k</text>

  <!-- recovered note -->
  <text x="400" y="108" text-anchor="middle" font-size="10.5" fill="#555">还原时</text>
  <text x="400" y="124" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">arr[i] = L + k</text>

  <!-- ===== Middle: sorted nums with min highlighted ===== -->
  <text x="260" y="154" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">sorted nums = [2, 4, 6, 8, 10, 12]</text>

  <!-- nums cells -->
  <rect x="58" y="166" width="56" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="86" y="189" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2</text>

  <rect x="120" y="166" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="148" y="189" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">4</text>

  <rect x="182" y="166" width="56" height="36" fill="#fff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="189" text-anchor="middle" font-size="13" fill="#555">6</text>

  <rect x="244" y="166" width="56" height="36" fill="#fff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="272" y="189" text-anchor="middle" font-size="13" fill="#555">8</text>

  <rect x="306" y="166" width="56" height="36" fill="#fff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="334" y="189" text-anchor="middle" font-size="13" fill="#555">10</text>

  <rect x="368" y="166" width="56" height="36" fill="#fff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="396" y="189" text-anchor="middle" font-size="13" fill="#555">12</text>

  <!-- labels under min and partner -->
  <text x="86" y="216" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">↑ 最小值</text>
  <text x="86" y="230" text-anchor="middle" font-size="10" fill="#b85450">必为 lower</text>

  <!-- arrow from min(2) to 4 with 2k gap -->
  <path d="M 86 240 L 86 250 L 148 250 L 148 204" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="117" y="246" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">搭档 = 2 + 2k</text>

  <!-- ===== Bottom insight ===== -->
  <rect x="40" y="262" width="440" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="282" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">为什么最小值一定是 lower？</text>
  <text x="260" y="300" text-anchor="middle" font-size="10.5" fill="#555">若 min 是 higher(arr[i]+k)，则其 lower 搭档 arr[i]−k &lt; min 也在 nums 中</text>
  <text x="260" y="316" text-anchor="middle" font-size="10.5" fill="#555">→ 与 min 是全局最小矛盾。故 min 必为 lower，2k = nums[j] − nums[0]</text>

  <!-- Footer -->
  <text x="260" y="344" text-anchor="middle" font-size="10" fill="#aaa">候选 k 仅来自 (nums[j]−nums[0])/2（偶且 &gt; 0），逐个验证</text>
  <text x="260" y="356" text-anchor="middle" font-size="10" fill="#aaa">贪心配对 O(n) · 至多 2n 个候选 · 总 O(n²)</text>
</svg>
