<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：先判“正项不够 m”，再二分阈值 g，最后一趟等差求和</text>

  <!-- 起点 -->
  <rect x="170" y="32" width="180" height="28" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="50" text-anchor="middle" font-size="10.5" fill="#2f5527" filter="url(#rough2)">输入 value, decay, m</text>
  <path d="M 260 60 L 260 70" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- cnt 定义 -->
  <rect x="140" y="74" width="230" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="255" y="90" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">cnt(g) = Σ ⌊(a−g)/d⌋+1（a ≥ g）</text>
  <text x="255" y="105" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">= 值 ≥ g 的总项数，单调不增</text>
  <path d="M 260 112 L 260 120" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 判定 cnt(1) < m ? -->
  <polygon points="260,122 322,148 260,174 198,148" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="152" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">cnt(1) &lt; m ?</text>

  <!-- 左分支：正项不够 -->
  <path d="M 197 148 L 182 148" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="190" y="139" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="20" y="122" width="158" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="99" y="140" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">正项总数都不够 m</text>
  <text x="99" y="155" text-anchor="middle" font-size="8.5" fill="#a04540" filter="url(#rough2)">每个下标把全部正项做等差求和</text>
  <text x="99" y="168" text-anchor="middle" font-size="8.5" fill="#a04540" filter="url(#rough2)">→ 返回 S(1) mod p</text>

  <!-- 主分支 -->
  <path d="M 260 174 L 260 184" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="271" y="183" font-size="9" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="140" y="188" width="230" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="255" y="204" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">二分 g ∈ [1, max a]：</text>
  <text x="255" y="220" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">找最大 g 使 cnt(g) ≥ m（第 m 大的项）</text>
  <path d="M 255 228 L 255 238" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="140" y="240" width="230" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="255" y="256" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">一趟扫描：k = ⌊(a−g)/d⌋+1</text>
  <text x="255" y="272" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">c += k；s += k·a − d·k(k−1)/2</text>
  <path d="M 255 282 L 255 292" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="140" y="294" width="230" height="32" rx="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="255" y="314" text-anchor="middle" font-size="10.5" fill="#2f5527" font-weight="bold" filter="url(#rough2)">返回 (s − (c−m)·g) mod p</text>

  <!-- 右侧小抄 -->
  <rect x="382" y="74" width="128" height="212" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="446" y="92" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">小抄</text>
  <text x="446" y="110" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">· cnt(g) 单调不增</text>
  <text x="446" y="125" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">  → 二分成立</text>
  <text x="446" y="141" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">· cnt(g)−m &lt; n：每条</text>
  <text x="446" y="156" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">  数列至多一项 = g</text>
  <text x="446" y="172" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">· s &lt; (m+n)·max a</text>
  <text x="446" y="187" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">  ≈ 1.1×10¹⁸，</text>
  <text x="446" y="202" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">  long long 装得下</text>
  <text x="446" y="218" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">· 取模放到最后一步</text>
  <text x="446" y="234" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">· 时间 O(n log max a)</text>
  <text x="446" y="249" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">  ≈ 10⁵ × 30 = 3×10⁶</text>
  <text x="446" y="265" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">· 空间 O(1)</text>
  <text x="446" y="280" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">  （m ≤ 10⁹ 也不怕）</text>
</svg>
