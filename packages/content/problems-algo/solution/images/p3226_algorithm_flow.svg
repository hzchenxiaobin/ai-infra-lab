<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 352" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="352" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：先判「k 是不是 n 的子掩码」，再数差异位</text>

  <rect x="215" y="44" width="130" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="16" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">输入 n, k</text>

  <path d="M 280 76 L 280 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,104 396,150 280,196 164,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="145" text-anchor="middle" font-size="12" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">k &amp; ~n == 0 ?</text>
  <text x="280" y="164" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">（k 是 n 的子掩码吗）</text>

  <text x="20" y="140" font-size="9" fill="#888" filter="url(#rough2)">无解 ⇔ 存在某位</text>
  <text x="20" y="154" font-size="9" fill="#888" filter="url(#rough2)">k=1 而 n=0</text>

  <path d="M 396 150 L 426 150" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="406" y="142" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="430" y="132" width="106" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="483" y="154" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 -1</text>
  <text x="483" y="186" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">0 变不出 1，永远差一位</text>

  <path d="M 280 196 L 280 218" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="293" y="212" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="210" y="222" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="243" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">d = n ⊕ k</text>

  <path d="M 280 256 L 280 278" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="196" y="282" width="168" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="304" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 popcount(d)</text>

  <text x="280" y="342" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">两次位运算 + 一次数 1，全程 O(1)（n, k ≤ 10⁶ &lt; 2²⁰，20 位以内）</text>
</svg>
