<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 3 演算：xCoord=[1,1,3,3,1,3]，yCoord=[1,3,1,3,2,2]</text>
  <text x="260" y="46" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">列 1: y=[1,2,3]，列 3: y=[1,2,3]，答案 = 2</text>

  <!-- left: geometry -->
  <text x="130" y="76" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">几何视图</text>

  <!-- axis -->
  <line x1="60" y1="255" x2="220" y2="255" stroke="#bbb" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="80" y1="265" x2="80" y2="85" stroke="#bbb" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- upper rectangle [1,3]x[2,3] -->
  <rect x="110" y="100" width="90" height="50" fill="#e6f4ea" fill-opacity="0.55" stroke="#4a7a3a" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <!-- lower rectangle [1,3]x[1,2] -->
  <rect x="110" y="150" width="90" height="50" fill="#e8f0fe" fill-opacity="0.55" stroke="#446688" stroke-width="2" rx="2" filter="url(#rough2)"/>

  <!-- column x=1 points -->
  <circle cx="110" cy="100" r="5.5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="110" cy="150" r="5.5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="110" cy="200" r="5.5" fill="#446688" filter="url(#rough2)"/>
  <text x="98" y="104" text-anchor="end" font-size="10" fill="#446688" filter="url(#rough2)">(1,3)</text>
  <text x="98" y="154" text-anchor="end" font-size="10" fill="#446688" filter="url(#rough2)">(1,2)</text>
  <text x="98" y="204" text-anchor="end" font-size="10" fill="#446688" filter="url(#rough2)">(1,1)</text>
  <text x="110" y="228" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">列 x=1</text>

  <!-- column x=3 points -->
  <circle cx="200" cy="100" r="5.5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="200" cy="150" r="5.5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="200" cy="200" r="5.5" fill="#446688" filter="url(#rough2)"/>
  <text x="212" y="104" font-size="10" fill="#446688" filter="url(#rough2)">(3,3)</text>
  <text x="212" y="154" font-size="10" fill="#446688" filter="url(#rough2)">(3,2)</text>
  <text x="212" y="204" font-size="10" fill="#446688" filter="url(#rough2)">(3,1)</text>
  <text x="200" y="228" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">列 x=3</text>

  <text x="130" y="248" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">上=绿，下=蓝，两个小矩形都合法</text>

  <!-- right: steps -->
  <text x="370" y="76" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">扫描过程</text>

  <!-- step 1 -->
  <rect x="255" y="88" width="250" height="56" rx="8" fill="#fff" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="265" y="107" font-size="11" fill="#446688" filter="url(#rough2)">① 扫列 x=1（线段树为空）</text>
  <text x="265" y="123" font-size="10.5" fill="#555" filter="url(#rough2)">相邻对 (1,2)、(2,3) 查询 → −1</text>
  <text x="265" y="138" font-size="10.5" fill="#555" filter="url(#rough2)">插入 last[1]=last[2]=last[3]=1</text>

  <!-- step 2 -->
  <rect x="255" y="152" width="250" height="72" rx="8" fill="#fff" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="265" y="171" font-size="11" fill="#446688" filter="url(#rough2)">② 扫列 x=3，相邻对 (1,2)：</text>
  <text x="265" y="187" font-size="10.5" fill="#555" filter="url(#rough2)">query([1,2]) = max(1,1) = 1 → x₀=1</text>
  <text x="265" y="202" font-size="10.5" fill="#555" filter="url(#rough2)">检查列 1：[1,2] 内恰有相邻的 1、2 ✓</text>
  <text x="265" y="217" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">面积 (3−1)×(2−1) = 2</text>

  <!-- step 3 -->
  <rect x="255" y="232" width="250" height="72" rx="8" fill="#fff" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="265" y="251" font-size="11" fill="#446688" filter="url(#rough2)">③ 扫列 x=3，相邻对 (2,3)：</text>
  <text x="265" y="267" font-size="10.5" fill="#555" filter="url(#rough2)">query([2,3]) = max(1,1) = 1 → x₀=1</text>
  <text x="265" y="282" font-size="10.5" fill="#555" filter="url(#rough2)">检查列 1：[2,3] 内恰有相邻的 2、3 ✓</text>
  <text x="265" y="297" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">面积 (3−1)×(3−2) = 2</text>

  <!-- why not big square -->
  <rect x="40" y="316" width="465" height="72" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="272" y="338" text-anchor="middle" font-size="11.5" fill="#6b5410" filter="url(#rough2)">为什么大正方形 [1,3]×[1,3] 不用检查？</text>
  <text x="272" y="356" text-anchor="middle" font-size="11" fill="#6b5410" filter="url(#rough2)">列 3 中 1 和 3 不是相邻对（中间隔着 2），根本不产生候选；</text>
  <text x="272" y="374" text-anchor="middle" font-size="11" fill="#6b5410" filter="url(#rough2)">「相邻对」这一步天然过滤了边界带点的矩形，最终答案 = 2 ✓</text>
</svg>
