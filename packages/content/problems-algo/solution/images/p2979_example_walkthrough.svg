<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：a = 5，b = 7 → 答案 23</text>

  <!-- 顶部格子 19..34 -->
  <g>
    <rect x="18" y="42" width="33" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="34" y="63" text-anchor="middle" font-size="11" fill="#333">19</text>
    <rect x="51" y="42" width="33" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="67" y="63" text-anchor="middle" font-size="11" fill="#333">20</text>
    <rect x="84" y="42" width="33" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="100" y="63" text-anchor="middle" font-size="11" fill="#333">21</text>
    <rect x="117" y="42" width="33" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="133" y="63" text-anchor="middle" font-size="11" fill="#333">22</text>
    <rect x="150" y="42" width="33" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
    <text x="166" y="63" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">23</text>
    <rect x="183" y="42" width="33" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="199" y="63" text-anchor="middle" font-size="11" fill="#333">24</text>
    <rect x="216" y="42" width="33" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="232" y="63" text-anchor="middle" font-size="11" fill="#333">25</text>
    <rect x="249" y="42" width="33" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="265" y="63" text-anchor="middle" font-size="11" fill="#333">26</text>
    <rect x="282" y="42" width="33" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="298" y="63" text-anchor="middle" font-size="11" fill="#333">27</text>
    <rect x="315" y="42" width="33" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="331" y="63" text-anchor="middle" font-size="11" fill="#333">28</text>
    <rect x="348" y="42" width="33" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="364" y="63" text-anchor="middle" font-size="11" fill="#333">29</text>
    <rect x="381" y="42" width="33" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="397" y="63" text-anchor="middle" font-size="11" fill="#333">30</text>
    <rect x="414" y="42" width="33" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="430" y="63" text-anchor="middle" font-size="11" fill="#333">31</text>
    <rect x="447" y="42" width="33" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="463" y="63" text-anchor="middle" font-size="11" fill="#333">32</text>
    <rect x="480" y="42" width="33" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="496" y="63" text-anchor="middle" font-size="11" fill="#333">33</text>
    <rect x="513" y="42" width="33" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="529" y="63" text-anchor="middle" font-size="11" fill="#333">34</text>
  </g>

  <!-- 指向 23 的标注 -->
  <path d="M 166 76 L 166 94" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)" marker-end="url(#arrr)"/>
  <text x="166" y="112" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">g = 5×7 − 5 − 7 = 23，唯一红格</text>

  <!-- 左列表格 -->
  <g font-size="12" fill="#333">
    <rect x="40" y="128" width="236" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="158" y="148" text-anchor="middle" fill="#b85450" font-weight="bold">23 → 无表示，买不到 ✗</text>
    <rect x="40" y="162" width="236" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="158" y="182" text-anchor="middle">24 = 2×5 + 2×7 ✓</text>
    <rect x="40" y="196" width="236" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="158" y="216" text-anchor="middle">25 = 5×5 ✓</text>
    <rect x="40" y="230" width="236" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="158" y="250" text-anchor="middle">26 = 1×5 + 3×7 ✓</text>
    <rect x="40" y="264" width="236" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="158" y="284" text-anchor="middle">27 = 4×5 + 1×7 ✓</text>
    <rect x="40" y="298" width="236" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="158" y="318" text-anchor="middle">28 = 4×7 ✓</text>
  </g>

  <!-- 右列表格 -->
  <g font-size="12" fill="#333">
    <rect x="300" y="128" width="236" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="418" y="148" text-anchor="middle">29 = 3×5 + 2×7 ✓</text>
    <rect x="300" y="162" width="236" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="418" y="182" text-anchor="middle">30 = 6×5 ✓</text>
    <rect x="300" y="196" width="236" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="418" y="216" text-anchor="middle">31 = 2×5 + 3×7 ✓</text>
    <rect x="300" y="230" width="236" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="418" y="250" text-anchor="middle">32 = 5×5 + 1×7 ✓</text>
    <rect x="300" y="264" width="236" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="418" y="284" text-anchor="middle">33 = 1×5 + 4×7 ✓</text>
    <rect x="300" y="298" width="236" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="418" y="318" text-anchor="middle">34 = 4×5 + 2×7 ✓</text>
  </g>

  <text x="280" y="348" text-anchor="middle" font-size="11" fill="#888">24 起连续 11 个绿格 ≥ a = 5 ⇒ 后续价格 +5/+7 全部可买</text>
</svg>
