<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：滚动最小频率表</text>

  <!-- Step 1 -->
  <rect x="60" y="44" width="460" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="80" y="64" font-size="11" fill="#446688" font-weight="bold">①</text>
  <text x="290" y="64" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">初始化：minFreq = freq(words[0])</text>
  <text x="290" y="80" text-anchor="middle" font-size="10.5" fill="#888">用第一个单词的字符频率填满 minFreq[0..25]</text>

  <path d="M 290 90 L 290 106" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="60" y="110" width="460" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="80" y="130" font-size="11" fill="#4a7a3a" font-weight="bold">②</text>
  <text x="290" y="130" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">对每个后续单词 word[i]：统计 cur = freq(word[i])</text>
  <text x="290" y="146" text-anchor="middle" font-size="10.5" fill="#888">遍历字符，cur[c - 'a']++（或 cur[ord(c)-97]++）</text>

  <path d="M 290 156 L 290 172" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="40" y="176" width="500" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="60" y="196" font-size="11" fill="#d6a040" font-weight="bold">③</text>
  <text x="290" y="196" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">对 26 个字母逐个取最小：</text>
  <text x="290" y="214" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">minFreq[c] = min(minFreq[c], cur[c])</text>
  <text x="290" y="230" text-anchor="middle" font-size="10.5" fill="#888">「c 在所有已处理单词中的最少出现次数」</text>

  <path d="M 290 238 L 290 254" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4 -->
  <rect x="40" y="258" width="500" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="60" y="278" font-size="11" fill="#b85450" font-weight="bold">④</text>
  <text x="290" y="278" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">展开结果：对每个 minFreq[c] &gt; 0</text>
  <text x="290" y="296" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">将字符 c 重复 minFreq[c] 次加入答案</text>
  <text x="290" y="310" text-anchor="middle" font-size="10.5" fill="#888">e×1, l×2 → [&quot;e&quot;,&quot;l&quot;,&quot;l&quot;]</text>

  <!-- 小结 -->
  <path d="M 290 316 L 290 330" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="80" y="334" width="420" height="52" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="290" y="354" text-anchor="middle" font-size="11" fill="#555">遍历每个单词做一次 freq + 一次 26 取最小</text>
  <text x="290" y="372" text-anchor="middle" font-size="11" fill="#555">时间 O(N·L)，空间 O(1)（26 个字母定长）</text>
</svg>
