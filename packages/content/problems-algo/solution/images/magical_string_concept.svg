<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>
  <text x="290" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：字符串 S = 自身的游程长度序列（自指）</text>

  <!-- ===== Row A: string S ===== -->
  <text x="36" y="62" font-size="12" fill="#446688" font-weight="bold">字符串 S</text>

  <!-- 12 char cells, width 36 starting x=46. centers: 64,100,136,172,208,244,280,316,352,388,424,460 -->
  <!-- 1=orange, 2=blue -->
  <rect x="46"  y="74" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="64"  y="97" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">1</text>

  <rect x="82"  y="74" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="100" y="97" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">2</text>

  <rect x="118" y="74" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="136" y="97" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">2</text>

  <rect x="154" y="74" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="172" y="97" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">1</text>

  <rect x="190" y="74" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="208" y="97" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">1</text>

  <rect x="226" y="74" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="244" y="97" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">2</text>

  <rect x="262" y="74" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="97" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">1</text>

  <rect x="298" y="74" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="316" y="97" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">2</text>

  <rect x="334" y="74" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="352" y="97" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">2</text>

  <rect x="370" y="74" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="388" y="97" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">1</text>

  <rect x="406" y="74" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="424" y="97" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">2</text>

  <rect x="442" y="74" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="460" y="97" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">2</text>

  <text x="488" y="97" font-size="12" fill="#888">…</text>

  <!-- ===== group brackets ===== -->
  <!-- group spans: g1[46-82] g2[82-154] g3[154-226] g4[226-262] g5[262-298] g6[298-370] g7[370-406] g8[406-478] -->
  <text x="36" y="128" font-size="11" fill="#888">按游程分组</text>

  <path d="M 50 116 L 50 124 L 78 124 L 78 116" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 64 124 L 64 132" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <path d="M 86 116 L 86 124 L 150 124 L 150 116" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 118 124 L 118 132" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <path d="M 158 116 L 158 124 L 222 124 L 222 116" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 190 124 L 190 132" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <path d="M 230 116 L 230 124 L 258 124 L 258 116" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 244 124 L 244 132" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <path d="M 266 116 L 266 124 L 294 124 L 294 116" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 280 124 L 280 132" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <path d="M 302 116 L 302 124 L 366 124 L 366 116" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 334 124 L 334 132" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <path d="M 374 116 L 374 124 L 402 124 L 402 116" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 388 124 L 388 132" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <path d="M 410 116 L 410 124 L 474 124 L 474 116" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 442 124 L 442 132" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- ===== Row B: run-lengths ===== -->
  <text x="36" y="158" font-size="12" fill="#4a7a3a" font-weight="bold">各组长度</text>

  <!-- length cells width 30 centered at group centers: 64,118,190,244,280,334,388,442 -->
  <rect x="49"  y="168" width="30" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="64"  y="189" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">1</text>

  <rect x="103" y="168" width="30" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="118" y="189" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">2</text>

  <rect x="175" y="168" width="30" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="190" y="189" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">2</text>

  <rect x="229" y="168" width="30" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="244" y="189" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>

  <rect x="265" y="168" width="30" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="189" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">1</text>

  <rect x="319" y="168" width="30" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="334" y="189" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">2</text>

  <rect x="373" y="168" width="30" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="388" y="189" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">1</text>

  <rect x="427" y="168" width="30" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="442" y="189" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">2</text>

  <text x="468" y="189" font-size="12" fill="#888">…</text>

  <!-- ===== self-reference annotation ===== -->
  <!-- big curly/arrow from row B back up to row A indicating equality -->
  <path d="M 64 210 C 64 232, 250 246, 290 246" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 442 210 C 442 232, 330 246, 290 246" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="150" y="232" width="280" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="253" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">长度序列 = S 本身 → 自指！</text>

  <!-- divider -->
  <path d="M 36 282 L 544 282" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>

  <!-- ===== pointer mechanism ===== -->
  <text x="36" y="306" font-size="12" fill="#446688" font-weight="bold">双指针自生成：head 读计数 → tail 写副本</text>

  <!-- head pointer (read) -->
  <rect x="49" y="322" width="30" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="64" y="343" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">2</text>
  <text x="64" y="368" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">head</text>
  <text x="64" y="380" text-anchor="middle" font-size="9" fill="#888">读计数=2</text>

  <path d="M 86 338 L 120 338" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="103" y="332" text-anchor="middle" font-size="9" fill="#d6a040">cnt</text>

  <!-- write val=1 (toggled from last written '2') -->
  <rect x="124" y="322" width="64" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="156" y="343" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">写 1, 1</text>
  <text x="156" y="380" text-anchor="middle" font-size="9" fill="#b85450">val = 3 − 上一组值</text>

  <path d="M 192 338 L 226 338" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- tail pointer (write) -->
  <rect x="230" y="322" width="30" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="245" y="343" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>
  <text x="245" y="368" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">tail</text>
  <text x="245" y="380" text-anchor="middle" font-size="9" fill="#888">追加位置</text>

  <!-- note box -->
  <rect x="300" y="318" width="244" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="312" y="336" font-size="10.5" fill="#d6a040" font-weight="bold">★ 读滞后于写 → 可增量构造</text>
  <text x="312" y="352" font-size="10" fill="#555">• 组值交替 1↔2（极大组保证）</text>
  <text x="312" y="366" font-size="10" fill="#555">• 计数来自 s[head]，head ≤ tail 恒成立</text>
  <text x="312" y="380" font-size="10" fill="#555">• 种子 "122" 锁定前两组</text>

  <!-- footer -->
  <rect x="36" y="400" width="508" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="419" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">一趟扫描生成前 n 位，边写边数 '1'，O(n) 时间 / O(n) 空间</text>
</svg>
