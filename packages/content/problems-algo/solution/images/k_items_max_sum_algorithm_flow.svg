<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：三步贪心 + 求和</text>

  <!-- ===== 起始：需要取 k 件 ===== -->
  <rect x="170" y="46" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="270" y="71" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">需要恰好取 k 件物品</text>
  <path d="M 270 90 L 270 112" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== 第①步：取 +1 ===== -->
  <rect x="120" y="116" width="300" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="135" y="136" font-size="12" fill="#4a7a3a" font-weight="bold">① 取 +1（最优，先取）</text>
  <text x="135" y="156" font-size="11.5" fill="#333">x₁ = min(numOnes, k)；剩余名额 r₁ = k − x₁</text>
  <path d="M 270 172 L 270 194" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== 第②步：取 0 ===== -->
  <rect x="120" y="198" width="300" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="135" y="218" font-size="12" fill="#d6a040" font-weight="bold">② 取 0（中性，凑数）</text>
  <text x="135" y="238" font-size="11.5" fill="#333">x₀ = min(numZeros, r₁)；剩余名额 r₂ = r₁ − x₀</text>
  <path d="M 270 254 L 270 276" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== 第③步：取 -1（被迫） ===== -->
  <rect x="120" y="280" width="300" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="135" y="300" font-size="12" fill="#b85450" font-weight="bold">③ 取 −1（被迫，补足 k）</text>
  <text x="135" y="320" font-size="11.5" fill="#333">r₂ = max(0, k − numOnes − numZeros) 件</text>
  <path d="M 270 336 L 270 358" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== 求和 ===== -->
  <rect x="90" y="362" width="360" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="382" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">求和：ans = x₁·1 + x₀·0 + r₂·(−1)</text>
  <text x="270" y="400" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">= x₁ − r₂ = min(numOnes, k) − max(0, k − numOnes − numZeros)</text>
</svg>
