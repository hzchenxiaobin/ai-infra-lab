<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：拆分 w[i] = prefix + suffix，按回文侧查哈希表</text>

  <!-- ===== Case A: prefix 是回文 ===== -->
  <rect x="24" y="50" width="512" height="160" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="44" y="74" font-size="13" fill="#446688" font-weight="bold">情况 A：prefix 是回文 ⟹ 前面接 rev(suffix)</text>

  <!-- words[k] = rev(suffix) -->
  <rect x="44" y="96" width="120" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="104" y="120" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">words[k]</text>
  <text x="104" y="148" text-anchor="middle" font-size="10.5" fill="#888">= rev(suffix)</text>

  <!-- + sign -->
  <text x="180" y="120" font-size="18" fill="#888" font-weight="bold">+</text>

  <!-- prefix (palindrome, green) -->
  <rect x="200" y="96" width="90" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="245" y="120" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">prefix</text>
  <text x="245" y="148" text-anchor="middle" font-size="10.5" fill="#4a7a3a">（回文 ✓）</text>

  <!-- + sign -->
  <text x="306" y="120" font-size="18" fill="#888" font-weight="bold">+</text>

  <!-- suffix -->
  <rect x="326" y="96" width="90" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="371" y="120" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">suffix</text>
  <text x="371" y="148" text-anchor="middle" font-size="10.5" fill="#888">= w[i] 的尾部</text>

  <!-- brace: words[k] + words[i] -->
  <path d="M44 162 L44 172 L416 172 L416 162" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="230" y="190" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">words[k] + w[i] = rev(suffix) + 回文 + suffix = 回文 ⟹ pair (k, i)</text>

  <!-- ===== Case B: suffix 是回文 ===== -->
  <rect x="24" y="230" width="512" height="160" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="44" y="254" font-size="13" fill="#d6a040" font-weight="bold">情况 B：suffix 是回文 ⟹ 后面接 rev(prefix)</text>

  <!-- prefix -->
  <rect x="44" y="276" width="90" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="89" y="300" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">prefix</text>
  <text x="89" y="328" text-anchor="middle" font-size="10.5" fill="#888">= w[i] 的头部</text>

  <!-- + sign -->
  <text x="150" y="300" font-size="18" fill="#888" font-weight="bold">+</text>

  <!-- suffix (palindrome, green) -->
  <rect x="170" y="276" width="90" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="215" y="300" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">suffix</text>
  <text x="215" y="328" text-anchor="middle" font-size="10.5" fill="#4a7a3a">（回文 ✓）</text>

  <!-- + sign -->
  <text x="276" y="300" font-size="18" fill="#888" font-weight="bold">+</text>

  <!-- words[k] = rev(prefix) -->
  <rect x="296" y="276" width="120" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="356" y="300" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">words[k]</text>
  <text x="356" y="328" text-anchor="middle" font-size="10.5" fill="#888">= rev(prefix)</text>

  <!-- brace: words[i] + words[k] -->
  <path d="M44 342 L44 352 L416 352 L416 342" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="230" y="370" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">w[i] + words[k] = prefix + 回文 + rev(prefix) = 回文 ⟹ pair (i, k)</text>

  <!-- bottom note -->
  <rect x="60" y="406" width="440" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="423" text-anchor="middle" font-size="11" fill="#b85450">遍历每个切分点 j ∈ [0, len]，两分支各查一次哈希表，O(1) 命中即配对</text>
</svg>
