<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="480" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：遍历判 x%6==0 → 累加 sum/cnt → cnt=0 返 0 否则 sum//cnt</text>

  <!-- ① Input -->
  <rect x="195" y="40" width="150" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="62" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 输入 nums（n 个元素）</text>
  <line x1="270" y1="74" x2="270" y2="96" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② init -->
  <rect x="140" y="100" width="260" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="123" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② sum = 0; cnt = 0; i = 0</text>
  <line x1="270" y1="136" x2="270" y2="156" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ◇ Diamond 1: loop condition -->
  <polygon points="270,158 350,192 270,226 190,192" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="188" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">i &lt; n ?</text>
  <text x="270" y="204" text-anchor="middle" font-size="9.5" fill="#888">（遍历未结束）</text>

  <!-- No branch (left) → return -->
  <line x1="190" y1="192" x2="132" y2="192" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="158" y="186" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="18" y="170" width="116" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="76" y="188" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⑤ return</text>
  <text x="76" y="202" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">cnt ? sum//cnt : 0</text>

  <!-- Yes branch (down) -->
  <line x1="270" y1="226" x2="270" y2="250" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="284" y="244" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- ③ x = nums[i] -->
  <rect x="200" y="254" width="140" height="30" fill="#f4f7fb" stroke="#888" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="273" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ x = nums[i]</text>
  <line x1="270" y1="284" x2="270" y2="304" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ◇ Diamond 2: divisibility by 6 -->
  <polygon points="270,306 360,342 270,378 180,342" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="338" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">x % 6 == 0 ?</text>
  <text x="270" y="354" text-anchor="middle" font-size="9.5" fill="#888">（偶且整除3）</text>

  <!-- No branch (right) → i++ box -->
  <line x1="360" y1="342" x2="418" y2="342" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="388" y="336" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">否</text>

  <!-- Yes branch (down) → sum box -->
  <line x1="270" y1="378" x2="270" y2="398" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="284" y="392" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- ④ sum update -->
  <rect x="110" y="400" width="320" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="423" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">④ sum += x; ++cnt</text>

  <!-- i++ box -->
  <rect x="418" y="326" width="80" height="32" fill="#f4f7fb" stroke="#888" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="458" y="346" text-anchor="middle" font-size="12" fill="#666" font-weight="bold">i++</text>

  <!-- sum box → i++ (up the right side) -->
  <path d="M 430 418 L 458 418 L 458 360" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i++ → loop back to Diamond 1 (up then left) -->
  <path d="M 458 326 L 458 192 L 354 192" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="492" y="256" text-anchor="middle" font-size="9.5" fill="#888">下一元素</text>

  <!-- footer -->
  <rect x="30" y="452" width="480" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="468" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">lcm(2,3)=6（互素折叠）：一次取模同时判偶与整除3，cnt=0 兜底返 0</text>
</svg>
