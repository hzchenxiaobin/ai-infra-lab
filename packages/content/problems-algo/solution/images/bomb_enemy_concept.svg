<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：炸弹放空格，向四方向杀敌，遇墙停止</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">行方向（左+右）+ 列方向（上+下）= 总杀敌数</text>

  <!-- ===== Grid ===== -->
  <!-- cell 55x50, start x=60 y=80 -->
  <!-- Column labels -->
  <text x="87" y="74" text-anchor="middle" font-size="10" fill="#888">col0</text>
  <text x="142" y="74" text-anchor="middle" font-size="10" fill="#888">col1</text>
  <text x="197" y="74" text-anchor="middle" font-size="10" fill="#888">col2</text>
  <text x="252" y="74" text-anchor="middle" font-size="10" fill="#888">col3</text>

  <!-- Row labels -->
  <text x="44" y="114" text-anchor="middle" font-size="10" fill="#888">row0</text>
  <text x="44" y="164" text-anchor="middle" font-size="10" fill="#888">row1</text>
  <text x="44" y="214" text-anchor="middle" font-size="10" fill="#888">row2</text>

  <!-- Row 0: 0 E 0 0 -->
  <rect x="60" y="90" width="55" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="87" y="120" text-anchor="middle" font-size="14" fill="#446688">0</text>

  <rect x="115" y="90" width="55" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="142" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">E</text>
  <text x="142" y="133" text-anchor="middle" font-size="8" fill="#b85450">↑杀</text>

  <rect x="170" y="90" width="55" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="197" y="120" text-anchor="middle" font-size="14" fill="#446688">0</text>

  <rect x="225" y="90" width="55" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="252" y="120" text-anchor="middle" font-size="14" fill="#446688">0</text>

  <!-- Row 1: E 0(BOMB) W E -->
  <rect x="60" y="140" width="55" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="87" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">E</text>
  <text x="87" y="183" text-anchor="middle" font-size="8" fill="#b85450">←杀</text>

  <!-- Bomb cell -->
  <rect x="115" y="140" width="55" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <circle cx="142" cy="165" r="9" fill="#d6a040" filter="url(#rough2)"/>
  <text x="142" y="169" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">B</text>
  <text x="142" y="183" text-anchor="middle" font-size="8" fill="#d6a040">炸弹位置</text>

  <!-- Wall -->
  <rect x="170" y="140" width="55" height="50" fill="#555" stroke="#333" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="197" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">W</text>
  <text x="197" y="183" text-anchor="middle" font-size="8" fill="#ff9999">墙！挡</text>

  <rect x="225" y="140" width="55" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="252" y="170" text-anchor="middle" font-size="14" fill="#446688">E</text>

  <!-- Row 2: 0 E 0 0 -->
  <rect x="60" y="190" width="55" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="87" y="220" text-anchor="middle" font-size="14" fill="#446688">0</text>

  <rect x="115" y="190" width="55" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="142" y="220" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">E</text>
  <text x="142" y="233" text-anchor="middle" font-size="8" fill="#b85450">↓杀</text>

  <rect x="170" y="190" width="55" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="197" y="220" text-anchor="middle" font-size="14" fill="#446688">0</text>

  <rect x="225" y="190" width="55" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="252" y="220" text-anchor="middle" font-size="14" fill="#446688">0</text>

  <!-- Direction arrows from bomb center (142,165) -->
  <!-- Left: bomb → E at (1,0) -->
  <path d="M 113 165 L 98 165" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <!-- Right: bomb → wall (blocked, dashed) -->
  <path d="M 171 165 L 186 165" stroke="#999" stroke-width="1.8" stroke-dasharray="4,3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <!-- Up: bomb → E at (0,1) -->
  <path d="M 142 139 L 142 124" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <!-- Down: bomb → E at (2,1) -->
  <path d="M 142 191 L 142 206" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- ===== Right side: explanation ===== -->
  <rect x="310" y="90" width="210" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="415" y="108" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">行方向杀敌 = rowHits</text>
  <text x="320" y="126" font-size="10" fill="#555">左扫到墙/边界 + 右扫到墙/边界</text>
  <text x="320" y="140" font-size="10" fill="#555">本例：左杀 1 个 E，右遇 W 挡住 → 1</text>

  <rect x="310" y="156" width="210" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="415" y="174" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">列方向杀敌 = colHits</text>
  <text x="320" y="192" font-size="10" fill="#555">上扫到墙/边界 + 下扫到墙/边界</text>
  <text x="320" y="206" font-size="10" fill="#555">本例：上杀 1 + 下杀 1 → 2</text>

  <rect x="310" y="222" width="210" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="415" y="242" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">总杀敌 = rowHits + colHits</text>
  <text x="415" y="262" text-anchor="middle" font-size="16" font-weight="bold" fill="#d6a040">1 + 2 = 3</text>

  <!-- ===== Bottom key insight ===== -->
  <rect x="40" y="288" width="480" height="80" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="310" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">关键洞察：墙把行/列切分成「段」</text>
  <text x="56" y="330" font-size="10" fill="#555">① 同一段（两墙之间或墙与边界之间）内所有空格，行方向杀敌数相同——段内敌人数固定。</text>
  <text x="56" y="348" font-size="10" fill="#555">② 只需在「段起点」算一次该段敌人数，段内所有格子复用 → 这就是 O(mn) 的关键。</text>
  <text x="56" y="362" font-size="10" fill="#555">③ 判断段起点：左边是墙或边界 → 行段起点；上边是墙或边界 → 列段起点。</text>
</svg>
