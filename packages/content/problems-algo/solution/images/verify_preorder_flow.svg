<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">单调栈验证前序序列：算法流程</text>

  <!-- Start -->
  <rect x="200" y="44" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始</text>

  <line x1="260" y1="72" x2="260" y2="88" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init -->
  <rect x="170" y="92" width="180" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="110" text-anchor="middle" font-size="11" fill="#333">lower = -∞, stk = []</text>

  <line x1="260" y1="120" x2="260" y2="136" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- For each x -->
  <rect x="160" y="140" width="200" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="158" text-anchor="middle" font-size="11" fill="#333">取下一个元素 x</text>

  <line x1="260" y1="168" x2="260" y2="184" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: x < lower? -->
  <polygon points="260,188 370,224 260,260 150,224" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="220" text-anchor="middle" font-size="11" fill="#333">x &lt; lower?</text>
  <text x="260" y="234" text-anchor="middle" font-size="10" fill="#888">(下界检查)</text>

  <!-- Yes: return false -->
  <line x1="370" y1="224" x2="410" y2="224" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="218" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="410" y="210" width="90" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="455" y="228" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return false</text>

  <!-- No: continue -->
  <line x1="260" y1="260" x2="260" y2="276" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="272" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- Decision: stk not empty and x > top? -->
  <polygon points="260,280 390,316 260,352 130,316" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="312" text-anchor="middle" font-size="11" fill="#333">stk非空 且</text>
  <text x="260" y="326" text-anchor="middle" font-size="11" fill="#333">x &gt; stk.top()?</text>

  <!-- Yes: pop + update lower, loop back -->
  <line x1="130" y1="316" x2="60" y2="316" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="310" font-size="10" fill="#d6a040" font-weight="bold">是</text>
  <rect x="20" y="302" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="40" y="314" text-anchor="middle" font-size="9" fill="#333">lower</text>
  <text x="40" y="324" text-anchor="middle" font-size="9" fill="#333">= pop</text>
  <!-- Loop back arrow -->
  <path d="M 40 302 L 40 224 L 150 224" fill="none" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="48" y="265" font-size="9" fill="#d6a040">循环</text>

  <!-- No: push x -->
  <line x1="260" y1="352" x2="260" y2="362" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="360" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="190" y="364" width="140" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="380" text-anchor="middle" font-size="11" fill="#333">stk.push(x) → 回到取下一元素</text>

  <!-- End note -->
  <text x="260" y="396" text-anchor="middle" font-size="10" fill="#888">遍历结束无非法 → return true</text>
</svg>
