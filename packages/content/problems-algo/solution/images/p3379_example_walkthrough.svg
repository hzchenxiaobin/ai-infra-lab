<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例 1 演算：nums = [3, −2, 1, 1]</text>

  <!-- nums 数组 -->
  <text x="88" y="70" text-anchor="end" font-size="14" fill="#446688" filter="url(#rough2)">nums</text>
  <rect x="100" y="48" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="146" y="48" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="192" y="48" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="238" y="48" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="122" y="70" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="168" y="70" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">−2</text>
  <text x="214" y="70" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="260" y="70" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="122" y="96" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">0</text>
  <text x="168" y="96" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">1</text>
  <text x="214" y="96" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">2</text>
  <text x="260" y="96" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">3</text>

  <!-- 演算表 -->
  <rect x="30" y="112" width="470" height="34" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="55" y="134" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">i=0</text>
  <text x="105" y="134" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">+3</text>
  <text x="170" y="134" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">右 3 步</text>
  <text x="290" y="134" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">(0+3) % 4 = 3</text>
  <text x="440" y="134" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">nums[3] = 1</text>

  <rect x="30" y="152" width="470" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="55" y="174" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">i=1</text>
  <text x="105" y="174" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">−2</text>
  <text x="170" y="174" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">左 2 步</text>
  <text x="290" y="174" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">((1−2)%4+4)%4 = 3</text>
  <text x="440" y="174" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">nums[3] = 1</text>

  <rect x="30" y="192" width="470" height="34" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="55" y="214" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">i=2</text>
  <text x="105" y="214" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">+1</text>
  <text x="170" y="214" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">右 1 步</text>
  <text x="290" y="214" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">(2+1) % 4 = 3</text>
  <text x="440" y="214" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">nums[3] = 1</text>

  <rect x="30" y="232" width="470" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="55" y="254" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">i=3</text>
  <text x="105" y="254" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">+1</text>
  <text x="170" y="254" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">右 1 步</text>
  <text x="290" y="254" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">((3+1)%4+4)%4 = 0</text>
  <text x="440" y="254" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">nums[0] = 3</text>

  <!-- result 数组 -->
  <text x="88" y="290" text-anchor="end" font-size="14" fill="#4a7a3a" filter="url(#rough2)">result</text>
  <rect x="100" y="268" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <rect x="146" y="268" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <rect x="192" y="268" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <rect x="238" y="268" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="122" y="290" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="168" y="290" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="214" y="290" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="260" y="290" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="122" y="316" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">0</text>
  <text x="168" y="316" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">1</text>
  <text x="214" y="316" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">2</text>
  <text x="260" y="316" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">3</text>

  <!-- 底部说明 -->
  <text x="260" y="348" text-anchor="middle" font-size="13" fill="#666" font-style="italic" filter="url(#rough2)">两种回绕：i=1 左穿开头绕到末尾；i=3 右穿末尾绕回开头</text>
</svg>
