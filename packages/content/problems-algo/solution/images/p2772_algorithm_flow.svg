<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2772f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arr2772r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arr2772g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：差分数组贪心</text>

  <!-- start box -->
  <rect x="170" y="30" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="260" y="49" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">i=0, curr=0, diff[0..n]=0</text>

  <!-- arrow down -->
  <path d="M260,60 L260,72" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr2772f)" filter="url(#rough2)"/>

  <!-- diamond 1: i < n? -->
  <polygon points="260,72 312,94 260,116 208,94" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="98" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">i &lt; n?</text>
  <!-- no → return true -->
  <path d="M312,94 L350,94" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr2772g)" filter="url(#rough2)"/>
  <text x="330" y="88" text-anchor="middle" font-size="9" fill="#4a7a3a">否</text>
  <rect x="350" y="78" width="120" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="410" y="98" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return true</text>

  <!-- yes ↓ -->
  <path d="M260,116 L260,128" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr2772f)" filter="url(#rough2)"/>
  <text x="270" y="124" font-size="9" fill="#446688">是</text>

  <!-- process 1 -->
  <rect x="170" y="128" width="180" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="260" y="146" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">curr += diff[i]</text>

  <path d="M260,156 L260,168" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr2772f)" filter="url(#rough2)"/>

  <!-- process 2 -->
  <rect x="170" y="168" width="180" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="260" y="186" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">need = nums[i] − curr</text>

  <path d="M260,196 L260,208" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr2772f)" filter="url(#rough2)"/>

  <!-- diamond 2: need < 0? -->
  <polygon points="260,208 317,230 260,252 203,230" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="234" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">need &lt; 0?</text>
  <!-- yes → return false -->
  <path d="M317,230 L350,230" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr2772r)" filter="url(#rough2)"/>
  <text x="333" y="224" text-anchor="middle" font-size="9" fill="#b85450">是</text>
  <rect x="350" y="214" width="120" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="410" y="234" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return false</text>

  <!-- no ↓ -->
  <path d="M260,252 L260,264" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr2772f)" filter="url(#rough2)"/>
  <text x="270" y="260" font-size="9" fill="#446688">否</text>

  <!-- diamond 3: need > 0 且 i+k > n? -->
  <polygon points="260,264 332,286 260,308 188,286" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="290" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">need&gt;0 且 i+k&gt;n?</text>
  <!-- yes → return false -->
  <path d="M332,286 L350,286" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr2772r)" filter="url(#rough2)"/>
  <text x="341" y="280" text-anchor="middle" font-size="9" fill="#b85450">是</text>
  <rect x="350" y="270" width="120" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="410" y="290" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return false</text>

  <!-- no ↓ -->
  <path d="M260,308 L260,320" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr2772f)" filter="url(#rough2)"/>
  <text x="270" y="316" font-size="9" fill="#446688">否</text>

  <!-- process 3 -->
  <rect x="130" y="320" width="260" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="260" y="338" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">curr += need; diff[i+k] −= need</text>

  <path d="M260,348 L260,360" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr2772f)" filter="url(#rough2)"/>

  <!-- process 4: i++ -->
  <rect x="220" y="360" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="260" y="378" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">i++</text>

  <!-- loop back arrow -->
  <path d="M220,374 L80,374 L80,94 L208,94" fill="none" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr2772f)" filter="url(#rough2)"/>
  <text x="80" y="234" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold" transform="rotate(-90,80,234)">i++ 循环</text>
</svg>
