<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心概念：standalone word = 两侧必须都有空格</text>

  <!-- Left panel: counted -->
  <rect x="16" y="50" width="250" height="140" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="141" y="70" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓ 计入（两侧均有空格）</text>

  <!-- example 1: a bull market -->
  <rect x="36" y="86" width="210" height="26" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="141" y="103" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">…a ␣bull␣ market…</text>
  <rect x="108" y="86" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>

  <!-- example 2: a bear market -->
  <rect x="36" y="120" width="210" height="26" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="141" y="137" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">…a ␣bear␣ market…</text>
  <rect x="108" y="120" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>

  <text x="141" y="170" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">LIKE '% bull %' 命中</text>

  <!-- Right panel: NOT counted -->
  <rect x="294" y="50" width="250" height="220" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="419" y="70" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗ 不计入（某侧缺空格）</text>

  <!-- bullet -->
  <rect x="314" y="86" width="210" height="26" fill="#fff" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="419" y="103" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">…bullet…</text>
  <rect x="386" y="86" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="419" y="124" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">bull 后无空格（接 et）</text>

  <!-- bull. -->
  <rect x="314" y="134" width="210" height="26" fill="#fff" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="419" y="151" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">…bull. The…</text>
  <rect x="386" y="134" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="419" y="172" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">bull 后是句号非空格</text>

  <!-- bear at start -->
  <rect x="314" y="182" width="210" height="26" fill="#fff" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="419" y="199" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">bear market is…</text>
  <rect x="314" y="182" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="419" y="220" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">bear 前无空格（句首）</text>

  <!-- bears -->
  <rect x="314" y="230" width="210" height="26" fill="#fff" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="419" y="247" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">…bears are…</text>
  <rect x="368" y="230" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="419" y="268" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">bear 后无空格（接 s）</text>

  <!-- bottom note -->
  <rect x="36" y="290" width="488" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="310" text-anchor="middle" font-size="11" fill="#a07820" filter="url(#rough2)">💡 规则：单词两侧都必须是空格（space）才算 standalone word</text>
  <text x="280" y="328" text-anchor="middle" font-size="11" fill="#a07820" filter="url(#rough2)">SQL 模式 '% bull %' = 任意文本 + 空格 + bull + 空格 + 任意文本</text>

  <text x="280" y="368" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">判断标准：LIKE '% &lt;word&gt; %' 两端空格缺一不可</text>
</svg>
