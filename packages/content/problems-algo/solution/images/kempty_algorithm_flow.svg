<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="560" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">算法流程：逆排列 + 单调队列滑窗</text>

  <!-- step 1: build days -->
  <rect x="140" y="46" width="280" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 构造逆排列 days[pos] = day</text>
  <text x="280" y="80" text-anchor="middle" font-size="10.5" fill="#666">遍历 bulbs，days[bulbs[i]] = i+1，O(n)</text>

  <path d="M 280 88 L 280 108" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2: K==0 special -->
  <polygon points="280,110 432,148 280,186 128,148" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="144" text-anchor="middle" font-size="11.5" fill="#333">K == 0 ?</text>
  <text x="280" y="162" text-anchor="middle" font-size="10" fill="#888">中段为空</text>

  <path d="M 128 148 L 60 148" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="92" y="140" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="16" y="130" width="48" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="40" y="146" text-anchor="middle" font-size="9.5" fill="#b85450">相邻 max</text>
  <text x="40" y="159" text-anchor="middle" font-size="9.5" fill="#b85450">取最小</text>

  <path d="M 280 186 L 280 206" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="298" y="200" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- step 3: build initial deque -->
  <rect x="110" y="208" width="340" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="226" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 建初始中段 [2, K+1] 的单调递增队列</text>
  <text x="280" y="242" text-anchor="middle" font-size="10.5" fill="#666">队首 dq[0] = 中段 days 最小值，left = 1</text>

  <path d="M 280 250 L 280 270" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 4: loop condition -->
  <rect x="150" y="272" width="260" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="290" text-anchor="middle" font-size="12" fill="#333">left + K + 1 ≤ n ?</text>
  <text x="280" y="306" text-anchor="middle" font-size="10" fill="#888">还有窗口可判</text>

  <path d="M 150 292 L 60 292" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="104" y="284" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="16" y="274" width="48" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="40" y="290" text-anchor="middle" font-size="9.5" fill="#4a7a3a">return</text>
  <text x="40" y="303" text-anchor="middle" font-size="9.5" fill="#4a7a3a">ans/−1</text>

  <path d="M 280 312 L 280 332" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="298" y="326" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- step 5: check validity -->
  <polygon points="280,334 432,372 280,410 128,372" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="366" text-anchor="middle" font-size="11" fill="#333">days[dq[0]] &gt;</text>
  <text x="280" y="384" text-anchor="middle" font-size="11" fill="#333">max(days[left],days[right]) ?</text>

  <path d="M 128 372 L 60 372" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="92" y="364" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="16" y="354" width="48" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="40" y="370" text-anchor="middle" font-size="9.5" fill="#4a7a3a">ans =</text>
  <text x="40" y="383" text-anchor="middle" font-size="9.5" fill="#4a7a3a">min(ans,…)</text>

  <path d="M 280 410 L 280 430" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="298" y="424" font-size="10" fill="#888">否/继续</text>

  <!-- step 6: slide deque -->
  <rect x="100" y="432" width="360" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="452" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ 窗口右移一格</text>
  <text x="280" y="470" text-anchor="middle" font-size="10.5" fill="#666">若 dq[0]==left+1 弹队首；并入 right 维持单调</text>

  <path d="M 280 482 L 280 502" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="220" y="504" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="526" text-anchor="middle" font-size="12" fill="#333">left += 1</text>

  <path d="M 280 538 L 280 548 L 460 548 L 460 292 L 410 292" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="376" y="542" font-size="10" fill="#446688">回循环</text>
</svg>
