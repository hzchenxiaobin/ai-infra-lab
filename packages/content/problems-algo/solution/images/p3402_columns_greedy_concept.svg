<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">核心观察：列独立 + 逐行贪心 f[i] = max(a[i], prev+1)</text>

  <!-- Left: original grid -->
  <text x="30" y="58" font-size="12" fill="#333" filter="url(#rough2)">原矩阵 grid（示例 1）</text>

  <text x="50" y="87" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">i=0</text>
  <text x="50" y="125" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">i=1</text>
  <text x="50" y="163" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">i=2</text>
  <text x="50" y="201" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">i=3</text>

  <rect x="58" y="66" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="75" y="88" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="96" y="66" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="113" y="88" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>

  <rect x="58" y="104" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="75" y="126" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="96" y="104" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="113" y="126" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>

  <rect x="58" y="142" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="75" y="164" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="96" y="142" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="113" y="164" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>

  <rect x="58" y="180" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="75" y="202" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="96" y="180" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="113" y="202" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <text x="75" y="232" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">第0列</text>
  <text x="113" y="232" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">第1列</text>

  <text x="30" y="252" font-size="11" fill="#666" filter="url(#rough2)">操作只动单个格子</text>
  <text x="30" y="270" font-size="11" fill="#666" filter="url(#rough2)">列间零约束 → 各列独立求解</text>

  <!-- arrow: extract column 0 -->
  <text x="176" y="140" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">提取第 0 列</text>
  <path d="M138,152 L212,152" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Right: greedy processing of column 0 -->
  <text x="210" y="58" font-size="12" fill="#333" filter="url(#rough2)">第 0 列的贪心过程</text>
  <text x="237" y="76" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">原 a</text>
  <text x="303" y="76" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">终 f</text>

  <!-- row 0 -->
  <rect x="222" y="80" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="237" y="100" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <path d="M256,95 L284,95" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="288" y="80" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="303" y="100" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="330" y="83" width="42" height="24" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="351" y="99" text-anchor="middle" font-size="12" fill="#2d5523" filter="url(#rough2)">0</text>
  <text x="384" y="99" font-size="10.5" fill="#666" filter="url(#rough2)">prev=3</text>

  <path d="M303,110 L303,116" stroke="#b85450" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- row 1 -->
  <rect x="222" y="118" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="237" y="138" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <path d="M256,133 L284,133" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="288" y="118" width="30" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="303" y="138" text-anchor="middle" font-size="12.5" fill="#7a2f2b" filter="url(#rough2)">4</text>
  <rect x="330" y="121" width="42" height="24" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="351" y="137" text-anchor="middle" font-size="12" fill="#7a2f2b" filter="url(#rough2)">+3</text>
  <text x="384" y="137" font-size="10.5" fill="#666" filter="url(#rough2)">prev=4</text>

  <path d="M303,148 L303,154" stroke="#b85450" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- row 2 -->
  <rect x="222" y="156" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="237" y="176" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <path d="M256,171 L284,171" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="288" y="156" width="30" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="303" y="176" text-anchor="middle" font-size="12.5" fill="#7a2f2b" filter="url(#rough2)">5</text>
  <rect x="330" y="159" width="42" height="24" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="351" y="175" text-anchor="middle" font-size="12" fill="#7a2f2b" filter="url(#rough2)">+2</text>
  <text x="384" y="175" font-size="10.5" fill="#666" filter="url(#rough2)">prev=5</text>

  <path d="M303,186 L303,192" stroke="#b85450" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- row 3 -->
  <rect x="222" y="194" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="237" y="214" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <path d="M256,209 L284,209" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="288" y="194" width="30" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="303" y="214" text-anchor="middle" font-size="12.5" fill="#7a2f2b" filter="url(#rough2)">6</text>
  <rect x="330" y="197" width="42" height="24" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="351" y="213" text-anchor="middle" font-size="12" fill="#7a2f2b" filter="url(#rough2)">+6</text>
  <text x="384" y="213" font-size="10.5" fill="#666" filter="url(#rough2)">prev=6</text>

  <text x="210" y="252" font-size="10.5" fill="#666" filter="url(#rough2)">约束：f[i] ≥ a[i]（只能加）且 f[i] ≥ f[i−1]+1（严格递增）</text>
  <text x="210" y="270" font-size="10.5" fill="#8a6206" filter="url(#rough2)">本列代价 = 3+2+6 = 11；第 1 列独立同理 = 4，总计 15 ✓</text>

  <!-- bottom note -->
  <rect x="25" y="300" width="470" height="60" fill="#f5f0e6" stroke="#b85450" stroke-width="1" stroke-dasharray="5 3" rx="8" filter="url(#rough2)"/>
  <text x="260" y="323" text-anchor="middle" font-size="12" fill="#7a4a2b" filter="url(#rough2)">最优性（归纳）：任何可行方案 g 都逐点满足 g[i] ≥ f[i]</text>
  <text x="260" y="345" text-anchor="middle" font-size="12" fill="#7a4a2b" filter="url(#rough2)">⟹ Σ(g[i]−a[i]) ≥ Σ(f[i]−a[i])；抬得更高只会把后面的下界顶得更紧</text>
</svg>
