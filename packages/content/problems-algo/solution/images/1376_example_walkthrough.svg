<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="540" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：n=8, headID=0, manager=[-1,0,0,1,1,2,2,2], informTime=[3,2,4,0,0,0,0,0]</text>
  <text x="320" y="46" text-anchor="middle" font-size="11" fill="#888">上：DFS 自底向上返回值（绿标）；下：通知时间轴（Gantt），1、2 并行但 2 更慢决定终点</text>

  <!-- ====== TREE with DFS return values ====== -->
  <!-- edges -->
  <path d="M 300 100 L 206 156" stroke="#888" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 340 100 L 434 156" stroke="#b85450" stroke-width="2.8" fill="none" filter="url(#rough2)"/>
  <path d="M 174 184 L 144 232" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 206 184 L 236 232" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 430 184 L 384 232" stroke="#b85450" stroke-width="2.6" fill="none" filter="url(#rough2)"/>
  <path d="M 450 184 L 450 232" stroke="#b85450" stroke-width="2.6" fill="none" filter="url(#rough2)"/>
  <path d="M 470 184 L 516 232" stroke="#b85450" stroke-width="2.6" fill="none" filter="url(#rough2)"/>

  <!-- root 0 -->
  <ellipse cx="320" cy="88" rx="24" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="320" y="84" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="320" y="98" text-anchor="middle" font-size="9" fill="#5a8a5a">t=3</text>
  <!-- dfs tag -->
  <rect x="352" y="74" width="86" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="395" y="94" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">dfs=3+max(2,4)=7</text>

  <!-- node 1 -->
  <ellipse cx="190" cy="168" rx="22" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="164" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>
  <text x="190" y="178" text-anchor="middle" font-size="9" fill="#5577aa">t=2</text>
  <rect x="218" y="156" width="74" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="255" y="173" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">dfs=2+0=2</text>

  <!-- node 2 (bottleneck) -->
  <ellipse cx="450" cy="168" rx="22" ry="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="450" y="164" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2</text>
  <text x="450" y="178" text-anchor="middle" font-size="9" fill="#a85a56">t=4</text>
  <rect x="478" y="156" width="78" height="26" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="517" y="173" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">dfs=4+0=4</text>

  <!-- leaves -->
  <ellipse cx="140" cy="248" rx="16" ry="14" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="140" y="252" text-anchor="middle" font-size="11" fill="#888">3</text>
  <text x="140" y="276" text-anchor="middle" font-size="9" fill="#888">dfs=0</text>

  <ellipse cx="240" cy="248" rx="16" ry="14" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="240" y="252" text-anchor="middle" font-size="11" fill="#888">4</text>
  <text x="240" y="276" text-anchor="middle" font-size="9" fill="#888">dfs=0</text>

  <ellipse cx="380" cy="248" rx="16" ry="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="252" text-anchor="middle" font-size="11" fill="#b85450">5</text>
  <text x="380" y="276" text-anchor="middle" font-size="9" fill="#b85450">dfs=0</text>

  <ellipse cx="450" cy="248" rx="16" ry="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="450" y="252" text-anchor="middle" font-size="11" fill="#b85450">6</text>
  <text x="450" y="276" text-anchor="middle" font-size="9" fill="#b85450">dfs=0</text>

  <ellipse cx="520" cy="248" rx="16" ry="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="520" y="252" text-anchor="middle" font-size="11" fill="#b85450">7</text>
  <text x="520" y="276" text-anchor="middle" font-size="9" fill="#b85450">dfs=0</text>

  <!-- divider -->
  <line x1="40" y1="298" x2="600" y2="298" stroke="#ddd" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="320" y="316" text-anchor="middle" font-size="12" fill="#666" font-weight="bold">通知时间轴（Gantt）：同一父节点的子节点并行通知</text>

  <!-- ====== Gantt timeline ====== -->
  <!-- axis -->
  <line x1="70" y1="448" x2="580" y2="448" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <!-- ticks: t=0(70), t=3(287), t=5(425), t=7(580) ; 510px / 7 = 72.857 -->
  <g font-size="10" fill="#666">
    <line x1="70" y1="446" x2="70" y2="454" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="70" y="468" text-anchor="middle">t=0</text>
    <line x1="287" y1="446" x2="287" y2="454" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="287" y="468" text-anchor="middle">t=3</text>
    <line x1="425" y1="446" x2="425" y2="454" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="425" y="468" text-anchor="middle">t=5</text>
    <line x1="580" y1="446" x2="580" y2="454" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="580" y="468" text-anchor="middle" fill="#b85450" font-weight="bold">t=7 ←终</text>
  </g>

  <!-- vertical guide lines -->
  <line x1="287" y1="332" x2="287" y2="448" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <line x1="425" y1="332" x2="425" y2="448" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <line x1="580" y1="332" x2="580" y2="448" stroke="#f1c0c0" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- bar: node 0, t=0..3 -->
  <rect x="70" y="334" width="217" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="178" y="350" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">员工0 通知 (3min)</text>

  <!-- bar: node 1, t=3..5 -->
  <rect x="287" y="364" width="138" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="356" y="380" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">员工1 通知 (2min)</text>

  <!-- bar: node 2, t=3..7 (bottleneck) -->
  <rect x="287" y="394" width="293" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="433" y="410" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">员工2 通知 (4min) ← 瓶颈</text>

  <!-- annotations -->
  <text x="287" y="328" text-anchor="middle" font-size="9" fill="#666">0 完成，1/2 同时开始</text>
  <text x="425" y="328" text-anchor="middle" font-size="9" fill="#666">1 完成→3,4 收到</text>

  <!-- bottom note -->
  <rect x="40" y="482" width="560" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="503" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">1、2 在 t=3 同时开始，但 2 耗时更长 → 终点由 2 决定（t=7）</text>
  <text x="320" y="520" text-anchor="middle" font-size="11" fill="#666">并行下传 ⟹ 总时间 = 最长链的 informTime 之和 = dfs(0) = 7</text>
</svg>
