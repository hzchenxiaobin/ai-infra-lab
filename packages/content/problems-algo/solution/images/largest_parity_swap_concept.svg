<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">奇偶性分组排序：同奇偶数字可自由排列</text>

  <!-- ===== Row 1: original number ===== -->
  <text x="60" y="68" font-size="11" fill="#446688" font-weight="bold">num = 1234</text>
  <g font-size="13">
    <rect x="170" y="56" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="195" y="78" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <text x="195" y="104" text-anchor="middle" font-size="9" fill="#d6a040">奇</text>

    <rect x="228" y="56" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="253" y="78" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <text x="253" y="104" text-anchor="middle" font-size="9" fill="#446688">偶</text>

    <rect x="286" y="56" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="311" y="78" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
    <text x="311" y="104" text-anchor="middle" font-size="9" fill="#d6a040">奇</text>

    <rect x="344" y="56" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="369" y="78" text-anchor="middle" fill="#446688" font-weight="bold">4</text>
    <text x="369" y="104" text-anchor="middle" font-size="9" fill="#446688">偶</text>
  </g>

  <!-- Arrow down: split -->
  <path d="M 280 120 L 280 138" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="134" font-size="10" fill="#666">按值奇偶分组</text>

  <!-- ===== Row 2: two groups ===== -->
  <text x="60" y="166" font-size="11" fill="#d6a040" font-weight="bold">奇数组</text>
  <g font-size="13">
    <rect x="130" y="154" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="155" y="176" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <rect x="188" y="154" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="213" y="176" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
  </g>

  <text x="330" y="166" font-size="11" fill="#446688" font-weight="bold">偶数组</text>
  <g font-size="13">
    <rect x="392" y="154" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="417" y="176" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <rect x="450" y="154" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="475" y="176" text-anchor="middle" fill="#446688" font-weight="bold">4</text>
  </g>

  <!-- Arrow down: sort -->
  <path d="M 280 200 L 280 218" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="214" font-size="10" fill="#666">各自降序排序</text>

  <!-- ===== Row 3: sorted groups ===== -->
  <g font-size="13">
    <rect x="130" y="234" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="155" y="256" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
    <rect x="188" y="234" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="213" y="256" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>

    <rect x="392" y="234" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="417" y="256" text-anchor="middle" fill="#446688" font-weight="bold">4</text>
    <rect x="450" y="234" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="475" y="256" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
  </g>

  <!-- Arrow down: merge -->
  <path d="M 280 280 L 280 298" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="294" font-size="10" fill="#666">按原位置奇偶性回填</text>

  <!-- ===== Row 4: result ===== -->
  <text x="60" y="338" font-size="11" fill="#b85450" font-weight="bold">ans = 3412</text>
  <g font-size="13">
    <rect x="170" y="326" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="195" y="348" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
    <text x="195" y="374" text-anchor="middle" font-size="9" fill="#d6a040">奇</text>

    <rect x="228" y="326" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="253" y="348" text-anchor="middle" fill="#446688" font-weight="bold">4</text>
    <text x="253" y="374" text-anchor="middle" font-size="9" fill="#446688">偶</text>

    <rect x="286" y="326" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="311" y="348" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <text x="311" y="374" text-anchor="middle" font-size="9" fill="#d6a040">奇</text>

    <rect x="344" y="326" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="369" y="348" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <text x="369" y="374" text-anchor="middle" font-size="9" fill="#446688">偶</text>
  </g>

  <!-- ===== Legend ===== -->
  <rect x="40" y="394" width="480" height="38" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="6" filter="url(#rough2)"/>
  <text x="55" y="412" font-size="10" fill="#d6a040">奇数位：从大到小回填到原来放奇数的位置</text>
  <text x="55" y="426" font-size="10" fill="#446688">偶数位：从大到小回填到原来放偶数的位置</text>
  <text x="320" y="412" font-size="10" fill="#b85450">位置奇偶性固定，只能换同奇偶的数字</text>
  <text x="320" y="426" font-size="10" fill="#888">大数优先高位 → 贪心排序即最优</text>
</svg>
