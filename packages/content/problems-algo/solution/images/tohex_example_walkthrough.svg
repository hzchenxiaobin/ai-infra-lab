<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="470" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：26 → "1a"，-1 → "ffffffff"</text>

  <!-- ===== Example 1: num = 26 ===== -->
  <text x="40" y="62" font-size="12" fill="#446688" font-weight="bold">用例一：num = 26</text>

  <!-- table header -->
  <rect x="40" y="70" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="70" y="86" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">轮次</text>
  <rect x="100" y="70" width="130" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="165" y="86" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">n（进入时）</text>
  <rect x="230" y="70" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="275" y="86" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">n &amp; 0xf</text>
  <rect x="320" y="70" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="360" y="86" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">hex 字符</text>
  <rect x="400" y="70" width="130" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="465" y="86" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">n &gt;&gt;= 4 后</text>

  <!-- row 1 -->
  <rect x="40" y="94" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="70" y="110" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="100" y="94" width="130" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="165" y="110" text-anchor="middle" font-size="11" fill="#333">26  (0x1A)</text>
  <rect x="230" y="94" width="90" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="275" y="110" text-anchor="middle" font-size="11" fill="#333">10  (0xa)</text>
  <rect x="320" y="94" width="80" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="360" y="110" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">a</text>
  <rect x="400" y="94" width="130" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="465" y="110" text-anchor="middle" font-size="11" fill="#333">1</text>

  <!-- row 2 -->
  <rect x="40" y="118" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="70" y="134" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="100" y="118" width="130" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="165" y="134" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="230" y="118" width="90" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="275" y="134" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="320" y="118" width="80" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="360" y="134" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <rect x="400" y="118" width="130" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="465" y="134" text-anchor="middle" font-size="11" fill="#333">0</text>

  <!-- row 3 stop -->
  <rect x="40" y="142" width="490" height="20" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="285" y="156" text-anchor="middle" font-size="10.5" fill="#888">轮次 3: n=0 → 停止</text>

  <!-- result 1 -->
  <path d="M 360 168 L 360 180" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="300" y="182" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="360" y="200" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">ans=[a,1] → "1a" ✓</text>

  <!-- ===== Example 2: num = -1 ===== -->
  <text x="40" y="240" font-size="12" fill="#b85450" font-weight="bold">用例二：num = -1</text>

  <!-- reinterpret note -->
  <rect x="40" y="248" width="500" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="290" y="266" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">unsigned n = (unsigned)(-1) = 4294967295  (0xFFFFFFFF)</text>

  <!-- 8 rounds strip: all produce f -->
  <text x="40" y="296" font-size="11" fill="#446688" font-weight="bold">8 轮抠取（每轮 n &amp; 0xf = 15 → 'f'，n &gt;&gt;= 4 后高位继续全 1，直到第 8 轮归零）</text>

  <!-- round labels 1..8 -->
  <rect x="40"  y="304" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="70"  y="319" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">轮次 1</text>
  <rect x="100" y="304" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="130" y="319" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">轮次 2</text>
  <rect x="160" y="304" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="190" y="319" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">轮次 3</text>
  <rect x="220" y="304" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="250" y="319" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">轮次 4</text>
  <rect x="280" y="304" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="310" y="319" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">轮次 5</text>
  <rect x="340" y="304" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="370" y="319" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">轮次 6</text>
  <rect x="400" y="304" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="430" y="319" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">轮次 7</text>
  <rect x="460" y="304" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="490" y="319" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">轮次 8</text>

  <!-- hex chars row -->
  <rect x="40"  y="328" width="60" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="70"  y="347" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">f</text>
  <rect x="100" y="328" width="60" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="130" y="347" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">f</text>
  <rect x="160" y="328" width="60" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="190" y="347" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">f</text>
  <rect x="220" y="328" width="60" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="250" y="347" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">f</text>
  <rect x="280" y="328" width="60" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="310" y="347" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">f</text>
  <rect x="340" y="328" width="60" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="370" y="347" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">f</text>
  <rect x="400" y="328" width="60" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="430" y="347" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">f</text>
  <rect x="460" y="328" width="60" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="490" y="347" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">f</text>

  <!-- n >>= 4 remaining bits row -->
  <text x="20" y="378" font-size="10" fill="#888">剩余位数</text>
  <text x="70"  y="378" text-anchor="middle" font-size="10" fill="#888">28 位</text>
  <text x="130" y="378" text-anchor="middle" font-size="10" fill="#888">24 位</text>
  <text x="190" y="378" text-anchor="middle" font-size="10" fill="#888">20 位</text>
  <text x="250" y="378" text-anchor="middle" font-size="10" fill="#888">16 位</text>
  <text x="310" y="378" text-anchor="middle" font-size="10" fill="#888">12 位</text>
  <text x="370" y="378" text-anchor="middle" font-size="10" fill="#888">8 位</text>
  <text x="430" y="378" text-anchor="middle" font-size="10" fill="#888">4 位</text>
  <text x="490" y="378" text-anchor="middle" font-size="10" fill="#82b366" font-weight="bold">0 ✓</text>

  <!-- result 2 -->
  <path d="M 290 392 L 290 406" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="200" y="408" width="180" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="426" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">ans=[f×8] → "ffffffff" ✓</text>

  <!-- summary note -->
  <rect x="40" y="446" width="500" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="290" y="460" text-anchor="middle" font-size="10.5" fill="#888">正数按有效位数提前结束；负数经无符号重解释后必跑满 8 轮</text>
</svg>
