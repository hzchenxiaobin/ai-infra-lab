<svg xmlns="http://www.w3.org/2000/svg" width="860" height="540" viewBox="0 0 860 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="860" height="540" fill="#fdfcf7"/>
  <text x="430" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">三大数据结构协同</text>
  <path d="M 280 46 Q 430 54 580 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Left: userTweets ===== -->
  <g filter="url(#sk)"><rect x="40" y="74" width="340" height="260" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="210" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">userTweets: userId → 推文列表</text>
  <text x="210" y="118" text-anchor="middle" font-size="10.5" fill="#5a7a9e">每条推文 = (time, tweetId)，按时间递增</text>

  <!-- user 1 tweets -->
  <g filter="url(#sk)"><rect x="60" y="134" width="300" height="56" rx="6" fill="#fff" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="76" y="154" font-size="12" font-weight="bold" fill="#2b6e9e">user 1</text>
  <g font-size="10.5" fill="#555">
    <g filter="url(#sk)"><rect x="72" y="162" width="56" height="20" rx="3" fill="#eaf6ee" stroke="#4a8e4a"/></g>
    <text x="100" y="176" text-anchor="middle">(1, A)</text>
    <g filter="url(#sk)"><rect x="130" y="162" width="56" height="20" rx="3" fill="#eaf6ee" stroke="#4a8e4a"/></g>
    <text x="158" y="176" text-anchor="middle">(3, C)</text>
    <g filter="url(#sk)"><rect x="188" y="162" width="56" height="20" rx="3" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/></g>
    <text x="216" y="176" text-anchor="middle">(7, G)</text>
    <text x="260" y="176" font-size="9.5" fill="#c98a2b">← 最新</text>
  </g>

  <!-- user 2 tweets -->
  <g filter="url(#sk)"><rect x="60" y="200" width="300" height="56" rx="6" fill="#fff" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="76" y="220" font-size="12" font-weight="bold" fill="#2b6e9e">user 2</text>
  <g font-size="10.5" fill="#555">
    <g filter="url(#sk)"><rect x="72" y="228" width="56" height="20" rx="3" fill="#eaf6ee" stroke="#4a8e4a"/></g>
    <text x="100" y="242" text-anchor="middle">(2, B)</text>
    <g filter="url(#sk)"><rect x="130" y="228" width="56" height="20" rx="3" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/></g>
    <text x="158" y="242" text-anchor="middle">(6, F)</text>
    <text x="200" y="242" font-size="9.5" fill="#c98a2b">← 最新</text>
  </g>

  <!-- postTweet annotation -->
  <g filter="url(#sk)"><rect x="60" y="270" width="300" height="48" rx="6" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <text x="210" y="290" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-weight="bold">postTweet(uid, tid)</text>
  <text x="210" y="306" text-anchor="middle" font-size="10" fill="#555">time++ → 追加到 userTweets[uid] 末尾  O(1)</text>

  <!-- ===== Right: following ===== -->
  <g filter="url(#sk)"><rect x="440" y="74" width="380" height="180" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/></g>
  <text x="630" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">following: userId → HashSet</text>
  <text x="630" y="118" text-anchor="middle" font-size="10.5" fill="#8a6a35">记录每个用户关注了谁</text>

  <g font-size="11.5">
    <g filter="url(#sk)"><rect x="460" y="134" width="340" height="34" rx="6" fill="#fff" stroke="#c98a2b" stroke-width="1.2"/></g>
    <text x="476" y="156" font-weight="bold" fill="#7a5415">user 1:</text>
    <text x="536" y="156" fill="#555">{ 2, 3 }</text>
    <text x="600" y="156" font-size="9.5" fill="#888">→ 关注了 2 和 3</text>

    <g filter="url(#sk)"><rect x="460" y="176" width="340" height="34" rx="6" fill="#fff" stroke="#c98a2b" stroke-width="1.2"/></g>
    <text x="476" y="198" font-weight="bold" fill="#7a5415">user 2:</text>
    <text x="536" y="198" fill="#555">{ 3 }</text>
    <text x="572" y="198" font-size="9.5" fill="#888">→ 只关注了 3</text>

    <g filter="url(#sk)"><rect x="460" y="218" width="340" height="28" rx="6" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="4 3"/></g>
    <text x="630" y="237" text-anchor="middle" font-size="10.5" fill="#2e6e2e">follow / unfollow → set.add / set.remove  O(1)</text>
  </g>

  <!-- ===== Right lower: time counter ===== -->
  <g filter="url(#sk)"><rect x="440" y="274" width="380" height="60" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="630" y="298" text-anchor="middle" font-size="14" font-weight="bold" fill="#b03a3a">全局时间戳 time</text>
  <text x="630" y="316" text-anchor="middle" font-size="11" fill="#555">每条推文发推时获取一个递增编号</text>
  <text x="630" y="328" text-anchor="middle" font-size="10" fill="#888">大数即可，无需真实时钟</text>

  <!-- ===== Bottom: getNewsFeed ===== -->
  <path d="M 210 340 Q 210 380 380 398" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 630 340 Q 630 380 480 398" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="120" y="410" width="620" height="100" rx="12" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="430" y="438" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">getNewsFeed(uid)：合并 uid + 关注者的推文流</text>
  <text x="430" y="460" text-anchor="middle" font-size="12" fill="#555">1. 收集用户集合 = {uid} ∪ following[uid]</text>
  <text x="430" y="478" text-anchor="middle" font-size="12" fill="#555">2. 每个用户取最新一条 → 入最大堆</text>
  <text x="430" y="496" text-anchor="middle" font-size="12" fill="#555">3. 堆顶出列（最新），该用户下一条入堆，重复 10 次</text>

  <text x="430" y="528" text-anchor="middle" font-size="10.5" fill="#888">本质 = K 路归并（同 23. 合并 K 个升序链表），只是数据源从链表换成数组</text>
</svg>
