<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="480" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：贪心翻转 + 剩余 k 奇偶处理</text>

  <!-- Start -->
  <rect x="200" y="44" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="260" y="65" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始</text>

  <path d="M 260 76 L 260 92" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 1: Sort -->
  <rect x="160" y="96" width="200" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="117" text-anchor="middle" font-size="12" fill="#333">排序 nums（升序）</text>

  <path d="M 260 128 L 260 144" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: Loop condition -->
  <polygon points="260,148 380,192 260,236 140,192" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="186" text-anchor="middle" font-size="11" fill="#333">i &lt; n 且 k &gt; 0</text>
  <text x="260" y="202" text-anchor="middle" font-size="11" fill="#333">且 nums[i] &lt; 0 ?</text>

  <!-- Yes branch -->
  <path d="M 380 192 L 420 192" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="186" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="424" y="176" width="84" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="466" y="197" text-anchor="middle" font-size="10.5" fill="#333">翻 nums[i]</text>
  <text x="466" y="197" text-anchor="middle" font-size="10.5" fill="#333"></text>

  <text x="466" y="222" text-anchor="middle" font-size="10" fill="#888">k--, i++</text>

  <!-- Loop back arrow -->
  <path d="M 466 176 L 466 168 L 260 168 L 260 148" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- No branch -->
  <path d="M 260 236 L 260 256" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="250" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- Step 3: Check k parity -->
  <polygon points="260,260 370,298 260,336 150,298" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="302" text-anchor="middle" font-size="11" fill="#333">k % 2 == 1 ?</text>

  <!-- Yes: flip min -->
  <path d="M 370 298 L 410 298" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="292" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="414" y="282" width="90" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="459" y="303" text-anchor="middle" font-size="10" fill="#333">翻最小元素</text>

  <!-- No: skip -->
  <path d="M 260 336 L 260 356" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="350" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- Merge: from flip min back -->
  <path d="M 459 314 L 459 370 L 264 370" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: Return sum -->
  <rect x="150" y="362" width="220" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="383" text-anchor="middle" font-size="12" fill="#333">返回 sum(nums)</text>

  <path d="M 260 394 L 260 410" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- End -->
  <rect x="200" y="414" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="260" y="435" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">结束</text>

  <!-- 底部备注 -->
  <text x="260" y="466" text-anchor="middle" font-size="10" fill="#aaa">两个关键判断：①还有负数且 k&gt;0？ ②翻完后 k 还是奇数？</text>
</svg>
