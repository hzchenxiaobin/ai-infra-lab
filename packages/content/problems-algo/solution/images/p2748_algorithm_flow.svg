<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2748f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arr2748g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arr2748r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：双重循环枚举配对 + gcd 判定</text>

  <!-- start -->
  <rect x="200" y="44" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">ans = 0</text>

  <path d="M260,80 L260,102" stroke="#446688" stroke-width="2" marker-end="url(#arr2748f)" filter="url(#rough2)"/>

  <!-- outer loop header -->
  <rect x="150" y="106" width="220" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="130" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">for i = 0 to n−1</text>

  <!-- loop end → return -->
  <path d="M370,125 L400,125" stroke="#b85450" stroke-width="2" marker-end="url(#arr2748r)" filter="url(#rough2)"/>
  <text x="385" y="118" text-anchor="middle" font-size="9" fill="#b85450">结束</text>
  <rect x="400" y="107" width="120" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="460" y="130" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return ans</text>

  <path d="M260,146 L260,168" stroke="#446688" stroke-width="2" marker-end="url(#arr2748f)" filter="url(#rough2)"/>

  <!-- extract first digit -->
  <rect x="160" y="172" width="200" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="194" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">a = nums[i] 的首位数字</text>

  <path d="M260,208 L260,230" stroke="#446688" stroke-width="2" marker-end="url(#arr2748f)" filter="url(#rough2)"/>

  <!-- inner loop header -->
  <rect x="140" y="234" width="240" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="258" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">for j = i+1 to n−1</text>

  <!-- inner loop end → i++ -->
  <path d="M380,253 L410,253" stroke="#b85450" stroke-width="2" marker-end="url(#arr2748r)" filter="url(#rough2)"/>
  <text x="395" y="246" text-anchor="middle" font-size="9" fill="#b85450">结束</text>
  <rect x="410" y="235" width="110" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="465" y="258" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">i++, 回到外层</text>

  <path d="M260,274 L260,296" stroke="#446688" stroke-width="2" marker-end="url(#arr2748f)" filter="url(#rough2)"/>

  <!-- extract last digit -->
  <rect x="160" y="300" width="200" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="322" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">b = nums[j] % 10</text>

  <path d="M260,336 L260,358" stroke="#446688" stroke-width="2" marker-end="url(#arr2748f)" filter="url(#rough2)"/>

  <!-- gcd check diamond -->
  <path d="M260,362 L360,398 L260,434 L160,398 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="395" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">gcd(a, b)</text>
  <text x="260" y="411" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">== 1 ?</text>

  <!-- yes → ans++ -->
  <text x="150" y="394" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M160,398 L100,398" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr2748g)" filter="url(#rough2)"/>
  <rect x="20" y="380" width="80" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="60" y="403" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">ans++</text>

  <!-- no → skip -->
  <text x="370" y="394" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M360,398 L420,398" stroke="#b85450" stroke-width="2" marker-end="url(#arr2748r)" filter="url(#rough2)"/>
  <rect x="420" y="380" width="100" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="470" y="403" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">跳过</text>
</svg>
