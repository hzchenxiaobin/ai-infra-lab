<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：moves = "L_RL__R"</text>

  <!-- Character boxes: L _ R L _ _ R -->
  <g filter="url(#rough2)">
    <rect x="119" y="44" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="165" y="44" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="211" y="44" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="257" y="44" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="303" y="44" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="349" y="44" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="395" y="44" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="141" y="66" text-anchor="middle" font-size="14" fill="#446688">L</text>
    <text x="187" y="66" text-anchor="middle" font-size="14" fill="#d6a040">_</text>
    <text x="233" y="66" text-anchor="middle" font-size="14" fill="#4a7a3a">R</text>
    <text x="279" y="66" text-anchor="middle" font-size="14" fill="#446688">L</text>
    <text x="325" y="66" text-anchor="middle" font-size="14" fill="#d6a040">_</text>
    <text x="371" y="66" text-anchor="middle" font-size="14" fill="#d6a040">_</text>
    <text x="417" y="66" text-anchor="middle" font-size="14" fill="#4a7a3a">R</text>
  </g>
  <text x="97" y="66" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">i →</text>

  <!-- Count table -->
  <g filter="url(#rough2)">
    <!-- row labels -->
    <text x="97" y="132" text-anchor="middle" font-size="13" fill="#446688">L</text>
    <text x="97" y="160" text-anchor="middle" font-size="13" fill="#4a7a3a">R</text>
    <text x="97" y="188" text-anchor="middle" font-size="13" fill="#d6a040">U</text>

    <!-- L row -->
    <rect x="119" y="112" width="44" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="165" y="112" width="44" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="211" y="112" width="44" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="257" y="112" width="44" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="303" y="112" width="44" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="349" y="112" width="44" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="395" y="112" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3"/>
    <text x="141" y="131" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="187" y="131" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="233" y="131" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="279" y="131" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="325" y="131" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="371" y="131" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="417" y="131" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

    <!-- R row -->
    <rect x="119" y="140" width="44" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="165" y="140" width="44" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="211" y="140" width="44" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="257" y="140" width="44" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="303" y="140" width="44" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="349" y="140" width="44" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="395" y="140" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3"/>
    <text x="141" y="159" text-anchor="middle" font-size="12" fill="#333">0</text>
    <text x="187" y="159" text-anchor="middle" font-size="12" fill="#333">0</text>
    <text x="233" y="159" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="279" y="159" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="325" y="159" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="371" y="159" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="417" y="159" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

    <!-- U row -->
    <rect x="119" y="168" width="44" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="165" y="168" width="44" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="211" y="168" width="44" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="257" y="168" width="44" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="303" y="168" width="44" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="349" y="168" width="44" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="395" y="168" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3"/>
    <text x="141" y="187" text-anchor="middle" font-size="12" fill="#333">0</text>
    <text x="187" y="187" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="233" y="187" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="279" y="187" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="325" y="187" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="371" y="187" text-anchor="middle" font-size="12" fill="#333">3</text>
    <text x="417" y="187" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  </g>

  <!-- Formula -->
  <rect x="140" y="212" width="280" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="234" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">ans = |L − R| + U = |2 − 2| + 3 = 3</text>

  <!-- Number line: p -> x = 280 + 55p -->
  <line x1="60" y1="330" x2="500" y2="330" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <line x1="60"  y1="323" x2="60"  y2="337" stroke="#888" stroke-width="1"/>
    <line x1="115" y1="323" x2="115" y2="337" stroke="#888" stroke-width="1"/>
    <line x1="170" y1="323" x2="170" y2="337" stroke="#888" stroke-width="1"/>
    <line x1="225" y1="323" x2="225" y2="337" stroke="#888" stroke-width="1"/>
    <line x1="280" y1="319" x2="280" y2="341" stroke="#446688" stroke-width="2.5"/>
    <line x1="335" y1="323" x2="335" y2="337" stroke="#888" stroke-width="1"/>
    <line x1="390" y1="323" x2="390" y2="337" stroke="#888" stroke-width="1"/>
    <line x1="445" y1="323" x2="445" y2="337" stroke="#888" stroke-width="1"/>
    <line x1="500" y1="323" x2="500" y2="337" stroke="#888" stroke-width="1"/>
    <text x="60"  y="354" text-anchor="middle" font-size="11" fill="#666">−4</text>
    <text x="115" y="354" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−3</text>
    <text x="170" y="354" text-anchor="middle" font-size="11" fill="#666">−2</text>
    <text x="225" y="354" text-anchor="middle" font-size="11" fill="#666">−1</text>
    <text x="280" y="356" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">0</text>
    <text x="335" y="354" text-anchor="middle" font-size="11" fill="#666">+1</text>
    <text x="390" y="354" text-anchor="middle" font-size="11" fill="#666">+2</text>
    <text x="445" y="354" text-anchor="middle" font-size="11" fill="#666">+3</text>
    <text x="500" y="354" text-anchor="middle" font-size="11" fill="#666">+4</text>
  </g>

  <!-- Walk polyline: 0,-1,-2,-1,-2,-3,-4,-3 -->
  <polyline points="280,312 225,312 170,312 225,312 170,312 115,312 60,312 115,312"
            fill="none" stroke="#aaa" stroke-width="1.2" stroke-dasharray="4,4" filter="url(#rough2)"/>
  <g fill="#999" filter="url(#rough2)">
    <circle cx="280" cy="312" r="3"/>
    <circle cx="225" cy="312" r="3"/>
    <circle cx="170" cy="312" r="3"/>
    <circle cx="225" cy="312" r="3"/>
    <circle cx="170" cy="312" r="3"/>
    <circle cx="115" cy="312" r="3"/>
    <circle cx="60" cy="312" r="3"/>
    <circle cx="115" cy="312" r="3"/>
  </g>

  <!-- Final point -->
  <circle cx="115" cy="330" r="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <path d="M 280 292 Q 200 280, 124 292" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="204" y="280" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">3 个 '_' 全部向左</text>

  <text x="280" y="396" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">移动序列 "LLRLLLR"：终点 x = (R − L) − U = 0 − 3 = −3</text>
  <text x="280" y="416" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">距原点 |x| = 3 ✓</text>
</svg>
