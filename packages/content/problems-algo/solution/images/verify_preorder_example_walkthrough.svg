<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="600" height="540" fill="#fafafa"/>
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：slots 随 token 的变化</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">preorder = "9,3,4,#,#,1,#,#,2,#,6,#,#"</text>

  <!-- column headers -->
  <text x="60" y="74" font-size="10.5" fill="#888" font-weight="bold">步骤</text>
  <text x="140" y="74" font-size="10.5" fill="#888" font-weight="bold">token</text>
  <text x="230" y="74" font-size="10.5" fill="#888" font-weight="bold">消耗</text>
  <text x="310" y="74" font-size="10.5" fill="#888" font-weight="bold">补充</text>
  <text x="410" y="74" font-size="10.5" fill="#888" font-weight="bold">slots 结果</text>
  <text x="530" y="74" font-size="10.5" fill="#888" font-weight="bold">说明</text>

  <!-- header underline -->
  <path d="M 40 82 L 580 82" stroke="#ccc" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- initial row -->
  <text x="60" y="104" font-size="11" fill="#888">初始</text>
  <text x="140" y="104" font-size="11" fill="#888">—</text>
  <text x="230" y="104" font-size="11" fill="#888">—</text>
  <text x="310" y="104" font-size="11" fill="#888">—</text>
  <rect x="395" y="92" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="412" y="108" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <text x="530" y="104" font-size="10" fill="#888">根槽位</text>

  <!-- step rows: (step, token, consume, produce, slots, note, color) -->
  <!-- 1, 9, -1, +2, 2, 根占槽 -->
  <text x="60" y="132" font-size="11" fill="#333">1</text>
  <rect x="130" y="120" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="147" y="136" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">9</text>
  <text x="230" y="132" font-size="11" fill="#b85450">−1</text>
  <text x="310" y="132" font-size="11" fill="#4a7a3a">+2</text>
  <rect x="395" y="120" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="412" y="136" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="530" y="132" font-size="10" fill="#888">根占槽，开左右</text>

  <!-- 2, 3, -1, +2, 3 -->
  <text x="60" y="160" font-size="11" fill="#333">2</text>
  <rect x="130" y="148" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="147" y="164" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="230" y="160" font-size="11" fill="#b85450">−1</text>
  <text x="310" y="160" font-size="11" fill="#4a7a3a">+2</text>
  <rect x="395" y="148" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="412" y="164" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="530" y="160" font-size="10" fill="#888">3 占左槽</text>

  <!-- 3, 4, -1, +2, 4 -->
  <text x="60" y="188" font-size="11" fill="#333">3</text>
  <rect x="130" y="176" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="147" y="192" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="230" y="188" font-size="11" fill="#b85450">−1</text>
  <text x="310" y="188" font-size="11" fill="#4a7a3a">+2</text>
  <rect x="395" y="176" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="412" y="192" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="530" y="188" font-size="10" fill="#888">4 占 3 的左槽</text>

  <!-- 4, #, -1, 0, 3 -->
  <text x="60" y="216" font-size="11" fill="#333">4</text>
  <rect x="130" y="204" width="34" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="147" y="220" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">#</text>
  <text x="230" y="216" font-size="11" fill="#b85450">−1</text>
  <text x="310" y="216" font-size="11" fill="#888">0</text>
  <rect x="395" y="204" width="34" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="412" y="220" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="530" y="216" font-size="10" fill="#888">4 左子空</text>

  <!-- 5, #, -1, 0, 2 -->
  <text x="60" y="244" font-size="11" fill="#333">5</text>
  <rect x="130" y="232" width="34" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="147" y="248" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">#</text>
  <text x="230" y="244" font-size="11" fill="#b85450">−1</text>
  <text x="310" y="244" font-size="11" fill="#888">0</text>
  <rect x="395" y="232" width="34" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="412" y="248" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="530" y="244" font-size="10" fill="#888">4 右子空，闭合</text>

  <!-- 6, 1, -1, +2, 3 -->
  <text x="60" y="272" font-size="11" fill="#333">6</text>
  <rect x="130" y="260" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="147" y="276" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="230" y="272" font-size="11" fill="#b85450">−1</text>
  <text x="310" y="272" font-size="11" fill="#4a7a3a">+2</text>
  <rect x="395" y="260" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="412" y="276" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="530" y="272" font-size="10" fill="#888">1 占 3 的右槽</text>

  <!-- 7, #, -1, 0, 2 -->
  <text x="60" y="300" font-size="11" fill="#333">7</text>
  <rect x="130" y="288" width="34" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="147" y="304" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">#</text>
  <text x="230" y="300" font-size="11" fill="#b85450">−1</text>
  <text x="310" y="300" font-size="11" fill="#888">0</text>
  <rect x="395" y="288" width="34" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="412" y="304" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="530" y="300" font-size="10" fill="#888">1 左子空</text>

  <!-- 8, #, -1, 0, 1 -->
  <text x="60" y="328" font-size="11" fill="#333">8</text>
  <rect x="130" y="316" width="34" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="147" y="332" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">#</text>
  <text x="230" y="328" font-size="11" fill="#b85450">−1</text>
  <text x="310" y="328" font-size="11" fill="#888">0</text>
  <rect x="395" y="316" width="34" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="412" y="332" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="530" y="328" font-size="10" fill="#888">1,3 子树闭合</text>

  <!-- 9, 2, -1, +2, 2 -->
  <text x="60" y="356" font-size="11" fill="#333">9</text>
  <rect x="130" y="344" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="147" y="360" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="230" y="356" font-size="11" fill="#b85450">−1</text>
  <text x="310" y="356" font-size="11" fill="#4a7a3a">+2</text>
  <rect x="395" y="344" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="412" y="360" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="530" y="356" font-size="10" fill="#888">2 占根右槽</text>

  <!-- 10, #, -1, 0, 1 -->
  <text x="60" y="384" font-size="11" fill="#333">10</text>
  <rect x="130" y="372" width="34" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="147" y="388" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">#</text>
  <text x="230" y="384" font-size="11" fill="#b85450">−1</text>
  <text x="310" y="384" font-size="11" fill="#888">0</text>
  <rect x="395" y="372" width="34" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="412" y="388" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="530" y="384" font-size="10" fill="#888">2 左子空</text>

  <!-- 11, 6, -1, +2, 2 -->
  <text x="60" y="412" font-size="11" fill="#333">11</text>
  <rect x="130" y="400" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="147" y="416" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">6</text>
  <text x="230" y="412" font-size="11" fill="#b85450">−1</text>
  <text x="310" y="412" font-size="11" fill="#4a7a3a">+2</text>
  <rect x="395" y="400" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="412" y="416" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="530" y="412" font-size="10" fill="#888">6 占 2 的右槽</text>

  <!-- 12, #, -1, 0, 1 -->
  <text x="60" y="440" font-size="11" fill="#333">12</text>
  <rect x="130" y="428" width="34" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="147" y="444" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">#</text>
  <text x="230" y="440" font-size="11" fill="#b85450">−1</text>
  <text x="310" y="440" font-size="11" fill="#888">0</text>
  <rect x="395" y="428" width="34" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="412" y="444" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="530" y="440" font-size="10" fill="#888">6 左子空</text>

  <!-- 13, #, -1, 0, 0 ✓ -->
  <text x="60" y="468" font-size="11" fill="#333">13</text>
  <rect x="130" y="456" width="34" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="147" y="472" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">#</text>
  <text x="230" y="468" font-size="11" fill="#b85450">−1</text>
  <text x="310" y="468" font-size="11" fill="#888">0</text>
  <rect x="395" y="456" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="412" y="472" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="530" y="468" font-size="10" fill="#4a7a3a" font-weight="bold">全树闭合 ✓</text>

  <!-- bottom summary -->
  <rect x="40" y="496" width="520" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="518" text-anchor="middle" font-size="11" fill="#555">slots 从 1 → 2 → 3 → 4 → 3 → 2 → 3 → 2 → 1 → 2 → 1 → 2 → 1 → 0 ✓，全程 ≥ 0，末尾 = 0</text>
</svg>
