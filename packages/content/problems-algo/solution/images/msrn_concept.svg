<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">固定行对 → 按列压缩 → 1D 子段和</text>

  <!-- 左侧：2D 矩阵 -->
  <text x="120" y="56" text-anchor="middle" font-size="11" fill="#999">2D matrix (m×n)</text>

  <!-- 列标号 -->
  <text x="100" y="74" text-anchor="middle" font-size="9" fill="#999">c=0</text>
  <text x="134" y="74" text-anchor="middle" font-size="9" fill="#999">1</text>
  <text x="168" y="74" text-anchor="middle" font-size="9" fill="#999">2</text>
  <!-- 行标号 -->
  <text x="74" y="99" text-anchor="end" font-size="9" fill="#999">r=0</text>
  <text x="74" y="133" text-anchor="end" font-size="9" fill="#999">1</text>
  <text x="74" y="167" text-anchor="end" font-size="9" fill="#999">2</text>
  <text x="74" y="201" text-anchor="end" font-size="9" fill="#999">3</text>

  <!-- 网格 4行×3列 -->
  <rect x="84" y="82" width="102" height="136" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M118 82 V218 M152 82 V218" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>
  <path d="M84 116 H186 M84 150 H186 M84 184 H186" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>

  <!-- 高亮 top..bottom 行带 (row 1..2) -->
  <rect x="84" y="116" width="102" height="68" fill="#e8f0fe" opacity="0.85" filter="url(#rough2)"/>
  <rect x="84" y="116" width="102" height="68" fill="none" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>

  <!-- top/bottom 标记 -->
  <text x="196" y="120" font-size="10" fill="#446688" font-weight="bold">← top</text>
  <text x="196" y="184" font-size="10" fill="#446688" font-weight="bold">← bottom</text>

  <!-- 矩阵数值示例 -->
  <text x="100" y="105" text-anchor="middle" font-size="10" fill="#aaa">·</text>
  <text x="134" y="105" text-anchor="middle" font-size="10" fill="#aaa">·</text>
  <text x="168" y="105" text-anchor="middle" font-size="10" fill="#aaa">·</text>

  <text x="100" y="139" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="134" y="139" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="168" y="139" text-anchor="middle" font-size="10" fill="#333">1</text>

  <text x="100" y="173" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="134" y="173" text-anchor="middle" font-size="10" fill="#333">−2</text>
  <text x="168" y="173" text-anchor="middle" font-size="10" fill="#333">3</text>

  <text x="100" y="207" text-anchor="middle" font-size="10" fill="#aaa">·</text>
  <text x="134" y="207" text-anchor="middle" font-size="10" fill="#aaa">·</text>
  <text x="168" y="207" text-anchor="middle" font-size="10" fill="#aaa">·</text>

  <!-- 压缩箭头 -->
  <path d="M186 150 H300" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="243" y="142" text-anchor="middle" font-size="10" fill="#446688">列累加</text>

  <!-- 右侧：1D 数组 -->
  <text x="400" y="56" text-anchor="middle" font-size="11" fill="#999">1D colSum (n)</text>
  <text x="335" y="74" text-anchor="middle" font-size="9" fill="#999">c=0</text>
  <text x="369" y="74" text-anchor="middle" font-size="9" fill="#999">1</text>
  <text x="403" y="74" text-anchor="middle" font-size="9" fill="#999">2</text>

  <rect x="319" y="82" width="102" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M353 82 V116 M387 82 V116" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="335" y="105" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="369" y="105" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−2</text>
  <text x="403" y="105" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>

  <text x="430" y="100" font-size="10" fill="#446688">← 子矩阵和</text>
  <text x="430" y="114" font-size="10" fill="#446688">  = 子段和</text>

  <!-- 下方：1D 求解说明 -->
  <rect x="36" y="232" width="488" height="128" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="256" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">1D 目标：求 ≤ k 的最大子段和</text>

  <text x="52" y="282" font-size="11" fill="#444">前缀和  s_c = colSum[0]+...+colSum[c]</text>
  <text x="52" y="302" font-size="11" fill="#444">子段和  = s_c − s_c'    (c' &lt; c)</text>
  <text x="52" y="322" font-size="11" fill="#444">约束    s_c − s_c' ≤ k   ⟺   s_c' ≥ s_c − k</text>
  <text x="52" y="344" font-size="11" fill="#b85450" font-weight="bold">→ 在有序前缀和集合中 lower_bound(s_c − k)</text>
</svg>
