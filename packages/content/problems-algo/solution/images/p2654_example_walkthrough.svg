<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 演算：[2,6,3,4] 先造 1 再扩散 = 4 次</text>

  <!-- ===== Row 0: initial [2,6,3,4], highlight [3,4] ===== -->
  <rect x="166" y="46" width="54" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="193" y="71" text-anchor="middle" font-size="16" fill="#999">2</text>
  <rect x="224" y="46" width="54" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="251" y="71" text-anchor="middle" font-size="16" fill="#999">6</text>
  <rect x="282" y="46" width="54" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="309" y="71" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">3</text>
  <rect x="340" y="46" width="54" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="367" y="71" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">4</text>
  <!-- bracket under [3,4] -->
  <path d="M 282 88 Q 309 98 336 88" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="309" y="112" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">最短 gcd=1 段，L=2</text>
  <path d="M 280 120 L 280 128" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Row 1: op1 -> [2,6,1,4] ===== -->
  <rect x="166" y="130" width="54" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="193" y="155" text-anchor="middle" font-size="16" fill="#999">2</text>
  <rect x="224" y="130" width="54" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="251" y="155" text-anchor="middle" font-size="16" fill="#999">6</text>
  <rect x="282" y="130" width="54" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="309" y="155" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="340" y="130" width="54" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="367" y="155" text-anchor="middle" font-size="16" fill="#999">4</text>
  <text x="280" y="184" text-anchor="middle" font-size="11" fill="#4a7a3a">op① gcd(3,4)=1 → nums[2]：造出第一个 1（L−1=1 次）</text>
  <path d="M 280 192 L 280 212" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Row 2: op2 -> [2,1,1,4] ===== -->
  <rect x="166" y="214" width="54" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="193" y="239" text-anchor="middle" font-size="16" fill="#999">2</text>
  <rect x="224" y="214" width="54" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="251" y="239" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="282" y="214" width="54" height="38" fill="#e6f4ea" stroke="#9abf8a" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="309" y="239" text-anchor="middle" font-size="16" fill="#4a7a3a">1</text>
  <rect x="340" y="214" width="54" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="367" y="239" text-anchor="middle" font-size="16" fill="#999">4</text>
  <text x="280" y="268" text-anchor="middle" font-size="11" fill="#4a7a3a">op② gcd(6,1)=1 → nums[1]：向左扩散</text>
  <path d="M 280 276 L 280 296" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Row 3: op3 -> [1,1,1,4] ===== -->
  <rect x="166" y="298" width="54" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="193" y="323" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="224" y="298" width="54" height="38" fill="#e6f4ea" stroke="#9abf8a" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="251" y="323" text-anchor="middle" font-size="16" fill="#4a7a3a">1</text>
  <rect x="282" y="298" width="54" height="38" fill="#e6f4ea" stroke="#9abf8a" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="309" y="323" text-anchor="middle" font-size="16" fill="#4a7a3a">1</text>
  <rect x="340" y="298" width="54" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="367" y="323" text-anchor="middle" font-size="16" fill="#999">4</text>
  <text x="280" y="352" text-anchor="middle" font-size="11" fill="#4a7a3a">op③ gcd(2,1)=1 → nums[0]：继续向左</text>
  <path d="M 280 360 L 280 380" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Row 4: op4 -> [1,1,1,1] ===== -->
  <rect x="166" y="382" width="54" height="38" fill="#e6f4ea" stroke="#9abf8a" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="193" y="407" text-anchor="middle" font-size="16" fill="#4a7a3a">1</text>
  <rect x="224" y="382" width="54" height="38" fill="#e6f4ea" stroke="#9abf8a" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="251" y="407" text-anchor="middle" font-size="16" fill="#4a7a3a">1</text>
  <rect x="282" y="382" width="54" height="38" fill="#e6f4ea" stroke="#9abf8a" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="309" y="407" text-anchor="middle" font-size="16" fill="#4a7a3a">1</text>
  <rect x="340" y="382" width="54" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="367" y="407" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="280" y="436" text-anchor="middle" font-size="11" fill="#4a7a3a">op④ gcd(1,4)=1 → nums[3]：向右扩散，完成</text>

  <!-- formula -->
  <rect x="100" y="450" width="360" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="474" text-anchor="middle" font-size="13" fill="#7a5a20" font-weight="bold">合计 (L−1) + (n−1) = 1 + 3 = 4 ⭐</text>
</svg>
