<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">概率 DP：滚动数组流程</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">逐硬币递推，逆序更新避免覆盖</text>

  <!-- ===== Left: four steps ===== -->
  <g font-size="10" fill="#333">
    <!-- ① 初始化 -->
    <rect x="36" y="66" width="236" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="154" y="86" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① 初始化</text>
    <text x="154" y="104" text-anchor="middle" font-family="monospace" font-size="11" fill="#555">dp[0]=1.0, dp[1..target]=0</text>

    <path d="M 154 120 L 154 134" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- ② 遍历硬币 -->
    <rect x="36" y="136" width="236" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="154" y="156" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">② 遍历每枚硬币</text>
    <text x="154" y="174" text-anchor="middle" font-family="monospace" font-size="11" fill="#555">for p in prob:</text>

    <path d="M 154 190 L 154 204" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- ③ 逆序更新 -->
    <rect x="36" y="206" width="236" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="154" y="226" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">③ 逆序更新 j = target → 1</text>
    <text x="52" y="246" font-family="monospace" font-size="10" fill="#333">dp[j] = dp[j-1]*p</text>
    <text x="160" y="246" font-family="monospace" font-size="10" fill="#888">+ dp[j]*(1-p)</text>
    <text x="52" y="262" font-family="monospace" font-size="10" fill="#333">dp[0] *= (1-p)</text>
    <text x="52" y="280" font-size="9" fill="#888">逆序保证 dp[j-1] 是旧值</text>
    <text x="52" y="294" font-size="9" fill="#888">dp[0] 无前驱，单独乘 (1-p)</text>

    <path d="M 154 306 L 154 320" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- ④ 返回 -->
    <rect x="36" y="322" width="236" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="154" y="342" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">④ 返回</text>
    <text x="154" y="360" text-anchor="middle" font-family="monospace" font-size="11" fill="#555">return dp[target]</text>
  </g>

  <!-- ===== Right: notes ===== -->
  <rect x="296" y="136" width="196" height="100" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="394" y="158" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">滚动数组 O(target) 空间</text>
  <text x="310" y="178" font-size="9" fill="#555">只需一维 dp[target+1]</text>
  <text x="310" y="194" font-size="9" fill="#555">每轮原地覆盖，无需 prev</text>
  <text x="310" y="210" font-size="9" fill="#b85450" font-weight="bold">逆序 j 是关键</text>
  <text x="310" y="226" font-size="9" fill="#888">同 0-1 背包滚动技巧</text>

  <rect x="296" y="250" width="196" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="394" y="270" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">复杂度</text>
  <text x="310" y="290" font-family="monospace" font-size="10" fill="#333">时间 O(n · target)</text>
  <text x="310" y="306" font-family="monospace" font-size="10" fill="#333">空间 O(target)</text>
  <text x="310" y="322" font-size="9" fill="#888">n=硬币数，无需取模</text>
</svg>
