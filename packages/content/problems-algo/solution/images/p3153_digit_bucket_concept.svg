<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="450" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：按位分解 → 每位桶计数 → c·(n−c) 贡献</text>

  <text x="32" y="54" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">① 按位拆开（各位独立）</text>

  <text x="138" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">十位</text>
  <text x="186" y="74" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">个位</text>

  <rect x="116" y="80" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="138" y="99" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="164" y="80" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="186" y="99" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="116" y="110" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="138" y="129" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="164" y="110" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="186" y="129" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="116" y="140" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="138" y="159" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="164" y="140" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="186" y="159" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>

  <path d="M 216 124 L 254 124" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="235" y="112" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每位独立</text>

  <rect x="262" y="80" width="226" height="88" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="375" y="106" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">ans = Σ（第 p 位「数字不同」的数对数）</text>
  <text x="375" y="128" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">第 p 位单独进桶统计</text>
  <text x="375" y="150" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">不需要知道具体是哪两个数！</text>

  <text x="32" y="190" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">② 固定某一位（例：个位），数字扔进 0~9 十个桶</text>

  <rect x="118" y="200" width="34" height="40" fill="#f1f1f1" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="135" y="218" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <text x="135" y="234" text-anchor="middle" font-size="9.5" fill="#bbb" filter="url(#rough2)">0</text>

  <rect x="156" y="200" width="34" height="40" fill="#f1f1f1" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="173" y="218" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">1</text>
  <text x="173" y="234" text-anchor="middle" font-size="9.5" fill="#bbb" filter="url(#rough2)">0</text>

  <rect x="194" y="200" width="34" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="211" y="218" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="211" y="234" text-anchor="middle" font-size="10" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">c=1</text>

  <rect x="232" y="200" width="34" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="249" y="218" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="249" y="234" text-anchor="middle" font-size="10" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">c=2</text>

  <rect x="270" y="200" width="34" height="40" fill="#f1f1f1" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="287" y="218" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">4</text>
  <text x="287" y="234" text-anchor="middle" font-size="9.5" fill="#bbb" filter="url(#rough2)">0</text>

  <rect x="308" y="200" width="34" height="40" fill="#f1f1f1" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="325" y="218" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">5</text>
  <text x="325" y="234" text-anchor="middle" font-size="9.5" fill="#bbb" filter="url(#rough2)">0</text>

  <rect x="346" y="200" width="34" height="40" fill="#f1f1f1" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="363" y="218" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">6</text>
  <text x="363" y="234" text-anchor="middle" font-size="9.5" fill="#bbb" filter="url(#rough2)">0</text>

  <rect x="384" y="200" width="34" height="40" fill="#f1f1f1" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="401" y="218" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">7</text>
  <text x="401" y="234" text-anchor="middle" font-size="9.5" fill="#bbb" filter="url(#rough2)">0</text>

  <rect x="422" y="200" width="34" height="40" fill="#f1f1f1" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="439" y="218" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">8</text>
  <text x="439" y="234" text-anchor="middle" font-size="9.5" fill="#bbb" filter="url(#rough2)">0</text>

  <rect x="460" y="200" width="34" height="40" fill="#f1f1f1" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="477" y="218" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">9</text>
  <text x="477" y="234" text-anchor="middle" font-size="9.5" fill="#bbb" filter="url(#rough2)">0</text>

  <text x="32" y="262" font-size="11.5" fill="#333" filter="url(#rough2)">n = 3：数字 2 有 1 个、数字 3 有 2 个 → 该位贡献 = [1×2 + 2×1] ÷ 2 = 2</text>

  <rect x="32" y="278" width="456" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="298" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">有序配对：数字 d 的 c_d 个数 × 其余 (n − c_d) 个数 = c_d·(n − c_d)</text>
  <text x="260" y="316" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">Σ_d c_d·(n − c_d)：每个「不同数对」从 i 侧、j 侧各被计一次</text>

  <rect x="32" y="336" width="456" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="356" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠ 所以整体 ÷ 2：第 p 位贡献 = Σ_d c_d·(n − c_d) / 2</text>
  <text x="260" y="374" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">例：个位 (2 + 2) ÷ 2 = 2</text>

  <rect x="32" y="392" width="456" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="412" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">等价无重复计数：贡献 = C(n,2) − Σ_d C(c_d,2)</text>
  <text x="260" y="430" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">总对数 −「该位相同」的对数（桶内相同数字两两成对）</text>
</svg>
