<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    SQL 逻辑执行流程
  </text>

  <!-- Step 1: FROM -->
  <rect x="40" y="48" width="440" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="58" y="72" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">① FROM Project p</text>
  <text x="58" y="90" font-size="10.5" fill="#555" filter="url(#rough2)">加载 Project 表作为驱动表（左表）</text>
  <text x="468" y="72" text-anchor="end" font-size="10" fill="#88a" filter="url(#rough2)">project_id, employee_id</text>

  <path d="M 260 104 L 260 116" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: JOIN -->
  <rect x="40" y="120" width="440" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="58" y="144" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② JOIN Employee e ON p.employee_id = e.employee_id</text>
  <text x="58" y="162" font-size="10.5" fill="#555" filter="url(#rough2)">按 employee_id 桥接，把 experience_years 搬到每行</text>
  <text x="468" y="144" text-anchor="end" font-size="10" fill="#88a" filter="url(#rough2)">+ name, exp_years</text>

  <path d="M 260 176 L 260 188" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: GROUP BY -->
  <rect x="40" y="192" width="440" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="58" y="216" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">③ GROUP BY project_id</text>
  <text x="58" y="234" font-size="10.5" fill="#555" filter="url(#rough2)">按 project_id 把宽表分成若干桶（同项目归一桶）</text>
  <text x="468" y="216" text-anchor="end" font-size="10" fill="#88a" filter="url(#rough2)">分桶</text>

  <path d="M 260 248 L 260 260" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: SELECT -->
  <rect x="40" y="264" width="440" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="58" y="288" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">④ SELECT project_id, ROUND(AVG(exp_years), 2)</text>
  <text x="58" y="306" font-size="10.5" fill="#555" filter="url(#rough2)">每桶求 AVG → ROUND 两位小数 → 连同分组键输出</text>
  <text x="468" y="288" text-anchor="end" font-size="10" fill="#88a" filter="url(#rough2)">聚合 + 投影</text>

  <!-- order note -->
  <rect x="40" y="338" width="440" height="44" fill="#ffffff" stroke="#aac" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="260" y="358" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">
    执行顺序: FROM → JOIN → GROUP BY → SELECT(聚合)
  </text>
  <text x="260" y="374" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">
    ≠  书写顺序: SELECT → FROM → JOIN → GROUP BY
  </text>
</svg>
