<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：反向贪心——从 target 倒推回 1</text>

  <!-- ====== Left: forward (hard) ====== -->
  <rect x="24" y="44" width="252" height="266" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)" opacity="0.35"/>
  <text x="150" y="66" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">正向：从 1 正推（难）</text>
  <text x="150" y="84" text-anchor="middle" font-size="11" fill="#888">每步二选一：+1 或 ×2，时机难定</text>

  <!-- forward tree: 1 -> 2 -> {3, 4} -> ... -->
  <rect x="130" y="96" width="40" height="28" fill="#ffffff" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="115" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <!-- 1 -> 2 (both +1 and x2 give 2) -->
  <path d="M 150 124 L 150 138" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="166" y="134" font-size="10" fill="#b85450">+1 / ×2</text>
  <rect x="130" y="140" width="40" height="28" fill="#ffffff" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="159" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <!-- 2 -> 3 (+1) and 2 -> 4 (x2) -->
  <path d="M 142 168 L 96 184" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 158 168 L 204 184" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="108" y="180" font-size="10" fill="#b85450">+1</text>
  <text x="184" y="180" font-size="10" fill="#b85450">×2</text>
  <rect x="76" y="186" width="40" height="28" fill="#ffffff" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="96" y="205" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="184" y="186" width="40" height="28" fill="#ffffff" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="204" y="205" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>

  <!-- 4 -> 5 (+1) and 4 -> 8 (x2) -->
  <path d="M 196 214 L 150 232" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 212 214 L 224 232" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="130" y="234" width="40" height="28" fill="#ffffff" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="253" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <rect x="224" y="234" width="40" height="28" fill="#ffffff" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="244" y="253" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>

  <!-- big question mark -->
  <text x="60" y="288" font-size="22" fill="#b85450" font-weight="bold">?</text>
  <text x="84" y="290" font-size="11" fill="#b85450" font-weight="bold">×2 用早了浪费</text>
  <text x="84" y="304" font-size="11" fill="#b85450" font-weight="bold">用晚了不够用</text>

  <!-- ====== Right: backward (deterministic) ====== -->
  <rect x="284" y="44" width="252" height="266" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)" opacity="0.35"/>
  <text x="410" y="66" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">反向：从 target 倒推（确定）</text>
  <text x="410" y="84" text-anchor="middle" font-size="11" fill="#888">每步唯一选择：偶&amp;有÷2 则 ÷2，否则 −1</text>

  <!-- backward chain: 19(odd,-1)->18 -> 9(even,÷2) -> 8 -> 4(÷2) -> 2(÷2) -> 1 -->
  <rect x="390" y="96" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="410" y="115" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">19</text>

  <path d="M 410 124 L 410 138" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="426" y="134" font-size="10" fill="#888">奇 −1</text>
  <rect x="390" y="140" width="40" height="28" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="159" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">18</text>

  <path d="M 410 168 L 410 182" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="426" y="178" font-size="10" fill="#4a7a3a" font-weight="bold">偶 ÷2</text>
  <rect x="390" y="184" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="410" y="203" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">9</text>

  <path d="M 410 212 L 410 226" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="426" y="222" font-size="10" fill="#888">奇 −1</text>
  <rect x="390" y="228" width="40" height="28" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="247" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>

  <path d="M 410 256 L 410 270" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="426" y="266" font-size="10" fill="#4a7a3a" font-weight="bold">偶 ÷2</text>
  <rect x="390" y="272" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="410" y="291" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>

  <!-- continuation dots -->
  <text x="410" y="312" text-anchor="middle" font-size="12" fill="#888">… → 2 → 1</text>

  <!-- checkmark -->
  <text x="300" y="290" font-size="20" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="324" y="290" font-size="11" fill="#4a7a3a" font-weight="bold">无分支</text>
  <text x="324" y="304" font-size="11" fill="#4a7a3a" font-weight="bold">每步最优</text>

  <!-- ====== Bottom: core insight ====== -->
  <rect x="24" y="324" width="512" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">×2 的「收益」= 当前值：把 v 翻倍省下 v 次 +1</text>
  <text x="280" y="372" text-anchor="middle" font-size="12" fill="#666">→ 收益随当前值递增，故 ×2 应留给尽可能大的数</text>
  <text x="280" y="392" text-anchor="middle" font-size="12" fill="#666">→ 反向 ÷2 天然从大数开始消耗，自动命中「最该翻倍」的位置</text>
</svg>
