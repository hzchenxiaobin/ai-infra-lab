<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">可删除 0-1 Trie：节点计数 cnt + 逐位贪心（3 位示意）</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">集合现存 {2, 3}（1 已被删除），query x = 4 = 100₂</text>

  <!-- 根节点 -->
  <circle cx="150" cy="88" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="93" text-anchor="middle" font-size="11" fill="#33507a" font-weight="bold" filter="url(#rough2)">root</text>

  <!-- bit2 层 -->
  <circle cx="100" cy="165" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="100" y="170" text-anchor="middle" font-size="12" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="100" y="194" text-anchor="middle" font-size="9.5" fill="#7a5a10" filter="url(#rough2)">cnt=2</text>

  <circle cx="215" cy="165" r="13" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="215" y="170" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">1</text>
  <text x="215" y="194" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">无此子树</text>

  <!-- bit1 层 -->
  <circle cx="55" cy="240" r="15" fill="#f0f0f0" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="55" y="245" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <text x="55" y="269" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">cnt=0</text>

  <circle cx="150" cy="240" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="150" y="245" text-anchor="middle" font-size="12" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="150" y="269" text-anchor="middle" font-size="9.5" fill="#7a5a10" filter="url(#rough2)">cnt=2</text>

  <!-- bit0 层 -->
  <circle cx="55" cy="315" r="15" fill="#f0f0f0" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="55" y="320" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">1</text>
  <text x="55" y="344" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">值1 cnt=0</text>

  <circle cx="105" cy="315" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="105" y="320" text-anchor="middle" font-size="11" fill="#33507a" filter="url(#rough2)">0</text>
  <text x="105" y="344" text-anchor="middle" font-size="9.5" fill="#33507a" filter="url(#rough2)">值2 cnt=1</text>

  <circle cx="185" cy="315" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="185" y="320" text-anchor="middle" font-size="11" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="185" y="344" text-anchor="middle" font-size="9.5" fill="#7a5a10" filter="url(#rough2)">值3 cnt=1</text>

  <!-- 边：root -> 0（查询路径） -->
  <path d="M 138 100 L 110 150" stroke="#d6a040" stroke-width="2.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="30" y="128" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">x位=1 → 反位0 ✓ +4</text>

  <!-- 边：root -> 1（虚线，不存在） -->
  <path d="M 164 98 L 206 150" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- 边：0 -> 幽灵0（已删空） -->
  <path d="M 92 178 L 60 226" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- 边：0 -> 1（查询路径） -->
  <path d="M 108 178 L 142 226" stroke="#d6a040" stroke-width="2.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="212" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">x位=0 → 反位1 ✓ +2</text>

  <!-- 边：幽灵0 -> 幽灵1 -->
  <path d="M 55 255 L 55 298" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="18" y="282" font-size="9.5" fill="#999" filter="url(#rough2)">cnt=0 已删空</text>

  <!-- 边：1 -> 值2 -->
  <path d="M 142 253 L 113 301" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- 边：1 -> 值3（查询路径） -->
  <path d="M 158 253 L 178 301" stroke="#d6a040" stroke-width="2.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="188" y="280" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">x位=0 → 反位1 ✓ +1</text>

  <!-- 层级标签 -->
  <text x="258" y="168" font-size="9.5" fill="#888" filter="url(#rough2)">← bit2</text>
  <text x="258" y="243" font-size="9.5" fill="#888" filter="url(#rough2)">← bit1</text>
  <text x="258" y="318" font-size="9.5" fill="#888" filter="url(#rough2)">← bit0</text>

  <!-- 右侧：贪心规则 -->
  <rect x="300" y="62" width="195" height="118" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="397" y="84" text-anchor="middle" font-size="12" fill="#33507a" font-weight="bold" filter="url(#rough2)">贪心三规则</text>
  <text x="310" y="106" font-size="10.5" fill="#33507a" filter="url(#rough2)">① 优先走与 x 相反的位，</text>
  <text x="318" y="122" font-size="10.5" fill="#33507a" filter="url(#rough2)">该位置 1（+2^i）</text>
  <text x="310" y="140" font-size="10.5" fill="#33507a" filter="url(#rough2)">② 反位无 / cnt=0 → 走同位</text>
  <text x="310" y="158" font-size="10.5" fill="#33507a" filter="url(#rough2)">③ cnt=0 的子树视同不存在</text>
  <text x="310" y="174" font-size="9.5" fill="#6688aa" filter="url(#rough2)">（幽灵子树要绕开）</text>

  <!-- 右侧：增删机制 -->
  <rect x="300" y="194" width="195" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="397" y="216" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">惰性增删</text>
  <text x="310" y="238" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">insert(x, +1)：路径 cnt++</text>
  <text x="310" y="256" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">insert(x, −1)：路径 cnt−−</text>
  <text x="310" y="274" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">节点永不回收</text>
  <text x="310" y="288" font-size="9.5" fill="#669a5a" filter="url(#rough2)">（空间上限 20n+1 不变）</text>

  <!-- 右侧：结果 -->
  <rect x="300" y="308" width="195" height="88" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="397" y="330" text-anchor="middle" font-size="12" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">本例结果</text>
  <text x="397" y="352" text-anchor="middle" font-size="11.5" fill="#7a5a10" filter="url(#rough2)">query(4) = 4+2+1 = 111₂ = 7</text>
  <text x="397" y="372" text-anchor="middle" font-size="11.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">= 4 ⊕ 3，最优伙伴是 3 ✓</text>
  <text x="397" y="388" text-anchor="middle" font-size="9.5" fill="#a8842e" filter="url(#rough2)">灰色幽灵（值 1）被查询绕开</text>

  <!-- 底部注释 -->
  <text x="150" y="378" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">删除 1 后其路径 cnt 归 0 成「幽灵」；</text>
  <text x="150" y="396" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">若再插入 1，同路径 cnt 复活</text>
</svg>
