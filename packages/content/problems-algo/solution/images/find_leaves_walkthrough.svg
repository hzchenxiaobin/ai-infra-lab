<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：[1,2,3,4,5] 后序逐节点计算 layer</text>

  <!-- small tree with post-order numbering -->
  <text x="90" y="56" text-anchor="middle" font-size="11" fill="#888">后序顺序 4→5→2→3→1</text>
  <circle cx="90" cy="74" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="90" y="78" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">1</text>
  <text x="108" y="68" font-size="8" fill="#b85450">⑤</text>
  <line x1="82" y1="84" x2="62" y2="100" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="98" y1="84" x2="118" y2="100" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="58" cy="110" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="58" y="113" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">2</text>
  <text x="72" y="106" font-size="8" fill="#b85450">③</text>
  <circle cx="122" cy="110" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="122" y="113" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="136" y="106" font-size="8" fill="#b85450">④</text>
  <line x1="52" y1="118" x2="40" y2="134" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="64" y1="118" x2="76" y2="134" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="37" cy="142" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="37" y="145" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="48" y="148" font-size="8" fill="#b85450">①</text>
  <circle cx="79" cy="142" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="79" y="145" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">5</text>
  <text x="90" y="148" font-size="8" fill="#b85450">②</text>

  <!-- table -->
  <!-- header -->
  <rect x="190" y="48" width="410" height="26" fill="#446688" filter="url(#rough2)"/>
  <text x="220" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">节点</text>
  <text x="280" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">dfs(left)</text>
  <text x="340" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">dfs(right)</text>
  <text x="410" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">layer</text>
  <text x="530" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">res（追加后）</text>
  <line x1="250" y1="48" x2="250" y2="74" stroke="#fafafa" stroke-width="1"/>
  <line x1="310" y1="48" x2="310" y2="74" stroke="#fafafa" stroke-width="1"/>
  <line x1="370" y1="48" x2="370" y2="74" stroke="#fafafa" stroke-width="1"/>
  <line x1="450" y1="48" x2="450" y2="74" stroke="#fafafa" stroke-width="1"/>

  <!-- row 1: node 4 -->
  <rect x="190" y="74" width="410" height="28" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="220" y="92" text-anchor="middle" font-size="10" fill="#333">① 叶 4</text>
  <text x="280" y="92" text-anchor="middle" font-size="10" fill="#888">-1</text>
  <text x="340" y="92" text-anchor="middle" font-size="10" fill="#888">-1</text>
  <text x="410" y="92" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="530" y="92" text-anchor="middle" font-size="10" fill="#333">[[4]]</text>

  <!-- row 2: node 5 -->
  <rect x="190" y="102" width="410" height="28" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="220" y="120" text-anchor="middle" font-size="10" fill="#333">② 叶 5</text>
  <text x="280" y="120" text-anchor="middle" font-size="10" fill="#888">-1</text>
  <text x="340" y="120" text-anchor="middle" font-size="10" fill="#888">-1</text>
  <text x="410" y="120" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="530" y="120" text-anchor="middle" font-size="10" fill="#333">[[4,5]]</text>

  <!-- row 3: node 2 -->
  <rect x="190" y="130" width="410" height="28" fill="#e8f0fe" filter="url(#rough2)"/>
  <text x="220" y="148" text-anchor="middle" font-size="10" fill="#333">③ 节点 2</text>
  <text x="280" y="148" text-anchor="middle" font-size="10" fill="#4a7a3a">0</text>
  <text x="340" y="148" text-anchor="middle" font-size="10" fill="#4a7a3a">0</text>
  <text x="410" y="148" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">1</text>
  <text x="530" y="148" text-anchor="middle" font-size="10" fill="#333">[[4,5],[2]]</text>

  <!-- row 4: node 3 -->
  <rect x="190" y="158" width="410" height="28" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="220" y="176" text-anchor="middle" font-size="10" fill="#333">④ 叶 3</text>
  <text x="280" y="176" text-anchor="middle" font-size="10" fill="#888">-1</text>
  <text x="340" y="176" text-anchor="middle" font-size="10" fill="#888">-1</text>
  <text x="410" y="176" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="530" y="176" text-anchor="middle" font-size="10" fill="#333">[[4,5,3],[2]]</text>

  <!-- row 5: node 1 -->
  <rect x="190" y="186" width="410" height="28" fill="#fff8e1" filter="url(#rough2)"/>
  <text x="220" y="204" text-anchor="middle" font-size="10" fill="#333">⑤ 根 1</text>
  <text x="280" y="204" text-anchor="middle" font-size="10" fill="#446688">1</text>
  <text x="340" y="204" text-anchor="middle" font-size="10" fill="#4a7a3a">0</text>
  <text x="410" y="204" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">2</text>
  <text x="530" y="204" text-anchor="middle" font-size="10" fill="#333">[[4,5,3],[2],[1]]</text>

  <!-- table border -->
  <rect x="190" y="48" width="410" height="166" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="250" y1="74" x2="250" y2="214" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="310" y1="74" x2="310" y2="214" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="370" y1="74" x2="370" y2="214" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="450" y1="74" x2="450" y2="214" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- conclusion -->
  <rect x="60" y="242" width="500" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="310" y="264" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">最终 res = [[4,5,3],[2],[1]] ✓</text>
  <text x="310" y="284" text-anchor="middle" font-size="10" fill="#555">第 0 轮剥叶子 4,5,3 → 第 1 轮剥 2 → 第 2 轮剥根 1</text>

  <!-- key observations -->
  <rect x="60" y="312" width="500" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="332" text-anchor="middle" font-size="10" fill="#555">⑤ 根 1: layer = max(dfs(2)=1, dfs(3)=0) + 1 = 2 → 落入第 2 组</text>
  <text x="310" y="350" text-anchor="middle" font-size="10" fill="#555">同层节点收集顺序由后序遍历自然决定（左子树先于右子树）</text>
  <text x="310" y="368" text-anchor="middle" font-size="10" fill="#555">res 在 layer == size 时按需扩容，无需预先知道树高</text>
</svg>
