<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "10009998" 的回溯搜索树</text>

  <!-- ===== Root ===== -->
  <ellipse cx="280" cy="46" rx="100" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="50" text-anchor="middle" font-size="12" fill="#333">s = "10009998"</text>

  <!-- Connectors root → level 1 -->
  <path d="M 220 56 Q 165 64 110 72" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 64 L 280 72" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 340 56 Q 395 64 460 72" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Level 1: First piece choices ===== -->
  <!-- Node 1: "1" (val=1) -->
  <rect x="65" y="74" width="90" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="110" y="92" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"1" → 1</text>
  <text x="110" y="108" text-anchor="middle" font-size="10" fill="#888">expect = 0</text>

  <!-- Node 2: "10" (val=10) -->
  <rect x="235" y="74" width="90" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="92" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"10" → 10</text>
  <text x="280" y="108" text-anchor="middle" font-size="10" fill="#888">expect = 9</text>

  <!-- Node 3: "100" (val=100) -->
  <rect x="415" y="74" width="90" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="460" y="92" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"100" → 100</text>
  <text x="460" y="108" text-anchor="middle" font-size="10" fill="#888">expect = 99</text>

  <!-- Connectors level 1 → level 2 -->
  <path d="M 110 118 L 110 156" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 118 L 280 156" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 460 118 L 460 156" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Level 2 ===== -->
  <!-- Node 4: "0"(0) under "1" → fail -->
  <rect x="65" y="158" width="90" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="110" y="176" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"0" → 0</text>
  <text x="110" y="192" text-anchor="middle" font-size="10" fill="#b85450">需 −1，不可能 ✗</text>

  <!-- Node 5: "009"(9) under "10" -->
  <rect x="235" y="158" width="90" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="176" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"009" → 9</text>
  <text x="280" y="192" text-anchor="middle" font-size="10" fill="#4a7a3a">匹配 ✓ expect=8</text>

  <!-- Node 6: "099"(99) under "100" -->
  <rect x="415" y="158" width="90" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="460" y="176" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"099" → 99</text>
  <text x="460" y="192" text-anchor="middle" font-size="10" fill="#4a7a3a">匹配 ✓ expect=98</text>

  <!-- Connectors level 2 → level 3 -->
  <!-- Node 5 → Node 7 -->
  <path d="M 280 202 L 280 240" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- Node 6 → Node 8 -->
  <path d="M 460 202 L 460 240" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Level 3 ===== -->
  <!-- Node 7: "9"(9>8) under "009" → break fail -->
  <rect x="235" y="242" width="90" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="260" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"9" → 9</text>
  <text x="280" y="276" text-anchor="middle" font-size="10" fill="#b85450">9 &gt; 8，break ✗</text>

  <!-- Node 8: "98"(98) under "099" → success! -->
  <rect x="415" y="242" width="90" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="460" y="260" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"98" → 98</text>
  <text x="460" y="276" text-anchor="middle" font-size="10" fill="#4a7a3a">98 == 98，j==n ✓</text>

  <!-- Success highlight arrow -->
  <path d="M 505 264 L 540 264" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== Result box ===== -->
  <rect x="80" y="310" width="400" height="90" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="332" text-anchor="middle" font-size="13" fill="#5a4a1a" font-weight="bold">成功拆分：["100", "099", "98"]</text>
  <text x="280" y="354" text-anchor="middle" font-size="12" fill="#333">数值序列：100 → 99 → 98（降序，相邻差 1）</text>
  <text x="280" y="374" text-anchor="middle" font-size="11" fill="#555">前导零技巧："099" = 99，"009" = 9（int 自动处理）</text>
  <text x="280" y="392" text-anchor="middle" font-size="10" fill="#888">① "1"→0→需−1 ✗  ② "10"→9→"9"超8 ✗  ③ "100"→99→98 ✓</text>
</svg>
