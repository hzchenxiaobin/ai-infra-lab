<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：分治 + 记忆化，遇运算符切分，纯数字即叶</text>

  <!-- Start node -->
  <rect x="250" y="44" width="140" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="320" y="65" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">dfs(s) 查 memo</text>

  <path d="M 320 78 L 320 92" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- Decision: scan chars -->
  <path d="M 320 96 L 376 130 L 320 164 L 264 130 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="128" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">遍历 s[i]</text>
  <text x="320" y="144" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">是运算符?</text>

  <!-- Yes branch (left) -->
  <text x="200" y="130" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 264 130 L 210 130 L 210 178" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- No branch (right) -->
  <text x="440" y="130" font-size="11" fill="#b85450" font-weight="bold">否(纯数字)</text>
  <path d="M 376 130 L 470 130 L 470 178" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- Yes: split + recurse + combine -->
  <rect x="40" y="182" width="340" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="210" y="202" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">切分为左右子串</text>
  <rect x="56" y="212" width="140" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="126" y="230" text-anchor="middle" font-size="11" fill="#333">left = dfs(s[:i])</text>
  <rect x="210" y="212" width="150" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="285" y="230" text-anchor="middle" font-size="11" fill="#333">right = dfs(s[i+1:])</text>
  <text x="210" y="254" text-anchor="middle" font-size="11" fill="#444">双重循环 l∈left, r∈right:</text>
  <rect x="80" y="262" width="260" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="281" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">res.append(l op r)</text>

  <!-- No: leaf -->
  <rect x="404" y="182" width="180" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="494" y="206" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">叶节点</text>
  <rect x="424" y="214" width="140" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="494" y="230" text-anchor="middle" font-size="11" fill="#333">res.append(int(s))</text>

  <!-- merge back -->
  <path d="M 210 304 L 210 324" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <path d="M 494 244 L 494 324" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- memo store -->
  <rect x="180" y="328" width="320" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="340" y="350" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">memo[s] = res，返回 res</text>

  <!-- bottom callout -->
  <rect x="30" y="376" width="580" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="320" y="395" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">记忆化是关键：同一子串(如 "3-4")会被多条递归路径重复访问</text>
  <text x="320" y="410" text-anchor="middle" font-size="11" fill="#888">memo 把指数级重复展开压成多项式级子问题数 O(n²)</text>
</svg>
