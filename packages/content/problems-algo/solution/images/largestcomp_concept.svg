<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">质因子为桥：共因数的数自然连通</text>

  <!-- Row labels -->
  <text x="38" y="94" text-anchor="middle" font-size="10" fill="#888">数字</text>
  <text x="38" y="224" text-anchor="middle" font-size="10" fill="#888">质因子</text>

  <!-- Edges (drawn first so circles overlay) -->
  <!-- Red edges: part of connectivity chain 4~2~6~3~15~5~35 -->
  <line x1="100" y1="112" x2="100" y2="202" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <line x1="220" y1="112" x2="100" y2="202" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <line x1="220" y1="112" x2="220" y2="202" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <line x1="340" y1="112" x2="220" y2="202" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <line x1="340" y1="112" x2="340" y2="202" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <line x1="460" y1="112" x2="340" y2="202" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <!-- Gray dashed edge: leaf prime 7 -->
  <line x1="460" y1="112" x2="460" y2="202" stroke="#bbb" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Number circles (top row) -->
  <circle cx="100" cy="90" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="95" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>

  <circle cx="220" cy="90" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="95" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>

  <circle cx="340" cy="90" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="340" y="95" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">15</text>

  <circle cx="460" cy="90" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="460" y="95" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">35</text>

  <!-- Prime circles (bottom row) -->
  <circle cx="100" cy="220" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="225" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

  <circle cx="220" cy="220" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="225" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>

  <circle cx="340" cy="220" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="340" y="225" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>

  <circle cx="460" cy="220" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="460" y="225" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">7</text>

  <!-- Legend -->
  <line x1="370" y1="250" x2="395" y2="250" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="402" y="254" font-size="10" fill="#666">连通链边</text>
  <line x1="370" y1="268" x2="395" y2="268" stroke="#bbb" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="402" y="272" font-size="10" fill="#666">叶质因子</text>

  <!-- Chain box -->
  <rect x="30" y="248" width="320" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="190" y="270" text-anchor="middle" font-size="11" fill="#444">连通链：4 ~ 2 ~ 6 ~ 3 ~ 15 ~ 5 ~ 35</text>

  <!-- Result box -->
  <rect x="30" y="292" width="320" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="190" y="316" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">4 个数全部同根 → 最大分量 = 4</text>

  <!-- Leaf note -->
  <rect x="360" y="292" width="160" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="440" y="307" text-anchor="middle" font-size="10" fill="#4a7a3a">质因子 7 仅连 35</text>
  <text x="440" y="322" text-anchor="middle" font-size="10" fill="#4a7a3a">（叶节点，不影响连通）</text>

  <!-- Key insight -->
  <rect x="20" y="340" width="500" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="270" y="360" text-anchor="middle" font-size="11" fill="#555">不枚举 O(n²) 数对求 GCD，而是把质因子当作虚拟桥节点</text>
  <text x="270" y="378" text-anchor="middle" font-size="11" fill="#555">两数共享质因子 p ⟺ gcd(a,b) ≥ p &gt; 1 → union 自然连通</text>
</svg>
