<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 444"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="444" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：滑窗转移 + 需求清零，O(n · 400)</text>

  <rect x="120" y="40" width="280" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="58" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">初始化：req[end] = cnt</text>
  <text x="260" y="76" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">dp[0] = 1（i=1：只放值 0），其余为 0</text>

  <line x1="260" y1="84" x2="260" y2="100" stroke="#446688" stroke-width="1.8" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <rect x="120" y="104" width="280" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="126" text-anchor="middle" font-size="11" fill="#a07820" font-weight="bold" filter="url(#rough2)">for i = 2 … n（插入值 i−1 = 当前最大值）</text>

  <line x1="260" y1="140" x2="260" y2="156" stroke="#446688" stroke-width="1.8" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <rect x="90" y="160" width="340" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="182" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">滑窗转移：ndp[j] = ndp[j−1] + dp[j] − dp[j−i]</text>
  <text x="260" y="202" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">（j = 0…400；j &lt; i 时不减；由 Σ dp[j−k] 相邻作差而得）</text>

  <line x1="260" y1="216" x2="260" y2="232" stroke="#446688" stroke-width="1.8" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <polygon points="260,236 386,268 260,300 134,268" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="264" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">end = i−1</text>
  <text x="260" y="280" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">有需求？</text>

  <line x1="260" y1="300" x2="260" y2="316" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="272" y="312" font-size="9.5" fill="#b85450" filter="url(#rough2)">是</text>

  <rect x="150" y="320" width="220" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="338" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">清零：只保留 j = cnt</text>
  <text x="260" y="354" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">（cnt = req[end]）</text>

  <path d="M 134 268 H 76 V 122 H 114" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <text x="112" y="258" text-anchor="end" font-size="9.5" fill="#888" filter="url(#rough2)">否</text>

  <path d="M 150 340 H 44 V 132 H 114" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arrGray)" filter="url(#rough2)"/>

  <path d="M 400 122 H 472 V 388 H 416" fill="none" stroke="#888" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <text x="464" y="250" text-anchor="end" font-size="9.5" fill="#888" filter="url(#rough2)">i &gt; n 退出</text>

  <rect x="120" y="368" width="290" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="386" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">返回 dp[req[n−1]] mod 10⁹+7</text>
  <text x="260" y="402" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">（题目保证 end = n−1 处必有需求）</text>

  <rect x="36" y="416" width="448" height="24" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="432" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">j 只需枚举到 400：cnt ≤ 400 且逆序对数单调不减，超过的状态永远救不回来</text>
</svg>
