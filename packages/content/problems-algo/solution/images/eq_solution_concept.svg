<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">核心观察：f(x,y) 严格单调递增 → 解沿反对角线排列</text>
  <text x="280" y="40" text-anchor="middle" font-size="10.5" fill="#446688">以 f(x,y) = x + y, z = 5 为例</text>

  <text x="255" y="66" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">x →</text>
  <text x="108" y="52" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">↑ y</text>

  <text x="155" y="74" text-anchor="middle" font-size="9.5" fill="#888">1</text>
  <text x="205" y="74" text-anchor="middle" font-size="9.5" fill="#888">2</text>
  <text x="255" y="74" text-anchor="middle" font-size="9.5" fill="#888">3</text>
  <text x="305" y="74" text-anchor="middle" font-size="9.5" fill="#888">4</text>
  <text x="355" y="74" text-anchor="middle" font-size="9.5" fill="#888">5</text>

  <text x="122" y="97" text-anchor="end" font-size="9.5" fill="#888">5</text>
  <text x="122" y="127" text-anchor="end" font-size="9.5" fill="#888">4</text>
  <text x="122" y="157" text-anchor="end" font-size="9.5" fill="#888">3</text>
  <text x="122" y="187" text-anchor="end" font-size="9.5" fill="#888">2</text>
  <text x="122" y="217" text-anchor="end" font-size="9.5" fill="#888">1</text>

  <!-- Row y=5: all > 5 -->
  <rect x="130" y="78" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="155" y="97" text-anchor="middle" font-size="11" fill="#333">6</text>
  <rect x="180" y="78" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="205" y="97" text-anchor="middle" font-size="11" fill="#333">7</text>
  <rect x="230" y="78" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="255" y="97" text-anchor="middle" font-size="11" fill="#333">8</text>
  <rect x="280" y="78" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="305" y="97" text-anchor="middle" font-size="11" fill="#333">9</text>
  <rect x="330" y="78" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="355" y="97" text-anchor="middle" font-size="11" fill="#333">10</text>

  <!-- Row y=4: (1,4)=5 green -->
  <rect x="130" y="108" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="155" y="127" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5 ✓</text>
  <rect x="180" y="108" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="205" y="127" text-anchor="middle" font-size="11" fill="#333">6</text>
  <rect x="230" y="108" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="255" y="127" text-anchor="middle" font-size="11" fill="#333">7</text>
  <rect x="280" y="108" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="305" y="127" text-anchor="middle" font-size="11" fill="#333">8</text>
  <rect x="330" y="108" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="355" y="127" text-anchor="middle" font-size="11" fill="#333">9</text>

  <!-- Row y=3: (1,3)=4 blue, (2,3)=5 green -->
  <rect x="130" y="138" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="155" y="157" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="180" y="138" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="205" y="157" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5 ✓</text>
  <rect x="230" y="138" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="255" y="157" text-anchor="middle" font-size="11" fill="#333">6</text>
  <rect x="280" y="138" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="305" y="157" text-anchor="middle" font-size="11" fill="#333">7</text>
  <rect x="330" y="138" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="355" y="157" text-anchor="middle" font-size="11" fill="#333">8</text>

  <!-- Row y=2: (1,2)=3 blue, (2,2)=4 blue, (3,2)=5 green -->
  <rect x="130" y="168" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="155" y="187" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="180" y="168" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="205" y="187" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="230" y="168" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="255" y="187" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5 ✓</text>
  <rect x="280" y="168" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="305" y="187" text-anchor="middle" font-size="11" fill="#333">6</text>
  <rect x="330" y="168" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="355" y="187" text-anchor="middle" font-size="11" fill="#333">7</text>

  <!-- Row y=1: (1,1)=2, (2,1)=3, (3,1)=4 blue, (4,1)=5 green, (5,1)=6 orange -->
  <rect x="130" y="198" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="155" y="217" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="180" y="198" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="205" y="217" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="230" y="198" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="255" y="217" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="280" y="198" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="305" y="217" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5 ✓</text>
  <rect x="330" y="198" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="355" y="217" text-anchor="middle" font-size="11" fill="#333">6</text>

  <!-- Anti-diagonal connecting solutions -->
  <path d="M 155 123 L 205 153 L 255 183 L 305 213" stroke="#b85450" stroke-width="2.2" stroke-dasharray="5,3" fill="none" filter="url(#rough2)"/>

  <!-- Legend -->
  <rect x="410" y="82" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="430" y="94" font-size="9.5" fill="#446688">f &lt; z</text>
  <rect x="410" y="102" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="430" y="114" font-size="9.5" fill="#4a7a3a" font-weight="bold">f = z ✓</text>
  <rect x="410" y="122" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="430" y="134" font-size="9.5" fill="#d6a040">f &gt; z</text>

  <line x1="410" y1="155" x2="424" y2="155" stroke="#b85450" stroke-width="2.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="430" y="159" font-size="9.5" fill="#b85450" font-weight="bold">反对角线</text>

  <!-- Monotonicity arrows -->
  <path d="M 410 180 L 445 180" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="452" y="184" font-size="9" fill="#446688">x↑→f↑</text>
  <path d="M 427 190 L 427 205" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="452" y="202" font-size="9" fill="#4a7a3a">y↑→f↑</text>

  <!-- Bottom note 1 -->
  <rect x="30" y="248" width="500" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="50" y="268" font-size="10.5" fill="#333">💡 <tspan fill="#d6a040" font-weight="bold">关键观察</tspan>：f 严格单调递增 → 若 f(x₁,y₁)=f(x₂,y₂)=z 且 x₁&lt;x₂，</text>
  <text x="50" y="284" font-size="10.5" fill="#333">则必有 y₁&gt;y₂（更大的 x 配更小的 y 才能保持 f 不变）→ 所有解构成一条</text>
  <text x="50" y="300" font-size="10.5" fill="#333"><tspan fill="#b85450" font-weight="bold">反对角线</tspan>，可用双指针从 (1, maxY) 出发沿对角线扫描。</text>

  <!-- Bottom note 2 -->
  <rect x="30" y="314" width="500" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="50" y="334" font-size="10" fill="#333">⚠️ <tspan fill="#446688" font-weight="bold">单调性推论</tspan>：f(x,y)&gt;z → 该行右侧全 &gt;z，可 y-- 剪枝整行</text>
  <text x="50" y="350" font-size="10" fill="#333">f(x,y)&lt;z → 该列下方全 &lt;z，可 x++ 剪枝整列 → 双指针 O(x_max+y_max)</text>
</svg>
