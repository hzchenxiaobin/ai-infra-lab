<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：每步 ±1 ⟺ 选 r 步向右 ⟹ C(k, r)</text>

  <!-- Row 1: number line -->
  <text x="28" y="56" font-size="10.5" fill="#666" filter="url(#rough2)">无限数轴</text>
  <line x1="60" y1="68" x2="470" y2="68" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>

  <circle cx="160" cy="68" r="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="58" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">startPos</text>
  <text x="160" y="88" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>

  <circle cx="320" cy="68" r="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="320" y="58" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">endPos</text>
  <text x="320" y="88" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>

  <!-- distance bracket -->
  <path d="M 160 100 L 160 108 L 320 108 L 320 100" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="240" y="122" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">d = |Δ| = |endPos − startPos|</text>

  <!-- Row 2: step decomposition -->
  <text x="28" y="156" font-size="10.5" fill="#666" filter="url(#rough2)">每步 ±1</text>

  <rect x="80" y="142" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="108" y="161" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">r 步→</text>
  <text x="108" y="184" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">向右 +1</text>

  <text x="150" y="160" text-anchor="middle" font-size="14" fill="#888" filter="url(#rough2)">+</text>

  <rect x="170" y="142" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="198" y="161" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">l 步←</text>
  <text x="198" y="184" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">向左 −1</text>

  <text x="246" y="160" text-anchor="middle" font-size="14" fill="#888" filter="url(#rough2)">=</text>

  <rect x="262" y="142" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="282" y="161" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">k 步</text>

  <!-- equations box -->
  <rect x="320" y="138" width="160" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="400" y="157" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">r + l = k</text>
  <text x="400" y="174" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">r − l = Δ  (有向位移)</text>

  <!-- Row 3: solve -->
  <path d="M 260 192 L 260 204" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="80" y="208" width="360" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="228" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">解出：r = (k + Δ)/2 ， l = (k − Δ)/2</text>

  <!-- Row 4: feasibility -->
  <path d="M 260 244 L 260 256" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="70" y="260" width="380" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="278" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">可行性两条件（否则答案 0）</text>
  <text x="260" y="296" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">① k 与 d 同奇偶（保证 r 整数）  ② d ≤ k（步数够走）</text>

  <!-- Row 5: combination formula -->
  <rect x="110" y="314" width="300" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="334" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案 = C(k, r) = C(k, (k+d)/2) mod p</text>

  <text x="260" y="356" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">从 k 步中选 r 步向右，其余向左；与选 l 步等价：C(k,r)=C(k,l)</text>
</svg>
