<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">流程：打包 → concat → 列名对齐 → 垂直堆叠 → 返回</text>

  <!-- start -->
  <rect x="180" y="48" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="70" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">输入：df1（n 行）、df2（m 行）</text>
  <path d="M 280 82 L 280 100" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- pack -->
  <rect x="180" y="102" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="124" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">打包成序列 [df1, df2]</text>
  <path d="M 280 136 L 280 154" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- concat -->
  <rect x="180" y="156" width="200" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="178" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">pd.concat(objs, axis=0)</text>
  <path d="M 280 190 L 280 208" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond -->
  <polygon points="280,210 370,255 280,300 190,255" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="250" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">两表列名</text>
  <text x="280" y="267" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">完全一致？</text>

  <!-- yes branch -->
  <path d="M 370 255 L 398 255" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="382" y="248" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="400" y="233" width="145" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="472" y="251" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">同名列对齐</text>
  <text x="472" y="268" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">直接堆叠（本题）</text>

  <!-- no branch -->
  <path d="M 190 255 L 162 255" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="176" y="248" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="15" y="233" width="145" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="87" y="251" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">join='outer' 取并集</text>
  <text x="87" y="268" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">缺格补 NaN</text>

  <!-- to stack -->
  <path d="M 280 300 L 280 318" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- stack -->
  <rect x="180" y="320" width="200" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="342" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">垂直堆叠：df1 在前，df2 在后</text>
  <path d="M 280 354 L 280 372" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- end -->
  <rect x="180" y="374" width="200" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="396" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回新 DataFrame（n+m 行）</text>
</svg>
