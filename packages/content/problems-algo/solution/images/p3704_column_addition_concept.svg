<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：a + b = n 拆成逐位竖式加法（低位 → 高位）</text>

  <!-- 左侧竖式 268 + 175 = 443 -->
  <text x="145" y="48" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">竖式示例：268 + 175 = 443</text>

  <!-- 进位小圆 -->
  <circle cx="86" cy="66" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="86" y="70" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">1</text>
  <circle cx="132" cy="66" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="132" y="70" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">1</text>

  <!-- 进位箭头 -->
  <path d="M 178 88 C 168 78, 158 74, 146 72" fill="none" stroke="#d6a040" stroke-width="1.4" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 132 88 C 124 80, 114 74, 100 72" fill="none" stroke="#d6a040" stroke-width="1.4" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- a 行 -->
  <text x="52" y="108" text-anchor="end" font-size="13" fill="#446688" filter="url(#rough2)">a</text>
  <rect x="66" y="88" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="86" y="108" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="112" y="88" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="132" y="108" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>
  <rect x="158" y="88" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="108" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">8</text>

  <!-- b 行 -->
  <text x="52" y="148" text-anchor="end" font-size="13" fill="#4a7a3a" filter="url(#rough2)">+ b</text>
  <rect x="66" y="128" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="86" y="148" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="112" y="128" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="132" y="148" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7</text>
  <rect x="158" y="128" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="148" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>

  <!-- 和线 -->
  <path d="M 32 170 C 90 174, 160 167, 216 171" fill="none" stroke="#555" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- n 行 -->
  <text x="52" y="198" text-anchor="end" font-size="13" fill="#d6a040" filter="url(#rough2)">n</text>
  <rect x="66" y="178" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="86" y="198" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <rect x="112" y="178" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="132" y="198" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <rect x="158" y="178" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="198" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>

  <!-- 逐位注释 -->
  <text x="30" y="238" font-size="11" fill="#666" filter="url(#rough2)">个位：8 + 5 = 13 → 写 3，向十位进 1</text>
  <text x="30" y="256" font-size="11" fill="#666" filter="url(#rough2)">十位：6 + 7 + 1 = 14 → 写 4，向百位进 1</text>
  <text x="30" y="274" font-size="11" fill="#666" filter="url(#rough2)">百位：2 + 1 + 1 = 4 → 写 4，进位归 0 收尾</text>
  <text x="30" y="298" font-size="11" fill="#b85450" filter="url(#rough2)">268、175 每一位都是 1~9 → 一组合法解</text>
  <text x="30" y="316" font-size="11" fill="#b85450" filter="url(#rough2)">（数对有序：(268,175) 与 (175,268) 各算一次）</text>

  <!-- 右侧要点框 ① -->
  <rect x="288" y="54" width="218" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="397" y="74" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">① 无零 ⇒ 每位 ∈ {1..9}</text>
  <text x="397" y="92" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">da、db 只能取 1~9</text>
  <text x="397" y="106" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">（只约束真实存在的位）</text>

  <!-- 右侧要点框 ② -->
  <rect x="288" y="128" width="218" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="397" y="148" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">② 逐位进位方程</text>
  <text x="397" y="166" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">da+db+c 的个位 = n 的当前位</text>
  <text x="397" y="180" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">新进位 = 和 ÷ 10 ∈ {0,1}（和 ≤ 19）</text>

  <!-- 右侧要点框 ③ -->
  <rect x="288" y="202" width="218" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="397" y="222" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">③ 位数可以比 n 短</text>
  <text x="397" y="240" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">某位之后标记「已结束」，高位按 0 计</text>
  <text x="397" y="254" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">一旦结束不可逆（如 n=11 的 (2,9)）</text>

  <!-- 右侧要点框 ④ -->
  <rect x="288" y="276" width="218" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="397" y="296" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">④ 终止条件</text>
  <text x="397" y="314" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">扫完最高位：进位 = 0</text>
  <text x="397" y="328" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">且 a、b 均已结束</text>

  <text x="16" y="350" font-size="10" fill="#999" filter="url(#rough2)">注：状态 (进位 c, a 结束?, b 结束?) 共 2×2×2 = 8 个，每位转移至多 81 组数字对</text>
</svg>
