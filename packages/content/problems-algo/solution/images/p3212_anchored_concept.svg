<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：左上角锚死 (0,0)，右下角逐格枚举</text>

  <!-- 左侧 3x3 网格 -->
  <rect x="48" y="56" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="83" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">X</text>
  <rect x="92" y="56" width="44" height="44" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="114" y="83" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">Y</text>
  <rect x="136" y="56" width="44" height="44" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="158" y="83" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">.</text>
  <rect x="48" y="100" width="44" height="44" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="127" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">Y</text>
  <rect x="92" y="100" width="44" height="44" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="114" y="127" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">.</text>
  <rect x="136" y="100" width="44" height="44" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="158" y="127" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">.</text>
  <rect x="48" y="144" width="44" height="44" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="171" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">.</text>
  <rect x="92" y="144" width="44" height="44" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="114" y="171" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">X</text>
  <rect x="136" y="144" width="44" height="44" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="158" y="171" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">Y</text>

  <!-- 行列标号 -->
  <text x="42" y="87" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">i=0</text>
  <text x="42" y="131" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <text x="42" y="175" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">2</text>
  <text x="70" y="204" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j=0</text>
  <text x="114" y="204" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <text x="158" y="204" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>

  <circle cx="48" cy="56" r="4" fill="#b85450" filter="url(#rough2)"/>
  <text x="114" y="222" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">锚点：必须包含 grid[0][0]</text>

  <!-- 右侧三个说明框 -->
  <rect x="232" y="48" width="256" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="68" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">候选只有 m×n 个</text>
  <text x="360" y="86" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">子矩阵形如 grid[0..x][0..y]</text>
  <text x="360" y="100" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">右下角 (x,y) 与候选一一对应（一般要 m²n²）</text>

  <rect x="232" y="118" width="256" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="138" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">频数相等 ⇔ 差为 0</text>
  <text x="360" y="156" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">编码 X→+1，Y→−1，.→0 ⇒ 区域和 = 0</text>

  <rect x="232" y="180" width="256" height="60" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="200" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">⚠️ 别忘排除空白区域</text>
  <text x="360" y="218" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">全 '.' 区域和也是 0</text>
  <text x="360" y="232" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">还须「至少一个 X」：sx &gt; 0</text>

  <!-- 底部三个候选示例 -->
  <text x="260" y="252" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">三个候选示例（绿 ✓ / 红 ✗）：</text>

  <!-- Mini A：右下角 (0,1) -->
  <rect x="56" y="258" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="67" y="274" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">X</text>
  <rect x="78" y="258" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="89" y="274" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Y</text>
  <rect x="100" y="258" width="22" height="22" fill="#fff" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="111" y="274" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">.</text>
  <rect x="56" y="280" width="22" height="22" fill="#fff" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="67" y="296" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">Y</text>
  <rect x="78" y="280" width="22" height="22" fill="#fff" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="89" y="296" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">.</text>
  <rect x="100" y="280" width="22" height="22" fill="#fff" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="111" y="296" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">.</text>
  <rect x="56" y="302" width="22" height="22" fill="#fff" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="67" y="318" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">.</text>
  <rect x="78" y="302" width="22" height="22" fill="#fff" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="89" y="318" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">X</text>
  <rect x="100" y="302" width="22" height="22" fill="#fff" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="111" y="318" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">Y</text>
  <text x="89" y="340" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">(0,1)：X=Y=1 ✓</text>

  <!-- Mini B：右下角 (1,0) -->
  <rect x="210" y="258" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="221" y="274" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">X</text>
  <rect x="232" y="258" width="22" height="22" fill="#fff" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="243" y="274" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">Y</text>
  <rect x="254" y="258" width="22" height="22" fill="#fff" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="265" y="274" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">.</text>
  <rect x="210" y="280" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="221" y="296" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Y</text>
  <rect x="232" y="280" width="22" height="22" fill="#fff" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="243" y="296" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">.</text>
  <rect x="254" y="280" width="22" height="22" fill="#fff" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="265" y="296" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">.</text>
  <rect x="210" y="302" width="22" height="22" fill="#fff" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="221" y="318" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">.</text>
  <rect x="232" y="302" width="22" height="22" fill="#fff" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="243" y="318" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">X</text>
  <rect x="254" y="302" width="22" height="22" fill="#fff" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="265" y="318" text-anchor="middle" font-size="11" fill="#bbb" filter="url(#rough2)">Y</text>
  <text x="243" y="340" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">(1,0)：X=Y=1 ✓</text>

  <!-- Mini C：右下角 (2,2) -->
  <rect x="364" y="258" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="375" y="274" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">X</text>
  <rect x="386" y="258" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="397" y="274" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Y</text>
  <rect x="408" y="258" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="419" y="274" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">.</text>
  <rect x="364" y="280" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="375" y="296" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Y</text>
  <rect x="386" y="280" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="397" y="296" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">.</text>
  <rect x="408" y="280" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="419" y="296" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">.</text>
  <rect x="364" y="302" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="375" y="318" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">.</text>
  <rect x="386" y="302" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="397" y="318" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">X</text>
  <rect x="408" y="302" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="419" y="318" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Y</text>
  <text x="397" y="340" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">(2,2)：X=2,Y=3 ✗</text>
</svg>
