<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：展开房间，让光线走直线（以 p=2, q=1 为例）</text>

  <!-- ===== 左侧：原始房间 + 反射光线 ===== -->
  <text x="115" y="52" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">原始房间：光线弹射</text>

  <!-- 房间 -->
  <rect x="50" y="90" width="130" height="130" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="2" filter="url(#rough2)"/>

  <!-- 墙壁标签 -->
  <text x="115" y="84" text-anchor="middle" font-size="9" fill="#888">北墙</text>
  <text x="190" y="158" font-size="9" fill="#888">东墙</text>

  <!-- 光线弹射路径: (50,220)→(180,155)→(50,90) -->
  <path d="M 50 220 L 180 155" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="6 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 180 155 L 50 90" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- 反射点标注 -->
  <circle cx="180" cy="155" r="3.5" fill="#d6a040" filter="url(#rough2)"/>
  <text x="190" y="148" font-size="9" fill="#d6a040">入射点 (p,q)</text>

  <!-- 源点 (SW) -->
  <circle cx="50" cy="220" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="50" y="224" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">S</text>
  <text x="38" y="238" font-size="9" fill="#888">源</text>

  <!-- 接收器 0 (SE) -->
  <circle cx="180" cy="220" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="224" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">0</text>

  <!-- 接收器 1 (NE) -->
  <circle cx="180" cy="90" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="94" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- 接收器 2 (NW) — 命中！ -->
  <circle cx="50" cy="90" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="50" y="94" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">2</text>
  <text x="38" y="80" font-size="9" fill="#b85450" font-weight="bold">命中!</text>

  <!-- 箭头：展开 -->
  <path d="M 210 155 L 260 155" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="235" y="146" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">展开</text>

  <!-- ===== 右侧：展开后的房间 + 直线光线 ===== -->
  <text x="410" y="52" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">展开房间：光线走直线</text>

  <!-- Room 0 (original) -->
  <rect x="280" y="90" width="130" height="130" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="345" y="106" text-anchor="middle" font-size="9" fill="#446688">原房间</text>

  <!-- Room 1 (mirrored) -->
  <rect x="410" y="90" width="130" height="130" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="475" y="106" text-anchor="middle" font-size="9" fill="#d6a040">镜像房间</text>

  <!-- 中间墙（虚线表示可穿透） -->
  <line x1="410" y1="90" x2="410" y2="220" stroke="#bbb" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- 直线光线: (280,220)→(540,90) -->
  <path d="M 280 220 L 540 90" stroke="#b85450" stroke-width="2.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- 穿墙点 -->
  <circle cx="410" cy="155" r="3.5" fill="#d6a040" filter="url(#rough2)"/>

  <!-- 源点 -->
  <circle cx="280" cy="220" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="224" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">S</text>

  <!-- 展开图中的接收器 -->
  <!-- Room 0: SE(410,220)=0, NE(410,90)=1, NW(280,90)=2 -->
  <circle cx="410" cy="220" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="410" y="223" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">0</text>
  <circle cx="410" cy="90" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="410" y="93" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">1</text>
  <circle cx="280" cy="90" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="93" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- Room 1 (mirrored): right wall = original left wall, so right corners = original left corners -->
  <!-- SE of Room1 (540,220) = SW of original = source, no receptor -->
  <!-- NE of Room1 (540,90) = NW of original = receptor 2 -->
  <circle cx="540" cy="90" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="540" y="94" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">2</text>
  <text x="540" y="78" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">命中!</text>

  <!-- Room 1 left corners = original right corners -->
  <circle cx="410" cy="220" r="5" fill="none" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="410" cy="90" r="5" fill="none" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- 底部说明 -->
  <rect x="30" y="250" width="520" height="48" fill="#f6f8fb" stroke="#bbb" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="290" y="270" text-anchor="middle" font-size="11" fill="#555">光线方向 (p, q)，在展开平面走直线，到达 (k·p, m·p) 即命中接收器</text>
  <text x="290" y="288" text-anchor="middle" font-size="11" fill="#555">k = 水平方向穿越房间数，m = 垂直方向穿越房间数</text>

  <!-- 底部公式 -->
  <rect x="120" y="310" width="340" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="333" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">k = p / gcd(p,q),  m = q / gcd(p,q)</text>

  <!-- 图例 -->
  <text x="290" y="366" text-anchor="middle" font-size="10" fill="#888">k 偶→西墙, k 奇→东墙；m 偶→南墙, m 奇→北墙</text>
</svg>
