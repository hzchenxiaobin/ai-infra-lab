<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：候选上界 M 下 [1..M] 按“能否放入”分成三池</text>

  <!-- 外框 1..M -->
  <rect x="40" y="48" width="460" height="170" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="56" y="66" font-size="11" fill="#d6a040" font-weight="bold">正整数区间 [1, M]</text>

  <!-- 左椭圆 arr1 池 -->
  <ellipse cx="200" cy="150" rx="120" ry="68" fill="#e8f0fe" fill-opacity="0.75" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <!-- 右椭圆 arr2 池 -->
  <ellipse cx="360" cy="150" rx="120" ry="68" fill="#e6f4ea" fill-opacity="0.75" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- 池内文字 -->
  <text x="135" y="120" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">arr1 可选池</text>
  <text x="135" y="138" text-anchor="middle" font-size="10.5" fill="#446688">不被 d₁ 整除</text>
  <text x="135" y="160" text-anchor="middle" font-size="11" fill="#333">仅此处可填 arr1</text>
  <text x="135" y="178" text-anchor="middle" font-size="11" fill="#333">（左月牙）</text>

  <text x="425" y="120" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">arr2 可选池</text>
  <text x="425" y="138" text-anchor="middle" font-size="10.5" fill="#4a7a3a">不被 d₂ 整除</text>
  <text x="425" y="160" text-anchor="middle" font-size="11" fill="#333">仅此处可填 arr2</text>
  <text x="425" y="178" text-anchor="middle" font-size="11" fill="#333">（右月牙）</text>

  <!-- 交集 -->
  <text x="280" y="120" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">皆可 C（共享池）</text>
  <text x="280" y="138" text-anchor="middle" font-size="10.5" fill="#b85450">不被 d₁ 且不被 d₂</text>
  <text x="280" y="160" text-anchor="middle" font-size="10.5" fill="#333">两数组都能取</text>
  <text x="280" y="178" text-anchor="middle" font-size="10.5" fill="#333">需在二者间分配</text>

  <!-- 公式区 -->
  <rect x="40" y="236" width="460" height="118" fill="none" stroke="#bbb" stroke-width="1" rx="8" filter="url(#rough2)" stroke-dasharray="3,2"/>
  <text x="56" y="256" font-size="12" fill="#d6a040" font-weight="bold">三池容量（容斥计数，O(1)）</text>

  <text x="56" y="278" font-size="11" fill="#446688" font-weight="bold">A = M − ⌊M/d₁⌋</text>
  <text x="200" y="278" font-size="10.5" fill="#888">arr1 可选数 = 不被 d₁ 整除者</text>

  <text x="56" y="300" font-size="11" fill="#4a7a3a" font-weight="bold">B = M − ⌊M/d₂⌋</text>
  <text x="200" y="300" font-size="10.5" fill="#888">arr2 可选数 = 不被 d₂ 整除者</text>

  <text x="56" y="322" font-size="11" fill="#b85450" font-weight="bold">C = M − ⌊M/d₁⌋ − ⌊M/d₂⌋ + ⌊M/lcm⌋</text>
  <text x="360" y="322" font-size="10.5" fill="#888">两者皆可 = 不被 lcm 整除</text>

  <text x="56" y="344" font-size="11" fill="#333" font-weight="bold">并集 = A + B − C = M − ⌊M/lcm⌋</text>
  <text x="300" y="344" font-size="10.5" fill="#888">至少可入其一 = 不被 d₁∩d₂= lcm 整除</text>
</svg>
