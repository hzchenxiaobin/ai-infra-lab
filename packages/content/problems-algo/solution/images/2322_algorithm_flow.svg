<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：建图 → 后序 DFS → 枚举点对 → 算分数</text>

  <!-- B1 -->
  <rect x="150" y="34" width="240" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="53" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① 以 0 为根，建邻接表 g[]</text>
  <line x1="270" y1="64" x2="270" y2="80" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B2 -->
  <rect x="150" y="80" width="240" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="97" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② 后序 DFS：算 xorSub[]、tin[]、tout[]</text>
  <text x="270" y="112" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">子树异或向上合并 + 进/出时间戳</text>
  <line x1="270" y1="120" x2="270" y2="136" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B3 -->
  <rect x="150" y="136" width="240" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="155" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ total = xorSub[0]</text>
  <line x1="270" y1="164" x2="270" y2="180" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B4 -->
  <rect x="130" y="180" width="280" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="199" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">④ 双重循环枚举非根点对 (i, j), i &lt; j  —  O(n²)</text>
  <line x1="270" y1="210" x2="270" y2="226" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond -->
  <polygon points="270,226 344,252 270,278 196,252" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="256" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">⑤ i,j 祖先嵌套?</text>

  <!-- Yes branch -->
  <line x1="344" y1="252" x2="386" y2="252" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="362" y="246" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="386" y="222" width="148" height="60" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="460" y="238" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">嵌套（含 j 祖先 i 的对称支）</text>
  <text x="460" y="252" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">x = xor[j]</text>
  <text x="460" y="264" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">y = xor[i] ^ xor[j]</text>
  <text x="460" y="276" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">z = total ^ xor[i]</text>

  <!-- No branch -->
  <line x1="196" y1="252" x2="154" y2="252" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="178" y="246" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="6" y="222" width="148" height="60" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="238" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">平行子树</text>
  <text x="80" y="252" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">x = xor[i]</text>
  <text x="80" y="264" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">y = xor[j]</text>
  <text x="80" y="276" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">z = total ^ xor[i] ^ xor[j]</text>

  <!-- merge arrows to B6 -->
  <path d="M460,282 L460,294 L270,294 L270,302" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M80,282 L80,294 L270,294" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- B6 -->
  <rect x="150" y="302" width="240" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="321" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">⑥ ans = min(ans, max − min)</text>
  <line x1="270" y1="332" x2="270" y2="348" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B7 -->
  <rect x="150" y="348" width="240" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="370" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">⑦ 返回 ans</text>
</svg>
