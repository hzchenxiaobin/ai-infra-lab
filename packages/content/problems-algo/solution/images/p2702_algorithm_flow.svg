<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：二分 + O(n) 贪心 check</text>

  <!-- init -->
  <rect x="200" y="48" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="70" text-anchor="middle" font-size="11.5" fill="#333">l = 0,  r = max(nums)</text>
  <path d="M270 82 L270 100" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- while diamond -->
  <polygon points="270,104 360,150 270,196 180,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="146" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">l &lt; r ?</text>
  <text x="270" y="162" text-anchor="middle" font-size="10.5" fill="#888">循环条件</text>

  <!-- No branch -->
  <path d="M180 150 L120 150" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="142" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="40" y="132" width="78" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="79" y="155" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">return l</text>

  <!-- Yes branch -->
  <path d="M270 196 L270 214" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="208" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- mid -->
  <rect x="195" y="216" width="150" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="238" text-anchor="middle" font-size="11.5" fill="#333">mid = (l + r) &gt;&gt; 1</text>
  <path d="M270 250 L270 268" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- check diamond -->
  <polygon points="270,272 370,312 270,352 170,312" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="308" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">check(mid)?</text>
  <text x="270" y="324" text-anchor="middle" font-size="10" fill="#888">Σ⌈(v−mid·y)/(x−y)⌉ ≤ mid</text>

  <!-- True branch: r = mid -->
  <path d="M170 312 L110 312" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="138" y="304" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">真</text>
  <rect x="30" y="294" width="78" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="69" y="316" text-anchor="middle" font-size="11" fill="#333">r = mid</text>

  <!-- False branch: l = mid+1 -->
  <path d="M370 312 L430 312" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="402" y="304" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">假</text>
  <rect x="432" y="294" width="86" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="475" y="316" text-anchor="middle" font-size="11" fill="#333">l = mid+1</text>

  <!-- loop back arrows -->
  <path d="M69 294 L69 150 L180 150" stroke="#666" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M475 294 L475 150 L360 150" stroke="#666" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="55" y="220" font-size="10" fill="#888">回循环</text>

  <!-- bottom invariant -->
  <rect x="40" y="362" width="460" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="270" y="380" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">不变式：l−1 不可行，r 可行 ⟹ 收敛 l=r=最小可行</text>
</svg>
