<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">约瑟夫环递推算法流程</text>

  <!-- ===== Start ===== -->
  <rect x="165" y="36" width="230" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="280" y="56" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">初始化: ans = 0 （即 f(1,m)=0）</text>

  <path d="M 280 70 L 280 82" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Decision diamond ===== -->
  <polygon points="280,84 352,114 280,144 208,114" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="118" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">i ≤ n ?</text>

  <!-- No branch -->
  <path d="M 352 114 L 420 114" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="108" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="420" y="100" width="120" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="480" y="119" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return ans</text>

  <!-- Yes branch -->
  <path d="M 280 144 L 280 160" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="156" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- ===== Compute box ===== -->
  <rect x="120" y="162" width="320" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="280" y="183" text-anchor="middle" font-size="11" fill="#446688">ans = (ans + m) % i</text>

  <path d="M 280 198 L 280 210" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Note box ===== -->
  <rect x="100" y="212" width="360" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="280" y="233" text-anchor="middle" font-size="10" fill="#d6a040">此时 ans = f(i, m)，规模从 i−1 递推到 i</text>

  <path d="M 280 248 L 280 260" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Increment ===== -->
  <rect x="210" y="262" width="140" height="32" fill="#f6f6f6" stroke="#888" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="280" y="282" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">i++</text>

  <!-- ===== Loop back arrow ===== -->
  <path d="M 210 278 L 36 278 L 36 114 L 206 114" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="44" y="200" font-size="10" fill="#888" font-weight="bold">循环</text>

  <!-- ===== Warning note ===== -->
  <rect x="80" y="328" width="400" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="348" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">💡 从小规模向大规模递推，避免递归栈</text>
  <text x="280" y="366" text-anchor="middle" font-size="10" fill="#888">i=2: f(2)=(0+m)%2 → i=3: f(3)=(f(2)+m)%3 → ... → i=n: f(n)</text>
  <text x="280" y="382" text-anchor="middle" font-size="10" fill="#888">每步用上一轮的 ans 推出当前轮，O(1) 空间</text>
</svg>
