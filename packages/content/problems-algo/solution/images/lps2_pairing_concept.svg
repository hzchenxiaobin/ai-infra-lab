<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：偶长回文 = 由外向内的「配对」嵌套</text>

  <!-- ===== Good example: baab ===== -->
  <text x="280" y="58" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">好的回文子序列 "baab"（长度 4 = 2 对）</text>

  <!-- 4 boxes, w=46, start x=170 -->
  <!-- pair1 outer: index0 b, index3 b (blue) -->
  <rect x="170" y="72" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="193" y="98" text-anchor="middle" font-size="17" fill="#335" font-weight="bold">b</text>
  <!-- pair2 middle: index1 a, index2 a (green) -->
  <rect x="216" y="72" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="239" y="98" text-anchor="middle" font-size="17" fill="#2a4a1a" font-weight="bold">a</text>
  <rect x="262" y="72" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="285" y="98" text-anchor="middle" font-size="17" fill="#2a4a1a" font-weight="bold">a</text>
  <rect x="308" y="72" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="331" y="98" text-anchor="middle" font-size="17" fill="#335" font-weight="bold">b</text>

  <!-- index labels -->
  <text x="193" y="124" text-anchor="middle" font-size="9.5" fill="#aaa">配对1</text>
  <text x="239" y="124" text-anchor="middle" font-size="9.5" fill="#aaa">配对2</text>
  <text x="285" y="124" text-anchor="middle" font-size="9.5" fill="#aaa">配对2</text>
  <text x="331" y="124" text-anchor="middle" font-size="9.5" fill="#aaa">配对1</text>

  <!-- outer pair arc (b ... b) -->
  <path d="M 193 68 C 193 40, 331 40, 331 68" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="262" y="40" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">外层配对 c₁ = b</text>

  <!-- inner pair arc (a ... a) -->
  <path d="M 239 68 C 239 52, 285 52, 285 68" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="262" y="150" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">中间配对 c₂ = a（天然相等，唯一允许）</text>

  <!-- constraint note -->
  <rect x="120" y="168" width="320" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="183" text-anchor="middle" font-size="11" fill="#666">约束：c₁ ≠ c₂（相邻配对字符必须不同）</text>
  <text x="280" y="197" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">b ≠ a ✓ ｜ 中间 a = a（回文天然相等，豁免）</text>

  <!-- divider -->
  <path d="M 40 218 L 520 218" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Bad examples ===== -->
  <text x="280" y="240" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">反例：不满足条件</text>

  <!-- bad1: bbbb (consecutive equal non-middle) -->
  <text x="120" y="272" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold">"bbbb"</text>
  <rect x="135" y="258" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="152" y="278" text-anchor="middle" font-size="14" fill="#7a3030" font-weight="bold">b</text>
  <rect x="169" y="258" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="186" y="278" text-anchor="middle" font-size="14" fill="#7a3030" font-weight="bold">b</text>
  <rect x="203" y="258" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="220" y="278" text-anchor="middle" font-size="14" fill="#7a3030" font-weight="bold">b</text>
  <rect x="237" y="258" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="254" y="278" text-anchor="middle" font-size="14" fill="#7a3030" font-weight="bold">b</text>
  <text x="285" y="276" font-size="10.5" fill="#b85450">非中间位置 b=b ✗</text>

  <!-- bad2: bcb (odd length) -->
  <text x="120" y="322" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold">"bcb"</text>
  <rect x="135" y="308" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="152" y="328" text-anchor="middle" font-size="14" fill="#7a3030" font-weight="bold">b</text>
  <rect x="169" y="308" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="186" y="328" text-anchor="middle" font-size="14" fill="#7a3030" font-weight="bold">c</text>
  <rect x="203" y="308" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="220" y="328" text-anchor="middle" font-size="14" fill="#7a3030" font-weight="bold">b</text>
  <text x="250" y="326" font-size="10.5" fill="#b85450">长度为奇数 ✗（无法配对）</text>

  <!-- bottom insight -->
  <rect x="40" y="346" width="480" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="364" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">关键：偶长回文由「同字符对」嵌套而成 → 只需让相邻配对的字符不同</text>
</svg>
