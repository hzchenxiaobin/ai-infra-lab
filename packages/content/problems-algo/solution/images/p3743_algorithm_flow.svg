<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="14.5" fill="#333" filter="url(#rough2)">算法流程：三窗口 DP —— 状态 =（选点数 j ≤ 2k，平衡档 b）</text>

  <rect x="118" y="30" width="284" height="28" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="48" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">枚举平衡窗口（z = 平衡 0 的档位）：[0,2]、[−1,1]、[−2,0]</text>
  <path d="M 260 58 L 260 66" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="118" y="68" width="284" height="26" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="85" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">初始化 dp[z][0] = 0，其余 −∞（z 档对应平衡 0）</text>
  <path d="M 260 94 L 260 102" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="24" y="104" width="472" height="132" rx="10" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="260" y="122" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">逐元素 v = nums[i]（i = 0 … n−1）；j 从 2k−1 逆序枚举（0/1 背包式滚动）</text>

  <rect x="38" y="136" width="112" height="78" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="94" y="162" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">当前元素 v</text>
  <text x="94" y="178" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">三选一</text>
  <text x="94" y="194" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">（每元素至多选一次）</text>

  <rect x="170" y="132" width="308" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="324" y="149" text-anchor="middle" font-size="9.8" fill="#446688" filter="url(#rough2)">① 跳过：状态原样保留（dp 不动）</text>

  <rect x="170" y="166" width="308" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="324" y="183" text-anchor="middle" font-size="9.8" fill="#4a7a3a" filter="url(#rough2)">② 选作段内最大：dp[b+1][j+1] ← dp[b][j] + v（b+1 出窗即禁止）</text>

  <rect x="170" y="200" width="308" height="26" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="324" y="217" text-anchor="middle" font-size="9.8" fill="#b85450" filter="url(#rough2)">③ 选作段内最小：dp[b−1][j+1] ← dp[b][j] − v（b−1 出窗即禁止）</text>

  <path d="M 150 160 C 160 152, 162 146, 168 145" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 150 175 L 168 179" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 150 190 C 160 198, 162 204, 168 213" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <path d="M 260 236 L 260 244" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="118" y="246" width="284" height="28" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="264" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">结算本窗口：ans_z = max dp[z][j]（0 ≤ j ≤ 2k，平衡归 0）</text>
  <path d="M 260 274 L 260 282" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="118" y="284" width="284" height="28" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="260" y="302" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">返回 max(ans_z=0, ans_z=1, ans_z=2)</text>

  <text x="260" y="330" text-anchor="middle" font-size="9.3" fill="#666" filter="url(#rough2)">时间 O(3 × n × 2k × 3) ≈ 1.8×10⁷（n = k = 1000）；空间 O(k)</text>
  <text x="260" y="348" text-anchor="middle" font-size="9.3" fill="#666" filter="url(#rough2)">答案上界 ≈ 5×10¹¹ ⇒ 必须 long long；j 逆序枚举保证每元素至多选一次</text>
</svg>
