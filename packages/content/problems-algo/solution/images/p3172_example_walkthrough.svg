<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：3 个配对逐一判定，命中 2 个</text>

  <!-- table header -->
  <rect x="14" y="40" width="58" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="43" y="55" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">email_id</text>
  <rect x="72" y="40" width="108" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="126" y="55" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">signup_date</text>
  <rect x="180" y="40" width="108" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="234" y="55" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">action_date</text>
  <rect x="288" y="40" width="62" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="319" y="55" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">日历差</text>
  <rect x="350" y="40" width="92" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="396" y="55" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">signup_action</text>
  <rect x="442" y="40" width="64" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="474" y="55" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">判定</text>

  <!-- row 1: 125 -->
  <rect x="14" y="62" width="58" height="32" fill="#e6f4ea" stroke="#8aa4c0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="43" y="82" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">125</text>
  <rect x="72" y="62" width="108" height="32" fill="#e6f4ea" stroke="#8aa4c0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="126" y="82" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">06-14 09:30</text>
  <rect x="180" y="62" width="108" height="32" fill="#e6f4ea" stroke="#8aa4c0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="234" y="82" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">06-15 08:30</text>
  <rect x="288" y="62" width="62" height="32" fill="#e6f4ea" stroke="#8aa4c0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="319" y="82" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1 ✓</text>
  <rect x="350" y="62" width="92" height="32" fill="#e6f4ea" stroke="#8aa4c0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="396" y="82" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">Verified ✓</text>
  <rect x="442" y="62" width="64" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="474" y="82" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">7771 ✓</text>

  <!-- row 2: 433 -->
  <rect x="14" y="94" width="58" height="32" fill="#fce4ec" stroke="#d0a0a0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="43" y="114" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">433</text>
  <rect x="72" y="94" width="108" height="32" fill="#fce4ec" stroke="#d0a0a0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="126" y="114" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">07-09 08:15</text>
  <rect x="180" y="94" width="108" height="32" fill="#fce4ec" stroke="#d0a0a0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="234" y="114" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">07-10 10:45</text>
  <rect x="288" y="94" width="62" height="32" fill="#fce4ec" stroke="#d0a0a0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="319" y="114" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1 ✓</text>
  <rect x="350" y="94" width="92" height="32" fill="#fce4ec" stroke="#d0a0a0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="396" y="114" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">Not Verified ✗</text>
  <rect x="442" y="94" width="64" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="474" y="114" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">剔除</text>

  <!-- row 3: 234 -->
  <rect x="14" y="126" width="58" height="32" fill="#e6f4ea" stroke="#8aa4c0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="43" y="146" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">234</text>
  <rect x="72" y="126" width="108" height="32" fill="#e6f4ea" stroke="#8aa4c0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="126" y="146" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">08-20 10:00</text>
  <rect x="180" y="126" width="108" height="32" fill="#e6f4ea" stroke="#8aa4c0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="234" y="146" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">08-21 09:30</text>
  <rect x="288" y="126" width="62" height="32" fill="#e6f4ea" stroke="#8aa4c0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="319" y="146" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1 ✓</text>
  <rect x="350" y="126" width="92" height="32" fill="#e6f4ea" stroke="#8aa4c0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="396" y="146" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">Verified ✓</text>
  <rect x="442" y="126" width="64" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="474" y="146" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">7005 ✓</text>

  <text x="260" y="172" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">流逝时长：23 h、26.5 h、23.5 h —— 125 / 234 不足 24 h，全靠「日历差 = 1」口径命中</text>

  <!-- result boxes -->
  <rect x="14" y="188" width="240" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="134" y="210" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">命中 2 行：user 7771、user 7005</text>
  <text x="134" y="230" text-anchor="middle" font-size="9.5" fill="#5a8a4a" filter="url(#rough2)">DISTINCT 去重 → 一用户一行</text>

  <rect x="266" y="188" width="240" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="386" y="210" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">ORDER BY user_id ASC</text>
  <text x="386" y="230" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">输出 user_id ∈ {7005, 7771}</text>

  <!-- warning box -->
  <rect x="14" y="262" width="492" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="282" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">⚠ 两个陷阱（官方样本都卡了）</text>
  <text x="260" y="300" text-anchor="middle" font-size="9.5" fill="#8a6d3b" filter="url(#rough2)">① 433 日历差 = 1 但 Not Verified → 剔除；漏写枚举过滤就会多输出 1052</text>
  <text x="260" y="316" text-anchor="middle" font-size="9.5" fill="#8a6d3b" filter="url(#rough2)">② 125 / 234 不足 24 小时仍命中；误用「满 24 小时」口径会全部漏掉</text>

  <text x="260" y="348" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">「日历差 = 1」与「Verified」两个谓词 AND，缺一不可</text>
</svg>
