<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    核心思想：0/1 标记 + 前缀和 → 区间计数 O(1)
  </text>

  <!-- b[] row: 6 cells, values 1,0,1,1,0,1 -->
  <text x="18" y="86" font-size="13" fill="#4a7a3a" filter="url(#rough2)">b[]</text>
  <!-- cell i center = 95 + i*56 ; x = 70 + i*56, width 50 -->
  <g font-size="13" fill="#333">
    <!-- b0 = 1 (green) -->
    <rect x="70"  y="66" width="50" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="95"  y="90" text-anchor="middle" filter="url(#rough2)">1</text>
    <!-- b1 = 0 (gray) -->
    <rect x="126" y="66" width="50" height="38" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="151" y="90" text-anchor="middle" fill="#888" filter="url(#rough2)">0</text>
    <!-- b2 = 1 -->
    <rect x="182" y="66" width="50" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="207" y="90" text-anchor="middle" filter="url(#rough2)">1</text>
    <!-- b3 = 1 -->
    <rect x="238" y="66" width="50" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="263" y="90" text-anchor="middle" filter="url(#rough2)">1</text>
    <!-- b4 = 0 -->
    <rect x="294" y="66" width="50" height="38" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="319" y="90" text-anchor="middle" fill="#888" filter="url(#rough2)">0</text>
    <!-- b5 = 1 -->
    <rect x="350" y="66" width="50" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="375" y="90" text-anchor="middle" filter="url(#rough2)">1</text>
  </g>
  <text x="408" y="90" font-size="12" fill="#888" filter="url(#rough2)">（每个字符串首尾是否皆元音）</text>

  <!-- query bracket over b[1..4] : x from 126 to 344 -->
  <path d="M126,60 L126,54 L344,54 L344,60" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="235" y="46" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">查询 [l, r] = [1, 4]</text>

  <!-- pre[] row: 7 cells. pre[i] center = 67 + i*56 ; x = 42 + i*56, width 50 -->
  <text x="18" y="186" font-size="13" fill="#446688" filter="url(#rough2)">pre[]</text>
  <g font-size="13" fill="#333">
    <!-- pre0 = 0 -->
    <rect x="42"  y="166" width="50" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="67"  y="190" text-anchor="middle" filter="url(#rough2)">0</text>
    <!-- pre1 = 1  (highlighted = pre[l]) -->
    <rect x="98"  y="166" width="50" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
    <text x="123" y="190" text-anchor="middle" filter="url(#rough2)">1</text>
    <!-- pre2 = 1 -->
    <rect x="154" y="166" width="50" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="179" y="190" text-anchor="middle" filter="url(#rough2)">1</text>
    <!-- pre3 = 2 -->
    <rect x="210" y="166" width="50" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="235" y="190" text-anchor="middle" filter="url(#rough2)">2</text>
    <!-- pre4 = 3 -->
    <rect x="266" y="166" width="50" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="291" y="190" text-anchor="middle" filter="url(#rough2)">3</text>
    <!-- pre5 = 3  (highlighted = pre[r+1]) -->
    <rect x="322" y="166" width="50" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
    <text x="347" y="190" text-anchor="middle" filter="url(#rough2)">3</text>
    <!-- pre6 = 4 -->
    <rect x="378" y="166" width="50" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="403" y="190" text-anchor="middle" filter="url(#rough2)">4</text>
  </g>
  <text x="98"  y="158" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">pre[l]</text>
  <text x="347" y="158" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">pre[r+1]</text>

  <!-- arrows from pre[1] and pre[5] down to formula box -->
  <path d="M123,210 C123,240 150,250 165,262" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M347,210 C347,240 360,250 370,262" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- formula box -->
  <rect x="95" y="262" width="330" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="285" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    ans = pre[r+1] − pre[l]
  </text>
  <text x="260" y="306" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">
    = pre[5] − pre[1] = 3 − 1 = 2
  </text>

  <text x="260" y="344" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">
    区间内 1 的个数 = 两个前缀端点之差
  </text>
</svg>
