<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：n=15 → exponents=[0,1,2,3] → 前缀和 → 三次查询</text>

  <!-- ===== exponents row ===== -->
  <text x="270" y="48" text-anchor="middle" font-size="11" fill="#888">exponents（n 的置位 bit 位 k，升序）</text>
  <rect x="166" y="54" width="46" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="189" y="73" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">0</text>
  <rect x="220" y="54" width="46" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="243" y="73" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">1</text>
  <rect x="274" y="54" width="46" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="297" y="73" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">2</text>
  <rect x="328" y="54" width="46" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="351" y="73" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">3</text>

  <!-- arrow down -->
  <line x1="270" y1="84" x2="270" y2="100" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== pref table ===== -->
  <text x="270" y="116" text-anchor="middle" font-size="11" fill="#888">前缀和 pref[i+1]=pref[i]+e_i，  pref = [0, 0, 1, 3, 6]</text>
  <!-- index labels -->
  <text x="143" y="140" text-anchor="middle" font-size="10" fill="#888">下标</text>
  <text x="195" y="140" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="247" y="140" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="299" y="140" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="351" y="140" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="403" y="140" text-anchor="middle" font-size="10" fill="#888">4</text>
  <!-- value cells -->
  <rect x="120" y="146" width="46" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="143" y="164" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">pref</text>
  <rect x="172" y="146" width="46" height="26" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="195" y="164" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="224" y="146" width="46" height="26" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="247" y="164" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="276" y="146" width="46" height="26" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="299" y="164" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="328" y="146" width="46" height="26" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="351" y="164" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="380" y="146" width="46" height="26" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="403" y="164" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>

  <!-- arrow down -->
  <line x1="270" y1="176" x2="270" y2="192" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== query rows ===== -->
  <!-- Row1 -->
  <rect x="36" y="196" width="410" height="30" fill="#f4f7fb" stroke="#888" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="48" y="215" font-size="11.5" fill="#333" font-weight="bold">Q[0,1]: s=pref[2]−pref[0]=1−0=1</text>
  <text x="320" y="215" font-size="11.5" fill="#4a7a3a" font-weight="bold">→  2¹ =</text>
  <rect x="396" y="200" width="46" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="419" y="215" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- Row2 -->
  <rect x="36" y="232" width="410" height="30" fill="#f4f7fb" stroke="#888" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="48" y="251" font-size="11.5" fill="#333" font-weight="bold">Q[2,2]: s=pref[3]−pref[2]=3−1=2</text>
  <text x="320" y="251" font-size="11.5" fill="#4a7a3a" font-weight="bold">→  2² =</text>
  <rect x="396" y="236" width="46" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="419" y="251" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4</text>

  <!-- Row3 -->
  <rect x="36" y="268" width="410" height="30" fill="#f4f7fb" stroke="#888" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="48" y="287" font-size="11.5" fill="#333" font-weight="bold">Q[0,3]: s=pref[4]−pref[0]=6−0=6</text>
  <text x="320" y="287" font-size="11.5" fill="#4a7a3a" font-weight="bold">→  2⁶ =</text>
  <rect x="396" y="272" width="46" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="419" y="287" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">64</text>

  <!-- ===== answers ===== -->
  <line x1="270" y1="302" x2="270" y2="318" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="160" y="322" width="220" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="346" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">answers = [2, 4, 64]</text>
</svg>
