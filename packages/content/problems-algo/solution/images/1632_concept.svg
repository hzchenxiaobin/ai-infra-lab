<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M6,0 L9,3 L6,6" fill="none" stroke="#d6a040" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：等值格子把所在行与列连成同一连通分量 → 同分量共享一个秩</text>

  <!-- Left: matrix [[2,2,5],[3,2,4]] -->
  <text x="95" y="68" text-anchor="middle" font-size="11" fill="#888">matrix</text>
  <!-- row 0 -->
  <rect x="40" y="80" width="50" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="65" y="108" text-anchor="middle" font-size="18" fill="#333" font-family="monospace" font-weight="bold">2</text>
  <rect x="90" y="80" width="50" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="115" y="108" text-anchor="middle" font-size="18" fill="#333" font-family="monospace" font-weight="bold">2</text>
  <rect x="140" y="80" width="50" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="165" y="108" text-anchor="middle" font-size="18" fill="#333" font-family="monospace">5</text>
  <!-- row 1 -->
  <rect x="40" y="124" width="50" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="65" y="152" text-anchor="middle" font-size="18" fill="#333" font-family="monospace">3</text>
  <rect x="90" y="124" width="50" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="115" y="152" text-anchor="middle" font-size="18" fill="#333" font-family="monospace" font-weight="bold">2</text>
  <rect x="140" y="124" width="50" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="165" y="152" text-anchor="middle" font-size="18" fill="#333" font-family="monospace">4</text>

  <text x="115" y="192" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">三个 2 高亮</text>

  <!-- Right: bipartite graph -->
  <text x="400" y="68" text-anchor="middle" font-size="11" fill="#888">行/列二分图并查集</text>

  <!-- Row nodes -->
  <ellipse cx="270" cy="120" rx="26" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="125" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">R0</text>
  <ellipse cx="270" cy="240" rx="26" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="245" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">R1</text>

  <!-- Column nodes -->
  <ellipse cx="510" cy="95" rx="26" ry="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="510" y="100" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">C0</text>
  <ellipse cx="510" cy="180" rx="26" ry="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="510" y="185" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">C1</text>
  <ellipse cx="510" cy="300" rx="26" ry="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="510" y="305" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">C2</text>

  <!-- Edges for value 2 (highlighted orange) -->
  <path d="M 296 120 L 484 100" stroke="#d6a040" stroke-width="2.4" fill="none" filter="url(#rough2)"/>
  <path d="M 296 122 L 484 175" stroke="#d6a040" stroke-width="2.4" fill="none" filter="url(#rough2)"/>
  <path d="M 296 238 L 484 182" stroke="#d6a040" stroke-width="2.4" fill="none" filter="url(#rough2)"/>
  <text x="395" y="100" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">v=2</text>

  <!-- Edges for other values (faint gray, dashed) -->
  <path d="M 296 242 L 484 98" stroke="#aaa" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <text x="375" y="160" font-size="9" fill="#888">v=3</text>
  <path d="M 296 246 L 484 298" stroke="#aaa" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <text x="375" y="285" font-size="9" fill="#888">v=4</text>
  <path d="M 296 126 L 484 300" stroke="#aaa" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <text x="430" y="225" font-size="9" fill="#888">v=5</text>

  <!-- Component highlight ring around R0,R1,C0,C1 -->
  <ellipse cx="390" cy="160" rx="135" ry="78" fill="none" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <text x="390" y="58" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">同连通分量 → 同秩</text>

  <!-- Bottom: rank formula box -->
  <rect x="40" y="300" width="500" height="78" fill="#f0f7ff" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="324" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">分量秩 = 1 + max over (i,j)∈comp { max( rowMax[i], colMax[j] ) }</text>
  <text x="290" y="346" text-anchor="middle" font-size="10.5" fill="#888">值 2 的分量：max(rowMax[0],rowMax[1],colMax[0],colMax[1])=max(0,0,0,0)=0 → 秩 1</text>
  <text x="290" y="364" text-anchor="middle" font-size="10.5" fill="#888">同秩约束只在等值格子间成立 → 每个值组独立重置并查集</text>
</svg>
