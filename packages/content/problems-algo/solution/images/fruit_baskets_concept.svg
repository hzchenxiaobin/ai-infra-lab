<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">滑动窗口：维护至多 2 种水果的区间 [left, right]（两个篮子）</text>

  <!-- index labels -->
  <text x="40" y="64" font-size="10" fill="#888">下标:</text>
  <text x="92" y="64" font-size="10" fill="#888" font-weight="bold">0</text>
  <text x="132" y="64" font-size="10" fill="#888" font-weight="bold">1</text>
  <text x="172" y="64" font-size="10" fill="#888" font-weight="bold">2</text>
  <text x="212" y="64" font-size="10" fill="#888" font-weight="bold">3</text>
  <text x="252" y="64" font-size="10" fill="#888" font-weight="bold">4</text>
  <text x="292" y="64" font-size="10" fill="#888" font-weight="bold">5</text>
  <text x="332" y="64" font-size="10" fill="#888" font-weight="bold">6</text>
  <text x="372" y="64" font-size="10" fill="#888" font-weight="bold">7</text>
  <text x="412" y="64" font-size="10" fill="#888" font-weight="bold">8</text>
  <text x="452" y="64" font-size="10" fill="#888" font-weight="bold">9</text>
  <text x="492" y="64" font-size="10" fill="#888" font-weight="bold">10</text>

  <!-- fruits cells: [3,3,3,1,2,1,1,2,3,3,4] -->
  <!-- 3 (outside, will be removed) -->
  <rect x="78" y="70" width="34" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="95" y="91" text-anchor="middle" font-size="13" fill="#999" font-weight="bold">3</text>
  <rect x="118" y="70" width="34" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="135" y="91" text-anchor="middle" font-size="13" fill="#999" font-weight="bold">3</text>
  <rect x="158" y="70" width="34" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="175" y="91" text-anchor="middle" font-size="13" fill="#999" font-weight="bold">3</text>
  <!-- window [1,2,1,1,2] indices 3-7, highlighted -->
  <rect x="198" y="70" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="215" y="91" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="238" y="70" width="34" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="91" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="278" y="70" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="295" y="91" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="318" y="70" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="335" y="91" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="358" y="70" width="34" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="375" y="91" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <!-- right hits 3 (third type!) -->
  <rect x="398" y="70" width="34" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="415" y="91" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <!-- remaining -->
  <rect x="438" y="70" width="34" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="455" y="91" text-anchor="middle" font-size="13" fill="#999" font-weight="bold">3</text>
  <rect x="478" y="70" width="34" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="495" y="91" text-anchor="middle" font-size="13" fill="#999" font-weight="bold">4</text>

  <!-- window bracket -->
  <path d="M 198 114 Q 198 122 204 122 L 386 122 Q 392 122 392 114" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="295" y="138" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">窗口 = [1,2,1,1,2]（2 种水果，max = 5）</text>

  <!-- right pointer hits 3 (third type) -->
  <text x="415" y="60" text-anchor="middle" font-size="10" fill="#b85450">right → 第三种!</text>
  <path d="M 415 62 L 415 68" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- Two baskets -->
  <text x="40" y="170" font-size="12" fill="#888">两个篮子:</text>

  <!-- Basket A (type 1, blue) -->
  <rect x="110" y="158" width="80" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="150" y="176" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">篮子 A</text>
  <text x="150" y="194" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">种类 1 ×3</text>

  <!-- Basket B (type 2, green) -->
  <rect x="210" y="158" width="80" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="250" y="176" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">篮子 B</text>
  <text x="250" y="194" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">种类 2 ×2</text>

  <!-- third type 3 has no basket -->
  <rect x="320" y="158" width="80" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="360" y="176" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">种类 3</text>
  <text x="360" y="194" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">无篮可装!</text>

  <!-- arrow from third type to shrink -->
  <text x="290" y="224" text-anchor="middle" font-size="11" fill="#d6a040">↓ 种类 > 2，收缩 left 直到踢出一种</text>

  <!-- after shrink: window becomes [2,3] -->
  <text x="40" y="262" font-size="12" fill="#888">收缩后:</text>
  <!-- show [2,3] at indices 7-8 -->
  <rect x="198" y="246" width="34" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="215" y="267" text-anchor="middle" font-size="13" fill="#999" font-weight="bold">1</text>
  <rect x="358" y="246" width="34" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="375" y="267" text-anchor="middle" font-size="13" fill="#999" font-weight="bold">2</text>
  <rect x="398" y="246" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="415" y="267" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <!-- new window [2,3] -->
  <path d="M 358 290 Q 358 298 364 298 L 426 298 Q 432 298 432 290" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="395" y="314" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">新窗口 [2,3]</text>

  <!-- Core idea box -->
  <rect x="50" y="332" width="480" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="350" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">核心：两个篮子 = 至多 2 种水果的滑窗；第三种出现即收缩 left</text>
  <text x="290" y="366" text-anchor="middle" font-size="11" fill="#888">答案 = 窗口最大宽度 max(right − left + 1)</text>
</svg>
