<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：dup 计数器——「多余副本」清零即互不相同</text>

  <!-- 数组 -->
  <text x="62" y="64" font-size="13" fill="#333" filter="url(#rough2)">nums =</text>

  <rect x="130" y="38" width="46" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="182" y="38" width="46" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="234" y="38" width="46" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="286" y="38" width="46" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="338" y="38" width="46" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="390" y="38" width="46" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <text x="153" y="65" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <text x="205" y="65" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">8</text>
  <text x="257" y="65" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <text x="309" y="65" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">6</text>
  <text x="361" y="65" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">5</text>
  <text x="413" y="65" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">8</text>

  <!-- 删除斜线贯穿前 3 格 -->
  <path d="M 134 74 L 278 44" stroke="#b85450" stroke-width="2.5" fill="none" filter="url(#rough2)"/>

  <!-- 下标 -->
  <text x="153" y="93" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="205" y="93" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="257" y="93" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="309" y="93" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="361" y="93" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4</text>
  <text x="413" y="93" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">5</text>

  <!-- 标注 -->
  <text x="205" y="112" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">一次操作删掉 ↑</text>
  <text x="361" y="112" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">剩余 [6,5,8] 互不相同 ✓</text>

  <!-- 频次表 / dup -->
  <rect x="55" y="122" width="215" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="162" y="141" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">初始频次：3→2　8→2　6→1　5→1</text>
  <text x="162" y="161" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">不同值 m = 4</text>

  <rect x="290" y="122" width="175" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="377" y="141" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">dup = 6 − 4 = 2</text>
  <text x="377" y="161" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">3、8 各多 1 份副本</text>

  <text x="260" y="190" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">删掉前三个，逐个结算频次：</text>

  <!-- 演算三行 -->
  <rect x="70" y="198" width="380" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="215" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">① 删 3 → freq 2→1（仍剩 ⇒ 副本）dup 2→1</text>

  <rect x="70" y="232" width="380" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="249" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">② 删 8 → freq 2→1（仍剩 ⇒ 副本）dup 1→0 ✓</text>

  <rect x="70" y="266" width="380" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="283" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">③ 删 3 → freq 1→0（清零 ⇒ 最后一份）dup 不变</text>

  <!-- 结论框 -->
  <rect x="55" y="302" width="410" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="321" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">dup = 0 ⟺ 剩余互不相同　　i ≥ n ⟺ 数组为空</text>
  <text x="260" y="341" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">if (--freq[v] &gt; 0) dup--;  ← 删完仍剩 ⇒ 删的是副本</text>
</svg>
