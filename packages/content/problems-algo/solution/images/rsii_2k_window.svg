<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：每 2k 字符一段，只反转前 k 个</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">s = "abcdefg"，k = 2 → 2k = 4，按 4 字符切块</text>

  <!-- 原始串 -->
  <text x="40" y="74" font-size="12" fill="#888">原始:</text>
  <rect x="90" y="58" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="78" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="132" y="58" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="78" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="174" y="58" width="40" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="194" y="78" text-anchor="middle" font-size="13" fill="#999">c</text>
  <rect x="216" y="58" width="40" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="236" y="78" text-anchor="middle" font-size="13" fill="#999">d</text>
  <rect x="258" y="58" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="278" y="78" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">e</text>
  <rect x="300" y="58" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="78" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">f</text>
  <rect x="342" y="58" width="40" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="362" y="78" text-anchor="middle" font-size="13" fill="#999">g</text>

  <!-- 第一段括号 -->
  <path d="M 90 100 Q 90 108 96 108 L 252 108 Q 258 108 258 100" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="174" y="124" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">第 1 段 = 2k = 4 字符</text>

  <!-- 第二段括号 -->
  <path d="M 258 100 Q 258 108 264 108 L 380 108 Q 386 108 386 100" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="322" y="124" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">第 2 段 &lt; 2k 但 ≥ k</text>

  <!-- 箭头：反转前 k 个 -->
  <text x="280" y="150" text-anchor="middle" font-size="11" fill="#b85450">↓ 各段只反转前 k=2 个字符</text>

  <!-- 结果串 -->
  <text x="40" y="180" font-size="12" fill="#888">结果:</text>
  <rect x="90" y="164" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="110" y="184" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="132" y="164" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="152" y="184" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="174" y="164" width="40" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="194" y="184" text-anchor="middle" font-size="13" fill="#999">c</text>
  <rect x="216" y="164" width="40" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="236" y="184" text-anchor="middle" font-size="13" fill="#999">d</text>
  <rect x="258" y="164" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="278" y="184" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">f</text>
  <rect x="300" y="164" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="320" y="184" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">e</text>
  <rect x="342" y="164" width="40" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="362" y="184" text-anchor="middle" font-size="13" fill="#999">g</text>

  <text x="280" y="214" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">输出："bacdfeg"</text>

  <!-- 三种情况说明 -->
  <text x="280" y="244" text-anchor="middle" font-size="12" fill="#666" font-weight="bold">每段起始下标 i，剩余 r = n − i，三种情况：</text>

  <rect x="20" y="258" width="170" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="105" y="278" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">情况 ① r ≥ 2k</text>
  <text x="105" y="296" text-anchor="middle" font-size="10" fill="#555">反转 s[i..i+k-1]</text>
  <text x="105" y="312" text-anchor="middle" font-size="10" fill="#555">留 s[i+k..i+2k-1]</text>
  <text x="105" y="332" text-anchor="middle" font-size="10" fill="#888">i ← i + 2k</text>
  <text x="105" y="350" text-anchor="middle" font-size="9" fill="#888">例：abcd, k=2</text>

  <rect x="195" y="258" width="170" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="278" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">情况 ② k ≤ r &lt; 2k</text>
  <text x="280" y="296" text-anchor="middle" font-size="10" fill="#555">反转 s[i..i+k-1]</text>
  <text x="280" y="312" text-anchor="middle" font-size="10" fill="#555">留 s[i+k..n-1]</text>
  <text x="280" y="332" text-anchor="middle" font-size="10" fill="#888">i ← i + 2k（结束）</text>
  <text x="280" y="350" text-anchor="middle" font-size="9" fill="#888">例：efg, k=2</text>

  <rect x="370" y="258" width="170" height="100" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="455" y="278" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">情况 ③ r &lt; k</text>
  <text x="455" y="296" text-anchor="middle" font-size="10" fill="#555">反转 s[i..n-1]</text>
  <text x="455" y="312" text-anchor="middle" font-size="10" fill="#555">（全部反转）</text>
  <text x="455" y="332" text-anchor="middle" font-size="10" fill="#888">i ← i + 2k（结束）</text>
  <text x="455" y="350" text-anchor="middle" font-size="9" fill="#888">例：abcd, k=8</text>
</svg>
