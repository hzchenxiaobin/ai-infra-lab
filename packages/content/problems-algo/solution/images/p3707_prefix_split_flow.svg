<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#4a7a3a" stroke-width="1.6"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#b85450" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="17" fill="#333"
        filter="url(#rough2)">算法流程：先求总和，再滚前缀和查 2×pre = total</text>

  <!-- ① 求 total -->
  <rect x="60" y="42" width="270" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="195" y="65" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">① 一遍扫描求总分 total</text>

  <path d="M 195 78 L 195 94" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② 初始化 -->
  <rect x="60" y="98" width="270" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="195" y="121" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">② 初始化 pre = 0，i = 0</text>

  <path d="M 195 134 L 195 150" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ 循环条件：还有拆分点？ -->
  <polygon points="195,152 285,188 195,224 105,188" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="195" y="184" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">i ≤ n − 2 ？</text>
  <text x="195" y="200" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">(保证右侧非空)</text>

  <!-- 否 → return false -->
  <path d="M 285 188 L 368 188" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="300" y="180" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="372" y="170" width="134" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="439" y="188" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">return false</text>
  <text x="439" y="202" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">试遍拆分点仍无相等</text>

  <!-- 是 → 累积前缀和 -->
  <path d="M 195 224 L 195 242" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="203" y="238" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="60" y="246" width="270" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="195" y="269" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">③ pre += score(s[i])，i++</text>

  <path d="M 195 282 L 195 296" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ④ 判定：2×pre = total？ -->
  <polygon points="195,298 270,324 195,350 120,324" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="195" y="329" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">2 × pre = total ？</text>

  <!-- 是 → return true -->
  <path d="M 270 324 L 330 324" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="284" y="316" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="334" y="306" width="172" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="420" y="324" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return true</text>
  <text x="420" y="338" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">前缀和恰好是总分一半</text>

  <!-- 否 → 回到 ③ 判定循环条件 -->
  <path d="M 120 324 L 34 324 L 34 188 L 101 188" stroke="#446688" stroke-width="1.3" stroke-dasharray="6 4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="46" y="316" font-size="10.5" fill="#446688" filter="url(#rough2)">否</text>
  <text x="22" y="262" transform="rotate(-90 22 262)" font-size="10" fill="#446688" filter="url(#rough2)">换下一个拆分点</text>

  <!-- 小贴士框 -->
  <rect x="356" y="228" width="150" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10" fill="#d6a040" text-anchor="middle">
    <text x="431" y="246" font-weight="bold">两个快速剪枝：</text>
    <text x="431" y="262">total 为奇数 ⇒ 直接 false</text>
    <text x="431" y="278">2×pre &gt; total ⇒ 提前退出</text>
  </g>

  <text x="195" y="360" text-anchor="middle" font-size="10.5" fill="#446688"
        filter="url(#rough2)">两遍线性扫描：O(n) 时间 / O(1) 空间，n ≤ 100 秒过</text>
</svg>
