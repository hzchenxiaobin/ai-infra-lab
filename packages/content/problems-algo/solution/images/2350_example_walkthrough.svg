<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：rolls = [4,2,1,2,3,3,2,4,1]，k = 4</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888">seen 为当前阶段已收集点数；凑齐 k 个即清空并 count++</text>

  <!-- column dividers / header -->
  <rect x="30" y="74" width="510" height="30" fill="#446688" rx="4" filter="url(#rough2)"/>
  <g font-size="11" fill="#fff" font-weight="bold">
    <text x="60" y="93" text-anchor="middle">步骤</text>
    <text x="120" y="93" text-anchor="middle">r</text>
    <text x="245" y="93" text-anchor="middle">seen 集合</text>
    <text x="405" y="93" text-anchor="middle">动作</text>
    <text x="505" y="93" text-anchor="middle">count</text>
  </g>
  <!-- vertical lines -->
  <g stroke="#ccc" stroke-width="1" filter="url(#rough2)">
    <line x1="90" y1="104" x2="90" y2="430"/>
    <line x1="150" y1="104" x2="150" y2="430"/>
    <line x1="340" y1="104" x2="340" y2="430"/>
    <line x1="470" y1="104" x2="470" y2="430"/>
  </g>

  <!-- phase background bands -->
  <rect x="30" y="106" width="510" height="170" fill="#e8f0fe" opacity="0.45" filter="url(#rough2)"/>
  <rect x="30" y="276" width="510" height="154" fill="#e6f4ea" opacity="0.45" filter="url(#rough2)"/>
  <text x="44" y="120" font-size="9" fill="#446688" font-weight="bold" transform="rotate(0 44 120)">阶段1</text>
  <text x="44" y="292" font-size="9" fill="#4a7a3a" font-weight="bold" transform="rotate(0 44 292)">阶段2</text>

  <!-- row highlight for step5 & step9 (凑齐时刻) -->
  <rect x="30" y="234" width="510" height="32" fill="#fff8e1" opacity="0.8" filter="url(#rough2)"/>
  <rect x="30" y="398" width="510" height="32" fill="#fff8e1" opacity="0.8" filter="url(#rough2)"/>

  <g font-size="11" fill="#333">
    <!-- row 1 -->
    <text x="60" y="124" text-anchor="middle">1</text>
    <text x="120" y="124" text-anchor="middle" font-weight="bold">4</text>
    <text x="245" y="124" text-anchor="middle">{4}</text>
    <text x="405" y="124" text-anchor="middle">加入</text>
    <text x="505" y="124" text-anchor="middle">0</text>
    <!-- row 2 -->
    <text x="60" y="156" text-anchor="middle">2</text>
    <text x="120" y="156" text-anchor="middle" font-weight="bold">2</text>
    <text x="245" y="156" text-anchor="middle">{4, 2}</text>
    <text x="405" y="156" text-anchor="middle">加入</text>
    <text x="505" y="156" text-anchor="middle">0</text>
    <!-- row 3 -->
    <text x="60" y="188" text-anchor="middle">3</text>
    <text x="120" y="188" text-anchor="middle" font-weight="bold">1</text>
    <text x="245" y="188" text-anchor="middle">{4, 2, 1}</text>
    <text x="405" y="188" text-anchor="middle">加入</text>
    <text x="505" y="188" text-anchor="middle">0</text>
    <!-- row 4 -->
    <text x="60" y="220" text-anchor="middle">4</text>
    <text x="120" y="220" text-anchor="middle" font-weight="bold">2</text>
    <text x="245" y="220" text-anchor="middle">{4, 2, 1}</text>
    <text x="405" y="220" text-anchor="middle">已存在</text>
    <text x="505" y="220" text-anchor="middle">0</text>
    <!-- row 5 凑齐 -->
    <text x="60" y="252" text-anchor="middle" font-weight="bold">5</text>
    <text x="120" y="252" text-anchor="middle" font-weight="bold" fill="#d6a040">3</text>
    <text x="245" y="252" text-anchor="middle" fill="#d6a040" font-weight="bold">{4, 2, 1, 3}</text>
    <text x="405" y="252" text-anchor="middle" fill="#d6a040" font-weight="bold">凑齐！清空</text>
    <text x="505" y="252" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <!-- row 6 -->
    <text x="60" y="296" text-anchor="middle">6</text>
    <text x="120" y="296" text-anchor="middle" font-weight="bold">3</text>
    <text x="245" y="296" text-anchor="middle">{3}</text>
    <text x="405" y="296" text-anchor="middle">加入</text>
    <text x="505" y="296" text-anchor="middle">1</text>
    <!-- row 7 -->
    <text x="60" y="328" text-anchor="middle">7</text>
    <text x="120" y="328" text-anchor="middle" font-weight="bold">2</text>
    <text x="245" y="328" text-anchor="middle">{3, 2}</text>
    <text x="405" y="328" text-anchor="middle">加入</text>
    <text x="505" y="328" text-anchor="middle">1</text>
    <!-- row 8 -->
    <text x="60" y="360" text-anchor="middle">8</text>
    <text x="120" y="360" text-anchor="middle" font-weight="bold">4</text>
    <text x="245" y="360" text-anchor="middle">{3, 2, 4}</text>
    <text x="405" y="360" text-anchor="middle">加入</text>
    <text x="505" y="360" text-anchor="middle">1</text>
    <!-- row 9 凑齐 -->
    <text x="60" y="418" text-anchor="middle" font-weight="bold">9</text>
    <text x="120" y="418" text-anchor="middle" font-weight="bold" fill="#d6a040">1</text>
    <text x="245" y="418" text-anchor="middle" fill="#d6a040" font-weight="bold">{3, 2, 4, 1}</text>
    <text x="405" y="418" text-anchor="middle" fill="#d6a040" font-weight="bold">凑齐！清空</text>
    <text x="505" y="418" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
  </g>

  <!-- result -->
  <rect x="150" y="442" width="260" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="462" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">count = 2 ⇒ 返回 count + 1 = 3</text>
</svg>
