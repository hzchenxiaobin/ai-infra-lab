<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#82b366"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "aba" 的回溯决策树</text>

  <!-- 根节点 start=0 -->
  <rect x="250" y="44" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="310" y="66" text-anchor="middle" font-size="11" fill="#333">start=0, seen={}</text>

  <!-- 三个分支 end=0,1,2 -->
  <path d="M 280 78 L 120 110" stroke="#82b366" stroke-width="1.4" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 310 78 L 310 110" stroke="#82b366" stroke-width="1.4" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 340 78 L 500 110" stroke="#82b366" stroke-width="1.4" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <text x="180" y="96" font-size="10" fill="#82b366">"a"✓</text>
  <text x="320" y="96" font-size="10" fill="#82b366">"ab"✓</text>
  <text x="430" y="96" font-size="10" fill="#82b366">"aba"✓</text>

  <!-- 第二层 -->
  <rect x="60" y="114" width="140" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="130" y="135" text-anchor="middle" font-size="10" fill="#333">start=1, seen={a}</text>

  <rect x="250" y="114" width="140" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="320" y="135" text-anchor="middle" font-size="10" fill="#333">start=2, seen={ab}</text>

  <rect x="440" y="114" width="140" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="510" y="135" text-anchor="middle" font-size="10" fill="#333">start=3=n ✓ 1段</text>

  <!-- 从 seen={a} 分两支 -->
  <path d="M 100 146 L 70 178" stroke="#82b366" stroke-width="1.4" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 160 146 L 190 178" stroke="#82b366" stroke-width="1.4" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <text x="60" y="166" font-size="10" fill="#82b366">"b"✓</text>
  <text x="180" y="166" font-size="10" fill="#82b366">"ba"✓</text>

  <rect x="20" y="182" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="65" y="202" text-anchor="middle" font-size="9" fill="#333">start=2, {a,b}</text>

  <rect x="150" y="182" width="100" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="200" y="202" text-anchor="middle" font-size="9" fill="#333">start=3=n ✓ 2段</text>

  <!-- 从 seen={a,b} 出发 end=2: "a" 重复 -->
  <path d="M 65 212 L 65 244" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="80" y="232" font-size="10" fill="#b85450">"a"✗ 重复</text>

  <rect x="20" y="248" width="90" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="65" y="266" text-anchor="middle" font-size="9" fill="#b85450">无合法切分 → 死路</text>

  <!-- 从 seen={ab} 出发 end=2: "a" 不重复 -->
  <path d="M 320 146 L 350 178" stroke="#82b366" stroke-width="1.4" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="340" y="166" font-size="10" fill="#82b366">"a"✓</text>

  <rect x="300" y="182" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="355" y="202" text-anchor="middle" font-size="9" fill="#333">start=3=n ✓ 2段</text>

  <!-- 结论框 -->
  <rect x="100" y="310" width="420" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="334" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">结论</text>

  <text x="120" y="356" font-size="11" fill="#333">• 2 种方案达到 2 段：['a','ba']，['ab','a']</text>
  <text x="120" y="378" font-size="11" fill="#333">• 1 种方案为 1 段：['aba']</text>
  <text x="120" y="400" font-size="11" fill="#b85450">• ['a','b','a'] 因 "a" 重复 → start=2 死路</text>
  <text x="120" y="420" font-size="11" fill="#82b366" font-weight="bold">→ 最大值 = 2</text>
</svg>
