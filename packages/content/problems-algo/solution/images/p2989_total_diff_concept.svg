<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：每行先求总分，再跨行取 MAX 与 MIN，相减一步到位</text>

  <rect x="25" y="48" width="80" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="65" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">Owen</text>
  <text x="65" y="86" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">88+47+87</text>
  <text x="65" y="106" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">222</text>

  <rect x="111" y="48" width="80" height="66" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="151" y="68" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">Claire</text>
  <text x="151" y="86" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">98+95+37</text>
  <text x="151" y="106" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">230 ★</text>

  <rect x="197" y="48" width="80" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="237" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">Julian</text>
  <text x="237" y="86" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">100+64+43</text>
  <text x="237" y="106" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">207</text>

  <rect x="283" y="48" width="80" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="323" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">Peyton</text>
  <text x="323" y="86" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">60+44+47</text>
  <text x="323" y="106" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">151</text>

  <rect x="369" y="48" width="80" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="409" y="68" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">David</text>
  <text x="409" y="86" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">32+37+50</text>
  <text x="409" y="106" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">119 ★</text>

  <rect x="455" y="48" width="80" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="495" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">Camila</text>
  <text x="495" y="86" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">31+53+69</text>
  <text x="495" y="106" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">153</text>

  <text x="280" y="136" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">总分 = assignment1 + assignment2 + assignment3（行内表达式，逐行求值）</text>

  <path d="M 151 116 Q 150 145 160 168" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <path d="M 409 116 Q 410 145 400 168" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>

  <rect x="60" y="170" width="190" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="155" y="192" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">MAX(总分) = 230</text>
  <text x="155" y="212" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">最高总分（Claire）</text>

  <text x="280" y="202" text-anchor="middle" font-size="18" fill="#555" font-weight="bold" filter="url(#rough2)">−</text>

  <rect x="310" y="170" width="190" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="405" y="192" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">MIN(总分) = 119</text>
  <text x="405" y="212" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">最低总分（David）</text>

  <path d="M 155 224 Q 200 245 262 258" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <path d="M 405 224 Q 360 245 298 258" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>

  <rect x="155" y="260" width="250" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="282" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">difference_in_score</text>
  <text x="280" y="305" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">230 − 119 = 111</text>

  <rect x="40" y="326" width="480" height="28" fill="#fafafa" stroke="#d6a040" stroke-width="1" stroke-dasharray="4 3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="345" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">MAX 与 MIN 并列在同一个 SELECT：一趟扫描，两个极值同时更新</text>
</svg>
