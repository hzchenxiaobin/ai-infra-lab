<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrLoop" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="540" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">隔离病毒算法流程（每日循环）</text>

  <!-- Start -->
  <ellipse cx="280" cy="58" rx="120" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="12" fill="#333">开始: ans = 0</text>

  <path d="M 280 78 L 280 96" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 1: BFS find regions -->
  <rect x="110" y="100" width="340" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="122" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 扫描网格，BFS 找所有感染连通块</text>
  <text x="280" y="140" text-anchor="middle" font-size="11" fill="#555">每块记录: cells(感染格) / threat(威胁集) / walls(墙数)</text>

  <path d="M 280 156 L 280 174" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: any region with threat > 0? -->
  <polygon points="280,178 390,224 280,270 170,224" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="220" text-anchor="middle" font-size="12" fill="#333">存在威胁 &gt; 0</text>
  <text x="280" y="236" text-anchor="middle" font-size="11" fill="#666">的区域?</text>

  <!-- No -> end -->
  <path d="M 390 224 L 470 224" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="216" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="500" cy="224" rx="48" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="500" y="228" text-anchor="middle" font-size="12" fill="#333">返回 ans</text>

  <!-- Yes -> down -->
  <path d="M 280 270 L 280 288" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="284" font-size="11" fill="#82b366">是</text>

  <!-- Step 2: pick max threat region -->
  <rect x="110" y="292" width="340" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="314" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 选威胁集最大的块（保证唯一）</text>
  <text x="280" y="332" text-anchor="middle" font-size="11" fill="#555">ans += walls[idx]; 该块所有格标记 −1（隔离）</text>

  <path d="M 280 348 L 280 366" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: spread other regions -->
  <rect x="110" y="370" width="340" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="392" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ 其余块的威胁格全部置 1（扩散）</text>
  <text x="280" y="410" text-anchor="middle" font-size="11" fill="#555">隔离块(−1) 不参与扩散，也不再被扫描</text>

  <!-- loop back to step 1 -->
  <path d="M 110 398 L 50 398 L 50 128 L 110 128" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrLoop)" filter="url(#rough2)"/>
  <text x="42" y="264" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 42 264)">下一轮</text>

  <!-- key notes -->
  <rect x="40" y="448" width="480" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="60" y="470" font-size="11.5" fill="#444" font-weight="bold">三个易错点：</text>
  <text x="60" y="490" font-size="10.5" fill="#555">• 威胁集用 set 去重（同一未感染格被多个感染格包围只算 1 个威胁）</text>
  <text x="60" y="506" font-size="10.5" fill="#555">• 墙数不化简：每条共享边界都算 1 堵墙（与威胁集大小无关）</text>
  <text x="60" y="522" font-size="10.5" fill="#555">• 隔离用 −1 标记：既不扩散也不被重新扫描，区别于未感染(0)和感染(1)</text>
</svg>
