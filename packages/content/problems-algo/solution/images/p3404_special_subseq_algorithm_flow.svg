<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">算法流程：枚举 r，左对入表、右对查表</text>

  <!-- start box -->
  <g filter="url(#rough2)">
    <rect x="190" y="36" width="180" height="36" rx="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="59" text-anchor="middle" font-size="13" fill="#446688">ans = 0，cnt = ∅，r = 2</text>
  </g>

  <!-- decision diamond -->
  <g filter="url(#rough2)">
    <path d="M 280 82 L 350 116 L 280 150 L 210 116 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="280" y="121" text-anchor="middle" font-size="13" fill="#8a6d1a">r &lt; n ?</text>
    <text x="292" y="102" font-size="11" fill="#4a7a3a">是</text>
    <text x="356" y="106" font-size="11" fill="#b85450">否</text>
  </g>

  <!-- return box -->
  <g filter="url(#rough2)">
    <rect x="416" y="98" width="110" height="36" rx="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="471" y="121" text-anchor="middle" font-size="13" fill="#b85450">返回 ans</text>
    <path d="M 350 116 L 412 116" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  </g>

  <!-- insert box -->
  <g filter="url(#rough2)">
    <rect x="100" y="170" width="360" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="280" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d4d22">入表：q ← r − 2</text>
    <text x="280" y="212" text-anchor="middle" font-size="12" fill="#333">for p = 0 … q−2：cnt[ 约分(nums[p], nums[q]) ]++</text>
    <path d="M 280 150 L 280 166" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  </g>

  <!-- query box -->
  <g filter="url(#rough2)">
    <rect x="100" y="252" width="360" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="274" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">查表：for s = r+2 … n−1</text>
    <text x="280" y="294" text-anchor="middle" font-size="12" fill="#333">ans += cnt[ 约分(nums[s], nums[r]) ]</text>
    <path d="M 280 226 L 280 248" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  </g>

  <!-- increment box -->
  <g filter="url(#rough2)">
    <rect x="210" y="336" width="140" height="34" rx="16" fill="#f0f0f0" stroke="#999" stroke-width="1.5"/>
    <text x="280" y="358" text-anchor="middle" font-size="13" fill="#555">r ← r + 1</text>
    <path d="M 280 308 L 280 332" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  </g>

  <!-- loop back arrow -->
  <g filter="url(#rough2)">
    <path d="M 210 353 L 70 353 L 70 116 L 206 116" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arr)"/>
  </g>

  <!-- note box -->
  <g filter="url(#rough2)">
    <rect x="60" y="392" width="440" height="64" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="7,4"/>
    <text x="280" y="414" text-anchor="middle" font-size="12.5" fill="#8a6d1a">不重不漏：每个四元组的右对 (r, s) 恰被查询一次；</text>
    <text x="280" y="432" text-anchor="middle" font-size="12.5" fill="#8a6d1a">查询 r 时表中恰是全部 q ≤ r−2 的左对（q = r−2 的一批刚补入）</text>
    <text x="280" y="450" text-anchor="middle" font-size="12.5" fill="#8a6d1a">键 = (a, b) 最简分数，共约 n²/2 个左对，总时间 O(n²)</text>
  </g>
</svg>
