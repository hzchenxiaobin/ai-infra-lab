<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：词级匹配 → 按主题计数 → 取最大 → 处理并列/空</text>

  <!-- ===== Keywords table (top-left) ===== -->
  <text x="40" y="54" font-size="10" fill="#888">Keywords 表</text>
  <rect x="30" y="60" width="160" height="120" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="40" y="76" font-size="9" fill="#446688" font-weight="bold">topic_id   word</text>
  <line x1="30" y1="82" x2="190" y2="82" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="98" font-size="9" fill="#446688">1          handball</text>
  <text x="40" y="114" font-size="9" fill="#446688">1          football</text>
  <text x="40" y="130" font-size="9" fill="#d6a040" font-weight="bold">3          WAR</text>
  <text x="40" y="146" font-size="9" fill="#446688">2          Vaccine</text>

  <!-- ===== Post 3 content split into words (middle) ===== -->
  <text x="250" y="54" font-size="10" fill="#888">Post 3 内容按空格分词</text>
  <rect x="240" y="60" width="200" height="120" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="250" y="76" font-size="9" fill="#446688" font-weight="bold">"stop the war and play handball"</text>
  <line x1="240" y1="82" x2="440" y2="82" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="246" y="88" width="34" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="263" y="100" text-anchor="middle" font-size="8" fill="#4a7a3a">stop</text>
  <rect x="284" y="88" width="28" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="298" y="100" text-anchor="middle" font-size="8" fill="#4a7a3a">the</text>
  <rect x="316" y="88" width="28" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="330" y="100" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">war</text>
  <rect x="348" y="88" width="28" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="362" y="100" text-anchor="middle" font-size="8" fill="#4a7a3a">and</text>
  <rect x="380" y="88" width="28" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="394" y="100" text-anchor="middle" font-size="8" fill="#4a7a3a">play</text>
  <rect x="412" y="88" width="52" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="438" y="100" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">handball</text>

  <!-- matching arrows from keywords to words -->
  <path d="M 190 118 C 210 118, 220 96, 316 96" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)" opacity="0.7"/>
  <path d="M 190 102 C 210 102, 220 96, 412 96" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)" opacity="0.7"/>
  <path d="M 190 134 C 210 134, 220 96, 316 96" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)" opacity="0.8" stroke-dasharray="4,2"/>

  <text x="250" y="124" font-size="8" fill="#888">大小写不敏感匹配</text>
  <text x="250" y="136" font-size="8" fill="#d6a040">WAR → war ✓</text>

  <!-- ===== Counting box (bottom-left) ===== -->
  <path d="M 110 180 L 110 200" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="30" y="204" width="160" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="110" y="222" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">按 (post_id, topic_id)</text>
  <text x="110" y="236" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">COUNT 命中词数</text>
  <text x="110" y="252" text-anchor="middle" font-size="9" fill="#888">topic 1 → 1, topic 3 → 1</text>

  <!-- arrow to max -->
  <path d="M 190 234 L 220 234" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Max box ===== -->
  <rect x="224" y="204" width="120" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="284" y="222" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">取 MAX(cnt)</text>
  <text x="284" y="236" text-anchor="middle" font-size="9" fill="#888">max = 1</text>
  <text x="284" y="252" text-anchor="middle" font-size="9" fill="#b85450">两个主题并列!</text>

  <!-- arrow to result -->
  <path d="M 344 234 L 374 234" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Result box ===== -->
  <rect x="378" y="204" width="120" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="438" y="222" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">并列 → Ambiguous</text>
  <text x="438" y="236" text-anchor="middle" font-size="9" fill="#888">唯一最大 → topic_id</text>
  <text x="438" y="252" text-anchor="middle" font-size="9" fill="#888">无匹配 → No Topic</text>

  <!-- ===== Post 4: no match example ===== -->
  <text x="40" y="300" font-size="10" fill="#888">Post 4: "warning I planted ... got vaccinated"</text>
  <rect x="30" y="306" width="500" height="56" fill="#fff" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>

  <rect x="40" y="314" width="56" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="68" y="327" text-anchor="middle" font-size="8" fill="#4a7a3a">warning</text>
  <text x="100" y="327" font-size="8" fill="#b85450" font-weight="bold">≠ war</text>

  <rect x="180" y="314" width="72" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="216" y="327" text-anchor="middle" font-size="8" fill="#4a7a3a">vaccinated</text>
  <text x="258" y="327" font-size="8" fill="#b85450" font-weight="bold">≠ Vaccine</text>

  <text x="340" y="327" font-size="9" fill="#888">词级匹配：warning 是完整词，不等于 war</text>
  <text x="340" y="342" font-size="9" fill="#b85450" font-weight="bold">→ 无匹配 → "No Topic"</text>

  <!-- ===== Bottom note ===== -->
  <rect x="30" y="380" width="540" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="400" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">词级匹配（非子串）：CONCAT(' ', LOWER(content), ' ') LIKE '% word %'</text>
  <text x="300" y="416" text-anchor="middle" font-size="10" fill="#666">大小写不敏感 + 词边界（前后加空格）；warning 不匹配 war，vaccinated 不匹配 Vaccine</text>
</svg>
