<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：hasNext() 定位 + next() 读取，职责分离</text>

  <!-- ============ Left: hasNext() flow ============ -->
  <text x="135" y="44" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">hasNext()</text>

  <!-- Entry -->
  <rect x="80" y="50" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="135" y="68" text-anchor="middle" font-size="11" fill="#333">开始</text>
  <path d="M 135 76 L 135 86" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond 1: row >= n? -->
  <path d="M 135 86 L 200 110 L 135 134 L 70 110 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="135" y="114" text-anchor="middle" font-size="10" fill="#333">row &gt;= n?</text>

  <!-- Yes → return false -->
  <path d="M 200 110 L 235 110" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="212" y="102" font-size="9" fill="#b85450">是</text>
  <rect x="235" y="96" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="285" y="114" text-anchor="middle" font-size="11" fill="#333">return false</text>

  <!-- No → down to Diamond 2 -->
  <path d="M 135 134 L 135 144" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="145" y="142" font-size="9" fill="#4a7a3a">否</text>

  <!-- Diamond 2: col >= vec[row].size()? -->
  <path d="M 135 144 L 220 170 L 135 196 L 50 170 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="135" y="168" text-anchor="middle" font-size="9" fill="#333">col &gt;= vec[row]</text>
  <text x="135" y="180" text-anchor="middle" font-size="9" fill="#333">.size()?</text>

  <!-- Yes → row++; col=0 → loop back -->
  <path d="M 220 170 L 235 170" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="222" y="162" font-size="9" fill="#b85450">是</text>
  <rect x="235" y="156" width="100" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="285" y="174" text-anchor="middle" font-size="10" fill="#333">row++; col=0</text>
  <!-- Loop back arrow -->
  <path d="M 285 156 L 285 74 L 135 74 L 135 85" stroke="#d6a040" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="68" font-size="9" fill="#d6a040">↻ 循环</text>

  <!-- No → return true -->
  <path d="M 135 196 L 135 206" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="145" y="204" font-size="9" fill="#4a7a3a">否</text>
  <rect x="80" y="206" width="110" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="135" y="224" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">return true</text>

  <!-- ============ Right: next() flow ============ -->
  <text x="440" y="44" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">next()</text>

  <!-- Entry -->
  <rect x="390" y="50" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="440" y="68" text-anchor="middle" font-size="11" fill="#333">开始</text>
  <path d="M 440 76 L 440 88" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Call hasNext() -->
  <rect x="370" y="88" width="140" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="440" y="106" text-anchor="middle" font-size="11" fill="#333">调用 hasNext()</text>
  <path d="M 440 116 L 440 128" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Read val -->
  <rect x="365" y="128" width="150" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="440" y="146" text-anchor="middle" font-size="11" fill="#333">val = vec[row][col]</text>
  <path d="M 440 156 L 440 168" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- col++ -->
  <rect x="390" y="168" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="440" y="186" text-anchor="middle" font-size="11" fill="#333">col++</text>
  <path d="M 440 196 L 440 208" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Return val -->
  <rect x="390" y="208" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="440" y="226" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">return val</text>

  <!-- hasNext call arrow (from right to left) -->
  <path d="M 370 102 L 345 102 L 345 62 L 340 62" stroke="#888" stroke-width="1" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Bottom note -->
  <rect x="40" y="360" width="480" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="378" text-anchor="middle" font-size="11" fill="#555">hasNext() 负责定位到有效元素 · next() 负责读取并前进</text>
  <text x="280" y="394" text-anchor="middle" font-size="11" fill="#555">职责分离保证 next() 读取时不越界</text>
</svg>
