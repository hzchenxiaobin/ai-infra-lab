<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD2" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
      <path d="M0,0 L5,8 L10,0" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：insert(idKey, value)</text>

  <!-- Start -->
  <rect x="190" y="46" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="270" y="71" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">调用 insert(idKey, value)</text>
  <path d="M 270 86 L 270 110" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrD2)" filter="url(#rough2)"/>

  <!-- Write box (unconditional) -->
  <rect x="170" y="114" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="134" text-anchor="middle" font-size="12" fill="#333">values[idKey] = value</text>
  <text x="270" y="150" text-anchor="middle" font-size="10" fill="#888">无条件写入</text>
  <path d="M 270 158 L 270 184" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrD2)" filter="url(#rough2)"/>

  <!-- Decision diamond: idKey == ptr ? -->
  <polygon points="270,188 388,246 270,304 152,246" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="240" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">idKey</text>
  <text x="270" y="258" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">== ptr ?</text>

  <!-- No branch (right) -->
  <path d="M 388 246 L 440 246 L 440 320" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrD2)" filter="url(#rough2)"/>
  <text x="398" y="238" text-anchor="start" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="380" y="324" width="120" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="440" y="350" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">return []</text>
  <text x="440" y="380" text-anchor="middle" font-size="10" fill="#888">ptr 处仍空，不动</text>

  <!-- Yes branch (left) -->
  <path d="M 152 246 L 100 246 L 100 282" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrD2)" filter="url(#rough2)"/>
  <text x="110" y="238" text-anchor="start" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- While loop box -->
  <rect x="30" y="286" width="140" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="100" y="306" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">while ptr≤n</text>
  <text x="100" y="322" text-anchor="middle" font-size="11" fill="#333">且 values[ptr] 非空:</text>
  <text x="100" y="338" text-anchor="middle" font-size="10.5" fill="#4a7a3a">收 chunk; ptr++</text>
  <path d="M 100 344 L 100 372" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrD2)" filter="url(#rough2)"/>

  <!-- Return chunk -->
  <rect x="40" y="376" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="100" y="402" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">return chunk</text>
</svg>
