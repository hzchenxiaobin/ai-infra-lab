<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：服务中心选址</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">positions = [[0,1],[1,0],[1,2],[2,1]] → 中心 [1,1]，距离和 = 4.0</text>

  <!-- ===== 2D grid for Example 1 ===== -->
  <text x="40" y="72" font-size="13" fill="#446688" font-weight="bold">示例 1：四点菱形分布</text>

  <!-- grid background -->
  <g stroke="#eee" stroke-width="0.8" filter="url(#rough2)">
    <path d="M 80 80 L 80 280"/>
    <path d="M 140 80 L 140 280"/>
    <path d="M 200 80 L 200 280"/>
    <path d="M 260 80 L 260 280"/>
    <path d="M 80 80 L 260 280" opacity="0"/>
    <path d="M 80 140 L 260 140"/>
    <path d="M 80 200 L 260 200"/>
    <path d="M 80 260 L 260 260"/>
  </g>

  <!-- axes -->
  <path d="M 80 280 L 80 75" stroke="#999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 75 260 L 270 260" stroke="#999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- axis labels: x=0,1,2 ; y=0,1,2 -->
  <!-- grid: x maps 0→80, 1→140, 2→200, 3→260 ; y maps 0→260, 1→200, 2→140, 3→80 -->
  <g font-size="9" fill="#888">
    <text x="80" y="272" text-anchor="middle">0</text>
    <text x="140" y="272" text-anchor="middle">1</text>
    <text x="200" y="272" text-anchor="middle">2</text>
    <text x="73" y="264" text-anchor="end">0</text>
    <text x="73" y="204" text-anchor="end">1</text>
    <text x="73" y="144" text-anchor="end">2</text>
  </g>
  <text x="270" y="272" font-size="9" fill="#888">x</text>
  <text x="73" y="80" font-size="9" fill="#888">y</text>

  <!-- 4 customer points: [0,1]→(80,200), [1,0]→(140,260), [1,2]→(140,140), [2,1]→(200,200) -->
  <!-- center: [1,1]→(140,200) -->

  <!-- distance lines from center to each point -->
  <g stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 2" fill="none" filter="url(#rough2)">
    <path d="M 140 200 L 80 200"/>
    <path d="M 140 200 L 140 260"/>
    <path d="M 140 200 L 140 140"/>
    <path d="M 140 200 L 200 200"/>
  </g>

  <!-- distance labels -->
  <g font-size="9" fill="#b85450">
    <text x="108" y="195" text-anchor="middle">d=1</text>
    <text x="150" y="234" text-anchor="middle">d=1</text>
    <text x="150" y="175" text-anchor="middle">d=1</text>
    <text x="172" y="195" text-anchor="middle">d=1</text>
  </g>

  <!-- customer points -->
  <g>
    <circle cx="80" cy="200" r="5" fill="#446688" filter="url(#rough2)"/>
    <text x="66" y="195" font-size="9" fill="#446688">(0,1)</text>
    <circle cx="140" cy="260" r="5" fill="#446688" filter="url(#rough2)"/>
    <text x="146" y="258" font-size="9" fill="#446688">(1,0)</text>
    <circle cx="140" cy="140" r="5" fill="#446688" filter="url(#rough2)"/>
    <text x="146" y="135" font-size="9" fill="#446688">(1,2)</text>
    <circle cx="200" cy="200" r="5" fill="#446688" filter="url(#rough2)"/>
    <text x="206" y="195" font-size="9" fill="#446688">(2,1)</text>
  </g>

  <!-- center point (star-like) -->
  <circle cx="140" cy="200" r="7" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="140" y="200" text-anchor="middle" font-size="8" fill="#fff" font-weight="bold">C</text>
  <text x="148" y="218" font-size="10" fill="#4a7a3a" font-weight="bold">中心 (1,1)</text>

  <!-- result box for example 1 -->
  <rect x="300" y="90" width="210" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="405" y="110" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">结果</text>
  <text x="310" y="128" font-size="10" fill="#333">中心 = [1, 1]</text>
  <text x="310" y="144" font-size="10" fill="#333">4 条距离均为 √1 = 1</text>
  <text x="310" y="160" font-size="11" fill="#4a7a3a" font-weight="bold">总和 = 4.00000</text>

  <!-- ===== Example 2 ===== -->
  <path d="M 30 300 L 510 300" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="324" font-size="13" fill="#446688" font-weight="bold">示例 2：两点 → 几何中位数在线段上</text>

  <!-- mini grid for example 2 -->
  <g stroke="#eee" stroke-width="0.8" filter="url(#rough2)">
    <path d="M 60 335 L 60 395"/>
    <path d="M 120 335 L 120 395"/>
    <path d="M 180 335 L 180 395"/>
    <path d="M 240 335 L 240 395"/>
    <path d="M 60 395 L 240 335" opacity="0"/>
    <path d="M 60 335 L 240 335"/>
    <path d="M 60 365 L 240 365"/>
    <path d="M 60 395 L 240 395"/>
  </g>

  <!-- axes -->
  <path d="M 60 395 L 60 332" stroke="#999" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 57 395 L 245 395" stroke="#999" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <g font-size="8" fill="#888">
    <text x="60" y="406" text-anchor="middle">1</text>
    <text x="180" y="406" text-anchor="middle">3</text>
    <text x="55" y="398" text-anchor="end">1</text>
    <text x="55" y="338" text-anchor="end">3</text>
  </g>

  <!-- points [1,1]→(60,395), [3,3]→(180,335) -->
  <circle cx="60" cy="395" r="4.5" fill="#446688" filter="url(#rough2)"/>
  <text x="40" y="392" font-size="9" fill="#446688">(1,1)</text>
  <circle cx="180" cy="335" r="4.5" fill="#446688" filter="url(#rough2)"/>
  <text x="186" y="332" font-size="9" fill="#446688">(3,3)</text>

  <!-- line segment between points -->
  <path d="M 60 395 L 180 335" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 2" fill="none" filter="url(#rough2)"/>
  <text x="100" y="380" font-size="9" fill="#b85450">d = 2√2 ≈ 2.828</text>

  <!-- any point on segment works -->
  <circle cx="120" cy="365" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="128" y="362" font-size="9" fill="#4a7a3a">中心可取线段上任一点</text>

  <!-- result box for example 2 -->
  <rect x="300" y="318" width="210" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="405" y="338" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">结果</text>
  <text x="310" y="356" font-size="10" fill="#333">两点时：几何中位数 = 线段</text>
  <text x="310" y="370" font-size="10" fill="#333">最小距离和 = 两点间距</text>
  <text x="310" y="384" font-size="11" fill="#d6a040" font-weight="bold">总和 = 2.82843</text>
</svg>
