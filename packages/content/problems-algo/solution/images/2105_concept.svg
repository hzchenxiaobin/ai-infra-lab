<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：双指针从两端推进，中间相遇比水量</text>

  <!-- ====== Top scene: two rivers + plants ====== -->
  <!-- Alice river (left) -->
  <path d="M 30 60 Q 45 52 60 60 Q 75 68 90 60 L 90 88 Q 75 96 60 88 Q 45 80 30 88 Z"
        fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="78" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">Alice</text>
  <text x="60" y="106" text-anchor="middle" font-size="9" fill="#aaa">河 x=−1</text>

  <!-- Plants 0-4 -->
  <circle cx="140" cy="74" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="140" y="79" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">0</text>

  <circle cx="200" cy="74" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="79" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>

  <!-- middle plant highlighted -->
  <circle cx="260" cy="74" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="260" y="79" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">2</text>
  <text x="260" y="108" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">相遇</text>

  <circle cx="320" cy="74" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="79" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>

  <circle cx="380" cy="74" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="79" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">4</text>

  <!-- Bob river (right) -->
  <path d="M 430 60 Q 445 52 460 60 Q 475 68 490 60 L 490 88 Q 475 96 460 88 Q 445 80 430 88 Z"
        fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="460" y="78" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">Bob</text>
  <text x="460" y="106" text-anchor="middle" font-size="9" fill="#aaa">河 x=n</text>

  <!-- Alice arrow (left to right, green) -->
  <path d="M 92 56 L 245 56" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="168" y="48" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">Alice →</text>

  <!-- Bob arrow (right to left, orange) -->
  <path d="M 428 56 L 275 56" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="352" y="48" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">← Bob</text>

  <!-- divider -->
  <path d="M 30 124 L 530 124" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ====== Middle: refill is instant ====== -->
  <text x="36" y="148" font-size="12" fill="#444" font-weight="bold">灌水规则：立即灌满，不折返河边（与 2079 不同！）</text>

  <!-- enough water -->
  <rect x="40" y="162" width="200" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="140" y="184" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">水够 → 直接浇</text>
  <text x="140" y="200" text-anchor="middle" font-size="10" fill="#4a7a3a">cur ≥ plants[i]</text>

  <!-- not enough -->
  <rect x="270" y="162" width="220" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="380" y="184" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">水不够 → 立即灌满再浇</text>
  <text x="380" y="200" text-anchor="middle" font-size="10" fill="#d6a040">cur = cap, refills++</text>

  <!-- note -->
  <rect x="80" y="220" width="400" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="237" text-anchor="middle" font-size="10" fill="#b85450">⚠ 灌水是瞬时的，不产生步数 → 相遇点仅由下标 i==j 决定</text>

  <!-- divider -->
  <path d="M 30 258 L 530 258" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ====== Bottom: meeting rule ====== -->
  <text x="36" y="282" font-size="12" fill="#444" font-weight="bold">相遇规则：i == j（n 为奇数时中间株）</text>

  <!-- Alice wins -->
  <rect x="40" y="296" width="220" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="318" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a ≥ b → Alice 浇</text>
  <text x="150" y="336" text-anchor="middle" font-size="10" fill="#4a7a3a">平手时 Alice 赢</text>

  <!-- Bob wins -->
  <rect x="290" y="296" width="220" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="400" y="318" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a &lt; b → Bob 浇</text>
  <text x="400" y="336" text-anchor="middle" font-size="10" fill="#d6a040">水量多者负责</text>

  <!-- formula -->
  <rect x="50" y="362" width="460" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="382" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">两人独立浇水各计各的 refill；相遇株由水量多者浇（含其可能的 refill）</text>
</svg>
