<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 412" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="412" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：固定右端点 i，「左侧第一个更大」划出等值窗口</text>

  <!-- Panel A: array with j / i / window -->
  <text x="198" y="48" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">j：左边第一个 &gt; 3</text>
  <path d="M 198 52 L 198 60" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="322" y="48" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">i（固定右端点）</text>
  <path d="M 322 52 L 322 60" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="108" y="64" width="56" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="136" y="89" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="170" y="64" width="56" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="198" y="89" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="232" y="64" width="56" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="89" text-anchor="middle" font-size="13" fill="#8a6a1f" filter="url(#rough2)">3</text>
  <rect x="294" y="64" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="322" y="89" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="356" y="64" width="56" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="384" y="89" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>

  <text x="136" y="118" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">0</text>
  <text x="198" y="118" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">1</text>
  <text x="260" y="118" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">2</text>
  <text x="322" y="118" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">3</text>
  <text x="384" y="118" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">4</text>

  <path d="M 236 128 L 236 138 L 346 138 L 346 128" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="291" y="156" text-anchor="middle" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">窗口 [j+1, i]：全部 ≤ 3，其中等值下标 {2, 3} ⇒ 贡献 2（[3,3] 与 [3]）</text>

  <!-- Panel B: transformation chain -->
  <rect x="12" y="176" width="138" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="81" y="196" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">合法子数组：</text>
  <text x="81" y="213" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">首、尾都是最大值</text>

  <path d="M 154 200 L 170 200" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="162" y="193" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">⇔</text>

  <rect x="174" y="176" width="160" height="48" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="254" y="196" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">nums[l] == nums[i] 且</text>
  <text x="254" y="213" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[l,i] 内无更大（等值允许）</text>

  <path d="M 338 200 L 354 200" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="346" y="193" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⇒</text>

  <rect x="358" y="176" width="150" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="433" y="196" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">合法 l = 窗口内</text>
  <text x="433" y="213" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">的等值下标，贡献 = 个数</text>

  <!-- Panel C: boundary feel -->
  <text x="260" y="252" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">边界手感：中间「等值」合法，「更大」非法，首尾不等也非法</text>

  <rect x="40" y="266" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="55" y="283" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">3</text>
  <rect x="75" y="266" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="90" y="283" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">3</text>
  <rect x="110" y="266" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="125" y="283" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">3</text>
  <text x="90" y="310" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">✓ 中间等值：仍合法</text>

  <rect x="210" y="266" width="30" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="225" y="283" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="245" y="266" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="283" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="280" y="266" width="30" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="295" y="283" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="260" y="310" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗ 中间 5 &gt; 3：首尾非最大</text>

  <rect x="398" y="266" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="413" y="283" text-anchor="middle" font-size="11" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="433" y="266" width="30" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="448" y="283" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="430" y="310" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗ 首尾不等：至多一端是最大</text>

  <!-- Bottom notes -->
  <rect x="12" y="326" width="496" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="348" text-anchor="middle" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">以 i 结尾的贡献 = 窗口内等值个数：全等数组 [3,3,3] 贡献 1+2+3 = 6 = C(4,2)，所有子数组全合法</text>
  <text x="260" y="368" text-anchor="middle" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">中间等值元素「合法但必须计数」——这正是栈要存 (值, 个数) 对、而非只存下标的原因</text>
  <text x="260" y="388" text-anchor="middle" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">答案上界 C(n+1, 2) ≈ 5×10^9 &gt; int32：必须用 64 位整数累加</text>
</svg>
