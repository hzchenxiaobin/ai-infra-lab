<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：统计度数 → 升序排序 → 依次赋 1..n → 加权求和</text>

  <!-- 1. count degree -->
  <rect x="170" y="44" width="200" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="61" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 统计每个城市度数</text>
  <text x="270" y="76" text-anchor="middle" font-size="10" fill="#446688">遍历 roads，deg[a]++ , deg[b]++</text>
  <path d="M 270 86 L 270 104" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. sort -->
  <rect x="170" y="108" width="200" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="125" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 度数升序排序</text>
  <text x="270" y="140" text-anchor="middle" font-size="10" fill="#446688">sort(deg)  O(n log n)</text>
  <path d="M 270 150 L 270 168" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. assign + accumulate -->
  <rect x="140" y="172" width="260" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="191" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ 依次赋值 + 累加</text>
  <text x="270" y="208" text-anchor="middle" font-size="10.5" fill="#4a7a3a">ans += deg[i] × (i + 1)</text>
  <text x="270" y="220" text-anchor="middle" font-size="9.5" fill="#888">第 i 小度数 → 配值 (i+1)</text>
  <path d="M 270 226 L 270 244" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4. decision loop -->
  <polygon points="270,246 380,286 270,326 160,286" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="282" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">i &lt; n ?</text>
  <text x="270" y="298" text-anchor="middle" font-size="10" fill="#888">遍历完所有城市</text>
  <!-- yes loop back -->
  <path d="M 160 286 L 96 286 L 96 197 L 138 197" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="278" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <!-- no return -->
  <path d="M 270 326 L 270 346" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="340" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- 5. return -->
  <rect x="210" y="350" width="120" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="372" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">④ 返回 ans</text>

  <!-- footer note -->
  <rect x="50" y="402" width="440" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="270" y="420" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">关键转化：求和合并同类项 → 加权和最大 → 重排不等式</text>
  <text x="270" y="436" text-anchor="middle" font-size="10" fill="#888">度数即「系数」，系数大的应配大数（n），系数小的配小数（1）</text>
</svg>
