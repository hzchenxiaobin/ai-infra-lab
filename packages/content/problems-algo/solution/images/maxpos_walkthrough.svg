<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [1, -2, -3, 4]</text>

  <!-- 表头 -->
  <rect x="30" y="46" width="500" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="60" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i</text>
  <text x="130" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">nums[i]</text>
  <text x="220" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">pos</text>
  <text x="310" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">neg</text>
  <text x="400" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans</text>
  <text x="490" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">说明</text>

  <!-- 分隔线 -->
  <line x1="95" y1="46" x2="95" y2="256" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="170" y1="46" x2="170" y2="256" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="265" y1="46" x2="265" y2="256" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="355" y1="46" x2="355" y2="256" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="445" y1="46" x2="445" y2="256" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- 行 0: i=0, nums=1 -->
  <rect x="30" y="78" width="500" height="34" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="60" y="100" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="130" y="100" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="200" y="84" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="220" y="100" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="310" y="100" text-anchor="middle" font-size="12" fill="#999">0</text>
  <text x="400" y="100" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="490" y="100" text-anchor="middle" font-size="10" fill="#666">正数 pos+1</text>

  <!-- 行 1: i=1, nums=-2 -->
  <rect x="30" y="114" width="500" height="34" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="60" y="136" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="130" y="136" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">-2</text>
  <text x="220" y="136" text-anchor="middle" font-size="12" fill="#999">0</text>
  <rect x="290" y="120" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="310" y="136" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="400" y="136" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="490" y="136" text-anchor="middle" font-size="10" fill="#666">互换，neg=pos+1</text>

  <!-- 行 2: i=2, nums=-3 (高亮：翻正) -->
  <rect x="30" y="150" width="500" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
  <text x="60" y="172" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="130" y="172" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">-3</text>
  <rect x="200" y="156" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="220" y="172" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3 ⭐</text>
  <text x="310" y="172" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="400" y="172" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="490" y="172" text-anchor="middle" font-size="10" fill="#5a4a20">neg 翻正 pos=neg+1</text>

  <!-- 行 3: i=3, nums=4 -->
  <rect x="30" y="186" width="500" height="34" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="60" y="208" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="130" y="208" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="200" y="192" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="220" y="208" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <text x="310" y="208" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="400" y="208" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="490" y="208" text-anchor="middle" font-size="10" fill="#666">正数 pos+1</text>

  <!-- 翻转箭头：i=1 的 neg -> i=2 的 pos -->
  <path d="M 310 142 Q 250 150 220 156" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="262" y="148" font-size="9" fill="#4a7a3a">翻正</text>

  <!-- 底部结论 -->
  <rect x="30" y="240" width="500" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="262" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">答案 ans = 4（整个数组乘积 1·(-2)·(-3)·4 = 24 &gt; 0）</text>
  <text x="280" y="282" text-anchor="middle" font-size="11" fill="#3a5a2a">i=1 时 pos 跌到 0，但 neg 记下了 2 → i=2 再遇负数即翻回 pos=3</text>
  <text x="280" y="298" text-anchor="middle" font-size="11" fill="#3a5a2a">这正是「同时维护正/负长度」的意义</text>
</svg>
