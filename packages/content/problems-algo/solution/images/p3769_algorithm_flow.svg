<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#b85450" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="16" fill="#333"
        filter="url(#rough2)">流程：预计算反射值 → 二元组键排序</text>

  <!-- 主流程 -->
  <rect x="24" y="56" width="96" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="72" y="85" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">输入 nums</text>

  <path d="M 120 80 L 144 80" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="144" y="56" width="120" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="204" y="76" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">逐个计算</text>
  <text x="204" y="94" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">reflect(x)</text>

  <path d="M 264 80 L 288 80" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="288" y="56" width="104" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="340" y="76" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">构造键</text>
  <text x="340" y="94" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">(reflect(x), x)</text>

  <path d="M 392 80 L 416 80" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="416" y="56" width="88" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="460" y="76" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">按键升序</text>
  <text x="460" y="94" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">排序输出</text>

  <!-- 虚线：展开子流程 -->
  <path d="M 204 104 L 204 136" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <text x="218" y="126" font-size="10.5" fill="#b85450" filter="url(#rough2)">展开</text>

  <!-- 子流程：reflect 位循环 -->
  <rect x="36" y="132" width="336" height="216" fill="#ffffff" stroke="#b85450" stroke-width="1.3" stroke-dasharray="6 4" rx="10" filter="url(#rough2)"/>
  <text x="46" y="152" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">子流程：reflect(x) 位循环（每个数至多 30 轮）</text>

  <rect x="118" y="162" width="64" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="150" y="181" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">r = 0</text>

  <path d="M 150 190 L 150 222" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="80,258 150,226 220,258 150,290" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="263" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">x &gt; 0 ?</text>

  <path d="M 150 290 L 150 304" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="301" font-size="11" fill="#446688" filter="url(#rough2)">是</text>

  <rect x="70" y="306" width="160" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="150" y="321" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">r = (r &lt;&lt; 1) | (x &amp; 1)</text>
  <text x="150" y="336" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">x &gt;&gt;= 1</text>

  <path d="M 70 324 L 46 324 L 46 258 L 76 258" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="62" y="250" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">下一轮</text>

  <path d="M 220 258 L 246 258" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="230" y="250" font-size="11" fill="#446688" filter="url(#rough2)">否</text>

  <rect x="248" y="242" width="84" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="290" y="263" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 r</text>

  <!-- 右侧要点 -->
  <rect x="388" y="152" width="112" height="196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="444" y="174" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">实现要点</text>
  <text x="398" y="200" font-size="10.5" fill="#333" filter="url(#rough2)">· 只扫有效位</text>
  <text x="398" y="218" font-size="10.5" fill="#333" filter="url(#rough2)">　前导零天然丢弃</text>
  <text x="398" y="244" font-size="10.5" fill="#333" filter="url(#rough2)">· 位数 ≤ 30</text>
  <text x="398" y="262" font-size="10.5" fill="#333" filter="url(#rough2)">　int 存反射值安全</text>
  <text x="398" y="288" font-size="10.5" fill="#333" filter="url(#rough2)">· 键 (r, x) 全序</text>
  <text x="398" y="306" font-size="10.5" fill="#333" filter="url(#rough2)">　无需稳定排序</text>
  <text x="398" y="332" font-size="10.5" fill="#333" filter="url(#rough2)">　n ≤ 100 秒过</text>
</svg>
