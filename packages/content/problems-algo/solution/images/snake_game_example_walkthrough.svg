<svg xmlns="http://www.w3.org/2000/svg" width="860" height="540" viewBox="0 0 860 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="860" height="540" fill="#fdfcf7"/>
  <text x="430" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：6 次 move 的蛇身演化</text>
  <text x="430" y="52" text-anchor="middle" font-size="11.5" fill="#888">width=3, height=2, food=[[1,2],[0,1]]　●头 ○身 ◇尾 ★食物</text>

  <!-- ===== Panel template: cell=32, grid origin offset (60,36) from panel ===== -->

  <!-- Panel 1: move R → 0, body=[(0,1)], food=(1,2) -->
  <g filter="url(#sk)"><rect x="30" y="70" width="240" height="200" rx="8" fill="#fff" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="150" y="92" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">① move("R") → 0</text>
  <!-- grid (90,108): cells 32 -->
  <g font-size="9" fill="#bbb">
    <g filter="url(#sk)"><rect x="90" y="108" width="32" height="32" rx="3" fill="#fff" stroke="#4a8edb"/></g><text x="106" y="128" text-anchor="middle">(0,0)</text>
    <g filter="url(#sk)"><rect x="122" y="108" width="32" height="32" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g><text x="138" y="130" text-anchor="middle" font-size="14" fill="#b03a3a" font-weight="bold">●</text>
    <g filter="url(#sk)"><rect x="154" y="108" width="32" height="32" rx="3" fill="#fff" stroke="#4a8edb"/></g><text x="170" y="128" text-anchor="middle">(0,2)</text>
    <g filter="url(#sk)"><rect x="90" y="140" width="32" height="32" rx="3" fill="#fff" stroke="#4a8edb"/></g><text x="106" y="160" text-anchor="middle">(1,0)</text>
    <g filter="url(#sk)"><rect x="122" y="140" width="32" height="32" rx="3" fill="#fff" stroke="#4a8edb"/></g><text x="138" y="160" text-anchor="middle">(1,1)</text>
    <g filter="url(#sk)"><rect x="154" y="140" width="32" height="32" rx="3" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/></g><text x="170" y="162" text-anchor="middle" font-size="14" fill="#a06820" font-weight="bold">★</text>
  </g>
  <text x="150" y="196" text-anchor="middle" font-size="10.5" fill="#555">头(0,1) 无食物 → 弹尾(0,0)</text>
  <text x="150" y="212" text-anchor="middle" font-size="10" fill="#888">队列=[(0,1)]  得分=0</text>

  <!-- Panel 2: move D → 0, body=[(1,1)], food=(1,2) -->
  <g filter="url(#sk)"><rect x="300" y="70" width="240" height="200" rx="8" fill="#fff" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="420" y="92" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">② move("D") → 0</text>
  <g font-size="9" fill="#bbb">
    <g filter="url(#sk)"><rect x="360" y="108" width="32" height="32" rx="3" fill="#fff" stroke="#4a8edb"/></g><text x="376" y="128" text-anchor="middle">(0,0)</text>
    <g filter="url(#sk)"><rect x="392" y="108" width="32" height="32" rx="3" fill="#fff" stroke="#4a8edb"/></g><text x="408" y="128" text-anchor="middle">(0,1)</text>
    <g filter="url(#sk)"><rect x="424" y="108" width="32" height="32" rx="3" fill="#fff" stroke="#4a8edb"/></g><text x="440" y="128" text-anchor="middle">(0,2)</text>
    <g filter="url(#sk)"><rect x="360" y="140" width="32" height="32" rx="3" fill="#fff" stroke="#4a8edb"/></g><text x="376" y="160" text-anchor="middle">(1,0)</text>
    <g filter="url(#sk)"><rect x="392" y="140" width="32" height="32" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g><text x="408" y="162" text-anchor="middle" font-size="14" fill="#b03a3a" font-weight="bold">●</text>
    <g filter="url(#sk)"><rect x="424" y="140" width="32" height="32" rx="3" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/></g><text x="440" y="162" text-anchor="middle" font-size="14" fill="#a06820" font-weight="bold">★</text>
  </g>
  <text x="420" y="196" text-anchor="middle" font-size="10.5" fill="#555">头(1,1) 无食物 → 弹尾(0,1)</text>
  <text x="420" y="212" text-anchor="middle" font-size="10" fill="#888">队列=[(1,1)]  得分=0</text>

  <!-- Panel 3: move R → 1 (eat), body=[(1,2),(1,1)], food now (0,1) -->
  <g filter="url(#sk)"><rect x="570" y="70" width="240" height="200" rx="8" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="690" y="92" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">③ move("R") → 1 ★吃</text>
  <g font-size="9" fill="#bbb">
    <g filter="url(#sk)"><rect x="630" y="108" width="32" height="32" rx="3" fill="#fff" stroke="#4a8edb"/></g><text x="646" y="128" text-anchor="middle">(0,0)</text>
    <g filter="url(#sk)"><rect x="662" y="108" width="32" height="32" rx="3" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/></g><text x="678" y="130" text-anchor="middle" font-size="14" fill="#a06820" font-weight="bold">★</text>
    <g filter="url(#sk)"><rect x="694" y="108" width="32" height="32" rx="3" fill="#fff" stroke="#4a8edb"/></g><text x="710" y="128" text-anchor="middle">(0,2)</text>
    <g filter="url(#sk)"><rect x="630" y="140" width="32" height="32" rx="3" fill="#fff" stroke="#4a8edb"/></g><text x="646" y="160" text-anchor="middle">(1,0)</text>
    <g filter="url(#sk)"><rect x="662" y="140" width="32" height="32" rx="3" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="3 2"/></g><text x="678" y="162" text-anchor="middle" font-size="12" fill="#3a6e2e">◇</text>
    <g filter="url(#sk)"><rect x="694" y="140" width="32" height="32" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g><text x="710" y="162" text-anchor="middle" font-size="14" fill="#b03a3a" font-weight="bold">●</text>
  </g>
  <text x="690" y="196" text-anchor="middle" font-size="10.5" fill="#2e6e2e" font-weight="bold">头(1,2) 吃食物! 不弹尾</text>
  <text x="690" y="212" text-anchor="middle" font-size="10" fill="#888">队列=[(1,2),(1,1)]  得分=1</text>

  <!-- Panel 4: move U → 1, body=[(0,2),(1,2)], food=(0,1) -->
  <g filter="url(#sk)"><rect x="30" y="290" width="240" height="200" rx="8" fill="#fff" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="150" y="312" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">④ move("U") → 1</text>
  <g font-size="9" fill="#bbb">
    <g filter="url(#sk)"><rect x="90" y="328" width="32" height="32" rx="3" fill="#fff" stroke="#4a8edb"/></g><text x="106" y="348" text-anchor="middle">(0,0)</text>
    <g filter="url(#sk)"><rect x="122" y="328" width="32" height="32" rx="3" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/></g><text x="138" y="350" text-anchor="middle" font-size="14" fill="#a06820" font-weight="bold">★</text>
    <g filter="url(#sk)"><rect x="154" y="328" width="32" height="32" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g><text x="170" y="350" text-anchor="middle" font-size="14" fill="#b03a3a" font-weight="bold">●</text>
    <g filter="url(#sk)"><rect x="90" y="360" width="32" height="32" rx="3" fill="#fff" stroke="#4a8edb"/></g><text x="106" y="380" text-anchor="middle">(1,0)</text>
    <g filter="url(#sk)"><rect x="122" y="360" width="32" height="32" rx="3" fill="#fff" stroke="#4a8edb"/></g><text x="138" y="380" text-anchor="middle">(1,1)</text>
    <g filter="url(#sk)"><rect x="154" y="360" width="32" height="32" rx="3" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="3 2"/></g><text x="170" y="382" text-anchor="middle" font-size="12" fill="#3a6e2e">◇</text>
  </g>
  <text x="150" y="416" text-anchor="middle" font-size="10.5" fill="#555">头(0,2) 无食物 → 弹尾(1,1)</text>
  <text x="150" y="432" text-anchor="middle" font-size="10" fill="#888">队列=[(0,2),(1,2)]  得分=1</text>

  <!-- Panel 5: move L → 2 (eat), body=[(0,1),(0,2),(1,2)], no food -->
  <g filter="url(#sk)"><rect x="300" y="290" width="240" height="200" rx="8" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="420" y="312" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">⑤ move("L") → 2 ★吃</text>
  <g font-size="9" fill="#bbb">
    <g filter="url(#sk)"><rect x="360" y="328" width="32" height="32" rx="3" fill="#fff" stroke="#4a8edb"/></g><text x="376" y="348" text-anchor="middle">(0,0)</text>
    <g filter="url(#sk)"><rect x="392" y="328" width="32" height="32" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g><text x="408" y="350" text-anchor="middle" font-size="14" fill="#b03a3a" font-weight="bold">●</text>
    <g filter="url(#sk)"><rect x="424" y="328" width="32" height="32" rx="3" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.6"/></g><text x="440" y="350" text-anchor="middle" font-size="12" fill="#3a6e2e">○</text>
    <g filter="url(#sk)"><rect x="360" y="360" width="32" height="32" rx="3" fill="#fff" stroke="#4a8edb"/></g><text x="376" y="380" text-anchor="middle">(1,0)</text>
    <g filter="url(#sk)"><rect x="392" y="360" width="32" height="32" rx="3" fill="#fff" stroke="#4a8edb"/></g><text x="408" y="380" text-anchor="middle">(1,1)</text>
    <g filter="url(#sk)"><rect x="424" y="360" width="32" height="32" rx="3" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="3 2"/></g><text x="440" y="382" text-anchor="middle" font-size="12" fill="#3a6e2e">◇</text>
  </g>
  <text x="420" y="416" text-anchor="middle" font-size="10.5" fill="#2e6e2e" font-weight="bold">头(0,1) 吃食物! 不弹尾</text>
  <text x="420" y="432" text-anchor="middle" font-size="10" fill="#888">队列=[(0,1),(0,2),(1,2)]  得分=2</text>

  <!-- Panel 6: move U → -1 (out of bounds) -->
  <g filter="url(#sk)"><rect x="570" y="290" width="240" height="200" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="690" y="312" text-anchor="middle" font-size="13" fill="#b03a3a" font-weight="bold">⑥ move("U") → -1 越界</text>
  <g font-size="9" fill="#bbb">
    <g filter="url(#sk)"><rect x="630" y="328" width="32" height="32" rx="3" fill="#fff" stroke="#4a8edb"/></g><text x="646" y="348" text-anchor="middle">(0,0)</text>
    <g filter="url(#sk)"><rect x="662" y="328" width="32" height="32" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g><text x="678" y="350" text-anchor="middle" font-size="14" fill="#b03a3a" font-weight="bold">●</text>
    <g filter="url(#sk)"><rect x="694" y="328" width="32" height="32" rx="3" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.6"/></g><text x="710" y="350" text-anchor="middle" font-size="12" fill="#3a6e2e">○</text>
    <g filter="url(#sk)"><rect x="630" y="360" width="32" height="32" rx="3" fill="#fff" stroke="#4a8edb"/></g><text x="646" y="380" text-anchor="middle">(1,0)</text>
    <g filter="url(#sk)"><rect x="662" y="360" width="32" height="32" rx="3" fill="#fff" stroke="#4a8edb"/></g><text x="678" y="380" text-anchor="middle">(1,1)</text>
    <g filter="url(#sk)"><rect x="694" y="360" width="32" height="32" rx="3" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="3 2"/></g><text x="710" y="382" text-anchor="middle" font-size="12" fill="#3a6e2e">◇</text>
  </g>
  <!-- arrow up out of grid from (0,1) -->
  <path d="M 678 328 L 678 300" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="690" y="416" text-anchor="middle" font-size="10.5" fill="#b03a3a" font-weight="bold">头(-1,1) 越界 → return -1</text>
  <text x="690" y="432" text-anchor="middle" font-size="10" fill="#888">蛇身保持⑤的状态，游戏结束</text>

  <text x="430" y="520" text-anchor="middle" font-size="10.5" fill="#888">③⑤吃到食物时队列变长（不弹尾）；①②④无食物时头进尾退、蛇长不变</text>
</svg>
