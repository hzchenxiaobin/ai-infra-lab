<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：colors = "aabaa", neededTime = [1,2,3,4,1]</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">分成 3 段：aa | b | aa → 各段保留 max，删其余</text>

  <!-- Rope row: 5 balloons -->
  <text x="28" y="84" font-size="10.5" fill="#666">气球</text>

  <!-- Balloon 0: a, t=1 -->
  <ellipse cx="100" cy="88" rx="20" ry="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="94" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <text x="100" y="128" text-anchor="middle" font-size="10.5" fill="#b85450">t=1</text>

  <!-- Balloon 1: a, t=2 keep -->
  <ellipse cx="170" cy="88" rx="20" ry="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="170" y="94" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <text x="170" y="128" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">t=2 ★</text>

  <!-- Balloon 2: b, t=3 keep -->
  <ellipse cx="280" cy="88" rx="20" ry="24" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="280" y="94" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <text x="280" y="128" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">t=3 ★</text>

  <!-- Balloon 3: a, t=4 keep -->
  <ellipse cx="390" cy="88" rx="20" ry="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="390" y="94" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <text x="390" y="128" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">t=4 ★</text>

  <!-- Balloon 4: a, t=1 -->
  <ellipse cx="460" cy="88" rx="20" ry="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="460" y="94" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <text x="460" y="128" text-anchor="middle" font-size="10.5" fill="#b85450">t=1</text>

  <!-- Rope line -->
  <path d="M 70 116 L 490 116" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Segment brackets -->
  <!-- Segment 1: aa -->
  <path d="M 80 150 L 80 158 L 190 158 L 190 150" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="135" y="172" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">段1: aa</text>

  <!-- Segment 2: b -->
  <path d="M 260 150 L 260 158 L 300 158 L 300 150" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="280" y="172" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">段2: b</text>

  <!-- Segment 3: aa -->
  <path d="M 370 150 L 370 158 L 480 158 L 480 150" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="425" y="172" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">段3: aa</text>

  <!-- Arrow down -->
  <path d="M 280 184 L 280 200" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Computation table -->
  <text x="28" y="216" font-size="10.5" fill="#666">结算</text>

  <!-- Header row -->
  <rect x="40" y="224" width="480" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="241" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">段</text>
  <text x="180" y="241" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">sum</text>
  <text x="280" y="241" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">max</text>
  <text x="380" y="241" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">sum − max</text>
  <text x="475" y="241" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">ans</text>

  <!-- Row 1: aa -->
  <rect x="40" y="252" width="480" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="80" y="268" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">aa</text>
  <text x="180" y="268" text-anchor="middle" font-size="10.5" fill="#333">1+2=3</text>
  <text x="280" y="268" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="380" y="268" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">3−2=1</text>
  <text x="475" y="268" text-anchor="middle" font-size="10.5" fill="#333">1</text>

  <!-- Row 2: b -->
  <rect x="40" y="278" width="480" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="80" y="294" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">b</text>
  <text x="180" y="294" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <text x="280" y="294" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="380" y="294" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">3−3=0</text>
  <text x="475" y="294" text-anchor="middle" font-size="10.5" fill="#333">1</text>

  <!-- Row 3: aa -->
  <rect x="40" y="304" width="480" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="320" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">aa</text>
  <text x="180" y="320" text-anchor="middle" font-size="10.5" fill="#333">4+1=5</text>
  <text x="280" y="320" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="380" y="320" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">5−4=1</text>
  <text x="475" y="320" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">2</text>

  <!-- Result -->
  <rect x="120" y="344" width="320" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="363" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">总代价 = 1 + 0 + 1 = 2 ✓</text>
</svg>
