<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：遍历 → 查 seen → 命中即返回 / 未命中则加入</text>

  <!-- Start oval -->
  <ellipse cx="280" cy="52" rx="48" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="57" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">开始</text>

  <!-- arrow down to loop -->
  <path d="M 280 70 L 280 86" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- loop box -->
  <rect x="190" y="88" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="110" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">for i = 0 .. n-1</text>

  <!-- arrow down to diamond -->
  <path d="M 280 122 L 280 138" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- diamond: s[i] ∈ seen? -->
  <polygon points="280,140 382,184 280,228 178,184" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="180" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">s[i] 已在</text>
  <text x="280" y="196" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">seen 中？</text>

  <!-- Yes branch: right -->
  <path d="M 382 184 L 432 184" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="404" y="178" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">是</text>

  <!-- return box -->
  <rect x="434" y="158" width="112" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="490" y="182" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">返回 s[i]</text>
  <text x="490" y="200" text-anchor="middle" font-size="10.5" fill="#888">（即答案）</text>

  <!-- No branch: down -->
  <path d="M 280 228 L 280 252" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="294" y="244" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- add box -->
  <rect x="190" y="254" width="180" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="276" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">seen.add(s[i])</text>

  <!-- loop back arrow: from add box left up to loop box left -->
  <path d="M 190 271 L 150 271 L 150 105 L 188 105" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="146" y="188" text-anchor="end" font-size="10.5" fill="#888">回到循环</text>

  <!-- bottom note -->
  <path d="M 40 312 L 520 312" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="50" y="332" font-size="11" fill="#555">单重循环：每个字符至多访问一次，命中即提前返回；最坏情况才遍历全串。</text>
</svg>
