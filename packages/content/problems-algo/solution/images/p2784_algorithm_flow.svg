<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">算法流程：排序逐位比对</text>

  <!-- Step 1: 找最大值 -->
  <rect x="130" y="46" width="260" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">Step 1</text>
  <text x="260" y="80" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">n = max(nums)</text>

  <path d="M260,88 L260,104" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: 判长度 -->
  <polygon points="260,108 410,158 260,208 110,158" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="154" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">len(nums)</text>
  <text x="260" y="174" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">== n + 1 ?</text>

  <!-- 否 -->
  <path d="M410,158 L460,158 L460,196" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="416" y="152" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="416" y="196" width="92" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="462" y="219" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">return false</text>

  <!-- 是 -->
  <path d="M260,208 L260,228" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="224" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- Step 3: 排序 -->
  <rect x="130" y="230" width="260" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="248" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">Step 3</text>
  <text x="260" y="264" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">sort(nums)</text>

  <path d="M260,272 L260,288" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: 逐位比对 -->
  <polygon points="260,292 420,344 260,396 100,344" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="338" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">对 i = 0..n−1：</text>
  <text x="260" y="358" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">nums[i] == i+1 ?</text>
  <text x="260" y="378" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">且 nums[n] == n</text>

  <!-- 否 -->
  <path d="M420,344 L470,344 L470,388" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="426" y="338" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="422" y="388" width="92" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="468" y="411" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">return false</text>

  <!-- 是 -->
  <path d="M260,396 L260,416" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="412" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="160" y="416" width="200" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="439" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return true ✓</text>
</svg>
