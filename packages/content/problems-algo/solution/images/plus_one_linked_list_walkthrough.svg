<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：1 → 2 → 9 → 9，加一</text>

  <!-- ===== Row 0: input with dummy ===== -->
  <text x="30" y="60" font-size="12" fill="#446688" font-weight="bold">第 0 步：建 dummy(0) 指向 head</text>

  <g filter="url(#rough2)">
    <rect x="40" y="74" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
    <rect x="80" y="74" width="12" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
  </g>
  <text x="60" y="94" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">0</text>
  <text x="44" y="70" font-size="9" fill="#888">dummy</text>

  <g filter="url(#rough2)">
    <rect x="120" y="74" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
    <rect x="160" y="74" width="12" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
  </g>
  <text x="140" y="94" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <g filter="url(#rough2)">
    <rect x="200" y="74" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
    <rect x="240" y="74" width="12" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
  </g>
  <text x="220" y="94" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

  <g filter="url(#rough2)">
    <rect x="280" y="74" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5"/>
    <rect x="320" y="74" width="12" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5"/>
  </g>
  <text x="300" y="94" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">9</text>

  <g filter="url(#rough2)">
    <rect x="360" y="74" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5"/>
  </g>
  <text x="380" y="94" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">9</text>

  <path d="M 92 89 L 118 89" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 172 89 L 198 89" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 252 89 L 278 89" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 332 89 L 358 89" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- arrow down -->
  <path d="M 280 116 Q 280 124 280 132" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Row 1: scan, last_not_nine moves ===== -->
  <text x="30" y="156" font-size="12" fill="#d6a040" font-weight="bold">第 1 步：遍历，找最右的非 9 节点</text>

  <g filter="url(#rough2)">
    <rect x="40" y="170" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
    <rect x="80" y="170" width="12" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
  </g>
  <text x="60" y="190" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">0</text>

  <g filter="url(#rough2)">
    <rect x="120" y="170" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5"/>
    <rect x="160" y="170" width="12" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5"/>
  </g>
  <text x="140" y="190" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>

  <g filter="url(#rough2)">
    <rect x="200" y="170" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="5"/>
    <rect x="240" y="170" width="12" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="5"/>
  </g>
  <text x="220" y="190" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>

  <g filter="url(#rough2)">
    <rect x="280" y="170" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5"/>
    <rect x="320" y="170" width="12" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5"/>
  </g>
  <text x="300" y="190" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">9</text>

  <g filter="url(#rough2)">
    <rect x="360" y="170" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5"/>
  </g>
  <text x="380" y="190" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">9</text>

  <path d="M 92 185 L 118 185" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 172 185 L 198 185" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 252 185 L 278 185" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 332 185 L 358 185" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="220" y="216" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">↑ last_not_nine 停在此</text>
  <text x="430" y="190" font-size="10" fill="#888">后面全是 9，不更新</text>

  <!-- arrow down -->
  <path d="M 280 224 Q 280 232 280 240" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Row 2: increment +1, reset 9s ===== -->
  <text x="30" y="264" font-size="12" fill="#4a7a3a" font-weight="bold">第 2 步：last.val +1，后续 9 全置 0</text>

  <g filter="url(#rough2)">
    <rect x="40" y="278" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
    <rect x="80" y="278" width="12" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
  </g>
  <text x="60" y="298" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">0</text>

  <g filter="url(#rough2)">
    <rect x="120" y="278" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
    <rect x="160" y="278" width="12" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
  </g>
  <text x="140" y="298" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <g filter="url(#rough2)">
    <rect x="200" y="278" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="5"/>
    <rect x="240" y="278" width="12" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="5"/>
  </g>
  <text x="220" y="298" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>

  <g filter="url(#rough2)">
    <rect x="280" y="278" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
    <rect x="320" y="278" width="12" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
  </g>
  <text x="300" y="298" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>

  <g filter="url(#rough2)">
    <rect x="360" y="278" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
  </g>
  <text x="380" y="298" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>

  <path d="M 92 293 L 118 293" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 172 293 L 198 293" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 252 293 L 278 293" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 332 293 L 358 293" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="220" y="324" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2 → 3 (+1)</text>
  <text x="340" y="324" text-anchor="middle" font-size="10" fill="#888">9 → 0, 9 → 0</text>

  <!-- arrow down -->
  <path d="M 280 332 Q 280 340 280 348" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Row 3: return dummy.next ===== -->
  <text x="30" y="372" font-size="12" fill="#446688" font-weight="bold">第 3 步：dummy.val==0，返回 dummy.next</text>

  <g filter="url(#rough2)">
    <rect x="120" y="386" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
    <rect x="160" y="386" width="12" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
  </g>
  <text x="140" y="406" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <g filter="url(#rough2)">
    <rect x="200" y="386" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="5"/>
    <rect x="240" y="386" width="12" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="5"/>
  </g>
  <text x="220" y="406" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>

  <g filter="url(#rough2)">
    <rect x="280" y="386" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
    <rect x="320" y="386" width="12" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
  </g>
  <text x="300" y="406" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>

  <g filter="url(#rough2)">
    <rect x="360" y="386" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
  </g>
  <text x="380" y="406" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>

  <path d="M 172 401 L 198 401" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 252 401 L 278 401" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 332 401 L 358 401" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="420" y="406" font-size="11" fill="#4a7a3a" font-weight="bold">结果：1→3→0→0 ✓</text>

  <rect x="60" y="424" width="440" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="280" y="441" text-anchor="middle" font-size="11" fill="#555">1299 + 1 = 1300，一次遍历完成，O(n) / O(1)</text>
</svg>
