<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 370" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="370" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：matrix = [[1,2,−1],[4,−1,6],[7,8,9]]</text>

  <!-- input matrix -->
  <text x="141" y="46" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">输入 matrix</text>
  <rect x="71" y="56" width="44" height="38" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="93" y="79" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="119" y="56" width="44" height="38" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="141" y="79" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="167" y="56" width="44" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="189" y="79" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1</text>

  <rect x="71" y="98" width="44" height="38" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="93" y="121" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="119" y="98" width="44" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="141" y="121" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1</text>
  <rect x="167" y="98" width="44" height="38" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="189" y="121" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>

  <rect x="71" y="140" width="44" height="38" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="93" y="163" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="119" y="140" width="44" height="38" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="141" y="163" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="167" y="140" width="44" height="38" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="189" y="163" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">9</text>

  <!-- colMax boxes -->
  <text x="141" y="194" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">逐列取最大 ↓</text>
  <rect x="71" y="202" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="93" y="221" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="119" y="202" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="141" y="221" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="167" y="202" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="189" y="221" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="219" y="221" font-size="10" fill="#8a6d3b" filter="url(#rough2)">= colMax</text>

  <!-- center arrow -->
  <path d="M 217 117 L 293 117" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="255" y="98" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">复制 + 回填</text>
  <text x="257" y="138" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">−1 → colMax[j]</text>

  <!-- answer matrix -->
  <text x="373" y="46" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">输出 answer</text>
  <rect x="303" y="56" width="44" height="38" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="325" y="79" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="351" y="56" width="44" height="38" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="373" y="79" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="399" y="56" width="44" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="421" y="79" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">9</text>

  <rect x="303" y="98" width="44" height="38" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="325" y="121" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="351" y="98" width="44" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="373" y="121" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="399" y="98" width="44" height="38" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="421" y="121" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>

  <rect x="303" y="140" width="44" height="38" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="325" y="163" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="351" y="140" width="44" height="38" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="373" y="163" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="399" y="140" width="44" height="38" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="421" y="163" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="373" y="194" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">两处 −1 已回填（绿色）</text>

  <!-- example 2 -->
  <rect x="48" y="252" width="424" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="272" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">示例 2：[[3,−1],[5,2]] → colMax = [5, 2]</text>
  <text x="260" y="290" text-anchor="middle" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">[0][1] 的 −1 回填 2 → 输出 [[3,2],[5,2]]</text>

  <!-- conclusion -->
  <rect x="48" y="310" width="424" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="334" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">替换值 = 所在列的最大元素；无 −1 的列照常求 max 但用不上</text>
</svg>
