<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：原地折叠——newNums[i] 写回 nums[i]，读先于写不冲突</text>

  <!-- ===== TOP: original array with pair grouping ===== -->
  <text x="280" y="56" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">原数组 nums（n=8），相邻两两配对，下标 i 偶→min / 奇→max</text>

  <!-- pair brackets + op labels (above cells) -->
  <!-- pair 0: cells 0,1  x:75..173  center 124 -->
  <path d="M 75 90 Q 124 82 173 90" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="124" y="78" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">min</text>
  <!-- pair 1: cells 2,3  x:179..277  center 228 -->
  <path d="M 179 90 Q 228 82 277 90" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="228" y="78" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">max</text>
  <!-- pair 2: cells 4,5  x:283..381  center 332 -->
  <path d="M 283 90 Q 332 82 381 90" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="332" y="78" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">min</text>
  <!-- pair 3: cells 6,7  x:387..485  center 436 -->
  <path d="M 387 90 Q 436 82 485 90" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="436" y="78" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">max</text>

  <!-- 8 cells: width 46, gap 6, start x=75, y=96 -->
  <rect x="75" y="96" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="98" y="124" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="127" y="96" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="124" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="179" y="96" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="124" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <rect x="231" y="96" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="254" y="124" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="283" y="96" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="306" y="124" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <rect x="335" y="96" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="358" y="124" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">8</text>
  <rect x="387" y="96" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="124" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="439" y="96" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="462" y="124" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>

  <!-- index ticks -->
  <text x="98" y="158" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="150" y="158" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="202" y="158" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="254" y="158" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="306" y="158" text-anchor="middle" font-size="9" fill="#888">4</text>
  <text x="358" y="158" text-anchor="middle" font-size="9" fill="#888">5</text>
  <text x="410" y="158" text-anchor="middle" font-size="9" fill="#888">6</text>
  <text x="462" y="158" text-anchor="middle" font-size="9" fill="#888">7</text>

  <!-- fold arrows: pair center -> bottom cell i center -->
  <path d="M 124 146 L 98 232" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrGreen)" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 228 146 L 150 232" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrRed)" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 332 146 L 202 232" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrGreen)" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 436 146 L 254 232" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrRed)" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- ===== BOTTOM: in-place result (first 4 cells updated, last 4 discarded) ===== -->
  <text x="280" y="210" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">原地写回：结果落在前 n/2 格，后 n/2 格废弃</text>

  <!-- active result cells 0..3 -->
  <rect x="75" y="238" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="98" y="266" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="127" y="238" width="46" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="266" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">5</text>
  <rect x="179" y="238" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="202" y="266" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">4</text>
  <rect x="231" y="238" width="46" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="254" y="266" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">2</text>

  <!-- discarded cells 4..7 (grayed, strike-through) -->
  <rect x="283" y="238" width="46" height="46" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <rect x="335" y="238" width="46" height="46" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <rect x="387" y="238" width="46" height="46" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <rect x="439" y="238" width="46" height="46" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <text x="386" y="266" text-anchor="middle" font-size="10" fill="#999">废弃</text>

  <!-- index ticks bottom -->
  <text x="98" y="300" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="150" y="300" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="202" y="300" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="254" y="300" text-anchor="middle" font-size="9" fill="#888">3</text>

  <!-- write/read index hint -->
  <text x="75" y="316" font-size="9.5" fill="#446688">写 nums[i]</text>
  <text x="75" y="328" font-size="9.5" fill="#888">读 nums[2i], nums[2i+1]</text>

  <!-- ===== Bottom insight box ===== -->
  <rect x="30" y="332" width="500" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">关键：写位置 i ≤ 读位置 2i、2i+1，且 nums[i] 在配对 i÷2 时早已被消费 → 原地安全</text>
  <text x="280" y="366" text-anchor="middle" font-size="10.5" fill="#555">每轮长度减半，n + n/2 + … = 2n，O(n) 时间 / O(1) 额外空间</text>
</svg>
