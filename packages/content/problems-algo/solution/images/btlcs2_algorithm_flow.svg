<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">后序 DFS 返回 (inc, dec) 流程</text>

  <!-- dfs(node) -->
  <rect x="200" y="38" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="60" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">dfs(node)</text>

  <line x1="270" y1="72" x2="270" y2="90" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: node == null ? -->
  <polygon points="270,92 328,122 270,152 212,122" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="118" text-anchor="middle" font-size="12" fill="#333">node</text>
  <text x="270" y="133" text-anchor="middle" font-size="12" fill="#333">== null?</text>

  <!-- Yes -> return (0,0) -->
  <line x1="328" y1="122" x2="372" y2="122" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="348" y="116" text-anchor="middle" font-size="11" fill="#82b366">是</text>
  <rect x="376" y="104" width="120" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="436" y="126" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">return (0, 0)</text>

  <!-- No down -->
  <line x1="270" y1="152" x2="270" y2="172" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="164" font-size="11" fill="#b85450">否</text>

  <!-- (li,ld)=dfs(left); (ri,rd)=dfs(right) -->
  <rect x="120" y="174" width="300" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="196" text-anchor="middle" font-size="12" fill="#333">(li,ld)=dfs(left);  (ri,rd)=dfs(right)</text>

  <line x1="270" y1="210" x2="270" y2="228" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- inc = 1 + max(child.inc where child.val == node.val+1) -->
  <rect x="60" y="230" width="420" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="248" text-anchor="middle" font-size="11" fill="#333">inc = 1 + max(若 left.val=v+1 取 li, 若 right.val=v+1 取 ri)</text>
  <text x="270" y="263" text-anchor="middle" font-size="11" fill="#333">dec = 1 + max(若 left.val=v−1 取 ld, 若 right.val=v−1 取 rd)</text>

  <line x1="270" y1="270" x2="270" y2="288" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ans = max(ans, inc + dec - 1)  highlighted -->
  <rect x="100" y="290" width="340" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="308" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans = max(ans, inc + dec − 1)</text>
  <text x="270" y="323" text-anchor="middle" font-size="10" fill="#b85450">← 更新答案（每个节点都做，路径在此折弯）</text>

  <line x1="270" y1="330" x2="270" y2="348" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return (inc, dec) -->
  <rect x="180" y="350" width="180" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="372" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">return (inc, dec)</text>

  <!-- Bottom note -->
  <text x="270" y="404" text-anchor="middle" font-size="11" fill="#888">inc/dec：从 node 向下「严格 +1 / −1」的连续序列长度（节点数）</text>
</svg>
