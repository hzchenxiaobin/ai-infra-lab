<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#999999"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：平方 → 降序排序 → 按名额分桶求差</text>

  <rect x="215" y="30" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="12" filter="url(#rough2)"/>
  <text x="260" y="46" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>

  <path d="M 260 54 L 260 64" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="105" y="66" width="310" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="83" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① sq[i] = |nums[i]|²，一趟平方（符号蒸发）</text>

  <path d="M 260 92 L 260 102" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="104" width="240" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="121" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② 降序排序 sq（唯一热点 O(n log n)）</text>

  <path d="M 260 130 L 260 140" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="142" width="240" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="159" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ k = (n+1)/2，pos = neg = 0</text>

  <path d="M 260 168 L 260 178" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="180" width="240" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="197" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">④ i = 0 … n−1 逐项扫描</text>

  <path d="M 260 206 L 260 216" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 260 216 L 330 246 L 260 276 L 190 246 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="251" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i &lt; k ?</text>

  <!-- 是：进正桶 -->
  <path d="M 330 246 L 378 246" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="346" y="238" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="380" y="230" width="115" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="437" y="251" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">pos += sq[i]</text>

  <!-- 否：进负桶 -->
  <path d="M 190 246 L 142 246" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="158" y="238" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="25" y="230" width="115" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="82" y="251" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">neg += sq[i]</text>

  <!-- 回环：下一 i -->
  <path d="M 437 230 C 472 214, 468 196, 382 193" fill="none" stroke="#999999" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="474" y="212" text-anchor="end" font-size="9" fill="#999" filter="url(#rough2)">下一 i</text>
  <path d="M 82 230 C 48 214, 52 196, 138 193" fill="none" stroke="#999999" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="46" y="212" font-size="9" fill="#999" filter="url(#rough2)">下一 i</text>

  <!-- 汇合输出 -->
  <path d="M 437 262 C 437 294, 330 292, 285 308" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 82 262 C 82 294, 190 292, 235 308" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="308" width="220" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="12" filter="url(#rough2)"/>
  <text x="260" y="325" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">return pos − neg</text>

  <text x="16" y="352" font-size="10" fill="#999" filter="url(#rough2)">O(n log n) / O(n)：平方和上界 1.6×10¹⁴，C++ 必须 long long</text>
</svg>
