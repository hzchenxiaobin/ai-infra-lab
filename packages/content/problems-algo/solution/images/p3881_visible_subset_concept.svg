<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="4.5" refY="7.5" orient="auto">
      <path d="M0,0 L4.5,7.5 L9,0 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：可见集合直接指定，其余方向被唯一强制</text>

  <!-- 视线弧：从各人头顶弯向 pos（n=7, pos=3, k=2 示意） -->
  <path d="M 83 52 Q 170 24 250 52" fill="none" stroke="#b0b0b0" stroke-width="1.3" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <path d="M 141 52 Q 199 26 250 52" fill="none" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 199 52 Q 225 30 248 52" fill="none" stroke="#b0b0b0" stroke-width="1.3" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <path d="M 315 52 Q 287 30 266 52" fill="none" stroke="#b0b0b0" stroke-width="1.3" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <path d="M 373 52 Q 315 26 264 52" fill="none" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <path d="M 431 52 Q 344 24 266 52" fill="none" stroke="#b0b0b0" stroke-width="1.3" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- 一排人：下标 0..6，pos=3 -->
  <rect x="57" y="52" width="52" height="38" rx="6" fill="#f0f0f0" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="83" y="77" text-anchor="middle" font-size="14" fill="#777" filter="url(#rough2)">R</text>

  <rect x="115" y="52" width="52" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="141" y="77" text-anchor="middle" font-size="14" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">L</text>

  <rect x="173" y="52" width="52" height="38" rx="6" fill="#f0f0f0" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="199" y="77" text-anchor="middle" font-size="14" fill="#777" filter="url(#rough2)">R</text>

  <rect x="231" y="52" width="52" height="38" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="257" y="72" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">pos</text>
  <text x="257" y="86" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">L / R ?</text>

  <rect x="289" y="52" width="52" height="38" rx="6" fill="#f0f0f0" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="315" y="77" text-anchor="middle" font-size="14" fill="#777" filter="url(#rough2)">L</text>

  <rect x="347" y="52" width="52" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="373" y="77" text-anchor="middle" font-size="14" fill="#33506b" font-weight="bold" filter="url(#rough2)">R</text>

  <rect x="405" y="52" width="52" height="38" rx="6" fill="#f0f0f0" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="431" y="77" text-anchor="middle" font-size="14" fill="#777" filter="url(#rough2)">L</text>

  <!-- 下标标注 -->
  <text x="83" y="102" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">0</text>
  <text x="141" y="102" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">1</text>
  <text x="199" y="102" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">2</text>
  <text x="257" y="102" text-anchor="middle" font-size="9" fill="#8a6d1f" filter="url(#rough2)">3</text>
  <text x="315" y="102" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">4</text>
  <text x="373" y="102" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">5</text>
  <text x="431" y="102" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">6</text>

  <!-- 可见性标注 -->
  <text x="83" y="118" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">✗ 不可见</text>
  <text x="141" y="118" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓ 可见</text>
  <text x="199" y="118" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">✗</text>
  <text x="257" y="118" text-anchor="middle" font-size="9.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">×2 自由</text>
  <text x="315" y="118" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">✗</text>
  <text x="373" y="118" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">✓ 可见</text>
  <text x="431" y="118" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">✗</text>

  <!-- 左右分区标注 -->
  <path d="M 57 130 Q 199 140 341 130" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="140" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">左侧 a 人：可见 ⟺ 选 L</text>
  <path d="M 289 130 Q 368 140 447 130" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="404" y="152" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">右侧 b 人：可见 ⟺ 选 R</text>

  <!-- 双射说明框 -->
  <rect x="48" y="158" width="424" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="178" text-anchor="middle" font-size="11" fill="#8f3a34" font-weight="bold" filter="url(#rough2)">双射：方向分配 ⟺ 可见集合 S（|S| = k）+ pos 自身方向</text>
  <text x="260" y="196" text-anchor="middle" font-size="10" fill="#8f3a34" filter="url(#rough2)">S 内：左侧选 L、右侧选 R；S 外：左侧选 R、右侧选 L —— 每人被唯一强制</text>

  <!-- 公式框 -->
  <rect x="100" y="226" width="320" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="254" text-anchor="middle" font-size="15" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">答案 = C(n−1, k) × 2</text>

  <!-- 范德蒙德框 -->
  <rect x="58" y="284" width="404" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="305" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">分侧路线：2 · Σ C(a,i) · C(b,k−i) = 2 · C(a+b, k)</text>
  <text x="260" y="324" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">范德蒙德卷积 —— a + b = n − 1，闭式里 pos 消失（烟雾弹）</text>

  <!-- 图例 -->
  <text x="58" y="352" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">━ 实线：可见（左侧 L / 右侧 R）</text>
  <text x="286" y="352" font-size="9.5" fill="#999" filter="url(#rough2)">╌ 虚线：不可见（方向反向即被强制）</text>
</svg>
