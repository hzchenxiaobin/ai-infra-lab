<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">示例演算：arr=[1,2,3]  fn=(n,i) =&gt; n+i</text>

  <!-- column x boundaries: 20,70,120,200,300,420,540 -->
  <!-- widths: step 50, i 50, arr[i] 80, fn 100, res 120 -->

  <!-- header -->
  <rect x="20" y="46" width="520" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="45" y="65" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">步</text>
  <text x="95" y="65" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i</text>
  <text x="160" y="65" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">arr[i]</text>
  <text x="250" y="65" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">fn(arr[i], i)</text>
  <text x="470" y="65" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">res</text>

  <!-- vertical grid lines -->
  <line x1="70" y1="46" x2="70" y2="258" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="120" y1="46" x2="120" y2="258" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="200" y1="46" x2="200" y2="258" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="300" y1="46" x2="300" y2="258" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 0 init -->
  <rect x="20" y="76" width="520" height="30" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="45" y="96" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">init</text>
  <text x="95" y="96" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">–</text>
  <text x="160" y="96" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">–</text>
  <text x="250" y="96" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">–</text>
  <text x="470" y="96" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">[]</text>

  <!-- row 1 -->
  <rect x="20" y="106" width="520" height="30" fill="#f7f7f7" stroke="#ddd" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="45" y="126" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="95" y="126" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="160" y="126" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="250" y="126" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">1 + 0 = 1</text>
  <text x="470" y="126" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">[1]</text>

  <!-- row 2 -->
  <rect x="20" y="136" width="520" height="30" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="45" y="156" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="95" y="156" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="160" y="156" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="250" y="156" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">2 + 1 = 3</text>
  <text x="470" y="156" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">[1, 3]</text>

  <!-- row 3 -->
  <rect x="20" y="166" width="520" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
  <text x="45" y="186" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="95" y="186" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="160" y="186" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="250" y="186" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">3 + 2 = 5</text>
  <text x="470" y="186" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">[1, 3, 5]</text>

  <line x1="20" y1="208" x2="540" y2="208" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="280" y="236" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">最终结果 = [1, 3, 5]</text>

  <!-- annotation -->
  <rect x="60" y="258" width="440" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="280" y="278" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">fn 同时拿到元素值 arr[i] 和下标 i</text>
  <text x="280" y="296" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">每步独立写入 res[i]，无跨元素依赖</text>
</svg>
