<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>

  <!-- Title -->
  <text x="360" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：按日期排序后，价格序列须「严格」递增</text>
  <text x="360" y="42" text-anchor="middle" font-size="10.5" fill="#888">price[i] &gt; price[i−1] 对每对相邻订单成立；任一 price ≤ prev_price 即不合格</text>

  <!-- ============ Customer 1 (5 orders, strictly increasing) ============ -->
  <text x="30" y="96" font-size="11.5" fill="#666" font-weight="bold">客户 1</text>
  <text x="30" y="110" font-size="9.5" fill="#999">5 单</text>

  <!-- 5 blocks: 1100 1200 3000 3100 4700 -->
  <rect x="110" y="78" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="138" y="100" text-anchor="middle" font-size="11" fill="#333">1100</text>

  <rect x="186" y="78" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="214" y="100" text-anchor="middle" font-size="11" fill="#333">1200</text>

  <rect x="262" y="78" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="290" y="100" text-anchor="middle" font-size="11" fill="#333">3000</text>

  <rect x="338" y="78" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="366" y="100" text-anchor="middle" font-size="11" fill="#333">3100</text>

  <rect x="414" y="78" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="442" y="100" text-anchor="middle" font-size="11" fill="#333">4700</text>

  <!-- up arrows between blocks (increasing) -->
  <text x="176" y="86" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">↑</text>
  <text x="252" y="86" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">↑</text>
  <text x="328" y="86" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">↑</text>
  <text x="404" y="86" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">↑</text>

  <text x="494" y="100" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 合格</text>

  <!-- ============ Customer 2 (2 orders, increasing) ============ -->
  <text x="30" y="171" font-size="11.5" fill="#666" font-weight="bold">客户 2</text>
  <text x="30" y="185" font-size="9.5" fill="#999">2 单</text>

  <rect x="110" y="153" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="138" y="175" text-anchor="middle" font-size="11" fill="#333">700</text>

  <rect x="186" y="153" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="214" y="175" text-anchor="middle" font-size="11" fill="#333">1000</text>

  <text x="176" y="161" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">↑</text>
  <text x="264" y="175" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 合格</text>

  <!-- ============ Customer 3 (2 orders, EQUAL → violation) ============ -->
  <text x="30" y="246" font-size="11.5" fill="#666" font-weight="bold">客户 3</text>
  <text x="30" y="260" font-size="9.5" fill="#999">2 单</text>

  <rect x="110" y="228" width="56" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="138" y="250" text-anchor="middle" font-size="11" fill="#333">900</text>

  <rect x="186" y="228" width="56" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="214" y="250" text-anchor="middle" font-size="11" fill="#333">900</text>

  <!-- equal marker (flat, NOT strictly greater) -->
  <text x="176" y="240" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">=</text>
  <text x="176" y="282" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">900 ≤ 900 违反</text>

  <text x="264" y="250" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 不合格</text>

  <!-- arrow from customer3 violation to the rule -->
  <path d="M 176 290 L 176 312" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Bottom explanation box -->
  <rect x="40" y="316" width="640" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="360" y="336" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">「严格」(strictly) 的含义：price[i] &gt; price[i−1]，严格大于</text>
  <text x="360" y="354" text-anchor="middle" font-size="10.5" fill="#555">客户 3：900 = 900（相等，不满足「&gt;」）→ 违反一条相邻对 → 整客户不合格</text>
  <text x="360" y="372" text-anchor="middle" font-size="10.5" fill="#555">客户 1/2：所有相邻对都更大 → 全程严格递增 → 合格</text>

  <!-- Footer -->
  <text x="360" y="404" text-anchor="middle" font-size="10" fill="#999">每位客户的订单按 (order_date, order_id) 排序成序列；只比较相邻对即可（见 2.2 充分性）</text>
  <text x="360" y="420" text-anchor="middle" font-size="9.5" fill="#bbb">单订单客户无相邻对 → 无违反 → 天然合格（边界见 §5）</text>
</svg>
