<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：外层逐字符，内层转轮到目标字符为止</text>

  <!-- 开始 -->
  <rect x="170" y="32" width="180" height="30" rx="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="51" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">开始：s = ""，res = []</text>
  <path d="M 260 62 L 260 72" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 取字符 -->
  <rect x="160" y="74" width="200" height="30" fill="#ffffff" stroke="#888888" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="93" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">取 target 的下一个字符 c</text>
  <path d="M 260 104 L 260 112" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 按键1 -->
  <rect x="150" y="114" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="133" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">按键 1：s += 'a'；记录 s</text>
  <path d="M 260 144 L 260 168" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 判断：末位==c？ -->
  <polygon points="180,212 260,172 340,212 260,252" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="209" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">s 的末位</text>
  <text x="260" y="224" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">== c ？</text>

  <text x="346" y="204" font-size="9" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 340 212 L 354 212" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 按键2 -->
  <rect x="356" y="194" width="152" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="432" y="209" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">按键 2：末位 +1</text>
  <text x="432" y="224" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">'z' 绕回 'a'；记录 s</text>

  <!-- 按键2 循环回去 -->
  <path d="M 432 194 L 432 158 L 148 158 L 148 212 L 174 212" fill="none" stroke="#a07830" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="153" font-size="9" fill="#a07830" filter="url(#rough2)">转到位为止（内层循环）</text>

  <!-- 是 -->
  <text x="268" y="266" font-size="9" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 260 252 L 260 268" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 判断：遍历完？ -->
  <polygon points="172,308 260,272 348,308 260,344" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="305" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">target</text>
  <text x="260" y="320" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">遍历完？</text>

  <!-- 否：回到取字符 -->
  <text x="152" y="300" font-size="9" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 172 308 L 92 308 L 92 89 L 154 89" fill="none" stroke="#a07830" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="96" y="80" font-size="9" fill="#888888" filter="url(#rough2)">回到取字符</text>

  <!-- 是：结束 -->
  <text x="268" y="354" font-size="9" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 260 344 L 260 352" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="140" y="354" width="240" height="34" rx="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="369" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 res</text>
  <text x="260" y="383" text-anchor="middle" font-size="9" fill="#4a4a4a" filter="url(#rough2)">共 n + Σ(ord(c) − 97) 个字符串</text>
</svg>
