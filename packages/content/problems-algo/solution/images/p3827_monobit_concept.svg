<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- 总标题 -->
  <text x="30" y="34" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">核心：单比特数只有「0」和「全 1 数 2^k − 1」</text>

  <!-- ① 0..7 的二进制 -->
  <text x="30" y="66" font-size="13" fill="#446688" filter="url(#rough2)">① 逐个看 0..7 的二进制：全 0 的只有 0，全 1 的是 1、3、7</text>

  <rect x="30" y="80" width="48" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="54" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="54" y="134" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">0</text>

  <rect x="93" y="80" width="48" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="117" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="117" y="134" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">1</text>

  <rect x="156" y="80" width="48" height="38" rx="4" fill="#ffffff" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="180" y="104" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">10</text>
  <text x="180" y="134" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">2</text>

  <rect x="219" y="80" width="48" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="243" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">11</text>
  <text x="243" y="134" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">3</text>

  <rect x="282" y="80" width="48" height="38" rx="4" fill="#ffffff" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="306" y="104" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">100</text>
  <text x="306" y="134" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">4</text>

  <rect x="345" y="80" width="48" height="38" rx="4" fill="#ffffff" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="369" y="104" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">101</text>
  <text x="369" y="134" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">5</text>

  <rect x="408" y="80" width="48" height="38" rx="4" fill="#ffffff" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="432" y="104" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">110</text>
  <text x="432" y="134" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">6</text>

  <rect x="471" y="80" width="48" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="495" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">111</text>
  <text x="495" y="134" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">7</text>

  <!-- 关键理由 -->
  <text x="30" y="160" font-size="12.5" fill="#b85450" filter="url(#rough2)">正整数无前导零 → 最高位必为 1 →「各位都相同」⇔「各位全是 1」</text>

  <!-- ② 候选序列 -->
  <text x="30" y="192" font-size="13" fill="#446688" filter="url(#rough2)">② 候选序列（每个 = 前一个 ×2 + 1）：</text>

  <rect x="30" y="206" width="46" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="53" y="228" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">0</text>

  <path d="M 78 223 L 93 223" stroke="#999" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="97" y="206" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="228" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <path d="M 145 223 L 160 223" stroke="#999" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="164" y="206" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="187" y="228" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>

  <path d="M 212 223 L 227 223" stroke="#999" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="231" y="206" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="254" y="228" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>

  <path d="M 279 223 L 294 223" stroke="#999" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="298" y="206" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="321" y="228" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">15</text>

  <path d="M 346 223 L 361 223" stroke="#999" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="365" y="206" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="388" y="228" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">31</text>

  <path d="M 413 223 L 428 223" stroke="#999" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="432" y="206" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="455" y="228" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">63</text>

  <text x="496" y="228" font-size="14" fill="#999" filter="url(#rough2)">…</text>

  <!-- ③ 结论 -->
  <text x="30" y="272" font-size="13" fill="#446688" filter="url(#rough2)">③ 答案 = 满足 2^k − 1 ≤ n 的 k 的个数（k = 0 即数 0）：</text>

  <rect x="30" y="286" width="250" height="72" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="155" y="308" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">枚举法：ans 从 1 起步（先数 0）</text>
  <text x="155" y="328" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">m = 1, 3, 7, 15, … 只要 m ≤ n 就计数</text>
  <text x="155" y="348" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">循环 ⌊log₂(n+1)⌋ 次，n=1000 仅 10 次</text>

  <rect x="300" y="286" width="230" height="72" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="415" y="308" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">闭式：答案 = ⌊log₂(n+1)⌋ + 1</text>
  <text x="415" y="328" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">n = 4 → 3；n = 1000 → 10</text>
  <text x="415" y="348" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">Python：(n+1).bit_length()</text>

  <!-- 脚注 -->
  <text x="30" y="384" font-size="11.5" fill="#888" filter="url(#rough2)">判定式（互为镜像）：2 的幂 x &amp;(x−1)=0；全 1 数 x &amp;(x+1)=0</text>
</svg>
