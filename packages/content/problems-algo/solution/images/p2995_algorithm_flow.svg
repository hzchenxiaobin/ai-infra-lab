<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：RANK 打标 → 资格判定 → 内连接计数 → 分组排序</text>

  <!-- 左侧流水线 -->
  <rect x="36" y="44" width="252" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="162" y="62" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 窗口打标（每行标注第几场）</text>
  <text x="162" y="78" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">RANK() OVER (PARTITION BY user_id</text>
  <text x="162" y="90" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">ORDER BY session_start) → rk</text>

  <path d="M 162 96 L 162 106" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="36" y="110" width="252" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="162" y="126" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">② 圈定观众出身</text>
  <text x="162" y="141" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">rk = 1 AND type = 'Viewer'</text>

  <path d="M 162 150 L 162 160" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="36" y="164" width="252" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="162" y="182" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">③ 内连接主播行</text>
  <text x="162" y="198" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">JOIN Sessions ON user_id</text>
  <text x="162" y="210" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">WHERE s.type = 'Streamer'</text>

  <path d="M 162 216 L 162 226" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="36" y="228" width="252" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="162" y="244" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">④ 分组计数</text>
  <text x="162" y="259" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">GROUP BY user_id → COUNT(*)</text>

  <path d="M 162 268 L 162 278" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="36" y="280" width="252" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="162" y="296" text-anchor="middle" font-size="11.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">⑤ 双键降序输出</text>
  <text x="162" y="311" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">ORDER BY sessions_count DESC, user_id DESC</text>

  <!-- 右侧注记：并列提醒 -->
  <rect x="312" y="48" width="192" height="88" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <text x="408" y="68" text-anchor="middle" font-size="11" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">⚠ 并列（tie）提醒</text>
  <text x="408" y="88" text-anchor="middle" font-size="9.8" fill="#8f3a36" filter="url(#rough2)">RANK：并列最早都算首场</text>
  <text x="408" y="104" text-anchor="middle" font-size="9.8" fill="#8f3a36" filter="url(#rough2)">ROW_NUMBER：任意取一行</text>
  <text x="408" y="122" text-anchor="middle" font-size="9.8" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">→ 加 tie-breaker 保确定</text>

  <!-- 右侧注记：内连接的隐藏过滤 -->
  <rect x="312" y="152" width="192" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="408" y="172" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">内连接的隐藏过滤</text>
  <text x="408" y="192" text-anchor="middle" font-size="9.8" fill="#2f5d24" filter="url(#rough2)">观众出身但 0 场主播</text>
  <text x="408" y="208" text-anchor="middle" font-size="9.8" fill="#2f5d24" filter="url(#rough2)">（user 104）配不到任何</text>
  <text x="408" y="224" text-anchor="middle" font-size="9.8" fill="#2f5d24" filter="url(#rough2)">主播行 → 整组消失</text>
  <text x="408" y="242" text-anchor="middle" font-size="9.8" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">=「计 0 不输出」</text>

  <!-- 右侧注记：干扰列 -->
  <rect x="312" y="268" width="192" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="408" y="288" text-anchor="middle" font-size="11" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">干扰列</text>
  <text x="408" y="306" text-anchor="middle" font-size="9.8" fill="#7a5a10" filter="url(#rough2)">session_end / 会话时长</text>
  <text x="408" y="320" text-anchor="middle" font-size="9.8" fill="#7a5a10" filter="url(#rough2)">本题全程未用上</text>
</svg>
