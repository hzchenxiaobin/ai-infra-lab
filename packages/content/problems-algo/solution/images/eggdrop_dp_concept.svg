<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">在楼层 x 扔蛋：最坏情况 = 1 + max(碎了, 没碎) 两个子问题</text>

  <!-- floor strip: floors 1..7, floor x=4 highlighted -->
  <text x="70" y="78" font-size="11" fill="#888">楼层:</text>
  <rect x="110" y="62" width="42" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="131" y="82" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="152" y="62" width="42" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="173" y="82" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="194" y="62" width="42" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="215" y="82" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="236" y="62" width="42" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="257" y="82" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">x</text>
  <rect x="278" y="62" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="299" y="82" text-anchor="middle" font-size="11" fill="#333">x+1</text>
  <rect x="320" y="62" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="341" y="82" text-anchor="middle" font-size="9" fill="#888">…</text>
  <rect x="362" y="62" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="383" y="82" text-anchor="middle" font-size="11" fill="#333">n</text>

  <!-- egg above floor x -->
  <ellipse cx="257" cy="50" rx="7" ry="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 257 59 L 257 62" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="257" y="44" text-anchor="middle" font-size="9" fill="#d6a040">扔蛋</text>

  <!-- region labels -->
  <path d="M 110 96 Q 131 104 152 96" stroke="#b85450" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="131" y="116" text-anchor="middle" font-size="9" fill="#b85450">x−1 层(碎)</text>
  <path d="M 278 96 Q 320 104 362 96" stroke="#4a7a3a" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="320" y="116" text-anchor="middle" font-size="9" fill="#4a7a3a">n−x 层(没碎)</text>

  <!-- two branch arrows -->
  <path d="M 230 124 Q 160 138 135 150" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 284 124 Q 360 138 385 150" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- left branch: 碎了 -->
  <rect x="40" y="150" width="190" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="135" y="172" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">碎了 ↑</text>
  <text x="135" y="194" text-anchor="middle" font-size="11" fill="#444">剩 k−1 枚蛋</text>
  <text x="135" y="214" text-anchor="middle" font-size="11" fill="#444">搜索下方 x−1 层</text>
  <text x="135" y="234" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">子问题 = dp[k−1][x−1]</text>

  <!-- right branch: 没碎 -->
  <rect x="290" y="150" width="190" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="385" y="172" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">没碎 ↑</text>
  <text x="385" y="194" text-anchor="middle" font-size="11" fill="#444">仍剩 k 枚蛋</text>
  <text x="385" y="214" text-anchor="middle" font-size="11" fill="#444">搜索上方 n−x 层</text>
  <text x="385" y="234" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">子问题 = dp[k][n−x]</text>

  <!-- merge arrows -->
  <path d="M 135 242 Q 135 256 200 264" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="4,2" filter="url(#rough2)"/>
  <path d="M 385 242 Q 385 256 320 264" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="4,2" filter="url(#rough2)"/>
  <text x="260" y="260" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">取最坏 + 枚举 x 取最小</text>

  <!-- equation box -->
  <rect x="40" y="272" width="440" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="294" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">dp[k][n] = 1 + min  max( dp[k−1][x−1] , dp[k][n−x] )</text>
  <text x="300" y="311" text-anchor="middle" font-size="10" fill="#888">1≤x≤n</text>
  <text x="260" y="330" text-anchor="middle" font-size="10" fill="#888">「这一手 +1」＋「两个子问题取最坏」＋「所有楼层取最优」</text>
</svg>
