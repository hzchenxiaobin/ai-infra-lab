<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 490" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="490" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [0,1,1,0,1]，四次后缀翻转全变 1</text>

  <text x="120" y="54" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="174" y="54" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="228" y="54" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="282" y="54" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="336" y="54" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">4</text>

  <text x="88" y="83" text-anchor="end" font-size="10.5" fill="#555" filter="url(#rough2)">初始</text>
  <rect x="96" y="58" width="48" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="84" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="150" y="58" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="174" y="84" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">1</text>
  <rect x="204" y="58" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="228" y="84" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">1</text>
  <rect x="258" y="58" width="48" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="282" y="84" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">0</text>
  <rect x="312" y="58" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="336" y="84" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">1</text>
  <path d="M 96 104 v 10 h 264 v -10" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="6 3" filter="url(#rough2)"/>
  <text x="228" y="132" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">从 i=0 发起：翻转 [0..4]</text>
  <text x="376" y="72" font-size="9.5" fill="#555" filter="url(#rough2)">i=0: 0⊕flip(0)=0</text>
  <text x="376" y="88" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ 翻！ans=1</text>

  <text x="88" y="165" text-anchor="end" font-size="10.5" fill="#555" filter="url(#rough2)">第①步后</text>
  <rect x="96" y="140" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="166" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">1</text>
  <rect x="150" y="140" width="48" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="174" y="166" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="204" y="140" width="48" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="228" y="166" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">0</text>
  <rect x="258" y="140" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="282" y="166" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">1</text>
  <rect x="312" y="140" width="48" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="336" y="166" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">0</text>
  <path d="M 150 186 v 10 h 210 v -10" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="6 3" filter="url(#rough2)"/>
  <text x="255" y="214" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">从 i=1 发起：翻转 [1..4]</text>
  <text x="376" y="154" font-size="9.5" fill="#555" filter="url(#rough2)">i=1: 1⊕flip(1)=0</text>
  <text x="376" y="170" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ 翻！ans=2</text>

  <text x="88" y="247" text-anchor="end" font-size="10.5" fill="#555" filter="url(#rough2)">第②步后</text>
  <rect x="96" y="222" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="248" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">1</text>
  <rect x="150" y="222" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="174" y="248" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">1</text>
  <rect x="204" y="222" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="228" y="248" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">1</text>
  <rect x="258" y="222" width="48" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="282" y="248" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="312" y="222" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="336" y="248" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">1</text>
  <path d="M 258 268 v 10 h 102 v -10" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="6 3" filter="url(#rough2)"/>
  <text x="309" y="296" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">从 i=3 发起：翻转 [3..4]</text>
  <text x="376" y="236" font-size="9.5" fill="#555" filter="url(#rough2)">i=2: 1⊕0=1 跳过</text>
  <text x="376" y="252" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">i=3: 0⊕0=0 → ans=3</text>

  <text x="88" y="329" text-anchor="end" font-size="10.5" fill="#555" filter="url(#rough2)">第③步后</text>
  <rect x="96" y="304" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="330" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">1</text>
  <rect x="150" y="304" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="174" y="330" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">1</text>
  <rect x="204" y="304" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="228" y="330" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">1</text>
  <rect x="258" y="304" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="282" y="330" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">1</text>
  <rect x="312" y="304" width="48" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="336" y="330" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <path d="M 312 350 v 10 h 48 v -10" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="6 3" filter="url(#rough2)"/>
  <text x="336" y="378" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">从 i=4 发起：翻转 [4..4]</text>
  <text x="376" y="318" font-size="9.5" fill="#555" filter="url(#rough2)">i=4: 1⊕1=0</text>
  <text x="376" y="334" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ 翻！ans=4</text>

  <text x="88" y="411" text-anchor="end" font-size="10.5" fill="#555" filter="url(#rough2)">第④步后</text>
  <rect x="92" y="382" width="272" height="48" rx="10" fill="none" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="6 3" filter="url(#rough2)"/>
  <rect x="96" y="386" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="412" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">1</text>
  <rect x="150" y="386" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="174" y="412" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">1</text>
  <rect x="204" y="386" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="228" y="412" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">1</text>
  <rect x="258" y="386" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="282" y="412" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">1</text>
  <rect x="312" y="386" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="336" y="412" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">1</text>
  <text x="376" y="404" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">全部为 1 ✓</text>
  <text x="376" y="420" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans=4</text>

  <text x="260" y="458" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">有效值 = 原始 nums[i] ⊕ 已发起操作数的奇偶 flip；被翻乱的位等轮到自己时再决策，</text>
  <text x="260" y="474" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">前缀一旦修好永不再回看 —— 与官方解释的操作顺序不同不要紧，翻转与顺序无关</text>
</svg>
