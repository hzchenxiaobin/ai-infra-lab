<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：计数法（左） vs 队列模拟法（右）</text>

  <!-- ===== Left column: counting method ===== -->
  <rect x="24" y="40" width="232" height="324" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="140" y="60" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">计数法 O(n) / O(1)</text>

  <!-- step 1: count -->
  <rect x="48" y="74" width="184" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="140" y="96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">统计 cnt0 / cnt1</text>
  <path d="M 140 108 L 140 120" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2: for each sandwich -->
  <rect x="48" y="122" width="184" height="34" fill="#fff" stroke="#666" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="140" y="144" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">取下一个三明治 t</text>
  <path d="M 140 156 L 140 170" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision: cnt[t] > 0 ? -->
  <polygon points="140,172 210,206 140,240 70,206" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="204" text-anchor="middle" font-size="11" fill="#2a5a1a" filter="url(#rough2)">cnt[t] &gt; 0 ?</text>
  <text x="140" y="218" text-anchor="middle" font-size="10" fill="#2a5a1a" filter="url(#rough2)">（t 类型还有人）</text>

  <!-- yes branch: cnt[t]--, loop back -->
  <path d="M 210 206 C 248 206, 248 140, 232 140" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="246" y="180" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="208" y="150" width="34" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="225" y="164" text-anchor="middle" font-size="9.5" fill="#2a5a1a" filter="url(#rough2)">cnt[t]−−</text>

  <!-- no branch: break -->
  <path d="M 140 240 L 140 256" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="150" y="252" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="60" y="258" width="160" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="140" y="276" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">break（栈顶卡住）</text>
  <path d="M 140 286 L 140 300" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return -->
  <rect x="48" y="302" width="184" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="140" y="324" text-anchor="middle" font-size="11.5" fill="#5a4a1a" font-weight="bold" filter="url(#rough2)">return cnt0 + cnt1</text>
  <text x="140" y="348" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">扫描一趟三明治即止</text>

  <!-- ===== Right column: simulation method ===== -->
  <rect x="284" y="40" width="232" height="324" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="400" y="60" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">队列模拟法 O(n²) / O(n)</text>

  <!-- step 1: init queue -->
  <rect x="308" y="74" width="184" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="400" y="96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">队列 q ← students, i = 0</text>
  <path d="M 400 108 L 400 120" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2: check front -->
  <rect x="308" y="122" width="184" height="34" fill="#fff" stroke="#666" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="400" y="144" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">看队首 q.front()</text>
  <path d="M 400 156 L 400 170" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision: front == top ? -->
  <polygon points="400,172 470,206 400,240 330,206" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="400" y="204" text-anchor="middle" font-size="11" fill="#2a5a1a" filter="url(#rough2)">front == sandwiches[i] ?</text>
  <text x="400" y="218" text-anchor="middle" font-size="10" fill="#2a5a1a" filter="url(#rough2)">（喜好匹配栈顶）</text>

  <!-- yes branch: pop + i++, rotations=0 -->
  <path d="M 470 206 C 506 206, 506 150, 492 150" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="504" y="180" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="470" y="148" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="490" y="163" text-anchor="middle" font-size="9" fill="#2a5a1a" filter="url(#rough2)">出队,i++</text>

  <!-- no branch: rotate + check full circle -->
  <path d="M 400 240 L 400 256" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="410" y="252" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="320" y="258" width="160" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="400" y="276" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">队首→队尾, rotations++</text>
  <path d="M 400 286 L 400 298" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision2: rotations == len(q)? (compact) -->
  <rect x="320" y="300" width="160" height="20" fill="#fff" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="400" y="314" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">rotations == |q| ? 停 : 继续</text>

  <!-- return -->
  <rect x="308" y="326" width="184" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="400" y="346" text-anchor="middle" font-size="11.5" fill="#5a4a1a" font-weight="bold" filter="url(#rough2)">return q.size()</text>

  <!-- footer comparison -->
  <text x="270" y="372" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">计数法用“类型计数”替代“逐个轮转”，把整圈空转压成一趟扫描</text>
</svg>
