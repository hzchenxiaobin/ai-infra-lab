<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：一遍扫描——先判 -1，再数层数</text>

  <!-- 开始 -->
  <rect x="165" y="38" width="190" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="60" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">开始：拿到 nums 和 k</text>
  <path d="M 260 72 L 260 92" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="260,96 350,140 260,184 170,140" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="136" text-anchor="middle" font-size="12" fill="#a07830" font-weight="bold" filter="url(#rough2)">min(nums) &lt; k ?</text>
  <text x="260" y="154" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">（有救不回来的小值吗）</text>

  <!-- 是：向左返回 -1 -->
  <text x="156" y="132" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 170 140 L 148 140" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="22" y="116" width="124" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="84" y="137" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 -1</text>
  <text x="84" y="154" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">操作只降不升</text>

  <!-- 否：向下 -->
  <text x="272" y="200" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 260 184 L 260 212" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- 收集不同值 -->
  <rect x="135" y="216" width="250" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="234" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">seen ← nums 中出现过的值</text>
  <text x="260" y="250" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">（哈希集合 / 值域位图，重复值只留一份）</text>
  <path d="M 260 258 L 260 282" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 计数 -->
  <rect x="125" y="286" width="270" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="304" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">ans ← #{ v ∈ seen : v &gt; k }</text>
  <text x="260" y="320" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">（严格大于 k 的层，等于 k 的不算）</text>
  <path d="M 260 328 L 260 352" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 返回 -->
  <rect x="165" y="356" width="190" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="380" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 ans ✓</text>

  <!-- 底注 -->
  <text x="260" y="410" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">哈希集合版 O(n) 空间 O(min(n,V))；位图版 O(n+V)——无需排序、无需模拟</text>
</svg>
