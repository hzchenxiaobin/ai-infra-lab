<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 390"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="390" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：一次分类讨论 + 一个公式</text>

  <!-- 开始 -->
  <rect x="212" y="38" width="96" height="26" rx="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="55" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">开始</text>
  <path d="M 260 64 L 260 74" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断：两根都装得下吗 -->
  <polygon points="260,78 386,112 260,146 134,112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">n ≤ k</text>
  <text x="260" y="124" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">且 m ≤ k ?</text>

  <!-- 是 → return 0 -->
  <text x="120" y="100" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 134 112 L 84 112 L 84 216" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="22" y="220" width="124" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="84" y="239" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">return 0 ✓</text>
  <text x="84" y="257" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">两根直接各上一辆车</text>

  <!-- 否 → 找超限木材 -->
  <text x="268" y="160" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 260 146 L 260 158" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="162" width="220" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">x ← 超过 k 的那根木材</text>
  <text x="260" y="198" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">走到这里恰有一根超限（题目保证有解）</text>
  <path d="M 260 208 L 260 220" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 返回公式 -->
  <rect x="150" y="224" width="220" height="50" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="245" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">return k × (x − k)</text>
  <text x="260" y="264" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">切点取可行域 [x−k, k] 的端点：两段为 k 与 x−k</text>

  <!-- 两个注记 -->
  <rect x="40" y="296" width="215" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="147" y="314" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">为什么恰有一根超限？</text>
  <text x="147" y="330" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">两根都 &gt; k 需至少两刀 → 4 段</text>
  <text x="147" y="344" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">&gt; 3 辆卡车，无解，题目已排除</text>

  <rect x="275" y="296" width="215" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="382" y="314" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">⚠️ 溢出提醒</text>
  <text x="382" y="330" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">乘积上界 10⁵ × 10⁵ = 10¹⁰</text>
  <text x="382" y="344" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">超 int32，C++ 用 long long 接住</text>

  <text x="260" y="378" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">整个算法 O(1)：一次比较 + 一次乘法</text>
</svg>
