<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">单节点翻转规则：父节点 → 左子位</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">处理路径节点 cur：腾出左子位，把原父 p 放进去</text>

  <!-- ===== LEFT: before ===== -->
  <text x="155" y="78" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">翻转前</text>

  <!-- p (parent, above cur) -->
  <circle cx="155" cy="118" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="155" y="122" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">p</text>
  <text x="180" y="116" font-size="10" fill="#d6a040">原父</text>

  <!-- edge p -> cur -->
  <line x1="155" y1="135" x2="155" y2="170" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- cur -->
  <circle cx="155" cy="188" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="155" y="192" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">cur</text>
  <text x="190" y="186" font-size="10" fill="#446688">当前节点</text>

  <!-- cur's left child A (off-path) -->
  <line x1="142" y1="202" x2="115" y2="232" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="108" cy="246" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="108" y="250" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">A</text>
  <text x="74" y="270" font-size="9" fill="#4a7a3a">cur 的左子</text>
  <text x="74" y="281" font-size="9" fill="#888">(非路径子树)</text>

  <!-- note: at most one child -->
  <rect x="50" y="300" width="210" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="155" y="318" text-anchor="middle" font-size="10" fill="#333">保证：处理 cur 时</text>
  <text x="155" y="332" text-anchor="middle" font-size="10" fill="#333">cur 至多只有一个子节点</text>

  <!-- ===== MIDDLE: big arrow ===== -->
  <path d="M 270 190 L 330 190" stroke="#b85450" stroke-width="2.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="300" y="180" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">翻转</text>

  <!-- step labels near arrow -->
  <text x="300" y="206" text-anchor="middle" font-size="9" fill="#888">步骤1: left→right</text>
  <text x="300" y="218" text-anchor="middle" font-size="9" fill="#888">步骤2: p→left</text>

  <!-- ===== RIGHT: after ===== -->
  <text x="445" y="78" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">翻转后</text>

  <!-- cur (now upper) -->
  <circle cx="445" cy="118" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="445" y="122" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">cur</text>

  <!-- cur.left = p -->
  <line x1="432" y1="132" x2="405" y2="162" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="398" cy="176" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="398" y="180" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">p</text>
  <text x="356" y="200" font-size="9" fill="#d6a040">原父变左子</text>

  <!-- cur.right = A -->
  <line x1="458" y1="132" x2="485" y2="162" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="492" cy="176" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="492" y="180" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">A</text>
  <text x="478" y="200" font-size="9" fill="#4a7a3a">左子挪右子</text>

  <!-- detach note -->
  <rect x="345" y="218" width="220" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="455" y="237" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">同时：断开 p 指向 cur 的旧边</text>
  <text x="455" y="252" text-anchor="middle" font-size="10" fill="#333">if p.left == cur: p.left = null</text>
  <text x="455" y="267" text-anchor="middle" font-size="10" fill="#333">elif p.right == cur: p.right = null</text>

  <!-- bottom: why one-child holds -->
  <rect x="120" y="360" width="340" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="290" y="380" text-anchor="middle" font-size="10" fill="#333">上一轮已断开「cur 通向 leaf」的子边 → cur 至多剩一条非路径子边</text>
</svg>
