<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="10" markerHeight="10" refX="5" refY="9" orient="auto">
      <path d="M0,0 L5,9 L10,0 Z" fill="#888"/>
    </marker>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="5" refY="9" orient="auto">
      <path d="M0,0 L5,9 L10,0 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="5" refY="9" orient="auto">
      <path d="M0,0 L5,9 L10,0 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：正负两路保序，交替写入结果</text>

  <!-- ===== Original array row ===== -->
  <text x="40" y="56" font-size="11.5" fill="#555" font-weight="bold">原数组 nums（示例 1）：</text>

  <rect x="60" y="68" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="92" y="94" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <rect x="132" y="68" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="164" y="94" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <rect x="204" y="68" width="64" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="236" y="94" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">−2</text>

  <rect x="276" y="68" width="64" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="308" y="94" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">−5</text>

  <rect x="348" y="68" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="380" y="94" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <rect x="420" y="68" width="64" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="452" y="94" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">−4</text>

  <!-- Legend -->
  <rect x="500" y="74" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="520" y="86" font-size="9.5" fill="#888">正</text>
  <rect x="500" y="92" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="520" y="104" font-size="9.5" fill="#888">负</text>

  <!-- ===== Branch arrows down to two streams ===== -->
  <path d="M 92 108 C 92 130, 130 132, 130 150" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 164 108 C 164 132, 190 134, 190 150" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 380 108 C 380 132, 250 134, 250 150" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <path d="M 236 108 C 236 132, 380 134, 380 150" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 308 108 C 308 132, 440 134, 440 150" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 452 108 C 452 132, 500 134, 500 150" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- ===== Positive stream ===== -->
  <text x="40" y="170" font-size="11" fill="#446688" font-weight="bold">正数流（保序）：</text>
  <rect x="130" y="154" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="160" y="178" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">3</text>
  <rect x="190" y="154" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="220" y="178" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">1</text>
  <rect x="250" y="154" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="178" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">2</text>

  <!-- ===== Negative stream ===== -->
  <text x="318" y="170" font-size="11" fill="#b85450" font-weight="bold">负数流（保序）：</text>
  <rect x="380" y="154" width="60" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="410" y="178" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">−2</text>
  <rect x="440" y="154" width="60" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="470" y="178" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">−5</text>
  <rect x="500" y="154" width="60" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="530" y="178" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">−4</text>

  <!-- ===== Merge arrows into result (even/odd slots) ===== -->
  <path d="M 160 190 C 160 214, 92 220, 92 240" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 220 190 C 220 220, 236 226, 236 240" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 280 190 C 280 220, 380 226, 380 240" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <path d="M 410 190 C 410 220, 164 226, 164 240" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 470 190 C 470 220, 308 226, 308 240" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 530 190 C 530 220, 452 226, 452 240" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- ===== Result array ===== -->
  <text x="40" y="234" font-size="11.5" fill="#555" font-weight="bold">结果 ans（偶下标放正、奇下标放负）：</text>

  <rect x="60" y="244" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="92" y="270" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <text x="92" y="298" text-anchor="middle" font-size="8.5" fill="#446688">idx0</text>

  <rect x="132" y="244" width="64" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="164" y="270" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">−2</text>
  <text x="164" y="298" text-anchor="middle" font-size="8.5" fill="#b85450">idx1</text>

  <rect x="204" y="244" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="236" y="270" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="236" y="298" text-anchor="middle" font-size="8.5" fill="#446688">idx2</text>

  <rect x="276" y="244" width="64" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="308" y="270" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">−5</text>
  <text x="308" y="298" text-anchor="middle" font-size="8.5" fill="#b85450">idx3</text>

  <rect x="348" y="244" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="380" y="270" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <text x="380" y="298" text-anchor="middle" font-size="8.5" fill="#446688">idx4</text>

  <rect x="420" y="244" width="64" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="452" y="270" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">−4</text>
  <text x="452" y="298" text-anchor="middle" font-size="8.5" fill="#b85450">idx5</text>

  <!-- Divider -->
  <path d="M 40 314 L 520 314" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Key formula ===== -->
  <rect x="40" y="326" width="480" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="56" y="348" font-size="11.5" fill="#333" font-weight="bold">双指针一趟扫描（posIdx 从 0 起、negIdx 从 1 起，步长均为 2）：</text>
  <text x="56" y="370" font-size="12.5" fill="#4a7a3a" font-family="'Comic Sans MS', monospace" font-weight="bold">x &gt; 0 → ans[posIdx] = x, posIdx += 2</text>
  <text x="300" y="370" font-size="12.5" fill="#b85450" font-family="'Comic Sans MS', monospace" font-weight="bold">x &lt; 0 → ans[negIdx] = x, negIdx += 2</text>
</svg>
