<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">合并二叉树：重叠节点值相加，非空节点直接保留</text>

  <!-- 树 root1（蓝） -->
  <text x="110" y="52" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">root1</text>
  <circle cx="110" cy="76" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="110" y="80" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>

  <circle cx="75" cy="124" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="75" y="128" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
  <line x1="99" y1="88" x2="84" y2="112" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <circle cx="145" cy="124" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145" y="128" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <line x1="121" y1="88" x2="136" y2="112" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <circle cx="55" cy="172" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="55" y="176" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">5</text>
  <line x1="66" y1="136" x2="58" y2="161" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>

  <!-- 加号 -->
  <text x="220" y="100" text-anchor="middle" font-size="22" fill="#888" font-weight="bold">+</text>

  <!-- 树 root2（绿） -->
  <text x="370" y="52" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">root2</text>
  <circle cx="370" cy="76" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="370" y="80" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>

  <circle cx="335" cy="124" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="335" y="128" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <line x1="359" y1="88" x2="344" y2="112" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>

  <circle cx="405" cy="124" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="405" y="128" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <line x1="381" y1="88" x2="396" y2="112" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>

  <circle cx="360" cy="172" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="360" y="176" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>
  <line x1="345" y1="136" x2="356" y2="161" stroke="#4a7a3a" stroke-width="1.1" stroke-dasharray="3 2" filter="url(#rough2)"/>

  <circle cx="430" cy="172" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="430" y="176" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">7</text>
  <line x1="414" y1="136" x2="425" y2="161" stroke="#4a7a3a" stroke-width="1.1" stroke-dasharray="3 2" filter="url(#rough2)"/>

  <!-- 等号 + 向下箭头 -->
  <text x="300" y="200" text-anchor="middle" font-size="18" fill="#888" font-weight="bold">=</text>
  <path d="M 300 212 L 300 236" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 合并后（橙） -->
  <text x="300" y="260" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">合并后</text>
  <circle cx="300" cy="284" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="289" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <circle cx="255" cy="332" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="255" y="337" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <line x1="288" y1="297" x2="264" y2="320" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>

  <circle cx="345" cy="332" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="345" y="337" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <line x1="312" y1="297" x2="336" y2="320" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>

  <circle cx="225" cy="382" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="225" y="386" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <line x1="245" y1="345" x2="230" y2="371" stroke="#d6a040" stroke-width="1.1" filter="url(#rough2)"/>

  <circle cx="285" cy="382" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="285" y="386" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <line x1="265" y1="345" x2="280" y2="371" stroke="#d6a040" stroke-width="1.1" stroke-dasharray="3 2" filter="url(#rough2)"/>

  <circle cx="395" cy="382" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="395" y="386" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7</text>
  <line x1="358" y1="345" x2="388" y2="371" stroke="#d6a040" stroke-width="1.1" stroke-dasharray="3 2" filter="url(#rough2)"/>

  <!-- 规则说明 -->
  <rect x="40" y="410" width="520" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="300" y="426" text-anchor="middle" font-size="10" fill="#555">实线 = 两树都有该位置（值相加）；虚线 = 仅一棵树有（直接搬过来）</text>
</svg>
