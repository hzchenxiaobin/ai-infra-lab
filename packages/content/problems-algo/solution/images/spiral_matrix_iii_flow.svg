<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 9 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 9 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="500" height="440" fill="#fafafa"/>

  <text x="250" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：方向循环 + 步长递增 + 越界跳过</text>

  <!-- 1. Start -->
  <rect x="200" y="38" width="100" height="30" rx="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="58" text-anchor="middle" font-size="12" fill="#333">开始</text>
  <path d="M 250 68 L 250 82" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. Init -->
  <rect x="110" y="82" width="280" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="100" text-anchor="middle" font-size="11" fill="#333">记录起点 (rStart, cStart)</text>
  <text x="250" y="116" text-anchor="middle" font-size="11" fill="#333">d = 0（东）, step = 1, count = 1</text>
  <path d="M 250 126 L 250 142" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. Decision: count < total? -->
  <polygon points="250,142 340,178 250,214 160,178" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="174" text-anchor="middle" font-size="11" fill="#333">count &lt;</text>
  <text x="250" y="190" text-anchor="middle" font-size="11" fill="#333">rows × cols ?</text>
  <!-- No → End -->
  <path d="M 340 178 L 400 178 L 400 53" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="172" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- End -->
  <rect x="355" y="38" width="110" height="30" rx="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="410" y="58" text-anchor="middle" font-size="12" fill="#333">返回 ans</text>

  <!-- Yes ↓ -->
  <path d="M 250 214 L 250 230" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="258" y="228" font-size="10" fill="#b85450" font-weight="bold">是</text>

  <!-- 4. Process: 2 directions -->
  <rect x="130" y="230" width="240" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="252" text-anchor="middle" font-size="11" fill="#333">对 i = 0, 1 两个方向执行</text>
  <path d="M 250 264 L 250 278" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 5. Process: move step steps -->
  <rect x="100" y="278" width="300" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="296" text-anchor="middle" font-size="11" fill="#333">沿方向 d 走 step 步：r += dr[d], c += dc[d]</text>
  <text x="250" y="314" text-anchor="middle" font-size="11" fill="#4a7a3a">在网格内 → 记录 (r,c), count++</text>
  <path d="M 250 326 L 250 340" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 6. Decision: count == total? -->
  <polygon points="250,340 330,370 250,400 170,370" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="368" text-anchor="middle" font-size="11" fill="#333">count = total ?</text>
  <text x="250" y="382" text-anchor="middle" font-size="10" fill="#888">(提前退出)</text>
  <!-- Yes → End (break) -->
  <path d="M 330 370 L 400 370 L 400 68" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <text x="348" y="364" font-size="10" fill="#b85450" font-weight="bold">是</text>

  <!-- No ↓ -->
  <path d="M 250 400 L 250 410" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="258" y="408" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- 7. Process: turn + step++ -->
  <rect x="120" y="410" width="260" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="426" text-anchor="middle" font-size="11" fill="#333">d = (d+1) % 4 转向；两方向后 step++</text>

  <!-- Loop back: from bottom right → up → back to decision 3 -->
  <path d="M 380 422 L 460 422 L 460 178 L 340 178" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)" stroke-dasharray="5,3"/>
  <text x="466" y="300" font-size="10" fill="#446688" font-weight="bold" transform="rotate(90 466 300)">循环回顶部</text>
</svg>
