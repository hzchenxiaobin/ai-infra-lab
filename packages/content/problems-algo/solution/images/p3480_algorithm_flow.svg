<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一趟 n → 1 扫描，最小 / 次小两变量 + 贡献累加</text>

  <!-- N1 init -->
  <rect x="40" y="42" width="280" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="180" y="66" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">① 每对归一化 x &lt; y，按 x 分桶 at[x]；i ← n</text>

  <path d="M 180 80 L 180 86" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <!-- N2 diamond -->
  <polygon points="180,90 272,124 180,158 88,124" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="180" y="129" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">i ≥ 1 ?</text>

  <path d="M 180 158 L 180 170" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="188" y="168" font-size="10" fill="#33506b" filter="url(#rough2)">是</text>

  <!-- N3 insert into min1/min2 -->
  <rect x="40" y="174" width="280" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="180" y="192" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">② 激活 at[i] 的每对 (y, id)</text>
  <text x="180" y="208" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">按「严格 &lt;」插入最小 / 次小结构</text>

  <path d="M 180 218 L 180 226" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <!-- N4 compute f, base -->
  <rect x="40" y="230" width="280" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="180" y="248" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">③ f = 无约束 ? n : min1 − 1</text>
  <text x="180" y="264" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">base += f − i + 1</text>

  <path d="M 180 274 L 180 282" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <!-- N5 gain accumulation -->
  <rect x="40" y="286" width="280" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="180" y="304" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">④ 若有约束：gain[min1 的对] +=</text>
  <text x="180" y="321" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">次小在 ? min2 − min1 : n − min1 + 1</text>

  <!-- loop back -->
  <path d="M 40 309 L 22 309 L 22 124 L 82 124" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="34" y="302" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">i−−</text>

  <!-- no branch to answer -->
  <path d="M 272 124 L 512 124 L 512 268 L 506 268" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="352" y="116" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否：i 扫完</text>

  <!-- annotation box -->
  <g filter="url(#rough2)">
    <rect x="340" y="160" width="160" height="62" fill="#f0f0f0" stroke="#9aa5b1" stroke-width="1.3" stroke-dasharray="4 3" rx="8"/>
    <text x="420" y="180" text-anchor="middle" font-size="10" font-weight="bold" fill="#666">约束只进不出</text>
    <text x="420" y="196" text-anchor="middle" font-size="9.5" fill="#666">最小 / 次小两个变量就够</text>
    <text x="420" y="212" text-anchor="middle" font-size="9.5" fill="#666">无需线段树</text>
  </g>

  <!-- N7 answer -->
  <rect x="340" y="238" width="158" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="419" y="260" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">答案 = base</text>
  <text x="419" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">+ max(gain)</text>
  <text x="419" y="293" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">（gain ≥ 0，必删一对）</text>

  <text x="250" y="352" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">每个冲突对只入结构一次、每步 O(1) ⇒ 总时间 O(n + m)，空间 O(n + m)</text>
</svg>
