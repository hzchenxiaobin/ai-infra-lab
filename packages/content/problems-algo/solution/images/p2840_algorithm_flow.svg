<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 490" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="490" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：奇偶分组计数——52 个计数器全部归零 ⇔ true</text>

  <!-- start -->
  <rect x="190" y="44" width="180" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="67" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">读入 s1, s2（长度 n）</text>

  <path d="M 280 80 L 280 104" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init counters -->
  <rect x="150" y="106" width="260" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="126" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">初始化计数表 cnt[26][2] ← 全 0</text>
  <text x="280" y="146" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">26 个字符 × 奇偶两列，共 52 个计数器</text>

  <path d="M 280 158 L 280 182" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- scan s1 -->
  <rect x="140" y="184" width="280" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="204" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">扫描 s1：cnt[s1[i] − 'a'][i &amp; 1]++</text>
  <text x="280" y="224" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i 为偶数计入偶列，奇数计入奇列</text>

  <path d="M 280 236 L 280 260" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- scan s2 -->
  <rect x="140" y="262" width="280" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="282" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">扫描 s2：cnt[s2[i] − 'a'][i &amp; 1]−−</text>
  <text x="280" y="302" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">与 s1 在同一张表上对冲</text>

  <path d="M 280 314 L 280 342" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond: all zero? -->
  <polygon points="280,344 415,382 280,420 145,382" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="378" text-anchor="middle" font-size="12" fill="#a07830" filter="url(#rough2)">52 个计数器</text>
  <text x="280" y="396" text-anchor="middle" font-size="12" fill="#a07830" filter="url(#rough2)">全部为 0 ？</text>

  <!-- no: left -->
  <path d="M 145 382 L 117 382" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="130" y="372" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="15" y="364" width="100" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="65" y="387" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 false</text>

  <!-- yes: right -->
  <path d="M 415 382 L 443 382" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="428" y="372" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="445" y="364" width="100" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="495" y="387" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 true ✓</text>

  <!-- footer note -->
  <rect x="40" y="432" width="480" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="450" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">Python 一行等价版（O(n log n)）</text>
  <text x="280" y="468" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">sorted(s1[::2]) == sorted(s2[::2]) and sorted(s1[1::2]) == sorted(s2[1::2])</text>
</svg>
