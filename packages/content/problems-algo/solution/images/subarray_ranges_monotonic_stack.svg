<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">单调栈一次扫描同时求两侧边界（以 sumMax 为例）</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">维护值严格递减栈；弹出时确定「右更大或相等」，入栈时栈顶即「左严格更大」</text>

  <!-- ===== Array ===== -->
  <text x="30" y="74" font-size="11" fill="#446688" font-weight="bold">nums = [4, -2, -3, 4, 1]，处理到 i=3（值 4）</text>
  <g font-size="11">
    <rect x="60" y="82" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="88" y="103" text-anchor="middle" fill="#446688" font-weight="bold">4</text>
    <text x="88" y="76" text-anchor="middle" font-size="9" fill="#888">0</text>
    <rect x="120" y="82" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="148" y="103" text-anchor="middle" fill="#446688" font-weight="bold">-2</text>
    <text x="148" y="76" text-anchor="middle" font-size="9" fill="#888">1</text>
    <rect x="180" y="82" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="208" y="103" text-anchor="middle" fill="#446688" font-weight="bold">-3</text>
    <text x="208" y="76" text-anchor="middle" font-size="9" fill="#888">2</text>
    <rect x="240" y="82" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="268" y="103" text-anchor="middle" fill="#d6a040" font-weight="bold">4</text>
    <text x="268" y="76" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">3 ← 当前</text>
    <rect x="300" y="82" width="56" height="32" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
    <text x="328" y="103" text-anchor="middle" fill="#888">1</text>
    <text x="328" y="76" text-anchor="middle" font-size="9" fill="#888">4</text>
  </g>

  <!-- ===== Stack before: [0,1,2] values [4,-2,-3] strictly decreasing ===== -->
  <text x="30" y="134" font-size="11" fill="#d6a040" font-weight="bold">栈（底→顶，值严格递减）</text>
  <g font-size="10">
    <rect x="220" y="142" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="275" y="160" text-anchor="middle" fill="#446688" font-weight="bold">下标 0 (值 4)</text>
    <rect x="220" y="170" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="275" y="188" text-anchor="middle" fill="#446688" font-weight="bold">下标 1 (值 -2)</text>
    <rect x="220" y="198" width="110" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="275" y="216" text-anchor="middle" fill="#b85450" font-weight="bold">下标 2 (值 -3) ← 顶</text>
  </g>
  <text x="340" y="216" font-size="10" fill="#b85450" font-weight="bold">4 ≥ -3 → 弹</text>
  <text x="340" y="230" font-size="9" fill="#888">下标 2 的「右≥」= 3</text>
  <path d="M 220 211 L 170 211" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <!-- ===== After pop 2: top is 1 (-2) ===== -->
  <text x="30" y="250" font-size="11" fill="#d6a040" font-weight="bold">继续：栈顶下标 1 (值 -2)</text>
  <g font-size="10">
    <rect x="220" y="258" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="275" y="276" text-anchor="middle" fill="#446688" font-weight="bold">下标 0 (值 4)</text>
    <rect x="220" y="286" width="110" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="275" y="304" text-anchor="middle" fill="#b85450" font-weight="bold">下标 1 (值 -2) ← 顶</text>
  </g>
  <text x="340" y="304" font-size="10" fill="#b85450" font-weight="bold">4 ≥ -2 → 弹</text>
  <text x="340" y="318" font-size="9" fill="#888">下标 1 的「右≥」= 3</text>
  <path d="M 220 299 L 170 299" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <!-- ===== After pop 1: top is 0 (4), 4>=4 still pops! ===== -->
  <text x="30" y="338" font-size="11" fill="#d6a040" font-weight="bold">继续：栈顶下标 0 (值 4)，4 ≥ 4 仍弹出</text>
  <g font-size="10">
    <rect x="220" y="346" width="110" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="275" y="364" text-anchor="middle" fill="#b85450" font-weight="bold">下标 0 (值 4) ← 顶</text>
  </g>
  <text x="340" y="364" font-size="10" fill="#b85450" font-weight="bold">4 ≥ 4 → 弹（含等号）</text>
  <text x="340" y="378" font-size="9" fill="#888">下标 0 的「右≥」= 3</text>
  <path d="M 220 359 L 170 359" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <!-- ===== Stack empty -> left[3] = -1, push 3 ===== -->
  <text x="30" y="398" font-size="11" fill="#4a7a3a" font-weight="bold">栈空 → 下标 3 的「左严格更大」= -1，入栈下标 3</text>
  <g font-size="10">
    <rect x="220" y="406" width="110" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="275" y="424" text-anchor="middle" fill="#4a7a3a" font-weight="bold">下标 3 (值 4)</text>
  </g>
  <text x="340" y="424" font-size="10" fill="#4a7a3a" font-weight="bold">left[3] = -1</text>
  <text x="340" y="438" font-size="9" fill="#888">maxCnt[3] = (3-(-1))·(5-3) = 8</text>
</svg>
