<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="520" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">算法流程：耐心排序 + upper_bound</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">对每个障碍 x = obstacles[i]，在线求 ans[i]</text>

  <!-- Start node -->
  <rect x="200" y="62" width="160" height="36" rx="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="85" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">开始：tails = []</text>
  <path d="M 280 98 L 280 114" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Loop node -->
  <rect x="170" y="116" width="220" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="141" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">遍历 x = obstacles[i]</text>
  <path d="M 280 156 L 280 172" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Decision: upper_bound -->
  <polygon points="280,174 400,222 280,270 160,222" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="210" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">upper_bound</text>
  <text x="280" y="226" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">找第一个 &gt; x 的位置</text>
  <text x="280" y="242" text-anchor="middle" font-size="10" fill="#888">pos = upper_bound(tails, x)</text>

  <!-- Branch: pos == len (no element > x) -->
  <path d="M 400 222 L 480 222 L 480 300" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="410" y="216" font-size="10" fill="#4a7a3a" font-weight="bold">pos == len</text>
  <text x="410" y="236" font-size="10" fill="#4a7a3a">(无 &gt; x)</text>

  <rect x="400" y="302" width="130" height="60" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="465" y="322" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">追加</text>
  <text x="465" y="338" text-anchor="middle" font-size="10" fill="#4a7a3a">tails.append(x)</text>
  <text x="465" y="354" text-anchor="middle" font-size="10" fill="#4a7a3a">ans[i] = len(tails)</text>

  <!-- Branch: pos < len (found element > x) -->
  <path d="M 160 222 L 80 222 L 80 300" stroke="#c98a2b" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="86" y="216" font-size="10" fill="#c98a2b" font-weight="bold">pos &lt; len</text>
  <text x="86" y="236" font-size="10" fill="#c98a2b">(有 &gt; x)</text>

  <rect x="30" y="302" width="130" height="60" rx="6" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="95" y="322" text-anchor="middle" font-size="11" fill="#c98a2b" font-weight="bold">替换</text>
  <text x="95" y="338" text-anchor="middle" font-size="10" fill="#c98a2b">tails[pos] = x</text>
  <text x="95" y="354" text-anchor="middle" font-size="10" fill="#c98a2b">ans[i] = pos + 1</text>

  <!-- Merge -->
  <path d="M 95 362 L 95 390 L 280 390" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 465 362 L 465 390 L 280 390" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <circle cx="280" cy="390" r="5" fill="#666" filter="url(#rough2)"/>

  <!-- Loop back -->
  <path d="M 280 395 L 280 412" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <rect x="180" y="414" width="200" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="280" y="436" text-anchor="middle" font-size="11" fill="#d6a040">还有障碍？→ 继续遍历</text>

  <!-- Loop back arrow -->
  <path d="M 280 448 L 280 460 L 470 460 L 470 136 L 390 136" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- End -->
  <path d="M 180 431 L 130 431 L 130 470" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <rect x="60" y="472" width="140" height="36" rx="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="495" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">返回 ans</text>

  <!-- Note -->
  <rect x="380" y="414" width="160" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="460" y="432" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">关键：ans[i] = pos + 1</text>
  <text x="460" y="448" text-anchor="middle" font-size="10" fill="#888">pos 是 upper_bound 的下标</text>
  <text x="460" y="462" text-anchor="middle" font-size="10" fill="#888">= 以 x 结尾的最长长度</text>
</svg>
