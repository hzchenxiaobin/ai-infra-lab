<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <g filter="url(#rough2)">
    <text x="260" y="16" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">核心观察：标记出现过的数，连续空位折叠成区间</text>
    <text x="260" y="34" text-anchor="middle" font-size="10.5" fill="#666">示例 1：nums = [3, 9, 7]，lower = 1，upper = 12</text>

    <!-- legend -->
    <rect x="44" y="41" width="12" height="11" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="61" y="50" font-size="9.5" fill="#446688">出现过（打标记）</text>
    <rect x="185" y="41" width="12" height="11" rx="2" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="202" y="50" font-size="9.5" fill="#8a6d1f">缺失（空位）</text>

    <!-- number line: cells 1..12 -->
    <!-- missing cells -->
    <rect x="44" y="56" width="36" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="62" y="82" text-anchor="middle" font-size="13" fill="#7a5c1a">1</text>
    <rect x="80" y="56" width="36" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="98" y="82" text-anchor="middle" font-size="13" fill="#7a5c1a">2</text>
    <rect x="152" y="56" width="36" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="170" y="82" text-anchor="middle" font-size="13" fill="#7a5c1a">4</text>
    <rect x="188" y="56" width="36" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="206" y="82" text-anchor="middle" font-size="13" fill="#7a5c1a">5</text>
    <rect x="224" y="56" width="36" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="242" y="82" text-anchor="middle" font-size="13" fill="#7a5c1a">6</text>
    <rect x="296" y="56" width="36" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="314" y="82" text-anchor="middle" font-size="13" fill="#7a5c1a">8</text>
    <rect x="368" y="56" width="36" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="386" y="82" text-anchor="middle" font-size="13" fill="#7a5c1a">10</text>
    <rect x="404" y="56" width="36" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="422" y="82" text-anchor="middle" font-size="13" fill="#7a5c1a">11</text>
    <rect x="440" y="56" width="36" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="458" y="82" text-anchor="middle" font-size="13" fill="#7a5c1a">12</text>

    <!-- marked cells (3, 7, 9) -->
    <rect x="116" y="56" width="36" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <text x="134" y="79" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688">3</text>
    <text x="134" y="95" text-anchor="middle" font-size="10" fill="#446688">✓</text>
    <rect x="260" y="56" width="36" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <text x="278" y="79" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688">7</text>
    <text x="278" y="95" text-anchor="middle" font-size="10" fill="#446688">✓</text>
    <rect x="332" y="56" width="36" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <text x="350" y="79" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688">9</text>
    <text x="350" y="95" text-anchor="middle" font-size="10" fill="#446688">✓</text>

    <!-- brackets: maximal gaps -->
    <path d="M 44 108 V 117 H 116 V 108" fill="none" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="80" y="133" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">[1,2]</text>
    <path d="M 152 108 V 117 H 260 V 108" fill="none" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="206" y="133" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">[4,6]</text>
    <path d="M 296 108 V 117 H 332 V 108" fill="none" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="314" y="133" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">[8,8]</text>
    <path d="M 368 108 V 117 H 476 V 108" fill="none" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="422" y="133" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">[10,12]</text>

    <!-- result -->
    <rect x="80" y="148" width="360" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="260" y="167" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f5527">ans = [[1,2], [4,6], [8,8], [10,12]]</text>

    <!-- two steps -->
    <rect x="28" y="192" width="232" height="84" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="144" y="210" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">第一步：打标记</text>
    <text x="40" y="228" font-size="9.5" fill="#333">遍历 nums，落在 [lower, upper] 的 v</text>
    <text x="40" y="244" font-size="9.5" fill="#333">标记 seen[v] = 1（重复值天然去重）</text>
    <text x="40" y="260" font-size="9.5" fill="#333">区间外的值直接跳过（示例 2 的 1）</text>

    <rect x="270" y="192" width="232" height="84" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="386" y="210" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6d1f">第二步：扫空位折叠</text>
    <text x="282" y="228" font-size="9.5" fill="#333">i 从 lower 扫到 upper：seen[i] ✓ 跳过</text>
    <text x="282" y="244" font-size="9.5" fill="#333">否则 j 向右扩展到空位段末尾</text>
    <text x="282" y="260" font-size="9.5" fill="#333">极大连续空位段 → 输出 [i, j]</text>

    <!-- pitfalls -->
    <rect x="28" y="288" width="474" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="265" y="306" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">易错点</text>
    <text x="44" y="324" font-size="9.5" fill="#8a3a35">① 空位段可能只有一个数，照样输出闭区间（示例 1 的 [8,8]）</text>
    <text x="44" y="340" font-size="9.5" fill="#8a3a35">② 值域 ≤ 10⁵，桶开到 upper+1 即可；区间内无空位则返回 []</text>
  </g>
</svg>
