<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1 演算：排序后 start = [0, 3, 6]，d = 2</text>

  <!-- check(4) 可行 -->
  <rect x="22" y="36" width="232" height="142" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="138" y="58" text-anchor="middle" font-size="11.5" fill="#3a5a2e" font-weight="bold" filter="url(#rough2)">check(4)：逐区间贪心</text>
  <text x="138" y="82" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[0,2]：选 0（last = 0）</text>
  <text x="138" y="104" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[3,5]：max(3, 0+4) = 4 ≤ 5 ✓</text>
  <text x="138" y="126" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[6,8]：max(6, 4+4) = 8 ≤ 8 ✓</text>
  <text x="138" y="158" text-anchor="middle" font-size="11" fill="#3a5a2e" font-weight="bold" filter="url(#rough2)">→ 全部合法，x = 4 可行</text>

  <!-- check(5) 不可行 -->
  <rect x="266" y="36" width="232" height="142" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="382" y="58" text-anchor="middle" font-size="11.5" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">check(5)：逐区间贪心</text>
  <text x="382" y="82" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[0,2]：选 0（last = 0）</text>
  <text x="382" y="104" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[3,5]：max(3, 0+5) = 5 ≤ 5 ✓</text>
  <text x="382" y="126" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[6,8]：max(6, 5+5) = 10 &gt; 8 ✗</text>
  <text x="382" y="158" text-anchor="middle" font-size="11" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">→ 越界，x = 5 不可行</text>

  <!-- 二分阶梯 -->
  <text x="260" y="206" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">二分视角：可行域是前缀 [0, 4]，答案 = 最大可行 x</text>

  <rect x="48" y="216" width="40" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="68" y="233" text-anchor="middle" font-size="11" fill="#3a5a2e" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="68" y="247" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <rect x="96" y="216" width="40" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="116" y="233" text-anchor="middle" font-size="11" fill="#3a5a2e" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="116" y="247" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <rect x="144" y="216" width="40" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="164" y="233" text-anchor="middle" font-size="11" fill="#3a5a2e" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="164" y="247" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <rect x="192" y="216" width="40" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="212" y="233" text-anchor="middle" font-size="11" fill="#3a5a2e" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="212" y="247" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <rect x="240" y="216" width="40" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="260" y="233" text-anchor="middle" font-size="11" fill="#3a5a2e" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="260" y="247" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <rect x="288" y="216" width="40" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="308" y="233" text-anchor="middle" font-size="11" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="308" y="247" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗</text>

  <rect x="336" y="216" width="40" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="356" y="233" text-anchor="middle" font-size="11" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="356" y="247" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗</text>

  <rect x="384" y="216" width="40" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="404" y="233" text-anchor="middle" font-size="11" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="404" y="247" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗</text>

  <rect x="432" y="216" width="40" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="452" y="233" text-anchor="middle" font-size="11" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="452" y="247" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗</text>

  <text x="260" y="284" text-anchor="middle" font-size="10.5" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">答案 = 4（对应官方选法 0、4、8）</text>

  <!-- 示例 2 备注 -->
  <rect x="40" y="296" width="440" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="317" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">示例 2：d = 5，check(5) 取 2, 7, 13, 18 全合法 ✓；check(6) 最后取 20 &gt; 18 ✗ → 答案 5</text>

  <text x="260" y="350" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">check 关键：pick = max(区间下界, last + x)——取尽量小的合法值，给后面的区间留足空间</text>
</svg>
