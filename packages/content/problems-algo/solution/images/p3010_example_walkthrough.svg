<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="350" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [10, 3, 1, 1]（示例 3），一遍维护 min1 / min2</text>

  <!-- header row -->
  <rect x="30" y="44" width="62" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="61" y="63" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">步骤</text>
  <rect x="92" y="44" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="116" y="63" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">x</text>
  <rect x="140" y="44" width="158" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="219" y="63" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">判定</text>
  <rect x="298" y="44" width="66" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="331" y="63" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">min1</text>
  <rect x="364" y="44" width="66" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="397" y="63" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">min2</text>
  <rect x="430" y="44" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="490" y="63" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">备注</text>

  <!-- row: init -->
  <rect x="30" y="74" width="62" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="61" y="96" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">初始</text>
  <rect x="92" y="74" width="48" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="116" y="96" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>
  <rect x="140" y="74" width="158" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="219" y="96" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>
  <rect x="298" y="74" width="66" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="331" y="96" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">+∞</text>
  <rect x="364" y="74" width="66" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="397" y="96" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">+∞</text>
  <rect x="430" y="74" width="120" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="490" y="96" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">还没扫 nums[1:]</text>

  <!-- row: k=1 -->
  <rect x="30" y="110" width="62" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="61" y="132" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">k=1</text>
  <rect x="92" y="110" width="48" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="116" y="132" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="140" y="110" width="158" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="219" y="132" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">3 &lt; min1(+∞) ✓</text>
  <rect x="298" y="110" width="66" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="331" y="132" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="364" y="110" width="66" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="397" y="132" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">+∞</text>
  <rect x="430" y="110" width="120" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="490" y="132" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">首个候选直接登顶</text>

  <!-- row: k=2 -->
  <rect x="30" y="146" width="62" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="61" y="168" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">k=2</text>
  <rect x="92" y="146" width="48" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="116" y="168" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="140" y="146" width="158" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="219" y="168" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">1 &lt; min1(3) ✓</text>
  <rect x="298" y="146" width="66" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="331" y="168" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="364" y="146" width="66" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="397" y="168" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="430" y="146" width="120" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="490" y="168" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">新冠军，3 退居次席</text>

  <!-- row: k=3 -->
  <rect x="30" y="182" width="62" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="61" y="204" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">k=3</text>
  <rect x="92" y="182" width="48" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="116" y="204" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="140" y="182" width="158" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="219" y="204" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">1 ≮ min1(1)，但 &lt; min2(3) ✓</text>
  <rect x="298" y="182" width="66" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="331" y="204" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <rect x="364" y="182" width="66" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="397" y="204" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="430" y="182" width="120" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="490" y="204" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">并列最小也收下</text>

  <!-- answer box -->
  <rect x="60" y="236" width="440" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="256" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">最优总代价 = nums[0] + min1 + min2 = 10 + 1 + 1 = 12 ✓</text>
  <text x="280" y="276" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">对应分割 [10, 3] | [1] | [1]，三段首元素 10、1、1</text>

  <!-- bottom note -->
  <rect x="60" y="300" width="440" height="40" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="280" y="316" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">⚠️ 严格小于：x = min1 时走 min2 分支，并列最小也能收进（如此处两个 1）</text>
  <text x="280" y="332" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">若把判定写成 x ≤ min1，结果一致：min2 ← min1; min1 ← x 依旧正确</text>
</svg>
