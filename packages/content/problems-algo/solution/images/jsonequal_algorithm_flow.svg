<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 620"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="620" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)" font-weight="bold">算法流程：六步类型分派决策树（短路）</text>

  <!-- 入口 -->
  <rect x="210" y="44" width="160" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="66" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">areDeeplyEqual(o1, o2)</text>
  <path d="M 290 78 L 290 96" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤1 菱形：o1===o2 -->
  <polygon points="290,96 410,140 290,184 170,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="136" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)" font-weight="bold">1. o1 === o2 ?</text>
  <text x="290" y="152" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">递归基（null/原始/同引用）</text>
  <!-- 是 → true -->
  <path d="M 410 140 L 470 140" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="440" y="134" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="472" y="124" width="92" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="518" y="146" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)" font-weight="bold">return true</text>
  <!-- 否 ↓ -->
  <path d="M 290 184 L 290 202" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="302" y="198" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- 步骤2 菱形：null 拦截 -->
  <polygon points="290,202 410,244 290,286 170,244" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="240" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)" font-weight="bold">2. 任一为 null ?</text>
  <text x="290" y="256" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">typeof null === 'object' 须先拦</text>
  <!-- 是 → false -->
  <path d="M 410 244 L 470 244" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="440" y="238" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="472" y="228" width="92" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="518" y="250" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)" font-weight="bold">return false</text>
  <!-- 否 ↓ -->
  <path d="M 290 286 L 290 304" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="302" y="300" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- 步骤3 菱形：typeof object -->
  <polygon points="290,304 410,346 290,388 170,346" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="342" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)" font-weight="bold">3. typeof 均为 object ?</text>
  <text x="290" y="358" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">原始值 vs 对象 分类</text>
  <path d="M 410 346 L 470 346" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="440" y="340" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="472" y="330" width="92" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="518" y="352" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)" font-weight="bold">return false</text>
  <path d="M 290 388 L 290 406" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="302" y="402" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>

  <!-- 步骤4 菱形：Array.isArray 一致 -->
  <polygon points="290,406 410,448 290,490 170,448" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="444" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)" font-weight="bold">4. 同为数组 or 同为对象 ?</text>
  <text x="290" y="460" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">Array.isArray 区分</text>
  <path d="M 410 448 L 470 448" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="440" y="442" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="472" y="432" width="92" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="518" y="454" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)" font-weight="bold">return false</text>

  <!-- 分叉：数组 / 对象 -->
  <path d="M 290 490 L 290 508" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 290 512 L 160 512 L 160 540" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 290 512 L 420 512 L 420 540" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="220" y="506" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">数组</text>
  <text x="360" y="506" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">对象</text>

  <!-- 数组分支 -->
  <rect x="60" y="540" width="200" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="562" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)" font-weight="bold">5. 长度相等？逐 i 递归</text>
  <text x="160" y="578" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">areDeeplyEqual(o1[i], o2[i])</text>
  <text x="160" y="592" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">全过 → true</text>

  <!-- 对象分支 -->
  <rect x="320" y="540" width="220" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="562" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)" font-weight="bold">6. 键集相同？逐键递归</text>
  <text x="430" y="578" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">has(key) &amp; areDeeplyEqual(…)</text>
  <text x="430" y="592" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">全过 → true</text>

  <!-- 递归回环箭头（指向入口） -->
  <path d="M 100 540 C 40 420 40 120 210 70" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 470 540 C 540 420 540 120 370 70" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="50" y="300" font-size="10" fill="#b85450" filter="url(#rough2)" font-weight="bold" transform="rotate(-90 50 300)">递归回入口</text>
</svg>
