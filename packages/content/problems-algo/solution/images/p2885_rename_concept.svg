<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="660" height="400" fill="#fafafa"/>

  <text x="330" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">rename：只换表头，不碰数据</text>
  <text x="296" y="56" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">students.rename(columns=mapper)</text>

  <!-- Left: old table -->
  <rect x="24" y="64" width="168" height="170" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="108" y="84" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">students（旧表）</text>

  <rect x="34" y="94" width="30" height="22" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="49" y="109" text-anchor="middle" font-size="9" fill="#ffffff" filter="url(#rough2)">id</text>
  <rect x="66" y="94" width="44" height="22" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="88" y="109" text-anchor="middle" font-size="9" fill="#ffffff" filter="url(#rough2)">first</text>
  <rect x="112" y="94" width="44" height="22" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="134" y="109" text-anchor="middle" font-size="9" fill="#ffffff" filter="url(#rough2)">last</text>
  <rect x="158" y="94" width="30" height="22" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="173" y="109" text-anchor="middle" font-size="9" fill="#ffffff" filter="url(#rough2)">age</text>

  <rect x="34" y="120" width="30" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="66" y="120" width="44" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="112" y="120" width="44" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="158" y="120" width="30" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="49" y="135" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">1</text>
  <text x="88" y="135" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">Mason</text>
  <text x="134" y="135" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">King</text>
  <text x="173" y="135" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">6</text>

  <rect x="34" y="146" width="30" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="66" y="146" width="44" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="112" y="146" width="44" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="158" y="146" width="30" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="49" y="161" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">2</text>
  <text x="88" y="161" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">Ava</text>
  <text x="134" y="161" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">Wright</text>
  <text x="173" y="161" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">7</text>

  <rect x="34" y="172" width="30" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="66" y="172" width="44" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="112" y="172" width="44" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="158" y="172" width="30" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="49" y="187" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">3</text>
  <text x="88" y="187" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">Taylor</text>
  <text x="134" y="187" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">Hall</text>
  <text x="173" y="187" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">16</text>

  <text x="108" y="254" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">数据行：一格不碰</text>

  <!-- Middle: mapper dict -->
  <path d="M 196 106 L 212 130" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="216" y="84" width="160" height="156" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="296" y="104" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">映射 dict</text>
  <text x="296" y="126" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">id → student_id</text>
  <text x="296" y="148" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">first → first_name</text>
  <text x="296" y="170" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">last → last_name</text>
  <text x="296" y="192" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">age → age_in_years</text>
  <text x="296" y="226" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">旧名做键 · 新名做值</text>

  <!-- Right: new table -->
  <path d="M 380 130 L 414 106" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="420" y="64" width="226" height="170" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="533" y="84" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">新表（返回值）</text>

  <rect x="428" y="94" width="48" height="22" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="452" y="109" text-anchor="middle" font-size="8.5" fill="#ffffff" filter="url(#rough2)">student_id</text>
  <rect x="478" y="94" width="52" height="22" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="504" y="109" text-anchor="middle" font-size="8.5" fill="#ffffff" filter="url(#rough2)">first_name</text>
  <rect x="532" y="94" width="48" height="22" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="556" y="109" text-anchor="middle" font-size="8.5" fill="#ffffff" filter="url(#rough2)">last_name</text>
  <rect x="582" y="94" width="56" height="22" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="610" y="109" text-anchor="middle" font-size="8.5" fill="#ffffff" filter="url(#rough2)">age_in_years</text>

  <rect x="428" y="120" width="48" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="478" y="120" width="52" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="532" y="120" width="48" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="582" y="120" width="56" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="452" y="135" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">1</text>
  <text x="504" y="135" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">Mason</text>
  <text x="556" y="135" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">King</text>
  <text x="610" y="135" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">6</text>

  <rect x="428" y="146" width="48" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="478" y="146" width="52" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="532" y="146" width="48" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="582" y="146" width="56" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="452" y="161" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">2</text>
  <text x="504" y="161" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">Ava</text>
  <text x="556" y="161" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">Wright</text>
  <text x="610" y="161" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">7</text>

  <rect x="428" y="172" width="48" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="478" y="172" width="52" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="532" y="172" width="48" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="582" y="172" width="56" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="452" y="187" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">3</text>
  <text x="504" y="187" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">Taylor</text>
  <text x="556" y="187" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">Hall</text>
  <text x="610" y="187" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">16</text>

  <text x="533" y="254" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">行数 · 行序 · dtype 全不变</text>

  <!-- Bottom warning -->
  <rect x="60" y="288" width="540" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="330" y="310" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">⚠️ rename 的三个静默行为</text>
  <text x="330" y="332" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">① dict 里不存在的旧名（键写错）→ 被静默忽略，该列保持原名</text>
  <text x="330" y="350" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">② 未写进 dict 的列 → 保持原名（部分改名合法）</text>
  <text x="330" y="368" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">③ 返回新 DataFrame，原 students 不变</text>
</svg>
