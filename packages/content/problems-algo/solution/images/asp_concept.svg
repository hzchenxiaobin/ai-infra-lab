<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="480" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">三大要点：日期区间 JOIN · 加权平均 · LEFT JOIN 兜底</text>

  <!-- ===== 要点①：JOIN 条件含日期区间 ===== -->
  <text x="40" y="54" font-size="11.5" fill="#446688" font-weight="bold">① JOIN 必须带日期区间：仅 product_id 会爆炸匹配</text>

  <rect x="40" y="62" width="230" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="50" y="80" font-size="10" fill="#446688" font-weight="bold">Prices（产品 1 有 2 个价格段）</text>
  <text x="50" y="98" font-size="10.5" fill="#333">段 A: 02/17–02/28, ¥5</text>
  <text x="50" y="114" font-size="10.5" fill="#333">段 B: 03/01–03/22, ¥20</text>
  <text x="50" y="134" font-size="9.5" fill="#b85450">仅 JOIN product_id →</text>
  <text x="50" y="146" font-size="9.5" fill="#b85450">每笔销售 × 2 段 = 重复计价</text>

  <rect x="290" y="68" width="250" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="304" y="86" font-size="11.5" fill="#d6a040" font-weight="bold">对策：JOIN 条件加日期</text>
  <text x="304" y="104" font-size="10" fill="#333" font-family="'Comic Sans MS', monospace">ON p.id = u.id</text>
  <text x="304" y="118" font-size="10" fill="#333" font-family="'Comic Sans MS', monospace">AND u.date BETWEEN p.start AND p.end</text>

  <path d="M 275 96 L 290 96" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <line x1="40" y1="162" x2="540" y2="162" stroke="#ddd" stroke-width="1" stroke-dasharray="6 4" filter="url(#rough2)"/>

  <!-- ===== 要点②：加权平均 ===== -->
  <text x="40" y="182" font-size="11.5" fill="#4a7a3a" font-weight="bold">② 加权平均：SUM(price×units)/SUM(units) ≠ AVG(price)</text>

  <rect x="40" y="190" width="230" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="50" y="208" font-size="10.5" fill="#333">产品 1: ¥5 × 100件 + ¥20 × 15件</text>
  <text x="50" y="228" font-size="10" fill="#b85450" text-decoration="line-through">AVG(price)=(5+20)/2=12.50 ✗</text>
  <text x="50" y="248" font-size="10" fill="#4a7a3a" font-weight="bold">(500+300)/115 = 6.96 ✓</text>
  <text x="50" y="266" font-size="9.5" fill="#888">100 件按低价卖 → 拉低均价</text>
  <text x="50" y="280" font-size="9.5" fill="#888">简单平均无视销量权重</text>

  <rect x="290" y="196" width="250" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="304" y="214" font-size="11.5" fill="#d6a040" font-weight="bold">对策：加权平均公式</text>
  <text x="304" y="232" font-size="10" fill="#333" font-family="'Comic Sans MS', monospace">SUM(price * units)</text>
  <text x="304" y="246" font-size="10" fill="#333" font-family="'Comic Sans MS', monospace">÷ SUM(units)</text>

  <path d="M 275 224 L 290 224" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <line x1="40" y1="300" x2="540" y2="300" stroke="#ddd" stroke-width="1" stroke-dasharray="6 4" filter="url(#rough2)"/>

  <!-- ===== 要点③：LEFT JOIN 兜底 ===== -->
  <text x="40" y="320" font-size="11.5" fill="#b85450" font-weight="bold">③ 无售出产品：INNER JOIN 会丢失 → LEFT JOIN 兜底</text>

  <rect x="40" y="328" width="230" height="86" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="50" y="346" font-size="10.5" fill="#333">产品 3 有价格但无销售记录</text>
  <text x="50" y="366" font-size="10" fill="#b85450" text-decoration="line-through">INNER JOIN → 产品 3 消失 ✗</text>
  <text x="50" y="384" font-size="10" fill="#4a7a3a">LEFT JOIN → 保留，units=NULL</text>
  <text x="50" y="402" font-size="10" fill="#4a7a3a">SUM(NULL)=NULL → IFNULL→0 ✓</text>

  <rect x="290" y="334" width="250" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="304" y="352" font-size="11.5" fill="#d6a040" font-weight="bold">对策：LEFT JOIN + IFNULL</text>
  <text x="304" y="370" font-size="10" fill="#333" font-family="'Comic Sans MS', monospace">IFNULL(ROUND(..., 2), 0)</text>
  <text x="304" y="384" font-size="9.5" fill="#888">无售出 → average_price = 0</text>

  <path d="M 275 362 L 290 362" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="432" width="500" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="290" y="450" text-anchor="middle" font-size="10.5" fill="#555">💡 LEFT JOIN 带日期区间 → 加权平均 SUM/SUM → ROUND → IFNULL 兜底 0</text>
</svg>
