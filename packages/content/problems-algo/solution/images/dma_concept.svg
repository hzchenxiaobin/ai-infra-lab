<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">allocate(size=3, mID=2)：左到右扫描，追踪连续空闲长度 run</text>

  <!-- bracket + label over found block (cells 6,7,8) -->
  <path d="M 312 56 L 312 48 L 438 48 L 438 56" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="375" y="42" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">run==size ⇒ 命中</text>

  <!-- 10 memory cells: values [1,1,0,4,4,4,0,0,0,0]; 0=free -->
  <!-- cell j: x = 60 + j*42, y=70, w=42, h=46 -->
  <!-- free cells (idx 2,6,7,8,9): light fill, "0" -->
  <rect x="60"  y="70" width="42" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="102" y="70" width="42" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="144" y="70" width="42" height="46" rx="4" fill="#f0f4f8" stroke="#9aa8b4" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="186" y="70" width="42" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="228" y="70" width="42" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="270" y="70" width="42" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="312" y="70" width="42" height="46" rx="4" fill="#f0f4f8" stroke="#9aa8b4" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="354" y="70" width="42" height="46" rx="4" fill="#f0f4f8" stroke="#9aa8b4" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="396" y="70" width="42" height="46" rx="4" fill="#f0f4f8" stroke="#9aa8b4" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="438" y="70" width="42" height="46" rx="4" fill="#f0f4f8" stroke="#9aa8b4" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- highlight found block 6,7,8 -->
  <rect x="310" y="68" width="130" height="50" rx="6" fill="none" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>

  <!-- cell values: mID or 0 -->
  <text x="81"  y="98" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="123" y="98" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="165" y="98" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">0</text>
  <text x="207" y="98" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <text x="249" y="98" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <text x="291" y="98" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <text x="333" y="98" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">0</text>
  <text x="375" y="98" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">0</text>
  <text x="417" y="98" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">0</text>
  <text x="459" y="98" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">0</text>

  <!-- index labels -->
  <text x="81"  y="132" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">i:0</text>
  <text x="123" y="132" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="165" y="132" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <text x="207" y="132" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3</text>
  <text x="249" y="132" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4</text>
  <text x="291" y="132" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">5</text>
  <text x="333" y="132" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">6</text>
  <text x="375" y="132" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">7</text>
  <text x="417" y="132" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">8</text>
  <text x="459" y="132" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">9</text>

  <!-- run values row -->
  <text x="44" y="164" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">run</text>
  <text x="81"  y="164" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">0</text>
  <text x="123" y="164" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">0</text>
  <text x="165" y="164" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1</text>
  <text x="207" y="164" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="249" y="164" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">0</text>
  <text x="291" y="164" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">0</text>
  <text x="333" y="164" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1</text>
  <text x="375" y="164" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">2</text>
  <text x="417" y="164" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="459" y="164" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">—</text>

  <!-- reset marker: run 1 -> 0 at i=3 (allocated cell kills the too-short run) -->
  <path d="M 165 176 C 190 190, 200 190, 206 176" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="186" y="186" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">遇分配→归零</text>

  <!-- callout -->
  <rect x="40" y="208" width="480" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="226" text-anchor="middle" font-size="12" fill="#223" filter="url(#rough2)">扫描遇空闲 ⇒ run++；遇已分配 ⇒ run=0；</text>
  <text x="280" y="244" text-anchor="middle" font-size="12" fill="#223" filter="url(#rough2)">run==size 即命中，起点 = i − size + 1，写 mID 后返回</text>

  <!-- note -->
  <rect x="40" y="264" width="480" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="289" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">左到右扫描 + 首次达 size 即停 ⇒ 天然取最左块，无需枚举所有候选再取最小</text>

  <!-- legend -->
  <rect x="60"  y="318" width="22" height="16" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="92" y="330" font-size="11" fill="#555" filter="url(#rough2)">数字=mID(已分配)</text>
  <rect x="240" y="318" width="22" height="16" rx="3" fill="#f0f4f8" stroke="#9aa8b4" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="272" y="330" font-size="11" fill="#555" filter="url(#rough2)">0=空闲</text>
  <text x="350" y="330" font-size="11" fill="#b85450" filter="url(#rough2)">红框=命中块  run=命中时的连续空闲数</text>
</svg>
