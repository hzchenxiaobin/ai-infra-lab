<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="560" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：哑节点 + 尾插 + 拼接</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">一遍遍历原链，按 val 与 x 比较挂到 small / large 尾部，遍历完拼接</text>

  <!-- 1. 建哑节点 -->
  <rect x="60" y="64" width="400" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="80" y="84" font-size="10" fill="#446688" font-weight="bold">① 初始化</text>
  <text x="80" y="100" font-size="11" fill="#333">sDummy = ListNode(0); lDummy = ListNode(0); sTail = sDummy; lTail = lDummy</text>

  <line x1="260" y1="108" x2="260" y2="124" stroke="#446688" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. 判空 -->
  <polygon points="180,128 340,128 320,156 160,156" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="240" y="146" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">curr != null ?</text>

  <!-- No 分支：进入拼接 -->
  <text x="350" y="146" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <path d="M 335 142 Q 400 142 400 220" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Yes 分支：比较 -->
  <text x="160" y="170" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <line x1="170" y1="156" x2="170" y2="176" stroke="#446688" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. 比较 val < x -->
  <polygon points="100,180 240,180 220,210 80,210" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="199" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">curr.val &lt; x ?</text>

  <!-- Yes: 挂到 small -->
  <text x="60" y="226" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <line x1="90" y1="210" x2="60" y2="240" stroke="#446688" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="20" y="240" width="170" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="260" font-size="10" fill="#4a7a3a" font-weight="bold">② 尾插到 small</text>
  <text x="40" y="276" font-size="10" fill="#333">sTail.next = curr</text>
  <text x="40" y="290" font-size="10" fill="#333">sTail = curr</text>

  <!-- No: 挂到 large -->
  <text x="260" y="226" font-size="10" fill="#d6a040" font-weight="bold">否（val ≥ x）</text>
  <line x1="230" y1="210" x2="290" y2="240" stroke="#446688" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="290" y="240" width="190" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="260" font-size="10" fill="#8a6a20" font-weight="bold">②' 尾插到 large</text>
  <text x="310" y="276" font-size="10" fill="#333">lTail.next = curr</text>
  <text x="310" y="290" font-size="10" fill="#333">lTail = curr</text>

  <!-- 4. curr 前进 -->
  <line x1="105" y1="296" x2="200" y2="324" stroke="#446688" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="385" y1="296" x2="240" y2="324" stroke="#446688" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="180" y="324" width="160" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="346" text-anchor="middle" font-size="11" fill="#333">③ curr = curr.next</text>

  <!-- 回到判空 -->
  <path d="M 260 360 Q 260 380 260 142 Q 260 156 335 156" stroke="#446688" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="376" font-size="9" fill="#888">回到判空循环</text>

  <!-- 5. 拼接 -->
  <rect x="200" y="400" width="240" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="220" y="420" font-size="10" fill="#b85450" font-weight="bold">④ 拼接两段</text>
  <text x="220" y="436" font-size="10" fill="#333">sTail.next = lDummy.next</text>
  <text x="220" y="450" font-size="10" fill="#333">lTail.next = null   ← 防环！</text>

  <line x1="320" y1="456" x2="320" y2="472" stroke="#b85450" stroke-width="1.2" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- 6. 返回 -->
  <rect x="220" y="476" width="200" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="320" y="498" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">⑤ 返回 sDummy.next</text>

  <!-- 底部说明 -->
  <rect x="20" y="524" width="480" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="542" text-anchor="middle" font-size="10" fill="#8a6a20">要点：尾插天然保序 ｜ 两条哑节点统一空链 ｜ 必须断开 lTail.next 否则大段尾可能指回原链成环</text>
</svg>
