<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#b85450" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">划分型 DP：枚举第一段的终点 x</text>

  <!-- 后缀 s[i..n-1] 的两段切分 -->
  <rect x="60" y="56" width="190" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="155" y="76" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">s[i..x]</text>
  <text x="155" y="94" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">第 1 段，代价 v[i][x]</text>

  <rect x="250" y="56" width="210" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="355" y="76" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">s[x+1..n−1]</text>
  <text x="355" y="94" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">再划分 j−1 段：dp[j−1][x+1]</text>

  <line x1="250" y1="52" x2="250" y2="104" stroke="#b85450" stroke-width="2" stroke-dasharray="5,4" filter="url(#rough2)"/>

  <text x="62" y="120" text-anchor="start" font-size="11" fill="#666" filter="url(#rough2)">i</text>
  <text x="242" y="120" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">x</text>
  <text x="258" y="120" text-anchor="start" font-size="11" fill="#666" filter="url(#rough2)">x+1</text>
  <text x="458" y="120" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">n−1</text>

  <path d="M 260 128 L 260 148" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 转移方程 -->
  <rect x="50" y="152" width="420" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="180" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">dp[j][i] = min { v[i][x] + dp[j−1][x+1] }</text>
  <text x="260" y="202" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">min 对所有 x ≥ i+1 取：第一段定代价，后缀接着分</text>

  <!-- 三个要点 -->
  <rect x="80" y="232" width="360" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="253" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">边界：dp[0][n] = 0；其余状态 = ∞</text>

  <rect x="80" y="274" width="360" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="295" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">每段长度 ≥ 2 ⇒ x ≥ i+1（长度 1 无合法因数）</text>

  <rect x="80" y="316" width="360" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="337" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">答案：dp[k][0]</text>
</svg>
