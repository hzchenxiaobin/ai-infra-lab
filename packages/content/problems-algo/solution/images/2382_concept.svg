<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：删除 = 分裂（正向难），加回 = 合并（反向易）</text>

  <!-- divider -->
  <line x1="300" y1="46" x2="300" y2="430" stroke="#ddd" stroke-width="1.2" stroke-dasharray="3,4" filter="url(#rough2)"/>

  <!-- ============ Left: forward split ============ -->
  <text x="150" y="62" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">正向：删除一个点 → 段分裂</text>

  <!-- row of cells 1 2 5 6 1 -->
  <g filter="url(#rough2)">
    <rect x="40"  y="76" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="60"  y="97" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">1</text>
    <rect x="80"  y="76" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="100" y="97" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">2</text>
    <rect x="120" y="76" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="140" y="97" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">5</text>
    <rect x="160" y="76" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="180" y="97" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">6</text>
    <rect x="200" y="76" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="220" y="97" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">1</text>
  </g>
  <!-- bracket spanning whole = 14 -->
  <path d="M 44 112 L 44 120 L 236 120 L 236 112" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="140" y="138" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">整段和 = 14（当前最大）</text>

  <!-- arrow down: delete idx3 (value 6) -->
  <path d="M 180 152 L 180 178" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="180" y="170" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">删除 idx=3（值 6）</text>

  <!-- row after deletion: 1 2 5 X 1 -->
  <g filter="url(#rough2)">
    <rect x="40"  y="186" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="60"  y="207" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">1</text>
    <rect x="80"  y="186" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="100" y="207" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">2</text>
    <rect x="120" y="186" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="140" y="207" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">5</text>
    <rect x="160" y="186" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="3,3" rx="4"/>
    <text x="180" y="207" text-anchor="middle" font-size="15" fill="#bbb" font-weight="bold">✕</text>
    <rect x="200" y="186" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="220" y="207" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">1</text>
  </g>
  <!-- two brackets: [1,2,5]=7 and [1]=1 -->
  <path d="M 44 222 L 44 230 L 156 230 L 156 222" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="100" y="246" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">= 7</text>
  <path d="M 204 222 L 204 230 L 236 230 L 236 222" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="220" y="246" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">= 1</text>

  <!-- note box: max dropped -->
  <rect x="40" y="262" width="200" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="140" y="284" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">最大 14 → 7（下降）</text>
  <text x="140" y="302" text-anchor="middle" font-size="11" fill="#666">最大可能下落，须重扫</text>
  <text x="140" y="318" text-anchor="middle" font-size="11" fill="#666">或用平衡树删最大值</text>

  <!-- ============ Right: reverse merge ============ -->
  <text x="460" y="62" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">反向：加回一个点 → 段合并</text>

  <!-- state before undo: X 2 5 X 1, segments {2,5}=7 and {1}=1 -->
  <g filter="url(#rough2)">
    <rect x="340" y="76" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="3,3" rx="4"/>
    <text x="360" y="97" text-anchor="middle" font-size="15" fill="#bbb" font-weight="bold">✕</text>
    <rect x="380" y="76" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="400" y="97" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">2</text>
    <rect x="420" y="76" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="440" y="97" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">5</text>
    <rect x="460" y="76" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="3,3" rx="4"/>
    <text x="480" y="97" text-anchor="middle" font-size="15" fill="#bbb" font-weight="bold">✕</text>
    <rect x="500" y="76" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="520" y="97" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">1</text>
  </g>
  <path d="M 384 112 L 384 120 L 456 120 L 456 112" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="420" y="138" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">{2,5}=7</text>
  <text x="520" y="138" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">{1}=1</text>
  <text x="460" y="156" text-anchor="middle" font-size="11" fill="#888">cur = 7</text>

  <!-- arrow down: add back idx=3 (value 6) -->
  <path d="M 480 168 L 480 194" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="480" y="186" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">加回 idx=3（值 6）</text>

  <!-- after merge: X 2 5 6 1, single bracket =14 -->
  <g filter="url(#rough2)">
    <rect x="340" y="202" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="3,3" rx="4"/>
    <text x="360" y="223" text-anchor="middle" font-size="15" fill="#bbb" font-weight="bold">✕</text>
    <rect x="380" y="202" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="400" y="223" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">2</text>
    <rect x="420" y="202" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="440" y="223" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">5</text>
    <rect x="460" y="202" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <text x="480" y="223" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">6</text>
    <rect x="500" y="202" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="520" y="223" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">1</text>
  </g>
  <path d="M 384 238 L 384 246 L 536 246 L 536 238" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="460" y="264" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">合并 → {2,5,6,1} = 7+6+1 = 14</text>

  <!-- note box: cur grows -->
  <rect x="340" y="280" width="200" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="440" y="302" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">cur = max(7, 14) = 14</text>
  <text x="440" y="320" text-anchor="middle" font-size="11" fill="#666">段和只增不减</text>
  <text x="440" y="336" text-anchor="middle" font-size="11" fill="#666">单标量跟踪最大即可</text>

  <!-- ============ Bottom insight box ============ -->
  <rect x="40" y="360" width="520" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="300" y="384" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">反向处理：从「全删」终态出发，按 removeQueries 逆序把点加回</text>
  <text x="300" y="406" text-anchor="middle" font-size="12" fill="#446688">正向删除使段分裂、最大可能下降（需有序结构删最大）；</text>
  <text x="300" y="424" text-anchor="middle" font-size="12" fill="#4a7a3a">反向加回使段合并、最大只增不减（并查集 + 一个标量 max 即可）</text>
  <text x="300" y="442" text-anchor="middle" font-size="11" fill="#888">撤销第 i 次删除 → 状态即「前 i−1 次删除后」→ 填 answer[i−1]</text>
</svg>
