<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：画一条分界线，左侧全 0、右侧全 1</text>

  <!-- ===== Target shape ===== -->
  <text x="40" y="52" font-size="12" fill="#888">目标形态：前面若干 0，后面若干 1</text>
  <rect x="120" y="60" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="79" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="164" y="60" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="186" y="79" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="208" y="60" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="79" text-anchor="middle" font-size="12" fill="#333">0</text>
  <!-- divider -->
  <path d="M 256 56 L 256 92" stroke="#d6a040" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="260" y="60" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="282" y="79" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="304" y="60" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="326" y="79" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="348" y="60" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="79" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="186" y="104" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">← 全 0 →</text>
  <text x="326" y="104" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">← 全 1 →</text>

  <!-- separator -->
  <path d="M 40 120 L 520 120" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <!-- ===== Original string with divider p=3 ===== -->
  <text x="40" y="142" font-size="12" fill="#888">原串 s = 0 1 0 1 1 0，画分界线 p = 3</text>
  <!-- idx0 '0' blue keep -->
  <rect x="76" y="150" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="98" y="169" text-anchor="middle" font-size="12" fill="#333">0</text>
  <!-- idx1 '1' red flip -->
  <rect x="120" y="150" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="142" y="169" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="142" y="146" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1→0 翻</text>
  <!-- idx2 '0' blue keep -->
  <rect x="164" y="150" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="186" y="169" text-anchor="middle" font-size="12" fill="#333">0</text>
  <!-- divider at x=208 -->
  <path d="M 208 146 L 208 186" stroke="#d6a040" stroke-width="2.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="208" y="140" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">p=3</text>
  <!-- idx3 '1' green keep -->
  <rect x="212" y="150" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="234" y="169" text-anchor="middle" font-size="12" fill="#333">1</text>
  <!-- idx4 '1' green keep -->
  <rect x="256" y="150" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="278" y="169" text-anchor="middle" font-size="12" fill="#333">1</text>
  <!-- idx5 '0' orange flip -->
  <rect x="300" y="150" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="322" y="169" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <text x="322" y="146" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">0→1 翻</text>

  <!-- zone labels -->
  <text x="142" y="194" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">左侧 → 全 0</text>
  <text x="266" y="194" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">右侧 → 全 1</text>

  <!-- ===== Cost breakdown ===== -->
  <text x="40" y="218" font-size="12" fill="#888">代价 = 左侧 1 的个数 + 右侧 0 的个数</text>

  <rect x="60" y="226" width="170" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="145" y="244" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">onesLeft</text>
  <text x="145" y="260" text-anchor="middle" font-size="10" fill="#666">左侧 1 的个数 = 1</text>

  <text x="244" y="250" text-anchor="middle" font-size="16" fill="#555" font-weight="bold">+</text>

  <rect x="262" y="226" width="170" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="347" y="244" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">zerosRight</text>
  <text x="347" y="260" text-anchor="middle" font-size="10" fill="#666">右侧 0 的个数 = 1</text>

  <text x="446" y="250" text-anchor="middle" font-size="16" fill="#555" font-weight="bold">=</text>
  <rect x="460" y="226" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="490" y="252" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- ===== Bottom: enumerate all p ===== -->
  <rect x="40" y="290" width="480" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="314" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">枚举所有分界点 p ∈ [0, n]，取 cost(p) 最小值</text>
  <text x="280" y="332" text-anchor="middle" font-size="11" fill="#666">zerosRight = (n − p) − (totalOnes − onesLeft)，O(1) 算出</text>
  <text x="280" y="350" text-anchor="middle" font-size="11" fill="#888">一次预处理 totalOnes + 增量维护 onesLeft → O(n) 时间 / O(1) 空间</text>
</svg>
