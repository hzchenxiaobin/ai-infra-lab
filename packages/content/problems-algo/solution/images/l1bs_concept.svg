<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：正方形四条边各是一段连续 1</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">以右下角 (i,j) 为锚点，边长 k → 查 4 段连续 1 的长度是否 ≥ k</text>

  <!-- ===== left: 3x3 grid, border highlighted ===== -->
  <text x="60" y="68" font-size="12" fill="#888">grid（橙色=边界1，红框=答案正方形）</text>

  <!-- row 0: all 1, border -->
  <rect x="120" y="74" width="56" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="148" y="102" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="176" y="74" width="56" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="204" y="102" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="232" y="74" width="56" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="102" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <!-- row 1: 1, 0(center, faded), 1 -->
  <rect x="120" y="118" width="56" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="148" y="146" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="176" y="118" width="56" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="204" y="146" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">0</text>
  <rect x="232" y="118" width="56" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="146" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <!-- row 2: all 1, border -->
  <rect x="120" y="162" width="56" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="148" y="190" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="176" y="162" width="56" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="204" y="190" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="232" y="162" width="56" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="190" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>

  <!-- red square frame around the 3x3 (k=3), corners -->
  <rect x="116" y="70" width="176" height="140" fill="none" stroke="#b85450" stroke-width="2.6" rx="6" filter="url(#rough2)"/>

  <!-- corner label (i,j) = bottom-right -->
  <text x="288" y="180" font-size="10" fill="#b85450" font-weight="bold">(i,j)</text>
  <text x="288" y="192" font-size="9" fill="#888">右下角</text>

  <text x="204" y="226" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">中心可为 0，只看边界 → 边长 k=3，面积 9</text>

  <!-- ===== right: four edges check ===== -->
  <text x="430" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">四条边 = 四段连续 1</text>

  <!-- top edge -->
  <rect x="350" y="84" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="425" y="104" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">上边：left[顶行][j] ≥ k</text>

  <!-- bottom edge -->
  <rect x="350" y="120" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="425" y="140" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">下边：left[i][j] ≥ k</text>

  <!-- left edge -->
  <rect x="350" y="156" width="150" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="425" y="176" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">左边：up[i][左列] ≥ k</text>

  <!-- right edge -->
  <rect x="350" y="192" width="150" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="425" y="212" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">右边：up[i][j] ≥ k</text>

  <!-- arrow connecting concept to checks -->
  <path d="M 296 140 L 344 140" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="132" text-anchor="middle" font-size="9" fill="#888">需验证</text>

  <!-- ===== bottom: definition of left / up ===== -->
  <rect x="40" y="250" width="480" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="274" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">预处理两张表（以 1 为单位的“连续长度前缀和”）</text>
  <text x="60" y="300" font-size="12" fill="#b85450" font-weight="bold">left[i][j]</text>
  <text x="130" y="300" font-size="11" fill="#555">= 从 (i,j) 向左（同行）连续 1 的个数（含自身）</text>
  <text x="60" y="322" font-size="12" fill="#4a7a3a" font-weight="bold">up[i][j]</text>
  <text x="130" y="322" font-size="11" fill="#555">= 从 (i,j) 向上（同列）连续 1 的个数（含自身）</text>
  <text x="60" y="346" font-size="10.5" fill="#888">grid[i][j]=0 时两表均归 0；=1 时 left = left[i][j−1]+1，up = up[i−1][j]+1</text>
</svg>
