<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    示例演算：[[1,2],[3,5],[2,2]], E=2
  </text>

  <!-- table header -->
  <rect x="40" y="46" width="520" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="64" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">阶段</text>
  <text x="175" y="64" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">A (p/t)</text>
  <text x="175" y="76" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">增益</text>
  <text x="285" y="64" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">B (p/t)</text>
  <text x="285" y="76" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">增益</text>
  <text x="395" y="64" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">C (p/t)</text>
  <text x="395" y="76" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">增益</text>
  <text x="500" y="64" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">堆顶选择</text>

  <!-- Row 0: initial -->
  <rect x="40" y="86" width="520" height="36" fill="#fafafa" stroke="#bbbbbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="80" y="108" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">初始</text>
  <text x="175" y="100" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1/2</text>
  <text x="175" y="114" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">1/6≈0.167</text>
  <text x="285" y="100" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3/5</text>
  <text x="285" y="114" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">1/15≈0.067</text>
  <text x="395" y="100" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2/2</text>
  <text x="395" y="114" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="500" y="108" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">→ 选 A</text>

  <!-- arrow down -->
  <path d="M300,124 L300,134" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Row 1: after step 1 -->
  <rect x="40" y="138" width="520" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="80" y="160" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">加 1 后</text>
  <text x="175" y="152" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">2/3 ✓</text>
  <text x="175" y="166" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">1/12≈0.083</text>
  <text x="285" y="152" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3/5</text>
  <text x="285" y="166" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">0.067</text>
  <text x="395" y="152" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2/2</text>
  <text x="395" y="166" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="500" y="160" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">→ 选 A</text>
  <text x="450" y="180" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">(A 增益仍 &gt; B)</text>

  <path d="M300,176 L300,186" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Row 2: after step 2 (final) -->
  <rect x="40" y="190" width="520" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="214" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">最终</text>
  <text x="175" y="206" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">3/4 ✓✓</text>
  <text x="175" y="220" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">=0.75</text>
  <text x="285" y="206" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3/5</text>
  <text x="285" y="220" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">=0.60</text>
  <text x="395" y="206" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2/2</text>
  <text x="395" y="220" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">=1.00</text>
  <text x="500" y="214" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">E 用完</text>

  <!-- summary computation -->
  <rect x="40" y="248" width="520" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="268" text-anchor="middle" font-size="12" fill="#5a4a1a" filter="url(#rough2)">汇总计算</text>
  <text x="60" y="290" font-size="11" fill="#333" filter="url(#rough2)">和 = 3/4 + 3/5 + 2/2</text>
  <text x="280" y="290" font-size="11" fill="#333" filter="url(#rough2)">= 0.75 + 0.60 + 1.00</text>
  <text x="60" y="310" font-size="11" fill="#333" filter="url(#rough2)">平均 = 和 / n</text>
  <text x="280" y="310" font-size="11" fill="#333" filter="url(#rough2)">= 2.35 / 3</text>
  <text x="440" y="310" font-size="12" fill="#b85450" filter="url(#rough2)">≈ 0.78333 ✓</text>
  <text x="60" y="330" font-size="10" fill="#888" filter="url(#rough2)">两个聪明学生都塞进 A 班（通过率最低、提升空间最大）</text>

  <!-- contrast box -->
  <rect x="40" y="354" width="520" height="86" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="4 3" rx="8" filter="url(#rough2)"/>
  <text x="300" y="374" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">反例对照：若两生各塞一个班（A、B 各一）</text>
  <text x="60" y="396" font-size="11" fill="#888" filter="url(#rough2)">A→2/3, B→4/6 → 和 = 0.667 + 0.667 + 1.0 = 2.333</text>
  <text x="380" y="396" font-size="11" fill="#888" filter="url(#rough2)">平均 ≈ 0.778 &lt; 0.783</text>
  <text x="60" y="418" font-size="10" fill="#b85450" filter="url(#rough2)">原因：第一生给 A 收益 0.167，第二生再给 A 收益 0.083，</text>
  <text x="60" y="432" font-size="10" fill="#b85450" filter="url(#rough2)">仍高于给 B 的 0.067 → “集中加给 A”更优（凹性：边际递减但未跌破次优）</text>
</svg>
