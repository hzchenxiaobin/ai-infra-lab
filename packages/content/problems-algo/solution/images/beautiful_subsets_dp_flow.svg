<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#444" font-weight="bold">算法流程：频次统计 → 按余类分组 → 组内两状态 DP → 乘积减空集</text>

  <!-- Step 1 -->
  <rect x="130" y="38" width="260" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="56" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">① 统计频次 cnt[v]，按 v mod k 分组</text>
  <text x="260" y="71" text-anchor="middle" font-size="9.5" fill="#555">不同余类永不冲突 → 各组独立</text>

  <path d="M 260 80 L 260 92" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="130" y="94" width="260" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="112" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">② 组内升序，初始化两状态</text>
  <text x="260" y="127" text-anchor="middle" font-size="10" fill="#555">dp0 = 1（跳过首值）,  dp1 = 2^cnt[首值] − 1（取首值）</text>

  <path d="M 260 136 L 260 148" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 : loop body -->
  <rect x="36" y="150" width="370" height="118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="221" y="168" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">③ 组内遍历值（升序，i = 1 … n−1）</text>
  <text x="221" y="183" text-anchor="middle" font-size="10" fill="#555">gap = vals[i] − vals[i−1],  w = 2^cnt[vals[i]] − 1</text>
  <text x="221" y="198" text-anchor="middle" font-size="10" fill="#555">ndp0 = dp0 + dp1　（跳过 vals[i]）</text>

  <!-- decision: two branches -->
  <rect x="50" y="206" width="165" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="132" y="225" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">gap==k：ndp1 = w·dp0</text>

  <rect x="227" y="206" width="165" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="309" y="225" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">gap≠k：ndp1 = w·(dp0+dp1)</text>

  <text x="221" y="258" text-anchor="middle" font-size="10" fill="#555">dp0, dp1 ← ndp0, ndp1　（每组得 dp0+dp1）</text>

  <!-- loop-back arrow on the right -->
  <path d="M 406 170 L 442 170 L 442 200 L 410 200" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="452" y="188" text-anchor="middle" font-size="9" fill="#446688">循环</text>

  <path d="M 221 270 L 221 282" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4 -->
  <rect x="70" y="284" width="302" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="221" y="303" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">④ 答案 = ∏ 各组 (dp0 + dp1) − 1</text>
  <text x="221" y="319" text-anchor="middle" font-size="10" fill="#555">各组方案数相乘，再扣全空集</text>

  <!-- bottom note -->
  <text x="260" y="346" text-anchor="middle" font-size="9.5" fill="#888">组内 gap==k 判链相邻；gap&gt;k 断链。跨余类必先分组</text>
</svg>
