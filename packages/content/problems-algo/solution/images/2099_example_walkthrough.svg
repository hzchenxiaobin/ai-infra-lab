<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：nums = [3,4,3,3], k = 2</text>

  <text x="50" y="56" font-size="10.5" fill="#888" font-weight="bold" filter="url(#rough2)">步骤</text>
  <text x="160" y="56" font-size="10.5" fill="#888" font-weight="bold" filter="url(#rough2)">操作</text>
  <text x="300" y="56" font-size="10.5" fill="#888" font-weight="bold" filter="url(#rough2)">结果（值,下标）</text>

  <!-- Step 1 -->
  <rect x="30" y="66" width="500" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="50" y="98" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">①</text>
  <text x="160" y="92" font-size="11" fill="#333" filter="url(#rough2)">构造 (值,下标) 对</text>
  <text x="160" y="108" font-size="9.5" fill="#888" filter="url(#rough2)">enumerate(nums)</text>
  <rect x="300" y="82" width="46" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="323" y="99" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">(3,0)</text>
  <rect x="350" y="82" width="46" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="373" y="99" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">(4,1)</text>
  <rect x="400" y="82" width="46" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="423" y="99" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">(3,2)</text>
  <rect x="450" y="82" width="46" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="473" y="99" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">(3,3)</text>

  <path d="M 280 124 L 280 138" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="30" y="142" width="500" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="50" y="174" font-size="14" fill="#d6a040" font-weight="bold" filter="url(#rough2)">②</text>
  <text x="160" y="168" font-size="11" fill="#333" filter="url(#rough2)">按值降序排序</text>
  <text x="160" y="184" font-size="9.5" fill="#888" filter="url(#rough2)">4 &gt; 3 = 3 = 3</text>
  <rect x="300" y="158" width="46" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="323" y="175" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">(4,1)</text>
  <rect x="350" y="158" width="46" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="373" y="175" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">(3,0)</text>
  <rect x="400" y="158" width="46" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="423" y="175" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">(3,2)</text>
  <rect x="450" y="158" width="46" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="473" y="175" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">(3,3)</text>

  <path d="M 280 200 L 280 214" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="30" y="218" width="500" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="50" y="250" font-size="14" fill="#d6a040" font-weight="bold" filter="url(#rough2)">③</text>
  <text x="160" y="244" font-size="11" fill="#333" filter="url(#rough2)">取前 k=2 个</text>
  <text x="160" y="260" font-size="9.5" fill="#888" filter="url(#rough2)">top = pairs[:2]</text>
  <rect x="300" y="234" width="46" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="323" y="251" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">(4,1)</text>
  <rect x="350" y="234" width="46" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="373" y="251" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">(3,0)</text>
  <rect x="400" y="234" width="46" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3 2" rx="3" filter="url(#rough2)"/>
  <text x="423" y="251" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">(3,2)</text>
  <rect x="450" y="234" width="46" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3 2" rx="3" filter="url(#rough2)"/>
  <text x="473" y="251" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">(3,3)</text>
  <text x="504" y="251" font-size="9.5" fill="#888" filter="url(#rough2)">←选中</text>

  <path d="M 280 276 L 280 290" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 4 -->
  <rect x="30" y="294" width="500" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="50" y="326" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">④</text>
  <text x="160" y="320" font-size="11" fill="#333" filter="url(#rough2)">按下标升序排序</text>
  <text x="160" y="336" font-size="9.5" fill="#888" filter="url(#rough2)">0 &lt; 1</text>
  <rect x="300" y="310" width="46" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="323" y="327" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">(3,0)</text>
  <rect x="350" y="310" width="46" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="373" y="327" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">(4,1)</text>

  <path d="M 280 352 L 280 366" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 5 -->
  <rect x="30" y="370" width="500" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="50" y="402" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⑤</text>
  <text x="160" y="396" font-size="11" fill="#333" filter="url(#rough2)">取 value 输出</text>
  <text x="160" y="412" font-size="9.5" fill="#888" filter="url(#rough2)">return [v for v,_]</text>
  <rect x="300" y="386" width="46" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="323" y="403" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="350" y="386" width="46" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="373" y="403" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="410" y="403" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ [3, 4] ✓</text>

  <text x="280" y="446" text-anchor="middle" font-size="10" fill="#888" font-style="italic" filter="url(#rough2)">若步骤②并列的 3 排成 (3,2) 在前，则得 [4,3]，同样合法</text>
</svg>
