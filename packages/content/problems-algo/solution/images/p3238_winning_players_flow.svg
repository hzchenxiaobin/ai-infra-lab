<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：先计数，后判定</text>

  <!-- 开始 -->
  <rect x="215" y="36" width="90" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="13" filter="url(#rough2)"/>
  <text x="260" y="53" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">开始</text>

  <path d="M 260 62 L 260 72" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 阶段一 -->
  <rect x="140" y="76" width="240" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="95" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">① 计数：遍历 pick 每条 [x, y]</text>

  <text x="130" y="95" text-anchor="end" font-size="10" fill="#446688" filter="url(#rough2)">计数</text>

  <path d="M 260 106 L 260 116" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="160" y="120" width="170" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="245" y="139" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">cnt[x][y] += 1</text>

  <path d="M 330 143 C 354 148, 354 122, 332 123" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="360" y="137" text-anchor="start" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">重复 m 次</text>

  <path d="M 260 150 L 260 160" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 阶段二 -->
  <rect x="140" y="164" width="240" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="183" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">② 判定：逐玩家 i = 0 … n−1</text>

  <text x="130" y="183" text-anchor="end" font-size="10" fill="#d6a040" filter="url(#rough2)">判定</text>

  <path d="M 260 194 L 260 204" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 菱形判定 -->
  <polygon points="260,210 385,242 260,274 135,242" fill="#ffffff" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="237" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">max(cnt[i][·])</text>
  <text x="260" y="253" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">&gt; i ?</text>

  <path d="M 133 242 L 118 242" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="125" y="233" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="18" y="226" width="95" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="65" y="246" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans++ ✓</text>

  <path d="M 387 242 L 402 242" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="394" y="233" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="408" y="226" width="95" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="455" y="246" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">跳过 ✗</text>

  <!-- 汇合 -->
  <path d="M 65 258 C 65 274, 120 280, 155 284" stroke="#446688" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 455 258 C 455 274, 400 280, 365 284" stroke="#446688" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="140" y="278" width="240" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="296" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">换下一个玩家（命中即 break 颜色循环）</text>

  <!-- 循环箭头 -->
  <path d="M 382 292 C 402 290, 402 188, 384 186" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="408" y="272" text-anchor="start" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">i+1</text>

  <!-- 返回 -->
  <path d="M 260 306 L 260 314" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="296" y="314" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">n 人判完</text>

  <rect x="210" y="318" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="13" filter="url(#rough2)"/>
  <text x="260" y="335" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans</text>
</svg>
