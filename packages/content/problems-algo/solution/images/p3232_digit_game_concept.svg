<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：两桶互补，Alice 选一堆、Bob 拿另一堆</text>

  <!-- nums 数组 -->
  <text x="140" y="60" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">nums</text>
  <rect x="158" y="42" width="36" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="176" y="61" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="200" y="42" width="36" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="218" y="61" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="242" y="42" width="36" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="61" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="284" y="42" width="36" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="302" y="61" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="326" y="42" width="36" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="344" y="61" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">10</text>

  <!-- 分桶箭头 -->
  <path d="M 176 74 C 160 84, 140 90, 120 100" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 344 74 C 360 84, 380 90, 400 100" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="118" y="94" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">按位数分桶</text>
  <text x="402" y="94" text-anchor="middle" font-size="9.5" fill="#d6a040" filter="url(#rough2)">按位数分桶</text>

  <!-- 个位桶 -->
  <rect x="36" y="102" width="216" height="66" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="144" y="124" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">个位桶 · 和 = single</text>
  <text x="144" y="150" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1 + 2 + 3 + 4 = 10</text>

  <!-- 两位桶 -->
  <rect x="268" y="102" width="216" height="66" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="376" y="124" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">两位桶 · 和 = dbl</text>
  <text x="376" y="150" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10 = 10</text>

  <!-- 两种选法 -->
  <rect x="30" y="190" width="200" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="130" y="210" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">选法① Alice 拿 single</text>
  <text x="130" y="230" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">Bob 拿 dbl → 胜 ⟺ S &gt; D</text>

  <rect x="290" y="190" width="200" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="390" y="210" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">选法② Alice 拿 dbl</text>
  <text x="390" y="230" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">Bob 拿 single → 胜 ⟺ D &gt; S</text>

  <!-- 互为镜像 -->
  <path d="M 236 218 L 284 218" stroke="#446688" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 284 226 L 236 226" stroke="#446688" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="260" y="208" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">互为镜像</text>

  <!-- 结论框 -->
  <rect x="60" y="262" width="400" height="60" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="284" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">single ≠ dbl → true：大桶必存在，Alice 挑大桶稳赢</text>
  <text x="260" y="306" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">single = dbl → false：怎么选都平手，严格大于不成立</text>

  <text x="260" y="348" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">Bob 永远接盘 Alice 不选的那一堆——伪博弈，实判定</text>
</svg>
