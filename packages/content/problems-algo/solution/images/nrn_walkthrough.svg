<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="480" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：root = [1,2,3,null,4,5,6], u = 4</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">BFS 逐层扫描，在 L2 找到 u=4，返回同层下一个节点 5</text>

  <!-- ===== Round 1: L0 ===== -->
  <rect x="20" y="56" width="540" height="86" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="40" y="78" font-size="12" fill="#b85450" font-weight="bold">轮次 1 — L0</text>

  <text x="40" y="100" font-size="11" fill="#333">队列：</text>
  <rect x="90" y="86" width="48" height="22" rx="4" fill="#fff" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="114" y="102" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>

  <text x="160" y="100" font-size="11" fill="#333">弹出 1，1 ≠ u</text>
  <text x="290" y="100" font-size="11" fill="#888">→ 推入左(2)、右(3)</text>
  <text x="440" y="100" font-size="11" fill="#aaa">未命中</text>

  <text x="40" y="128" font-size="10" fill="#888">下一轮队列：[2, 3]</text>

  <line x1="290" y1="144" x2="290" y2="156" stroke="#888" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Round 2: L1 ===== -->
  <rect x="20" y="158" width="540" height="86" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="40" y="180" font-size="12" fill="#446688" font-weight="bold">轮次 2 — L1</text>

  <text x="40" y="202" font-size="11" fill="#333">队列：</text>
  <rect x="90" y="188" width="48" height="22" rx="4" fill="#fff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="114" y="204" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">2</text>
  <rect x="144" y="188" width="48" height="22" rx="4" fill="#fff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="168" y="204" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">3</text>

  <text x="210" y="202" font-size="11" fill="#333">弹 2 → 2≠u，推右(4)</text>
  <text x="370" y="202" font-size="11" fill="#333">弹 3 → 3≠u，推左(5)、右(6)</text>

  <text x="40" y="230" font-size="10" fill="#888">下一轮队列：[4, 5, 6]</text>

  <line x1="290" y1="246" x2="290" y2="258" stroke="#888" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Round 3: L2 ===== -->
  <rect x="20" y="260" width="540" height="110" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="40" y="282" font-size="12" fill="#4a7a3a" font-weight="bold">轮次 3 — L2　⭐ 命中层</text>

  <text x="40" y="304" font-size="11" fill="#333">队列：</text>
  <rect x="90" y="290" width="48" height="22" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="114" y="306" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">4</text>
  <rect x="144" y="290" width="48" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="168" y="306" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">5</text>
  <rect x="198" y="290" width="48" height="22" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="222" y="306" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">6</text>

  <text x="40" y="336" font-size="11" fill="#b85450" font-weight="bold">弹 4 → 4 == u ✅ 命中！</text>
  <text x="220" y="336" font-size="11" fill="#4a7a3a" font-weight="bold">→ 队首 = 5，返回 5</text>

  <text x="40" y="356" font-size="10" fill="#888">i=0 不是本层最后（size=3），直接返回 queue.front() = 5</text>

  <!-- Arrow from 4 to 5 -->
  <path d="M 138 301 L 144 301" stroke="#b85450" stroke-width="2.5" stroke-dasharray="4,2" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>

  <!-- ===== Result ===== -->
  <rect x="120" y="388" width="340" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="412" text-anchor="middle" font-size="14" fill="#7a5a20" font-weight="bold">结果：返回节点 5</text>
  <text x="290" y="432" text-anchor="middle" font-size="10" fill="#888">L0: [1] 未命中 → L1: [2,3] 未命中 → L2: [4,5,6] 命中 4 → 返回 5</text>

  <!-- Note: example 2 -->
  <rect x="40" y="452" width="500" height="22" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="290" y="468" text-anchor="middle" font-size="10" fill="#b85450">示例 2：root=[3,null,4,2], u=2 → L2 队列=[2]，2 是本层最后 → return null</text>
</svg>
