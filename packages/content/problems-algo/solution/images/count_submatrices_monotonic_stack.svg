<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">单调栈演算：h = [3, 1, 2, 1]，计算 Σ min(h[l..r])</text>

  <!-- ===== Top: histogram ===== -->
  <line x1="40" y1="98" x2="360" y2="98" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>

  <rect x="55" y="50" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="79" y="44" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>

  <rect x="130" y="82" width="48" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="154" y="76" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>

  <rect x="205" y="66" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="229" y="60" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>

  <rect x="280" y="82" width="48" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="304" y="76" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>

  <text x="79" y="114" text-anchor="middle" font-size="10" fill="#888">j=0</text>
  <text x="154" y="114" text-anchor="middle" font-size="10" fill="#888">j=1</text>
  <text x="229" y="114" text-anchor="middle" font-size="10" fill="#888">j=2</text>
  <text x="304" y="114" text-anchor="middle" font-size="10" fill="#888">j=3</text>

  <!-- ===== 4 panels: stack state per step ===== -->
  <!-- Panel 0: j=0, h=3 -->
  <rect x="30" y="125" width="125" height="180" fill="none" stroke="#ddd" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <rect x="30" y="125" width="125" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="92" y="142" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">j=0, h=3</text>
  <text x="92" y="162" text-anchor="middle" font-size="10" fill="#888">push(3, 1)</text>
  <!-- stack box -->
  <rect x="47" y="250" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="92" y="269" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">(3, 1)</text>
  <text x="92" y="295" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">cur = 3</text>

  <!-- Panel 1: j=1, h=1 -->
  <rect x="167" y="125" width="125" height="180" fill="none" stroke="#ddd" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <rect x="167" y="125" width="125" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="229" y="142" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">j=1, h=1</text>
  <text x="229" y="162" text-anchor="middle" font-size="10" fill="#888">pop(3,1), push(1,2)</text>
  <!-- stack box -->
  <rect x="184" y="250" width="90" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="229" y="269" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">(1, 2)</text>
  <text x="229" y="295" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">cur = 2</text>

  <!-- Panel 2: j=2, h=2 -->
  <rect x="304" y="125" width="125" height="180" fill="none" stroke="#ddd" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <rect x="304" y="125" width="125" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="366" y="142" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">j=2, h=2</text>
  <text x="366" y="162" text-anchor="middle" font-size="10" fill="#888">push(2, 1)</text>
  <!-- stack: (1,2) bottom, (2,1) top -->
  <rect x="321" y="222" width="90" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="366" y="241" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">(2, 1)</text>
  <rect x="321" y="250" width="90" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="366" y="269" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">(1, 2)</text>
  <text x="366" y="295" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">cur = 4</text>

  <!-- Panel 3: j=3, h=1 -->
  <rect x="441" y="125" width="125" height="180" fill="none" stroke="#ddd" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <rect x="441" y="125" width="125" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="503" y="142" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">j=3, h=1</text>
  <text x="503" y="160" text-anchor="middle" font-size="9" fill="#888">pop(2,1), pop(1,2)</text>
  <text x="503" y="174" text-anchor="middle" font-size="10" fill="#888">push(1, 4)</text>
  <!-- stack box -->
  <rect x="458" y="250" width="90" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="503" y="269" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">(1, 4)</text>
  <text x="503" y="295" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">cur = 4</text>

  <!-- ===== Bottom: formula & total ===== -->
  <rect x="30" y="320" width="520" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="342" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">栈中 (h, c) 含义：有 c 个以 j 结尾的子数组，最小值 = h</text>
  <text x="290" y="360" text-anchor="middle" font-size="11" fill="#555">cur_sum = Σ(栈中 h × c)，每步 ans += cur_sum</text>

  <rect x="30" y="380" width="520" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="401" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">总计 = 3 + 2 + 4 + 4 = 13</text>
</svg>
