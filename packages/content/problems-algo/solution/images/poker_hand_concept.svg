<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：花色维度判 Flush，点数维度按 max 频次分级，优先级级联</text>

  <!-- Left: 花色维度 suits -->
  <rect x="30" y="48" width="220" height="150" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="140" y="70" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">花色维度：suits</text>
  <text x="140" y="88" text-anchor="middle" font-size="10.5" fill="#888">只看花色，不看点数</text>
  <!-- 5 cards same suit -->
  <rect x="50" y="100" width="30" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="65" y="124" text-anchor="middle" font-size="11" fill="#333">a</text>
  <rect x="86" y="100" width="30" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="101" y="124" text-anchor="middle" font-size="11" fill="#333">a</text>
  <rect x="122" y="100" width="30" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="137" y="124" text-anchor="middle" font-size="11" fill="#333">a</text>
  <rect x="158" y="100" width="30" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="173" y="124" text-anchor="middle" font-size="11" fill="#333">a</text>
  <rect x="194" y="100" width="30" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="209" y="124" text-anchor="middle" font-size="11" fill="#333">a</text>
  <text x="140" y="160" text-anchor="middle" font-size="11" fill="#555">max 频次 m_s</text>
  <rect x="90" y="166" width="100" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="140" y="183" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">m_s = 5 ⟹ Flush</text>

  <!-- Right: 点数维度 ranks -->
  <rect x="310" y="48" width="220" height="150" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="420" y="70" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">点数维度：ranks</text>
  <text x="420" y="88" text-anchor="middle" font-size="10.5" fill="#888">只看点数，不看花色</text>
  <!-- 5 cards: 4,4,2,4,4 -->
  <rect x="330" y="100" width="30" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="345" y="124" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="366" y="100" width="30" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="381" y="124" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="402" y="100" width="30" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="417" y="124" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="438" y="100" width="30" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="453" y="124" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="474" y="100" width="30" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="489" y="124" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="420" y="160" text-anchor="middle" font-size="11" fill="#555">max 频次 m_r</text>
  <rect x="320" y="166" width="200" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="420" y="183" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">m_r ≥3 三条 / ≥2 对子 / =1 高牌</text>

  <!-- arrows down to cascade -->
  <path d="M 140 214 L 140 232" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 420 214 L 420 232" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Divider -->
  <path d="M 40 248 L 520 248" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Priority cascade bar -->
  <text x="280" y="268" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">优先级级联（命中即返回）</text>
  <rect x="40" y="278" width="480" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="300" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">Flush &gt; Three of a Kind &gt; Pair &gt; High Card</text>

  <!-- Notes -->
  <text x="40" y="334" font-size="11" fill="#555">• 两维度正交：同花判 suits，三条/对子/高牌判 ranks，可同时满足但只报最高级</text>
  <text x="40" y="352" font-size="11" fill="#555">• 阈值用 ≥ ：四条(m_r=4)、葫芦(3+2) 都被 m_r≥3 吸收进「三条」</text>
  <text x="40" y="370" font-size="10.5" fill="#888">注：Flush 只依赖 m_s=5，不参与点数分级，故级联顺序 = 优先级顺序</text>
</svg>
