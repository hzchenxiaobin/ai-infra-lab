<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="540" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：从右向左，先判"1"再配"3""2"</text>

  <!-- ===== Start ===== -->
  <rect x="180" y="46" width="180" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="18" filter="url(#rough2)"/>
  <text x="270" y="69" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">初始化：stack=[], s3 = −∞</text>
  <path d="M 270 82 L 270 100" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Loop entry ===== -->
  <rect x="170" y="104" width="200" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="122" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">for i = n−1 downto 0</text>
  <text x="270" y="136" text-anchor="middle" font-size="10" fill="#888">x = nums[i]（从右向左取）</text>
  <path d="M 270 144 L 270 162" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Decision: x < s3 ? ===== -->
  <polygon points="270,166 380,206 270,246 160,206" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="202" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">x &lt; s3 ?</text>
  <text x="270" y="218" text-anchor="middle" font-size="9" fill="#b85450">（判"1"：x 比"2"小吗）</text>

  <!-- yes → return true -->
  <path d="M 380 206 L 430 206" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="405" y="200" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="434" y="186" width="96" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="482" y="204" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">找到"1"</text>
  <text x="482" y="218" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return true</text>

  <!-- no → down to while -->
  <path d="M 270 246 L 270 268" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="262" font-size="10" fill="#666" font-weight="bold">否</text>

  <!-- ===== While: pop ===== -->
  <rect x="130" y="272" width="280" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="294" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">while stack≠∅ 且 x &gt; stack.top()</text>
  <text x="270" y="312" text-anchor="middle" font-size="10" fill="#4a7a3a">s3 ← stack.pop()</text>
  <text x="270" y="324" text-anchor="middle" font-size="9" fill="#888">栈顶当"2"，x 当"3"；栈递减→最后弹的是最大→s3 取 max</text>
  <path d="M 270 328 L 270 346" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== push ===== -->
  <rect x="180" y="350" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="368" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">stack.push(x)</text>
  <text x="270" y="382" text-anchor="middle" font-size="9" fill="#888">x 成为新的"3"候选</text>
  <path d="M 270 390 L 270 410" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== loop back: next i ===== -->
  <rect x="190" y="414" width="160" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="270" y="436" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">i ← i−1（下一个，更靠左）</text>

  <!-- loop back arrow: from "next i" up to "for i" box, on the left side -->
  <path d="M 190 431 L 100 431 L 100 124 L 170 124" stroke="#d6a040" stroke-width="1.4" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="74" y="280" font-size="10" fill="#d6a040" font-weight="bold">继续</text>
  <text x="74" y="294" font-size="9" fill="#d6a040">下一轮</text>

  <!-- ===== end: return false ===== -->
  <path d="M 270 448 L 270 470" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="462" font-size="9" fill="#888">i 走完未命中</text>
  <rect x="180" y="474" width="180" height="40" fill="#f6f6f6" stroke="#888" stroke-width="1.6" rx="18" filter="url(#rough2)"/>
  <text x="270" y="492" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">遍历结束</text>
  <text x="270" y="506" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">return false</text>

  <!-- ===== side note: order matters ===== -->
  <rect x="430" y="272" width="100" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="480" y="290" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">顺序不能换</text>
  <text x="436" y="306" font-size="8.5" fill="#555">① 先判"1"</text>
  <text x="436" y="320" font-size="8.5" fill="#555">　（用上一轮的</text>
  <text x="436" y="332" font-size="8.5" fill="#555">　 s3）</text>
  <text x="436" y="346" font-size="8.5" fill="#555">② 再弹栈更新 s3</text>
  <text x="436" y="358" font-size="8.5" fill="#555">③ 最后 push(x)</text>
  <text x="436" y="368" font-size="8" fill="#b85450">x 不能自己当"1"又当"3"</text>
</svg>
