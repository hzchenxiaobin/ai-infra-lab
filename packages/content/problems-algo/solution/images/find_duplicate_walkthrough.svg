<svg xmlns="http://www.w3.org/2000/svg" width="920" height="580" viewBox="0 0 920 580" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    <marker id="arL" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="920" height="580" fill="#fafafa"/>
  <text x="460" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：nums = [1, 3, 4, 2, 2]</text>
  <path d="M 320 44 Q 460 52 600 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 顶部小图：节点与边 -->
  <g filter="url(#sk)">
    <ellipse cx="130" cy="100" rx="26" ry="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <ellipse cx="290" cy="100" rx="26" ry="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <ellipse cx="450" cy="100" rx="26" ry="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <ellipse cx="610" cy="100" rx="30" ry="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
    <ellipse cx="610" cy="178" rx="26" ry="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="130" y="106" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">0</text>
  <text x="290" y="106" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">1</text>
  <text x="450" y="106" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">3</text>
  <text x="610" y="107" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450">2</text>
  <text x="610" y="184" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">4</text>
  <path d="M 156 100 L 262 100" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>
  <path d="M 316 100 L 422 100" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>
  <path d="M 476 100 L 578 100" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>
  <path d="M 610 124 L 610 156" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <path d="M 584 178 Q 540 150 540 120 Q 540 100 580 100" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arR)" stroke-dasharray="4 3" filter="url(#sk)"/>
  <text x="660" y="84" font-size="12" font-weight="bold" fill="#b85450">环入口=2</text>
  <text x="660" y="100" font-size="11" fill="#b85450">= 重复数</text>

  <!-- 阶段一表格 -->
  <text x="230" y="232" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688">阶段一：找相遇点</text>
  <g filter="url(#sk)">
    <rect x="60" y="244" width="380" height="30" rx="4" fill="#446688"/>
  </g>
  <text x="95" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">步数</text>
  <text x="165" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">slow</text>
  <text x="245" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">fast</text>
  <text x="350" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">说明</text>

  <g filter="url(#sk)">
    <rect x="60" y="274" width="380" height="28" fill="#fff" stroke="#bbb"/>
    <rect x="60" y="302" width="380" height="28" fill="#f7faff" stroke="#bbb"/>
    <rect x="60" y="330" width="380" height="28" fill="#fff" stroke="#bbb"/>
    <rect x="60" y="358" width="380" height="28" fill="#f7faff" stroke="#bbb"/>
    <rect x="60" y="386" width="380" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="95" y="293" text-anchor="middle" font-size="12" fill="#333">初始</text>
  <text x="165" y="293" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">0</text>
  <text x="245" y="293" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">0</text>
  <text x="350" y="293" text-anchor="middle" font-size="11" fill="#666">起点</text>

  <text x="95" y="321" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="165" y="321" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">1</text>
  <text x="245" y="321" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">3</text>
  <text x="350" y="321" text-anchor="middle" font-size="11" fill="#666">nums[0] / nums[1]</text>

  <text x="95" y="349" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="165" y="349" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">3</text>
  <text x="245" y="349" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">4</text>
  <text x="350" y="349" text-anchor="middle" font-size="11" fill="#666">nums[1] / nums[3]</text>

  <text x="95" y="377" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="165" y="377" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">2</text>
  <text x="245" y="377" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">4</text>
  <text x="350" y="377" text-anchor="middle" font-size="11" fill="#666">nums[3] / nums[4]</text>

  <text x="95" y="405" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="165" y="405" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">4</text>
  <text x="245" y="405" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">4</text>
  <text x="350" y="405" text-anchor="middle" font-size="11" fill="#b85450">相遇于节点 4 ✓</text>

  <!-- 阶段二表格 -->
  <text x="700" y="232" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a">阶段二：找环入口</text>
  <g filter="url(#sk)">
    <rect x="500" y="244" width="380" height="30" rx="4" fill="#4a7a3a"/>
  </g>
  <text x="535" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">步数</text>
  <text x="605" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">slow</text>
  <text x="685" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">fast</text>
  <text x="790" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">说明</text>

  <g filter="url(#sk)">
    <rect x="500" y="274" width="380" height="30" fill="#fff" stroke="#bbb"/>
    <rect x="500" y="304" width="380" height="30" fill="#f5fbf5" stroke="#bbb"/>
    <rect x="500" y="334" width="380" height="30" fill="#fff" stroke="#bbb"/>
    <rect x="500" y="364" width="380" height="30" fill="#f5fbf5" stroke="#bbb"/>
    <rect x="500" y="394" width="380" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="535" y="294" text-anchor="middle" font-size="12" fill="#333">初始</text>
  <text x="605" y="294" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">0</text>
  <text x="685" y="294" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">4</text>
  <text x="790" y="294" text-anchor="middle" font-size="11" fill="#666">slow 回起点</text>

  <text x="535" y="324" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="605" y="324" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">1</text>
  <text x="685" y="324" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">2</text>
  <text x="790" y="324" text-anchor="middle" font-size="11" fill="#666">nums[0] / nums[4]</text>

  <text x="535" y="354" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="605" y="354" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">3</text>
  <text x="685" y="354" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">4</text>
  <text x="790" y="354" text-anchor="middle" font-size="11" fill="#666">nums[1] / nums[2]</text>

  <text x="535" y="384" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="605" y="384" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">2</text>
  <text x="685" y="384" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">2</text>
  <text x="790" y="384" text-anchor="middle" font-size="11" fill="#b85450">相遇于节点 2 ✓</text>

  <!-- 结果框 -->
  <g filter="url(#sk)">
    <rect x="280" y="450" width="360" height="50" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="460" y="472" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">阶段二相遇节点 = 环入口 = 2</text>
  <text x="460" y="490" text-anchor="middle" font-size="13" fill="#b85450">返回 2，即重复数字 ✓</text>

  <!-- 底部说明 -->
  <g filter="url(#sk)">
    <rect x="120" y="520" width="680" height="44" rx="8" fill="#fffdf3" stroke="#d6a040"/>
  </g>
  <text x="460" y="540" text-anchor="middle" font-size="12" fill="#7a5415">阶段一 slow 走 1 步、fast 走 2 步找相遇点；阶段二 slow 回 0、二者同速走找入口。</text>
  <text x="460" y="557" text-anchor="middle" font-size="12" fill="#7a5415">两次相遇的"差"恰好抵消环长，故入口即重复数。</text>
</svg>
