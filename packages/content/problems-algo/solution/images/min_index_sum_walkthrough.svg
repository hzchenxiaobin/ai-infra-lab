<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 2 演算：list2 扫描过程</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">list1=["Shogun","Tapioca Express","Burger King","KFC"]</text>

  <!-- ===== Phase 1: built map ===== -->
  <text x="100" y="70" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">阶段① 已建表</text>
  <rect x="30" y="78" width="180" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="60" y="98" text-anchor="middle" font-size="9" fill="#888">key</text>
  <text x="140" y="98" text-anchor="middle" font-size="9" fill="#888">val</text>
  <line x1="100" y1="84" x2="100" y2="166" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="60" y="116" text-anchor="middle" font-size="9" fill="#333">Shogun</text>
  <text x="140" y="116" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">0</text>
  <text x="60" y="132" text-anchor="middle" font-size="8" fill="#333">Tapioca</text>
  <text x="140" y="132" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="60" y="148" text-anchor="middle" font-size="8" fill="#333">Burger K.</text>
  <text x="140" y="148" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="60" y="164" text-anchor="middle" font-size="9" fill="#333">KFC</text>
  <text x="140" y="164" text-anchor="middle" font-size="10" fill="#333">3</text>

  <!-- ===== Phase 2: scan list2 table ===== -->
  <text x="350" y="70" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">阶段② 扫描 list2（minSum=∞, res=[]）</text>

  <!-- table header -->
  <rect x="230" y="78" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="250" y="94" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">j</text>
  <rect x="270" y="78" width="100" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="320" y="94" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">list2[j]</text>
  <rect x="370" y="78" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="390" y="94" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">i</text>
  <rect x="410" y="78" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="430" y="94" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">i+j</text>
  <rect x="450" y="78" width="110" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="505" y="94" text-anchor="middle" font-size="9" fill="#444" font-weight="bold">动作 / minSum / res</text>

  <!-- row j=0 -->
  <rect x="230" y="100" width="40" height="26" fill="#f7f7f7" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="250" y="118" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="270" y="100" width="100" height="26" fill="#f7f7f7" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="320" y="118" text-anchor="middle" font-size="9" fill="#333">KFC</text>
  <rect x="370" y="100" width="40" height="26" fill="#f7f7f7" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="390" y="118" text-anchor="middle" font-size="10" fill="#333">3</text>
  <rect x="410" y="100" width="40" height="26" fill="#f7f7f7" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="430" y="118" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3</text>
  <rect x="450" y="100" width="110" height="26" fill="#f7f7f7" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="505" y="118" text-anchor="middle" font-size="8" fill="#555">3&lt;∞ 重置</text>

  <!-- row j=1 highlighted -->
  <rect x="230" y="126" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="250" y="144" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>
  <rect x="270" y="126" width="100" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="320" y="144" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">Shogun</text>
  <rect x="370" y="126" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="390" y="144" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">0</text>
  <rect x="410" y="126" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="430" y="144" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <rect x="450" y="126" width="110" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="505" y="144" text-anchor="middle" font-size="8" fill="#444" font-weight="bold">1&lt;3 重置 ⭐</text>

  <!-- row j=2 -->
  <rect x="230" y="152" width="40" height="26" fill="#f7f7f7" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="250" y="170" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="270" y="152" width="100" height="26" fill="#f7f7f7" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="320" y="170" text-anchor="middle" font-size="8" fill="#333">Burger King</text>
  <rect x="370" y="152" width="40" height="26" fill="#f7f7f7" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="390" y="170" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="410" y="152" width="40" height="26" fill="#f7f7f7" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="430" y="170" text-anchor="middle" font-size="10" fill="#888">4</text>
  <rect x="450" y="152" width="110" height="26" fill="#f7f7f7" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="505" y="170" text-anchor="middle" font-size="8" fill="#888">4&gt;1 忽略</text>

  <!-- ===== state tracking ===== -->
  <text x="280" y="206" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">状态追踪</text>

  <rect x="40" y="216" width="150" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="115" y="236" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold">j=0 后</text>
  <text x="115" y="252" text-anchor="middle" font-size="10" fill="#333">minSum = 3</text>
  <text x="115" y="266" text-anchor="middle" font-size="9" fill="#333">res = ["KFC"]</text>

  <rect x="205" y="216" width="150" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="236" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">j=1 后 ⭐</text>
  <text x="280" y="252" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">minSum = 1</text>
  <text x="280" y="266" text-anchor="middle" font-size="9" fill="#333">res = ["Shogun"]</text>

  <rect x="370" y="216" width="150" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="445" y="236" text-anchor="middle" font-size="10" fill="#3a5a2a" font-weight="bold">j=2 后</text>
  <text x="445" y="252" text-anchor="middle" font-size="10" fill="#333">minSum = 1</text>
  <text x="445" y="266" text-anchor="middle" font-size="9" fill="#333">res = ["Shogun"]</text>

  <!-- arrows between states -->
  <path d="M 190 244 L 205 244" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 355 244 L 370 244" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== result ===== -->
  <rect x="120" y="300" width="320" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="328" text-anchor="middle" font-size="13" fill="#7a4a10" font-weight="bold">返回 res = ["Shogun"]</text>

  <!-- ===== insight ===== -->
  <rect x="24" y="358" width="512" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="380" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">关键：j=1 出现更小索引和(1&lt;3)，必须先清空 res 再加入 "Shogun"</text>
  <text x="280" y="398" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">若忘记清空会残留 "KFC" → 错误返回 ["KFC","Shogun"]</text>
</svg>
