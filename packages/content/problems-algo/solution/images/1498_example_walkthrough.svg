<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="22" text-anchor="middle" font-size="13.5" fill="#444" font-weight="bold">示例演算：nums = [3, 5, 6, 7]，target = 9（排序后不变）</text>

  <!-- ============ Step 1 ============ -->
  <text x="40" y="54" font-size="12" fill="#446688" font-weight="bold">① left = 0，nums[0] = 3 作为 min</text>

  <!-- left pointer -->
  <path d="M 195 60 L 195 76" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="195" y="118" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">left</text>

  <!-- right pointer (lands on index2=6) -->
  <path d="M 299 60 L 299 76" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="299" y="118" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">right</text>

  <!-- sorted cells: 3,5,6,7 -->
  <rect x="170" y="78" width="50" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="195" y="98" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <rect x="222" y="78" width="50" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="247" y="98" text-anchor="middle" font-size="13" fill="#333">5</text>

  <rect x="274" y="78" width="50" height="30" rx="4" fill="#e6f4ea" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="299" y="98" text-anchor="middle" font-size="13" fill="#333">6</text>

  <rect x="326" y="78" width="50" height="30" rx="4" fill="#eeeeee" stroke="#999" stroke-width="1.4" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="351" y="98" text-anchor="middle" font-size="13" fill="#999">7</text>

  <!-- annotations: right movement -->
  <rect x="406" y="74" width="206" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="509" y="90" text-anchor="middle" font-size="10.5" fill="#b85450">3 + 7 = 10 &gt; 9 ✗ → right−−</text>
  <text x="509" y="104" text-anchor="middle" font-size="10.5" fill="#4a7a3a">3 + 6 = 9 ≤ 9 ✓ → right = 2</text>

  <!-- count box -->
  <rect x="40" y="138" width="250" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="165" y="158" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2^(right−left) = 2^(2−0) = 4</text>

  <!-- subsequence chips -->
  <text x="40" y="190" font-size="10.5" fill="#555">合法子序列：</text>
  <rect x="130" y="178" width="70" height="24" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="165" y="194" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">[3]</text>

  <rect x="208" y="178" width="80" height="24" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="248" y="194" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">[3,5]</text>

  <rect x="296" y="178" width="80" height="24" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="336" y="194" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">[3,6]</text>

  <rect x="384" y="178" width="96" height="24" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="432" y="194" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">[3,5,6]</text>

  <text x="496" y="194" font-size="11" fill="#b85450" font-weight="bold">ans = 4</text>

  <!-- ============ Step 2 ============ -->
  <text x="40" y="232" font-size="12" fill="#446688" font-weight="bold">② left = 1，nums[1] = 5 作为 min</text>

  <!-- left pointer at index1 -->
  <path d="M 247 238 L 247 254" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="247" y="296" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">left</text>

  <!-- cells: 3 grey, 5 blue, 6 grey, 7 grey -->
  <rect x="170" y="256" width="50" height="30" rx="4" fill="#eeeeee" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="195" y="276" text-anchor="middle" font-size="13" fill="#999">3</text>

  <rect x="222" y="256" width="50" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="247" y="276" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>

  <rect x="274" y="256" width="50" height="30" rx="4" fill="#eeeeee" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="299" y="276" text-anchor="middle" font-size="13" fill="#999">6</text>

  <rect x="326" y="256" width="50" height="30" rx="4" fill="#eeeeee" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="351" y="276" text-anchor="middle" font-size="13" fill="#999">7</text>

  <!-- annotation: right drops below left -->
  <rect x="406" y="252" width="206" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="509" y="268" text-anchor="middle" font-size="10.5" fill="#b85450">5 + 6 = 11 &gt; 9 ✗</text>
  <text x="509" y="282" text-anchor="middle" font-size="10.5" fill="#b85450">5 + 5 = 10 &gt; 9 ✗</text>
  <text x="509" y="296" text-anchor="middle" font-size="10.5" fill="#888">right 跌到 0 &lt; left → 终止</text>

  <text x="496" y="276" font-size="11" fill="#888"></text>

  <!-- break note -->
  <rect x="40" y="316" width="250" height="28" rx="6" fill="#eeeeee" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="165" y="334" text-anchor="middle" font-size="11.5" fill="#888">right &lt; left → break（后续 left 更大必也超）</text>

  <!-- ============ Result ============ -->
  <rect x="40" y="362" width="560" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="384" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">答案 = 4 + 0 = 4</text>
  <text x="320" y="404" text-anchor="middle" font-size="10.5" fill="#555">每个子序列 min+max ≤ target：[3],[3,5],[3,6],[3,5,6] 均满足</text>
</svg>
