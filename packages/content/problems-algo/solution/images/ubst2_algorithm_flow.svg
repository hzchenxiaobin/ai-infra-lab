<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：分治 build(start, end)</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">递归返回「该区间所有 BST」组成的列表</text>

  <!-- ===== Entry ===== -->
  <rect x="180" y="58" width="180" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="82" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">调用 build(start, end)</text>
  <path d="M 270 96 L 270 114" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Decision: base case ===== -->
  <polygon points="270,118 360,158 270,198 180,158" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="154" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">start &gt; end ?</text>
  <text x="270" y="170" text-anchor="middle" font-size="9" fill="#888">空区间</text>

  <!-- Yes branch -->
  <path d="M 180 158 L 96 158 L 96 232" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="138" y="150" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="40" y="236" width="116" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="98" y="256" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return [None]</text>
  <text x="98" y="272" text-anchor="middle" font-size="9" fill="#555">含一棵「空树」</text>
  <text x="98" y="284" text-anchor="middle" font-size="9" fill="#888">对应 96 的 G(0)=1</text>

  <!-- No branch -->
  <path d="M 360 158 L 444 158 L 444 184" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="396" y="150" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <!-- ===== Enumerate root ===== -->
  <rect x="380" y="188" width="128" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="444" y="206" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">枚举根 i</text>
  <text x="444" y="220" text-anchor="middle" font-size="10" fill="#333">i ∈ [start, end]</text>
  <path d="M 444 230 L 444 248" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Recursive calls ===== -->
  <rect x="356" y="252" width="176" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="444" y="270" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">递归</text>
  <text x="444" y="284" text-anchor="middle" font-size="10" fill="#333">L = build(start, i-1)</text>
  <text x="444" y="298" text-anchor="middle" font-size="10" fill="#333">R = build(i+1, end)</text>

  <!-- ===== Combine ===== -->
  <path d="M 356 280 L 318 280" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="180" y="252" width="138" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="249" y="270" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">笛卡尔积拼树</text>
  <text x="249" y="284" text-anchor="middle" font-size="9" fill="#333">for L, R:</text>
  <text x="249" y="298" text-anchor="middle" font-size="9" fill="#333">new TreeNode(i, L, R)</text>

  <!-- combine -> collect -->
  <path d="M 249 310 L 249 318" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="170" y="322" width="158" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="249" y="342" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">加入 ans 列表，return ans</text>

  <!-- loop back arrow from combine to enumerate root -->
  <path d="M 444 308 Q 444 346 380 346 Q 250 346 250 332" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="350" y="360" text-anchor="middle" font-size="9" fill="#888">i 遍历完区间即返回</text>
</svg>
