<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：两个官方示例套闭式的全过程</text>

  <!-- panel 1: example 1 -->
  <rect x="30" y="44" width="272" height="300" fill="#ffffff" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="166" y="68" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 1：abcd → cdab，k = 2</text>

  <text x="46" y="94" font-size="10.5" fill="#333" filter="url(#rough2)">· n = 4，s+s = "abcdabcd" 中 t 命中 p=2</text>
  <text x="46" y="112" font-size="10.5" fill="#333" filter="url(#rough2)">· 好偏移 = {2}：m = 1，m₀ = 0，m₁ = 1</text>
  <text x="46" y="130" font-size="10.5" fill="#333" filter="url(#rough2)">· p = (n−1)^k = 3² = 9，sign = (+1)^2 = +1</text>

  <rect x="46" y="142" width="240" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="166" y="164" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">x₂ = (9 + 3×1) / 4 = 3　（净位移 0）</text>
  <text x="166" y="186" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">y₂ = (9 − 1) / 4 = 2　（净位移 ≠ 0）</text>

  <text x="46" y="222" font-size="10.5" fill="#333" filter="url(#rough2)">· 答案 = 0×x₂ + 1×y₂ = 2 ✓</text>

  <text x="46" y="248" font-size="10.5" fill="#666" filter="url(#rough2)">对应的两条操作序列（净和 ≡ 2）：</text>
  <text x="46" y="268" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">① (l=1, l=1)：abcd→dabc→cdab</text>
  <text x="46" y="288" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">② (l=3, l=3)：abcd→bcda→cdab</text>
  <text x="46" y="316" font-size="10" fill="#999" filter="url(#rough2)">共 (n−1)^k = 9 条序列，净位移分布</text>
  <text x="46" y="332" font-size="10" fill="#999" filter="url(#rough2)">3/2/2/2 —— 总数 9，与闭式一致</text>

  <!-- panel 2: example 2 -->
  <rect x="318" y="44" width="272" height="300" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="454" y="68" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">示例 2：ababab → ababab，k = 1</text>

  <text x="334" y="94" font-size="10.5" fill="#333" filter="url(#rough2)">· n = 6，s 有周期 2，s == t</text>
  <text x="334" y="112" font-size="10.5" fill="#333" filter="url(#rough2)">· 好偏移 = {0,2,4}：m = 3，m₀ = 1，m₁ = 2</text>
  <text x="334" y="130" font-size="10.5" fill="#333" filter="url(#rough2)">· p = 5¹ = 5，sign = (−1)¹ = −1</text>

  <rect x="334" y="142" width="240" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="454" y="164" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">x₁ = (5 − 5) / 6 = 0　（净位移 0）</text>
  <text x="454" y="186" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">y₁ = (5 + 1) / 6 = 1　（净位移 ≠ 0）</text>

  <text x="334" y="222" font-size="10.5" fill="#333" filter="url(#rough2)">· 答案 = 1×x₁ + 2×y₁ = 0 + 2 = 2 ✓</text>

  <text x="334" y="248" font-size="10.5" fill="#666" filter="url(#rough2)">一步到不了"净位移 0"（x₁ = 0）：l ∈ [1,5]</text>
  <text x="334" y="268" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">① l=2：后缀 "abab" 前置 → ababab</text>
  <text x="334" y="288" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">② l=4：后缀 "ab" 前置 → ababab</text>
  <text x="334" y="316" font-size="10" fill="#999" filter="url(#rough2)">l=2 与 l=4 得到相同字符串，但算</text>
  <text x="334" y="332" font-size="10" fill="#999" filter="url(#rough2)">两种方案 —— 方案按操作序列计数</text>
</svg>
