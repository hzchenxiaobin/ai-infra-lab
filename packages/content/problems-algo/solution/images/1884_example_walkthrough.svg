<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#b85450" stroke-width="1.6"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#4a7a3a" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n=6, m=3（递减步长 3, 2, 1）</text>

  <!-- ===== Building (6 floors), x 150..200, top y=90, bottom y=282, floor 32 tall ===== -->
  <rect x="150" y="90" width="50" height="192" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>

  <!-- floor separators + numbers, floor f center y = 266 - (f-1)*32 -->
  <line x1="150" y1="250" x2="200" y2="250" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="142" y="270" text-anchor="end" font-size="11" fill="#999">1</text>
  <line x1="150" y1="218" x2="200" y2="218" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="142" y="238" text-anchor="end" font-size="11" fill="#999">2</text>
  <line x1="150" y1="186" x2="200" y2="186" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="142" y="206" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <line x1="150" y1="154" x2="200" y2="154" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="142" y="174" text-anchor="end" font-size="11" fill="#999">4</text>
  <line x1="150" y1="122" x2="200" y2="122" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="142" y="142" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold">5</text>
  <text x="142" y="110" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold">6</text>

  <!-- egg1 drop markers at floors 3, 5, 6 -->
  <ellipse cx="175" cy="202" rx="9" ry="11" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="175" y="206" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">扔</text>
  <ellipse cx="175" cy="138" rx="9" ry="11" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="175" y="142" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">扔</text>
  <ellipse cx="175" cy="106" rx="9" ry="11" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="175" y="110" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">扔</text>

  <!-- gap brackets -->
  <path d="M 206 250 L 212 250 L 212 186 L 206 186" fill="none" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="218" y="222" font-size="11" fill="#446688" font-weight="bold">步长 3</text>
  <path d="M 206 154 L 212 154 L 212 122 L 206 122" fill="none" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="218" y="142" font-size="11" fill="#446688" font-weight="bold">步长 2</text>
  <path d="M 206 122 L 212 122 L 212 90 L 206 90" fill="none" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="218" y="104" font-size="11" fill="#446688" font-weight="bold">步长 1</text>

  <!-- ===== Right: three scenarios ===== -->
  <!-- scenario 1: breaks at 3 -->
  <rect x="300" y="60" width="240" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="312" y="82" font-size="12" fill="#b85450" font-weight="bold">① 碎于 3 楼</text>
  <text x="312" y="100" font-size="11" fill="#444">第 2 枚蛋扫 1、2 楼（2 次）</text>
  <text x="312" y="116" font-size="11" fill="#444">共 1 + 2 = <tspan fill="#b85450" font-weight="bold">3 次</tspan>，定 f ∈ {0,1,2}</text>

  <!-- scenario 2: breaks at 5 -->
  <rect x="300" y="138" width="240" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="312" y="160" font-size="12" fill="#b85450" font-weight="bold">② 没碎于 3，碎于 5 楼</text>
  <text x="312" y="178" font-size="11" fill="#444">第 2 枚蛋扫 4 楼（1 次）</text>
  <text x="312" y="194" font-size="11" fill="#444">共 2 + 1 = <tspan fill="#b85450" font-weight="bold">3 次</tspan>，定 f ∈ {3,4}</text>

  <!-- scenario 3: at 6 -->
  <rect x="300" y="216" width="240" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="312" y="238" font-size="12" fill="#4a7a3a" font-weight="bold">③ 5 楼没碎，扔 6 楼</text>
  <text x="312" y="256" font-size="11" fill="#444">碎 ⇒ f = 5；没碎 ⇒ f = 6</text>
  <text x="312" y="272" font-size="11" fill="#444">共 3 次，定 f ∈ {5,6}</text>

  <!-- ===== Bottom: conclusion ===== -->
  <rect x="120" y="300" width="320" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">三种情况最坏均 = 3 = m</text>
  <text x="280" y="344" text-anchor="middle" font-size="12" fill="#444">验证：m(m+1)/2 = 3×4/2 = 6 = n ✓</text>

  <text x="280" y="378" text-anchor="middle" font-size="11" fill="#888">递减步长让“已用次数 + 待扫层数”处处相等，最坏代价被拉平</text>
</svg>
