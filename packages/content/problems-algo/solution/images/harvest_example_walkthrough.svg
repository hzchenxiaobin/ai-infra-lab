<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 2: startPos = 5, k = 4</text>

  <!-- Optimal window highlight -->
  <rect x="200" y="60" width="180" height="180" fill="#e8f0fe" fill-opacity="0.35" stroke="#446688" stroke-width="1.5" stroke-dasharray="6,3" rx="6" filter="url(#rough2)"/>
  <text x="290" y="54" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">最优窗口 [4, 7]</text>

  <!-- Fruit bars: pos 0(amt 9), 4(1), 5(7), 6(2), 7(4), 10(9) -->
  <!-- Scale: pos * 36 + 50, bar height = amt * 5, bottom at y=240 -->

  <!-- pos 0, amt 9 (outside window) -->
  <rect x="46" y="195" width="18" height="45" fill="#ccc" fill-opacity="0.5" stroke="#999" stroke-width="1.5" rx="2" filter="url(#rough)"/>
  <text x="55" y="255" text-anchor="middle" font-size="10" fill="#999">0</text>
  <text x="55" y="188" text-anchor="middle" font-size="9" fill="#999">9</text>

  <!-- pos 4, amt 1 (in window, left boundary) -->
  <rect x="194" y="235" width="18" height="5" fill="#b85450" fill-opacity="0.7" stroke="#8a3a36" stroke-width="2" rx="2" filter="url(#rough)"/>
  <text x="203" y="255" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">4</text>
  <text x="203" y="228" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>

  <!-- pos 5, amt 7 (startPos, in window) -->
  <rect x="230" y="205" width="18" height="35" fill="#d6a040" fill-opacity="0.7" stroke="#a07020" stroke-width="2" rx="2" filter="url(#rough)"/>
  <text x="239" y="255" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">5</text>
  <text x="239" y="198" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">7</text>

  <!-- pos 6, amt 2 (in window) -->
  <rect x="266" y="230" width="18" height="10" fill="#6c8ebf" fill-opacity="0.7" stroke="#446688" stroke-width="2" rx="2" filter="url(#rough)"/>
  <text x="275" y="255" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">6</text>
  <text x="275" y="223" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">2</text>

  <!-- pos 7, amt 4 (in window, right boundary) -->
  <rect x="302" y="220" width="18" height="20" fill="#4a7a3a" fill-opacity="0.7" stroke="#3a5a2a" stroke-width="2" rx="2" filter="url(#rough)"/>
  <text x="311" y="255" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">7</text>
  <text x="311" y="213" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">4</text>

  <!-- pos 10, amt 9 (outside window) -->
  <rect x="410" y="195" width="18" height="45" fill="#ccc" fill-opacity="0.5" stroke="#999" stroke-width="1.5" rx="2" filter="url(#rough)"/>
  <text x="419" y="255" text-anchor="middle" font-size="10" fill="#999">10</text>
  <text x="419" y="188" text-anchor="middle" font-size="9" fill="#999">9</text>

  <!-- startPos arrow marker on number line -->
  <path d="M 239 265 L 235 272 L 243 272 Z" fill="#d6a040" filter="url(#rough2)"/>

  <!-- Number line -->
  <path d="M 30 275 Q 260 273 470 275" stroke="#999" stroke-width="2.5" fill="none" filter="url(#rough)"/>
  <text x="239" y="290" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">↑ startPos</text>

  <!-- Path arrows below number line -->
  <!-- Step 1: startPos(5) → left to 4 -->
  <path d="M 239 310 L 212 310" stroke="#b85450" stroke-width="2.5" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="226" y="302" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">← 1步</text>

  <!-- Step 2: 4 → right to 7 -->
  <path d="M 212 335 L 320 335" stroke="#4a7a3a" stroke-width="2.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="266" y="327" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">→ 3步</text>

  <!-- Turn indicator -->
  <path d="M 203 310 L 203 335" stroke="#888" stroke-width="1.5" stroke-dasharray="3,2" fill="none" filter="url(#rough2)"/>
  <text x="180" y="325" font-size="9" fill="#888">转弯</text>

  <!-- Summary box -->
  <rect x="80" y="355" width="360" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="378" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">cost = 2×1 + 2 = 4 ≤ k ✓   水果 = 1+7+2+4 = 14</text>
</svg>
