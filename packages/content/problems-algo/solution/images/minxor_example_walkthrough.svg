<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="560" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：三种 c 与 popcount(num1) 的关系</text>

  <!-- ===== 例1: num1=3, num2=5, c=2 (c == popcount) ===== -->
  <text x="40" y="56" font-size="12" fill="#4a7a3a" font-weight="bold">例1: num1=3, num2=5, c=2（c == popcount(num1)）</text>

  <text x="150" y="82" text-anchor="end" font-size="11" fill="#333" font-weight="bold">num1=3</text>
  <rect x="180" y="66" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="200" y="86" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="222" y="66" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="242" y="86" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="264" y="66" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="284" y="86" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="306" y="66" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="326" y="86" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <text x="356" y="82" font-size="10" fill="#888">两个 1，c=2 全匹配</text>

  <text x="150" y="120" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold">x=3</text>
  <rect x="180" y="104" width="40" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="200" y="124" text-anchor="middle" font-size="13" fill="#999">0</text>
  <rect x="222" y="104" width="40" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="242" y="124" text-anchor="middle" font-size="13" fill="#999">0</text>
  <rect x="264" y="104" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="284" y="124" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="306" y="104" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="326" y="124" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="356" y="120" font-size="11" fill="#4a7a3a" font-weight="bold">XOR=0 ✓</text>

  <!-- divider -->
  <line x1="30" y1="148" x2="540" y2="148" stroke="#ddd" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>

  <!-- ===== 例2: num1=1, num2=12, c=2 (c > popcount) ===== -->
  <text x="40" y="172" font-size="12" fill="#d6a040" font-weight="bold">例2: num1=1, num2=12, c=2（c &gt; popcount(num1)）</text>

  <text x="150" y="198" text-anchor="end" font-size="11" fill="#333" font-weight="bold">num1=1</text>
  <rect x="180" y="182" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="200" y="202" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="222" y="182" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="242" y="202" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="264" y="182" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="284" y="202" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="306" y="182" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="326" y="202" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <text x="356" y="198" font-size="10" fill="#888">一个 1，c=2 &gt; 1 有多余</text>

  <text x="150" y="236" text-anchor="end" font-size="11" fill="#333" font-weight="bold">x=3</text>
  <rect x="180" y="220" width="40" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="200" y="240" text-anchor="middle" font-size="13" fill="#999">0</text>
  <rect x="222" y="220" width="40" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="242" y="240" text-anchor="middle" font-size="13" fill="#999">0</text>
  <rect x="264" y="220" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="284" y="240" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">1</text>
  <rect x="306" y="220" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="326" y="240" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="356" y="236" font-size="10" fill="#888">bit0 匹配，bit1 补位</text>

  <text x="150" y="274" text-anchor="end" font-size="11" fill="#d6a040" font-weight="bold">XOR=2</text>
  <rect x="180" y="258" width="40" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="200" y="278" text-anchor="middle" font-size="13" fill="#999">0</text>
  <rect x="222" y="258" width="40" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="242" y="278" text-anchor="middle" font-size="13" fill="#999">0</text>
  <rect x="264" y="258" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="284" y="278" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">1</text>
  <rect x="306" y="258" width="40" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="326" y="278" text-anchor="middle" font-size="13" fill="#999">0</text>
  <text x="356" y="274" font-size="11" fill="#d6a040" font-weight="bold">差异在最低位 ✓</text>

  <!-- divider -->
  <line x1="30" y1="296" x2="540" y2="296" stroke="#ddd" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>

  <!-- ===== 例3: num1=7, num2=2, c=1 (c < popcount) ===== -->
  <text x="40" y="320" font-size="12" fill="#b85450" font-weight="bold">例3: num1=7, num2=2, c=1（c &lt; popcount(num1)）</text>

  <text x="150" y="346" text-anchor="end" font-size="11" fill="#333" font-weight="bold">num1=7</text>
  <rect x="180" y="330" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="200" y="350" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="222" y="330" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="242" y="350" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="264" y="330" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="284" y="350" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="306" y="330" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="326" y="350" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <text x="356" y="346" font-size="10" fill="#888">三个 1，c=1 只能配最高的</text>

  <text x="150" y="384" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold">x=4</text>
  <rect x="180" y="368" width="40" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="200" y="388" text-anchor="middle" font-size="13" fill="#999">0</text>
  <rect x="222" y="368" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="242" y="388" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="264" y="368" width="40" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="284" y="388" text-anchor="middle" font-size="13" fill="#999">0</text>
  <rect x="306" y="368" width="40" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="326" y="388" text-anchor="middle" font-size="13" fill="#999">0</text>
  <text x="356" y="384" font-size="10" fill="#888">只配 bit2（最高 1）</text>

  <text x="150" y="422" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold">XOR=3</text>
  <rect x="180" y="406" width="40" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="200" y="426" text-anchor="middle" font-size="13" fill="#999">0</text>
  <rect x="222" y="406" width="40" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="242" y="426" text-anchor="middle" font-size="13" fill="#999">0</text>
  <rect x="264" y="406" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="284" y="426" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="306" y="406" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="326" y="426" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <text x="356" y="422" font-size="10" fill="#888">低位 1 留空 → 差异在低位</text>

  <!-- bottom note -->
  <rect x="40" y="452" width="480" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="474" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">统一原则：差异永远往低位挤</text>
  <text x="280" y="494" text-anchor="middle" font-size="11" fill="#333">c == popcount：全匹配 → XOR=0</text>
  <text x="280" y="512" text-anchor="middle" font-size="11" fill="#333">c &gt; popcount：配完 1 再填最低 0 → 差异在填入的低位</text>
  <text x="280" y="530" text-anchor="middle" font-size="11" fill="#333">c &lt; popcount：只配最高 1，低位 1 留空 → 差异在留空的低位</text>
</svg>
