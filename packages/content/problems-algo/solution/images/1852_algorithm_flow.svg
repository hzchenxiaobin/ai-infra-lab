<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：定长滑动窗口 + 频率哈希</text>

  <!-- Step 1: build initial window -->
  <rect x="60" y="48" width="500" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="80" y="68" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">① 建初始窗口</text>
  <text x="80" y="84" font-size="10" fill="#333" filter="url(#rough2)">遍历 nums[0..k−1]，统计 freq；ans[0] = |freq|</text>

  <!-- arrow -->
  <path d="M310 96 L310 112" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 2: loop init -->
  <rect x="60" y="116" width="500" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="80" y="138" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">② for i = 1 … n−k ：（窗口右移 1 格）</text>

  <path d="M310 152 L310 166" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Decision: remove left -->
  <polygon points="310,170 470,206 310,242 150,206" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="200" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">③ 左端出窗 nums[i−1]</text>
  <text x="310" y="216" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">freq[val] − −</text>

  <path d="M310 244 L310 258" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Decision diamond: freq==0? -->
  <polygon points="310,260 430,292 310,324 190,292" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="296" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">freq[val] == 0 ?</text>

  <!-- yes branch: delete -->
  <path d="M190 292 L120 292 L120 312" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="150" y="286" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="74" y="316" width="92" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="120" y="336" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">删除键 val</text>

  <!-- no branch -->
  <path d="M430 292 L500 292 L500 312" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="468" y="286" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="456" y="316" width="92" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="502" y="336" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">保留（仍 &gt;0）</text>

  <!-- merge -->
  <path d="M120 346 L120 362 L300 362" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M502 346 L502 362 L320 362" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M310 362 L310 376" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step: add right -->
  <rect x="60" y="378" width="500" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="80" y="400" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">④ 右端入窗 nums[i+k−1]：freq[val] + +（不存在则置 1）</text>

  <path d="M310 414 L310 428" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step: record -->
  <rect x="60" y="430" width="500" height="0" fill="none"/>

  <!-- final note -->
  <rect x="60" y="424" width="500" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="442" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">⑤ ans[i] = |freq|，循环结束返回 ans</text>
</svg>
