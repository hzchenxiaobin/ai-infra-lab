<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#4a7a3a" stroke-width="1.8"/>
    </marker>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">出界路径数：从一格出发走 4 方向，越界即计数</text>

  <!-- out-of-boundary shaded region (dashed border around grid) -->
  <rect x="120" y="90" width="225" height="225" fill="#fce4ec" fill-opacity="0.35" stroke="#b85450" stroke-width="1.2" stroke-dasharray="6 4" rx="10" filter="url(#rough2)"/>
  <text x="150" y="84" font-size="10" fill="#b85450">← 网格外部（出界区）</text>

  <!-- 3x3 grid -->
  <!-- row 0 -->
  <rect x="150" y="110" width="55" height="55" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="205" y="110" width="55" height="55" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="260" y="110" width="55" height="55" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <!-- row 1 -->
  <rect x="150" y="165" width="55" height="55" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="205" y="165" width="55" height="55" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="260" y="165" width="55" height="55" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <!-- row 2 -->
  <rect x="150" y="220" width="55" height="55" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="205" y="220" width="55" height="55" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="260" y="220" width="55" height="55" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- ball at (0,0) -->
  <circle cx="177" cy="137" r="11" fill="#d6a040" stroke="#8a5a10" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="177" y="141" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">球</text>
  <text x="177" y="100" text-anchor="middle" font-size="10" fill="#8a5a10">起点 (0,0)</text>

  <!-- 4 direction arrows from ball (177,137) -->
  <!-- Up: out of grid (grid top = 110) → GREEN -->
  <path d="M 177 126 L 177 92" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="186" y="104" font-size="10" fill="#4a7a3a" font-weight="bold">↑ 出界 +1</text>

  <!-- Left: out of grid (grid left = 150) → GREEN -->
  <path d="M 166 137 L 132 137" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="100" y="132" font-size="10" fill="#4a7a3a" font-weight="bold">← 出界</text>
  <text x="100" y="146" font-size="10" fill="#4a7a3a" font-weight="bold">+1</text>

  <!-- Down: into (1,0) center (177, 192) → BLUE -->
  <path d="M 177 148 L 177 182" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="186" y="172" font-size="10" fill="#446688">↓ 留界内</text>

  <!-- Right: into (0,1) center (232, 137) → BLUE -->
  <path d="M 188 137 L 222 137" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="196" y="128" font-size="10" fill="#446688">→ 留界内</text>

  <!-- recursion hint from down neighbor -->
  <text x="177" y="206" text-anchor="middle" font-size="9" fill="#888">步数 −1</text>
  <text x="177" y="218" text-anchor="middle" font-size="9" fill="#888">继续走</text>

  <!-- right side: two-case annotation -->
  <rect x="360" y="110" width="150" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="435" y="134" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">情况一：越界</text>
  <text x="435" y="154" text-anchor="middle" font-size="10" fill="#555">邻居在网格外</text>
  <text x="435" y="172" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+1 条路径</text>

  <rect x="360" y="205" width="150" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="435" y="229" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">情况二：留界内</text>
  <text x="435" y="249" text-anchor="middle" font-size="10" fill="#555">邻居在网格内</text>
  <text x="435" y="267" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">+= dp[move−1][邻居]</text>

  <!-- bottom note -->
  <rect x="60" y="300" width="400" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="11" fill="#444">每一步只有这两种结果：要么直接出界（计 1），</text>
  <text x="260" y="334" text-anchor="middle" font-size="11" fill="#444">要么走到邻居格、用掉一步、把问题交给「剩余步数更少的子问题」</text>
</svg>
