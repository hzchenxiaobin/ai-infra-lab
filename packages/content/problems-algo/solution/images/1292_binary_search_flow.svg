<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：二维前缀和 + 二分边长</text>

  <!-- Step 1: build prefix sum -->
  <rect x="170" y="46" width="220" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">① 构建二维前缀和 P</text>
  <text x="280" y="79" text-anchor="middle" font-size="10.5" fill="#555">P[i+1][j+1] = mat[i][j]+P[i][j+1]+P[i+1][j]−P[i][j]</text>

  <!-- arrow -->
  <path d="M 280 86 L 280 100" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: init binary search -->
  <rect x="170" y="104" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="122" text-anchor="middle" font-size="12" fill="#335" font-weight="bold">② 二分边长 k ∈ [1, min(m,n)]</text>
  <text x="280" y="137" text-anchor="middle" font-size="10.5" fill="#555">ans = 0（默认无边长）</text>

  <!-- arrow -->
  <path d="M 280 144 L 280 158" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 3: check(k) rectangle -->
  <rect x="150" y="162" width="260" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="182" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold">③ check(k)：扫描所有 k×k 正方形</text>
  <text x="280" y="198" text-anchor="middle" font-size="10.5" fill="#555">前缀和 O(1) 查区域和，任一 ≤ threshold 即 true</text>

  <!-- arrow to diamond -->
  <path d="M 280 210 L 280 226" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="280,230 380,278 280,326 180,278" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="274" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">check(k)</text>
  <text x="280" y="290" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">为真？</text>

  <!-- Yes branch (right) -->
  <path d="M 380 278 L 440 278" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="408" y="272" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是 ✓</text>
  <rect x="430" y="256" width="118" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="489" y="274" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">ans = k</text>
  <text x="489" y="290" text-anchor="middle" font-size="10.5" fill="#555">lo = k+1（找更大）</text>

  <!-- No branch (left) -->
  <path d="M 180 278 L 120 278" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="152" y="272" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否 ✗</text>
  <rect x="14" y="256" width="106" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="67" y="274" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">边长太大</text>
  <text x="67" y="290" text-anchor="middle" font-size="10.5" fill="#555">hi = k−1</text>

  <!-- loop back arrow (both branches back to step 3) -->
  <path d="M 489 256 L 489 186 L 410 186" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <path d="M 67 256 L 67 186 L 150 186" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <text x="280" y="248" text-anchor="middle" font-size="9.5" fill="#aaa">lo ≤ hi 时循环 ↑</text>

  <!-- arrow down to return -->
  <path d="M 280 326 L 280 366" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="300" y="350" font-size="10" fill="#aaa">lo &gt; hi 结束</text>

  <!-- Step 4: return ans -->
  <rect x="170" y="370" width="220" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="395" text-anchor="middle" font-size="13" fill="#3a5a2a" font-weight="bold">④ 返回 ans（最大可行边长）</text>

  <!-- footer note -->
  <rect x="70" y="420" width="420" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="440" text-anchor="middle" font-size="11" fill="#666">check 单调：k 越大区域和越大（元素 ≥ 0），故存在二段性</text>
</svg>
