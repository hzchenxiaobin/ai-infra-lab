<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：正难则反 — 重复 = 总数 − 各位互异</text>

  <!-- ===== 总集 [1, n] ===== -->
  <rect x="40" y="48" width="480" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">全集 [1, n]　共 n 个正整数</text>
  <text x="280" y="92" text-anchor="middle" font-size="11" fill="#333">例：n = 20 → {1, 2, 3, …, 20}，共 20 个数</text>

  <!-- 分叉箭头 -->
  <path d="M 280 106 L 280 120" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== 左：各位互异 f(n) ===== -->
  <rect x="30" y="124" width="240" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="150" y="146" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">各位互异数 f(n)</text>
  <text x="150" y="166" text-anchor="middle" font-size="11" fill="#333">用数位 DP 统计</text>
  <text x="150" y="186" text-anchor="middle" font-size="11" fill="#333">dfs(pos, tight, lead, mask)</text>
  <text x="150" y="206" text-anchor="middle" font-size="11" fill="#333">例：n=20 → f=19</text>
  <text x="150" y="228" text-anchor="middle" font-size="10" fill="#888">{1..9, 10, 12..19, 20} = 19 个</text>

  <!-- ===== 右：至少1位重复 ===== -->
  <rect x="290" y="124" width="240" height="120" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="410" y="146" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">至少 1 位重复 = 目标答案</text>
  <text x="410" y="166" text-anchor="middle" font-size="11" fill="#333">直接统计很困难</text>
  <text x="410" y="186" text-anchor="middle" font-size="11" fill="#333">（重复位置/次数组合爆炸）</text>
  <text x="410" y="206" text-anchor="middle" font-size="11" fill="#333">例：n=20 → 答案=1</text>
  <text x="410" y="228" text-anchor="middle" font-size="10" fill="#888">{11} = 1 个</text>

  <!-- 减号连接 -->
  <circle cx="280" cy="184" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="190" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">−</text>

  <!-- 汇聚箭头 -->
  <path d="M 150 246 L 150 262 L 280 262 L 280 274" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 410 246 L 410 262 L 280 262" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== 答案 ===== -->
  <rect x="100" y="278" width="360" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="300" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">答案 = n − f(n)</text>
  <text x="280" y="318" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">20 − 19 = 1</text>

  <!-- ===== 关键洞察 ===== -->
  <rect x="40" y="342" width="480" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)" opacity="0.7"/>
  <text x="280" y="362" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">💡 正难则反</text>
  <text x="280" y="380" text-anchor="middle" font-size="10" fill="#333">「至少 1 位重复」直接数需枚举所有重复模式 → 转为统计「各位互异」用数位 DP 精确计数，再做减法</text>
</svg>
