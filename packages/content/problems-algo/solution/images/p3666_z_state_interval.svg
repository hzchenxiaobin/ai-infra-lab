<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#b85450" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333"
        filter="url(#rough2)">核心观察：一步操作 = 从 z 跳到同奇偶的整段区间</text>

  <!-- 操作选择框 -->
  <rect x="30" y="52" width="190" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="125" y="74" text-anchor="middle" font-size="13" fill="#b3541e" filter="url(#rough2)">一次操作选 k 个下标</text>
  <text x="125" y="97" text-anchor="middle" font-size="13" fill="#b3541e" filter="url(#rough2)">i 个 '0' ＋ (k−i) 个 '1'</text>

  <path d="M 220 81 L 248 81" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 公式框 -->
  <rect x="252" y="60" width="140" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="322" y="87" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">z' = z + k − 2i</text>

  <!-- 图例 -->
  <circle cx="445" cy="74" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="458" y="79" font-size="11" fill="#4a7a3a" filter="url(#rough2)">可达（同奇偶）</text>
  <circle cx="445" cy="98" r="4.5" fill="#fafafa" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="458" y="103" font-size="11" fill="#888" filter="url(#rough2)">奇偶不符 ✗</text>

  <!-- 数轴 -->
  <path d="M 30 190 L 530 190" stroke="#666" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 45 184 L 45 196" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="45" y="213" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">0</text>
  <path d="M 515 184 L 515 196" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="515" y="213" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">n</text>
  <path d="M 120 186 L 120 194" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 195 186 L 195 194" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 270 186 L 270 194" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 345 186 L 345 194" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 420 186 L 420 194" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 可达区间罩 -->
  <rect x="105" y="174" width="270" height="32" fill="#e6f4ea" fill-opacity="0.6" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>

  <!-- 区间内的点：实心=同奇偶可达，空心=奇偶不符 -->
  <circle cx="113" cy="190" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="135" cy="190" r="4.5" fill="#fafafa" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="157" cy="190" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="179" cy="190" r="4.5" fill="#fafafa" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="201" cy="190" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="223" cy="190" r="4.5" fill="#fafafa" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="267" cy="190" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="289" cy="190" r="4.5" fill="#fafafa" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="311" cy="190" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="333" cy="190" r="4.5" fill="#fafafa" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="355" cy="190" r="5" fill="#4a7a3a" filter="url(#rough2)"/>

  <!-- 当前状态 z -->
  <rect x="246" y="180" width="18" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="255" y="172" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">z</text>

  <!-- 一步转移弧线 -->
  <path d="M 250 176 Q 198 148 162 183" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <path d="M 264 176 Q 312 146 350 182" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>

  <!-- L / R 标签 -->
  <path d="M 105 208 L 105 220" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="105" y="234" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">L = |z−k|</text>
  <path d="M 375 208 L 375 220" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="375" y="234" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">R = min(z+k, 2n−k−z)</text>

  <!-- 下界解释框 -->
  <rect x="30" y="252" width="250" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="155" y="275" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">下界：'0' 至多翻 min(k, z) 个</text>
  <text x="155" y="297" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i 取最大 ⇒ z' 最小 = |z − k|</text>

  <!-- 上界解释框 -->
  <rect x="300" y="252" width="250" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="425" y="275" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">上界：'1' 至多翻 n − z 个</text>
  <text x="425" y="297" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i 取最小 ⇒ z' 最大 = min(z+k, 2n−k−z)</text>

  <!-- 底注 -->
  <text x="280" y="344" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">奇偶锁定：z' ≡ z + k (mod 2) —— 区间里隔一个取一个</text>
</svg>
