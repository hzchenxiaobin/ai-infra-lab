<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 372"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="372" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">转移：读低 v 位、左移 v 位 —— 读写区间不相交</text>
  <text x="260" y="46" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">以 v = 6 为例：f 的第 j 位 = 「总奖励 j 可达」</text>
  <path d="M 44 60 L 44 66 M 44 66 L 260 66 M 260 60 L 260 66" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="152" y="58" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">读：x ∈ [0, v−1]（x &lt; v 才能取 v）</text>
  <rect x="44" y="72" width="36" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="62.0" y="97" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="80" y="72" width="36" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="98.0" y="97" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="116" y="72" width="36" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="134.0" y="97" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="152" y="72" width="36" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="170.0" y="97" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="188" y="72" width="36" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="206.0" y="97" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="224" y="72" width="36" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="242.0" y="97" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="260" y="72" width="36" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="278.0" y="97" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="296" y="72" width="36" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="314.0" y="97" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="332" y="72" width="36" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="350.0" y="97" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="368" y="72" width="36" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="386.0" y="97" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">9</text>
  <rect x="404" y="72" width="36" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="422.0" y="97" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">10</text>
  <rect x="440" y="72" width="36" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="458.0" y="97" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">11</text>
  <text x="36" y="102" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">j =</text>
  <path d="M 260 118 L 260 124 M 260 124 L 476 124 M 476 118 L 476 124" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="412" y="138" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">写：x+v ∈ [v, 2v−1]</text>
  <path d="M 152 118 C 175 160 315 160 342 120" stroke="#d6a040" stroke-width="2.4" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>
  <text x="247" y="156" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">&lt;&lt; v ：批量执行 x → x+v</text>
  <rect x="60" y="178" width="400" height="62" fill="#ffffff" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="204" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">f  |=  ( f  &amp;  ((1&lt;&lt;v) − 1) )  &lt;&lt; v</text>
  <text x="260" y="226" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">mask = (1&lt;&lt;v) − 1 ：低 v 位全 1，圈出合法起点 x &lt; v</text>
  <rect x="30" y="256" width="460" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="282" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">读区 [0, v−1] 与 写区 [v, 2v−1] 不相交</text>
  <text x="260" y="306" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">⇒ 本轮写入不会污染本轮读取 ⇒ j 的枚举顺序无关</text>
  <text x="260" y="330" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⇒ 每个 v 天然只用一次</text>
  <text x="260" y="348" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">（传统 0-1 背包读写重叠才需倒序枚举，这里连倒序都省了）</text>
</svg>
