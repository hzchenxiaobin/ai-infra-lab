<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：分裂→二叉树，总时间 = 最长根→叶路径</text>

  <text x="300" y="48" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">示例 3：blocks = [1, 2, 3]，split = 1 → 答案 4</text>

  <!-- ===== 左侧：分裂二叉树 ===== -->

  <!-- 根 split 节点 -->
  <polygon points="190,62 216,80 190,98 164,80" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="190" y="84" text-anchor="middle" font-size="10.5" fill="#7a5a20" font-weight="bold" filter="url(#rough2)">split</text>

  <!-- 根 → block3 -->
  <path d="M 164 80 L 95 142" fill="none" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <!-- 根 → split2 -->
  <path d="M 216 80 L 288 143" fill="none" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- block 3 叶子 -->
  <rect x="66" y="142" width="58" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="95" y="167" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="40" y="166" font-size="9.5" fill="#446688" filter="url(#rough2)">深度1</text>

  <!-- split2 节点 -->
  <polygon points="290,143 316,161 290,179 264,161" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="290" y="165" text-anchor="middle" font-size="10.5" fill="#7a5a20" font-weight="bold" filter="url(#rough2)">split</text>

  <!-- split2 → block1 -->
  <path d="M 264 161 L 250 232" fill="none" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <!-- split2 → block2 -->
  <path d="M 316 161 L 352 232" fill="none" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- block 1 叶子 -->
  <rect x="222" y="232" width="54" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="249" y="255" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="196" y="255" font-size="9.5" fill="#446688" filter="url(#rough2)">深度2</text>

  <!-- block 2 叶子 -->
  <rect x="326" y="232" width="54" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="353" y="255" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="384" y="255" font-size="9.5" fill="#446688" filter="url(#rough2)">深度2</text>

  <!-- 路径代价标注 -->
  <rect x="48" y="288" width="96" height="22" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="96" y="303" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">1 + 3 = 4</text>

  <rect x="196" y="288" width="108" height="22" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="250" y="303" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">1 + 1 + 1 = 3</text>

  <rect x="300" y="288" width="108" height="22" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="354" y="303" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">1 + 1 + 2 = 4</text>

  <!-- 连线到路径代价 -->
  <path d="M 95 180 L 96 286" fill="none" stroke="#b85450" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <path d="M 249 268 L 250 286" fill="none" stroke="#b85450" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <path d="M 353 268 L 354 286" fill="none" stroke="#b85450" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>

  <!-- 总时间结果框 -->
  <rect x="60" y="328" width="320" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="220" y="354" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">总时间 = max(4, 3, 4) = 4 ✓</text>

  <text x="220" y="386" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">路径 = 沿途 split 之和 + 叶子建造时间（并行取最长）</text>

  <!-- 图例 -->
  <polygon points="80,408 100,418 80,428 60,418" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="108" y="422" font-size="10" fill="#7a5a20" filter="url(#rough2)">split（分裂，代价 split）</text>
  <rect x="250" y="410" width="28" height="20" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="288" y="424" font-size="10" fill="#446688" filter="url(#rough2)">街区（叶子，建造时间）</text>

  <!-- ===== 右侧：关键观察面板 ===== -->
  <rect x="410" y="60" width="180" height="380" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="500" y="84" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">关键观察</text>

  <text x="422" y="110" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">路径代价 =</text>
  <text x="422" y="126" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">  深度 × split + 街区时间</text>

  <text x="422" y="150" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">总时间 = 最长路径</text>
  <text x="422" y="166" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">（并行 → 取 max）</text>

  <line x1="422" y1="182" x2="578" y2="182" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <text x="422" y="202" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">对比 1167 哈夫曼：</text>
  <text x="422" y="220" font-size="10" fill="#b85450" filter="url(#rough2)">合并 = a + b</text>
  <text x="422" y="234" font-size="10" fill="#b85450" filter="url(#rough2)">→ 最小化「总和」</text>

  <text x="422" y="258" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">1199 本题：</text>
  <text x="422" y="276" font-size="10" fill="#446688" filter="url(#rough2)">合并 = max(a,b) + split</text>
  <text x="422" y="290" font-size="10" fill="#446688" filter="url(#rough2)">→ 最小化「最大值」</text>

  <line x1="422" y1="304" x2="578" y2="304" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <text x="422" y="324" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">贪心策略：</text>
  <text x="422" y="342" font-size="10" fill="#4a7a3a" filter="url(#rough2)">大块浅挂（少分裂）</text>
  <text x="422" y="358" font-size="10" fill="#4a7a3a" filter="url(#rough2)">小块深埋（多分裂）</text>

  <rect x="422" y="374" width="156" height="50" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="500" y="394" text-anchor="middle" font-size="10" fill="#7a5a20" filter="url(#rough2)">每次合并当前</text>
  <text x="500" y="408" text-anchor="middle" font-size="10" fill="#7a5a20" font-weight="bold" filter="url(#rough2)">最小的两个子树</text>
</svg>
