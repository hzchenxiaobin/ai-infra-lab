<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">upperBound：找 target 的最右位置</text>

  <!-- 数组格子 -->
  <!-- index 0..6, box w=50, start x=85 -->
  <rect x="85" y="70" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="96" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>

  <rect x="135" y="70" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="96" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>

  <rect x="185" y="70" width="50" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="96" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>

  <rect x="235" y="70" width="50" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="96" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>

  <rect x="285" y="70" width="50" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="96" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>

  <rect x="335" y="70" width="50" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="96" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">6</text>

  <rect x="385" y="70" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="96" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7</text>

  <!-- 下标 -->
  <text x="110" y="128" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <text x="160" y="128" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1</text>
  <text x="210" y="128" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2</text>
  <text x="260" y="128" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">3</text>
  <text x="310" y="128" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">4</text>
  <text x="360" y="128" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="410" y="128" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">6</text>

  <!-- 标注：最左 6 -->
  <path d="M210,138 L210,158" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="205" y="176" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">首个 6 (idx 2)</text>

  <!-- 标注：最右 6 = upperBound -->
  <path d="M360,138 L360,158" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="370" y="176" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">最右 6 = upperBound(6) = 5</text>

  <!-- 二分缩小示意 -->
  <text x="60" y="214" font-size="13" fill="#333" filter="url(#rough2)">二分查找最右：</text>

  <rect x="60" y="228" width="400" height="34" fill="none" stroke="#446688" stroke-width="1.2" stroke-dasharray="6,4" rx="6" filter="url(#rough2)"/>
  <text x="260" y="250" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">命中 this[mid] == 6 → 记录 mid，left = mid+1 继续往右</text>

  <path d="M260,266 L260,282" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="286" width="400" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="308" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">this[mid] &lt; 6 → left=mid+1 ；this[mid] &gt; 6 → right=mid−1</text>

  <!-- 找不到的情况 -->
  <rect x="60" y="334" width="400" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="356" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">全程未命中 → 返回 −1（target 不在数组中）</text>
</svg>
