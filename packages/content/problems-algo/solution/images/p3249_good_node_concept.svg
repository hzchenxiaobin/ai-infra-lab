<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="16.5" fill="#333" font-weight="bold" filter="url(#rough2)">好节点 ⇔ 所有孩子的子树大小相同</text>

  <!-- 左：好节点 -->
  <line x1="130" y1="93" x2="69" y2="128" stroke="#bbb" stroke-width="2" filter="url(#rough2)"/>
  <line x1="135" y1="95" x2="135" y2="128" stroke="#bbb" stroke-width="2" filter="url(#rough2)"/>
  <line x1="140" y1="93" x2="201" y2="128" stroke="#bbb" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="135" cy="76" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="135" y="81" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">u</text>

  <rect x="40" y="130" width="58" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="69" y="153" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">子树</text>
  <text x="69" y="172" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">size 3</text>
  <rect x="106" y="130" width="58" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="135" y="153" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">子树</text>
  <text x="135" y="172" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">size 3</text>
  <rect x="172" y="130" width="58" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="201" y="153" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">子树</text>
  <text x="201" y="172" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">size 3</text>
  <text x="135" y="214" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3 = 3 = 3 ✓</text>

  <rect x="30" y="232" width="220" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="140" y="251" text-anchor="middle" font-size="12.5" fill="#3a6a2a" font-weight="bold" filter="url(#rough2)">好节点 ✓</text>
  <text x="140" y="268" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">三个孩子的子树都是 3 个节点</text>

  <line x1="263" y1="56" x2="263" y2="276" stroke="#ddd" stroke-width="1.5" stroke-dasharray="5 5" filter="url(#rough2)"/>

  <!-- 右：坏节点 -->
  <line x1="378" y1="93" x2="334" y2="128" stroke="#bbb" stroke-width="2" filter="url(#rough2)"/>
  <line x1="392" y1="93" x2="449" y2="128" stroke="#bbb" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="385" cy="76" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="385" y="81" text-anchor="middle" font-size="13" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">v</text>

  <rect x="292" y="130" width="84" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="334" y="153" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">子树</text>
  <text x="334" y="172" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">size 5</text>
  <rect x="420" y="130" width="58" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="449" y="153" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">子树</text>
  <text x="449" y="172" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">size 1</text>
  <text x="385" y="214" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">5 ≠ 1 ✗</text>

  <rect x="282" y="232" width="212" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="388" y="251" text-anchor="middle" font-size="12.5" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">坏节点 ✗</text>
  <text x="388" y="268" text-anchor="middle" font-size="10.5" fill="#a05a54" filter="url(#rough2)">两个孩子的子树 5 ≠ 1</text>

  <!-- 底部备注 -->
  <rect x="36" y="296" width="448" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="317" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">叶子：没有孩子，「全都相同」空真 ⇒ 天然好节点</text>
  <text x="260" y="337" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">单孩子节点：只有一个大小可比 ⇒ 也是好节点</text>
</svg>
