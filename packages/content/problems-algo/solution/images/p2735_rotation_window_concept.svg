<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">固定操作次数 k：类型 t 的成本 = k+1 个可达位置中 nums 的最小值</text>

  <!-- Section 1: cyclic array -->
  <text x="30" y="56" font-size="12" fill="#888">循环数组（示例 nums = [20, 1, 15]）：</text>

  <!-- rotation arrow above cells: 类型向前(下标-1)旋转 -->
  <path d="M 110 78 Q 280 60 450 78" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="280" y="74" text-anchor="middle" font-size="10" fill="#446688">每操作一次，类型 t 从下标 t 移到 (t−1) mod n</text>

  <!-- 3 cells: index + nums -->
  <!-- pos 0 -->
  <rect x="110" y="86" width="90" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="155" y="104" text-anchor="middle" font-size="10" fill="#888">下标 0</text>
  <text x="155" y="126" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">20</text>

  <!-- pos 1 -->
  <rect x="220" y="86" width="90" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="265" y="104" text-anchor="middle" font-size="10" fill="#888">下标 1</text>
  <text x="265" y="126" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>

  <!-- pos 2 -->
  <rect x="330" y="86" width="90" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="375" y="104" text-anchor="middle" font-size="10" fill="#888">下标 2</text>
  <text x="375" y="126" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">15</text>

  <!-- cyclic wrap arrow: 末尾回到开头 -->
  <path d="M 420 110 Q 470 110 470 150 Q 470 175 300 175 Q 130 175 110 150" stroke="#446688" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="480" y="145" font-size="9" fill="#888">循环</text>

  <!-- Section 2: type 0 window growth -->
  <text x="30" y="200" font-size="12" fill="#555" font-weight="bold">跟踪类型 0：随 k 增大，可达窗口向左扩张，取其中 nums 最小</text>

  <!-- column headers -->
  <text x="60" y="222" text-anchor="middle" font-size="10" fill="#888">k</text>
  <text x="155" y="222" text-anchor="middle" font-size="10" fill="#888">下标 0</text>
  <text x="265" y="222" text-anchor="middle" font-size="10" fill="#888">下标 1</text>
  <text x="375" y="222" text-anchor="middle" font-size="10" fill="#888">下标 2</text>
  <text x="480" y="222" text-anchor="middle" font-size="10" fill="#888">min = 成本</text>

  <!-- Row k=0: window = {0} -->
  <text x="60" y="250" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="110" y="232" width="90" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="155" y="253" text-anchor="middle" font-size="13" fill="#333">20 ✓</text>
  <rect x="220" y="232" width="90" height="32" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="265" y="253" text-anchor="middle" font-size="12" fill="#bbb">1</text>
  <rect x="330" y="232" width="90" height="32" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="375" y="253" text-anchor="middle" font-size="12" fill="#bbb">15</text>
  <rect x="430" y="232" width="100" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="480" y="253" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">20</text>

  <!-- Row k=1: window = {0, 2} -->
  <text x="60" y="294" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="110" y="276" width="90" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="155" y="297" text-anchor="middle" font-size="13" fill="#333">20</text>
  <rect x="220" y="276" width="90" height="32" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="265" y="297" text-anchor="middle" font-size="12" fill="#bbb">1</text>
  <rect x="330" y="276" width="90" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="375" y="297" text-anchor="middle" font-size="13" fill="#333">15 ✓</text>
  <rect x="430" y="276" width="100" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="480" y="297" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">15</text>

  <!-- Row k=2: window = {0, 2, 1} = all -->
  <text x="60" y="338" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="110" y="320" width="90" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="155" y="341" text-anchor="middle" font-size="13" fill="#333">20</text>
  <rect x="220" y="320" width="90" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="265" y="341" text-anchor="middle" font-size="13" fill="#333">1 ✓</text>
  <rect x="330" y="320" width="90" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="375" y="341" text-anchor="middle" font-size="13" fill="#333">15</text>
  <rect x="430" y="320" width="100" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="480" y="341" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>

  <!-- growth arrows on left -->
  <path d="M 60 258 L 60 274" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 60 302 L 60 318" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Key insight box -->
  <rect x="20" y="372" width="520" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="390" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">关键：窗口随 k 单调向左扩张，元素只进不出</text>
  <text x="280" y="406" text-anchor="middle" font-size="10" fill="#555">故 cost[t] 可增量维护：cost[t] ← min(cost[t], nums[(t−k) mod n])</text>
</svg>
