<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#555"/>
    </marker>
  </defs>

  <rect width="440" height="280" fill="#fafafa"/>

  <!-- Start -->
  <rect x="130" y="18" width="180" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="220" y="39" text-anchor="middle" font-size="12" fill="#333">开始: (0,0) 面朝北</text>

  <!-- Execute one round -->
  <rect x="120" y="64" width="200" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="220" y="85" text-anchor="middle" font-size="12" fill="#333">执行一轮 instructions</text>

  <!-- Diamond 1: back to origin? -->
  <polygon points="220,112 310,145 220,178 130,145" fill="#e6f4ea" fill-opacity="0.5" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="142" text-anchor="middle" font-size="11" fill="#333">回到 (0,0) ?</text>

  <!-- True 1 -->
  <rect x="20" y="129" width="90" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="65" y="150" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return true</text>

  <!-- Arrow: start → execute -->
  <path d="M 220 50 L 220 64" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- Arrow: execute → diamond 1 -->
  <path d="M 220 96 L 220 112" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- Arrow: diamond 1 → true 1 (left, "是") -->
  <path d="M 130 145 L 110 145" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="138" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>
  <!-- Arrow: diamond 1 → diamond 2 (down, "否") -->
  <path d="M 220 178 L 220 198" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="232" y="192" font-size="10" fill="#b85450">否</text>

  <!-- Diamond 2: direction != north? -->
  <polygon points="220,198 310,230 220,262 130,230" fill="#e8f0fe" fill-opacity="0.5" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="227" text-anchor="middle" font-size="11" fill="#333">方向 ≠ 北 ?</text>

  <!-- True 2 -->
  <rect x="20" y="214" width="90" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="65" y="235" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return true</text>

  <!-- False -->
  <rect x="330" y="214" width="90" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="375" y="235" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return false</text>

  <!-- Arrow: diamond 2 → true 2 (left, "是") -->
  <path d="M 130 230 L 110 230" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="223" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>
  <!-- Arrow: diamond 2 → false (right, "否") -->
  <path d="M 310 230 L 330 230" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="223" text-anchor="middle" font-size="10" fill="#b85450">否</text>
</svg>
