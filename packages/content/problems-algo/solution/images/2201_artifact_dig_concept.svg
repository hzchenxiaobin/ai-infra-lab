<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：哈希集合存挖掘格，逐工件查「全挖」</text>

  <!-- ====== Left: 2x2 grid with example 1 ====== -->
  <text x="125" y="52" text-anchor="middle" font-size="12" fill="#888">n = 2, dig = {(0,0),(0,1)}</text>

  <!-- grid cells: cell 60x60, origin (40, 70) -->
  <!-- Artifact A (red): cell (0,0) -->
  <rect x="40" y="70" width="60" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <!-- Artifact B (blue): cells (0,1),(1,1) -->
  <rect x="100" y="70" width="60" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <!-- (1,0) empty -->
  <rect x="40" y="130" width="60" height="60" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- D markers -->
  <text x="70" y="106" text-anchor="middle" font-size="20" fill="#b85450" font-weight="bold">D</text>
  <text x="130" y="106" text-anchor="middle" font-size="20" fill="#446688" font-weight="bold">D</text>
  <text x="130" y="166" text-anchor="middle" font-size="13" fill="#bbb">?</text>

  <!-- artifact labels -->
  <text x="70" y="150" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">工件A</text>
  <text x="170" y="134" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">工件B</text>

  <!-- column indices -->
  <text x="70" y="66" text-anchor="middle" font-size="10" fill="#999">c=0</text>
  <text x="130" y="66" text-anchor="middle" font-size="10" fill="#999">c=1</text>
  <!-- row indices -->
  <text x="32" y="104" text-anchor="end" font-size="10" fill="#999">r=0</text>
  <text x="32" y="164" text-anchor="end" font-size="10" fill="#999">r=1</text>

  <!-- verdicts -->
  <rect x="36" y="210" width="78" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="75" y="229" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">A 全挖 ✓</text>
  <rect x="124" y="210" width="86" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="167" y="229" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">B 缺(1,1) ✗</text>

  <!-- ====== Right: hash set + observations ====== -->
  <rect x="250" y="60" width="290" height="250" fill="#fff" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>

  <text x="395" y="86" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">两个关键观察</text>

  <!-- observation 1 -->
  <circle cx="270" cy="116" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="120" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="288" y="114" font-size="12" fill="#333" font-weight="bold">每工件最多 4 格</text>
  <text x="270" y="138" font-size="11" fill="#555">约束保证矩形面积 ≤ 4</text>
  <text x="270" y="154" font-size="11" fill="#555">遍历 r1..r2 × c1..c2 仅 O(1)</text>
  <text x="270" y="170" font-size="11" fill="#555">→ 逐工件查全挖总开销 O(工件数)</text>

  <!-- observation 2 -->
  <circle cx="270" cy="200" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="204" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <text x="288" y="198" font-size="12" fill="#333" font-weight="bold">挖掘格存哈希集合</text>
  <text x="270" y="222" font-size="11" fill="#555">key = r * n + c（一维编码）</text>
  <text x="270" y="238" font-size="11" fill="#555">查询某格是否被挖 O(1)</text>
  <text x="270" y="254" font-size="11" fill="#555">→ 避免每工件扫描全部挖掘点</text>

  <!-- hash set box -->
  <rect x="262" y="266" width="200" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="362" y="286" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">dug = { 0, 1 }  (n=2 编码)</text>

  <!-- bottom note -->
  <text x="280" y="338" text-anchor="middle" font-size="11" fill="#888">工件全格 ∈ dug → 可提取；任一格缺失 → 跳过</text>
  <text x="280" y="356" text-anchor="middle" font-size="11" fill="#888">总复杂度 O(dig + 工件数)，常数极小</text>
</svg>
