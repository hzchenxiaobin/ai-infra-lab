<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="480" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="240" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：排序 → 三候选 → 取最小</text>

  <!-- Step 1: start -->
  <ellipse cx="200" cy="60" rx="48" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="65" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始</text>

  <!-- arrow -->
  <path d="M200 82 L200 104" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: sort -->
  <rect x="120" y="108" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="200" y="125" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">排序 nums</text>
  <text x="200" y="140" text-anchor="middle" font-size="10.5" fill="#666">a[0] ≤ a[1] ≤ … ≤ a[n−1]</text>

  <path d="M200 150 L200 172" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: compute 3 candidates -->
  <rect x="60" y="176" width="280" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="200" y="194" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">计算三个候选（删 2 个端点极值）</text>
  <text x="200" y="212" text-anchor="middle" font-size="11" fill="#555">c₁ = a[n−2] − a[1]　（左1 + 右1）</text>
  <text x="200" y="228" text-anchor="middle" font-size="11" fill="#555">c₂ = a[n−1] − a[2]　（左2）</text>
  <text x="200" y="244" text-anchor="middle" font-size="11" fill="#555">c₃ = a[n−3] − a[0]　（右2）</text>

  <path d="M200 254 L200 276" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: min -->
  <rect x="100" y="280" width="200" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="200" y="297" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 min(c₁, c₂, c₃)</text>
  <text x="200" y="312" text-anchor="middle" font-size="10.5" fill="#b85450">min_gap 已归 0，无需再加</text>

  <path d="M200 322 L200 344" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: end -->
  <ellipse cx="200" cy="366" rx="48" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="371" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">结束</text>

  <!-- side note -->
  <path d="M340 214 L372 214" stroke="#aaa" stroke-width="1.5" stroke-dasharray="3,2" fill="none" filter="url(#rough2)"/>
  <rect x="370" y="180" width="104" height="78" fill="#fafafa" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="6" filter="url(#rough2)"/>
  <text x="422" y="198" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">为何只有 3 种？</text>
  <text x="378" y="216" font-size="10" fill="#888">2 次修改分布在</text>
  <text x="378" y="232" font-size="10" fill="#888">两端：左 i + 右 2−i，</text>
  <text x="378" y="248" font-size="10" fill="#888">i ∈ {0,1,2} = 3 种</text>
</svg>
