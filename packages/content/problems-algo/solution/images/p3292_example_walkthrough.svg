<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 372"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="372" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例 1 演算：三个 word 的 Z 贡献逐位取 max——引擎换了，match 没变</text>
  <text x="260" y="36" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">words = ["abc", "aaaaa", "bcdef"]，target = "aabcdabc"</text>

  <!-- ============ 表头 ============ -->
  <rect x="30" y="44" width="448" height="22" fill="#e8f0fe" filter="url(#rough2)"/>
  <text x="112" y="59" text-anchor="end" font-size="10.5" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">Z 贡献</text>
  <text x="140" y="59" text-anchor="middle" font-size="10.5" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">i=0</text>
  <text x="185" y="59" text-anchor="middle" font-size="10.5" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="230" y="59" text-anchor="middle" font-size="10.5" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="276" y="59" text-anchor="middle" font-size="10.5" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="320" y="59" text-anchor="middle" font-size="10.5" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="366" y="59" text-anchor="middle" font-size="10.5" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="410" y="59" text-anchor="middle" font-size="10.5" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="456" y="59" text-anchor="middle" font-size="10.5" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">7</text>

  <!-- ============ 行 1：aaaaa ============ -->
  <text x="112" y="82" text-anchor="end" font-size="10" fill="#333" filter="url(#rough2)">"aaaaa" 的 z</text>
  <text x="140" y="82" text-anchor="middle" font-size="10.5" fill="#3a5f30" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="185" y="82" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="230" y="82" text-anchor="middle" font-size="10.5" fill="#ccc" filter="url(#rough2)">0</text>
  <text x="276" y="82" text-anchor="middle" font-size="10.5" fill="#ccc" filter="url(#rough2)">0</text>
  <text x="320" y="82" text-anchor="middle" font-size="10.5" fill="#ccc" filter="url(#rough2)">0</text>
  <text x="366" y="82" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="410" y="82" text-anchor="middle" font-size="10.5" fill="#ccc" filter="url(#rough2)">0</text>
  <text x="456" y="82" text-anchor="middle" font-size="10.5" fill="#ccc" filter="url(#rough2)">0</text>

  <!-- ============ 行 2：abc ============ -->
  <text x="112" y="106" text-anchor="end" font-size="10" fill="#333" filter="url(#rough2)">"abc" 的 z</text>
  <text x="140" y="106" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="185" y="106" text-anchor="middle" font-size="10.5" fill="#3a5f30" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="230" y="106" text-anchor="middle" font-size="10.5" fill="#ccc" filter="url(#rough2)">0</text>
  <text x="276" y="106" text-anchor="middle" font-size="10.5" fill="#ccc" filter="url(#rough2)">0</text>
  <text x="320" y="106" text-anchor="middle" font-size="10.5" fill="#ccc" filter="url(#rough2)">0</text>
  <text x="366" y="106" text-anchor="middle" font-size="10.5" fill="#3a5f30" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="410" y="106" text-anchor="middle" font-size="10.5" fill="#ccc" filter="url(#rough2)">0</text>
  <text x="456" y="106" text-anchor="middle" font-size="10.5" fill="#ccc" filter="url(#rough2)">0</text>

  <!-- ============ 行 3：bcdef ============ -->
  <text x="112" y="130" text-anchor="end" font-size="10" fill="#333" filter="url(#rough2)">"bcdef" 的 z</text>
  <text x="140" y="130" text-anchor="middle" font-size="10.5" fill="#ccc" filter="url(#rough2)">0</text>
  <text x="185" y="130" text-anchor="middle" font-size="10.5" fill="#ccc" filter="url(#rough2)">0</text>
  <text x="230" y="130" text-anchor="middle" font-size="10.5" fill="#3a5f30" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="276" y="130" text-anchor="middle" font-size="10.5" fill="#ccc" filter="url(#rough2)">0</text>
  <text x="320" y="130" text-anchor="middle" font-size="10.5" fill="#ccc" filter="url(#rough2)">0</text>
  <text x="366" y="130" text-anchor="middle" font-size="10.5" fill="#ccc" filter="url(#rough2)">0</text>
  <text x="410" y="130" text-anchor="middle" font-size="10.5" fill="#3a5f30" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="456" y="130" text-anchor="middle" font-size="10.5" fill="#ccc" filter="url(#rough2)">0</text>

  <!-- ============ 行 4：match（高亮） ============ -->
  <rect x="30" y="138" width="448" height="24" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="112" y="155" text-anchor="end" font-size="10" fill="#2c5f2c" font-weight="bold" filter="url(#rough2)">match = max</text>
  <text x="140" y="155" text-anchor="middle" font-size="11" fill="#2c5f2c" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="185" y="155" text-anchor="middle" font-size="11" fill="#2c5f2c" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="230" y="155" text-anchor="middle" font-size="11" fill="#2c5f2c" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="276" y="155" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="320" y="155" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="366" y="155" text-anchor="middle" font-size="11" fill="#2c5f2c" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="410" y="155" text-anchor="middle" font-size="11" fill="#2c5f2c" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="456" y="155" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>

  <!-- ============ 行 5：i + match[i] ============ -->
  <text x="112" y="180" text-anchor="end" font-size="10" fill="#333" filter="url(#rough2)">i + match[i]</text>
  <text x="140" y="180" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="185" y="180" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">4</text>
  <text x="230" y="180" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="276" y="180" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="320" y="180" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="366" y="180" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="410" y="180" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">8</text>
  <text x="456" y="180" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">7</text>

  <!-- 表格线 -->
  <path d="M 30 66 L 478 66 M 30 90 L 478 90 M 30 114 L 478 114 M 30 138 L 478 138 M 30 162 L 478 162 M 30 186 L 478 186" stroke="#c8d4e0" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 118 44 L 118 186" stroke="#c8d4e0" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <rect x="30" y="44" width="448" height="142" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- ============ 分层扩张链 ============ -->
  <rect x="48" y="206" width="66" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="81" y="223" text-anchor="middle" font-size="11" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">R₀ = 0</text>
  <path d="M 114 219 L 132 219" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="123" y="202" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">i=0</text>
  <rect x="134" y="206" width="66" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="167" y="223" text-anchor="middle" font-size="11" fill="#3a5f30" font-weight="bold" filter="url(#rough2)">R₁ = 2</text>
  <path d="M 200 219 L 218 219" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="209" y="202" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">i=2</text>
  <rect x="220" y="206" width="66" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="253" y="223" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">R₂ = 5</text>
  <path d="M 286 219 L 304 219" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="295" y="202" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">i=5</text>
  <rect x="306" y="206" width="100" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="356" y="223" text-anchor="middle" font-size="11" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">R₃ = 8 ≥ n ✓</text>
  <text x="420" y="223" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">⟹ ans = 3</text>

  <!-- ============ 最优切分 ============ -->
  <text x="260" y="252" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">最优切分：aa + bcd + abc（与 Trie 引擎算出的完全一致）</text>
  <rect x="150" y="258" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="180" y="277" text-anchor="middle" font-size="13" fill="#3a5f30" font-weight="bold" filter="url(#rough2)">aa</text>
  <text x="225" y="277" text-anchor="middle" font-size="15" fill="#777" filter="url(#rough2)">+</text>
  <rect x="240" y="258" width="70" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="275" y="277" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">bcd</text>
  <text x="325" y="277" text-anchor="middle" font-size="15" fill="#777" filter="url(#rough2)">+</text>
  <rect x="335" y="258" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="370" y="277" text-anchor="middle" font-size="13" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">abc</text>
  <text x="180" y="304" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">words[1] 的前缀</text>
  <text x="275" y="304" text-anchor="middle" font-size="9" fill="#8a6d3b" filter="url(#rough2)">words[2] 的前缀</text>
  <text x="370" y="304" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">words[0] 的前缀</text>

  <!-- ============ 对照说明 ============ -->
  <rect x="55" y="316" width="410" height="42" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="260" y="334" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">对照示例 2：match = [5,4,3,2,1,5,4,3,2,1]，R：0 → 5 → 10，答案 2</text>
  <text x="260" y="352" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">对照示例 3：match = [0,0,0]，R₁ = R₀ = 0 卡死，返回 −1</text>
</svg>
