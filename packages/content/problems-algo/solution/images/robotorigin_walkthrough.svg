<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：URDL 绕一圈回原点；计数表验证三例</text>

  <!-- ===== Left: grid path for "URDL" ===== -->
  <text x="160" y="56" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">路径轨迹：moves = "URDL"</text>

  <!-- 3x3 grid lines -->
  <g filter="url(#rough2)" stroke="#cccccc" stroke-width="1">
    <path d="M 90 90 L 90 270" fill="none"/>
    <path d="M 140 90 L 140 270" fill="none"/>
    <path d="M 190 90 L 190 270" fill="none"/>
    <path d="M 240 90 L 240 270" fill="none"/>
    <path d="M 90 90 L 240 90" fill="none"/>
    <path d="M 90 140 L 240 140" fill="none"/>
    <path d="M 90 190 L 240 190" fill="none"/>
    <path d="M 90 240 L 240 240" fill="none"/>
    <path d="M 90 270 L 240 270" fill="none"/>
  </g>

  <!-- axis labels -->
  <text x="165" y="84" text-anchor="middle" font-size="9" fill="#aaa">x=0</text>
  <text x="215" y="84" text-anchor="middle" font-size="9" fill="#aaa">x=1</text>
  <text x="84" y="194" text-anchor="end" font-size="9" fill="#aaa">y=0</text>
  <text x="84" y="144" text-anchor="end" font-size="9" fill="#aaa">y=1</text>

  <!-- path: (0,0)=140,190 → U → (0,1)=140,140 → R → (1,1)=190,140 → D → (1,0)=190,190 → L → (0,0)=140,190 -->
  <!-- U: up -->
  <path d="M 134 184 L 134 150" stroke="#4a7a3a" stroke-width="2.4" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="118" y="168" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">U</text>
  <!-- R: right -->
  <path d="M 146 134 L 184 134" stroke="#446688" stroke-width="2.4" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="165" y="126" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">R</text>
  <!-- D: down -->
  <path d="M 196 146 L 196 184" stroke="#b85450" stroke-width="2.4" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="212" y="168" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">D</text>
  <!-- L: left -->
  <path d="M 184 196 L 146 196" stroke="#d6a040" stroke-width="2.4" marker-end="url(#arrO)" fill="none" filter="url(#rough2)"/>
  <text x="165" y="212" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">L</text>

  <!-- start/end origin dot -->
  <circle cx="140" cy="190" r="6" fill="#d6a040" filter="url(#rough2)"/>
  <text x="150" y="206" font-size="10" fill="#888">起/终 (0,0)</text>

  <rect x="70" y="282" width="190" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="165" y="302" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">绕一圈回到原点 → true ✓</text>

  <!-- ===== Right: counting table ===== -->
  <text x="430" y="56" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">计数抵消验证</text>

  <!-- table header -->
  <g filter="url(#rough2)">
    <rect x="320" y="74" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="368" y="74" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="402" y="74" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="436" y="74" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="470" y="74" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="504" y="74" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#333" text-anchor="middle">
    <text x="344" y="91">moves</text>
    <text x="385" y="91">#U</text>
    <text x="419" y="91">#D</text>
    <text x="453" y="91">#L</text>
    <text x="487" y="91">#R</text>
    <text x="524" y="91">归零</text>
  </g>

  <!-- row 1: UD -->
  <g filter="url(#rough2)">
    <rect x="320" y="100" width="48" height="26" fill="#fafafa" stroke="#888" stroke-width="1"/>
    <rect x="368" y="100" width="34" height="26" fill="#fafafa" stroke="#888" stroke-width="1"/>
    <rect x="402" y="100" width="34" height="26" fill="#fafafa" stroke="#888" stroke-width="1"/>
    <rect x="436" y="100" width="34" height="26" fill="#fafafa" stroke="#888" stroke-width="1"/>
    <rect x="470" y="100" width="34" height="26" fill="#fafafa" stroke="#888" stroke-width="1"/>
    <rect x="504" y="100" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#333" text-anchor="middle">
    <text x="344" y="117">UD</text>
    <text x="385" y="117">1</text>
    <text x="419" y="117">1</text>
    <text x="453" y="117">0</text>
    <text x="487" y="117">0</text>
    <text x="524" y="117" fill="#4a7a3a" font-weight="bold">✓</text>
  </g>

  <!-- row 2: LL -->
  <g filter="url(#rough2)">
    <rect x="320" y="126" width="48" height="26" fill="#fafafa" stroke="#888" stroke-width="1"/>
    <rect x="368" y="126" width="34" height="26" fill="#fafafa" stroke="#888" stroke-width="1"/>
    <rect x="402" y="126" width="34" height="26" fill="#fafafa" stroke="#888" stroke-width="1"/>
    <rect x="436" y="126" width="34" height="26" fill="#fafafa" stroke="#888" stroke-width="1"/>
    <rect x="470" y="126" width="34" height="26" fill="#fafafa" stroke="#888" stroke-width="1"/>
    <rect x="504" y="126" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#333" text-anchor="middle">
    <text x="344" y="143">LL</text>
    <text x="385" y="143">0</text>
    <text x="419" y="143">0</text>
    <text x="453" y="143">2</text>
    <text x="487" y="143">0</text>
    <text x="524" y="143" fill="#b85450" font-weight="bold">✗</text>
  </g>

  <!-- row 3: URDL -->
  <g filter="url(#rough2)">
    <rect x="320" y="152" width="48" height="26" fill="#fafafa" stroke="#888" stroke-width="1"/>
    <rect x="368" y="152" width="34" height="26" fill="#fafafa" stroke="#888" stroke-width="1"/>
    <rect x="402" y="152" width="34" height="26" fill="#fafafa" stroke="#888" stroke-width="1"/>
    <rect x="436" y="152" width="34" height="26" fill="#fafafa" stroke="#888" stroke-width="1"/>
    <rect x="470" y="152" width="34" height="26" fill="#fafafa" stroke="#888" stroke-width="1"/>
    <rect x="504" y="152" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#333" text-anchor="middle">
    <text x="344" y="169">URDL</text>
    <text x="385" y="169">1</text>
    <text x="419" y="169">1</text>
    <text x="453" y="169">1</text>
    <text x="487" y="169">1</text>
    <text x="524" y="169" fill="#4a7a3a" font-weight="bold">✓</text>
  </g>

  <!-- note box -->
  <rect x="320" y="200" width="220" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="430" y="222" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">判据</text>
  <text x="430" y="242" text-anchor="middle" font-size="11" fill="#444">#U == #D  ⇒  纵向归零</text>
  <text x="430" y="260" text-anchor="middle" font-size="11" fill="#444">#L == #R  ⇒  横向归零</text>
  <text x="430" y="276" text-anchor="middle" font-size="10" fill="#888">与字符顺序无关</text>
</svg>
