<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <text x="290" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一次扫描，逐位累加当前 run 长度 cnt</text>

  <!-- Start -->
  <rect x="220" y="34" width="140" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="290" y="54" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">ans=0, cnt=0, i=0</text>

  <!-- i < n ? decision (diamond) -->
  <polygon points="290,80 372,112 290,144 208,112" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="116" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">i &lt; n ?</text>

  <!-- return ans -->
  <rect x="418" y="96" width="124" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="480" y="116" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">return ans</text>

  <!-- s[i]==s[i-1] ? decision (diamond) -->
  <polygon points="290,166 390,196 290,226 190,196" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="193" text-anchor="middle" font-size="10.5" fill="#444" font-weight="bold">i&gt;0 且</text>
  <text x="290" y="207" text-anchor="middle" font-size="10.5" fill="#444" font-weight="bold">s[i]==s[i-1]?</text>

  <!-- cnt = 1 (left, new run) -->
  <rect x="78" y="180" width="92" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="124" y="200" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">cnt = 1</text>

  <!-- cnt += 1 (right, extend) -->
  <rect x="408" y="180" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="458" y="200" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">cnt += 1</text>

  <!-- ans += cnt -->
  <rect x="220" y="252" width="140" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="272" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans += cnt</text>

  <!-- i += 1 -->
  <rect x="220" y="304" width="140" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="324" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i += 1</text>

  <!-- arrows -->
  <!-- start -> i<n -->
  <path d="M 290 64 L 290 78" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <!-- i<n No (right) -> return ans -->
  <path d="M 372 112 L 416 112" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="394" y="106" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">否</text>
  <!-- i<n Yes (down) -> s diamond -->
  <path d="M 290 144 L 290 164" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="302" y="158" font-size="9.5" fill="#4a7a3a" font-weight="bold">是</text>
  <!-- s diamond No (left) -> cnt=1 -->
  <path d="M 190 196 L 172 196" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="184" y="190" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">否</text>
  <!-- s diamond Yes (right) -> cnt+=1 -->
  <path d="M 390 196 L 406 196" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="398" y="190" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">是</text>
  <!-- cnt=1 down -> merge -> ans+=cnt -->
  <path d="M 124 212 L 124 236 L 290 236 L 290 250" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <!-- cnt+=1 down -> merge -> ans+=cnt -->
  <path d="M 458 212 L 458 236 L 290 236" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <!-- ans+=cnt -> i+=1 -->
  <path d="M 290 284 L 290 302" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <!-- i+=1 left -> up -> back to i<n (loop) -->
  <path d="M 220 320 L 150 320 L 150 112 L 206 112" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="150" y="216" text-anchor="middle" font-size="9.5" fill="#888" font-style="italic" transform="rotate(-90 150 216)">继续下一字符</text>

  <!-- legend -->
  <rect x="40" y="350" width="500" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="290" y="364" text-anchor="middle" font-size="9.5" fill="#888">每个位置 i 贡献 cnt 个合法子串（以 i 为右端点）→ 累加即段内 1+2+…+L</text>
</svg>
