<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2740w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：排序后逐个相邻间隙取最小</text>

  <!-- ===== Example 1: [1,3,2,4] ===== -->
  <text x="40" y="62" font-size="12" fill="#888" font-weight="bold">示例1  nums=[1,3,2,4]</text>

  <!-- original -->
  <g font-size="15" font-weight="bold">
    <rect x="80" y="74" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="100" y="100" text-anchor="middle" fill="#333">1</text>
    <rect x="120" y="74" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="140" y="100" text-anchor="middle" fill="#333">3</text>
    <rect x="160" y="74" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="180" y="100" text-anchor="middle" fill="#333">2</text>
    <rect x="200" y="74" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="220" y="100" text-anchor="middle" fill="#333">4</text>
    <text x="262" y="100" font-size="11" fill="#888">原数组</text>
  </g>
  <!-- sort arrow -->
  <path d="M280,94 L320,94" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr2740w)" filter="url(#rough2)"/>
  <text x="300" y="86" text-anchor="middle" font-size="10" fill="#446688">sort</text>

  <!-- sorted with gaps -->
  <g font-size="15" font-weight="bold">
    <rect x="340" y="74" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="360" y="100" text-anchor="middle" fill="#333">1</text>
    <rect x="380" y="74" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="400" y="100" text-anchor="middle" fill="#333">2</text>
    <rect x="420" y="74" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="440" y="100" text-anchor="middle" fill="#333">3</text>
    <rect x="460" y="74" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="480" y="100" text-anchor="middle" fill="#333">4</text>
  </g>
  <!-- gap labels -->
  <g font-size="11" fill="#4a7a3a" font-weight="bold">
    <text x="360" y="132" text-anchor="middle">1</text>
    <text x="400" y="132" text-anchor="middle">1</text>
    <text x="440" y="132" text-anchor="middle">1</text>
  </g>
  <text x="400" y="148" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">min = 1 → 答案 1 ✓</text>

  <!-- partition illustration for example1: cut after 2 -> nums1=[1,2] nums2=[3,4] -->
  <g font-size="14" font-weight="bold">
    <rect x="340" y="166" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="360" y="190" text-anchor="middle" fill="#4a7a3a">1</text>
    <rect x="380" y="166" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="400" y="190" text-anchor="middle" fill="#4a7a3a">2</text>
    <rect x="420" y="166" width="40" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="440" y="190" text-anchor="middle" fill="#b85450">3</text>
    <rect x="460" y="166" width="40" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="480" y="190" text-anchor="middle" fill="#b85450">4</text>
  </g>
  <text x="400" y="216" text-anchor="middle" font-size="10" fill="#888">nums1=[1,2] max=2 ｜ nums2=[3,4] min=3 → |2−3|=1</text>

  <!-- ===== Example 2: [100,1,10] ===== -->
  <text x="40" y="256" font-size="12" fill="#888" font-weight="bold">示例2  nums=[100,1,10]</text>

  <g font-size="15" font-weight="bold">
    <rect x="80" y="268" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="102" y="294" text-anchor="middle" fill="#333">100</text>
    <rect x="124" y="268" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="144" y="294" text-anchor="middle" fill="#333">1</text>
    <rect x="164" y="268" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="184" y="294" text-anchor="middle" fill="#333">10</text>
    <text x="226" y="294" font-size="11" fill="#888">原数组</text>
  </g>
  <path d="M250,288 L300,288" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr2740w)" filter="url(#rough2)"/>
  <text x="275" y="280" text-anchor="middle" font-size="10" fill="#446688">sort</text>

  <!-- sorted: 1,10,100 gaps 9,90 -->
  <g font-size="15" font-weight="bold">
    <rect x="320" y="268" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="340" y="294" text-anchor="middle" fill="#333">1</text>
    <rect x="360" y="268" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="380" y="294" text-anchor="middle" fill="#333">10</text>
    <rect x="400" y="268" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="422" y="294" text-anchor="middle" fill="#333">100</text>
  </g>
  <g font-size="11" fill="#4a7a3a" font-weight="bold">
    <text x="350" y="326" text-anchor="middle">9</text>
    <text x="392" y="326" text-anchor="middle">90</text>
  </g>
  <text x="371" y="342" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">min(9,90) = 9 → 答案 9 ✓</text>

  <!-- partition for example2: cut after 10 -> nums1=[1,10] nums2=[100] value |10-100|=90? no -->
  <!-- Actually optimal cut after 1: nums1=[1] nums2=[10,100] -> |1-10|=9 -->
  <g font-size="14" font-weight="bold">
    <rect x="320" y="360" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="340" y="384" text-anchor="middle" fill="#4a7a3a">1</text>
    <rect x="360" y="360" width="40" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="380" y="384" text-anchor="middle" fill="#b85450">10</text>
    <rect x="400" y="360" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="422" y="384" text-anchor="middle" fill="#b85450">100</text>
  </g>
  <text x="380" y="410" text-anchor="middle" font-size="10" fill="#888">nums1=[1] max=1 ｜ nums2=[10,100] min=10 → |1−10|=9</text>

  <!-- conclusion -->
  <rect x="80" y="424" width="400" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="441" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">两个示例均验证：答案 = 排序后最小相邻间隙</text>
</svg>
