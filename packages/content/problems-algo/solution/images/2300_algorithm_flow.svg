<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：排序药水 → 对每个咒语算阈值 → 二分下界 → 计数</text>
  <text x="270" y="44" text-anchor="middle" font-size="10.5" fill="#888">时间 O(m log m + n log m)，空间 O(log m) 排序栈（不计结果数组）</text>

  <!-- step 1: sort -->
  <rect x="110" y="60" width="320" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="83" text-anchor="middle" font-size="12" fill="#333">① 对 potions 升序排序</text>
  <path d="M 270 98 L 270 118" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- step 2: loop over spells -->
  <rect x="110" y="120" width="320" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="143" text-anchor="middle" font-size="12" fill="#333">② 遍历每个咒语 spells[i] = s</text>
  <path d="M 270 158 L 270 178" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- step 3: compute threshold -->
  <rect x="60" y="180" width="420" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="198" text-anchor="middle" font-size="11.5" fill="#333">③ 阈值 t = ⌈success / s⌉ = (success + s − 1) / s</text>
  <text x="270" y="214" text-anchor="middle" font-size="10" fill="#888">注意 long long：success 可达 10¹⁰，超出 int</text>
  <path d="M 270 222 L 270 244" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- decision: binary search -->
  <polygon points="270,246 396,292 270,338 144,292" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="282" text-anchor="middle" font-size="11" fill="#333">lower_bound(t)</text>
  <text x="270" y="300" text-anchor="middle" font-size="11" fill="#333">在排序数组中找</text>
  <text x="270" y="318" text-anchor="middle" font-size="11" fill="#333">首个 ≥ t 的下标 idx</text>

  <!-- yes branch: idx found -->
  <text x="144" y="284" font-size="11" fill="#4a7a3a" font-weight="bold">找到</text>
  <path d="M 144 292 L 100 292 L 100 358" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <rect x="20" y="360" width="200" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="120" y="380" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">计数 + 入结果</text>
  <text x="120" y="398" text-anchor="middle" font-size="10.5" fill="#333">pairs[i] = m − idx</text>
  <text x="120" y="414" text-anchor="middle" font-size="10.5" fill="#333">（含 t 全超阈值即 idx=m）</text>

  <!-- loop back -->
  <path d="M 120 360 L 120 138 L 110 138" stroke="#666" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <text x="70" y="252" font-size="9.5" fill="#888">下一个咒语</text>

  <!-- right branch: idx==m all fail handled same -->
  <text x="396" y="284" font-size="11" fill="#b85450" font-weight="bold">idx=m</text>
  <path d="M 396 292 L 440 292 L 440 358" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <rect x="340" y="360" width="200" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="440" y="380" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">m − idx = 0</text>
  <text x="440" y="398" text-anchor="middle" font-size="10.5" fill="#333">阈值大于全部药水</text>
  <text x="440" y="414" text-anchor="middle" font-size="10.5" fill="#333">该咒语无成功药水</text>

  <!-- merge to return -->
  <path d="M 120 422 L 120 440 L 270 440" stroke="#666" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 440 422 L 440 440 L 270 440" stroke="#666" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 270 440 L 270 452" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- footer -->
  <rect x="40" y="430" width="460" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="270" y="444" text-anchor="middle" font-size="10.5" fill="#333">C++ 用 long long 算 t；Python 无溢出；二分写法等价于标准 lower_bound</text>
</svg>
