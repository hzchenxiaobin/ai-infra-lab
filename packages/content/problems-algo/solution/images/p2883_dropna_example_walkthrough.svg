<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：4 行进，3 行出，索引保留</text>

  <!-- Left: input table with per-row verdict -->
  <rect x="25" y="62" width="225" height="205" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="137" y="84" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">students（输入 + 判定）</text>

  <rect x="33" y="94" width="26" height="24" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="59" y="94" width="58" height="24" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="117" y="94" width="58" height="24" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="175" y="94" width="30" height="24" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="205" y="94" width="38" height="24" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="46" y="110" text-anchor="middle" font-size="9" fill="#ffffff" filter="url(#rough2)">idx</text>
  <text x="88" y="110" text-anchor="middle" font-size="8" fill="#ffffff" filter="url(#rough2)">student_id</text>
  <text x="146" y="110" text-anchor="middle" font-size="10" fill="#ffffff" filter="url(#rough2)">name</text>
  <text x="190" y="110" text-anchor="middle" font-size="9" fill="#ffffff" filter="url(#rough2)">age</text>
  <text x="224" y="110" text-anchor="middle" font-size="10" fill="#ffffff" filter="url(#rough2)">判定</text>

  <!-- row 0 -->
  <rect x="33" y="124" width="26" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="59" y="124" width="58" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="117" y="124" width="58" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="175" y="124" width="30" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="205" y="124" width="38" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="46" y="142" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="88" y="142" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">32</text>
  <text x="146" y="142" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Piper</text>
  <text x="190" y="142" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">5</text>
  <text x="224" y="142" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <!-- row 1: missing -->
  <rect x="33" y="152" width="26" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="59" y="152" width="58" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="117" y="152" width="58" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <rect x="175" y="152" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="205" y="152" width="38" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="46" y="170" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="88" y="170" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">217</text>
  <text x="146" y="170" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">None</text>
  <text x="190" y="170" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">19</text>
  <text x="224" y="170" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <!-- row 2 -->
  <rect x="33" y="180" width="26" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="59" y="180" width="58" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="117" y="180" width="58" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="175" y="180" width="30" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="205" y="180" width="38" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="46" y="198" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="88" y="198" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">779</text>
  <text x="146" y="198" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Georgia</text>
  <text x="190" y="198" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">20</text>
  <text x="224" y="198" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <!-- row 3 -->
  <rect x="33" y="208" width="26" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="59" y="208" width="58" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="117" y="208" width="58" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="175" y="208" width="30" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="205" y="208" width="38" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="46" y="226" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="88" y="226" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">849</text>
  <text x="146" y="226" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Willow</text>
  <text x="190" y="226" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">14</text>
  <text x="224" y="226" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <text x="137" y="254" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">object 列的 None = 缺失</text>

  <!-- Middle arrow -->
  <path d="M 253 150 L 304 150" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="278" y="138" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">dropna</text>

  <!-- Right: output table -->
  <rect x="310" y="62" width="220" height="205" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="420" y="84" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">输出</text>

  <rect x="318" y="94" width="28" height="24" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="346" y="94" width="62" height="24" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="408" y="94" width="62" height="24" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="470" y="94" width="42" height="24" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="332" y="110" text-anchor="middle" font-size="9" fill="#ffffff" filter="url(#rough2)">idx</text>
  <text x="377" y="110" text-anchor="middle" font-size="8" fill="#ffffff" filter="url(#rough2)">student_id</text>
  <text x="439" y="110" text-anchor="middle" font-size="10" fill="#ffffff" filter="url(#rough2)">name</text>
  <text x="491" y="110" text-anchor="middle" font-size="9" fill="#ffffff" filter="url(#rough2)">age</text>

  <rect x="318" y="124" width="28" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="346" y="124" width="62" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="408" y="124" width="62" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="470" y="124" width="42" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="332" y="142" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="377" y="142" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">32</text>
  <text x="439" y="142" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Piper</text>
  <text x="491" y="142" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">5</text>

  <rect x="318" y="152" width="28" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="346" y="152" width="62" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="408" y="152" width="62" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="470" y="152" width="42" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="332" y="170" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="377" y="170" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">779</text>
  <text x="439" y="170" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Georgia</text>
  <text x="491" y="170" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">20</text>

  <rect x="318" y="180" width="28" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="346" y="180" width="62" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="408" y="180" width="62" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="470" y="180" width="42" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="332" y="198" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="377" y="198" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">849</text>
  <text x="439" y="198" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Willow</text>
  <text x="491" y="198" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">14</text>

  <text x="420" y="226" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">行索引 0,2,3 保留</text>
  <text x="420" y="244" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">不重排、不重置</text>

  <!-- Bottom notes -->
  <rect x="40" y="290" width="480" height="84" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="314" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">① 输出索引 0,2,3：dropna 只筛行、不重建索引，本题无需 reset_index</text>
  <text x="280" y="336" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">② 不传 subset 的 dropna() 本题碰巧同结果——缺失恰好只在 name 列</text>
  <text x="280" y="358" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">③ 若下游需要连续索引：链式补 .reset_index(drop=True)</text>
</svg>
