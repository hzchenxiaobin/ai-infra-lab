<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1,4,4,1,3,5,5,3]，pattern = [1,0,−1]</text>

  <!-- b array row -->
  <text x="52" y="62" text-anchor="end" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="118" y="44" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="141" y="64" text-anchor="middle" font-size="12" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">+1</text>
  <rect x="164" y="44" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="187" y="64" text-anchor="middle" font-size="12" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="210" y="44" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="233" y="64" text-anchor="middle" font-size="12" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">−1</text>
  <rect x="256" y="44" width="46" height="30" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="279" y="64" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">+1</text>
  <rect x="302" y="44" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="325" y="64" text-anchor="middle" font-size="12" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">+1</text>
  <rect x="348" y="44" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="371" y="64" text-anchor="middle" font-size="12" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="394" y="44" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="417" y="64" text-anchor="middle" font-size="12" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">−1</text>
  <text x="141" y="88" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <text x="187" y="88" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <text x="233" y="88" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>
  <text x="279" y="88" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>
  <text x="325" y="88" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">4</text>
  <text x="371" y="88" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">5</text>
  <text x="417" y="88" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">6</text>

  <!-- fail box -->
  <rect x="440" y="38" width="106" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="493" y="54" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">pattern 无相等</text>
  <text x="493" y="70" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">fail = [0,0,0]</text>

  <!-- table header -->
  <rect x="36" y="104" width="488" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="70" y="121" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="122" y="121" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">b[i]</text>
  <text x="320" y="121" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">回退 / 匹配动作</text>
  <text x="488" y="121" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">j（末）</text>
  <line x1="96" y1="104" x2="96" y2="304" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="148" y1="104" x2="148" y2="304" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="452" y1="104" x2="452" y2="304" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- rows: h=25 each, y=130..304 -->
  <rect x="36" y="130" width="488" height="25" fill="#ffffff" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="70" y="147" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="122" y="147" text-anchor="middle" font-size="11" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">+1</text>
  <text x="300" y="147" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">+1 == pattern[0] → 接上</text>
  <text x="488" y="147" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="36" y="155" width="488" height="25" fill="#ffffff" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="70" y="172" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="122" y="172" text-anchor="middle" font-size="11" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="300" y="172" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0 == pattern[1] → 续接</text>
  <text x="488" y="172" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="36" y="180" width="488" height="25" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="70" y="197" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="122" y="197" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1</text>
  <text x="300" y="197" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1 == pattern[2] → j = 3 = m ✓ ans=1；j ← fail[2] = 0</text>
  <text x="488" y="197" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>

  <rect x="36" y="205" width="488" height="25" fill="#ffffff" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="70" y="222" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="122" y="222" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">+1</text>
  <text x="300" y="222" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">+1 == pattern[0] → 接上</text>
  <text x="488" y="222" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="36" y="230" width="488" height="25" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="70" y="247" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="122" y="247" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">+1</text>
  <text x="300" y="247" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">+1 ≠ pattern[1]=0 → j ← fail[0]=0；+1 == pattern[0] → j=1</text>
  <text x="488" y="247" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="36" y="255" width="488" height="25" fill="#ffffff" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="70" y="272" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="122" y="272" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="300" y="272" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0 == pattern[1] → 续接</text>
  <text x="488" y="272" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="36" y="280" width="488" height="25" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="70" y="297" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="122" y="297" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1</text>
  <text x="300" y="297" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1 == pattern[2] → j = 3 = m ✓ ans=2；j ← 0</text>
  <text x="488" y="297" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>

  <!-- conclusion -->
  <rect x="36" y="322" width="488" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="342" text-anchor="middle" font-size="11.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">ans = 2 ✓ 对应 nums[0..3] = [1,4,4,1] 与 nums[4..7] = [3,5,5,3]</text>
  <text x="280" y="362" text-anchor="middle" font-size="10.5" fill="#2d5a1e" filter="url(#rough2)">两次命中都发生在 j 走满 m 的瞬间，j 归零后立刻开始找下一处</text>

  <!-- note -->
  <rect x="36" y="388" width="488" height="66" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="280" y="408" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">💡 看 i = 4 这行（黄底）：失配回退后同一个 c 还要再和 pattern[0] 比一次，</text>
  <text x="280" y="425" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">前缀 [+1, +1] 的尾巴 [+1] 恰是 pattern 的头 [+1]——不重扫 b，</text>
  <text x="280" y="442" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">只靠 fail 自对齐就把潜在的新起点保住了，这是 KMP 不漏解的关键</text>
</svg>
