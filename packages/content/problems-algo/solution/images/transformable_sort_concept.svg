<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">排序子串的本质：小数能跨越大的，大数不能跨越小的</text>

  <!-- ===== Top case: CAN move ===== -->
  <text x="280" y="52" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓ 可以：s = "8 4 5 3 2" → 数字 3 可移到最前</text>

  <!-- digit boxes: 8 4 5 [3] 2, box w=40 h=32, gap=6, total=224, start=168 -->
  <rect x="168" y="66" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="87" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">8</text>

  <rect x="214" y="66" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="234" y="87" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>

  <rect x="260" y="66" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="87" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>

  <!-- highlighted digit 3 -->
  <rect x="306" y="66" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="326" y="87" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">3</text>

  <rect x="352" y="66" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="372" y="87" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>

  <!-- green curved arrow: 3 jumps to front -->
  <path d="M 326 66 Q 260 20 188 66" stroke="#4a7a3a" stroke-width="2.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="257" y="30" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">排序后 3 排最前</text>

  <!-- annotation -->
  <text x="280" y="116" text-anchor="middle" font-size="11" fill="#555">3 前面是 8, 4, 5 — 全部 ≥ 3，3 可以跨越它们</text>

  <!-- ===== Bottom case: CANNOT move ===== -->
  <text x="280" y="150" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗ 不可以：s = "1 2 3 4 5" → 数字 4 无法越过 3</text>

  <!-- digit boxes: 1 2 [3] [4] 5 -->
  <rect x="168" y="164" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="185" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <rect x="214" y="164" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="234" y="185" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>

  <!-- blocker digit 3 (red) -->
  <rect x="260" y="164" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="185" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">3</text>

  <!-- digit 4 trying to move (orange) -->
  <rect x="306" y="164" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="326" y="185" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">4</text>

  <rect x="352" y="164" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="372" y="185" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>

  <!-- labels above 3 and 4 -->
  <text x="280" y="160" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">挡住</text>
  <text x="326" y="160" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">想移</text>

  <!-- red blocked arrow: 4 tries to go left but blocked by 3 -->
  <path d="M 326 196 L 300 196" stroke="#b85450" stroke-width="2.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <!-- red X -->
  <path d="M 288 210 L 300 222 M 300 210 L 288 222" stroke="#b85450" stroke-width="2.5" fill="none" filter="url(#rough2)"/>

  <!-- annotation -->
  <text x="280" y="238" text-anchor="middle" font-size="11" fill="#555">4 前面有 3 &lt; 4 — 排序时 3 永远排在 4 前面，4 无法越过</text>

  <!-- ===== Summary box ===== -->
  <rect x="30" y="260" width="500" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="284" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">核心不变量</text>
  <text x="280" y="306" text-anchor="middle" font-size="11" fill="#555">排序子串不会改变「小数字在大数字前面」的相对顺序</text>
  <text x="280" y="326" text-anchor="middle" font-size="11" fill="#555">数字 d 能左移到当前位置 ⟺ 前方没有比 d 更小的未用数字</text>
  <text x="280" y="346" text-anchor="middle" font-size="10" fill="#888">→ 只需逐个检查 t 的每个数字是否被更小的数字挡住</text>
</svg>
