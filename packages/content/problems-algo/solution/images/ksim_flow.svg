<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="540" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">BFS 算法流程：固定首个错位 + 逐层扩展</text>

  <!-- Start -->
  <ellipse cx="280" cy="54" rx="130" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="58" text-anchor="middle" font-size="12" fill="#333">开始: queue ← [(s1, 0)], visited ← {s1}</text>
  <path d="M 280 72 L 280 84" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop check -->
  <rect x="120" y="86" width="320" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="107" text-anchor="middle" font-size="12" fill="#333">队列非空？否 → 结束</text>
  <path d="M 280 118 L 280 130" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="128" font-size="10" fill="#82b366">是</text>

  <!-- Pop state -->
  <rect x="100" y="132" width="360" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="150" text-anchor="middle" font-size="12" fill="#333">弹出 (cur, dist)</text>
  <text x="280" y="166" text-anchor="middle" font-size="11" fill="#888">BFS 保证首次弹出即最短</text>
  <path d="M 280 172 L 280 184" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Find first mismatch -->
  <rect x="70" y="186" width="420" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="204" text-anchor="middle" font-size="12" fill="#333">扫描找首个 i 使 cur[i] ≠ s2[i]</text>
  <text x="280" y="220" text-anchor="middle" font-size="11" fill="#888">i 之前的字符已对齐，后续交换不影响它们</text>
  <path d="M 280 226 L 280 238" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: i found? -->
  <polygon points="280,240 380,278 280,316 180,278" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="274" text-anchor="middle" font-size="12" fill="#333">找到错位 i ?</text>
  <text x="280" y="290" text-anchor="middle" font-size="10" fill="#888">（cur == s2 ?）</text>

  <!-- No -> return dist -->
  <path d="M 380 278 L 470 278" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="270" text-anchor="middle" font-size="11" fill="#82b366">否</text>
  <rect x="432" y="262" width="108" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="486" y="284" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">return dist ✓</text>

  <!-- Yes -> down to enum j -->
  <path d="M 280 316 L 280 328" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="326" font-size="11" fill="#b85450">是</text>

  <!-- Enumerate j -->
  <rect x="60" y="330" width="440" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">枚举 j ∈ (i, n) 且 cur[j] == s2[i]</text>
  <text x="280" y="368" text-anchor="middle" font-size="11" fill="#4a7a3a">交换 cur[i] ↔ cur[j] 得 next</text>
  <text x="280" y="382" text-anchor="middle" font-size="10" fill="#888">同字符去重：相邻相同 j 只取一次</text>
  <path d="M 280 386 L 280 398" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: visited? -->
  <polygon points="280,400 380,438 280,476 180,438" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="434" text-anchor="middle" font-size="12" fill="#333">next 已访问 ?</text>

  <!-- yes -> skip (loop back) -->
  <path d="M 380 438 L 440 438 L 440 102 L 440 102" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="430" text-anchor="middle" font-size="10" fill="#888">是 → 跳过</text>

  <!-- no -> enqueue -->
  <path d="M 280 476 L 280 488" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="292" y="486" font-size="10" fill="#82b366">否</text>

  <rect x="100" y="490" width="360" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="513" text-anchor="middle" font-size="12" fill="#333">visited.add(next); queue ← (next, dist+1)</text>

  <!-- loop back arrow to top -->
  <path d="M 100 508 L 40 508 L 40 102 L 120 102" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="44" y="300" font-size="10" fill="#888" transform="rotate(-90 44 300)">继续出队</text>
</svg>
