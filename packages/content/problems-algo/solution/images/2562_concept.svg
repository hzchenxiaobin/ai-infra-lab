<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">双指针对向收缩 + 算术拼接</text>

  <!-- Row 1: full array [7,52,2,4], take first 7 and last 4 -->
  <text x="70" y="88" text-anchor="end" font-size="13" fill="#888" filter="url(#rough2)">nums:</text>
  <g filter="url(#rough2)">
    <rect x="132" y="58" width="60" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="162" y="90" text-anchor="middle" font-size="18" fill="#333">7</text>
    <rect x="197" y="58" width="60" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="227" y="90" text-anchor="middle" font-size="18" fill="#333">52</text>
    <rect x="262" y="58" width="60" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="292" y="90" text-anchor="middle" font-size="18" fill="#333">2</text>
    <rect x="327" y="58" width="60" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="357" y="90" text-anchor="middle" font-size="18" fill="#333">4</text>
  </g>
  <text x="162" y="125" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">i↓</text>
  <text x="357" y="125" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">↓j</text>
  <text x="475" y="92" text-anchor="end" font-size="14" fill="#4a7a3a" filter="url(#rough2)">① 7|4 = 74</text>

  <!-- arrow indicating shrinking -->
  <path d="M180,138 L180,158" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="190" y="153" font-size="12" fill="#888" filter="url(#rough2)">删首尾</text>

  <!-- Row 2: remaining [52,2] -->
  <text x="70" y="198" text-anchor="end" font-size="13" fill="#888" filter="url(#rough2)">余:</text>
  <g filter="url(#rough2)">
    <rect x="197" y="168" width="60" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="227" y="200" text-anchor="middle" font-size="18" fill="#333">52</text>
    <rect x="262" y="168" width="60" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="292" y="200" text-anchor="middle" font-size="18" fill="#333">2</text>
  </g>
  <text x="227" y="235" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">i↓</text>
  <text x="292" y="235" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">↓j</text>
  <text x="475" y="202" text-anchor="end" font-size="14" fill="#4a7a3a" filter="url(#rough2)">② 52|2 = 522</text>

  <!-- Result -->
  <rect x="120" y="255" width="280" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="283" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">串联值 = 74 + 522 = 596</text>

  <text x="260" y="332" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">i 从左、j 从右对向收缩，每轮 a·10^d(b)+b 累加</text>
</svg>
