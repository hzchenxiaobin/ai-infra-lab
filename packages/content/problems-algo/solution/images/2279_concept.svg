<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：算缺口 → 升序排序 → 从小到大贪心填</text>
  <text x="270" y="44" text-anchor="middle" font-size="10.5" fill="#888">deficit[i] = capacity[i] − rocks[i]；预算有限时先填小缺口，单位石头换到的装满数最多</text>

  <!-- ===== 原始背包行 ===== -->
  <text x="30" y="70" font-size="11" fill="#446688" font-weight="bold">原始背包（capacity / rocks / 缺口）</text>

  <!-- bag0: cap=2 rocks=1 d=1 -->
  <rect x="64" y="80" width="78" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="103" y="100" text-anchor="middle" font-size="10.5" fill="#446688">容量 2</text>
  <text x="103" y="118" text-anchor="middle" font-size="10.5" fill="#333">已装 1</text>
  <rect x="64" y="146" width="78" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="103" y="161" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">缺口 = 1</text>

  <!-- bag1: cap=3 rocks=2 d=1 -->
  <rect x="168" y="80" width="78" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="207" y="100" text-anchor="middle" font-size="10.5" fill="#446688">容量 3</text>
  <text x="207" y="118" text-anchor="middle" font-size="10.5" fill="#333">已装 2</text>
  <rect x="168" y="146" width="78" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="207" y="161" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">缺口 = 1</text>

  <!-- bag2: cap=4 rocks=4 d=0 -->
  <rect x="272" y="80" width="78" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="311" y="100" text-anchor="middle" font-size="10.5" fill="#446688">容量 4</text>
  <text x="311" y="118" text-anchor="middle" font-size="10.5" fill="#333">已装 4</text>
  <rect x="272" y="146" width="78" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="311" y="161" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">缺口 = 0</text>

  <!-- bag3: cap=5 rocks=4 d=1 -->
  <rect x="376" y="80" width="78" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="415" y="100" text-anchor="middle" font-size="10.5" fill="#446688">容量 5</text>
  <text x="415" y="118" text-anchor="middle" font-size="10.5" fill="#333">已装 4</text>
  <rect x="376" y="146" width="78" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="415" y="161" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">缺口 = 1</text>

  <!-- sort arrow -->
  <path d="M 270 176 L 270 200" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="282" y="192" font-size="11" fill="#4a7a3a" font-weight="bold">按缺口升序排序</text>

  <!-- ===== 排序后行 ===== -->
  <text x="30" y="226" font-size="11" fill="#4a7a3a" font-weight="bold">排序后缺口 [0,1,1,1]，预算 additionalRocks=2 从左贪心填</text>

  <!-- budget arrow above bars -->
  <path d="M 80 244 L 350 244" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="215" y="238" text-anchor="middle" font-size="10.5" fill="#4a7a3a">预算从左到右消耗</text>

  <!-- bars baseline y=300, scale d*36 -->
  <!-- bar0 d=0 (filled, cost 0) -->
  <rect x="80" y="296" width="60" height="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="110" y="290" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">d=0 ✓</text>
  <text x="110" y="316" text-anchor="middle" font-size="9" fill="#888">花 0</text>

  <!-- bar1 d=1 (filled, cost 1) -->
  <rect x="180" y="264" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="210" y="258" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">d=1 ✓</text>
  <text x="210" y="316" text-anchor="middle" font-size="9" fill="#888">花 1</text>

  <!-- bar2 d=1 (filled, cost 1) -->
  <rect x="280" y="264" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="310" y="258" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">d=1 ✓</text>
  <text x="310" y="316" text-anchor="middle" font-size="9" fill="#888">花 1</text>

  <!-- bar3 d=1 (NOT filled, budget exhausted) -->
  <rect x="380" y="264" width="60" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="410" y="258" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">d=1 ✗</text>
  <text x="410" y="316" text-anchor="middle" font-size="9" fill="#b85450">预算不足</text>

  <!-- answer -->
  <rect x="120" y="332" width="300" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="14" filter="url(#rough2)"/>
  <text x="270" y="352" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">ans = 3（先填小的，3 个装满，第 4 个差 1）</text>

  <!-- footer -->
  <rect x="30" y="372" width="480" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="270" y="387" text-anchor="middle" font-size="10.5" fill="#333">每装满一个背包收益相同(+1) ⇒ 按成本(缺口)升序贪心最优</text>
</svg>
