<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n=4, left=[4,3], right=[0,1]</text>

  <!-- Plank -->
  <rect x="80" y="50" width="400" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <!-- position ticks 0..4 -->
  <line x1="80" y1="50" x2="80" y2="84" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="180" y1="50" x2="180" y2="84" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="280" y1="50" x2="280" y2="84" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="380" y1="50" x2="380" y2="84" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="480" y1="50" x2="480" y2="84" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="98" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="180" y="98" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="280" y="98" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="380" y="98" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="480" y="98" text-anchor="middle" font-size="10" fill="#888">4</text>

  <!-- t=0 ants -->
  <text x="50" y="140" font-size="10" fill="#888" font-weight="bold">t=0</text>
  <line x1="80" y1="140" x2="480" y2="140" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <!-- A at 0 going right -->
  <circle cx="80" cy="140" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="143" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">A</text>
  <path d="M 94 140 L 112 140" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- B at 1 going right -->
  <circle cx="180" cy="140" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="143" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">B</text>
  <path d="M 194 140 L 212 140" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- C at 3 going left -->
  <circle cx="380" cy="140" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="143" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">C</text>
  <path d="M 366 140 L 348 140" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <!-- D at 4 going left -->
  <circle cx="480" cy="140" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="480" y="143" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">D</text>
  <path d="M 466 140 L 448 140" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- virtual trajectories (dashed) -->
  <text x="280" y="174" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">等价转化后：各蚂蚁沿原方向直走（虚线轨迹）</text>

  <!-- A trajectory: 0 -> 4, falls at t=4 -->
  <path d="M 80 190 L 480 190" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="50" y="194" font-size="10" fill="#4a7a3a" font-weight="bold">A→</text>
  <text x="490" y="194" font-size="10" fill="#4a7a3a" font-weight="bold">t=4</text>

  <!-- B trajectory: 1 -> 4, falls at t=3 -->
  <path d="M 180 215 L 480 215" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="140" y="219" font-size="10" fill="#4a7a3a" font-weight="bold">B→</text>
  <text x="490" y="219" font-size="10" fill="#4a7a3a" font-weight="bold">t=3</text>

  <!-- C trajectory: 3 -> 0, falls at t=3 -->
  <path d="M 380 240 L 80 240" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="390" y="244" font-size="10" fill="#b85450" font-weight="bold">←C</text>
  <text x="50" y="244" font-size="10" fill="#b85450" font-weight="bold">t=3</text>

  <!-- D trajectory: 4 -> 0, falls at t=4 -->
  <path d="M 480 265 L 80 265" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="490" y="269" font-size="10" fill="#b85450" font-weight="bold">←D</text>
  <text x="50" y="269" font-size="10" fill="#b85450" font-weight="bold">t=4</text>

  <!-- Summary table -->
  <rect x="60" y="290" width="440" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="310" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">掉落时间汇总</text>

  <!-- table header -->
  <text x="110" y="330" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">蚂蚁</text>
  <text x="200" y="330" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">位置</text>
  <text x="290" y="330" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">方向</text>
  <text x="410" y="330" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">掉落时间</text>
  <line x1="80" y1="336" x2="480" y2="336" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <text x="110" y="352" text-anchor="middle" font-size="10" fill="#333">A</text>
  <text x="200" y="352" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="290" y="352" text-anchor="middle" font-size="10" fill="#4a7a3a">右</text>
  <text x="410" y="352" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">n−0 = 4</text>

  <text x="110" y="368" text-anchor="middle" font-size="10" fill="#333">B</text>
  <text x="200" y="368" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="290" y="368" text-anchor="middle" font-size="10" fill="#4a7a3a">右</text>
  <text x="410" y="368" text-anchor="middle" font-size="10" fill="#333">n−1 = 3</text>

  <text x="110" y="382" text-anchor="middle" font-size="10" fill="#333">C / D</text>
  <text x="200" y="382" text-anchor="middle" font-size="10" fill="#333">3 / 4</text>
  <text x="290" y="382" text-anchor="middle" font-size="10" fill="#b85450">左</text>
  <text x="410" y="382" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3 / 4 → max = 4</text>
</svg>
