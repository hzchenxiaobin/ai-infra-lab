<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：分量边界 = 至少一个邻居不在同分量</text>
  <text x="270" y="48" text-anchor="middle" font-size="11" fill="#888">邻居「越界」或「异色」→ 边界格；四邻全在分量内 → 内部格</text>

  <g filter="url(#rough2)" font-size="16" font-weight="bold">
    <!-- dashed ring around the 3x3 component (cols 0-2, rows 0-2) -->
    <rect x="52" y="82" width="132" height="132" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="6,4" rx="4"/>

    <!-- Row 0: 1(b) 1(b) 1(b) 2 -->
    <rect x="56" y="86" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="78" y="114" text-anchor="middle" fill="#a06820">1</text>
    <rect x="100" y="86" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="122" y="114" text-anchor="middle" fill="#a06820">1</text>
    <rect x="144" y="86" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="166" y="114" text-anchor="middle" fill="#a06820">1</text>
    <rect x="188" y="86" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="210" y="114" text-anchor="middle" fill="#446688">2</text>

    <!-- Row 1: 1(b) 1(inside) 1(b) 2 -->
    <rect x="56" y="130" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="78" y="158" text-anchor="middle" fill="#a06820">1</text>
    <rect x="100" y="130" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.6" rx="4"/>
    <text x="122" y="158" text-anchor="middle" fill="#4a7a3a">1</text>
    <rect x="144" y="130" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="166" y="158" text-anchor="middle" fill="#a06820">1</text>
    <rect x="188" y="130" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="210" y="158" text-anchor="middle" fill="#446688">2</text>

    <!-- Row 2: 1(b) 1(b) 1(b) 2 -->
    <rect x="56" y="174" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="78" y="202" text-anchor="middle" fill="#a06820">1</text>
    <rect x="100" y="174" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="122" y="202" text-anchor="middle" fill="#a06820">1</text>
    <rect x="144" y="174" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="166" y="202" text-anchor="middle" fill="#a06820">1</text>
    <rect x="188" y="174" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="210" y="202" text-anchor="middle" fill="#446688">2</text>

    <!-- Row 3: 2 2 2 2 -->
    <rect x="56" y="218" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="78" y="246" text-anchor="middle" fill="#446688">2</text>
    <rect x="100" y="218" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="122" y="246" text-anchor="middle" fill="#446688">2</text>
    <rect x="144" y="218" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="166" y="246" text-anchor="middle" fill="#446688">2</text>
    <rect x="188" y="218" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="210" y="246" text-anchor="middle" fill="#446688">2</text>
  </g>

  <!-- start marker pointing to (0,0) -->
  <g filter="url(#rough2)" font-size="11" font-weight="bold">
    <text x="34" y="120" fill="#b85450">起→</text>
    <path d="M 50 116 L 56 112" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)"/>
  </g>

  <!-- cause labels -->
  <g filter="url(#rough2)" font-size="10" font-weight="bold">
    <text x="122" y="78" text-anchor="middle" fill="#b85450">越界↑</text>
    <text x="166" y="128" text-anchor="middle" fill="#b85450">异色→</text>
    <text x="166" y="172" text-anchor="middle" fill="#b85450">异色↓</text>
  </g>

  <!-- annotations on the right -->
  <g filter="url(#rough2)" font-size="12">
    <rect x="282" y="118" width="232" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="398" y="138" text-anchor="middle" fill="#4a7a3a" font-weight="bold">内部格（不动）</text>
    <text x="398" y="154" text-anchor="middle" fill="#4a7a3a" font-size="11">4 邻居均在分量内</text>
    <path d="M 282 141 L 150 156" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)"/>

    <rect x="282" y="178" width="232" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="398" y="198" text-anchor="middle" fill="#a06820" font-weight="bold">边界格（涂 color）</text>
    <text x="398" y="214" text-anchor="middle" fill="#a06820" font-size="11">至少 1 邻居越界或异色</text>
    <path d="M 282 201 L 192 168" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arrO)"/>

    <rect x="282" y="238" width="232" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="398" y="258" text-anchor="middle" fill="#446688" font-weight="bold">异色格（非分量，不动）</text>
    <text x="398" y="272" text-anchor="middle" fill="#446688" font-size="11">颜色 ≠ orig</text>
    <path d="M 282 256 L 214 168" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arrB)"/>
  </g>

  <text x="270" y="328" text-anchor="middle" font-size="11" fill="#888">绿=内部格(不动)｜橙=边界格(涂 color)｜蓝=异色格(不动)｜虚线框=起点所在连通分量</text>
  <text x="270" y="346" text-anchor="middle" font-size="10" fill="#aaa">本图分量原色 orig=1，3×3 块；仅中心 (1,1) 四邻均在分量内为内部格</text>
</svg>
