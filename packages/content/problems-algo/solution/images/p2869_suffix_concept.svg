<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arro" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrgr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：只能从末尾弹出 ⇒ t 次操作收集的恰好是一个后缀</text>
  <text x="280" y="46" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">nums = [3,2,5,3,1]，k = 3：求「包含 1..3 各至少一个」的最短后缀</text>

  <!-- set panel -->
  <rect x="445" y="60" width="95" height="112" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="492" y="80" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">集合(去重)</text>
  <text x="492" y="100" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">① 弹出 1</text>
  <text x="492" y="116" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">② 弹出 3</text>
  <text x="492" y="132" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">③ 弹出 2</text>
  <text x="492" y="158" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">{1,2,3} ✓</text>

  <!-- pop arrow -->
  <path d="M 398 98 L 441 98" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrgr)" filter="url(#rough2)"/>
  <text x="419" y="88" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">依次弹出</text>

  <!-- array cells -->
  <g filter="url(#rough2)">
    <rect x="120" y="74" width="48" height="36" fill="#f5f5f5" stroke="#999" stroke-width="1.5" rx="4"/>
    <text x="144" y="98" text-anchor="middle" font-size="14" fill="#777">3</text>
    <rect x="176" y="74" width="48" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="200" y="98" text-anchor="middle" font-size="14" fill="#b07818" font-weight="bold">2</text>
    <rect x="232" y="74" width="48" height="36" fill="#f5f5f5" stroke="#999" stroke-width="1.5" stroke-dasharray="4 3" rx="4"/>
    <text x="256" y="98" text-anchor="middle" font-size="14" fill="#aaa">5</text>
    <rect x="288" y="74" width="48" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="312" y="98" text-anchor="middle" font-size="14" fill="#b07818" font-weight="bold">3</text>
    <rect x="344" y="74" width="48" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="368" y="98" text-anchor="middle" font-size="14" fill="#b07818" font-weight="bold">1</text>
  </g>
  <text x="256" y="70" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">5 &gt; k，无视</text>

  <!-- index labels -->
  <g filter="url(#rough2)" font-size="11" fill="#888">
    <text x="144" y="128" text-anchor="middle">i=0</text>
    <text x="200" y="128" text-anchor="middle">i=1</text>
    <text x="256" y="128" text-anchor="middle">i=2</text>
    <text x="312" y="128" text-anchor="middle">i=3</text>
    <text x="368" y="128" text-anchor="middle">i=4</text>
  </g>

  <!-- suffix bracket -->
  <path d="M 176 138 L 176 150 L 392 150 L 392 138" fill="none" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="284" y="168" text-anchor="middle" font-size="12" fill="#b07818" font-weight="bold" filter="url(#rough2)">最短合法后缀：从 i* = 1 开始，长度 t = n − i* = 4</text>

  <!-- annotation boxes -->
  <rect x="36" y="188" width="240" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="156" y="208" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">后缀性质</text>
  <text x="156" y="226" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">操作只能弹末尾 ⇒ 集合 = 某个后缀去重</text>
  <text x="156" y="242" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">问题转化：找包含 1..k 的最短后缀</text>

  <rect x="284" y="188" width="240" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="404" y="208" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">最后出现位置</text>
  <text x="404" y="226" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">last(1)=4, last(2)=1, last(3)=3</text>
  <text x="404" y="242" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">i* = min = 1，答案 = 5 − 1 = 4</text>

  <!-- formula -->
  <rect x="86" y="264" width="388" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="283" text-anchor="middle" font-size="13" fill="#b07818" font-weight="bold" filter="url(#rough2)">答案 = n − min last(v)（v = 1..k）</text>
  <text x="280" y="301" text-anchor="middle" font-size="11" fill="#b07818" filter="url(#rough2)">= 最短合法后缀的长度</text>
</svg>
