<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="17" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">核心观察：固定栅栏高度 h —— 单块直用 + 互不相交的配对组</text>

  <!-- 图例 -->
  <rect x="168" y="25" width="11" height="11" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="183" y="34" font-size="9" fill="#4a7a3a" filter="url(#rough2)">单块</text>
  <rect x="225" y="25" width="11" height="11" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="240" y="34" font-size="9" fill="#446688" filter="url(#rough2)">拼合 1+4</text>
  <rect x="305" y="25" width="11" height="11" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="34" font-size="9" fill="#8a6d1f" filter="url(#rough2)">拼合 2+3</text>
  <rect x="385" y="25" width="11" height="11" rx="3" fill="#f2f2f2" stroke="#999" stroke-width="1.2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="400" y="34" font-size="9" fill="#888" filter="url(#rough2)">弃用</text>

  <text x="36" y="52" font-size="10.5" fill="#666" filter="url(#rough2)">原始木板（按高度排序后）：</text>

  <!-- 9 根原始木板：planks = [1,1,2,2,3,4,5,5,7]，1 单位 = 8px -->
  <rect x="48" y="133" width="30" height="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <rect x="86" y="133" width="30" height="8" fill="#f2f2f2" stroke="#999" stroke-width="1.2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <rect x="124" y="125" width="30" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="162" y="125" width="30" height="16" fill="#f2f2f2" stroke="#999" stroke-width="1.2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <rect x="200" y="117" width="30" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="238" y="109" width="30" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <rect x="276" y="101" width="30" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="314" y="101" width="30" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="352" y="85" width="30" height="56" fill="#f2f2f2" stroke="#999" stroke-width="1.2" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <path d="M 40 141 L 396 141" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="63" y="155" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="101" y="155" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">1</text>
  <text x="139" y="155" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="177" y="155" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">2</text>
  <text x="215" y="155" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="253" y="155" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="291" y="155" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="329" y="155" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="367" y="155" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">7</text>
  <text x="101" y="167" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">弃</text>
  <text x="177" y="167" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">弃</text>
  <text x="367" y="167" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">弃</text>

  <!-- 配对弧线 -->
  <path d="M 63 129 Q 158 60 253 105" fill="none" stroke="#446688" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="158" y="72" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">1 + 4 = 5</text>
  <path d="M 139 121 Q 177 90 215 113" fill="none" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="112" y="88" text-anchor="end" font-size="10.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">2 + 3 = 5</text>

  <text x="310" y="92" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">单块 ×2</text>
  <text x="367" y="79" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">太高，弃</text>

  <!-- 拼成的栅栏 -->
  <text x="36" y="182" font-size="10.5" fill="#666" filter="url(#rough2)">拼成栅栏（高度统一为 5）：</text>

  <rect x="60" y="220" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="82" y="244" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">5</text>
  <rect x="114" y="220" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="136" y="244" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">5</text>
  <rect x="168" y="220" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="190" y="244" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">5</text>
  <rect x="222" y="220" width="44" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="244" y="244" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">5</text>

  <path d="M 50 260 L 290 260" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="82" y="274" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">原 5</text>
  <text x="136" y="274" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">原 5</text>
  <text x="190" y="274" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">1+4</text>
  <text x="244" y="274" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">2+3</text>

  <path d="M 64 290 L 262 290" stroke="#b85450" stroke-width="1.6" marker-start="url(#arr)" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="163" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">宽度 = 4</text>

  <!-- 右侧：宽度构成 -->
  <rect x="312" y="192" width="194" height="88" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="409" y="210" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">宽度(5) 的构成</text>
  <text x="409" y="227" text-anchor="middle" font-size="9.5" fill="#7a5c1a" filter="url(#rough2)">cnt[5] = 2 → 两块直接单用</text>
  <text x="409" y="244" text-anchor="middle" font-size="9.5" fill="#7a5c1a" filter="url(#rough2)">{1,4} 组：min(2,1) = 1 对</text>
  <text x="409" y="261" text-anchor="middle" font-size="9.5" fill="#7a5c1a" filter="url(#rough2)">{2,3} 组：min(2,1) = 1 对</text>
  <text x="409" y="276" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">合计 2 + 1 + 1 = 4</text>

  <!-- 结论框 -->
  <rect x="30" y="312" width="460" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="328" text-anchor="middle" font-size="10" fill="#2f5527" filter="url(#rough2)">宽度(h) = cnt[h] + Σ min(cnt[x], cnt[h−x])（x &lt; h−x）+ cnt[h/2] // 2（h 为偶数）</text>
  <text x="260" y="345" text-anchor="middle" font-size="9" fill="#2f5527" filter="url(#rough2)">配对组 {x, h−x} 值域互不相交：组内取 min、组间直接求和 → 公式即该 h 的最大宽度</text>
</svg>
