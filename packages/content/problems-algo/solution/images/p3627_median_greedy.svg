<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#999"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：顶部「弃 1 取 1」+ 底部垫底</text>
  <text x="26" y="46" font-size="11" fill="#666" filter="url(#rough2)">示例 nums = [1,2,3,4,5,6,7,8,9]，排序后 n = 9，k = 3</text>
  <text x="494" y="46" text-anchor="end" font-size="10" fill="#666" filter="url(#rough2)">橙 = 中位数（取）　白 = 陪衬（弃）</text>

  <text x="280" y="64" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">从右往左交替：弃 · 取 · 弃 · 取 ⋯</text>
  <path d="M 468 73 L 110 73" stroke="#999" stroke-width="1.4" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 排序格子行 -->
  <rect x="30" y="84" width="44" height="32" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="52" y="105" text-anchor="middle" font-size="14" fill="#777" filter="url(#rough2)">1</text>
  <rect x="82" y="84" width="44" height="32" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="104" y="105" text-anchor="middle" font-size="14" fill="#777" filter="url(#rough2)">2</text>
  <rect x="134" y="84" width="44" height="32" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="156" y="105" text-anchor="middle" font-size="14" fill="#777" filter="url(#rough2)">3</text>
  <rect x="186" y="84" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="208" y="105" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <rect x="238" y="84" width="44" height="32" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="260" y="105" text-anchor="middle" font-size="14" fill="#777" filter="url(#rough2)">5</text>
  <rect x="290" y="84" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="312" y="105" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>
  <rect x="342" y="84" width="44" height="32" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="364" y="105" text-anchor="middle" font-size="14" fill="#777" filter="url(#rough2)">7</text>
  <rect x="394" y="84" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="416" y="105" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">8</text>
  <rect x="446" y="84" width="44" height="32" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="468" y="105" text-anchor="middle" font-size="14" fill="#777" filter="url(#rough2)">9</text>

  <text x="104" y="130" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">底部 k 个：全部垫底</text>
  <text x="338" y="130" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">顶部 2k 个：弃取交替</text>

  <!-- 中位数虚线下连到各组 -->
  <path d="M 208 118 L 208 130 L 118 146" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <path d="M 312 118 L 312 130 L 275 146" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <path d="M 416 118 L 416 130 L 432 146" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>

  <!-- 组③ {5,4,3} -->
  <rect x="25" y="150" width="140" height="62" rx="8" fill="#f6f8fa" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="95" y="164" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">组③：最大 2 + 最小 1</text>
  <circle cx="60" cy="183" r="13" fill="#ffffff" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="60" y="188" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">5</text>
  <circle cx="95" cy="183" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="95" y="188" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <circle cx="130" cy="183" r="13" fill="#ffffff" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="130" y="188" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">3</text>
  <text x="95" y="207" text-anchor="middle" font-size="10" fill="#b07818" filter="url(#rough2)">中位数 = 4 ✓</text>

  <!-- 组② {7,6,2} -->
  <rect x="190" y="150" width="140" height="62" rx="8" fill="#f6f8fa" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="260" y="164" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">组②：最大 2 + 最小 1</text>
  <circle cx="225" cy="183" r="13" fill="#ffffff" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="225" y="188" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">7</text>
  <circle cx="260" cy="183" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="188" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <circle cx="295" cy="183" r="13" fill="#ffffff" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="295" y="188" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">2</text>
  <text x="260" y="207" text-anchor="middle" font-size="10" fill="#b07818" filter="url(#rough2)">中位数 = 6 ✓</text>

  <!-- 组① {9,8,1} -->
  <rect x="355" y="150" width="140" height="62" rx="8" fill="#f6f8fa" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="425" y="164" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">组①：最大 2 + 最小 1</text>
  <circle cx="390" cy="183" r="13" fill="#ffffff" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="390" y="188" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">9</text>
  <circle cx="425" cy="183" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="425" y="188" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <circle cx="460" cy="183" r="13" fill="#ffffff" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="460" y="188" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">1</text>
  <text x="425" y="207" text-anchor="middle" font-size="10" fill="#b07818" filter="url(#rough2)">中位数 = 8 ✓</text>

  <text x="260" y="232" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">✗ 若每次取最大 3 个：{9,8,7} {6,5,4} {3,2,1} → 8 + 5 + 2 = 15 &lt; 18</text>

  <rect x="36" y="246" width="448" height="94" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="268" text-anchor="middle" font-size="12" fill="#2a4a20" filter="url(#rough2)">ans = a[n−2] + a[n−4] + ⋯ + a[n−2k] = 8 + 6 + 4 = 18</text>
  <text x="260" y="290" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">从右往左：第二大取、第三大弃、第四大取 ⋯ 底部 k 个全部垫底</text>
  <text x="260" y="310" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">上界：第 j 大的中位数 ≤ 第 2j 大的元素（那 j 组共需 2j 个 ≥ 它的元素）</text>
  <text x="260" y="328" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">贪心分组恰好取满上界 ⟹ 最优</text>
</svg>
