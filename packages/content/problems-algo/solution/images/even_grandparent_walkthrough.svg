<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：DFS 前序遍历逐节点判定</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">树 = [6,7,8,2,7,1,3,9,null,1,4,null,null,null,5]，前序：根→左→右</text>

  <!-- ===== Table header ===== -->
  <rect x="24" y="58" width="532" height="26" fill="#446688" filter="url(#rough2)"/>
  <g font-size="11" fill="#fff" font-weight="bold">
    <text x="44" y="75" text-anchor="middle">步</text>
    <text x="92" y="75" text-anchor="middle">node</text>
    <text x="156" y="75" text-anchor="middle">parent</text>
    <text x="232" y="75" text-anchor="middle">grandparent</text>
    <text x="320" y="75" text-anchor="middle">gp 偶数?</text>
    <text x="396" y="75" text-anchor="middle">累加</text>
    <text x="496" y="75" text-anchor="middle">sum</text>
  </g>

  <!-- ===== Rows ===== -->
  <!-- row 1: 6 -->
  <rect x="24" y="86" width="532" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <g font-size="11">
    <text x="44" y="104" text-anchor="middle" fill="#888">1</text>
    <text x="92" y="104" text-anchor="middle" fill="#d6a040" font-weight="bold">6</text>
    <text x="156" y="104" text-anchor="middle" fill="#888">null</text>
    <text x="232" y="104" text-anchor="middle" fill="#888">null</text>
    <text x="320" y="104" text-anchor="middle" fill="#888">—</text>
    <text x="396" y="104" text-anchor="middle" fill="#888">否</text>
    <text x="496" y="104" text-anchor="middle" fill="#333">0</text>
  </g>

  <!-- row 2: 7 -->
  <rect x="24" y="116" width="532" height="28" fill="#ffffff" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <g font-size="11">
    <text x="44" y="134" text-anchor="middle" fill="#888">2</text>
    <text x="92" y="134" text-anchor="middle" fill="#446688" font-weight="bold">7</text>
    <text x="156" y="134" text-anchor="middle" fill="#d6a040">6</text>
    <text x="232" y="134" text-anchor="middle" fill="#888">null</text>
    <text x="320" y="134" text-anchor="middle" fill="#888">—</text>
    <text x="396" y="134" text-anchor="middle" fill="#888">否</text>
    <text x="496" y="134" text-anchor="middle" fill="#333">0</text>
  </g>

  <!-- row 3: 2 → +2 -->
  <rect x="24" y="146" width="532" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <g font-size="11">
    <text x="44" y="164" text-anchor="middle" fill="#888">3</text>
    <text x="92" y="164" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <text x="156" y="164" text-anchor="middle" fill="#446688">7</text>
    <text x="232" y="164" text-anchor="middle" fill="#d6a040">6</text>
    <text x="320" y="164" text-anchor="middle" fill="#b85450" font-weight="bold">✓ 6%2==0</text>
    <text x="396" y="164" text-anchor="middle" fill="#b85450" font-weight="bold">+2</text>
    <text x="496" y="164" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
  </g>

  <!-- row 4: 9 -->
  <rect x="24" y="176" width="532" height="28" fill="#ffffff" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <g font-size="11">
    <text x="44" y="194" text-anchor="middle" fill="#888">4</text>
    <text x="92" y="194" text-anchor="middle" fill="#446688" font-weight="bold">9</text>
    <text x="156" y="194" text-anchor="middle" fill="#446688">2</text>
    <text x="232" y="194" text-anchor="middle" fill="#446688">7</text>
    <text x="320" y="194" text-anchor="middle" fill="#888">✗ 7 奇</text>
    <text x="396" y="194" text-anchor="middle" fill="#888">否</text>
    <text x="496" y="194" text-anchor="middle" fill="#333">2</text>
  </g>

  <!-- row 5: 7 → +7 -->
  <rect x="24" y="206" width="532" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <g font-size="11">
    <text x="44" y="224" text-anchor="middle" fill="#888">5</text>
    <text x="92" y="224" text-anchor="middle" fill="#b85450" font-weight="bold">7</text>
    <text x="156" y="224" text-anchor="middle" fill="#446688">7</text>
    <text x="232" y="224" text-anchor="middle" fill="#d6a040">6</text>
    <text x="320" y="224" text-anchor="middle" fill="#b85450" font-weight="bold">✓ 6%2==0</text>
    <text x="396" y="224" text-anchor="middle" fill="#b85450" font-weight="bold">+7</text>
    <text x="496" y="224" text-anchor="middle" fill="#b85450" font-weight="bold">9</text>
  </g>

  <!-- row 6: 1 -->
  <rect x="24" y="236" width="532" height="28" fill="#ffffff" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <g font-size="11">
    <text x="44" y="254" text-anchor="middle" fill="#888">6</text>
    <text x="92" y="254" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <text x="156" y="254" text-anchor="middle" fill="#446688">7</text>
    <text x="232" y="254" text-anchor="middle" fill="#446688">7</text>
    <text x="320" y="254" text-anchor="middle" fill="#888">✗ 7 奇</text>
    <text x="396" y="254" text-anchor="middle" fill="#888">否</text>
    <text x="496" y="254" text-anchor="middle" fill="#333">9</text>
  </g>

  <!-- row 7: 4 -->
  <rect x="24" y="266" width="532" height="28" fill="#ffffff" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <g font-size="11">
    <text x="44" y="284" text-anchor="middle" fill="#888">7</text>
    <text x="92" y="284" text-anchor="middle" fill="#446688" font-weight="bold">4</text>
    <text x="156" y="284" text-anchor="middle" fill="#446688">7</text>
    <text x="232" y="284" text-anchor="middle" fill="#446688">7</text>
    <text x="320" y="284" text-anchor="middle" fill="#888">✗ 7 奇</text>
    <text x="396" y="284" text-anchor="middle" fill="#888">否</text>
    <text x="496" y="284" text-anchor="middle" fill="#333">9</text>
  </g>

  <!-- row 8: 8 -->
  <rect x="24" y="296" width="532" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <g font-size="11">
    <text x="44" y="314" text-anchor="middle" fill="#888">8</text>
    <text x="92" y="314" text-anchor="middle" fill="#d6a040" font-weight="bold">8</text>
    <text x="156" y="314" text-anchor="middle" fill="#888">null</text>
    <text x="232" y="314" text-anchor="middle" fill="#888">null</text>
    <text x="320" y="314" text-anchor="middle" fill="#888">—</text>
    <text x="396" y="314" text-anchor="middle" fill="#888">否</text>
    <text x="496" y="314" text-anchor="middle" fill="#333">9</text>
  </g>

  <!-- row 9: 1 → +1 -->
  <rect x="24" y="326" width="532" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <g font-size="11">
    <text x="44" y="344" text-anchor="middle" fill="#888">9</text>
    <text x="92" y="344" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <text x="156" y="344" text-anchor="middle" fill="#d6a040">8</text>
    <text x="232" y="344" text-anchor="middle" fill="#d6a040">6</text>
    <text x="320" y="344" text-anchor="middle" fill="#b85450" font-weight="bold">✓ 6%2==0</text>
    <text x="396" y="344" text-anchor="middle" fill="#b85450" font-weight="bold">+1</text>
    <text x="496" y="344" text-anchor="middle" fill="#b85450" font-weight="bold">10</text>
  </g>

  <!-- row 10: 3 → +3 -->
  <rect x="24" y="356" width="532" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <g font-size="11">
    <text x="44" y="374" text-anchor="middle" fill="#888">10</text>
    <text x="92" y="374" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
    <text x="156" y="374" text-anchor="middle" fill="#d6a040">8</text>
    <text x="232" y="374" text-anchor="middle" fill="#d6a040">6</text>
    <text x="320" y="374" text-anchor="middle" fill="#b85450" font-weight="bold">✓ 6%2==0</text>
    <text x="396" y="374" text-anchor="middle" fill="#b85450" font-weight="bold">+3</text>
    <text x="496" y="374" text-anchor="middle" fill="#b85450" font-weight="bold">13</text>
  </g>

  <!-- row 11: 5 → +5 -->
  <rect x="24" y="386" width="532" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <g font-size="11">
    <text x="44" y="404" text-anchor="middle" fill="#888">11</text>
    <text x="92" y="404" text-anchor="middle" fill="#b85450" font-weight="bold">5</text>
    <text x="156" y="404" text-anchor="middle" fill="#446688">3</text>
    <text x="232" y="404" text-anchor="middle" fill="#d6a040">8</text>
    <text x="320" y="404" text-anchor="middle" fill="#b85450" font-weight="bold">✓ 8%2==0</text>
    <text x="396" y="404" text-anchor="middle" fill="#b85450" font-weight="bold">+5</text>
    <text x="496" y="404" text-anchor="middle" fill="#b85450" font-weight="bold">18</text>
  </g>

  <!-- summary -->
  <rect x="24" y="422" width="532" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="290" y="442" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">红色行 = 被累加节点（祖父偶数）→ 2 + 7 + 1 + 3 + 5 = 18 ✓</text>
</svg>
