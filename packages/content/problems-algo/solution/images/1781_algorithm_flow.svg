<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：双重循环枚举子串 + 增量频率表，每步 O(Σ) 算 beauty</text>

  <!-- Start oval -->
  <ellipse cx="280" cy="60" rx="50" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="65" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M 280 78 L 280 96" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init box -->
  <rect x="200" y="98" width="160" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="120" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans = 0</text>
  <path d="M 280 132 L 280 150" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Outer loop decision: l < n ? -->
  <polygon points="280,152 370,190 280,228 190,190" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="186" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">l &lt; n ?</text>
  <text x="280" y="202" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">（外层左端点）</text>

  <!-- No branch -> return -->
  <path d="M 370 190 L 460 190 L 460 244" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="412" y="182" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="402" y="246" width="116" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="460" y="268" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 ans</text>

  <!-- Yes branch down -->
  <path d="M 280 228 L 280 246" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="242" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- Init cnt[26]=0 -->
  <rect x="190" y="248" width="180" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="270" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">cnt[26] = 0（每个 l 重置）</text>
  <path d="M 280 282 L 280 300" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Inner loop decision: r < n ? -->
  <polygon points="280,302 370,338 280,374 190,338" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="334" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">r &lt; n ?</text>
  <text x="280" y="350" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">（内层右端点）</text>

  <!-- No branch -> l++ loop back -->
  <path d="M 370 338 L 412 338 L 412 190 L 370 190" stroke="#666" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="418" y="266" font-size="11" fill="#888" filter="url(#rough2)">l++</text>
  <text x="418" y="280" font-size="11" fill="#888" filter="url(#rough2)">回到</text>
  <text x="418" y="294" font-size="11" fill="#888" filter="url(#rough2)">外层</text>

  <!-- Yes branch down -->
  <path d="M 280 374 L 280 392" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="388" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- body: cnt[s[r]]++, mx, mn, ans += mx-mn -->
  <rect x="80" y="394" width="400" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="412" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">cnt[s[r]]++ ；mx = max(cnt)；mn = min(cnt[k] &gt; 0)</text>
  <text x="280" y="430" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans += <tspan fill="#b85450" font-weight="bold">mx − mn</tspan></text>

  <!-- loop back inner -->
  <path d="M 80 416 L 50 416 L 50 338 L 190 338" stroke="#666" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="36" y="380" font-size="11" fill="#888" filter="url(#rough2)">r++</text>

  <!-- footer note -->
  <text x="40" y="454" font-size="11" fill="#555" filter="url(#rough2)">💡 复杂度 O(n²·Σ)，Σ=26；n≤500 时约 6.5×10⁶ 次操作，轻松通过</text>
</svg>
