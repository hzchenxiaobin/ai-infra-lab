<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#778899"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：逐行拼出 L 形走廊</text>
  <text x="260" y="38" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">两类行——第一行全是 '.'，其余行都是 (n−1) 个 '#' 加末列一个 '.'</text>

  <!-- 开始 -->
  <rect x="40" y="52" width="160" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="71" text-anchor="middle" font-size="11" fill="#33507a" filter="url(#rough2)">开始：读入 m, n</text>
  <path d="M 120 82 L 120 96" fill="none" stroke="#778899" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 第一行 -->
  <rect x="30" y="98" width="180" height="44" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="116" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">grid ← 一行 n 个 '.'</text>
  <text x="120" y="132" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">（第一行：右行通道）</text>
  <path d="M 120 142 L 120 154" fill="none" stroke="#778899" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="120,156 190,184 120,212 50,184" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="181" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">已生成行数</text>
  <text x="120" y="196" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">&lt; m ？</text>

  <!-- 是：向下追加一行 -->
  <path d="M 120 212 L 120 230" fill="none" stroke="#778899" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="128" y="226" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="30" y="232" width="180" height="48" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="250" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">追加一行：</text>
  <text x="120" y="266" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">'#'×(n−1) + '.'</text>
  <text x="120" y="277" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">（末列：下行通道）</text>

  <!-- 循环回边：左绕回菱形 -->
  <path d="M 30 256 L 16 256 L 16 184 L 46 184" fill="none" stroke="#778899" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="24" y="222" font-size="9" fill="#999" filter="url(#rough2)">循环</text>

  <!-- 否：返回 -->
  <path d="M 190 184 L 244 184 L 244 316 L 296 316" fill="none" stroke="#778899" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="200" y="176" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="40" y="298" width="256" height="36" rx="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="168" y="321" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 grid —— L 形走廊，恰好一条路径 ✓</text>

  <!-- 右侧要点面板 -->
  <rect x="322" y="52" width="184" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="414" y="72" text-anchor="middle" font-size="10.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">m = 1 无需特判</text>
  <text x="414" y="88" text-anchor="middle" font-size="9.5" fill="#444" filter="url(#rough2)">循环执行 0 次</text>
  <text x="414" y="104" text-anchor="middle" font-size="9.5" fill="#444" filter="url(#rough2)">只剩第一行，一路向右</text>

  <rect x="322" y="126" width="184" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="414" y="146" text-anchor="middle" font-size="10.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">n = 1 无需特判</text>
  <text x="414" y="162" text-anchor="middle" font-size="9.5" fill="#444" filter="url(#rough2)">'#'×0 + '.' = "."</text>
  <text x="414" y="178" text-anchor="middle" font-size="9.5" fill="#444" filter="url(#rough2)">每行一个 '.'，一路向下</text>

  <rect x="322" y="200" width="184" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="414" y="220" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">正确性</text>
  <text x="414" y="236" text-anchor="middle" font-size="9.5" fill="#444" filter="url(#rough2)">「每步被迫」论证：</text>
  <text x="414" y="252" text-anchor="middle" font-size="9.5" fill="#444" filter="url(#rough2)">走廊上不存在分岔点</text>

  <rect x="322" y="274" width="184" height="60" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="414" y="293" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">复杂度</text>
  <text x="414" y="309" text-anchor="middle" font-size="9.5" fill="#444" filter="url(#rough2)">时间 O(m·n)</text>
  <text x="414" y="325" text-anchor="middle" font-size="9.5" fill="#444" filter="url(#rough2)">额外空间 O(1)（不计输出）</text>
</svg>
