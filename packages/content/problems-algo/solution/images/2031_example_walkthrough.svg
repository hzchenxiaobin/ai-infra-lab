<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：nums = [0,1,1,0,1]</text>
  <text x="280" y="40" text-anchor="middle" font-size="10.5" fill="#888">逐步维护前缀和 s，查询树状数组中 &lt; s 的个数</text>

  <!-- prefix sum context row -->
  <text x="30" y="64" font-size="10.5" fill="#666" font-weight="bold">前缀和</text>
  <rect x="86" y="50" width="38" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="105" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <rect x="126" y="50" width="38" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="145" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">−1</text>
  <rect x="166" y="50" width="38" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="185" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <rect x="206" y="50" width="38" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="225" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="246" y="50" width="38" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="265" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <rect x="286" y="50" width="38" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="305" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="335" y="68" font-size="9.5" fill="#aaa">pref[0..5]</text>

  <!-- Table -->
  <!-- header -->
  <rect x="30" y="98" width="505" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <line x1="100" y1="98" x2="100" y2="136" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="155" y1="98" x2="155" y2="136" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="215" y1="98" x2="215" y2="136" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="295" y1="98" x2="295" y2="136" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="355" y1="98" x2="355" y2="136" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="122" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">步骤</text>
  <text x="127" y="122" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">num</text>
  <text x="185" y="122" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">s</text>
  <text x="255" y="122" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">query(&lt;s)</text>
  <text x="325" y="122" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">ans</text>
  <text x="445" y="122" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">已插入前缀和</text>

  <!-- row init -->
  <rect x="30" y="136" width="505" height="38" fill="#f7f7f7" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="100" y1="136" x2="100" y2="174" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="155" y1="136" x2="155" y2="174" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="215" y1="136" x2="215" y2="174" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="295" y1="136" x2="295" y2="174" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="355" y1="136" x2="355" y2="174" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="160" text-anchor="middle" font-size="10.5" fill="#666">初始</text>
  <text x="127" y="160" text-anchor="middle" font-size="10.5" fill="#888">—</text>
  <text x="185" y="160" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <text x="255" y="160" text-anchor="middle" font-size="10.5" fill="#888">—</text>
  <text x="325" y="160" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <text x="445" y="160" text-anchor="middle" font-size="10.5" fill="#555">{0}</text>

  <!-- row 1: num=0 -->
  <rect x="30" y="174" width="505" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="100" y1="174" x2="100" y2="212" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="155" y1="174" x2="155" y2="212" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="215" y1="174" x2="215" y2="212" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="295" y1="174" x2="295" y2="212" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="355" y1="174" x2="355" y2="212" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="198" text-anchor="middle" font-size="10.5" fill="#666">①</text>
  <rect x="112" y="184" width="30" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="127" y="200" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">0</text>
  <text x="185" y="200" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−1</text>
  <text x="255" y="200" text-anchor="middle" font-size="10.5" fill="#555">0</text>
  <text x="325" y="200" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <text x="445" y="200" text-anchor="middle" font-size="10.5" fill="#555">{0, −1}</text>

  <!-- row 2: num=1 -->
  <rect x="30" y="212" width="505" height="38" fill="#f7f7f7" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="100" y1="212" x2="100" y2="250" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="155" y1="212" x2="155" y2="250" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="215" y1="212" x2="215" y2="250" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="295" y1="212" x2="295" y2="250" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="355" y1="212" x2="355" y2="250" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="236" text-anchor="middle" font-size="10.5" fill="#666">②</text>
  <rect x="112" y="222" width="30" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="127" y="238" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">1</text>
  <text x="185" y="238" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">0</text>
  <text x="255" y="238" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="325" y="238" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="445" y="238" text-anchor="middle" font-size="10.5" fill="#555">{0, 0, −1}</text>

  <!-- row 3: num=1 -->
  <rect x="30" y="250" width="505" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="100" y1="250" x2="100" y2="288" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="155" y1="250" x2="155" y2="288" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="215" y1="250" x2="215" y2="288" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="295" y1="250" x2="295" y2="288" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="355" y1="250" x2="355" y2="288" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="274" text-anchor="middle" font-size="10.5" fill="#666">③</text>
  <rect x="112" y="260" width="30" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="127" y="276" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">1</text>
  <text x="185" y="276" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="255" y="276" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="325" y="276" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="445" y="276" text-anchor="middle" font-size="10.5" fill="#555">{0,0,−1,1}</text>

  <!-- row 4: num=0 -->
  <rect x="30" y="288" width="505" height="38" fill="#f7f7f7" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="100" y1="288" x2="100" y2="326" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="155" y1="288" x2="155" y2="326" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="215" y1="288" x2="215" y2="326" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="295" y1="288" x2="295" y2="326" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="355" y1="288" x2="355" y2="326" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="312" text-anchor="middle" font-size="10.5" fill="#666">④</text>
  <rect x="112" y="298" width="30" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="127" y="314" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">0</text>
  <text x="185" y="314" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">0</text>
  <text x="255" y="314" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="325" y="314" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="445" y="314" text-anchor="middle" font-size="10.5" fill="#555">{0,0,0,−1,1}</text>

  <!-- row 5: num=1 (final) -->
  <rect x="30" y="326" width="505" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="100" y1="326" x2="100" y2="364" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <line x1="155" y1="326" x2="155" y2="364" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <line x1="215" y1="326" x2="215" y2="364" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <line x1="295" y1="326" x2="295" y2="364" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <line x1="355" y1="326" x2="355" y2="364" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="350" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">⑤</text>
  <rect x="112" y="336" width="30" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="127" y="352" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">1</text>
  <text x="185" y="352" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="255" y="352" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="325" y="352" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">9</text>
  <text x="445" y="352" text-anchor="middle" font-size="10.5" fill="#555">{0,0,0,−1,1,1}</text>

  <!-- footer note -->
  <text x="280" y="392" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">最终 ans = 9 ✓（与示例一致）</text>
  <text x="280" y="410" text-anchor="middle" font-size="10" fill="#888">query(&lt;s) 即「之前出现且严格小于 s 的前缀和个数」= 以本位结尾的合法子数组数</text>
  <text x="280" y="426" text-anchor="middle" font-size="10" fill="#aaa">每步把当前 s 插入树状数组，供后续位置查询</text>
</svg>
