<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：除尽 2/3/5，看剩下来的「余数」</text>
  <text x="260" y="44" text-anchor="middle" font-size="10" fill="#888">丑数 = 质因数只有 2、3、5 的正整数（1 视为丑数）</text>

  <!-- ===== input n ===== -->
  <text x="50" y="92" font-size="10" fill="#888">输入</text>
  <rect x="62" y="76" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="97" y="98" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">n</text>

  <path d="M 134 93 L 168 93" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== three division steps ===== -->
  <text x="180" y="64" font-size="10" fill="#888">不断除尽</text>

  <rect x="170" y="76" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="202" y="98" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">÷ 2</text>

  <path d="M 236 93 L 268 93" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="270" y="76" width="64" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="302" y="98" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">÷ 3</text>

  <path d="M 336 93 L 368 93" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="370" y="76" width="64" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="402" y="98" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">÷ 5</text>

  <text x="202" y="128" text-anchor="middle" font-size="9" fill="#888">n%2==0 就除</text>
  <text x="302" y="128" text-anchor="middle" font-size="9" fill="#888">n%3==0 就除</text>
  <text x="402" y="128" text-anchor="middle" font-size="9" fill="#888">n%5==0 就除</text>

  <!-- ===== arrow down to residue ===== -->
  <path d="M 402 112 L 402 142 L 260 142 L 260 168" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== residue box ===== -->
  <rect x="180" y="172" width="160" height="38" fill="#f6f6f6" stroke="#bbb" stroke-width="1.5" stroke-dasharray="4,3" rx="8" filter="url(#rough2)"/>
  <text x="260" y="190" text-anchor="middle" font-size="11" fill="#666">剩下的「余数」</text>
  <text x="260" y="204" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">residue = n（已剥光 2/3/5）</text>

  <!-- ===== two branches ===== -->
  <path d="M 200 210 L 130 240" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 320 210 L 390 240" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <text x="150" y="222" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">= 1</text>
  <text x="370" y="222" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">&gt; 1</text>

  <!-- ugly result -->
  <rect x="60" y="244" width="160" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="140" y="263" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">丑数 ✓</text>
  <text x="140" y="280" text-anchor="middle" font-size="10" fill="#4a7a3a">质因数只有 2/3/5</text>

  <!-- not ugly result -->
  <rect x="300" y="244" width="160" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="380" y="263" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">非丑数 ✗</text>
  <text x="380" y="280" text-anchor="middle" font-size="10" fill="#b85450">还有其他质因子（如 7/11）</text>

  <!-- ===== bottom note ===== -->
  <rect x="60" y="306" width="400" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="260" y="324" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">关键：剥到剥不动为止 → 看最后剩下的是不是 1</text>
  <text x="260" y="346" text-anchor="middle" font-size="9" fill="#888">n ≤ 0 直接 false（丑数定义在正整数范围）</text>
</svg>
