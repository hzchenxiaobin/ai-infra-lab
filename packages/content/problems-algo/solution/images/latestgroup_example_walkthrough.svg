<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：arr = [3,5,1,2,4], m = 1</text>
  <text x="280" y="40" text-anchor="middle" font-size="11" fill="#888">每步置 1 后检查 cnt[1]，最后有效的步为答案</text>

  <!-- ===== Table header ===== -->
  <rect x="16" y="50" width="528" height="24" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="40" y="66" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">步</text>
  <text x="80" y="66" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">arr[i]</text>
  <text x="210" y="66" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">二进制串（位置 1−5）</text>
  <text x="380" y="66" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">由 1 组成的组</text>
  <text x="470" y="66" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">cnt[1]</text>
  <text x="520" y="66" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">有效?</text>

  <!-- ===== Row 1: Step 1, arr[1]=3, "00100" ===== -->
  <rect x="16" y="76" width="528" height="44" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="40" y="102" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="80" y="102" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3</text>
  <!-- 5 boxes: pos 1=0, 2=0, 3=1(new), 4=0, 5=0 -->
  <rect x="130" y="84" width="32" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="146" y="103" text-anchor="middle" font-size="12" fill="#999">0</text>
  <rect x="164" y="84" width="32" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="180" y="103" text-anchor="middle" font-size="12" fill="#999">0</text>
  <rect x="198" y="84" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="214" y="103" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <rect x="232" y="84" width="32" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="248" y="103" text-anchor="middle" font-size="12" fill="#999">0</text>
  <rect x="266" y="84" width="32" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="282" y="103" text-anchor="middle" font-size="12" fill="#999">0</text>
  <text x="380" y="102" text-anchor="middle" font-size="11" fill="#4a7a3a">["1"]</text>
  <text x="470" y="102" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="520" y="102" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- ===== Row 2: Step 2, arr[2]=5, "00101" ===== -->
  <rect x="16" y="122" width="528" height="44" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="40" y="148" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="80" y="148" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">5</text>
  <rect x="130" y="130" width="32" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="146" y="149" text-anchor="middle" font-size="12" fill="#999">0</text>
  <rect x="164" y="130" width="32" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="180" y="149" text-anchor="middle" font-size="12" fill="#999">0</text>
  <rect x="198" y="130" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="214" y="149" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="232" y="130" width="32" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="248" y="149" text-anchor="middle" font-size="12" fill="#999">0</text>
  <rect x="266" y="130" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="282" y="149" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <text x="380" y="148" text-anchor="middle" font-size="11" fill="#4a7a3a">["1", "1"]</text>
  <text x="470" y="148" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="520" y="148" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- ===== Row 3: Step 3, arr[3]=1, "10101" ===== -->
  <rect x="16" y="168" width="528" height="44" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="40" y="194" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="80" y="194" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <rect x="130" y="176" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="146" y="195" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <rect x="164" y="176" width="32" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="180" y="195" text-anchor="middle" font-size="12" fill="#999">0</text>
  <rect x="198" y="176" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="214" y="195" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="232" y="176" width="32" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="248" y="195" text-anchor="middle" font-size="12" fill="#999">0</text>
  <rect x="266" y="176" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="282" y="195" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="380" y="194" text-anchor="middle" font-size="11" fill="#4a7a3a">["1","1","1"]</text>
  <text x="470" y="194" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="520" y="194" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- ===== Row 4: Step 4, arr[4]=2, "11101" (HIGHLIGHT - last valid) ===== -->
  <rect x="16" y="214" width="528" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="40" y="240" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">4</text>
  <text x="80" y="240" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>
  <rect x="130" y="222" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="146" y="241" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="164" y="222" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="180" y="241" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <rect x="198" y="222" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="214" y="241" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="232" y="222" width="32" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="248" y="241" text-anchor="middle" font-size="12" fill="#999">0</text>
  <rect x="266" y="222" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="282" y="241" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="380" y="240" text-anchor="middle" font-size="11" fill="#4a7a3a">["111", "1"]</text>
  <text x="470" y="240" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="520" y="240" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">✓←</text>

  <!-- ===== Row 5: Step 5, arr[5]=4, "11111" (no valid) ===== -->
  <rect x="16" y="260" width="528" height="44" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="40" y="286" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="80" y="286" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">4</text>
  <rect x="130" y="268" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="146" y="287" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="164" y="268" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="180" y="287" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="198" y="268" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="214" y="287" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="232" y="268" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="248" y="287" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <rect x="266" y="268" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="282" y="287" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="380" y="286" text-anchor="middle" font-size="11" fill="#b85450">["11111"]</text>
  <text x="470" y="286" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>
  <text x="520" y="286" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>

  <!-- ===== Legend ===== -->
  <text x="30" y="330" font-size="11" fill="#888">图例：</text>
  <rect x="70" y="320" width="20" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="96" y="332" font-size="10" fill="#d6a040">本步新置 1</text>
  <rect x="180" y="320" width="20" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="206" y="332" font-size="10" fill="#4a7a3a">已有的 1</text>
  <rect x="290" y="320" width="20" height="16" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="316" y="332" font-size="10" fill="#999">0</text>

  <!-- ===== Explanation for step 4 ===== -->
  <rect x="40" y="350" width="480" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="368" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">步骤 4 关键：p=2 置 1，左段(len=1)与右段(len=1)合并为 len=3</text>
  <text x="280" y="384" text-anchor="middle" font-size="11" fill="#666">cnt[1] 从 3 降到 1（两个旧段消失，一个新段 len=3 出现），cnt[1] 仍 &gt; 0 → 有效</text>

  <!-- ===== Result box ===== -->
  <rect x="120" y="406" width="320" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="431" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">答案 = 4（步骤 4 是最后有效步）</text>
</svg>
