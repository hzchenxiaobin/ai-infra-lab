<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">首尾不动 → 公差可算 → 定位缺失项</text>

  <!-- ===== Full progression row (n+1 = 5 terms) ===== -->
  <text x="60" y="62" font-size="11" fill="#888">完整数列（n+1 = 5 项）</text>

  <!-- box: 5 -->
  <rect x="60" y="72" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="88" y="98" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">5</text>
  <!-- box: 7 -->
  <rect x="120" y="72" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="148" y="98" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">7</text>
  <!-- box: 9 (MISSING) -->
  <rect x="180" y="72" width="56" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" stroke-dasharray="5,3" rx="4" filter="url(#rough2)"/>
  <text x="208" y="98" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">?</text>
  <!-- box: 11 -->
  <rect x="240" y="72" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="268" y="98" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">11</text>
  <!-- box: 13 -->
  <rect x="300" y="72" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="328" y="98" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">13</text>

  <!-- interval ticks (n=4 intervals) -->
  <path d="M 88 118 L 88 128" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 88 128 L 328 128" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 328 118 L 328 128" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="208" y="142" text-anchor="middle" font-size="11" fill="#4a7a3a">跨度 = 末 − 首 = n·d（共 n=4 个间隔）</text>

  <!-- ===== arr row (n = 4 terms) ===== -->
  <text x="60" y="172" font-size="11" fill="#888">arr（删后，n = 4 项）</text>

  <rect x="60" y="182" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="88" y="208" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">5</text>
  <rect x="120" y="182" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="148" y="208" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">7</text>
  <rect x="180" y="182" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="208" y="208" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">11</text>
  <rect x="240" y="182" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="268" y="208" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">13</text>

  <!-- first / last unchanged markers -->
  <path d="M 88 222 L 88 232" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="88" y="244" text-anchor="middle" font-size="10" fill="#d6a040">首项不变</text>
  <path d="M 268 222 L 268 232" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="268" y="244" text-anchor="middle" font-size="10" fill="#d6a040">末项不变</text>

  <!-- ===== Formula box ===== -->
  <rect x="350" y="72" width="150" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="425" y="92" text-anchor="middle" font-size="11" fill="#888">公差</text>
  <text x="425" y="112" text-anchor="middle" font-size="12" fill="#333">d = (末 − 首) / n</text>
  <text x="425" y="132" text-anchor="middle" font-size="12" fill="#333">= (13 − 5) / 4</text>
  <text x="425" y="152" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">= 2</text>

  <!-- arrow from formula to missing box -->
  <path d="M 350 118 Q 320 90 236 92" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="4,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="300" y="78" font-size="10" fill="#b85450">还原缺失</text>

  <!-- ===== Summary ===== -->
  <rect x="40" y="270" width="440" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="292" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">完整数列 n+1 项、删后 n 项，间隔数始终是 n</text>
  <text x="260" y="312" text-anchor="middle" font-size="11" fill="#666">首末未删 → 跨度 = n·d → d = (末 − 首) / n（除以 n，不是 n−1）</text>
  <text x="260" y="330" text-anchor="middle" font-size="11" fill="#888">逐位比对，首个错位的期望值即被删元素</text>
</svg>
