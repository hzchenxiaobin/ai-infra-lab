<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：六步操作下区间集合的演化</text>

  <line x1="200" y1="48" x2="440" y2="48" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="200" y1="44" x2="200" y2="52" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="260" y1="44" x2="260" y2="52" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="320" y1="44" x2="320" y2="52" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="380" y1="44" x2="380" y2="52" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="440" y1="44" x2="440" y2="52" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="200" y="64" text-anchor="middle" font-size="9.5" fill="#888">10</text>
  <text x="260" y="64" text-anchor="middle" font-size="9.5" fill="#888">15</text>
  <text x="320" y="64" text-anchor="middle" font-size="9.5" fill="#888">20</text>
  <text x="380" y="64" text-anchor="middle" font-size="9.5" fill="#888">25</text>
  <text x="440" y="64" text-anchor="middle" font-size="9.5" fill="#888">30</text>

  <text x="30" y="88" font-size="10.5" fill="#333" font-weight="bold">① addRange(10,20)</text>
  <rect x="200" y="78" width="120" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" rx="3" filter="url(#rough2)"/>
  <rect x="200" y="94" width="120" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="485" y="104" font-size="10.5" fill="#888">—</text>

  <text x="30" y="130" font-size="10.5" fill="#333" font-weight="bold">② addRange(15,25)</text>
  <rect x="200" y="120" width="120" height="10" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="260" y="120" width="120" height="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" rx="3" filter="url(#rough2)"/>
  <rect x="200" y="134" width="180" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="290" y="145" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">合并 → [10,25)</text>
  <text x="485" y="144" font-size="10.5" fill="#888">—</text>

  <text x="30" y="178" font-size="10.5" fill="#333" font-weight="bold">③ queryRange(10,15)</text>
  <rect x="200" y="172" width="180" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="200" y="160" width="60" height="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="4 3" rx="3" filter="url(#rough2)"/>
  <text x="485" y="182" font-size="10.5" fill="#4a7a3a" font-weight="bold">true</text>

  <text x="30" y="216" font-size="10.5" fill="#333" font-weight="bold">④ addRange(28,30)</text>
  <rect x="200" y="210" width="180" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="416" y="210" width="24" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="416" y="198" width="24" height="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" rx="3" filter="url(#rough2)"/>
  <text x="485" y="220" font-size="10.5" fill="#888">—</text>

  <text x="30" y="258" font-size="10.5" fill="#333" font-weight="bold">⑤ removeRange(18,22)</text>
  <rect x="200" y="252" width="96" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="344" y="252" width="36" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="416" y="252" width="24" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="296" y="240" width="48" height="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" rx="3" filter="url(#rough2)"/>
  <text x="320" y="247" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">移除</text>
  <text x="485" y="262" font-size="10.5" fill="#888">—</text>

  <text x="30" y="300" font-size="10.5" fill="#333" font-weight="bold">⑥ queryRange(10,20)</text>
  <rect x="200" y="294" width="96" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="344" y="294" width="36" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="416" y="294" width="24" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="200" y="282" width="120" height="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="4 3" rx="3" filter="url(#rough2)"/>
  <text x="260" y="289" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">查询</text>
  <text x="485" y="304" font-size="10.5" fill="#b85450" font-weight="bold">false</text>

  <rect x="36" y="330" width="488" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="352" font-size="12" fill="#4a7a3a" font-weight="bold">关键观察</text>
  <text x="56" y="372" font-size="11" fill="#555">• ②合并相邻：[10,20)∪[15,25) 无缝 → [10,25)，段数减 1，保持「不相交」不变量</text>
  <text x="56" y="390" font-size="11" fill="#555">• ⑤切分：[10,25) 移除中段 [18,22) → 左截 [10,18) + 右截 [22,25)，间隙保持</text>
  <text x="56" y="404" font-size="11" fill="#b85450" font-weight="bold">• ⑥ prev(20)=[10,18)，18 &lt; 20 → [18,20) 未覆盖 → false（一步判定）</text>
</svg>
