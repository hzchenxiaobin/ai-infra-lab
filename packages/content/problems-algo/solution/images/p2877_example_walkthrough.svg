<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：4 行逐行映射 + 两种错误形态</text>

  <!-- Input rows -->
  <text x="90" y="66" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">输入（按行）</text>
  <rect x="45" y="76" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="94" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1, 15]</text>
  <rect x="45" y="106" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="124" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[2, 11]</text>
  <rect x="45" y="136" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="154" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[3, 11]</text>
  <rect x="45" y="166" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="184" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[4, 20]</text>

  <!-- mapping arrows -->
  <path d="M 140 89 L 250 89" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 140 119 L 250 119" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 140 149 L 250 149" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 140 179 L 250 179" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Output table -->
  <text x="365" y="66" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">输出（DataFrame）</text>
  <rect x="255" y="76" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="272" y="94" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)"></text>
  <rect x="291" y="76" width="84" height="26" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="333" y="94" text-anchor="middle" font-size="11" fill="#ffffff" filter="url(#rough2)">student_id</text>
  <rect x="377" y="76" width="56" height="26" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="405" y="94" text-anchor="middle" font-size="11" fill="#ffffff" filter="url(#rough2)">age</text>

  <rect x="255" y="104" width="34" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="272" y="120" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <rect x="291" y="104" width="84" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="333" y="120" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="377" y="104" width="56" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="405" y="120" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">15</text>

  <rect x="255" y="130" width="34" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="272" y="146" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <rect x="291" y="130" width="84" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="333" y="146" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="377" y="130" width="56" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="405" y="146" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">11</text>

  <rect x="255" y="156" width="34" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="272" y="172" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>
  <rect x="291" y="156" width="84" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="333" y="172" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="377" y="156" width="56" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="405" y="172" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">11</text>

  <rect x="255" y="182" width="34" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="272" y="198" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>
  <rect x="291" y="182" width="84" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="333" y="198" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="377" y="182" width="56" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="405" y="198" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">20</text>

  <text x="195" y="210" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">第 i 行输入 → 第 i 行输出，位置 0→列1，位置 1→列2</text>

  <!-- Error 1: missing columns -->
  <rect x="40" y="248" width="235" height="140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="157" y="272" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">错误形态 ①：漏传 columns</text>
  <rect x="62" y="286" width="34" height="22" fill="#ffffff" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="98" y="286" width="44" height="22" fill="#d6a040" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="120" y="302" text-anchor="middle" font-size="11" fill="#ffffff" filter="url(#rough2)">0</text>
  <rect x="144" y="286" width="44" height="22" fill="#d6a040" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="166" y="302" text-anchor="middle" font-size="11" fill="#ffffff" filter="url(#rough2)">1</text>
  <text x="157" y="330" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">pd.DataFrame(student_data)</text>
  <text x="157" y="348" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">列名 = 默认整数 0、1</text>
  <text x="157" y="366" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">数据全对，列名全错 ✗</text>

  <!-- Error 2: too many columns -->
  <rect x="285" y="248" width="235" height="140" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="402" y="272" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">错误形态 ②：columns 传 3 个名</text>
  <rect x="307" y="286" width="44" height="22" fill="#b85450" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="329" y="302" text-anchor="middle" font-size="9" fill="#ffffff" filter="url(#rough2)">id</text>
  <rect x="353" y="286" width="44" height="22" fill="#b85450" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="375" y="302" text-anchor="middle" font-size="9" fill="#ffffff" filter="url(#rough2)">age</text>
  <rect x="399" y="286" width="52" height="22" fill="#ffffff" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="425" y="302" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">NaN</text>
  <text x="402" y="330" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">columns=['id','age','gpa']</text>
  <text x="402" y="348" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">多出的列名 → 补全 NaN 空列</text>
  <text x="402" y="366" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">不报错，取数时才露馅 ✗</text>
</svg>
