<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">双约束解耦：left 管辅音（下界），lastAll 管元音（上界）</text>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">word = "ieaouqqieaouqq"，K = 1，快照：right = 11（'u' 刚入窗）</text>

  <!-- L / R / lastAll 标记 -->
  <text x="67" y="62" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">L</text>
  <path d="M 67 56 L 67 68" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="262" y="56" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">lastAll</text>
  <path d="M 262 62 L 262 74" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="392" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">R</text>
  <path d="M 392 56 L 392 68" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 字符格子：14 个，宽 30 间隔 2.5，从 x=20 起 -->
  <rect x="20" y="76" width="30" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="52.5" y="76" width="30" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="85" y="76" width="30" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="117.5" y="76" width="30" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="150" y="76" width="30" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="182.5" y="76" width="30" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="215" y="76" width="30" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="247.5" y="76" width="30" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="280" y="76" width="30" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="312.5" y="76" width="30" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="345" y="76" width="30" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="377.5" y="76" width="30" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="410" y="76" width="30" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="442.5" y="76" width="30" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="35" y="98" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">i</text>
  <text x="67.5" y="98" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">e</text>
  <text x="100" y="98" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">a</text>
  <text x="132.5" y="98" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">o</text>
  <text x="165" y="98" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">u</text>
  <text x="197.5" y="98" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">q</text>
  <text x="230" y="98" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">q</text>
  <text x="262.5" y="98" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="295" y="98" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">e</text>
  <text x="327.5" y="98" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">a</text>
  <text x="360" y="98" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">o</text>
  <text x="392.5" y="98" text-anchor="middle" font-size="12" fill="#a07830" font-weight="bold" filter="url(#rough2)">u</text>
  <text x="425" y="98" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">q</text>
  <text x="457.5" y="98" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">q</text>
  <text x="35" y="124" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="67.5" y="124" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="100" y="124" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="132.5" y="124" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="165" y="124" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="197.5" y="124" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">5</text>
  <text x="230" y="124" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">6</text>
  <text x="262.5" y="124" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="295" y="124" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">8</text>
  <text x="327.5" y="124" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">9</text>
  <text x="360" y="124" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">10</text>
  <text x="392.5" y="124" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">11</text>
  <text x="425" y="124" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">12</text>
  <text x="457.5" y="124" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">13</text>

  <!-- 左右两条注释 -->
  <rect x="22" y="142" width="232" height="72" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="138" y="162" text-anchor="middle" font-size="11" fill="#8f3a35" font-weight="bold" filter="url(#rough2)">约束① 辅音 ≤ K（至多型）</text>
  <text x="138" y="179" text-anchor="middle" font-size="10" fill="#8f3a35" filter="url(#rough2)">窗口越长越易违反 → while 收缩 left</text>
  <text x="138" y="195" text-anchor="middle" font-size="10" fill="#8f3a35" filter="url(#rough2)">只由辅音计数驱动，收缩到刚好 ≤ K</text>
  <text x="138" y="209" text-anchor="middle" font-size="10" fill="#8f3a35" filter="url(#rough2)">→ 合法起点下界 left = 6</text>

  <rect x="266" y="142" width="232" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="382" y="162" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">约束② 五元音齐（至少型）</text>
  <text x="382" y="179" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">窗口越长越易满足 → 不收缩！</text>
  <text x="382" y="195" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">lastAll = min(i@7, e@8, a@9, o@10, u@11) = 7</text>
  <text x="382" y="209" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">→ 合法起点上界 s ≤ 7</text>

  <!-- 交集区间 -->
  <text x="260" y="240" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">两个约束独立维护、互不干扰 → 取交集得合法起点区间</text>
  <path d="M 67 254 L 262 254" fill="none" stroke="#4a7a3a" stroke-width="2" marker-start="url(#arrg)" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="164" y="272" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">[left, lastAll] = [6, 7]</text>
  <text x="164" y="288" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">贡献 = lastAll − left + 1 = 2</text>
  <text x="164" y="304" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">即「qieaou」与「ieaou」两个子串</text>

  <!-- 底部要点 -->
  <rect x="34" y="318" width="452" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="338" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">妙处：vowelLast 记的是「绝对位置」，与 left 无关 → 收缩时不需要回退</text>
  <text x="260" y="356" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">[s, right] 含元音 v ⟺ s ≤ last[v] —— 元音约束天然折叠成一个阈值，O(1) 判定</text>

  <text x="260" y="388" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">对比 3298 的 less 欠账数：那边把「覆盖性」压成一个计数，这边压成一个位置阈值</text>
</svg>
