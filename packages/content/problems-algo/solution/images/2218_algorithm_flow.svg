<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：前缀和预处理 → 分组背包滚动 DP</text>

  <!-- Step 1: prefix sums -->
  <rect x="60" y="46" width="440" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="70" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 预处理每个栈的前缀和</text>
  <text x="280" y="90" text-anchor="middle" font-size="11" fill="#555">prefix[i][j] = 栈 i 顶部 j 个硬币面值之和（j = 0..len_i）</text>
  <text x="280" y="106" text-anchor="middle" font-size="11" fill="#555">prefix[i][0] = 0（取 0 个）</text>

  <!-- arrow down -->
  <path d="M 280 120 L 280 138" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: init dp -->
  <rect x="60" y="142" width="440" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="166" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 初始化 dp[0..k] = −∞，dp[0] = 0</text>
  <text x="280" y="182" text-anchor="middle" font-size="10" fill="#888">−∞ 表示「恰好 t 次」不可达；dp[0]=0 为合法起点</text>

  <!-- arrow down -->
  <path d="M 280 192 L 280 210" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: outer loop over piles -->
  <rect x="60" y="214" width="440" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="239" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ 遍历每个栈 i = 0 .. n−1</text>

  <!-- arrow down -->
  <path d="M 280 258 L 280 276" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: inner loop t descending -->
  <rect x="60" y="280" width="440" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="305" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">④ t 从 k 到 0 倒序遍历（滚动数组防同组重复取）</text>

  <!-- arrow down -->
  <path d="M 280 324 L 280 342" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: transition -->
  <rect x="40" y="346" width="480" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="370" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">⑤ 状态转移：枚举从栈 i 取 j 个</text>
  <text x="280" y="392" text-anchor="middle" font-size="11" fill="#555">dp[t] = max(dp[t], dp[t − j] + prefix[i][j])</text>
  <text x="280" y="410" text-anchor="middle" font-size="10" fill="#888">j = 0 .. min(t, len_i)，dp[t−j] 须 ≥ 0（可达）</text>

  <!-- arrow down to result -->
  <path d="M 280 430 L 280 448" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- final result -->
  <rect x="60" y="452" width="440" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="468" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 dp[k]</text>
</svg>
