<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#2d5a1e"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1,2,3,−1,2]，k = 3（c₁=+3，c₂=−2，c₃=+1），每格 (外 / 内)</text>

  <!-- header -->
  <rect x="30" y="44" width="500" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="47" y="61" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="68" y="61" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">x</text>
  <text x="174" y="61" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">j = 1（×3）</text>
  <text x="314" y="61" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">j = 2（×−2）</text>
  <text x="457" y="61" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">j = 3（×1）</text>

  <!-- row i=0 -->
  <rect x="30" y="70" width="500" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="47" y="90" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="68" y="90" font-size="11" fill="#888" filter="url(#rough2)">—</text>
  <text x="174" y="90" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">−∞ / −∞</text>
  <text x="314" y="90" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">−∞ / −∞</text>
  <text x="457" y="90" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">−∞ / −∞</text>

  <!-- row i=1, path cell j=1 -->
  <rect x="30" y="100" width="500" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="104" y="100" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="47" y="120" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="68" y="120" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="174" y="120" text-anchor="middle" font-size="11" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">−∞ / 3 ★</text>
  <text x="314" y="120" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">−∞ / −∞</text>
  <text x="457" y="120" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">−∞ / −∞</text>

  <!-- row i=2, path cell j=1 -->
  <rect x="30" y="130" width="500" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="104" y="130" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="47" y="150" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="68" y="150" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="174" y="150" text-anchor="middle" font-size="11" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">3 / 9 ★</text>
  <text x="314" y="150" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">−∞ / −1</text>
  <text x="457" y="150" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">−∞ / −∞</text>

  <!-- row i=3, path cell j=1 -->
  <rect x="30" y="160" width="500" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="104" y="160" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="47" y="180" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="68" y="180" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="174" y="180" text-anchor="middle" font-size="11" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">9 / 18 ★</text>
  <text x="314" y="180" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">−1 / 3</text>
  <text x="457" y="180" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">−∞ / 2</text>

  <!-- row i=4, path cell j=2 -->
  <rect x="30" y="190" width="500" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="244" y="190" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="47" y="210" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="68" y="210" font-size="11" fill="#333" filter="url(#rough2)">−1</text>
  <text x="174" y="210" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">18 / 15</text>
  <text x="314" y="210" text-anchor="middle" font-size="11" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">3 / 20 ★</text>
  <text x="457" y="210" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2 / 2</text>

  <!-- row i=5, path cell j=3 -->
  <rect x="30" y="220" width="500" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="384" y="220" width="146" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="47" y="240" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="68" y="240" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="174" y="240" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">18 / 21</text>
  <text x="314" y="240" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">20 / 16</text>
  <text x="457" y="240" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">2 / 22 ★</text>

  <!-- path arrows -->
  <path d="M 174 87 L 174 97" stroke="#2d5a1e" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 174 117 L 174 127" stroke="#2d5a1e" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 174 147 C 220 158, 268 168, 308 174" stroke="#2d5a1e" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 324 177 C 372 188, 420 198, 451 204" stroke="#2d5a1e" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- answer -->
  <text x="280" y="268" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案 = max(dp[5][3][外], dp[5][3][内]) = max(2, 22) = 22 ✓</text>

  <!-- green annotation -->
  <rect x="30" y="282" width="500" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="302" text-anchor="middle" font-size="10.5" fill="#2d5a1e" filter="url(#rough2)">💡 最优路径（绿格 ★）：段1 [1,2,3]×3（18）→ 新开段2 [−1]×(−2)（18+2=20）</text>
  <text x="280" y="320" text-anchor="middle" font-size="10.5" fill="#2d5a1e" filter="url(#rough2)">→ 新开段3 [2]×1（20+2=22）。dp[5][3][内] 由 dp[4][2][内]=20 新开第 3 段而来，</text>
  <text x="280" y="338" text-anchor="middle" font-size="10.5" fill="#2d5a1e" filter="url(#rough2)">而不是延伸 dp[4][3][内]=2（2+2×1=4）。</text>

  <!-- white note -->
  <rect x="30" y="352" width="500" height="72" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="280" y="372" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">⚠️ 教学点一：i=4 时 dp[4][2][内]=20 的来源是 dp[3][1] 的最优 18（新开第 2 段，18+(−1)×(−2)），</text>
  <text x="280" y="390" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">而延伸 dp[3][2][内]=3 只得 5 —— [1,2,3] 与 [−1] 相邻但合法，别把「不相交」误当成「不相邻」。</text>
  <text x="280" y="408" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">⚠️ 教学点二：j=0 列恒为 (0, −∞)（一段不选）；−∞ 表示状态不可达（元素不够开 j 段）。</text>
</svg>
