<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="460" height="500" fill="#fafafa"/>

  <text x="230" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">等差数列划分 II 算法流程（双重循环 + 哈希表）</text>

  <rect x="110" y="40" width="240" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="62" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">初始化</text>
  <text x="230" y="80" text-anchor="middle" font-size="11" fill="#555">若 n &lt; 3 返回 0；dp[0..n−1] 各一哈希表；ans = 0</text>

  <path d="M 230 94 L 230 112" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <rect x="90" y="116" width="280" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="136" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">for i = 1 to n−1</text>
  <text x="230" y="152" text-anchor="middle" font-size="11" fill="#555">枚举子序列右端点 i</text>

  <path d="M 230 164 L 230 182" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <rect x="80" y="186" width="300" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="206" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">for j = 0 to i−1</text>
  <text x="230" y="222" text-anchor="middle" font-size="11" fill="#555">枚举左端点 j（所有前驱）</text>

  <path d="M 230 234 L 230 252" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <rect x="70" y="256" width="320" height="40" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="230" y="281" text-anchor="middle" font-size="11.5" fill="#333">diff = nums[i] − nums[j]（用 long 防溢出）</text>

  <path d="M 230 300 L 230 318" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <polygon points="230,322 360,366 230,410 100,366" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="360" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">cnt = dp[j].get(diff, 0)</text>
  <text x="230" y="378" text-anchor="middle" font-size="10.5" fill="#555">以 j 结尾、公差 diff</text>
  <text x="230" y="392" text-anchor="middle" font-size="10.5" fill="#555">的弱子序列数</text>

  <path d="M 100 366 L 40 366 L 40 430" stroke="#82b366" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="50" y="358" font-size="11" fill="#82b366" font-weight="bold">cnt &gt; 0</text>

  <rect x="6" y="434" width="110" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="61" y="454" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">ans += cnt</text>
  <text x="61" y="470" text-anchor="middle" font-size="9.5" fill="#82b366">延长后 ≥3，计入答案</text>

  <path d="M 360 366 L 420 366 L 420 430" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="392" y="358" font-size="11" fill="#b85450" font-weight="bold">恒成立</text>

  <rect x="350" y="434" width="106" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="403" y="454" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">dp[i][diff]</text>
  <text x="403" y="470" text-anchor="middle" font-size="10.5" fill="#b85450">+= cnt + 1</text>

  <path d="M 61 484 L 61 494 L 230 494" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <path d="M 403 484 L 403 494 L 232 494" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrowR)" filter="url(#rough2)"/>
</svg>
