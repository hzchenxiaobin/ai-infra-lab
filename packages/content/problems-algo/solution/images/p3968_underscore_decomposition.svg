<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14.5" fill="#333" filter="url(#rough2)">核心观察：答案 = |x| + |y| + k（固定净位移 + 每个 '_' 恒 +1）</text>

  <!-- moves 串 -->
  <text x="52" y="61" text-anchor="end" font-size="12" fill="#666" filter="url(#rough2)">moves =</text>
  <g stroke-width="1.6" filter="url(#rough2)">
    <rect x="62" y="40" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="116" y="40" width="44" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="170" y="40" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="224" y="40" width="44" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <g font-size="14" text-anchor="middle" filter="url(#rough2)">
    <text x="84" y="61" fill="#333">L</text>
    <text x="138" y="61" fill="#d6a040" font-weight="bold">_</text>
    <text x="192" y="61" fill="#333">D</text>
    <text x="246" y="61" fill="#d6a040" font-weight="bold">_</text>
  </g>
  <g font-size="10" text-anchor="middle" filter="url(#rough2)">
    <text x="84" y="88" fill="#446688">x−1</text>
    <text x="138" y="88" fill="#d6a040">任选</text>
    <text x="192" y="88" fill="#446688">y−1</text>
    <text x="246" y="88" fill="#d6a040">任选</text>
  </g>

  <!-- 左右两个面板 -->
  <rect x="30" y="108" width="225" height="140" rx="8" fill="#e8f0fe" fill-opacity="0.55"
        stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="265" y="108" width="225" height="140" rx="8" fill="#fff8e1" fill-opacity="0.6"
        stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>

  <g font-size="12.5" filter="url(#rough2)">
    <text x="142" y="130" text-anchor="middle" fill="#446688" font-weight="bold">固定字符 → 净位移</text>
    <text x="42" y="155" fill="#333">x = #R − #L = 0 − 1 = −1</text>
    <text x="42" y="175" fill="#333">y = #U − #D = 0 − 1 = −1</text>
    <text x="42" y="200" fill="#446688" font-weight="bold">固定贡献 = |x| + |y| = 2</text>
    <text x="42" y="225" fill="#666" font-size="10.5">只看终点，与移动顺序无关！</text>
    <text x="42" y="240" fill="#666" font-size="10.5">中途拐多少弯都不影响结果</text>
  </g>

  <text x="260" y="188" text-anchor="middle" font-size="22" fill="#b85450" font-weight="bold" filter="url(#rough2)">+</text>

  <g font-size="12.5" filter="url(#rough2)">
    <text x="377" y="130" text-anchor="middle" fill="#d6a040" font-weight="bold">通配 '_' → 每个 +1</text>
    <text x="277" y="155" fill="#333">若 x ≥ 0 → 替换成 R</text>
    <text x="277" y="173" fill="#333">若 x &lt; 0 → 替换成 L</text>
    <text x="277" y="195" fill="#666" font-size="10.5">每步只动一根轴 → 距离恰 +1</text>
    <text x="277" y="220" fill="#d6a040" font-weight="bold">k = 2 → 贡献 +2</text>
    <text x="277" y="240" fill="#666" font-size="10.5">（按 y 的符号选 U/D 同理）</text>
  </g>

  <!-- 汇合箭头 -->
  <path d="M 142 248 C 142 266, 200 262, 218 274" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 377 248 C 377 266, 320 262, 302 274" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="276" width="260" height="38" rx="8" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="300" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = |x| + |y| + k = 2 + 2 = 4</text>

  <g font-size="10" text-anchor="middle" fill="#666" filter="url(#rough2)">
    <text x="260" y="334">上界：|x+dx| + |y+dy| ≤ |x| + |y| + |dx| + |dy| ≤ |x| + |y| + k</text>
    <text x="260" y="350">构造：按 x 的符号同向选 R/L，上界逐个取等 → 恰为最大值</text>
  </g>
</svg>
