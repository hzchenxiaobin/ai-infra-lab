<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="360" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：i! = (i−1)! × i，每次只做一次乘法</text>

  <!-- Factorial sequence boxes -->
  <text x="20" y="66" font-size="11" fill="#888">阶乘序列：</text>

  <rect x="70" y="50" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="66" text-anchor="middle" font-size="11" fill="#888">0!</text>
  <text x="100" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <rect x="150" y="50" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="66" text-anchor="middle" font-size="11" fill="#888">1!</text>
  <text x="180" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <rect x="230" y="50" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="66" text-anchor="middle" font-size="11" fill="#888">2!</text>
  <text x="260" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <rect x="310" y="50" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="66" text-anchor="middle" font-size="11" fill="#888">3!</text>
  <text x="340" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>

  <rect x="390" y="50" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="420" y="66" text-anchor="middle" font-size="11" fill="#888">4!</text>
  <text x="420" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">24</text>

  <rect x="470" y="50" width="60" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="500" y="66" text-anchor="middle" font-size="11" fill="#b85450">5!</text>
  <text x="500" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">120</text>

  <!-- Multiplication arrows -->
  <path d="M 132 68 L 148 68" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="44" text-anchor="middle" font-size="9" fill="#4a7a3a">×1</text>

  <path d="M 212 68 L 228 68" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="220" y="44" text-anchor="middle" font-size="9" fill="#4a7a3a">×2</text>

  <path d="M 292 68 L 308 68" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="44" text-anchor="middle" font-size="9" fill="#4a7a3a">×3</text>

  <path d="M 372 68 L 388 68" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="44" text-anchor="middle" font-size="9" fill="#4a7a3a">×4</text>

  <path d="M 452 68 L 468 68" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="460" y="44" text-anchor="middle" font-size="9" fill="#b85450">×5</text>

  <!-- Divider -->
  <line x1="20" y1="115" x2="560" y2="115" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- Brute force approach -->
  <text x="20" y="140" font-size="12" fill="#888" font-weight="bold">❌ 暴力法：每个独立重算</text>
  <rect x="20" y="148" width="540" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="30" y="166" font-size="10" fill="#666">0!=1</text>
  <text x="70" y="166" font-size="10" fill="#666">1!=1</text>
  <text x="100" y="166" font-size="10" fill="#666">2!=1×2</text>
  <text x="145" y="166" font-size="10" fill="#666">3!=1×2×3</text>
  <text x="200" y="166" font-size="10" fill="#666">4!=1×2×3×4</text>
  <text x="265" y="166" font-size="10" fill="#666">5!=1×2×3×4×5</text>
  <text x="30" y="182" font-size="10" fill="#b85450" font-weight="bold">总乘法次数：0+0+1+2+3+4 = 10 次 → O(n²)</text>

  <!-- Rolling product approach -->
  <text x="20" y="215" font-size="12" fill="#4a7a3a" font-weight="bold">✅ 滚动乘法：复用上一个结果</text>
  <rect x="20" y="223" width="540" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="30" y="241" font-size="10" fill="#666">0!=1</text>
  <text x="70" y="241" font-size="10" fill="#4a7a3a" font-weight="bold">1!=1×1</text>
  <text x="110" y="241" font-size="10" fill="#4a7a3a" font-weight="bold">2!=1×2</text>
  <text x="155" y="241" font-size="10" fill="#4a7a3a" font-weight="bold">3!=2×3</text>
  <text x="195" y="241" font-size="10" fill="#4a7a3a" font-weight="bold">4!=6×4</text>
  <text x="235" y="241" font-size="10" fill="#4a7a3a" font-weight="bold">5!=24×5</text>
  <text x="30" y="257" font-size="10" fill="#4a7a3a" font-weight="bold">总乘法次数：0+1+1+1+1+1 = 5 次 → O(n)</text>

  <!-- Generator note -->
  <rect x="20" y="285" width="540" height="55" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="35" y="306" font-size="12" fill="#333" font-weight="bold">🔑 生成器（generator）的妙处：</text>
  <text x="35" y="324" font-size="11" fill="#666">每次 yield 只产出一个值，调用方"按需取值"——</text>
  <text x="290" y="324" font-size="11" fill="#666">惰性计算，不预存整个序列，O(1) 额外空间</text>
</svg>
