<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：槽位计数——把前序遍历看作「往空槽填节点」</text>

  <!-- Section 1: initial slot -->
  <text x="40" y="62" font-size="12" fill="#446688" font-weight="bold">① 初始：1 个根槽位</text>

  <rect x="240" y="76" width="80" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="92" text-anchor="middle" font-size="10" fill="#888">根的位置</text>
  <text x="280" y="108" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">slots = 1</text>

  <!-- divider -->
  <path d="M 40 132 L 520 132" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>

  <!-- Section 2: two cases -->
  <text x="40" y="160" font-size="12" fill="#446688" font-weight="bold">② 每读入一个 token：先消耗 1 槽，再按类型补槽</text>

  <!-- Case A: non-null node -->
  <rect x="40" y="178" width="230" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="155" y="200" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">非空节点（整数）</text>

  <!-- consume -->
  <rect x="56" y="212" width="64" height="30" fill="#fafafa" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="88" y="232" text-anchor="middle" font-size="10.5" fill="#333">消耗 1</text>

  <text x="130" y="232" font-size="14" fill="#888" font-weight="bold">+</text>

  <!-- produce -->
  <rect x="146" y="212" width="64" height="30" fill="#fafafa" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="178" y="232" text-anchor="middle" font-size="10.5" fill="#333">产生 2</text>

  <text x="220" y="232" font-size="11" fill="#888">=</text>

  <!-- net -->
  <rect x="232" y="212" width="32" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="248" y="232" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">+1</text>

  <text x="155" y="262" text-anchor="middle" font-size="10" fill="#555">把当前槽换成「左、右」两个子槽</text>
  <text x="155" y="278" text-anchor="middle" font-size="9.5" fill="#888">−1 + 2 = 净增 1 槽</text>

  <!-- Case B: null node -->
  <rect x="290" y="178" width="230" height="120" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="405" y="200" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">空节点（"#"）</text>

  <!-- consume -->
  <rect x="306" y="212" width="64" height="30" fill="#fafafa" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="338" y="232" text-anchor="middle" font-size="10.5" fill="#333">消耗 1</text>

  <text x="380" y="232" font-size="14" fill="#888" font-weight="bold">+</text>

  <!-- produce -->
  <rect x="396" y="212" width="64" height="30" fill="#fafafa" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="428" y="232" text-anchor="middle" font-size="10.5" fill="#333">产生 0</text>

  <text x="470" y="232" font-size="11" fill="#888">=</text>

  <!-- net -->
  <rect x="482" y="212" width="32" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="498" y="232" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−1</text>

  <text x="405" y="262" text-anchor="middle" font-size="10" fill="#555">把当前槽直接抹掉</text>
  <text x="405" y="278" text-anchor="middle" font-size="9.5" fill="#888">−1 + 0 = 净减 1 槽</text>

  <!-- divider -->
  <path d="M 40 312 L 520 312" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>

  <!-- Section 3: validity criteria -->
  <text x="40" y="340" font-size="12" fill="#d6a040" font-weight="bold">③ 合法判据：两条同时满足</text>

  <!-- criteria 1 -->
  <rect x="40" y="356" width="235" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="60" y="378" font-size="11" fill="#333" font-weight="bold">过程中 slots ≥ 0</text>
  <text x="60" y="394" font-size="10" fill="#555">一旦 &lt; 0，说明某 token 无槽可放</text>
  <text x="60" y="408" font-size="10" fill="#888">（如 "9,#,#,1" 末尾的 1）</text>

  <!-- criteria 2 -->
  <rect x="290" y="356" width="235" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="378" font-size="11" fill="#333" font-weight="bold">结束时 slots = 0</text>
  <text x="310" y="394" font-size="10" fill="#555">所有槽恰好填满，不多不少</text>
  <text x="310" y="408" font-size="10" fill="#888">（如 "1,#" 结束时 slots=1，非法）</text>
</svg>
