<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrc" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8899aa"/>
    </marker>
    <marker id="arrgr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1 的图演化：每加一条捷径，0 → 4 就近一截</text>
  <text x="260" y="39" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">绿粗 = 在最短路上 · 橙虚 = 旁路的查询边 · 灰细 = 链边</text>

  <rect x="8" y="46" width="248" height="146" rx="10" fill="none" stroke="#e2e2e2" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="264" y="46" width="248" height="146" rx="10" fill="none" stroke="#e2e2e2" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="8" y="199" width="248" height="146" rx="10" fill="none" stroke="#e2e2e2" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="264" y="199" width="248" height="146" rx="10" fill="none" stroke="#e2e2e2" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- ① 初始链 -->
  <text x="132" y="64" text-anchor="middle" font-size="12.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">① 初始：一条链</text>
  <path d="M 55 140 L 66 140" stroke="#4a7a3a" stroke-width="3" fill="none" marker-end="url(#arrgr)" filter="url(#rough2)"/>
  <path d="M 103 140 L 114 140" stroke="#4a7a3a" stroke-width="3" fill="none" marker-end="url(#arrgr)" filter="url(#rough2)"/>
  <path d="M 151 140 L 162 140" stroke="#4a7a3a" stroke-width="3" fill="none" marker-end="url(#arrgr)" filter="url(#rough2)"/>
  <path d="M 199 140 L 210 140" stroke="#4a7a3a" stroke-width="3" fill="none" marker-end="url(#arrgr)" filter="url(#rough2)"/>
  <circle cx="38" cy="140" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="86" cy="140" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="134" cy="140" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="182" cy="140" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="230" cy="140" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="38" y="144" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="86" y="144" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="134" y="144" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="182" y="144" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="230" y="144" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="132" y="183" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">0→4 最短 = 4</text>

  <!-- ② 加 (2,4) -->
  <text x="387" y="64" text-anchor="middle" font-size="12.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">② 新增 (2,4)</text>
  <path d="M 310 140 L 321 140" stroke="#4a7a3a" stroke-width="3" fill="none" marker-end="url(#arrgr)" filter="url(#rough2)"/>
  <path d="M 358 140 L 369 140" stroke="#4a7a3a" stroke-width="3" fill="none" marker-end="url(#arrgr)" filter="url(#rough2)"/>
  <path d="M 406 140 L 417 140" stroke="#8899aa" stroke-width="1.6" fill="none" marker-end="url(#arrc)" filter="url(#rough2)"/>
  <path d="M 454 140 L 465 140" stroke="#8899aa" stroke-width="1.6" fill="none" marker-end="url(#arrc)" filter="url(#rough2)"/>
  <path d="M 389 126 Q 413 84 437 126" stroke="#4a7a3a" stroke-width="2.5" fill="none" marker-end="url(#arrgr)" filter="url(#rough2)"/>
  <text x="413" y="100" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">(2,4)</text>
  <circle cx="293" cy="140" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="341" cy="140" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="389" cy="140" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="437" cy="140" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="485" cy="140" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="293" y="144" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="341" y="144" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="389" y="144" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="437" y="144" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="485" y="144" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="387" y="183" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">0→4 最短 = 3</text>

  <!-- ③ 加 (0,2) -->
  <text x="132" y="217" text-anchor="middle" font-size="12.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">③ 再加 (0,2)</text>
  <path d="M 55 293 L 66 293" stroke="#8899aa" stroke-width="1.6" fill="none" marker-end="url(#arrc)" filter="url(#rough2)"/>
  <path d="M 103 293 L 114 293" stroke="#8899aa" stroke-width="1.6" fill="none" marker-end="url(#arrc)" filter="url(#rough2)"/>
  <path d="M 151 293 L 162 293" stroke="#8899aa" stroke-width="1.6" fill="none" marker-end="url(#arrc)" filter="url(#rough2)"/>
  <path d="M 199 293 L 210 293" stroke="#8899aa" stroke-width="1.6" fill="none" marker-end="url(#arrc)" filter="url(#rough2)"/>
  <path d="M 38 279 Q 86 241 134 279" stroke="#4a7a3a" stroke-width="2.5" fill="none" marker-end="url(#arrgr)" filter="url(#rough2)"/>
  <path d="M 134 279 Q 182 241 230 279" stroke="#4a7a3a" stroke-width="2.5" fill="none" marker-end="url(#arrgr)" filter="url(#rough2)"/>
  <text x="86" y="255" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">(0,2)</text>
  <circle cx="38" cy="293" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="86" cy="293" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="134" cy="293" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="182" cy="293" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="230" cy="293" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="38" y="297" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="86" y="297" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="134" y="297" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="182" y="297" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="230" y="297" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="132" y="339" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">0→4 最短 = 2</text>

  <!-- ④ 加 (0,4) -->
  <text x="387" y="217" text-anchor="middle" font-size="12.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">④ 又加 (0,4)</text>
  <path d="M 310 293 L 321 293" stroke="#8899aa" stroke-width="1.6" fill="none" marker-end="url(#arrc)" filter="url(#rough2)"/>
  <path d="M 358 293 L 369 293" stroke="#8899aa" stroke-width="1.6" fill="none" marker-end="url(#arrc)" filter="url(#rough2)"/>
  <path d="M 406 293 L 417 293" stroke="#8899aa" stroke-width="1.6" fill="none" marker-end="url(#arrc)" filter="url(#rough2)"/>
  <path d="M 454 293 L 465 293" stroke="#8899aa" stroke-width="1.6" fill="none" marker-end="url(#arrc)" filter="url(#rough2)"/>
  <path d="M 293 279 Q 341 255 389 279" stroke="#d6a040" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>
  <path d="M 389 279 Q 437 255 485 279" stroke="#d6a040" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>
  <path d="M 293 279 Q 389 215 485 279" stroke="#4a7a3a" stroke-width="2.5" fill="none" marker-end="url(#arrgr)" filter="url(#rough2)"/>
  <text x="389" y="243" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">(0,4)</text>
  <circle cx="293" cy="293" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="341" cy="293" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="389" cy="293" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="437" cy="293" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="485" cy="293" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="293" y="297" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="341" y="297" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="389" y="297" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="437" y="297" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="485" y="297" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="387" y="339" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">0→4 最短 = 1</text>
</svg>
