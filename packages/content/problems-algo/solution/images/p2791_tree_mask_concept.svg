<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2791" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">树的每个节点维护从根到该节点的字符奇偶 mask</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">26 位整数：每位代表一个字母出现次数的奇偶（奇=1，偶=0）</text>

  <!-- Tree edges -->
  <!-- 0 -> 1 (c) -->
  <path d="M 272 72 Q 200 100 168 128" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="205" y="100" font-size="12" fill="#b85450" font-weight="bold">c</text>
  <!-- 0 -> 2 (a) -->
  <path d="M 288 72 Q 360 100 392 128" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="355" y="100" font-size="12" fill="#b85450" font-weight="bold">a</text>
  <!-- 1 -> 3 (a) -->
  <path d="M 148 148 Q 110 170 92 198" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="112" y="175" font-size="12" fill="#b85450" font-weight="bold">a</text>
  <!-- 1 -> 4 (b) -->
  <path d="M 172 148 Q 200 170 222 198" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="200" y="175" font-size="12" fill="#b85450" font-weight="bold">b</text>
  <!-- 2 -> 5 (c) -->
  <path d="M 400 148 L 400 198" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="412" y="175" font-size="12" fill="#b85450" font-weight="bold">c</text>

  <!-- Nodes: circle + label -->
  <!-- Node 0 -->
  <ellipse cx="280" cy="60" rx="26" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="58" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <text x="280" y="72" text-anchor="middle" font-size="9" fill="#888">m=0</text>

  <!-- Node 1 -->
  <ellipse cx="160" cy="138" rx="26" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="136" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="160" y="150" text-anchor="middle" font-size="9" fill="#888">m=4</text>

  <!-- Node 2 -->
  <ellipse cx="400" cy="138" rx="26" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="400" y="136" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <text x="400" y="150" text-anchor="middle" font-size="9" fill="#888">m=1</text>

  <!-- Node 3 -->
  <ellipse cx="84" cy="208" rx="26" ry="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="84" y="206" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <text x="84" y="220" text-anchor="middle" font-size="9" fill="#888">m=5</text>

  <!-- Node 4 -->
  <ellipse cx="230" cy="208" rx="26" ry="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="206" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <text x="230" y="220" text-anchor="middle" font-size="9" fill="#888">m=6</text>

  <!-- Node 5 -->
  <ellipse cx="400" cy="208" rx="26" ry="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="400" y="206" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <text x="400" y="220" text-anchor="middle" font-size="9" fill="#888">m=5</text>

  <!-- XOR formula box -->
  <rect x="30" y="252" width="500" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="274" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">关键性质：路径(u→v) 的字符奇偶 mask = mask[u] ⊕ mask[v]</text>
  <text x="280" y="292" text-anchor="middle" font-size="10" fill="#666">公共路径 root→LCA 被两条路径各算一次，异或后奇偶抵消</text>

  <!-- Example pair -->
  <rect x="30" y="314" width="500" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="336" font-size="11" fill="#4a7a3a" font-weight="bold">示例：路径(3→5)</text>
  <text x="50" y="354" font-size="11" fill="#666">mask[3] = 5 = 0b00101 (a,c)，mask[5] = 5 = 0b00101 (a,c)</text>
  <text x="50" y="372" font-size="11" fill="#333" font-weight="bold">⊕ = 0 → 所有字符出现偶数次 → 可排回文 ✓</text>
</svg>
