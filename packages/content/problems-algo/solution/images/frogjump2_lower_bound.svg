<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：鸽巢原理给出下界（两路 + 三石 → 必跨中间）</text>

  <!-- ====== River line ====== -->
  <path d="M 60 250 L 480 250" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="492" y="254" font-size="11" fill="#888">河岸</text>

  <!-- ====== Three consecutive stones i, i+1, i+2 ====== -->
  <!-- stone i -->
  <ellipse cx="150" cy="250" rx="20" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="254" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i</text>
  <text x="150" y="284" text-anchor="middle" font-size="10.5" fill="#888">pos = a</text>

  <!-- stone i+1 (middle, contested) -->
  <ellipse cx="270" cy="250" rx="20" ry="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="270" y="254" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">i+1</text>
  <text x="270" y="284" text-anchor="middle" font-size="10.5" fill="#888">pos = b</text>

  <!-- stone i+2 -->
  <ellipse cx="390" cy="250" rx="20" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="254" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i+2</text>
  <text x="390" y="284" text-anchor="middle" font-size="10.5" fill="#888">pos = c</text>

  <!-- ====== Green forward path: uses middle stone i+1 (small arcs) ====== -->
  <path d="M 150 232 Q 210 188 270 232" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 270 232 Q 330 188 390 232" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="270" y="170" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">去路 P1 占用 i+1</text>

  <!-- ====== Orange return path: must jump over i+1 (big red arc, right→left) ====== -->
  <path d="M 390 256 Q 270 130 150 256" stroke="#b85450" stroke-width="2.4" fill="none" stroke-dasharray="6,4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="270" y="112" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">回路 P2 必跨过 i+1：i+2 ⇢ i</text>

  <!-- jump length label on the red arc -->
  <rect x="206" y="138" width="128" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="156" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">跳 ≥ c − a</text>

  <!-- ====== Right-side case note ====== -->
  <rect x="430" y="150" width="98" height="92" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="8" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="479" y="170" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">两种情形</text>
  <text x="479" y="188" text-anchor="middle" font-size="9.5" fill="#4a7a3a">i+1 ∈ P1</text>
  <text x="479" y="202" text-anchor="middle" font-size="9.5" fill="#888">⇒ P2 跨</text>
  <text x="479" y="218" text-anchor="middle" font-size="9.5" fill="#d6a040">i+1 ∈ P2</text>
  <text x="479" y="232" text-anchor="middle" font-size="9.5" fill="#888">⇒ P1 跨</text>

  <!-- ====== Bottom conclusion ====== -->
  <rect x="30" y="300" width="480" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="320" text-anchor="middle" font-size="11.5" fill="#333">中间石 i+1 至多属于一条路 → 另一条必从 ≤i 跨到 ≥i+2，跳长 ≥ stones[i+2]−stones[i]</text>
  <text x="270" y="340" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">对每个 i=0..n-3 成立 ⇒ 答案 ≥ max(stones[i+2]−stones[i])</text>
</svg>
