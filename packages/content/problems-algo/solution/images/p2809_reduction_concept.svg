<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">下标 i 在第 tᵢ 秒清零：少增长 vs 不清零的差值</text>

  <!-- timeline axis -->
  <line x1="60" y1="120" x2="540" y2="120" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="540" y="116" font-size="10" fill="#888">时间→</text>
  <!-- ticks 0..5 -->
  <g font-size="11" fill="#888">
    <line x1="100" y1="116" x2="100" y2="124" stroke="#888" filter="url(#rough2)"/>
    <text x="100" y="140" text-anchor="middle">0</text>
    <line x1="180" y1="116" x2="180" y2="124" stroke="#888" filter="url(#rough2)"/>
    <text x="180" y="140" text-anchor="middle">1</text>
    <line x1="260" y1="116" x2="260" y2="124" stroke="#888" filter="url(#rough2)"/>
    <text x="260" y="140" text-anchor="middle">2</text>
    <line x1="340" y1="116" x2="340" y2="124" stroke="#888" filter="url(#rough2)"/>
    <text x="340" y="140" text-anchor="middle">tᵢ</text>
    <line x1="460" y1="116" x2="460" y2="124" stroke="#888" filter="url(#rough2)"/>
    <text x="460" y="140" text-anchor="middle">t</text>
  </g>

  <!-- operation marker at t_i -->
  <rect x="332" y="96" width="18" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="341" y="92" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">清零</text>

  <!-- two value bars: without op (top) and with op (bottom) -->
  <!-- without op: linear growth nums1[i] + nums2[i]*t -->
  <text x="60" y="62" font-size="11" fill="#b85450" font-weight="bold">不清零：</text>
  <rect x="100" y="48" width="360" height="22" fill="none" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <line x1="100" y1="59" x2="460" y2="59" stroke="#fce4ec" stroke-width="18" filter="url(#rough2)"/>
  <line x1="100" y1="59" x2="460" y2="42" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="470" y="62" font-size="11" fill="#b85450">nums1[i]+nums2[i]·t</text>

  <!-- with op: grows to t_i, drops to 0, grows again (t-t_i) -->
  <text x="60" y="196" font-size="11" fill="#4a7a3a" font-weight="bold">清零后：</text>
  <line x1="100" y1="193" x2="340" y2="178" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="340" cy="178" r="3" fill="#d6a040" filter="url(#rough2)"/>
  <line x1="340" y1="178" x2="340" y2="193" stroke="#d6a040" stroke-width="2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <line x1="340" y1="193" x2="460" y2="183" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="470" y="196" font-size="11" fill="#4a7a3a">nums2[i]·(t−tᵢ)</text>

  <!-- bracket: the reduction = (top) - (bottom) -->
  <path d="M 460 48 L 475 48 L 475 183 L 460 183" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="486" y="120" font-size="11" fill="#446688" font-weight="bold">减少量</text>

  <!-- formula box -->
  <rect x="80" y="248" width="400" height="108" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="272" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">单次清零的「减少量」公式</text>
  <text x="280" y="296" text-anchor="middle" font-size="13" fill="#333">减少量 = (nums1[i] + nums2[i]·t) − nums2[i]·(t − tᵢ)</text>
  <text x="280" y="318" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">= nums1[i] + nums2[i] · tᵢ</text>
  <text x="280" y="340" text-anchor="middle" font-size="10" fill="#666">清零越晚(tᵢ越大)、增长率越大(nums2[i]越大)，减少越多</text>
</svg>
