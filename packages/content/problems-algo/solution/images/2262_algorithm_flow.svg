<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：滚动 f(i) + last 表，一次遍历累加总引力</text>

  <!-- Step 1: init -->
  <rect x="150" y="44" width="240" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① last[c] = −1（∀c），cur = 0，ans = 0</text>
  <text x="398" y="68" font-size="9.5" fill="#888">O(∣Σ∣)</text>

  <!-- arrow -->
  <line x1="270" y1="82" x2="270" y2="100" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: for loop -->
  <rect x="150" y="104" width="240" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="126" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② for i = 0 .. n−1：</text>

  <!-- arrow into loop body -->
  <line x1="270" y1="138" x2="270" y2="154" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: c = s[i] -->
  <rect x="170" y="158" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="180" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">③ c = s[i]；delta = i − last[c]</text>

  <!-- arrow -->
  <line x1="270" y1="192" x2="270" y2="206" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: cur += delta; last[c] = i -->
  <rect x="120" y="210" width="300" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="232" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">④ cur += delta；last[c] = i</text>
  <text x="428" y="232" font-size="9.5" fill="#4a7a3a">滚动 f(i)</text>

  <!-- arrow -->
  <line x1="270" y1="244" x2="270" y2="258" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: ans += cur -->
  <rect x="120" y="262" width="300" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="270" y="284" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">⑤ ans += cur（累加 f(i) 到总引力）</text>

  <!-- loop back arrow (right side) -->
  <path d="M 420 279 Q 480 279 480 121 L 392 121" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="488" y="200" font-size="9.5" fill="#888">下一 i</text>

  <!-- arrow to return -->
  <line x1="270" y1="296" x2="270" y2="316" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="312" font-size="9.5" fill="#888">循环结束</text>

  <!-- Step 6: return ans -->
  <rect x="170" y="320" width="200" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="344" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">⑥ return ans</text>

  <!-- ===== Invariant box ===== -->
  <rect x="40" y="372" width="460" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="392" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">不变式：处理完位置 i 后，cur = f(i) = “所有以 i 结尾子串的引力之和”</text>
  <text x="270" y="408" text-anchor="middle" font-size="10.5" fill="#333">= Σ_c (last[c]+1)，其中 last[c] 为 c 在 s[0..i] 中最右位置（−1 表未出现）</text>
  <text x="270" y="421" text-anchor="middle" font-size="9.5" fill="#888">仅 s[i] 对应字符的 last 变化 → delta = i − last 一步更新 cur，O(1) 转移</text>
</svg>
