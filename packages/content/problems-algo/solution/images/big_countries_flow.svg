<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">执行流程：FROM → WHERE（双阈值 OR）→ SELECT</text>

  <!-- Step 1: FROM -->
  <rect x="40" y="56" width="170" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="125" y="76" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① FROM World</text>
  <text x="125" y="92" text-anchor="middle" font-size="9" fill="#555">读取全部 5 行</text>

  <path d="M125 104 L125 124" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 2: WHERE -->
  <rect x="40" y="128" width="170" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="125" y="148" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">② WHERE</text>
  <text x="125" y="164" text-anchor="middle" font-size="9" fill="#333">area &gt;= 3000000</text>
  <text x="125" y="178" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">OR</text>
  <text x="125" y="190" text-anchor="middle" font-size="9" fill="#333">population &gt;= 25000000</text>

  <path d="M125 196 L125 216" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 3: SELECT -->
  <rect x="40" y="220" width="170" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="125" y="240" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">③ SELECT name,</text>
  <text x="125" y="254" text-anchor="middle" font-size="10" fill="#4a7a3a">population, area</text>
  <text x="125" y="268" text-anchor="middle" font-size="9" fill="#555">输出 2 行</text>

  <path d="M125 280 L125 302" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Output -->
  <rect x="48" y="306" width="154" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="125" y="322" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">结果（name, pop, area）</text>
  <text x="125" y="338" text-anchor="middle" font-size="9" fill="#333">Afghanistan, 25500100, 652230</text>
  <text x="125" y="352" text-anchor="middle" font-size="9" fill="#333">Algeria, 37100000, 2381741</text>
  <text x="125" y="366" text-anchor="middle" font-size="8" fill="#555">顺序任意</text>

  <!-- Right side: OR truth table -->
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">OR 真值表（保留规则）</text>

  <rect x="250" y="66" width="300" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="80" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">area≥3M</text>
  <text x="370" y="80" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">pop≥25M</text>
  <text x="470" y="80" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">OR → 保留?</text>
  <line x1="330" y1="66" x2="330" y2="88" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="410" y1="66" x2="410" y2="88" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Row TRUE FALSE -->
  <rect x="250" y="88" width="300" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="290" y="102" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">TRUE</text>
  <text x="370" y="102" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">FALSE</text>
  <text x="470" y="102" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">✓ TRUE</text>
  <line x1="330" y1="88" x2="330" y2="110" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="410" y1="88" x2="410" y2="110" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- Row FALSE TRUE -->
  <rect x="250" y="110" width="300" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="290" y="124" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">FALSE</text>
  <text x="370" y="124" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">TRUE</text>
  <text x="470" y="124" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">✓ TRUE</text>
  <line x1="330" y1="110" x2="330" y2="132" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="410" y1="110" x2="410" y2="132" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- Row TRUE TRUE -->
  <rect x="250" y="132" width="300" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="290" y="146" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">TRUE</text>
  <text x="370" y="146" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">TRUE</text>
  <text x="470" y="146" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">✓ TRUE</text>
  <line x1="330" y1="132" x2="330" y2="154" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="410" y1="132" x2="410" y2="154" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- Row FALSE FALSE -->
  <rect x="250" y="154" width="300" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="290" y="168" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">FALSE</text>
  <text x="370" y="168" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">FALSE</text>
  <text x="470" y="168" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">✗ FALSE</text>
  <line x1="330" y1="154" x2="330" y2="176" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="410" y1="154" x2="410" y2="176" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- Notes -->
  <rect x="250" y="194" width="300" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="400" y="212" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">关键规则</text>
  <text x="262" y="228" font-size="9" fill="#333">• OR：任一 TRUE → TRUE（短路保留）</text>
  <text x="262" y="242" font-size="9" fill="#333">• 仅当两条件皆 FALSE 才丢弃</text>
  <text x="262" y="256" font-size="9" fill="#b85450" font-weight="bold">⚠ 用 AND 会漏掉只满足其一的国家</text>
  <text x="262" y="270" font-size="9" fill="#555">• 数值比较无 NULL 陷阱（均为 NOT NULL 列）</text>

  <!-- Execution order -->
  <rect x="250" y="284" width="300" height="88" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="400" y="302" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">SQL 逻辑执行顺序</text>
  <text x="262" y="320" font-size="9" fill="#333">FROM → WHERE → SELECT</text>
  <text x="262" y="336" font-size="9" fill="#555">① 先读 World 全表</text>
  <text x="262" y="350" font-size="9" fill="#555">② 逐行用 WHERE 双阈值 OR 判定</text>
  <text x="262" y="364" font-size="9" fill="#555">③ 留下的行输出 name/pop/area</text>
</svg>
