<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：选某节点为根，「最大路径和 − 最小路径和」= 最长路径 − price[root]</text>
  <text x="300" y="46" text-anchor="middle" font-size="11" fill="#888">最小路径恒为 {root} 本身（价值和=price[root]）；故每个根的开销 = 从 root 出发的最长路径和 − price[root]</text>

  <!-- ====== Tree rooted at node 2 (example 1) ====== -->
  <!-- edges first -->
  <!-- 2 -> 1 (red, max path) -->
  <path d="M 300 110 L 300 178" stroke="#b85450" stroke-width="2.8" fill="none" filter="url(#rough2)"/>
  <!-- 1 -> 3 (red, max path) -->
  <path d="M 326 202 L 404 268" stroke="#b85450" stroke-width="2.8" fill="none" filter="url(#rough2)"/>
  <!-- 3 -> 4 (red, max path) -->
  <path d="M 430 296 L 350 362" stroke="#b85450" stroke-width="2.8" fill="none" filter="url(#rough2)"/>
  <!-- 1 -> 0 (normal) -->
  <path d="M 274 202 L 196 268" stroke="#888" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <!-- 3 -> 5 (normal) -->
  <path d="M 456 296 L 536 362" stroke="#888" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <!-- nodes -->
  <!-- root 2 (red: on max path; also the min path = {2}) -->
  <ellipse cx="300" cy="92" rx="28" ry="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="300" y="88" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">2</text>
  <text x="300" y="104" text-anchor="middle" font-size="9" fill="#a85a56">7</text>
  <text x="300" y="64" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">root</text>

  <!-- node 1 (red) -->
  <ellipse cx="300" cy="190" rx="26" ry="22" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="300" y="186" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">1</text>
  <text x="300" y="201" text-anchor="middle" font-size="9" fill="#a85a56">8</text>

  <!-- node 0 (normal) -->
  <ellipse cx="170" cy="282" rx="24" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="278" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">0</text>
  <text x="170" y="292" text-anchor="middle" font-size="9" fill="#5577aa">9</text>

  <!-- node 3 (red) -->
  <ellipse cx="430" cy="282" rx="24" ry="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="430" y="278" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">3</text>
  <text x="430" y="292" text-anchor="middle" font-size="9" fill="#a85a56">6</text>

  <!-- node 4 (red, leaf, end of max path) -->
  <ellipse cx="336" cy="372" rx="24" ry="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="336" y="368" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">4</text>
  <text x="336" y="382" text-anchor="middle" font-size="9" fill="#a85a56">10</text>

  <!-- node 5 (normal) -->
  <ellipse cx="550" cy="372" rx="22" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="550" y="368" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">5</text>
  <text x="550" y="381" text-anchor="middle" font-size="9" fill="#5577aa">5</text>

  <!-- max path annotation -->
  <text x="300" y="410" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">max 路径 2→1→3→4：7+8+6+10 = 31</text>
  <!-- min path annotation pointing at root 2 -->
  <path d="M 250 56 Q 222 70 268 86" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="208" y="50" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">min 路径 {2} = 7</text>

  <!-- cost box -->
  <rect x="60" y="416" width="480" height="0" rx="8" fill="none"/>
  <text x="300" y="430" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">开销(root=2) = 31 − 7 = 24  ←  全树最大</text>
</svg>
