<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>

  <rect width="600" height="560" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：A=[34,23,1,24,75,33,54,8], K=60</text>
  <text x="300" y="42" text-anchor="middle" font-size="12" fill="#888">排序后: [1, 8, 23, 24, 33, 34, 54, 75]</text>

  <!-- Array header -->
  <text x="30" y="74" font-size="11" fill="#888">排序后:</text>
  <!-- 8 elements, width 50 each, starting at x=80 -->
  <!-- idx 0: 1 -->
  <rect x="80" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="78" text-anchor="middle" font-size="11" fill="#333">1</text>
  <!-- idx 1: 8 -->
  <rect x="132" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="157" y="78" text-anchor="middle" font-size="11" fill="#333">8</text>
  <!-- idx 2: 23 -->
  <rect x="184" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="209" y="78" text-anchor="middle" font-size="11" fill="#333">23</text>
  <!-- idx 3: 24 -->
  <rect x="236" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="261" y="78" text-anchor="middle" font-size="11" fill="#333">24</text>
  <!-- idx 4: 33 -->
  <rect x="288" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="313" y="78" text-anchor="middle" font-size="11" fill="#333">33</text>
  <!-- idx 5: 34 -->
  <rect x="340" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="365" y="78" text-anchor="middle" font-size="11" fill="#333">34</text>
  <!-- idx 6: 54 -->
  <rect x="392" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="417" y="78" text-anchor="middle" font-size="11" fill="#333">54</text>
  <!-- idx 7: 75 -->
  <rect x="444" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="469" y="78" text-anchor="middle" font-size="11" fill="#333">75</text>

  <!-- Index labels -->
  <text x="105" y="100" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="157" y="100" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="209" y="100" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="261" y="100" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="313" y="100" text-anchor="middle" font-size="9" fill="#aaa">4</text>
  <text x="365" y="100" text-anchor="middle" font-size="9" fill="#aaa">5</text>
  <text x="417" y="100" text-anchor="middle" font-size="9" fill="#aaa">6</text>
  <text x="469" y="100" text-anchor="middle" font-size="9" fill="#aaa">7</text>

  <!-- Step rows -->
  <!-- Step 1: left=0(1), right=7(75): sum=76 >= 60, right-- -->
  <text x="30" y="134" font-size="11" fill="#888">①</text>
  <text x="80" y="134" font-size="11" fill="#333">left=0(1), right=7(75)</text>
  <text x="280" y="134" font-size="11" fill="#b85450" font-weight="bold">s=76 ≥ 60 ❌</text>
  <text x="430" y="134" font-size="11" fill="#b85450">right→6</text>
  <text x="520" y="134" font-size="11" fill="#888">ans=−1</text>
  <!-- pointers -->
  <text x="105" y="148" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">↑L</text>
  <text x="469" y="148" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">↑R</text>

  <!-- Step 2: left=0(1), right=6(54): sum=55 < 60, ans=55, left++ -->
  <text x="30" y="172" font-size="11" fill="#888">②</text>
  <text x="80" y="172" font-size="11" fill="#333">left=0(1), right=6(54)</text>
  <text x="280" y="172" font-size="11" fill="#4a7a3a" font-weight="bold">s=55 &lt; 60 ✅</text>
  <text x="430" y="172" font-size="11" fill="#4a7a3a">left→1</text>
  <text x="520" y="172" font-size="11" fill="#4a7a3a" font-weight="bold">ans=55</text>
  <text x="105" y="186" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">↑L</text>
  <text x="417" y="186" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">↑R</text>

  <!-- Step 3: left=1(8), right=6(54): sum=62 >= 60, right-- -->
  <text x="30" y="210" font-size="11" fill="#888">③</text>
  <text x="80" y="210" font-size="11" fill="#333">left=1(8), right=6(54)</text>
  <text x="280" y="210" font-size="11" fill="#b85450" font-weight="bold">s=62 ≥ 60 ❌</text>
  <text x="430" y="210" font-size="11" fill="#b85450">right→5</text>
  <text x="520" y="210" font-size="11" fill="#888">ans=55</text>
  <text x="157" y="224" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">↑L</text>
  <text x="417" y="224" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">↑R</text>

  <!-- Step 4: left=1(8), right=5(34): sum=42 < 60, ans=max(55,42)=55, left++ -->
  <text x="30" y="248" font-size="11" fill="#888">④</text>
  <text x="80" y="248" font-size="11" fill="#333">left=1(8), right=5(34)</text>
  <text x="280" y="248" font-size="11" fill="#4a7a3a" font-weight="bold">s=42 &lt; 60 ✅</text>
  <text x="430" y="248" font-size="11" fill="#4a7a3a">left→2</text>
  <text x="520" y="248" font-size="11" fill="#888">ans=55</text>
  <text x="157" y="262" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">↑L</text>
  <text x="365" y="262" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">↑R</text>

  <!-- Step 5: left=2(23), right=5(34): sum=57 < 60, ans=max(55,57)=57, left++ -->
  <text x="30" y="286" font-size="11" fill="#888">⑤</text>
  <text x="80" y="286" font-size="11" fill="#333">left=2(23), right=5(34)</text>
  <text x="280" y="286" font-size="11" fill="#4a7a3a" font-weight="bold">s=57 &lt; 60 ✅</text>
  <text x="430" y="286" font-size="11" fill="#4a7a3a">left→3</text>
  <text x="520" y="286" font-size="11" fill="#4a7a3a" font-weight="bold">ans=57</text>
  <text x="209" y="300" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">↑L</text>
  <text x="365" y="300" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">↑R</text>

  <!-- Step 6: left=3(24), right=5(34): sum=58 < 60, ans=max(57,58)=58, left++ -->
  <text x="30" y="324" font-size="11" fill="#888">⑥</text>
  <text x="80" y="324" font-size="11" fill="#333">left=3(24), right=5(34)</text>
  <text x="280" y="324" font-size="11" fill="#4a7a3a" font-weight="bold">s=58 &lt; 60 ✅</text>
  <text x="430" y="324" font-size="11" fill="#4a7a3a">left→4</text>
  <text x="520" y="324" font-size="11" fill="#4a7a3a" font-weight="bold">ans=58</text>
  <text x="261" y="338" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">↑L</text>
  <text x="365" y="338" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">↑R</text>

  <!-- Step 7: left=4(33), right=5(34): sum=67 >= 60, right-- -->
  <text x="30" y="362" font-size="11" fill="#888">⑦</text>
  <text x="80" y="362" font-size="11" fill="#333">left=4(33), right=5(34)</text>
  <text x="280" y="362" font-size="11" fill="#b85450" font-weight="bold">s=67 ≥ 60 ❌</text>
  <text x="430" y="362" font-size="11" fill="#b85450">right→4</text>
  <text x="520" y="362" font-size="11" fill="#888">ans=58</text>
  <text x="313" y="376" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">↑L</text>
  <text x="365" y="376" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">↑R</text>

  <!-- Step 8: left=4 >= right=4, stop -->
  <text x="30" y="400" font-size="11" fill="#888">⑧</text>
  <text x="80" y="400" font-size="11" fill="#d6a040" font-weight="bold">left=4 ≥ right=4 → 终止</text>
  <text x="430" y="400" font-size="11" fill="#446688" font-weight="bold">ans=58</text>
  <text x="313" y="414" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">↑L=R</text>

  <!-- Divider -->
  <path d="M40 432 L560 432" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Summary -->
  <rect x="60" y="446" width="480" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="300" y="466" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">最优解：24 + 34 = 58 &lt; 60 ✅</text>
  <text x="300" y="484" text-anchor="middle" font-size="11" fill="#333">第⑥步命中，是所有合法和中最大的</text>

  <!-- Highlight optimal pair -->
  <rect x="236" y="58" width="50" height="30" fill="none" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <rect x="340" y="58" width="50" height="30" fill="none" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>

  <!-- Legend -->
  <rect x="60" y="510" width="10" height="10" fill="#e6f4ea" stroke="#4a7a3a" rx="2" filter="url(#rough2)"/>
  <text x="76" y="520" font-size="10" fill="#888">合法 (s&lt;K)</text>
  <rect x="160" y="510" width="10" height="10" fill="#fce4ec" stroke="#b85450" rx="2" filter="url(#rough2)"/>
  <text x="176" y="520" font-size="10" fill="#888">非法 (s≥K)</text>
  <rect x="270" y="510" width="10" height="10" fill="none" stroke="#4a7a3a" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="286" y="520" font-size="10" fill="#888">最优配对</text>
  <text x="380" y="520" font-size="10" fill="#aaa">L=left指针, R=right指针</text>
</svg>
