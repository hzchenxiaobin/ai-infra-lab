<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：贪心回溯——从左到右填，每格从大到小试</text>

  <!-- ===== Greedy order box (top left) ===== -->
  <rect x="30" y="48" width="200" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="42" y="68" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">贪心试填顺序</text>
  <g filter="url(#rough2)" font-size="13" font-weight="bold" text-anchor="middle">
    <rect x="42" y="78" width="28" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="56" y="96" fill="#d6a040">n</text>
    <text x="84" y="96" fill="#888" font-size="11">→</text>
    <rect x="92" y="78" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="106" y="96" fill="#446688">…</text>
    <text x="134" y="96" fill="#888" font-size="11">→</text>
    <rect x="142" y="78" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="156" y="96" fill="#446688">2</text>
    <text x="184" y="96" fill="#888" font-size="11">→</text>
    <rect x="192" y="78" width="28" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="206" y="96" fill="#4a7a3a">1</text>
  </g>
  <text x="130" y="116" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">优先放大数，1 兜底</text>

  <!-- ===== Rules box (top right) ===== -->
  <rect x="250" y="48" width="300" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="262" y="68" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">放置规则</text>
  <text x="262" y="86" font-size="10" fill="#555" filter="url(#rough2)">• 数 i ≥ 2：放 pos 和 pos+i（距离 = i）</text>
  <text x="262" y="100" font-size="10" fill="#555" filter="url(#rough2)">• 数 1：只放一次，无距离约束</text>
  <text x="262" y="114" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ 第一个合法解 = 字典序最大解</text>

  <!-- ===== Sequence row (n=5, length 9) ===== -->
  <text x="30" y="156" font-size="11" fill="#888" filter="url(#rough2)">ans (n=5)</text>
  <g filter="url(#rough2)" font-size="13" font-weight="bold" text-anchor="middle">
    <!-- 9 slots: pos 0..8 -->
    <rect x="60" y="142" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <text x="82" y="164" fill="#446688">5</text>
    <rect x="104" y="142" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="126" y="164" fill="#d6a040">3</text>
    <rect x="148" y="142" width="44" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="170" y="164" fill="#bbb">_</text>
    <rect x="192" y="142" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="214" y="164" fill="#d6a040">3</text>
    <rect x="236" y="142" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <text x="258" y="164" fill="#446688">5</text>
    <rect x="280" y="142" width="44" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="302" y="164" fill="#bbb">_</text>
    <rect x="324" y="142" width="44" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="346" y="164" fill="#bbb">_</text>
    <rect x="368" y="142" width="44" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="390" y="164" fill="#bbb">_</text>
  </g>
  <!-- index ticks -->
  <g filter="url(#rough2)" font-size="9" fill="#aaa" text-anchor="middle">
    <text x="82" y="188">0</text>
    <text x="126" y="188">1</text>
    <text x="170" y="188">2</text>
    <text x="214" y="188">3</text>
    <text x="258" y="188">4</text>
    <text x="302" y="188">5</text>
    <text x="346" y="188">6</text>
    <text x="390" y="188">7</text>
  </g>

  <!-- Distance arrows for 5 -->
  <path d="M 82 200 L 82 212" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 82 212 L 302 212" stroke="#446688" stroke-width="2" fill="none" stroke-dasharray="5 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 302 212 L 302 200" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <rect x="170" y="206" width="44" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="192" y="219" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">距离 = 5</text>

  <!-- Distance arrows for 3 -->
  <path d="M 126 230 L 126 242" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 126 242 L 214 242" stroke="#d6a040" stroke-width="2" fill="none" stroke-dasharray="5 3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 214 242 L 214 230" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <rect x="148" y="236" width="44" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="170" y="249" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">距离 = 3</text>

  <!-- ===== Filling process text ===== -->
  <text x="30" y="282" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">填入过程（贪心：大数优先）</text>

  <!-- Step 1: place 5 -->
  <g filter="url(#rough2)">
    <rect x="30" y="292" width="240" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="40" y="311" font-size="10" fill="#446688" font-weight="bold">① pos=0: 试 5 → 放位 0 和 5</text>
  </g>
  <!-- Step 2: place 3 -->
  <g filter="url(#rough2)">
    <rect x="30" y="324" width="240" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <text x="40" y="343" font-size="10" fill="#d6a040" font-weight="bold">② pos=1: 4 冲突(位5已占) → 试 3 ✓</text>
  </g>
  <!-- Step 3: continue -->
  <g filter="url(#rough2)">
    <rect x="30" y="356" width="240" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="40" y="375" font-size="10" fill="#4a7a3a" font-weight="bold">③ 继续填小数，直到 pos=8 完成</text>
  </g>

  <!-- ===== Right: why greedy works ===== -->
  <rect x="300" y="288" width="250" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="312" y="308" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">为什么贪心 = 字典序最大？</text>
  <text x="312" y="326" font-size="10" fill="#555" filter="url(#rough2)">DFS 决策树叶子按访问</text>
  <text x="312" y="340" font-size="10" fill="#555" filter="url(#rough2)">顺序天然构成字典序降序</text>
  <text x="312" y="358" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ 第一个合法叶子</text>
  <text x="312" y="372" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">  = 字典序最大解</text>

  <!-- Footer -->
  <text x="290" y="408" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">放数 i 时同时占 pos 和 pos+i，距离约束一步到位；贪心找到第一个解即返回</text>
</svg>
