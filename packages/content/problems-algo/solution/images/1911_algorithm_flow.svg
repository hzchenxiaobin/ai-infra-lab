<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrF" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    算法流程：两状态 DP 一趟扫描
  </text>

  <!-- Step 1: Initialize -->
  <rect x="160" y="50" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="75" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">初始化 even = 0, odd = 0</text>
  <line x1="260" y1="90" x2="260" y2="110" stroke="#446688" stroke-width="1.5" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Step 2: Loop decision -->
  <polygon points="260,112 370,160 260,208 150,160" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="156" text-anchor="middle" font-size="12" fill="#7a5a20" filter="url(#rough2)">还有未处理的</text>
  <text x="260" y="174" text-anchor="middle" font-size="12" fill="#7a5a20" filter="url(#rough2)">元素 num ?</text>

  <!-- Yes branch: process num -->
  <line x1="260" y1="208" x2="260" y2="228" stroke="#446688" stroke-width="1.5" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="272" y="222" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- even transition -->
  <rect x="80" y="230" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="170" y="248" text-anchor="middle" font-size="11" fill="#3a5a2a" filter="url(#rough2)">new_even = max(even,</text>
  <text x="170" y="263" text-anchor="middle" font-size="11" fill="#3a5a2a" filter="url(#rough2)">odd + num)</text>

  <!-- odd transition -->
  <rect x="280" y="230" width="180" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="370" y="248" text-anchor="middle" font-size="11" fill="#7a5a20" filter="url(#rough2)">new_odd = max(odd,</text>
  <text x="370" y="263" text-anchor="middle" font-size="11" fill="#7a5a20" filter="url(#rough2)">even − num)</text>

  <!-- Update -->
  <line x1="170" y1="270" x2="260" y2="288" stroke="#446688" stroke-width="1.5" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <line x1="370" y1="270" x2="260" y2="288" stroke="#446688" stroke-width="1.5" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <rect x="150" y="290" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="312" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">even = new_even, odd = new_odd</text>

  <!-- Loop back arrow -->
  <path d="M 150 307 Q 60 307 60 160 Q 60 160 150 160" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="48" y="240" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">继续</text>
  <text x="48" y="254" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">下个</text>
  <text x="48" y="268" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">num</text>

  <!-- No branch: return -->
  <line x1="370" y1="160" x2="430" y2="160" stroke="#446688" stroke-width="1.5" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="398" y="152" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="430" y="141" width="80" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="470" y="158" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回</text>
  <text x="470" y="172" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">even</text>

  <!-- Summary box -->
  <rect x="60" y="360" width="400" height="80" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="382" text-anchor="middle" font-size="12" fill="#7a3a38" font-weight="bold" filter="url(#rough2)">
    ⚠ 必须用临时变量同时更新
  </text>
  <text x="260" y="400" text-anchor="middle" font-size="11" fill="#7a3a38" filter="url(#rough2)">
    even 和 odd 的转移互相依赖对方的旧值
  </text>
  <text x="260" y="416" text-anchor="middle" font-size="11" fill="#7a3a38" filter="url(#rough2)">
    先算 new_even、new_odd，再同时赋值
  </text>
  <text x="260" y="432" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">
    否则 even 更新后 odd 会用到新 even，逻辑出错
  </text>
</svg>
