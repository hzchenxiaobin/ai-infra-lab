<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">两个独立瓶颈，答案取短板 min</text>

  <!-- ===== 左框：空间瓶颈 ===== -->
  <rect x="24" y="42" width="226" height="216" rx="10" fill="#ffffff" stroke="#999" stroke-width="1.2" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="137" y="64" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">① 空间瓶颈：格子数</text>

  <!-- 3x3 甲板网格 -->
  <rect x="67" y="78" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="116" y="78" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="165" y="78" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="67" y="127" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="116" y="127" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="165" y="127" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="67" y="176" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="116" y="176" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="165" y="176" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 已装的 4 个集装箱（橙色内块） -->
  <rect x="72" y="83" width="32" height="32" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="88" y="104" text-anchor="middle" font-size="12" fill="#8a6d3a" filter="url(#rough2)">w</text>
  <rect x="121" y="83" width="32" height="32" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="137" y="104" text-anchor="middle" font-size="12" fill="#8a6d3a" filter="url(#rough2)">w</text>
  <rect x="170" y="83" width="32" height="32" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="186" y="104" text-anchor="middle" font-size="12" fill="#8a6d3a" filter="url(#rough2)">w</text>
  <rect x="72" y="132" width="32" height="32" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="88" y="153" text-anchor="middle" font-size="12" fill="#8a6d3a" filter="url(#rough2)">w</text>

  <text x="137" y="244" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">n×n = 3×3 = 9 个格子</text>

  <!-- ===== 右框：重量瓶颈 ===== -->
  <rect x="270" y="42" width="226" height="216" rx="10" fill="#ffffff" stroke="#999" stroke-width="1.2" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="383" y="64" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">② 重量瓶颈：承重预算</text>

  <!-- 5 个候选箱槽：前 4 个装得下，第 5 个超载 -->
  <rect x="286" y="78" width="34" height="36" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="303" y="101" text-anchor="middle" font-size="12" fill="#8a6d3a" filter="url(#rough2)">5</text>
  <rect x="326" y="78" width="34" height="36" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="343" y="101" text-anchor="middle" font-size="12" fill="#8a6d3a" filter="url(#rough2)">5</text>
  <rect x="366" y="78" width="34" height="36" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="383" y="101" text-anchor="middle" font-size="12" fill="#8a6d3a" filter="url(#rough2)">5</text>
  <rect x="406" y="78" width="34" height="36" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="423" y="101" text-anchor="middle" font-size="12" fill="#8a6d3a" filter="url(#rough2)">5</text>
  <rect x="446" y="78" width="34" height="36" rx="3" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 452 84 L 474 108 M 474 84 L 452 108" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>

  <text x="383" y="136" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">每个恰好重 w = 5</text>
  <text x="383" y="156" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">总重 ≤ maxWeight = 20</text>
  <text x="383" y="184" text-anchor="middle" font-size="13" fill="#8a6d3a" font-weight="bold" filter="url(#rough2)">⌊20 / 5⌋ = 4 个</text>
  <text x="383" y="210" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">第 5 个 → 总重 25 &gt; 20 ✗</text>

  <!-- ===== 汇流取 min ===== -->
  <path d="M 137 262 C 137 284, 148 298, 160 300" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 383 262 C 383 284, 372 298, 360 300" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="168" y="284" width="184" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="304" text-anchor="middle" font-size="13" fill="#8a6d3a" font-weight="bold" filter="url(#rough2)">答案 = min(9, 4)</text>

  <path d="M 260 316 L 260 332" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <rect x="168" y="334" width="184" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="353" text-anchor="middle" font-size="13" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">最多装 4 个集装箱</text>
</svg>
