<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：每个非零数位恰好贡献一个分量</text>

  <!-- 数位标签 -->
  <text x="172" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">百位 ×100</text>
  <text x="260" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">十位 ×10</text>
  <text x="348" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">个位 ×1</text>

  <!-- n = 537 的三个数位 -->
  <text x="118" y="77" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">n =</text>
  <rect x="150" y="52" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="172" y="76" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="238" y="52" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="76" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="326" y="52" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="348" y="76" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">7</text>

  <!-- 数位 -> 分量 -->
  <path d="M 172 90 L 172 120" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 260 90 L 260 120" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 348 90 L 348 120" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="134" y="124" width="76" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="172" y="143" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">500</text>
  <text x="172" y="160" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">5 × 10²</text>

  <text x="216" y="151" text-anchor="middle" font-size="14" fill="#666" filter="url(#rough2)">+</text>

  <rect x="222" y="124" width="76" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="143" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">30</text>
  <text x="260" y="160" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">3 × 10¹</text>

  <text x="304" y="151" text-anchor="middle" font-size="14" fill="#666" filter="url(#rough2)">+</text>

  <rect x="310" y="124" width="76" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="348" y="143" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="348" y="160" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">7 × 10⁰</text>

  <!-- 求和 -->
  <path d="M 260 168 L 260 190" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <rect x="100" y="192" width="320" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="212" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">500 + 30 + 7 = 537</text>
  <text x="260" y="230" text-anchor="middle" font-size="11" fill="#b3541e" filter="url(#rough2)">分量个数 = 非零数位个数 = 3（最少）</text>

  <!-- 零位与进位警示 -->
  <rect x="36" y="258" width="448" height="88" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="281" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠️ 零位不产生分量，进位也省不出分量</text>
  <text x="260" y="304" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">102 → 1｜0｜2 → 跳过十位 0 → [100, 2]</text>
  <text x="260" y="330" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">19 = 10 + 9（2 个）优于 9 + 9 + 1（3 个）</text>
</svg>
