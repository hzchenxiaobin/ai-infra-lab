<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：排序后线性扫描，能买则买</text>

  <!-- Step 1: build freq -->
  <rect x="60" y="46" width="180" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="64" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">1. 建频率表 freq[]</text>
  <text x="150" y="80" text-anchor="middle" font-size="10" fill="#555">遍历 costs，freq[c]++，O(n)</text>

  <!-- Arrow down -->
  <path d="M 150 92 L 150 108" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: price from 1 to V -->
  <rect x="60" y="110" width="180" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="128" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">2. price 从 1 遍历到 V</text>
  <text x="150" y="144" text-anchor="middle" font-size="10" fill="#555">跳过 freq[price] == 0 的价位</text>

  <!-- Arrow right -->
  <path d="M 242 132 L 318 132" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: price > coins? -->
  <polygon points="380,108 440,132 380,156 320,132" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="128" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">price &gt;</text>
  <text x="380" y="142" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">coins?</text>

  <!-- Yes branch: break -->
  <path d="M 440 132 L 470 132 L 470 200" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="475" y="150" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="424" y="200" width="92" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="470" y="222" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">break 停止</text>

  <!-- No branch: down -->
  <path d="M 380 156 L 380 184" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="392" y="176" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- Step 3: compute can -->
  <rect x="220" y="186" width="240" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="340" y="204" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3. can = min(freq[price], coins / price)</text>
  <text x="340" y="220" text-anchor="middle" font-size="10" fill="#555">同价位一次批量购买，O(1)</text>

  <!-- Arrow down -->
  <path d="M 340 232 L 340 250" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: update ans & coins -->
  <rect x="220" y="252" width="240" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="340" y="270" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4. ans += can;  coins -= can * price</text>
  <text x="340" y="286" text-anchor="middle" font-size="10" fill="#555">累计数量，扣减预算</text>

  <!-- Loop back arrow -->
  <path d="M 220 274 L 150 274 L 150 154" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <text x="100" y="266" font-size="10" fill="#888">下一个 price</text>

  <!-- Final return -->
  <rect x="60" y="312" width="180" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="150" y="330" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">5. 返回 ans</text>
  <text x="150" y="346" text-anchor="middle" font-size="10" fill="#555">最长可负担前缀长度</text>

  <path d="M 470 236 L 470 290 L 240 290 L 240 334 L 240 334" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <text x="380" y="284" font-size="10" fill="#b85450">break → 返回</text>

  <!-- Footer note -->
  <text x="260" y="372" text-anchor="middle" font-size="10" fill="#aaa">计数排序版：O(n + V)；库排序版：O(n log n)，逐支累加无批量</text>
</svg>
