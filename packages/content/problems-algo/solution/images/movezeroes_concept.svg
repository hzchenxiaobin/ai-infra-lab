<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">双指针划分三段：已写好 / 0 / 未扫描</text>

  <!-- array cells -->
  <!-- [0, slow): done non-zero (green) -->
  <rect x="40" y="58" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="65" y="79" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="95" y="58" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="79" text-anchor="middle" font-size="12" fill="#333">3</text>
  <!-- [slow, fast): zeros (red) -->
  <rect x="150" y="58" width="50" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="79" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="205" y="58" width="50" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="79" text-anchor="middle" font-size="12" fill="#333">0</text>
  <!-- [fast, n): unscanned (grey) -->
  <rect x="260" y="58" width="50" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="285" y="79" text-anchor="middle" font-size="12" fill="#aaa">?</text>
  <rect x="315" y="58" width="50" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="79" text-anchor="middle" font-size="12" fill="#aaa">?</text>

  <!-- index ticks -->
  <text x="65" y="108" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="120" y="108" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="175" y="108" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="230" y="108" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="285" y="108" text-anchor="middle" font-size="9" fill="#aaa">4</text>
  <text x="340" y="108" text-anchor="middle" font-size="9" fill="#aaa">5</text>

  <!-- pointer labels -->
  <text x="150" y="132" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">slow</text>
  <path d="M 150 136 L 150 116" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="260" y="132" text-anchor="middle" font-size="11.5" fill="#888" font-weight="bold">fast</text>
  <path d="M 260 136 L 260 116" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>

  <!-- segment brackets -->
  <path d="M 42 50 L 42 44 L 143 44 L 143 50" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="92" y="38" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">已写好（非零）</text>
  <path d="M 152 50 L 152 44 L 253 44 L 253 50" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="203" y="38" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">0（待填末尾）</text>
  <path d="M 262 50 L 262 44 L 363 44 L 363 50" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="313" y="38" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">未扫描</text>

  <!-- rule box -->
  <rect x="30" y="156" width="460" height="78" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="180" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">规则：fast 遇到非零 → 写到 slow → slow++</text>
  <text x="260" y="200" text-anchor="middle" font-size="11" fill="#555">fast 遇到 0 → 跳过</text>
  <text x="260" y="220" text-anchor="middle" font-size="11" fill="#555">扫完后 [slow, n) 全部补 0</text>

  <!-- invariant -->
  <rect x="30" y="248" width="460" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="269" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">不变量：[0, slow) 始终是已就位的非零元素</text>
  <text x="260" y="287" text-anchor="middle" font-size="11" fill="#888">写入顺序 = 原相对顺序 → 天然保序</text>

  <!-- footer -->
  <rect x="30" y="308" width="460" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="331" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">一次扫描 + 末尾补零：O(n) 时间，O(1) 空间</text>
</svg>
