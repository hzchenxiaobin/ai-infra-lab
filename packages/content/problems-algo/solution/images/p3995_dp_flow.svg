<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 404"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="404" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：前缀 DP——白嫖跳 1 格，或一步贴 1 条规则</text>

  <!-- start box -->
  <rect x="24" y="48" width="130" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="89" y="66" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">dp[0] = 0</text>
  <text x="89" y="84" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">枚举 i = 0 … n−1</text>

  <!-- fork to D1 -->
  <path d="M 154 66 L 168 66" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- D1 diamond -->
  <polygon points="172,66 244,38 316,66 244,94" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="244" y="62" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">source[i] ==</text>
  <text x="244" y="78" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">target[i] ?</text>
  <text x="244" y="108" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">否 ⇒ 无转移</text>

  <!-- B1 -->
  <path d="M 316 66 L 340 66" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="328" y="58" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="344" y="44" width="164" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="426" y="62" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">dp[i+1] ← min(dp[i+1], dp[i])</text>
  <text x="426" y="80" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">（白嫖一格，零成本）</text>

  <!-- fork elbow to D2 -->
  <path d="M 89 92 L 89 170 L 158 170" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="118" y="132" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">每个 i 尝试两种转移</text>

  <!-- D2 diamond -->
  <polygon points="162,170 252,124 342,170 252,216" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="252" y="158" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">规则 r 在 i 处可用？</text>
  <text x="252" y="175" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">pattern 匹配 source 段</text>
  <text x="252" y="190" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">且 replacement == target 段</text>
  <text x="252" y="232" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">否 ⇒ 换下一条规则</text>

  <!-- B2 -->
  <path d="M 342 170 L 364 170" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="353" y="162" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="366" y="146" width="152" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="442" y="164" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">dp[i+L] ← dp[i] + costs[r]</text>
  <text x="442" y="179" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">+ pattern 中 '*' 个数</text>
  <text x="442" y="192" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">（L = pattern 长度）</text>

  <!-- dp bar walkthrough -->
  <text x="260" y="250" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">演算示例 1：hello → world（n = 5）</text>

  <rect x="112" y="258" width="54" height="42" fill="#e8f0fe" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="166" y="258" width="54" height="42" fill="#ffffff" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="220" y="258" width="54" height="42" fill="#e8f0fe" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="274" y="258" width="54" height="42" fill="#ffffff" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="328" y="258" width="54" height="42" fill="#ffffff" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="382" y="258" width="54" height="42" fill="#e8f0fe" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="139" y="272" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">dp[0]</text>
  <text x="193" y="272" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">dp[1]</text>
  <text x="247" y="272" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">dp[2]</text>
  <text x="301" y="272" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">dp[3]</text>
  <text x="355" y="272" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">dp[4]</text>
  <text x="409" y="272" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">dp[5]</text>
  <text x="139" y="292" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="193" y="292" text-anchor="middle" font-size="14" fill="#aaa" font-weight="bold" filter="url(#rough2)">∞</text>
  <text x="247" y="292" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="301" y="292" text-anchor="middle" font-size="14" fill="#aaa" font-weight="bold" filter="url(#rough2)">∞</text>
  <text x="355" y="292" text-anchor="middle" font-size="14" fill="#aaa" font-weight="bold" filter="url(#rough2)">∞</text>
  <text x="409" y="292" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">7</text>

  <!-- transition arcs -->
  <path d="M 139 302 C 139 324, 247 324, 247 302" fill="none" stroke="#446688" stroke-width="2.2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="193" y="336" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">规则0 he→wo，花费 3</text>
  <path d="M 247 302 C 247 330, 409 330, 409 302" fill="none" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="330" y="344" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">规则1 llo→rld，花费 4</text>

  <text x="260" y="362" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">dp[i]：把 source 前 i 个字符变成 target 前 i 个字符的最小成本，∞ 表示该前缀无法对齐</text>

  <rect x="110" y="372" width="300" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="389" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">答案 = dp[n] = 7；dp[n] = ∞ 时返回 −1</text>
</svg>
