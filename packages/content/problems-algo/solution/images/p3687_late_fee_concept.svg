<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#b85450" stroke-width="1.6"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#4a7a3a" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="16" fill="#333"
        filter="url(#rough2)">核心观察：总罚款 = Σ max(0, 归还日 − 应还日)</text>

  <!-- 应还日旗帜 -->
  <rect x="170" y="66" width="140" height="26" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="240" y="84" text-anchor="middle" font-size="12" fill="#d6a040"
        filter="url(#rough2)">应还日 d = 5</text>
  <path d="M 240 92 L 260 92 L 260 210" stroke="#d6a040" stroke-width="1.4"
        stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>

  <!-- 书A：提前归还 -->
  <rect x="26" y="118" width="168" height="44" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="110" y="136" text-anchor="middle" font-size="11.5" fill="#4a7a3a"
        filter="url(#rough2)">书A：第 1 天还（提前）</text>
  <text x="110" y="153" text-anchor="middle" font-size="11.5" fill="#4a7a3a"
        filter="url(#rough2)">1 − 5 = −4 → 截断，罚 0 元</text>
  <path d="M 100 162 L 84 167" stroke="#4a7a3a" stroke-width="1.4"
        marker-end="url(#arrGreen)" filter="url(#rough2)"/>

  <!-- 书B：逾期归还 -->
  <rect x="332" y="58" width="172" height="44" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="418" y="76" text-anchor="middle" font-size="11.5" fill="#b85450"
        filter="url(#rough2)">书B：第 7 天还（逾期）</text>
  <text x="418" y="93" text-anchor="middle" font-size="11.5" fill="#b85450"
        filter="url(#rough2)">7 − 5 = +2 → 罚 2 元</text>
  <path d="M 412 102 L 354 161" stroke="#b85450" stroke-width="1.4"
        marker-end="url(#arrRed)" filter="url(#rough2)"/>

  <!-- 时间轴 -->
  <text x="452" y="150" text-anchor="end" font-size="11" fill="#446688"
        filter="url(#rough2)">时间轴 / 天</text>
  <path d="M 70 170 L 456 170" stroke="#446688" stroke-width="2"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#777">
    <line x1="80"  y1="163" x2="80"  y2="177" stroke="#999" stroke-width="1.2"/>
    <line x1="125" y1="163" x2="125" y2="177" stroke="#999" stroke-width="1.2"/>
    <line x1="170" y1="163" x2="170" y2="177" stroke="#999" stroke-width="1.2"/>
    <line x1="215" y1="163" x2="215" y2="177" stroke="#999" stroke-width="1.2"/>
    <line x1="260" y1="158" x2="260" y2="182" stroke="#d6a040" stroke-width="2"/>
    <line x1="305" y1="163" x2="305" y2="177" stroke="#999" stroke-width="1.2"/>
    <line x1="350" y1="163" x2="350" y2="177" stroke="#999" stroke-width="1.2"/>
    <line x1="395" y1="163" x2="395" y2="177" stroke="#999" stroke-width="1.2"/>
    <line x1="440" y1="163" x2="440" y2="177" stroke="#999" stroke-width="1.2"/>
    <text x="80"  y="192" text-anchor="middle">1</text>
    <text x="125" y="192" text-anchor="middle">2</text>
    <text x="170" y="192" text-anchor="middle">3</text>
    <text x="215" y="192" text-anchor="middle">4</text>
    <text x="260" y="192" text-anchor="middle" font-weight="bold" fill="#d6a040">5</text>
    <text x="305" y="192" text-anchor="middle">6</text>
    <text x="350" y="192" text-anchor="middle" font-weight="bold" fill="#b85450">7</text>
    <text x="395" y="192" text-anchor="middle">8</text>
    <text x="440" y="192" text-anchor="middle">9</text>
  </g>
  <ellipse cx="80" cy="170" rx="7" ry="7" fill="#e6f4ea" stroke="#4a7a3a"
           stroke-width="2" filter="url(#rough2)"/>
  <ellipse cx="350" cy="170" rx="7" ry="7" fill="#fce4ec" stroke="#b85450"
           stroke-width="2" filter="url(#rough2)"/>

  <!-- 逾期区间花括号 -->
  <g filter="url(#rough2)" stroke="#b85450" stroke-width="1.6" fill="none">
    <path d="M 260 202 L 260 210"/>
    <path d="M 260 206 L 350 206"/>
    <path d="M 350 202 L 350 210"/>
  </g>
  <text x="305" y="226" text-anchor="middle" font-size="11.5" fill="#b85450"
        filter="url(#rough2)">逾期 2 天 × 1 元/天 = 2 元</text>

  <!-- 闭式公式 -->
  <rect x="85" y="240" width="350" height="48" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="259" text-anchor="middle" font-size="13" fill="#446688"
        font-weight="bold" filter="url(#rough2)">总罚款 = Σ max(0, dates[i] − d)</text>
  <text x="260" y="278" text-anchor="middle" font-size="11" fill="#446688"
        filter="url(#rough2)">负差截断为 0：提前 / 当天归还共用 0 分支</text>

  <!-- 示例回代 -->
  <rect x="85" y="300" width="350" height="44" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="11.5" fill="#4a7a3a"
        filter="url(#rough2)">[5,1,7] → 0 + 2 = 2；[1,1] → 0（当天还）</text>
  <text x="260" y="336" text-anchor="middle" font-size="11" fill="#4a7a3a"
        filter="url(#rough2)">max(0,·) 一并吸收负差与零差，代码零特判</text>
</svg>
