<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：前缀哈希 + 双哈希去重</text>

  <!-- Step 1: Precompute prefix hash -->
  <rect x="140" y="46" width="280" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">① 预处理前缀哈希数组 h1, h2 与幂次数组 p1, p2</text>
  <text x="280" y="82" text-anchor="middle" font-size="10.5" fill="#555">h[k+1] = (h[k] · B + c) mod M，p[k+1] = p[k] · B mod M</text>

  <!-- arrow -->
  <path d="M 280 94 L 280 108" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: Enumerate (i, L) pairs -->
  <rect x="140" y="112" width="280" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="132" text-anchor="middle" font-size="12" fill="#335" font-weight="bold">② 枚举所有 (i, L) 对：i ∈ [0,n), L ∈ [1, (n−i)/2]</text>
  <text x="280" y="148" text-anchor="middle" font-size="10.5" fill="#555">子串 text[i:i+2L] 的前半 = text[i:i+L]，后半 = text[i+L:i+2L]</text>

  <!-- arrow -->
  <path d="M 280 160 L 280 174" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 3: Compare hashes -->
  <rect x="120" y="178" width="320" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="198" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold">③ O(1) 比较两半的哈希：hash(i,i+L) vs hash(i+L,i+2L)</text>
  <text x="280" y="214" text-anchor="middle" font-size="10.5" fill="#555">双哈希（M1=1e9+7, M2=1e9+9）同时匹配才算相等</text>

  <!-- arrow to diamond -->
  <path d="M 280 226 L 280 242" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="280,246 380,294 280,342 180,294" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="290" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">双哈希</text>
  <text x="280" y="306" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">均相等？</text>

  <!-- Yes branch (right) -->
  <path d="M 380 294 L 440 294" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="408" y="288" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是 ✓</text>
  <rect x="430" y="272" width="118" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="489" y="290" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">是循环子串</text>
  <text x="489" y="306" text-anchor="middle" font-size="10.5" fill="#555">全串哈希加入 set</text>

  <!-- No branch (left) -->
  <path d="M 180 294 L 120 294" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="152" y="288" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否 ✗</text>
  <rect x="14" y="272" width="106" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="67" y="290" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">非循环串</text>
  <text x="67" y="306" text-anchor="middle" font-size="10.5" fill="#555">跳过</text>

  <!-- loop back arrow -->
  <path d="M 489 272 L 489 136 L 420 136" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <path d="M 67 272 L 67 136 L 140 136" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <text x="280" y="264" text-anchor="middle" font-size="9.5" fill="#aaa">遍历所有 (i, L) ↑</text>

  <!-- arrow down to return -->
  <path d="M 280 342 L 280 382" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="300" y="366" font-size="10" fill="#aaa">遍历结束</text>

  <!-- Step 4: return -->
  <rect x="140" y="386" width="280" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="411" text-anchor="middle" font-size="13" fill="#3a5a2a" font-weight="bold">④ 返回 set.size()（不同循环子串数）</text>

  <!-- footer note -->
  <rect x="60" y="436" width="440" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="449" text-anchor="middle" font-size="10.5" fill="#666">O(n²) 对 (i,L) × O(1) 哈希比较 = O(n²) 总时间</text>
</svg>
