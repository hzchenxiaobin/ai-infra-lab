<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 392" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="392" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：固定中间 j，左右两侧各自取最值，互不干扰</text>

  <!-- array: nums = [2,3,1,5,4] -->
  <rect x="60" y="48" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="85" y="70" text-anchor="middle" font-size="12.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="115" y="48" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="140" y="70" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="170" y="48" width="50" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="195" y="70" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="225" y="48" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="70" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="280" y="48" width="50" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="305" y="70" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>

  <!-- index labels -->
  <text x="85" y="96" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="140" y="96" text-anchor="middle" font-size="10" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1 ← j</text>
  <text x="195" y="96" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>
  <text x="250" y="96" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="305" y="96" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">4</text>

  <!-- region brackets -->
  <path d="M 85 112 C 85 122, 60 122, 60 132" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 85 112 C 85 122, 110 122, 110 132" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="85" y="148" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">左侧：&lt; 3 的最大值</text>
  <text x="85" y="164" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">greatest_left = 2</text>

  <path d="M 250 112 C 250 124, 330 124, 330 136" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 305 112 C 305 124, 330 124, 330 136" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="330" y="152" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">右侧：后缀最大 rmax[1] = 5</text>
  <text x="330" y="168" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">校验 3 &lt; 5 ✓（严格递增）</text>

  <!-- formula box -->
  <rect x="30" y="196" width="500" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="218" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">候选 = greatest_left − nums[j] + rmax[j] = 2 − 3 + 5</text>
  <text x="280" y="240" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">= 4，对应三元组 (i, j, k) = (0, 1, 3)：2 &lt; 3 &lt; 5 ✓</text>

  <!-- middle annotation -->
  <path d="M 140 44 C 145 32, 175 32, 182 44" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="161" y="28" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">被减项</text>

  <!-- note -->
  <rect x="30" y="268" width="500" height="104" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="280" y="290" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">💡 条件在 j 处解耦：i 只要求「在左边且更小」，k 只要求「在右边且更大」，</text>
  <text x="280" y="308" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">两边的最优选择互不影响，可各自取最值后拼成候选——</text>
  <text x="280" y="326" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">左侧用「有序集合二分找前驱」（不能直接前缀 max，它可能 ≥ nums[j]），</text>
  <text x="280" y="344" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">右侧用「后缀最大值」+ 一个比较即可保合法，</text>
  <text x="280" y="362" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">每个 j 由 O(n) 级信息压成 O(log n) 级查询。</text>
</svg>
