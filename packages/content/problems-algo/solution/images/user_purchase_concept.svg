<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：按 (user_id, spend_date) 分组判定平台归属</text>

  <!-- 分组说明 -->
  <rect x="40" y="48" width="520" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="73" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">GROUP BY user_id, spend_date → 每人每天合并为一个分类</text>

  <!-- 三种情况 -->
  <!-- 情况1: only mobile -->
  <text x="50" y="116" font-size="11.5" fill="#888">情况①：仅有 mobile 记录</text>
  <rect x="50" y="124" width="150" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="125" y="146" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">user 2, 07-01</text>
  <rect x="68" y="154" width="114" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="125" y="169" text-anchor="middle" font-size="10.5" fill="#333">mobile, 100</text>
  <text x="125" y="196" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">→ mobile only</text>

  <!-- 情况2: only desktop -->
  <text x="225" y="116" font-size="11.5" fill="#888">情况②：仅有 desktop 记录</text>
  <rect x="225" y="124" width="150" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="146" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">user 3, 07-01</text>
  <rect x="243" y="154" width="114" height="22" fill="#fff" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="300" y="169" text-anchor="middle" font-size="10.5" fill="#333">desktop, 100</text>
  <text x="300" y="196" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">→ desktop only</text>

  <!-- 情况3: both -->
  <text x="400" y="116" font-size="11.5" fill="#888">情况③：两平台都有</text>
  <rect x="400" y="124" width="160" height="86" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="480" y="146" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">user 1, 07-01</text>
  <rect x="416" y="154" width="60" height="22" fill="#fff" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="446" y="169" text-anchor="middle" font-size="10" fill="#333">mobile,100</text>
  <rect x="484" y="154" width="68" height="22" fill="#fff" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="518" y="169" text-anchor="middle" font-size="10" fill="#333">desktop,100</text>
  <text x="480" y="196" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">→ both (amount=200)</text>

  <!-- 判定公式 -->
  <path d="M 300 214 L 300 236" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60" y="240" width="480" height="56" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="80" y="262" font-size="11.5" fill="#555" font-weight="bold">💡 判定公式（COUNT(platform) 只有 1 或 2）：</text>
  <text x="80" y="280" font-size="11" fill="#888">CASE WHEN COUNT(platform) = 2 THEN 'both' ELSE MAX(platform) END</text>

  <!-- 关键难点 -->
  <path d="M 300 298 L 300 320" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="40" y="324" width="520" height="118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="60" y="346" font-size="12" fill="#d6a040" font-weight="bold">⚠️ 关键难点：每个日期必须输出 3 行（desktop / mobile / both）</text>
  <text x="60" y="366" font-size="10.5" fill="#666">若某日无人 "both"，普通 GROUP BY 会直接丢失该行</text>
  <text x="60" y="384" font-size="10.5" fill="#666">→ 题目要求输出 both, 0, 0（补零行）</text>
  <text x="60" y="406" font-size="10.5" fill="#b85450" font-weight="bold">解法：生成 (日期 × 3平台) 完整网格 → LEFT JOIN 聚合</text>
  <text x="60" y="426" font-size="10.5" fill="#888">IFNULL(SUM(amount), 0) + COUNT(user_id) 自动补零</text>
</svg>
