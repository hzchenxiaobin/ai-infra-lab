<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="480" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：贪心两分支决策</text>
  <text x="270" y="46" text-anchor="middle" font-size="11" fill="#888">O(n) 一遍扫描，至多两次尝试</text>

  <!-- Step 1: input -->
  <rect x="190" y="62" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="80" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">输入：回文串 palindrome</text>
  <text x="270" y="95" text-anchor="middle" font-size="10" fill="#888">n = len(palindrome)</text>

  <path d="M 270 104 L 270 122" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: decision n==1 -->
  <polygon points="270,126 380,166 270,206 160,166" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="160" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">n == 1 ?</text>
  <text x="270" y="178" text-anchor="middle" font-size="9" fill="#888">单字符恒回文</text>

  <!-- Yes branch: return "" -->
  <path d="M 160 166 L 80 166 L 80 230" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="158" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="30" y="234" width="100" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="80" y="252" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 ""</text>
  <text x="80" y="267" text-anchor="middle" font-size="9" fill="#888">无法破坏</text>

  <!-- No branch -->
  <path d="M 380 166 L 460 166 L 460 222" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="158" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">否</text>

  <!-- Step 3: scan front half -->
  <rect x="370" y="226" width="180" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="460" y="246" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">扫描前半 i ∈ [0, n/2)</text>
  <text x="460" y="262" text-anchor="middle" font-size="10" fill="#888">half = n/2（排除奇数正中位）</text>
  <text x="460" y="276" text-anchor="middle" font-size="10" fill="#888">逐位检查 s[i]</text>

  <path d="M 460 284 L 460 302" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: decision s[i] != 'a' -->
  <polygon points="460,306 560,346 460,386 360,346" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="460" y="340" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">s[i] != 'a' ?</text>
  <text x="460" y="358" text-anchor="middle" font-size="9" fill="#888">找到首个非 'a'</text>

  <!-- Yes: change to a, return -->
  <path d="M 560 346 L 560 408" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="548" y="372" text-anchor="end" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="470" y="412" width="180" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="560" y="432" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">s[i] = 'a'，返回 s</text>
  <text x="560" y="450" text-anchor="middle" font-size="9" fill="#888">降为 'a'，靠前最优</text>

  <!-- No: continue or end -->
  <path d="M 360 346 L 300 346 L 300 408" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="332" y="338" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">否</text>

  <!-- loop back arrow to scan box -->
  <path d="M 300 346 L 300 256 L 370 256" stroke="#888" stroke-width="1.2" stroke-dasharray="3 2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="300" text-anchor="end" font-size="9" fill="#888">i++，继续扫描</text>

  <!-- Step 5: all 'a' -> last to 'b' -->
  <rect x="200" y="412" width="200" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="432" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">前半全 'a'：s[n−1] = 'b'</text>
  <text x="300" y="450" text-anchor="middle" font-size="9" fill="#888">末位升 'b'，靠后最优</text>
  <text x="300" y="404" text-anchor="middle" font-size="9" fill="#666">扫描结束未命中</text>

  <!-- final return from branch 2 -->
  <path d="M 200 437 L 150 437" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- legend -->
  <rect x="30" y="300" width="120" height="92" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="40" y="318" font-size="10" fill="#444" font-weight="bold">图例</text>
  <rect x="40" y="328" width="14" height="10" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="60" y="337" font-size="9" fill="#333">处理步骤</text>
  <polygon points="47,350 61,357 47,364 33,357" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="360" font-size="9" fill="#333">判定分支</text>
  <rect x="40" y="372" width="14" height="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="60" y="381" font-size="9" fill="#333">分支1 返回</text>
  <rect x="40" y="386" width="14" height="10" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="60" y="395" font-size="9" fill="#333">分支2/边界</text>
</svg>
