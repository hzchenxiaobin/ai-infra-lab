<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <g filter="url(#rough2)">
    <text x="260" y="18" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">算法流程：拆位 → 模意义快速幂 → 模加累加</text>

    <!-- 主流程列，中心 x=170 -->
    <ellipse cx="170" cy="46" rx="40" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="170" y="50" text-anchor="middle" font-size="11" fill="#333">开始</text>
    <path d="M 170 61 L 170 74" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)"/>

    <rect x="50" y="76" width="240" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="170" y="93" text-anchor="middle" font-size="10.5" fill="#333">对每个 v ∈ nums</text>
    <path d="M 170 102 L 170 115" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)"/>

    <rect x="50" y="117" width="240" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="170" y="134" text-anchor="middle" font-size="10.5" fill="#333">width = v mod 10；d = v ÷ 10</text>
    <path d="M 170 143 L 170 156" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)"/>

    <rect x="50" y="158" width="240" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="170" y="175" text-anchor="middle" font-size="10.5" fill="#333">数位数 L（hi 从 10 翻倍到 ≤ d）</text>
    <path d="M 170 184 L 170 197" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)"/>

    <rect x="50" y="199" width="240" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="170" y="213" text-anchor="middle" font-size="10.5" fill="#333">div = 10^(L−width)</text>
    <text x="170" y="227" text-anchor="middle" font-size="10.5" fill="#333">x = d ÷ div，y = d mod div</text>
    <path d="M 170 233 L 170 246" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)"/>

    <rect x="50" y="248" width="240" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="170" y="267" text-anchor="middle" font-size="10.5" fill="#7a5c1a" font-weight="bold">r = modpow(x, y, 10⁹+7)</text>
    <path d="M 170 278 L 170 291" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)"/>

    <rect x="50" y="293" width="240" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="170" y="310" text-anchor="middle" font-size="10.5" fill="#333">ans = (ans + r) mod (10⁹+7)</text>
    <path d="M 170 319 L 170 332" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)"/>

    <polygon points="170,334 232,364 170,394 108,364" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="170" y="368" text-anchor="middle" font-size="10.5" fill="#8a3a35">遍历完?</text>
    <path d="M 232 364 Q 290 364 290 100 L 262 100" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" stroke-dasharray="4 3"/>
    <text x="296" y="236" font-size="9.5" fill="#8a3a35" transform="rotate(-90 296 236)">否：取下一个 v</text>
    <path d="M 170 394 L 170 407" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)"/>

    <ellipse cx="170" cy="419" rx="46" ry="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="170" y="423" text-anchor="middle" font-size="10.5" fill="#2f5527">返回 ans</text>

    <!-- 右侧：快速幂内幕 -->
    <rect x="315" y="48" width="190" height="150" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="410" y="68" text-anchor="middle" font-size="11" fill="#7a5c1a" font-weight="bold">modpow(b, e) 内幕</text>
    <text x="328" y="88" font-size="9.5" fill="#7a5c1a">r = 1；b %= p</text>
    <text x="328" y="104" font-size="9.5" fill="#7a5c1a">while e &gt; 0:</text>
    <text x="340" y="120" font-size="9.5" fill="#7a5c1a">e 为奇 → r = r·b mod p</text>
    <text x="340" y="136" font-size="9.5" fill="#7a5c1a">b = b·b mod p（自平方）</text>
    <text x="340" y="152" font-size="9.5" fill="#7a5c1a">e ÷= 2（右移一位）</text>
    <text x="328" y="172" font-size="9.5" fill="#7a5c1a">指数二进制分解：</text>
    <text x="328" y="188" font-size="9.5" fill="#7a5c1a">x^y = ∏ 指数为 1 的位对应的平方项</text>

    <!-- 右下：复杂度与溢出 -->
    <rect x="315" y="215" width="190" height="102" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="410" y="235" text-anchor="middle" font-size="11" fill="#2f5527" font-weight="bold">复杂度 &amp; 溢出检查</text>
    <text x="328" y="255" font-size="9.5" fill="#3d5a33">· y &lt; 10⁹ &lt; 2³⁰ ⇒ 每元素 ≤ 30 次模乘</text>
    <text x="328" y="271" font-size="9.5" fill="#3d5a33">· 总计 O(n·30) ≈ 3×10⁶，毫秒级</text>
    <text x="328" y="287" font-size="9.5" fill="#3d5a33">· 模乘因子 &lt; 10⁹+7，积 &lt; 10¹⁸</text>
    <text x="328" y="303" font-size="9.5" fill="#3d5a33">  &lt; 2⁶³ ⇒ long long 安全</text>
    <text x="328" y="313" font-size="8.5" fill="#4a7a3a">  nums[i] 近 10¹⁵ 本身也要 64 位</text>
  </g>
</svg>
