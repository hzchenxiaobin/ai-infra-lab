<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">位掩码 DP：mask 记录「已分配的导师」，popcount 定「下一个学生」</text>

  <!-- Mentor labels (m = 3) -->
  <text x="40" y="68" font-size="12" fill="#888">导师:</text>
  <rect x="80" y="52" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="74" text-anchor="middle" font-size="13" fill="#333">M0</text>
  <rect x="180" y="52" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="74" text-anchor="middle" font-size="13" fill="#333">M1</text>
  <rect x="280" y="52" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="74" text-anchor="middle" font-size="13" fill="#333">M2</text>

  <!-- bit index -->
  <text x="40" y="108" font-size="11" fill="#888">bit 位:</text>
  <text x="120" y="108" text-anchor="middle" font-size="11" fill="#888">bit0</text>
  <text x="220" y="108" text-anchor="middle" font-size="11" fill="#888">bit1</text>
  <text x="320" y="108" text-anchor="middle" font-size="11" fill="#888">bit2</text>

  <!-- example mask = 101 (M0 and M2 assigned) -->
  <text x="40" y="142" font-size="12" fill="#888">mask 值:</text>
  <rect x="80" y="126" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="148" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="180" y="126" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="148" text-anchor="middle" font-size="14" fill="#999">0</text>
  <rect x="280" y="126" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="148" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <!-- annotation -->
  <rect x="380" y="52" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="415" y="74" text-anchor="middle" font-size="11" fill="#4a7a3a">= 已分配</text>
  <rect x="380" y="126" width="70" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="415" y="148" text-anchor="middle" font-size="11" fill="#b85450">= 空闲</text>

  <!-- reading the mask -->
  <rect x="40" y="180" width="440" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="203" text-anchor="middle" font-size="12" fill="#444">mask = 101₂ = 5 → M0、M2 已分配，M1 空闲</text>

  <!-- popcount -> student index -->
  <rect x="40" y="232" width="200" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="140" y="254" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">已分配数 = popcount(mask)</text>
  <text x="140" y="274" text-anchor="middle" font-size="11" fill="#555">popcount(101) = 2</text>
  <text x="140" y="292" text-anchor="middle" font-size="11" fill="#555">→ 已配了 2 名学生</text>

  <path d="M 240 267 L 258 267" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="260" y="232" width="220" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="370" y="254" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">下一个学生 i = popcount</text>
  <text x="370" y="274" text-anchor="middle" font-size="11" fill="#555">i = 2 → 给 S2 找导师</text>
  <text x="370" y="292" text-anchor="middle" font-size="11" fill="#b85450">只能选空闲的 M1</text>

  <!-- transition formula -->
  <rect x="40" y="320" width="440" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="340" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">转移：dp[mask | (1≪j)] = max(·, dp[mask] + score[i][j])</text>
  <text x="260" y="358" text-anchor="middle" font-size="10" fill="#555">i = popcount(mask)，j 遍历 mask 中为 0 的导师位</text>
</svg>
