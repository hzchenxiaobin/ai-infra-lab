<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：nums = [−3, 2, −3, 4, 2]，startValue = 5</text>
  <text x="310" y="44" text-anchor="middle" font-size="10.5" fill="#888">逐行累加前缀和，加 5 后每一步都 ≥ 1，最低谷恰好踩到 1</text>

  <!-- table header -->
  <rect x="60" y="60" width="500" height="28" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="110" y="78" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">步骤</text>
  <text x="205" y="78" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">nums[i]</text>
  <text x="295" y="78" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">prefix</text>
  <text x="390" y="78" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">prefix + 5</text>
  <text x="490" y="78" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">≥ 1 ?</text>

  <!-- row: 起点 -->
  <rect x="60" y="88" width="500" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="110" y="107" text-anchor="middle" font-size="11" fill="#888">起点</text>
  <text x="205" y="107" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="295" y="107" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="390" y="107" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">5</text>
  <text x="490" y="107" text-anchor="middle" font-size="11" fill="#4a7a3a">✓</text>

  <!-- row 1: -3 -->
  <rect x="60" y="118" width="500" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="110" y="137" text-anchor="middle" font-size="11" fill="#555">1</text>
  <text x="205" y="137" text-anchor="middle" font-size="11" fill="#446688">−3</text>
  <text x="295" y="137" text-anchor="middle" font-size="11" fill="#333">−3</text>
  <text x="390" y="137" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="490" y="137" text-anchor="middle" font-size="11" fill="#4a7a3a">✓</text>

  <!-- row 2: 2 -->
  <rect x="60" y="148" width="500" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="110" y="167" text-anchor="middle" font-size="11" fill="#555">2</text>
  <text x="205" y="167" text-anchor="middle" font-size="11" fill="#446688">2</text>
  <text x="295" y="167" text-anchor="middle" font-size="11" fill="#333">−1</text>
  <text x="390" y="167" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="490" y="167" text-anchor="middle" font-size="11" fill="#4a7a3a">✓</text>

  <!-- row 3: -3  (MIN highlight) -->
  <rect x="60" y="178" width="500" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="110" y="197" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="205" y="197" text-anchor="middle" font-size="11" fill="#446688">−3</text>
  <text x="295" y="197" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−4</text>
  <text x="390" y="197" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="490" y="197" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✓ 最低</text>
  <text x="295" y="174" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">★ 最低谷</text>

  <!-- row 4: 4 -->
  <rect x="60" y="208" width="500" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="110" y="227" text-anchor="middle" font-size="11" fill="#555">4</text>
  <text x="205" y="227" text-anchor="middle" font-size="11" fill="#446688">4</text>
  <text x="295" y="227" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="390" y="227" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="490" y="227" text-anchor="middle" font-size="11" fill="#4a7a3a">✓</text>

  <!-- row 5: 2 -->
  <rect x="60" y="238" width="500" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="110" y="257" text-anchor="middle" font-size="11" fill="#555">5</text>
  <text x="205" y="257" text-anchor="middle" font-size="11" fill="#446688">2</text>
  <text x="295" y="257" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="390" y="257" text-anchor="middle" font-size="11" fill="#333">7</text>
  <text x="490" y="257" text-anchor="middle" font-size="11" fill="#4a7a3a">✓</text>

  <!-- result box -->
  <rect x="60" y="290" width="500" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="310" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">minPrefix = −4（第 3 步）⟹ startValue = 1 − (−4) = 5</text>
  <text x="310" y="328" text-anchor="middle" font-size="10.5" fill="#555">第 3 步 prefix+5 = 1 恰好踩到下界，是“最紧约束”，其余步骤均宽裕</text>

  <!-- bottom note -->
  <rect x="60" y="350" width="500" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310" y="370" text-anchor="middle" font-size="10.5" fill="#555">验证 startValue = 4 不可行：第 3 步 −4 + 4 = 0 &lt; 1 ✗</text>
  <text x="310" y="388" text-anchor="middle" font-size="10.5" fill="#555">验证 startValue = 5 恰好可行：最低谷被抬到 1，再小一点就破下界</text>
  <text x="310" y="402" text-anchor="middle" font-size="10" fill="#888">⟹ 5 是最小的正数初始值</text>
</svg>
