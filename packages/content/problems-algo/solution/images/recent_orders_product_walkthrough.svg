<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：每商品 RANK 打号后过滤 rk = 1</text>

  <!-- ===== keyboard panel (top-left) ===== -->
  <rect x="20" y="44" width="255" height="130" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="147" y="62" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">keyboard (id=1) · 4 笔</text>
  <line x1="30" y1="68" x2="265" y2="68" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>
  <text x="40" y="84" font-size="9" fill="#888">rk</text>
  <text x="80" y="84" font-size="9" fill="#888">order_id</text>
  <text x="170" y="84" font-size="9" fill="#888">order_date</text>
  <text x="245" y="84" font-size="9" fill="#888" text-anchor="end">保留?</text>

  <text x="40" y="102" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="80" y="102" font-size="10" fill="#333">#6</text>
  <text x="170" y="102" font-size="10" fill="#333">2020-08-01</text>
  <text x="245" y="102" font-size="10" fill="#4a7a3a" font-weight="bold" text-anchor="end">✓</text>

  <text x="40" y="118" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="80" y="118" font-size="10" fill="#333">#7</text>
  <text x="170" y="118" font-size="10" fill="#333">2020-08-01</text>
  <text x="245" y="118" font-size="10" fill="#4a7a3a" font-weight="bold" text-anchor="end">✓</text>

  <text x="40" y="134" font-size="10" fill="#b85450" font-weight="bold">3</text>
  <text x="80" y="134" font-size="10" fill="#999">#1</text>
  <text x="170" y="134" font-size="10" fill="#999">2020-07-31</text>
  <text x="245" y="134" font-size="10" fill="#b85450" font-weight="bold" text-anchor="end">✗</text>

  <text x="40" y="150" font-size="10" fill="#b85450" font-weight="bold">4</text>
  <text x="80" y="150" font-size="10" fill="#999">#4</text>
  <text x="170" y="150" font-size="10" fill="#999">2020-07-29</text>
  <text x="245" y="150" font-size="10" fill="#b85450" font-weight="bold" text-anchor="end">✗</text>
  <text x="40" y="166" font-size="9" fill="#4a7a3a">最大日期并列 → #6 #7 同为 rk=1，均保留</text>

  <!-- ===== mouse panel (top-right) ===== -->
  <rect x="285" y="44" width="255" height="130" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="412" y="62" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">mouse (id=2) · 4 笔</text>
  <line x1="295" y1="68" x2="530" y2="68" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>
  <text x="305" y="84" font-size="9" fill="#888">rk</text>
  <text x="345" y="84" font-size="9" fill="#888">order_id</text>
  <text x="435" y="84" font-size="9" fill="#888">order_date</text>
  <text x="525" y="84" font-size="9" fill="#888" text-anchor="end">保留?</text>

  <text x="305" y="102" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="345" y="102" font-size="10" fill="#333">#8</text>
  <text x="435" y="102" font-size="10" fill="#333">2020-08-03</text>
  <text x="525" y="102" font-size="10" fill="#4a7a3a" font-weight="bold" text-anchor="end">✓</text>

  <text x="305" y="118" font-size="10" fill="#b85450" font-weight="bold">2</text>
  <text x="345" y="118" font-size="10" fill="#999">#2</text>
  <text x="435" y="118" font-size="10" fill="#999">2020-07-30</text>
  <text x="525" y="118" font-size="10" fill="#b85450" font-weight="bold" text-anchor="end">✗</text>

  <text x="305" y="134" font-size="10" fill="#b85450" font-weight="bold">3</text>
  <text x="345" y="134" font-size="10" fill="#999">#10</text>
  <text x="435" y="134" font-size="10" fill="#999">2020-07-15</text>
  <text x="525" y="134" font-size="10" fill="#b85450" font-weight="bold" text-anchor="end">✗</text>

  <text x="305" y="150" font-size="10" fill="#b85450" font-weight="bold">4</text>
  <text x="345" y="150" font-size="10" fill="#999">#5</text>
  <text x="435" y="150" font-size="10" fill="#999">2020-06-10</text>
  <text x="525" y="150" font-size="10" fill="#b85450" font-weight="bold" text-anchor="end">✗</text>
  <text x="305" y="166" font-size="9" fill="#4a7a3a">最大日期唯一 → 仅 #8 保留</text>

  <!-- ===== screen panel (bottom-left) ===== -->
  <rect x="20" y="184" width="255" height="108" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="147" y="202" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">screen (id=3) · 2 笔</text>
  <line x1="30" y1="208" x2="265" y2="208" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>

  <text x="40" y="226" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="80" y="226" font-size="10" fill="#333">#3</text>
  <text x="170" y="226" font-size="10" fill="#333">2020-08-29</text>
  <text x="245" y="226" font-size="10" fill="#4a7a3a" font-weight="bold" text-anchor="end">✓</text>

  <text x="40" y="242" font-size="10" fill="#b85450" font-weight="bold">2</text>
  <text x="80" y="242" font-size="10" fill="#999">#9</text>
  <text x="170" y="242" font-size="10" fill="#999">2020-08-07</text>
  <text x="245" y="242" font-size="10" fill="#b85450" font-weight="bold" text-anchor="end">✗</text>
  <text x="40" y="264" font-size="9" fill="#4a7a3a">最大日期唯一 → 仅 #3 保留</text>

  <!-- ===== hard disk panel (bottom-right) ===== -->
  <rect x="285" y="184" width="255" height="108" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="412" y="202" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">hard disk (id=4) · 0 笔</text>
  <line x1="295" y1="208" x2="530" y2="208" stroke="#b85450" stroke-width="0.5" filter="url(#rough2)"/>
  <text x="412" y="236" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">Orders 中无匹配行</text>
  <text x="412" y="256" text-anchor="middle" font-size="10" fill="#666">JOIN / GROUP BY 均不产出</text>
  <text x="412" y="274" text-anchor="middle" font-size="10" fill="#666">→ 不出现在结果中</text>

  <!-- ===== Bottom: final output ===== -->
  <rect x="40" y="304" width="480" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">最终输出：4 行（keyboard 2 + mouse 1 + screen 1，hard disk 排除）</text>
  <text x="280" y="340" text-anchor="middle" font-size="10" fill="#666">ORDER BY product_name ASC, order_date DESC</text>

  <!-- output rows preview -->
  <rect x="120" y="358" width="320" height="22" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="373" text-anchor="middle" font-size="9" fill="white" font-weight="bold">product_name</text>
  <text x="280" y="373" text-anchor="middle" font-size="9" fill="white" font-weight="bold">order_id</text>
  <text x="380" y="373" text-anchor="middle" font-size="9" fill="white" font-weight="bold">order_date</text>

  <rect x="120" y="380" width="320" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="180" y="394" text-anchor="middle" font-size="9" fill="#333">keyboard</text>
  <text x="280" y="394" text-anchor="middle" font-size="9" fill="#333">6</text>
  <text x="380" y="394" text-anchor="middle" font-size="9" fill="#333">2020-08-01</text>

  <rect x="120" y="400" width="320" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="180" y="414" text-anchor="middle" font-size="9" fill="#333">screen</text>
  <text x="280" y="414" text-anchor="middle" font-size="9" fill="#333">3</text>
  <text x="380" y="414" text-anchor="middle" font-size="9" fill="#333">2020-08-29</text>

  <text x="280" y="432" text-anchor="middle" font-size="9" fill="#888">…（共 4 行，keyboard 含并列两行）</text>
</svg>
