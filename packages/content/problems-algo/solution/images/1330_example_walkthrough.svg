<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrU" markerWidth="8" markerHeight="8" refX="4" refY="1" orient="auto">
      <path d="M0,8 L4,0 L8,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">各对区间与最大间隙 — nums = [2,4,9,24,2,1,10]</text>

  <!-- Vertical guide lines at key values -->
  <path d="M 110 48 L 110 225" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 215 48 L 215 225" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 440 48 L 440 225" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- j=0: (2,4) -> [2,4] -->
  <text x="48" y="68" font-size="10" fill="#888">j=0 (2,4)</text>
  <rect x="110" y="56" width="30" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="125" y="68" text-anchor="middle" font-size="8" fill="#4a7a3a">[2,4]</text>

  <!-- j=1: (4,9) -> [4,9] -->
  <text x="48" y="96" font-size="10" fill="#888">j=1 (4,9)</text>
  <rect x="140" y="84" width="75" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="177" y="96" text-anchor="middle" font-size="8" fill="#4a7a3a">[4,9]</text>

  <!-- j=2: (9,24) -> [9,24] HIGHLIGHTED (max lo) -->
  <text x="48" y="124" font-size="10" fill="#d6a040" font-weight="bold">j=2 (9,24)</text>
  <rect x="215" y="112" width="225" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="327" y="124" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">[9,24]</text>
  <text x="450" y="124" font-size="9" fill="#d6a040" font-weight="bold">lo=9</text>

  <!-- j=3: (24,2) -> [2,24] -->
  <text x="48" y="152" font-size="10" fill="#888">j=3 (24,2)</text>
  <rect x="110" y="140" width="330" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)" opacity="0.5"/>
  <text x="275" y="152" text-anchor="middle" font-size="8" fill="#446688">[2,24]</text>

  <!-- j=4: (2,1) -> [1,2] HIGHLIGHTED (min hi) -->
  <text x="48" y="180" font-size="10" fill="#b85450" font-weight="bold">j=4 (2,1)</text>
  <rect x="95" y="168" width="15" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="102" y="180" text-anchor="middle" font-size="7" fill="#b85450" font-weight="bold">[1,2]</text>
  <text x="118" y="180" font-size="9" fill="#b85450" font-weight="bold">hi=2</text>

  <!-- j=5: (1,10) -> [1,10] -->
  <text x="48" y="208" font-size="10" fill="#888">j=5 (1,10)</text>
  <rect x="95" y="196" width="135" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)" opacity="0.5"/>
  <text x="162" y="208" text-anchor="middle" font-size="8" fill="#446688">[1,10]</text>

  <!-- Gap arrow from j=4 hi(2) to j=2 lo(9) -->
  <path d="M 110 175 L 215 120" stroke="#b85450" stroke-width="2.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrU)" filter="url(#rough2)"/>
  <rect x="135" y="138" width="60" height="20" fill="#fff" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="165" y="152" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">gap=7</text>

  <!-- Number line -->
  <path d="M 80 230 L 460 230" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 80 225 L 80 235" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="248" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <path d="M 95 225 L 95 235" stroke="#aaa" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="95" y="248" text-anchor="middle" font-size="8" fill="#b85450">1</text>
  <path d="M 110 225 L 110 235" stroke="#aaa" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="110" y="248" text-anchor="middle" font-size="8" fill="#b85450">2</text>
  <path d="M 140 225 L 140 235" stroke="#aaa" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="140" y="248" text-anchor="middle" font-size="8" fill="#aaa">4</text>
  <path d="M 215 225 L 215 235" stroke="#aaa" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="215" y="248" text-anchor="middle" font-size="8" fill="#d6a040">9</text>
  <path d="M 230 225 L 230 235" stroke="#aaa" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="230" y="248" text-anchor="middle" font-size="8" fill="#aaa">10</text>
  <path d="M 440 225 L 440 235" stroke="#aaa" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="440" y="248" text-anchor="middle" font-size="8" fill="#aaa">24</text>

  <!-- Summary box -->
  <rect x="40" y="268" width="480" height="138" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="292" text-anchor="middle" font-size="11" fill="#666">j=2 的 lo=9 为前缀最大下界，j=4 的 hi=2 为前缀最小上界</text>
  <text x="280" y="312" text-anchor="middle" font-size="11" fill="#666">翻转 nums[3..4] = [24,2] → [2,24]，两边界对交叉匹配</text>
  <text x="280" y="340" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">内部增益 = 2 × (9 − 2) = 14</text>
  <text x="280" y="362" text-anchor="middle" font-size="11" fill="#888">边界情况最大增益 = 7</text>
  <text x="280" y="392" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">答案 = 54 + max(0, 7, 7, 14) = 54 + 14 = 68 ✓</text>
</svg>
