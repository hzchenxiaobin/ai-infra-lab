<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">DFS 搜索流程：通配符「.」分叉 + 短路返回</text>

  <!-- ===== center column: entry / diamond1 / process / diamond2 ===== -->
  <!-- entry -->
  <rect x="210" y="46" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="290" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">dfs(node, word, i)</text>

  <path d="M 290 76 L 290 100" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond1: i == len(word)? -->
  <polygon points="290,104 380,140 290,176 200,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="138" text-anchor="middle" font-size="11" fill="#333">i == len(word)?</text>
  <text x="290" y="152" text-anchor="middle" font-size="9" fill="#888">递归终止</text>

  <!-- Yes → return is_end -->
  <path d="M 380 140 L 440 140" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="412" y="134" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="440" y="124" width="120" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="500" y="144" text-anchor="middle" font-size="11" fill="#4a7a3a">return node.is_end</text>

  <!-- No ↓ -->
  <path d="M 290 176 L 290 200" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="298" y="192" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- process: c = word[i] -->
  <rect x="220" y="200" width="140" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="290" y="219" text-anchor="middle" font-size="11" fill="#333">c = word[i]</text>

  <path d="M 290 228 L 290 252" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond2: c == '.'? -->
  <polygon points="290,256 370,296 290,336 210,296" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="294" text-anchor="middle" font-size="11" fill="#333">c == '.'?</text>
  <text x="290" y="308" text-anchor="middle" font-size="9" fill="#888">是否通配符</text>

  <!-- No → left branch -->
  <path d="M 210 296 L 150 296" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="178" y="290" font-size="10" fill="#446688" font-weight="bold">否</text>

  <!-- Yes → right branch -->
  <path d="M 370 296 L 430 296" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="398" y="290" font-size="10" fill="#d6a040" font-weight="bold">是</text>

  <!-- ===== left branch: deterministic char ===== -->
  <rect x="20" y="282" width="130" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="85" y="301" text-anchor="middle" font-size="10" fill="#333">child = children[c]</text>

  <path d="M 85 310 L 85 332" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="85,336 145,366 85,396 25,366" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="85" y="364" text-anchor="middle" font-size="10" fill="#333">child存在?</text>

  <!-- child exists: Yes → recurse (green) -->
  <path d="M 25 366 L 10 366 L 10 410" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="14" y="392" font-size="9" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="14" y="410" width="142" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="85" y="426" text-anchor="middle" font-size="10" fill="#4a7a3a">return dfs(child, i+1)</text>

  <!-- child not exist: No → false (red) -->
  <path d="M 85 396 L 85 410" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="92" y="406" font-size="9" fill="#b85450" font-weight="bold">否</text>

  <!-- ===== right branch: wildcard ===== -->
  <rect x="430" y="282" width="140" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="500" y="301" text-anchor="middle" font-size="10" fill="#333">遍历 k = 0..25 子节点</text>

  <path d="M 500 310 L 500 332" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="430" y="334" width="140" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="500" y="353" text-anchor="middle" font-size="9" fill="#333">dfs(children[k], i+1)</text>

  <path d="M 500 362 L 500 384" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="500,388 560,410 500,432 440,410" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="500" y="408" text-anchor="middle" font-size="9" fill="#333">任一命中?</text>
  <text x="500" y="420" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">短路</text>

  <!-- hit → return true (green) -->
  <path d="M 560 410 L 572 410" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="540" y="404" font-size="9" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- not hit → return false (red), placed to the left of diamond -->
  <path d="M 440 410 L 426 410" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="404" font-size="9" fill="#b85450" font-weight="bold">否</text>

  <!-- recursion loop-back arrow from left branch back to entry (dashed) -->
  <path d="M 156 422 L 180 422 L 180 61 L 210 61" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="186" y="240" font-size="9" fill="#4a7a3a" transform="rotate(-90 186 240)">递归回溯</text>
</svg>
