<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：三次取款（成功 / 失败 / 成功）</text>

  <!-- ===== Example 1: withdraw 600 from [0,0,1,2,1] ===== -->
  <rect x="30" y="40" width="500" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="50" y="62" font-size="12" fill="#4a7a3a" font-weight="bold">① 取 $600，库存 [0,0,1,2,1]</text>

  <!-- step boxes -->
  <rect x="40" y="72" width="86" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="83" y="90" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">$500×1</text>
  <text x="83" y="104" text-anchor="middle" font-size="9.5" fill="#888">余 100</text>

  <rect x="132" y="72" width="86" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="175" y="90" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">$200×0</text>
  <text x="175" y="104" text-anchor="middle" font-size="9.5" fill="#888">余 100</text>

  <rect x="224" y="72" width="86" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="267" y="90" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">$100×1</text>
  <text x="267" y="104" text-anchor="middle" font-size="9.5" fill="#888">余 0</text>

  <rect x="316" y="72" width="86" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="359" y="90" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">$50×0</text>
  <text x="359" y="104" text-anchor="middle" font-size="9.5" fill="#888">余 0</text>

  <rect x="408" y="72" width="86" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="451" y="90" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">$20×0</text>
  <text x="451" y="104" text-anchor="middle" font-size="9.5" fill="#888">余 0</text>

  <!-- result -->
  <text x="180" y="134" font-size="11" fill="#888" font-weight="bold">余额=0 ✓ →</text>
  <rect x="270" y="122" width="180" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="360" y="141" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 [0,0,1,0,1] ✓</text>

  <!-- ===== Example 2: withdraw 600 from [0,1,0,3,1] ===== -->
  <rect x="30" y="172" width="500" height="140" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="50" y="194" font-size="12" fill="#b85450" font-weight="bold">② 取 $600，库存 [0,1,0,3,1]（$50×1, $200×3, $500×1）</text>

  <rect x="40" y="204" width="86" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="83" y="222" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">$500×1</text>
  <text x="83" y="236" text-anchor="middle" font-size="9.5" fill="#888">余 100</text>

  <rect x="132" y="204" width="86" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="175" y="222" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">$200×0</text>
  <text x="175" y="236" text-anchor="middle" font-size="9.5" fill="#888">余 100</text>

  <rect x="224" y="204" width="86" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="267" y="222" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">$100×0</text>
  <text x="267" y="236" text-anchor="middle" font-size="9.5" fill="#888">余 100</text>

  <rect x="316" y="204" width="86" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="359" y="222" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">$50×1</text>
  <text x="359" y="236" text-anchor="middle" font-size="9.5" fill="#888">余 50</text>

  <rect x="408" y="204" width="86" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="451" y="222" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">$20×0</text>
  <text x="451" y="236" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">余 50≠0</text>

  <text x="180" y="268" font-size="11" fill="#888" font-weight="bold">余额=50≠0 ✗ →</text>
  <rect x="300" y="256" width="150" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="375" y="275" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 [-1] ✗</text>

  <text x="50" y="298" font-size="10.5" fill="#d6a040" font-weight="bold">注：3×$200=$600 本可行，但 ATM 必先取 $500 → 贪心失败，库存不变</text>

  <!-- ===== Example 3: withdraw 550 from [0,1,0,3,1] ===== -->
  <rect x="30" y="324" width="500" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="50" y="346" font-size="12" fill="#4a7a3a" font-weight="bold">③ 取 $550，库存 [0,1,0,3,1]（紧接 ②，库存未变）</text>

  <rect x="40" y="356" width="86" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="83" y="374" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">$500×1</text>
  <text x="83" y="388" text-anchor="middle" font-size="9.5" fill="#888">余 50</text>

  <rect x="132" y="356" width="86" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="175" y="374" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">$200×0</text>
  <text x="175" y="388" text-anchor="middle" font-size="9.5" fill="#888">余 50</text>

  <rect x="224" y="356" width="86" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="267" y="374" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">$100×0</text>
  <text x="267" y="388" text-anchor="middle" font-size="9.5" fill="#888">余 50</text>

  <rect x="316" y="356" width="86" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="359" y="374" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">$50×1</text>
  <text x="359" y="388" text-anchor="middle" font-size="9.5" fill="#888">余 0</text>

  <rect x="408" y="356" width="86" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="451" y="374" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">$20×0</text>
  <text x="451" y="388" text-anchor="middle" font-size="9.5" fill="#888">余 0</text>

  <text x="180" y="418" font-size="11" fill="#888" font-weight="bold">余额=0 ✓ →</text>
  <rect x="270" y="406" width="180" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="360" y="425" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 [0,1,0,0,1] ✓</text>

  <!-- bottom note -->
  <rect x="30" y="456" width="500" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="476" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">关键对比：② 失败因 $500 占用后余 $100 无法凑出；③ 余 $50 恰可用 $50×1</text>
</svg>
