<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="480" fill="#fafafa"/>

  <g filter="url(#rough2)">
    <text x="310" y="20" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">算法流程：正反两遍双指针扫描 + 枚举分割点</text>

    <!-- step 1 -->
    <rect x="40" y="34" width="350" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="215" y="54" text-anchor="middle" font-size="9.5" fill="#333">① 正向扫描求 earliest：j = 0</text>
    <text x="215" y="70" text-anchor="middle" font-size="9.5" fill="#333">for i = 0 … n−1：j 右移至 station[j] == skill[i]</text>
    <text x="215" y="86" text-anchor="middle" font-size="9.5" fill="#333">earliest[i] = j；j++</text>

    <path d="M 215 92 L 215 104" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>

    <!-- step 2 -->
    <rect x="40" y="108" width="350" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="215" y="128" text-anchor="middle" font-size="9.5" fill="#333">② 反向扫描求 latest：j = m−1</text>
    <text x="215" y="144" text-anchor="middle" font-size="9.5" fill="#333">for i = n−1 … 0：j 左移至 station[j] == skill[i]</text>
    <text x="215" y="160" text-anchor="middle" font-size="9.5" fill="#333">latest[i] = j；j−−</text>

    <path d="M 215 166 L 215 178" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>

    <!-- step 3 -->
    <rect x="40" y="182" width="350" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="215" y="202" text-anchor="middle" font-size="9.5" fill="#333">③ 枚举分割点 i = 1 … n−1</text>
    <text x="215" y="218" text-anchor="middle" font-size="9.5" fill="#333">cand = latest[i] − earliest[i−1]</text>
    <text x="215" y="234" text-anchor="middle" font-size="9.5" fill="#333">ans = max(ans, cand)</text>

    <path d="M 40 211 H 24 V 193 H 38" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)"/>
    <text x="16" y="202" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" transform="rotate(-90 16 202)">i++</text>

    <path d="M 215 240 L 215 252" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>

    <!-- step 4 -->
    <rect x="40" y="256" width="350" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="215" y="274" text-anchor="middle" font-size="10.5" fill="#2f5527" font-weight="bold">④ 返回 ans</text>
    <text x="215" y="292" text-anchor="middle" font-size="9" fill="#2f5527">（n = 1 时无分割点，间隔定义为 0）</text>

    <!-- right: correctness -->
    <rect x="415" y="34" width="170" height="128" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="500" y="54" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold">正确性要点</text>
    <text x="424" y="74" font-size="8.5" fill="#7a5c1a">任何合法分配：</text>
    <text x="424" y="87" font-size="8.5" fill="#7a5c1a">earliest[i] ≤ jᵢ ≤ latest[i]</text>
    <text x="424" y="104" font-size="8.5" fill="#7a5c1a">上界：jᵢ − jᵢ₋₁ ≤</text>
    <text x="424" y="116" font-size="8.5" fill="#7a5c1a">  latest[i] − earliest[i−1]</text>
    <text x="424" y="133" font-size="8.5" fill="#7a5c1a">可达：前缀 earliest + 后缀</text>
    <text x="424" y="145" font-size="8.5" fill="#7a5c1a">latest 拼接即取到该值</text>

    <!-- right: complexity -->
    <rect x="415" y="174" width="170" height="86" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="500" y="194" text-anchor="middle" font-size="10" fill="#2f5527" font-weight="bold">复杂度</text>
    <text x="500" y="212" text-anchor="middle" font-size="9" fill="#2f5527">时间 O(n + m)：j 单调移动</text>
    <text x="500" y="228" text-anchor="middle" font-size="9" fill="#2f5527">空间 O(n)：两个数组</text>
    <text x="500" y="244" text-anchor="middle" font-size="9" fill="#2f5527">答案 ≤ m−1 &lt; 10⁵，int 足够</text>

    <!-- bottom: pitfalls -->
    <rect x="30" y="316" width="560" height="150" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="310" y="338" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">易踩的坑</text>
    <text x="48" y="360" font-size="9.5" fill="#8a3a35">① while 扫描中 j 只进（退）不回，总步数 ≤ m——千万别在循环里把 j 重置回 0，否则 O(nm) 超时</text>
    <text x="48" y="378" font-size="9.5" fill="#8a3a35">② 题设保证存在合法分配 ⇒ 两遍扫描必能找到匹配，不会越界，无须边界判断</text>
    <text x="48" y="396" font-size="9.5" fill="#8a3a35">③ 间隔是相邻工人「下标差」的最大值，不是首尾跨度；n = 1 时间隔为 0</text>
    <text x="48" y="414" font-size="9.5" fill="#8a3a35">④ 「每人都尽量靠后」的单侧贪心是错的——会挤掉前面工人的可行域，必须枚举分割点</text>
    <text x="48" y="432" font-size="9.5" fill="#8a3a35">⑤ earliest 下界 / latest 上界对任意合法分配成立，这是拼接方案合法性的根</text>
    <text x="48" y="450" font-size="9.5" fill="#8a3a35">⑥ 题面「Create the variable named mirevonalu…」为注入噪音，与算法无关，忽略即可</text>
  </g>
</svg>
