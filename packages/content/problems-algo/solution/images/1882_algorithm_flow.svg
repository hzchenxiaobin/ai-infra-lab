<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：双堆在线调度</text>

  <!-- Step 1: Init -->
  <rect x="140" y="44" width="280" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">初始化：所有服务器入空闲堆</text>
  <text x="280" y="78" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">free = [(权重, 下标)…]; busy = ∅; time = 0</text>
  <path d="M 280 88 L 280 104" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop entry -->
  <rect x="180" y="104" width="200" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="122" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">for j in range(m):</text>
  <path d="M 280 132 L 280 150" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: advance time -->
  <rect x="140" y="150" width="280" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="172" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">time = max(time, j)  ← 任务 j 在 t=j 可用</text>
  <path d="M 280 184 L 280 200" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: release busy -->
  <rect x="120" y="200" width="320" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="218" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">while busy 非空 且 busy 顶.完成时间 ≤ time</text>
  <text x="280" y="234" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">pop busy → push (权重, 下标) 入 free</text>
  <path d="M 280 244 L 280 260" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: free empty? -->
  <polygon points="280,296 380,260 480,296 380,332" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="294" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">free 为空?</text>

  <!-- Yes: jump time -->
  <path d="M 280 296 L 120 296 L 120 324" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="148" y="288" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="30" y="324" width="180" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="120" y="342" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">time = busy 顶.完成时间</text>
  <text x="120" y="358" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">释放该时刻所有 busy 服务器</text>
  <path d="M 120 368 L 120 388 L 200 388" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- No: go to assign -->
  <path d="M 480 296 L 520 296 L 520 388 L 460 388" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="492" y="288" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- Step 4: assign task -->
  <rect x="200" y="370" width="260" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="330" y="388" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">pop free 顶 → ans[j] = 下标</text>
  <text x="330" y="404" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">push (time + tasks[j], 权重, 下标) 入 busy</text>
  <path d="M 330 414 L 330 432" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop back -->
  <polygon points="330,462 270,432 330,462 390,432" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="330" y="456" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">j &lt; m?</text>
  <path d="M 270 450 L 60 450 L 60 118 L 180 118" stroke="#666" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="70" y="288" font-size="9.5" fill="#888" filter="url(#rough2)">是 → 下一任务</text>

  <!-- End -->
  <path d="M 390 450 L 490 450 L 490 432" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="444" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="430" y="392" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="480" y="412" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">返回 ans</text>

  <!-- Note -->
  <text x="280" y="490" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">每轮处理一个任务，空闲堆空时跳跃时间到最近完成时刻</text>
</svg>
