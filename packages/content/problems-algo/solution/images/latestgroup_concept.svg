<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：置 1 时合并左右 1-段</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">位置 p 置 1 → 读 len[p−1], len[p+1] → 新段长度 = L + 1 + R</text>

  <!-- ===== Before merge ===== -->
  <text x="40" y="72" font-size="12" fill="#888">合并前：</text>

  <!-- pos p-4: 0 -->
  <rect x="80" y="82" width="36" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="98" y="104" text-anchor="middle" font-size="13" fill="#999">0</text>

  <!-- pos p-3, p-2, p-1: left group (green) -->
  <rect x="120" y="82" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="138" y="104" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="160" y="82" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="104" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="200" y="82" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="104" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- pos p: being set (orange) -->
  <rect x="240" y="82" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="258" y="104" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">?</text>

  <!-- pos p+1, p+2: right group (blue) -->
  <rect x="280" y="82" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="298" y="104" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>
  <rect x="320" y="82" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="338" y="104" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>

  <!-- pos p+3: 0 -->
  <rect x="360" y="82" width="36" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="378" y="104" text-anchor="middle" font-size="13" fill="#999">0</text>

  <!-- Position label for p -->
  <text x="258" y="130" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">p = arr[i]</text>

  <!-- Brackets for left and right groups -->
  <path d="M 120 126 L 120 134 L 236 134 L 236 126" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="178" y="148" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">左段 L = len[p−1] = 3</text>

  <path d="M 280 126 L 280 134 L 356 134 L 356 126" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="318" y="148" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">右段 R = len[p+1] = 2</text>

  <!-- Arrow down -->
  <path d="M 258 160 L 258 178" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="174" font-size="11" fill="#d6a040" font-weight="bold">置 1</text>

  <!-- ===== After merge ===== -->
  <text x="40" y="196" font-size="12" fill="#888">合并后：</text>

  <!-- pos p-4: 0 -->
  <rect x="80" y="206" width="36" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="98" y="228" text-anchor="middle" font-size="13" fill="#999">0</text>

  <!-- pos p-3 to p+2: merged group (one long box) -->
  <rect x="120" y="206" width="236" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="238" y="228" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1   1   1   1   1   1</text>

  <!-- pos p+3: 0 -->
  <rect x="360" y="206" width="36" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="378" y="228" text-anchor="middle" font-size="13" fill="#999">0</text>

  <!-- Bracket for merged group -->
  <path d="M 120 248 L 120 256 L 356 256 L 356 248" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="238" y="270" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">新段长度 = L + 1 + R = 3 + 1 + 2 = 6</text>

  <!-- ===== cnt tracking ===== -->
  <rect x="60" y="284" width="440" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="304" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">cnt 计数同步更新</text>
  <text x="280" y="324" text-anchor="middle" font-size="12" fill="#333">cnt[L]−1   cnt[R]−1   cnt[L+1+R]+1</text>
  <text x="280" y="338" text-anchor="middle" font-size="11" fill="#4a7a3a">若 cnt[m] &gt; 0 → ans = i（此步有效）</text>

  <!-- Bottom note -->
  <text x="280" y="372" text-anchor="middle" font-size="11" fill="#888">端点更新：len[p−L] = len[p+R] = new_len，内部位置不再被查询</text>
  <text x="280" y="388" text-anchor="middle" font-size="11" fill="#888">每步 O(1)，总 O(n)</text>
</svg>
