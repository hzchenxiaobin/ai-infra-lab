<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 570"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="570" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">方法一流程：外层 left，坏则扩窗，好则计数出窗</text>

  <!-- 开始 -->
  <rect x="140" y="38" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="230" y="55" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">初始化 freq[26] = 0、over = 0</text>
  <text x="230" y="70" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">right = 0、ans = 0、left = 0</text>
  <path d="M 230 78 L 230 94" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断1：left < n ? -->
  <polygon points="230,98 308,128 230,158 152,128" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="132" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">left &lt; n ?</text>
  <text x="326" y="118" font-size="10.5" fill="#8a3833" filter="url(#rough2)">否</text>
  <path d="M 308 128 L 485 128 L 485 524 L 304 524" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="240" y="174" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">是</text>
  <path d="M 230 158 L 230 176" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断2：right < n 且 over == 0 ? -->
  <polygon points="230,180 322,210 230,240 138,210" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="206" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">right &lt; n</text>
  <text x="230" y="221" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">且 over == 0 ?</text>
  <text x="336" y="200" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">是</text>
  <path d="M 322 210 L 351 210" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="355" y="188" width="120" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="415" y="206" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">s[right] 入窗，right++</text>
  <text x="415" y="222" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">频次 == k 则 over++</text>
  <path d="M 415 188 L 415 164 L 244 164 L 244 176" fill="none" stroke="#a07830" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="158" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">扩到恰好合法为止</text>
  <text x="240" y="252" font-size="10.5" fill="#8a3833" filter="url(#rough2)">否</text>
  <path d="M 230 240 L 230 258" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断3：over == 0 ? -->
  <polygon points="230,262 318,292 230,322 142,292" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="290" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">over == 0 ?</text>
  <text x="230" y="306" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">（right 到头仍未达标）</text>
  <text x="332" y="282" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">是</text>
  <path d="M 318 292 L 361 292" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="365" y="270" width="110" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="420" y="288" text-anchor="middle" font-size="11" fill="#8a3833" font-weight="bold" filter="url(#rough2)">break</text>
  <text x="420" y="304" text-anchor="middle" font-size="9.5" fill="#8a3833" filter="url(#rough2)">更大 left 更无望</text>
  <path d="M 420 314 L 420 460 L 265 460 L 265 501" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="240" y="338" font-size="10.5" fill="#8a3833" filter="url(#rough2)">否</text>
  <path d="M 230 322 L 230 340" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 计数 -->
  <rect x="140" y="344" width="180" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="230" y="360" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">ans += n − right + 1</text>
  <text x="230" y="375" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">（终点 right−1 .. n−1 全合法）</text>
  <path d="M 230 382 L 230 400" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 出窗 -->
  <rect x="130" y="404" width="200" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="230" y="421" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">s[left] 出窗（先判后减）：</text>
  <text x="230" y="436" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">频次 == k 则 over−−；left++</text>
  <path d="M 130 424 L 40 424 L 40 128 L 148 128" fill="none" stroke="#a07830" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="52" y="416" font-size="9.5" fill="#a07830" filter="url(#rough2)">下一轮</text>
  <path d="M 230 444 L 230 501" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 返回 -->
  <rect x="160" y="505" width="140" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="230" y="529" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <text x="260" y="560" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">不变式：over &gt; 0 时，[left, right−1] 恰是起点 left 的最小合法窗口</text>
</svg>
