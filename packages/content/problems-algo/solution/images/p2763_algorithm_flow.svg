<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2763f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arr2763g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：贡献拆分为三项</text>

  <!-- top master formula -->
  <rect x="90" y="44" width="380" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="69" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">ans = Σ|D| − N − ΣC</text>

  <!-- three branches arrows -->
  <path d="M180,88 L100,118" stroke="#446688" stroke-width="1.8" marker-end="url(#arr2763f)" filter="url(#rough2)"/>
  <path d="M280,88 L280,118" stroke="#446688" stroke-width="1.8" marker-end="url(#arr2763f)" filter="url(#rough2)"/>
  <path d="M380,88 L460,118" stroke="#446688" stroke-width="1.8" marker-end="url(#arr2763f)" filter="url(#rough2)"/>

  <!-- Term A -->
  <rect x="30" y="120" width="150" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="105" y="142" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">项 A = Σ|D|</text>
  <text x="105" y="162" text-anchor="middle" font-size="10" fill="#446688">各子数组不同值数之和</text>
  <text x="105" y="184" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">前驱出现法</text>
  <text x="105" y="202" text-anchor="middle" font-size="9" fill="#446688">prev[i] = 同值上一处</text>
  <text x="105" y="216" text-anchor="middle" font-size="9" fill="#446688">(i−prev)·(n−i)</text>
  <text x="105" y="234" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">O(n)</text>

  <!-- Term N -->
  <rect x="205" y="120" width="150" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="142" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">项 B = N</text>
  <text x="280" y="162" text-anchor="middle" font-size="10" fill="#4a7a3a">子数组总数</text>
  <text x="280" y="190" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">n(n+1)/2</text>
  <text x="280" y="214" text-anchor="middle" font-size="9" fill="#4a7a3a">每个子数组贡献 −1</text>
  <text x="280" y="234" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">O(1)</text>

  <!-- Term C -->
  <rect x="380" y="120" width="150" height="120" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="455" y="142" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">项 C = ΣC</text>
  <text x="455" y="162" text-anchor="middle" font-size="10" fill="#b85450">同时含 v,v+1 的</text>
  <text x="455" y="176" text-anchor="middle" font-size="10" fill="#b85450">子数组数之和</text>
  <text x="455" y="198" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">逐值扫描法</text>
  <text x="455" y="216" text-anchor="middle" font-size="9" fill="#b85450">lastA/lastB 滚动</text>
  <text x="455" y="234" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">O(n²)</text>

  <!-- merge arrows down -->
  <path d="M105,244 L105,272" stroke="#446688" stroke-width="1.8" marker-end="url(#arr2763f)" filter="url(#rough2)"/>
  <path d="M280,244 L280,272" stroke="#446688" stroke-width="1.8" marker-end="url(#arr2763f)" filter="url(#rough2)"/>
  <path d="M455,244 L455,272" stroke="#446688" stroke-width="1.8" marker-end="url(#arr2763f)" filter="url(#rough2)"/>

  <!-- combine node -->
  <rect x="120" y="274" width="320" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="294" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">ans = 项 A − 项 B − 项 C</text>
  <text x="280" y="310" text-anchor="middle" font-size="10" fill="#d6a040">三项各自独立计算后相减</text>

  <path d="M280,320 L280,344" stroke="#d6a040" stroke-width="2" marker-end="url(#arr2763g)" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="150" y="348" width="260" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="373" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">返回 ans</text>

  <!-- note -->
  <rect x="60" y="402" width="440" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="421" text-anchor="middle" font-size="10" fill="#888">注：项 C 用归并事件法可优化至 O(n)，见扩展节</text>
</svg>
