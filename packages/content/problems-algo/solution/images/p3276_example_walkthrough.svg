<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1 演算：grid = [[1,2,3],[4,3,2],[1,1,1]]，答案 8</text>

  <!-- 表头 -->
  <rect x="24" y="40" width="472" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="59" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">值 v</text>
  <text x="128" y="59" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">可放行 R</text>
  <text x="281" y="59" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">新增 / 更新的关键状态</text>
  <text x="438" y="59" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">说明</text>

  <!-- 行 1: v=1 -->
  <rect x="24" y="72" width="472" height="32" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="52" y="92" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="128" y="92" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{r0, r2}</text>
  <text x="180" y="92" font-size="10.5" fill="#333" filter="url(#rough2)">dp[001]=1；dp[100]=1</text>
  <text x="438" y="92" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">单选一个 1</text>

  <!-- 行 2: v=2 -->
  <rect x="24" y="106" width="472" height="32" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="52" y="126" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="128" y="126" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{r0, r1}</text>
  <text x="180" y="126" font-size="10.5" fill="#333" filter="url(#rough2)">dp[010]=2；dp[011]=1+2=3；dp[101]=1+2=3</text>
  <text x="438" y="126" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">与已选的 1 拼行</text>

  <!-- 行 3: v=3 -->
  <rect x="24" y="140" width="472" height="32" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="52" y="160" text-anchor="middle" font-size="11" fill="#8a6a1c" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="128" y="160" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{r0, r1}</text>
  <text x="180" y="160" font-size="10.5" fill="#333" filter="url(#rough2)">dp[011]=2+3=5；dp[101]=1+3=4；dp[110]=1+3=4</text>
  <text x="438" y="160" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2+3 的组合胜出</text>

  <!-- 行 4: v=4 -->
  <rect x="24" y="174" width="472" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="52" y="195" text-anchor="middle" font-size="11" fill="#8a3833" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="128" y="195" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{r1}</text>
  <text x="180" y="195" font-size="10.5" fill="#333" filter="url(#rough2)">dp[110]=1+4=5；dp[011]=1+4=5；</text>
  <text x="392" y="195" font-size="11" fill="#8a3833" font-weight="bold" filter="url(#rough2)">dp[111]=4+4=8 ★</text>
  <text x="438" y="204" text-anchor="middle" font-size="10" fill="#8a3833" filter="url(#rough2)">三行全占</text>

  <!-- 底部说明 -->
  <rect x="30" y="222" width="460" height="122" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="243" text-anchor="middle" font-size="11" fill="#8a6a1c" filter="url(#rough2)">mask 三位（高位→低位）= r2 r1 r0；初始仅 dp[000]=0，其余为不可达（−1）</text>
  <text x="260" y="263" text-anchor="middle" font-size="11" fill="#8a6a1c" filter="url(#rough2)">最终 dp[111] = 8：行 0 放 3、行 1 放 4、行 2 放 1（3 + 4 + 1 = 8）</text>
  <text x="260" y="283" text-anchor="middle" font-size="11" fill="#8a6a1c" filter="url(#rough2)">每一步「dp 值 = 该行集合下已选值的总和」，行绝不重复占、值绝不重复选</text>
  <text x="260" y="303" text-anchor="middle" font-size="11" fill="#8a6a1c" filter="url(#rough2)">值全为正 ⇒ max(dp) ≥ 单格最大值 4 &gt; 0，「至少选一个」自动满足</text>
  <text x="260" y="328" text-anchor="middle" font-size="10" fill="#7a6a50" filter="url(#rough2)">对照示例 2：[[8,7,6],[8,3,2]] → 值 8 的行集合 {r0,r1}，最优配对 8→r0 + 7→r1 = 15</text>
</svg>
