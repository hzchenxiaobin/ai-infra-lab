<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">三表关系：Invoices → Customers / Contacts</text>

  <!-- Invoices table (top-left) -->
  <rect x="40" y="50" width="200" height="130" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <rect x="40" y="50" width="200" height="28" fill="#446688" rx="6" filter="url(#rough2)"/>
  <text x="140" y="69" text-anchor="middle" font-size="13" fill="#fff" filter="url(#rough2)">Invoices</text>
  <text x="55" y="98" font-size="11" fill="#333" filter="url(#rough2)">invoice_id (PK)</text>
  <text x="55" y="118" font-size="11" fill="#333" filter="url(#rough2)">price</text>
  <text x="55" y="138" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">user_id</text>
  <text x="55" y="162" font-size="10" fill="#888" filter="url(#rough2)">→ 谁买了这张发票</text>

  <!-- Customers table (top-right) -->
  <rect x="470" y="50" width="210" height="130" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <rect x="470" y="50" width="210" height="28" fill="#4a7a3a" rx="6" filter="url(#rough2)"/>
  <text x="575" y="69" text-anchor="middle" font-size="13" fill="#fff" filter="url(#rough2)">Customers</text>
  <text x="485" y="98" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">customer_id (PK)</text>
  <text x="485" y="118" font-size="11" fill="#333" filter="url(#rough2)">customer_name</text>
  <text x="485" y="138" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">email</text>
  <text x="485" y="162" font-size="10" fill="#888" filter="url(#rough2)">→ 顾客邮箱（可信判定基准）</text>

  <!-- Contacts table (bottom-center) -->
  <rect x="240" y="250" width="240" height="140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <rect x="240" y="250" width="240" height="28" fill="#d6a040" rx="6" filter="url(#rough2)"/>
  <text x="360" y="269" text-anchor="middle" font-size="13" fill="#fff" filter="url(#rough2)">Contacts</text>
  <text x="255" y="298" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">user_id</text>
  <text x="255" y="318" font-size="11" fill="#333" filter="url(#rough2)">contact_name</text>
  <text x="255" y="338" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">contact_email</text>
  <text x="255" y="368" font-size="10" fill="#888" filter="url(#rough2)">→ 某用户的联系人列表</text>

  <!-- Arrow 1: Invoices.user_id → Customers.customer_id (blue, get customer_name) -->
  <path d="M 240 135 Q 355 110 470 95" fill="none" stroke="#446688" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="355" y="100" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">① LEFT JOIN 取 customer_name</text>

  <!-- Arrow 2: Invoices.user_id → Contacts.user_id (green, get contacts) -->
  <path d="M 140 180 Q 180 215 280 250" fill="none" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="120" y="225" font-size="10" fill="#4a7a3a" filter="url(#rough2)">② LEFT JOIN 取联系人</text>

  <!-- Arrow 3: Contacts.contact_email → Customers.email (orange, trusted check) -->
  <path d="M 480 335 Q 580 250 620 180" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="530" y="255" font-size="10" fill="#d6a040" filter="url(#rough2)">③ 再 JOIN Customers</text>
  <text x="530" y="270" font-size="10" fill="#d6a040" filter="url(#rough2)">判定 contact_email 是否</text>
  <text x="530" y="284" font-size="10" fill="#d6a040" filter="url(#rough2)">为已注册顾客（可信）</text>

  <!-- Bottom note -->
  <rect x="60" y="410" width="600" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="360" y="427" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">Customers 表被 JOIN 两次：第一次取名字，第二次判定联系人是否可信</text>
</svg>
