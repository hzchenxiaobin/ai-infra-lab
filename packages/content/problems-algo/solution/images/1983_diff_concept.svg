<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：nums1−nums2 构造差分数组，子和为 0</text>

  <!-- nums1 row -->
  <text x="36" y="62" font-size="12" fill="#888">nums1:</text>
  <rect x="120" y="46" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="145" y="66" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="172" y="46" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="197" y="66" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="224" y="46" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="249" y="66" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="276" y="46" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="301" y="66" text-anchor="middle" font-size="12" fill="#333">1</text>

  <text x="145" y="92" text-anchor="middle" font-size="9" fill="#aaa">i=0</text>
  <text x="197" y="92" text-anchor="middle" font-size="9" fill="#aaa">i=1</text>
  <text x="249" y="92" text-anchor="middle" font-size="9" fill="#aaa">i=2</text>
  <text x="301" y="92" text-anchor="middle" font-size="9" fill="#aaa">i=3</text>

  <!-- minus sign + note -->
  <text x="345" y="64" font-size="16" fill="#b85450" font-weight="bold">−</text>
  <rect x="365" y="48" width="60" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="395" y="63" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">逐位相减</text>

  <!-- nums2 row -->
  <text x="36" y="118" font-size="12" fill="#888">nums2:</text>
  <rect x="120" y="102" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="145" y="122" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="172" y="102" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="197" y="122" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="224" y="102" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="249" y="122" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="276" y="102" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="301" y="122" text-anchor="middle" font-size="12" fill="#333">0</text>

  <!-- down arrows to diff -->
  <path d="M 145 136 L 145 152" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 197 136 L 197 152" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 249 136 L 249 152" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 301 136 L 301 152" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <!-- diff row -->
  <text x="40" y="178" font-size="12" fill="#888">diff:</text>
  <rect x="120" y="158" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="145" y="178" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">+1</text>
  <rect x="172" y="158" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="197" y="178" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="224" y="158" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="249" y="178" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">−1</text>
  <rect x="276" y="158" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="301" y="178" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">+1</text>

  <!-- bracket spanning diff[0..2] sum = 0 -->
  <path d="M 125 198 Q 125 206 133 206 L 271 206 Q 279 206 279 198" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="200" y="200" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">diff[0..2]：+1+0−1 = 0 ⟺ 两段子和相等</text>

  <!-- equation box -->
  <rect x="36" y="220" width="448" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="242" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">Σnums1[i..j] = Σnums2[i..j]</text>
  <text x="260" y="260" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">⇔ Σdiff[i..j] = 0 ⇔ prefix[j+1] == prefix[i]</text>
  <text x="260" y="276" text-anchor="middle" font-size="11" fill="#b85450">归约为「最长和为 0 的子数组」</text>

  <!-- generalization box: 525 是特例 -->
  <rect x="36" y="296" width="448" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">525. 连续数组 是本题特例</text>
  <text x="260" y="338" text-anchor="middle" font-size="11.5" fill="#444">525 的「0 当 −1」即 diff ∈ {+1, −1}</text>
  <text x="260" y="356" text-anchor="middle" font-size="11.5" fill="#4a7a3a">本题 diff ∈ {−1, 0, +1}，多了 0 但算法不变</text>
</svg>
