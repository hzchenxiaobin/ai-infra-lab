<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <!-- Column titles -->
  <text x="150" y="30" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">update(i, delta)：向上找覆盖</text>
  <text x="470" y="30" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">prefixSum(i)：向下拆区间</text>

  <!-- ============ LEFT: update ============ -->
  <rect x="60" y="56" width="180" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="150" y="74" text-anchor="middle" font-size="11" fill="#333">i = index + 1  (1-indexed)</text>

  <polygon points="150,108 200,140 150,172 100,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="138" text-anchor="middle" font-size="11" fill="#444">i ≤ n ?</text>
  <text x="158" y="154" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <text x="206" y="136" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <rect x="60" y="184" width="180" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="150" y="202" text-anchor="middle" font-size="11" fill="#333">tree[i] += delta</text>

  <rect x="60" y="236" width="180" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="150" y="254" text-anchor="middle" font-size="11" fill="#333">i += lowbit(i)   (i &amp; -i)</text>

  <!-- arrows left -->
  <path d="M 150 84 L 150 106" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 150 172 L 150 182" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 150 212 L 150 234" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- loop back B3 -> D1 -->
  <path d="M 60 250 L 30 250 L 30 140 L 98 140" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4 3"/>
  <text x="36" y="200" font-size="10" fill="#888">回判</text>
  <!-- exit 否 -->
  <path d="M 202 140 L 240 140" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="246" y="144" font-size="11" fill="#b85450" font-weight="bold">结束</text>

  <!-- left example -->
  <rect x="40" y="300" width="250" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="165" y="320" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">示例：update(3, d)</text>
  <text x="165" y="340" text-anchor="middle" font-size="11" fill="#444">3 → 4 → 8  (&gt;n 停)</text>
  <text x="165" y="358" text-anchor="middle" font-size="11" fill="#555">逐层更新 tree[3], tree[4]</text>
  <text x="165" y="378" text-anchor="middle" font-size="10" fill="#888">每步 i 的最低位 1 进位，向上爬</text>

  <!-- ============ RIGHT: prefixSum ============ -->
  <rect x="380" y="56" width="180" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="470" y="74" text-anchor="middle" font-size="11" fill="#333">s = 0 ; i = right + 1</text>

  <polygon points="470,108 520,140 470,172 420,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470" y="138" text-anchor="middle" font-size="11" fill="#444">i &gt; 0 ?</text>
  <text x="478" y="154" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <text x="526" y="136" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <rect x="380" y="184" width="180" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="470" y="202" text-anchor="middle" font-size="11" fill="#333">s += tree[i]</text>

  <rect x="380" y="236" width="180" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="470" y="254" text-anchor="middle" font-size="11" fill="#333">i -= lowbit(i)   (i &amp; -i)</text>

  <path d="M 470 84 L 470 106" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 470 172 L 470 182" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 470 212 L 470 234" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 380 250 L 350 250 L 350 140 L 418 140" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4 3"/>
  <text x="356" y="200" font-size="10" fill="#888">回判</text>
  <path d="M 522 140 L 560 140" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="566" y="144" font-size="11" fill="#b85450" font-weight="bold">返 s</text>

  <rect x="360" y="300" width="250" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="485" y="320" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">示例：prefixSum(7)</text>
  <text x="485" y="340" text-anchor="middle" font-size="11" fill="#444">7 → 6 → 4 → 0  (停)</text>
  <text x="485" y="358" text-anchor="middle" font-size="11" fill="#555">s = tree[7] + tree[6] + tree[4]</text>
  <text x="485" y="378" text-anchor="middle" font-size="10" fill="#888">每步抹掉最低位 1，向下拆</text>

  <!-- bottom note -->
  <rect x="40" y="404" width="540" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="422" text-anchor="middle" font-size="11" fill="#444">lowbit(i) = i &amp; (-i)：更新向高位进位 ↑，查询抹掉最低位 ↓，两条路径均 ≤ log₂n 步</text>
</svg>
