<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">示例 1 演算：ans = 4</text>

  <!-- 左：棋盘 -->
  <text x="130" y="44" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">c0&#160;&#160;&#160;c1&#160;&#160;&#160;c2&#160;&#160;&#160;c3</text>

  <rect x="40" y="52" width="48" height="40" rx="4" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="64" y="77" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">-3</text>
  <rect x="88" y="52" width="48" height="40" rx="4" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="112" y="77" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="136" y="52" width="48" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="160" y="77" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="160" y="47" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">车</text>
  <rect x="184" y="52" width="48" height="40" rx="4" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="208" y="77" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <rect x="40" y="92" width="48" height="40" rx="4" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="64" y="117" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">-3</text>
  <rect x="88" y="92" width="48" height="40" rx="4" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="112" y="117" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="136" y="92" width="48" height="40" rx="4" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="160" y="117" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">-3</text>
  <rect x="184" y="92" width="48" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="208" y="117" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="208" y="87" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">车</text>

  <rect x="40" y="132" width="48" height="40" rx="4" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="64" y="157" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">-3</text>
  <rect x="88" y="132" width="48" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="112" y="157" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="112" y="127" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">车</text>
  <rect x="136" y="132" width="48" height="40" rx="4" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="160" y="157" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="184" y="132" width="48" height="40" rx="4" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="208" y="157" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <text x="130" y="196" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">三个车放 (0,2)、(1,3)、(2,1)：1 + 1 + 2 = 4</text>
  <text x="130" y="216" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">m = 3 → 每列前 3 大 = 整列</text>
  <text x="130" y="233" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">候选 = 各行前 3 大，共 9 个</text>
  <text x="130" y="256" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">（橙色 = 车；-3 所在格被行筛掉）</text>

  <!-- 右：步骤 -->
  <text x="384" y="52" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">候选降序（值, 行, 列）：</text>

  <rect x="250" y="60" width="26" height="24" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="263" y="77" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="263" y="96" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">r2c1</text>
  <rect x="279" y="60" width="26" height="24" rx="3" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="292" y="77" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="292" y="96" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">r0c1</text>
  <rect x="308" y="60" width="26" height="24" rx="3" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="321" y="77" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="321" y="96" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">r0c2</text>
  <rect x="337" y="60" width="26" height="24" rx="3" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="350" y="77" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="350" y="96" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">r0c3</text>
  <rect x="366" y="60" width="26" height="24" rx="3" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="379" y="77" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="379" y="96" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">r1c1</text>
  <rect x="395" y="60" width="26" height="24" rx="3" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="408" y="77" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="408" y="96" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">r1c3</text>
  <rect x="424" y="60" width="26" height="24" rx="3" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="437" y="77" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="437" y="96" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">r2c2</text>
  <rect x="453" y="60" width="26" height="24" rx="3" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="466" y="77" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="466" y="96" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">r2c3</text>
  <rect x="482" y="60" width="26" height="24" rx="3" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="495" y="77" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">-3</text>
  <text x="495" y="96" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">r1c2</text>

  <text x="384" y="126" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">锚点取值最大者 2@(2,1)：</text>
  <text x="384" y="146" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">跳过同行 r2 与同列 c1 的候选后：</text>

  <rect x="268" y="156" width="52" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="294" y="175" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1@(0,2)</text>
  <rect x="326" y="156" width="52" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="352" y="175" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1@(0,3)</text>
  <rect x="384" y="156" width="52" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="410" y="175" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1@(1,3)</text>
  <rect x="442" y="156" width="52" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="468" y="175" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">-3@(1,2)</text>
  <text x="384" y="200" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">（兼容候选只有 4 个，不足 6 个就全取）</text>

  <text x="384" y="224" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">6 对配对里合法的最佳：1@(0,2) + 1@(1,3)</text>
  <text x="384" y="242" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">（异行异列 ✓；如 1@(0,3)+1@(1,3) 同列 ✗）</text>

  <rect x="272" y="256" width="224" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="384" y="279" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">ans = 2 + 1 + 1 = 4 ✓</text>

  <text x="260" y="326" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">其余锚点（分布在各行的 1）枚举出的方案都不超过 4</text>
  <text x="260" y="344" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">与暴力解一致，最终返回 4</text>
</svg>
