<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">滑动窗口流程：右端扩张，非法时左右同移</text>

  <!-- Init -->
  <rect x="80" y="38" width="360" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="60" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">初始化</text>
  <text x="260" y="78" text-anchor="middle" font-size="11" fill="#555">cnt[26]=0, maxFreq=0, left=0, maxLen=0</text>

  <path d="M 260 96 L 260 112" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Loop diamond: right < n ? -->
  <polygon points="260,116 370,156 260,196 150,156" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="152" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">right &lt; n ?</text>
  <text x="260" y="170" text-anchor="middle" font-size="10.5" fill="#777">还有字符？</text>

  <!-- No -> return -->
  <path d="M 370 156 L 440 156 L 440 210" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="392" y="148" font-size="11" fill="#b85450" font-weight="bold">No</text>
  <rect x="370" y="214" width="140" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="440" y="233" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">扫描结束</text>
  <text x="440" y="250" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">return maxLen</text>

  <!-- Yes down -->
  <path d="M 260 196 L 260 214" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="276" y="210" font-size="11" fill="#82b366" font-weight="bold">Yes</text>

  <!-- update cnt + maxFreq -->
  <rect x="80" y="218" width="360" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="239" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">cnt[s[right]] += 1</text>
  <text x="260" y="258" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">maxFreq = max(maxFreq, cnt[s[right]])   ← 单调不降</text>

  <path d="M 260 274 L 260 290" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Decision diamond: (right-left+1) - maxFreq > k ? -->
  <polygon points="260,294 380,332 260,370 140,332" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="328" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">窗口长度 − maxFreq &gt; k ?</text>
  <text x="260" y="346" text-anchor="middle" font-size="10.5" fill="#777">替换次数超限？</text>

  <!-- Yes (非法) -> 左右同移 -->
  <path d="M 380 332 L 440 332 L 440 380" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="402" y="324" font-size="11" fill="#b85450" font-weight="bold">Yes</text>
  <rect x="360" y="384" width="150" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="435" y="404" text-anchor="middle" font-size="10.8" fill="#b85450" font-weight="bold">cnt[s[left]]−−, left++</text>

  <!-- No (合法) note -->
  <path d="M 140 332 L 80 332 L 80 380" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="92" y="324" font-size="11" fill="#4a7a3a" font-weight="bold">No</text>
  <rect x="10" y="384" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="80" y="404" text-anchor="middle" font-size="10.8" fill="#4a7a3a" font-weight="bold">窗口合法，保持扩张</text>

  <!-- loop-back: merge both branches to loop top -->
  <path d="M 435 414 L 435 414" stroke="#888" stroke-width="1.4" fill="none"/>
  <path d="M 435 414 L 8 414 L 8 156 L 150 156" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <path d="M 80 414 L 8 414" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="20" y="288" font-size="10.5" fill="#888" font-style="italic" transform="rotate(-90 20 288)">更新 maxLen，right++，回到循环</text>
</svg>
