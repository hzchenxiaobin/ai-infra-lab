<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程图：试除判丑数</text>

  <!-- ===== start ===== -->
  <rect x="210" y="44" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="15" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">输入 n</text>

  <path d="M 260 74 L 260 90" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== decision: n <= 0 ? ===== -->
  <polygon points="260,94 340,124 260,154 180,124" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="121" text-anchor="middle" font-size="11" fill="#444">n ≤ 0 ?</text>
  <text x="260" y="135" text-anchor="middle" font-size="11" fill="#444"></text>

  <!-- yes branch -->
  <path d="M 180 124 L 110 124 L 110 200" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="148" y="116" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>

  <rect x="56" y="204" width="108" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="110" y="224" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return false</text>

  <!-- no branch -->
  <path d="M 340 124 L 410 124 L 410 160" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="116" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- ===== three while loops ===== -->
  <!-- while n%2==0 -->
  <rect x="320" y="164" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="410" y="181" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">while n % 2 == 0</text>
  <text x="410" y="196" text-anchor="middle" font-size="11" fill="#446688">n = n / 2</text>

  <path d="M 410 204 L 410 220" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- while n%3==0 -->
  <rect x="320" y="224" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="410" y="241" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">while n % 3 == 0</text>
  <text x="410" y="256" text-anchor="middle" font-size="11" fill="#4a7a3a">n = n / 3</text>

  <path d="M 410 264 L 410 280" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- while n%5==0 -->
  <rect x="320" y="284" width="180" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="410" y="301" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">while n % 5 == 0</text>
  <text x="410" y="316" text-anchor="middle" font-size="11" fill="#d6a040">n = n / 5</text>

  <path d="M 410 324 L 410 348 L 320 348" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== final decision ===== -->
  <polygon points="260,328 320,348 260,368 200,348" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="352" text-anchor="middle" font-size="11" fill="#444">n == 1 ?</text>

  <path d="M 200 348 L 150 348" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="175" y="340" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="56" y="332" width="94" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="103" y="352" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return true</text>

  <!-- no -> false (reuse the false box on left, draw arrow up-left) -->
  <path d="M 260 368 L 260 386 L 110 386 L 110 236" stroke="#b85450" stroke-width="1.3" stroke-dasharray="3,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="380" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <text x="260" y="395" text-anchor="middle" font-size="9" fill="#888">三段试除独立执行，顺序无关（2/3/5 互质，先后不影响最终余数）</text>
</svg>
