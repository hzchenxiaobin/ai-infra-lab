<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="450" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：建树 → DFS 求最长根到叶路径权值和</text>
  <text x="320" y="46" text-anchor="middle" font-size="11" fill="#888">递归返回 informTime[u] + max{子树结果}；叶子 max 为 0，天然返回 0</text>

  <!-- ====== Step 1: build adjacency list ====== -->
  <rect x="100" y="62" width="440" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="84" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① 建邻接表 children</text>
  <text x="320" y="102" text-anchor="middle" font-size="11" fill="#5577aa">for i in 0..n-1：manager[i] ≠ -1 → children[manager[i]].append(i)</text>

  <!-- arrow down -->
  <path d="M 320 116 L 320 132" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ====== Step 2: call DFS ====== -->
  <rect x="250" y="136" width="140" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="159" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">② DFS(headID)</text>

  <!-- arrow down -->
  <path d="M 320 176 L 320 192" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ====== Step 3: init res ====== -->
  <rect x="260" y="196" width="120" height="32" rx="6" fill="#fafafa" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="217" text-anchor="middle" font-size="12" fill="#444">res ← 0</text>

  <!-- arrow down -->
  <path d="M 320 232 L 320 248" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ====== Step 4: loop over children (with recursion hint) ====== -->
  <rect x="150" y="252" width="340" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="273" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">③ for v in children(u)：</text>
  <text x="320" y="291" text-anchor="middle" font-size="11" fill="#a8842a">res = max(res, DFS(v))   ← 递归下探子树</text>

  <!-- recursion curved arrow: from right side of loop box, up & around to DFS box -->
  <path d="M 490 277 C 540 277 540 154 390 154" stroke="#446688" stroke-width="1.6" stroke-dasharray="5 3" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="556" y="218" text-anchor="middle" font-size="10" fill="#446688">递归</text>
  <text x="556" y="232" text-anchor="middle" font-size="10" fill="#446688">调用</text>

  <!-- arrow down -->
  <path d="M 320 306 L 320 322" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ====== Step 5: return ====== -->
  <rect x="200" y="326" width="240" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="351" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">④ return informTime[u] + res</text>

  <!-- arrow down -->
  <path d="M 320 370 L 320 386" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ====== Step 6: answer ====== -->
  <rect x="210" y="390" width="220" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="320" y="415" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">⑤ 答案 = DFS(headID)</text>

  <!-- ====== side note: leaf handling ====== -->
  <rect x="40" y="252" width="100" height="50" rx="6" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="90" y="272" text-anchor="middle" font-size="10" fill="#888">叶子无子节点</text>
  <text x="90" y="287" text-anchor="middle" font-size="10" fill="#888">max 为 0</text>
  <text x="90" y="300" text-anchor="middle" font-size="9" fill="#aaa">→ DFS=0</text>
  <path d="M 140 277 L 150 277" stroke="#bbb" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
</svg>
