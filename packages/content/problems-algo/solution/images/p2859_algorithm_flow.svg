<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一趟遍历下标，popcount 过滤累加</text>

  <!-- 开始 -->
  <ellipse cx="310" cy="46" rx="34" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="51" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M 310 61 L 310 74" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="230" y="76" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="310" y="95" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans = 0，i = 0</text>
  <path d="M 310 106 L 310 120" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 i < n -->
  <polygon points="310,122 396,158 310,194 224,158" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="310" y="163" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i &lt; n ?</text>

  <!-- 否 → 返回 -->
  <path d="M 396 158 L 450 158" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="150" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="452" y="140" width="112" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="508" y="162" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 ans</text>
  <path d="M 508 176 L 508 192" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="508" cy="206" rx="30" ry="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="508" y="211" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">结束</text>

  <!-- 是 → popcount -->
  <path d="M 310 194 L 310 214" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="208" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="200" y="216" width="220" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="310" y="236" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">c = popcount(i)（内置 / Kernighan）</text>
  <path d="M 310 248 L 310 262" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 c == k -->
  <polygon points="310,264 392,298 310,332 228,298" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="310" y="303" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">c == k ?</text>

  <!-- 是 → 累加 -->
  <path d="M 310 332 L 310 348" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="344" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="230" y="350" width="160" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="310" y="369" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans += nums[i]</text>
  <path d="M 310 380 L 310 392" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 否 → 绕行到 i++ -->
  <path d="M 392 298 L 448 298 L 448 405 L 394 405" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="404" y="290" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- i++ -->
  <rect x="230" y="392" width="160" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="310" y="409" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i++</text>

  <!-- 回到循环判断 -->
  <path d="M 230 405 L 140 405 L 140 158 L 220 158" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="284" font-size="11" fill="#446688" filter="url(#rough2)">下一轮</text>
</svg>
