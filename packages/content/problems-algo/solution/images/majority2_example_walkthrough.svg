<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [1, 1, 2, 3, 1, 2, 2]（n=7, ⌊n/3⌋=2）</text>

  <!-- Table header -->
  <rect x="30" y="44" width="50" height="26" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="62" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">步</text>
  <rect x="82" y="44" width="40" height="26" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="102" y="62" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">x</text>
  <rect x="124" y="44" width="60" height="26" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="154" y="62" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">cand1</text>
  <rect x="186" y="44" width="44" height="26" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="208" y="62" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">cnt1</text>
  <rect x="232" y="44" width="60" height="26" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="262" y="62" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">cand2</text>
  <rect x="294" y="44" width="44" height="26" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="316" y="62" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">cnt2</text>
  <rect x="340" y="44" width="190" height="26" fill="#d6a040" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="435" y="62" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">动作</text>

  <!-- Row: init -->
  <rect x="30" y="72" width="50" height="24" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="55" y="88" text-anchor="middle" font-size="10" fill="#888">init</text>
  <text x="102" y="88" text-anchor="middle" font-size="10" fill="#888">—</text>
  <text x="154" y="88" text-anchor="middle" font-size="10" fill="#888">∅</text>
  <text x="208" y="88" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="262" y="88" text-anchor="middle" font-size="10" fill="#888">∅</text>
  <text x="316" y="88" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="435" y="88" text-anchor="middle" font-size="9.5" fill="#888">初始化</text>

  <!-- Row 1: x=1, fill slot 1 -->
  <rect x="30" y="98" width="50" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="55" y="114" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>
  <text x="102" y="114" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>
  <rect x="124" y="98" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="154" y="114" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="208" y="114" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="262" y="114" text-anchor="middle" font-size="10" fill="#888">∅</text>
  <text x="316" y="114" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="435" y="114" text-anchor="middle" font-size="9.5" fill="#d6a040">cnt1==0 → 占槽1</text>

  <!-- Row 2: x=1, match cand1 -->
  <rect x="30" y="124" width="50" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="55" y="140" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>
  <text x="102" y="140" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>
  <text x="154" y="140" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="208" y="140" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="262" y="140" text-anchor="middle" font-size="10" fill="#888">∅</text>
  <text x="316" y="140" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="435" y="140" text-anchor="middle" font-size="9.5" fill="#4a7a3a">x==cand1 → +1</text>

  <!-- Row 3: x=2, fill slot 2 -->
  <rect x="30" y="150" width="50" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="55" y="166" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <text x="102" y="166" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>
  <text x="154" y="166" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="208" y="166" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="232" y="150" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="262" y="166" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">2</text>
  <text x="316" y="166" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">1</text>
  <text x="435" y="166" text-anchor="middle" font-size="9.5" fill="#d6a040">cnt2==0 → 占槽2</text>

  <!-- Row 4: x=3, both decrement -->
  <rect x="30" y="176" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="55" y="192" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">4</text>
  <text x="102" y="192" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <text x="154" y="192" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="208" y="192" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <text x="262" y="192" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="316" y="192" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">0</text>
  <text x="435" y="192" text-anchor="middle" font-size="9.5" fill="#b85450">三方混战 → 双减</text>

  <!-- Row 5: x=1, match cand1 -->
  <rect x="30" y="202" width="50" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="55" y="218" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">5</text>
  <text x="102" y="218" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>
  <text x="154" y="218" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="208" y="218" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="262" y="218" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="316" y="218" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="435" y="218" text-anchor="middle" font-size="9.5" fill="#4a7a3a">x==cand1 → +1</text>

  <!-- Row 6: x=2, match cand2 -->
  <rect x="30" y="228" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="55" y="244" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">6</text>
  <text x="102" y="244" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>
  <text x="154" y="244" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="208" y="244" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="262" y="244" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="316" y="244" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">1</text>
  <text x="435" y="244" text-anchor="middle" font-size="9.5" fill="#446688">x==cand2 → +1</text>

  <!-- Row 7: x=2, match cand2 -->
  <rect x="30" y="254" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="55" y="270" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">7</text>
  <text x="102" y="270" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>
  <text x="154" y="270" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="208" y="270" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="262" y="270" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="316" y="270" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">2</text>
  <text x="435" y="270" text-anchor="middle" font-size="9.5" fill="#446688">x==cand2 → +1</text>

  <!-- Separator -->
  <line x1="30" y1="288" x2="530" y2="288" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Second pass -->
  <text x="30" y="308" font-size="11.5" fill="#b85450" font-weight="bold">第二遍验证（统计真实出现次数）：</text>

  <rect x="40" y="318" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="140" y="336" text-anchor="middle" font-size="11" fill="#333">cand1 = 1</text>
  <text x="140" y="352" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">出现 3 次 &gt; ⌊7/3⌋=2 ✓</text>

  <rect x="280" y="318" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="380" y="336" text-anchor="middle" font-size="11" fill="#333">cand2 = 2</text>
  <text x="380" y="352" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">出现 3 次 &gt; ⌊7/3⌋=2 ✓</text>

  <!-- Result -->
  <rect x="140" y="380" width="280" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="400" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">最终结果</text>
  <text x="280" y="418" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">return [1, 2] ✓</text>

  <!-- Note -->
  <text x="280" y="448" text-anchor="middle" font-size="10" fill="#888">步骤4「双减」是关键：x=3 与两个候选都不同，cnt1 和 cnt2 各减 1</text>
  <text x="280" y="464" text-anchor="middle" font-size="10" fill="#888">步骤6 cnt2=0 但 x==cand2(2)，先匹配再判空 → cnt2 复活</text>
</svg>
