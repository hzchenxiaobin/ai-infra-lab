<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：0 格当「桥」，拼接多个岛屿</text>

  <!-- 3x3 grid: island A (tag2) + island B (tag3) + bridge 0 -->
  <!-- Row 0 -->
  <rect x="30" y="56" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="54" y="86" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="78" y="56" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="102" y="86" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="126" y="56" width="48" height="48" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="150" y="86" text-anchor="middle" font-size="14" fill="#bbb">0</text>

  <!-- Row 1 -->
  <rect x="30" y="104" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="54" y="134" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="78" y="104" width="48" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="102" y="134" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">★</text>
  <rect x="126" y="104" width="48" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="134" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>

  <!-- Row 2 -->
  <rect x="30" y="152" width="48" height="48" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="54" y="182" text-anchor="middle" font-size="14" fill="#bbb">0</text>
  <rect x="78" y="152" width="48" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="102" y="182" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="126" y="152" width="48" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="182" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>

  <!-- grid caption -->
  <text x="102" y="218" text-anchor="middle" font-size="10.5" fill="#888">蓝=岛A(tag2)　绿=岛B(tag3)　★=候选翻转格</text>

  <!-- Right: area table -->
  <text x="210" y="64" font-size="11.5" fill="#555" font-weight="bold">DFS 标记后记录面积：</text>
  <rect x="210" y="74" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="265" y="91" text-anchor="middle" font-size="12" fill="#333">area[2] = 3</text>
  <rect x="210" y="104" width="110" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="265" y="121" text-anchor="middle" font-size="12" fill="#333">area[3] = 3</text>

  <!-- arrow from bridge cell to formula -->
  <path d="M 126 128 Q 175 142 210 152" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4 2"/>

  <!-- Formula box -->
  <rect x="210" y="144" width="290" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="355" y="166" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">翻转 (1,1)：查四邻不同 tag</text>
  <text x="355" y="186" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">= 1 + area[2] + area[3]</text>
  <text x="355" y="202" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">= 1 + 3 + 3 = 7</text>

  <!-- Key insight -->
  <rect x="210" y="222" width="290" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="355" y="244" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">候选 = 1 + Σ area[四邻 unique tag]</text>
  <text x="355" y="262" text-anchor="middle" font-size="11" fill="#555">同一岛屿多邻接格 → set 去重</text>
  <text x="355" y="276" text-anchor="middle" font-size="11" fill="#555">遍历所有 0 格取最大候选</text>

  <!-- Bottom: edge case -->
  <rect x="30" y="298" width="470" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="265" y="318" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">无 0 格可翻转 → 直接返回最大岛屿面积</text>
  <text x="265" y="334" text-anchor="middle" font-size="11" fill="#555">ans = max(最大岛屿面积, 所有 0 格候选面积)</text>
</svg>
