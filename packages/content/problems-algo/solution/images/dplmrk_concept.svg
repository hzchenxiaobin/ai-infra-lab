<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：连续匹配计数——arr[i]==arr[i+m] 累计 m×(k−1) 次</text>

  <!-- Block labels -->
  <text x="102" y="48" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">块 0</text>
  <text x="194" y="48" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">块 1</text>
  <text x="286" y="48" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">块 2</text>

  <!-- Block brackets -->
  <path d="M 56 52 L 56 46 L 148 46 L 148 52" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 148 52 L 148 46 L 240 46 L 240 52" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 240 52 L 240 46 L 332 46 L 332 52" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- Array label -->
  <text x="30" y="76" font-size="11" fill="#888">arr =</text>

  <!-- Block 0: boxes 0,1 — blue -->
  <rect x="56" y="56" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="79" y="77" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="79" y="104" text-anchor="middle" font-size="9" fill="#888">i=0</text>

  <rect x="102" y="56" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="77" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <text x="125" y="104" text-anchor="middle" font-size="9" fill="#888">i=1</text>

  <!-- Block 1: boxes 2,3 — green -->
  <rect x="148" y="56" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="171" y="77" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="171" y="104" text-anchor="middle" font-size="9" fill="#888">i=2</text>

  <rect x="194" y="56" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="217" y="77" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <text x="217" y="104" text-anchor="middle" font-size="9" fill="#888">i=3</text>

  <!-- Block 2: boxes 4,5 — orange -->
  <rect x="240" y="56" width="46" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="263" y="77" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="263" y="104" text-anchor="middle" font-size="9" fill="#888">i=4</text>

  <rect x="286" y="56" width="46" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="309" y="77" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <text x="309" y="104" text-anchor="middle" font-size="9" fill="#888">i=5</text>

  <!-- Curved comparison arrows: arr[i] vs arr[i+m], m=2 -->
  <!-- Arc 1: arr[0]=1 → arr[2]=1, shallow -->
  <path d="M 79 88 Q 125 112 171 88" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="125" y="110" text-anchor="middle" font-size="9" fill="#82b366" font-weight="bold">✓</text>

  <!-- Arc 2: arr[1]=2 → arr[3]=2, deep -->
  <path d="M 125 88 Q 171 130 217 88" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="171" y="128" text-anchor="middle" font-size="9" fill="#82b366" font-weight="bold">✓</text>

  <!-- Arc 3: arr[2]=1 → arr[4]=1, shallow -->
  <path d="M 171 88 Q 217 112 263 88" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="217" y="110" text-anchor="middle" font-size="9" fill="#82b366" font-weight="bold">✓</text>

  <!-- Arc 4: arr[3]=2 → arr[5]=2, deep -->
  <path d="M 217 88 Q 263 130 309 88" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="263" y="128" text-anchor="middle" font-size="9" fill="#82b366" font-weight="bold">✓</text>

  <!-- Match counter label -->
  <text x="30" y="156" font-size="10" fill="#888">count =</text>

  <!-- Counter circles: 1, 2, 3, 4 at positions of arcs 1-4 -->
  <circle cx="125" cy="152" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="125" y="156" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>

  <circle cx="171" cy="152" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="171" y="156" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>

  <circle cx="217" cy="152" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="217" y="156" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">3</text>

  <circle cx="263" cy="152" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="263" y="157" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4</text>

  <!-- Target annotation -->
  <text x="350" y="156" font-size="10" fill="#b85450" font-weight="bold">= m×(k−1) = 2×2 → 命中!</text>

  <!-- Divider -->
  <line x1="30" y1="178" x2="530" y2="178" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- Key insight box -->
  <rect x="30" y="192" width="500" height="170" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="50" y="216" font-size="12" fill="#444" font-weight="bold">关键直觉：k 个相同块 ⟺ m×(k−1) 个连续位置满足 arr[i]==arr[i+m]</text>
  <text x="50" y="240" font-size="11" fill="#666">• 每个匹配说明"当前块的第 j 个元素 == 下一块的第 j 个元素"</text>
  <text x="50" y="260" font-size="11" fill="#666">• 块0==块1（前 m 个匹配）, 块1==块2（接下来 m 个匹配）, …</text>
  <text x="50" y="280" font-size="11" fill="#666">• 连续 m×(k−1) 个匹配 → 传递性保证 k 个块全等</text>
  <text x="50" y="306" font-size="12" fill="#b85450" font-weight="bold">→ 无需逐块比较，单次遍历 + 计数器即可判定</text>
  <text x="50" y="328" font-size="11" fill="#888">遇到不匹配 arr[i]≠arr[i+m] 时 count 清零（块链断裂，重新计数）</text>
  <text x="50" y="350" font-size="11" fill="#888">目标阈值 = m × (k − 1)，不是 m × k（只需 k−1 对相邻块相同）</text>
</svg>
