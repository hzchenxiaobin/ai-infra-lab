<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">偏移量计数：每对 1 投票给一个平移向量 (dr, dc)</text>

  <!-- img1 label -->
  <text x="103" y="58" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">img1</text>

  <!-- img1 grid 3x3, cell 34x34, origin (52, 70) -->
  <rect x="52" y="70" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="69" y="92" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>
  <rect x="86" y="70" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="103" y="92" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>
  <rect x="120" y="70" width="34" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="137" y="92" text-anchor="middle" font-size="13" fill="#ccc">0</text>
  <rect x="52" y="104" width="34" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="69" y="126" text-anchor="middle" font-size="13" fill="#ccc">0</text>
  <rect x="86" y="104" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="103" y="126" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>
  <rect x="120" y="104" width="34" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="137" y="126" text-anchor="middle" font-size="13" fill="#ccc">0</text>
  <rect x="52" y="138" width="34" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="69" y="160" text-anchor="middle" font-size="13" fill="#ccc">0</text>
  <rect x="86" y="138" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="103" y="160" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>
  <rect x="120" y="138" width="34" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="137" y="160" text-anchor="middle" font-size="13" fill="#ccc">0</text>

  <!-- Arrow from img1 to img2 -->
  <path d="M 162 121 L 366 121" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="264" y="110" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">平移 (dr, dc)</text>
  <text x="264" y="136" text-anchor="middle" font-size="11" fill="#888">dr = r2 - r1</text>
  <text x="264" y="152" text-anchor="middle" font-size="11" fill="#888">dc = c2 - c1</text>

  <!-- img2 label -->
  <text x="425" y="58" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">img2</text>

  <!-- img2 grid 3x3, cell 34x34, origin (374, 70) -->
  <rect x="374" y="70" width="34" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="391" y="92" text-anchor="middle" font-size="13" fill="#ccc">0</text>
  <rect x="408" y="70" width="34" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="425" y="92" text-anchor="middle" font-size="13" fill="#ccc">0</text>
  <rect x="442" y="70" width="34" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="459" y="92" text-anchor="middle" font-size="13" fill="#ccc">0</text>
  <rect x="374" y="104" width="34" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="391" y="126" text-anchor="middle" font-size="13" fill="#ccc">0</text>
  <rect x="408" y="104" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="425" y="126" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="442" y="104" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="459" y="126" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="374" y="138" width="34" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="391" y="160" text-anchor="middle" font-size="13" fill="#ccc">0</text>
  <rect x="408" y="138" width="34" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="425" y="160" text-anchor="middle" font-size="13" fill="#ccc">0</text>
  <rect x="442" y="138" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="459" y="160" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- Insight box -->
  <rect x="40" y="200" width="480" height="160" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="228" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">核心观察：偏移量计数（Offset Counting）</text>
  <text x="280" y="256" text-anchor="middle" font-size="11" fill="#555">① 收集 img1 中所有 1 的位置 A = [(r1,c1), ...]</text>
  <text x="280" y="278" text-anchor="middle" font-size="11" fill="#555">② 收集 img2 中所有 1 的位置 B = [(r2,c2), ...]</text>
  <text x="280" y="300" text-anchor="middle" font-size="11" fill="#555">③ 每对 (r1,c1) × (r2,c2) 确定唯一偏移 (dr,dc) = (r2−r1, c2−c1)</text>
  <text x="280" y="322" text-anchor="middle" font-size="11" fill="#555">④ cnt[(dr,dc)]++ → 票数最多的偏移即为最大重叠</text>
  <text x="280" y="346" text-anchor="middle" font-size="11" fill="#888">复杂度 O(P × Q)，P / Q 为两张图中 1 的个数（最坏 O(n⁴)，n ≤ 30）</text>
</svg>
