  <!-- divider -->
  <line x1="40" y1="212" x2="520" y2="212" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== Panel B: deduced letters ===== -->
  <text x="40" y="232" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">第二轮：扣除已知 → 推导剩余 5 个数字</text>

