  <rect x="118" y="296" width="20" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="128" y="312" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">v</text>
  <rect x="140" y="296" width="20" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="150" y="312" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">e</text>
  <rect x="162" y="296" width="20" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="172" y="312" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">n</text>
  <text x="196" y="312" font-size="11" fill="#888" filter="url(#rough2)">⇒</text>
  <text x="212" y="312" font-size="11" fill="#555" filter="url(#rough2)">= count['s'] − six</text>

  <!-- nine: n i n e, highlight i (idx 1), y=324 -->
  <rect x="40" y="324" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="53" y="340" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">9</text>
  <rect x="74" y="324" width="20" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
