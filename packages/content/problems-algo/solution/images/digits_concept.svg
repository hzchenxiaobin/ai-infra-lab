  <!-- one: o n e, highlight o (idx 0), y=352 -->
  <rect x="40" y="352" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="53" y="368" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="74" y="352" width="20" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="84" y="368" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">o</text>
