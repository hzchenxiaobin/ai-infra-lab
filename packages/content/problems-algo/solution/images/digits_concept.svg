  <text x="53" y="312" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="74" y="296" width="20" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="84" y="312" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">s</text>
  <rect x="96" y="296" width="20" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
