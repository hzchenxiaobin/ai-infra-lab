  <text x="196" y="132" font-size="11" fill="#555" filter="url(#rough2)">= count['u']</text>

  <!-- six: s i x, highlight x (idx 2), y=144 -->
  <rect x="40" y="144" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="53" y="160" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="74" y="144" width="20" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
