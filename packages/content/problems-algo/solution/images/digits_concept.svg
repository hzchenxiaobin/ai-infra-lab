  <rect x="96" y="240" width="20" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="106" y="256" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">h</text>
