  <rect x="74" y="268" width="20" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="84" y="284" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">f</text>
  <rect x="96" y="268" width="20" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="106" y="284" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">i</text>
  <rect x="118" y="268" width="20" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="128" y="284" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">v</text>
  <rect x="140" y="268" width="20" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="150" y="284" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">e</text>
  <text x="180" y="284" font-size="11" fill="#888" filter="url(#rough2)">⇒</text>
  <text x="196" y="284" font-size="11" fill="#555" filter="url(#rough2)">= count['f'] − four</text>

  <!-- seven: s e v e n, highlight s (idx 0), y=296 -->
