<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：每个数字都有「指纹字母」</text>

  <!-- ===== Panel A: unique letters ===== -->
  <text x="40" y="52" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">第一轮：唯一字母 → 直接识别 5 个数字</text>

  <!-- zero: z e r o, highlight z (idx 0), y=60 -->
  <rect x="40" y="60" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="53" y="76" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="74" y="60" width="20" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="84" y="76" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">z</text>
  <rect x="96" y="60" width="20" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="106" y="76" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">e</text>
  <rect x="118" y="60" width="20" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="128" y="76" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">r</text>
  <rect x="140" y="60" width="20" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="150" y="76" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">o</text>
  <text x="180" y="76" font-size="11" fill="#888" filter="url(#rough2)">⇒</text>
  <text x="196" y="76" font-size="11" fill="#555" filter="url(#rough2)">= count['z']</text>

  <!-- two: t w o, highlight w (idx 1), y=88 -->
  <rect x="40" y="88" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="53" y="104" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
