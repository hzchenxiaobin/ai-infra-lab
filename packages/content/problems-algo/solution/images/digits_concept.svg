  <text x="106" y="368" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">n</text>
  <rect x="118" y="352" width="20" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="128" y="368" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">e</text>
  <text x="180" y="368" font-size="11" fill="#888" filter="url(#rough2)">⇒</text>
