  <!-- bottom note -->
  <rect x="70" y="388" width="420" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="404" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">按此顺序推导，每步右侧变量均已已知 → 方程组三角化求解</text>
