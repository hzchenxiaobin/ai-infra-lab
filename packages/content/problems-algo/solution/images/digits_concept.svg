  <text x="150" y="256" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">e</text>
  <rect x="162" y="240" width="20" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="172" y="256" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">e</text>
  <text x="196" y="256" font-size="11" fill="#888" filter="url(#rough2)">⇒</text>
  <text x="212" y="256" font-size="11" fill="#555" filter="url(#rough2)">= count['h'] − eight</text>

  <!-- five: f i v e, highlight f (idx 0), y=268 -->
  <rect x="40" y="268" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
