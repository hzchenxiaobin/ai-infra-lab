<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="480" height="440" fill="#fafafa"/>

  <text x="240" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：去公因子 2 → 判奇偶 → 返回</text>

  <!-- 开始 -->
  <rect x="150" y="46" width="180" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="17" filter="url(#rough2)"/>
  <text x="240" y="68" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">输入 p, q</text>

  <path d="M 240 82 L 240 98" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- while 循环：去因子 2 -->
  <polygon points="240,100 380,155 240,210 100,155" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="148" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">p 和 q 同为偶？</text>
  <text x="240" y="166" text-anchor="middle" font-size="10" fill="#888">while p%2==0 and q%2==0</text>

  <!-- Yes → 除以 2 → 回到判断 -->
  <path d="M 100 155 L 60 155 L 60 110 L 150 110" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="80" y="148" font-size="10" fill="#4a7a3a" font-weight="bold">Yes</text>
  <rect x="50" y="178" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="90" y="196" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">p/=2, q/=2</text>
  <path d="M 90 178 L 90 155" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="3 2" filter="url(#rough2)"/>

  <!-- No → 判 p 奇偶 -->
  <path d="M 240 210 L 240 230" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="248" y="224" font-size="10" fill="#888">No</text>

  <!-- 判断 p 偶？ -->
  <polygon points="240,232 350,272 240,312 130,272" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="268" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">p 为偶？</text>
  <text x="240" y="286" text-anchor="middle" font-size="10" fill="#888">（k = p/g 为偶）</text>

  <!-- Yes → return 2 -->
  <path d="M 130 272 L 80 272" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="110" y="264" font-size="10" fill="#b85450" font-weight="bold">Yes</text>
  <rect x="20" y="255" width="56" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="17" filter="url(#rough2)"/>
  <text x="48" y="277" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return 2</text>

  <!-- No → 判 q 偶？ -->
  <path d="M 240 312 L 240 332" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="248" y="326" font-size="10" fill="#888">No</text>

  <!-- 判断 q 偶？ -->
  <polygon points="240,334 350,374 240,414 130,374" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="370" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">q 为偶？</text>
  <text x="240" y="388" text-anchor="middle" font-size="10" fill="#888">（m = q/g 为偶）</text>

  <!-- Yes → return 0 -->
  <path d="M 130 374 L 80 374" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="110" y="366" font-size="10" fill="#4a7a3a" font-weight="bold">Yes</text>
  <rect x="20" y="357" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="17" filter="url(#rough2)"/>
  <text x="48" y="379" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return 0</text>

  <!-- No → return 1 -->
  <path d="M 350 374 L 400 374" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="368" y="366" font-size="10" fill="#d6a040" font-weight="bold">No</text>
  <rect x="400" y="357" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="17" filter="url(#rough2)"/>
  <text x="430" y="379" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">return 1</text>

  <!-- 底部说明 -->
  <rect x="120" y="416" width="240" height="20" fill="none" stroke="none"/>
  <text x="240" y="432" text-anchor="middle" font-size="10" fill="#888">时间 O(log min(p,q))，空间 O(1)</text>
</svg>
