<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrGray" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#999999"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：交集还是矩形，正方形边长 = min(w, h)</text>

  <!-- axes -->
  <path d="M 38 338 L 316 338" stroke="#999" stroke-width="1.4" fill="none" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <path d="M 38 338 L 38 100" stroke="#999" stroke-width="1.4" fill="none" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <text x="322" y="342" font-size="11" fill="#999" filter="url(#rough2)">x</text>
  <text x="28" y="98" font-size="11" fill="#999" filter="url(#rough2)">y</text>

  <!-- rectangle A: (1,1)-(5,5) -->
  <rect x="76" y="150" width="144" height="144" fill="#e8f0fe" fill-opacity="0.5" stroke="#446688" stroke-width="1.8" rx="2" filter="url(#rough2)"/>
  <text x="95" y="284" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">A</text>

  <!-- rectangle B: (3,2)-(7,6) -->
  <rect x="148" y="114" width="144" height="144" fill="#e6f4ea" fill-opacity="0.5" stroke="#4a7a3a" stroke-width="1.8" rx="2" filter="url(#rough2)"/>
  <text x="262" y="138" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">B</text>

  <!-- intersection: x [3,5] w=2, y [2,5] h=3 -->
  <rect x="148" y="150" width="72" height="108" fill="#fff8e1" fill-opacity="0.85" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6 4" rx="2" filter="url(#rough2)"/>
  <text x="184" y="244" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">交集 2×3</text>

  <!-- largest inscribed square: side = min(2,3) = 2 -->
  <rect x="148" y="150" width="72" height="72" fill="#fce4ec" fill-opacity="0.9" stroke="#b85450" stroke-width="2.4" rx="2" filter="url(#rough2)"/>
  <text x="184" y="174" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">最大正方形</text>
  <text x="184" y="194" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">s = 2</text>

  <!-- legend -->
  <rect x="40" y="356" width="16" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="62" y="368" font-size="10.5" fill="#446688" filter="url(#rough2)">A = (1,1) ~ (5,5)</text>
  <rect x="180" y="356" width="16" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="202" y="368" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">B = (3,2) ~ (7,6)</text>

  <!-- right panel: formulas -->
  <rect x="330" y="60" width="178" height="290" fill="#ffffff" stroke="#d6a040" stroke-width="1.4" rx="10" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="419" y="86" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">交集矩形公式</text>
  <text x="419" y="112" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">宽 w = min(右) − max(左)</text>
  <text x="419" y="132" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">= min(5,7) − max(1,3) = 2</text>
  <text x="419" y="158" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">高 h = min(上) − max(下)</text>
  <text x="419" y="178" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">= min(5,6) − max(1,2) = 3</text>
  <text x="419" y="204" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">相交条件：w > 0 且 h > 0</text>
  <path d="M 344 222 L 494 222" stroke="#d6a040" stroke-width="1" stroke-dasharray="4 4" fill="none" filter="url(#rough2)"/>
  <text x="419" y="246" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">正方形边长（红框）</text>
  <text x="419" y="268" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">s = min(w, h) = min(2,3) = 2</text>
  <text x="419" y="292" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">面积 = s × s = 4</text>
  <text x="419" y="322" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">斜放不可能更大（见正文）</text>
</svg>
