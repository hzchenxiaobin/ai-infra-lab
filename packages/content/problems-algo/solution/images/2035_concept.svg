<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心：数组劈两半，各自枚举子集，按个数 k 配对拼出 n 元</text>
  <text x="300" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">2n 个元素 → 前 n 个(A) + 后 n 个(B)；n 元子集 = A 取 k 个 + B 取 n−k 个</text>

  <!-- Array cells row: 2n cells, A(blue) | B(green) -->
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="60" y="74" font-size="10" fill="#888">下标</text>
    <text x="110" y="74" font-size="9" fill="#888">0</text>
    <text x="170" y="74" font-size="9" fill="#888">…</text>
    <text x="230" y="74" font-size="9" fill="#888">n−1</text>
    <text x="290" y="74" font-size="9" fill="#888">n</text>
    <text x="350" y="74" font-size="9" fill="#888">…</text>
    <text x="410" y="74" font-size="9" fill="#888">2n−1</text>

    <!-- A half (blue) -->
    <rect x="86" y="84" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="108" y="103" fill="#446688" font-weight="bold">A[0]</text>
    <rect x="146" y="84" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="168" y="103" fill="#888">…</text>
    <rect x="206" y="84" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="228" y="103" fill="#446688" font-weight="bold" font-size="10">A[n−1]</text>
    <!-- B half (green) -->
    <rect x="266" y="84" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="288" y="103" fill="#4a7a3a" font-weight="bold" font-size="10">B[0]</text>
    <rect x="326" y="84" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="348" y="103" fill="#888">…</text>
    <rect x="386" y="84" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="408" y="103" fill="#4a7a3a" font-weight="bold" font-size="10">B[n−1]</text>
  </g>

  <!-- split divider -->
  <path d="M 260 70 L 260 120" stroke="#b85450" stroke-width="2.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">从中间劈开</text>

  <!-- braces -->
  <path d="M 86 120 L 86 126 L 250 126 L 250 120" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="168" y="142" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">半 A（n 个元素）</text>
  <path d="M 266 120 L 266 126 L 430 126 L 430 120" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="348" y="142" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">半 B（n 个元素）</text>

  <!-- arrows down to enumeration boxes -->
  <path d="M 168 150 L 168 172" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 348 150 L 348 172" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Enumeration boxes -->
  <rect x="50" y="178" width="240" height="116" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="170" y="200" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">枚举 A 的 2^n 个子集</text>
  <text x="170" y="218" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">按子集大小 k 分组：</text>
  <text x="70" y="238" font-size="10" fill="#333" filter="url(#rough2)">sumsA[0] = {0}</text>
  <text x="70" y="254" font-size="10" fill="#333" filter="url(#rough2)">sumsA[1] = {各 1 元子和}</text>
  <text x="70" y="270" font-size="10" fill="#333" filter="url(#rough2)">…</text>
  <text x="70" y="286" font-size="10" fill="#333" filter="url(#rough2)">sumsA[k] = {各 k 元子和}</text>

  <rect x="310" y="178" width="240" height="116" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="430" y="200" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">枚举 B 的 2^n 个子集</text>
  <text x="430" y="218" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">按子集大小 k 分组：</text>
  <text x="330" y="238" font-size="10" fill="#333" filter="url(#rough2)">sumsB[0] = {0}</text>
  <text x="330" y="254" font-size="10" fill="#333" filter="url(#rough2)">sumsB[1] = {各 1 元子和}</text>
  <text x="330" y="270" font-size="10" fill="#333" filter="url(#rough2)">…</text>
  <text x="330" y="286" font-size="10" fill="#333" filter="url(#rough2)">sumsB[n−k] 排序待查</text>

  <!-- arrows down to combine -->
  <path d="M 170 298 L 250 322" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 430 298 L 350 322" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Combination box -->
  <rect x="60" y="328" width="480" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="350" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">配对阶段：对每个 k ∈ [0, n]</text>
  <text x="300" y="370" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">遍历 s1 ∈ sumsA[k]，在排序的 sumsB[n−k] 中二分</text>
  <text x="300" y="386" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">找最接近 (S/2 − s1) 的 s2，更新 |2(s1+s2) − S|</text>

  <!-- bottom note -->
  <rect x="40" y="418" width="520" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="436" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">指数从 2^(2n) 降到 2·2^n：n=15 时 1.55×10^8 → 32768+32768</text>
  <text x="300" y="452" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">范德蒙恒等式保证 Σ_k C(n,k)·C(n,n−k) = C(2n,n) 不漏不重</text>
</svg>
