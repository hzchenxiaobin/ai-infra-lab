<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 348"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="348" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：x=3, y=4, points=[[1,2],[3,1],[2,4],[2,3],[4,4]] → 返回 2</text>
  <text x="310" y="40" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">初值 bestDist=∞, bestIdx=−1；有效才算 dist，严格 &lt; 才更新</text>

  <!-- Header row -->
  <rect x="20" y="52" width="590" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="55" y="71">下标 i</text>
    <text x="145" y="71">点 (a,b)</text>
    <text x="245" y="71">有效性</text>
    <text x="330" y="71">dist</text>
    <text x="415" y="71">bestDist</text>
    <text x="490" y="71">bestIdx</text>
    <text x="575" y="71">说明</text>
  </g>

  <!-- Init row -->
  <rect x="20" y="86" width="590" height="28" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" fill="#555" text-anchor="middle">
    <text x="55" y="104" font-weight="bold">初始</text>
    <text x="145" y="104">—</text>
    <text x="245" y="104">—</text>
    <text x="330" y="104">—</text>
    <text x="415" y="104" font-weight="bold">∞</text>
    <text x="490" y="104" font-weight="bold">−1</text>
    <text x="575" y="104" font-size="9.5" fill="#888">哨兵初值</text>
  </g>

  <!-- i=0: (1,2) invalid -->
  <rect x="20" y="116" width="590" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" fill="#555" text-anchor="middle">
    <text x="55" y="134" font-weight="bold">0</text>
    <text x="145" y="134">(1,2)</text>
    <text x="245" y="134" fill="#aaa">a≠x, b≠y</text>
    <text x="330" y="134" fill="#aaa">∞</text>
    <text x="415" y="134">∞</text>
    <text x="490" y="134">−1</text>
    <text x="575" y="134" font-size="9.5" fill="#888">无效，跳过</text>
  </g>

  <!-- i=1: (3,1) a==x, dist=3 -->
  <rect x="20" y="146" width="590" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" fill="#555" text-anchor="middle">
    <text x="55" y="164" font-weight="bold">1</text>
    <text x="145" y="164">(3,1)</text>
    <text x="245" y="164" fill="#446688" font-weight="bold">a=x ✓</text>
    <text x="330" y="164" fill="#d6a040" font-weight="bold">3</text>
    <text x="415" y="164" font-weight="bold">3</text>
    <text x="490" y="164" font-weight="bold">1</text>
    <text x="575" y="164" font-size="9.5" fill="#888">首个有效，更新</text>
  </g>

  <!-- i=2: (2,4) b==y, dist=1, HIGHLIGHTED (best updates) -->
  <rect x="20" y="176" width="590" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <text x="55" y="194" fill="#333" font-weight="bold">2</text>
    <text x="145" y="194" fill="#333" font-weight="bold">(2,4)</text>
    <text x="245" y="194" fill="#4a7a3a" font-weight="bold">b=y ✓</text>
    <text x="330" y="194" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="415" y="194" fill="#4a7a3a" font-weight="bold">1 ←</text>
    <text x="490" y="194" fill="#4a7a3a" font-weight="bold">2 ←</text>
    <text x="575" y="194" font-size="9.5" fill="#4a7a3a" font-weight="bold">更近，更新！</text>
  </g>

  <!-- i=3: (2,3) invalid -->
  <rect x="20" y="206" width="590" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" fill="#555" text-anchor="middle">
    <text x="55" y="224" font-weight="bold">3</text>
    <text x="145" y="224">(2,3)</text>
    <text x="245" y="224" fill="#aaa">a≠x, b≠y</text>
    <text x="330" y="224" fill="#aaa">∞</text>
    <text x="415" y="224">1</text>
    <text x="490" y="224">2</text>
    <text x="575" y="224" font-size="9.5" fill="#888">无效，跳过</text>
  </g>

  <!-- i=4: (4,4) b==y, dist=1, tie — NOT update (key row) -->
  <rect x="20" y="236" width="590" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <text x="55" y="254" fill="#333" font-weight="bold">4</text>
    <text x="145" y="254" fill="#333" font-weight="bold">(4,4)</text>
    <text x="245" y="254" fill="#d6a040" font-weight="bold">b=y ✓</text>
    <text x="330" y="254" fill="#d6a040" font-weight="bold">1</text>
    <text x="415" y="254" fill="#555">1</text>
    <text x="490" y="254" fill="#555">2</text>
    <text x="575" y="254" font-size="9.5" fill="#d6a040" font-weight="bold">并列，1&lt;1 假，不覆盖</text>
  </g>

  <!-- Result arrow + box -->
  <path d="M 490 268 L 490 290" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="350" y="294" width="280" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="490" y="318" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 bestIdx = 2 ✓</text>
</svg>
