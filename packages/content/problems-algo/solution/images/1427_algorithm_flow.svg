<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：累加净移位 → 取模 → 一次切片</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888">三阶段：① 初始化 delta ② 遍历 shift 累加 ③ 取模后切片返回</text>

  <!-- ===== Phase 1: init ===== -->
  <rect x="40" y="62" width="170" height="110" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" fill-opacity="0.35" filter="url(#rough2)"/>
  <text x="125" y="84" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">阶段 ① 初始化</text>
  <rect x="70" y="98" width="110" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="125" y="118" text-anchor="middle" font-size="11" fill="#333">n = len(s)</text>
  <path d="M 125 132 L 125 148" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="70" y="152" width="110" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="125" y="172" text-anchor="middle" font-size="11" fill="#333">delta = 0</text>

  <!-- arrow to phase 2 -->
  <path d="M 210 117 L 246 117" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Phase 2: accumulate ===== -->
  <rect x="250" y="62" width="230" height="290" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" fill-opacity="0.35" filter="url(#rough2)"/>
  <text x="365" y="84" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">阶段 ② 遍历 shift 累加</text>
  <rect x="290" y="98" width="150" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="365" y="118" text-anchor="middle" font-size="10" fill="#333">for (dir, amt) in shift</text>
  <path d="M 365 132 L 365 150" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="365,154 445,196 365,238 285,196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="365" y="192" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">dir == 1 ?</text>
  <text x="365" y="206" text-anchor="middle" font-size="9" fill="#888">(右移)</text>

  <!-- left branch: no -->
  <path d="M 285 196 L 268 196 L 268 256 L 282 256" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="262" y="226" text-anchor="end" font-size="9" fill="#b85450" font-weight="bold">否(左移)</text>
  <rect x="284" y="242" width="76" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="322" y="262" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">delta −= amt</text>

  <!-- right branch: yes -->
  <path d="M 445 196 L 462 196 L 462 256 L 448 256" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="468" y="226" font-size="9" fill="#4a7a3a" font-weight="bold">是(右移)</text>
  <rect x="370" y="242" width="76" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="408" y="262" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">delta += amt</text>

  <!-- merge down -->
  <path d="M 322 272 L 322 286 L 408 286 L 408 272" stroke="#999" stroke-width="1.2" fill="none"/>
  <path d="M 365 286 L 365 300" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop back to for -->
  <path d="M 290 113 L 264 113 L 264 258 L 284 258" stroke="none"/>
  <path d="M 448 258 L 480 258 L 480 113 L 440 113" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="492" y="188" font-size="8" fill="#888">下一条</text>
  <text x="492" y="200" font-size="8" fill="#888">shift</text>

  <!-- note -->
  <rect x="284" y="306" width="162" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" fill-opacity="0.5" filter="url(#rough2)"/>
  <text x="365" y="320" text-anchor="middle" font-size="9" fill="#b85450">delta 可为负 / 远大于 n</text>
  <text x="365" y="332" text-anchor="middle" font-size="9" fill="#b85450">⇒ 阶段 ③ 取模归一化</text>

  <!-- arrow to phase 3 -->
  <path d="M 480 117 L 516 117" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Phase 3: mod + slice ===== -->
  <rect x="520" y="62" width="80" height="290" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" fill-opacity="0.4" filter="url(#rough2)"/>
  <text x="560" y="84" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">阶段 ③</text>
  <rect x="530" y="98" width="60" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="560" y="112" text-anchor="middle" font-size="9" fill="#333">delta =</text>
  <text x="560" y="124" text-anchor="middle" font-size="9" fill="#333">((d%n)+n)%n</text>
  <path d="M 560 136 L 560 152" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="530" y="156" width="60" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="560" y="172" text-anchor="middle" font-size="9" fill="#333">s[n−d:]</text>
  <text x="560" y="184" text-anchor="middle" font-size="9" fill="#333">+</text>
  <text x="560" y="192" text-anchor="middle" font-size="9" fill="#333">s[:n−d]</text>
  <path d="M 560 200 L 560 216" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="528" y="220" width="64" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="560" y="242" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return</text>

  <!-- ===== Bottom-left: complexity ===== -->
  <rect x="40" y="200" width="170" height="152" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="125" y="222" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">复杂度</text>
  <text x="50" y="242" font-size="10" fill="#333">时间 O(n + m)：</text>
  <text x="50" y="256" font-size="9" fill="#555">遍历 shift 累加 O(m)</text>
  <text x="50" y="268" font-size="9" fill="#555">一次切片 O(n)</text>
  <text x="50" y="286" font-size="10" fill="#333">空间 O(n)：</text>
  <text x="50" y="300" font-size="9" fill="#555">切片产生新串</text>
  <text x="50" y="312" font-size="9" fill="#555">(原地翻转可 O(1) 额外)</text>
  <text x="50" y="332" font-size="9" fill="#888">m = shift.length, n = len(s)</text>

  <!-- ===== Bottom: brute force contrast ===== -->
  <rect x="40" y="368" width="540" height="62" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310" y="390" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">对比暴力 O(m·n) 逐次搬运</text>
  <text x="54" y="408" font-size="10" fill="#555">• 暴力：对每条 shift 实际移动字符，amount 步 × 每步 O(n) ⇒ 重复搬运，amount 可达 100、m 可达 100。</text>
  <text x="54" y="422" font-size="10" fill="#555">• 累加：旋转可叠加 ⇒ 只记一个 delta，取模把巨大/负的偏移归一到 [0,n)，最后一次性切片。</text>

  <text x="310" y="450" text-anchor="middle" font-size="10" fill="#888">关键：移位 = 循环旋转，叠加 + 取模 ⇒ m 次操作塌缩为一次 O(n) 切片</text>
</svg>
