<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 348" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="348" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [9,6,7,13]，按偶数 6 切成两段极大奇数段</text>

  <!-- array row -->
  <text x="40" y="76" font-size="12" fill="#888">nums:</text>

  <rect x="160" y="56" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="184" y="79" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">9</text>

  <rect x="212" y="56" width="48" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="236" y="79" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>

  <rect x="264" y="56" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="288" y="79" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">7</text>

  <rect x="316" y="56" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="340" y="79" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">13</text>

  <text x="184" y="108" text-anchor="middle" font-size="10" fill="#4a7a3a">奇</text>
  <text x="236" y="108" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">偶</text>
  <text x="288" y="108" text-anchor="middle" font-size="10" fill="#4a7a3a">奇</text>
  <text x="340" y="108" text-anchor="middle" font-size="10" fill="#4a7a3a">奇</text>

  <!-- brackets -->
  <path d="M 160 50 L 160 44 L 208 44 L 208 50" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="184" y="38" text-anchor="middle" font-size="10" fill="#4a7a3a">全奇段 L=1 → 1 个</text>

  <path d="M 264 50 L 264 44 L 364 44 L 364 50" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="314" y="38" text-anchor="middle" font-size="10" fill="#4a7a3a">全奇段 L=2 → 3 个</text>

  <!-- DP table -->
  <!-- header -->
  <rect x="40" y="126" width="460" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="100" y1="126" x2="100" y2="152" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="180" y1="126" x2="180" y2="152" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="260" y1="126" x2="260" y2="152" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="350" y1="126" x2="350" y2="152" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="70" y="143" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">i</text>
  <text x="140" y="143" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">nums[i]</text>
  <text x="220" y="143" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">奇偶</text>
  <text x="305" y="143" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">oddRun</text>
  <text x="400" y="143" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">allOdd 累计</text>

  <!-- row 0 -->
  <rect x="40" y="152" width="460" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="70" y="168" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="140" y="168" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">9</text>
  <text x="220" y="168" text-anchor="middle" font-size="11" fill="#4a7a3a">奇</text>
  <text x="305" y="168" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="400" y="168" text-anchor="middle" font-size="11" fill="#333">1</text>

  <!-- row 1 -->
  <rect x="40" y="176" width="460" height="24" fill="#fff8e1" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="70" y="192" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="140" y="192" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>
  <text x="220" y="192" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">偶</text>
  <text x="305" y="192" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="400" y="192" text-anchor="middle" font-size="11" fill="#333">1</text>

  <!-- row 2 -->
  <rect x="40" y="200" width="460" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="70" y="216" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="140" y="216" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7</text>
  <text x="220" y="216" text-anchor="middle" font-size="11" fill="#4a7a3a">奇</text>
  <text x="305" y="216" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="400" y="216" text-anchor="middle" font-size="11" fill="#333">2</text>

  <!-- row 3 (highlighted) -->
  <rect x="40" y="224" width="460" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="241" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="140" y="241" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">13</text>
  <text x="220" y="241" text-anchor="middle" font-size="11" fill="#4a7a3a">奇</text>
  <text x="305" y="241" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="400" y="241" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">4</text>

  <!-- vertical separators for body rows -->
  <line x1="100" y1="152" x2="100" y2="250" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="180" y1="152" x2="180" y2="250" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="260" y1="152" x2="260" y2="250" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="350" y1="152" x2="350" y2="250" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- note -->
  <text x="270" y="272" text-anchor="middle" font-size="11" fill="#555">allOdd = 1+0+1+2 = 4（即两段全奇子数组之和）</text>

  <!-- result box -->
  <rect x="60" y="286" width="420" height="44" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="306" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">答案 = total − allOdd = 10 − 4 = 6</text>
  <text x="270" y="324" text-anchor="middle" font-size="11" fill="#555">total = n(n+1)/2 = 4·5/2 = 10</text>
</svg>
