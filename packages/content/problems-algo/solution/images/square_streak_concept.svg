<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="880" height="440" fill="#fdfcf7"/>

  <text x="440" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">最长方波：平方关系构成「链森林」</text>
  <path d="M 300 38 Q 440 46 580 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- input -->
  <text x="60" y="68" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">输入 nums = [4, 3, 6, 16, 8, 2]</text>

  <!-- step 1 -->
  <text x="60" y="96" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">① 去重 + 哈希集合 → {2, 3, 4, 6, 8, 16}</text>

  <!-- step 2 -->
  <text x="60" y="124" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">② 每个值的后继唯一 = v²，跟随成链（不是搜索）</text>

  <!-- winning chain: 2 -> 4 -> 16 -> 256(not in set) -->
  <!-- node 2 -->
  <g filter="url(#sk)"><rect x="72" y="148" width="48" height="36" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="96" y="171" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">2</text>
  <!-- arrow 2->4 -->
  <path d="M 120 166 L 168 166" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="144" y="158" text-anchor="middle" font-size="10" fill="#2e6e2e" filter="url(#sk)">平方</text>
  <!-- node 4 -->
  <g filter="url(#sk)"><rect x="168" y="148" width="48" height="36" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="192" y="171" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">4</text>
  <!-- arrow 4->16 -->
  <path d="M 216 166 L 264 166" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="240" y="158" text-anchor="middle" font-size="10" fill="#2e6e2e" filter="url(#sk)">平方</text>
  <!-- node 16 -->
  <g filter="url(#sk)"><rect x="264" y="148" width="48" height="36" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="288" y="171" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">16</text>
  <!-- arrow 16->256 -->
  <path d="M 312 166 L 360 166" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="336" y="158" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#sk)">平方</text>
  <!-- node 256 not in set -->
  <g filter="url(#sk)"><rect x="360" y="146" width="86" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3"/></g>
  <text x="403" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">256 ✗</text>
  <text x="403" y="180" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#sk)">不在集合</text>

  <!-- brace + length label under 2,4,16 -->
  <path d="M 72 196 Q 72 206 96 206 L 96 206 Q 192 206 192 206 Q 288 206 288 206 L 288 206 Q 312 206 312 196" stroke="#4a8e4a" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="180" y="224" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">最长链长度 = 3 ✓</text>

  <!-- right box: other start points -->
  <g filter="url(#sk)">
    <rect x="490" y="146" width="340" height="120" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/>
  </g>
  <text x="510" y="170" font-size="12" font-weight="bold" fill="#444" filter="url(#sk)">其余起点（链长 = 1，无后继）</text>
  <text x="510" y="194" font-size="11" fill="#444" filter="url(#sk)">3 → 9 ✗（9 不在集合）</text>
  <text x="510" y="216" font-size="11" fill="#444" filter="url(#sk)">6 → 36 ✗（36 不在集合）</text>
  <text x="510" y="238" font-size="11" fill="#444" filter="url(#sk)">8 → 64 ✗（64 不在集合）</text>
  <text x="510" y="258" font-size="10" fill="#888" filter="url(#sk)">起点 v 的后继 v² 落在集合外 → 链断</text>

  <!-- bottom insight box -->
  <g filter="url(#sk)">
    <rect x="60" y="290" width="760" height="130" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/>
  </g>
  <text x="80" y="314" font-size="13" font-weight="bold" fill="#444" filter="url(#sk)">关键洞察（为什么是 O(n) 而非指数搜索）</text>
  <text x="80" y="338" font-size="11" fill="#444" filter="url(#sk)">1. 子序列排序后判定方波 → nums 中元素顺序无关，只看「值的集合」（去重）。</text>
  <text x="80" y="360" font-size="11" fill="#444" filter="url(#sk)">2. 后继唯一确定：v 的下一位只能是 v² → 跟随计数即可，无需组合枚举子序列。</text>
  <text x="80" y="382" font-size="11" fill="#444" filter="url(#sk)">3. 与 128 最长连续序列同构：相邻关系由「+1」换成「平方(v²)」。</text>
  <text x="80" y="404" font-size="11" fill="#7a5415" filter="url(#sk)">   值域 nums[i] ≤ 1e5 → 可用数组代替哈希，O(1) 查后继 + O(1) 存 dp。</text>
</svg>
