<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="30" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">核心观察：只跟踪路径和模 K 的余数</text>

  <!-- 3x3 grid, cell=44, origin x=60 y=70 -->
  <g filter="url(#rough2)">
    <rect x="60" y="70" width="44" height="44" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="4"/>
    <rect x="104" y="70" width="44" height="44" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="4"/>
    <rect x="148" y="70" width="44" height="44" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="4"/>
    <rect x="60" y="114" width="44" height="44" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="4"/>
    <rect x="104" y="114" width="44" height="44" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="4"/>
    <rect x="148" y="114" width="44" height="44" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="4"/>
    <rect x="60" y="158" width="44" height="44" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="4"/>
    <rect x="104" y="158" width="44" height="44" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="4"/>
    <rect x="148" y="158" width="44" height="44" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="4"/>
  </g>
  <g font-size="16" fill="#333" filter="url(#rough2)">
    <text x="82" y="98" text-anchor="middle">5</text>
    <text x="126" y="98" text-anchor="middle">2</text>
    <text x="170" y="98" text-anchor="middle">4</text>
    <text x="82" y="142" text-anchor="middle">3</text>
    <text x="126" y="142" text-anchor="middle">0</text>
    <text x="170" y="142" text-anchor="middle">5</text>
    <text x="82" y="186" text-anchor="middle">0</text>
    <text x="126" y="186" text-anchor="middle">7</text>
    <text x="170" y="186" text-anchor="middle">2</text>
  </g>
  <text x="126" y="60" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">grid, k=3</text>

  <!-- red path: (0,0)->(0,1)->(0,2)->(1,2)->(2,2) -->
  <path d="M82 92 L126 92 L170 92 L170 136 L170 180" fill="none" stroke="#b85450"
        stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <!-- blue path: (0,0)->(1,0)->(1,1)->(1,2)->(2,2) -->
  <path d="M82 92 L82 136 L126 136 L170 136 L170 180" fill="none" stroke="#446688"
        stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- path sum annotations -->
  <text x="220" y="100" font-size="12" fill="#b85450" filter="url(#rough2)">红路径和 = 5+2+4+5+2 = 18</text>
  <text x="220" y="118" font-size="12" fill="#b85450" filter="url(#rough2)">18 % 3 = 0  ✓ 被整除</text>
  <text x="220" y="148" font-size="12" fill="#446688" filter="url(#rough2)">蓝路径和 = 5+3+0+5+2 = 15</text>
  <text x="220" y="166" font-size="12" fill="#446688" filter="url(#rough2)">15 % 3 = 0  ✓ 被整除</text>

  <!-- insight box 1 -->
  <rect x="40" y="214" width="520" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="300" y="240" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">路径总数达 C(m+n-2, m-1) 条，和可达天文数字 → 但「能否被 k 整除」只看 sum % k</text>

  <!-- insight box 2: state -->
  <rect x="40" y="268" width="520" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="300" y="288" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">状态 dp[i][j][r] = 到达 (i,j) 且路径和 ≡ r (mod k) 的方案数，r ∈ [0, k) 共 k 种</text>
  <text x="300" y="305" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">维度 (i,j) 记位置，第三维 r 记余数——把无穷大的「和」压缩到 k 个桶</text>

  <!-- insight box 3: transition -->
  <rect x="40" y="322" width="520" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="300" y="346" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">转移：dp[i][j][r] = dp[上][(r-g) mod k] + dp[左][(r-g) mod k]</text>
  <text x="300" y="367" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">g = grid[i][j] mod k；前驱余数 pr 满足 (pr + g) ≡ r，故 pr = (r-g) mod k</text>
</svg>
