<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：0.9(9) vs 1. → true</text>

  <text x="40" y="56" font-size="12" fill="#888" font-weight="bold">左：s = "0.9(9)"</text>

  <rect x="40" y="66" width="480" height="120" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>

  <text x="60" y="88" font-size="11" fill="#446688" font-weight="bold">拆分</text>
  <text x="60" y="106" font-size="10" fill="#333">I=0, N="9", R="9"</text>
  <text x="60" y="120" font-size="9" fill="#888">n=1, r=1</text>

  <text x="200" y="88" font-size="11" fill="#d6a040" font-weight="bold">套公式</text>
  <text x="200" y="106" font-size="10" fill="#333">den = 10¹·(10¹−1) = 10·9 = 90</text>
  <text x="200" y="122" font-size="10" fill="#333">num = 0·90 + 9·9 + 9</text>
  <text x="200" y="138" font-size="10" fill="#333">    = 81 + 9 = 90</text>

  <text x="420" y="88" font-size="11" fill="#b85450" font-weight="bold">化简</text>
  <text x="420" y="106" font-size="10" fill="#333">gcd(90,90)=90</text>
  <text x="420" y="124" font-size="11" fill="#b85450" font-weight="bold">→ (1, 1)</text>
  <text x="420" y="140" font-size="9" fill="#888">即 0.999..=1</text>

  <text x="60" y="168" font-size="10" fill="#4a7a3a">验算: 9/10 + 9/90 = 9/10 + 1/10 = 1 ✓</text>

  <line x1="40" y1="200" x2="520" y2="200" stroke="#ddd" stroke-width="1" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <text x="40" y="226" font-size="12" fill="#888" font-weight="bold">右：t = "1."</text>

  <rect x="40" y="236" width="480" height="92" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>

  <text x="60" y="258" font-size="11" fill="#446688" font-weight="bold">拆分</text>
  <text x="60" y="276" font-size="10" fill="#333">I=1, N=""(空), 无循环</text>
  <text x="60" y="290" font-size="9" fill="#888">n=0</text>

  <text x="200" y="258" font-size="11" fill="#d6a040" font-weight="bold">套公式</text>
  <text x="200" y="276" font-size="10" fill="#333">den = 10⁰ = 1</text>
  <text x="200" y="292" font-size="10" fill="#333">num = 1·1 + 0 = 1</text>

  <text x="420" y="258" font-size="11" fill="#b85450" font-weight="bold">化简</text>
  <text x="420" y="276" font-size="10" fill="#333">gcd(1,1)=1</text>
  <text x="420" y="296" font-size="11" fill="#b85450" font-weight="bold">→ (1, 1)</text>

  <line x1="40" y1="344" x2="520" y2="344" stroke="#ddd" stroke-width="1" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <rect x="120" y="358" width="320" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="380" text-anchor="middle" font-size="12" fill="#333">(1, 1) == (1, 1)</text>
  <text x="280" y="398" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">→ true ✓</text>
</svg>
