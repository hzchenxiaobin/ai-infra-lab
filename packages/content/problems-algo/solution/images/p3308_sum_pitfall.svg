<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <text x="290" y="20" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">陷阱：SUM(accidents) 把司机级属性乘以行程数</text>
  <text x="290" y="36" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">场景：Fay 与 Gil 同评分 5.00、同里程 40（Electric 赛道）—— 胜负落到第三级「事故更少」</text>

  <rect x="26" y="48" width="262" height="158" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="157" y="68" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">正确语义：比原始 accidents</text>

  <rect x="40" y="78" width="56" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="68" y="93" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">选手</text>
  <rect x="96" y="78" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="126" y="93" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">事故数</text>
  <rect x="156" y="78" width="56" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="184" y="93" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">行程数</text>
  <rect x="212" y="78" width="62" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="243" y="93" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">判定</text>

  <rect x="40" y="100" width="234" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="68" y="116" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">Fay</text>
  <text x="126" y="116" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="184" y="116" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4</text>
  <text x="243" y="116" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 胜</text>

  <rect x="40" y="124" width="234" height="24" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="68" y="140" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Gil</text>
  <text x="126" y="140" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="184" y="140" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="243" y="140" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">✗ 负</text>

  <text x="157" y="168" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">1 &lt; 2：事故更少的 Fay 胜 ——</text>
  <text x="157" y="184" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">符合题意第三级标准</text>

  <rect x="292" y="48" width="262" height="158" fill="#ffffff" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="423" y="68" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">SUM 版：accidents × 行程数</text>

  <rect x="306" y="78" width="56" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="334" y="93" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">选手</text>
  <rect x="362" y="78" width="56" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="390" y="93" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">算式</text>
  <rect x="418" y="78" width="56" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="446" y="93" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">SUM值</text>
  <rect x="474" y="78" width="66" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="507" y="93" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">判定</text>

  <rect x="306" y="100" width="234" height="24" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="334" y="116" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Fay</text>
  <text x="390" y="116" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1×4</text>
  <text x="446" y="116" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="507" y="116" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗ 误负</text>

  <rect x="306" y="124" width="234" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="334" y="140" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">Gil</text>
  <text x="390" y="140" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2×1</text>
  <text x="446" y="140" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="507" y="140" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 误胜</text>

  <text x="423" y="168" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">4 &gt; 2：行程多的事故被成倍放大，</text>
  <text x="423" y="184" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">反而判 Gil 胜 —— 平局被行程数污染</text>

  <rect x="26" y="218" width="528" height="146" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="240" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">为什么阴险：前两级分出胜负时 bug 完全隐形</text>
  <text x="290" y="262" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">只有「评分平 + 里程平 + 落到第三级 + 两人行程数不同」四个条件同时成立才发作 ——</text>
  <text x="290" y="280" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">官方示例与多数测试都测不到，本地跑对了判题机才翻车</text>

  <rect x="46" y="294" width="240" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="166" y="311" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">修复① 迟到连接：聚合后再 JOIN Drivers</text>
  <rect x="294" y="294" width="240" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="414" y="311" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">修复② 恒等聚合：SUM 改 MAX / MIN</text>

  <rect x="46" y="326" width="488" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="343" text-anchor="middle" font-size="9" fill="#8a6d1a" filter="url(#rough2)">一般规律：事实度量用 SUM / AVG（每行一个新事实）；维表属性用 MAX / MIN（同一值抄多遍）</text>
</svg>
