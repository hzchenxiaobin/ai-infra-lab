<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：words = ["abcw","baz","foo","bar","xtfn","abcdef"]</text>

  <!-- Table header -->
  <rect x="40" y="44" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="80" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">单词</text>
  <rect x="120" y="44" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="145" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">长度</text>
  <rect x="170" y="44" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="230" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">字母集合</text>
  <rect x="290" y="44" width="100" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="340" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">掩码 (十进制)</text>
  <rect x="390" y="44" width="130" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="455" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">置位 bit</text>
  <rect x="40" y="68" width="80" height="24" fill="#fafafa" stroke="#ddd" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="80" y="84" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">abcw</text>
  <rect x="120" y="68" width="50" height="24" fill="#fafafa" stroke="#ddd" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="145" y="84" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="170" y="68" width="120" height="24" fill="#fafafa" stroke="#ddd" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="230" y="84" text-anchor="middle" font-size="10" fill="#555" font-family="monospace">{a,b,c,w}</text>
  <rect x="290" y="68" width="100" height="24" fill="#fafafa" stroke="#ddd" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="340" y="84" text-anchor="middle" font-size="10" fill="#555" font-family="monospace">4194311</text>
  <rect x="390" y="68" width="130" height="24" fill="#fafafa" stroke="#ddd" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="455" y="84" text-anchor="middle" font-size="10" fill="#555" font-family="monospace">0,1,2,22</text>
  <rect x="40" y="92" width="80" height="24" fill="#f5f5f5" stroke="#ddd" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="80" y="108" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">baz</text>
  <rect x="120" y="92" width="50" height="24" fill="#f5f5f5" stroke="#ddd" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="145" y="108" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="170" y="92" width="120" height="24" fill="#f5f5f5" stroke="#ddd" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="230" y="108" text-anchor="middle" font-size="10" fill="#555" font-family="monospace">{a,b,z}</text>
  <rect x="290" y="92" width="100" height="24" fill="#f5f5f5" stroke="#ddd" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="340" y="108" text-anchor="middle" font-size="10" fill="#555" font-family="monospace">33554435</text>
  <rect x="390" y="92" width="130" height="24" fill="#f5f5f5" stroke="#ddd" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="455" y="108" text-anchor="middle" font-size="10" fill="#555" font-family="monospace">0,1,25</text>
  <rect x="40" y="116" width="80" height="24" fill="#fafafa" stroke="#ddd" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="80" y="132" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">foo</text>
  <rect x="120" y="116" width="50" height="24" fill="#fafafa" stroke="#ddd" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="145" y="132" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="170" y="116" width="120" height="24" fill="#fafafa" stroke="#ddd" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="230" y="132" text-anchor="middle" font-size="10" fill="#555" font-family="monospace">{f,o}</text>
  <rect x="290" y="116" width="100" height="24" fill="#fafafa" stroke="#ddd" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="340" y="132" text-anchor="middle" font-size="10" fill="#555" font-family="monospace">16416</text>
  <rect x="390" y="116" width="130" height="24" fill="#fafafa" stroke="#ddd" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="455" y="132" text-anchor="middle" font-size="10" fill="#555" font-family="monospace">5,14</text>
  <rect x="40" y="140" width="80" height="24" fill="#f5f5f5" stroke="#ddd" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="80" y="156" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">bar</text>
  <rect x="120" y="140" width="50" height="24" fill="#f5f5f5" stroke="#ddd" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="145" y="156" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="170" y="140" width="120" height="24" fill="#f5f5f5" stroke="#ddd" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="230" y="156" text-anchor="middle" font-size="10" fill="#555" font-family="monospace">{a,b,r}</text>
  <rect x="290" y="140" width="100" height="24" fill="#f5f5f5" stroke="#ddd" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="340" y="156" text-anchor="middle" font-size="10" fill="#555" font-family="monospace">131075</text>
  <rect x="390" y="140" width="130" height="24" fill="#f5f5f5" stroke="#ddd" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="455" y="156" text-anchor="middle" font-size="10" fill="#555" font-family="monospace">0,1,17</text>
  <rect x="40" y="164" width="80" height="24" fill="#fafafa" stroke="#ddd" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="80" y="180" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">xtfn</text>
  <rect x="120" y="164" width="50" height="24" fill="#fafafa" stroke="#ddd" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="145" y="180" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="170" y="164" width="120" height="24" fill="#fafafa" stroke="#ddd" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="230" y="180" text-anchor="middle" font-size="10" fill="#555" font-family="monospace">{f,n,t,x}</text>
  <rect x="290" y="164" width="100" height="24" fill="#fafafa" stroke="#ddd" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="340" y="180" text-anchor="middle" font-size="10" fill="#555" font-family="monospace">8921120</text>
  <rect x="390" y="164" width="130" height="24" fill="#fafafa" stroke="#ddd" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="455" y="180" text-anchor="middle" font-size="10" fill="#555" font-family="monospace">5,13,19,23</text>
  <rect x="40" y="188" width="80" height="24" fill="#f5f5f5" stroke="#ddd" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="80" y="204" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">abcdef</text>
  <rect x="120" y="188" width="50" height="24" fill="#f5f5f5" stroke="#ddd" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="145" y="204" text-anchor="middle" font-size="11" fill="#333">6</text>
  <rect x="170" y="188" width="120" height="24" fill="#f5f5f5" stroke="#ddd" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="230" y="204" text-anchor="middle" font-size="10" fill="#555" font-family="monospace">{a,b,c,d,e,f}</text>
  <rect x="290" y="188" width="100" height="24" fill="#f5f5f5" stroke="#ddd" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="340" y="204" text-anchor="middle" font-size="10" fill="#555" font-family="monospace">63</text>
  <rect x="390" y="188" width="130" height="24" fill="#f5f5f5" stroke="#ddd" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="455" y="204" text-anchor="middle" font-size="10" fill="#555" font-family="monospace">0,1,2,3,4,5</text>
  <!-- Divider -->
  <line x1="40" y1="220" x2="520" y2="220" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <text x="40" y="242" font-size="11" fill="#4a7a3a" font-weight="bold">AND = 0 的合法词对：</text>
  <rect x="60" y="252" width="440" height="22" fill="#fafafa" stroke="#ccc" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="80" y="267" font-size="11" fill="#333" font-family="monospace">"abcw" &amp; "foo"</text>
  <text x="280" y="267" font-size="10" fill="#888">mask AND = 0  →  长度乘积 =</text>
  <text x="440" y="267" font-size="13" fill="#333" font-weight="bold">4 × 3 = 12</text>
  <rect x="60" y="276" width="440" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="291" font-size="11" fill="#333" font-family="monospace">"abcw" &amp; "xtfn"</text>
  <text x="280" y="291" font-size="10" fill="#888">mask AND = 0  →  长度乘积 =</text>
  <text x="440" y="291" font-size="13" fill="#4a7a3a" font-weight="bold">4 × 4 = 16</text>
  <text x="480" y="291" font-size="11" fill="#4a7a3a" font-weight="bold">★ 最大</text>
  <rect x="60" y="300" width="440" height="22" fill="#fafafa" stroke="#ccc" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="80" y="315" font-size="11" fill="#333" font-family="monospace">"baz" &amp; "foo"</text>
  <text x="280" y="315" font-size="10" fill="#888">mask AND = 0  →  长度乘积 =</text>
  <text x="440" y="315" font-size="13" fill="#333" font-weight="bold">3 × 3 = 9</text>
  <rect x="60" y="324" width="440" height="22" fill="#fafafa" stroke="#ccc" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="80" y="339" font-size="11" fill="#333" font-family="monospace">"baz" &amp; "xtfn"</text>
  <text x="280" y="339" font-size="10" fill="#888">mask AND = 0  →  长度乘积 =</text>
  <text x="440" y="339" font-size="13" fill="#333" font-weight="bold">3 × 4 = 12</text>
  <rect x="60" y="348" width="440" height="22" fill="#fafafa" stroke="#ccc" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="80" y="363" font-size="11" fill="#333" font-family="monospace">"foo" &amp; "bar"</text>
  <text x="280" y="363" font-size="10" fill="#888">mask AND = 0  →  长度乘积 =</text>
  <text x="440" y="363" font-size="13" fill="#333" font-weight="bold">3 × 3 = 9</text>
  <rect x="60" y="372" width="440" height="22" fill="#fafafa" stroke="#ccc" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="80" y="387" font-size="11" fill="#333" font-family="monospace">"bar" &amp; "xtfn"</text>
  <text x="280" y="387" font-size="10" fill="#888">mask AND = 0  →  长度乘积 =</text>
  <text x="440" y="387" font-size="13" fill="#333" font-weight="bold">3 × 4 = 12</text>
  <!-- Conclusion -->
  <rect x="60" y="412" width="440" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="436" text-anchor="middle" font-size="12" fill="#7a5a20" font-weight="bold">答案 = 16（"abcw" 与 "xtfn"，长度 4 × 4 = 16）</text>
</svg>