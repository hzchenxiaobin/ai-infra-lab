<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：banned = {"hit"}</text>

  <!-- banned set -->
  <rect x="40" y="46" width="540" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="56" y="66" font-size="11" fill="#d6a040" font-weight="bold">停用词集合 banned = {"hit"}  →  命中即跳过，不入哈希表</text>

  <!-- word stream -->
  <text x="40" y="98" font-size="11" fill="#888">规范化后的单词流（逐个喂入计数器）：</text>

  <!-- word chips row 1 -->
  <g font-size="11" filter="url(#rough2)">
    <rect x="40" y="106" width="56" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="68" y="124" text-anchor="middle" fill="#333">bob</text>
    <rect x="104" y="106" width="56" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="132" y="124" text-anchor="middle" fill="#b85450" font-weight="bold">hit</text>
    <rect x="168" y="106" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="188" y="124" text-anchor="middle" fill="#333">a</text>
    <rect x="216" y="106" width="56" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="244" y="124" text-anchor="middle" fill="#333" font-weight="bold">ball</text>
    <rect x="280" y="106" width="56" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="308" y="124" text-anchor="middle" fill="#333">the</text>
    <rect x="344" y="106" width="56" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="372" y="124" text-anchor="middle" fill="#b85450" font-weight="bold">hit</text>
    <rect x="408" y="106" width="56" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="436" y="124" text-anchor="middle" fill="#333" font-weight="bold">ball</text>
    <rect x="472" y="106" width="56" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="500" y="124" text-anchor="middle" fill="#333">flew</text>
    <rect x="536" y="106" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="558" y="124" text-anchor="middle" fill="#333">far</text>
  </g>

  <!-- legend -->
  <text x="40" y="150" font-size="10" fill="#888">绿框=计入计数器；红框=命中 banned 跳过；粗框=最终高频候选</text>

  <!-- hash table -->
  <rect x="40" y="162" width="540" height="160" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="182" font-size="12" fill="#b85450" font-weight="bold">哈希表 cnt（仅统计非停用词）：</text>

  <!-- table header -->
  <text x="80" y="204" font-size="11" fill="#888" font-weight="bold">单词</text>
  <text x="200" y="204" font-size="11" fill="#888" font-weight="bold">频次</text>
  <text x="300" y="204" font-size="11" fill="#888" font-weight="bold">单词</text>
  <text x="420" y="204" font-size="11" fill="#888" font-weight="bold">频次</text>

  <!-- rows -->
  <g font-size="12" filter="url(#rough2)">
    <text x="80" y="226" fill="#333">bob</text>
    <text x="200" y="226" fill="#333">1</text>
    <text x="300" y="226" fill="#333">the</text>
    <text x="420" y="226" fill="#333">1</text>

    <text x="80" y="248" fill="#333" font-weight="bold">ball</text>
    <text x="200" y="248" fill="#b85450" font-weight="bold">2</text>
    <text x="300" y="248" fill="#333">flew</text>
    <text x="420" y="248" fill="#333">1</text>

    <text x="80" y="270" fill="#333">a</text>
    <text x="200" y="270" fill="#333">1</text>
    <text x="300" y="270" fill="#333">far</text>
    <text x="420" y="270" fill="#333">1</text>

    <text x="80" y="292" fill="#333">after</text>
    <text x="200" y="292" fill="#333">1</text>
    <text x="300" y="292" fill="#888" font-style="italic">hit：3 次（被禁，不入表）</text>
  </g>

  <text x="56" y="316" font-size="10" fill="#888">注：单词流中 hit 出现 3 次（红框），全部跳过；其余词各 1 次唯 ball 出现 2 次。</text>

  <!-- argmax arrow -->
  <path d="M 310 322 L 310 348" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="340" font-size="11" fill="#b85450" font-weight="bold">argmax</text>

  <!-- result -->
  <rect x="220" y="352" width="180" height="44" fill="#446688" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="310" y="372" text-anchor="middle" font-size="11" fill="#bcd" font-weight="bold">最大频次 = 2</text>
  <text x="310" y="388" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">返回 "ball"</text>

  <!-- takeaway -->
  <rect x="40" y="406" width="540" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="426" font-size="11" fill="#4a7a3a" font-weight="bold">关键：被禁词即使频次最高也不计入，故 hit(3) 被排除，ball(2) 胜出。</text>
  <text x="56" y="442" font-size="10" fill="#666">"频次最大" 是在「过滤后」的哈希表上取的，而非原文词频——先过滤再取最值。</text>
</svg>
