<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">SQL 逻辑执行流程</text>

  <rect x="30" y="55" width="235" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="46" y="79" font-size="13" fill="#333" filter="url(#rough2)">① FROM Sales  加载销售行</text>

  <rect x="30" y="110" width="235" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="46" y="134" font-size="13" fill="#333" filter="url(#rough2)">② GROUP BY seller_id</text>

  <rect x="30" y="165" width="235" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="46" y="189" font-size="13" fill="#333" filter="url(#rough2)">③ SUM(price)  每组总价</text>

  <rect x="30" y="220" width="235" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="46" y="244" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">④ HAVING SUM = 最大(含并列)</text>

  <rect x="30" y="275" width="235" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="46" y="299" font-size="13" fill="#4a7a3a" filter="url(#rough2)">⑤ SELECT seller_id  输出</text>

  <path d="M147 95 L147 108" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M147 150 L147 163" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M147 205 L147 218" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M147 260 L147 273" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="295" y="55" width="205" height="258" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="306" y="78" font-size="12" fill="#446688" filter="url(#rough2)">SELECT seller_id</text>
  <text x="306" y="98" font-size="12" fill="#446688" filter="url(#rough2)">FROM Sales</text>
  <text x="306" y="118" font-size="12" fill="#446688" filter="url(#rough2)">GROUP BY seller_id</text>
  <text x="306" y="138" font-size="12" fill="#446688" filter="url(#rough2)">HAVING SUM(price) = (</text>
  <text x="318" y="158" font-size="12" fill="#b85450" filter="url(#rough2)">SELECT SUM(price)</text>
  <text x="318" y="178" font-size="12" fill="#b85450" filter="url(#rough2)">FROM Sales</text>
  <text x="318" y="198" font-size="12" fill="#b85450" filter="url(#rough2)">GROUP BY seller_id</text>
  <text x="318" y="218" font-size="12" fill="#b85450" filter="url(#rough2)">ORDER BY SUM DESC</text>
  <text x="318" y="238" font-size="12" fill="#b85450" filter="url(#rough2)">LIMIT 1</text>
  <text x="306" y="258" font-size="12" fill="#446688" filter="url(#rough2)">);</text>
  <text x="306" y="288" font-size="11" fill="#888" filter="url(#rough2)">子查询取全局最大值</text>
  <text x="306" y="304" font-size="11" fill="#888" filter="url(#rough2)">外层 HAVING 留所有并列</text>
</svg>
