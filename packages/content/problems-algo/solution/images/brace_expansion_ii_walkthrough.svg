<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="480" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：{{a,z},a{b,c},{ab,z}}</text>

  <!-- Top: expr node (union) -->
  <rect x="150" y="40" width="280" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="290" y="58" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">expr: {a,z} , a{b,c} , {ab,z}</text>
  <text x="290" y="74" text-anchor="middle" font-size="10" fill="#888">三项并集 ∪</text>

  <!-- arrows to three terms -->
  <line x1="220" y1="84" x2="100" y2="108" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="290" y1="84" x2="290" y2="108" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="360" y1="84" x2="480" y2="108" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Term 1: {a,z} -->
  <rect x="30" y="110" width="140" height="56" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="100" y="128" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">term1: {a,z}</text>
  <text x="100" y="144" text-anchor="middle" font-size="9" fill="#888">单 factor（花括号组）</text>
  <rect x="50" y="150" width="100" height="20" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="164" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">{a, z}</text>

  <!-- Term 2: a{b,c} -->
  <rect x="190" y="110" width="180" height="56" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="128" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">term2: a{b,c}</text>
  <text x="280" y="144" text-anchor="middle" font-size="9" fill="#888">{a} × {b,c} （笛卡尔积）</text>
  <rect x="220" y="150" width="120" height="20" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="280" y="164" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">{ab, ac}</text>

  <!-- Term 3: {ab,z} -->
  <rect x="400" y="110" width="150" height="56" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="475" y="128" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">term3: {ab,z}</text>
  <text x="475" y="144" text-anchor="middle" font-size="9" fill="#888">ab ∪ z （先连后并）</text>
  <rect x="425" y="150" width="100" height="20" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="475" y="164" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">{ab, z}</text>

  <!-- Expand term2 factors -->
  <line x1="240" y1="166" x2="220" y2="186" stroke="#888" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="320" y1="166" x2="340" y2="186" stroke="#888" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="180" y="188" width="80" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="220" y="204" text-anchor="middle" font-size="10" fill="#333">a → {a}</text>
  <rect x="300" y="188" width="80" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="340" y="204" text-anchor="middle" font-size="10" fill="#333">{b,c}</text>
  <text x="266" y="204" font-size="10" fill="#d6a040" font-weight="bold">×</text>

  <!-- Expand term3 inner -->
  <line x1="475" y1="170" x2="475" y2="186" stroke="#888" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="380" y="188" width="190" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="475" y="204" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">内部 expr: ab , z</text>
  <text x="475" y="220" text-anchor="middle" font-size="9" fill="#555">term "ab"(=a×b) ∪ term "z"</text>
  <text x="475" y="232" text-anchor="middle" font-size="9" fill="#888">= {ab} ∪ {z} = {ab, z}</text>

  <!-- union step -->
  <line x1="100" y1="166" x2="100" y2="260" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="280" y1="212" x2="280" y2="260" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="475" y1="232" x2="475" y2="260" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="100" y1="260" x2="475" y2="260" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="290" y1="260" x2="290" y2="288" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- union box -->
  <rect x="100" y="288" width="380" height="50" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="308" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">并集：{a,z} ∪ {ab,ac} ∪ {ab,z}</text>
  <text x="290" y="326" text-anchor="middle" font-size="10" fill="#555">set 去重：ab 出现两次，保留一次</text>

  <line x1="290" y1="338" x2="290" y2="362" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="130" y="362" width="320" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="290" y="388" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">["a", "ab", "ac", "z"]</text>

  <!-- annotation -->
  <rect x="80" y="418" width="420" height="48" rx="8" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="96" y="438" font-size="10" fill="#555" font-weight="bold">关键：</text>
  <text x="140" y="438" font-size="10" fill="#555">term2 的 a 与 {b,c} 相邻 → 笛卡尔积（连接）</text>
  <text x="96" y="456" font-size="10" fill="#555">       term3 内 ab 相邻先连接，逗号再并集 → 优先级：连接 &gt; 逗号</text>
</svg>
