<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：target = 6，反向 BFS 序 [4,3,2,1,0]</text>

  <!-- table frame -->
  <rect x="20" y="44" width="520" height="220" rx="8" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- header -->
  <rect x="20" y="44" width="520" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="120" y1="44" x2="120" y2="264" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="200" y1="44" x2="200" y2="264" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="320" y1="44" x2="320" y2="264" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="420" y1="44" x2="420" y2="264" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <text x="70"  y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">步骤</text>
  <text x="160" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">节点 u</text>
  <text x="260" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">sub[u]（累加后）</text>
  <text x="370" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">判定</text>
  <text x="470" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">动作</text>

  <!-- row 1 -->
  <text x="70"  y="96" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="160" y="96" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="260" y="96" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6 (+0)</text>
  <text x="370" y="96" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">= 6</text>
  <text x="470" y="96" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">切，贡献 0 给 3</text>
  <line x1="20" y1="108" x2="540" y2="108" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 2 -->
  <text x="70"  y="130" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="160" y="130" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="260" y="130" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2 + 0 = 2</text>
  <text x="370" y="130" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">&lt; 6</text>
  <text x="470" y="130" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">余量 2 上交 1</text>
  <line x1="20" y1="142" x2="540" y2="142" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 3 -->
  <text x="70"  y="164" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="160" y="164" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="260" y="164" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="370" y="164" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">&lt; 6</text>
  <text x="470" y="164" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">余量 2 上交 1</text>
  <line x1="20" y1="176" x2="540" y2="176" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 4 -->
  <text x="70"  y="198" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="160" y="198" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="260" y="198" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2+2+2 = 6</text>
  <text x="370" y="198" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">= 6</text>
  <text x="470" y="198" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">切，贡献 0 给 0</text>
  <line x1="20" y1="210" x2="540" y2="210" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 5 -->
  <text x="70"  y="234" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="160" y="234" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="260" y="234" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6 + 0 = 6</text>
  <text x="370" y="234" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">= 6</text>
  <text x="470" y="234" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">根成块，结束</text>

  <text x="280" y="296" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">3 块 {0}, {1,2,3}, {4} → 切 2 边 → 返回 2</text>
</svg>
