<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：n−1 层循环，每层前缀和 + 后缀和各一趟</text>

  <rect x="170" y="40" width="290" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="315" y="61" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">初始化：m = r−l+1，up = dn = [1]*m</text>

  <path d="M 315 74 L 315 94" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="315,98 405,122 315,146 225,122" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="315" y="126" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i ≤ n ?</text>

  <text x="324" y="159" font-size="9.5" fill="#666" filter="url(#rough2)">是</text>
  <path d="M 315 146 L 315 160" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="162" width="290" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="315" y="183" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">① 前缀和：y=0..m−1，new_up[y]=pre，pre+=dn[y]</text>

  <path d="M 315 196 L 315 206" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="208" width="290" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="315" y="229" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">② 后缀和：y=m−1..0，new_dn[y]=suf，suf+=up[y]</text>

  <path d="M 315 242 L 315 252" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="254" width="290" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="315" y="275" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">③ 滚动替换：up ← new_up，dn ← new_dn，i ← i+1</text>

  <path d="M 460 271 L 490 271 L 490 122 L 409 122" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="484" y="205" text-anchor="end" font-size="9" fill="#b85450" filter="url(#rough2)">下一层</text>

  <text x="212" y="112" font-size="9.5" fill="#666" filter="url(#rough2)">否</text>
  <path d="M 225 122 L 201 122" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="32" y="98" width="164" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="114" y="118" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">④ 汇总答案</text>
  <text x="114" y="136" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">( Σ up[x] + Σ dn[x] )</text>
  <text x="114" y="150" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">mod 10⁹+7</text>

  <rect x="90" y="312" width="340" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="333" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">每层 O(m) ×（n−1）层 ⇒ O(n·m) ≈ 4×10⁶，空间 O(m)</text>
</svg>
