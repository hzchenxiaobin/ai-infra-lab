<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14.5" fill="#333" font-weight="bold" filter="url(#rough2)">数据 ×10：框架不变，引擎换代</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">target 与 L_max 各 ×10，W 与 Σ|w| 原地踏步——加强专打「乘 L_max」的引擎</text>

  <!-- ============ 左板：3291 ============ -->
  <rect x="24" y="56" width="228" height="252" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="32" y="63" width="212" height="24" rx="6" fill="#e8f0fe" filter="url(#rough2)"/>
  <text x="138" y="79" text-anchor="middle" font-size="12" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">3291 · 版本 I</text>

  <text x="138" y="106" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">n = 5×10³　L_max = 5×10³</text>
  <text x="138" y="124" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">W = 100　Σ|w| = 10⁵</text>

  <rect x="34" y="140" width="208" height="62" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="138" y="162" text-anchor="middle" font-size="11" fill="#3a5f30" font-weight="bold" filter="url(#rough2)">Trie 引擎：n · L_max ≈ 2.5×10⁷</text>
  <text x="138" y="182" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓ C++ 轻松（3291 的选择）</text>

  <rect x="34" y="216" width="208" height="62" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="138" y="238" text-anchor="middle" font-size="11" fill="#3a5f30" font-weight="bold" filter="url(#rough2)">Z 引擎：Σ|w| + W·n ≈ 6×10⁵</text>
  <text x="138" y="258" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓ 快到没存在感</text>

  <text x="138" y="298" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">两个引擎都活着，随便挑</text>

  <!-- ============ 中间箭头 ============ -->
  <text x="260" y="168" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">数据</text>
  <text x="260" y="180" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">加强</text>
  <path d="M 260 186 L 260 208" stroke="#b85450" stroke-width="2.2" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- ============ 右板：3292 ============ -->
  <rect x="268" y="56" width="228" height="252" rx="10" fill="#ffffff" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="276" y="63" width="212" height="24" rx="6" fill="#fce4ec" filter="url(#rough2)"/>
  <text x="382" y="79" text-anchor="middle" font-size="12" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">3292 · 版本 II</text>

  <text x="382" y="106" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">n = 5×10⁴ ↑×10　L_max = 5×10⁴ ↑×10</text>
  <text x="382" y="124" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">W = 100（不变）　Σ|w| = 10⁵（不变）</text>

  <rect x="278" y="140" width="208" height="62" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="382" y="162" text-anchor="middle" font-size="11" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">Trie 引擎：n · L_max ≈ 2.5×10⁹</text>
  <text x="382" y="182" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗ 两个因子各 ×10——必然 TLE</text>

  <rect x="278" y="216" width="208" height="62" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="382" y="238" text-anchor="middle" font-size="11" fill="#3a5f30" font-weight="bold" filter="url(#rough2)">Z 引擎：Σ|w| + W·n ≈ 5.1×10⁶</text>
  <text x="382" y="258" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓ 乘的是没变的 W，双语言通过</text>

  <text x="382" y="298" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">账单乘 L_max 的死了，乘 W 的活着</text>

  <!-- ============ 底部结论 ============ -->
  <rect x="48" y="320" width="424" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="340" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">复杂度里乘的是 L_max 还是 W，决定引擎能否活到 II——写 3291 时就该看清哪一项会被放大</text>
</svg>
