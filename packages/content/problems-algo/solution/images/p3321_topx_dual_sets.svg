<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">核心结构：条目按 (freq, value) 降序排队，前 x 个在编（L），其余候补（R）</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">条目记号 f×v（频率×数值），贡献 = f×v；answer[i] = sumL = L 内条目贡献之和</text>

  <!-- 分组标签 -->
  <text x="103" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">L · top-x（在编）</text>
  <text x="200" y="62" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">门槛</text>
  <text x="349" y="62" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">R · 候补席（编外）</text>

  <!-- L / R 分组框 -->
  <rect x="14" y="68" width="174" height="56" fill="none" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="208" y="68" width="282" height="56" fill="none" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <path d="M 200 64 L 200 128" fill="none" stroke="#a07830" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- L 内条目（前 x=3 个，示例） -->
  <rect x="22" y="76" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="76" y="76" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="130" y="76" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="47" y="99" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">3×7</text>
  <text x="101" y="99" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">2×9</text>
  <text x="155" y="99" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">2×5</text>

  <!-- R 内条目 -->
  <rect x="216" y="76" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="270" y="76" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="324" y="76" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="378" y="76" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="432" y="76" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="241" y="99" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">2×2</text>
  <text x="295" y="99" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">1×8</text>
  <text x="349" y="99" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">1×4</text>
  <text x="403" y="99" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">1×3</text>
  <text x="457" y="99" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">1×1</text>

  <!-- 门槛两侧流动 -->
  <path d="M 196 140 L 166 140" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="122" y="144" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">晋级（补位）</text>
  <path d="M 204 140 L 234 140" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="285" y="144" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">降级（出编）</text>

  <!-- 左：滑动一步的变化 -->
  <rect x="20" y="158" width="232" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="136" y="176" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">滑动一步 = 只有两个条目变键</text>
  <text x="136" y="192" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">入窗值：f+1（条目向右变强）</text>
  <text x="136" y="206" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">出窗值：f−1（条目向左变弱）</text>
  <text x="136" y="217" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">变键条目先摘牌，新牌先进 R</text>

  <!-- 右：balance 三板斧 -->
  <rect x="268" y="158" width="232" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="384" y="176" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">balance() 三板斧</text>
  <text x="384" y="192" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">① 超编 → min(L) 降级</text>
  <text x="384" y="206" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">② 缺编 → max(R) 晋级</text>
  <text x="384" y="217" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">③ min(L) &lt; max(R) → 互换</text>

  <!-- 底部洞察 -->
  <rect x="20" y="236" width="480" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="256" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">不变量 min(L) &gt; max(R) 的两件好事</text>
  <text x="260" y="274" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">① 摘牌定位一次比较：e ≥ min(L) ⟺ e ∈ L</text>
  <text x="260" y="292" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">② 条目不足 x 时 R 被吸干 → sumL = 窗口总和（题面边界零特判）</text>

  <text x="260" y="328" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">answer[i] = sumL；每步搬运均摊 O(1) 次 → 总复杂度 O(n log n)</text>
</svg>
