<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 414" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr1790eg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="414" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：d 的三种取值 → 三类结论</text>

  <!-- ====== Example 1: bank / kanb, d=2 cross-equal, true ====== -->
  <text x="28" y="56" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">示例1：s1="bank", s2="kanb"</text>

  <!-- s1 row: bank, highlight 0,3 -->
  <g font-size="14" fill="#333" text-anchor="middle">
    <rect x="130" y="68" width="42" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="151" y="86" filter="url(#rough2)">b</text>
    <rect x="172" y="68" width="42" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="193" y="86" filter="url(#rough2)">a</text>
    <rect x="214" y="68" width="42" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="235" y="86" filter="url(#rough2)">n</text>
    <rect x="256" y="68" width="42" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="277" y="86" filter="url(#rough2)">k</text>
  </g>
  <text x="118" y="86" font-size="11" fill="#446688" font-weight="bold" text-anchor="end" filter="url(#rough2)">s1</text>

  <!-- s2 row: kanb, highlight 0,3 -->
  <g font-size="14" fill="#333" text-anchor="middle">
    <rect x="130" y="100" width="42" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="151" y="118" filter="url(#rough2)">k</text>
    <rect x="172" y="100" width="42" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="193" y="118" filter="url(#rough2)">a</text>
    <rect x="214" y="100" width="42" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="235" y="118" filter="url(#rough2)">n</text>
    <rect x="256" y="100" width="42" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="277" y="118" filter="url(#rough2)">b</text>
  </g>
  <text x="118" y="118" font-size="11" fill="#446688" font-weight="bold" text-anchor="end" filter="url(#rough2)">s2</text>

  <!-- cross arrows -->
  <path d="M 151 94 Q 214 112 277 100" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr1790eg)" filter="url(#rough2)"/>
  <path d="M 277 94 Q 214 112 151 100" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr1790eg)" filter="url(#rough2)"/>

  <text x="320" y="90" font-size="12" fill="#333" filter="url(#rough2)">diff = [0, 3]，d = 2</text>
  <text x="320" y="108" font-size="12" fill="#4a7a3a" filter="url(#rough2)">b↔k 交叉相等 ✓</text>
  <text x="320" y="126" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ return true</text>

  <!-- divider -->
  <path d="M 24 146 L 556 146" stroke="#ddd" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ====== Example 2: attack / defend, d=6, false ====== -->
  <text x="28" y="170" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">示例2：s1="attack", s2="defend"</text>

  <!-- s1 row: attack, all red -->
  <g font-size="13" fill="#333" text-anchor="middle">
    <rect x="130" y="182" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="148" y="200" filter="url(#rough2)">a</text>
    <rect x="166" y="182" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="184" y="200" filter="url(#rough2)">t</text>
    <rect x="202" y="182" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="220" y="200" filter="url(#rough2)">t</text>
    <rect x="238" y="182" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="256" y="200" filter="url(#rough2)">a</text>
    <rect x="274" y="182" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="292" y="200" filter="url(#rough2)">c</text>
    <rect x="310" y="182" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="328" y="200" filter="url(#rough2)">k</text>
  </g>
  <text x="118" y="200" font-size="11" fill="#b85450" font-weight="bold" text-anchor="end" filter="url(#rough2)">s1</text>

  <!-- s2 row: defend, all red -->
  <g font-size="13" fill="#333" text-anchor="middle">
    <rect x="130" y="214" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="148" y="232" filter="url(#rough2)">d</text>
    <rect x="166" y="214" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="184" y="232" filter="url(#rough2)">e</text>
    <rect x="202" y="214" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="220" y="232" filter="url(#rough2)">f</text>
    <rect x="238" y="214" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="256" y="232" filter="url(#rough2)">e</text>
    <rect x="274" y="214" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="292" y="232" filter="url(#rough2)">n</text>
    <rect x="310" y="214" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="328" y="232" filter="url(#rough2)">d</text>
  </g>
  <text x="118" y="232" font-size="11" fill="#b85450" font-weight="bold" text-anchor="end" filter="url(#rough2)">s2</text>

  <text x="370" y="200" font-size="12" fill="#333" filter="url(#rough2)">6 个位置全不同</text>
  <text x="370" y="218" font-size="12" fill="#b85450" filter="url(#rough2)">d = 6 ≥ 3</text>
  <text x="370" y="236" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ return false</text>

  <!-- divider -->
  <path d="M 24 256 L 556 256" stroke="#ddd" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ====== Example 3: kelb / kelb, d=0, true ====== -->
  <text x="28" y="280" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">示例3：s1="kelb", s2="kelb"</text>

  <!-- s1 row: kelb, all green -->
  <g font-size="14" fill="#333" text-anchor="middle">
    <rect x="130" y="292" width="42" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="151" y="310" filter="url(#rough2)">k</text>
    <rect x="172" y="292" width="42" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="193" y="310" filter="url(#rough2)">e</text>
    <rect x="214" y="292" width="42" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="235" y="310" filter="url(#rough2)">l</text>
    <rect x="256" y="292" width="42" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="277" y="310" filter="url(#rough2)">b</text>
  </g>
  <text x="118" y="310" font-size="11" fill="#4a7a3a" font-weight="bold" text-anchor="end" filter="url(#rough2)">s1</text>

  <!-- s2 row: kelb, all green -->
  <g font-size="14" fill="#333" text-anchor="middle">
    <rect x="130" y="324" width="42" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="151" y="342" filter="url(#rough2)">k</text>
    <rect x="172" y="324" width="42" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="193" y="342" filter="url(#rough2)">e</text>
    <rect x="214" y="324" width="42" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="235" y="342" filter="url(#rough2)">l</text>
    <rect x="256" y="324" width="42" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="277" y="342" filter="url(#rough2)">b</text>
  </g>
  <text x="118" y="342" font-size="11" fill="#4a7a3a" font-weight="bold" text-anchor="end" filter="url(#rough2)">s2</text>

  <!-- "=" between rows -->
  <text x="320" y="314" font-size="12" fill="#333" filter="url(#rough2)">逐位全等</text>
  <text x="320" y="332" font-size="12" fill="#4a7a3a" filter="url(#rough2)">d = 0，空交换即可</text>
  <text x="320" y="350" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ return true</text>

  <!-- summary box -->
  <rect x="60" y="370" width="460" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="392" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">三例对应 d = 2 / 6 / 0 → true / false / true，<tspan fill="#4a7a3a" font-weight="bold">d 的取值直接圈定结论</tspan></text>
</svg>
