<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：正整数数组被「下降断点」切分为极大升序段</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">段内累加、断点重启；正整数保证段越长和越大 → 取最大段和</text>

  <!-- nums row label -->
  <text x="44" y="88" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">nums</text>

  <!-- Array cells: [10, 20, 30, | 5, 10, 50]  width=56, touching within group, gap at break -->
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <!-- run 1: green group -->
    <rect x="100" y="68" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="128" y="90" fill="#333" font-weight="bold">10</text>
    <rect x="156" y="68" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="184" y="90" fill="#333" font-weight="bold">20</text>
    <rect x="212" y="68" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="240" y="90" fill="#333" font-weight="bold">30</text>
    <!-- run 2: blue group -->
    <rect x="284" y="68" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="312" y="90" fill="#333" font-weight="bold">5</text>
    <rect x="340" y="68" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="368" y="90" fill="#333" font-weight="bold">10</text>
    <rect x="396" y="68" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="424" y="90" fill="#333" font-weight="bold">50</text>
  </g>

  <!-- index labels -->
  <g filter="url(#rough2)" font-size="9" fill="#aaa" text-anchor="middle">
    <text x="128" y="60">0</text>
    <text x="184" y="60">1</text>
    <text x="240" y="60">2</text>
    <text x="312" y="60">3</text>
    <text x="368" y="60">4</text>
    <text x="424" y="60">5</text>
  </g>

  <!-- breakpoint marker between cell2 (ends 268) and cell3 (starts 284), gap center x=276 -->
  <path d="M 276 56 L 272 66 L 280 70 L 274 80" stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <rect x="238" y="44" width="84" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="280" y="58" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">5 &lt; 30 断裂</text>

  <!-- run brackets and labels -->
  <!-- run 1 bracket -->
  <path d="M 100 108 L 100 116 L 268 116 L 268 108" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <rect x="124" y="120" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="184" y="140" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">升序段① sum=60</text>

  <!-- run 2 bracket -->
  <path d="M 284 108 L 284 116 L 452 116 L 452 108" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <rect x="308" y="120" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="368" y="140" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">升序段② sum=65</text>

  <!-- arrows down to max -->
  <path d="M 184 152 L 184 174" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 368 152 L 368 174" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- max box -->
  <rect x="120" y="178" width="320" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="201" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans = max(60, 65) = 65</text>

  <!-- key insight box -->
  <rect x="44" y="232" width="472" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="252" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">① 全为正整数 → 升序段越长和越大 → 最优解必为某「极大升序段」</text>
  <text x="280" y="272" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">② 一趟扫描：nums[i] &gt; nums[i-1] 则 cur += nums[i]，否则 cur = nums[i]</text>
  <text x="280" y="290" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">③ 每步 ans = max(ans, cur) 记录全局最大段和</text>

  <!-- footer -->
  <text x="280" y="332" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">极大升序段 = 不能再向左右扩展的连续严格递增段；断点即 nums[i] ≤ nums[i-1]</text>
</svg>
