<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="360" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    示例演算：apples=[1,2,3,5,2], days=[3,2,1,4,2]（堆 {腐烂日:数量}，同键合并显示）
  </text>

  <!-- ===== Header row ===== -->
  <rect x="30"  y="50" width="44"  height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="52"  y="69" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">Day</text>
  <rect x="78"  y="50" width="86"  height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="121" y="69" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">新增</text>
  <rect x="168" y="50" width="130" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="233" y="69" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">清腐烂后堆</text>
  <rect x="302" y="50" width="110" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="357" y="69" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">吃（堆顶）</text>
  <rect x="416" y="50" width="130" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="481" y="69" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">剩余堆</text>
  <rect x="550" y="50" width="46"  height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="573" y="69" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">ans</text>

  <!-- ===== Row day0: add 3:1, heap {3:1}, eat 3:1->0, left {}, ans 1 ===== -->
  <rect x="30"  y="82" width="44"  height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="52"  y="101" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="78"  y="82" width="86"  height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="121" y="101" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">3 : 1</text>
  <rect x="168" y="82" width="130" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="233" y="101" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{3:1}</text>
  <rect x="302" y="82" width="110" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="357" y="101" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">3:1 → 0</text>
  <rect x="416" y="82" width="130" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="481" y="101" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">{}</text>
  <rect x="550" y="82" width="46"  height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="573" y="101" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1</text>

  <!-- ===== Row day1: add 3:2, heap {3:2}, eat 3:2->3:1, left {3:1}, ans 2 ===== -->
  <rect x="30"  y="112" width="44"  height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="52"  y="131" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="78"  y="112" width="86"  height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="121" y="131" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">3 : 2</text>
  <rect x="168" y="112" width="130" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="233" y="131" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{3:2}</text>
  <rect x="302" y="112" width="110" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="357" y="131" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">3:2 → 3:1</text>
  <rect x="416" y="112" width="130" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="481" y="131" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{3:1}</text>
  <rect x="550" y="112" width="46"  height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="573" y="131" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">2</text>

  <!-- ===== Row day2: add 3:3, heap {3:4}(merge), eat ->3:3, left {3:3}, ans 3 ===== -->
  <rect x="30"  y="142" width="44"  height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="52"  y="161" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="78"  y="142" width="86"  height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="121" y="161" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">3 : 3</text>
  <rect x="168" y="142" width="130" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="233" y="161" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{3:4}</text>
  <rect x="302" y="142" width="110" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="357" y="161" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">3:4 → 3:3</text>
  <rect x="416" y="142" width="130" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="481" y="161" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{3:3}</text>
  <rect x="550" y="142" width="46"  height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="573" y="161" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">3</text>

  <!-- ===== Row day3 (highlight green): add 7:5, clean 3:3, heap {7:5}, eat 7:5->7:4, left {7:4}, ans 4 ===== -->
  <rect x="30"  y="172" width="44"  height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="52"  y="191" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="78"  y="172" width="86"  height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="121" y="191" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">7 : 5</text>
  <rect x="168" y="172" width="130" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="233" y="191" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">{7:5}（清 3:3）</text>
  <rect x="302" y="172" width="110" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="357" y="191" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">7:5 → 7:4</text>
  <rect x="416" y="172" width="130" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="481" y="191" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{7:4}</text>
  <rect x="550" y="172" width="46"  height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="573" y="191" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">4</text>

  <!-- ===== Row day4 (highlight red): add 6:2, heap {6:2,7:4}, eat 6:2->6:1, left {6:1,7:4}, ans 5 ===== -->
  <rect x="30"  y="202" width="44"  height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="52"  y="221" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="78"  y="202" width="86"  height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="121" y="221" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">6 : 2</text>
  <rect x="168" y="202" width="130" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="233" y="221" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">{6:2, 7:4}</text>
  <rect x="302" y="202" width="110" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="357" y="221" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">6:2 → 6:1</text>
  <rect x="416" y="202" width="130" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="481" y="221" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{6:1, 7:4}</text>
  <rect x="550" y="202" width="46"  height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="573" y="221" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">5</text>

  <!-- ===== Row day5: no add, heap {6:1,7:4}, eat 6:1->0, left {7:4}, ans 6 ===== -->
  <rect x="30"  y="232" width="44"  height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="52"  y="251" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="78"  y="232" width="86"  height="28" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="3 3" rx="4" filter="url(#rough2)"/>
  <text x="121" y="251" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>
  <rect x="168" y="232" width="130" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="233" y="251" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{6:1, 7:4}</text>
  <rect x="302" y="232" width="110" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="357" y="251" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">6:1 → 0</text>
  <rect x="416" y="232" width="130" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="481" y="251" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{7:4}</text>
  <rect x="550" y="232" width="46"  height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="573" y="251" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">6</text>

  <!-- ===== Row day6: no add, heap {7:4}, eat 7:4->7:3, left {7:3}, ans 7 ===== -->
  <rect x="30"  y="262" width="44"  height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="52"  y="281" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <rect x="78"  y="262" width="86"  height="28" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="3 3" rx="4" filter="url(#rough2)"/>
  <text x="121" y="281" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>
  <rect x="168" y="262" width="130" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="233" y="281" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{7:4}</text>
  <rect x="302" y="262" width="110" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="357" y="281" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">7:4 → 7:3</text>
  <rect x="416" y="262" width="130" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="481" y="281" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{7:3}</text>
  <rect x="550" y="262" width="46"  height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="573" y="281" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">7</text>

  <!-- ===== Row day7 (gray): no add, clean 7:3, heap {}, no eat, stop ===== -->
  <rect x="30"  y="292" width="44"  height="28" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="52"  y="311" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">7</text>
  <rect x="78"  y="292" width="86"  height="28" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="3 3" rx="4" filter="url(#rough2)"/>
  <text x="121" y="311" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>
  <rect x="168" y="292" width="130" height="28" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="233" y="311" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">{}（清 7:3）</text>
  <rect x="302" y="292" width="110" height="28" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="3 3" rx="4" filter="url(#rough2)"/>
  <text x="357" y="311" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—（停）</text>
  <rect x="416" y="292" width="130" height="28" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="481" y="311" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">{}</text>
  <rect x="550" y="292" width="46"  height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="573" y="311" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">7</text>

  <!-- answer arrow + box -->
  <path d="M573,326 L573,338" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="40" y="330" width="300" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="190" y="345" text-anchor="middle" font-size="10" fill="#5a4a1a" filter="url(#rough2)">
    Day3 先清烂再吃；Day4 新到 6:2 比存量 7:4 更近 → 堆顶自动切换
  </text>
</svg>
