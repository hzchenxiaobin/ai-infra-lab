<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：三个示例的逐步转换</text>

  <!-- ===== Column headers ===== -->
  <text x="50" y="60" font-size="11" fill="#888" font-weight="bold">输入</text>
  <text x="170" y="60" font-size="11" fill="#888" font-weight="bold">切分</text>
  <text x="280" y="60" font-size="11" fill="#888" font-weight="bold">剥后缀→day</text>
  <text x="380" y="60" font-size="11" fill="#888" font-weight="bold">查表→month</text>
  <text x="470" y="60" font-size="11" fill="#888" font-weight="bold">输出</text>

  <!-- ===== Example 1 ===== -->
  <text x="40" y="92" font-size="11" fill="#446688" font-weight="bold">示例1</text>
  <rect x="30" y="98" width="120" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="90" y="124" text-anchor="middle" font-size="11" fill="#333">"20th Oct</text>
  <text x="90" y="140" text-anchor="middle" font-size="11" fill="#333">2052"</text>

  <rect x="160" y="98" width="120" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="220" y="124" text-anchor="middle" font-size="11" fill="#333">["20th",</text>
  <text x="220" y="140" text-anchor="middle" font-size="11" fill="#333">"Oct","2052"]</text>

  <rect x="290" y="98" width="120" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="350" y="120" text-anchor="middle" font-size="11" fill="#333">"20th"[:-2]</text>
  <text x="350" y="138" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">→ 20</text>
  <text x="350" y="152" text-anchor="middle" font-size="10" fill="#888">已是2位</text>

  <rect x="420" y="98" width="120" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="480" y="120" text-anchor="middle" font-size="11" fill="#333">"Oct"→10</text>
  <text x="480" y="138" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">→ 10</text>
  <text x="480" y="152" text-anchor="middle" font-size="10" fill="#888">已是2位</text>

  <path d="M 90 158 L 90 168 L 480 168 L 480 158" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="380" y="174" width="200" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="480" y="190" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">"2052-10-20" ✓</text>

  <!-- ===== Example 2 (with zero pad highlight) ===== -->
  <text x="40" y="222" font-size="11" fill="#b85450" font-weight="bold">示例2</text>
  <rect x="30" y="228" width="120" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="90" y="254" text-anchor="middle" font-size="11" fill="#333">"6th Jun</text>
  <text x="90" y="270" text-anchor="middle" font-size="11" fill="#333">1933"</text>

  <rect x="160" y="228" width="120" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="220" y="254" text-anchor="middle" font-size="11" fill="#333">["6th",</text>
  <text x="220" y="270" text-anchor="middle" font-size="11" fill="#333">"Jun","1933"]</text>

  <rect x="290" y="228" width="120" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="350" y="250" text-anchor="middle" font-size="11" fill="#333">"6th"[:-2]</text>
  <text x="350" y="268" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">→ 6</text>
  <text x="350" y="282" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">补零→"06" ⚠</text>

  <rect x="420" y="228" width="120" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="480" y="250" text-anchor="middle" font-size="11" fill="#333">"Jun"→6</text>
  <text x="480" y="268" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">→ 6</text>
  <text x="480" y="282" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">补零→"06" ⚠</text>

  <path d="M 90 288 L 90 298 L 480 298 L 480 288" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="380" y="304" width="200" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="480" y="320" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">"1933-06-06" ✓</text>

  <!-- ===== Example 3 ===== -->
  <text x="40" y="352" font-size="11" fill="#446688" font-weight="bold">示例3</text>
  <rect x="30" y="358" width="120" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="90" y="380" text-anchor="middle" font-size="11" fill="#333">"26th May</text>
  <text x="90" y="396" text-anchor="middle" font-size="11" fill="#333">1960"</text>

  <rect x="160" y="358" width="120" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="220" y="388" text-anchor="middle" font-size="11" fill="#333">["26th","May","1960"]</text>

  <rect x="290" y="358" width="120" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="350" y="380" text-anchor="middle" font-size="11" fill="#333">"26th"[:-2]</text>
  <text x="350" y="396" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">→ 26</text>

  <rect x="420" y="358" width="120" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="480" y="380" text-anchor="middle" font-size="11" fill="#333">"May"→5</text>
  <text x="480" y="396" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">→ 05 ⚠</text>
</svg>
