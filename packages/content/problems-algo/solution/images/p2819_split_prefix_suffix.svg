<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">排序后按 k 二分：左取前缀（最便宜），右取后缀（最贵）</text>

  <!-- sorted prices row -->
  <text x="30" y="70" font-size="12" fill="#999" font-weight="bold" filter="url(#rough2)">prices(升序)</text>
  <rect x="92" y="52" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="120" y="73" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="152" y="52" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="180" y="73" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>
  <rect x="212" y="52" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="240" y="73" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">10</text>
  <rect x="292" y="52" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="320" y="73" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">19</text>
  <rect x="352" y="52" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="380" y="73" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">22</text>

  <!-- k split dashed line -->
  <path d="M 276 44 L 276 96" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="276" y="104" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">k=18 分界</text>

  <!-- part labels -->
  <rect x="92" y="120" width="176" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="180" y="142" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">第一部分 p ≤ k：loss = p</text>
  <rect x="292" y="120" width="116" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="350" y="142" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">第二部分 p&gt;k：loss=2k−p</text>

  <!-- arrows down from boxes to parts -->
  <path d="M 120 84 L 160 120" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 320 84 L 340 120" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arro)" filter="url(#rough2)"/>

  <!-- selection: prefix from left -->
  <text x="30" y="196" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">取前缀 j 个</text>
  <path d="M 120 160 L 120 186" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="92" y="190" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="210" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="152" y="190" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="210" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">9</text>
  <rect x="212" y="190" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="240" y="210" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">10</text>
  <text x="276" y="210" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">← 前缀和 pre[j]</text>

  <!-- selection: suffix from right -->
  <text x="430" y="196" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">取后缀 m−j 个</text>
  <path d="M 380 160 L 360 186" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arro)" filter="url(#rough2)"/>
  <rect x="292" y="190" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="210" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">19</text>
  <rect x="352" y="190" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="380" y="210" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">22</text>
  <text x="330" y="232" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">后缀和 suf[m−j]（取最贵的，loss 最小）</text>

  <!-- formula box -->
  <rect x="60" y="252" width="480" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="274" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">总损失 L(j) = pre[j] + (m−j)·2k − suf[m−j]</text>
  <text x="300" y="294" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">枚举 j（第一部分取几个），求 L(j) 最小值</text>

  <text x="30" y="340" font-size="11" fill="#999" filter="url(#rough2)">要点：左端越便宜损失越小 → 取前缀；右端越贵（2k−p 越小）→ 取后缀</text>
  <text x="30" y="358" font-size="11" fill="#999" filter="url(#rough2)">两段都是从“端点”往中间吃，故只需决定交界处各吃几个</text>
</svg>
