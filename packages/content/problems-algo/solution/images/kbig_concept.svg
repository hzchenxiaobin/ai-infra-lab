<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：双树状数组分别统计 i 左 / 右「严格更小」的个数</text>

  <text x="60" y="58" font-size="11" fill="#888">nums = [2, 3, 6, 5, 2, 3]，k = 2，考察 i = 2（值 6）</text>

  <!-- 数组格子 -->
  <rect x="60" y="74" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="82" y="101" text-anchor="middle" font-size="14" fill="#333">2</text>
  <rect x="104" y="74" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="126" y="101" text-anchor="middle" font-size="14" fill="#333">3</text>
  <rect x="148" y="74" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="101" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">6</text>
  <rect x="192" y="74" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="214" y="101" text-anchor="middle" font-size="14" fill="#333">5</text>
  <rect x="236" y="74" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="258" y="101" text-anchor="middle" font-size="14" fill="#333">2</text>
  <rect x="280" y="74" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="302" y="101" text-anchor="middle" font-size="14" fill="#333">3</text>

  <!-- 下标 -->
  <text x="82" y="70" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="126" y="70" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="170" y="70" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">2 ← i</text>
  <text x="214" y="70" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="258" y="70" text-anchor="middle" font-size="9" fill="#aaa">4</text>
  <text x="302" y="70" text-anchor="middle" font-size="9" fill="#aaa">5</text>

  <!-- 左侧花括号 -->
  <path d="M 82 122 L 82 134 L 126 134 L 126 122" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 104 134 L 104 142" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="104" y="158" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">左侧：&lt; 6 的个数 = 2</text>

  <!-- 右侧花括号 -->
  <path d="M 214 122 L 214 134 L 302 134 L 302 122" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 258 134 L 258 142" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="258" y="158" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">右侧：&lt; 6 的个数 = 3</text>

  <!-- 两个 BIT 框 -->
  <rect x="60" y="176" width="124" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="122" y="198" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">left（树状数组）</text>
  <text x="122" y="218" text-anchor="middle" font-size="11" fill="#333">扫到 i 前逐步 update</text>
  <text x="122" y="236" text-anchor="middle" font-size="11" fill="#333">left.query(v−1) = 2</text>

  <rect x="216" y="176" width="124" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="278" y="198" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">right（树状数组）</text>
  <text x="278" y="218" text-anchor="middle" font-size="11" fill="#333">先全量装入，再按位移出</text>
  <text x="278" y="236" text-anchor="middle" font-size="11" fill="#333">right.query(v−1) = 3</text>

  <!-- 连线：数组到 BIT -->
  <path d="M 104 160 Q 104 170 122 176" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 258 160 Q 258 170 278 176" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定框 -->
  <rect x="60" y="276" width="280" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="200" y="298" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">判定 k-big</text>
  <text x="200" y="318" text-anchor="middle" font-size="11.5" fill="#333">left.query(v−1) ≥ k  且  right.query(v−1) ≥ k</text>
  <text x="200" y="332" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">→ ans += 1（这里 2 ≥ 2 且 3 ≥ 2 ✓）</text>

  <!-- 右侧说明 -->
  <rect x="360" y="176" width="180" height="162" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="378" y="198" font-size="12" fill="#d6a040" font-weight="bold">要点</text>
  <text x="378" y="220" font-size="11" fill="#333">① BIT 按值建桶，下标即值；</text>
  <text x="378" y="238" font-size="11" fill="#333">　 query(v−1) = 严格 &lt; v 的计数</text>
  <text x="378" y="258" font-size="11" fill="#333">② 约束 nums[i] ≤ n，</text>
  <text x="378" y="276" font-size="11" fill="#333">　 故值域 [1,n] 直接装 n 桶，</text>
  <text x="378" y="294" font-size="11" fill="#333">　 无需离散化</text>
  <text x="378" y="314" font-size="11" fill="#b85450">③ 等于 v 的不计入（严格小）</text>

  <text x="280" y="378" text-anchor="middle" font-size="10.5" fill="#888">左 BIT 增量累入 / 右 BIT 先装后删，一趟遍历即可对每个 i 双向计数</text>
</svg>
