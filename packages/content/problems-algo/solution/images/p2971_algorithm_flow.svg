<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="450" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：排序 → 前缀和 → 倒序首命中</text>

  <!-- 开始 -->
  <ellipse cx="260" cy="58" rx="46" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="63" text-anchor="middle" font-size="12" fill="#33506e" filter="url(#rough2)">开始</text>

  <path d="M 260 76 L 260 96" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 排序 -->
  <rect x="180" y="98" width="160" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="118" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">排序 nums.sort()</text>

  <path d="M 260 130 L 260 150" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 前缀和 -->
  <rect x="160" y="152" width="200" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="172" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">前缀和 pre[0..n]</text>

  <path d="M 260 184 L 260 204" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i = n-1 -->
  <rect x="190" y="206" width="140" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="226" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">i = n − 1</text>

  <path d="M 260 238 L 260 258" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 i >= 2 ? -->
  <polygon points="260,258 348,296 260,334 172,296" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="292" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">i ≥ 2 ?</text>
  <text x="260" y="308" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">（至少 3 条边）</text>

  <path d="M 348 296 L 400 296 L 400 330" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="368" y="288" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- 返回 -1 -->
  <rect x="352" y="332" width="96" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="400" y="352" text-anchor="middle" font-size="12" fill="#7a2e2a" filter="url(#rough2)">返回 −1</text>

  <path d="M 260 334 L 260 358" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="350" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 菱形 nums[i] < pre[i] ? -->
  <polygon points="260,358 388,396 260,434 132,396" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="392" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">nums[i] &lt; pre[i] ?</text>
  <text x="260" y="408" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">（严格小于！相等退化成线段）</text>

  <path d="M 388 396 L 420 396" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="396" y="388" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 返回 pre[i+1] -->
  <rect x="424" y="381" width="88" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="468" y="394" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">返回 pre[i+1]</text>
  <text x="468" y="407" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">最大周长！</text>

  <!-- 否：i-- 回环 -->
  <path d="M 132 396 L 80 396 L 80 296" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 80 296 L 90 296" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="44" y="372" width="72" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="80" y="389" text-anchor="middle" font-size="12" fill="#7a2e2a" filter="url(#rough2)">i −−</text>
  <text x="108" y="388" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
</svg>
