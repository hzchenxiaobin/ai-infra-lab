<svg xmlns="http://www.w3.org/2000/svg" width="560" height="380" viewBox="0 0 560 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
    <marker id="aro" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
    <marker id="argray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="560" height="380" fill="#fdfcf7"/>
  <text x="280" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">BFS 流程：取已开盒 → 收糖果 → 派发钥匙/盒子</text>
  <path d="M 150 38 Q 280 46 410 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)">
    <rect x="60" y="62" width="130" height="34" rx="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="125" y="84" text-anchor="middle" font-size="12" fill="#2b4b6e">初始盒子放入 hasBox</text>

  <path d="M 125 96 L 125 116" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#argray)" filter="url(#sk)"/>

  <!-- enqueue initially openable -->
  <g filter="url(#sk)">
    <rect x="50" y="118" width="150" height="40" rx="6" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="125" y="135" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">可开的(status=1)入队</text>
  <text x="125" y="151" text-anchor="middle" font-size="10" fill="#888">opened[b]=true 防重复</text>

  <path d="M 125 158 L 125 178" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#argray)" filter="url(#sk)"/>

  <!-- while loop diamond -->
  <g filter="url(#sk)">
    <path d="M 125 222 L 60 180 L 125 138 L 190 180 Z" fill="none"/>
  </g>
  <g filter="url(#sk)">
    <path d="M 125 230 L 50 184 L 125 178 L 200 184 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="125" y="196" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">队列空?</text>
  <text x="125" y="212" text-anchor="middle" font-size="11" fill="#888">空→结束返回 ans</text>

  <path d="M 125 230 L 125 252" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#argray)" filter="url(#sk)"/>

  <!-- pop box b -->
  <g filter="url(#sk)">
    <rect x="55" y="254" width="140" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="125" y="276" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">出队 b，ans += candies[b]</text>

  <!-- right: two branches -->
  <path d="M 195 271 L 250 271 L 250 150" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#argray)" filter="url(#sk)"/>
  <path d="M 195 271 L 250 271 L 250 280" stroke="#c98a2b" stroke-width="1.8" fill="none" marker-end="url(#argray)" filter="url(#sk)"/>

  <!-- branch A: keys -->
  <g filter="url(#sk)">
    <rect x="250" y="120" width="270" height="78" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="266" y="142" font-size="12" fill="#2b4b6e" font-weight="bold">遍历 keys[b] 每把钥匙 k：</text>
  <text x="266" y="162" font-size="11" fill="#555">hasKey[k] = true</text>
  <text x="266" y="180" font-size="11" fill="#b03a3a" font-weight="bold">若 hasBox[k] 且 !opened[k] → 入队</text>
  <path d="M 385 120 L 385 96 L 200 96 L 200 184" stroke="#4a8e4a" stroke-width="1.6" stroke-dasharray="5 3" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>

  <!-- branch B: contained boxes -->
  <g filter="url(#sk)">
    <rect x="250" y="280" width="270" height="78" rx="8" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="266" y="302" font-size="12" fill="#7a5415" font-weight="bold">遍历 containedBoxes[b] 每个盒 c：</text>
  <text x="266" y="322" font-size="11" fill="#555">hasBox[c] = true</text>
  <text x="266" y="340" font-size="11" fill="#b03a3a" font-weight="bold">若 status[c]==1 或 hasKey[c] 且 !opened[c] → 入队</text>
  <path d="M 385 358 L 385 372 L 125 372 L 125 184" stroke="#c98a2b" stroke-width="1.6" stroke-dasharray="5 3" fill="none" marker-end="url(#aro)" filter="url(#sk)"/>

  <text x="280" y="366" text-anchor="middle" font-size="10" fill="#888">两个分支都可能新触发开箱，循环回到判断队列</text>
</svg>
