<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：两条窗口列并行计算 → 套公式 → 除零保护</text>

  <!-- Step 1 -->
  <rect x="40" y="46" width="480" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="58" y="66" font-size="11.5" fill="#446688" font-weight="bold">① FROM Students</text>
  <text x="58" y="82" font-size="10.5" fill="#555">逐行扫描，对每行计算两个窗口列（互不依赖，可并行求值）</text>

  <path d="M 280 90 L 280 106" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: two parallel window computations -->
  <rect x="40" y="112" width="230" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="60" y="132" font-size="11" fill="#4a7a3a" font-weight="bold">② 排名列 rk</text>
  <text x="60" y="148" font-size="9.5" fill="#555">RANK() OVER (</text>
  <text x="60" y="161" font-size="9.5" fill="#555">  PARTITION BY dept</text>
  <text x="60" y="174" font-size="9.5" fill="#555">  ORDER BY mark DESC)</text>

  <rect x="290" y="112" width="230" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="132" font-size="11" fill="#d6a040" font-weight="bold">③ 人数列 cnt</text>
  <text x="310" y="148" font-size="9.5" fill="#555">COUNT(*) OVER (</text>
  <text x="310" y="161" font-size="9.5" fill="#555">  PARTITION BY dept)</text>
  <text x="310" y="174" font-size="9.5" fill="#888">= 该部门总人数 n</text>

  <path d="M 155 176 L 155 196 M 405 176 L 405 196 M 155 196 L 405 196 M 280 196 L 280 214" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 4: formula -->
  <rect x="40" y="220" width="480" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="58" y="240" font-size="11.5" fill="#b85450" font-weight="bold">④ 套公式 + 四舍五入</text>
  <text x="280" y="262" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">ROUND( (rk − 1) × 100 / (cnt − 1), 2 )</text>
  <text x="280" y="277" text-anchor="middle" font-size="9.5" fill="#888">rk=1→0%（最高分），rk=cnt→100%（最低分，无并列时）</text>

  <path d="M 280 280 L 280 296" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 5: division guard -->
  <rect x="40" y="302" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="58" y="322" font-size="11.5" fill="#d6a040" font-weight="bold">⑤ 除零保护</text>
  <text x="280" y="342" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">IFNULL( … , 0 )  AS percentage</text>
  <text x="280" y="356" text-anchor="middle" font-size="9.5" fill="#888">cnt=1（部门仅 1 人）→ 分母为 0 → MySQL 得 NULL → 归 0</text>

  <path d="M 280 358 L 280 374" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 6: output -->
  <rect x="40" y="380" width="480" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="58" y="406" font-size="11.5" fill="#4a7a3a" font-weight="bold">⑥ 输出 SELECT student_id, department_id, percentage</text>

  <!-- side note -->
  <text x="40" y="438" font-size="10.5" fill="#888">注：②③两窗口列共享同一 PARTITION，引擎只需对该分区排序一次，COUNT 列附送</text>
  <text x="40" y="454" font-size="10.5" fill="#888">　 套公式后无需 GROUP BY，因窗口函数保留原行数（「聚合不塌缩」）</text>
</svg>
