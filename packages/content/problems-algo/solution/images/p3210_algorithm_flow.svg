<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="230" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：一次遍历 + 下标取模</text>

  <!-- 开始 -->
  <ellipse cx="230" cy="58" rx="42" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="63" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M230,74 L230,88" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 预处理 -->
  <rect x="150" y="92" width="160" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="113" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">n = len(s)；k %= n</text>
  <path d="M230,126 L230,140" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环变量 -->
  <rect x="165" y="144" width="130" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="163" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i = 0</text>
  <path d="M230,174 L230,188" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="230,192 292,222 230,252 168,222" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="226" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i &lt; n ?</text>

  <!-- 是 → 右侧处理 -->
  <path d="M292,222 L330,222" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="305" y="214" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="335" y="150" width="150" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="410" y="170" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">j = (i + k) % n</text>
  <path d="M410,182 L410,196" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="335" y="200" width="150" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="410" y="220" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">res += s[j]；i++</text>
  <path d="M410,232 L410,252 L262,252 L262,240" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="340" y="268" font-size="10" fill="#888" filter="url(#rough2)">回到判断</text>

  <!-- 否 → 返回 -->
  <path d="M230,252 L230,276" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="243" y="268" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="140" y="280" width="180" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="301" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 ''.join(res)</text>

  <!-- 底部注解 -->
  <rect x="315" y="288" width="190" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="410" y="308" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">每个字符 O(1) 定位</text>
  <text x="410" y="326" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i, k 均非负，无需防负数取模</text>
  <text x="410" y="340" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（对照 3206 的 +n 技巧）</text>
</svg>
