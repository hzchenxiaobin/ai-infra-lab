<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">区间 DP 算法流程</text>

  <!-- Step 1: enumerate length -->
  <rect x="170" y="45" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="70" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">枚举区间长度 len = 1 → n</text>

  <!-- Arrow -->
  <path d="M270,88 L270,100" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: enumerate i -->
  <rect x="170" y="105" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="130" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">枚举左端 i, j = i + len − 1</text>

  <!-- Arrow -->
  <path d="M270,148 L270,160" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: len == 1? -->
  <polygon points="270,165 360,200 270,235 180,200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="205" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">len == 1?</text>

  <!-- Yes branch -->
  <path d="M180,200 L100,200 L100,220" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="135" y="193" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="45" y="225" width="110" height="35" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="100" y="248" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">dp[i][i] = 1</text>

  <!-- No branch -->
  <path d="M360,200 L440,200 L440,220" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="395" y="193" font-size="12" fill="#446688" filter="url(#rough2)">否</text>

  <!-- Step 3: init to inf and split -->
  <rect x="350" y="225" width="180" height="55" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="440" y="245" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">dp[i][j] = +∞</text>
  <text x="440" y="263" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">枚举 k: dp[i][k]+dp[k+1][j]</text>

  <!-- Arrow down -->
  <path d="M440,283 L440,295" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: arr[i] == arr[j]? -->
  <polygon points="440,300 530,335 440,370 350,335" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="440" y="340" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">arr[i]==arr[j]?</text>

  <!-- Yes: update with dp[i+1][j-1] -->
  <path d="M350,335 L280,335 L280,355" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="305" y="328" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="195" y="360" width="170" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="385" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">dp[i][j] = min(dp[i][j], dp[i+1][j-1])</text>

  <!-- No: skip -->
  <path d="M530,335 L530,360" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="540" y="328" font-size="11" fill="#666" filter="url(#rough2)">否</text>
  <rect x="475" y="365" width="55" height="30" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="502" y="385" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">跳过</text>

  <!-- Final result -->
  <path d="M280,403 L280,418" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="160" y="423" width="240" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="443" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">返回 dp[0][n-1]</text>
</svg>
