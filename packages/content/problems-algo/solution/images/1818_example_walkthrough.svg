<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums1=[1,7,5], nums2=[2,3,5]</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">sorted1 = [1, 5, 7]，逐位二分找最接近 nums2[i] 的值</text>

  <!-- table header -->
  <g filter="url(#rough2)" font-size="10" text-anchor="middle" font-weight="bold">
    <rect x="48" y="58" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="68" y="75" fill="#446688">i</text>
    <rect x="88" y="58" width="52" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="114" y="75" fill="#446688">nums2[i]</text>
    <rect x="140" y="58" width="52" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="166" y="75" fill="#446688">原差值</text>
    <rect x="192" y="58" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="210" y="75" fill="#446688">p</text>
    <rect x="228" y="58" width="156" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="306" y="75" fill="#446688">候选 sorted1[p−1] / sorted1[p]</text>
    <rect x="384" y="58" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="412" y="75" fill="#446688">min_dist</text>
    <rect x="440" y="58" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="480" y="75" fill="#446688">gain</text>
  </g>

  <!-- row i=0 -->
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <rect x="48" y="88" width="40" height="30" fill="#fff" stroke="#888" stroke-width="1" rx="4"/>
    <text x="68" y="108" fill="#555" font-weight="bold">0</text>
    <rect x="88" y="88" width="52" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4"/>
    <text x="114" y="108" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="140" y="88" width="52" height="30" fill="#fff" stroke="#888" stroke-width="1" rx="4"/>
    <text x="166" y="108" fill="#555" font-weight="bold">1</text>
    <rect x="192" y="88" width="36" height="30" fill="#fff" stroke="#888" stroke-width="1" rx="4"/>
    <text x="210" y="108" fill="#555" font-weight="bold">1</text>
    <rect x="228" y="88" width="156" height="30" fill="#fff" stroke="#888" stroke-width="1" rx="4"/>
    <text x="306" y="108" fill="#446688">1→|1−2|=1, 5→|5−2|=3</text>
    <rect x="384" y="88" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <text x="412" y="108" fill="#d6a040" font-weight="bold">1</text>
    <rect x="440" y="88" width="80" height="30" fill="#fff" stroke="#888" stroke-width="1" rx="4"/>
    <text x="480" y="108" fill="#555" font-weight="bold">1−1=0</text>
  </g>

  <!-- row i=1 (highlighted: max gain) -->
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <rect x="48" y="122" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="68" y="142" fill="#d6a040" font-weight="bold">1</text>
    <rect x="88" y="122" width="52" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="114" y="142" fill="#d6a040" font-weight="bold">3</text>
    <rect x="140" y="122" width="52" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="166" y="142" fill="#d6a040" font-weight="bold">4</text>
    <rect x="192" y="122" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="210" y="142" fill="#d6a040" font-weight="bold">1</text>
    <rect x="228" y="122" width="156" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="306" y="142" fill="#b85450" font-weight="bold">1→|1−3|=2, 5→|5−3|=2</text>
    <rect x="384" y="122" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="412" y="142" fill="#d6a040" font-weight="bold">2</text>
    <rect x="440" y="122" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="480" y="142" fill="#b85450" font-weight="bold">4−2=2 ★</text>
  </g>

  <!-- row i=2 -->
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <rect x="48" y="156" width="40" height="30" fill="#fff" stroke="#888" stroke-width="1" rx="4"/>
    <text x="68" y="176" fill="#555" font-weight="bold">2</text>
    <rect x="88" y="156" width="52" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4"/>
    <text x="114" y="176" fill="#4a7a3a" font-weight="bold">5</text>
    <rect x="140" y="156" width="52" height="30" fill="#fff" stroke="#888" stroke-width="1" rx="4"/>
    <text x="166" y="176" fill="#555" font-weight="bold">0</text>
    <rect x="192" y="156" width="36" height="30" fill="#fff" stroke="#888" stroke-width="1" rx="4"/>
    <text x="210" y="176" fill="#555" font-weight="bold">1</text>
    <rect x="228" y="156" width="156" height="30" fill="#fff" stroke="#888" stroke-width="1" rx="4"/>
    <text x="306" y="176" fill="#446688">1→|1−5|=4, 5→|5−5|=0</text>
    <rect x="384" y="156" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <text x="412" y="176" fill="#d6a040" font-weight="bold">0</text>
    <rect x="440" y="156" width="80" height="30" fill="#fff" stroke="#888" stroke-width="1" rx="4"/>
    <text x="480" y="176" fill="#555" font-weight="bold">0−0=0</text>
  </g>

  <!-- note for i=1 -->
  <text x="280" y="206" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">★ i=1 的 gain=2 最大：把 nums1[1]=7 换成 5（或 1），该位差值从 4 降到 2</text>

  <!-- divider -->
  <line x1="48" y1="222" x2="520" y2="222" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- ===== Final computation ===== -->
  <text x="280" y="246" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">汇总计算</text>

  <!-- total -->
  <rect x="80" y="260" width="380" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="280" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">total = 1 + 4 + 0 = 5</text>

  <!-- maxGain -->
  <rect x="80" y="300" width="380" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="320" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">maxGain = max(0, 2, 0) = 2</text>

  <!-- answer -->
  <rect x="80" y="340" width="380" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="360" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">answer = ( total − maxGain ) mod (10⁹+7) = (5 − 2) = 3</text>

  <!-- footer insight -->
  <rect x="48" y="386" width="472" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="64" y="406" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">关键：只替换使 gain 最大的一位即可——</text>
  <text x="64" y="422" font-size="10" fill="#555" filter="url(#rough2)">每位独立求「可减小量」，取最大者一次性扣减，无需逐位模拟所有替换组合</text>
</svg>
