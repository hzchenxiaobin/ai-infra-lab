<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">新 21 点：分数轴三区域与转移扇</text>

  <!-- zone labels -->
  <text x="155" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">抽牌区 (score &lt; k)</text>
  <text x="315" y="52" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">获胜 (k ≤ score ≤ n)</text>
  <text x="450" y="52" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">失败 (score &gt; n)</text>

  <!-- continuous bar: blue | green | red -->
  <rect x="80" y="60" width="150" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="230" y="60" width="170" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="400" y="60" width="100" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- tick labels -->
  <text x="90" y="80" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="218" y="80" text-anchor="middle" font-size="10" fill="#333">k-1</text>
  <text x="242" y="80" text-anchor="middle" font-size="11" fill="#333">k</text>
  <text x="388" y="80" text-anchor="middle" font-size="11" fill="#333">n</text>
  <text x="414" y="80" text-anchor="middle" font-size="9" fill="#333">n+1</text>
  <text x="490" y="80" text-anchor="middle" font-size="9" fill="#333">k-1+W</text>

  <!-- divider lines -->
  <line x1="230" y1="56" x2="230" y2="96" stroke="#888" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <line x1="400" y1="56" x2="400" y2="96" stroke="#888" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- transition fan -->
  <text x="280" y="124" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">从状态 y (&lt; k) 抽一张牌，等概率跳到 y+1 … y+W</text>

  <!-- source state y -->
  <rect x="100" y="146" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="117" y="166" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">y</text>

  <!-- target states with arrows -->
  <rect x="300" y="134" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="322" y="151" text-anchor="middle" font-size="10" fill="#333">y+1</text>
  <path d="M 134 156 L 298 146" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="206" y="142" font-size="9" fill="#888">1/W</text>

  <rect x="300" y="166" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="322" y="183" text-anchor="middle" font-size="10" fill="#333">y+2</text>
  <path d="M 134 162 L 298 178" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="206" y="178" font-size="9" fill="#888">1/W</text>

  <text x="322" y="206" text-anchor="middle" font-size="13" fill="#aaa">…</text>

  <rect x="300" y="214" width="44" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="322" y="231" text-anchor="middle" font-size="10" fill="#333">y+W</text>
  <path d="M 134 170 L 298 226" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="186" y="218" font-size="9" fill="#888">1/W</text>

  <!-- zone color legend for targets -->
  <text x="372" y="151" font-size="9" fill="#446688">仍在抽牌区</text>
  <text x="372" y="183" font-size="9" fill="#4a7a3a">停止·获胜</text>
  <text x="372" y="231" font-size="9" fill="#b85450">停止·失败</text>

  <!-- formula box -->
  <rect x="40" y="262" width="480" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="284" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">dp[x] = (1/W) · Σ dp[y]，y ∈ [x−W, x−1] 且 y &lt; k</text>
  <text x="280" y="304" text-anchor="middle" font-size="12" fill="#444">答案 = Σ dp[x]，x ∈ [k, min(n, k−1+W)]</text>

  <!-- note -->
  <rect x="40" y="326" width="480" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="346" text-anchor="middle" font-size="11" fill="#444">W = maxPts，每张牌等概率 1/W，独立抽取</text>
  <text x="280" y="362" text-anchor="middle" font-size="11" fill="#4a7a3a">停止条件 score ≥ k；最大终分 = k−1+W</text>
</svg>
