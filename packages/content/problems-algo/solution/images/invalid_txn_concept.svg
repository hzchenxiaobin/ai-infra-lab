<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：交易无效的两条规则</text>

  <!-- Rule 1 label -->
  <rect x="30" y="48" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="60" y="65" text-anchor="middle" font-size="12" fill="#8a3a3a" filter="url(#rough2)">规则一</text>

  <!-- Rule 1: amount > 1000 -->
  <rect x="100" y="48" width="220" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="210" y="68" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">alice,50,1200,mtv</text>
  <text x="210" y="86" text-anchor="middle" font-size="11" fill="#8a3a3a" filter="url(#rough2)">金额 1200 &gt; 1000 → 无效</text>

  <!-- arrow rule1 -->
  <path d="M 330 73 L 372 73" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="380" y="58" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="405" y="78" text-anchor="middle" font-size="11" fill="#8a3a3a" filter="url(#rough2)">无效</text>

  <!-- divider -->
  <path d="M 40 120 L 520 120" stroke="#cccccc" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Rule 2 label -->
  <rect x="30" y="138" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="60" y="155" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">规则二</text>

  <!-- Rule 2: same name, diff city, within 60 min -->
  <text x="100" y="156" font-size="11" fill="#333" filter="url(#rough2)">同名 + 异城 + |Δt| ≤ 60 分钟</text>

  <!-- txn A card -->
  <rect x="50" y="172" width="180" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="140" y="192" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">alice,20,800,mtv</text>
  <text x="140" y="208" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">t=20  city=mtv</text>

  <!-- txn B card -->
  <rect x="320" y="172" width="180" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="410" y="192" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">alice,50,100,beijing</text>
  <text x="410" y="208" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">t=50  city=beijing</text>

  <!-- time distance bar -->
  <path d="M 140 230 L 410 230" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 410 230 L 140 230" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="225" y="222" width="100" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="275" y="237" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">|30| ≤ 60 ✓</text>

  <!-- both invalid -->
  <rect x="90" y="258" width="160" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="170" y="276" text-anchor="middle" font-size="11" fill="#8a3a3a" filter="url(#rough2)">mtv ≠ beijing → 无效</text>
  <rect x="300" y="258" width="160" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="380" y="276" text-anchor="middle" font-size="11" fill="#8a3a3a" filter="url(#rough2)">beijing ≠ mtv → 无效</text>

  <!-- key insight -->
  <rect x="40" y="302" width="480" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="12" fill="#3a5a2a" filter="url(#rough2)">两条规则是 OR 关系：满足任一即无效</text>
  <text x="280" y="344" text-anchor="middle" font-size="11" fill="#3a5a2a" filter="url(#rough2)">规则二需同时满足：同名 ∧ 异城 ∧ |Δt|≤60</text>
  <text x="280" y="360" text-anchor="middle" font-size="11" fill="#3a5a2a" filter="url(#rough2)">同名同城即使时间相近也不触发规则二</text>
</svg>
