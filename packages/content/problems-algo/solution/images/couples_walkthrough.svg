<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="760" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="380" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：row = [0,2,1,3]，n=2 → 1 次交换</text>

  <!-- ===== Step 0: initial row ===== -->
  <text x="60" y="66" font-size="12" fill="#444" font-weight="bold">初始：</text>
  <!-- couch 0 highlight (misplaced) -->
  <rect x="100" y="50" width="200" height="64" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="200" y="44" text-anchor="middle" font-size="10" fill="#b03a3a">沙发0：人 0 与 2 不是情侣</text>
  <!-- seat 0 -> person 0 -->
  <rect x="110" y="60" width="84" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="152" y="82" text-anchor="middle" font-size="10" fill="#888">座位0</text>
  <text x="152" y="98" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <!-- seat 1 -> person 2 -->
  <rect x="206" y="60" width="84" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="248" y="82" text-anchor="middle" font-size="10" fill="#888">座位1</text>
  <text x="248" y="98" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>

  <!-- couch 1 -->
  <rect x="320" y="50" width="200" height="64" rx="8" fill="#f4faf6" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="420" y="44" text-anchor="middle" font-size="10" fill="#2e6e2e">沙发1：人 1 与 3 不是情侣</text>
  <rect x="330" y="60" width="84" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="372" y="82" text-anchor="middle" font-size="10" fill="#888">座位2</text>
  <text x="372" y="98" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="426" y="60" width="84" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="468" y="82" text-anchor="middle" font-size="10" fill="#888">座位3</text>
  <text x="468" y="98" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>

  <!-- annotation on right -->
  <rect x="540" y="58" width="196" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="638" y="78" text-anchor="middle" font-size="11" fill="#444">沙发0：x=row[0]=0</text>
  <text x="638" y="94" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">partner=0^1=1，在座位2</text>

  <!-- ===== swap arrow ===== -->
  <!-- swap seat1 (person 2) and seat2 (person 1) -->
  <path d="M 248 110 C 200 150, 220 150, 372 110" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="6,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="148" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">交换座位1 ↔ 座位2（即 2 与 1）</text>

  <!-- ===== Step 1: after swap ===== -->
  <text x="60" y="196" font-size="12" fill="#444" font-weight="bold">交换后：</text>
  <!-- couch 0 now paired -->
  <rect x="100" y="180" width="200" height="64" rx="8" fill="#f4faf6" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="200" y="174" text-anchor="middle" font-size="10" fill="#2e6e2e">沙发0：0 与 1 ✓ 情侣</text>
  <rect x="110" y="190" width="84" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="152" y="212" text-anchor="middle" font-size="10" fill="#888">座位0</text>
  <text x="152" y="228" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="206" y="190" width="84" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="248" y="212" text-anchor="middle" font-size="10" fill="#888">座位1</text>
  <text x="248" y="228" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <!-- couch 1 now paired -->
  <rect x="320" y="180" width="200" height="64" rx="8" fill="#f4faf6" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="420" y="174" text-anchor="middle" font-size="10" fill="#2e6e2e">沙发1：2 与 3 ✓ 情侣</text>
  <rect x="330" y="190" width="84" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="372" y="212" text-anchor="middle" font-size="10" fill="#888">座位2</text>
  <text x="372" y="228" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="426" y="190" width="84" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="468" y="212" text-anchor="middle" font-size="10" fill="#888">座位3</text>
  <text x="468" y="228" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>

  <!-- result note -->
  <rect x="540" y="188" width="196" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="638" y="208" text-anchor="middle" font-size="11" fill="#444">ans = 1，全部配对</text>
  <text x="638" y="224" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">一次交换同时修复两沙发</text>

  <!-- bottom note -->
  <rect x="40" y="268" width="680" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="290" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">观察：本例沙发0、沙发1 互相“错位” → 一个 2-环（cycle）</text>
  <text x="380" y="308" text-anchor="middle" font-size="11" fill="#666">2-环需要 1 次交换修复（环长 − 1）；并查集视角：n=2，连通分量=1，ans=2−1=1</text>
</svg>
