<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="16" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：只跟踪余数，不构造大数</text>
  <text x="280" y="48" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">以 k = 7 为例：R(L) 逐位增长，余数 r 始终只在 [0,6] 里打转</text>

  <!-- 行 1：全 1 数 R(L) -->
  <g filter="url(#rough2)">
    <text x="59" y="74" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">L=1</text>
    <text x="149" y="74" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">L=2</text>
    <text x="239" y="74" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">L=3</text>
    <text x="329" y="74" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">L=4</text>
    <text x="419" y="74" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">L=5</text>
    <text x="509" y="74" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">L=6</text>

    <rect x="22" y="80" width="74" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="112" y="80" width="74" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="202" y="80" width="74" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="292" y="80" width="74" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="382" y="80" width="74" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="472" y="80" width="74" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="59" y="100" text-anchor="middle" font-size="12" fill="#33506b">1</text>
    <text x="149" y="100" text-anchor="middle" font-size="12" fill="#33506b">11</text>
    <text x="239" y="100" text-anchor="middle" font-size="12" fill="#33506b">111</text>
    <text x="329" y="100" text-anchor="middle" font-size="11.5" fill="#33506b">1111</text>
    <text x="419" y="100" text-anchor="middle" font-size="11" fill="#33506b">11111</text>
    <text x="509" y="100" text-anchor="middle" font-size="10.5" fill="#33506b">111111</text>
  </g>

  <text x="540" y="140" text-anchor="end" font-size="11" fill="#b85450" filter="url(#rough2)">位数最坏近 10^5 位 → 构不出来!</text>

  <!-- 箭头：mod 7 -->
  <g filter="url(#rough2)" stroke="#7a8aa0" stroke-width="1.5" fill="none">
    <path d="M 59 114 L 59 184" marker-end="url(#arr)"/>
    <path d="M 149 114 L 149 184" marker-end="url(#arr)"/>
    <path d="M 239 114 L 239 184" marker-end="url(#arr)"/>
    <path d="M 329 114 L 329 184" marker-end="url(#arr)"/>
    <path d="M 419 114 L 419 184" marker-end="url(#arr)"/>
    <path d="M 509 114 L 509 184" marker-end="url(#arr)"/>
  </g>
  <text x="63" y="155" font-size="11" fill="#b85450" filter="url(#rough2)">mod 7</text>
  <text x="153" y="155" font-size="11" fill="#b85450" filter="url(#rough2)">mod 7</text>
  <text x="243" y="155" font-size="11" fill="#b85450" filter="url(#rough2)">mod 7</text>
  <text x="333" y="155" font-size="11" fill="#b85450" filter="url(#rough2)">mod 7</text>
  <text x="423" y="155" font-size="11" fill="#b85450" filter="url(#rough2)">mod 7</text>
  <text x="513" y="155" font-size="11" fill="#b85450" filter="url(#rough2)">mod 7</text>

  <!-- 行 2：余数 r -->
  <g filter="url(#rough2)">
    <rect x="22" y="190" width="74" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="112" y="190" width="74" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="202" y="190" width="74" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="292" y="190" width="74" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="382" y="190" width="74" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="472" y="190" width="74" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/>
    <text x="59" y="210" text-anchor="middle" font-size="13" fill="#8a6d1a">1</text>
    <text x="149" y="210" text-anchor="middle" font-size="13" fill="#8a6d1a">4</text>
    <text x="239" y="210" text-anchor="middle" font-size="13" fill="#8a6d1a">6</text>
    <text x="329" y="210" text-anchor="middle" font-size="13" fill="#8a6d1a">5</text>
    <text x="419" y="210" text-anchor="middle" font-size="13" fill="#8a6d1a">2</text>
    <text x="509" y="210" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold">0</text>
    <text x="509" y="240" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold">r=0 命中!</text>
    <text x="509" y="256" text-anchor="middle" font-size="11.5" fill="#2f5d24">返回 L = 6</text>
  </g>

  <!-- 递推公式 -->
  <g filter="url(#rough2)">
    <rect x="95" y="278" width="370" height="46" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="280" y="297" text-anchor="middle" font-size="14" fill="#8a6d1a" font-weight="bold">r ← (r × 10 + 1) mod k</text>
    <text x="280" y="316" text-anchor="middle" font-size="11" fill="#7a6a3a">整除判定只需余数为 0，与位数无关；r ∈ [0, k−1] 永不溢出</text>
  </g>

  <text x="280" y="354" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">⚠ 直接构造 R(L) 必溢出 / 超时，同余递推一步到位</text>
</svg>
