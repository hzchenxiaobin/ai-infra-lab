<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：lowLimit=1, highLimit=10 → ans=2</text>
  <text x="310" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">cnt[46] 全零，ans=0；球 1 与球 10 都落入盒子 1</text>

  <!-- Header row -->
  <rect x="30" y="54" width="560" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="70" y="73">球号 x</text>
    <text x="180" y="73">数位和 s</text>
    <text x="300" y="73">cnt[s]</text>
    <text x="420" y="73">ans</text>
    <text x="540" y="73">备注</text>
  </g>

  <!-- Row: x=1, s=1 -->
  <rect x="30" y="88" width="560" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#555" text-anchor="middle">
    <text x="70" y="106" font-weight="bold">1</text>
    <text x="180" y="106" font-weight="bold">1</text>
    <text x="300" y="106" font-weight="bold">cnt[1]=1</text>
    <text x="420" y="106" font-weight="bold">1</text>
    <text x="540" y="106" font-size="10" fill="#888">盒子 1 首球</text>
  </g>

  <!-- Row: x=2, s=2 -->
  <rect x="30" y="118" width="560" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#555" text-anchor="middle">
    <text x="70" y="136" font-weight="bold">2</text>
    <text x="180" y="136" font-weight="bold">2</text>
    <text x="300" y="136">cnt[2]=1</text>
    <text x="420" y="136" font-weight="bold">1</text>
    <text x="540" y="136" font-size="10" fill="#888">ans 不变</text>
  </g>

  <!-- Row: x=3, s=3 -->
  <rect x="30" y="148" width="560" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#555" text-anchor="middle">
    <text x="70" y="166" font-weight="bold">3</text>
    <text x="180" y="166" font-weight="bold">3</text>
    <text x="300" y="166">cnt[3]=1</text>
    <text x="420" y="166" font-weight="bold">1</text>
    <text x="540" y="166" font-size="10" fill="#888">ans 不变</text>
  </g>

  <!-- Row: x=4, s=4 -->
  <rect x="30" y="178" width="560" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#555" text-anchor="middle">
    <text x="70" y="196" font-weight="bold">4</text>
    <text x="180" y="196" font-weight="bold">4</text>
    <text x="300" y="196">cnt[4]=1</text>
    <text x="420" y="196" font-weight="bold">1</text>
    <text x="540" y="196" font-size="10" fill="#888">ans 不变</text>
  </g>

  <!-- Row: x=5, s=5 -->
  <rect x="30" y="208" width="560" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#555" text-anchor="middle">
    <text x="70" y="226" font-weight="bold">5</text>
    <text x="180" y="226" font-weight="bold">5</text>
    <text x="300" y="226">cnt[5]=1</text>
    <text x="420" y="226" font-weight="bold">1</text>
    <text x="540" y="226" font-size="10" fill="#888">ans 不变</text>
  </g>

  <!-- Row: x=6, s=6 -->
  <rect x="30" y="238" width="560" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#555" text-anchor="middle">
    <text x="70" y="256" font-weight="bold">6</text>
    <text x="180" y="256" font-weight="bold">6</text>
    <text x="300" y="256">cnt[6]=1</text>
    <text x="420" y="256" font-weight="bold">1</text>
    <text x="540" y="256" font-size="10" fill="#888">ans 不变</text>
  </g>

  <!-- Row: x=7, s=7 -->
  <rect x="30" y="268" width="560" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#555" text-anchor="middle">
    <text x="70" y="286" font-weight="bold">7</text>
    <text x="180" y="286" font-weight="bold">7</text>
    <text x="300" y="286">cnt[7]=1</text>
    <text x="420" y="286" font-weight="bold">1</text>
    <text x="540" y="286" font-size="10" fill="#888">ans 不变</text>
  </g>

  <!-- Row: x=8, s=8 -->
  <rect x="30" y="298" width="560" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#555" text-anchor="middle">
    <text x="70" y="316" font-weight="bold">8</text>
    <text x="180" y="316" font-weight="bold">8</text>
    <text x="300" y="316">cnt[8]=1</text>
    <text x="420" y="316" font-weight="bold">1</text>
    <text x="540" y="316" font-size="10" fill="#888">ans 不变</text>
  </g>

  <!-- Row: x=9, s=9 -->
  <rect x="30" y="328" width="560" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#555" text-anchor="middle">
    <text x="70" y="346" font-weight="bold">9</text>
    <text x="180" y="346" font-weight="bold">9</text>
    <text x="300" y="346">cnt[9]=1</text>
    <text x="420" y="346" font-weight="bold">1</text>
    <text x="540" y="346" font-size="10" fill="#888">ans 不变</text>
  </g>

  <!-- Row: x=10, s=1  HIGHLIGHTED (ans updates!) -->
  <rect x="30" y="358" width="560" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="70" y="376" fill="#333" font-weight="bold">10</text>
    <text x="180" y="376" fill="#d6a040" font-weight="bold">1+0=1</text>
    <text x="300" y="376" fill="#4a7a3a" font-weight="bold">cnt[1]=2</text>
    <text x="420" y="376" fill="#4a7a3a" font-weight="bold">2 ←</text>
    <text x="540" y="376" font-size="10" fill="#4a7a3a" font-weight="bold">ans 更新！</text>
  </g>

  <!-- Result arrow + box -->
  <path d="M 420 390 L 420 398" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="300" y="402" width="240" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="420" y="423" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans = 2 ✓</text>
</svg>
