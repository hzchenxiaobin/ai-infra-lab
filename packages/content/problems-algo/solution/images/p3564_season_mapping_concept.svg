<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="450" fill="#fafafa"/>

  <text x="330" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：季节是「月份环」上的映射，三级平局是一个排序元组</text>

  <!-- ===== Left panel: month ring ===== -->
  <rect x="16" y="42" width="306" height="304" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="169" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① 月份 → 季节：只看 MONTH(sale_date)</text>
  <text x="169" y="75" text-anchor="middle" font-size="8.5" fill="#666">12 与 1 首尾相接——季节是月份环，不是年份段</text>

  <circle cx="169" cy="200" r="85" fill="none" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- Winter chips (blue, emphasized) -->
  <rect x="156" y="105" width="26" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="169" y="119" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">12</text>
  <rect x="198" y="116" width="26" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="211" y="130" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">1</text>
  <rect x="230" y="148" width="26" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="243" y="162" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">2</text>
  <!-- Spring chips (green) -->
  <rect x="241" y="190" width="26" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="254" y="204" text-anchor="middle" font-size="10" fill="#4a7a3a">3</text>
  <rect x="230" y="233" width="26" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="243" y="247" text-anchor="middle" font-size="10" fill="#4a7a3a">4</text>
  <rect x="198" y="264" width="26" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="211" y="278" text-anchor="middle" font-size="10" fill="#4a7a3a">5</text>
  <!-- Summer chips (orange) -->
  <rect x="156" y="275" width="26" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="169" y="289" text-anchor="middle" font-size="10" fill="#d6a040">6</text>
  <rect x="114" y="264" width="26" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="127" y="278" text-anchor="middle" font-size="10" fill="#d6a040">7</text>
  <rect x="82" y="233" width="26" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="95" y="247" text-anchor="middle" font-size="10" fill="#d6a040">8</text>
  <!-- Fall chips (red) -->
  <rect x="71" y="190" width="26" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="84" y="204" text-anchor="middle" font-size="10" fill="#b85450">9</text>
  <rect x="82" y="148" width="26" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="95" y="162" text-anchor="middle" font-size="10" fill="#b85450">10</text>
  <rect x="114" y="116" width="26" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="127" y="130" text-anchor="middle" font-size="10" fill="#b85450">11</text>

  <text x="169" y="97" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">Winter 冬</text>
  <text x="293" y="203" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">Spring 春</text>
  <text x="169" y="309" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">Summer 夏</text>
  <text x="47" y="203" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">Fall 秋</text>

  <!-- Center: cross-year example -->
  <text x="169" y="160" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">跨年冬季实例：</text>
  <rect x="119" y="170" width="100" height="20" fill="#fff" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="169" y="184" text-anchor="middle" font-size="8.5" fill="#333">2023-12-05（12月）</text>
  <rect x="119" y="196" width="100" height="20" fill="#fff" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="169" y="210" text-anchor="middle" font-size="8.5" fill="#333">2024-02-14（2月）</text>
  <path d="M 219 180 C 238 170, 232 145, 208 128" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 219 206 C 242 204, 252 188, 245 172" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="169" y="240" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">同属一个 Winter 桶！</text>
  <text x="169" y="256" text-anchor="middle" font-size="8.5" fill="#666">MONTH 相同 ⇒ 季节相同</text>

  <text x="169" y="330" text-anchor="middle" font-size="8.5" fill="#b85450">✗ 分组键若混入 YEAR()：冬季被拦腰拆成 2023 / 2024 两半</text>

  <!-- ===== Right panel: tie-break tuple ===== -->
  <rect x="338" y="42" width="306" height="304" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="491" y="60" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">② 三级平局规则 = 一个排序元组</text>
  <text x="491" y="75" text-anchor="middle" font-size="8.5" fill="#666">逐键比较、先到先决（字典序比较的本义）</text>

  <rect x="376" y="88" width="230" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="491" y="104" text-anchor="middle" font-size="9.5" fill="#446688">① total_quantity DESC（总销量）</text>
  <path d="M 491 112 L 491 122" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="527" y="121" font-size="8" fill="#999">平局？</text>
  <rect x="376" y="126" width="230" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="491" y="142" text-anchor="middle" font-size="9.5" fill="#4a7a3a">② total_revenue DESC（总收入）</text>
  <path d="M 491 150 L 491 160" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="531" y="159" font-size="8" fill="#999">仍平局？</text>
  <rect x="376" y="164" width="230" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="491" y="180" text-anchor="middle" font-size="9.5" fill="#b85450">③ category ASC（字典序兜底）</text>

  <text x="491" y="210" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">夏季平局实例：Fitness vs Tech</text>
  <rect x="352" y="218" width="130" height="58" fill="#fff" stroke="#999" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="417" y="236" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">Fitness</text>
  <text x="417" y="252" text-anchor="middle" font-size="9" fill="#666">总销量 5 件</text>
  <text x="417" y="268" text-anchor="middle" font-size="9" fill="#666">总收入 $60.00</text>
  <text x="491" y="252" text-anchor="middle" font-size="11" fill="#999" font-weight="bold" font-style="italic">vs</text>
  <rect x="500" y="218" width="130" height="58" fill="#fff8e1" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="565" y="236" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">Tech</text>
  <text x="565" y="252" text-anchor="middle" font-size="9" fill="#666">总销量 5 件</text>
  <text x="565" y="268" text-anchor="middle" font-size="9" fill="#666">总收入 $100.00</text>
  <polygon points="553,214 556,204 561,211 565,201 569,211 574,204 577,214" fill="#d6a040" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>

  <text x="491" y="296" text-anchor="middle" font-size="9" fill="#666">① 总量：5 = 5 → 打平，轮到下一键</text>
  <text x="491" y="314" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">② 收入：$100 &gt; $60 → Tech 夺冠 ✓</text>
  <text x="491" y="332" text-anchor="middle" font-size="9" fill="#999">③ 字典序：根本轮不到出场</text>

  <!-- ===== Bottom strip ===== -->
  <rect x="16" y="356" width="628" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="330" y="378" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">③ ROW_NUMBER() OVER (PARTITION BY season ORDER BY 总量 DESC, 收入 DESC, 类别 ASC)</text>
  <text x="330" y="398" text-anchor="middle" font-size="9.5" fill="#333">WHERE rn = 1 —— 每季恰好一行冠军；末句 ORDER BY season</text>
  <text x="330" y="418" text-anchor="middle" font-size="9" fill="#b85450">季节升序 = 英文名字典序：Fall → Spring → Summer → Winter（不是日历序！）</text>
</svg>
