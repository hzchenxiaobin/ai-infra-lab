<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 518"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="518" fill="#fafafa"/>
  <text x="280" y="22" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：4 个方向各扫一遍，边扫边更新答案</text>

  <g filter="url(#rough2)">
    <ellipse cx="240" cy="46" rx="58" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="240" y="51" text-anchor="middle" font-size="11" fill="#33506b">开始：读入 s, k</text>
    <path d="M 240 64 L 240 72" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)"/>

    <rect x="115" y="74" width="250" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="240" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#33506b">for 每个符号方向 (sx, sy)，共 4 个</text>
    <text x="240" y="108" text-anchor="middle" font-size="10" fill="#55677d">(+,+)、(+,−)、(−,+)、(−,−)</text>
    <path d="M 240 116 L 240 124" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)"/>

    <rect x="115" y="126" width="250" height="26" fill="#ffffff" stroke="#9db4c9" stroke-width="1.5" rx="6"/>
    <text x="240" y="143" text-anchor="middle" font-size="10.5" fill="#333">good = bad = 0</text>
    <path d="M 240 152 L 240 160" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)"/>

    <rect x="115" y="162" width="250" height="42" fill="#ffffff" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="240" y="180" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333">取下一字符 c，算贡献 v（±1）</text>
    <text x="240" y="196" text-anchor="middle" font-size="9.5" fill="#55677d">E:+sx　W:−sx　N:+sy　S:−sy</text>
    <path d="M 240 204 L 240 212" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)"/>
  </g>

  <!-- 判定 v>0? -->
  <g filter="url(#rough2)">
    <polygon points="240,214 302,244 240,274 178,244" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="240" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6d1f">v &gt; 0 ?</text>
    <text x="316" y="234" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#4a7a3a">是</text>
    <path d="M 302 244 L 330 244" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)"/>
    <rect x="332" y="230" width="66" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="365" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24">good++</text>
    <text x="166" y="234" text-anchor="end" font-size="9.5" font-weight="bold" fill="#b85450">否</text>
    <path d="M 178 244 L 150 244" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)"/>
    <rect x="82" y="230" width="66" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6"/>
    <text x="115" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#8f3a35">bad++</text>
  </g>

  <!-- 更新答案 -->
  <g filter="url(#rough2)">
    <path d="M 240 274 L 240 290" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)"/>
    <path d="M 365 258 Q 365 276 352 290" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)"/>
    <path d="M 115 258 Q 115 276 128 290" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)"/>
    <rect x="95" y="292" width="290" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8"/>
    <text x="240" y="314" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">ans = max(ans, good − bad + 2·min(k, bad))</text>
    <path d="M 240 328 L 240 338" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)"/>
  </g>

  <!-- 字符循环判定 -->
  <g filter="url(#rough2)">
    <polygon points="240,340 296,370 240,400 184,370" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="240" y="374" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#33506b">字符扫完？</text>
    <path d="M 296 370 L 452 370 L 452 183 L 371 183" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)"/>
    <text x="376" y="362" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b85450">否，下一字符</text>
    <path d="M 240 400 L 240 408" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)"/>
    <text x="250" y="409" font-size="9.5" font-weight="bold" fill="#4a7a3a">是</text>
  </g>

  <!-- 方向循环判定 -->
  <g filter="url(#rough2)">
    <polygon points="240,410 298,438 240,466 182,438" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="240" y="442" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f5d24">4 个方向都扫完？</text>
    <path d="M 182 438 L 40 438 L 40 95 L 111 95" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="110" y="430" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#4a7a3a">否，换下一方向</text>
    <path d="M 240 466 L 240 474" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)"/>
    <text x="250" y="473" font-size="9.5" font-weight="bold" fill="#4a7a3a">是</text>
  </g>

  <!-- 输出 -->
  <g filter="url(#rough2)">
    <ellipse cx="240" cy="494" rx="52" ry="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="240" y="499" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24">输出 ans</text>
  </g>

  <!-- 右上注释 -->
  <g filter="url(#rough2)">
    <rect x="402" y="72" width="142" height="40" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5 3" rx="8"/>
    <text x="473" y="88" text-anchor="middle" font-size="9.5" fill="#2f5d24">整体 O(4n) = O(n)</text>
    <text x="473" y="103" text-anchor="middle" font-size="9.5" fill="#2f5d24">仅 3 个计数，O(1) 空间</text>
  </g>
</svg>
