<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="350" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">前缀和：任意子串的映射值之和 O(1) 取得</text>

  <!-- 子串范围标注：sdf -->
  <path d="M 196 44 L 196 50 M 196 47 L 408 47 M 408 44 L 408 50" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="302" y="40" text-anchor="middle" font-size="11.5" fill="#d6a040">子串 s[1..3] = "sdf"，长度 3</text>

  <!-- 字符行 -->
  <rect x="118" y="54" width="56" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="146" y="76" text-anchor="middle" font-size="14" fill="#333">a</text>
  <rect x="196" y="54" width="56" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="224" y="76" text-anchor="middle" font-size="14" fill="#333">s</text>
  <rect x="274" y="54" width="56" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="302" y="76" text-anchor="middle" font-size="14" fill="#333">d</text>
  <rect x="352" y="54" width="56" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="380" y="76" text-anchor="middle" font-size="14" fill="#333">f</text>

  <!-- 映射值行 -->
  <path d="M 146 88 L 146 98" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <path d="M 224 88 L 224 98" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <path d="M 302 88 L 302 98" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <path d="M 380 88 L 380 98" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <text x="436" y="88" text-anchor="middle" font-size="11" fill="#888">val()</text>

  <rect x="118" y="102" width="56" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="146" y="122" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="196" y="102" width="56" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="224" y="122" text-anchor="middle" font-size="13" fill="#333">7</text>
  <rect x="274" y="102" width="56" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="302" y="122" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="352" y="102" width="56" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="380" y="122" text-anchor="middle" font-size="13" fill="#333">3</text>

  <!-- 前缀和行：pre[i] 对齐在第 i 个字符左缘 -->
  <path d="M 146 132 L 146 160" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <text x="436" y="150" text-anchor="middle" font-size="11" fill="#888">前缀和</text>

  <rect x="95" y="164" width="46" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="118" y="185" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="173" y="164" width="46" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="196" y="185" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="251" y="164" width="46" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="274" y="185" text-anchor="middle" font-size="13" fill="#333">8</text>
  <rect x="329" y="164" width="46" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="352" y="185" text-anchor="middle" font-size="13" fill="#333">10</text>
  <rect x="385" y="164" width="46" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="408" y="185" text-anchor="middle" font-size="13" fill="#333">13</text>

  <text x="118" y="214" text-anchor="middle" font-size="10.5" fill="#888">pre[0]</text>
  <text x="196" y="214" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">pre[1]</text>
  <text x="274" y="214" text-anchor="middle" font-size="10.5" fill="#888">pre[2]</text>
  <text x="352" y="214" text-anchor="middle" font-size="10.5" fill="#888">pre[3]</text>
  <text x="408" y="214" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">pre[4]</text>

  <!-- 相减箭头 -->
  <path d="M 196 218 C 210 240 260 240 286 238" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrg)"/>
  <path d="M 408 218 C 390 244 330 244 300 238" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrg)"/>

  <text x="280" y="262" text-anchor="middle" font-size="13" fill="#333">"sdf" 的和 = pre[4] − pre[1] = 13 − 1 = <tspan fill="#b85450" font-weight="bold">12</tspan></text>
  <text x="280" y="286" text-anchor="middle" font-size="13" fill="#333">判定：12 % 3 == 0 → <tspan fill="#4a7a3a" font-weight="bold">✓ 可整除</tspan></text>

  <rect x="80" y="302" width="400" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="12.5" fill="#333">子串 word[i..j]：和 = pre[j+1] − pre[i]，判定 (和) % (j−i+1) == 0</text>
</svg>
