<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">
    示例演算：[123,[456,[789]]] 的栈状态演化
  </text>

  <!-- ===== Row 1 ===== -->
  <!-- Frame 1 -->
  <text x="95" y="56" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">① 读 '['</text>
  <rect x="50" y="66" width="90" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="82" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">L0</text>
  <text x="95" y="98" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">= [ ]</text>
  <text x="95" y="120" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">压入空列表</text>

  <!-- Frame 2 -->
  <text x="280" y="56" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">② 读 '123,'</text>
  <rect x="235" y="66" width="90" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="82" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">L0</text>
  <text x="280" y="98" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">= [123]</text>
  <text x="280" y="120" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">数字提交到栈顶</text>

  <!-- Frame 3 -->
  <text x="465" y="56" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">③ 读 '['</text>
  <rect x="420" y="66" width="90" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="465" y="80" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">L1 = [ ]</text>
  <text x="478" y="98" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">↑栈顶</text>
  <rect x="420" y="104" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="465" y="118" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">L0 = [123]</text>
  <text x="465" y="150" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">下钻子层</text>

  <!-- arrows row 1 -->
  <line x1="140" y1="86" x2="232" y2="86" stroke="#446688" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="325" y1="86" x2="417" y2="86" stroke="#446688" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- separator -->
  <line x1="30" y1="168" x2="530" y2="168" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Row 2 ===== -->
  <!-- Frame 4 -->
  <text x="95" y="190" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">④ '789]' 弹栈挂回</text>
  <rect x="35" y="200" width="120" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="214" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold" filter="url(#rough2)">L1 = [456,[789]]</text>
  <text x="108" y="228" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">↑L2 弹回挂入</text>
  <rect x="35" y="238" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="252" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">L0 = [123]</text>
  <text x="95" y="284" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">L2 建完→弹栈挂回 L1</text>

  <!-- Frame 5 -->
  <text x="280" y="190" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">⑤ ']' 弹栈挂回</text>
  <rect x="210" y="200" width="140" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="216" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">L0</text>
  <text x="280" y="232" text-anchor="middle" font-size="8" fill="#555" filter="url(#rough2)">= [123,[456,[789]]]</text>
  <text x="280" y="284" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">L1 建完→弹栈挂回 L0</text>

  <!-- Frame 6 -->
  <text x="465" y="190" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">⑥ ']' 弹栈</text>
  <rect x="410" y="200" width="110" height="44" fill="none" stroke="#b85450" stroke-width="1.5"
        stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="465" y="218" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">栈空</text>
  <text x="465" y="234" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">top = L0</text>
  <text x="465" y="284" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回根列表 ✓</text>

  <!-- arrows row 2 -->
  <line x1="155" y1="220" x2="207" y2="220" stroke="#446688" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="350" y1="220" x2="407" y2="220" stroke="#446688" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- cross arrow frame3 -> frame4 -->
  <path d="M 465 158 C 465 178, 95 175, 95 186" stroke="#446688" stroke-width="1"
        stroke-dasharray="3,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Legend -->
  <rect x="40" y="316" width="16" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="62" y="327" font-size="10" fill="#555" filter="url(#rough2)">L0 外层</text>
  <rect x="140" y="316" width="16" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="162" y="327" font-size="10" fill="#555" filter="url(#rough2)">L1 中层</text>
  <rect x="240" y="316" width="16" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="262" y="327" font-size="10" fill="#555" filter="url(#rough2)">L2 内层</text>
  <text x="340" y="327" font-size="10" fill="#555" filter="url(#rough2)">栈顶在上，压栈↓ / 弹栈↑挂回父级</text>

  <!-- stack-top indicator -->
  <text x="20" y="86" font-size="8" fill="#b85450" filter="url(#rough2)">栈顶→</text>
  <text x="20" y="220" font-size="8" fill="#b85450" filter="url(#rough2)">栈顶→</text>
</svg>
