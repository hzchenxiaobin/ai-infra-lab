<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">垂序遍历：(col, row, val) 字典序 = 所求顺序</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">同行同列按 val 升序（与 314 的「左右顺序」截然不同）</text>

  <!-- col 0 highlight band -->
  <rect x="252" y="52" width="56" height="246" fill="#fff8e1" opacity="0.55" filter="url(#rough2)"/>

  <!-- vertical column lines -->
  <line x1="130" y1="52" x2="130" y2="298" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <line x1="200" y1="52" x2="200" y2="298" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <line x1="280" y1="52" x2="280" y2="298" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <line x1="360" y1="52" x2="360" y2="298" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <line x1="430" y1="52" x2="430" y2="298" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- column labels -->
  <text x="130" y="308" text-anchor="middle" font-size="10" fill="#888">col −2</text>
  <text x="200" y="308" text-anchor="middle" font-size="10" fill="#888">col −1</text>
  <text x="280" y="308" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">col 0</text>
  <text x="360" y="308" text-anchor="middle" font-size="10" fill="#888">col 1</text>
  <text x="430" y="308" text-anchor="middle" font-size="10" fill="#888">col 2</text>

  <!-- tree edges -->
  <line x1="280" y1="75" x2="200" y2="140" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="280" y1="75" x2="360" y2="140" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="200" y1="140" x2="130" y2="205" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="200" y1="140" x2="250" y2="205" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="360" y1="140" x2="310" y2="205" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="360" y1="140" x2="430" y2="205" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- node 1 (0,0) -->
  <circle cx="280" cy="75" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="280" y="60" text-anchor="middle" font-size="9" fill="#888">(0,0)</text>

  <!-- node 2 (1,-1) -->
  <circle cx="200" cy="140" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="145" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <text x="200" y="125" text-anchor="middle" font-size="9" fill="#888">(1,−1)</text>

  <!-- node 3 (1,1) -->
  <circle cx="360" cy="140" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="145" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <text x="360" y="125" text-anchor="middle" font-size="9" fill="#888">(1,1)</text>

  <!-- node 4 (2,-2) -->
  <circle cx="130" cy="205" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="130" y="210" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <text x="130" y="190" text-anchor="middle" font-size="9" fill="#888">(2,−2)</text>

  <!-- node 5 (2,0) highlighted -->
  <circle cx="250" cy="205" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="250" y="210" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">5</text>
  <text x="250" y="190" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">(2,0)</text>

  <!-- node 6 (2,0) highlighted -->
  <circle cx="310" cy="205" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="310" y="210" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">6</text>
  <text x="310" y="190" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">(2,0)</text>

  <!-- node 7 (2,2) -->
  <circle cx="430" cy="205" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="210" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
  <text x="430" y="190" text-anchor="middle" font-size="9" fill="#888">(2,2)</text>

  <!-- column buckets -->
  <text x="280" y="332" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">各列输出</text>

  <rect x="108" y="340" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="359" text-anchor="middle" font-size="11" fill="#333">[4]</text>

  <rect x="178" y="340" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="359" text-anchor="middle" font-size="11" fill="#333">[2]</text>

  <rect x="238" y="340" width="84" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="359" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">[1,5,6]</text>

  <rect x="338" y="340" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="359" text-anchor="middle" font-size="11" fill="#333">[3]</text>

  <rect x="408" y="340" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="359" text-anchor="middle" font-size="11" fill="#333">[7]</text>

  <!-- callout -->
  <rect x="40" y="384" width="480" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="404" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">5 和 6 都在 (2,0) → 按 val 升序排 [5,6]</text>
  <text x="280" y="420" text-anchor="middle" font-size="10" fill="#888">即使交换 5/6 在树中的位置，输出仍为 [1,5,6]（见示例 3）</text>
</svg>
