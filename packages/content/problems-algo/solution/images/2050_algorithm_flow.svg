<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="10" markerHeight="10" refX="5" refY="9" orient="auto">
      <path d="M0,0 L5,9 L10,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：Kahn 拓扑排序 + DP 松弛</text>

  <!-- ===== Step 1: Build graph ===== -->
  <rect x="70" y="44" width="420" height="74" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">Step 1：建图 + 入度表 + 初始化 dist</text>
  <text x="86" y="86" font-size="11.5" fill="#555" font-family="'Comic Sans MS', monospace">for [u, v] in relations: adj[u].push(v); indeg[v]++</text>
  <text x="86" y="104" font-size="11.5" fill="#555" font-family="'Comic Sans MS', monospace">dist[v] = time[v]   （每门课自身耗时作为初值）</text>

  <!-- Arrow down -->
  <path d="M 280 120 L 280 144" stroke="#888" stroke-width="2.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- ===== Step 2: Init queue ===== -->
  <rect x="100" y="150" width="360" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="172" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">Step 2：入队所有入度为 0 的课程</text>
  <text x="280" y="192" text-anchor="middle" font-size="11" fill="#888" font-family="'Comic Sans MS', monospace">for v in 1..n: if indeg[v]==0: q.push(v)</text>

  <!-- Arrow down -->
  <path d="M 280 208 L 280 232" stroke="#888" stroke-width="2.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- ===== Step 3: BFS topo ===== -->
  <rect x="70" y="238" width="420" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="260" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">Step 3：BFS 拓扑序松弛</text>
  <text x="96" y="282" font-size="11.5" fill="#555" font-family="'Comic Sans MS', monospace">while !q.empty():</text>
  <text x="116" y="300" font-size="11.5" fill="#555" font-family="'Comic Sans MS', monospace">u = q.pop();</text>
  <text x="116" y="318" font-size="11.5" fill="#4a7a3a" font-family="'Comic Sans MS', monospace">for v in adj[u]:</text>
  <text x="136" y="336" font-size="11.5" fill="#b85450" font-family="'Comic Sans MS', monospace">dist[v] = max(dist[v], dist[u] + time[v])</text>
  <text x="136" y="354" font-size="11.5" fill="#4a7a3a" font-family="'Comic Sans MS', monospace">if --indeg[v]==0: q.push(v)</text>

  <!-- Arrow down -->
  <path d="M 280 360 L 280 384" stroke="#888" stroke-width="2.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Answer -->
  <rect x="120" y="388" width="320" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="406" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">Step 4：返回 max(dist[v])</text>
  <text x="280" y="422" text-anchor="middle" font-size="10.5" fill="#888">所有课程最早完成时间的最大值 = 关键路径长度</text>
</svg>
