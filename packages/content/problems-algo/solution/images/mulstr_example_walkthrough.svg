<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="320" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：123 × 456，res 数组逐阶段累加</text>

  <!-- index ruler (above row 1) -->
  <text x="210" y="50" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="250" y="50" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="290" y="50" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="330" y="50" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="370" y="50" text-anchor="middle" font-size="9" fill="#888">4</text>
  <text x="410" y="50" text-anchor="middle" font-size="9" fill="#888">5</text>

  <!-- Phase 1 -->
  <text x="24" y="72" font-size="11" fill="#444" font-weight="bold">① i=2 (digit 3)</text>
  <text x="24" y="88" font-size="11" fill="#666">3 × 456 = 1368</text>
  <rect x="190" y="58" width="40" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="82" text-anchor="middle" font-size="14" fill="#bbb">0</text>
  <rect x="230" y="58" width="40" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="82" text-anchor="middle" font-size="14" fill="#bbb">0</text>
  <rect x="270" y="58" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="82" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="310" y="58" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="82" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="350" y="58" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="82" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>
  <rect x="390" y="58" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="82" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">8</text>
  <text x="540" y="82" text-anchor="middle" font-size="11" fill="#888">= 001368</text>

  <text x="300" y="114" text-anchor="middle" font-size="16" fill="#888" font-weight="bold">+</text>

  <!-- Phase 2 -->
  <text x="24" y="142" font-size="11" fill="#444" font-weight="bold">② i=1 (digit 2)</text>
  <text x="24" y="158" font-size="11" fill="#666">20 × 456 = 9120</text>
  <rect x="190" y="128" width="40" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="152" text-anchor="middle" font-size="14" fill="#bbb">0</text>
  <rect x="230" y="128" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="152" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="270" y="128" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="152" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="310" y="128" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="152" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <rect x="350" y="128" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="152" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">8</text>
  <rect x="390" y="128" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="152" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">8</text>
  <text x="540" y="152" text-anchor="middle" font-size="11" fill="#888">= 010488</text>

  <text x="300" y="184" text-anchor="middle" font-size="16" fill="#888" font-weight="bold">+</text>

  <!-- Phase 3 -->
  <text x="24" y="212" font-size="11" fill="#444" font-weight="bold">③ i=0 (digit 1)</text>
  <text x="24" y="228" font-size="11" fill="#666">100 × 456 = 45600</text>
  <rect x="190" y="198" width="40" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="210" y="222" text-anchor="middle" font-size="14" fill="#bbb">0</text>
  <rect x="230" y="198" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="222" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <rect x="270" y="198" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="222" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>
  <rect x="310" y="198" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="222" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="350" y="198" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="222" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">8</text>
  <rect x="390" y="198" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="222" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">8</text>
  <text x="540" y="222" text-anchor="middle" font-size="11" fill="#888">= 056088</text>

  <text x="300" y="254" text-anchor="middle" font-size="16" fill="#888" font-weight="bold">=</text>

  <!-- Final result -->
  <rect x="220" y="264" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="320" y="291" text-anchor="middle" font-size="20" fill="#333" font-weight="bold">56088</text>
  <text x="470" y="289" font-size="11" fill="#b85450">跳过前导 0 → 56088 ✓</text>
</svg>
