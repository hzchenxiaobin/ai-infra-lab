<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="5" orient="auto">
      <path d="M0,0 L6,5 L0,10 Z" fill="#555"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：从右向左滚动更新 dp 表，表尾端点减 i 加 1 即答案</text>

  <!-- Step 1 -->
  <rect x="60" y="40" width="400" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="76" y="62" font-size="12" fill="#446688" font-weight="bold">0. 逆序遍历</text>
  <text x="76" y="77" font-size="11" fill="#555">i = n−1 → 0；维护滚动表 cur（值递增、端点递增，规模 ≤ 30）</text>

  <!-- arrow -->
  <path d="M260 88 L260 100" stroke="#555" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="60" y="104" width="400" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="76" y="126" font-size="12" fill="#4a7a3a" font-weight="bold">① 整体或上 nums[i]</text>
  <text x="76" y="141" font-size="11" fill="#555">cur 每项 v_t → v_t | nums[i]（端点 j_t 不变）</text>

  <path d="M260 152 L260 164" stroke="#555" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="60" y="168" width="400" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="76" y="190" font-size="12" fill="#4a7a3a" font-weight="bold">② 表头前置自身</text>
  <text x="76" y="205" font-size="11" fill="#555">新表 nxt 先放 (nums[i], i)（长度为 1 的子数组）</text>

  <path d="M260 216 L260 228" stroke="#555" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4 -->
  <rect x="60" y="232" width="400" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="76" y="254" font-size="12" fill="#d6a040" font-weight="bold">③ 合并相邻等值（保留更早端点）</text>
  <text x="76" y="269" font-size="11" fill="#555">val == nxt 末值则跳过后继 ⟹ 值严格递增、端点严格递增</text>

  <path d="M260 280 L260 292" stroke="#555" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5 -->
  <rect x="60" y="296" width="400" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="76" y="318" font-size="12" fill="#b85450" font-weight="bold">④ 取表尾</text>
  <text x="76" y="333" font-size="11" fill="#555">表尾 = 后缀或；answer[i] = 表尾端点 − i + 1</text>
</svg>
