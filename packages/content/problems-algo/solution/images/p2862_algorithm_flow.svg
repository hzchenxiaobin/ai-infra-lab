<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：枚举组核 k，累加下标 k·m² 上的元素</text>

  <!-- 开始 -->
  <ellipse cx="280" cy="52" rx="60" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="57" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans = 0</text>

  <line x1="280" y1="70" x2="280" y2="82" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 枚举 k -->
  <rect x="175" y="84" width="210" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="105" text-anchor="middle" font-size="12" fill="#333">枚举组核 k = 1 … n</text>

  <line x1="280" y1="116" x2="280" y2="128" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 内层初始化 -->
  <rect x="175" y="130" width="210" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="151" text-anchor="middle" font-size="12" fill="#333">sum = 0，m = 1</text>

  <line x1="280" y1="162" x2="280" y2="174" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="280,176 372,230 280,284 188,230" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="235" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">k·m² ≤ n ?</text>

  <text x="384" y="222" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <line x1="372" y1="230" x2="392" y2="230" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 内层循环体 -->
  <rect x="394" y="212" width="148" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="468" y="234" text-anchor="middle" font-size="11.5" fill="#333">sum += nums[k·m²−1]</text>

  <line x1="468" y1="248" x2="468" y2="262" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="394" y="264" width="148" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="468" y="285" text-anchor="middle" font-size="12" fill="#333">m ← m+1</text>

  <!-- 内层回路 -->
  <path d="M 542 280 H 554 V 203 H 332" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 否分支 -->
  <text x="290" y="300" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <line x1="280" y1="284" x2="280" y2="298" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 更新 ans -->
  <rect x="175" y="300" width="210" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="321" text-anchor="middle" font-size="12" fill="#333">ans = max(ans, sum)</text>

  <!-- 外层回路 -->
  <path d="M 175 316 H 116 V 100 H 171" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="106" y="196" text-anchor="end" font-size="10.5" fill="#666">k+1 ≤ n</text>
  <text x="106" y="212" text-anchor="end" font-size="10.5" fill="#666">则 k++ 继续</text>

  <line x1="280" y1="332" x2="280" y2="346" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 结束 -->
  <ellipse cx="280" cy="366" rx="60" ry="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="371" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 ans</text>

  <!-- 底部说明 -->
  <rect x="30" y="392" width="500" height="24" fill="#ffffff" stroke="#aaa" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="280" y="409" text-anchor="middle" font-size="11" fill="#666">内层总步数 Σ⌊√(n/k)⌋ ≈ 2n ⟹ 时间 O(n)，额外空间 O(1)</text>
</svg>
