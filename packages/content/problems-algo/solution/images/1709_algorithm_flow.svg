<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：排序 → LEAD(默认=今天) → DATEDIFF → MAX</text>

  <!-- ===== Row 1 ===== -->
  <!-- Box 1: FROM -->
  <rect x="24" y="64" width="150" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="99" y="86" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① FROM UserVisits</text>
  <text x="99" y="104" text-anchor="middle" font-size="9" fill="#666">读取访问记录</text>

  <!-- arrow -->
  <path d="M 174 92 L 200 92" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 2: PARTITION + ORDER -->
  <rect x="204" y="64" width="172" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="290" y="84" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">② PARTITION BY user_id</text>
  <text x="290" y="98" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">ORDER BY visit_date</text>
  <text x="290" y="112" text-anchor="middle" font-size="9" fill="#666">按用户分组排序</text>

  <!-- arrow -->
  <path d="M 376 92 L 402 92" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 3: LEAD -->
  <rect x="406" y="64" width="150" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="481" y="84" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">③ LEAD(visit_date,</text>
  <text x="481" y="98" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">1, '2021-01-01')</text>
  <text x="481" y="112" text-anchor="middle" font-size="9" fill="#666">取下一行 / 末行用今天</text>

  <!-- connector down from Box3 to Box4 -->
  <path d="M 481 120 L 481 144 L 99 144 L 99 168" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Row 2 ===== -->
  <!-- Box 4: DATEDIFF -->
  <rect x="24" y="172" width="150" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="99" y="194" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">④ DATEDIFF</text>
  <text x="99" y="210" text-anchor="middle" font-size="9" fill="#666">(next_visit, visit_date)</text>
  <text x="99" y="222" text-anchor="middle" font-size="9" fill="#666">算空档天数</text>

  <!-- arrow -->
  <path d="M 174 200 L 200 200" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 5: MAX GROUP BY -->
  <rect x="204" y="172" width="172" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="290" y="194" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">⑤ MAX(window)</text>
  <text x="290" y="210" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">GROUP BY user_id</text>
  <text x="290" y="222" text-anchor="middle" font-size="9" fill="#666">每用户取最大空档</text>

  <!-- arrow -->
  <path d="M 376 200 L 402 200" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 6: ORDER BY -->
  <rect x="406" y="172" width="150" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="481" y="194" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⑥ ORDER BY</text>
  <text x="481" y="210" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">user_id</text>
  <text x="481" y="222" text-anchor="middle" font-size="9" fill="#666">排序输出结果</text>

  <!-- ===== Result preview ===== -->
  <path d="M 481 228 L 481 252 L 290 252 L 290 276" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="190" y="280" width="200" height="84" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="290" y="298" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">user_id   biggest_window</text>
  <line x1="200" y1="304" x2="380" y2="304" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="240" y="320" text-anchor="middle" font-size="9" fill="#446688">1</text>
  <text x="330" y="320" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">39</text>
  <text x="240" y="336" text-anchor="middle" font-size="9" fill="#446688">2</text>
  <text x="330" y="336" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">65</text>
  <text x="240" y="352" text-anchor="middle" font-size="9" fill="#446688">3</text>
  <text x="330" y="352" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">51</text>

  <text x="290" y="382" text-anchor="middle" font-size="9" fill="#888">子查询算每行空档 → 外层 GROUP BY 取 MAX → ORDER BY 输出</text>
</svg>
