<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="520" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 4，名人是 2 号</text>

  <!-- ===== Section 1: Knows matrix ===== -->
  <text x="40" y="52" font-size="12" fill="#555" font-weight="bold">knows 矩阵（行 a 认识列 b？）</text>

  <!-- Matrix grid: 5x5 (header row + header col + 4x4 data) -->
  <!-- Cell size: 44 x 30, start at x=120, y=60 -->

  <!-- Header row: b values -->
  <rect x="120" y="60" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="142" y="80" text-anchor="middle" font-size="10" fill="#888">a\b</text>
  <rect x="164" y="60" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="186" y="80" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <rect x="208" y="60" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="230" y="80" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <!-- Column 2 header highlighted (celebrity column) -->
  <rect x="252" y="60" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="274" y="80" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="296" y="60" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="318" y="80" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>

  <!-- Row 0: header + data -->
  <rect x="120" y="90" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="142" y="110" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <rect x="164" y="90" width="44" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="186" y="110" text-anchor="middle" font-size="10" fill="#aaa">−</text>
  <rect x="208" y="90" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="230" y="110" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">T</text>
  <rect x="252" y="90" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="274" y="110" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">T</text>
  <rect x="296" y="90" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="318" y="110" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">T</text>

  <!-- Row 1: header + data -->
  <rect x="120" y="120" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="142" y="140" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="164" y="120" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="186" y="140" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">F</text>
  <rect x="208" y="120" width="44" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="230" y="140" text-anchor="middle" font-size="10" fill="#aaa">−</text>
  <rect x="252" y="120" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="274" y="140" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">T</text>
  <rect x="296" y="120" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="318" y="140" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">F</text>

  <!-- Row 2: CELEBRITY row (highlighted, all F except diagonal) -->
  <rect x="120" y="150" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="142" y="170" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2★</text>
  <rect x="164" y="150" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="186" y="170" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">F</text>
  <rect x="208" y="150" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="230" y="170" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">F</text>
  <rect x="252" y="150" width="44" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="274" y="170" text-anchor="middle" font-size="10" fill="#aaa">−</text>
  <rect x="296" y="150" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="318" y="170" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">F</text>

  <!-- Row 3: header + data -->
  <rect x="120" y="180" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="142" y="200" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="164" y="180" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="186" y="200" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">F</text>
  <rect x="208" y="180" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="230" y="200" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">F</text>
  <rect x="252" y="180" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="274" y="200" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">T</text>
  <rect x="296" y="180" width="44" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="318" y="200" text-anchor="middle" font-size="10" fill="#aaa">−</text>

  <!-- Matrix annotations -->
  <text x="360" y="110" font-size="10" fill="#4a7a3a">← 第 2 列全 T</text>
  <text x="360" y="170" font-size="10" fill="#4a7a3a">← 第 2 行全 F（名人行）</text>
  <text x="360" y="130" font-size="10" fill="#888">  （所有人都认识 2 号）</text>

  <!-- ===== Section 2: Pass 1 ===== -->
  <text x="40" y="238" font-size="12" fill="#446688" font-weight="bold">第一遍：排除法找候选</text>

  <!-- Step rows -->
  <rect x="40" y="248" width="480" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="56" y="265" font-size="10" fill="#333">candidate = 0</text>
  <text x="240" y="265" font-size="10" fill="#888">（初始候选）</text>

  <rect x="40" y="276" width="480" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="56" y="293" font-size="10" fill="#333">i=1: knows(0, 1) = T</text>
  <text x="240" y="293" font-size="10" fill="#b85450">→ 0 认识 1，0 被排除</text>
  <text x="440" y="293" font-size="10" fill="#446688" font-weight="bold">candidate = 1</text>

  <rect x="40" y="304" width="480" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="56" y="321" font-size="10" fill="#333">i=2: knows(1, 2) = T</text>
  <text x="240" y="321" font-size="10" fill="#b85450">→ 1 认识 2，1 被排除</text>
  <text x="440" y="321" font-size="10" fill="#446688" font-weight="bold">candidate = 2</text>

  <rect x="40" y="332" width="480" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="56" y="349" font-size="10" fill="#333">i=3: knows(2, 3) = F</text>
  <text x="240" y="349" font-size="10" fill="#b85450">→ 2 不认识 3，3 被排除</text>
  <text x="440" y="349" font-size="10" fill="#446688" font-weight="bold">candidate = 2</text>

  <!-- Pass 1 result -->
  <rect x="40" y="362" width="480" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="377" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">候选 = 2（3 次调用排除 3 人）</text>

  <!-- ===== Section 3: Pass 2 ===== -->
  <text x="40" y="402" font-size="12" fill="#4a7a3a" font-weight="bold">第二遍：验证候选 2</text>

  <!-- Verification rows -->
  <rect x="40" y="412" width="480" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="56" y="429" font-size="10" fill="#333">i=0: knows(2,0)=F ✓</text>
  <text x="220" y="429" font-size="10" fill="#333">knows(0,2)=T ✓</text>
  <text x="380" y="429" font-size="10" fill="#4a7a3a">候选不认识0 / 0认识候选</text>

  <rect x="40" y="440" width="480" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="56" y="457" font-size="10" fill="#333">i=1: knows(2,1)=F ✓</text>
  <text x="220" y="457" font-size="10" fill="#333">knows(1,2)=T ✓</text>
  <text x="380" y="457" font-size="10" fill="#4a7a3a">候选不认识1 / 1认识候选</text>

  <rect x="40" y="468" width="480" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="56" y="485" font-size="10" fill="#333">i=3: knows(2,3)=F ✓</text>
  <text x="220" y="485" font-size="10" fill="#333">knows(3,2)=T ✓</text>
  <text x="380" y="485" font-size="10" fill="#4a7a3a">候选不认识3 / 3认识候选</text>

  <!-- Result -->
  <rect x="40" y="498" width="480" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="511" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">全部通过 → return 2 ✓</text>
</svg>
