<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：x % (x−1) == 1 触发链式下降，桌面稳定为 {2,3,…,n}</text>

  <!-- ====== starting n ====== -->
  <rect x="30" y="64" width="120" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="90" y="82" text-anchor="middle" font-size="10.5" fill="#888">起始（桌面）</text>
  <text x="90" y="100" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">x = n</text>

  <!-- arrow into chain -->
  <path d="M 150 86 L 184 86" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ====== chain: n → n−1 → n−2 → ... → 2 ====== -->
  <rect x="188" y="64" width="56" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="216" y="91" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">n</text>

  <path d="M 244 86 L 280 86" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="262" y="78" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">n%n−1=1</text>

  <rect x="284" y="64" width="56" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="312" y="91" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">n−1</text>

  <path d="M 340 86 L 376 86" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="358" y="78" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">n−1%n−2=1</text>

  <rect x="380" y="64" width="56" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="408" y="91" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">n−2</text>

  <text x="452" y="82" text-anchor="middle" font-size="16" fill="#888" font-weight="bold">···</text>

  <path d="M 470 86 L 470 86" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="472" y="64" width="50" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="497" y="91" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">2</text>

  <!-- stop marker under 2 -->
  <path d="M 497 116 L 497 138" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="430" y="140" width="134" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="497" y="160" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">2 % 1 = 0 ≠ 1，链终止</text>

  <!-- ====== key property box ====== -->
  <rect x="30" y="140" width="380" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="220" y="160" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">关键性质：对 x ≥ 3，x = 1·(x−1) + 1</text>
  <text x="220" y="178" text-anchor="middle" font-size="11.5" fill="#333">故 x % (x−1) = 1 → 必把 x−1 拉上桌面</text>
  <text x="220" y="196" text-anchor="middle" font-size="10.5" fill="#888">逐日套用：n → n−1 → n−2 → ··· → 2（每步减一）</text>
  <text x="220" y="210" text-anchor="middle" font-size="10" fill="#888">到 2 后无法再减（2%1=0），桌面不再新增</text>

  <!-- ====== stabilization / answer ====== -->
  <path d="M 270 220 L 270 240" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="244" width="300" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="269" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">稳定桌面 = {2, 3, ···, n}（n ≥ 2）</text>

  <path d="M 270 284 L 270 300" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="120" y="304" width="300" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="329" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">答案 = n − 1（n≥2）；n=1 → 1</text>

  <!-- ====== bottom note ====== -->
  <rect x="30" y="350" width="480" height="0" fill="none"/>
  <text x="270" y="354" text-anchor="middle" font-size="10" fill="#888">1 永不被加入（x % 1 ≡ 0）；候选 i 仅限 [1,n]，故无 > n 的新值</text>
</svg>
