<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="520" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">寻找数组的中心下标：前缀和判定流程</text>

  <!-- Start node -->
  <ellipse cx="280" cy="60" rx="120" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="12" fill="#333">开始: total = sum(nums), leftSum = 0</text>

  <!-- arrow down to process: i = 0 -->
  <path d="M 280 80 L 280 98" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Process: i = 0 -->
  <rect x="216" y="100" width="128" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="123" text-anchor="middle" font-size="12" fill="#333">i = 0</text>

  <!-- arrow down to diamond A -->
  <path d="M 280 136 L 280 154" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond A: i < n ? -->
  <polygon points="280,158 374,204 280,250 186,204" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="200" text-anchor="middle" font-size="12" fill="#333">i &lt; n ?</text>
  <text x="280" y="216" text-anchor="middle" font-size="10" fill="#888">(遍历下标)</text>

  <!-- A: No -> return -1 -->
  <path d="M 374 204 L 446 204" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="196" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="486" cy="204" rx="50" ry="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="486" y="208" text-anchor="middle" font-size="12" fill="#333">返回 −1</text>

  <!-- A: Yes -> down -->
  <path d="M 280 250 L 280 268" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="264" font-size="11" fill="#82b366">是</text>

  <!-- Diamond B: 2*leftSum + nums[i] == total ? -->
  <polygon points="280,272 420,332 280,392 140,332" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="11" fill="#333">2 × leftSum + nums[i]</text>
  <text x="280" y="340" text-anchor="middle" font-size="11" fill="#333">== total ?</text>
  <text x="280" y="356" text-anchor="middle" font-size="10" fill="#888">(中心下标判定)</text>

  <!-- B: Yes -> return i -->
  <path d="M 420 332 L 470 332" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="445" y="324" text-anchor="middle" font-size="11" fill="#b85450">是</text>
  <ellipse cx="486" cy="332" rx="44" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="486" y="336" text-anchor="middle" font-size="12" fill="#333">返回 i</text>

  <!-- B: No -> down to process: leftSum += nums[i] -->
  <path d="M 280 392 L 280 410" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="406" font-size="11" fill="#82b366">否</text>

  <!-- Process: leftSum += nums[i] -->
  <rect x="184" y="412" width="192" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="437" text-anchor="middle" font-size="12" fill="#333">leftSum += nums[i]</text>

  <!-- Process: i++ -->
  <rect x="216" y="460" width="128" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="483" text-anchor="middle" font-size="12" fill="#333">i++</text>

  <!-- loop back: from i++ up to diamond A (left side, dashed) -->
  <path d="M 216 478 L 60 478 L 60 204 L 186 204" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="60" y="340" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 60 340)">继续下一轮</text>
</svg>
