<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：哈希分组累加 → 组间取 max</text>

  <!-- Step 1 -->
  <rect x="60" y="48" width="440" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="76" y="74" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">① 遍历 i = 0 … n−1（0-based 即可）</text>
  <text x="428" y="74" font-size="11" fill="#999" filter="url(#rough2)">一遍扫完</text>

  <path d="M 280 92 L 280 112" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="60" y="116" width="440" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="76" y="142" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">② key = prices[i] − i</text>
  <text x="410" y="142" font-size="11" fill="#999" filter="url(#rough2)">静态不变量</text>

  <path d="M 280 160 L 280 180" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="60" y="184" width="440" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="76" y="210" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">③ groupSum[key] += prices[i]</text>
  <text x="404" y="210" font-size="11" fill="#999" filter="url(#rough2)">哈希 O(1)</text>

  <path d="M 280 228 L 280 248" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4 -->
  <rect x="60" y="252" width="440" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="76" y="278" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">④ ans = max(所有组的累加和)</text>
  <text x="410" y="278" font-size="11" fill="#999" filter="url(#rough2)">组间取最大</text>

  <!-- side note -->
  <path d="M 280 296 L 280 312" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="314" width="320" height="34" fill="#fafafa" stroke="#999" stroke-width="1" stroke-dasharray="4 3" rx="6" filter="url(#rough2)"/>
  <text x="280" y="335" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">复杂度：O(n) 时间 / O(n) 空间，无需排序 / DP / 双指针</text>
</svg>
