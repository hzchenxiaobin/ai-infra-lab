<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：前缀异或化数对 + Trie 按位比较 x ⊕ y ≥ k</text>

  <rect x="24" y="42" width="232" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="140" y="61" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">① 前缀异或：子数组 → 数对</text>

  <text x="140" y="90" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">示例 1：nums = [3,1,2,3]，k = 2</text>

  <text x="41" y="105" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">P₀</text>
  <text x="79" y="105" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">P₁</text>
  <text x="117" y="105" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">P₂</text>
  <text x="155" y="105" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">P₃</text>
  <text x="193" y="105" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">P₄</text>

  <rect x="26" y="109" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="42" y="125" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="64" y="109" width="32" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="125" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="102" y="109" width="32" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="125" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="140" y="109" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="156" y="125" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="178" y="109" width="32" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="194" y="125" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>

  <rect x="24" y="148" width="232" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="140" y="167" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">子数组 (l, r] 的异或和 = Pₗ ⊕ Pᵣ</text>
  <text x="140" y="185" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">统计「异或和 ≥ k」的子数组</text>
  <text x="140" y="201" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">⟺ 统计 Pₗ ⊕ Pᵣ ≥ k 的数对 (l &lt; r)</text>

  <rect x="24" y="222" width="232" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <text x="140" y="241" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠ P₀ = 0 必须最先插入 Trie</text>
  <text x="140" y="258" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">否则漏掉「从下标 0 开始」的子数组</text>
  <text x="140" y="271" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">（示例 2 会从 6 错成 0）</text>

  <rect x="276" y="42" width="224" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="388" y="61" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② Trie 逐位比较（高位 → 低位）</text>

  <circle cx="388" cy="90" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="348" cy="126" r="8" fill="#fafafa" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="428" cy="126" r="8" fill="#fafafa" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 381 97 L 354 119" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 395 97 L 422 119" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="362" y="110" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">y 位 = 0</text>
  <text x="414" y="110" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">y 位 = 1</text>
  <text x="388" y="94" text-anchor="middle" font-size="8" fill="#446688" filter="url(#rough2)">root</text>

  <rect x="276" y="146" width="224" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="388" y="164" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">k 第 b 位 = 0</text>
  <text x="388" y="181" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">对侧子树（异或位 1 &gt; 0）已严格大</text>
  <text x="388" y="196" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">→ 整棵计入 res += cnt；走同侧继续</text>

  <rect x="276" y="214" width="224" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="388" y="232" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">k 第 b 位 = 1</text>
  <text x="388" y="249" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">同侧（异或位 0 &lt; 1）已严格小，剪枝</text>
  <text x="388" y="264" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">→ 只能走对侧硬性打平</text>

  <rect x="276" y="282" width="224" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <text x="388" y="300" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">30 位全走完 ⟺ x ⊕ y 恰好等于 k</text>
  <text x="388" y="317" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">k ≥ k 成立 → 补加终点 cnt</text>

  <path d="M 256 179 L 272 179" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 388 134 L 388 142" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="140" y="300" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">每个节点维护 cnt = 落在该子树的</text>
  <text x="140" y="315" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">历史前缀值个数，查询才能整棵批发</text>

  <text x="260" y="348" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">一趟 30 层树行走 = 一次「≥ k 计数」，查询/插入各 O(log V)</text>
</svg>
