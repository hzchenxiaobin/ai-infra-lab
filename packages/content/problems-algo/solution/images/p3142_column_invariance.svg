<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：相等有传递性 → 矩阵由第一行唯一决定</text>

  <!-- 4x3 grid, cell 42, vgap 18, hgap 14, origin (58,64) -->
  <!-- first row highlighted -->
  <rect x="58" y="64" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="114" y="64" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="170" y="64" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <!-- rows 1..3 -->
  <rect x="58" y="124" width="42" height="42" fill="#ffffff" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="114" y="124" width="42" height="42" fill="#ffffff" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="170" y="124" width="42" height="42" fill="#ffffff" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="58" y="184" width="42" height="42" fill="#ffffff" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="114" y="184" width="42" height="42" fill="#ffffff" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="170" y="184" width="42" height="42" fill="#ffffff" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="58" y="244" width="42" height="42" fill="#ffffff" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="114" y="244" width="42" height="42" fill="#ffffff" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="170" y="244" width="42" height="42" fill="#ffffff" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- values -->
  <text x="79" y="90" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="135" y="90" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="191" y="90" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="79" y="150" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="135" y="150" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="191" y="150" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="79" y="210" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="135" y="210" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="191" y="210" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="79" y="270" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="135" y="270" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="191" y="270" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>

  <!-- chained "=" in vertical gaps -->
  <text x="79" y="122" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">=</text>
  <text x="135" y="122" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">=</text>
  <text x="191" y="122" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">=</text>
  <text x="79" y="182" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">=</text>
  <text x="135" y="182" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">=</text>
  <text x="191" y="182" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">=</text>
  <text x="79" y="242" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">=</text>
  <text x="135" y="242" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">=</text>
  <text x="191" y="242" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">=</text>

  <!-- first row annotation -->
  <path d="M 232 85 L 258 85" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="264" y="82" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">第一行</text>
  <text x="264" y="98" font-size="11" fill="#4a7a3a" filter="url(#rough2)">= 每列的「代表」</text>

  <text x="135" y="308" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1 = 1 = 1 = 1，链式相等把每列压成一个常数</text>

  <!-- right insight boxes -->
  <rect x="320" y="56" width="218" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="334" y="78" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">推论 ①：矩阵 = 第一行的竖向复制</text>
  <text x="334" y="98" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">grid[i][j] ≡ grid[0][j]，对任意 i 成立</text>

  <rect x="320" y="134" width="218" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="334" y="156" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">推论 ②：横向不等只需查第一行</text>
  <text x="334" y="176" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">其余每行都是复制品，查一遍就够了</text>

  <rect x="320" y="212" width="218" height="80" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="334" y="234" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">两步判定：</text>
  <text x="334" y="254" font-size="11.5" fill="#555" filter="url(#rough2)">① 每一行都等于第一行（列内全等）</text>
  <text x="334" y="274" font-size="11.5" fill="#555" filter="url(#rough2)">② 第一行相邻元素互异</text>
  <text x="334" y="288" font-size="10.5" fill="#999" filter="url(#rough2)">—— 与官方 hints 一致</text>
</svg>
