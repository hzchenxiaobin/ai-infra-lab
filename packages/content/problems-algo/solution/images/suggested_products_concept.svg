<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">排序后同前缀产品连续 → 双指针夹窗口</text>

  <!-- Top: unsorted products -->
  <text x="40" y="62" font-size="12" fill="#888">排序前:</text>
  <rect x="100" y="48" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="66" text-anchor="middle" font-size="11" fill="#333">mouse</text>
  <rect x="184" y="48" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="224" y="66" text-anchor="middle" font-size="11" fill="#333">mobile</text>
  <rect x="268" y="48" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="308" y="66" text-anchor="middle" font-size="11" fill="#333">moneypot</text>
  <rect x="352" y="48" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="392" y="66" text-anchor="middle" font-size="11" fill="#333">monitor</text>
  <rect x="436" y="48" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="476" y="66" text-anchor="middle" font-size="11" fill="#333">mousepad</text>

  <!-- arrow down: sort -->
  <path d="M 280 84 L 280 100" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="300" y="96" font-size="10.5" fill="#888">sort()</text>

  <!-- Middle: sorted products -->
  <text x="40" y="128" font-size="12" fill="#888">排序后:</text>
  <!-- index labels -->
  <text x="140" y="124" text-anchor="middle" font-size="10" fill="#aaa">0</text>
  <text x="224" y="124" text-anchor="middle" font-size="10" fill="#aaa">1</text>
  <text x="308" y="124" text-anchor="middle" font-size="10" fill="#aaa">2</text>
  <text x="392" y="124" text-anchor="middle" font-size="10" fill="#aaa">3</text>
  <text x="476" y="124" text-anchor="middle" font-size="10" fill="#aaa">4</text>

  <rect x="100" y="132" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="150" text-anchor="middle" font-size="11" fill="#333">mobile</text>
  <rect x="184" y="132" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="224" y="150" text-anchor="middle" font-size="11" fill="#333">moneypot</text>
  <rect x="268" y="132" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="308" y="150" text-anchor="middle" font-size="11" fill="#333">monitor</text>
  <!-- highlight block: prefix "mou" -->
  <rect x="352" y="132" width="80" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="392" y="150" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">mouse</text>
  <rect x="436" y="132" width="80" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="476" y="150" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">mousepad</text>

  <!-- bracket showing contiguous block -->
  <path d="M 352 168 Q 352 176 400 176 Q 448 176 448 168" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="400" y="190" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">前缀 "mou" 连续段</text>

  <!-- Divider -->
  <path d="M 40 208 L 520 208" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Bottom: two pointers -->
  <text x="280" y="234" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">双指针夹窗口（窗口只缩不扩）</text>

  <!-- prefix steps -->
  <text x="40" y="266" font-size="12" fill="#888">前缀 "m":</text>
  <rect x="100" y="252" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="184" y="252" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="268" y="252" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="352" y="252" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="436" y="252" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="270" text-anchor="middle" font-size="10" fill="#333">mobile</text>
  <text x="224" y="270" text-anchor="middle" font-size="10" fill="#333">moneypot</text>
  <text x="308" y="270" text-anchor="middle" font-size="10" fill="#333">monitor</text>
  <text x="392" y="270" text-anchor="middle" font-size="10" fill="#333">mouse</text>
  <text x="476" y="270" text-anchor="middle" font-size="10" fill="#333">mousepad</text>
  <text x="100" y="294" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">↑left</text>
  <text x="516" y="294" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">right↑</text>
  <path d="M 100 288 L 460 288" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <text x="40" y="324" font-size="12" fill="#888">前缀 "mou":</text>
  <rect x="100" y="310" width="80" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="140" y="328" text-anchor="middle" font-size="10" fill="#bbb">mobile</text>
  <rect x="184" y="310" width="80" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="224" y="328" text-anchor="middle" font-size="10" fill="#bbb">moneypot</text>
  <rect x="268" y="310" width="80" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="308" y="328" text-anchor="middle" font-size="10" fill="#bbb">monitor</text>
  <rect x="352" y="310" width="80" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="392" y="328" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">mouse</text>
  <rect x="436" y="310" width="80" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="476" y="328" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">mousepad</text>
  <text x="392" y="352" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">↑left</text>
  <text x="476" y="352" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">right↑</text>

  <!-- arrow showing shrink -->
  <path d="M 280 300 Q 320 318 380 322" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="300" y="316" font-size="10.5" fill="#b85450">收缩</text>

  <!-- Formula box -->
  <rect x="90" y="370" width="380" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="386" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">前缀变长 → 窗口 ⊆ 上一轮 → 指针只朝内移</text>
</svg>
