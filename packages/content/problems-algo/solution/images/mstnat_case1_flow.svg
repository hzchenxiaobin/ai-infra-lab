<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrF" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">Case 1 四步重连流程</text>

  <!-- ===== Stage 1: Original ===== -->
  <text x="70" y="56" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">① 原始</text>

  <!-- edges -->
  <path d="M 70 82 L 70 110" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 64 138 Q 52 154 48 165" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 76 138 Q 88 154 92 165" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 42 191 Q 40 202 40 213" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- pp (p's parent) -->
  <circle cx="70" cy="72" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="76" text-anchor="middle" font-size="10" fill="#446688">pp</text>

  <!-- p -->
  <circle cx="70" cy="125" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="70" y="129" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">p</text>

  <!-- a (child of p, parent of q) -->
  <circle cx="45" cy="178" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="45" y="181" text-anchor="middle" font-size="9" fill="#333">a</text>

  <!-- b (child of p) -->
  <circle cx="95" cy="178" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="95" y="181" text-anchor="middle" font-size="9" fill="#333">b</text>

  <!-- q (descendant of p) -->
  <circle cx="40" cy="225" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="40" y="228" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">q</text>

  <!-- Arrow 1 -->
  <path d="M 115 150 L 150 150" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="132" y="142" text-anchor="middle" font-size="9" fill="#888">摘除q</text>

  <!-- ===== Stage 2: Detach q ===== -->
  <text x="200" y="56" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">② 摘除 q</text>

  <!-- edges -->
  <path d="M 200 82 L 200 110" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 194 138 Q 182 154 178 165" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 206 138 Q 218 154 222 165" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <!-- dashed line showing detachment -->
  <path d="M 178 189 L 232 220" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" fill="none" filter="url(#rough2)"/>

  <!-- pp -->
  <circle cx="200" cy="72" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="76" text-anchor="middle" font-size="10" fill="#446688">pp</text>

  <!-- p -->
  <circle cx="200" cy="125" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="200" y="129" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">p</text>

  <!-- a (no longer has q) -->
  <circle cx="175" cy="178" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="175" y="181" text-anchor="middle" font-size="9" fill="#333">a</text>

  <!-- b -->
  <circle cx="225" cy="178" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="225" y="181" text-anchor="middle" font-size="9" fill="#333">b</text>

  <!-- q (detached) -->
  <circle cx="240" cy="225" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="2,1.5" filter="url(#rough2)"/>
  <text x="240" y="228" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">q</text>

  <!-- Arrow 2 -->
  <path d="M 245 150 L 280 150" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="262" y="142" text-anchor="middle" font-size="9" fill="#888">q替换p</text>

  <!-- ===== Stage 3: q replaces p ===== -->
  <text x="330" y="56" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">③ q 替换 p</text>

  <!-- edges: pp -> q -->
  <path d="M 330 82 L 330 110" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <!-- p detached, show its subtree -->
  <path d="M 355 165 L 345 190" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 365 165 L 375 190" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- pp -->
  <circle cx="330" cy="72" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="76" text-anchor="middle" font-size="10" fill="#446688">pp</text>

  <!-- q (now in p's position) -->
  <circle cx="330" cy="125" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="330" y="129" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">q</text>

  <!-- p (detached, with subtree) -->
  <circle cx="360" cy="155" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="2,1.5" filter="url(#rough2)"/>
  <text x="360" y="159" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">p</text>

  <!-- a -->
  <circle cx="343" cy="198" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="343" y="201" text-anchor="middle" font-size="8" fill="#333">a</text>

  <!-- b -->
  <circle cx="378" cy="198" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="378" y="201" text-anchor="middle" font-size="8" fill="#333">b</text>

  <!-- Arrow 3 -->
  <path d="M 395 150 L 430 150" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="412" y="142" text-anchor="middle" font-size="9" fill="#888">p挂到q</text>

  <!-- ===== Stage 4: Final ===== -->
  <text x="465" y="56" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">④ 完成</text>

  <!-- edges -->
  <path d="M 465 82 L 465 110" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 465 138 L 465 160" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 459 188 Q 447 202 443 213" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 471 188 Q 483 202 487 213" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- pp -->
  <circle cx="465" cy="72" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="465" y="76" text-anchor="middle" font-size="10" fill="#446688">pp</text>

  <!-- q -->
  <circle cx="465" cy="125" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="465" y="129" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">q</text>

  <!-- p (now child of q) -->
  <circle cx="465" cy="175" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="465" y="179" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">p</text>

  <!-- a -->
  <circle cx="440" cy="225" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="440" y="228" text-anchor="middle" font-size="9" fill="#333">a</text>

  <!-- b -->
  <circle cx="490" cy="225" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490" y="228" text-anchor="middle" font-size="9" fill="#333">b</text>

  <!-- ===== Bottom notes ===== -->
  <path d="M 30 265 L 530 265" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <text x="280" y="288" text-anchor="middle" font-size="11.5" fill="#555">操作顺序：<tspan fill="#d6a040" font-weight="bold">摘 q</tspan> → <tspan fill="#b85450" font-weight="bold">q 替换 p 的位置</tspan> → <tspan fill="#d6a040" font-weight="bold">p 挂为 q 的末子</tspan></text>
  <text x="280" y="310" text-anchor="middle" font-size="10.5" fill="#888">若 p 是根：q 直接成为新根（跳过「q 替换 p」步骤，直接 root = q）</text>
</svg>
