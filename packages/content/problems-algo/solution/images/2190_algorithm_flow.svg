<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：遍历 → 判 key → 计下一个 → 维护最大</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">一遍扫描同步完成「计数」与「取最大」，无需第二趟</text>

  <!-- ===== Start node ===== -->
  <ellipse cx="120" cy="72" rx="46" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="76" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">开始</text>

  <path d="M 120 92 L 120 110" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Init ===== -->
  <rect x="60" y="112" width="120" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="120" y="130" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">初始化</text>
  <text x="120" y="146" text-anchor="middle" font-size="10" fill="#555">count={}, i=0</text>

  <path d="M 120 156 L 120 178" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Loop condition ===== -->
  <polygon points="120,180 200,216 120,252 40,216" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="212" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">i ≤ n−2 ?</text>
  <text x="120" y="228" text-anchor="middle" font-size="10" fill="#555">(有下一个元素)</text>

  <!-- NO branch: return -->
  <path d="M 40 216 L 20 216 L 20 316" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="32" y="210" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <ellipse cx="20" cy="336" rx="14" ry="14" fill="none" stroke="none"/>
  <rect x="60" y="318" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="120" y="336" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回 ansTarget</text>
  <text x="120" y="350" text-anchor="middle" font-size="9.5" fill="#555">(count 最大的 target)</text>
  <path d="M 20 336 L 58 336" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- YES branch: right -->
  <path d="M 200 216 L 230 216" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="215" y="210" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- ===== Check nums[i]==key ===== -->
  <polygon points="330,180 430,216 330,252 230,216" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="330" y="212" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">nums[i] == key ?</text>

  <!-- NO: i++ skip -->
  <path d="M 430 216 L 462 216" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="446" y="210" text-anchor="middle" font-size="10" fill="#888">否</text>
  <rect x="462" y="200" width="48" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="486" y="220" text-anchor="middle" font-size="10" fill="#888">跳过</text>

  <!-- YES: down to count++ -->
  <path d="M 330 252 L 330 272" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="346" y="266" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- ===== count[nums[i+1]]++ ===== -->
  <rect x="230" y="274" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="330" y="292" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">target = nums[i+1]</text>
  <text x="330" y="308" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">count[target]++</text>

  <!-- ===== Update max ===== -->
  <path d="M 330 314 L 330 328" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="230" y="330" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="330" y="352" text-anchor="middle" font-size="10" fill="#333">若 count[target] &gt; max：更新 ansTarget</text>

  <!-- loop back: i++ to loop cond -->
  <path d="M 486 232 L 486 372 L 120 372 L 120 252" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 430 348 L 430 372" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="300" y="368" text-anchor="middle" font-size="9.5" fill="#888">i++，回到循环判定</text>

  <!-- Footer -->
  <text x="260" y="372" text-anchor="middle" font-size="0" fill="#aaa"></text>
</svg>
