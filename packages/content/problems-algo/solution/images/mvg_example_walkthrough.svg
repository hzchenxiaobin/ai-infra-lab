<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 2 演算：BFS 层序距离 + 最优路径</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">grid=[[3,4,2,1],[4,2,1,1],[2,1,1,0],[3,4,1,0]]，格内为 grid 值，角标为 BFS 距离 d</text>

  <!-- col / row labels -->
  <g font-size="9" fill="#888">
    <text x="160" y="60" text-anchor="middle">0</text>
    <text x="240" y="60" text-anchor="middle">1</text>
    <text x="320" y="60" text-anchor="middle">2</text>
    <text x="400" y="60" text-anchor="middle">3</text>
    <text x="112" y="108" text-anchor="end">0</text>
    <text x="112" y="188" text-anchor="end">1</text>
    <text x="112" y="268" text-anchor="end">2</text>
    <text x="112" y="348" text-anchor="end">3</text>
  </g>

  <!-- ===== Row 0 ===== -->
  <!-- (0,0) v=3 d=0 red path -->
  <rect x="120" y="64" width="80" height="80" fill="#fce4ec" stroke="#b85450" stroke-width="2.6" rx="6" filter="url(#rough2)"/>
  <text x="160" y="108" text-anchor="middle" font-size="26" fill="#b85450" font-weight="bold">3</text>
  <text x="190" y="80" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold">d=0⭐</text>

  <rect x="200" y="64" width="80" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="240" y="108" text-anchor="middle" font-size="26" fill="#333">4</text>
  <text x="270" y="80" text-anchor="end" font-size="10" fill="#d6a040">d=1</text>

  <rect x="280" y="64" width="80" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="320" y="108" text-anchor="middle" font-size="26" fill="#333">2</text>
  <text x="350" y="80" text-anchor="end" font-size="10" fill="#d6a040">d=1</text>

  <rect x="360" y="64" width="80" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="400" y="108" text-anchor="middle" font-size="26" fill="#333">1</text>
  <text x="430" y="80" text-anchor="end" font-size="10" fill="#d6a040">d=1</text>

  <!-- ===== Row 1 ===== -->
  <rect x="120" y="144" width="80" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="160" y="188" text-anchor="middle" font-size="26" fill="#333">4</text>
  <text x="190" y="160" text-anchor="end" font-size="10" fill="#d6a040">d=1</text>

  <rect x="200" y="144" width="80" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="240" y="188" text-anchor="middle" font-size="26" fill="#333">2</text>
  <text x="270" y="160" text-anchor="end" font-size="10" fill="#4a7a3a">d=2</text>

  <rect x="280" y="144" width="80" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="320" y="188" text-anchor="middle" font-size="26" fill="#333">1</text>
  <text x="350" y="160" text-anchor="end" font-size="10" fill="#4a7a3a">d=2</text>

  <rect x="360" y="144" width="80" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="400" y="188" text-anchor="middle" font-size="26" fill="#333">1</text>
  <text x="430" y="160" text-anchor="end" font-size="10" fill="#4a7a3a">d=2</text>

  <!-- ===== Row 2 ===== -->
  <rect x="120" y="224" width="80" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="160" y="268" text-anchor="middle" font-size="26" fill="#333">2</text>
  <text x="190" y="240" text-anchor="end" font-size="10" fill="#d6a040">d=1</text>

  <rect x="200" y="224" width="80" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="240" y="268" text-anchor="middle" font-size="26" fill="#333">1</text>
  <text x="270" y="240" text-anchor="end" font-size="10" fill="#4a7a3a">d=2</text>

  <rect x="280" y="224" width="80" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="320" y="268" text-anchor="middle" font-size="26" fill="#333">1</text>
  <text x="350" y="240" text-anchor="end" font-size="10" fill="#4a7a3a">d=2</text>

  <rect x="360" y="224" width="80" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="400" y="268" text-anchor="middle" font-size="26" fill="#333">0</text>
  <text x="430" y="240" text-anchor="end" font-size="10" fill="#446688">d=3</text>

  <!-- ===== Row 3 ===== -->
  <!-- (3,0) v=3 d=1 path -->
  <rect x="120" y="304" width="80" height="80" fill="#fff8e1" stroke="#b85450" stroke-width="2.6" rx="6" filter="url(#rough2)"/>
  <text x="160" y="348" text-anchor="middle" font-size="26" fill="#b85450" font-weight="bold">3</text>
  <text x="190" y="320" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold">d=1⭐</text>

  <rect x="200" y="304" width="80" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="240" y="348" text-anchor="middle" font-size="26" fill="#333">4</text>
  <text x="270" y="320" text-anchor="end" font-size="10" fill="#4a7a3a">d=2</text>

  <rect x="280" y="304" width="80" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="320" y="348" text-anchor="middle" font-size="26" fill="#333">1</text>
  <text x="350" y="320" text-anchor="end" font-size="10" fill="#4a7a3a">d=2</text>

  <!-- (3,3) v=0 d=2 path dest -->
  <rect x="360" y="304" width="80" height="80" fill="#e6f4ea" stroke="#b85450" stroke-width="2.6" rx="6" filter="url(#rough2)"/>
  <text x="400" y="348" text-anchor="middle" font-size="26" fill="#b85450" font-weight="bold">0</text>
  <text x="430" y="320" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold">d=2⭐</text>

  <!-- path arrows (outside grid) -->
  <!-- down: (0,0)->(3,0) along left margin -->
  <path d="M 96 104 L 96 344" stroke="#b85450" stroke-width="2.2" stroke-dasharray="6 3" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="60" y="228" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" transform="rotate(-90 60 228)">(0,0)→(3,0) 向下</text>

  <!-- right: (3,0)->(3,3) along bottom margin -->
  <path d="M 160 412 L 396 412" stroke="#b85450" stroke-width="2.2" stroke-dasharray="6 3" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="280" y="430" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">(3,0)→(3,3) 向右 g=3 直接够得着</text>

  <!-- legend -->
  <g font-size="10">
    <rect x="448" y="372" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="466" y="383" fill="#444">d=0</text>
    <rect x="448" y="390" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="466" y="401" fill="#444">d=1</text>
    <rect x="448" y="408" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="466" y="419" fill="#444">d=2</text>
  </g>

  <!-- answer -->
  <text x="280" y="456" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">答案 = dist[3][3] + 1 = 2 + 1 = 3 ；路径 (0,0)→(3,0)→(3,3)</text>
</svg>
