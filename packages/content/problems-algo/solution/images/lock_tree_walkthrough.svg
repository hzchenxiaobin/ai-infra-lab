<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">示例演算：parent = [-1,0,0,1,1,2,2]</text>

  <!-- ===== Cell 1: lock(2,2) -> true ===== -->
  <g filter="url(#rough2)">
    <line x1="145" y1="76" x2="100" y2="126" stroke="#bbb" stroke-width="1.4"/>
    <line x1="145" y1="76" x2="190" y2="126" stroke="#bbb" stroke-width="1.4"/>
    <line x1="100" y1="126" x2="80" y2="176" stroke="#bbb" stroke-width="1.4"/>
    <line x1="100" y1="126" x2="120" y2="176" stroke="#bbb" stroke-width="1.4"/>
    <line x1="190" y1="126" x2="170" y2="176" stroke="#bbb" stroke-width="1.4"/>
    <line x1="190" y1="126" x2="210" y2="176" stroke="#bbb" stroke-width="1.4"/>
  </g>
  <g filter="url(#rough2)">
    <circle cx="145" cy="76" r="11" fill="#fff" stroke="#446688" stroke-width="1.4"/>
    <circle cx="100" cy="126" r="11" fill="#fff" stroke="#446688" stroke-width="1.4"/>
    <circle cx="190" cy="126" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <circle cx="80" cy="176" r="10" fill="#fff" stroke="#446688" stroke-width="1.3"/>
    <circle cx="120" cy="176" r="10" fill="#fff" stroke="#446688" stroke-width="1.3"/>
    <circle cx="170" cy="176" r="10" fill="#fff" stroke="#446688" stroke-width="1.3"/>
    <circle cx="210" cy="176" r="10" fill="#fff" stroke="#446688" stroke-width="1.3"/>
  </g>
  <g font-size="9.5" fill="#333">
    <text x="145" y="79" text-anchor="middle">0</text>
    <text x="100" y="129" text-anchor="middle">1</text>
    <text x="190" y="129" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <text x="80" y="179" text-anchor="middle">3</text>
    <text x="120" y="179" text-anchor="middle">4</text>
    <text x="170" y="179" text-anchor="middle">5</text>
    <text x="210" y="179" text-anchor="middle">6</text>
  </g>
  <rect x="40" y="48" width="210" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="145" y="62" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">① lock(2,2) → true</text>
  <text x="145" y="206" text-anchor="middle" font-size="9.5" fill="#b85450">节点 2 未上锁 → 上锁 U2</text>

  <!-- ===== Cell 2: unlock(2,2) -> true ===== -->
  <g filter="url(#rough2)">
    <line x1="415" y1="76" x2="370" y2="126" stroke="#bbb" stroke-width="1.4"/>
    <line x1="415" y1="76" x2="460" y2="126" stroke="#bbb" stroke-width="1.4"/>
    <line x1="370" y1="126" x2="350" y2="176" stroke="#bbb" stroke-width="1.4"/>
    <line x1="370" y1="126" x2="390" y2="176" stroke="#bbb" stroke-width="1.4"/>
    <line x1="460" y1="126" x2="440" y2="176" stroke="#bbb" stroke-width="1.4"/>
    <line x1="460" y1="126" x2="480" y2="176" stroke="#bbb" stroke-width="1.4"/>
  </g>
  <g filter="url(#rough2)">
    <circle cx="415" cy="76" r="11" fill="#fff" stroke="#446688" stroke-width="1.4"/>
    <circle cx="370" cy="126" r="11" fill="#fff" stroke="#446688" stroke-width="1.4"/>
    <circle cx="460" cy="126" r="11" fill="#fff" stroke="#446688" stroke-width="1.4"/>
    <circle cx="350" cy="176" r="10" fill="#fff" stroke="#446688" stroke-width="1.3"/>
    <circle cx="390" cy="176" r="10" fill="#fff" stroke="#446688" stroke-width="1.3"/>
    <circle cx="440" cy="176" r="10" fill="#fff" stroke="#446688" stroke-width="1.3"/>
    <circle cx="480" cy="176" r="10" fill="#fff" stroke="#446688" stroke-width="1.3"/>
  </g>
  <g font-size="9.5" fill="#333">
    <text x="415" y="79" text-anchor="middle">0</text>
    <text x="370" y="129" text-anchor="middle">1</text>
    <text x="460" y="129" text-anchor="middle">2</text>
    <text x="350" y="179" text-anchor="middle">3</text>
    <text x="390" y="179" text-anchor="middle">4</text>
    <text x="440" y="179" text-anchor="middle">5</text>
    <text x="480" y="179" text-anchor="middle">6</text>
  </g>
  <rect x="310" y="48" width="210" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="415" y="62" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">② unlock(2,2) → true</text>
  <text x="415" y="206" text-anchor="middle" font-size="9.5" fill="#555">unlock(2,3) 先失败；同主 U2 解锁成功</text>

  <!-- ===== Cell 3: lock(4,5) -> true ===== -->
  <g filter="url(#rough2)">
    <line x1="145" y1="288" x2="100" y2="338" stroke="#bbb" stroke-width="1.4"/>
    <line x1="145" y1="288" x2="190" y2="338" stroke="#bbb" stroke-width="1.4"/>
    <line x1="100" y1="338" x2="80" y2="388" stroke="#bbb" stroke-width="1.4"/>
    <line x1="100" y1="338" x2="120" y2="388" stroke="#bbb" stroke-width="1.4"/>
    <line x1="190" y1="338" x2="170" y2="388" stroke="#bbb" stroke-width="1.4"/>
    <line x1="190" y1="338" x2="210" y2="388" stroke="#bbb" stroke-width="1.4"/>
  </g>
  <g filter="url(#rough2)">
    <circle cx="145" cy="288" r="11" fill="#fff" stroke="#446688" stroke-width="1.4"/>
    <circle cx="100" cy="338" r="11" fill="#fff" stroke="#446688" stroke-width="1.4"/>
    <circle cx="190" cy="338" r="11" fill="#fff" stroke="#446688" stroke-width="1.4"/>
    <circle cx="80" cy="388" r="10" fill="#fff" stroke="#446688" stroke-width="1.3"/>
    <circle cx="120" cy="388" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <circle cx="170" cy="388" r="10" fill="#fff" stroke="#446688" stroke-width="1.3"/>
    <circle cx="210" cy="388" r="10" fill="#fff" stroke="#446688" stroke-width="1.3"/>
  </g>
  <g font-size="9.5" fill="#333">
    <text x="145" y="291" text-anchor="middle">0</text>
    <text x="100" y="341" text-anchor="middle">1</text>
    <text x="190" y="341" text-anchor="middle">2</text>
    <text x="80" y="391" text-anchor="middle">3</text>
    <text x="120" y="391" text-anchor="middle" fill="#b85450" font-weight="bold">4</text>
    <text x="170" y="391" text-anchor="middle">5</text>
    <text x="210" y="391" text-anchor="middle">6</text>
  </g>
  <rect x="40" y="260" width="210" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="145" y="274" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">③ lock(4,5) → true</text>
  <text x="145" y="418" text-anchor="middle" font-size="9.5" fill="#b85450">节点 4 未上锁 → 上锁 U5</text>

  <!-- ===== Cell 4: upgrade(0,1) -> true ; lock(0,1) -> false ===== -->
  <g filter="url(#rough2)">
    <line x1="415" y1="288" x2="370" y2="338" stroke="#bbb" stroke-width="1.4"/>
    <line x1="415" y1="288" x2="460" y2="338" stroke="#bbb" stroke-width="1.4"/>
    <line x1="370" y1="338" x2="350" y2="388" stroke="#bbb" stroke-width="1.4"/>
    <line x1="370" y1="338" x2="390" y2="388" stroke="#bbb" stroke-width="1.4"/>
    <line x1="460" y1="338" x2="440" y2="388" stroke="#bbb" stroke-width="1.4"/>
    <line x1="460" y1="338" x2="480" y2="388" stroke="#bbb" stroke-width="1.4"/>
  </g>
  <g filter="url(#rough2)">
    <circle cx="415" cy="288" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <circle cx="370" cy="338" r="11" fill="#fff" stroke="#446688" stroke-width="1.4"/>
    <circle cx="460" cy="338" r="11" fill="#fff" stroke="#446688" stroke-width="1.4"/>
    <circle cx="350" cy="388" r="10" fill="#fff" stroke="#446688" stroke-width="1.3"/>
    <circle cx="390" cy="388" r="10" fill="#fff" stroke="#446688" stroke-width="1.3"/>
    <circle cx="440" cy="388" r="10" fill="#fff" stroke="#446688" stroke-width="1.3"/>
    <circle cx="480" cy="388" r="10" fill="#fff" stroke="#446688" stroke-width="1.3"/>
  </g>
  <g font-size="9.5" fill="#333">
    <text x="415" y="291" text-anchor="middle" fill="#b85450" font-weight="bold">0</text>
    <text x="370" y="341" text-anchor="middle">1</text>
    <text x="460" y="341" text-anchor="middle">2</text>
    <text x="350" y="391" text-anchor="middle">3</text>
    <text x="390" y="391" text-anchor="middle">4</text>
    <text x="440" y="391" text-anchor="middle">5</text>
    <text x="480" y="391" text-anchor="middle">6</text>
  </g>
  <rect x="300" y="260" width="230" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="415" y="274" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">④ upgrade(0,1) → true</text>
  <text x="415" y="418" text-anchor="middle" font-size="9.5" fill="#555">子孙 4 解锁，节点 0 上锁 U1；</text>
  <text x="415" y="432" text-anchor="middle" font-size="9.5" fill="#b85450">随后 lock(0,1) → false（已上锁）</text>
</svg>
