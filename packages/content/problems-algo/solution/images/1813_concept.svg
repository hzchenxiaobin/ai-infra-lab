<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrU" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：短句是长句的「前缀 + 后缀」，中间允许插入一段</text>

  <!-- sentence1 (longer) label -->
  <text x="36" y="74" font-size="11" fill="#888" filter="url(#rough2)">sentence1</text>
  <text x="36" y="88" font-size="9" fill="#aaa" filter="url(#rough2)">(较长)</text>

  <!-- sentence1 word boxes: My | name | is | Haley -->
  <g font-size="13" text-anchor="middle">
    <!-- prefix: My (green) -->
    <rect x="96" y="62" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="126" y="84" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">My</text>
    <!-- insertion: name is (orange) -->
    <rect x="164" y="62" width="64" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="196" y="84" fill="#d6a040" font-weight="bold" filter="url(#rough2)">name</text>
    <rect x="236" y="62" width="48" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="260" y="84" fill="#d6a040" font-weight="bold" filter="url(#rough2)">is</text>
    <!-- suffix: Haley (blue) -->
    <rect x="292" y="62" width="72" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="328" y="84" fill="#446688" font-weight="bold" filter="url(#rough2)">Haley</text>
  </g>

  <!-- zone brackets below sentence1 -->
  <path d="M 96 104 L 96 110 L 156 110 L 156 104" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="126" y="124" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">前缀 l=1</text>

  <path d="M 164 104 L 164 110 L 284 110 L 284 104" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="224" y="124" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">插入段（可空）</text>

  <path d="M 292 104 L 292 110 L 364 110 L 364 104" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="328" y="124" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">后缀 r=1</text>

  <!-- vertical arrows from sentence2 up to sentence1 matched words -->
  <path d="M 126 196 L 126 100" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="4,3" marker-end="url(#arrU)" filter="url(#rough2)"/>
  <path d="M 328 196 L 328 100" stroke="#446688" stroke-width="1.8" fill="none" stroke-dasharray="4,3" marker-end="url(#arrU)" filter="url(#rough2)"/>
  <text x="138" y="150" font-size="9" fill="#4a7a3a" filter="url(#rough2)">同</text>
  <text x="340" y="150" font-size="9" fill="#446688" filter="url(#rough2)">同</text>

  <!-- sentence2 (shorter) label -->
  <text x="36" y="208" font-size="11" fill="#888" filter="url(#rough2)">sentence2</text>
  <text x="36" y="222" font-size="9" fill="#aaa" filter="url(#rough2)">(较短)</text>

  <!-- sentence2 word boxes: My | Haley  (aligned under matched s1 words) -->
  <g font-size="13" text-anchor="middle">
    <rect x="96" y="196" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="126" y="218" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">My</text>
    <rect x="292" y="196" width="72" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="328" y="218" fill="#446688" font-weight="bold" filter="url(#rough2)">Haley</text>
  </g>

  <!-- gap hint between s2 words -->
  <text x="224" y="218" text-anchor="middle" font-size="10" fill="#bbb" font-style="italic" filter="url(#rough2)">⋯ 中间空缺 ⋯</text>

  <!-- divider -->
  <path d="M 40 250 L 520 250" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- condition explanation -->
  <text x="280" y="272" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">短句的全部单词 = 长句的前缀 + 长句的后缀</text>

  <!-- formula box -->
  <rect x="120" y="286" width="320" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="306" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">判定条件：l + r ≥ n₂</text>
  <text x="280" y="322" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">前缀与后缀合起来覆盖整个短句 → 相似</text>

  <!-- footer -->
  <text x="280" y="352" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">绿=前缀匹配；橙=可插入段；蓝=后缀匹配</text>
  <text x="280" y="370" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">插入段可在首/中/尾，对应 l 或 r 为 0 的情形</text>
</svg>
