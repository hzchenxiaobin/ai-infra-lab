<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">分层图：每个点按「已用跨越数 c」复制成 k+1 份</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">同层边权 w（付费）/ 跨层边权 0（免费跨越，c+1）</text>

  <!-- layer labels -->
  <text x="30" y="135" font-size="11" fill="#888" font-weight="bold">c=0</text>
  <text x="30" y="245" font-size="11" fill="#888" font-weight="bold">c=1</text>
  <text x="30" y="355" font-size="11" fill="#888" font-weight="bold">c=2</text>

  <!-- layer guide lines -->
  <path d="M 50 130 L 510 130" stroke="#e0e0e0" stroke-width="0.8" stroke-dasharray="3 4" filter="url(#rough2)"/>
  <path d="M 50 240 L 510 240" stroke="#e0e0e0" stroke-width="0.8" stroke-dasharray="3 4" filter="url(#rough2)"/>
  <path d="M 50 350 L 510 350" stroke="#e0e0e0" stroke-width="0.8" stroke-dasharray="3 4" filter="url(#rough2)"/>

  <!-- ===== faint same-layer edges (all layers) ===== -->
  <g stroke="#cfd8e0" stroke-width="1.2" fill="none">
    <!-- c=0 -->
    <path d="M 110 130 L 230 130" filter="url(#rough2)"/>
    <path d="M 230 130 L 350 130" filter="url(#rough2)"/>
    <path d="M 350 130 L 470 130" filter="url(#rough2)"/>
    <!-- c=1 -->
    <path d="M 110 240 L 230 240" filter="url(#rough2)"/>
    <path d="M 230 240 L 350 240" filter="url(#rough2)"/>
    <path d="M 350 240 L 470 240" filter="url(#rough2)"/>
    <!-- c=2 -->
    <path d="M 110 350 L 230 350" filter="url(#rough2)"/>
    <path d="M 230 350 L 350 350" filter="url(#rough2)"/>
    <path d="M 350 350 L 470 350" filter="url(#rough2)"/>
  </g>
  <!-- weights on c=0 only -->
  <g font-size="9" fill="#9aa" text-anchor="middle">
    <text x="170" y="124">w4</text>
    <text x="290" y="124">w2</text>
    <text x="410" y="124">w6</text>
  </g>

  <!-- ===== highlighted optimal layered path: (1,0)->(0,1)->(2,1)->(3,2) ===== -->
  <!-- (1,0) hop -> (0,1) : dashed green, weight 0 -->
  <path d="M 100 138 Q 150 188 218 232" stroke="#4a7a3a" stroke-width="2.4" fill="none"
        stroke-dasharray="6 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="138" y="192" font-size="10" fill="#4a7a3a" font-weight="bold">跨越 0</text>

  <!-- (0,1) pay -> (2,1) : solid green, weight 2 -->
  <path d="M 232 240 L 338 240" stroke="#4a7a3a" stroke-width="2.4" fill="none"
        marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="285" y="232" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">付费 2</text>

  <!-- (2,1) hop -> (3,2) : dashed green, weight 0 -->
  <path d="M 358 248 Q 408 298 462 342" stroke="#4a7a3a" stroke-width="2.4" fill="none"
        stroke-dasharray="6 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="406" y="302" font-size="10" fill="#4a7a3a" font-weight="bold">跨越 0</text>

  <!-- ===== nodes ===== -->
  <!-- layer c=0 -->
  <ellipse cx="95" cy="130" rx="17" ry="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="95" y="134" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <ellipse cx="230" cy="130" rx="17" ry="14" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="230" y="134" text-anchor="middle" font-size="12" fill="#666">0</text>
  <ellipse cx="350" cy="130" rx="17" ry="14" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="350" y="134" text-anchor="middle" font-size="12" fill="#666">2</text>
  <ellipse cx="470" cy="130" rx="17" ry="14" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="470" y="134" text-anchor="middle" font-size="12" fill="#666">3</text>

  <!-- layer c=1 -->
  <ellipse cx="95" cy="240" rx="17" ry="14" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="95" y="244" text-anchor="middle" font-size="12" fill="#666">1</text>
  <ellipse cx="230" cy="240" rx="17" ry="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="244" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">0</text>
  <ellipse cx="350" cy="240" rx="17" ry="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="244" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <ellipse cx="470" cy="240" rx="17" ry="14" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="470" y="244" text-anchor="middle" font-size="12" fill="#666">3</text>

  <!-- layer c=2 -->
  <ellipse cx="95" cy="350" rx="17" ry="14" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="95" y="354" text-anchor="middle" font-size="12" fill="#666">1</text>
  <ellipse cx="230" cy="350" rx="17" ry="14" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="230" y="354" text-anchor="middle" font-size="12" fill="#666">0</text>
  <ellipse cx="350" cy="350" rx="17" ry="14" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="350" y="354" text-anchor="middle" font-size="12" fill="#666">2</text>
  <ellipse cx="470" cy="350" rx="17" ry="14" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="470" y="354" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>

  <!-- annotations -->
  <text x="95" y="108" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">起点 (s,0)</text>
  <text x="470" y="378" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">终点 (d,k)</text>

  <!-- legend -->
  <rect x="40" y="392" width="480" height="30" fill="#ffffff" stroke="#ddd" stroke-width="0.8" rx="6" filter="url(#rough2)"/>
  <text x="55" y="411" font-size="10" fill="#666">绿实线 = 付费同层边(权w)</text>
  <text x="225" y="411" font-size="10" fill="#666">绿虚线 = 免费跨层边(权0, c+1)</text>
  <text x="410" y="411" font-size="10" fill="#4a7a3a" font-weight="bold">最优路径代价 = 0+2+0 = 2</text>
</svg>
