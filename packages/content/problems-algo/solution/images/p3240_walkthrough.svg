<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">示例 1 演算：对角线上的 1 → ans = 3</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">grid = [[1,0,0],[0,1,0],[0,0,1]]，m = n = 3（双奇）</text>

  <!-- 原矩阵 -->
  <rect x="46" y="58" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="69" y="86" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="92" y="58" width="46" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="86" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="138" y="58" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="161" y="86" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="46" y="104" width="46" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="69" y="132" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="92" y="104" width="46" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="115" y="132" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="138" y="104" width="46" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="161" y="132" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="46" y="150" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="69" y="178" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="92" y="150" width="46" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="178" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="138" y="150" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="161" y="178" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="115" y="214" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">四角 = 四元组（c = 1+0+0+1 = 2）</text>
  <text x="115" y="230" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">边中 = 二元组（两对 00）；心 = 中心格</text>

  <!-- 箭头 -->
  <line x1="192" y1="127" x2="254" y2="127" stroke="#888" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="223" y="118" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333" filter="url(#rough2)">翻转 3 次</text>
  <text x="223" y="144" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">(0,2)(2,0)(1,1)</text>

  <!-- 终态矩阵 -->
  <rect x="262" y="58" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="285" y="86" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="308" y="58" width="46" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="331" y="86" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="354" y="58" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="377" y="86" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="262" y="104" width="46" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="285" y="132" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="308" y="104" width="46" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="331" y="132" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="354" y="104" width="46" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="377" y="132" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="262" y="150" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="285" y="178" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="308" y="150" width="46" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="331" y="178" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="354" y="150" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="377" y="178" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <!-- 被翻转格子的红虚框 -->
  <rect x="357" y="61" width="40" height="40" rx="4" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <rect x="265" y="153" width="40" height="40" rx="4" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <rect x="311" y="107" width="40" height="40" rx="4" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="331" y="214" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">红虚框 = 被翻转的 3 格</text>
  <text x="331" y="230" text-anchor="middle" font-size="10" fill="#2f5d27" filter="url(#rough2)">行、列全部回文，1 的个数 = 4 ✓</text>

  <!-- 步骤 -->
  <circle cx="46" cy="263" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="46" y="267" text-anchor="middle" font-size="10" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <text x="64" y="267" font-size="10.5" fill="#333" filter="url(#rough2)">四元组 c=2 → +2：(0,2)、(2,0) 翻成 1，四角全 1（贡献 4 个 1）</text>
  <circle cx="46" cy="289" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="46" y="293" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">2</text>
  <text x="64" y="293" font-size="10.5" fill="#333" filter="url(#rough2)">二元组两对全 00 → +0，pair11 = 0、flex = 0</text>
  <circle cx="46" cy="315" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="46" y="319" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">3</text>
  <text x="64" y="319" font-size="10.5" fill="#333" filter="url(#rough2)">pair11 为偶 → 免调配；中心格 (1,1)=1 → +1 归零</text>
  <circle cx="46" cy="341" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="46" y="345" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">4</text>
  <text x="64" y="345" font-size="10.5" fill="#333" filter="url(#rough2)">终态总 1 数 = 4 + 0 + 0 = 4 ≡ 0 (mod 4) ✓</text>

  <!-- 答案 -->
  <rect x="130" y="364" width="260" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="260" y="384" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f5d27" filter="url(#rough2)">ans = 2 + 0 + 1 = 3</text>
  <text x="260" y="401" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">总账 4a + 2P + center = 4 + 0 + 0 = 4 ✓</text>
</svg>
