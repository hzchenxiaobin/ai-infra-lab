<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：子集自由度 → 下标独立，各算各的子集和</text>
  <text x="260" y="38" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">以示例 4 的下标 4 为例：nums[4] = 6，按查询序覆盖它的 val 依次为 2, 4, 1, 5</text>

  <!-- 左：查询子集 = 独立开关 -->
  <g filter="url(#rough2)">
    <rect x="28" y="52" width="216" height="124" fill="#ffffff" stroke="#9db4c9" stroke-width="1.4" rx="8"/>
    <text x="136" y="70" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">观察 1：查询的子集 = 独立开关</text>
    <rect x="48" y="78" width="176" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6"/>
    <text x="136" y="92" text-anchor="middle" font-size="9.5" fill="#8a6d1f" font-weight="bold">某条查询 [l=1, r=4, val=2]</text>
    <line x1="136" y1="98" x2="136" y2="106" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="40" y="110" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="62" y="124" text-anchor="middle" font-size="8.5" fill="#666">下标 1</text>
    <text x="62" y="141" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold">0</text>
    <rect x="90" y="110" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="112" y="124" text-anchor="middle" font-size="8.5" fill="#666">下标 2</text>
    <text x="112" y="141" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold">0</text>
    <rect x="140" y="110" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="162" y="124" text-anchor="middle" font-size="8.5" fill="#666">下标 3</text>
    <text x="162" y="141" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold">0</text>
    <rect x="190" y="110" width="44" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="212" y="124" text-anchor="middle" font-size="8.5" fill="#666">下标 4</text>
    <text x="212" y="141" text-anchor="middle" font-size="12" fill="#a03934" font-weight="bold">−2</text>
    <text x="136" y="168" text-anchor="middle" font-size="9.5" fill="#555">选中谁、不选谁，各下标独立决定（互不牵制）</text>
  </g>

  <!-- 右：阈值结构 -->
  <g filter="url(#rough2)">
    <rect x="272" y="52" width="220" height="124" fill="#ffffff" stroke="#9db4c9" stroke-width="1.4" rx="8"/>
    <text x="382" y="70" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">观察 3：每个下标有阈值，答案取 max</text>
    <rect x="282" y="80" width="38" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="301" y="96" text-anchor="middle" font-size="8.5" fill="#666">nums=1</text>
    <text x="301" y="118" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">k=1</text>
    <rect x="324" y="80" width="38" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="343" y="96" text-anchor="middle" font-size="8.5" fill="#666">nums=2</text>
    <text x="343" y="118" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">k=2</text>
    <rect x="366" y="80" width="38" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="385" y="96" text-anchor="middle" font-size="8.5" fill="#666">nums=3</text>
    <text x="385" y="118" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">k=3</text>
    <rect x="408" y="80" width="38" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="427" y="96" text-anchor="middle" font-size="8.5" fill="#666">nums=2</text>
    <text x="427" y="118" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">k=3</text>
    <rect x="450" y="80" width="38" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="469" y="96" text-anchor="middle" font-size="8.5" fill="#666">nums=6</text>
    <text x="469" y="118" text-anchor="middle" font-size="11" fill="#a03934" font-weight="bold">k=4</text>
    <text x="382" y="146" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold">答案 = max(1, 2, 3, 3, 4) = 4</text>
    <text x="382" y="164" text-anchor="middle" font-size="9" fill="#888">子集可为空 → 可达集只增不减</text>
  </g>

  <!-- 下：bitset 转移 -->
  <g filter="url(#rough2)">
    <rect x="28" y="186" width="464" height="150" fill="#ffffff" stroke="#9db4c9" stroke-width="1.4" rx="8"/>
    <text x="260" y="204" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">观察 2：一条查询 = 一次「平移 + 或」：f |= f &lt;&lt; v（下标 4 新来 val = 4）</text>

    <!-- Row A -->
    <text x="160" y="228" text-anchor="end" font-size="9.5" fill="#2f5d24" font-weight="bold">f = {0, 2}：</text>
    <rect x="168" y="212" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="183" y="230" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">0</text>
    <rect x="202" y="212" width="30" height="26" fill="#ffffff" stroke="#9db4c9" stroke-width="1.2" stroke-dasharray="3 3" rx="4"/>
    <text x="217" y="230" text-anchor="middle" font-size="11" fill="#999">1</text>
    <rect x="236" y="212" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="251" y="230" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">2</text>
    <rect x="270" y="212" width="30" height="26" fill="#ffffff" stroke="#9db4c9" stroke-width="1.2" stroke-dasharray="3 3" rx="4"/>
    <text x="285" y="230" text-anchor="middle" font-size="11" fill="#999">3</text>
    <rect x="304" y="212" width="30" height="26" fill="#ffffff" stroke="#9db4c9" stroke-width="1.2" stroke-dasharray="3 3" rx="4"/>
    <text x="319" y="230" text-anchor="middle" font-size="11" fill="#999">4</text>
    <rect x="338" y="212" width="30" height="26" fill="#ffffff" stroke="#9db4c9" stroke-width="1.2" stroke-dasharray="3 3" rx="4"/>
    <text x="353" y="230" text-anchor="middle" font-size="11" fill="#999">5</text>
    <rect x="372" y="212" width="30" height="26" fill="#ffffff" stroke="#9db4c9" stroke-width="1.2" stroke-dasharray="3 3" rx="4"/>
    <text x="387" y="230" text-anchor="middle" font-size="11" fill="#999">6</text>

    <!-- Row B -->
    <text x="160" y="264" text-anchor="end" font-size="9.5" fill="#33506b" font-weight="bold">f &lt;&lt; 4（用掉 val）：</text>
    <rect x="168" y="248" width="30" height="26" fill="#ffffff" stroke="#9db4c9" stroke-width="1.2" stroke-dasharray="3 3" rx="4"/>
    <text x="183" y="266" text-anchor="middle" font-size="11" fill="#999">0</text>
    <rect x="202" y="248" width="30" height="26" fill="#ffffff" stroke="#9db4c9" stroke-width="1.2" stroke-dasharray="3 3" rx="4"/>
    <text x="217" y="266" text-anchor="middle" font-size="11" fill="#999">1</text>
    <rect x="236" y="248" width="30" height="26" fill="#ffffff" stroke="#9db4c9" stroke-width="1.2" stroke-dasharray="3 3" rx="4"/>
    <text x="251" y="266" text-anchor="middle" font-size="11" fill="#999">2</text>
    <rect x="270" y="248" width="30" height="26" fill="#ffffff" stroke="#9db4c9" stroke-width="1.2" stroke-dasharray="3 3" rx="4"/>
    <text x="285" y="266" text-anchor="middle" font-size="11" fill="#999">3</text>
    <rect x="304" y="248" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="319" y="266" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold">4</text>
    <rect x="338" y="248" width="30" height="26" fill="#ffffff" stroke="#9db4c9" stroke-width="1.2" stroke-dasharray="3 3" rx="4"/>
    <text x="353" y="266" text-anchor="middle" font-size="11" fill="#999">5</text>
    <rect x="372" y="248" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="387" y="266" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold">6</text>

    <!-- Row C -->
    <text x="160" y="300" text-anchor="end" font-size="9.5" fill="#8a6d1f" font-weight="bold">f | (f &lt;&lt; 4)：</text>
    <rect x="168" y="284" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="183" y="302" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">0</text>
    <rect x="202" y="284" width="30" height="26" fill="#ffffff" stroke="#9db4c9" stroke-width="1.2" stroke-dasharray="3 3" rx="4"/>
    <text x="217" y="302" text-anchor="middle" font-size="11" fill="#999">1</text>
    <rect x="236" y="284" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="251" y="302" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">2</text>
    <rect x="270" y="284" width="30" height="26" fill="#ffffff" stroke="#9db4c9" stroke-width="1.2" stroke-dasharray="3 3" rx="4"/>
    <text x="285" y="302" text-anchor="middle" font-size="11" fill="#999">3</text>
    <rect x="304" y="284" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="319" y="302" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold">4</text>
    <rect x="338" y="284" width="30" height="26" fill="#ffffff" stroke="#9db4c9" stroke-width="1.2" stroke-dasharray="3 3" rx="4"/>
    <text x="353" y="302" text-anchor="middle" font-size="11" fill="#999">5</text>
    <rect x="372" y="284" width="30" height="26" fill="#fff8e1" stroke="#b85450" stroke-width="2.4" rx="4"/>
    <text x="387" y="302" text-anchor="middle" font-size="11" fill="#a03934" font-weight="bold">6</text>

    <!-- 观察 4 注记 -->
    <rect x="412" y="212" width="72" height="98" fill="#ffffff" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3" rx="6"/>
    <text x="448" y="230" text-anchor="middle" font-size="9" fill="#a03934" font-weight="bold">观察 4：</text>
    <text x="448" y="248" text-anchor="middle" font-size="9" fill="#a03934">和 &gt; nums[i]</text>
    <text x="448" y="264" text-anchor="middle" font-size="9" fill="#a03934">的位是死状态</text>
    <text x="448" y="280" text-anchor="middle" font-size="9" fill="#a03934">转移后清零</text>
    <text x="448" y="296" text-anchor="middle" font-size="9" fill="#a03934">（防膨胀）</text>

    <text x="260" y="328" text-anchor="middle" font-size="9.5" fill="#8a6d1f" font-weight="bold">2 + 4 = 6 首次命中 nums[4] → 下标 4 的阈值 = 4；灰格 = 凑不出的「洞」</text>
  </g>

  <text x="260" y="352" text-anchor="middle" font-size="9.5" fill="#a03934" filter="url(#rough2)">⚠ 若 nums[4] = 5：总量 6 够用也凑不出 5——离散有洞，正是与 3356 连续模型的分野</text>
</svg>
