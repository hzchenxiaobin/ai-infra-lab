<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 498" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="498" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 2 演算：r = 5，圆心 (0,4) 覆盖 5 枚飞镖</text>

  <!-- Faint axes -->
  <path d="M 70 240 L 400 240" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <path d="M 210 40 L 210 262" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="404" y="244" font-size="9.5" fill="#aaa">x</text>
  <text x="214" y="46" font-size="9.5" fill="#aaa">y</text>

  <!-- The winning circle (center (0,4), r=5 -> px (210,152), r=110) -->
  <circle cx="210" cy="152" r="110" fill="#e8f0fe" fill-opacity="0.28" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- radius line center -> (5,4) on boundary -->
  <path d="M 210 152 L 320 152" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="262" y="146" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">r = 5</text>

  <!-- Center (0,4) -->
  <circle cx="210" cy="152" r="5" fill="#446688" filter="url(#rough2)"/>
  <text x="218" y="150" font-size="11" fill="#446688" font-weight="bold">圆心 (0,4)</text>

  <!-- Covered darts (red); boundary ones get a ring -->
  <!-- (-3,0) -->
  <circle cx="144" cy="240" r="5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="144" cy="240" r="9" fill="none" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="128" y="256" font-size="10" fill="#333">(−3,0)</text>
  <!-- (3,0) -->
  <circle cx="276" cy="240" r="5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="276" cy="240" r="9" fill="none" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="284" y="256" font-size="10" fill="#333">(3,0)</text>
  <!-- (2,6) interior -->
  <circle cx="254" cy="108" r="5" fill="#b85450" filter="url(#rough2)"/>
  <text x="262" y="104" font-size="10" fill="#333">(2,6)</text>
  <!-- (5,4) boundary -->
  <circle cx="320" cy="152" r="5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="320" cy="152" r="9" fill="none" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="328" y="148" font-size="10" fill="#333">(5,4)</text>
  <!-- (0,9) boundary -->
  <circle cx="210" cy="42" r="5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="210" cy="42" r="9" fill="none" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="218" y="40" font-size="10" fill="#333">(0,9)</text>
  <!-- (7,8) outside (gray) -->
  <circle cx="364" cy="64" r="5" fill="#aaa" filter="url(#rough2)"/>
  <text x="372" y="62" font-size="10" fill="#888">(7,8) ✗在圆外</text>

  <text x="70" y="262" font-size="9.5" fill="#b85450">带圈 = 落在边界（dist = r）</text>

  <!-- Divider -->
  <path d="M 40 276 L 520 276" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Table header -->
  <rect x="40" y="286" width="480" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="100" y="303" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">飞镖</text>
  <text x="240" y="303" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">到 (0,4) 距离</text>
  <text x="370" y="303" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">≤ r = 5 ?</text>
  <text x="470" y="303" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">位置</text>

  <!-- Rows -->
  <rect x="40" y="314" width="480" height="22" fill="#e6f4ea" stroke="#eee" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="100" y="329" text-anchor="middle" font-size="10.5" fill="#333">(−3,0)</text>
  <text x="240" y="329" text-anchor="middle" font-size="10.5" fill="#333">√(9+16) = 5</text>
  <text x="370" y="329" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="470" y="329" text-anchor="middle" font-size="10.5" fill="#b85450">边界</text>

  <rect x="40" y="338" width="480" height="22" fill="#fafafa" stroke="#eee" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="100" y="353" text-anchor="middle" font-size="10.5" fill="#333">(3,0)</text>
  <text x="240" y="353" text-anchor="middle" font-size="10.5" fill="#333">5</text>
  <text x="370" y="353" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="470" y="353" text-anchor="middle" font-size="10.5" fill="#b85450">边界</text>

  <rect x="40" y="362" width="480" height="22" fill="#fafafa" stroke="#eee" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="100" y="377" text-anchor="middle" font-size="10.5" fill="#333">(2,6)</text>
  <text x="240" y="377" text-anchor="middle" font-size="10.5" fill="#333">√8 ≈ 2.83</text>
  <text x="370" y="377" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="470" y="377" text-anchor="middle" font-size="10.5" fill="#4a7a3a">内部</text>

  <rect x="40" y="386" width="480" height="22" fill="#fafafa" stroke="#eee" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="100" y="401" text-anchor="middle" font-size="10.5" fill="#333">(5,4)</text>
  <text x="240" y="401" text-anchor="middle" font-size="10.5" fill="#333">5</text>
  <text x="370" y="401" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="470" y="401" text-anchor="middle" font-size="10.5" fill="#b85450">边界</text>

  <rect x="40" y="410" width="480" height="22" fill="#fafafa" stroke="#eee" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="100" y="425" text-anchor="middle" font-size="10.5" fill="#333">(0,9)</text>
  <text x="240" y="425" text-anchor="middle" font-size="10.5" fill="#333">5</text>
  <text x="370" y="425" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="470" y="425" text-anchor="middle" font-size="10.5" fill="#b85450">边界</text>

  <rect x="40" y="434" width="480" height="22" fill="#fce4ec" stroke="#eee" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="100" y="449" text-anchor="middle" font-size="10.5" fill="#888">(7,8)</text>
  <text x="240" y="449" text-anchor="middle" font-size="10.5" fill="#888">√65 ≈ 8.06</text>
  <text x="370" y="449" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">✗</text>
  <text x="470" y="449" text-anchor="middle" font-size="10.5" fill="#888">圆外</text>

  <!-- Conclusion -->
  <rect x="40" y="464" width="480" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="480" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">点对 (−3,0)–(3,0)：M=(0,0)，h=√(25−9)=4 → 圆心 (0,±4)；(0,4) 计数 5 → ans = 5 ✓</text>
</svg>
