<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">好人陈述 = 硬约束，坏人陈述 = 自由量</text>

  <text x="30" y="68" font-size="12" fill="#888">陈述者 i 的角色决定陈述 st[i][j] 的处理：</text>

  <!-- Good person: hard constraint -->
  <rect x="40" y="84" width="260" height="150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="170" y="108" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">i 是好人 (g_i = 1)</text>
  <text x="170" y="128" text-anchor="middle" font-size="11" fill="#555">只说真话 → 硬约束</text>

  <rect x="60" y="142" width="220" height="30" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="162" text-anchor="middle" font-size="11" fill="#333">st[i][j] 必须 = g_j</text>

  <rect x="60" y="180" width="220" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="198" text-anchor="middle" font-size="11" fill="#333">st[i][j]=1 → j 必好人</text>
  <text x="170" y="214" text-anchor="middle" font-size="11" fill="#333">st[i][j]=0 → j 必坏人</text>

  <!-- Bad person: free -->
  <rect x="330" y="84" width="260" height="150" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="460" y="108" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">i 是坏人 (g_i = 0)</text>
  <text x="460" y="128" text-anchor="middle" font-size="11" fill="#555">可真可假 → 自由量</text>

  <rect x="350" y="142" width="220" height="30" fill="#fff" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="460" y="162" text-anchor="middle" font-size="11" fill="#333">st[i][j] 与 g_j 无关</text>

  <rect x="350" y="180" width="220" height="44" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="460" y="198" text-anchor="middle" font-size="11" fill="#888">无论是否一致</text>
  <text x="460" y="214" text-anchor="middle" font-size="11" fill="#888">→ 直接忽略，不校验</text>

  <!-- Consistency formula -->
  <text x="30" y="266" font-size="12" fill="#555" font-weight="bold">自洽判定（只看好人）：</text>

  <rect x="40" y="278" width="540" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="302" text-anchor="middle" font-size="13" fill="#333">∀ i (g_i = 1),  ∀ j (st[i][j] ≠ 2):</text>
  <text x="310" y="322" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">g_j  =  st[i][j]</text>

  <!-- Key insight arrows -->
  <text x="30" y="362" font-size="12" fill="#555" font-weight="bold">关键直觉：</text>

  <rect x="40" y="374" width="180" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="130" y="396" text-anchor="middle" font-size="11" fill="#333">好人陈述</text>
  <text x="130" y="414" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">→ 约束系统</text>
  <path d="M 222 404 L 258 404" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="270" y="374" width="180" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="360" y="396" text-anchor="middle" font-size="11" fill="#333">坏人陈述</text>
  <text x="360" y="414" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">→ 不约束系统</text>

  <rect x="470" y="374" width="110" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="525" y="396" text-anchor="middle" font-size="11" fill="#333">忽略</text>
  <text x="525" y="414" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">→ continue</text>
  <path d="M 452 404 L 468 404" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <text x="310" y="448" text-anchor="middle" font-size="11" fill="#888">坏人的“说假话能力”使他的陈述无法证伪任何分配</text>
</svg>
