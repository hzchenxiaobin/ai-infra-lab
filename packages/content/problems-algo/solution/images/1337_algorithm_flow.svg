<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：二分计数 → 构造二元组 → 排序 → 取前 k</text>

  <!-- Start -->
  <rect x="200" y="40" width="160" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">kWeakestRows(mat, k)</text>

  <path d="M 280 70 L 280 86" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 1: binary search per row -->
  <rect x="110" y="88" width="340" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="120" y="109" font-size="11" fill="#333">① 对每行二分找首个 0，得战斗力 count[i]</text>
  <text x="478" y="109" font-size="10" fill="#888" text-anchor="end">O(m log n)</text>

  <path d="M 280 122 L 280 138" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 2: build pairs -->
  <rect x="110" y="140" width="340" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="120" y="161" font-size="11" fill="#333">② 构造二元组 pairs[i] = (count[i], i)</text>
  <text x="478" y="161" font-size="10" fill="#888" text-anchor="end">O(m)</text>

  <path d="M 280 174 L 280 190" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 3: sort -->
  <rect x="110" y="192" width="340" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="120" y="213" font-size="11" fill="#333">③ 按 (战斗力, 行号) 升序排序</text>
  <text x="478" y="213" font-size="10" fill="#888" text-anchor="end">O(m log m)</text>

  <path d="M 280 226 L 280 242" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 4: take first k -->
  <rect x="110" y="244" width="340" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="120" y="265" font-size="11" fill="#333">④ 取前 k 个二元组的行号 i</text>
  <text x="478" y="265" font-size="10" fill="#888" text-anchor="end">O(k)</text>

  <path d="M 280 278 L 280 294" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- End -->
  <rect x="200" y="296" width="160" height="30" rx="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="316" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return [行号…]</text>

  <!-- side note: sort vs heap -->
  <rect x="40" y="346" width="480" height="120" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="60" y="370" font-size="12" fill="#444" font-weight="bold">排序 vs 堆：如何选？</text>
  <text x="60" y="392" font-size="11" fill="#555">• m 较小（本题 ≤ 100）：直接排序 O(m log m)，代码简洁</text>
  <text x="60" y="410" font-size="11" fill="#555">• m 很大且 k ≪ m：维护大小为 k 的最大堆 O(m log k)</text>
  <text x="60" y="428" font-size="11" fill="#555">• 堆比较器：按 (count, index) 比较，堆顶 = 当前 k 弱中的最强「守门员」</text>
  <text x="60" y="446" font-size="11" fill="#555">• 堆弹出后需逆序填结果（堆顶最强放末尾，最弱者放最前）</text>
</svg>
