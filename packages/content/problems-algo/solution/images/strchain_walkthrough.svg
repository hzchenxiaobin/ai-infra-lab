<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="6" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fdfcf7"/>

  <text x="310" y="30" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold">示例演算：words = ["a","b","ba","bca","bda","bdca"]</text>
  <path d="M 200 40 Q 310 48 420 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="310" y="54" text-anchor="middle" font-size="11" fill="#888">按长度升序处理后逐词填 dp</text>

  <!-- 表头 -->
  <text x="50" y="86" font-size="11" fill="#888" font-weight="bold">序号</text>
  <text x="120" y="86" font-size="11" fill="#888" font-weight="bold">word</text>
  <text x="210" y="86" font-size="11" fill="#888" font-weight="bold">枚举前身（删一字符）</text>
  <text x="480" y="86" font-size="11" fill="#888" font-weight="bold">dp[word]</text>

  <path d="M 40 92 L 580 92" stroke="#ccc" stroke-width="1" filter="url(#sk)"/>

  <!-- Row 1: a -->
  <text x="62" y="114" text-anchor="middle" font-size="12" fill="#888">1</text>
  <rect x="95" y="100" width="50" height="22" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2" rx="4" filter="url(#sk)"/>
  <text x="120" y="116" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">"a"</text>
  <text x="210" y="116" font-size="11" fill="#888">删 → ""（空串，不在表中）</text>
  <rect x="455" y="100" width="50" height="22" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" rx="4" filter="url(#sk)"/>
  <text x="480" y="116" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold">1</text>

  <!-- Row 2: b -->
  <text x="62" y="146" text-anchor="middle" font-size="12" fill="#888">2</text>
  <rect x="95" y="132" width="50" height="22" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2" rx="4" filter="url(#sk)"/>
  <text x="120" y="148" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">"b"</text>
  <text x="210" y="148" font-size="11" fill="#888">删 → ""（空串，不在表中）</text>
  <rect x="455" y="132" width="50" height="22" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" rx="4" filter="url(#sk)"/>
  <text x="480" y="148" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold">1</text>

  <!-- Row 3: ba -->
  <text x="62" y="178" text-anchor="middle" font-size="12" fill="#888">3</text>
  <rect x="95" y="164" width="50" height="22" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2" rx="4" filter="url(#sk)"/>
  <text x="120" y="180" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">"ba"</text>
  <text x="210" y="180" font-size="11" fill="#444">删 b → "a" ✓ dp["a"]=1</text>
  <text x="360" y="180" font-size="11" fill="#888">删 a → "b" ✓ dp["b"]=1</text>
  <rect x="455" y="164" width="50" height="22" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" rx="4" filter="url(#sk)"/>
  <text x="480" y="180" text-anchor="middle" font-size="13" fill="#4a8e4a" font-weight="bold">2</text>

  <!-- Row 4: bca -->
  <text x="62" y="210" text-anchor="middle" font-size="12" fill="#888">4</text>
  <rect x="95" y="196" width="50" height="22" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2" rx="4" filter="url(#sk)"/>
  <text x="120" y="212" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">"bca"</text>
  <text x="210" y="212" font-size="11" fill="#444">删 b → "ca" ✗</text>
  <text x="300" y="212" font-size="11" fill="#444">删 c → "ba" ✓ dp=2</text>
  <text x="420" y="212" font-size="11" fill="#444">删 a → "bc" ✗</text>
  <rect x="455" y="196" width="50" height="22" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" rx="4" filter="url(#sk)"/>
  <text x="480" y="212" text-anchor="middle" font-size="13" fill="#4a8e4a" font-weight="bold">3</text>

  <!-- Row 5: bda -->
  <text x="62" y="242" text-anchor="middle" font-size="12" fill="#888">5</text>
  <rect x="95" y="228" width="50" height="22" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2" rx="4" filter="url(#sk)"/>
  <text x="120" y="244" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">"bda"</text>
  <text x="210" y="244" font-size="11" fill="#444">删 b → "da" ✗</text>
  <text x="300" y="244" font-size="11" fill="#444">删 d → "ba" ✓ dp=2</text>
  <text x="420" y="244" font-size="11" fill="#444">删 a → "bd" ✗</text>
  <rect x="455" y="228" width="50" height="22" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" rx="4" filter="url(#sk)"/>
  <text x="480" y="244" text-anchor="middle" font-size="13" fill="#4a8e4a" font-weight="bold">3</text>

  <!-- Row 6: bdca -->
  <text x="62" y="274" text-anchor="middle" font-size="12" fill="#888">6</text>
  <rect x="95" y="260" width="50" height="22" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8" rx="4" filter="url(#sk)"/>
  <text x="120" y="276" text-anchor="middle" font-size="12" fill="#c98a2b" font-weight="bold">"bdca"</text>
  <text x="210" y="276" font-size="11" fill="#444">删 b → "dca" ✗</text>
  <text x="300" y="276" font-size="11" fill="#444">删 d → "bca" ✓ dp=3</text>
  <text x="420" y="276" font-size="11" fill="#444">删 c → "bda" ✓ dp=3</text>
  <rect x="455" y="260" width="50" height="22" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8" rx="4" filter="url(#sk)"/>
  <text x="480" y="276" text-anchor="middle" font-size="14" fill="#c98a2b" font-weight="bold">4</text>

  <path d="M 40 290 L 580 290" stroke="#ccc" stroke-width="1" filter="url(#sk)"/>

  <!-- 最长链回溯 -->
  <g filter="url(#sk)">
    <rect x="40" y="302" width="540" height="108" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5,3"/>
  </g>
  <text x="60" y="324" font-size="12" fill="#2b2b2b" font-weight="bold">最长链回溯（dp["bdca"]=4 为全局最优）：</text>

  <rect x="60" y="338" width="70" height="28" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5" rx="4" filter="url(#sk)"/>
  <text x="95" y="357" text-anchor="middle" font-size="12" fill="#c98a2b" font-weight="bold">"bdca"</text>

  <path d="M 130 352 L 150 352" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="140" y="346" text-anchor="middle" font-size="9" fill="#888">删 d</text>

  <rect x="150" y="338" width="70" height="28" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3" rx="4" filter="url(#sk)"/>
  <text x="185" y="357" text-anchor="middle" font-size="12" fill="#4a8e4a" font-weight="bold">"bca"</text>

  <path d="M 220 352 L 240 352" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="230" y="346" text-anchor="middle" font-size="9" fill="#888">删 c</text>

  <rect x="240" y="338" width="60" height="28" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3" rx="4" filter="url(#sk)"/>
  <text x="270" y="357" text-anchor="middle" font-size="12" fill="#4a8e4a" font-weight="bold">"ba"</text>

  <path d="M 300 352 L 320 352" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="310" y="346" text-anchor="middle" font-size="9" fill="#888">删 b</text>

  <rect x="320" y="338" width="60" height="28" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" rx="4" filter="url(#sk)"/>
  <text x="350" y="357" text-anchor="middle" font-size="12" fill="#4a8edb" font-weight="bold">"a"</text>

  <text x="400" y="357" font-size="11" fill="#888">链长 = 4</text>

  <text x="60" y="392" font-size="11" fill="#c98a2b" font-weight="bold">答案 = max(dp) = 4</text>
  <text x="60" y="406" font-size="10.5" fill="#888">时间 O(N·L²)，空间 O(N·L)；N=词数, L=最大词长</text>
</svg>
