<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#999999"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：定左端点 l，r 向右生长 + 首次出现 O(1) 判定</text>

  <rect x="215" y="30" width="90" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="11" filter="url(#rough2)"/>
  <text x="260" y="45" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>

  <path d="M 260 52 L 260 60" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="62" width="300" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="78" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">外层：枚举左端点 l = 0 … n−1（ans ≥ n−l 则 break）</text>

  <path d="M 260 86 L 260 94" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="96" width="280" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="112" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">初始化：odd = even = 0，本轮标记 = l</text>

  <path d="M 260 120 L 260 128" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="130" width="240" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="146" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">① r 右移一格，x = nums[r]</text>

  <path d="M 260 154 L 260 164" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 A：首次出现？ -->
  <path d="M 260 166 L 350 186 L 260 206 L 170 186 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="183" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ver[x] ≠ l ?</text>
  <text x="260" y="197" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">（窗口内首次出现）</text>

  <path d="M 260 206 L 260 214" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="213" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="120" y="216" width="280" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="232" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">② ver[x] = l；奇 → odd++ ／ 偶 → even++</text>

  <path d="M 260 240 L 260 250" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 B：平衡判定 -->
  <path d="M 260 252 L 352 272 L 260 292 L 168 272 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="276" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">odd == even ?</text>

  <path d="M 260 292 L 260 298" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="298" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="145" y="300" width="230" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="316" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans = max(ans, r − l + 1)</text>

  <path d="M 260 324 L 260 332" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="185" y="334" width="150" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="12" filter="url(#rough2)"/>
  <text x="260" y="350" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">return ans</text>

  <!-- 否（重复值）：绕过 ② 直达判定 -->
  <path d="M 350 186 L 432 186 L 432 272 L 358 272" fill="none" stroke="#999999" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="360" y="180" font-size="10" fill="#b85450" filter="url(#rough2)">否（重复值）</text>

  <!-- 否：r++ 继续内层 -->
  <path d="M 168 272 L 55 272 L 55 150 L 134 150" fill="none" stroke="#999999" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="150" y="264" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <text x="62" y="168" font-size="10" fill="#999" filter="url(#rough2)">r++ 继续</text>

  <!-- 更新后：r++ 继续内层 -->
  <path d="M 375 312 L 480 312 L 480 142 L 386 142" fill="none" stroke="#999999" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="404" y="328" font-size="10" fill="#999" filter="url(#rough2)">更新后 r++ 继续</text>

  <!-- r 走完：l++ 进入下一轮外层 -->
  <path d="M 140 136 L 25 136 L 25 74 L 104 74" fill="none" stroke="#999999" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="30" y="66" font-size="10" fill="#999" filter="url(#rough2)">r 走完 → l++</text>

  <text x="16" y="392" font-size="10" fill="#999" filter="url(#rough2)">O(n²)：n ≤ 1500 稳过 · 时间戳 ver 免去每轮清空</text>
</svg>
