<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="780" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="390" y="28" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">核心概念：CASE 分流造列，AVG 忽略 NULL</text>
  <path d="M 200 36 Q 390 44 580 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== Left: one group's rows + CASE columns ===== -->
  <text x="40" y="62" font-size="11" fill="#888">① GROUP BY user_id 后的一组（用户 1 的 6 行 + 示意的 cancelled 行）</text>
  <g filter="url(#rough2)"><rect x="40" y="70" width="340" height="244" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6"/></g>
  <text x="100" y="88" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">type: 分钟</text>
  <text x="215" y="88" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">CASE trial</text>
  <text x="325" y="88" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">CASE paid</text>
  <line x1="40" y1="94" x2="380" y2="94" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="160" y1="70" x2="160" y2="314" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="270" y1="70" x2="270" y2="314" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 1: trial 45 -->
  <g filter="url(#rough2)"><rect x="44" y="98" width="112" height="26" fill="#dbeafe" stroke="#4a8edb" stroke-width="1" rx="4"/></g>
  <text x="100" y="115" text-anchor="middle" font-size="10" fill="#4a8edb">free_trial 45</text>
  <text x="215" y="115" text-anchor="middle" font-size="11" fill="#4a8edb" font-weight="bold">45</text>
  <text x="325" y="115" text-anchor="middle" font-size="10" fill="#999" font-style="italic">NULL</text>

  <!-- row 2: trial 30 -->
  <g filter="url(#rough2)"><rect x="44" y="130" width="112" height="26" fill="#dbeafe" stroke="#4a8edb" stroke-width="1" rx="4"/></g>
  <text x="100" y="147" text-anchor="middle" font-size="10" fill="#4a8edb">free_trial 30</text>
  <text x="215" y="147" text-anchor="middle" font-size="11" fill="#4a8edb" font-weight="bold">30</text>
  <text x="325" y="147" text-anchor="middle" font-size="10" fill="#999" font-style="italic">NULL</text>

  <!-- row 3: trial 60 -->
  <g filter="url(#rough2)"><rect x="44" y="162" width="112" height="26" fill="#dbeafe" stroke="#4a8edb" stroke-width="1" rx="4"/></g>
  <text x="100" y="179" text-anchor="middle" font-size="10" fill="#4a8edb">free_trial 60</text>
  <text x="215" y="179" text-anchor="middle" font-size="11" fill="#4a8edb" font-weight="bold">60</text>
  <text x="325" y="179" text-anchor="middle" font-size="10" fill="#999" font-style="italic">NULL</text>

  <!-- row 4: paid 75 -->
  <g filter="url(#rough2)"><rect x="44" y="194" width="112" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4"/></g>
  <text x="100" y="211" text-anchor="middle" font-size="10" fill="#4a7a3a">paid 75</text>
  <text x="215" y="211" text-anchor="middle" font-size="10" fill="#999" font-style="italic">NULL</text>
  <text x="325" y="211" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">75</text>

  <!-- row 5: paid 90 -->
  <g filter="url(#rough2)"><rect x="44" y="226" width="112" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4"/></g>
  <text x="100" y="243" text-anchor="middle" font-size="10" fill="#4a7a3a">paid 90</text>
  <text x="215" y="243" text-anchor="middle" font-size="10" fill="#999" font-style="italic">NULL</text>
  <text x="325" y="243" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">90</text>

  <!-- row 6: paid 65 -->
  <g filter="url(#rough2)"><rect x="44" y="258" width="112" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4"/></g>
  <text x="100" y="275" text-anchor="middle" font-size="10" fill="#4a7a3a">paid 65</text>
  <text x="215" y="275" text-anchor="middle" font-size="10" fill="#999" font-style="italic">NULL</text>
  <text x="325" y="275" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">65</text>

  <!-- row 7: cancelled 0 -->
  <g filter="url(#rough2)"><rect x="44" y="290" width="112" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4"/></g>
  <text x="100" y="306" text-anchor="middle" font-size="10" fill="#b85450">cancelled 0</text>
  <text x="215" y="306" text-anchor="middle" font-size="10" fill="#999" font-style="italic">NULL</text>
  <text x="325" y="306" text-anchor="middle" font-size="10" fill="#999" font-style="italic">NULL</text>

  <!-- Arrows to AVG boxes -->
  <path d="M 382 140 C 410 130 420 130 438 132" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 382 245 C 410 255 420 255 438 253" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Right top: AVG trial ===== -->
  <g filter="url(#rough2)"><rect x="442" y="106" width="300" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8"/></g>
  <text x="592" y="128" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">AVG(CASE trial) — NULL 全部跳过</text>
  <text x="592" y="148" text-anchor="middle" font-size="11" fill="#446688">(45+30+60) / 3 = <tspan font-weight="bold" font-size="13">45.00</tspan></text>

  <!-- ===== Right bottom: AVG paid ===== -->
  <g filter="url(#rough2)"><rect x="442" y="228" width="300" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/></g>
  <text x="592" y="250" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">AVG(CASE paid) — NULL 全部跳过</text>
  <text x="592" y="270" text-anchor="middle" font-size="11" fill="#4a7a3a">(75+90+65) / 3 = <tspan font-weight="bold" font-size="13">76.67</tspan></text>

  <!-- ===== Bottom note ===== -->
  <g filter="url(#rough2)"><rect x="40" y="336" width="700" height="72" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/></g>
  <text x="60" y="358" font-size="12" fill="#a06a10" font-weight="bold">⭐ CASE 不写 ELSE → 不匹配的行变 NULL，AVG 的分母只数非 NULL 行（cancelled 行两列皆 NULL）</text>
  <text x="60" y="380" font-size="11" fill="#a06a10">• 一次 GROUP BY 同时产出两个平均：表只扫一遍，无需两条子查询再 JOIN</text>
  <text x="60" y="398" font-size="11" fill="#a06a10">• 平均的分母 = 有记录的天数，不是 7 天试用期的自然天数</text>
</svg>
