<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：一趟后序遍历填满双状态</text>
  <text x="260" y="38" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">迭代 DFS 防爆栈 · long long 防溢出</text>

  <!-- 左列：五步 -->
  <rect x="40" y="56" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="140" y="76" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">① 建邻接表 g</text>
  <text x="140" y="92" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">无向边 + 权重</text>

  <line x1="140" y1="100" x2="140" y2="116" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="118" width="200" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="140" y="138" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">② 迭代 DFS（显式栈）</text>
  <text x="140" y="154" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">收集 order、parent[]</text>

  <line x1="140" y1="162" x2="140" y2="178" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="180" width="200" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="140" y="200" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">③ 逆序扫 order（后序）</text>
  <text x="140" y="216" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">孩子先算，父亲后算</text>

  <line x1="140" y1="224" x2="140" y2="240" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="242" width="200" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="140" y="262" text-anchor="middle" font-size="11" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">④ 逐节点填 dp[u][0/1]</text>
  <text x="140" y="278" text-anchor="middle" font-size="9.5" fill="#8a3a34" filter="url(#rough2)">base + 排序取正 gain</text>

  <line x1="140" y1="286" x2="140" y2="302" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="304" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="140" y="328" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">⑤ 返回 dp[0][0]</text>

  <!-- 连线 ④ → 右侧展开 -->
  <path d="M 240 264 C 256 264 256 140 268 136" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 右列：④ 展开 -->
  <rect x="272" y="56" width="236" height="150" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="390" y="76" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">④ 的展开（对每个节点 u）</text>
  <text x="390" y="96" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">跳过父边，遍历孩子 v：</text>
  <text x="390" y="112" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">base += dp[v][0]</text>
  <text x="390" y="128" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">gain = dp[v][1] + w − dp[v][0]</text>
  <text x="390" y="148" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">gains 降序排序后：</text>
  <text x="390" y="164" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">dp[u][0] = base + 前 k 个正 gain</text>
  <text x="390" y="180" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">dp[u][1] = base + 前 k−1 个正 gain</text>
  <text x="390" y="198" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">（gain ≤ 0 一律不取）</text>

  <!-- 右列：工程坑 -->
  <rect x="272" y="220" width="236" height="78" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="390" y="240" text-anchor="middle" font-size="11" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">⚠ 两个工程坑</text>
  <text x="390" y="258" text-anchor="middle" font-size="9.5" fill="#8a3a34" filter="url(#rough2)">链状树递归深 1e5：Python 必爆栈</text>
  <text x="390" y="274" text-anchor="middle" font-size="9.5" fill="#8a3a34" filter="url(#rough2)">→ 迭代 DFS（显式栈）</text>
  <text x="390" y="292" text-anchor="middle" font-size="9.5" fill="#8a3a34" filter="url(#rough2)">Σw ≤ 1e5×1e6 = 1e11 → long long</text>

  <!-- 右列：复杂度 -->
  <rect x="272" y="310" width="236" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="390" y="328" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">时间 O(n log n)：排序 gains</text>
  <text x="390" y="344" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">空间 O(n)</text>
</svg>
