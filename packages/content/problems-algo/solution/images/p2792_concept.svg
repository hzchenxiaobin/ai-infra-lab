<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 Z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">「足够大」：后代中至少有 k 个值 &lt; node.val</text>

  <!-- 树 [7,6,5,4,3,2,1] -->
  <!-- 连线 -->
  <line x1="252" y1="86" x2="200" y2="138" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="268" y1="86" x2="320" y2="138" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="188" y1="152" x2="162" y2="200" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="202" y1="152" x2="226" y2="200" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="318" y1="152" x2="294" y2="200" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="332" y1="152" x2="358" y2="200" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- 根 7：足够大 → 绿框 -->
  <circle cx="260" cy="72" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="260" y="78" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">7</text>
  <text x="290" y="76" font-size="13" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <!-- 内部后代 6,5,4,3：普通蓝 -->
  <circle cx="196" cy="142" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="196" y="147" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">6</text>
  <circle cx="324" cy="142" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="324" y="147" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">5</text>
  <circle cx="158" cy="208" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="158" y="213" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">4</text>
  <circle cx="230" cy="208" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="213" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">3</text>

  <!-- k=2 最小后代：1,2 → 高亮绿 -->
  <circle cx="290" cy="208" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="290" y="213" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <circle cx="362" cy="208" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="362" y="213" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <!-- 指向 k 个最小后代的标注 -->
  <path d="M300,232 C300,250 330,250 356,228" stroke="#4a7a3a" stroke-width="1.6"
        stroke-dasharray="5 4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="336" y="256" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">k=2 个最小后代 {1,2}</text>

  <!-- 结论框 -->
  <rect x="60" y="278" width="400" height="62" fill="#fff8e1"
        stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="300" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">后代升序：1, 2, 3, 4, 5, 6 → 第 k=2 小 = 2</text>
  <text x="260" y="322" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">7 &gt; 2 → 节点 7 足够大 ✓</text>
</svg>
