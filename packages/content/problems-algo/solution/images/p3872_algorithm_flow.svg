<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：两趟游程预处理 + 枚举替换位三类候选</text>

  <!-- 第一行：两个游程数组 -->
  <g filter="url(#rough2)">
    <rect x="26" y="40" width="240" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="146" y="60" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold">① 正向一趟：left[i]</text>
    <text x="146" y="77" text-anchor="middle" font-size="9.5" fill="#33506b">以 i 结尾的最长等差游程</text>
    <text x="146" y="90" text-anchor="middle" font-size="9" fill="#66788c">公差延续 ⟹ +1；断链重开为 2（任意两数等差）</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="294" y="40" width="240" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="414" y="60" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold">② 反向一趟：right[i]</text>
    <text x="414" y="77" text-anchor="middle" font-size="9.5" fill="#33506b">从 i 开始的最长等差游程</text>
    <text x="414" y="90" text-anchor="middle" font-size="9" fill="#66788c">公差延续 ⟹ +1；断链重开为 2（镜像）</text>
  </g>

  <!-- 汇合箭头 -->
  <path d="M 146 100 L 146 112" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 414 100 L 414 112" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 基线 -->
  <g filter="url(#rough2)">
    <rect x="110" y="116" width="340" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="280" y="136" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">③ 基线：ans = max(left[i])——不换 / 子数组不含替换位</text>
  </g>

  <path d="M 280 150 L 280 162" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 枚举替换位 -->
  <g filter="url(#rough2)">
    <rect x="140" y="166" width="280" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="280" y="186" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold">④ 枚举替换位 i ∈ [0, n−1]，三类候选打擂</text>
  </g>

  <!-- 三路箭头 -->
  <path d="M 240 196 C 180 200, 130 200, 103 206" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 280 196 L 280 206" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 320 196 C 380 200, 430 200, 457 206" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- 三类候选框 -->
  <g filter="url(#rough2)">
    <rect x="20" y="210" width="166" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="103" y="229" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">只接左（i ≥ 1）</text>
    <text x="103" y="246" text-anchor="middle" font-size="9.5" fill="#66788c">候选 = left[i−1] + 1</text>
    <text x="103" y="262" text-anchor="middle" font-size="9" fill="#66788c">新值 x = a + dL，恒可行</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="197" y="210" width="166" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="280" y="229" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold">只接右（i ≤ n−2）</text>
    <text x="280" y="246" text-anchor="middle" font-size="9.5" fill="#66788c">候选 = right[i+1] + 1</text>
    <text x="280" y="262" text-anchor="middle" font-size="9" fill="#66788c">新值 x = b − dR，恒可行</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="374" y="210" width="166" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="457" y="229" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold">居中搭桥（1 ≤ i ≤ n−2）</text>
    <text x="457" y="246" text-anchor="middle" font-size="9.5" fill="#66788c">b − a 为偶 ⟹ d = (b−a)/2</text>
    <text x="457" y="262" text-anchor="middle" font-size="9" fill="#66788c">候选 = lv + 1 + rv（奇数跳过）</text>
  </g>

  <!-- 汇入说明条 -->
  <path d="M 103 272 C 140 280, 180 284, 215 286" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 280 272 L 280 284" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 457 272 C 420 280, 380 284, 345 286" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="40" y="290" width="480" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="280" y="308" text-anchor="middle" font-size="9.5" fill="#8a6d1a">lv =（i = 1 或 dL = d）? left[i−1] : 1；rv =（i = n−2 或 dR = d）? right[i+1] : 1</text>
    <text x="280" y="326" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold">公差不匹配的一侧退化为单元素 1——左右解耦，「半桥」分支最易漏</text>
  </g>

  <path d="M 280 336 L 280 346" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- 最终框 -->
  <g filter="url(#rough2)">
    <rect x="150" y="350" width="260" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="280" y="371" text-anchor="middle" font-size="11.5" fill="#8f3a34" font-weight="bold">⑤ ans = max(ans, 全部候选)，返回 ans</text>
  </g>
</svg>
