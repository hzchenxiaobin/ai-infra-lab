<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="16.5" fill="#333" font-weight="bold" filter="url(#rough2)">按 bench_id 分桶，桶内 set 自动去重</text>
  <text x="260" y="50" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">每条记录 [学号, 长椅] ：球（学号）投进对应长椅的桶</text>

  <!-- 记录卡片 -->
  <rect x="75" y="62" width="58" height="32" rx="6" fill="#f0f5fc" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="104" y="83" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">[1,<tspan fill="#a07020" font-weight="bold">2</tspan>]</text>
  <rect x="153" y="62" width="58" height="32" rx="6" fill="#f0f5fc" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="182" y="83" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">[2,<tspan fill="#a07020" font-weight="bold">2</tspan>]</text>
  <rect x="231" y="62" width="58" height="32" rx="6" fill="#f0f5fc" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="83" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">[3,<tspan fill="#4a7a3a" font-weight="bold">3</tspan>]</text>
  <rect x="309" y="62" width="58" height="32" rx="6" fill="#f0f5fc" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="338" y="83" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">[1,<tspan fill="#4a7a3a" font-weight="bold">3</tspan>]</text>
  <rect x="387" y="62" width="58" height="32" rx="6" fill="#f0f5fc" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="416" y="83" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">[2,<tspan fill="#4a7a3a" font-weight="bold">3</tspan>]</text>

  <!-- 投桶箭头 -->
  <path d="M 104 96 C 104 130, 100 134, 100 166" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 182 96 C 182 130, 165 134, 160 166" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 260 96 C 260 130, 315 134, 315 166" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 338 96 C 338 130, 385 134, 385 166" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 416 96 C 416 130, 450 134, 450 166" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 长椅 2 的桶 -->
  <rect x="45" y="170" width="190" height="88" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="191" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">长椅 2 的桶</text>
  <circle cx="95" cy="222" r="15" fill="#fafafa" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="95" y="227" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="160" cy="222" r="15" fill="#fafafa" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="227" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="140" y="251" text-anchor="middle" font-size="12" fill="#2a4a6a" filter="url(#rough2)">|{1,2}| = 2 人</text>

  <!-- 长椅 3 的桶（答案） -->
  <rect x="265" y="170" width="210" height="88" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="370" y="191" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">长椅 3 的桶 ★</text>
  <circle cx="315" cy="222" r="15" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="315" y="227" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <circle cx="370" cy="222" r="15" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="370" y="227" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="425" cy="222" r="15" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="425" y="227" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="370" y="251" text-anchor="middle" font-size="12" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">|{1,2,3}| = 3 人</text>

  <!-- 答案条 -->
  <rect x="110" y="268" width="300" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="290" text-anchor="middle" font-size="14" fill="#a07020" font-weight="bold" filter="url(#rough2)">ans = max(2, 3) = 3</text>

  <!-- 底部警示 -->
  <rect x="25" y="312" width="470" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="329" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">⚠️ 重复登记只算一次：[[1,1],[1,1]] 两次 add(1)，set 幂等 → 答案 1</text>
  <text x="260" y="347" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">学生 1、2 同时在两张长椅各有记录 → 各桶独立计数</text>
</svg>
