<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">回溯流程：选/不选 + 按位与剪枝</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">dfs(i, curMask, curLen)：每节点更新 ans，冲突即跳过</text>

  <g filter="url(#rough2)" font-size="11">
    <!-- 1. Preprocess -->
    <rect x="150" y="60" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="270" y="78" text-anchor="middle" fill="#446688" font-weight="bold">① 预处理：编码 26 位掩码</text>
    <text x="270" y="93" text-anchor="middle" fill="#555" font-size="10" font-family="monospace">丢弃自身重复串 → masks[], lens[]</text>

    <path d="M 270 100 L 270 116" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>

    <!-- 2. Enter node: update ans -->
    <rect x="140" y="118" width="260" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="270" y="136" text-anchor="middle" fill="#4a7a3a" font-weight="bold">② 入节点即更新答案</text>
    <text x="270" y="151" text-anchor="middle" fill="#555" font-size="10" font-family="monospace">ans = max(ans, curLen)</text>

    <path d="M 270 158 L 270 174" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>

    <!-- 3. Decision diamond: j < n ? -->
    <polygon points="270,176 370,212 270,248 170,212" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="270" y="208" text-anchor="middle" fill="#d6a040" font-weight="bold">j &lt; n ?</text>
    <text x="270" y="224" text-anchor="middle" fill="#555" font-size="9">(还有候选串)</text>

    <!-- No -> return -->
    <path d="M 370 212 L 440 212" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>
    <text x="405" y="204" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">否</text>
    <rect x="440" y="194" width="76" height="36" fill="#f5f5f5" stroke="#888" stroke-width="1.3" rx="6"/>
    <text x="478" y="212" text-anchor="middle" fill="#555" font-weight="bold">return</text>
    <text x="478" y="224" text-anchor="middle" fill="#555" font-size="9">(回溯上层)</text>

    <!-- Yes -> down to AND check -->
    <path d="M 270 248 L 270 264" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>
    <text x="282" y="260" font-size="10" fill="#666" font-weight="bold">是</text>

    <!-- 4. AND check diamond -->
    <polygon points="270,266 380,302 270,338 160,302" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="270" y="297" text-anchor="middle" fill="#d6a040" font-weight="bold">curMask &amp;</text>
    <text x="270" y="312" text-anchor="middle" fill="#d6a040" font-weight="bold">masks[j] == 0?</text>

    <!-- overlap -> skip (prune) -->
    <path d="M 160 302 L 90 302" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)"/>
    <text x="125" y="294" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
    <rect x="20" y="284" width="72" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6"/>
    <text x="56" y="302" text-anchor="middle" fill="#b85450" font-weight="bold">跳过 j</text>
    <text x="56" y="316" text-anchor="middle" fill="#b85450" font-size="9">冲突剪枝 ✂</text>

    <!-- disjoint -> include -->
    <path d="M 380 302 L 450 302" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)"/>
    <text x="415" y="294" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
    <rect x="450" y="282" width="80" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="490" y="300" text-anchor="middle" fill="#4a7a3a" font-weight="bold">③ 选入</text>
    <text x="490" y="316" text-anchor="middle" fill="#555" font-size="9" font-family="monospace">curMask|=m</text>
    <text x="490" y="330" text-anchor="middle" fill="#555" font-size="9" font-family="monospace">curLen+=len</text>
    <text x="490" y="340" text-anchor="middle" fill="#555" font-size="9" font-family="monospace">dfs(j+1,..)</text>

    <!-- loop back: skip j increments j and re-enters decision; include also returns to top -->
    <!-- skip path loops back up to decision (j+1) -->
    <path d="M 56 322 L 56 372 L 220 372 L 220 248" stroke="#b85450" stroke-width="1.1" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)"/>
    <text x="140" y="388" font-size="9" fill="#b85450" font-weight="bold">j++ 继续下一候选</text>

    <!-- include returns (递归返回) back to continue loop -->
    <path d="M 490 344 L 490 372 L 320 372 L 320 248" stroke="#4a7a3a" stroke-width="1.1" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)"/>
    <text x="380" y="388" font-size="9" fill="#4a7a3a" font-weight="bold">递归返回，j++ 继续</text>
  </g>

  <!-- ===== Key insight box ===== -->
  <rect x="30" y="396" width="480" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="270" y="410" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">⚠️ 关键：每节点都更新 ans（不只是叶子）；冲突用 O(1) 按位与剪枝</text>
</svg>
