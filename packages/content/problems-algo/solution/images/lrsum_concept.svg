<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：leftSum[i] + nums[i] + rightSum[i] = 总和 T</text>

  <!-- nums row label -->
  <text x="40" y="78" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">nums</text>
  <!-- nums cells: [10, 4, 8, 3], highlight i=1 (the "self" 4) -->
  <!-- left part: 10 -->
  <rect x="80" y="58" width="64" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="112" y="74" text-anchor="middle" font-size="9.5" fill="#4a7a3a">下标 0</text>
  <text x="112" y="93" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">10</text>
  <!-- self: 4 -->
  <rect x="148" y="54" width="64" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="180" y="71" text-anchor="middle" font-size="9.5" fill="#b85450">i = 1</text>
  <text x="180" y="93" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450">4</text>
  <!-- right part: 8, 3 -->
  <rect x="216" y="58" width="64" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="248" y="74" text-anchor="middle" font-size="9.5" fill="#446688">下标 2</text>
  <text x="248" y="93" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">8</text>
  <rect x="284" y="58" width="64" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="316" y="74" text-anchor="middle" font-size="9.5" fill="#446688">下标 3</text>
  <text x="316" y="93" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">3</text>

  <!-- bracket: leftSum over index 0 -->
  <path d="M 80 50 Q 80 42 112 42 Q 144 42 144 50" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="112" y="34" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">leftSum = 10</text>
  <!-- bracket: rightSum over index 2,3 -->
  <path d="M 216 50 Q 216 42 316 42 Q 348 42 348 50" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="282" y="34" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">rightSum = 8+3 = 11</text>

  <!-- i pointer -->
  <path d="M 180 110 L 180 124" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="180" y="138" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">i</text>

  <!-- three-segment identity -->
  <rect x="36" y="160" width="492" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="282" y="180" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">三段守恒（加法结合律）</text>
  <text x="282" y="202" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">leftSum[i] + nums[i] + rightSum[i] = T</text>
  <text x="282" y="218" text-anchor="middle" font-size="11" fill="#888">10 + 4 + 11 = 25 ✓</text>

  <!-- derivation: rightSum = T - leftSum - nums[i] -->
  <path d="M 282 224 L 282 240" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="96" y="244" width="372" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="282" y="269" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">⇒ rightSum[i] = T − leftSum[i] − nums[i]</text>

  <!-- takeaway -->
  <rect x="36" y="300" width="492" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="282" y="320" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">只要手握总和 T 与滚动 leftSum，右侧和即两次减法扣出</text>
  <text x="282" y="340" text-anchor="middle" font-size="11" fill="#888">无需为每个 i 重新累加右侧 → O(n²) 压成 O(n)</text>
  <text x="282" y="356" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">滚动 leftSum：处理 i 时 = 左侧和，算完 answer[i] 后再 += nums[i]</text>
</svg>
