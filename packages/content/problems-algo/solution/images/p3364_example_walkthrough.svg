<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 378"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="378" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：nums = [3, −2, 1, 4]，l = 2，r = 3</text>
  <text x="260" y="38" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">蓝底 = k=2 层，绿底 = k=3 层；✓ = 正和参与取 min，✗ = 和非正直接跳过</text>

  <!-- 表头 -->
  <rect x="25" y="52" width="470" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="47" y="70" text-anchor="middle" font-size="10" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">步骤</text>
  <text x="122" y="70" text-anchor="middle" font-size="10" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">窗口</text>
  <text x="197" y="70" text-anchor="middle" font-size="10" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">长度</text>
  <text x="302" y="70" text-anchor="middle" font-size="10" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">滑窗计算</text>
  <text x="410" y="70" text-anchor="middle" font-size="10" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">sum</text>
  <text x="465" y="70" text-anchor="middle" font-size="10" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">ans</text>

  <!-- 列分隔虚线 -->
  <path d="M 70 82 L 70 240 M 175 82 L 175 240 M 220 82 L 220 240 M 385 82 L 385 240 M 435 82 L 435 240"
        fill="none" stroke="#ddd" stroke-width="1" stroke-dasharray="2 3" filter="url(#rough2)"/>

  <!-- k=2 层 -->
  <rect x="25" y="80" width="470" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="47" y="100" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">1</text>
  <text x="122" y="100" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">[3, −2]</text>
  <text x="197" y="100" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">2</text>
  <text x="302" y="100" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">初始：3 + (−2)</text>
  <text x="410" y="100" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1 ✓</text>
  <text x="465" y="100" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">+∞ → 1</text>

  <rect x="25" y="112" width="470" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="47" y="132" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">2</text>
  <text x="122" y="132" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">[−2, 1]</text>
  <text x="197" y="132" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">2</text>
  <text x="302" y="132" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">1 + nums[2] − nums[0] = −1</text>
  <text x="410" y="132" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1 ✗</text>
  <text x="465" y="132" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">1</text>

  <rect x="25" y="144" width="470" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="47" y="164" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">3</text>
  <text x="122" y="164" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">[1, 4]</text>
  <text x="197" y="164" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">2</text>
  <text x="302" y="164" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">−1 + nums[3] − nums[1] = 5</text>
  <text x="410" y="164" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">5 ✓</text>
  <text x="465" y="164" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">1</text>

  <!-- k=3 层 -->
  <rect x="25" y="176" width="470" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="47" y="196" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">4</text>
  <text x="122" y="196" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">[3, −2, 1]</text>
  <text x="197" y="196" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">3</text>
  <text x="302" y="196" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">初始：3 − 2 + 1</text>
  <text x="410" y="196" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2 ✓</text>
  <text x="465" y="196" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">1</text>

  <rect x="25" y="208" width="470" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="47" y="228" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">5</text>
  <text x="122" y="228" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">[−2, 1, 4]</text>
  <text x="197" y="228" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">3</text>
  <text x="302" y="228" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">2 + nums[3] − nums[0] = 3</text>
  <text x="410" y="228" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3 ✓</text>
  <text x="465" y="228" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">1</text>

  <!-- 结论 -->
  <rect x="25" y="252" width="470" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="277" text-anchor="middle" font-size="11" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">两层全部滑完：最小正和 ans = 1，来自窗口 [3, −2] → 返回 1</text>

  <!-- 边界自查 -->
  <rect x="25" y="304" width="470" height="58" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="38" y="325" font-size="9.5" fill="#333" filter="url(#rough2)">边界自查：示例 2 [-2, 2, -3, 1] 中所有长度 ∈ [2,3] 的窗口和均 ≤ 0（其中 [−2,2] 与</text>
  <text x="38" y="342" font-size="9.5" fill="#333" filter="url(#rough2)">[2,−3,1] 的和恰为 0，卡在「严格大于」红线外）→ 返回 −1；单元素 [0]（l = r = 1）</text>
  <text x="38" y="359" font-size="9.5" fill="#333" filter="url(#rough2)">唯一窗口和为 0，同样不满足「大于 0」→ 返回 −1。</text>
</svg>
