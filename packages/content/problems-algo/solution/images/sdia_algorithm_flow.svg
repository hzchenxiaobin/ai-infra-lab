<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：外层遍历 nums，内层取余拆位、逆序写入 ans</text>

  <!-- ====== Input ====== -->
  <rect x="200" y="38" width="140" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="61" text-anchor="middle" font-size="13" fill="#333">输入 nums</text>
  <path d="M 270 74 L 270 92" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ====== Init ====== -->
  <rect x="190" y="94" width="160" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="117" text-anchor="middle" font-size="12" fill="#333">初始化：ans = [ ]</text>
  <path d="M 270 130 L 270 150" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ====== Diamond: 还有元素? ====== -->
  <polygon points="270,152 360,194 270,236 180,194" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="190" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">还有元素 x?</text>
  <text x="270" y="208" text-anchor="middle" font-size="10" fill="#888">（未遍历完）</text>

  <!-- Yes branch (left) into loop body -->
  <path d="M 180 194 L 80 194 L 80 218" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="128" y="186" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Loop body box -->
  <rect x="20" y="220" width="120" height="130" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="80" y="238" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">循环体</text>
  <text x="80" y="256" text-anchor="middle" font-size="10.5" fill="#555">buf = [], t = x</text>
  <text x="80" y="272" text-anchor="middle" font-size="10.5" fill="#555">while t &gt; 0:</text>
  <text x="80" y="288" text-anchor="middle" font-size="10.5" fill="#555">  buf.append(t%10)</text>
  <text x="80" y="304" text-anchor="middle" font-size="10.5" fill="#555">  t //= 10</text>
  <text x="80" y="320" text-anchor="middle" font-size="10.5" fill="#555">for i = k-1 .. 0:</text>
  <text x="80" y="336" text-anchor="middle" font-size="10.5" fill="#555">  ans.append(buf[i])</text>

  <!-- loop back arrow -->
  <path d="M 80 220 L 80 172 L 178 172 L 178 194" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="120" y="166" text-anchor="middle" font-size="9.5" fill="#888">取下一元素</text>

  <!-- No branch (right) to return -->
  <path d="M 360 194 L 460 194 L 460 218" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="408" y="186" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <rect x="380" y="220" width="140" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="450" y="238" text-anchor="middle" font-size="11" fill="#888">返回 ans</text>
  <text x="450" y="256" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">return ans</text>

  <!-- ====== Bottom note ====== -->
  <rect x="200" y="284" width="320" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="360" y="304" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">两层循环无嵌套放大</text>
  <text x="360" y="322" text-anchor="middle" font-size="10.5" fill="#888">内层次数 = 位数 d ≤ 6，与 n 无关</text>
  <text x="360" y="338" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">总迭代 ≤ 6n，常数极小</text>
</svg>
