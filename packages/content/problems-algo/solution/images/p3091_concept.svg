<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：加法要趁早，复制挑最大值</text>

  <!-- Section A: final shape -->
  <text x="46" y="58" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">终局形态：先把唯一的 1 养成 v，再复制成 m 份</text>

  <rect x="70" y="72" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="88" y="93" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <path d="M 112 88 L 168 88" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="78" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">+1 ×(v−1)</text>

  <rect x="174" y="72" width="36" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="192" y="93" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">v</text>

  <path d="M 216 88 L 272 88" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="244" y="78" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">复制 ×(m−1)</text>

  <rect x="278" y="72" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="296" y="93" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">v</text>
  <rect x="318" y="72" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="336" y="93" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">v</text>
  <rect x="358" y="72" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="376" y="93" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">v</text>
  <text x="410" y="93" font-size="13" fill="#999" filter="url(#rough2)">……</text>

  <text x="470" y="84" font-size="10.5" fill="#333" filter="url(#rough2)">sum = v·m ≥ k</text>
  <text x="470" y="100" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">操作数 = (v−1)+(m−1)</text>

  <!-- Section B: exchange argument -->
  <text x="46" y="152" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">交换论证：为什么 +1 必须放在复制之前？</text>

  <!-- left panel: bad order -->
  <rect x="40" y="164" width="262" height="148" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="171" y="186" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 先复制，后给副本 +1</text>

  <rect x="58" y="206" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="73" y="224" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">v</text>
  <path d="M 94 219 L 124 219" fill="none" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="109" y="211" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">复制</text>
  <rect x="130" y="206" width="24" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="142" y="224" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">v</text>
  <rect x="156" y="206" width="24" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="168" y="224" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">v</text>
  <path d="M 188 219 L 216 219" fill="none" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="202" y="211" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">+1</text>
  <rect x="222" y="206" width="24" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="234" y="224" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">v</text>
  <rect x="248" y="206" width="24" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="224" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">v+1</text>

  <text x="171" y="262" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">和 = v + (v+1) = 2v+1</text>
  <text x="171" y="284" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">那次 +1 没有被复制放大，浪费了</text>

  <!-- right panel: good order -->
  <rect x="318" y="164" width="262" height="148" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="449" y="186" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 先 +1，再复制</text>

  <rect x="336" y="206" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="351" y="224" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">v</text>
  <path d="M 372 219 L 402 219" fill="none" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="387" y="211" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">+1</text>
  <rect x="408" y="206" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="426" y="224" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">v+1</text>
  <path d="M 452 219 L 482 219" fill="none" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="467" y="211" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">复制</text>
  <rect x="488" y="206" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="503" y="224" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">v+1</text>
  <rect x="520" y="206" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="535" y="224" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">v+1</text>

  <text x="449" y="262" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">和 = 2(v+1) = 2v+2</text>
  <text x="449" y="284" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">同样 2 步，多赚 1 → +1 全部前移</text>

  <!-- bottom summary -->
  <rect x="40" y="330" width="540" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="310" y="352" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">目标：min (v−1) + (m−1)，约束 v·m ≥ k（v、m 为正整数）</text>
  <text x="310" y="372" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">v + k/v ≥ 2√k（均值不等式）→ 最优解落在 v ≈ m ≈ √k 附近</text>
</svg>
