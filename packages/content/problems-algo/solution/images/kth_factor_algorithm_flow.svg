<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="520" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：前向扫小因子 → 反向扫大因子（跳过平方数重复）→ -1</text>

  <!-- ===== Start ===== -->
  <rect x="226" y="44" width="108" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="16" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始：cnt = 0</text>

  <path d="M 280 80 Q 280 90 280 100" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Forward pass label ===== -->
  <text x="40" y="118" font-size="12" fill="#446688" font-weight="bold">前向扫描</text>
  <text x="40" y="133" font-size="10" fill="#888">小因子升序</text>

  <!-- forward loop box -->
  <rect x="150" y="106" width="260" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="126" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">for i = 1; i*i ≤ n; i++</text>
  <text x="280" y="146" text-anchor="middle" font-size="10.5" fill="#555">last = i（记 ⌊√n⌋ 供反向用）</text>

  <path d="M 280 164 Q 280 174 280 184" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision: n % i == 0? -->
  <polygon points="280,188 372,224 280,260 188,224" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="220" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">n % i == 0 ?</text>
  <text x="280" y="236" text-anchor="middle" font-size="10" fill="#888">i 是因子？</text>

  <!-- no branch: back to loop -->
  <path d="M 372 224 Q 430 224 430 134 Q 430 120 414 134" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="436" y="180" font-size="10" fill="#888">否，下一个 i</text>

  <!-- yes branch down -->
  <path d="M 280 260 Q 280 270 280 280" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="276" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- cnt++ -->
  <rect x="218" y="284" width="124" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="305" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">++cnt</text>

  <path d="M 280 318 Q 280 328 280 338" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision: cnt == k? -->
  <polygon points="280,342 372,378 280,414 188,378" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="374" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">cnt == k ?</text>
  <text x="280" y="390" text-anchor="middle" font-size="10" fill="#888">第 k 个？</text>

  <!-- yes: return i -->
  <path d="M 188 378 Q 120 378 120 350 Q 120 300 150 300" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="92" y="372" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="40" y="284" width="92" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="86" y="305" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return i ✓</text>

  <!-- no: continue forward (back to loop) -->
  <path d="M 372 378 Q 440 378 440 134 Q 440 120 414 134" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="446" y="300" font-size="10" fill="#888">否，继续</text>

  <!-- ===== divider to backward pass ===== -->
  <line x1="40" y1="430" x2="520" y2="430" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <text x="40" y="452" font-size="12" fill="#d6a040" font-weight="bold">反向扫描</text>
  <text x="40" y="467" font-size="10" fill="#888">大因子升序</text>

  <!-- backward loop box -->
  <rect x="150" y="440" width="260" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="460" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">for i = last; i ≥ 1; i--</text>
  <text x="280" y="476" text-anchor="middle" font-size="10" fill="#555">若 n%i==0 且 i ≠ n/i → ++cnt；cnt==k 返回 n/i</text>

  <!-- final -1 -->
  <path d="M 280 486 Q 280 494 280 500" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="226" y="500" width="108" height="0" fill="none"/>

  <rect x="206" y="496" width="148" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="510" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">两遍结束仍未达 k → return -1</text>
</svg>
