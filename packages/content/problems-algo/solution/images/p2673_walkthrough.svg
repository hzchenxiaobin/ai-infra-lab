<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：n=7, cost=[1,5,2,2,3,3,1]</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">从 i=n/2=3 递减到 1，原地更新 cost 数组</text>

  <!-- ===== Step i=3 ===== -->
  <rect x="20" y="58" width="520" height="112" fill="none" stroke="#e8f0fe" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="30" y="78" font-size="12" fill="#446688" font-weight="bold">i=3 (节点③): cost[2]=2, 子节点 ⑥⑦</text>

  <!-- mini tree -->
  <g font-size="10">
    <circle cx="100" cy="98" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="100" y="102" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <line x1="90" y1="110" x2="78" y2="128" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
    <line x1="110" y1="110" x2="122" y2="128" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
    <circle cx="72" cy="140" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="72" y="144" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <circle cx="128" cy="140" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="128" y="144" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="72" y="116" text-anchor="middle" font-size="8" fill="#aaa">⑥=3</text>
    <text x="128" y="116" text-anchor="middle" font-size="8" fill="#aaa">⑦=1</text>
  </g>

  <!-- calculation -->
  <text x="180" y="88" font-size="11" fill="#333">diff = |3 − 1| = </text>
  <rect x="276" y="76" width="28" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="290" y="91" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
  <text x="180" y="112" font-size="11" fill="#333">cost[2] ← 2 + max(3,1) = </text>
  <rect x="336" y="100" width="28" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="350" y="115" text-anchor="middle" fill="#446688" font-weight="bold">5</text>

  <!-- cost array -->
  <text x="180" y="140" font-size="10" fill="#888">cost =</text>
  <g font-size="10">
    <rect x="230" y="128" width="22" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="241" y="142" text-anchor="middle" fill="#446688">1</text>
    <rect x="254" y="128" width="22" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="265" y="142" text-anchor="middle" fill="#446688">5</text>
    <rect x="278" y="128" width="22" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
    <text x="289" y="142" text-anchor="middle" fill="#d6a040" font-weight="bold">5</text>
    <rect x="302" y="128" width="22" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="313" y="142" text-anchor="middle" fill="#446688">2</text>
    <rect x="326" y="128" width="22" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="337" y="142" text-anchor="middle" fill="#446688">3</text>
    <rect x="350" y="128" width="22" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="361" y="142" text-anchor="middle" fill="#446688">3</text>
    <rect x="374" y="128" width="22" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="385" y="142" text-anchor="middle" fill="#446688">1</text>
  </g>
  <text x="410" y="142" font-size="10" fill="#888">ans = 2</text>

  <!-- ===== Step i=2 ===== -->
  <rect x="20" y="178" width="520" height="112" fill="none" stroke="#e8f0fe" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="30" y="198" font-size="12" fill="#446688" font-weight="bold">i=2 (节点②): cost[1]=5, 子节点 ④⑤</text>

  <g font-size="10">
    <circle cx="100" cy="218" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="100" y="222" text-anchor="middle" fill="#446688" font-weight="bold">5</text>
    <line x1="90" y1="230" x2="78" y2="248" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
    <line x1="110" y1="230" x2="122" y2="248" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
    <circle cx="72" cy="260" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="72" y="264" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <circle cx="128" cy="260" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="128" y="264" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <text x="72" y="236" text-anchor="middle" font-size="8" fill="#aaa">④=2</text>
    <text x="128" y="236" text-anchor="middle" font-size="8" fill="#aaa">⑤=3</text>
  </g>

  <text x="180" y="208" font-size="11" fill="#333">diff = |2 − 3| = </text>
  <rect x="276" y="196" width="28" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="290" y="211" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
  <text x="180" y="232" font-size="11" fill="#333">cost[1] ← 5 + max(2,3) = </text>
  <rect x="336" y="220" width="28" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="350" y="235" text-anchor="middle" fill="#446688" font-weight="bold">8</text>

  <text x="180" y="260" font-size="10" fill="#888">cost =</text>
  <g font-size="10">
    <rect x="230" y="248" width="22" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="241" y="262" text-anchor="middle" fill="#446688">1</text>
    <rect x="254" y="248" width="22" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
    <text x="265" y="262" text-anchor="middle" fill="#d6a040" font-weight="bold">8</text>
    <rect x="278" y="248" width="22" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="289" y="262" text-anchor="middle" fill="#446688">5</text>
    <rect x="302" y="248" width="22" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="313" y="262" text-anchor="middle" fill="#446688">2</text>
    <rect x="326" y="248" width="22" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="337" y="262" text-anchor="middle" fill="#446688">3</text>
    <rect x="350" y="248" width="22" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="361" y="262" text-anchor="middle" fill="#446688">3</text>
    <rect x="374" y="248" width="22" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="385" y="262" text-anchor="middle" fill="#446688">1</text>
  </g>
  <text x="410" y="262" font-size="10" fill="#888">ans = 3</text>

  <!-- ===== Step i=1 ===== -->
  <rect x="20" y="298" width="520" height="112" fill="none" stroke="#fce4ec" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="30" y="318" font-size="12" fill="#b85450" font-weight="bold">i=1 (节点①): cost[0]=1, 子节点 ②③</text>

  <g font-size="10">
    <circle cx="100" cy="338" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="100" y="342" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <line x1="90" y1="350" x2="78" y2="368" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
    <line x1="110" y1="350" x2="122" y2="368" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
    <circle cx="72" cy="380" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="72" y="384" text-anchor="middle" fill="#d6a040" font-weight="bold">8</text>
    <circle cx="128" cy="380" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="128" y="384" text-anchor="middle" fill="#d6a040" font-weight="bold">5</text>
    <text x="72" y="356" text-anchor="middle" font-size="8" fill="#aaa">②=8</text>
    <text x="128" y="356" text-anchor="middle" font-size="8" fill="#aaa">③=5</text>
  </g>

  <text x="180" y="328" font-size="11" fill="#333">diff = |8 − 5| = </text>
  <rect x="276" y="316" width="28" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="290" y="331" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
  <text x="180" y="352" font-size="11" fill="#333">cost[0] ← 1 + max(8,5) = </text>
  <rect x="336" y="340" width="28" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="350" y="355" text-anchor="middle" fill="#446688" font-weight="bold">9</text>

  <text x="180" y="380" font-size="10" fill="#888">cost =</text>
  <g font-size="10">
    <rect x="230" y="368" width="22" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
    <text x="241" y="382" text-anchor="middle" fill="#d6a040" font-weight="bold">9</text>
    <rect x="254" y="368" width="22" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="265" y="382" text-anchor="middle" fill="#446688">8</text>
    <rect x="278" y="368" width="22" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="289" y="382" text-anchor="middle" fill="#446688">5</text>
    <rect x="302" y="368" width="22" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="313" y="382" text-anchor="middle" fill="#446688">2</text>
    <rect x="326" y="368" width="22" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="337" y="382" text-anchor="middle" fill="#446688">3</text>
    <rect x="350" y="368" width="22" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="361" y="382" text-anchor="middle" fill="#446688">3</text>
    <rect x="374" y="368" width="22" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="385" y="382" text-anchor="middle" fill="#446688">1</text>
  </g>
  <text x="410" y="382" font-size="10" fill="#888">ans = 6</text>

  <!-- ===== Result ===== -->
  <rect x="150" y="420" width="260" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="445" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">答案 = 2+1+3 = 6 ✓</text>
</svg>
