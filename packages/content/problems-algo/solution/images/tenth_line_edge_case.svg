<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n2"/>
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="2"/>
    </filter>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="880" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">边界陷阱：文件不足 10 行时各写法的表现</text>
  <path d="M 230 46 Q 440 54 650 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ============ small file.txt (only 5 lines) ============ -->
  <text x="80" y="84" font-size="12" fill="#888">file.txt（仅 5 行）</text>
  <g filter="url(#sk)">
    <rect x="44" y="92" width="130" height="120" rx="8" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.4" stroke-dasharray="4 3"/>
  </g>
  <g font-size="11" font-family="'Courier New',monospace" fill="#333">
    <text x="58" y="116">Line 1</text>
    <text x="58" y="134">Line 2</text>
    <text x="58" y="152">Line 3</text>
    <text x="58" y="170">Line 4</text>
    <text x="58" y="188">Line 5</text>
  </g>
  <text x="109" y="212" text-anchor="middle" font-size="10" fill="#aaa">没有第 10 行</text>

  <!-- ============ WRONG: head -n 10 | tail -n 1 ============ -->
  <text x="420" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">✗ 错误写法：head | tail</text>
  <g filter="url(#sk)">
    <rect x="300" y="92" width="240" height="120" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="420" y="118" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" font-family="'Courier New',monospace">head -n 10 | tail -n 1</text>
  <!-- step 1 -->
  <g filter="url(#sk)">
    <rect x="316" y="132" width="100" height="34" rx="6" fill="#ffffff" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="366" y="148" text-anchor="middle" font-size="10" fill="#888">head -n 10</text>
  <text x="366" y="162" text-anchor="middle" font-size="10" fill="#b85450">取前 10 行</text>
  <text x="424" y="150" font-size="14" fill="#888">→</text>
  <!-- result: 5 lines (less than requested) -->
  <g filter="url(#sk)">
    <rect x="440" y="132" width="92" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="486" y="148" text-anchor="middle" font-size="9.5" fill="#7a5415">只有 5 行</text>
  <text x="486" y="160" text-anchor="middle" font-size="9.5" fill="#7a5415">全数返回</text>
  <!-- step 2 -->
  <g filter="url(#sk)">
    <rect x="316" y="174" width="100" height="26" rx="6" fill="#ffffff" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="366" y="190" text-anchor="middle" font-size="10" fill="#888">tail -n 1</text>
  <text x="424" y="188" font-size="14" fill="#888">→</text>
  <!-- WRONG output: Line 5 -->
  <g filter="url(#sk)">
    <rect x="440" y="174" width="92" height="26" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="486" y="190" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" font-family="'Courier New',monospace">Line 5 ✗</text>
  <text x="420" y="226" text-anchor="middle" font-size="10" fill="#b85450">误把「最后一行」当「第 10 行」输出</text>

  <!-- ============ CORRECT: awk NR==10 ============ -->
  <text x="740" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">✓ 正确写法（三选一）</text>
  <g filter="url(#sk)">
    <rect x="620" y="92" width="240" height="120" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="740" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" font-family="'Courier New',monospace">awk 'NR==10'</text>
  <text x="740" y="138" text-anchor="middle" font-size="10.5" fill="#4a7a3a">NR 永不达到 10</text>
  <text x="740" y="154" text-anchor="middle" font-size="10.5" fill="#4a7a3a">→ 谓词不成立 → 空</text>
  <text x="740" y="178" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" font-family="'Courier New',monospace">sed -n '10p'</text>
  <text x="740" y="198" text-anchor="middle" font-size="10.5" fill="#4a7a3a">无 10 号地址 → 不触发 p</text>
  <text x="740" y="212" text-anchor="middle" font-size="10.5" fill="#4a7a3a">→ 空</text>
  <g filter="url(#sk)">
    <rect x="650" y="216" width="180" height="22" rx="6" fill="#ffffff" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="740" y="231" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" font-family="'Courier New',monospace">tail -n +10 | head -n 1</text>

  <!-- arrows from file -->
  <path d="M 176 152 Q 240 152 296 152" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <path d="M 176 152 Q 400 152 616 152" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>

  <!-- ============ bottom: why head|tail fails ============ -->
  <g filter="url(#sk)">
    <rect x="44" y="250" width="800" height="138" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="60" y="276" font-size="13" font-weight="bold" fill="#7a5415">为什么 head | tail 会错？</text>
  <text x="60" y="298" font-size="11.5" fill="#7a5415">head -n 10 的语义是「至多取 10 行」——不足 10 行时返回全部，并不报错也不补空。</text>
  <text x="60" y="316" font-size="11.5" fill="#7a5415">于是 tail -n 1 拿到的是「实际最后一行（第 5 行）」而非「第 10 行」——把「下界」当成了「上界」。</text>
  <text x="60" y="344" font-size="12" font-weight="bold" fill="#b85450">修复方案：换成 tail -n +10 | head -n 1</text>
  <text x="60" y="364" font-size="11.5" fill="#7a5415">tail -n +10 = 「从第 10 行开始输出」——不存在第 10 行则输出空流，head -n 1 对空流输出空。</text>
  <text x="60" y="382" font-size="11.5" fill="#7a5415">关键：用「起点寻址」+「取首行」替代「截前 10」+「取末行」，把下界陷阱转为天然的空集。</text>
</svg>
