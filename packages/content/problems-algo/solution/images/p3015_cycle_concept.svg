<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">链 + 一条弦 = 环：最短路 = 两条弧取较短</text>
  <text x="260" y="56" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">例：i = 1, j = 7, x = 2, y = 6</text>

  <!-- 链上的街道 -->
  <g stroke="#446688" stroke-width="1.5" filter="url(#rough2)">
    <line x1="79" y1="200" x2="108" y2="200"/>
    <line x1="146" y1="200" x2="175" y2="200"/>
    <line x1="213" y1="200" x2="242" y2="200"/>
    <line x1="280" y1="200" x2="309" y2="200"/>
    <line x1="347" y1="200" x2="376" y2="200"/>
    <line x1="414" y1="200" x2="443" y2="200"/>
  </g>

  <!-- 房屋 1..7 -->
  <rect x="41" y="181" width="38" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="108" y="181" width="38" height="38" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="175" y="181" width="38" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="242" y="181" width="38" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="309" y="181" width="38" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="376" y="181" width="38" height="38" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="443" y="181" width="38" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <g text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    <text x="60" y="205">1</text>
    <text x="127" y="205">2</text>
    <text x="194" y="205">3</text>
    <text x="261" y="205">4</text>
    <text x="328" y="205">5</text>
    <text x="395" y="205">6</text>
    <text x="462" y="205">7</text>
  </g>

  <g text-anchor="middle" font-size="13" filter="url(#rough2)">
    <text x="60" y="233" fill="#446688">i</text>
    <text x="127" y="233" fill="#d6a040">x</text>
    <text x="395" y="233" fill="#d6a040">y</text>
    <text x="462" y="233" fill="#446688">j</text>
  </g>

  <!-- 借弦绕行（绿） -->
  <path d="M 60 166 L 127 166 Q 261 42 395 166 L 458 174" fill="none"
        stroke="#4a7a3a" stroke-width="3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="261" y="88" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">借弦绕行：|i−x| + 1 + |j−y| = 1+1+1 = 3 步 ✓</text>

  <!-- 沿链直走（橙） -->
  <path d="M 60 240 Q 261 304 460 242" fill="none"
        stroke="#d6a040" stroke-width="3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="261" y="298" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">沿链直走：j − i = 6 步</text>

  <!-- 公式框 -->
  <rect x="85" y="310" width="350" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="336" text-anchor="middle" font-size="14" fill="#2d5a1f" filter="url(#rough2)">d(i,j) = min( j−i , |i−x| + 1 + |j−y| )</text>
</svg>
