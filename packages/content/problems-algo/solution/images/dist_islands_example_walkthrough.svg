<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="780" height="440" fill="#fafafa"/>

  <text x="390" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：两座 2×2 岛 → 同签名 → 计 1 种</text>
  <path d="M 200 42 Q 390 50 580 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== Island A panel (left) ===== -->
  <text x="160" y="74" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">岛屿 A（左上 2×2，起点 (0,0)）</text>
  <!-- 2x2 grid, cell 44, origin (70,88) -->
  <g filter="url(#rough2)"><rect x="70" y="88" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="92" y="110" text-anchor="middle" font-size="13" fill="#2b4a66" font-weight="bold">1</text>
  <text x="84" y="104" font-size="11" fill="#b85450" font-weight="bold">①</text>
  <g filter="url(#rough2)"><rect x="114" y="88" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="136" y="110" text-anchor="middle" font-size="13" fill="#2b4a66" font-weight="bold">1</text>
  <text x="150" y="104" font-size="11" fill="#b85450" font-weight="bold">④</text>
  <g filter="url(#rough2)"><rect x="70" y="132" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="92" y="154" text-anchor="middle" font-size="13" fill="#2b4a66" font-weight="bold">1</text>
  <text x="84" y="148" font-size="11" fill="#b85450" font-weight="bold">②</text>
  <g filter="url(#rough2)"><rect x="114" y="132" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="136" y="154" text-anchor="middle" font-size="13" fill="#2b4a66" font-weight="bold">1</text>
  <text x="150" y="148" font-size="11" fill="#b85450" font-weight="bold">③</text>
  <!-- arrows: ①→② down, ②→③ right, ③→④ up -->
  <path d="M 100 122 L 100 138" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 120 160 L 138 160" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 148 130 L 148 112" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- signature A -->
  <g filter="url(#rough2)"><rect x="70" y="196" width="186" height="40" rx="8" fill="#fffdf3" stroke="#446688" stroke-width="1.4"/></g>
  <text x="80" y="214" font-size="11" fill="#666" font-weight="bold">签名</text>
  <text x="163" y="221" text-anchor="middle" font-size="14" fill="#2b4a66" font-weight="bold" font-family="'Comic Sans MS',monospace">O D R U B B B B</text>
  <text x="80" y="232" font-size="10" fill="#aaa">D→R→U 三个 B 依次回溯</text>

  <!-- ===== Island B panel (right) ===== -->
  <text x="600" y="74" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">岛屿 B（右下 2×2，起点 (2,3)）</text>
  <g filter="url(#rough2)"><rect x="510" y="88" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="532" y="110" text-anchor="middle" font-size="13" fill="#2e5a26" font-weight="bold">1</text>
  <text x="524" y="104" font-size="11" fill="#b85450" font-weight="bold">①</text>
  <g filter="url(#rough2)"><rect x="554" y="88" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="576" y="110" text-anchor="middle" font-size="13" fill="#2e5a26" font-weight="bold">1</text>
  <text x="590" y="104" font-size="11" fill="#b85450" font-weight="bold">④</text>
  <g filter="url(#rough2)"><rect x="510" y="132" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="532" y="154" text-anchor="middle" font-size="13" fill="#2e5a26" font-weight="bold">1</text>
  <text x="524" y="148" font-size="11" fill="#b85450" font-weight="bold">②</text>
  <g filter="url(#rough2)"><rect x="554" y="132" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="576" y="154" text-anchor="middle" font-size="13" fill="#2e5a26" font-weight="bold">1</text>
  <text x="590" y="148" font-size="11" fill="#b85450" font-weight="bold">③</text>
  <path d="M 540 122 L 540 138" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 560 160 L 578 160" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 588 130 L 588 112" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- signature B -->
  <g filter="url(#rough2)"><rect x="510" y="196" width="186" height="40" rx="8" fill="#fffdf3" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="520" y="214" font-size="11" fill="#666" font-weight="bold">签名</text>
  <text x="603" y="221" text-anchor="middle" font-size="14" fill="#2e5a26" font-weight="bold" font-family="'Comic Sans MS',monospace">O D R U B B B B</text>
  <text x="520" y="232" font-size="10" fill="#aaa">与 A 完全一致</text>

  <!-- equal -->
  <text x="390" y="178" text-anchor="middle" font-size="22" fill="#b85450" font-weight="bold">＝</text>

  <!-- ===== step table (bottom) ===== -->
  <g filter="url(#rough2)">
    <rect x="70" y="262" width="640" height="120" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3" stroke-width="1.3"/>
  </g>
  <text x="90" y="284" font-size="13" font-weight="bold" fill="#444">扫描步骤</text>
  <!-- header -->
  <text x="90" y="306" font-size="11" fill="#888" font-weight="bold">步骤</text>
  <text x="170" y="306" font-size="11" fill="#888" font-weight="bold">扫到</text>
  <text x="280" y="306" font-size="11" fill="#888" font-weight="bold">DFS 序</text>
  <text x="400" y="306" font-size="11" fill="#888" font-weight="bold">签名</text>
  <text x="560" y="306" font-size="11" fill="#888" font-weight="bold">shapes 集合</text>
  <line x1="86" y1="312" x2="694" y2="312" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <!-- row1 -->
  <text x="90" y="332" font-size="12" fill="#b85450" font-weight="bold">①</text>
  <text x="170" y="332" font-size="12" fill="#444">(0,0)=1</text>
  <text x="280" y="332" font-size="12" fill="#444">4 格，D→R→U</text>
  <text x="400" y="332" font-size="12" fill="#2b4a66" font-family="'Comic Sans MS',monospace" font-weight="bold">ODRUBBBB</text>
  <text x="560" y="332" font-size="12" fill="#444" font-family="'Comic Sans MS',monospace">{ ODRUBBBB }</text>
  <!-- row2 -->
  <text x="90" y="356" font-size="12" fill="#b85450" font-weight="bold">②</text>
  <text x="170" y="356" font-size="12" fill="#444">(2,3)=1</text>
  <text x="280" y="356" font-size="12" fill="#444">4 格，D→R→U</text>
  <text x="400" y="356" font-size="12" fill="#2e5a26" font-family="'Comic Sans MS',monospace" font-weight="bold">ODRUBBBB</text>
  <text x="560" y="356" font-size="12" fill="#888" font-family="'Comic Sans MS',monospace">{ ODRUBBBB } 重复</text>

  <!-- result -->
  <g filter="url(#rough2)"><rect x="300" y="396" width="180" height="34" rx="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="390" y="418" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">不同岛屿数 = 1</text>
</svg>
