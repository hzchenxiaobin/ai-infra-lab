<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：单调递增栈 + 弹栈预算约束</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">贪心让高位尽量小；遇到更小值就弹栈顶，但不能弹到“凑不齐 k 个”</text>

  <!-- ===== nums array ===== -->
  <text x="30" y="76" font-size="11" fill="#446688" font-weight="bold">nums[]</text>
  <g font-size="10" fill="#333">
    <rect x="30" y="84" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="52" y="104" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="52" y="78" text-anchor="middle" font-size="8" fill="#888">[0]</text>

    <rect x="78" y="84" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="100" y="104" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>
    <text x="100" y="78" text-anchor="middle" font-size="8" fill="#888">[1]</text>

    <rect x="126" y="84" width="44" height="32" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="148" y="104" text-anchor="middle" font-size="10" fill="#888">3</text>
    <text x="148" y="78" text-anchor="middle" font-size="8" fill="#888">[2]</text>

    <rect x="174" y="84" width="44" height="32" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
    <text x="196" y="104" text-anchor="middle" font-size="10" fill="#888">3</text>
    <text x="196" y="78" text-anchor="middle" font-size="8" fill="#888">[3]</text>

    <rect x="222" y="84" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="244" y="104" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
    <text x="244" y="78" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">[5] ← 当前</text>
  </g>

  <!-- arrow from i=5 to stack -->
  <path d="M 244 120 L 244 158" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- ===== Stack (before processing i=5) ===== -->
  <text x="30" y="152" font-size="11" fill="#d6a040" font-weight="bold">栈（值递增，已选子序列）</text>
  <g font-size="10">
    <rect x="220" y="166" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="250" y="183" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <text x="290" y="183" font-size="8" fill="#888">← 栈底</text>

    <rect x="220" y="194" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="250" y="211" text-anchor="middle" fill="#446688" font-weight="bold">3</text>

    <rect x="220" y="222" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="250" y="239" text-anchor="middle" fill="#446688" font-weight="bold">3</text>

    <rect x="220" y="250" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="250" y="267" text-anchor="middle" fill="#d6a040" font-weight="bold">5</text>
    <text x="290" y="267" font-size="8" fill="#d6a040" font-weight="bold">← 栈顶</text>
  </g>

  <!-- pop arrow: 5 > 4, and budget allows -->
  <path d="M 220 263 L 168 263" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="120" y="255" font-size="9" fill="#b85450" font-weight="bold">5 &gt; 4 → 弹！</text>
  <text x="120" y="269" font-size="8" fill="#b85450">高位换更小，更 competitive</text>

  <!-- ===== Budget constraint box ===== -->
  <rect x="30" y="296" width="500" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="316" font-size="11" fill="#4a7a3a" font-weight="bold">弹栈预算约束：不能弹到凑不齐 k 个</text>
  <text x="50" y="334" font-size="10" fill="#555">弹栈条件三要素（同时满足才弹）：</text>
  <text x="50" y="350" font-size="10" fill="#555">① 栈非空    ② 栈顶 &gt; 当前值    ③ len(stack) + (n − i) &gt; k</text>
  <text x="50" y="366" font-size="9" fill="#888">第③条保证弹掉后“栈内 + 剩余待处理”仍 ≥ k，结果一定凑得满 k 个</text>
  <text x="50" y="378" font-size="9" fill="#4a7a3a" font-weight="bold">本质：等价于 402“移掉 n−k 位”留下最小的 k 位</text>
</svg>
