<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "))())(" → ans = 3</text>

  <!-- String boxes with indices -->
  <text x="40" y="60" font-size="11" fill="#888">s =</text>
  <!-- indices: 0:), 1:), 2:), 3:(, 4:), 5:), -> wait s="))())(" is ) ) ( ) ) ( 
       Actually s = "))())(" = [')', ')', '(', ')', ')', '(']  length 6
       index: 0=')' 1=')' 2='(' 3=')' 4=')' 5='(' -->
  <!-- i=0 ) -->
  <rect x="80" y="44" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="102" y="67" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">)</text>
  <text x="102" y="92" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">0</text>
  <!-- i=1 ) -->
  <rect x="126" y="44" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="148" y="67" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">)</text>
  <text x="148" y="92" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">1</text>
  <!-- i=2 ( -->
  <rect x="172" y="44" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="194" y="67" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">(</text>
  <text x="194" y="92" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">2</text>
  <!-- i=3 ) -->
  <rect x="218" y="44" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="240" y="67" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">)</text>
  <text x="240" y="92" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">3</text>
  <!-- i=4 ) -->
  <rect x="264" y="44" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="286" y="67" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">)</text>
  <text x="286" y="92" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">4</text>
  <!-- i=5 ( -->
  <rect x="310" y="44" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="332" y="67" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">(</text>
  <text x="332" y="92" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">5</text>

  <!-- pairing bracket: i=0,1 form a )) pair -->
  <path d="M 102 104 L 102 112 L 148 112 L 148 104" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="125" y="124" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">步骤1: )) 对</text>

  <!-- pairing bracket: i=3,4 form a )) pair -->
  <path d="M 240 104 L 240 112 L 286 112 L 286 104" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="263" y="124" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">步骤4: )) 对</text>

  <!-- single ) at i=2 marker -->
  <path d="M 194 104 L 194 116" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="194" y="128" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">步骤2: 单个)</text>

  <!-- ===== Step table ===== -->
  <!-- Header -->
  <rect x="40" y="146" width="480" height="22" fill="#446688" rx="3" filter="url(#rough2)"/>
  <text x="64" y="161" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">步骤</text>
  <text x="104" y="161" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">i</text>
  <text x="150" y="161" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">s[i]</text>
  <text x="238" y="161" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">判定</text>
  <text x="350" y="161" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">动作</text>
  <text x="448" y="161" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">left / ans</text>

  <!-- Row 1 -->
  <rect x="40" y="168" width="480" height="26" fill="#e6f4ea" stroke="#ccc" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="64" y="185" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="104" y="185" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="150" y="185" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">)</text>
  <text x="238" y="185" text-anchor="middle" font-size="9" fill="#4a7a3a">后跟 ) → )) 对</text>
  <text x="350" y="185" text-anchor="middle" font-size="9" fill="#b85450">left=0 → 补 (</text>
  <text x="448" y="185" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">0 / 1</text>

  <!-- Row 2 -->
  <rect x="40" y="194" width="480" height="26" fill="#fce4ec" stroke="#ccc" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="64" y="211" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="104" y="211" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="150" y="211" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">)</text>
  <text x="238" y="211" text-anchor="middle" font-size="9" fill="#b85450">后跟 ( → 单个 )</text>
  <text x="350" y="211" text-anchor="middle" font-size="9" fill="#b85450">left=0 → 补 ( + )</text>
  <text x="448" y="211" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">0 / 3</text>

  <!-- Row 3 -->
  <rect x="40" y="220" width="480" height="26" fill="#fff8e1" stroke="#ccc" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="64" y="237" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="104" y="237" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="150" y="237" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">(</text>
  <text x="238" y="237" text-anchor="middle" font-size="9" fill="#d6a040">左括号</text>
  <text x="350" y="237" text-anchor="middle" font-size="9" fill="#d6a040">left++</text>
  <text x="448" y="237" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1 / 3</text>

  <!-- Row 4 -->
  <rect x="40" y="246" width="480" height="26" fill="#e6f4ea" stroke="#ccc" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="64" y="263" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="104" y="263" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="150" y="263" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">)</text>
  <text x="238" y="263" text-anchor="middle" font-size="9" fill="#4a7a3a">后跟 ) → )) 对</text>
  <text x="350" y="263" text-anchor="middle" font-size="9" fill="#4a7a3a">left&gt;0 → 配掉 (</text>
  <text x="448" y="263" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">0 / 3</text>

  <!-- Row 5: end -->
  <rect x="40" y="272" width="480" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="64" y="289" text-anchor="middle" font-size="10" fill="#333">5</text>
  <text x="104" y="289" text-anchor="middle" font-size="10" fill="#333">—</text>
  <text x="150" y="289" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">结束</text>
  <text x="238" y="289" text-anchor="middle" font-size="9" fill="#446688">i 越界</text>
  <text x="350" y="289" text-anchor="middle" font-size="9" fill="#446688">ans += left×2</text>
  <text x="448" y="289" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">0 / 3</text>

  <!-- Result -->
  <rect x="120" y="316" width="320" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="334" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">结果：ans = 3 ✓</text>
  <text x="280" y="350" text-anchor="middle" font-size="10" fill="#666">补全后形如 "(())))" — 开头补( 配))，单)补()，(配))</text>

  <!-- Note -->
  <rect x="40" y="368" width="480" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="280" y="384" text-anchor="middle" font-size="10" fill="#666">步骤2 的单个 ')' 既缺 '(' 又缺 ')' → 必须补 2 个；步骤4 的 '))' 恰好配掉步骤3 的 '('。</text>
</svg>
