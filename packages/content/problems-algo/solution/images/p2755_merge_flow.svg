<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="540" height="410" fill="#fafafa"/>

  <text x="270" y="30" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">类型分派决策树</text>

  <!-- Entry -->
  <rect x="195" y="50" width="150" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a3030" filter="url(#rough2)">deepMerge(o1, o2)</text>
  <path d="M270 84 L270 100" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond 1: both arrays? -->
  <polygon points="270,104 372,150 270,196 168,150" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="146" text-anchor="middle" font-size="11" fill="#224466" filter="url(#rough2)">都是数组?</text>
  <text x="270" y="160" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">Array.isArray ×2</text>

  <!-- Yes -> array branch -->
  <path d="M168 150 L120 150 L120 196" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="142" y="142" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="38" y="200" width="164" height="84" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#224466" filter="url(#rough2)">数组分支</text>
  <text x="120" y="240" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">len = max(len1, len2)</text>
  <text x="120" y="255" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">i 双有 → 递归 deepMerge</text>
  <text x="120" y="270" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">i 单有 → 照收</text>

  <!-- No -> diamond 2 -->
  <path d="M372 150 L430 150 L430 196" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="402" y="142" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <polygon points="430,200 528,246 430,292 332,246" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="242" text-anchor="middle" font-size="10" fill="#244a22" filter="url(#rough2)">都是普通对象?</text>
  <text x="430" y="256" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">非数组 &amp;&amp; 非 null</text>

  <!-- Yes -> object branch -->
  <path d="M332 246 L290 246 L290 300" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="312" y="238" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="208" y="304" width="164" height="84" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="326" text-anchor="middle" font-size="12" font-weight="bold" fill="#244a22" filter="url(#rough2)">对象分支</text>
  <text x="290" y="344" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">遍历并集键</text>
  <text x="290" y="359" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">键双有 → 递归 deepMerge</text>
  <text x="290" y="374" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">键单有 → 照收</text>

  <!-- No -> fallback -->
  <path d="M528 246 L500 246 L500 300" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="516" y="238" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="418" y="304" width="110" height="48" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="473" y="324" text-anchor="middle" font-size="11" font-weight="bold" fill="#6a4a10" filter="url(#rough2)">兜底分支</text>
  <text x="473" y="342" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">return obj2</text>

  <text x="270" y="402" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">先判数组、再判普通对象、最后兜底——顺序保证 null 不误入对象分支</text>
</svg>
