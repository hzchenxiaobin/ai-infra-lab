<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = ["2","21","12","1"], k = 3</text>

  <!-- ===== Row 0: input ===== -->
  <text x="60" y="54" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">输入</text>
  <rect x="130" y="40" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="200" y="40" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="270" y="40" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="340" y="40" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="59" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">"2"</text>
  <text x="230" y="59" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">"21"</text>
  <text x="300" y="59" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">"12"</text>
  <text x="370" y="59" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">"1"</text>

  <!-- arrow down -->
  <path d="M 250 72 L 250 88" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="275" y="84" font-size="9" fill="#666" filter="url(#rough2)">按 (长度, 字典序) 排序</text>

  <!-- ===== Row 1: sorted ===== -->
  <text x="60" y="108" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">排序后</text>
  <rect x="130" y="94" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="200" y="94" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="270" y="94" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="340" y="94" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="113" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">"1"</text>
  <text x="230" y="113" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">"2"</text>
  <text x="300" y="113" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">"12"</text>
  <text x="370" y="113" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">"21"</text>

  <!-- index labels -->
  <text x="160" y="138" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">[0]</text>
  <text x="230" y="138" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">[1]</text>
  <text x="300" y="138" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">[2]</text>
  <text x="370" y="138" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">[3]</text>

  <!-- highlight nums[1] with red box -->
  <rect x="196" y="90" width="68" height="36" fill="none" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>

  <!-- divider -->
  <path d="M 40 150 L 540 150" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Sorting logic explanation ===== -->
  <text x="290" y="170" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">排序过程拆解</text>

  <!-- len=1 group -->
  <rect x="50" y="182" width="220" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)" opacity="0.6"/>
  <text x="70" y="200" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">长度 1：</text>
  <text x="140" y="200" font-size="11" fill="#333" filter="url(#rough2)">"1" &lt; "2"  （字典序）</text>

  <!-- len=2 group -->
  <rect x="290" y="182" width="240" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)" opacity="0.6"/>
  <text x="310" y="200" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">长度 2：</text>
  <text x="380" y="200" font-size="11" fill="#333" filter="url(#rough2)">"12" &lt; "21"</text>

  <!-- merge arrow -->
  <path d="M 160 214 L 160 228" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 390 214 L 390 228" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="226" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">长度 1 的排在长度 2 前面</text>

  <!-- merged result -->
  <rect x="110" y="234" width="360" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="290" y="252" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">合并 → ["1", "2", "12", "21"]</text>

  <!-- ===== Result ===== -->
  <path d="M 230 128 L 230 280" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="250" y="270" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">n=4, k=3</text>
  <text x="250" y="284" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">nums[n−k] = nums[1]</text>

  <!-- result box -->
  <rect x="130" y="296" width="320" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="322" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">第 3 大整数 = "2"</text>

  <!-- insight -->
  <rect x="50" y="348" width="480" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="290" y="366" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">关键：字符串按 (长度, 字典序) 排序等价于数值排序</text>
  <text x="290" y="382" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">前提：无前导零 → 长度直接决定量级</text>
</svg>
