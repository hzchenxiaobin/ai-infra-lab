<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#6a9acc"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：贪心排序 + 一遍扫描</text>

  <!-- Step 1 -->
  <rect x="60" y="50" width="400" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="80" y="74" font-size="12.5" fill="#446688" font-weight="bold">① 排序</text>
  <text x="260" y="74" text-anchor="middle" font-size="12.5" fill="#333">按 (minimum − actual) 降序排列 tasks</text>
  <text x="260" y="94" text-anchor="middle" font-size="11.5" fill="#888">diff 大的"高门槛"任务排前，diff 小的"紧贴消耗"任务排后</text>

  <path d="M 260 112 L 260 132" stroke="#6a9acc" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="60" y="138" width="400" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="80" y="162" font-size="12.5" fill="#4a7a3a" font-weight="bold">② 初始化</text>
  <text x="260" y="162" text-anchor="middle" font-size="12.5" fill="#333">spent = 0（已消耗能量），ans = 0</text>
  <text x="260" y="182" text-anchor="middle" font-size="11.5" fill="#888">ans 维护 max(minimumᵢ + 前缀实际消耗)</text>

  <path d="M 260 200 L 260 220" stroke="#6a9acc" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 3 loop -->
  <rect x="60" y="226" width="400" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="80" y="250" font-size="12.5" fill="#b8860b" font-weight="bold">③ 遍历</text>
  <text x="260" y="250" text-anchor="middle" font-size="12.5" fill="#333">for each [a, m] in sorted tasks:</text>
  <text x="260" y="272" text-anchor="middle" font-size="12.5" fill="#444">    ans = max(ans, m + spent)</text>
  <text x="260" y="292" text-anchor="middle" font-size="12.5" fill="#444">    spent += a</text>
  <text x="260" y="308" text-anchor="middle" font-size="11" fill="#888">m+spent = 开工前需达的初始能量门槛</text>

  <path d="M 260 316 L 260 336" stroke="#6a9acc" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 4 return -->
  <rect x="60" y="342" width="400" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="80" y="370" font-size="12.5" fill="#b85450" font-weight="bold">④ 返回</text>
  <text x="260" y="370" text-anchor="middle" font-size="12.5" fill="#333">return ans</text>
</svg>
