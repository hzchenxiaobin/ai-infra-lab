<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">核心观察：把循环小数转成精确分数</text>

  <text x="40" y="58" font-size="12" fill="#888" font-weight="bold">第 1 步：三段拆分</text>

  <text x="90" y="92" font-size="22" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="106" y="92" font-size="22" fill="#888" filter="url(#rough2)">.</text>
  <text x="120" y="92" font-size="22" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="146" y="92" font-size="22" fill="#b85450" font-weight="bold" filter="url(#rough2)">(6)</text>

  <rect x="78" y="100" width="36" height="22" fill="none" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="96" y="136" text-anchor="middle" font-size="10" fill="#446688">整数 I</text>

  <rect x="114" y="100" width="22" height="22" fill="none" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="136" text-anchor="middle" font-size="10" fill="#d6a040">非循环 N</text>
  <text x="125" y="148" text-anchor="middle" font-size="9" fill="#d6a040">长度 n</text>

  <rect x="140" y="100" width="40" height="22" fill="none" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="136" text-anchor="middle" font-size="10" fill="#b85450">循环 R</text>
  <text x="160" y="148" text-anchor="middle" font-size="9" fill="#b85450">长度 r</text>

  <line x1="40" y1="170" x2="520" y2="170" stroke="#ddd" stroke-width="1" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <text x="40" y="196" font-size="12" fill="#888" font-weight="bold">第 2 步：循环段 = 等比数列求和</text>

  <rect x="60" y="210" width="440" height="74" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>

  <text x="80" y="232" font-size="11" fill="#333">0.\overline{R} = 0.RRRR...</text>
  <text x="80" y="252" font-size="11" fill="#333">= R/10^r + R/10^{2r} + ...</text>
  <text x="80" y="272" font-size="11" fill="#446688" font-weight="bold">= R / (10^r − 1)</text>

  <text x="300" y="232" font-size="10" fill="#888">例: R=6, r=1</text>
  <text x="300" y="252" font-size="11" fill="#d6a040">0.\overline{6} = 6/9</text>
  <text x="300" y="272" font-size="10" fill="#888">例: R=52, r=2 → 52/99</text>

  <line x1="40" y1="300" x2="520" y2="300" stroke="#ddd" stroke-width="1" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <text x="40" y="326" font-size="12" fill="#888" font-weight="bold">第 3 步：合并为既约分数</text>

  <rect x="60" y="340" width="440" height="84" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>

  <text x="280" y="364" text-anchor="middle" font-size="12" fill="#333">value = I + [ N·(10^r−1) + R ] / [ 10^n · (10^r−1) ]</text>

  <path d="M 280 372 L 280 388" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <text x="280" y="410" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">num / den → 除以 gcd 化简 → 比较两个分数</text>
</svg>
