<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：所需移动数 d 按 mod 26 分桶，同桶抢占操作槽</text>

  <!-- s = "aab" -->
  <text x="28" y="64" font-size="11" fill="#888">s =</text>
  <rect x="60" y="48" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="67" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="104" y="48" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="124" y="67" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="148" y="48" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="168" y="67" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>

  <!-- t = "bbb" -->
  <text x="28" y="100" font-size="11" fill="#888">t =</text>
  <rect x="60" y="84" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="103" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="104" y="84" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="124" y="103" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="148" y="84" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="168" y="103" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>

  <!-- d row -->
  <text x="28" y="138" font-size="11" fill="#888">d =</text>
  <rect x="60" y="122" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="141" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="104" y="122" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="124" y="141" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="148" y="122" width="40" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="168" y="141" text-anchor="middle" font-size="13" fill="#888">0</text>
  <text x="200" y="138" font-size="10" fill="#888">d = (t−s+26) mod 26</text>

  <!-- Buckets -->
  <text x="28" y="180" font-size="11" fill="#888" font-weight="bold">分桶（按 d）：</text>

  <rect x="28" y="188" width="200" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="40" y="206" font-size="11" fill="#4a7a3a" font-weight="bold">桶 d=1</text>
  <text x="40" y="222" font-size="10" fill="#666">count=2 → 占槽 1, 27</text>

  <rect x="248" y="188" width="160" height="42" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="206" font-size="11" fill="#888" font-weight="bold">桶 d=0</text>
  <text x="260" y="222" font-size="10" fill="#999">无需操作，跳过</text>

  <!-- Operation timeline -->
  <text x="28" y="252" font-size="11" fill="#888" font-weight="bold">操作编号时间轴：</text>

  <rect x="28" y="260" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="46" y="279" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <rect x="68" y="260" width="36" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="86" y="279" text-anchor="middle" font-size="10" fill="#bbb">2</text>

  <text x="112" y="278" font-size="14" fill="#bbb">…</text>

  <rect x="128" y="260" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="146" y="279" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">27</text>

  <rect x="168" y="260" width="36" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="186" y="279" text-anchor="middle" font-size="10" fill="#bbb">28</text>

  <text x="212" y="278" font-size="14" fill="#bbb">…</text>

  <!-- k limit -->
  <line x1="210" y1="250" x2="210" y2="294" stroke="#b85450" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="210" y="306" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">k = 27</text>

  <!-- Arrows from bucket to slots -->
  <path d="M 60 230 Q 50 245 46 260" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 188 230 Q 200 245 146 260" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Key insight box -->
  <rect x="28" y="320" width="504" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="46" y="342" font-size="12" fill="#444" font-weight="bold">贪心直觉：同桶的第 c 个（0-indexed）占操作槽 d + 26·c</text>
  <text x="46" y="362" font-size="11" fill="#666">• d 相同的位置可互换，按序占最小可用槽位即可最小化最大操作编号</text>
  <text x="46" y="380" font-size="11" fill="#666">• 只需检查每个桶的最大槽 d + 26·(count−1) ≤ k</text>
</svg>
