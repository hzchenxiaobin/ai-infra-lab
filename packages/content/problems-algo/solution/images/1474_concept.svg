<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#fdfcf7"/>

  <text x="360" y="30" text-anchor="middle" font-size="17" fill="#2b2b2b" font-weight="bold">删除链表 M 个节点之后的 N 个节点：保留 m / 删除 n 模式</text>
  <path d="M 170 40 Q 360 48 550 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="360" y="56" text-anchor="middle" font-size="11" fill="#888">每个周期：先保留 m 个，再删除 n 个，循环到末尾</text>

  <!-- ===== 区间标注（保留/删除括号） ===== -->
  <!-- 周期1: 保留 1,2 -->
  <path d="M 35 74 L 35 80 L 129 80 L 129 74" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="82" y="70" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">保留 m=2</text>
  <!-- 周期1: 删除 3,4,5 -->
  <path d="M 135 74 L 135 80 L 279 80 L 279 74" stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="207" y="70" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">删除 n=3</text>
  <!-- 周期2: 保留 6,7 -->
  <path d="M 285 74 L 285 80 L 379 80 L 379 74" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="332" y="70" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">保留</text>
  <!-- 周期2: 删除 8,9,10 -->
  <path d="M 385 74 L 385 80 L 529 80 L 529 74" stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="457" y="70" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">删除</text>
  <!-- 周期3: 保留 11,12 -->
  <path d="M 535 74 L 535 80 L 629 80 L 629 74" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="582" y="70" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">保留</text>
  <!-- 周期3: 删除 13 -->
  <path d="M 635 74 L 635 80 L 679 80 L 679 74" stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="657" y="70" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">删</text>

  <!-- ===== 原链表节点 ===== -->
  <text x="20" y="112" font-size="12" fill="#888" font-weight="bold">原链表</text>
  <g filter="url(#sk)">
    <rect x="35" y="88" width="44" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="85" y="88" width="44" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="135" y="88" width="44" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="185" y="88" width="44" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="235" y="88" width="44" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="285" y="88" width="44" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="335" y="88" width="44" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="385" y="88" width="44" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="435" y="88" width="44" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="485" y="88" width="44" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="535" y="88" width="44" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="585" y="88" width="44" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="635" y="88" width="44" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <!-- 节点值 -->
  <text x="57" y="110" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold">1</text>
  <text x="107" y="110" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold">2</text>
  <text x="157" y="110" text-anchor="middle" font-size="13" fill="#b85450">3</text>
  <text x="207" y="110" text-anchor="middle" font-size="13" fill="#b85450">4</text>
  <text x="257" y="110" text-anchor="middle" font-size="13" fill="#b85450">5</text>
  <text x="307" y="110" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold">6</text>
  <text x="357" y="110" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold">7</text>
  <text x="407" y="110" text-anchor="middle" font-size="13" fill="#b85450">8</text>
  <text x="457" y="110" text-anchor="middle" font-size="13" fill="#b85450">9</text>
  <text x="507" y="110" text-anchor="middle" font-size="13" fill="#b85450">10</text>
  <text x="557" y="110" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold">11</text>
  <text x="607" y="110" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold">12</text>
  <text x="657" y="110" text-anchor="middle" font-size="13" fill="#b85450">13</text>
  <!-- 指针箭头 -->
  <path d="M 79 105 L 83 105" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 129 105 L 133 105" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 179 105 L 183 105" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 229 105 L 233 105" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 279 105 L 283 105" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 329 105 L 333 105" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 379 105 L 383 105" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 429 105 L 433 105" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 479 105 L 483 105" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 529 105 L 533 105" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 579 105 L 583 105" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 629 105 L 633 105" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="688" y="110" font-size="13" fill="#888">null</text>

  <!-- 删除段划掉线 -->
  <path d="M 135 88 L 279 122" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3,3" opacity="0.6" filter="url(#sk)"/>
  <path d="M 385 88 L 529 122" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3,3" opacity="0.6" filter="url(#sk)"/>
  <path d="M 635 88 L 679 122" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3,3" opacity="0.6" filter="url(#sk)"/>

  <!-- 分隔线 -->
  <path d="M 40 150 L 680 150" stroke="#d0d0d0" stroke-width="1" stroke-dasharray="4,3" fill="none" filter="url(#sk)"/>

  <!-- ===== 重连示意 ===== -->
  <text x="20" y="180" font-size="12" fill="#4a7a3a" font-weight="bold">重连</text>
  <text x="360" y="178" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">curr 停在保留段末尾，temp 走过删除段，curr.next = temp.next 一次跳过 n 个</text>
  <text x="360" y="194" text-anchor="middle" font-size="11" fill="#888">2 → 6　·　7 → 11　·　12 → null</text>

  <!-- ===== 结果链表 ===== -->
  <text x="20" y="232" font-size="12" fill="#888" font-weight="bold">结果</text>
  <g filter="url(#sk)">
    <rect x="160" y="214" width="50" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="240" y="214" width="50" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="320" y="214" width="50" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="400" y="214" width="50" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="480" y="214" width="50" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="560" y="214" width="50" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="185" y="236" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold">1</text>
  <text x="265" y="236" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold">2</text>
  <text x="345" y="236" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold">6</text>
  <text x="425" y="236" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold">7</text>
  <text x="505" y="236" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold">11</text>
  <text x="585" y="236" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold">12</text>
  <path d="M 210 231 L 238 231" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 290 231 L 318 231" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 370 231 L 398 231" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 450 231 L 478 231" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 530 231 L 558 231" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 610 231 L 640 231" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="655" y="236" font-size="13" fill="#888">null</text>

  <!-- 重连弯箭头：2->6, 7->11, 12->null -->
  <path d="M 265 248 Q 305 268 345 248" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arG)" filter="url(#sk)"/>
  <path d="M 425 248 Q 465 268 505 248" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arG)" filter="url(#sk)"/>

  <!-- ===== 要点框 ===== -->
  <rect x="40" y="300" width="640" height="120" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" rx="8" filter="url(#sk)"/>
  <text x="60" y="324" font-size="12.5" fill="#2b2b2b" font-weight="bold">核心观察</text>
  <text x="60" y="346" font-size="11" fill="#444">① 保留段不动指针，只让 curr 走到本段最后一个保留节点（走 m−1 步）。</text>
  <text x="60" y="364" font-size="11" fill="#444">② 删除段用 temp 再走 n 步，停在最后一个删除节点；curr.next = temp.next 一次重连摘掉 n 个。</text>
  <text x="60" y="382" font-size="11" fill="#444">③ curr 与 temp 访问集合不相交，每个节点只被访问一次 → 总计 O(N)。</text>
  <text x="60" y="404" font-size="11" fill="#d6a040" font-weight="bold">头节点永不删除（m≥1），故无需 dummy，直接 return head。</text>
</svg>
