<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6" fill="none" stroke="#4a7a3a" stroke-width="1.5"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6" fill="none" stroke="#b85450" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：按最短木棍（高度 1）的放置位置分两种情况</text>

  <!-- ===== Case A: height 1 at position 1 ===== -->
  <rect x="30" y="44" width="500" height="158" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="50" y="68" font-size="13" fill="#4a7a3a" font-weight="bold">情况 A：高度 1 放在最左 → 可见 ✓</text>

  <!-- visible label -->
  <text x="95" y="92" text-anchor="middle" font-size="11" fill="#4a7a3a">可见</text>

  <!-- arrangement cells -->
  <rect x="70" y="98" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="120" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="130" y="98" width="50" height="34" fill="#f5f5f5" stroke="#aaa" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="120" text-anchor="middle" font-size="13" fill="#999">?</text>
  <rect x="190" y="98" width="50" height="34" fill="#f5f5f5" stroke="#aaa" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="215" y="120" text-anchor="middle" font-size="13" fill="#999">?</text>
  <text x="255" y="120" font-size="14" fill="#888">…</text>
  <rect x="275" y="98" width="50" height="34" fill="#f5f5f5" stroke="#aaa" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="120" text-anchor="middle" font-size="13" fill="#999">?</text>

  <!-- arrow down -->
  <path d="M 280 142 L 280 158" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- subproblem -->
  <rect x="90" y="160" width="380" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="181" text-anchor="middle" font-size="12" fill="#444">剩余 n−1 根需 k−1 根可见 → 贡献 dp[n−1][k−1]</text>

  <!-- ===== Case B: height 1 not at position 1 ===== -->
  <rect x="30" y="214" width="500" height="172" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="50" y="238" font-size="13" fill="#b85450" font-weight="bold">情况 B：高度 1 放在其余 n−1 个位置 → 不可见 ✗</text>

  <!-- blocked label -->
  <text x="155" y="262" text-anchor="middle" font-size="11" fill="#b85450">被挡住</text>

  <!-- arrangement cells -->
  <rect x="70" y="268" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="290" text-anchor="middle" font-size="12" fill="#333">较高</text>
  <rect x="130" y="268" width="50" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="290" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="190" y="268" width="50" height="34" fill="#f5f5f5" stroke="#aaa" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="215" y="290" text-anchor="middle" font-size="13" fill="#999">?</text>
  <text x="255" y="290" font-size="14" fill="#888">…</text>
  <rect x="275" y="268" width="50" height="34" fill="#f5f5f5" stroke="#aaa" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="290" text-anchor="middle" font-size="13" fill="#999">?</text>

  <!-- n-1 positions note -->
  <text x="370" y="288" font-size="12" fill="#b85450">共 n−1 个</text>
  <text x="370" y="302" font-size="12" fill="#b85450">位置可选</text>

  <!-- arrow down -->
  <path d="M 280 312 L 280 328" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- subproblem -->
  <rect x="80" y="330" width="400" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="351" text-anchor="middle" font-size="12" fill="#444">高度 1 不贡献可见数 → (n−1) × dp[n−1][k]</text>

  <!-- footnote -->
  <text x="280" y="378" text-anchor="middle" font-size="11" fill="#888">高度 1 最短，左侧只要有木棍就必被挡住</text>
</svg>
