<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="4.5" refY="7" orient="auto">
      <path d="M0 0 L4.5 7 L9 0 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">排序保留下标：分数与名次的桥梁</text>

  <!-- ===== Row 1: original scores ===== -->
  <text x="62" y="122" font-size="13" fill="#555" filter="url(#rough2)">原数组</text>
  <g font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">
    <text x="146" y="86">i=0</text><text x="218" y="86">i=1</text><text x="290" y="86">i=2</text>
    <text x="362" y="86">i=3</text><text x="434" y="86">i=4</text>
  </g>
  <g stroke-width="1.5" filter="url(#rough2)">
    <rect x="116" y="96" width="60" height="40" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="188" y="96" width="60" height="40" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="260" y="96" width="60" height="40" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="332" y="96" width="60" height="40" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="404" y="96" width="60" height="40" rx="4" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <g font-size="15" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="146" y="122">10</text><text x="218" y="122">3</text>
    <text x="290" y="122">8</text><text x="362" y="122">9</text>
    <text x="434" y="122">4</text>
  </g>

  <!-- arrow: sort -->
  <text x="290" y="162" text-anchor="middle" font-size="12" fill="#5a3a00" filter="url(#rough2)">按分数降序排序（携带原下标）</text>
  <path d="M290 168 L290 184" stroke="#446688" stroke-width="1.6" marker-end="url(#arrD)" fill="none" filter="url(#rough2)"/>

  <!-- ===== Row 2: sorted pairs ===== -->
  <text x="62" y="244" font-size="13" fill="#555" filter="url(#rough2)">排序后</text>
  <g font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">
    <text x="146" y="206">第1名</text><text x="218" y="206">第2名</text><text x="290" y="206">第3名</text>
    <text x="362" y="206">第4名</text><text x="434" y="206">第5名</text>
  </g>
  <g stroke-width="1.5" filter="url(#rough2)">
    <rect x="116" y="216" width="60" height="48" rx="4" fill="#fff8e1" stroke="#d6a040"/>
    <rect x="188" y="216" width="60" height="48" rx="4" fill="#fff8e1" stroke="#d6a040"/>
    <rect x="260" y="216" width="60" height="48" rx="4" fill="#fff8e1" stroke="#d6a040"/>
    <rect x="332" y="216" width="60" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a"/>
    <rect x="404" y="216" width="60" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a"/>
  </g>
  <g font-size="15" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="146" y="240">10</text><text x="218" y="240">9</text>
    <text x="290" y="240">8</text><text x="362" y="240">4</text>
    <text x="434" y="240">3</text>
  </g>
  <g font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">
    <text x="146" y="258">原i=0</text><text x="218" y="258">原i=3</text>
    <text x="290" y="258">原i=2</text><text x="362" y="258">原i=4</text>
    <text x="434" y="258">原i=1</text>
  </g>

  <!-- arrow: assign rank -->
  <text x="290" y="290" text-anchor="middle" font-size="12" fill="#5a3a00" filter="url(#rough2)">按位置赋名次，写回原下标</text>
  <path d="M290 296 L290 312" stroke="#446688" stroke-width="1.6" marker-end="url(#arrD)" fill="none" filter="url(#rough2)"/>

  <!-- ===== Row 3: answer ===== -->
  <text x="62" y="374" font-size="13" fill="#555" filter="url(#rough2)">答案</text>
  <g font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">
    <text x="146" y="340">i=0</text><text x="218" y="340">i=1</text><text x="290" y="340">i=2</text>
    <text x="362" y="340">i=3</text><text x="434" y="340">i=4</text>
  </g>
  <g stroke-width="1.5" filter="url(#rough2)">
    <rect x="116" y="350" width="60" height="44" rx="4" fill="#fce4ec" stroke="#b85450"/>
    <rect x="188" y="350" width="60" height="44" rx="4" fill="#fce4ec" stroke="#b85450"/>
    <rect x="260" y="350" width="60" height="44" rx="4" fill="#fce4ec" stroke="#b85450"/>
    <rect x="332" y="350" width="60" height="44" rx="4" fill="#fce4ec" stroke="#b85450"/>
    <rect x="404" y="350" width="60" height="44" rx="4" fill="#fce4ec" stroke="#b85450"/>
  </g>
  <g font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="146" y="370">Gold</text>
    <text x="146" y="384">Medal</text>
    <text x="218" y="378" font-size="13">5</text>
    <text x="290" y="370">Bronze</text>
    <text x="290" y="384">Medal</text>
    <text x="362" y="370">Silver</text>
    <text x="362" y="384">Medal</text>
    <text x="434" y="378" font-size="13">4</text>
  </g>

  <!-- curved mapping arrows: sorted position -> answer[orig_idx] -->
  <g fill="none" stroke="#b85450" stroke-width="1.3" stroke-dasharray="3 2" filter="url(#rough2)">
    <path d="M146 264 C146 300, 146 320, 146 350" marker-end="url(#arrR)"/>
    <path d="M218 264 C218 300, 362 320, 362 350" marker-end="url(#arrR)"/>
    <path d="M290 264 C290 300, 290 320, 290 350" marker-end="url(#arrR)"/>
    <path d="M362 264 C362 300, 434 320, 434 350" marker-end="url(#arrR)"/>
    <path d="M434 264 C434 300, 218 320, 218 350" marker-end="url(#arrR)"/>
  </g>

  <text x="290" y="420" text-anchor="middle" font-size="12" fill="#8a6a30" filter="url(#rough2)">关键：排序时携带原下标，名次由排序后的位置决定，再写回原下标位置</text>
</svg>
