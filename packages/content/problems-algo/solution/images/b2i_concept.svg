<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">二进制链表 → 整数：从高位起逐位左移累加</text>

  <!-- Row 1: Linked list 1 -> 0 -> 1 -->
  <text x="40" y="64" font-size="12" fill="#888">链表:</text>
  <rect x="90" y="48" width="64" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="122" y="71" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <line x1="154" y1="66" x2="186" y2="66" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="192" y="48" width="64" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="224" y="71" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <line x1="256" y1="66" x2="288" y2="66" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="294" y="48" width="64" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="326" y="71" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <line x1="358" y1="66" x2="390" y2="66" stroke="#446688" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="402" y="71" font-size="11" fill="#888">∅</text>

  <!-- Direction hint -->
  <text x="470" y="60" font-size="11" fill="#b85450" font-weight="bold">最高位在此 ←</text>
  <path d="M 465 66 L 370 66" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- Row 2: bit weights -->
  <text x="40" y="118" font-size="12" fill="#888">位权:</text>
  <text x="122" y="118" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2²</text>
  <text x="224" y="118" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2¹</text>
  <text x="326" y="118" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2⁰</text>

  <!-- Row 3: traditional expansion -->
  <text x="40" y="152" font-size="12" fill="#888">按权展开:</text>
  <rect x="120" y="138" width="380" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="310" y="157" text-anchor="middle" font-size="13" fill="#333">1×2² + 0×2¹ + 1×2⁰  =  4 + 0 + 1  =  5</text>

  <!-- Divider -->
  <line x1="40" y1="182" x2="520" y2="182" stroke="#ccc" stroke-width="1" stroke-dasharray="6,4" filter="url(#rough2)"/>

  <!-- Row 4: Horner insight -->
  <text x="40" y="210" font-size="13" fill="#4a7a3a" font-weight="bold">Horner 递推（边走边算）:</text>

  <rect x="50" y="222" width="460" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="242" text-anchor="middle" font-size="13" fill="#333">每读一位:  ans = ans × 2 + bit  （等价于左移一位再补位）</text>

  <!-- Horner expansion -->
  <text x="40" y="278" font-size="12" fill="#888">展开:</text>
  <rect x="80" y="264" width="430" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="295" y="285" text-anchor="middle" font-size="13" fill="#333">(( 1 ) × 2 + 0 ) × 2 + 1  =  (2) × 2 + 1  =  5</text>

  <!-- Step arrows showing the folding -->
  <text x="195" y="285" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">读1</text>
  <text x="270" y="285" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">读0</text>
  <text x="345" y="285" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">读1</text>

  <!-- Bottom note -->
  <rect x="50" y="316" width="460" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="64" y="338" font-size="12" fill="#333" font-weight="bold">💡 为什么乘 2？</text>
  <text x="64" y="356" font-size="11" fill="#555">乘 2 = 左移一位，把已累积的结果整体抬高一级权重，</text>
  <text x="64" y="372" font-size="11" fill="#555">腾出最低位给新读入的 bit——和「二进制串末尾追加字符」完全一致。</text>
</svg>
