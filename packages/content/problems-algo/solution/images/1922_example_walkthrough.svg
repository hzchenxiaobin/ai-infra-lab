<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：套用公式 5^((n+1)/2) × 4^(n/2)</text>
  <text x="310" y="48" text-anchor="middle" font-size="11" fill="#888">MOD = 10⁹ + 7</text>

  <!-- table header -->
  <g font-size="12">
    <rect x="30" y="68" width="80" height="34" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="70" y="90" text-anchor="middle" fill="#446688" font-weight="bold">n</text>

    <rect x="110" y="68" width="90" height="34" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="155" y="90" text-anchor="middle" fill="#446688" font-weight="bold">#偶位</text>

    <rect x="200" y="68" width="90" height="34" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="245" y="90" text-anchor="middle" fill="#d6a040" font-weight="bold">#奇位</text>

    <rect x="290" y="68" width="180" height="34" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="380" y="90" text-anchor="middle" fill="#b85450" font-weight="bold">代入公式</text>

    <rect x="470" y="68" width="120" height="34" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="530" y="90" text-anchor="middle" fill="#4a7a3a" font-weight="bold">结果</text>
  </g>

  <!-- row 1: n=1 -->
  <g font-size="12">
    <rect x="30" y="106" width="80" height="50" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="70" y="136" text-anchor="middle" fill="#444" font-weight="bold">1</text>

    <rect x="110" y="106" width="90" height="50" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="155" y="130" text-anchor="middle" fill="#446688">(1+1)/2</text>
    <text x="155" y="148" text-anchor="middle" fill="#446688" font-weight="bold">= 1</text>

    <rect x="200" y="106" width="90" height="50" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="245" y="130" text-anchor="middle" fill="#d6a040">1/2</text>
    <text x="245" y="148" text-anchor="middle" fill="#d6a040" font-weight="bold">= 0</text>

    <rect x="290" y="106" width="180" height="50" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="380" y="138" text-anchor="middle" fill="#b85450">5¹ × 4⁰ = 5</text>

    <rect x="470" y="106" width="120" height="50" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="530" y="138" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5 ✓</text>
  </g>

  <!-- row 2: n=4 -->
  <g font-size="12">
    <rect x="30" y="160" width="80" height="50" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="70" y="190" text-anchor="middle" fill="#444" font-weight="bold">4</text>

    <rect x="110" y="160" width="90" height="50" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="155" y="184" text-anchor="middle" fill="#446688">(4+1)/2</text>
    <text x="155" y="202" text-anchor="middle" fill="#446688" font-weight="bold">= 2</text>

    <rect x="200" y="160" width="90" height="50" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="245" y="184" text-anchor="middle" fill="#d6a040">4/2</text>
    <text x="245" y="202" text-anchor="middle" fill="#d6a040" font-weight="bold">= 2</text>

    <rect x="290" y="160" width="180" height="50" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="380" y="184" text-anchor="middle" fill="#b85450">5² × 4²</text>
    <text x="380" y="202" text-anchor="middle" fill="#b85450">= 25 × 16 = 20²</text>

    <rect x="470" y="160" width="120" height="50" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="530" y="192" text-anchor="middle" fill="#4a7a3a" font-weight="bold">400 ✓</text>
  </g>

  <!-- row 3: n=50 -->
  <g font-size="12">
    <rect x="30" y="214" width="80" height="50" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="70" y="244" text-anchor="middle" fill="#444" font-weight="bold">50</text>

    <rect x="110" y="214" width="90" height="50" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="155" y="238" text-anchor="middle" fill="#446688">(50+1)/2</text>
    <text x="155" y="256" text-anchor="middle" fill="#446688" font-weight="bold">= 25</text>

    <rect x="200" y="214" width="90" height="50" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="245" y="238" text-anchor="middle" fill="#d6a040">50/2</text>
    <text x="245" y="256" text-anchor="middle" fill="#d6a040" font-weight="bold">= 25</text>

    <rect x="290" y="214" width="180" height="50" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="380" y="238" text-anchor="middle" fill="#b85450">5²⁵ × 4²⁵</text>
    <text x="380" y="256" text-anchor="middle" fill="#b85450">= 20²⁵ mod MOD</text>

    <rect x="470" y="214" width="120" height="50" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="530" y="246" text-anchor="middle" fill="#4a7a3a" font-weight="bold">564908303 ✓</text>
  </g>

  <!-- n=50 detail: 20^25 via fast pow trace -->
  <rect x="30" y="284" width="560" height="166" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="50" y="310" font-size="13" fill="#444" font-weight="bold">n=50 快速幂求 20²⁵ mod MOD 的二进制拆解</text>
  <text x="50" y="330" font-size="11" fill="#555">25 = 11001₂ → 只在位 0、3、4 处把 base 的对应平方累乘进 result</text>

  <g font-size="11" font-family="monospace">
    <text x="50" y="354" fill="#446688">exp=25(11001) → bit=1 → result = 1 × 20 = 20</text>
    <text x="50" y="372" fill="#888">exp=12(01100) → bit=0 → 跳过；base = 20²</text>
    <text x="50" y="390" fill="#888">exp= 6(00110) → bit=0 → 跳过；base = 20⁴</text>
    <text x="50" y="408" fill="#446688">exp= 3(00011) → bit=1 → result = 20 × 20⁸</text>
    <text x="50" y="426" fill="#446688">exp= 1(00001) → bit=1 → result = 20 × 20⁸ × 20¹⁶ = 20²⁵ ✓</text>
  </g>
  <text x="50" y="446" font-size="10" fill="#888">共 ⌊log₂ 25⌋ + 1 = 5 次迭代，远优于 25 次朴素累乘</text>
</svg>
