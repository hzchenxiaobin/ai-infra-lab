<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="820" height="440" fill="#fafafa"/>

  <text x="410" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：5 行输入 → 多键级联排序 → 最终名次</text>

  <!-- ===== Input table ===== -->
  <text x="120" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Olympic（输入，任意顺序）</text>
  <rect x="20" y="58" width="220" height="20" fill="#446688" rx="4" filter="url(#rough2)"/>
  <text x="40" y="72" font-size="9" fill="#fff">country</text>
  <text x="110" y="72" font-size="9" fill="#fff">gold</text>
  <text x="150" y="72" font-size="9" fill="#fff">silv</text>
  <text x="195" y="72" font-size="9" fill="#fff">brnz</text>

  <rect x="20" y="78" width="220" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="92" font-size="9" fill="#333">China</text><text x="110" y="92" font-size="9" fill="#b85450" font-weight="bold">10</text><text x="150" y="92" font-size="9" fill="#333">10</text><text x="195" y="92" font-size="9" fill="#333">20</text>
  <rect x="20" y="98" width="220" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="112" font-size="9" fill="#333">South Sudan</text><text x="110" y="112" font-size="9" fill="#333">0</text><text x="150" y="112" font-size="9" fill="#333">0</text><text x="195" y="112" font-size="9" fill="#333">1</text>
  <rect x="20" y="118" width="220" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="132" font-size="9" fill="#333">USA</text><text x="110" y="132" font-size="9" fill="#b85450" font-weight="bold">10</text><text x="150" y="132" font-size="9" fill="#333">10</text><text x="195" y="132" font-size="9" fill="#333">20</text>
  <rect x="20" y="138" width="220" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="152" font-size="9" fill="#333">Israel</text><text x="110" y="152" font-size="9" fill="#d6a040" font-weight="bold">2</text><text x="150" y="152" font-size="9" fill="#333">2</text><text x="195" y="152" font-size="9" fill="#333">3</text>
  <rect x="20" y="158" width="220" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="172" font-size="9" fill="#333">Egypt</text><text x="110" y="172" font-size="9" fill="#d6a040" font-weight="bold">2</text><text x="150" y="172" font-size="9" fill="#333">2</text><text x="195" y="172" font-size="9" fill="#333">2</text>

  <!-- arrow input -> output -->
  <path d="M250 118 L300 118" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="275" y="110" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">ORDER BY</text>
  <text x="275" y="132" text-anchor="middle" font-size="8" fill="#888">4 键级联</text>

  <!-- ===== Output table ===== -->
  <text x="560" y="52" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">输出（已排序）</text>
  <rect x="460" y="58" width="340" height="20" fill="#4a7a3a" rx="4" filter="url(#rough2)"/>
  <text x="475" y="72" font-size="9" fill="#fff">country</text>
  <text x="560" y="72" font-size="9" fill="#fff">gold</text>
  <text x="600" y="72" font-size="9" fill="#fff">silv</text>
  <text x="645" y="72" font-size="9" fill="#fff">brnz</text>
  <text x="730" y="72" font-size="9" fill="#fff">决出次序的键</text>

  <!-- row1 China -->
  <rect x="460" y="78" width="340" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="475" y="92" font-size="9" fill="#4a7a3a" font-weight="bold">China</text><text x="560" y="92" font-size="9" fill="#333">10</text><text x="600" y="92" font-size="9" fill="#333">10</text><text x="645" y="92" font-size="9" fill="#333">20</text>
  <text x="730" y="92" font-size="8" fill="#d6a040">④ country</text>
  <!-- row2 USA -->
  <rect x="460" y="98" width="340" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="475" y="112" font-size="9" fill="#4a7a3a" font-weight="bold">USA</text><text x="560" y="112" font-size="9" fill="#333">10</text><text x="600" y="112" font-size="9" fill="#333">10</text><text x="645" y="112" font-size="9" fill="#333">20</text>
  <text x="730" y="112" font-size="8" fill="#d6a040">④ country</text>
  <!-- row3 Israel -->
  <rect x="460" y="118" width="340" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="475" y="132" font-size="9" fill="#d6a040" font-weight="bold">Israel</text><text x="560" y="132" font-size="9" fill="#333">2</text><text x="600" y="132" font-size="9" fill="#333">2</text><text x="645" y="132" font-size="9" fill="#b85450" font-weight="bold">3</text>
  <text x="730" y="132" font-size="8" fill="#b85450">③ bronze</text>
  <!-- row4 Egypt -->
  <rect x="460" y="138" width="340" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="475" y="152" font-size="9" fill="#d6a040" font-weight="bold">Egypt</text><text x="560" y="152" font-size="9" fill="#333">2</text><text x="600" y="152" font-size="9" fill="#333">2</text><text x="645" y="152" font-size="9" fill="#333">2</text>
  <text x="730" y="152" font-size="8" fill="#b85450">③ bronze</text>
  <!-- row5 South Sudan -->
  <rect x="460" y="158" width="340" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="475" y="172" font-size="9" fill="#b85450" font-weight="bold">South Sudan</text><text x="560" y="172" font-size="9" fill="#333">0</text><text x="600" y="172" font-size="9" fill="#333">0</text><text x="645" y="172" font-size="9" fill="#333">1</text>
  <text x="730" y="172" font-size="8" fill="#b85450">① gold</text>

  <!-- ===== Explanations ===== -->
  <rect x="20" y="210" width="780" height="210" fill="#fafafa" stroke="#888" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="40" y="232" font-size="11" fill="#446688" font-weight="bold">逐组判定：</text>

  <text x="40" y="252" font-size="10" fill="#333">① 金牌分组（gold DESC）：</text>
  <text x="60" y="270" font-size="10" fill="#888">10 → {China, USA}（并列）； 2 → {Israel, Egypt}（并列）； 0 → {South Sudan}。South Sudan 金最少 → 末位（①键即决出）。</text>

  <text x="40" y="292" font-size="10" fill="#333">② 银牌决并列（silver DESC）：</text>
  <text x="60" y="310" font-size="10" fill="#888">{China, USA} 银同为 10 → 仍并列； {Israel, Egypt} 银同为 2 → 仍并列。本键未决出任何次序，全部下放。</text>

  <text x="40" y="332" font-size="10" fill="#333">③ 铜牌决并列（bronze DESC）：</text>
  <text x="60" y="350" font-size="10" fill="#888">{China, USA} 铜同为 20 → 仍并列； {Israel, Egypt} 铜为 3 vs 2 → Israel 铜多排前、Egypt 随后（③键决出）。</text>

  <text x="40" y="372" font-size="10" fill="#333">④ 国家名升序（country ASC）：</text>
  <text x="60" y="390" font-size="10" fill="#888">{China, USA} 三键全并列，按字母 C &lt; U → China 在 USA 前（④键终局兜底）。</text>
  <text x="60" y="408" font-size="10" fill="#4a7a3a" font-weight="bold">结论：China, USA, Israel, Egypt, South Sudan。</text>
</svg>
