<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：计数 → 定三游标 → 扫描按类落位</text>

  <!-- ===== Step 1: count ===== -->
  <rect x="40" y="48" width="220" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="58" y="68" font-size="11.5" fill="#333" font-weight="bold">① 一趟计数</text>
  <text x="58" y="84" font-size="10" fill="#666">统计 less、equal 个数</text>

  <!-- arrow -->
  <path d="M 150 92 L 150 108" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: set pointers ===== -->
  <rect x="40" y="110" width="220" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="58" y="130" font-size="11.5" fill="#333" font-weight="bold">② 设三游标起点</text>
  <text x="58" y="146" font-size="10.5" fill="#446688" font-family="'Comic Sans MS', monospace" font-weight="bold">l = 0, e = less, g = less+equal</text>
  <text x="58" y="158" font-size="9.5" fill="#888">ans 预分配长度 n</text>

  <!-- arrow -->
  <path d="M 150 162 L 150 178" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: scan loop ===== -->
  <rect x="40" y="180" width="220" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="58" y="200" font-size="11.5" fill="#333" font-weight="bold">③ for x in nums（从左到右）</text>
  <text x="58" y="216" font-size="10" fill="#666">按 x 与 pivot 的关系分支落位</text>

  <!-- arrow into decision -->
  <path d="M 260 202 L 300 202" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Decision diamond: x < pivot ? ===== -->
  <polygon points="360,168 420,202 360,236 300,202" fill="#fafafa" stroke="#888" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="198" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">x &lt; pivot?</text>
  <text x="360" y="212" text-anchor="middle" font-size="9" fill="#888">（先判小于）</text>

  <!-- Yes branch (left, down) -->
  <path d="M 300 202 L 282 202 L 282 270" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="262" y="240" font-size="10" fill="#446688" font-weight="bold">是</text>

  <rect x="220" y="272" width="124" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="282" y="290" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">ans[l] = x</text>
  <text x="282" y="304" text-anchor="middle" font-size="10" fill="#446688" font-family="'Comic Sans MS', monospace" font-weight="bold">l += 1</text>

  <!-- No: go right to next decision -->
  <path d="M 420 202 L 470 202" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="438" y="196" font-size="10" fill="#888" font-weight="bold">否</text>

  <!-- ===== Decision diamond: x == pivot ? ===== -->
  <polygon points="470,168 470,236 540,202" fill="#fafafa" stroke="#888" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="492" y="200" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">x ==</text>
  <text x="492" y="214" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">pivot?</text>

  <!-- Yes (equal) branch down -->
  <path d="M 492 236 L 492 270" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="498" y="256" font-size="10" fill="#d6a040" font-weight="bold">是</text>

  <rect x="430" y="272" width="124" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="492" y="290" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">ans[e] = x</text>
  <text x="492" y="304" text-anchor="middle" font-size="10" fill="#d6a040" font-family="'Comic Sans MS', monospace" font-weight="bold">e += 1</text>

  <!-- No (greater) branch: down-right -->
  <path d="M 540 202 L 548 202 L 548 340 L 430 340 L 430 312" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="552" y="276" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <rect x="368" y="312" width="124" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="430" y="330" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">ans[g] = x</text>
  <text x="430" y="344" text-anchor="middle" font-size="10" fill="#b85450" font-family="'Comic Sans MS', monospace" font-weight="bold">g += 1</text>

  <!-- ===== loop back arrow ===== -->
  <path d="M 282 312 L 282 330 L 150 330 L 150 224" stroke="#aaa" stroke-width="1.2" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="324" font-size="9.5" fill="#888">下一个 x</text>

  <!-- ===== End ===== -->
  <path d="M 150 224 L 150 250" stroke="none"/>
  <rect x="70" y="356" width="160" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="378" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">扫描结束 → 返回 ans</text>

  <!-- note -->
  <text x="300" y="370" font-size="9.5" fill="#888">三类游标各自单调递增 → 天然保序</text>
</svg>
