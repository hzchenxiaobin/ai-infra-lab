<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="430" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [2,1,4,3,5], k = 10</text>

  <!-- Column header row -->
  <rect x="20" y="38" width="560" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="50" y="57" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">right</text>
  <text x="110" y="57" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">left(终)</text>
  <text x="190" y="57" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">窗口</text>
  <text x="280" y="57" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">sum</text>
  <text x="340" y="57" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">len</text>
  <text x="410" y="57" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">score</text>
  <text x="490" y="57" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">新增</text>
  <text x="552" y="57" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans</text>

  <!-- Row 1: right=0 -->
  <rect x="20" y="70" width="560" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="89" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="110" y="89" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="190" y="89" text-anchor="middle" font-size="11" fill="#333">[2]</text>
  <text x="280" y="89" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="340" y="89" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="410" y="89" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="490" y="89" text-anchor="middle" font-size="11" fill="#b85450">+1</text>
  <text x="552" y="89" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>

  <!-- Row 2: right=1 -->
  <rect x="20" y="102" width="560" height="30" fill="#f6fff6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="121" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="110" y="121" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="190" y="121" text-anchor="middle" font-size="11" fill="#333">[2,1]</text>
  <text x="280" y="121" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="340" y="121" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="410" y="121" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">6</text>
  <text x="490" y="121" text-anchor="middle" font-size="11" fill="#b85450">+2</text>
  <text x="552" y="121" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>

  <!-- Row 3: right=2 (shrink) -->
  <rect x="20" y="134" width="560" height="30" fill="#fff8e1" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="153" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="110" y="153" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="190" y="153" text-anchor="middle" font-size="11" fill="#333">[4]</text>
  <text x="280" y="153" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="340" y="153" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="410" y="153" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="490" y="153" text-anchor="middle" font-size="11" fill="#b85450">+1</text>
  <text x="552" y="153" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>

  <!-- Row 4: right=3 (shrink) -->
  <rect x="20" y="166" width="560" height="30" fill="#fff8e1" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="185" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="110" y="185" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="190" y="185" text-anchor="middle" font-size="11" fill="#333">[3]</text>
  <text x="280" y="185" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="340" y="185" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="410" y="185" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="490" y="185" text-anchor="middle" font-size="11" fill="#b85450">+1</text>
  <text x="552" y="185" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>

  <!-- Row 5: right=4 (shrink) -->
  <rect x="20" y="198" width="560" height="30" fill="#fff8e1" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="217" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="110" y="217" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <text x="190" y="217" text-anchor="middle" font-size="11" fill="#333">[5]</text>
  <text x="280" y="217" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="340" y="217" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="410" y="217" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">5</text>
  <text x="490" y="217" text-anchor="middle" font-size="11" fill="#b85450">+1</text>
  <text x="552" y="217" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>

  <!-- shrink detail note -->
  <rect x="20" y="248" width="560" height="84" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="270" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">收缩过程详解（以 right=2 为例）</text>
  <text x="40" y="290" font-size="11" fill="#444">纳入 nums[2]=4：sum=7, len=3 → score=7×3=21 ≥ 10，收缩 left=0</text>
  <text x="40" y="306" font-size="11" fill="#444">  → sum=7−2=5, len=2 → score=5×2=10 ≥ 10（等于也不行，需严格小于），再收缩 left=1</text>
  <text x="40" y="322" font-size="11" fill="#444">  → sum=5−1=4, len=1 → score=4×1=4 &lt; 10 ✓ 停，left=2，新增 right−left+1=1 个子数组 [4]</text>

  <!-- bottom callout -->
  <rect x="20" y="348" width="560" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="370" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">最终答案 ans = 6 ✓</text>
  <text x="300" y="390" text-anchor="middle" font-size="11" fill="#666">每轮收缩后窗口 [left,right] 必合法，新增 (right−left+1) 个以 right 结尾的子数组</text>
  <text x="300" y="406" text-anchor="middle" font-size="11" fill="#888">注意「严格小于」：score = 10 等于 k 时仍需继续收缩</text>
</svg>
