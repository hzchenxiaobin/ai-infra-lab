<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="240" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：一趟扫描统计相邻不相等的对数</text>
  <text x="452" y="44" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">O(n) 时间 / O(1) 空间</text>

  <!-- 开始 -->
  <rect x="212" y="44" width="56" height="26" rx="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="61" text-anchor="middle" font-size="11" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">开始</text>
  <path d="M 240 70 L 240 92" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="176" y="94" width="128" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="113" text-anchor="middle" font-size="11" fill="#2c4a6b" filter="url(#rough2)">ans = 0；i = 1</text>
  <path d="M 240 124 L 240 150" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形1：i < n ? -->
  <polygon points="240,152 310,186 240,220 170,186" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="190" text-anchor="middle" font-size="11" fill="#7a5c1e" filter="url(#rough2)">i &lt; n ?</text>

  <text x="322" y="180" font-size="10" fill="#333" filter="url(#rough2)">否</text>
  <path d="M 310 186 L 386 186" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="388" y="171" width="92" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="434" y="190" text-anchor="middle" font-size="11" fill="#2f5424" font-weight="bold" filter="url(#rough2)">返回 ans</text>
  <text x="434" y="214" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">= 非零相邻差个数</text>

  <text x="248" y="238" font-size="10" fill="#333" filter="url(#rough2)">是</text>
  <path d="M 240 220 L 240 248" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形2：相邻判等 -->
  <polygon points="240,250 325,284 240,318 155,284" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="288" text-anchor="middle" font-size="10.5" fill="#8c3a36" filter="url(#rough2)">nums[i] ≠ nums[i−1] ?</text>

  <text x="336" y="278" font-size="10" fill="#333" filter="url(#rough2)">是</text>
  <path d="M 325 284 L 386 284" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="388" y="269" width="72" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="424" y="288" text-anchor="middle" font-size="11" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">ans++</text>
  <path d="M 424 299 L 424 332 L 330 332" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="248" y="316" font-size="10" fill="#333" filter="url(#rough2)">否</text>
  <path d="M 240 318 L 240 328" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i++ -->
  <rect x="200" y="330" width="128" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="264" y="347" text-anchor="middle" font-size="11" fill="#2c4a6b" filter="url(#rough2)">i++</text>

  <!-- 回到菱形1 -->
  <path d="M 200 343 L 118 343 L 118 186 L 164 186" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="110" y="290" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">回到循环条件</text>
</svg>
