<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1 演算：nums = [1023, 2310, 2130, 213]</text>
  <text x="260" y="36" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">L = 4；S(x) 数值化展示，只列关键变体（每个 S 去重后至多 43 个）</text>

  <!-- 表头 -->
  <rect x="32" y="46" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="60" y="46" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="104" y="46" width="222" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="326" y="46" width="130" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="456" y="46" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="46" y="63" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">j</text>
  <text x="82" y="63" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">x</text>
  <text x="215" y="63" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">S(x) 关键变体</text>
  <text x="391" y="63" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">命中 seen</text>
  <text x="478" y="63" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">ans</text>

  <!-- 行 0 -->
  <rect x="32" y="72" width="28" height="34" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="60" y="72" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="104" y="72" width="222" height="34" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="326" y="72" width="130" height="34" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="456" y="72" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="46" y="93" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <text x="82" y="93" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1023</text>
  <text x="112" y="93" font-size="10" fill="#333" filter="url(#rough2)">1023, 1203, 2013, 3021, 2310, 213, …</text>
  <text x="391" y="93" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">—</text>
  <text x="478" y="93" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>

  <!-- 行 1（命中） -->
  <rect x="32" y="106" width="28" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="60" y="106" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="104" y="106" width="222" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="326" y="106" width="130" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="456" y="106" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="46" y="127" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">1</text>
  <text x="82" y="127" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2310</text>
  <text x="112" y="127" font-size="10" fill="#2f5d24" filter="url(#rough2)">2310, 2130, 312, 2013, 1023, 213, …</text>
  <text x="391" y="127" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓ seen[1023] = 1</text>
  <text x="478" y="127" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- 行 2（命中，但 1023 不在） -->
  <rect x="32" y="140" width="28" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="60" y="140" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="104" y="140" width="222" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="326" y="140" width="130" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="456" y="140" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="46" y="161" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">2</text>
  <text x="82" y="161" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2130</text>
  <text x="112" y="161" font-size="10" fill="#2f5d24" filter="url(#rough2)">2130, 2310, 1230, 3120, 2031, …</text>
  <text x="112" y="172" font-size="8.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">（无 1023！四循环够不着）</text>
  <text x="391" y="161" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓ seen[2310] = 1</text>
  <text x="478" y="161" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- 行 3（命中 ×2） -->
  <rect x="32" y="174" width="28" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="60" y="174" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="104" y="174" width="222" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="326" y="174" width="130" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="456" y="174" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="46" y="195" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">3</text>
  <text x="82" y="195" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">213</text>
  <text x="112" y="195" font-size="10" fill="#2f5d24" filter="url(#rough2)">213, 123, 231, 312, 1023, 2310, …</text>
  <text x="112" y="206" font-size="8.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">（无 2130！同为四循环）</text>
  <text x="391" y="190" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓ seen[1023] = 1</text>
  <text x="391" y="204" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓ seen[2310] = 1</text>
  <text x="478" y="195" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- 命中类型说明 -->
  <rect x="32" y="218" width="226" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="145" y="237" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">两步命中型（I 版查不到）</text>
  <text x="145" y="254" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">1023 →(换数位 1,2)→ 2013 →(换数位 0,3)→ 2310</text>
  <text x="145" y="268" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">两次交换恰好走完一个双对换结构</text>

  <rect x="266" y="218" width="234" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="383" y="237" text-anchor="middle" font-size="11" fill="#8a3833" font-weight="bold" filter="url(#rough2)">四循环反例（两步碰不到）</text>
  <text x="383" y="254" text-anchor="middle" font-size="9.5" fill="#8a3833" filter="url(#rough2)">1023 ↔ 2130：四个数位整体错位成环</text>
  <text x="383" y="268" text-anchor="middle" font-size="9.5" fill="#8a3833" filter="url(#rough2)">最小交换次数 = 3 → j=2 只命中 1 次</text>

  <!-- 结论 -->
  <rect x="32" y="284" width="468" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="266" y="306" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">ans = 0 + 1 + 1 + 2 = 4 ✓</text>
  <text x="266" y="328" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">示例 2 [1,10,100]：S(1) = {1,10,100,…,10⁶}（1 换到任意位），累计 0+1+2 = 3 ✓</text>
</svg>
