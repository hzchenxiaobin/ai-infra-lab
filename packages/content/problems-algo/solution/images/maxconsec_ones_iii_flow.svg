<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 490"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="490" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    算法流程：滑动窗口（维护窗口内 0 的个数）
  </text>

  <!-- 1. 开始 -->
  <rect x="230" y="46" width="100" height="32" rx="16" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="67" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">开始</text>
  <line x1="280" y1="78" x2="280" y2="96" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. 初始化 -->
  <rect x="160" y="98" width="240" height="38" rx="6" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="122" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">
    left = 0，zeros = 0，ans = 0
  </text>
  <line x1="280" y1="136" x2="280" y2="154" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. 循环头 -->
  <rect x="150" y="156" width="260" height="38" rx="6" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="180" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">
    for right = 0 to n − 1
  </text>
  <line x1="280" y1="194" x2="280" y2="212" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4. 右扩 -->
  <rect x="150" y="214" width="260" height="40" rx="6" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="239" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">
    右扩：若 nums[right] == 0，则 zeros + +
  </text>
  <line x1="280" y1="254" x2="280" y2="270" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 5. while 判定 菱形  cx=280 cy=300 -->
  <path d="M280,278 L372,300 L280,322 L188,300 Z" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="304" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">
    zeros &gt; k ?
  </text>

  <!-- Yes 分支 -> 左缩框 (左侧) -->
  <line x1="188" y1="300" x2="170" y2="300" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="178" y="292" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="30" y="278" width="140" height="46" rx="6" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="100" y="297" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">左缩 left + +</text>
  <text x="100" y="313" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">若 nums[left]==0，zeros − −</text>
  <!-- 回到 while 判定 (循环箭头) -->
  <path d="M100,278 C100,250 230,250 280,272" fill="none" stroke="#b85450"
        stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- No 分支 -> 下 -->
  <line x1="280" y1="322" x2="280" y2="344" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="338" font-size="10" fill="#446688" filter="url(#rough2)">否</text>

  <!-- 6. 更新 ans -->
  <rect x="150" y="346" width="260" height="40" rx="6" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="371" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">
    ans = max(ans, right − left + 1)
  </text>

  <!-- 回到循环头 (右侧曲线) -->
  <path d="M410,366 C470,366 470,175 410,175" fill="none" stroke="#4a7a3a"
        stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="478" y="272" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">下</text>
  <text x="478" y="286" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">一</text>
  <text x="478" y="300" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">轮</text>

  <!-- 遍历结束 -> 返回 (左侧曲线从循环头到 return) -->
  <path d="M150,175 C70,175 70,440 200,440" fill="none" stroke="#446688"
        stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="62" y="305" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">遍</text>
  <text x="62" y="319" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">历</text>
  <text x="62" y="333" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">结</text>
  <text x="62" y="347" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">束</text>

  <!-- 7. 返回 ans -->
  <rect x="200" y="424" width="160" height="38" rx="16" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="448" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">返回 ans</text>
</svg>
