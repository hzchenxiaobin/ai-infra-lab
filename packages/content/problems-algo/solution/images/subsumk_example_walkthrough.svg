<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [1,2,3],  k = 3</text>

  <!-- Panel geometry: 4 panels, width 132, gap 6, start x=10 -->
  <!-- Panel 0: 初始 -->
  <rect x="10" y="40" width="132" height="360" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="10" y="40" width="132" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="76" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">初始</text>

  <text x="20" y="90" font-size="11" fill="#888">元素：</text>
  <text x="76" y="90" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <text x="20" y="116" font-size="11" fill="#888">S：</text>
  <text x="76" y="116" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">0</text>
  <text x="20" y="142" font-size="11" fill="#888">S−k：</text>
  <text x="76" y="142" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <text x="20" y="168" font-size="11" fill="#888">命中：</text>
  <text x="76" y="168" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <rect x="20" y="182" width="112" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="76" y="201" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans = 0</text>
  <text x="76" y="228" text-anchor="middle" font-size="10.5" fill="#888">count：</text>
  <rect x="22" y="236" width="108" height="44" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="76" y="256" text-anchor="middle" font-size="11" fill="#333">{ 0 : 1 }</text>
  <text x="76" y="272" text-anchor="middle" font-size="9.5" fill="#82b366">含空前缀</text>
  <text x="76" y="312" text-anchor="middle" font-size="10" fill="#aaa" font-style="italic">预备：S=0</text>
  <text x="76" y="328" text-anchor="middle" font-size="10" fill="#aaa" font-style="italic">已写入 count</text>

  <!-- Panel 1: j=0, x=1 -->
  <rect x="148" y="40" width="132" height="360" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="148" y="40" width="132" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="214" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">j=0, x=1</text>

  <text x="158" y="90" font-size="11" fill="#888">元素：</text>
  <rect x="196" y="76" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="214" y="92" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="158" y="116" font-size="11" fill="#888">S：</text>
  <text x="214" y="116" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <text x="158" y="142" font-size="11" fill="#888">S−k：</text>
  <text x="214" y="142" text-anchor="middle" font-size="11" fill="#777">1−3 = −2</text>
  <text x="158" y="168" font-size="11" fill="#888">命中：</text>
  <text x="214" y="168" text-anchor="middle" font-size="11" fill="#b85450">0</text>
  <rect x="158" y="182" width="112" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="214" y="201" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans = 0</text>
  <text x="214" y="228" text-anchor="middle" font-size="10.5" fill="#888">count：</text>
  <rect x="160" y="236" width="108" height="44" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="214" y="256" text-anchor="middle" font-size="10.5" fill="#333">{0:1, 1:1}</text>
  <text x="214" y="272" text-anchor="middle" font-size="9.5" fill="#d6a040">写入 1</text>
  <text x="214" y="312" text-anchor="middle" font-size="10" fill="#aaa" font-style="italic">S−k=−2 不在</text>
  <text x="214" y="328" text-anchor="middle" font-size="10" fill="#aaa" font-style="italic">count 中</text>

  <!-- Panel 2: j=1, x=2  (HIT) -->
  <rect x="286" y="40" width="132" height="360" fill="#ffffff" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <rect x="286" y="40" width="132" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="352" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">j=1, x=2 ★</text>

  <text x="296" y="90" font-size="11" fill="#888">元素：</text>
  <rect x="334" y="76" width="36" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="352" y="92" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="296" y="116" font-size="11" fill="#888">S：</text>
  <text x="352" y="116" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
  <text x="296" y="142" font-size="11" fill="#888">S−k：</text>
  <text x="352" y="142" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3−3 = 0</text>
  <text x="296" y="168" font-size="11" fill="#888">命中：</text>
  <text x="352" y="168" text-anchor="middle" font-size="11" fill="#82b366" font-weight="bold">1 ←</text>
  <rect x="296" y="182" width="112" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="352" y="201" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">ans = 1</text>
  <text x="352" y="228" text-anchor="middle" font-size="10.5" fill="#888">count：</text>
  <rect x="298" y="236" width="108" height="44" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="352" y="256" text-anchor="middle" font-size="10" fill="#333">{0:1,1:1,3:1}</text>
  <text x="352" y="272" text-anchor="middle" font-size="9.5" fill="#d6a040">写入 3</text>
  <text x="352" y="312" text-anchor="middle" font-size="10" fill="#b85450" font-style="italic">命中 [1,2]=3</text>
  <text x="352" y="328" text-anchor="middle" font-size="10" fill="#aaa" font-style="italic">（起点 prefix=0）</text>

  <!-- Panel 3: j=2, x=3  (HIT) -->
  <rect x="424" y="40" width="132" height="360" fill="#ffffff" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <rect x="424" y="40" width="132" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="490" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">j=2, x=3 ★</text>

  <text x="434" y="90" font-size="11" fill="#888">元素：</text>
  <rect x="472" y="76" width="36" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="490" y="92" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="434" y="116" font-size="11" fill="#888">S：</text>
  <text x="490" y="116" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">6</text>
  <text x="434" y="142" font-size="11" fill="#888">S−k：</text>
  <text x="490" y="142" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">6−3 = 3</text>
  <text x="434" y="168" font-size="11" fill="#888">命中：</text>
  <text x="490" y="168" text-anchor="middle" font-size="11" fill="#82b366" font-weight="bold">1 ←</text>
  <rect x="434" y="182" width="112" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="490" y="201" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">ans = 2</text>
  <text x="490" y="228" text-anchor="middle" font-size="10.5" fill="#888">count：</text>
  <rect x="436" y="236" width="108" height="44" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="490" y="256" text-anchor="middle" font-size="9.5" fill="#333">{0:1,1:1,3:1,6:1}</text>
  <text x="490" y="272" text-anchor="middle" font-size="9.5" fill="#d6a040">写入 6</text>
  <text x="490" y="312" text-anchor="middle" font-size="10" fill="#b85450" font-style="italic">命中 [3]=3</text>
  <text x="490" y="328" text-anchor="middle" font-size="10" fill="#aaa" font-style="italic">（起点 prefix=3）</text>

  <!-- bottom summary -->
  <rect x="10" y="362" width="546" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="283" y="384" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">两步命中 → 答案 ans = 2</text>
  <text x="283" y="400" text-anchor="middle" font-size="10.5" fill="#888">每步「先查 S−k，再写 S」</text>
</svg>
