<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 408"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="408" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：每段独立地「每 m+1 个字符切一刀」</text>

  <!-- Row 1: original string s = 000011000 -->
  <text x="34" y="70" font-size="13" fill="#555" filter="url(#rough2)">s =</text>
  <rect x="80" y="50" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="97" y="70" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="114" y="50" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="131" y="70" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="148" y="50" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="165" y="70" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="182" y="50" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="199" y="70" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="216" y="50" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="233" y="70" text-anchor="middle" font-size="13" fill="#2d5523" filter="url(#rough2)">1</text>
  <rect x="250" y="50" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="267" y="70" text-anchor="middle" font-size="13" fill="#2d5523" filter="url(#rough2)">1</text>
  <rect x="284" y="50" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="301" y="70" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="318" y="50" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="335" y="70" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="352" y="50" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="369" y="70" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>

  <!-- run brackets -->
  <rect x="78" y="86" width="138" height="22" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="147" y="101" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">L₁ = 4</text>
  <rect x="218" y="86" width="66" height="22" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="251" y="101" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">L₂ = 2</text>
  <rect x="286" y="86" width="100" height="22" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="336" y="101" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">L₃ = 3</text>

  <!-- knife counts -->
  <text x="147" y="127" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">⌊4/3⌋ = 1 刀</text>
  <text x="251" y="127" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">0 刀</text>
  <text x="336" y="127" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">⌊3/3⌋ = 1 刀</text>
  <text x="14" y="124" font-size="12" fill="#446688" filter="url(#rough2)">m = 2</text>
  <path d="M 55 112 L 55 138" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Row 2: after flips, 001011010 -->
  <rect x="80" y="144" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="97" y="164" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="114" y="144" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="131" y="164" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="148" y="144" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="165" y="164" text-anchor="middle" font-size="13" fill="#8a6206" filter="url(#rough2)">1</text>
  <rect x="182" y="144" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="199" y="164" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="216" y="144" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="233" y="164" text-anchor="middle" font-size="13" fill="#2d5523" filter="url(#rough2)">1</text>
  <rect x="250" y="144" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="267" y="164" text-anchor="middle" font-size="13" fill="#2d5523" filter="url(#rough2)">1</text>
  <rect x="284" y="144" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="301" y="164" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="318" y="144" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="335" y="164" text-anchor="middle" font-size="13" fill="#8a6206" filter="url(#rough2)">1</text>
  <rect x="352" y="144" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="369" y="164" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>

  <!-- result runs -->
  <rect x="76" y="180" width="316" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="234" y="196" text-anchor="middle" font-size="11.5" fill="#2d5523" filter="url(#rough2)">切完各段长 2·1·1·2·1·1·1，全部 ≤ 2 ✓</text>

  <!-- formula box -->
  <rect x="30" y="214" width="460" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="231" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">判定（m ≥ 2）：Σ ⌊L/(m+1)⌋ ≤ numOps ？</text>
  <text x="260" y="248" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">本例（numOps = 2）：1 + 0 + 1 = 2 ≤ 2 → 可行 ✓</text>

  <!-- lower bound box -->
  <rect x="30" y="262" width="460" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="279" text-anchor="middle" font-size="12" fill="#2d5523" filter="url(#rough2)">下界：j 刀至多切出 j+1 组，每组 ≤ m</text>
  <text x="260" y="296" text-anchor="middle" font-size="12" fill="#2d5523" filter="url(#rough2)">⟹ L−j ≤ (j+1)·m ⟹ j ≥ ⌊L/(m+1)⌋</text>

  <!-- construction box -->
  <rect x="30" y="308" width="460" height="38" fill="#fafafa" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="5 3" rx="8" filter="url(#rough2)"/>
  <text x="260" y="325" text-anchor="middle" font-size="12" fill="#8a6206" filter="url(#rough2)">构造：刀口选段内部（m ≥ 2 必有），翻出的孤立字符不与相邻段粘连</text>
  <text x="260" y="342" text-anchor="middle" font-size="12" fill="#8a6206" filter="url(#rough2)">L₃ 恰为 3 的倍数：最后一刀本落在段尾，左移一格避让</text>

  <!-- m = 1 warning box -->
  <rect x="30" y="354" width="460" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="371" text-anchor="middle" font-size="12" fill="#7a2f2b" filter="url(#rough2)">⚠ m = 1 特判：整串必须交替，代价 = min(d, n−d)</text>
  <text x="260" y="388" text-anchor="middle" font-size="11.5" fill="#7a2f2b" filter="url(#rough2)">"1001" 套公式得 1，实际要 2 —— 翻端点必并入相邻反色段</text>
</svg>
