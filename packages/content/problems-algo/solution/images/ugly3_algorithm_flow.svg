<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">二分答案流程：在值域上二分定位第 n 个丑数</text>

  <!-- Start -->
  <rect x="210" y="40" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="58" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">开始</text>
  <path d="M 280 74 L 280 86" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init -->
  <rect x="150" y="90" width="260" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="108" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">lo = 1, hi = n × min(a,b,c)</text>
  <text x="280" y="123" text-anchor="middle" font-size="10" fill="#888">ans = hi（上界必可行：n 个 min 的倍数）</text>
  <path d="M 280 130 L 280 142" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- While -->
  <polygon points="280,144 360,180 280,216 200,180" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="178" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">lo ≤ hi ?</text>
  <text x="280" y="194" text-anchor="middle" font-size="10" fill="#888">否 → 跳出循环</text>
  <path d="M 280 216 L 280 228" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- mid -->
  <rect x="190" y="232" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="254" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">mid = lo + (hi−lo)/2</text>
  <path d="M 280 266 L 280 278" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- compute f -->
  <rect x="150" y="282" width="260" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="300" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">用容斥算 cnt = f(mid)</text>
  <text x="280" y="315" text-anchor="middle" font-size="10" fill="#888">⌊mid/a⌋+⌊mid/b⌋+⌊mid/c⌋−两两 lcm+三 lcm</text>
  <path d="M 280 322 L 280 334" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision -->
  <polygon points="280,336 372,372 280,408 188,372" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="370" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">cnt ≥ n ?</text>
  <text x="280" y="386" text-anchor="middle" font-size="10" fill="#888">mid 够大了</text>

  <!-- yes branch -->
  <path d="M 188 372 L 96 372 L 96 252" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="20" y="300" width="76" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="58" y="318" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是 ✓</text>
  <text x="58" y="334" text-anchor="middle" font-size="10" fill="#4a7a3a">ans=mid</text>
  <text x="58" y="346" text-anchor="middle" font-size="10" fill="#4a7a3a">hi=mid−1</text>
  <path d="M 96 252 L 96 180 L 200 180" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- no branch -->
  <path d="M 372 372 L 466 372 L 466 252" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="464" y="300" width="76" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="502" y="318" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否 ✗</text>
  <text x="502" y="334" text-anchor="middle" font-size="10" fill="#b85450">mid 太小</text>
  <text x="502" y="346" text-anchor="middle" font-size="10" fill="#b85450">lo=mid+1</text>
  <path d="M 466 252 L 466 180 L 360 180" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- End -->
  <path d="M 280 408 L 280 424" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="190" y="428" width="180" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="445" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">返回 ans</text>
</svg>
