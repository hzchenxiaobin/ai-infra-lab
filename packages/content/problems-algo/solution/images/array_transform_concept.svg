<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
      <path d="M0,0 L5,8 L10,0" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#b85450" stroke-width="1.5"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#4a7a3a" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心规则：局部极大 ↓1，局部极小 ↑1，首尾不变</text>

  <!-- Row label: original -->
  <text x="30" y="90" font-size="11" fill="#888" font-weight="bold">原数组</text>

  <!-- Top annotations above cells -->
  <!-- Cell 0: boundary -->
  <text x="142" y="54" text-anchor="middle" font-size="9.5" fill="#999">固定</text>
  <!-- Cell 1: local max -->
  <text x="206" y="48" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">局部极大</text>
  <text x="206" y="60" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">↓1</text>
  <!-- Cell 2: local min -->
  <text x="270" y="48" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">局部极小</text>
  <text x="270" y="60" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">↑1</text>
  <!-- Cell 3: local max -->
  <text x="334" y="48" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">局部极大</text>
  <text x="334" y="60" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">↓1</text>
  <!-- Cell 4: boundary -->
  <text x="398" y="54" text-anchor="middle" font-size="9.5" fill="#999">固定</text>

  <!-- Original array cells: [1, 5, 2, 6, 3] -->
  <rect x="114" y="66" width="56" height="36" fill="#f0f0f0" stroke="#999" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="142" y="89" text-anchor="middle" font-size="14" fill="#666" font-weight="bold" font-family="monospace">1</text>

  <rect x="178" y="66" width="56" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="206" y="89" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" font-family="monospace">5</text>

  <rect x="242" y="66" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="270" y="89" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" font-family="monospace">2</text>

  <rect x="306" y="66" width="56" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="334" y="89" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" font-family="monospace">6</text>

  <rect x="370" y="66" width="56" height="36" fill="#f0f0f0" stroke="#999" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="398" y="89" text-anchor="middle" font-size="14" fill="#666" font-weight="bold" font-family="monospace">3</text>

  <!-- Index labels -->
  <text x="142" y="116" text-anchor="middle" font-size="9" fill="#aaa">i=0</text>
  <text x="206" y="116" text-anchor="middle" font-size="9" fill="#aaa">i=1</text>
  <text x="270" y="116" text-anchor="middle" font-size="9" fill="#aaa">i=2</text>
  <text x="334" y="116" text-anchor="middle" font-size="9" fill="#aaa">i=3</text>
  <text x="398" y="116" text-anchor="middle" font-size="9" fill="#aaa">i=4</text>

  <!-- Snapshot arrow between rows -->
  <rect x="150" y="128" width="240" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="146" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">基于「昨天的快照」同时计算</text>
  <path d="M 270 112 L 270 124" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 270 158 L 270 172" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Row label: transformed -->
  <text x="30" y="196" font-size="11" fill="#888" font-weight="bold">新数组</text>
  <text x="30" y="210" font-size="9.5" fill="#888">（一天后）</text>

  <!-- Transformed array cells: [1, 4, 3, 5, 3] -->
  <rect x="114" y="174" width="56" height="36" fill="#f0f0f0" stroke="#999" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="142" y="197" text-anchor="middle" font-size="14" fill="#666" font-weight="bold" font-family="monospace">1</text>

  <rect x="178" y="174" width="56" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="206" y="197" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" font-family="monospace">4</text>
  <text x="206" y="226" text-anchor="middle" font-size="9" fill="#b85450">5−1</text>

  <rect x="242" y="174" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="270" y="197" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" font-family="monospace">3</text>
  <text x="270" y="226" text-anchor="middle" font-size="9" fill="#4a7a3a">2+1</text>

  <rect x="306" y="174" width="56" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="334" y="197" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" font-family="monospace">5</text>
  <text x="334" y="226" text-anchor="middle" font-size="9" fill="#b85450">6−1</text>

  <rect x="370" y="174" width="56" height="36" fill="#f0f0f0" stroke="#999" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="398" y="197" text-anchor="middle" font-size="14" fill="#666" font-weight="bold" font-family="monospace">3</text>

  <!-- Insight box 1: snapshot -->
  <rect x="30" y="244" width="480" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="262" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">快照更新：所有变化基于同一天的数组状态同时计算</text>
  <text x="270" y="278" text-anchor="middle" font-size="10.5" fill="#666">不能边算边改 —— 否则左侧先改的值会干扰右侧的判定</text>

  <!-- Insight box 2: convergence -->
  <rect x="30" y="296" width="480" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="314" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">收敛性：值域 [1,100]，每天至多变化 1 → 最多 ~100 天必稳定</text>
  <text x="270" y="330" text-anchor="middle" font-size="10.5" fill="#666">重复「快照 → 调整」直到某天无任何变化，返回最终数组</text>
</svg>
