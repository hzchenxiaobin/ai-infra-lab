<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="470" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：O(n^2) 枚举矩形对，每对 O(1)</text>

  <!-- start -->
  <rect x="200" y="42" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="63" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">best = 0</text>
  <path d="M 260 76 L 260 88" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- loop head -->
  <rect x="170" y="92" width="180" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="110" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">枚举矩形对 (i, j)</text>
  <text x="260" y="128" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">i &lt; j（双层循环）</text>
  <path d="M 260 136 L 260 146" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- compute intersection -->
  <rect x="145" y="150" width="230" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="172" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">w = min(x2a,x2b) − max(x1a,x1b)</text>
  <text x="260" y="192" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">h = min(y2a,y2b) − max(y1a,y1b)</text>
  <path d="M 260 206 L 260 216" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- decision 1 -->
  <polygon points="160,250 260,218 360,250 260,282" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="254" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">w &gt; 0 且 h &gt; 0 ?</text>

  <!-- no branch -->
  <path d="M 360 250 L 420 250" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="388" y="240" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>
  <text x="392" y="268" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">分离或贴边</text>

  <!-- yes branch -->
  <path d="M 260 282 L 260 294" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="272" y="292" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- update best -->
  <rect x="160" y="298" width="200" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="317" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">s = min(w, h)</text>
  <text x="260" y="337" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">best = max(best, s × s)</text>
  <path d="M 260 346 L 260 356" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- decision 2 -->
  <polygon points="175,390 260,358 345,390 260,422" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="394" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">枚举完所有对?</text>

  <!-- yes -> return -->
  <path d="M 175 390 L 112 390 L 112 432 L 142 432" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="148" y="380" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="148" y="414" width="124" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="210" y="436" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return best</text>

  <!-- no -> loop back -->
  <path d="M 345 390 L 428 390" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="372" y="380" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 428 388 L 428 114 L 356 114" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="444" y="230" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">下</text>
  <text x="444" y="246" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">一</text>
  <text x="444" y="262" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">对</text>
</svg>
