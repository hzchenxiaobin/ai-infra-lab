<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 3：(e + 8) * (e - 8) 分配律展开</text>

  <!-- left factor -->
  <rect x="30" y="46" width="160" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="42" y="66" font-size="12" fill="#446688" font-weight="bold">(e + 8)</text>
  <text x="42" y="84" font-size="11" fill="#333" font-family="'Comic Sans MS', monospace">e → {e:1}</text>
  <text x="42" y="100" font-size="11" fill="#333" font-family="'Comic Sans MS', monospace">8 → {"":8}</text>
  <text x="110" y="100" font-size="11" fill="#446688" font-weight="bold">→ {e:1,"":8}</text>

  <!-- right factor -->
  <rect x="410" y="46" width="160" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="422" y="66" font-size="12" fill="#446688" font-weight="bold">(e - 8)</text>
  <text x="422" y="84" font-size="11" fill="#333" font-family="'Comic Sans MS', monospace">e → {e:1}</text>
  <text x="422" y="100" font-size="11" fill="#333" font-family="'Comic Sans MS', monospace">-8 → {"":-8}</text>
  <text x="480" y="100" font-size="11" fill="#446688" font-weight="bold">→ {e:1,"":-8}</text>

  <!-- multiply sign -->
  <text x="300" y="86" text-anchor="middle" font-size="20" fill="#b85450" font-weight="bold">*</text>

  <!-- arrows down to distribution -->
  <path d="M 110 110 L 110 140" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 490 110 L 490 140" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- distribution title -->
  <text x="300" y="134" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">mul_poly：分配律展开 4 对项</text>

  <!-- four products grid -->
  <!-- p1: e * e -->
  <rect x="30" y="148" width="130" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="42" y="166" font-size="11" fill="#4a7a3a" font-weight="bold">e × e</text>
  <text x="42" y="182" font-size="10" fill="#666" font-family="'Comic Sans MS', monospace">[e]+[e] sort</text>
  <text x="42" y="197" font-size="11" fill="#333" font-family="'Comic Sans MS', monospace">{"e*e":1}</text>

  <!-- p2: e * -8 -->
  <rect x="170" y="148" width="130" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="182" y="166" font-size="11" fill="#d6a040" font-weight="bold">e × (-8)</text>
  <text x="182" y="182" font-size="10" fill="#666" font-family="'Comic Sans MS', monospace">键=e, 1×-8</text>
  <text x="182" y="197" font-size="11" fill="#333" font-family="'Comic Sans MS', monospace">{"e":-8}</text>

  <!-- p3: 8 * e -->
  <rect x="310" y="148" width="130" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="322" y="166" font-size="11" fill="#d6a040" font-weight="bold">8 × e</text>
  <text x="322" y="182" font-size="10" fill="#666" font-family="'Comic Sans MS', monospace">键=e, 8×1</text>
  <text x="322" y="197" font-size="11" fill="#333" font-family="'Comic Sans MS', monospace">{"e":8}</text>

  <!-- p4: 8 * -8 -->
  <rect x="450" y="148" width="130" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="462" y="166" font-size="11" fill="#4a7a3a" font-weight="bold">8 × (-8)</text>
  <text x="462" y="182" font-size="10" fill="#666" font-family="'Comic Sans MS', monospace">键="", 8×-8</text>
  <text x="462" y="197" font-size="11" fill="#333" font-family="'Comic Sans MS', monospace">{"":-64}</text>

  <!-- merge arrows -->
  <path d="M 95 208 L 95 232" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 235 208 L 235 232" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 375 208 L 375 232" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 515 208 L 515 232" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- merge highlight: e terms cancel -->
  <rect x="160" y="236" width="260" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="254" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">同键 e 合并：-8 + 8 = 0 → 删除</text>
  <text x="290" y="270" text-anchor="middle" font-size="10" fill="#888">交叉项相消 = 平方差公式的算法体现</text>

  <!-- final poly -->
  <rect x="120" y="296" width="360" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="316" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">最终多项式</text>
  <text x="300" y="336" text-anchor="middle" font-size="12" fill="#333" font-family="'Comic Sans MS', monospace">{ "e*e": 1, "": -64 }</text>

  <!-- sort & output -->
  <path d="M 300 354 L 300 374" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="378" width="360" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="396" text-anchor="middle" font-size="11" fill="#446688">排序：次数降序(e*e=2 先)，同次字典序</text>
  <text x="300" y="414" text-anchor="middle" font-size="12" fill="#333" font-family="'Comic Sans MS', monospace">["1*e*e", "-64"]</text>
</svg>
