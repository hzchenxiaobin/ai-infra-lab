<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#446688" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="260" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">同一矩阵的两种切法</text>
  <text x="260" y="48" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">grid = [[1,4],[2,3]]，total = 10</text>

  <!-- ============ 左区：水平切割 ============ -->
  <text x="28" y="76" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">① 水平切割（r = 0）</text>

  <rect x="55" y="92" width="55" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="82" y="117" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="110" y="92" width="55" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="137" y="117" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="55" y="132" width="55" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="82" y="157" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="110" y="132" width="55" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="137" y="157" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>

  <!-- 水平红色虚线切割线 -->
  <path d="M 45 132 L 175 132" stroke="#b85450" stroke-width="2.5" stroke-dasharray="7 5" fill="none" filter="url(#rough2)"/>

  <text x="182" y="110" font-size="12" fill="#446688" filter="url(#rough2)">上半 = 1+4 = 5</text>
  <text x="182" y="160" font-size="12" fill="#446688" filter="url(#rough2)">下半 = 2+3 = 5</text>

  <rect x="30" y="188" width="205" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="132" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">5 == 5 → 可行 ✓</text>

  <!-- ============ 右区：垂直切割 ============ -->
  <text x="280" y="76" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">② 垂直切割（c = 0）</text>

  <rect x="310" y="92" width="55" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="337" y="117" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="365" y="92" width="55" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="392" y="117" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="310" y="132" width="55" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="337" y="157" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="365" y="132" width="55" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="392" y="157" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>

  <!-- 垂直红色虚线切割线 -->
  <path d="M 365 82 L 365 182" stroke="#b85450" stroke-width="2.5" stroke-dasharray="7 5" fill="none" filter="url(#rough2)"/>

  <text x="305" y="108" text-anchor="end" font-size="12" fill="#446688" filter="url(#rough2)">左半 =</text>
  <text x="305" y="124" text-anchor="end" font-size="12" fill="#446688" filter="url(#rough2)">3</text>
  <text x="428" y="108" font-size="12" fill="#446688" filter="url(#rough2)">右半 =</text>
  <text x="428" y="124" font-size="12" fill="#446688" filter="url(#rough2)">7</text>

  <rect x="280" y="188" width="210" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="385" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">3 ≠ 7 → 此切法不行 ✗</text>

  <!-- ============ 底部：等和判据 ============ -->
  <rect x="55" y="248" width="410" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="274" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">等和判据：沿切割方向累加前缀和 pre</text>
  <text x="260" y="304" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">2 × pre == total ⟺ 两半相等</text>
  <text x="260" y="328" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">（两侧同时对齐一侧即可；全程整数运算，避免 total/2 截断）</text>
</svg>
