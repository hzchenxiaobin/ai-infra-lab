<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：四种情况——满切、尾不满、size 超长、空数组</text>

  <!-- table header -->
  <rect x="30" y="46" width="540" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="80" y="69" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">示例</text>
  <text x="200" y="69" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">arr</text>
  <text x="310" y="69" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">size</text>
  <text x="460" y="69" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">输出</text>
  <line x1="140" y1="46" x2="140" y2="82" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="260" y1="46" x2="260" y2="82" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="360" y1="46" x2="360" y2="82" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- Example 1: size=1 -->
  <rect x="30" y="88" width="540" height="52" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="80" y="112" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">示例 1</text>
  <text x="200" y="112" text-anchor="middle" font-size="11" fill="#333">[1,2,3,4,5]</text>
  <text x="200" y="128" text-anchor="middle" font-size="9" fill="#888">5 个元素</text>
  <text x="310" y="118" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <text x="460" y="112" text-anchor="middle" font-size="10" fill="#b85450">[[1],[2],[3],[4],[5]]</text>
  <text x="460" y="128" text-anchor="middle" font-size="9" fill="#888">每块 1 个，5 块</text>
  <line x1="140" y1="88" x2="140" y2="140" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="260" y1="88" x2="260" y2="140" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="360" y1="88" x2="360" y2="140" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Example 2: size=3 -->
  <rect x="30" y="146" width="540" height="52" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="80" y="170" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">示例 2</text>
  <text x="200" y="170" text-anchor="middle" font-size="11" fill="#333">[1,9,6,3,2]</text>
  <text x="200" y="186" text-anchor="middle" font-size="9" fill="#888">5 个元素</text>
  <text x="310" y="176" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
  <text x="460" y="170" text-anchor="middle" font-size="10" fill="#b85450">[[1,9,6],[3,2]]</text>
  <text x="460" y="186" text-anchor="middle" font-size="9" fill="#888">第 2 块不满（2 &lt; 3）</text>
  <line x1="140" y1="146" x2="140" y2="198" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="260" y1="146" x2="260" y2="198" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="360" y1="146" x2="360" y2="198" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Example 3: size=6 > length -->
  <rect x="30" y="204" width="540" height="52" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="80" y="228" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">示例 3</text>
  <text x="200" y="228" text-anchor="middle" font-size="11" fill="#333">[8,5,3,2,6]</text>
  <text x="200" y="244" text-anchor="middle" font-size="9" fill="#888">5 个元素</text>
  <text x="310" y="234" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">6</text>
  <text x="460" y="228" text-anchor="middle" font-size="10" fill="#b85450">[[8,5,3,2,6]]</text>
  <text x="460" y="244" text-anchor="middle" font-size="9" fill="#888">size &gt; length，全在一块</text>
  <line x1="140" y1="204" x2="140" y2="256" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="260" y1="204" x2="260" y2="256" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="360" y1="204" x2="360" y2="256" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Example 4: empty -->
  <rect x="30" y="262" width="540" height="52" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="80" y="286" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">示例 4</text>
  <text x="200" y="290" text-anchor="middle" font-size="11" fill="#333">[]</text>
  <text x="200" y="306" text-anchor="middle" font-size="9" fill="#888">空数组</text>
  <text x="310" y="292" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <text x="460" y="290" text-anchor="middle" font-size="10" fill="#b85450">[]</text>
  <text x="460" y="306" text-anchor="middle" font-size="9" fill="#888">无元素，返回空</text>
  <line x1="140" y1="262" x2="140" y2="314" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="260" y1="262" x2="260" y2="314" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="360" y1="262" x2="360" y2="314" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Summary box -->
  <rect x="30" y="330" width="540" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="348" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">共性：每步 slice(i, i+size)，无需特判最后一块</text>
  <text x="300" y="364" text-anchor="middle" font-size="11" fill="#888">slice 自动截断越界 end，空数组时 ceil(0/size)=0 产 0 块</text>

  <!-- bottom note -->
  <text x="300" y="402" text-anchor="middle" font-size="11" fill="#888">💡 arr 为 JSON.parse 的输出，元素可为任意 JSON 值（含 null/对象/嵌套数组）</text>
</svg>
