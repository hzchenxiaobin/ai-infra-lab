<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">中心扩展计数：每扩展成功一层就是一个新回文</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">与第 5 题（取最长）共用骨架，区别在 count+1 而非 max</text>

  <!-- ===== Odd center: "aaa" centered at index 1 ===== -->
  <text x="30" y="76" font-size="12" fill="#b85450" font-weight="bold">奇数中心：以单个字符为中心（s = "aaa"，中心 i=1）</text>
  <g font-size="13">
    <!-- three cells a a a, center highlighted -->
    <rect x="216" y="86" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="234" y="108" text-anchor="middle" fill="#446688" font-weight="bold">a</text>
    <rect x="252" y="86" width="36" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="270" y="108" text-anchor="middle" fill="#b85450" font-weight="bold">a</text>
    <rect x="288" y="86" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="306" y="108" text-anchor="middle" fill="#446688" font-weight="bold">a</text>
    <text x="270" y="74" text-anchor="middle" font-size="9" fill="#b85450">中心 i=1</text>

    <!-- radius 0: center itself -->
    <text x="120" y="108" text-anchor="middle" font-size="10" fill="#4a7a3a">半径 0</text>
    <text x="120" y="122" text-anchor="middle" font-size="10" fill="#4a7a3a">"a" → +1</text>

    <!-- radius 1: expand outward -->
    <path d="M 250 104 L 238 104" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 290 104 L 302 104" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="380" y="104" text-anchor="middle" font-size="10" fill="#4a7a3a">半径 1：s[0]==s[2] ✓</text>
    <text x="380" y="118" text-anchor="middle" font-size="10" fill="#4a7a3a">"aaa" → +1</text>

    <!-- radius 2: out of range -->
    <path d="M 214 104 L 202 104" stroke="#888" stroke-width="0.8" fill="none" stroke-dasharray="2,2" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 326 104 L 338 104" stroke="#888" stroke-width="0.8" fill="none" stroke-dasharray="2,2" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="380" y="138" text-anchor="middle" font-size="10" fill="#888">半径 2：越界 ✗ 停止</text>
    <text x="380" y="152" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">该中心贡献 2 个回文</text>
  </g>

  <!-- ===== Even center: "aa" centered between two chars ===== -->
  <text x="30" y="184" font-size="12" fill="#4a7a3a" font-weight="bold">偶数中心：以两字符间隙为中心（s = "aaa"，中心 i=1,i+1=2）</text>
  <g font-size="13">
    <rect x="252" y="194" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="270" y="216" text-anchor="middle" fill="#4a7a3a" font-weight="bold">a</text>
    <rect x="288" y="194" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="306" y="216" text-anchor="middle" fill="#4a7a3a" font-weight="bold">a</text>
    <text x="288" y="246" text-anchor="middle" font-size="9" fill="#4a7a3a">中心 i=1, i+1=2（间隙）</text>

    <text x="120" y="216" text-anchor="middle" font-size="10" fill="#4a7a3a">半径 0：s[1]==s[2] ✓</text>
    <text x="120" y="230" text-anchor="middle" font-size="10" fill="#4a7a3a">"aa" → +1</text>

    <path d="M 250 212 L 238 212" stroke="#888" stroke-width="0.8" fill="none" stroke-dasharray="2,2" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 326 212 L 338 212" stroke="#888" stroke-width="0.8" fill="none" stroke-dasharray="2,2" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="380" y="216" text-anchor="middle" font-size="10" fill="#888">半径 1：越界 ✗ 停止</text>
    <text x="380" y="232" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">该中心贡献 1 个回文</text>
  </g>

  <!-- ===== Summary: settlement comparison ===== -->
  <line x1="20" y1="262" x2="520" y2="262" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <rect x="30" y="274" width="490" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="294" font-size="11" fill="#4a7a3a" font-weight="bold">结算对照（与第 5 题的唯一区别）：</text>
  <text x="50" y="314" font-size="10" fill="#555">第 5 题（最长回文子串）：max_len = max(max_len, len)   ← 取最长长度</text>
  <text x="50" y="332" font-size="10" fill="#555">第 647 题（回文子串）：ans += 1（每扩展成功一步）   ← 累加回文个数</text>
  <text x="50" y="354" font-size="10" fill="#4a7a3a" font-weight="bold">骨架相同：枚举 2n−1 个中心（含间隙）向外扩展，仅结算不同 → 总 O(n²)</text>
</svg>
