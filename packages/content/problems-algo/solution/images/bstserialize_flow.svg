<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">BST 序列化 / 反序列化流程（前序 + 值域上下界）</text>

  <!-- ===== 序列化侧 ===== -->
  <text x="150" y="56" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">serialize(root)</text>

  <polygon points="150,68 240,98 150,128 60,98" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="95" text-anchor="middle" font-size="11" fill="#333">root == null ?</text>
  <text x="150" y="110" text-anchor="middle" font-size="9" fill="#888">空子树</text>

  <path d="M 60 98 L 30 98 L 30 140" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="50" y="92" font-size="10" fill="#b85450">是</text>
  <rect x="0" y="144" width="70" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="35" y="163" text-anchor="middle" font-size="11" fill="#333">什么都不写</text>

  <path d="M 150 128 L 150 148" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="162" y="144" font-size="10" fill="#82b366">否</text>

  <rect x="70" y="152" width="160" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="150" y="171" text-anchor="middle" font-size="11" fill="#333">写 root.val + 分隔符</text>

  <path d="M 150 180 L 150 196" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="50" y="200" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="100" y="218" text-anchor="middle" font-size="10" fill="#333">serialize(left)</text>
  <rect x="160" y="200" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="210" y="218" text-anchor="middle" font-size="10" fill="#333">serialize(right)</text>

  <text x="150" y="250" text-anchor="middle" font-size="10" fill="#888">空子树不输出任何 token</text>

  <!-- 箭头到字符串 -->
  <path d="M 260 230 L 290 230" stroke="#82b366" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 字符串 -->
  <rect x="295" y="210" width="180" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="385" y="228" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">5,2,1,7,6,8</text>
  <text x="385" y="244" text-anchor="middle" font-size="9" fill="#888">只含值，无 # 标记</text>

  <!-- ===== 反序列化侧 ===== -->
  <text x="430" y="280" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">deserialize(data)</text>

  <rect x="310" y="290" width="240" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="430" y="309" text-anchor="middle" font-size="10" fill="#333">切分 token → 全局指针 ptr=0</text>

  <path d="M 430 318 L 430 336" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="310" y="340" width="240" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="430" y="359" text-anchor="middle" font-size="10" fill="#333">build(min, max) 带上下界递归</text>

  <path d="M 430 368 L 430 384" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="430,386 540,410 430,434 320,410" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="430" y="408" text-anchor="middle" font-size="10" fill="#333">ptr 未越界 且</text>
  <text x="430" y="422" text-anchor="middle" font-size="10" fill="#333">val ∈ (min, max) ?</text>

  <!-- 是/否分支 -->
  <path d="M 320 410 L 270 410 L 270 372" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="285" y="402" font-size="10" fill="#b85450">否</text>
  <rect x="225" y="356" width="90" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="270" y="370" text-anchor="middle" font-size="10" fill="#333">返回 null</text>
  <text x="270" y="382" text-anchor="middle" font-size="9" fill="#888">不消费 ptr</text>

  <text x="500" y="434" text-anchor="middle" font-size="9" fill="#82b366">是：消费 ptr，建节点</text>
  <text x="500" y="446" text-anchor="middle" font-size="9" fill="#82b366">build(min,val) | build(val,max)</text>
</svg>
