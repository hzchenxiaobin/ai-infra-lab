<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="34" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    完整对局数 = (finishFloor − startCeil) / 15
  </text>
  <text x="280" y="56" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">
    进入时刻向上取整到下一刻钟，退出时刻向下取整到上一刻钟
  </text>

  <rect x="140" y="205" width="80" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="230" text-anchor="middle" font-size="11" fill="#3a5a2a" filter="url(#rough2)">1 个完整对局</text>

  <line x1="60" y1="225" x2="500" y2="225" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>

  <line x1="60"  y1="215" x2="60"  y2="245" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="140" y1="215" x2="140" y2="245" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="220" y1="215" x2="220" y2="245" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="300" y1="215" x2="300" y2="245" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="380" y1="215" x2="380" y2="245" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="460" y1="215" x2="460" y2="245" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="60"  y="262" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">12:00</text>
  <text x="140" y="262" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">12:15</text>
  <text x="220" y="262" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">12:30</text>
  <text x="300" y="262" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">12:45</text>
  <text x="380" y="262" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">13:00</text>
  <text x="460" y="262" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">13:15</text>

  <circle cx="65" cy="225" r="4" fill="#b85450" filter="url(#rough2)"/>
  <text x="65" y="200" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">start 12:01</text>
  <line x1="65" y1="195" x2="138" y2="178" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="170" y="172" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">向上取整 → 12:15</text>

  <circle cx="295" cy="225" r="4" fill="#b85450" filter="url(#rough2)"/>
  <text x="295" y="295" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">finish 12:44</text>
  <line x1="295" y1="280" x2="222" y2="265" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="190" y="300" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">← 向下取整 12:30</text>

  <rect x="60" y="328" width="440" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="12" fill="#7a5a20" filter="url(#rough2)">
    ⚠ 12:00↔12:15 与 12:30↔12:45 这两段都不算（未完整覆盖）
  </text>
</svg>
