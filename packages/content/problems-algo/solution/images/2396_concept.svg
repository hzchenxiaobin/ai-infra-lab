<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：n 在 (n−2) 进制下恒写作 "12"，首尾不等</text>

  <!-- ===== Section 1: n >= 5 ===== -->
  <text x="40" y="56" font-size="12" fill="#4a7a3a" font-weight="bold">情形一　n ≥ 5：取 b = n − 2（必落在考查区间 [2, n−2] 内）</text>

  <rect x="40" y="68" width="480" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="90" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">n = 1 × (n − 2) + 2</text>
  <text x="280" y="108" text-anchor="middle" font-size="11" fill="#666">商为 1、余数为 2，且余数 2 &lt; n−2  →  (n−2) 进制表示恰为两位 "12"</text>

  <!-- digits 1 2, both endpoints highlighted red since unequal -->
  <g filter="url(#rough2)">
    <rect x="148" y="134" width="46" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6"/>
    <text x="171" y="166" text-anchor="middle" font-size="20" fill="#b85450" font-weight="bold">1</text>
    <rect x="194" y="134" width="46" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6"/>
    <text x="217" y="166" text-anchor="middle" font-size="20" fill="#b85450" font-weight="bold">2</text>
  </g>
  <text x="255" y="156" font-size="13" fill="#b85450" font-weight="bold">首位 1 ≠ 末位 2</text>
  <text x="255" y="174" font-size="12" fill="#888">→ 不是回文 ✗</text>

  <!-- divider -->
  <line x1="40" y1="200" x2="520" y2="200" stroke="#ddd" stroke-width="1.2" stroke-dasharray="3,4" filter="url(#rough2)"/>

  <!-- ===== Section 2: n = 4 ===== -->
  <text x="40" y="222" font-size="12" fill="#d6a040" font-weight="bold">情形二　n = 4：考查区间仅 {2}，b = 2</text>

  <g filter="url(#rough2)">
    <rect x="148" y="234" width="46" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6"/>
    <text x="171" y="266" text-anchor="middle" font-size="20" fill="#b85450" font-weight="bold">1</text>
    <rect x="194" y="234" width="46" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6"/>
    <text x="217" y="266" text-anchor="middle" font-size="20" fill="#d6a040" font-weight="bold">0</text>
    <rect x="240" y="234" width="46" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6"/>
    <text x="263" y="266" text-anchor="middle" font-size="20" fill="#b85450" font-weight="bold">0</text>
  </g>
  <text x="300" y="258" font-size="12" fill="#888">4 = 100₂</text>
  <text x="300" y="276" font-size="13" fill="#b85450" font-weight="bold">首位 1 ≠ 末位 0 ✗</text>

  <!-- ===== Insight box ===== -->
  <rect x="40" y="300" width="480" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="326" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">结论：对任意 n ≥ 4，n 都不是严格回文的</text>
  <text x="280" y="348" text-anchor="middle" font-size="11" fill="#666">只需看 b = n−2 这一个进制，即可「一票否决」</text>
  <text x="280" y="374" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">→ 答案恒为 false，O(1) 直接返回即可</text>
</svg>
