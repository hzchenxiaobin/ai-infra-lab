<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">环绕串 base：字母循环 + 合法子串由 (末字符, 长度) 唯一确定</text>

  <!-- 上半：字母循环条 -->
  <text x="40" y="62" font-size="12" fill="#888">base =</text>
  <g filter="url(#rough2)">
    <rect x="90" y="48" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="120" y="48" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="150" y="48" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="180" y="48" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="210" y="48" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="240" y="48" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="270" y="48" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="300" y="48" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="330" y="48" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="360" y="48" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="390" y="48" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="420" y="48" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="450" y="48" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="480" y="48" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
  </g>
  <text x="104" y="66" text-anchor="middle" font-size="11" fill="#333">a</text>
  <text x="134" y="66" text-anchor="middle" font-size="11" fill="#333">b</text>
  <text x="164" y="66" text-anchor="middle" font-size="11" fill="#333">c</text>
  <text x="194" y="66" text-anchor="middle" font-size="11" fill="#333">d</text>
  <text x="224" y="66" text-anchor="middle" font-size="11" fill="#333">e</text>
  <text x="254" y="66" text-anchor="middle" font-size="11" fill="#333">…</text>
  <text x="284" y="66" text-anchor="middle" font-size="11" fill="#333">x</text>
  <text x="314" y="66" text-anchor="middle" font-size="11" fill="#333">y</text>
  <text x="344" y="66" text-anchor="middle" font-size="11" fill="#333">z</text>
  <text x="374" y="66" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">a</text>
  <text x="404" y="66" text-anchor="middle" font-size="11" fill="#333">b</text>
  <text x="434" y="66" text-anchor="middle" font-size="11" fill="#333">c</text>
  <text x="464" y="66" text-anchor="middle" font-size="11" fill="#333">…</text>
  <text x="494" y="66" text-anchor="middle" font-size="11" fill="#333">z</text>

  <!-- 循环回环箭头 z -> a -->
  <path d="M 344 48 C 360 18, 380 18, 374 48" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="4,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="359" y="20" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">z → a 循环</text>

  <!-- 合法判定规则 -->
  <rect x="40" y="92" width="480" height="36" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="115" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">合法相邻：(p[i] − p[i−1] + 26) mod 26 = 1</text>

  <!-- 合法/非法示例 -->
  <text x="40" y="158" font-size="12" fill="#4a7a3a" font-weight="bold">✓ 合法 "zab"</text>
  <g filter="url(#rough2)">
    <rect x="130" y="142" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="160" y="142" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="190" y="142" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
  </g>
  <text x="145" y="161" text-anchor="middle" font-size="12" fill="#333">z</text>
  <text x="175" y="161" text-anchor="middle" font-size="12" fill="#333">a</text>
  <text x="205" y="161" text-anchor="middle" font-size="12" fill="#333">b</text>
  <text x="240" y="161" font-size="10" fill="#4a7a3a">z→a ✓</text>
  <text x="290" y="161" font-size="10" fill="#4a7a3a">a→b ✓</text>

  <text x="40" y="200" font-size="12" fill="#b85450" font-weight="bold">✗ 非法 "ca"</text>
  <g filter="url(#rough2)">
    <rect x="130" y="184" width="30" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <rect x="160" y="184" width="30" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
  </g>
  <text x="145" y="203" text-anchor="middle" font-size="12" fill="#333">c</text>
  <text x="175" y="203" text-anchor="middle" font-size="12" fill="#333">a</text>
  <text x="210" y="203" font-size="10" fill="#b85450">c→a：c+1=d ≠ a ✗</text>

  <!-- 下半：唯一性观察 -->
  <rect x="30" y="230" width="500" height="170" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="252" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">关键观察：合法子串 ⇔ (末字符 c, 长度 L) 一一对应</text>
  <text x="280" y="268" text-anchor="middle" font-size="10.5" fill="#888">内容被循环后继规则强制，给定 c 和 L 只有一种写法</text>

  <!-- 以 b 结尾的例子 -->
  <text x="50" y="296" font-size="11" fill="#888">末字符 c = 'b'：</text>

  <g filter="url(#rough2)">
    <rect x="60" y="306" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="100" y="306" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="140" y="306" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="180" y="306" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
  </g>
  <text x="200" y="323" text-anchor="middle" font-size="11" fill="#333">b</text>
  <text x="160" y="323" text-anchor="middle" font-size="11" fill="#333">a</text>
  <text x="120" y="323" text-anchor="middle" font-size="11" fill="#333">z</text>
  <text x="80" y="323" text-anchor="middle" font-size="11" fill="#bbb">y</text>
  <text x="80" y="346" text-anchor="middle" font-size="9.5" fill="#888">…</text>
  <text x="120" y="346" text-anchor="middle" font-size="9.5" fill="#888">…</text>
  <text x="160" y="346" text-anchor="middle" font-size="9.5" fill="#888">…</text>
  <text x="200" y="346" text-anchor="middle" font-size="9.5" fill="#888">…</text>

  <!-- 长度标签 -->
  <path d="M 190 330 L 190 356" stroke="#4a7a3a" stroke-width="1.2" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <path d="M 150 330 L 150 356" stroke="#d6a040" stroke-width="1.2" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <path d="M 110 330 L 110 356" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <text x="200" y="370" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">L=1 → "b"</text>
  <text x="160" y="370" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">L=2 → "ab"</text>
  <text x="120" y="370" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">L=3 → "zab"</text>

  <!-- 结论 -->
  <path d="M 250 330 L 285 330" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="295" y="306" width="220" height="50" fill="#fffdf3" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="405" y="326" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">若 dp['b'] = 3（最长合法段长 3）</text>
  <text x="405" y="344" text-anchor="middle" font-size="11" fill="#d6a040">→ 以 b 结尾的合法子串恰 3 个</text>

  <text x="280" y="392" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">答案 = Σ dp[c]，c ∈ a..z（不同末字符 ⇒ 子串必然不同，直接求和）</text>
</svg>
