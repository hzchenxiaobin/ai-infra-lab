<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">找到首个分歧点，剩下的必须一招搞定</text>

  <!-- ===== top: two aligned strings, divergence at i ===== -->
  <text x="40" y="70" font-size="12" fill="#446688" font-weight="bold">s:</text>
  <rect x="70" y="56" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="89" y="76" text-anchor="middle" font-size="13" fill="#333">a</text>
  <rect x="112" y="56" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="131" y="76" text-anchor="middle" font-size="13" fill="#333">b</text>
  <rect x="154" y="56" width="38" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="173" y="76" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">X</text>
  <rect x="196" y="56" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="215" y="76" text-anchor="middle" font-size="13" fill="#333">d</text>
  <rect x="238" y="56" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="257" y="76" text-anchor="middle" font-size="13" fill="#333">e</text>

  <text x="40" y="110" font-size="12" fill="#446688" font-weight="bold">t:</text>
  <rect x="70" y="96" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="89" y="116" text-anchor="middle" font-size="13" fill="#333">a</text>
  <rect x="112" y="96" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="131" y="116" text-anchor="middle" font-size="13" fill="#333">b</text>
  <rect x="154" y="96" width="38" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="173" y="116" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">Y</text>
  <rect x="196" y="96" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="215" y="116" text-anchor="middle" font-size="13" fill="#333">d</text>
  <rect x="238" y="96" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="257" y="116" text-anchor="middle" font-size="13" fill="#333">e</text>

  <!-- matched region bracket -->
  <path d="M68 142 L68 148 L150 148 L150 142" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="109" y="162" text-anchor="middle" font-size="10.5" fill="#4a7a3a">前缀完全相同</text>

  <!-- divergence marker -->
  <path d="M173 130 L173 144" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="173" y="162" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">i = 首个分歧</text>

  <!-- suffix equal bracket -->
  <path d="M194 142 L194 148 L278 148 L278 142" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="236" y="162" text-anchor="middle" font-size="10.5" fill="#446688">后缀须相同</text>

  <!-- divider -->
  <line x1="320" y1="50" x2="320" y2="170" stroke="#ddd" stroke-width="1.4" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="440" y="70" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold">在分歧点 i 处用一招</text>

  <!-- ===== three operation panels ===== -->
  <!-- Replace -->
  <rect x="340" y="84" width="220" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="360" y="106" font-size="11.5" fill="#333" font-weight="bold">替换 (replace)</text>
  <text x="360" y="124" font-size="10.5" fill="#888">m == n</text>
  <text x="360" y="140" font-size="10.5" fill="#d6a040" font-weight="bold">s[i+1:] == t[i+1:] ?</text>

  <!-- Insert -->
  <rect x="340" y="156" width="220" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="360" y="178" font-size="11.5" fill="#333" font-weight="bold">插入 (insert)</text>
  <text x="360" y="196" font-size="10.5" fill="#888">n − m == 1 （t 多一个）</text>
  <text x="360" y="212" font-size="10.5" fill="#4a7a3a" font-weight="bold">s[i:] == t[i+1:] ?</text>

  <!-- ===== bottom: the two rejection guards ===== -->
  <rect x="30" y="200" width="270" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="48" y="222" font-size="11.5" fill="#333" font-weight="bold">前置否决（直接 return false）</text>
  <text x="48" y="242" font-size="10.5" fill="#b85450">① |n − m| &gt; 1：一招修不了</text>
  <text x="48" y="260" font-size="10.5" fill="#b85450">② s == t：距离为 0，不是 1</text>

  <!-- trailing char case -->
  <rect x="340" y="232" width="220" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="450" y="254" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">循环走完没分歧</text>
  <text x="450" y="272" text-anchor="middle" font-size="10.5" fill="#446688">s 是 t 的前缀</text>
  <text x="450" y="290" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">仅当 n − m == 1 才 true</text>

  <!-- footer note -->
  <rect x="30" y="312" width="530" height="64" fill="#f6f6f6" stroke="#ccc" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="48" y="334" font-size="11" fill="#555" font-weight="bold">关键直觉</text>
  <text x="48" y="352" font-size="10.5" fill="#666">· 从左到右对齐比较，第一个不同的位置就是「唯一能动手」的地方</text>
  <text x="48" y="368" font-size="10.5" fill="#666">· 这一招用过后，两侧剩余后缀必须逐字相同；否则距离 &gt; 1</text>
</svg>
