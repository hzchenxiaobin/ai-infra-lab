<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察二：数值当节点 —— m 位超立方体上的多源 BFS</text>

  <text x="172" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">m = 3：2³ = 8 个节点，每条边 = 翻转恰好一位</text>

  <!-- 后方 4 条边（虚线示纵深） -->
  <line x1="134" y1="162" x2="234" y2="162" stroke="#b0b8c4" stroke-width="1.5" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <line x1="234" y1="162" x2="234" y2="242" stroke="#b0b8c4" stroke-width="1.5" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <line x1="234" y1="242" x2="134" y2="242" stroke="#b0b8c4" stroke-width="1.5" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <line x1="134" y1="242" x2="134" y2="162" stroke="#b0b8c4" stroke-width="1.5" stroke-dasharray="5,4" filter="url(#rough2)"/>

  <!-- 连接棱 -->
  <line x1="100" y1="190" x2="134" y2="162" stroke="#8a97a8" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="200" y1="190" x2="234" y2="162" stroke="#8a97a8" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="200" y1="270" x2="234" y2="242" stroke="#8a97a8" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="100" y1="270" x2="134" y2="242" stroke="#8a97a8" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- 前方 4 条边 -->
  <line x1="100" y1="190" x2="200" y2="190" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="200" y1="190" x2="200" y2="270" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="200" y1="270" x2="100" y2="270" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="100" y1="270" x2="100" y2="190" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>

  <text x="72" y="234" text-anchor="end" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">翻一位</text>

  <!-- 顶点：绿=层0(源) 蓝=层1 橙=层2 -->
  <circle cx="100" cy="190" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="100" y="194" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">010</text>

  <circle cx="134" cy="242" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="134" y="246" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">001</text>

  <circle cx="200" cy="190" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="194" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">110</text>

  <circle cx="100" cy="270" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="100" y="274" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">000</text>

  <circle cx="134" cy="162" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="134" y="166" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">011</text>

  <circle cx="234" cy="242" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="234" y="246" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">101</text>

  <circle cx="200" cy="270" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="200" y="274" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">100</text>

  <circle cx="234" cy="162" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="234" y="166" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">111</text>

  <!-- 右侧要点 -->
  <rect x="286" y="58" width="212" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="392" y="78" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">节点：0 ~ 2^m − 1</text>
  <text x="392" y="98" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">每个 m 位二进制数都是图上一个点</text>

  <rect x="286" y="124" width="212" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="392" y="144" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">边：x ⊕ (1 &lt;&lt; i)</text>
  <text x="392" y="164" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">i 取 0..m−1，翻转任一位即到邻居</text>

  <rect x="286" y="190" width="212" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="392" y="210" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">最短路 = 汉明距离</text>
  <text x="392" y="230" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">每步恰好改一位，差的位逐个翻掉</text>

  <rect x="286" y="256" width="212" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="392" y="276" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">多源 BFS：nums 全体入队</text>
  <text x="392" y="296" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">dist[v] = v 到数组的最小汉明距离</text>

  <!-- 图例与查询示例 -->
  <text x="260" y="334" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">图例：绿 = 层 0（数组元素）· 蓝 = 层 1 · 橙 = 层 2；本例源 = {001, 010}</text>
  <text x="260" y="352" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">查询 x = 110：~x = 001 是绿色源 → dist = 0 → answer = 3 − 0 = 3</text>
</svg>
