<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 356" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="520" height="356" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：A = [16, 33]，B = [4, 18]，k = 15（示例 1）</text>

  <rect x="30" y="40" width="70" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="65.0" y="56" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">i ∈ A</text>
  <rect x="100" y="40" width="130" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="165.0" y="56" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">窗口 [i−k, i+k]</text>
  <rect x="230" y="40" width="180" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="320.0" y="56" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">p 的移动（找首个 ≥ i−k）</text>
  <rect x="410" y="40" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="455.0" y="56" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">判定</text>
  <rect x="30" y="64" width="70" height="38" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="100" y="64" width="130" height="38" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="230" y="64" width="180" height="38" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="410" y="64" width="90" height="38" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="65" y="86" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">i = 16</text>
  <text x="165" y="86" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">[1, 31]</text>
  <text x="320" y="80" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">i−k = 1：B[0] = 4 ≥ 1</text>
  <text x="320" y="94" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">→ p 不动，停在 0</text>
  <text x="455" y="80" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4 ≤ 31</text>
  <text x="455" y="94" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 美丽</text>
  <rect x="30" y="102" width="70" height="38" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="100" y="102" width="130" height="38" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="230" y="102" width="180" height="38" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="410" y="102" width="90" height="38" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="65" y="124" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">i = 33</text>
  <text x="165" y="124" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">[18, 48]</text>
  <text x="320" y="118" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">i−k = 18：B[0] = 4 &lt; 18 → p = 1</text>
  <text x="320" y="132" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">B[1] = 18 ≥ 18，p 停</text>
  <text x="455" y="118" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">18 ≤ 48</text>
  <text x="455" y="132" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 美丽</text>
  <rect x="30" y="140" width="70" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="100" y="140" width="130" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="230" y="140" width="180" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="410" y="140" width="90" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="65" y="163" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">返回</text>
  <text x="165" y="164" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">[16, 33]</text>
  <text x="320" y="163" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">A 天然升序 ⇒ 答案天然升序</text>
  <text x="455" y="163" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">长度 2</text>
  <rect x="30" y="196" width="470" height="72" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="218" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">示例 2：s = "abcd"，a = b = "a"，k = 4 → A = B = [0]</text>
  <text x="260" y="238" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">i = 0：窗口 [−4, 4]，B[0] = 0 落在窗口内 → 返回 [0]</text>
  <text x="260" y="257" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i − k 为负无需特判（B 中下标均 ≥ 0）；同一位置可同时充当 i 和 j。</text>
  <rect x="30" y="284" width="470" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="306" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠️ 边界自查：a 或 b 比 s 长 → 对应列表为空 → 返回 [ ]；</text>
  <text x="260" y="326" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">C++ 循环条件写 i + len ≤ n，防止 size_t 下溢；k 可达 n 也不影响判定。</text>
</svg>
