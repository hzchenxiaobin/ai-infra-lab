<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">计数排序：元音只有 10 种，桶即天然有序</text>

  <text x="40" y="62" font-size="12" fill="#446688" filter="url(#rough2)">s = "lEetcOde"</text>
  <text x="300" y="62" font-size="11" fill="#888" filter="url(#rough2)">→ 统计每个元音出现次数</text>

  <!-- 10 buckets in ASCII order: A E I O U a e i o u -->
  <!-- bucket width 44, step 48, start x=30 -->
  <!-- A -->
  <rect x="30" y="80" width="44" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="52" y="100" text-anchor="middle" font-size="15" fill="#b8741a" font-weight="bold" filter="url(#rough2)">A</text>
  <text x="52" y="118" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">65</text>
  <text x="52" y="130" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <!-- E -->
  <rect x="78" y="80" width="44" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="100" text-anchor="middle" font-size="15" fill="#b8741a" font-weight="bold" filter="url(#rough2)">E</text>
  <text x="100" y="118" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">69</text>
  <text x="100" y="130" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <!-- I -->
  <rect x="126" y="80" width="44" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="100" text-anchor="middle" font-size="15" fill="#b8741a" font-weight="bold" filter="url(#rough2)">I</text>
  <text x="148" y="118" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">73</text>
  <text x="148" y="130" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <!-- O -->
  <rect x="174" y="80" width="44" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="196" y="100" text-anchor="middle" font-size="15" fill="#b8741a" font-weight="bold" filter="url(#rough2)">O</text>
  <text x="196" y="118" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">79</text>
  <text x="196" y="130" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <!-- U -->
  <rect x="222" y="80" width="44" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="244" y="100" text-anchor="middle" font-size="15" fill="#b8741a" font-weight="bold" filter="url(#rough2)">U</text>
  <text x="244" y="118" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">85</text>
  <text x="244" y="130" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <!-- a -->
  <rect x="270" y="80" width="44" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="292" y="100" text-anchor="middle" font-size="15" fill="#b8741a" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="292" y="118" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">97</text>
  <text x="292" y="130" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <!-- e -->
  <rect x="318" y="80" width="44" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="340" y="100" text-anchor="middle" font-size="15" fill="#b8741a" font-weight="bold" filter="url(#rough2)">e</text>
  <text x="340" y="118" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">101</text>
  <text x="340" y="130" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <!-- i -->
  <rect x="366" y="80" width="44" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="388" y="100" text-anchor="middle" font-size="15" fill="#b8741a" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="388" y="118" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">105</text>
  <text x="388" y="130" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <!-- o -->
  <rect x="414" y="80" width="44" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="436" y="100" text-anchor="middle" font-size="15" fill="#b8741a" font-weight="bold" filter="url(#rough2)">o</text>
  <text x="436" y="118" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">111</text>
  <text x="436" y="130" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <!-- u -->
  <rect x="462" y="80" width="44" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="484" y="100" text-anchor="middle" font-size="15" fill="#b8741a" font-weight="bold" filter="url(#rough2)">u</text>
  <text x="484" y="118" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">117</text>
  <text x="484" y="130" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>

  <text x="52" y="74" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">桶</text>
  <text x="100" y="74" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">↑ASCII</text>

  <!-- big bracket: buckets already in ASCII order -->
  <path d="M 30 140 L 30 152 L 506 152 L 506 140" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="268" y="166" text-anchor="middle" font-size="11" fill="#b8741a" filter="url(#rough2)">桶下标顺序 = ASCII 升序（大写段在前，小写段在后）</text>

  <!-- emission -->
  <text x="40" y="196" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">遍历 s 重建 t，遇元音位 → 从左到右取非空桶</text>

  <path d="M 100 168 L 100 200" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 196 168 L 196 200" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 340 168 L 340 200" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 340 168 L 376 200" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- emitted sequence -->
  <rect x="100" y="208" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="230" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">E</text>
  <rect x="196" y="208" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="214" y="230" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">O</text>
  <rect x="340" y="208" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="358" y="230" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">e</text>
  <rect x="376" y="208" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="394" y="230" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">e</text>

  <text x="118" y="258" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">E 桶×1</text>
  <text x="214" y="258" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">O 桶×1</text>
  <text x="358" y="258" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">e 桶第1个</text>
  <text x="394" y="258" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">e 桶第2个</text>

  <text x="40" y="288" font-size="11" fill="#555" filter="url(#rough2)">跳过空桶（计数=0），非空桶按计数次数连续输出 → 天然非递减</text>

  <text x="40" y="316" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">复杂度：</text>
  <text x="110" y="316" font-size="11" fill="#333" filter="url(#rough2)">计数 O(n) + 重建 O(n) = O(n) 时间，O(1) 额外空间（桶固定 10 个）</text>
  <text x="40" y="338" font-size="10" fill="#888" filter="url(#rough2)">对比通用 sort 的 O(n log n)：元音字母表大小固定=10，桶排序退化为线性</text>
</svg>
