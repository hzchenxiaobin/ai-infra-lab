<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：更新分数后重排 → 两次 RANK() 相减得 rank_diff</text>

  <!-- ===== Left: Old ranking ===== -->
  <text x="40" y="52" font-size="10" fill="#888">① 旧排名（points DESC, name ASC）</text>
  <rect x="30" y="58" width="180" height="160" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="48" y="76" font-size="9" fill="#446688" font-weight="bold">name        points  rank</text>
  <line x1="30" y1="82" x2="210" y2="82" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="48" y="98" font-size="10" fill="#333">Senegal     2132    1</text>
  <text x="48" y="116" font-size="10" fill="#333">Croatia     1817    2</text>
  <text x="48" y="134" font-size="10" fill="#333">Algeria     1431    3</text>
  <text x="48" y="152" font-size="10" fill="#333">NewZealand  1402    4</text>
  <text x="48" y="178" font-size="8" fill="#999">rank = RANK() OVER</text>
  <text x="48" y="190" font-size="8" fill="#999">(ORDER BY points DESC, name)</text>
  <text x="48" y="210" font-size="8" fill="#446688">记为 rank_old</text>

  <!-- Middle arrow: apply points_change -->
  <path d="M 210 130 Q 250 130 280 130" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="245" y="118" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">+ points_change</text>
  <text x="245" y="148" text-anchor="middle" font-size="8" fill="#888">更新分数</text>

  <!-- ===== Right: New ranking ===== -->
  <text x="290" y="52" font-size="10" fill="#888">② 新排名（points+change DESC, name ASC）</text>
  <rect x="280" y="58" width="200" height="160" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="298" y="76" font-size="9" fill="#4a7a3a" font-weight="bold">name        points'  rank'</text>
  <line x1="280" y1="82" x2="480" y2="82" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="298" y="98" font-size="10" fill="#333">Senegal     2110     1</text>
  <text x="298" y="116" font-size="10" fill="#b85450" font-weight="bold">Algeria     1830     2</text>
  <text x="298" y="134" font-size="10" fill="#d6a040" font-weight="bold">Croatia     1830     3</text>
  <text x="298" y="152" font-size="10" fill="#333">NewZealand  1402     4</text>
  <text x="298" y="178" font-size="8" fill="#999">rank' = RANK() OVER</text>
  <text x="298" y="190" font-size="8" fill="#999">(ORDER BY points+change DESC, name)</text>
  <text x="298" y="210" font-size="8" fill="#4a7a3a">记为 rank_new</text>

  <!-- Converging arrows to subtraction -->
  <path d="M 120 218 Q 120 250 200 268" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 380 218 Q 380 250 300 268" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="250" font-size="8" fill="#446688">rank_old</text>
  <text x="350" y="250" font-size="8" fill="#4a7a3a">rank_new</text>

  <!-- ===== Bottom: rank_diff formula ===== -->
  <rect x="100" y="270" width="420" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="290" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">rank_diff = rank_old − rank_new</text>
  <text x="310" y="308" text-anchor="middle" font-size="9" fill="#666">正值=排名上升(名次数变小) · 负值=排名下降 · 0=不变</text>

  <!-- ===== Movement arrows: Algeria up, Croatia down ===== -->
  <path d="M 148 134 C 200 134, 240 116, 288 116" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrg)" stroke-dasharray="4 2" filter="url(#rough2)"/>
  <text x="200" y="106" font-size="8" fill="#b85450">Algeria 3→2 ↑</text>
  <path d="M 148 116 C 200 116, 240 134, 288 134" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" stroke-dasharray="4 2" filter="url(#rough2)"/>
  <text x="208" y="148" font-size="8" fill="#d6a040">Croatia 2→3 ↓</text>

  <!-- ===== Bottom note ===== -->
  <rect x="30" y="332" width="560" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="350" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">关键：同名次用 (points DESC, name ASC) 排序——name 唯一故无并列</text>
  <text x="310" y="365" text-anchor="middle" font-size="9" fill="#888">RANK / DENSE_RANK / ROW_NUMBER 三者等价；两次排名作用于同一 JOIN 结果集即可相减</text>
</svg>
