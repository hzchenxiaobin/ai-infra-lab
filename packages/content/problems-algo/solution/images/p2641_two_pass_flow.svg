<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">两趟 DFS：先求层和，再改值</text>

  <!-- ===== Pass 1: compute levelSum ===== -->
  <rect x="20" y="44" width="520" height="180" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="40" y="68" font-size="12" fill="#b85450" font-weight="bold">第一趟 DFS：累加层和 levelSum</text>
  <text x="40" y="84" font-size="10" fill="#888">遍历每个节点，按深度 d 累加 node.val → levelSum[d]</text>

  <!-- Mini tree -->
  <g font-size="11">
    <circle cx="130" cy="120" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="130" y="124" text-anchor="middle" fill="#b85450" font-weight="bold">5</text>
    <circle cx="95" cy="160" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="95" y="164" text-anchor="middle" fill="#446688" font-weight="bold">4</text>
    <circle cx="165" cy="160" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="165" y="164" text-anchor="middle" fill="#446688" font-weight="bold">9</text>
    <line x1="119" y1="132" x2="103" y2="150" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
    <line x1="141" y1="132" x2="157" y2="150" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
    <circle cx="70" cy="200" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="70" y="204" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <circle cx="120" cy="200" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="120" y="204" text-anchor="middle" fill="#d6a040" font-weight="bold">10</text>
    <circle cx="165" cy="200" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="165" y="204" text-anchor="middle" fill="#4a7a3a" font-weight="bold">7</text>
    <line x1="85" y1="172" x2="74" y2="190" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
    <line x1="105" y1="172" x2="116" y2="190" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
    <line x1="165" y1="172" x2="165" y2="190" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  </g>

  <!-- DFS order arrow -->
  <text x="200" y="120" font-size="10" fill="#b85450" font-weight="bold">DFS 遍历</text>
  <path d="M 148 120 L 195 120" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- levelSum result -->
  <text x="220" y="100" font-size="11" fill="#444" font-weight="bold">结果 levelSum</text>
  <g font-size="11">
    <text x="220" y="120" font-size="10" fill="#b85450" font-weight="bold">d=0</text>
    <rect x="250" y="108" width="34" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="267" y="122" text-anchor="middle" fill="#b85450" font-weight="bold">5</text>

    <text x="300" y="120" font-size="10" fill="#446688" font-weight="bold">d=1</text>
    <rect x="330" y="108" width="34" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="347" y="122" text-anchor="middle" fill="#446688" font-weight="bold">13</text>

    <text x="380" y="120" font-size="10" fill="#d6a040" font-weight="bold">d=2</text>
    <rect x="410" y="108" width="34" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="427" y="122" text-anchor="middle" fill="#d6a040" font-weight="bold">18</text>
  </g>

  <!-- accumulator trace -->
  <text x="220" y="160" font-size="10" fill="#888">累加过程：</text>
  <text x="220" y="178" font-size="10" fill="#666">5 → [5]</text>
  <text x="220" y="194" font-size="10" fill="#666">+4,+9 → [5,13]</text>
  <text x="220" y="210" font-size="10" fill="#666">+1,+10,+7 → [5,13,18]</text>

  <!-- arrow between passes -->
  <path d="M 280 228 L 280 244" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== Pass 2: update values ===== -->
  <rect x="20" y="250" width="520" height="210" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="40" y="274" font-size="12" fill="#b85450" font-weight="bold">第二趟 DFS：用 levelSum 改写每个节点</text>
  <text x="40" y="290" font-size="10" fill="#888">root 无堂兄弟 → 置 0；对每个父节点，用子节点旧值算 siblingSum，再更新子节点</text>

  <!-- Step 1: root -->
  <text x="40" y="316" font-size="10" fill="#b85450" font-weight="bold">① root（d=0）无堂兄弟</text>
  <rect x="200" y="304" width="80" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="240" y="318" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">5 → 0</text>

  <!-- Step 2: node 4 children -->
  <text x="40" y="350" font-size="10" fill="#446688" font-weight="bold">② 父=4（d=1）</text>
  <text x="130" y="350" font-size="10" fill="#666">siblingSum = 1+10 = 11</text>
  <text x="290" y="350" font-size="10" fill="#666">→ 1.val = 18−11 =</text>
  <rect x="400" y="338" width="26" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="413" y="353" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">7</text>
  <text x="436" y="350" font-size="10" fill="#666">, 10.val =</text>
  <rect x="486" y="338" width="26" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="499" y="353" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">7</text>

  <!-- Step 3: node 9 children -->
  <text x="40" y="382" font-size="10" fill="#446688" font-weight="bold">③ 父=9（d=1）</text>
  <text x="130" y="382" font-size="10" fill="#666">siblingSum = 7（仅一个子）</text>
  <text x="290" y="382" font-size="10" fill="#666">→ 7.val = 18−7 =</text>
  <rect x="400" y="370" width="26" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="413" y="385" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">11</text>

  <!-- Result tree -->
  <line x1="20" y1="400" x2="540" y2="400" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="424" font-size="11" fill="#444" font-weight="bold">结果</text>
  <g font-size="11">
    <circle cx="120" cy="440" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="120" y="444" text-anchor="middle" fill="#b85450" font-weight="bold">0</text>
    <circle cx="90" cy="464" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="90" y="468" text-anchor="middle" fill="#446688" font-weight="bold">0</text>
    <circle cx="150" cy="464" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="150" y="468" text-anchor="middle" fill="#446688" font-weight="bold">0</text>
    <line x1="110" y1="452" x2="96" y2="456" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
    <line x1="130" y1="452" x2="144" y2="456" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  </g>
  <text x="200" y="446" font-size="10" fill="#888">root = 0, depth 1 全为 0（各自兄弟和 = 整层和）</text>
  <text x="200" y="464" font-size="10" fill="#888">depth 2: {1,10}→7, {7}→11（兄弟越少，堂兄弟和越大）</text>

  <!-- key insight -->
  <rect x="330" y="424" width="210" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="435" y="440" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">关键：先读子节点旧值算 siblingSum</text>
  <text x="435" y="454" text-anchor="middle" font-size="10" fill="#4a7a3a">再写入新值，DFS 天然保证不踩</text>
</svg>
