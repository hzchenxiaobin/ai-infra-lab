<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">示例 1 演算：coins = [1,4,10]，target = 19</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">x = 当前最小缺口；不变式：已处理硬币的子集和恰为 [1, x−1]</text>

  <!-- highlight rows -->
  <rect x="40" y="122" width="440" height="36" fill="#fff8e1" filter="url(#rough2)"/>
  <rect x="40" y="194" width="440" height="36" fill="#fff8e1" filter="url(#rough2)"/>

  <!-- header -->
  <rect x="40" y="56" width="440" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="70" y="76" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">步骤</text>
  <text x="135" y="76" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">x（缺口）</text>
  <text x="205" y="76" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">面值 c</text>
  <text x="310" y="76" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">动作</text>
  <text x="430" y="76" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">覆盖范围</text>

  <!-- table outline -->
  <rect x="40" y="56" width="440" height="246" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- column separators -->
  <path d="M 100 56 L 100 302 M 170 56 L 170 302 M 240 56 L 240 302 M 380 56 L 380 302" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- row separators -->
  <path d="M 40 86 L 480 86 M 40 122 L 480 122 M 40 158 L 480 158 M 40 194 L 480 194 M 40 230 L 480 230 M 40 266 L 480 266" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 1 -->
  <text x="70" y="109" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">①</text>
  <text x="135" y="109" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="205" y="109" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="310" y="109" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">c≤x：吸收 → x=2</text>
  <text x="430" y="109" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1, 1]</text>

  <!-- row 2 -->
  <text x="70" y="145" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">②</text>
  <text x="135" y="145" text-anchor="middle" font-size="11" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="205" y="145" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="310" y="145" text-anchor="middle" font-size="10.5" fill="#8a6420" font-weight="bold" filter="url(#rough2)">4&gt;2：补面值 2（ans=1）</text>
  <text x="430" y="145" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1, 3]</text>

  <!-- row 3 -->
  <text x="70" y="181" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">③</text>
  <text x="135" y="181" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="205" y="181" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="310" y="181" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">c≤x：吸收 → x=8</text>
  <text x="430" y="181" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1, 7]</text>

  <!-- row 4 -->
  <text x="70" y="217" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">④</text>
  <text x="135" y="217" text-anchor="middle" font-size="11" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="205" y="217" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">10</text>
  <text x="310" y="217" text-anchor="middle" font-size="10.5" fill="#8a6420" font-weight="bold" filter="url(#rough2)">10&gt;8：补面值 8（ans=2）</text>
  <text x="430" y="217" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1, 15]</text>

  <!-- row 5 -->
  <text x="70" y="253" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">⑤</text>
  <text x="135" y="253" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">16</text>
  <text x="205" y="253" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">10</text>
  <text x="310" y="253" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">c≤x：吸收 → x=26</text>
  <text x="430" y="253" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1, 25]</text>

  <!-- row 6 -->
  <text x="70" y="289" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">⑥</text>
  <text x="135" y="289" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">26</text>
  <text x="205" y="289" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>
  <text x="310" y="289" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">26&gt;19：终止</text>
  <text x="430" y="289" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">⊇ [1, 19] ✓</text>

  <!-- bottom note -->
  <rect x="40" y="320" width="440" height="68" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="10" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="342" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">橙色行即新增硬币 {2, 8}，与官方解释一致</text>
  <text x="260" y="362" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">示例 3 [1,1,1]、target = 20 同款流程：吸收完 3 枚 1 后 x = 4，</text>
  <text x="260" y="378" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">硬币用尽，连补 4、8、16 三枚，ans = 3 ✓</text>
</svg>
