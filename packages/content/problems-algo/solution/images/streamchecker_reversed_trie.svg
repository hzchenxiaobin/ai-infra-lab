<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="6" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fdfcf7"/>

  <!-- Title -->
  <text x="270" y="28" text-anchor="middle" font-size="17" fill="#2b2b2b" font-weight="bold">反向后缀 Trie：单词倒插，查询倒走</text>
  <path d="M 150 36 Q 270 44 390 36" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#sk)"/>

  <!-- Left: words reversed box -->
  <g filter="url(#sk)">
    <rect x="25" y="62" width="170" height="110" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5,3"/>
  </g>
  <text x="110" y="82" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">单词倒序后插入</text>
  <text x="45" y="106" font-size="13" fill="#444">"cd" →</text>
  <text x="115" y="106" font-size="13" fill="#c98a2b" font-weight="bold">"dc"</text>
  <text x="45" y="128" font-size="13" fill="#444">"f"  →</text>
  <text x="115" y="128" font-size="13" fill="#c98a2b" font-weight="bold">"f"</text>
  <text x="45" y="150" font-size="13" fill="#444">"kl" →</text>
  <text x="115" y="150" font-size="13" fill="#c98a2b" font-weight="bold">"lk"</text>

  <!-- Arrow from box to trie -->
  <path d="M 200 117 L 235 117" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Trie tree: root -->
  <g filter="url(#sk)">
    <circle cx="340" cy="92" r="17" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="340" y="96" text-anchor="middle" font-size="11" fill="#2b2b2b">root</text>

  <!-- edges root -> d / f / l -->
  <g filter="url(#sk)">
    <path d="M 327 104 Q 290 122 265 147" stroke="#4a8edb" stroke-width="1.4" fill="none"/>
    <path d="M 340 109 L 340 177" stroke="#4a8edb" stroke-width="1.4" fill="none"/>
    <path d="M 353 104 Q 390 122 415 147" stroke="#4a8edb" stroke-width="1.4" fill="none"/>
  </g>

  <!-- node d -->
  <g filter="url(#sk)">
    <circle cx="260" cy="157" r="15" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="260" y="161" text-anchor="middle" font-size="13" fill="#2b2b2b">d</text>

  <!-- node f (end) -->
  <g filter="url(#sk)">
    <circle cx="340" cy="192" r="15" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
  </g>
  <text x="340" y="196" text-anchor="middle" font-size="13" fill="#2b2b2b">f</text>

  <!-- node l -->
  <g filter="url(#sk)">
    <circle cx="420" cy="157" r="15" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="420" y="161" text-anchor="middle" font-size="13" fill="#2b2b2b">l</text>

  <!-- edge d -> c -->
  <g filter="url(#sk)">
    <path d="M 260 172 L 260 222" stroke="#4a8edb" stroke-width="1.4" fill="none"/>
  </g>

  <!-- node c (end) -->
  <g filter="url(#sk)">
    <circle cx="260" cy="237" r="15" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
  </g>
  <text x="260" y="241" text-anchor="middle" font-size="13" fill="#2b2b2b">c</text>

  <!-- edge l -> k -->
  <g filter="url(#sk)">
    <path d="M 420 172 L 420 222" stroke="#4a8edb" stroke-width="1.4" fill="none"/>
  </g>

  <!-- node k (end) -->
  <g filter="url(#sk)">
    <circle cx="420" cy="237" r="15" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
  </g>
  <text x="420" y="241" text-anchor="middle" font-size="13" fill="#2b2b2b">k</text>

  <!-- end markers -->
  <text x="285" y="242" font-size="11" fill="#4a8e4a" font-weight="bold">●end</text>
  <text x="365" y="197" font-size="11" fill="#4a8e4a" font-weight="bold">●end</text>
  <text x="445" y="242" font-size="11" fill="#4a8e4a" font-weight="bold">●end</text>

  <!-- bottom explanation box -->
  <g filter="url(#sk)">
    <rect x="25" y="275" width="490" height="70" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="45" y="298" font-size="12" fill="#2b2b2b" font-weight="bold">核心洞察：</text>
  <text x="45" y="316" font-size="11" fill="#444">后缀匹配 = 从末尾倒着读。把单词倒序插 Trie，查询时从最新字符往回走，</text>
  <text x="45" y="332" font-size="11" fill="#444">沿 Trie 下行，命中 is_end 节点即后缀命中某单词。</text>
</svg>
