<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：定长窗口 + 字母频次比对</text>

  <!-- s string cells -->
  <text x="20" y="74" font-size="12" fill="#888">s：</text>
  <rect x="50" y="58" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="68" y="79" text-anchor="middle" font-size="12" fill="#333">c</text>
  <rect x="88" y="58" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="106" y="79" text-anchor="middle" font-size="12" fill="#333">b</text>
  <rect x="126" y="58" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="144" y="79" text-anchor="middle" font-size="12" fill="#333">a</text>
  <rect x="164" y="58" width="36" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="182" y="79" text-anchor="middle" font-size="12" fill="#aaa">e</text>
  <rect x="202" y="58" width="36" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="220" y="79" text-anchor="middle" font-size="12" fill="#aaa">b</text>
  <rect x="240" y="58" width="36" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="258" y="79" text-anchor="middle" font-size="12" fill="#aaa">a</text>
  <rect x="278" y="58" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="296" y="79" text-anchor="middle" font-size="12" fill="#333">b</text>
  <rect x="316" y="58" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="334" y="79" text-anchor="middle" font-size="12" fill="#333">a</text>
  <rect x="354" y="58" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="372" y="79" text-anchor="middle" font-size="12" fill="#333">c</text>
  <rect x="392" y="58" width="36" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="410" y="79" text-anchor="middle" font-size="12" fill="#aaa">d</text>

  <!-- index labels -->
  <text x="68" y="106" text-anchor="middle" font-size="8.5" fill="#aaa">0</text>
  <text x="106" y="106" text-anchor="middle" font-size="8.5" fill="#aaa">1</text>
  <text x="144" y="106" text-anchor="middle" font-size="8.5" fill="#aaa">2</text>
  <text x="182" y="106" text-anchor="middle" font-size="8.5" fill="#aaa">3</text>
  <text x="220" y="106" text-anchor="middle" font-size="8.5" fill="#aaa">4</text>
  <text x="258" y="106" text-anchor="middle" font-size="8.5" fill="#aaa">5</text>
  <text x="296" y="106" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">6</text>
  <text x="334" y="106" text-anchor="middle" font-size="8.5" fill="#aaa">7</text>
  <text x="372" y="106" text-anchor="middle" font-size="8.5" fill="#aaa">8</text>
  <text x="410" y="106" text-anchor="middle" font-size="8.5" fill="#aaa">9</text>

  <!-- window bracket 1: [c,b,a] at index 0 -->
  <path d="M 52 50 L 52 44 L 160 44 L 160 50" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="106" y="38" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">窗口 [0,2]="cba" ✓ 异位词</text>

  <!-- window bracket 2: [b,a,c] at index 6 -->
  <path d="M 280 50 L 280 44 L 388 44 L 388 50" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="334" y="38" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">窗口 [6,8]="bac" ✓ 异位词</text>

  <!-- p target -->
  <text x="20" y="146" font-size="12" fill="#888">p = "abc"：</text>
  <rect x="110" y="130" width="80" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="150" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a:1 b:1 c:1</text>
  <text x="210" y="150" font-size="11" fill="#888">（目标频次 need）</text>

  <!-- key idea -->
  <rect x="30" y="176" width="480" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="200" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">窗口大小固定 = len(p) = 3</text>
  <text x="270" y="220" text-anchor="middle" font-size="11.5" fill="#555">窗口右移一格：进入 1 字符、离开 1 字符</text>
  <text x="270" y="236" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">频次增量更新 → win == need 即异位词</text>

  <!-- footer -->
  <rect x="30" y="252" width="480" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="274" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">每步 O(1) 更新 → 整体 O(n)</text>
  <text x="270" y="290" text-anchor="middle" font-size="11" fill="#888">用 match 计数避免每步 O(26) 全量比较</text>

  <rect x="30" y="306" width="480" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="330" text-anchor="middle" font-size="11.5" fill="#444">异位词 = 长度相同 + 各字母频次相同</text>
</svg>
