<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：按烹饪方式分桶，每桶一个有序集合 (−评分, 食物名)，begin() 即最高分</text>
  <text x="320" y="44" text-anchor="middle" font-size="10" fill="#888">有序集合按 (−评分, 名) 升序 → 最负评分 = 最高分；并列时字典序最小者排前</text>

  <!-- ============ korean bucket ============ -->
  <rect x="24" y="64" width="180" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="114" y="83" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">korean</text>
  <!-- best row -->
  <rect x="24" y="96" width="180" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="114" y="116" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">(−9, kimchi)</text>
  <text x="190" y="116" font-size="10" fill="#4a7a3a" font-weight="bold">← 最高</text>
  <!-- row2 -->
  <rect x="24" y="132" width="180" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="114" y="152" text-anchor="middle" font-size="12" fill="#666">(−7, bulgogi)</text>
  <!-- begin arrow -->
  <path d="M 14 112 L 22 112" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="14" y="104" font-size="9" fill="#b85450" font-weight="bold">begin()</text>

  <!-- ============ japanese bucket ============ -->
  <rect x="230" y="64" width="180" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="320" y="83" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">japanese</text>
  <!-- best row -->
  <rect x="230" y="96" width="180" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="116" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">(−14, ramen)</text>
  <text x="396" y="116" font-size="10" fill="#4a7a3a" font-weight="bold">← 最高</text>
  <!-- row2 -->
  <rect x="230" y="132" width="180" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="152" text-anchor="middle" font-size="12" fill="#666">(−12, miso)</text>
  <!-- row3 -->
  <rect x="230" y="168" width="180" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="188" text-anchor="middle" font-size="12" fill="#666">(−8, sushi)</text>
  <!-- begin arrow -->
  <path d="M 220 112 L 228 112" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="220" y="104" font-size="9" fill="#b85450" font-weight="bold">begin()</text>

  <!-- ============ greek bucket ============ -->
  <rect x="436" y="64" width="180" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="526" y="83" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">greek</text>
  <!-- best row -->
  <rect x="436" y="96" width="180" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="526" y="116" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">(−15, moussaka)</text>
  <text x="600" y="116" font-size="10" fill="#4a7a3a" font-weight="bold">← 最高</text>
  <!-- begin arrow -->
  <path d="M 426 112 L 434 112" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="426" y="104" font-size="9" fill="#b85450" font-weight="bold">begin()</text>

  <!-- bucket brace label -->
  <text x="320" y="222" text-anchor="middle" font-size="11" fill="#888">cuisineSet：每种烹饪方式 → 一个有序集合（按 (−评分, 食物名) 升序）</text>

  <!-- ============ metadata maps ============ -->
  <rect x="24" y="234" width="298" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="173" y="254" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">foodRating：食物 → 当前评分</text>
  <text x="173" y="276" text-anchor="middle" font-size="11" fill="#666">ramen:14  sushi:8  miso:12  kimchi:9 ...</text>
  <text x="173" y="296" text-anchor="middle" font-size="10" fill="#d6a040">changeRating 时更新此表</text>

  <rect x="342" y="234" width="274" height="74" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="479" y="254" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">foodCuisine：食物 → 烹饪方式</text>
  <text x="479" y="276" text-anchor="middle" font-size="11" fill="#666">sushi→japanese  ramen→japanese</text>
  <text x="479" y="296" text-anchor="middle" font-size="10" fill="#446688">changeRating 据此找到对应桶</text>

  <!-- ============ principle callout ============ -->
  <rect x="24" y="326" width="592" height="94" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="320" y="348" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">分桶 + 有序集合：评分取负把「最大评分」翻成「最小元」</text>
  <text x="320" y="368" text-anchor="middle" font-size="11" fill="#666">highestRated：取桶的 begin() → 最高分且字典序最小，O(1)</text>
  <text x="320" y="386" text-anchor="middle" font-size="11" fill="#666">changeRating：erase 旧 (−旧分,名) + insert 新 (−新分,名)，O(log n)</text>
  <text x="320" y="406" text-anchor="middle" font-size="10" fill="#b85450">并列取字典序小：pair 第二键 food 名天然升序，begin() 自动命中</text>
</svg>
