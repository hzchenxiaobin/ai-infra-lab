  <rect x="90" y="282" width="290" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="10" filter="url(#rough2)"/>
  <text x="235" y="303" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">difference_in_score</text>
  <text x="235" y="326" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">230 − 119 = 111</text>

  <text x="280" y="362" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">6 行各自求行内总和；聚合阶段只保留两个标量：最大 230、最小 119</text>
