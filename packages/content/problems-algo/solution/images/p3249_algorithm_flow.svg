<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="16.5" fill="#333" font-weight="bold" filter="url(#rough2)">一趟 BFS + 一趟倒序扫描搞定</text>

  <rect x="155" y="36" width="210" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="60" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">① 建邻接表（无向边双向加入）</text>

  <line x1="260" y1="74" x2="260" y2="92" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="155" y="94" width="210" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="118" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">② BFS 定根 0：parent[] + order[]</text>

  <line x1="260" y1="132" x2="260" y2="150" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="152" width="280" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="174" text-anchor="middle" font-size="12" fill="#3a6a2a" font-weight="bold" filter="url(#rough2)">③ 倒序扫 order（孩子先于父亲）</text>
  <text x="260" y="196" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">size[u] = 1 + Σ size[孩子]</text>

  <line x1="260" y1="206" x2="260" y2="226" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="222" font-size="10.5" fill="#777" filter="url(#rough2)">对 order 中每个 u</text>

  <polygon points="260,228 340,258 260,288 180,258" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="263" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">孩子 size 全相同？</text>

  <line x1="340" y1="258" x2="386" y2="258" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="352" y="250" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="388" y="240" width="96" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="436" y="263" text-anchor="middle" font-size="12.5" fill="#3a6a2a" font-weight="bold" filter="url(#rough2)">ans += 1</text>

  <line x1="260" y1="288" x2="260" y2="310" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="304" font-size="11.5" fill="#a05a54" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="170" y="312" width="180" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="335" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">④ 返回 ans</text>

  <text x="436" y="312" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">叶子无孩子</text>
  <text x="436" y="327" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">⇒ 空真 ⇒ 计入</text>
</svg>
