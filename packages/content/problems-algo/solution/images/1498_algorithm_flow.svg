<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：排序 + 预处理幂 → 双指针定界 → 累加 2^(right−left)</text>

  <!-- Start -->
  <ellipse cx="220" cy="42" rx="40" ry="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="220" y="46" text-anchor="middle" font-size="12" fill="#333">开始</text>

  <path d="M 220 57 L 220 64" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box1: sort + precompute pow2 -->
  <rect x="90" y="66" width="260" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="220" y="86" text-anchor="middle" font-size="11.5" fill="#333">排序 nums；预处理 pow2[0..n] mod p</text>

  <path d="M 220 96 L 220 102" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box2: init -->
  <rect x="90" y="104" width="260" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="220" y="124" text-anchor="middle" font-size="11.5" fill="#333">left = 0, right = n − 1, ans = 0</text>

  <path d="M 220 134 L 220 140" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond1: left < n 且 right >= left ? -->
  <polygon points="220,142 300,172 220,202 140,172" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="168" text-anchor="middle" font-size="11" fill="#333">left &lt; n 且</text>
  <text x="220" y="182" text-anchor="middle" font-size="11" fill="#333">right ≥ left ?</text>

  <!-- No branch right -->
  <path d="M 300 172 L 376 172" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="166" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <!-- return ans box -->
  <rect x="376" y="156" width="130" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="441" y="176" text-anchor="middle" font-size="11.5" fill="#333">返回 ans</text>

  <path d="M 441 188 L 441 196" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- End -->
  <ellipse cx="441" cy="212" rx="40" ry="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="441" y="216" text-anchor="middle" font-size="12" fill="#333">结束</text>

  <!-- Yes branch down -->
  <path d="M 220 202 L 220 228" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="230" y="220" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Diamond2: nums[left]+nums[right] > target ? -->
  <polygon points="220,228 320,258 220,288 120,258" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="254" text-anchor="middle" font-size="10.5" fill="#333">nums[left]+nums[right]</text>
  <text x="220" y="268" text-anchor="middle" font-size="11" fill="#333">&gt; target ?</text>

  <!-- Yes branch right: right decrement -->
  <path d="M 320 258 L 376 258" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="332" y="252" font-size="11" fill="#b85450" font-weight="bold">是</text>

  <rect x="376" y="242" width="130" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="441" y="262" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">right −−</text>

  <!-- right decrement: loop back to Diamond2 top -->
  <path d="M 441 242 L 441 212 L 220 212 L 220 228" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="332" y="206" font-size="9.5" fill="#b85450">回到判断</text>

  <!-- No branch down -->
  <path d="M 220 288 L 220 318" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="230" y="306" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- Box3: ans += pow2[right-left]; left++ -->
  <rect x="90" y="320" width="260" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="220" y="339" text-anchor="middle" font-size="11.5" fill="#333">ans += pow2[right − left]</text>
  <text x="220" y="355" text-anchor="middle" font-size="11.5" fill="#333">left += 1</text>

  <!-- loop back to Diamond1 -->
  <path d="M 90 342 L 52 342 L 52 172 L 140 172" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="40" y="166" font-size="10.5" fill="#4a7a3a">回到外层</text>

  <!-- footer note -->
  <rect x="56" y="386" width="448" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="406" text-anchor="middle" font-size="11" fill="#555">外层 left 递增、内层 right 单调递减，合计 O(n)；排序 O(n log n)</text>
  <text x="280" y="424" text-anchor="middle" font-size="11" fill="#555">right &lt; left 时整体终止（后续 left 更大必然也超 target）</text>
  <text x="280" y="440" text-anchor="middle" font-size="10" fill="#888">时间 O(n log n)，空间 O(n)（幂表）</text>
</svg>
