<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">Trie 起点下行：走一条链，判定所有「以 j 开头」的单词</text>

  <!-- ===== 上支 a-b-c-d-e-f ===== -->
  <path d="M84,142 L134,82" stroke="#bbb" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="100" y="102" font-size="11" fill="#888" filter="url(#rough2)">a</text>
  <circle cx="146" cy="72" r="13" fill="#fff" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="146" y="77" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">a</text>

  <path d="M159,72 L192,72" stroke="#bbb" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="176" y="64" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">b</text>
  <circle cx="205" cy="72" r="13" fill="#fff" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="205" y="77" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">b</text>

  <path d="M218,72 L248,72" stroke="#bbb" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="233" y="64" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">c</text>
  <circle cx="262" cy="72" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <circle cx="262" cy="72" r="10" fill="none" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="262" y="77" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">c</text>
  <rect x="238" y="32" width="48" height="18" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="262" y="45" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">abc ¥1</text>

  <path d="M277,72 L305,72" stroke="#bbb" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="291" y="64" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">d</text>
  <circle cx="319" cy="72" r="13" fill="#fff" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="319" y="77" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">d</text>

  <path d="M332,72 L360,72" stroke="#bbb" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="346" y="64" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">e</text>
  <circle cx="374" cy="72" r="13" fill="#fff" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="374" y="77" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">e</text>

  <path d="M387,72 L412,72" stroke="#bbb" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="400" y="64" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">f</text>
  <circle cx="428" cy="72" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <circle cx="428" cy="72" r="10" fill="none" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="428" y="77" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">f</text>
  <rect x="392" y="32" width="72" height="18" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="428" y="45" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">abdef ¥100</text>

  <!-- ===== root ===== -->
  <circle cx="70" cy="150" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="70" y="155" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">root</text>

  <!-- ===== 中支 d-e-f ===== -->
  <path d="M84,150 L135,150" stroke="#d6a040" stroke-width="2.6" fill="none" filter="url(#rough2)"/>
  <text x="104" y="143" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">d</text>
  <circle cx="148" cy="150" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <circle cx="148" cy="150" r="10" fill="none" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="148" y="155" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">d</text>
  <rect x="122" y="176" width="52" height="18" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="148" y="189" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">d ¥1</text>

  <path d="M163,150 L192,150" stroke="#d6a040" stroke-width="2.6" fill="none" filter="url(#rough2)"/>
  <text x="178" y="143" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">e</text>
  <circle cx="205" cy="150" r="13" fill="#fff" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="205" y="155" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">e</text>

  <path d="M218,150 L246,150" stroke="#d6a040" stroke-width="2.6" fill="none" filter="url(#rough2)"/>
  <text x="232" y="143" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">f</text>
  <circle cx="260" cy="150" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <circle cx="260" cy="150" r="10" fill="none" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="260" y="155" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">f</text>
  <rect x="224" y="176" width="72" height="18" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="260" y="189" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">def ¥10</text>

  <!-- ===== 下支 e-f ===== -->
  <path d="M70,166 L70,236 L133,236" stroke="#b85450" stroke-width="2.6" fill="none" filter="url(#rough2)"/>
  <text x="104" y="229" text-anchor="middle" font-size="11" fill="#8c3a36" filter="url(#rough2)">e</text>
  <circle cx="146" cy="236" r="13" fill="#fff" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="146" y="241" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">e</text>
  <path d="M159,236 L188,236" stroke="#b85450" stroke-width="2.6" fill="none" filter="url(#rough2)"/>
  <text x="174" y="229" text-anchor="middle" font-size="11" fill="#8c3a36" filter="url(#rough2)">f</text>
  <circle cx="202" cy="236" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <circle cx="202" cy="236" r="10" fill="none" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="202" y="241" text-anchor="middle" font-size="11" fill="#8c3a36" filter="url(#rough2)">f</text>
  <rect x="174" y="262" width="56" height="18" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="202" y="275" text-anchor="middle" font-size="9.5" fill="#8c3a36" filter="url(#rough2)">ef ¥5</text>

  <text x="332" y="148" font-size="10" fill="#888" filter="url(#rough2)">双圈 = 单词终点</text>
  <text x="332" y="164" font-size="10" fill="#888" filter="url(#rough2)">（重复单词只留最小 ¥）</text>

  <!-- 右侧：两条下行演示 -->
  <rect x="330" y="196" width="176" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="418" y="214" text-anchor="middle" font-size="10" font-weight="bold" fill="#a07830" filter="url(#rough2)">起点 j=3，读 target[3..]="def"</text>
  <text x="418" y="230" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">沿途命中 d(¥1)→dp[4]，def(¥10)→dp[6]</text>
  <text x="418" y="244" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">走一步同时判一串单词前缀</text>

  <rect x="330" y="262" width="176" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="418" y="280" text-anchor="middle" font-size="10" font-weight="bold" fill="#8c3a36" filter="url(#rough2)">起点 j=4，读 target[4..]="ef"</text>
  <text x="418" y="296" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">命中 ef(¥5)：dp[6]=dp[4]+5=7 ★</text>
  <text x="418" y="310" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">边断（无出边）即提前终止</text>

  <!-- 底部警示 -->
  <rect x="30" y="318" width="288" height="34" rx="8" fill="#fff" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="174" y="332" text-anchor="middle" font-size="9.5" fill="#8c3a36" filter="url(#rough2)">⚠️ 最坏 O(n·maxL)：target 与单词同为 aaa⋯a 时</text>
  <text x="174" y="345" text-anchor="middle" font-size="9.5" fill="#8c3a36" filter="url(#rough2)">每个起点都走到链尾 → 3213 换 AC 自动机</text>
</svg>
