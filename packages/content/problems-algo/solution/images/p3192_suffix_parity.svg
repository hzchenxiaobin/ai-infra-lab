<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：所有历史后缀翻转的影响，合并成一个奇偶位 flip</text>

  <text x="138" y="44" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">已锁定为 1 ✓</text>
  <text x="242" y="44" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">当前 i</text>
  <text x="330" y="44" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">尚未处理</text>

  <rect x="60" y="50" width="52" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="86" y="74" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">1</text>
  <rect x="112" y="50" width="52" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="138" y="74" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">1</text>
  <rect x="164" y="50" width="52" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="74" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">1</text>
  <rect x="216" y="50" width="52" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="242" y="74" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="268" y="50" width="52" height="38" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="294" y="74" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">1</text>
  <rect x="320" y="50" width="52" height="38" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="346" y="74" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">0</text>

  <text x="86" y="100" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="138" y="100" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="190" y="100" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="242" y="100" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="294" y="100" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">4</text>
  <text x="346" y="100" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">5</text>

  <path d="M 86 108 v 10 h 156 v -10" fill="none" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="150" y="132" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">起点 ≤ i 的每一次操作都会翻到位置 i ✓</text>

  <path d="M 294 108 v 10 h 52 v -10" fill="none" stroke="#8a94a2" stroke-width="1.6" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="392" y="126" text-anchor="middle" font-size="10" fill="#8a94a2" filter="url(#rough2)">起点 &gt; i：够不着 ✗</text>

  <text x="260" y="152" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">这一长串影响只有「总次数的奇偶」有效：</text>

  <rect x="86" y="162" width="78" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="125" y="182" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">nums[i]</text>
  <text x="188" y="183" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold" filter="url(#rough2)">⊕</text>
  <rect x="204" y="162" width="88" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="248" y="182" text-anchor="middle" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">flip ∈ {0,1}</text>
  <text x="312" y="183" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">=</text>
  <rect x="326" y="162" width="88" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="370" y="182" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">有效值</text>
  <text x="260" y="212" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">flip = 已发起的后缀翻转总次数 mod 2 —— 对照 3191 的两个历史标记，这里全部合并成一个</text>

  <rect x="36" y="224" width="448" height="122" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="246" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">有效值为 0 时，为什么必须从 i 发起翻转？</text>
  <text x="260" y="268" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">① 起点 j &lt; i：会波及已修好的前缀，把它们翻回 0 —— 砸锁 ✗</text>
  <text x="260" y="288" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">② 起点 j &gt; i：后缀从 j 开始，根本翻不到位置 i —— 够不着 ✗</text>
  <text x="260" y="308" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">③ 只剩起点 j = i：✓ 决策被逼出，每一步都唯一</text>
  <text x="260" y="332" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">每个位置（含末位）都有「以自己为起点」的操作 → 本题必有解</text>
</svg>
