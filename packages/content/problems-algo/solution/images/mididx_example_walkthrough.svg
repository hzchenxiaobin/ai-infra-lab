<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [2, 3, -1, 8, 4]，total = 16</text>

  <!-- Array cells at top -->
  <text x="40" y="62" font-size="11" fill="#888">下标 i：</text>
  <text x="120" y="62" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="180" y="62" text-anchor="middle" font-size="11" fill="#888">1</text>
  <text x="240" y="62" text-anchor="middle" font-size="11" fill="#888">2</text>
  <text x="300" y="62" text-anchor="middle" font-size="11" fill="#888">3</text>
  <text x="360" y="62" text-anchor="middle" font-size="11" fill="#888">4</text>

  <text x="40" y="86" font-size="11" fill="#555">nums：</text>
  <rect x="92" y="68" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="88" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="152" y="68" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="88" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="212" y="68" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="88" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">-1</text>
  <rect x="272" y="68" width="56" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="300" y="88" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">8</text>
  <rect x="332" y="68" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="88" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>

  <text x="400" y="80" font-size="10" fill="#888">total = 2+3+(−1)+8+4</text>
  <text x="400" y="94" font-size="11" fill="#446688" font-weight="bold">= 16</text>

  <!-- Step table header -->
  <rect x="24" y="112" width="552" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="40" y="130" font-size="11" fill="#555" font-weight="bold">i</text>
  <text x="120" y="130" font-size="11" fill="#555" font-weight="bold">nums[i]</text>
  <text x="220" y="130" font-size="11" fill="#555" font-weight="bold">leftSum</text>
  <text x="340" y="130" font-size="11" fill="#555" font-weight="bold">2×leftSum+nums[i]</text>
  <text x="500" y="130" font-size="11" fill="#555" font-weight="bold">命中？</text>

  <!-- Row i=0 -->
  <rect x="24" y="138" width="552" height="24" fill="#fff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="40" y="154" font-size="11" fill="#333">0</text>
  <text x="120" y="154" font-size="11" fill="#333">2</text>
  <text x="220" y="154" font-size="11" fill="#333">0</text>
  <text x="340" y="154" font-size="11" fill="#333">2×0 + 2 = 2</text>
  <text x="500" y="154" font-size="11" fill="#b85450">2 ≠ 16 ❌</text>

  <!-- Row i=1 -->
  <rect x="24" y="162" width="552" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="40" y="178" font-size="11" fill="#333">1</text>
  <text x="120" y="178" font-size="11" fill="#333">3</text>
  <text x="220" y="178" font-size="11" fill="#333">2</text>
  <text x="340" y="178" font-size="11" fill="#333">2×2 + 3 = 7</text>
  <text x="500" y="178" font-size="11" fill="#b85450">7 ≠ 16 ❌</text>

  <!-- Row i=2 -->
  <rect x="24" y="186" width="552" height="24" fill="#fff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="40" y="202" font-size="11" fill="#333">2</text>
  <text x="120" y="202" font-size="11" fill="#333">-1</text>
  <text x="220" y="202" font-size="11" fill="#333">5</text>
  <text x="340" y="202" font-size="11" fill="#333">2×5 + (-1) = 9</text>
  <text x="500" y="202" font-size="11" fill="#b85450">9 ≠ 16 ❌</text>

  <!-- Row i=3 (hit) -->
  <rect x="24" y="210" width="552" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="2" filter="url(#rough2)"/>
  <text x="40" y="226" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="120" y="226" font-size="11" fill="#333" font-weight="bold">8</text>
  <text x="220" y="226" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="340" y="226" font-size="11" fill="#333" font-weight="bold">2×4 + 8 = 16</text>
  <text x="500" y="226" font-size="11" fill="#4a7a3a" font-weight="bold">16 = 16 ✅</text>

  <!-- Result -->
  <rect x="24" y="246" width="552" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="40" y="266" font-size="11" fill="#4a7a3a" font-weight="bold">返回 3</text>
  <text x="120" y="266" font-size="11" fill="#555">左侧和 = 2 + 3 + (−1) = 4　右侧和 = 4　二者相等 ✓</text>

  <!-- leftSum trace note -->
  <rect x="24" y="292" width="552" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="312" font-size="11" fill="#d6a040" font-weight="bold">leftSum 滚动轨迹：</text>
  <text x="60" y="332" font-size="11" fill="#555">0</text>
  <line x1="72" y1="328" x2="88" y2="328" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="92" y="332" font-size="11" fill="#555">2</text>
  <text x="112" y="332" font-size="10" fill="#888">(+2)</text>
  <line x1="124" y1="328" x2="140" y2="328" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="144" y="332" font-size="11" fill="#555">5</text>
  <text x="164" y="332" font-size="10" fill="#888">(+3)</text>
  <line x1="176" y1="328" x2="192" y2="328" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="196" y="332" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <text x="216" y="332" font-size="10" fill="#888">(+−1)</text>
  <text x="248" y="332" font-size="11" fill="#4a7a3a" font-weight="bold">← 命中 i=3</text>

  <text x="40" y="356" font-size="11" fill="#555">观察：</text>
  <text x="80" y="356" font-size="11" fill="#b85450" font-weight="bold">leftSum 非单调</text>
  <text x="200" y="356" font-size="11" fill="#555">（5 → 4，因 nums[2]=-1 为负）</text>
  <text x="40" y="374" font-size="11" fill="#555">故元素可负时</text>
  <text x="120" y="374" font-size="11" fill="#b85450" font-weight="bold">不能提前剪枝</text>
  <text x="200" y="374" font-size="11" fill="#555">必须扫完整个数组</text>
</svg>
