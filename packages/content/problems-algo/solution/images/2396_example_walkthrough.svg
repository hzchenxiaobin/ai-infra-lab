<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="470" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：逐进制核查，遇非回文即一票否决</text>

  <!-- ===== Example 1: n = 9 ===== -->
  <text x="40" y="54" font-size="12" fill="#4a7a3a" font-weight="bold">示例 1　n = 9，考查 b ∈ {2, 3, …, 7}</text>

  <!-- table header -->
  <g filter="url(#rough2)">
    <rect x="40" y="64" width="96" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="88" y="82" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">进制 b</text>
    <rect x="136" y="64" width="200" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="236" y="82" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">9 的 b 进制表示</text>
    <rect x="336" y="64" width="184" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="428" y="82" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">是否回文</text>
  </g>

  <!-- row b=2: 1001 palindrome -->
  <g filter="url(#rough2)">
    <rect x="40" y="92" width="96" height="26" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="88" y="110" text-anchor="middle" font-size="12" fill="#333">2</text>
    <rect x="136" y="92" width="200" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="236" y="110" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1001</text>
    <rect x="336" y="92" width="184" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="428" y="110" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓ 回文</text>
  </g>

  <!-- row b=3: 100 NOT palindrome - FAIL -->
  <g filter="url(#rough2)">
    <rect x="40" y="120" width="96" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="88" y="138" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
    <rect x="136" y="120" width="200" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="236" y="138" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">100</text>
    <rect x="336" y="120" width="184" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="428" y="138" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗ 首位1 ≠ 末位0</text>
  </g>
  <text x="528" y="138" font-size="11" fill="#b85450" font-weight="bold">← 否决</text>

  <!-- row b=7 (=n-2): 12 NOT palindrome - the trick -->
  <g filter="url(#rough2)">
    <rect x="40" y="148" width="96" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="88" y="166" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">7 (=n−2)</text>
    <rect x="136" y="148" width="200" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="236" y="166" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">12</text>
    <rect x="336" y="148" width="184" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="428" y="166" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">✗ 必败进制</text>
  </g>

  <text x="290" y="196" text-anchor="middle" font-size="11" fill="#888">b=3 已否决；即便逐个查到 b=7，"12" 亦非回文 → 返回 false</text>

  <!-- divider -->
  <line x1="40" y1="214" x2="520" y2="214" stroke="#ddd" stroke-width="1.2" stroke-dasharray="3,4" filter="url(#rough2)"/>

  <!-- ===== Example 2: n = 4 ===== -->
  <text x="40" y="236" font-size="12" fill="#d6a040" font-weight="bold">示例 2　n = 4，考查区间仅 {2}</text>

  <g filter="url(#rough2)">
    <rect x="40" y="246" width="96" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="88" y="264" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>
    <rect x="136" y="246" width="200" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="236" y="264" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">100</text>
    <rect x="336" y="246" width="184" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="428" y="264" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗ 非回文</text>
  </g>
  <text x="528" y="264" font-size="11" fill="#b85450" font-weight="bold">← 否决</text>

  <text x="290" y="296" text-anchor="middle" font-size="11" fill="#888">唯一进制即失败 → 返回 false</text>

  <!-- ===== Insight box ===== -->
  <rect x="40" y="318" width="480" height="130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="346" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">规律：根本无需逐进制核查</text>
  <text x="280" y="370" text-anchor="middle" font-size="11" fill="#666">n ≥ 5 时，b = n−2 这一进制必给出 "12"（首位 ≠ 末位），</text>
  <text x="280" y="390" text-anchor="middle" font-size="11" fill="#666">它单独就足以否决；n = 4 时 b = 2 给出 "100" 同样否决。</text>
  <text x="280" y="422" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">所以恒返回 false，一行代码即可。</text>
</svg>
