<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">子序列宽度之和：排序 + 贡献累加流程</text>

  <!-- Step 1: Sort -->
  <rect x="120" y="44" width="320" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">① 对 nums 排序（升序）</text>
  <text x="280" y="78" text-anchor="middle" font-size="10" fill="#666">排序不改变任何子序列的 max/min 取值</text>

  <path d="M 280 86 L 280 98" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: Precompute powers -->
  <rect x="120" y="100" width="320" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="120" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">② 预计算 2 的幂次表 pow2[0..n−1]</text>
  <text x="280" y="138" text-anchor="middle" font-size="10" fill="#666">pow2[0]=1, pow2[i] = pow2[i−1] × 2 mod MOD</text>

  <path d="M 280 150 L 280 162" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: Loop -->
  <polygon points="280,164 420,210 280,256 140,210" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="206" text-anchor="middle" font-size="11" fill="#333">i &lt; n ?</text>
  <text x="280" y="222" text-anchor="middle" font-size="10" fill="#888">遍历每个元素</text>

  <!-- Yes branch -->
  <path d="M 280 256 L 280 270" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="266" font-size="11" fill="#82b366">是</text>

  <!-- Contribution box -->
  <rect x="80" y="272" width="400" height="68" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="292" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">contrib = nums[i] × (pow2[i] − pow2[n−1−i])</text>
  <text x="280" y="310" text-anchor="middle" font-size="10" fill="#b85450">作为 max 出现 2^i 次</text>
  <text x="280" y="326" text-anchor="middle" font-size="10" fill="#446688">作为 min 出现 2^(n−1−i) 次</text>

  <path d="M 280 340 L 280 352" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Accumulate -->
  <rect x="160" y="354" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="376" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans = (ans + contrib) % MOD</text>

  <!-- Loop back -->
  <path d="M 160 371 L 60 371 L 60 210 L 140 210" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="44" y="290" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 44 290)">i++ 继续</text>

  <!-- No branch -> return -->
  <path d="M 420 210 L 488 210" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="454" y="202" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <rect x="436" y="226" width="100" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="486" y="246" text-anchor="middle" font-size="11" fill="#333">ans % MOD</text>
  <text x="486" y="262" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">返回</text>
  <path d="M 486 210 L 486 226" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Bottom note -->
  <rect x="80" y="402" width="400" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="422" text-anchor="middle" font-size="10" fill="#444">取模需处理负数：C++ 用 (ans % MOD + MOD) % MOD</text>
</svg>
