<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 620" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="500" height="620" fill="#fafafa"/>

  <text x="250" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">多源 BFS 算法流程</text>
  <text x="250" y="50" text-anchor="middle" font-size="11" fill="#888">height[邻居] = height[当前] + 1，无需显式记录层数</text>

  <!-- Start -->
  <g filter="url(#rough2)">
    <ellipse cx="250" cy="80" rx="50" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="250" y="85" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">开始</text>

  <!-- Arrow -->
  <path d="M 250 100 L 250 122" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init height -->
  <g filter="url(#rough2)">
    <rect x="140" y="124" width="220" height="36" rx="6" fill="#fff" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="250" y="147" text-anchor="middle" font-size="11" fill="#333">初始化 height[m][n] 全填 -1</text>

  <path d="M 250 162 L 250 184" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Enqueue water -->
  <g filter="url(#rough2)">
    <rect x="120" y="186" width="260" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="250" y="204" text-anchor="middle" font-size="11" fill="#333">遍历网格：isWater==1 的格子</text>
  <text x="250" y="219" text-anchor="middle" font-size="11" fill="#333">height = 0，入队 q</text>

  <path d="M 250 228 L 250 250" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: queue empty? -->
  <g filter="url(#rough2)">
    <polygon points="250,252 350,300 250,348 150,300" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="250" y="297" text-anchor="middle" font-size="11" fill="#333">队列 q</text>
  <text x="250" y="312" text-anchor="middle" font-size="11" fill="#333">非空?</text>

  <!-- No → right → End -->
  <path d="M 350 300 L 410 300" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="292" text-anchor="middle" font-size="10" fill="#b85450">否</text>

  <g filter="url(#rough2)">
    <ellipse cx="430" cy="300" rx="48" ry="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="430" y="305" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">返回 height</text>

  <!-- Yes → down -->
  <path d="M 250 348 L 250 370" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="260" y="362" font-size="10" fill="#2e6e2e">是</text>

  <!-- Pop -->
  <g filter="url(#rough2)">
    <rect x="160" y="372" width="180" height="34" rx="6" fill="#fff" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="250" y="394" text-anchor="middle" font-size="11" fill="#333">取出队首 (i, j)，q.pop()</text>

  <path d="M 250 408 L 250 430" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Check neighbors -->
  <g filter="url(#rough2)">
    <rect x="140" y="432" width="220" height="34" rx="6" fill="#fff" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="250" y="454" text-anchor="middle" font-size="11" fill="#333">遍历四邻居 (ni, nj)</text>

  <path d="M 250 468 L 250 490" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: unvisited? -->
  <g filter="url(#rough2)">
    <polygon points="250,492 340,530 250,568 160,530" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="250" y="535" text-anchor="middle" font-size="11" fill="#333">height[ni][nj] == -1?</text>

  <!-- No → loop left back to neighbors -->
  <path d="M 160 530 Q 100 530 100 449 L 100 449 Q 100 449 140 449" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="108" y="490" font-size="10" fill="#b85450">否，跳过</text>

  <!-- Yes → down -->
  <path d="M 250 568 L 250 588" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="260" y="582" font-size="10" fill="#2e6e2e">是</text>

  <!-- Assign + enqueue -->
  <g filter="url(#rough2)">
    <rect x="110" y="588" width="280" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="250" y="606" text-anchor="middle" font-size="11" fill="#333">height[ni][nj] = height[i][j]+1，入队 q</text>

  <!-- Loop back from assign to "queue empty?" decision -->
  <path d="M 110 601 Q 50 601 50 300 L 50 300 Q 50 300 150 300" stroke="#3a3a3a" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="56" y="450" font-size="10" fill="#888" transform="rotate(-90 56 450)">回到 BFS 循环</text>
</svg>
