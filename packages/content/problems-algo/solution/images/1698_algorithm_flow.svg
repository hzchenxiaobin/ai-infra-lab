<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>
  <rect width="540" height="430" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：后缀数组 + LCP 求不同子串数</text>

  <!-- Step 1 -->
  <rect x="110" y="48" width="320" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="68" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">① 构建后缀数组 sa[]</text>
  <text x="270" y="86" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">对所有后缀按字典序排序，sa[i] = 第 i 小后缀的起始位置</text>
  <path d="M 270 98 L 270 120" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <!-- Step 2 -->
  <rect x="110" y="120" width="320" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="140" text-anchor="middle" font-size="12" fill="#335" font-weight="bold" filter="url(#rough2)">② 计算反向映射 rank[]</text>
  <text x="270" y="158" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">rank[sa[i]] = i，后缀起始位置 → 排名</text>
  <path d="M 270 170 L 270 192" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <!-- Step 3 -->
  <rect x="110" y="192" width="320" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="212" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold" filter="url(#rough2)">③ Kasai 算法求 LCP[]</text>
  <text x="270" y="230" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">按原串顺序遍历 i，维护 h（当前 LCP 长度）</text>
  <text x="270" y="246" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">h 最多增 n 次、减 n 次 → 整体 O(n)</text>
  <path d="M 270 258 L 270 280" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <!-- Step 4 -->
  <rect x="110" y="280" width="320" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="300" text-anchor="middle" font-size="12" fill="#335" font-weight="bold" filter="url(#rough2)">④ 求和 Σ LCP[i]</text>
  <text x="270" y="318" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">i = 0 … n−2，累加相邻后缀的公共前缀长度</text>
  <path d="M 270 330 L 270 352" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <!-- Step 5 -->
  <rect x="110" y="352" width="320" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="372" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">⑤ 返回 n(n+1)/2 − Σ LCP</text>
  <text x="270" y="390" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">总子串数减去重复计数 = 不同子串数</text>

  <!-- Footer -->
  <rect x="70" y="402" width="400" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="270" y="415" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">排序 O(n² log n) + Kasai O(n) → 总 O(n² log n)，可用 SA-IS 优化至 O(n)</text>
</svg>