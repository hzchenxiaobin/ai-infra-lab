<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">二分答案：f(target)=和≤target 的组合数，单调递增 → 可二分</text>

  <!-- ====== Section 1: Matrix (left) ====== -->
  <text x="44" y="56" font-size="11" fill="#888" font-weight="bold">mat（每行有序）：</text>

  <!-- Row 0 label -->
  <text x="40" y="86" font-size="10" fill="#aaa">行0</text>
  <!-- Row 0 boxes: [1] [3] [11] -->
  <rect x="70" y="68" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="88" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <rect x="118" y="68" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="138" y="88" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>
  <rect x="166" y="68" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="186" y="88" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">11</text>
  <!-- sorted arrow row 0 -->
  <path d="M 210 83 L 236 83" stroke="#aaa" stroke-width="1.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="248" y="87" font-size="9.5" fill="#aaa">↑有序</text>

  <!-- Row 1 label -->
  <text x="40" y="120" font-size="10" fill="#aaa">行1</text>
  <!-- Row 1 boxes: [2] [4] [6] -->
  <rect x="70" y="102" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="122" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="118" y="102" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="138" y="122" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4</text>
  <rect x="166" y="102" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="186" y="122" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">6</text>
  <!-- sorted arrow row 1 -->
  <path d="M 210 117 L 236 117" stroke="#aaa" stroke-width="1.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="248" y="121" font-size="9.5" fill="#aaa">↑有序</text>

  <!-- example sums -->
  <text x="44" y="156" font-size="10.5" fill="#888">示例组合和：</text>
  <text x="44" y="172" font-size="10" fill="#666">1+2=3, 1+4=5, 3+4=7, 1+6=7, 3+6=9 …</text>

  <!-- ====== Section 1: Concept box (right) ====== -->
  <rect x="320" y="56" width="220" height="128" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="430" y="80" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold">每行选 1 个 → 求和</text>
  <text x="430" y="100" text-anchor="middle" font-size="11" fill="#555">f(target) = 组合中和 ≤ target 的个数</text>
  <text x="430" y="120" text-anchor="middle" font-size="11" fill="#555">target ↑ ⇒ f(target) ↑</text>
  <text x="430" y="142" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">单调 ⇒ 二段性 ⇒ 可二分！</text>
  <text x="430" y="166" text-anchor="middle" font-size="10.5" fill="#888">第 k 小 = 最小使 f ≥ k 的 target</text>

  <!-- divider -->
  <path d="M 40 196 L 520 196" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ====== Section 2: Answer range number line ====== -->
  <text x="40" y="218" font-size="11" fill="#888" font-weight="bold">答案空间：</text>
  <line x1="90" y1="232" x2="470" y2="232" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <!-- min_sum -->
  <circle cx="90" cy="232" r="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="250" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">3</text>
  <text x="90" y="264" text-anchor="middle" font-size="9" fill="#888">min_sum</text>
  <!-- max_sum -->
  <circle cx="470" cy="232" r="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470" y="250" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">17</text>
  <text x="470" y="264" text-anchor="middle" font-size="9" fill="#888">max_sum</text>
  <!-- range label -->
  <text x="280" y="226" text-anchor="middle" font-size="10" fill="#aaa">lo = Σ各行首元素, hi = Σ各行末元素</text>

  <!-- divider -->
  <path d="M 40 278 L 520 278" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ====== Section 3: Step function f(target) ====== -->
  <text x="40" y="300" font-size="11" fill="#888" font-weight="bold">f(target) 阶梯曲线：</text>

  <!-- Y axis -->
  <line x1="80" y1="320" x2="80" y2="430" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="324" text-anchor="end" font-size="10" fill="#888">f</text>
  <!-- X axis -->
  <line x1="80" y1="430" x2="490" y2="430" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="494" y="434" font-size="10" fill="#888">target →</text>

  <!-- Y axis labels: f=0,5,9 -->
  <text x="74" y="434" text-anchor="end" font-size="9.5" fill="#999">0</text>
  <text x="74" y="375" text-anchor="end" font-size="9.5" fill="#999">5</text>
  <text x="74" y="334" text-anchor="end" font-size="9.5" fill="#999">9</text>

  <!-- X axis labels -->
  <text x="90" y="446" text-anchor="middle" font-size="9" fill="#999">3</text>
  <text x="146" y="446" text-anchor="middle" font-size="9" fill="#999">5</text>
  <text x="202" y="446" text-anchor="middle" font-size="9" fill="#999">7</text>
  <text x="258" y="446" text-anchor="middle" font-size="9" fill="#999">9</text>
  <text x="370" y="446" text-anchor="middle" font-size="9" fill="#999">13</text>
  <text x="426" y="446" text-anchor="middle" font-size="9" fill="#999">15</text>
  <text x="482" y="446" text-anchor="middle" font-size="9" fill="#999">17</text>

  <!-- Step function: f(3)=1, f(5)=3, f(7)=5, f(9)=6, f(13)=7, f(15)=8, f(17)=9 -->
  <!-- Y mapping: f=0→430, f=9→330, scale=100/9≈11.1 -->
  <!-- f=1→419, f=3→397, f=5→375, f=6→364, f=7→353, f=8→341, f=9→330 -->
  <path d="M 80 430 L 90 430 L 90 419 L 146 419 L 146 397 L 202 397 L 202 375 L 258 375 L 258 364 L 370 364 L 370 353 L 426 353 L 426 341 L 482 341 L 482 330"
        stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>

  <!-- k=5 dashed line -->
  <line x1="80" y1="375" x2="490" y2="375" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="496" y="379" font-size="10.5" fill="#b85450" font-weight="bold">k=5</text>

  <!-- Answer point: target=7, f=5 -->
  <circle cx="202" cy="375" r="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="202" y1="375" x2="202" y2="430" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="202" y="368" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">ans=7</text>
  <text x="202" y="392" text-anchor="middle" font-size="9" fill="#b85450">f(7)=5≥k</text>

  <!-- note -->
  <rect x="340" y="392" width="170" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="425" y="408" text-anchor="middle" font-size="10" fill="#3a5a2a">最小使 f ≥ k 的 target</text>
  <text x="425" y="422" text-anchor="middle" font-size="10" fill="#3a5a2a" font-weight="bold">= 第 k 小数组和</text>
</svg>
