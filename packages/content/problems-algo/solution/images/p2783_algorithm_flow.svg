<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 370" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="370" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">解法 A 流程：连接 → 分组 → 计需求 → 阈值切分 → 算率 → 输出</text>

  <!-- stage boxes (vertical, centered) -->
  <g font-size="13" font-weight="bold">
    <rect x="120" y="44" width="320" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" rx="6" filter="url(#rough2)"/>
    <text x="280" y="68" text-anchor="middle" fill="#333">① Flights LEFT JOIN Passengers（保留空航班）</text>

    <rect x="120" y="98" width="320" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" rx="6" filter="url(#rough2)"/>
    <text x="280" y="122" text-anchor="middle" fill="#333">② GROUP BY flight_id, capacity（每航班一行）</text>

    <rect x="120" y="152" width="320" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="6" filter="url(#rough2)"/>
    <text x="280" y="176" text-anchor="middle" fill="#333">③ COUNT(p.passenger_id) = 需求 D（忽略 NULL）</text>

    <rect x="120" y="206" width="320" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" rx="6" filter="url(#rough2)"/>
    <text x="280" y="230" text-anchor="middle" fill="#333">④ LEAST(D,C)→入座B   GREATEST(D−C,0)→等待W</text>

    <rect x="120" y="260" width="320" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" rx="6" filter="url(#rough2)"/>
    <text x="280" y="284" text-anchor="middle" fill="#333">⑤ ROUND(B * 1.0 / C, 2) → 入座率 R</text>

    <rect x="120" y="314" width="320" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" rx="6" filter="url(#rough2)"/>
    <text x="280" y="338" text-anchor="middle" fill="#333">⑥ ORDER BY flight_id → 输出</text>
  </g>

  <!-- arrows between stages -->
  <g fill="none" stroke="#446688" stroke-width="1.7" marker-end="url(#arrB)" filter="url(#rough2)">
    <path d="M280,82 L280,98"/>
    <path d="M280,136 L280,152"/>
    <path d="M280,190 L280,206"/>
    <path d="M280,244 L280,260"/>
    <path d="M280,298 L280,314"/>
  </g>

  <!-- side annotations -->
  <text x="450" y="124" font-size="11" fill="#4a7a3a" font-weight="bold">航班边界</text>
  <text x="450" y="178" font-size="11" fill="#4a7a3a" font-weight="bold">空航班得 0</text>
  <text x="450" y="232" font-size="11" fill="#b85450" font-weight="bold">截断 ≤ C</text>
  <text x="450" y="286" font-size="11" fill="#7a5a20" font-weight="bold">*1.0 防整除</text>
</svg>
