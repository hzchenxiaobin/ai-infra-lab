<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrOrange" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">BST 插入核心：搜索路径尽头挂叶子</text>

  <!-- ===== 左侧树：插入 val=25 ===== -->
  <text x="150" y="56" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">插入 val = 25</text>

  <!-- 40 (path) -->
  <circle cx="150" cy="92" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="96" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">40</text>

  <!-- 40 → 20 (path) -->
  <line x1="142" y1="104" x2="113" y2="128" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="124" y="112" font-size="9" fill="#446688">25&lt;40 左</text>

  <!-- 20 (path) -->
  <circle cx="106" cy="140" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="106" y="144" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">20</text>

  <!-- 40 → 60 (非路径, 淡) -->
  <line x1="158" y1="104" x2="194" y2="128" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <circle cx="200" cy="140" r="13" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="200" y="144" text-anchor="middle" font-size="10" fill="#999">60</text>

  <!-- 20 → 10 (非路径, 淡) -->
  <line x1="100" y1="152" x2="82" y2="174" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <circle cx="78" cy="186" r="11" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="78" y="190" text-anchor="middle" font-size="9" fill="#999">10</text>

  <!-- 20 → 30 (path) -->
  <line x1="114" y1="152" x2="128" y2="174" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="130" y="166" font-size="9" fill="#446688">25&gt;20 右</text>

  <!-- 30 (path) -->
  <circle cx="132" cy="186" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="132" y="190" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">30</text>

  <!-- 30 → 新25 (挂接) -->
  <line x1="126" y1="198" x2="112" y2="220" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="96" y="212" font-size="9" fill="#4a7a3a">25&lt;30 左</text>

  <!-- 新节点 25 (绿色叶子) -->
  <circle cx="108" cy="232" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="108" y="236" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">25</text>
  <text x="108" y="256" text-anchor="middle" font-size="9" fill="#4a7a3a">新叶子</text>

  <!-- 60 的子节点 (淡) -->
  <line x1="194" y1="152" x2="180" y2="174" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="176" cy="186" r="10" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="176" y="189" text-anchor="middle" font-size="8" fill="#aaa">50</text>
  <line x1="206" y1="152" x2="220" y2="174" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="224" cy="186" r="10" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="224" y="189" text-anchor="middle" font-size="8" fill="#aaa">70</text>

  <!-- ===== 右侧：核心原则框 ===== -->
  <rect x="300" y="56" width="260" height="200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="316" y="80" font-size="13" fill="#333" font-weight="bold">核心原则</text>

  <text x="316" y="106" font-size="11" fill="#446688">① 从根开始，按 BST 规则比较：</text>
  <text x="332" y="124" font-size="11" fill="#446688">　val &lt; root → 向左；val &gt; root → 向右</text>

  <text x="316" y="150" font-size="11" fill="#4a7a3a">② 沿搜索路径走到"空位"：</text>
  <text x="332" y="168" font-size="11" fill="#4a7a3a">　某方向子节点为 null 即插入点</text>

  <text x="316" y="194" font-size="11" fill="#b85450">③ 新节点挂上去，必为叶子：</text>
  <text x="332" y="212" font-size="11" fill="#b85450">　无子树冲突，BST 性质天然保持</text>

  <text x="316" y="238" font-size="10" fill="#888">⭐ 插入 = BST 搜索 + 挂叶，比删除(450)更简单</text>

  <!-- ===== 底部：与删除对比 ===== -->
  <rect x="30" y="290" width="530" height="130" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="50" y="314" font-size="12" fill="#333" font-weight="bold">对比 450 删除：为什么插入更简单？</text>

  <text x="50" y="340" font-size="11" fill="#446688">插入：新节点无子树 → 直接挂空位 → 一趟到底，无需分情况</text>
  <text x="50" y="362" font-size="11" fill="#b85450">删除：被删节点可能有子树 → 找前驱/后继顶替 → 分三种情况处理</text>

  <text x="50" y="392" font-size="11" fill="#555">共同点：都沿 BST 搜索路径定位，递归范式 root-&gt;child = fn(root-&gt;child, key) 完成重连</text>
  <text x="50" y="412" font-size="10" fill="#888">差异根源：插入引入"无子树的叶子"，删除移除"可能带子树的内部节点"</text>
</svg>
