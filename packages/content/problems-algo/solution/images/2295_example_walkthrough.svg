<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例 2 演算：nums=[1,2], ops=[[1,3],[2,1],[3,2]] → [2,1]</text>

  <!-- table header -->
  <rect x="24" y="40" width="512" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="57" font-size="10" fill="#446688" font-weight="bold" text-anchor="middle">步骤</text>
  <text x="120" y="57" font-size="10" fill="#446688" font-weight="bold" text-anchor="middle">操作</text>
  <text x="200" y="57" font-size="10" fill="#446688" font-weight="bold" text-anchor="middle">map[old]</text>
  <text x="300" y="57" font-size="10" fill="#446688" font-weight="bold" text-anchor="middle">nums（替换后）</text>
  <text x="460" y="57" font-size="10" fill="#446688" font-weight="bold" text-anchor="middle">map 更新</text>

  <!-- row 0: init -->
  <rect x="24" y="68" width="512" height="40" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="92" font-size="10" fill="#888" text-anchor="middle">初始</text>
  <text x="120" y="92" font-size="10" fill="#888" text-anchor="middle">—</text>
  <text x="200" y="92" font-size="10" fill="#888" text-anchor="middle">—</text>
  <rect x="270" y="78" width="28" height="22" fill="#fff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="284" y="93" text-anchor="middle" font-size="11" fill="#666">1</text>
  <rect x="300" y="78" width="28" height="22" fill="#fff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="314" y="93" text-anchor="middle" font-size="11" fill="#666">2</text>
  <text x="460" y="92" font-size="9.5" fill="#4a7a3a" text-anchor="middle">{1:0, 2:1}</text>

  <!-- row 1: op [1,3] -->
  <rect x="24" y="110" width="512" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="134" font-size="10" fill="#666" text-anchor="middle">①</text>
  <text x="120" y="134" font-size="10" fill="#d6a040" font-weight="bold" text-anchor="middle">[1,3]</text>
  <text x="200" y="134" font-size="10" fill="#4a7a3a" font-weight="bold" text-anchor="middle">= 0</text>
  <rect x="270" y="120" width="28" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="284" y="135" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <rect x="300" y="120" width="28" height="22" fill="#fff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="314" y="135" text-anchor="middle" font-size="11" fill="#666">2</text>
  <text x="460" y="134" font-size="9.5" fill="#b85450" text-anchor="middle">删1 加3→0</text>

  <!-- row 2: op [2,1] -->
  <rect x="24" y="152" width="512" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="176" font-size="10" fill="#666" text-anchor="middle">②</text>
  <text x="120" y="176" font-size="10" fill="#d6a040" font-weight="bold" text-anchor="middle">[2,1]</text>
  <text x="200" y="176" font-size="10" fill="#4a7a3a" font-weight="bold" text-anchor="middle">= 1</text>
  <rect x="270" y="162" width="28" height="22" fill="#fff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="284" y="177" text-anchor="middle" font-size="11" fill="#666">3</text>
  <rect x="300" y="162" width="28" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="314" y="177" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="460" y="176" font-size="9.5" fill="#b85450" text-anchor="middle">删2 加1→1</text>

  <!-- row 3: op [3,2] -->
  <rect x="24" y="194" width="512" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="218" font-size="10" fill="#666" text-anchor="middle">③</text>
  <text x="120" y="218" font-size="10" fill="#d6a040" font-weight="bold" text-anchor="middle">[3,2]</text>
  <text x="200" y="218" font-size="10" fill="#4a7a3a" font-weight="bold" text-anchor="middle">= 0</text>
  <rect x="270" y="204" width="28" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="284" y="219" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <rect x="300" y="204" width="28" height="22" fill="#fff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="314" y="219" text-anchor="middle" font-size="11" fill="#666">1</text>
  <text x="460" y="218" font-size="9.5" fill="#b85450" text-anchor="middle">删3 加2→0</text>

  <!-- result highlight -->
  <rect x="24" y="240" width="512" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="262" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">结果：nums = [2, 1]  ✓  （值 1 经历「删→再加回」链式替换）</text>

  <!-- ===== chain replacement insight ===== -->
  <rect x="24" y="296" width="512" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">关键：链式替换——值可被「删后再加回」</text>
  <text x="280" y="342" text-anchor="middle" font-size="10.5" fill="#555">① 删 1 加 3：map 中 1 消失，3 出现在 idx=0</text>
  <text x="280" y="360" text-anchor="middle" font-size="10.5" fill="#555">② 删 2 加 1：1 重新进入 map（指向 idx=1），2 消失</text>
  <text x="280" y="378" text-anchor="middle" font-size="10.5" fill="#555">③ 删 3 加 2：3 消失（第①步才加入的），2 重新进入</text>
  <text x="280" y="394" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">map 实时增删，保证每次 map[old] 恒指向当前下标</text>
</svg>
