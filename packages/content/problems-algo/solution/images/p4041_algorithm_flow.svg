<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    总体流程：(d, m) 网格选项表 → 分组背包
  </text>

  <!-- 开始 -->
  <ellipse cx="260" cy="56" rx="72" ry="18" fill="#e6f4ea" stroke="#4a7a3a"
           stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="61" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">取下一个元素 x</text>

  <!-- 步骤1 -->
  <rect x="85" y="84" width="350" height="40" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="109" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">
    ① 枚举 d：y = ⌊x/2^d⌋（从 x 一路除到 0 为止）
  </text>

  <!-- 步骤2 -->
  <rect x="85" y="134" width="350" height="40" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="159" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">
    ② 枚举 m：v = y·2^m ≤ sum，记 (v, d+m)，同值取最小代价
  </text>

  <!-- 步骤3 -->
  <rect x="85" y="184" width="350" height="52" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="205" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">
    ③ 分组背包转移：ndp[s] = min( dp[s]（不选）, dp[s−v] + c（选 (v,c)） )
  </text>
  <text x="260" y="225" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">
    每个选项都从旧 dp 出发 → 同一元素至多贡献一个终值
  </text>

  <!-- 判断 -->
  <polygon points="260,246 340,278 260,310 180,278" fill="#fce4ec" stroke="#b85450"
           stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="283" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">还有元素?</text>

  <!-- 输出 -->
  <rect x="348" y="318" width="160" height="38" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="428" y="342" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">
    dp[sum] = ∞ ? −1 : dp[sum]
  </text>

  <!-- 箭头 -->
  <path d="M 260 74 L 260 80" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 260 124 L 260 130" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 260 174 L 260 180" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 260 236 L 260 242" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 340 278 L 428 278 L 428 312" stroke="#b85450" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="384" y="270" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- 回环 -->
  <path d="M 180 278 L 56 278 L 56 56 L 184 56" stroke="#4a7a3a" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="270" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <text x="40" y="344" font-size="11.5" fill="#666" filter="url(#rough2)">
    初始 dp[0] = 0，其余 +∞；dp[s] = 子集和恰好为 s 的最小操作数
  </text>
</svg>
