<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：递归 CTE 逐车模拟</text>

  <!-- ===== Step 1: Sort + new_arrivals ===== -->
  <text x="40" y="52" font-size="10" fill="#888" filter="url(#rough2)">① 排序公交 + 区间计数新到乘客</text>
  <g filter="url(#rough2)"><rect x="30" y="58" width="280" height="56" fill="#fff" stroke="#446688" stroke-width="1.5" rx="8"/></g>
  <text x="170" y="78" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">ROW_NUMBER + LAG(arrival_time)</text>
  <text x="170" y="94" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">按 arrival_time 排序，取前车到达时间</text>
  <text x="170" y="106" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">LEFT JOIN Passengers 计区间新到人数</text>

  <!-- Arrow -->
  <path d="M 170 116 L 170 130" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: Base case ===== -->
  <text x="40" y="142" font-size="10" fill="#888" filter="url(#rough2)">② 递归基例：首辆车</text>
  <g filter="url(#rough2)"><rect x="30" y="148" width="280" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8"/></g>
  <text x="170" y="168" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">waiting = new_pax</text>
  <text x="170" y="184" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">picked = LEAST(cap, new_pax)</text>
  <text x="170" y="196" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">remaining = GREATEST(0, new_pax − cap)</text>

  <!-- Arrow -->
  <path d="M 170 202 L 170 216" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: Recursive case ===== -->
  <text x="40" y="228" font-size="10" fill="#888" filter="url(#rough2)">③ 递归步：后续每辆车</text>
  <g filter="url(#rough2)"><rect x="30" y="234" width="280" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/></g>
  <text x="170" y="254" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">waiting = prev_remaining + new_pax</text>
  <text x="170" y="272" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">picked = LEAST(cap, waiting)</text>
  <text x="170" y="290" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">remaining = max(0, waiting − cap)</text>
  <text x="170" y="298" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">JOIN sim ON rn = prev_rn + 1</text>

  <!-- Arrow -->
  <path d="M 170 302 L 170 316" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 4: Output ===== -->
  <text x="40" y="326" font-size="10" fill="#888" filter="url(#rough2)">④ 输出</text>
  <g filter="url(#rough2)"><rect x="30" y="332" width="280" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8"/></g>
  <text x="170" y="352" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">SELECT bus_id, picked AS passengers_cnt</text>
  <text x="170" y="366" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">ORDER BY bus_id</text>

  <!-- ===== Right side: state table ===== -->
  <g filter="url(#rough2)"><rect x="350" y="148" width="180" height="200" rx="8" fill="#fff" stroke="#999" stroke-width="1.2"/></g>
  <text x="440" y="168" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">递归状态表</text>
  <line x1="350" y1="174" x2="530" y2="174" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <text x="360" y="188" font-size="8" fill="#888" font-weight="bold" filter="url(#rough2)">rn</text>
  <text x="392" y="188" font-size="8" fill="#888" font-weight="bold" filter="url(#rough2)">new</text>
  <text x="424" y="188" font-size="8" fill="#888" font-weight="bold" filter="url(#rough2)">wait</text>
  <text x="460" y="188" font-size="8" fill="#888" font-weight="bold" filter="url(#rough2)">pick</text>
  <text x="496" y="188" font-size="8" fill="#888" font-weight="bold" filter="url(#rough2)">rem</text>
  <line x1="350" y1="192" x2="530" y2="192" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <text x="364" y="208" font-size="10" fill="#4a8edb" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="396" y="208" font-size="10" fill="#4a8edb" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="428" y="208" font-size="10" fill="#4a8edb" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="464" y="208" font-size="10" fill="#4a8edb" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="500" y="208" font-size="10" fill="#4a8edb" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="364" y="228" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="396" y="228" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="428" y="228" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="464" y="228" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="500" y="228" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>

  <text x="364" y="248" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="396" y="248" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="428" y="248" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="464" y="248" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="500" y="248" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="440" y="276" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">new = 区间新到</text>
  <text x="440" y="288" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">wait = 前车剩余+new</text>
  <text x="440" y="300" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">pick = min(cap,wait)</text>
  <text x="440" y="312" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">rem = wait − pick</text>

  <!-- ===== Bottom note ===== -->
  <g filter="url(#rough2)"><rect x="30" y="392" width="500" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="50" y="414" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">💡 递归传递 remaining → 乘客「溢出」到下一辆车，2142 的 LAG 差分无法处理此场景</text>
</svg>
