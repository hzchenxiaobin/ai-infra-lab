<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 432" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="432" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [5,5,5,10,5] → 答案 2</text>
  <text x="310" y="45" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">m = 5 出现 4 次，10 % 5 = 0 → 情况二，ans = ⌈4/2⌉ = 2</text>

  <!-- row 0: initial -->
  <text x="36" y="76" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">初始</text>
  <rect x="100" y="62" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="121" y="84" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="150" y="62" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="171" y="84" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="200" y="62" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="221" y="84" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="250" y="62" width="42" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="271" y="84" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">10</text>
  <rect x="300" y="62" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="321" y="84" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="372" y="76" font-size="10.5" fill="#333" filter="url(#rough2)">m = 5 出现 4 次；10 % 5 = 0</text>
  <text x="372" y="94" font-size="10.5" fill="#666" filter="url(#rough2)">没有 m 的非倍数 → 情况二</text>
  <text x="596" y="84" text-anchor="end" font-size="11" fill="#999" filter="url(#rough2)">长度 5</text>

  <path d="M 200 100 L 200 124" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- row 1: kill the big one -->
  <text x="36" y="144" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">操作①</text>
  <text x="36" y="160" font-size="10.5" fill="#999" filter="url(#rough2)">5 % 10 = 5</text>
  <rect x="100" y="130" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="121" y="152" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="150" y="130" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="171" y="152" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="200" y="130" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="221" y="152" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="250" y="130" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="271" y="152" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="372" y="144" font-size="10.5" fill="#333" filter="url(#rough2)">删 (5, 10)，插回一个 5</text>
  <text x="372" y="162" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">大数白送消灭，m 数量不减 ✓</text>
  <text x="596" y="152" text-anchor="end" font-size="11" fill="#999" filter="url(#rough2)">长度 4</text>

  <path d="M 150 168 L 150 194" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- row 2: m % m -->
  <text x="36" y="214" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">操作②</text>
  <text x="36" y="230" font-size="10.5" fill="#999" filter="url(#rough2)">5 % 5 = 0</text>
  <rect x="100" y="200" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="121" y="222" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="150" y="200" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="171" y="222" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="200" y="200" width="42" height="34" fill="#f5f5f5" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="221" y="222" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <text x="372" y="214" font-size="10.5" fill="#333" filter="url(#rough2)">删两个 5，插入 0</text>
  <text x="372" y="232" font-size="10.5" fill="#b85450" filter="url(#rough2)">0 是死元素，躺尸占位</text>
  <text x="596" y="222" text-anchor="end" font-size="11" fill="#999" filter="url(#rough2)">长度 3</text>

  <path d="M 100 238 L 100 264" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- row 3: final -->
  <text x="36" y="284" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">操作③</text>
  <text x="36" y="300" font-size="10.5" fill="#999" filter="url(#rough2)">5 % 5 = 0</text>
  <rect x="100" y="270" width="42" height="34" fill="#f5f5f5" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="121" y="292" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="150" y="270" width="42" height="34" fill="#f5f5f5" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="171" y="292" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <text x="372" y="284" font-size="10.5" fill="#333" filter="url(#rough2)">删两个 5，插入 0</text>
  <text x="372" y="302" font-size="10.5" fill="#666" filter="url(#rough2)">只剩死 0，无法再操作 → 停</text>
  <text x="596" y="292" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">长度 2 ✓</text>

  <!-- bottom summary -->
  <rect x="40" y="328" width="540" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="310" y="352" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">⌈cnt/2⌉ 的由来：cnt 个 m 两两配对，每对产出一个死 0</text>
  <text x="310" y="372" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">偶数 cnt → cnt/2 个 0；奇数 cnt → 剩 1 个 m + (cnt−1)/2 个 0</text>
  <text x="310" y="394" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">对照示例 3 [2,3,4]：3 % 2 = 1 ≠ 0 → 情况一，答案 1</text>
</svg>
