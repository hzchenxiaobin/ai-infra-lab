<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：升序数组 → 按 0 切三段，两次二分定位左右界</text>

  <!-- boundary labels above cells -->
  <text x="243" y="40" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">lower_bound(0)=3</text>
  <text x="351" y="40" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">upper_bound(0)=5</text>

  <!-- boundary dashed lines -->
  <path d="M 243 44 L 243 106" stroke="#446688" stroke-width="1.6" stroke-dasharray="4,3" fill="none" filter="url(#rough2)"/>
  <path d="M 351 44 L 351 106" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="4,3" fill="none" filter="url(#rough2)"/>

  <!-- array cells: [-3,-2,-1,0,0,1,2] -->
  <rect x="81" y="64" width="54" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="108" y="91" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">-3</text>
  <rect x="135" y="64" width="54" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="162" y="91" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">-2</text>
  <rect x="189" y="64" width="54" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="216" y="91" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">-1</text>
  <rect x="243" y="64" width="54" height="42" fill="#eeeeee" stroke="#888888" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="270" y="91" text-anchor="middle" font-size="17" fill="#666" font-weight="bold">0</text>
  <rect x="297" y="64" width="54" height="42" fill="#eeeeee" stroke="#888888" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="324" y="91" text-anchor="middle" font-size="17" fill="#666" font-weight="bold">0</text>
  <rect x="351" y="64" width="54" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="378" y="91" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">1</text>
  <rect x="405" y="64" width="54" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="432" y="91" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">2</text>

  <!-- brackets below cells -->
  <path d="M 81 112 L 81 108 L 243 108 L 243 112" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="162" y="126" text-anchor="middle" font-size="11.5" fill="#446688">neg = 3 (&lt; 0)</text>

  <path d="M 243 112 L 243 108 L 351 108 L 351 112" stroke="#888888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="297" y="126" text-anchor="middle" font-size="11.5" fill="#888888">zero = 2 (不计)</text>

  <path d="M 351 112 L 351 108 L 459 108 L 459 112" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="405" y="126" text-anchor="middle" font-size="11.5" fill="#4a7a3a">pos = 2 (&gt; 0)</text>

  <!-- formulas -->
  <text x="270" y="158" text-anchor="middle" font-size="12.5" fill="#446688">neg = lower_bound(0) = 首个 nums[i] ≥ 0 的下标</text>
  <text x="270" y="180" text-anchor="middle" font-size="12.5" fill="#4a7a3a">pos = n − upper_bound(0) = n − 首个 nums[i] &gt; 0 的下标</text>

  <!-- answer box -->
  <rect x="150" y="210" width="240" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="235" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">ans = max(neg, pos) = max(3, 2) = 3</text>

  <!-- note -->
  <rect x="40" y="280" width="460" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="298" text-anchor="middle" font-size="11" fill="#555">关键：0 既非正也非负，不计入任一侧；</text>
  <text x="270" y="314" text-anchor="middle" font-size="11" fill="#555">数组升序 → 用 lower_bound / upper_bound 各一次，O(log n)</text>
</svg>
