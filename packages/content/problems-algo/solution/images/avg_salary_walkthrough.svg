<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="360" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">
    示例演算：两月 × 两部门 = 4 行比较
  </text>

  <!-- 表头 -->
  <rect x="20" y="48" width="580" height="34" rx="4" fill="#446688" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="70" y="70" text-anchor="middle" font-size="12" fill="#fff" filter="url(#rough2)">pay_month</text>
  <text x="170" y="70" text-anchor="middle" font-size="12" fill="#fff" filter="url(#rough2)">dept</text>
  <text x="300" y="70" text-anchor="middle" font-size="12" fill="#fff" filter="url(#rough2)">部门工资明细</text>
  <text x="420" y="70" text-anchor="middle" font-size="12" fill="#fff" filter="url(#rough2)">dept_avg</text>
  <text x="510" y="70" text-anchor="middle" font-size="12" fill="#fff" filter="url(#rough2)">company_avg</text>
  <text x="585" y="70" text-anchor="middle" font-size="12" fill="#fff" filter="url(#rough2)">比较</text>

  <!-- 行1: 2017-03 dept1 higher -->
  <rect x="20" y="86" width="580" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="70" y="113" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2017-03</text>
  <text x="170" y="113" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="300" y="113" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[9000]</text>
  <text x="420" y="113" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">9000</text>
  <text x="510" y="113" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">8333.33</text>
  <text x="585" y="113" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">higher↑</text>

  <!-- 行2: 2017-03 dept2 lower -->
  <rect x="20" y="134" width="580" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="70" y="161" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2017-03</text>
  <text x="170" y="161" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="300" y="161" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[6000, 10000]</text>
  <text x="420" y="161" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">8000</text>
  <text x="510" y="161" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">8333.33</text>
  <text x="585" y="161" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">lower↓</text>

  <!-- 分隔：换月 -->
  <path d="M20,184 L600,184" stroke="#bbb" stroke-width="1" stroke-dasharray="6,4" filter="url(#rough2)"/>

  <!-- 行3: 2017-02 dept1 same -->
  <rect x="20" y="190" width="580" height="44" rx="4" fill="#f0f0f0" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="70" y="217" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2017-02</text>
  <text x="170" y="217" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="300" y="217" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[7000]</text>
  <text x="420" y="217" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">7000</text>
  <text x="510" y="217" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">7000</text>
  <text x="585" y="217" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">same＝</text>

  <!-- 行4: 2017-02 dept2 same -->
  <rect x="20" y="238" width="580" height="44" rx="4" fill="#f0f0f0" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="70" y="265" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2017-02</text>
  <text x="170" y="265" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="300" y="265" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[6000, 8000]</text>
  <text x="420" y="265" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">7000</text>
  <text x="510" y="265" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">7000</text>
  <text x="585" y="265" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">same＝</text>

  <!-- 说明 -->
  <rect x="30" y="298" width="560" height="48" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="40" y="318" font-size="12" fill="#555" filter="url(#rough2)">
    · 3 月：公司 (9000+6000+10000)/3 = 8333.33；dept1=9000↑，dept2=8000↓
  </text>
  <text x="40" y="336" font-size="12" fill="#555" filter="url(#rough2)">
    · 2 月：公司 (7000+6000+8000)/3 = 7000；dept1=dept2=7000，均 same
  </text>
</svg>
