<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：候选只看前缀最小值与最大值</text>

  <!-- 数组格子 -->
  <text x="52" y="64" font-size="12" fill="#4a7a3a" filter="url(#rough2)">nums =</text>
  <rect x="100" y="44" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="126" y="66" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="152" y="44" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="178" y="66" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="204" y="44" width="52" height="34" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="66" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">4</text>
  <rect x="256" y="44" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="282" y="66" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <text x="126" y="94" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">0</text>
  <text x="178" y="94" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">1</text>
  <text x="230" y="94" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">2</text>
  <text x="282" y="94" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">3 = j</text>

  <!-- 前缀大括号标注 -->
  <path d="M 100 100 Q 126 112 152 100" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 152 106 L 152 122" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="72" y="124" width="176" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="160" y="141" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">合法候选 i ∈ [0, j−2]（只增不减）</text>

  <!-- 距离标注箭头 -->
  <path d="M 310 60 L 360 60" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="364" y="44" width="140" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="434" y="58" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">j − i ≥ index</text>
  <text x="434" y="72" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">Difference</text>

  <!-- 分隔线 -->
  <path d="M 40 168 L 480 168" stroke="#ccc" stroke-width="1" stroke-dasharray="6 5" filter="url(#rough2)"/>

  <!-- 数轴 -->
  <text x="52" y="200" font-size="12" fill="#555" filter="url(#rough2)">数轴视角：</text>
  <path d="M 90 240 L 460 240" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <circle cx="150" cy="240" r="6" fill="#4a7a3a" stroke="#2f5d24" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="222" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">min = 1</text>
  <circle cx="420" cy="240" r="6" fill="#4a7a3a" stroke="#2f5d24" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="420" y="222" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">max = 5</text>
  <circle cx="150" cy="262" r="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="176" y="284" font-size="11" fill="#446688" filter="url(#rough2)">nums[j]（j 变化时左右移动）</text>

  <!-- 端点代表性说明 -->
  <path d="M 156 240 L 414 240" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <rect x="96" y="308" width="328" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="328" text-anchor="middle" font-size="11.5" fill="#8f3a36" filter="url(#rough2)">任意候选 x 到 nums[j] 的距离</text>
  <text x="260" y="346" text-anchor="middle" font-size="11.5" fill="#8f3a36" filter="url(#rough2)">≤ max(nums[j]−min, max−nums[j]) → 查两端即可</text>
</svg>
