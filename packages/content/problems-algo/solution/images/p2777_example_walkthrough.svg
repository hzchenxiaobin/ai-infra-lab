<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：step=1 vs step=3</text>

  <!-- ===== Example 1: step=1 (04-01 to 04-04) ===== -->
  <text x="30" y="54" font-size="12" fill="#446688" font-weight="bold">示例 1：start=04-01  end=04-04  step=1</text>

  <!-- Date boxes row 1 -->
  <rect x="20" y="64" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="65" y="85" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">04-01</text>

  <rect x="120" y="64" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="165" y="85" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">04-02</text>

  <rect x="220" y="64" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="265" y="85" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">04-03</text>

  <rect x="320" y="64" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="365" y="85" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">04-04</text>

  <!-- yield labels -->
  <text x="65" y="58" text-anchor="middle" font-size="8" fill="#4a7a3a">yield</text>
  <text x="165" y="58" text-anchor="middle" font-size="8" fill="#4a7a3a">yield</text>
  <text x="265" y="58" text-anchor="middle" font-size="8" fill="#4a7a3a">yield</text>
  <text x="365" y="58" text-anchor="middle" font-size="8" fill="#4a7a3a">yield</text>

  <!-- +1 arrows -->
  <path d="M 110 81 L 118 81" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 210 81 L 218 81" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 310 81 L 318 81" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- stop after 04-04 -->
  <path d="M 410 81 L 438 81" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arr)" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="430" y="73" text-anchor="middle" font-size="8" fill="#b85450">04-05&gt;end</text>

  <text x="460" y="85" text-anchor="middle" font-size="10" fill="#888">stop</text>

  <!-- Result -->
  <text x="30" y="114" font-size="10" fill="#555">输出：[04-01, 04-02, 04-03, 04-04]</text>

  <!-- Separator -->
  <line x1="30" y1="128" x2="490" y2="128" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Example 2: step=3 (04-10 to 04-20) ===== -->
  <text x="30" y="150" font-size="12" fill="#446688" font-weight="bold">示例 2：start=04-10  end=04-20  step=3</text>

  <!-- Timeline ticks -->
  <line x1="20" y1="200" x2="480" y2="200" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- Tick labels: 04-10 to 04-20 (11 days) -->
  <!-- positions: 20, 60, 100, 140, 180, 220, 260, 300, 340, 380, 420 -->
  <g font-size="8" fill="#aaa" text-anchor="middle">
    <text x="40" y="216">10</text>
    <text x="80" y="216">11</text>
    <text x="120" y="216">12</text>
    <text x="160" y="216">13</text>
    <text x="200" y="216">14</text>
    <text x="240" y="216">15</text>
    <text x="280" y="216">16</text>
    <text x="320" y="216">17</text>
    <text x="360" y="216">18</text>
    <text x="400" y="216">19</text>
    <text x="440" y="216">20</text>
  </g>

  <!-- Yielded dates: 04-10, 04-13, 04-16, 04-19 -->
  <rect x="20" y="170" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="50" y="188" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">04-10</text>
  <text x="50" y="164" text-anchor="middle" font-size="8" fill="#4a7a3a">yield</text>

  <rect x="140" y="170" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="170" y="188" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">04-13</text>
  <text x="170" y="164" text-anchor="middle" font-size="8" fill="#4a7a3a">yield</text>

  <rect x="260" y="170" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="290" y="188" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">04-16</text>
  <text x="290" y="164" text-anchor="middle" font-size="8" fill="#4a7a3a">yield</text>

  <rect x="380" y="170" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="410" y="188" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">04-19</text>
  <text x="410" y="164" text-anchor="middle" font-size="8" fill="#4a7a3a">yield</text>

  <!-- +3 arrows -->
  <path d="M 80 184 Q 110 184 138 184" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="109" y="176" text-anchor="middle" font-size="8" fill="#446688">+3</text>

  <path d="M 200 184 Q 230 184 258 184" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="229" y="176" text-anchor="middle" font-size="8" fill="#446688">+3</text>

  <path d="M 320 184 Q 350 184 378 184" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="349" y="176" text-anchor="middle" font-size="8" fill="#446688">+3</text>

  <!-- stop: 04-22 > 04-20 -->
  <path d="M 440 184 Q 460 184 470 184" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arr)" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="465" y="176" text-anchor="middle" font-size="8" fill="#b85450">04-22&gt;end</text>

  <!-- Result -->
  <text x="30" y="250" font-size="10" fill="#555">输出：[04-10, 04-13, 04-16, 04-19]</text>

  <!-- Separator -->
  <line x1="30" y1="266" x2="490" y2="266" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Example 3: start==end ===== -->
  <text x="30" y="288" font-size="12" fill="#446688" font-weight="bold">示例 3：start=04-10  end=04-10  step=1</text>

  <rect x="180" y="298" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="225" y="319" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">04-10</text>
  <text x="225" y="292" text-anchor="middle" font-size="8" fill="#4a7a3a">yield</text>

  <path d="M 270 315 L 298 315" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arr)" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="290" y="307" text-anchor="middle" font-size="8" fill="#b85450">04-11&gt;end</text>

  <text x="30" y="348" font-size="10" fill="#555">输出：[04-10]  ← start==end 时 yield 一次即停</text>

  <!-- Key insight box -->
  <rect x="30" y="364" width="460" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="384" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">核心：闭区间 [start, end]，步进不超过 end 才 yield</text>
  <text x="260" y="400" text-anchor="middle" font-size="10" fill="#888">current += step 后若 &gt; end → 不 yield，生成器结束</text>
</svg>
