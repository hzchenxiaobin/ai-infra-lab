<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心：激光束只在「相邻非空行」之间，数量 = cnt_i × cnt_j</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">中间行只要有设备就阻断；空行不影响，自动跳过</text>

  <!-- ===== Grid: 4 rows x 6 cols, cell=36, start x=70 y=64 ===== -->
  <!-- Row label column -->
  <g font-size="11" fill="#888">
    <text x="40" y="86" text-anchor="end">行0</text>
    <text x="40" y="122" text-anchor="end">行1</text>
    <text x="40" y="158" text-anchor="end">行2</text>
    <text x="40" y="194" text-anchor="end">行3</text>
  </g>

  <!-- Row 0: 0 1 1 0 0 1  (devices at col 1,2,5) -->
  <rect x="70" y="70" width="36" height="26" fill="#f6f6f6" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="88" y="88" text-anchor="middle" font-size="13" fill="#ccc">0</text>
  <rect x="106" y="70" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="124" y="88" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="142" y="70" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="160" y="88" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="178" y="70" width="36" height="26" fill="#f6f6f6" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="196" y="88" text-anchor="middle" font-size="13" fill="#ccc">0</text>
  <rect x="214" y="70" width="36" height="26" fill="#f6f6f6" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="232" y="88" text-anchor="middle" font-size="13" fill="#ccc">0</text>
  <rect x="250" y="70" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="268" y="88" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <!-- count badge row0 -->
  <rect x="298" y="74" width="44" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="320" y="88" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">cnt=3</text>

  <!-- Row 1: 0 0 0 0 0 0  (empty, faded) -->
  <rect x="70" y="106" width="36" height="26" fill="#f6f6f6" stroke="#ddd" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <rect x="106" y="106" width="36" height="26" fill="#f6f6f6" stroke="#ddd" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <rect x="142" y="106" width="36" height="26" fill="#f6f6f6" stroke="#ddd" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <rect x="178" y="106" width="36" height="26" fill="#f6f6f6" stroke="#ddd" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <rect x="214" y="106" width="36" height="26" fill="#f6f6f6" stroke="#ddd" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <rect x="250" y="106" width="36" height="26" fill="#f6f6f6" stroke="#ddd" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <rect x="298" y="110" width="44" height="20" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="10" filter="url(#rough2)"/>
  <text x="320" y="124" text-anchor="middle" font-size="10" fill="#aaa">cnt=0</text>
  <text x="372" y="124" font-size="10" fill="#888">空行：自动跳过</text>

  <!-- Row 2: 0 1 0 1 0 0  (devices at col 1,3) -->
  <rect x="70" y="142" width="36" height="26" fill="#f6f6f6" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="88" y="160" text-anchor="middle" font-size="13" fill="#ccc">0</text>
  <rect x="106" y="142" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="124" y="160" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="142" y="142" width="36" height="26" fill="#f6f6f6" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="160" y="160" text-anchor="middle" font-size="13" fill="#ccc">0</text>
  <rect x="178" y="142" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="196" y="160" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="214" y="142" width="36" height="26" fill="#f6f6f6" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="232" y="160" text-anchor="middle" font-size="13" fill="#ccc">0</text>
  <rect x="250" y="142" width="36" height="26" fill="#f6f6f6" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="268" y="160" text-anchor="middle" font-size="13" fill="#ccc">0</text>
  <rect x="298" y="146" width="44" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="320" y="160" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">cnt=2</text>

  <!-- Row 3: 0 0 1 0 0 0  (device at col 2) -->
  <rect x="70" y="178" width="36" height="26" fill="#f6f6f6" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="88" y="196" text-anchor="middle" font-size="13" fill="#ccc">0</text>
  <rect x="106" y="178" width="36" height="26" fill="#f6f6f6" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="124" y="196" text-anchor="middle" font-size="13" fill="#ccc">0</text>
  <rect x="142" y="178" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="160" y="196" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="178" y="178" width="36" height="26" fill="#f6f6f6" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="196" y="196" text-anchor="middle" font-size="13" fill="#ccc">0</text>
  <rect x="214" y="178" width="36" height="26" fill="#f6f6f6" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="232" y="196" text-anchor="middle" font-size="13" fill="#ccc">0</text>
  <rect x="250" y="178" width="36" height="26" fill="#f6f6f6" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="268" y="196" text-anchor="middle" font-size="13" fill="#ccc">0</text>
  <rect x="298" y="182" width="44" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="320" y="196" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">cnt=1</text>

  <!-- ===== Beam group 1: row0 -> row2 (skip empty row1), 3x2=6 ===== -->
  <!-- draw 6 faint lines from row0 devices to row2 devices -->
  <!-- row0 device centers (y=83): col1 x=124, col2 x=160, col5 x=268 -->
  <!-- row2 device centers (y=155): col1 x=124, col3 x=196 -->
  <g stroke="#446688" stroke-width="1" opacity="0.55" filter="url(#rough2)">
    <line x1="124" y1="96" x2="124" y2="142"/>
    <line x1="124" y1="96" x2="196" y2="142"/>
    <line x1="160" y1="96" x2="124" y2="142"/>
    <line x1="160" y1="96" x2="196" y2="142"/>
    <line x1="268" y1="96" x2="124" y2="142"/>
    <line x1="268" y1="96" x2="196" y2="142"/>
  </g>
  <!-- bracket + formula on right side for group1 -->
  <path d="M 360 70 L 354 70 L 354 168 L 360 168" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="368" y="112" font-size="13" fill="#446688" font-weight="bold">3 × 2</text>
  <text x="368" y="130" font-size="11" fill="#446688">= 6 束</text>
  <text x="368" y="92" font-size="9.5" fill="#888">相邻非空</text>

  <!-- ===== Beam group 2: row2 -> row3, 2x1=2 ===== -->
  <g stroke="#d6a040" stroke-width="1.4" opacity="0.7" filter="url(#rough2)">
    <line x1="124" y1="168" x2="160" y2="178"/>
    <line x1="196" y1="168" x2="160" y2="178"/>
  </g>
  <path d="M 360 142 L 354 142 L 354 204 L 360 204" stroke="#d6a040" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="368" y="172" font-size="13" fill="#d6a040" font-weight="bold">2 × 1</text>
  <text x="368" y="190" font-size="11" fill="#d6a040">= 2 束</text>

  <!-- ===== Blocked: row0 -> row3 (crossed out) ===== -->
  <line x1="268" y1="96" x2="160" y2="178" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" opacity="0.5" filter="url(#rough2)"/>
  <text x="440" y="60" font-size="10.5" fill="#b85450" font-weight="bold">行0 ↔ 行3 ✗ 无激光束</text>
  <text x="440" y="76" font-size="10" fill="#b85450">中间行2 有设备 → 阻断</text>

  <!-- ===== Summary box ===== -->
  <rect x="40" y="226" width="480" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="248" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">过滤空行后，对相邻非空行逐对累加 cnt_i × cnt_j</text>
  <text x="280" y="268" text-anchor="middle" font-size="11.5" fill="#555">答案 = 3×2 + 2×1 = 6 + 2 = 8</text>
  <text x="280" y="282" text-anchor="middle" font-size="10" fill="#888">空行只是「透明」，真正起作用的是相邻两个含设备行之间的乘积</text>

  <!-- ===== Why adjacent only ===== -->
  <rect x="40" y="300" width="480" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="60" y="322" font-size="11.5" fill="#333" font-weight="bold">为什么「只看相邻非空行」就够？</text>
  <text x="60" y="342" font-size="10.5" fill="#555">① 两个设备 r1&lt;r2 间有激光束 ⟺ 中间所有行都无设备</text>
  <text x="60" y="358" font-size="10.5" fill="#555">② 若 r1、r2 之间还有非空行 rk，则 r1↔rk 已把 r1 的设备</text>
  <text x="72" y="372" font-size="10.5" fill="#555">「配给」rk，r1↔r2 被 rk 阻断 → 不必计</text>
  <text x="60" y="386" font-size="10.5" fill="#d6a040" font-weight="bold">→ 只需对过滤空行后的序列相邻两项求乘积之和</text>
</svg>
