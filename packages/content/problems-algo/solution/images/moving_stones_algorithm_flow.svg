<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：排序后按间隙分支判定</text>

  <!-- 1. 排序 -->
  <rect x="170" y="46" width="200" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">排序 a, b, c</text>
  <text x="270" y="82" text-anchor="middle" font-size="11" fill="#333">得 x &lt; y &lt; z</text>

  <path d="M 270 92 L 270 116" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. 判定连续 -->
  <polygon points="270,116 380,156 270,196 160,156" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="152" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">z − x == 2 ?</text>
  <text x="270" y="168" text-anchor="middle" font-size="9.5" fill="#888">已连续？</text>

  <!-- yes → [0,0] -->
  <path d="M 380 156 L 430 156" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="405" y="148" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="430" y="136" width="92" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="476" y="154" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回</text>
  <text x="476" y="169" text-anchor="middle" font-size="11" fill="#333">[0, 0]</text>

  <!-- no → 判间隙 -->
  <path d="M 270 196 L 270 222" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="282" y="214" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- 3. 判间隙 ≤2 -->
  <polygon points="270,222 410,262 270,302 130,262" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="258" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">y−x≤2 或 z−y≤2 ?</text>
  <text x="270" y="274" text-anchor="middle" font-size="9.5" fill="#888">存在小间隙？</text>

  <!-- yes → min=1 -->
  <path d="M 130 262 L 80 262" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="105" y="254" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="36" y="244" width="80" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="76" y="261" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">min = 1</text>
  <text x="76" y="275" text-anchor="middle" font-size="9.5" fill="#888">一步凑连续</text>

  <!-- no → min=2 -->
  <path d="M 410 262 L 460 262" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="435" y="254" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="460" y="244" width="80" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="500" y="261" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">min = 2</text>
  <text x="500" y="275" text-anchor="middle" font-size="9.5" fill="#888">两端各移一次</text>

  <!-- 汇合 → 算 max -->
  <path d="M 76 282 L 76 320 L 200 320" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 500 282 L 500 320 L 340 320" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4. max -->
  <rect x="200" y="304" width="140" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="326" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">max = z − x − 2</text>

  <path d="M 270 338 L 270 358" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 5. 返回 -->
  <rect x="190" y="358" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="380" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">返回 [min, max]</text>
</svg>
