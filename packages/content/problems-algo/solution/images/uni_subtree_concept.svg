<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">统计同值子树：自底向上判定，绿色✓为同值子树根</text>

  <!-- 树结构 -->
  <!-- 根 5 (NOT uni) -->
  <line x1="268" y1="82" x2="192" y2="118" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="292" y1="82" x2="368" y2="118" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="280" cy="70" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="74" text-anchor="middle" font-size="12" fill="#333">5</text>
  <text x="300" y="60" font-size="10" fill="#b85450" font-weight="bold">✗</text>

  <!-- 节点 1 (NOT uni: 1 != 5) -->
  <line x1="168" y1="152" x2="132" y2="198" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="192" y1="152" x2="228" y2="198" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="180" cy="135" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="180" y="139" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="198" y="128" font-size="10" fill="#b85450" font-weight="bold">✗</text>

  <!-- 节点 5 右 (uni: 5==5) -->
  <line x1="380" y1="152" x2="430" y2="198" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="380" cy="135" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="380" y="139" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="398" y="128" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- 叶 5 左下 (uni) -->
  <circle cx="125" cy="210" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="125" y="214" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="143" y="203" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- 叶 5 左下右 (uni) -->
  <circle cx="235" cy="210" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="235" y="214" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="253" y="203" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- 叶 5 右下 (uni) -->
  <circle cx="435" cy="210" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="435" y="214" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="453" y="203" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- 同值子树虚线圈 -->
  <ellipse cx="380" cy="175" rx="38" ry="50" fill="none" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- 说明框 -->
  <rect x="50" y="260" width="460" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="284" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">判定规则（后序传递）</text>
  <text x="70" y="306" font-size="11" fill="#555">node 子树同值 ⟺ 左子树同值 ∧ 右子树同值 ∧ val == left.val ∧ val == right.val</text>
  <text x="70" y="326" font-size="11" fill="#4a7a3a">绿色 ✓：同值子树根（4 棵 = 3 叶 + 右上 5 子树）</text>
  <text x="70" y="346" font-size="11" fill="#b85450">红色 ✗：非同值（节点 1 的 1≠5 连累自身；根 5 被左子树连累）</text>
</svg>
