<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="680" height="460" fill="#fafafa"/>

  <text x="340" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例 1：后序逐节点判定，节点 3 的子树是最大 BST，sum = 20</text>
  <text x="340" y="42" text-anchor="middle" font-size="11" fill="#888">绿=合法 BST，红=非 BST；节点旁标注返回四元组 (isBST, min, max, sum)</text>

  <!-- ===== Left: annotated tree ===== -->
  <g font-size="12">
    <!-- edges -->
    <line x1="175" y1="74" x2="130" y2="124" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <line x1="175" y1="74" x2="240" y2="124" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <line x1="130" y1="134" x2="95" y2="184" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <line x1="130" y1="134" x2="155" y2="184" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <line x1="240" y1="134" x2="205" y2="184" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <line x1="240" y1="134" x2="280" y2="184" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <line x1="280" y1="194" x2="255" y2="244" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <line x1="280" y1="194" x2="305" y2="244" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>

    <!-- node 1 (root): red = not BST -->
    <circle cx="175" cy="66" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="175" y="71" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <text x="175" y="96" text-anchor="middle" font-size="9" fill="#b85450">(F,−,−,−)</text>

    <!-- node 4 (root left): red = not BST (4 &lt; 4 false) -->
    <circle cx="130" cy="129" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="130" y="134" text-anchor="middle" fill="#b85450" font-weight="bold">4</text>
    <text x="130" y="156" text-anchor="middle" font-size="9" fill="#b85450">(F,−,−,−)</text>

    <!-- node 3 (root right): orange = best, BST sum=20 -->
    <circle cx="240" cy="129" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
    <text x="240" y="134" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
    <text x="240" y="156" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">(T,2,6,20)</text>

    <!-- node 2 (4's left): green leaf BST -->
    <circle cx="95" cy="194" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="95" y="199" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="95" y="220" text-anchor="middle" font-size="9" fill="#4a7a3a">(T,2,2,2)</text>

    <!-- node 4 (4's right): green leaf BST -->
    <circle cx="155" cy="194" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="155" y="199" text-anchor="middle" fill="#4a7a3a" font-weight="bold">4</text>
    <text x="155" y="220" text-anchor="middle" font-size="9" fill="#4a7a3a">(T,4,4,4)</text>

    <!-- node 2 (3's left): green leaf BST -->
    <circle cx="205" cy="194" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="205" y="199" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="205" y="220" text-anchor="middle" font-size="9" fill="#4a7a3a">(T,2,2,2)</text>

    <!-- node 5 (3's right): green BST sum=15 -->
    <circle cx="280" cy="194" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="280" y="199" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>
    <text x="280" y="220" text-anchor="middle" font-size="9" fill="#4a7a3a">(T,4,6,15)</text>

    <!-- node 4 (5's left): green leaf BST -->
    <circle cx="255" cy="254" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="255" y="259" text-anchor="middle" fill="#4a7a3a" font-weight="bold">4</text>
    <text x="255" y="280" text-anchor="middle" font-size="9" fill="#4a7a3a">(T,4,4,4)</text>

    <!-- node 6 (5's right): green leaf BST -->
    <circle cx="305" cy="254" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="305" y="259" text-anchor="middle" fill="#4a7a3a" font-weight="bold">6</text>
    <text x="305" y="280" text-anchor="middle" font-size="9" fill="#4a7a3a">(T,6,6,6)</text>
  </g>

  <!-- arrow pointing to node 3's subtree -->
  <text x="240" y="116" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">★ 最优</text>

  <!-- highlight node 4(root-left) violation -->
  <text x="130" y="116" text-anchor="middle" font-size="9" fill="#b85450">4 &lt; 4 ✗</text>

  <!-- ===== Right: post-order table ===== -->
  <text x="510" y="64" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">后序遍历步骤</text>

  <!-- header -->
  <rect x="370" y="74" width="280" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="392" y="90" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">#</text>
  <text x="430" y="90" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">节点</text>
  <text x="510" y="90" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">返回四元组</text>
  <text x="615" y="90" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">best</text>

  <!-- rows -->
  <g font-size="9" fill="#555">
    <rect x="370" y="100" width="280" height="20" rx="3" fill="#e6f4ea" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="392" y="114" text-anchor="middle">1</text><text x="430" y="114" text-anchor="middle">2</text><text x="510" y="114" text-anchor="middle">(T,2,2,2)</text><text x="615" y="114" text-anchor="middle" fill="#4a7a3a">2</text>

    <rect x="370" y="122" width="280" height="20" rx="3" fill="#e6f4ea" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="392" y="136" text-anchor="middle">2</text><text x="430" y="136" text-anchor="middle">4</text><text x="510" y="136" text-anchor="middle">(T,4,4,4)</text><text x="615" y="136" text-anchor="middle" fill="#4a7a3a">4</text>

    <rect x="370" y="144" width="280" height="20" rx="3" fill="#fce4ec" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="392" y="158" text-anchor="middle">3</text><text x="430" y="158" text-anchor="middle">4</text><text x="510" y="158" text-anchor="middle" fill="#b85450">(F,−,−,−)</text><text x="615" y="158" text-anchor="middle">4</text>

    <rect x="370" y="166" width="280" height="20" rx="3" fill="#e6f4ea" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="392" y="180" text-anchor="middle">4</text><text x="430" y="180" text-anchor="middle">2</text><text x="510" y="180" text-anchor="middle">(T,2,2,2)</text><text x="615" y="180" text-anchor="middle">4</text>

    <rect x="370" y="188" width="280" height="20" rx="3" fill="#e6f4ea" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="392" y="202" text-anchor="middle">5</text><text x="430" y="202" text-anchor="middle">4</text><text x="510" y="202" text-anchor="middle">(T,4,4,4)</text><text x="615" y="202" text-anchor="middle">4</text>

    <rect x="370" y="210" width="280" height="20" rx="3" fill="#e6f4ea" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="392" y="224" text-anchor="middle">6</text><text x="430" y="224" text-anchor="middle">6</text><text x="510" y="224" text-anchor="middle">(T,6,6,6)</text><text x="615" y="224" text-anchor="middle" fill="#4a7a3a">6</text>

    <rect x="370" y="232" width="280" height="20" rx="3" fill="#e6f4ea" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="392" y="246" text-anchor="middle">7</text><text x="430" y="246" text-anchor="middle">5</text><text x="510" y="246" text-anchor="middle">(T,4,6,15)</text><text x="615" y="246" text-anchor="middle" fill="#4a7a3a">15</text>

    <!-- best row highlighted -->
    <rect x="370" y="254" width="280" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="392" y="270" text-anchor="middle" fill="#d6a040" font-weight="bold">8</text>
    <text x="430" y="270" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
    <text x="510" y="270" text-anchor="middle" fill="#d6a040" font-weight="bold">(T,2,6,20)</text>
    <text x="615" y="270" text-anchor="middle" fill="#b85450" font-weight="bold">20 ←</text>

    <rect x="370" y="278" width="280" height="20" rx="3" fill="#fce4ec" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="392" y="292" text-anchor="middle">9</text><text x="430" y="292" text-anchor="middle">1</text><text x="510" y="292" text-anchor="middle" fill="#b85450">(F,−,−,−)</text><text x="615" y="292" text-anchor="middle">20</text>
  </g>

  <!-- bottom notes -->
  <rect x="30" y="318" width="620" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="340" y="340" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">关键节点分析</text>
  <text x="340" y="358" text-anchor="middle" font-size="10" fill="#666">步骤③ 节点 4：左.max=2 ✓ 但 4 &lt; 右.min=4 ✗（右子值也是 4，BST 要求严格大于）→ 非 BST</text>
  <text x="340" y="372" text-anchor="middle" font-size="10" fill="#666">步骤⑧ 节点 3：3 &gt; 左.max=2 ✓ 且 3 &lt; 右.min=4 ✓ → 合法 BST，sum = 3+2+5+4+6 = 20</text>

  <rect x="30" y="384" width="620" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="340" y="402" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">答案 = best = 20（节点 3 子树：{3,2,5,4,6} 是合法 BST 且和最大）</text>
  <text x="340" y="418" text-anchor="middle" font-size="10" fill="#666">best 初值 = 0：若全树无合法 BST 或所有 BST 子树和为负，返回 0（空子树）</text>

  <!-- legend -->
  <rect x="30" y="432" width="620" height="20" rx="4" fill="none" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="50" cy="442" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
  <text x="64" y="446" font-size="9" fill="#666">合法 BST</text>
  <circle cx="140" cy="442" r="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  <text x="154" y="446" font-size="9" fill="#666">非 BST</text>
  <circle cx="220" cy="442" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  <text x="234" y="446" font-size="9" fill="#666">最优解（最大和）</text>
</svg>
