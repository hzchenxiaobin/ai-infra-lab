<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：旋转后 mid 两侧必有一半有序</text>

  <!-- array nums = [4,5,6,7,0,1,2], mid=3 (value 7) -->
  <text x="20" y="74" font-size="12" fill="#888">nums：</text>
  <rect x="60" y="58" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="82" y="78" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="108" y="58" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="78" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="156" y="58" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="78" text-anchor="middle" font-size="12" fill="#333">6</text>
  <rect x="204" y="58" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="226" y="78" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">7</text>
  <rect x="252" y="58" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="274" y="78" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="300" y="58" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="322" y="78" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="348" y="58" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="78" text-anchor="middle" font-size="12" fill="#333">2</text>

  <!-- index labels -->
  <text x="82" y="106" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="130" y="106" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="178" y="106" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="226" y="106" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">3 ← mid</text>
  <text x="274" y="106" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">4 旋转点</text>
  <text x="322" y="106" text-anchor="middle" font-size="9" fill="#aaa">5</text>
  <text x="370" y="106" text-anchor="middle" font-size="9" fill="#aaa">6</text>

  <!-- left pointer, right pointer -->
  <text x="82" y="132" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">left</text>
  <path d="M 82 136 L 82 116" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="370" y="132" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">right</text>
  <path d="M 370 136 L 370 116" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>

  <!-- segment brackets -->
  <path d="M 62 50 L 62 44 L 246 44 L 246 50" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="154" y="38" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">左半 [4,5,6,7] 有序 ✓</text>
  <path d="M 254 50 L 254 44 L 390 44 L 390 50" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="322" y="38" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">右半 [0,1,2] 有序 ✓</text>

  <!-- key idea -->
  <rect x="30" y="156" width="480" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="180" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">旋转点 k 只有一个</text>
  <text x="270" y="200" text-anchor="middle" font-size="11.5" fill="#555">它要么在 [left,mid]、要么在 [mid,right]</text>
  <text x="270" y="216" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">→ 旋转点所在半无序，另一半保持升序</text>

  <!-- compare rule -->
  <rect x="30" y="236" width="480" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="258" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">判断依据：nums[left] ≤ nums[mid] ？</text>
  <text x="270" y="276" text-anchor="middle" font-size="11" fill="#888">是 → 左半有序；否 → 右半有序</text>

  <!-- footer -->
  <rect x="30" y="298" width="480" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="320" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">每轮先定有序半段，再据 target 落点收缩</text>
  <text x="270" y="336" text-anchor="middle" font-size="11" fill="#888">仍能砍掉一半 → O(log n)</text>
</svg>
