<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arro" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心：分隔符即切点，两切点间无字符 → 空段 → 丢弃</text>

  <!-- ===== input string $easy$ ===== -->
  <text x="40" y="60" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">words[i] = "$easy$"</text>
  <text x="300" y="60" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">separator = '$'</text>

  <!-- char cells: $ e a s y $  (width 40, start x=80) -->
  <!-- cell 0: $ (separator) -->
  <rect x="80" y="70" width="40" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="95" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold" filter="url(#rough2)">$</text>
  <!-- cell 1: e -->
  <rect x="120" y="70" width="40" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="140" y="95" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">e</text>
  <!-- cell 2: a -->
  <rect x="160" y="70" width="40" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="180" y="95" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">a</text>
  <!-- cell 3: s -->
  <rect x="200" y="70" width="40" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="220" y="95" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">s</text>
  <!-- cell 4: y -->
  <rect x="240" y="70" width="40" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="260" y="95" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">y</text>
  <!-- cell 5: $ (separator) -->
  <rect x="280" y="70" width="40" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="300" y="95" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold" filter="url(#rough2)">$</text>

  <!-- cut indicators at separator centers x=100 and x=300 -->
  <path d="M 100 110 L 100 132" stroke="#d6a040" stroke-width="2" stroke-dasharray="3 2" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="100" y="124" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold" filter="url(#rough2)">切</text>
  <path d="M 300 110 L 300 132" stroke="#d6a040" stroke-width="2" stroke-dasharray="3 2" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="300" y="124" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold" filter="url(#rough2)">切</text>

  <!-- ===== split segments row ===== -->
  <!-- segment 0: before first cut (x<100) -> empty -->
  <rect x="56" y="140" width="40" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <text x="76" y="165" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">空</text>
  <path d="M 60 144 L 92 174" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- segment 1: between cuts -> "easy" (x 100..300, center 200) -->
  <rect x="150" y="140" width="100" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="200" y="165" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">easy</text>

  <!-- segment 2: after last cut (x>300) -> empty -->
  <rect x="304" y="140" width="40" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <text x="324" y="165" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">空</text>
  <path d="M 308 144 L 340 174" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- arrows from cuts to segment boundaries -->
  <path d="M 100 132 L 76 138" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="2 2" filter="url(#rough2)"/>
  <path d="M 100 132 L 150 138" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="2 2" filter="url(#rough2)"/>
  <path d="M 300 132 L 250 138" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="2 2" filter="url(#rough2)"/>
  <path d="M 300 132 L 324 138" stroke="#b85450" stroke-width="1.2" stroke-dasharray="2 2" filter="url(#rough2)"/>

  <!-- ===== result arrow ===== -->
  <path d="M 200 184 L 200 206" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="200" font-size="11" fill="#b85450" filter="url(#rough2)">2 个空段丢弃</text>

  <!-- ===== result box ===== -->
  <rect x="120" y="210" width="320" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="237" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">结果 = ["easy"]</text>

  <!-- ===== rule note ===== -->
  <rect x="40" y="270" width="480" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="290" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">规则：分隔符定切点位置但不入结果；</text>
  <text x="280" y="307" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">相邻/首尾分隔符产生空段 → 一律丢弃</text>

  <text x="280" y="332" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">实现：切分时判断 i &gt; start（段长 &gt; 0）即可天然过滤空段</text>
</svg>
