<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="320" fill="#fafafa"/>

  <!-- Title -->
  <text x="360" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：逐行读 → 取两列 → CONCAT 拼接 → 输出</text>
  <text x="360" y="44" text-anchor="middle" font-size="10.5" fill="#888">无过滤、无聚合、无排序：纯逐行映射，输出行数恒等于输入行数</text>

  <!-- step 1 -->
  <rect x="30" y="90" width="130" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="95" y="112" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">① FROM Person</text>
  <text x="95" y="130" text-anchor="middle" font-size="10" fill="#555">读入每一行</text>
  <text x="95" y="146" text-anchor="middle" font-size="10" fill="#555">(person_id,name,profession)</text>

  <!-- arrow 1->2 -->
  <path d="M 162 125 L 196 125" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2 -->
  <rect x="200" y="90" width="140" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="112" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">② 取两列</text>
  <text x="270" y="130" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">name</text>
  <text x="270" y="146" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">profession</text>

  <!-- arrow 2->3 -->
  <path d="M 342 125 L 376 125" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 3 -->
  <rect x="380" y="90" width="160" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="460" y="112" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">③ CONCAT 拼接</text>
  <text x="460" y="130" text-anchor="middle" font-size="10" fill="#555">CONCAT(name, profession)</text>
  <text x="460" y="146" text-anchor="middle" font-size="10" fill="#888">按序首尾相接 · 无分隔</text>

  <!-- arrow 3->4 -->
  <path d="M 542 125 L 576 125" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 4 -->
  <rect x="580" y="90" width="110" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="635" y="112" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">④ 输出</text>
  <text x="635" y="130" text-anchor="middle" font-size="10" fill="#555">AS name</text>
  <text x="635" y="146" text-anchor="middle" font-size="10" fill="#555">单列结果集</text>

  <!-- row mapping illustration -->
  <text x="360" y="196" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">逐行映射示例</text>

  <rect x="60" y="206" width="220" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="80" y="223" font-size="10.5" fill="#333">name=Alex</text>
  <text x="180" y="223" font-size="10.5" fill="#333">profession=Singer</text>

  <path d="M 282 219 L 360 219" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="321" y="213" text-anchor="middle" font-size="9.5" fill="#888">CONCAT</text>

  <rect x="364" y="206" width="200" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="464" y="223" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">name = AlexSinger</text>

  <rect x="60" y="234" width="220" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="80" y="251" font-size="10.5" fill="#333">name=Alice</text>
  <text x="180" y="251" font-size="10.5" fill="#333">profession=Actor</text>

  <path d="M 282 247 L 360 247" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="364" y="234" width="200" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="464" y="251" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">name = AliceActor</text>

  <text x="360" y="288" text-anchor="middle" font-size="9.5" fill="#bbb">SELECT 子句做投影与计算、FROM 指定行源；本题无 WHERE/GROUP BY/ORDER BY，引擎对每行独立求值</text>
  <text x="360" y="304" text-anchor="middle" font-size="9.5" fill="#bbb">CONCAT 是标量函数：每行独立计算 name‖profession，行间互不影响</text>
</svg>
