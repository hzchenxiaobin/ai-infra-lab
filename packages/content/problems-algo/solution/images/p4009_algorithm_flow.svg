<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="17" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">算法流程：字典序记忆化搜索 —— 先服务数、后等待</text>

  <rect x="170" y="26" width="180" height="24" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">dp(i, f0, f1, b0, b1)</text>

  <path d="M 260 50 L 260 58" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,58 332,86 260,114 188,86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="90" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">i = n ?</text>

  <path d="M 332 86 L 364 86" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="344" y="80" font-size="9" fill="#888" filter="url(#rough2)">是</text>
  <rect x="368" y="74" width="132" height="24" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="434" y="90" text-anchor="middle" font-size="10" fill="#2f5527" filter="url(#rough2)">返回 (0, 0)（全服务完）</text>

  <path d="M 260 114 L 260 124" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="122" font-size="9" fill="#888" filter="url(#rough2)">否</text>

  <rect x="150" y="124" width="220" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="141" text-anchor="middle" font-size="10" fill="#2f4a66" filter="url(#rough2)">枚举 j = 0, 1：fj ≥ demand[i] ?</text>

  <path d="M 225 150 L 145 166" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="146" y="161" font-size="9" fill="#4a7a3a" filter="url(#rough2)">某台够</text>
  <path d="M 295 150 L 380 166" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="368" y="161" font-size="9" fill="#b85450" filter="url(#rough2)">都不够</text>

  <rect x="26" y="168" width="232" height="100" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="142" y="183" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2f5527" filter="url(#rough2)">交给加油机 j（记 d = demand[i]）</text>
  <text x="36" y="197" font-size="9" fill="#4a7a3a" filter="url(#rough2)">· wait = bj（本车等待）</text>
  <text x="36" y="210" font-size="9" fill="#4a7a3a" filter="url(#rough2)">· fj ← fj − d，bj ← d</text>
  <text x="36" y="223" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">· b别台 ← max(0, b别台 − wait)</text>
  <text x="36" y="236" font-size="9" fill="#4a7a3a" filter="url(#rough2)">· 递归 dp(i+1, …) 得 (c, w)</text>
  <text x="36" y="249" font-size="9" fill="#4a7a3a" filter="url(#rough2)">· 候选 = (c+1, max(wait, w))</text>
  <text x="36" y="262" font-size="8.5" fill="#888" filter="url(#rough2)">　两个分支都要试（贪心不可靠）</text>

  <rect x="276" y="168" width="218" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="385" y="183" text-anchor="middle" font-size="10" font-weight="bold" fill="#8c3a35" filter="url(#rough2)">两台都缺料</text>
  <text x="385" y="197" text-anchor="middle" font-size="9" fill="#8c3a35" filter="url(#rough2)">车 i 永远无法开工</text>
  <text x="385" y="211" text-anchor="middle" font-size="9" fill="#8c3a35" filter="url(#rough2)">→ 返回 (i, 0)：过程终止</text>

  <path d="M 142 268 L 142 278" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="278" width="300" height="26" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="295" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">候选按字典序取最优：服务数最大；并列 → 等待最小</text>

  <path d="M 260 304 L 260 312" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="85" y="312" width="350" height="24" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="328" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">顶层 dp(0, F0, F1, 0, 0)：服务数 = 0 → −1；否则返回等待</text>

  <text x="260" y="352" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">状态 ≤ 51×51×21×21 ≈ 1.1×10⁶，实测可达仅 ~10³（燃料总量 ≤ 100，服务前缀很快耗尽）</text>
</svg>
