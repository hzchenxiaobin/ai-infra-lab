<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：忽略碰撞 → 算终点 → 排序 → 前缀和</text>

  <!-- Step 1: compute final positions -->
  <rect x="40" y="48" width="440" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="60" y="70" font-size="12" fill="#446688" font-weight="bold">Step 1  计算终点（忽略碰撞）</text>
  <text x="60" y="90" font-size="11" fill="#444">pos[i] = nums[i] + d   (s[i]=='R')</text>
  <text x="60" y="106" font-size="11" fill="#444">pos[i] = nums[i] − d   (s[i]=='L')</text>
  <rect x="340" y="62" width="120" height="40" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="400" y="78" text-anchor="middle" font-size="10" fill="#888">机器人无差别</text>
  <text x="400" y="92" text-anchor="middle" font-size="10" fill="#888">⟺ 穿透等价</text>

  <path d="M 260 118 L 260 138" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 2: sort -->
  <rect x="40" y="140" width="440" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="60" y="162" font-size="12" fill="#d6a040" font-weight="bold">Step 2  排序</text>
  <text x="60" y="182" font-size="11" fill="#444">sort(pos)  →  有序后 |pos[i] − pos[j]| = pos[j] − pos[i]  (j &gt; i)</text>
  <!-- mini sorted visualization -->
  <circle cx="300" cy="172" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="330" cy="172" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="360" cy="172" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="390" cy="172" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="420" y="176" font-size="10" fill="#888">升序</text>

  <path d="M 260 200 L 260 220" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Step 3: prefix sum -->
  <rect x="40" y="222" width="440" height="88" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="60" y="244" font-size="12" fill="#4a7a3a" font-weight="bold">Step 3  前缀和求两两距离之和</text>
  <text x="60" y="264" font-size="11" fill="#444">ans = Σ ( i · pos[i] − prefix[i] )</text>
  <text x="60" y="280" font-size="11" fill="#444">     = Σ pos[i] · (2i − n + 1)</text>
  <rect x="300" y="256" width="160" height="40" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="380" y="272" text-anchor="middle" font-size="10" fill="#4a7a3a">每个点作"大端"被加</text>
  <text x="380" y="286" text-anchor="middle" font-size="10" fill="#4a7a3a">i 次，减去前面之和</text>
  <text x="60" y="298" font-size="10" fill="#888">prefix 累加当前 pos[i] 供后续使用</text>

  <path d="M 260 312 L 260 332" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Result -->
  <rect x="140" y="334" width="240" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="356" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return ans % (10⁹ + 7)</text>
</svg>
