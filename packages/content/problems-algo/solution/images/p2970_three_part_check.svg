<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：移除 [l, r] ⇒ 剩余元素 = 前缀 + 后缀</text>

  <!-- labels above cells -->
  <text x="120" y="54" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">前缀（保留）</text>
  <text x="189" y="54" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">删除段 [l..r]</text>
  <text x="258" y="54" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">后缀（保留）</text>

  <!-- original array cells -->
  <rect x="100" y="62" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="120" y="85" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="146" y="62" width="40" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="166" y="85" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="192" y="62" width="40" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="212" y="85" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="238" y="62" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="258" y="85" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">8</text>

  <!-- indices -->
  <text x="120" y="116" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="166" y="116" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="212" y="116" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="258" y="116" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">3</text>

  <!-- legend -->
  <rect x="322" y="62" width="13" height="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="342" y="73" font-size="11" fill="#555" filter="url(#rough2)">保留的前缀</text>
  <rect x="322" y="82" width="13" height="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="342" y="93" font-size="11" fill="#555" filter="url(#rough2)">删除的子数组（枚举对象）</text>
  <rect x="322" y="102" width="13" height="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="342" y="113" font-size="11" fill="#555" filter="url(#rough2)">保留的后缀</text>

  <!-- arrow down -->
  <path d="M 169 126 L 169 150" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="182" y="142" font-size="11.5" fill="#555" filter="url(#rough2)">移除 [5,7]，即 l=1, r=2</text>

  <!-- remaining row -->
  <rect x="100" y="158" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="120" y="181" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="146" y="158" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="166" y="181" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">8</text>
  <path d="M 200 176 L 224 176" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="234" y="181" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">剩余 [6,8]：6 &lt; 8，严格递增 ✓</text>

  <!-- checklist box -->
  <rect x="48" y="222" width="424" height="150" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="248" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold" filter="url(#rough2)">判定只看三个条件（每个都能 O(1) 检查）</text>
  <text x="260" y="276" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">① 前缀 nums[0..l-1] 严格递增（或为空）</text>
  <text x="260" y="300" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">② 后缀 nums[r+1..n-1] 严格递增（或为空）</text>
  <text x="260" y="324" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">③ 拼接不断崖：l=0 或 r=n-1 或 nums[l-1] &lt; nums[r+1]</text>
  <text x="260" y="352" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">空数组也算递增 ⇒ 空前缀 / 空后缀自动放行；被删内容本身无关紧要</text>
</svg>
