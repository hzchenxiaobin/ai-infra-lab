<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：能否相等取决于下界小的一侧能否拉伸</text>

  <!-- 示例 1 面板 -->
  <rect x="24" y="44" width="472" height="152" rx="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="68" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">示例 1：min₁=8 &lt; min₂=12，z₁=2 &gt; 0 → 可拉高 ✓</text>
  <text x="36" y="97" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">nums1</text>
  <rect x="76" y="80" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="91" y="98" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="112" y="80" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="127" y="98" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="148" y="80" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="163" y="98" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="184" y="80" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="199" y="98" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="220" y="80" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="235" y="98" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="163" y="128" text-anchor="middle" font-size="12" fill="#33507a" font-weight="bold" filter="url(#rough2)">min₁ = 6+2 = 8</text>
  <text x="300" y="97" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">nums2</text>
  <rect x="340" y="80" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="355" y="98" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <rect x="376" y="80" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="391" y="98" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="412" y="80" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="427" y="98" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="391" y="128" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">min₂ = 11+1 = 12</text>
  <text x="260" y="158" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">8 &lt; 12：把增量 4 堆给 nums1 的一个 0（换成 5）⇒ 两边同取 12</text>

  <!-- 示例 2 面板 -->
  <rect x="24" y="212" width="472" height="152" rx="10" fill="#ffffff" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="236" text-anchor="middle" font-size="12.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">示例 2：min₁=6 &gt; min₂=5，z₂=0 → 定值够不到 ✗</text>
  <text x="36" y="265" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">nums1</text>
  <rect x="76" y="248" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="91" y="266" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="112" y="248" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="127" y="266" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="148" y="248" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="163" y="266" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="184" y="248" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="199" y="266" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="163" y="296" text-anchor="middle" font-size="12" fill="#33507a" font-weight="bold" filter="url(#rough2)">min₁ = 4+2 = 6</text>
  <text x="296" y="265" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">nums2</text>
  <rect x="340" y="248" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="355" y="266" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="376" y="248" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="391" y="266" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="391" y="296" text-anchor="middle" font-size="12" fill="#33507a" font-weight="bold" filter="url(#rough2)">min₂ = 5+0 = 5（定值）</text>
  <text x="260" y="326" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">6 &gt; 5：nums2 无 0，和恒为 5 被锁死 ⇒ 区间无交，返回 -1</text>
</svg>
