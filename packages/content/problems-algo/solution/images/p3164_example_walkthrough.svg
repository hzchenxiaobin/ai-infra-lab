<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums1 = [1,2,4,12]，nums2 = [2,4]，k = 3</text>

  <rect x="330" y="36" width="158" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="409" y="53" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">cnt2 = {2:1, 4:1}</text>

  <rect x="34" y="76" width="76" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="72" y="93" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">去重值 x</text>

  <rect x="110" y="76" width="76" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="148" y="93" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">x mod k</text>

  <rect x="186" y="76" width="76" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="224" y="93" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">y = x/k</text>

  <rect x="262" y="76" width="176" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="350" y="93" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">约数 d → 查 cnt2</text>

  <rect x="438" y="76" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="462" y="93" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">贡献</text>

  <rect x="34" y="102" width="452" height="36" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="72" y="125" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="148" y="125" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">1 ≠ 0 ✗</text>
  <text x="224" y="125" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>
  <text x="350" y="125" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">剪枝跳过</text>
  <text x="462" y="125" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">0</text>

  <rect x="34" y="138" width="452" height="36" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="72" y="161" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="148" y="161" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">2 ≠ 0 ✗</text>
  <text x="224" y="161" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>
  <text x="350" y="161" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">剪枝跳过</text>
  <text x="462" y="161" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">0</text>

  <rect x="34" y="174" width="452" height="36" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="72" y="197" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="148" y="197" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">1 ≠ 0 ✗</text>
  <text x="224" y="197" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>
  <text x="350" y="197" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">剪枝跳过</text>
  <text x="462" y="197" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">0</text>

  <rect x="34" y="210" width="452" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="72" y="233" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">12</text>
  <text x="148" y="233" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0 ✓</text>
  <text x="224" y="233" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="350" y="233" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1→0、2→1、4→1</text>
  <text x="462" y="233" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="34" y="262" width="452" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="281" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">x = 12：y = 4，试除 d = 1（命中，查 1 与对称约数 4）</text>
  <text x="260" y="299" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">d = 2（命中，d² = 4 = y，只查 2 一次）→ 命中 2 个</text>

  <rect x="34" y="320" width="452" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="343" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = 0 + 0 + 0 + 2 = 2 ✓</text>

  <text x="260" y="378" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">验证示例 1（k=1，cnt2={1:1,3:1,4:1}）：1→{1} 得 1，3→{1,3} 得 2，4→{1,2,4} 得 2，合计 5 ✓</text>
</svg>
