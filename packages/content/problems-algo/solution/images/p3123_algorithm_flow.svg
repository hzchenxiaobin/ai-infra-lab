<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 650" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="650" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：两遍 Dijkstra + O(1) 逐边判定</text>

  <!-- step 1 -->
  <rect x="150" y="38" width="220" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="58" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">建邻接表（无向边双向入表）</text>

  <path d="M 215 70 L 175 102" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 305 70 L 345 102" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 2: two dijkstra -->
  <rect x="85" y="104" width="160" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="165" y="124" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">Dijkstra(0) → d0[·]</text>

  <rect x="275" y="104" width="160" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="355" y="124" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">Dijkstra(n−1) → d1[·]</text>

  <path d="M 165 136 L 232 168" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 355 136 L 288 168" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 3 -->
  <rect x="185" y="170" width="150" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="190" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">D = d0[n−1]</text>

  <path d="M 260 202 L 260 222" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 1 -->
  <polygon points="260,224 372,264 260,304 148,264" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="268" text-anchor="middle" font-size="11" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">D == INF ？</text>

  <path d="M 372 264 L 396 264" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="381" y="256" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="400" y="242" width="112" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="456" y="260" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回全 false</text>
  <text x="456" y="276" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">（不连通）</text>

  <path d="M 260 304 L 260 326" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="272" y="320" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- step 4 -->
  <rect x="140" y="328" width="240" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="348" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">逐边循环 i = 0 … m−1，取 (a, b, w)</text>

  <path d="M 260 360 L 260 382" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 2 -->
  <polygon points="260,384 462,436 260,488 58,436" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="430" text-anchor="middle" font-size="10.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">d0[a] + w + d1[b] == D</text>
  <text x="260" y="450" text-anchor="middle" font-size="10.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">或 d0[b] + w + d1[a] == D ？</text>

  <path d="M 58 436 L 112 504" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="70" y="466" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="45" y="506" width="140" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="115" y="526" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">answer[i] = true</text>

  <path d="M 462 436 L 408 504" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="445" y="466" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="335" y="506" width="140" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="405" y="526" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">answer[i] = false</text>

  <path d="M 115 538 L 218 572" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 405 538 L 302 572" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 5 -->
  <rect x="185" y="574" width="150" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="595" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">返回 answer</text>

  <!-- note -->
  <rect x="40" y="618" width="440" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="634" text-anchor="middle" font-size="10" fill="#8a6a1f" filter="url(#rough2)">C++ 注意：路径和上界 ≈ 5×10⁹，用 long long；INF 取 LLONG_MAX/4 防相加溢出</text>
</svg>
