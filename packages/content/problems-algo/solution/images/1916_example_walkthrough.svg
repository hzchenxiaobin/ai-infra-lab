<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">
    示例演算：prevRoom = [-1,0,0,1,2]
  </text>

  <!-- Tree -->
  <circle cx="150" cy="64" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="69" text-anchor="middle" font-size="12" fill="#7a3a38" font-weight="bold" filter="url(#rough2)">0</text>
  <path d="M 138 78 L 100 116" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 162 78 L 200 116" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <circle cx="92" cy="130" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="92" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="208" cy="130" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="208" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <path d="M 92 145 L 92 178" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 208 145 L 208 178" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <circle cx="92" cy="194" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="92" y="198" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <circle cx="208" cy="194" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="208" y="198" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4</text>
  <text x="150" y="220" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">叶子：sz=1, dp=1</text>

  <!-- DP table -->
  <text x="400" y="50" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">后序自底向上</text>
  <rect x="330" y="60" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="360" y="78" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">u</text>
  <rect x="390" y="60" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="420" y="78" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">sz</text>
  <rect x="450" y="60" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="495" y="78" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">dp</text>

  <rect x="330" y="88" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="360" y="104" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="390" y="88" width="60" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="420" y="104" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="450" y="88" width="90" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="495" y="104" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <rect x="330" y="114" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="360" y="130" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="390" y="114" width="60" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="420" y="130" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="450" y="114" width="90" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="495" y="130" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <rect x="330" y="140" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="360" y="156" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="390" y="140" width="60" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="420" y="156" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="450" y="140" width="90" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="495" y="156" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <rect x="330" y="166" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="360" y="182" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="390" y="166" width="60" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="420" y="182" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="450" y="166" width="90" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="495" y="182" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <rect x="330" y="192" width="60" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="360" y="211" text-anchor="middle" font-size="12" fill="#7a3a38" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="390" y="192" width="60" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="420" y="211" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="450" y="192" width="90" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="495" y="211" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">6</text>

  <!-- computation lines -->
  <rect x="30" y="248" width="500" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="268" text-anchor="middle" font-size="11" fill="#7a5a20" filter="url(#rough2)">
    dp[1] = f[1]·dp[3]·g[1] = 1·1·1 = 1
  </text>
  <text x="280" y="284" text-anchor="middle" font-size="11" fill="#7a5a20" filter="url(#rough2)">
    dp[2] = f[1]·dp[4]·g[1] = 1
  </text>
  <text x="280" y="300" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold" filter="url(#rough2)">
    dp[0] = f[4]·dp[1]·g[2]·dp[2]·g[2] = 24·(1/2)·(1/2) = 6
  </text>

  <!-- answer -->
  <rect x="120" y="320" width="320" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="338" text-anchor="middle" font-size="12" fill="#7a3a38" filter="url(#rough2)">
    4 个剩余位置交错两棵 sz=2 的子树
  </text>
  <text x="280" y="354" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">
    C(4,2) = 6 种 ⭐
  </text>

  <!-- note -->
  <rect x="60" y="378" width="440" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="398" text-anchor="middle" font-size="11" fill="#3a5a2a" filter="url(#rough2)">
    除法在模 p 下转为乘逆元：g[sz[v]] = (sz[v]!)⁻¹
  </text>
  <text x="280" y="414" text-anchor="middle" font-size="11" fill="#3a5a2a" filter="url(#rough2)">
    p = 1e9+7 为质数，由费马小定理 a⁻¹ ≡ a^(p−2)
  </text>
</svg>
