<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrUp" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">子树的最大平均值：后序聚合 (sum, count) 自底向上</text>

  <!-- 树连线 -->
  <line x1="190" y1="78" x2="130" y2="128" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="210" y1="78" x2="270" y2="128" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="124" y1="158" x2="92" y2="208" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="266" y1="158" x2="238" y2="208" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 根 12 -->
  <circle cx="200" cy="64" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">12</text>
  <rect x="170" y="86" width="60" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="100" text-anchor="middle" font-size="10" fill="#335">sum=28,n=5</text>

  <!-- 节点 8 -->
  <circle cx="128" cy="144" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="128" y="148" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">8</text>
  <rect x="100" y="166" width="56" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="128" y="180" text-anchor="middle" font-size="10" fill="#335">sum=12,n=2</text>

  <!-- 节点 3 -->
  <circle cx="272" cy="144" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="272" y="148" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="244" y="166" width="56" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="272" y="180" text-anchor="middle" font-size="10" fill="#335">sum=4,n=2</text>

  <!-- 叶 4 -->
  <circle cx="88" cy="220" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="88" y="224" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="62" y="240" width="52" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="88" y="253" text-anchor="middle" font-size="9" fill="#335">sum=4,n=1</text>

  <!-- 叶 1 -->
  <circle cx="236" cy="220" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="236" y="224" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="210" y="240" width="52" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="236" y="253" text-anchor="middle" font-size="9" fill="#335">sum=1,n=1</text>

  <!-- 自底向上箭头 -->
  <path d="M 116 240 L 124 188" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="4,3" fill="none" marker-end="url(#arrUp)" filter="url(#rough2)"/>
  <path d="M 260 240 L 272 188" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="4,3" fill="none" marker-end="url(#arrUp)" filter="url(#rough2)"/>
  <path d="M 112 176 L 190 108" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="4,3" fill="none" marker-end="url(#arrUp)" filter="url(#rough2)"/>
  <path d="M 268 176 L 212 108" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="4,3" fill="none" marker-end="url(#arrUp)" filter="url(#rough2)"/>

  <!-- 右侧公式说明 -->
  <rect x="350" y="58" width="190" height="200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="445" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">后序聚合公式</text>
  <text x="366" y="110" font-size="11" fill="#555">对节点 node，递归左右子树</text>
  <text x="366" y="128" font-size="11" fill="#555">拿到 (lsum, lcnt) 与</text>
  <text x="366" y="146" font-size="11" fill="#555">(rsum, rcnt) 后合并：</text>
  <text x="366" y="174" font-size="12" fill="#b85450" font-weight="bold">sum = val + lsum + rsum</text>
  <text x="366" y="194" font-size="12" fill="#b85450" font-weight="bold">cnt = 1 + lcnt + rcnt</text>
  <text x="366" y="222" font-size="11" fill="#4a7a3a" font-weight="bold">avg = sum / cnt</text>
  <text x="366" y="240" font-size="11" fill="#555">用 avg 更新全局最大值</text>

  <!-- 底部说明 -->
  <rect x="30" y="290" width="510" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="285" y="314" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">核心观察：子树信息 = 左子树信息 + 右子树信息 + 自身</text>
  <text x="46" y="338" font-size="11" fill="#555">①「子树和」与「子树节点数」都具有最优子结构：父的值 = 左 + 右 + 自身，无需重复遍历</text>
  <text x="46" y="356" font-size="11" fill="#555">② 一次后序 DFS 即可对每个节点算出 avg，比较取最大 → 全程 O(n)</text>
</svg>
