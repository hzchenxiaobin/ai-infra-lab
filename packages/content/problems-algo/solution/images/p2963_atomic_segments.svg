<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">同值区间捆绑成原子段（nums = [2,1,2,3,4,4]）</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每个值的出现范围 [first, last] 必须被同一段整体覆盖</text>

  <!-- array cells -->
  <rect x="140" y="56" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="180" y="56" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="220" y="56" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="260" y="56" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="300" y="56" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="340" y="56" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>

  <text x="160" y="78" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="200" y="78" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="240" y="78" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="280" y="78" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="320" y="78" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="360" y="78" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>

  <text x="160" y="102" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="200" y="102" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="240" y="102" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="280" y="102" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="320" y="102" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">4</text>
  <text x="360" y="102" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">5</text>

  <!-- value spans, level 1 -->
  <path d="M 142 114 L 142 120 L 258 120 L 258 114" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="136" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">值 2：[0,2]</text>
  <path d="M 278 114 L 278 120 L 282 120 L 282 114" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="136" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">值 3：[3,3]</text>
  <path d="M 302 114 L 302 120 L 378 120 L 378 114" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="340" y="136" text-anchor="middle" font-size="10.5" fill="#a07818" filter="url(#rough2)">值 4：[4,5]</text>

  <!-- nested span of value 1 -->
  <path d="M 198 144 L 198 150 L 202 150 L 202 144" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="255" y="154" font-size="10" fill="#4a7a3a" filter="url(#rough2)">值 1：[1,1] 嵌套 → 被值 2 吞下</text>

  <!-- atomic segments -->
  <rect x="140" y="170" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <rect x="260" y="170" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <rect x="300" y="170" width="80" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="200" y="191" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">A [2,1,2]</text>
  <text x="280" y="191" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">B [3]</text>
  <text x="340" y="191" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">C [4,4]</text>

  <!-- boundaries: real gaps in red, array ends in gray -->
  <path d="M 140 166 L 140 206" stroke="#999" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 260 164 L 260 208" stroke="#b85450" stroke-width="2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <path d="M 300 164 L 300 208" stroke="#b85450" stroke-width="2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <path d="M 380 166 L 380 206" stroke="#999" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="260" y="222" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">缝隙1</text>
  <text x="300" y="222" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">缝隙2</text>
  <text x="128" y="222" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">头</text>
  <text x="392" y="222" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">尾</text>

  <!-- explanation box -->
  <rect x="26" y="238" width="468" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="42" y="260" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">为什么段内一刀都不能切？</text>
  <text x="42" y="280" font-size="10.5" fill="#333" filter="url(#rough2)">刀落在 [first[v], last[v]] 内部 ⇔ 值 v 被劈进两个子数组 → 直接违反好分割定义</text>
  <text x="42" y="298" font-size="10.5" fill="#333" filter="url(#rough2)">重叠的同值区间链式锁死（值 2 吞掉值 1）→ 合并出 A、B、C 三个不可分割的原子段</text>
  <text x="42" y="316" font-size="10.5" fill="#333" filter="url(#rough2)">相邻原子段的值集合两两不相交 → 缝隙处随便切都合法</text>

  <!-- bottom strip -->
  <rect x="46" y="340" width="428" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="260" y="364" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">m = 3 个原子段，数组首尾不算刀位</text>
  <text x="260" y="384" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">真正能下刀的只有中间的 m−1 = 2 个缝隙</text>
  <text x="260" y="402" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">好分割方案数由这 2 个缝隙的决定权完全决定 → 见下一张图</text>
</svg>
