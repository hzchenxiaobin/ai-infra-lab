<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 演算：[[1,2],[2,4],[4,8]] → 8</text>

  <!-- 排序后任务条 -->
  <text x="40" y="56" font-size="11.5" fill="#888">按 diff=minimum−actual 降序：</text>

  <rect x="40" y="64" width="120" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="100" y="84" text-anchor="middle" font-size="12" fill="#333">[4, 8]</text>
  <text x="100" y="102" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">diff=4</text>

  <rect x="200" y="64" width="120" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="84" text-anchor="middle" font-size="12" fill="#333">[2, 4]</text>
  <text x="260" y="102" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">diff=2</text>

  <rect x="360" y="64" width="120" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="420" y="84" text-anchor="middle" font-size="12" fill="#333">[1, 2]</text>
  <text x="420" y="102" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">diff=1</text>

  <!-- 表头 -->
  <rect x="30" y="128" width="460" height="30" fill="#446688" rx="4" filter="url(#rough2)" opacity="0.9"/>
  <text x="75" y="148" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">任务</text>
  <text x="175" y="148" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">spent(前)</text>
  <text x="290" y="148" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">m + spent</text>
  <text x="410" y="148" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">ans</text>

  <!-- 第1行 [4,8] -->
  <rect x="30" y="158" width="460" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="75" y="185" text-anchor="middle" font-size="12" fill="#333">[4, 8]</text>
  <text x="175" y="185" text-anchor="middle" font-size="12" fill="#555">0</text>
  <text x="290" y="185" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">8 + 0 = 8</text>
  <text x="410" y="185" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">8</text>

  <!-- 第2行 [2,4] -->
  <rect x="30" y="202" width="460" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="75" y="229" text-anchor="middle" font-size="12" fill="#333">[2, 4]</text>
  <text x="175" y="229" text-anchor="middle" font-size="12" fill="#555">4</text>
  <text x="290" y="229" text-anchor="middle" font-size="12.5" fill="#4a7a3a">4 + 4 = 8</text>
  <text x="410" y="229" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">8</text>

  <!-- 第3行 [1,2] -->
  <rect x="30" y="246" width="460" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="75" y="273" text-anchor="middle" font-size="12" fill="#333">[1, 2]</text>
  <text x="175" y="273" text-anchor="middle" font-size="12" fill="#555">6</text>
  <text x="290" y="273" text-anchor="middle" font-size="12.5" fill="#4a7a3a">2 + 6 = 8</text>
  <text x="410" y="273" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">8</text>

  <!-- 验证说明 -->
  <rect x="30" y="306" width="460" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="329" text-anchor="middle" font-size="11.5" fill="#444">模拟验证：E=8 → 8−4=4 → 4−2=2 → 2−1=1 ✓</text>

  <!-- 反例 -->
  <rect x="30" y="350" width="460" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="367" text-anchor="middle" font-size="11.5" fill="#444">若不排序按原序 [1,2],[2,4],[4,8]：</text>
  <text x="260" y="383" text-anchor="middle" font-size="11.5" fill="#b85450">max(2, 2+4=6, 3+8=11) = 11 &gt; 8，非最优</text>
</svg>
