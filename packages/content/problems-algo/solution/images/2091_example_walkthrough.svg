<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：nums = [2,10,7,5,4,1,8,6]</text>

  <text x="40" y="52" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">定极值：max=10 在 i=1，min=1 在 j=5，n=8</text>

  <rect x="100" y="64" width="40" height="36" fill="#fafafa" stroke="#aaa" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="87" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <rect x="140" y="64" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="87" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">10</text>
  <rect x="180" y="64" width="40" height="36" fill="#fafafa" stroke="#aaa" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="87" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">7</text>
  <rect x="220" y="64" width="40" height="36" fill="#fafafa" stroke="#aaa" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="87" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">5</text>
  <rect x="260" y="64" width="40" height="36" fill="#fafafa" stroke="#aaa" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="87" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4</text>
  <rect x="300" y="64" width="40" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="87" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="340" y="64" width="40" height="36" fill="#fafafa" stroke="#aaa" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="87" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">8</text>
  <rect x="380" y="64" width="40" height="36" fill="#fafafa" stroke="#aaa" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="400" y="87" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">6</text>
  <text x="160" y="112" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">i=1</text>
  <text x="320" y="112" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">j=5</text>

  <text x="40" y="140" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">策略① 全从左删到 j=5</text>
  <rect x="100" y="150" width="240" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="340" y="150" width="80" height="28" fill="#fafafa" stroke="#aaa" stroke-width="1.5" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <text x="470" y="168" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">j+1 = 6</text>

  <text x="40" y="196" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">策略② 全从右删到 i=1</text>
  <rect x="100" y="206" width="80" height="28" fill="#fafafa" stroke="#aaa" stroke-width="1.5" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <rect x="180" y="206" width="240" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="470" y="224" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">n-i = 7</text>

  <text x="40" y="252" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">策略③ 左删到 i + 右删到 j</text>
  <rect x="100" y="262" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="180" y="262" width="120" height="28" fill="#fafafa" stroke="#aaa" stroke-width="1.5" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <rect x="300" y="262" width="120" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="280" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">删0..1</text>
  <text x="240" y="280" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">留中间</text>
  <text x="360" y="280" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">删5..7</text>
  <text x="470" y="280" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">2+3 = 5</text>

  <rect x="100" y="312" width="360" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="338" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold" filter="url(#rough2)">answer = min(6, 7, 5) = 5 ✓</text>

  <text x="280" y="380" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">极值分居两端时策略①或②更优；</text>
  <text x="280" y="398" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">极值相邻或接近时策略③更优（左删小的 + 右删大的）</text>
  <text x="280" y="422" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">示例 3：n=1 时 i=j=0，三式均得 1，min=1 ✓</text>
</svg>
