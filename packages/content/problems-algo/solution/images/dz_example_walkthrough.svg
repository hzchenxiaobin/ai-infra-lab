<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：nums = [9, 6, 1, 6, 2]</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">两种谷位方案各自累加，取较小者 = 4</text>

  <!-- index ruler -->
  <g font-size="9" fill="#888">
    <text x="61" y="68" text-anchor="middle">i=0</text>
    <text x="113" y="68" text-anchor="middle">1</text>
    <text x="165" y="68" text-anchor="middle">2</text>
    <text x="217" y="68" text-anchor="middle">3</text>
    <text x="269" y="68" text-anchor="middle">4</text>
  </g>

  <!-- ===== Pattern A ===== -->
  <text x="30" y="96" font-size="11" fill="#446688" font-weight="bold">方案A（偶数峰，奇数谷）：压低 i=1, 3</text>

  <g font-size="13">
    <rect x="40" y="104" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="61" y="126" text-anchor="middle" fill="#446688" font-weight="bold">9</text>
    <rect x="92" y="104" width="42" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="113" y="126" text-anchor="middle" fill="#b85450" font-weight="bold">6</text>
    <rect x="144" y="104" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="165" y="126" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="196" y="104" width="42" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="217" y="126" text-anchor="middle" fill="#b85450" font-weight="bold">6</text>
    <rect x="248" y="104" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="269" y="126" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
  </g>

  <!-- computation A -->
  <g font-size="10" fill="#333">
    <text x="320" y="112">i=1：6 vs min(9, 1)=1</text>
    <text x="320" y="126" font-family="monospace" fill="#b85450">cost = 6 − 1 + 1 = 6</text>
    <text x="320" y="146">i=3：6 vs min(1, 2)=1</text>
    <text x="320" y="160" font-family="monospace" fill="#b85450">cost = 6 − 1 + 1 = 6</text>
  </g>
  <rect x="470" y="138" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="510" y="155" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">costA=12</text>

  <line x1="20" y1="180" x2="540" y2="180" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Pattern B ===== -->
  <text x="30" y="208" font-size="11" fill="#d6a040" font-weight="bold">方案B（奇数峰，偶数谷）：压低 i=0, 2, 4</text>

  <g font-size="13">
    <rect x="40" y="216" width="42" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="61" y="238" text-anchor="middle" fill="#b85450" font-weight="bold">9</text>
    <rect x="92" y="216" width="42" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="113" y="238" text-anchor="middle" fill="#d6a040" font-weight="bold">6</text>
    <rect x="144" y="216" width="42" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="165" y="238" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="196" y="216" width="42" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="217" y="238" text-anchor="middle" fill="#d6a040" font-weight="bold">6</text>
    <rect x="248" y="216" width="42" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="269" y="238" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
  </g>

  <!-- computation B -->
  <g font-size="10" fill="#333">
    <text x="320" y="224">i=0：9 vs min(右)=6</text>
    <text x="320" y="238" font-family="monospace" fill="#b85450">cost = 9 − 6 + 1 = 4</text>
    <text x="320" y="258">i=2：1 vs min(6, 6)=6</text>
    <text x="320" y="272" font-family="monospace" fill="#4a7a3a">1 &lt; 6 → cost = 0</text>
    <text x="320" y="292">i=4：2 vs min(左)=6</text>
    <text x="320" y="306" font-family="monospace" fill="#4a7a3a">2 &lt; 6 → cost = 0</text>
  </g>
  <rect x="470" y="284" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="510" y="301" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">costB=4</text>

  <line x1="20" y1="332" x2="540" y2="332" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== compare ===== -->
  <text x="30" y="360" font-size="11" fill="#444" font-weight="bold">取较小者：min(costA, costB) = min(12, 4)</text>

  <rect x="170" y="376" width="100" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="220" y="392" text-anchor="middle" font-size="10" fill="#446688">方案A</text>
  <text x="220" y="410" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">12</text>

  <text x="300" y="402" text-anchor="middle" font-size="16" fill="#888" font-weight="bold">vs</text>

  <rect x="330" y="376" width="100" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="380" y="392" text-anchor="middle" font-size="10" fill="#d6a040">方案B</text>
  <text x="380" y="410" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">4 ✓</text>

  <!-- final answer -->
  <rect x="120" y="442" width="320" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="468" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">答案 = 4（选方案B，压低 9→5）</text>
</svg>
