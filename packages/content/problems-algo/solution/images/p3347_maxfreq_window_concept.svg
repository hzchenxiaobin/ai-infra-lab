<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">固定目标值 t：一个 min 公式算出最高频率</text>
  <text x="260" y="42" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">freq(t) = min( reach(t), eq(t) + numOperations )</text>
  <text x="260" y="63" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">以 nums = [5, 11, 16, 20, 20, 28]，目标 t = 20，k = 5 为例：</text>

  <!-- 窗口带 [t-k, t+k] = [15, 25] -->
  <rect x="227" y="78" width="175" height="112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <text x="314" y="94" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">窗口 [t−k, t+k] = [15, 25]</text>

  <!-- t 目标虚线 -->
  <path d="M 315 100 L 315 196" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="315" y="212" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">t = 20</text>

  <!-- 元素圆圈 -->
  <circle cx="52" cy="160" r="14" fill="#eeeeee" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="164" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">5</text>
  <circle cx="157" cy="160" r="14" fill="#eeeeee" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="157" y="164" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">11</text>
  <circle cx="245" cy="160" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="245" y="164" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">16</text>
  <circle cx="299" cy="160" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="299" y="164" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">20</text>
  <circle cx="331" cy="160" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="331" y="164" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">20</text>
  <circle cx="455" cy="160" r="14" fill="#eeeeee" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="455" y="164" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">28</text>

  <!-- 数轴 -->
  <path d="M 35 190 L 485 190" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 52 190 L 52 196 M 157 190 L 157 196 M 245 190 L 245 196 M 299 190 L 299 196 M 331 190 L 331 196 M 455 190 L 455 196" fill="none" stroke="#333" stroke-width="1" filter="url(#rough2)"/>
  <text x="34" y="256" font-size="0" fill="#333"> </text>

  <!-- 三类元素说明 -->
  <rect x="30" y="232" width="460" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="252" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">eq(t) = 2：两个 20 现成 → 白嫖，一个操作都不花</text>

  <rect x="30" y="268" width="460" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="288" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">窗口内非 eq：16 → +4 → 20，每个只花 1 次操作（预算封顶）</text>

  <rect x="30" y="304" width="460" height="30" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="324" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">窗口外 {5, 11, 28}：位移超过 k，再多预算也够不着（reach 封顶）</text>

  <rect x="30" y="344" width="460" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="367" text-anchor="middle" font-size="11.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">freq(20) = min(reach=3, eq+ops=2+1) = 3 → [5, 11, 20, 20, 20, 28]</text>
</svg>
