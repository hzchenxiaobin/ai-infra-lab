<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">执行流程：FROM → GROUP BY → COUNT → ORDER BY → LIMIT 1</text>

  <!-- Step 1: FROM -->
  <rect x="60" y="50" width="440" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="80" y="72" font-size="11" fill="#446688" font-weight="bold">① FROM Orders</text>
  <text x="80" y="88" font-size="9.5" fill="#666">读取全部订单行（order_number, customer_number）</text>
  <text x="490" y="76" text-anchor="end" font-size="9" fill="#888">4 行</text>

  <path d="M280 96 L280 116" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 2: GROUP BY -->
  <rect x="60" y="118" width="440" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="80" y="140" font-size="11" fill="#4a7a3a" font-weight="bold">② GROUP BY customer_number</text>
  <text x="80" y="156" font-size="9.5" fill="#666">按客户编号分桶：同 customer_number 的行进同一桶</text>
  <text x="490" y="144" text-anchor="end" font-size="9" fill="#888">3 桶 {1, 2, 3}</text>

  <path d="M280 164 L280 184" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Step 3: COUNT -->
  <rect x="60" y="186" width="440" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="80" y="208" font-size="11" fill="#d6a040" font-weight="bold">③ COUNT(*)（SELECT 阶段聚合）</text>
  <text x="80" y="224" font-size="9.5" fill="#666">每桶数行数 = 该客户订单数；同时输出 customer_number</text>
  <text x="490" y="212" text-anchor="end" font-size="9" fill="#888">(1,1)(2,1)(3,2)</text>

  <path d="M280 232 L280 252" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Step 4: ORDER BY -->
  <rect x="60" y="254" width="440" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="80" y="276" font-size="11" fill="#b85450" font-weight="bold">④ ORDER BY COUNT(*) DESC</text>
  <text x="80" y="292" font-size="9.5" fill="#666">按订单数降序排列：3(cnt=2) → 1(cnt=1) → 2(cnt=1)</text>
  <text x="490" y="280" text-anchor="end" font-size="9" fill="#888">首行 = 3</text>

  <path d="M280 300 L280 320" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Step 5: LIMIT -->
  <rect x="60" y="322" width="440" height="44" fill="#fff8e1" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="80" y="344" font-size="11" fill="#b85450" font-weight="bold">⑤ LIMIT 1 → SELECT customer_number</text>
  <text x="80" y="360" font-size="9.5" fill="#666">只取首行，输出该行的 customer_number</text>
  <text x="490" y="348" text-anchor="end" font-size="9" fill="#888">→ 3</text>

  <!-- Result -->
  <path d="M280 368 L280 388" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="210" y="390" width="140" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="408" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">customer_number = 3</text>
</svg>
