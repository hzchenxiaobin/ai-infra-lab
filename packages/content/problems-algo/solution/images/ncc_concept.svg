<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：边列表逐条 union，根的个数 = 连通分量数</text>

  <!-- edges list -->
  <text x="20" y="58" font-size="11" fill="#888">edges：</text>
  <rect x="64" y="44" width="74" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="101" y="60" text-anchor="middle" font-size="11" fill="#333">[0, 1]</text>
  <rect x="142" y="44" width="74" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="179" y="60" text-anchor="middle" font-size="11" fill="#333">[1, 2]</text>
  <rect x="220" y="44" width="74" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="257" y="60" text-anchor="middle" font-size="11" fill="#333">[3, 4]</text>
  <text x="304" y="60" font-size="10.5" fill="#888">n = 5 个节点</text>

  <!-- graph nodes -->
  <text x="270" y="100" text-anchor="middle" font-size="11.5" fill="#888">无向图（蓝色分量 / 绿色分量）</text>

  <!-- component 1: 0-1-2 -->
  <circle cx="150" cy="150" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="155" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <circle cx="230" cy="150" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="155" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <circle cx="310" cy="150" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="155" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <line x1="168" y1="150" x2="212" y2="150" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <line x1="248" y1="150" x2="292" y2="150" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>

  <!-- component 2: 3-4 -->
  <circle cx="380" cy="150" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="155" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <circle cx="460" cy="150" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="460" y="155" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <line x1="398" y1="150" x2="442" y2="150" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>

  <!-- parent array -->
  <text x="20" y="206" font-size="11" fill="#888">parent[]：</text>
  <rect x="84" y="192" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="101" y="209" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="118" y="192" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="209" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="152" y="192" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="169" y="209" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="186" y="192" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="203" y="209" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="220" y="192" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="237" y="209" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="101" y="232" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="135" y="232" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="169" y="232" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="203" y="232" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="237" y="232" text-anchor="middle" font-size="9" fill="#aaa">4</text>
  <text x="270" y="232" font-size="10" fill="#446688">根：0、3 → 2 个分量</text>

  <!-- key idea box -->
  <rect x="30" y="250" width="480" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="272" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">每条边 (u,v) → union(u, v)：不同根则合并，count−−</text>
  <text x="270" y="290" text-anchor="middle" font-size="11.5" fill="#555">初始 count = n，逐边减一 → 最终 count = 连通分量数</text>

  <!-- result -->
  <rect x="30" y="312" width="480" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="332" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">count = 5 − 3（成功合并 3 次）= 2</text>

  <rect x="30" y="348" width="480" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="270" y="364" text-anchor="middle" font-size="10.5" fill="#444">边列表是并查集最自然的输入，比邻接矩阵更省空间</text>
</svg>
