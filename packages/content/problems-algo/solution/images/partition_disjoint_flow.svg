<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一次扫描维护 leftMax / curMax</text>

  <!-- Start node -->
  <ellipse cx="270" cy="56" rx="150" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="60" text-anchor="middle" font-size="12" fill="#333">开始: leftMax = curMax = nums[0], boundary = 0</text>

  <!-- arrow down -->
  <path d="M 270 76 L 270 96" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 1: i < n ? -->
  <polygon points="270,100 376,134 270,168 164,134" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="130" text-anchor="middle" font-size="12" fill="#333">i &lt; n ?</text>
  <text x="270" y="146" text-anchor="middle" font-size="10" fill="#666">(还有元素未扫)</text>

  <!-- No -> end -->
  <path d="M 376 134 L 420 134" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="398" y="126" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="476" cy="134" rx="50" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="476" y="138" text-anchor="middle" font-size="11" fill="#333">返回 boundary+1</text>

  <!-- Yes -> down -->
  <path d="M 270 168 L 270 188" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="184" font-size="11" fill="#82b366">是</text>

  <!-- Update curMax box -->
  <rect x="150" y="190" width="240" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="212" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">curMax = max(curMax, nums[i])</text>

  <!-- arrow down -->
  <path d="M 270 224 L 270 244" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 2: nums[i] < leftMax ? -->
  <polygon points="270,248 400,284 270,320 140,284" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="280" text-anchor="middle" font-size="12" fill="#333">nums[i] &lt; leftMax ?</text>
  <text x="270" y="296" text-anchor="middle" font-size="10" fill="#666">(不能放入 right)</text>

  <!-- Yes -> extend boundary -->
  <path d="M 270 320 L 270 340" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="336" font-size="11" fill="#82b366">是</text>
  <rect x="130" y="342" width="280" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="361" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">boundary = i</text>
  <text x="270" y="378" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">leftMax = curMax</text>

  <!-- No -> skip (do nothing) -->
  <path d="M 400 284 L 436 284" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="418" y="276" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <rect x="436" y="266" width="84" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="478" y="289" text-anchor="middle" font-size="11" fill="#888">（不操作）</text>
  <!-- No path down to merge -->
  <path d="M 478 302 L 478 404" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>

  <!-- i++ box -->
  <path d="M 270 386 L 270 404" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="210" y="404" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="426" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i++</text>

  <!-- No branch merge into i++ -->
  <path d="M 478 404 L 330 404" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>

  <!-- loop-back: from i++ bottom -> left -> up -> back to diamond 1 -->
  <path d="M 270 438 L 270 452 L 50 452 L 50 134 L 164 134" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="50" y="290" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 50 290)">继续下一元素</text>

  <!-- summary note -->
  <text x="270" y="462" text-anchor="middle" font-size="11" fill="#888">仅遍历一次 → O(n)；只用三个变量 → O(1) 空间</text>
</svg>
