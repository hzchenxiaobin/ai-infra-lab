<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [1, 0, 1, 1, 0, 1]</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">每步显示 prev / cur / prev+cur+1 / ans 的变化</text>

  <!-- Column x positions (left edges):
       step=30 w=40 | num=70 w=40 | action=110 w=160 | prev=270 w=60 | cur=330 w=60 | p+c+1=390 w=80 | ans=470 w=60
       table right edge = 530 -->

  <!-- table outer frame -->
  <rect x="30" y="56" width="500" height="256" fill="none" stroke="#888" stroke-width="1.4" rx="6" filter="url(#rough2)"/>

  <!-- header row -->
  <rect x="30" y="56" width="500" height="28" fill="#f0f0f0" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <g font-size="11.5" fill="#555" font-weight="bold" text-anchor="middle">
    <text x="50" y="74">步</text>
    <text x="90" y="74">num</text>
    <text x="190" y="74">动作</text>
    <text x="300" y="74">prev</text>
    <text x="360" y="74">cur</text>
    <text x="430" y="74">prev+cur+1</text>
    <text x="500" y="74">ans</text>
  </g>
  <!-- column separators -->
  <g stroke="#bbb" stroke-width="1" filter="url(#rough2)">
    <line x1="70" y1="56" x2="70" y2="312"/>
    <line x1="110" y1="56" x2="110" y2="312"/>
    <line x1="270" y1="56" x2="270" y2="312"/>
    <line x1="330" y1="56" x2="330" y2="312"/>
    <line x1="390" y1="56" x2="390" y2="312"/>
    <line x1="470" y1="56" x2="470" y2="312"/>
  </g>

  <!-- row helper: rowTop(i) = 84 + i*38, text y = rowTop+24 -->
  <!-- row 0: num=1, cur++ -->
  <g font-size="11.5" fill="#333" text-anchor="middle">
    <text x="50" y="108" fill="#4a7a3a" font-weight="bold">0</text>
    <text x="90" y="108" fill="#446688" font-weight="bold">1</text>
    <text x="190" y="108" fill="#4a7a3a">cur += 1</text>
    <text x="300" y="108">0</text>
    <text x="360" y="108" fill="#446688" font-weight="bold">1</text>
    <text x="430" y="108">0 + 1 + 1</text>
    <text x="500" y="108" fill="#d6a040" font-weight="bold">2</text>
  </g>
  <line x1="30" y1="122" x2="530" y2="122" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 1: num=0, prev=cur,cur=0 -->
  <g font-size="11.5" fill="#333" text-anchor="middle">
    <text x="50" y="146" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="90" y="146" fill="#d6a040" font-weight="bold">0</text>
    <text x="190" y="146" fill="#d6a040">prev←cur, cur←0</text>
    <text x="300" y="146" fill="#446688" font-weight="bold">1</text>
    <text x="360" y="146">0</text>
    <text x="430" y="146">1 + 0 + 1</text>
    <text x="500" y="146" fill="#d6a040" font-weight="bold">2</text>
  </g>
  <line x1="30" y1="160" x2="530" y2="160" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 2: num=1, cur++ -->
  <g font-size="11.5" fill="#333" text-anchor="middle">
    <text x="50" y="184" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="90" y="184" fill="#446688" font-weight="bold">1</text>
    <text x="190" y="184" fill="#4a7a3a">cur += 1</text>
    <text x="300" y="184">1</text>
    <text x="360" y="184" fill="#446688" font-weight="bold">1</text>
    <text x="430" y="184">1 + 1 + 1</text>
    <text x="500" y="184" fill="#d6a040" font-weight="bold">3</text>
  </g>
  <line x1="30" y1="198" x2="530" y2="198" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 3: num=1, cur++ -> ans=4 (highlight) -->
  <rect x="30" y="198" width="500" height="38" fill="#e6f4ea" stroke="none" filter="url(#rough2)" opacity="0.55"/>
  <g font-size="11.5" fill="#333" text-anchor="middle">
    <text x="50" y="222" fill="#4a7a3a" font-weight="bold">3</text>
    <text x="90" y="222" fill="#446688" font-weight="bold">1</text>
    <text x="190" y="222" fill="#4a7a3a">cur += 1</text>
    <text x="300" y="222">1</text>
    <text x="360" y="222" fill="#446688" font-weight="bold">2</text>
    <text x="430" y="222" fill="#4a7a3a" font-weight="bold">1 + 2 + 1</text>
    <text x="500" y="222" fill="#b85450" font-weight="bold">4</text>
  </g>
  <line x1="30" y1="236" x2="530" y2="236" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 4: num=0, prev=cur,cur=0 -->
  <g font-size="11.5" fill="#333" text-anchor="middle">
    <text x="50" y="260" fill="#4a7a3a" font-weight="bold">4</text>
    <text x="90" y="260" fill="#d6a040" font-weight="bold">0</text>
    <text x="190" y="260" fill="#d6a040">prev←cur, cur←0</text>
    <text x="300" y="260" fill="#446688" font-weight="bold">2</text>
    <text x="360" y="260">0</text>
    <text x="430" y="260">2 + 0 + 1</text>
    <text x="500" y="260" fill="#d6a040" font-weight="bold">4</text>
  </g>
  <line x1="30" y1="274" x2="530" y2="274" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 5: num=1, cur++ -> ans=4 (tie) -->
  <rect x="30" y="274" width="500" height="38" fill="#e6f4ea" stroke="none" filter="url(#rough2)" opacity="0.55"/>
  <g font-size="11.5" fill="#333" text-anchor="middle">
    <text x="50" y="298" fill="#4a7a3a" font-weight="bold">5</text>
    <text x="90" y="298" fill="#446688" font-weight="bold">1</text>
    <text x="190" y="298" fill="#4a7a3a">cur += 1</text>
    <text x="300" y="298">2</text>
    <text x="360" y="298" fill="#446688" font-weight="bold">1</text>
    <text x="430" y="298" fill="#4a7a3a" font-weight="bold">2 + 1 + 1</text>
    <text x="500" y="298" fill="#b85450" font-weight="bold">4</text>
  </g>

  <!-- conclusion -->
  <rect x="30" y="330" width="500" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="354" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">峰值出现在第 3 步与第 5 步，均得 4</text>
  <text x="280" y="374" text-anchor="middle" font-size="11.5" fill="#446688">第 3 步：翻下标 1 的 0 → [1,1,1,1,0,1]，前 4 个连成段</text>
  <text x="280" y="392" text-anchor="middle" font-size="11.5" fill="#446688">第 5 步：翻下标 4 的 0 → [1,0,1,1,1,1]，后 4 个连成段</text>
  <text x="280" y="410" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">min(ans, n) = min(4, 6) = 4 ✓</text>
</svg>
