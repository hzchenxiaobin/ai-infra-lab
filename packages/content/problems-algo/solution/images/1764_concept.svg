<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：贪心最早匹配——指针 i 单调前进，每个 group 找最早出现处</text>

  <!-- ===== groups section ===== -->
  <text x="320" y="52" text-anchor="middle" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">groups（按顺序逐个匹配）</text>

  <!-- Group 0 -->
  <text x="42" y="82" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">g[0]</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="80" y="66" width="52" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="106" y="86" fill="#333" font-weight="bold">1</text>
    <rect x="132" y="66" width="52" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="158" y="86" fill="#333" font-weight="bold">−1</text>
    <rect x="184" y="66" width="52" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="210" y="86" fill="#333" font-weight="bold">−1</text>
  </g>
  <text x="260" y="86" font-size="10" fill="#4a7a3a" filter="url(#rough2)">← 在 nums 中找此段</text>

  <!-- Group 1 -->
  <text x="42" y="128" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">g[1]</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="80" y="112" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="106" y="132" fill="#333" font-weight="bold">3</text>
    <rect x="132" y="112" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="158" y="132" fill="#333" font-weight="bold">−2</text>
    <rect x="184" y="112" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="210" y="132" fill="#333" font-weight="bold">0</text>
  </g>
  <text x="260" y="132" font-size="10" fill="#446688" filter="url(#rough2)">← 接着找此段</text>

  <!-- separator -->
  <path d="M 40 158 L 600 158" stroke="#ddd" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== nums section ===== -->
  <text x="320" y="174" text-anchor="middle" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">nums（指针 i 从左到右扫描）</text>

  <!-- index labels -->
  <g filter="url(#rough2)" font-size="9" fill="#aaa" text-anchor="middle">
    <text x="106" y="196">0</text>
    <text x="158" y="196">1</text>
    <text x="210" y="196">2</text>
    <text x="262" y="196">3</text>
    <text x="314" y="196">4</text>
    <text x="366" y="196">5</text>
    <text x="418" y="196">6</text>
    <text x="470" y="196">7</text>
    <text x="522" y="196">8</text>
  </g>

  <!-- nums cells: skipped(0-2) orange, g0 match(3-5) green, g1 match(6-8) blue -->
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <!-- skipped indices 0-2 -->
    <rect x="80" y="202" width="52" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="106" y="223" fill="#888">1</text>
    <rect x="132" y="202" width="52" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="158" y="223" fill="#888">−1</text>
    <rect x="184" y="202" width="52" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="210" y="223" fill="#888">0</text>
    <!-- g0 match indices 3-5 -->
    <rect x="236" y="202" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="262" y="223" fill="#333" font-weight="bold">1</text>
    <rect x="288" y="202" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="314" y="223" fill="#333" font-weight="bold">−1</text>
    <rect x="340" y="202" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="366" y="223" fill="#333" font-weight="bold">−1</text>
    <!-- g1 match indices 6-8 -->
    <rect x="392" y="202" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4"/>
    <text x="418" y="223" fill="#333" font-weight="bold">3</text>
    <rect x="444" y="202" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4"/>
    <text x="470" y="223" fill="#333" font-weight="bold">−2</text>
    <rect x="496" y="202" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4"/>
    <text x="522" y="223" fill="#333" font-weight="bold">0</text>
  </g>

  <!-- skip / match annotations below cells -->
  <g filter="url(#rough2)" font-size="9.5" text-anchor="middle">
    <text x="158" y="252" fill="#d6a040" font-weight="bold">跳过</text>
    <text x="314" y="252" fill="#4a7a3a" font-weight="bold">✓ g[0] 命中</text>
    <text x="470" y="252" fill="#446688" font-weight="bold">✓ g[1] 命中</text>
  </g>

  <!-- pointer trajectory -->
  <text x="42" y="288" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">指针 i</text>
  <!-- i=0 -->
  <rect x="86" y="278" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="106" y="293" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">i=0</text>
  <path d="M 126 289 L 244 289" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <text x="185" y="284" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">扫描…</text>
  <!-- i=3 -->
  <rect x="238" y="278" width="48" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="262" y="293" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">i=3</text>
  <path d="M 286 289 L 394 289" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="340" y="284" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">+len(g0)</text>
  <!-- i=6 -->
  <rect x="394" y="278" width="48" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="418" y="293" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">i=6</text>
  <path d="M 442 289 L 548 289" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="495" y="284" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">+len(g1)</text>
  <!-- i=9 done -->
  <ellipse cx="568" cy="289" rx="24" ry="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="568" y="293" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">i=9 ✓</text>

  <!-- key insight box -->
  <rect x="40" y="320" width="560" height="124" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="320" y="344" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">为什么贪心最早匹配正确？</text>
  <text x="60" y="368" font-size="11" fill="#555" filter="url(#rough2)">① 指针 i 单调递增——已匹配段不可回退，后续 group 只能在 i 之后搜索</text>
  <text x="60" y="388" font-size="11" fill="#555" filter="url(#rough2)">② 匹配越早，留给剩余 group 的 nums 后缀越长——可用空间是「超集」</text>
  <text x="60" y="408" font-size="11" fill="#555" filter="url(#rough2)">③ 交换论证：若延迟匹配 g[k] 到 j' &gt; j 能成功，则在 j 处匹配同样成功</text>
  <text x="60" y="428" font-size="10.5" fill="#888" filter="url(#rough2)">   （j' 的解中 g[k+1..] 都在 j'+len 之后，必然也在 j+len 之后 → j 的解集 ⊇ j' 的解集）</text>
</svg>
