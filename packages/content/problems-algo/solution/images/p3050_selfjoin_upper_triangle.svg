<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：`&lt;` 连接 = 只取字典序上三角</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">行 = t1，列 = t2（配料名均按字典序 C &lt; E &lt; P &lt; S 排列）</text>

  <!-- column labels -->
  <text x="107" y="60" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">t2=C</text>
  <text x="165" y="60" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">t2=E</text>
  <text x="223" y="60" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">t2=P</text>
  <text x="281" y="60" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">t2=S</text>

  <!-- row labels -->
  <text x="72" y="87" text-anchor="end" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">t1=C</text>
  <text x="72" y="125" text-anchor="end" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">t1=E</text>
  <text x="72" y="163" text-anchor="end" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">t1=P</text>
  <text x="72" y="201" text-anchor="end" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">t1=S</text>

  <!-- row 1: t1=C (kept: E,P,S) -->
  <rect x="78" y="64" width="58" height="38" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="107" y="88" text-anchor="middle" font-size="11" fill="#aaa" font-weight="bold" filter="url(#rough2)">同料</text>
  <rect x="136" y="64" width="58" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="165" y="88" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0.95</text>
  <rect x="194" y="64" width="58" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="223" y="88" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1.05</text>
  <rect x="252" y="64" width="58" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="281" y="88" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1.25</text>

  <!-- row 2: t1=E -->
  <rect x="78" y="102" width="58" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="107" y="126" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">重复</text>
  <rect x="136" y="102" width="58" height="38" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="165" y="126" text-anchor="middle" font-size="11" fill="#aaa" font-weight="bold" filter="url(#rough2)">同料</text>
  <rect x="194" y="102" width="58" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="223" y="126" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0.90</text>
  <rect x="252" y="102" width="58" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="281" y="126" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1.10</text>

  <!-- row 3: t1=P -->
  <rect x="78" y="140" width="58" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="107" y="164" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">重复</text>
  <rect x="136" y="140" width="58" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="165" y="164" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">重复</text>
  <rect x="194" y="140" width="58" height="38" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="223" y="164" text-anchor="middle" font-size="11" fill="#aaa" font-weight="bold" filter="url(#rough2)">同料</text>
  <rect x="252" y="140" width="58" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="281" y="164" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1.20</text>

  <!-- row 4: t1=S -->
  <rect x="78" y="178" width="58" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="107" y="202" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">重复</text>
  <rect x="136" y="178" width="58" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="165" y="202" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">重复</text>
  <rect x="194" y="178" width="58" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="223" y="202" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">重复</text>
  <rect x="252" y="178" width="58" height="38" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="281" y="202" text-anchor="middle" font-size="11" fill="#aaa" font-weight="bold" filter="url(#rough2)">同料</text>

  <!-- legend under matrix -->
  <text x="40" y="240" font-size="10.5" fill="#555" filter="url(#rough2)">C = Chicken(0.55)，E = Extra Cheese(0.40)</text>
  <text x="40" y="258" font-size="10.5" fill="#555" filter="url(#rough2)">P = Pepperoni(0.50)，S = Sausage(0.70)</text>

  <!-- right panel -->
  <rect x="336" y="64" width="170" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="421" y="84" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">上三角 t1 &lt; t2 ✓</text>
  <text x="421" y="102" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">保留 6 对 = C(4,2)</text>

  <rect x="336" y="124" width="170" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="421" y="144" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">下三角 t1 &gt; t2 ✗</text>
  <text x="421" y="162" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">镜像重复，被 &lt; 过滤</text>

  <rect x="336" y="184" width="170" height="48" fill="#eeeeee" stroke="#999" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="421" y="204" text-anchor="middle" font-size="11.5" fill="#777" font-weight="bold" filter="url(#rough2)">对角线 t1 = t2 ✗</text>
  <text x="421" y="222" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">同料自配，&lt; 不含等号</text>

  <path d="M 330 108 L 312 96" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 330 168 L 108 152" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 4" fill="none" filter="url(#rough2)"/>

  <!-- bottom banner -->
  <rect x="30" y="284" width="476" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="268" y="306" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">一个 `&lt;` 同时完成三件事：去重（每对恰一行）· 排自身（A&lt;A 恒假）· 定序（topping1 在前）</text>
  <text x="268" y="326" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">输出行数 = C(n,2) = n(n−1)/2，与最终结果零冗余</text>
</svg>
