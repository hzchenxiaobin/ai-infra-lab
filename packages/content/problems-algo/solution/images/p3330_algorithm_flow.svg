<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：一次遍历，数相邻相同对</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">ans 先置 1（不犯错的那一种）；每遇到一对 word[i] == word[i−1]，就多一种「该段少按」的方案</text>

  <!-- 开始 -->
  <rect x="185" y="54" width="150" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="15" filter="url(#rough2)"/>
  <text x="260" y="74" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">开始</text>
  <path d="M 260 84 L 260 96" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ans = 1 -->
  <rect x="175" y="98" width="170" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="120" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">ans = 1  （t = word）</text>
  <path d="M 260 132 L 260 144" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i = 1 -->
  <rect x="185" y="146" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="166" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">i = 1</text>
  <path d="M 260 176 L 260 188" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形判定 -->
  <polygon points="260,190 370,232 260,274 150,232" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="228" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">word[i] == word[i−1] ？</text>
  <text x="260" y="244" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">（处在某个 run 的内部）</text>

  <!-- 是分支 -->
  <path d="M 370 232 L 400 232" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="382" y="224" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="404" y="215" width="96" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="452" y="237" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">ans ++</text>
  <path d="M 452 249 L 452 292 L 260 292" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 否分支 -->
  <path d="M 260 274 L 260 290" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="286" font-size="10" fill="#999" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- i++ -->
  <rect x="185" y="294" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="314" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">i ++</text>

  <!-- 回环 -->
  <path d="M 185 309 L 96 309 L 96 232 L 146 232" fill="none" stroke="#446688" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <polygon points="96,309 74,302 74,316" fill="#446688" filter="url(#rough2)"/>
  <text x="62" y="268" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">i &lt; n</text>

  <!-- 返回 -->
  <path d="M 260 324 L 260 340" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="336" font-size="9.5" fill="#999" filter="url(#rough2)">i 扫完</text>
  <rect x="165" y="342" width="190" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="15" filter="url(#rough2)"/>
  <text x="260" y="364" text-anchor="middle" font-size="11.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <rect x="20" y="356" width="120" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)" transform="translate(-6,0)"/>
  <text x="54" y="372" font-size="9" fill="#333" filter="url(#rough2)">💡 O(n) 时间</text>
  <text x="54" y="384" font-size="9" fill="#333" filter="url(#rough2)">O(1) 空间，不建 run 表</text>
</svg>
