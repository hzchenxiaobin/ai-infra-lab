<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="640" height="360" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">示例演算：robot=[0,4,6], factory=[[2,2],[6,2]]</text>

  <!-- context line: positions -->
  <line x1="40" y1="76" x2="600" y2="76" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <!-- robots (triangles above): 0->60, 4->180, 6->260 ; scale ~50/unit, offset 60 -->
    <polygon points="60,68 52,56 68,56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <polygon points="180,68 172,56 188,56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <polygon points="260,68 252,56 268,56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <!-- factories (squares below): 2->100, 6->260 -->
    <rect x="92" y="80" width="16" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="2"/>
    <rect x="252" y="80" width="16" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="2"/>
  </g>
  <g font-size="11" filter="url(#rough2)">
    <text x="60" y="50" text-anchor="middle" fill="#446688">r0=0</text>
    <text x="180" y="50" text-anchor="middle" fill="#446688">r1=4</text>
    <text x="260" y="50" text-anchor="middle" fill="#446688">r2=6</text>
    <text x="100" y="112" text-anchor="middle" fill="#d6a040">F0(q=2,lim2)</text>
    <text x="260" y="112" text-anchor="middle" fill="#d6a040">F1(q=6,lim2)</text>
  </g>

  <!-- state flow: 5 boxes -->
  <!-- box geometry: width 104, height 64, y=160 -->
  <g filter="url(#rough2)">
    <rect x="20" y="160" width="104" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <rect x="168" y="160" width="104" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <rect x="316" y="160" width="104" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
    <rect x="408" y="160" width="104" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <rect x="516" y="160" width="104" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8"/>
  </g>
  <g font-size="12" fill="#333" filter="url(#rough2)">
    <text x="72" y="184" text-anchor="middle">(0,0,0)</text>
    <text x="72" y="206" text-anchor="middle" font-size="14" fill="#3a5a2a">= 0</text>
    <text x="72" y="222" text-anchor="middle" font-size="10" fill="#888">起点</text>

    <text x="220" y="184" text-anchor="middle">(1,0,1)</text>
    <text x="220" y="206" text-anchor="middle" font-size="14" fill="#3a5a2a">= 2</text>
    <text x="220" y="222" text-anchor="middle" font-size="10" fill="#888">r0→F0</text>

    <text x="368" y="184" text-anchor="middle">(2,0,2)</text>
    <text x="368" y="206" text-anchor="middle" font-size="14" fill="#b85450">= 4</text>
    <text x="368" y="222" text-anchor="middle" font-size="10" fill="#888">r1→F0满</text>

    <text x="460" y="184" text-anchor="middle">(2,1,0)</text>
    <text x="460" y="206" text-anchor="middle" font-size="14" fill="#446688">= 4</text>
    <text x="460" y="222" text-anchor="middle" font-size="10" fill="#888">关F0,开F1</text>

    <text x="568" y="184" text-anchor="middle">(3,1,1)</text>
    <text x="568" y="206" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold">= 4 ✓</text>
    <text x="568" y="222" text-anchor="middle" font-size="10" fill="#888">答案</text>
  </g>

  <!-- arrows between boxes -->
  <path d="M124 192 L166 192" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M272 192 L314 192" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M420 192 L406 192" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M512 192 L514 192" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- arrow labels -->
  <g font-size="10" fill="#7a5a20" filter="url(#rough2)">
    <text x="145" y="184" text-anchor="middle">+|0−2|=2</text>
    <text x="293" y="184" text-anchor="middle">+|4−2|=2</text>
    <text x="413" y="184" text-anchor="middle" fill="#446688">+0 关</text>
    <text x="513" y="184" text-anchor="middle">+|6−6|=0</text>
  </g>

  <!-- bottom note -->
  <rect x="40" y="252" width="560" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <g font-size="12" fill="#7a5a20" filter="url(#rough2)">
    <text x="320" y="276" text-anchor="middle">最优路径：F0 修 r0、r1（用满 2 名额），F1 修 r2</text>
    <text x="320" y="296" text-anchor="middle">距离 = |0−2| + |4−2| + |6−6| = 2 + 2 + 0 = 4</text>
    <text x="320" y="316" text-anchor="middle" fill="#3a5a2a">关键：r0、r1 都就近去 F0（更近的工厂先填满）</text>
    <text x="320" y="334" text-anchor="middle" fill="#888">DP 在「分配」与「关闭工厂」两条转移间取最优，自然得到不交叉匹配</text>
  </g>
</svg>
