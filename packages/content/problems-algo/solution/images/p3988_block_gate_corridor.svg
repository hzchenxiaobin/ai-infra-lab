<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：k 条路积木 + 唯一的「门」+ 强制走廊</text>
  <text x="260" y="38" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">总路径数 = 积木内路径数 × 走廊走法数 —— 图示 m=5, n=6, k=3 的构造</text>

  <!-- 起 / 终 外部标注 -->
  <text x="62" y="66" text-anchor="middle" font-size="9" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">起 (0,0)</text>
  <text x="222" y="244" text-anchor="middle" font-size="9" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">终 (4,5)</text>

  <!-- 障碍格 -->
  <rect x="142" y="72" width="32" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="174" y="72" width="32" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="206" y="72" width="32" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="142" y="104" width="32" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="174" y="104" width="32" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="206" y="104" width="32" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="46" y="136" width="32" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="78" y="136" width="32" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="46" y="168" width="32" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="78" y="168" width="32" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="46" y="200" width="32" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="78" y="200" width="32" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="158" y="93" text-anchor="middle" font-size="14" fill="#ccc" font-weight="bold" filter="url(#rough2)">#</text>
  <text x="190" y="93" text-anchor="middle" font-size="14" fill="#ccc" font-weight="bold" filter="url(#rough2)">#</text>
  <text x="222" y="93" text-anchor="middle" font-size="14" fill="#ccc" font-weight="bold" filter="url(#rough2)">#</text>
  <text x="158" y="125" text-anchor="middle" font-size="14" fill="#ccc" font-weight="bold" filter="url(#rough2)">#</text>
  <text x="190" y="125" text-anchor="middle" font-size="14" fill="#ccc" font-weight="bold" filter="url(#rough2)">#</text>
  <text x="222" y="125" text-anchor="middle" font-size="14" fill="#ccc" font-weight="bold" filter="url(#rough2)">#</text>
  <text x="62" y="157" text-anchor="middle" font-size="14" fill="#ccc" font-weight="bold" filter="url(#rough2)">#</text>
  <text x="94" y="157" text-anchor="middle" font-size="14" fill="#ccc" font-weight="bold" filter="url(#rough2)">#</text>
  <text x="62" y="189" text-anchor="middle" font-size="14" fill="#ccc" font-weight="bold" filter="url(#rough2)">#</text>
  <text x="94" y="189" text-anchor="middle" font-size="14" fill="#ccc" font-weight="bold" filter="url(#rough2)">#</text>
  <text x="62" y="221" text-anchor="middle" font-size="14" fill="#ccc" font-weight="bold" filter="url(#rough2)">#</text>
  <text x="94" y="221" text-anchor="middle" font-size="14" fill="#ccc" font-weight="bold" filter="url(#rough2)">#</text>

  <!-- 积木（2×3 全空，蓝） -->
  <rect x="46" y="72" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="78" y="72" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="110" y="72" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="46" y="104" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="78" y="104" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <!-- 门 = 积木右下角 (1,2)，粉红加粗 -->
  <rect x="110" y="104" width="32" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>

  <!-- 强制走廊（橙）：门向下到底，再向右到头 -->
  <rect x="110" y="136" width="32" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="110" y="168" width="32" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="110" y="200" width="32" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="142" y="200" width="32" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="174" y="200" width="32" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="206" y="200" width="32" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- 起点 -->
  <circle cx="62" cy="88" r="3.5" fill="#666" filter="url(#rough2)"/>

  <!-- 积木内 3 条路 -->
  <path d="M 64 82 L 122 82 L 122 113" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 64 87 L 91 87 L 91 115 L 118 115" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 58 89 L 58 121 L 89 121 L 118 121" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- 过门后的被迫走廊 -->
  <path d="M 126 126 L 126 213 L 217 213" fill="none" stroke="#d6a040" stroke-width="2.5" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- 图例 -->
  <text x="142" y="258" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">块内 3 条路（绿 / 红 / 蓝）</text>
  <text x="142" y="271" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">过门后共用 1 条被迫走廊（橙）</text>

  <!-- 右侧论证面板 -->
  <rect x="268" y="64" width="232" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="384" y="83" text-anchor="middle" font-size="11" fill="#33507a" font-weight="bold" filter="url(#rough2)">「积木」内部恰有 k 条路</text>
  <text x="384" y="100" text-anchor="middle" font-size="9.5" fill="#444" filter="url(#rough2)">k=3 → 2×3 全空块贴左上角</text>
  <text x="384" y="114" text-anchor="middle" font-size="9.5" fill="#444" filter="url(#rough2)">唯一一次「向下」落在哪列 → 3 条</text>

  <rect x="268" y="130" width="232" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="384" y="149" text-anchor="middle" font-size="11" fill="#8f3a35" font-weight="bold" filter="url(#rough2)">「门」= 积木右下角 (1,2)</text>
  <text x="384" y="166" text-anchor="middle" font-size="9.5" fill="#444" filter="url(#rough2)">积木下一行只开了门正下方 1 格</text>
  <text x="384" y="180" text-anchor="middle" font-size="9.5" fill="#444" filter="url(#rough2)">离开积木区的路径必经此门</text>

  <rect x="268" y="196" width="232" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="384" y="215" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">「走廊」过门后步步被迫</text>
  <text x="384" y="232" text-anchor="middle" font-size="9.5" fill="#444" filter="url(#rough2)">一路向下到底，再一路向右到头</text>
  <text x="384" y="246" text-anchor="middle" font-size="9.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">走廊走法数 = 1</text>

  <rect x="268" y="262" width="232" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="384" y="281" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">乘法原理</text>
  <text x="384" y="299" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">总路径数 = 块内 3 × 走廊 1 = 3</text>
  <text x="384" y="314" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">→ 恰好 k 条 ✓</text>

  <text x="260" y="344" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">积木可换：k=2 → 2×2；k=4 → 2×4 / 4×2 / 3×3 堵两角（两个 2×2 串联，2×2=4）</text>
  <text x="260" y="356" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">单行/单列（k≥2）或积木放不下 → 返回 []</text>
</svg>
