<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 490" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="490" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：预计算系数 → 双层循环填表 → O(k) 滚动数组</text>

  <!-- left invariant note -->
  <rect x="26" y="60" width="156" height="196" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="104" y="82" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">循环不变量</text>
  <text x="104" y="102" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">处理完前 i 个元素后：</text>
  <text x="104" y="120" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">dp[j][外] = 前 i 个元素、已开到</text>
  <text x="104" y="138" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">第 j 段、nums[i−1] 不在段内</text>
  <text x="104" y="156" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">的最大能量；</text>
  <text x="104" y="174" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">dp[j][内] 同理，但</text>
  <text x="104" y="192" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">nums[i−1] 在第 j 段内。</text>
  <text x="104" y="214" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">不可达状态 = −∞，</text>
  <text x="104" y="232" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">加法前先判 −∞ 防污染</text>

  <!-- performance note -->
  <rect x="26" y="272" width="156" height="112" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="104" y="294" text-anchor="middle" font-size="10.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">性能契约</text>
  <text x="104" y="314" text-anchor="middle" font-size="10" fill="#2d5a1e" filter="url(#rough2)">时间 O(n·k)，题面保证</text>
  <text x="104" y="332" text-anchor="middle" font-size="10" fill="#2d5a1e" filter="url(#rough2)">n·k ≤ 10⁶ → 必过；</text>
  <text x="104" y="350" text-anchor="middle" font-size="10" fill="#2d5a1e" filter="url(#rough2)">空间 O(k)（两行滚动）；</text>
  <text x="104" y="368" text-anchor="middle" font-size="10" fill="#2d5a1e" filter="url(#rough2)">|答案| ≤ 10¹⁵ → C++ 必须</text>
  <text x="104" y="386" text-anchor="middle" font-size="10" fill="#2d5a1e" filter="url(#rough2)">用 long long</text>

  <!-- main flow -->
  <rect x="190" y="60" width="280" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="330" y="82" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">预计算系数 c_j = (−1)^(j+1)·(k−j+1)，j = 1..k</text>

  <path d="M 330 96 L 330 112" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="190" y="116" width="280" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="330" y="138" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">初始化：dp[0][外] = 0，其余 = −∞（dp / ndp 两行）</text>

  <path d="M 330 152 L 330 168" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="190" y="172" width="280" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="330" y="194" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">外层循环 i = 1..n：x ← nums[i−1]（循环开始）</text>

  <path d="M 330 208 L 330 224" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="190" y="228" width="280" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="330" y="248" text-anchor="middle" font-size="10.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">内层 j = 0..min(i,k)：</text>
  <text x="330" y="266" text-anchor="middle" font-size="10.5" fill="#2d5a1e" filter="url(#rough2)">ndp[j][外] = max(dp[j][外], dp[j][内])</text>
  <text x="330" y="284" text-anchor="middle" font-size="10.5" fill="#2d5a1e" filter="url(#rough2)">j≥1：ndp[j][内] = c_j·x + max(dp[j][内], dp[j−1][外], dp[j−1][内])</text>

  <path d="M 330 298 L 330 312" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="190" y="316" width="280" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="330" y="336" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">swap(dp, ndp)（滚动，空间 O(k)）</text>

  <path d="M 330 348 L 330 362" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="330,366 400,394 330,422 260,394" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="398" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">i &lt; n ?</text>

  <path d="M 400 394 C 480 394, 490 200, 472 192" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="486" y="300" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">是</text>

  <path d="M 330 422 L 330 438" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="344" y="434" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="190" y="442" width="280" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="330" y="464" text-anchor="middle" font-size="11.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">返回 max(dp[k][外], dp[k][内])</text>
</svg>
