<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="640" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：s = "   fly me   to   the moon  "（长度 27）</text>

  <!-- Annotations above cells -->
  <!-- "skip ×2" above trailing spaces (cells 25-26, center x=596) -->
  <text x="596" y="52" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">跳过 ×2</text>
  <!-- "len = 4" above moon (cells 21-24, center x=530) -->
  <text x="530" y="52" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">len = 4</text>
  <!-- "停止" above stop space (cell 20, center x=475) -->
  <text x="475" y="52" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">↓停止</text>

  <!-- String cells: 27 chars, 22px wide, starting at x=24, y=62, height=30 -->
  <!-- Cell 0: ' ' -->
  <rect x="24" y="62" width="22" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="35" y="82" text-anchor="middle" font-size="10" fill="#ccc">·</text>
  <!-- Cell 1: ' ' -->
  <rect x="46" y="62" width="22" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="57" y="82" text-anchor="middle" font-size="10" fill="#ccc">·</text>
  <!-- Cell 2: ' ' -->
  <rect x="68" y="62" width="22" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="79" y="82" text-anchor="middle" font-size="10" fill="#ccc">·</text>
  <!-- Cell 3: 'f' -->
  <rect x="90" y="62" width="22" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="101" y="82" text-anchor="middle" font-size="12" fill="#333">f</text>
  <!-- Cell 4: 'l' -->
  <rect x="112" y="62" width="22" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="123" y="82" text-anchor="middle" font-size="12" fill="#333">l</text>
  <!-- Cell 5: 'y' -->
  <rect x="134" y="62" width="22" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="145" y="82" text-anchor="middle" font-size="12" fill="#333">y</text>
  <!-- Cell 6: ' ' -->
  <rect x="156" y="62" width="22" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="167" y="82" text-anchor="middle" font-size="10" fill="#ccc">·</text>
  <!-- Cell 7: 'm' -->
  <rect x="178" y="62" width="22" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="189" y="82" text-anchor="middle" font-size="12" fill="#333">m</text>
  <!-- Cell 8: 'e' -->
  <rect x="200" y="62" width="22" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="211" y="82" text-anchor="middle" font-size="12" fill="#333">e</text>
  <!-- Cell 9: ' ' -->
  <rect x="222" y="62" width="22" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="233" y="82" text-anchor="middle" font-size="10" fill="#ccc">·</text>
  <!-- Cell 10: ' ' -->
  <rect x="244" y="62" width="22" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="255" y="82" text-anchor="middle" font-size="10" fill="#ccc">·</text>
  <!-- Cell 11: ' ' -->
  <rect x="266" y="62" width="22" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="277" y="82" text-anchor="middle" font-size="10" fill="#ccc">·</text>
  <!-- Cell 12: 't' -->
  <rect x="288" y="62" width="22" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="299" y="82" text-anchor="middle" font-size="12" fill="#333">t</text>
  <!-- Cell 13: 'o' -->
  <rect x="310" y="62" width="22" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="321" y="82" text-anchor="middle" font-size="12" fill="#333">o</text>
  <!-- Cell 14: ' ' -->
  <rect x="332" y="62" width="22" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="343" y="82" text-anchor="middle" font-size="10" fill="#ccc">·</text>
  <!-- Cell 15: ' ' -->
  <rect x="354" y="62" width="22" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="365" y="82" text-anchor="middle" font-size="10" fill="#ccc">·</text>
  <!-- Cell 16: ' ' -->
  <rect x="376" y="62" width="22" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="387" y="82" text-anchor="middle" font-size="10" fill="#ccc">·</text>
  <!-- Cell 17: 't' -->
  <rect x="398" y="62" width="22" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="409" y="82" text-anchor="middle" font-size="12" fill="#333">t</text>
  <!-- Cell 18: 'h' -->
  <rect x="420" y="62" width="22" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="431" y="82" text-anchor="middle" font-size="12" fill="#333">h</text>
  <!-- Cell 19: 'e' -->
  <rect x="442" y="62" width="22" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="453" y="82" text-anchor="middle" font-size="12" fill="#333">e</text>
  <!-- Cell 20: ' ' (ORANGE - stop) -->
  <rect x="464" y="62" width="22" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="475" y="82" text-anchor="middle" font-size="10" fill="#d6a040">·</text>
  <!-- Cell 21: 'm' (GREEN) -->
  <rect x="486" y="62" width="22" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="497" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">m</text>
  <!-- Cell 22: 'o' (GREEN) -->
  <rect x="508" y="62" width="22" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="519" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">o</text>
  <!-- Cell 23: 'o' (GREEN) -->
  <rect x="530" y="62" width="22" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="541" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">o</text>
  <!-- Cell 24: 'n' (GREEN) -->
  <rect x="552" y="62" width="22" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="563" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">n</text>
  <!-- Cell 25: ' ' (RED - trailing) -->
  <rect x="574" y="62" width="22" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="585" y="82" text-anchor="middle" font-size="10" fill="#b85450">·</text>
  <!-- Cell 26: ' ' (RED - trailing) -->
  <rect x="596" y="62" width="22" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="607" y="82" text-anchor="middle" font-size="10" fill="#b85450">·</text>

  <!-- Index labels (key indices only) -->
  <text x="475" y="108" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">20</text>
  <text x="497" y="108" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">21</text>
  <text x="563" y="108" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">24</text>
  <text x="585" y="108" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">25</text>
  <text x="607" y="108" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">26</text>

  <!-- Phase 2 bracket: under moon (cells 21-24) -->
  <path d="M 486 118 Q 486 126 492 126 L 568 126 Q 574 126 574 118" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="530" y="142" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">阶段2: 数单词</text>

  <!-- Phase 1 bracket: under trailing spaces (cells 25-26) -->
  <path d="M 574 118 Q 574 126 580 126 L 612 126 Q 618 126 618 118" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="596" y="142" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">阶段1: 跳过</text>

  <!-- Step summary box -->
  <rect x="40" y="162" width="560" height="180" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>

  <!-- Phase 1 step -->
  <rect x="56" y="178" width="50" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="81" y="192" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">阶段 1</text>
  <text x="116" y="192" font-size="11" fill="#555">i = 26 ' ' → 跳过,  i = 25 ' ' → 跳过,  i = 24 'n' → 非空格, 阶段 1 结束</text>

  <!-- Phase 2 step -->
  <rect x="56" y="208" width="50" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="81" y="222" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">阶段 2</text>
  <text x="116" y="222" font-size="11" fill="#555">i = 24 'n' len=1 → i = 23 'o' len=2 → i = 22 'o' len=3 → i = 21 'm' len=4</text>

  <!-- Stop step -->
  <rect x="56" y="238" width="50" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="81" y="252" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">停 止</text>
  <text x="116" y="252" font-size="11" fill="#555">i = 20, s[20] = ' ' → 阶段 2 结束, 返回 len = 4</text>

  <!-- Result -->
  <rect x="180" y="278" width="280" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="320" y="300" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">最后一个单词 "moon" 长度 = 4</text>

  <!-- Legend -->
  <rect x="56" y="326" width="12" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="72" y="336" font-size="9" fill="#888">尾随空格</text>
  <rect x="130" y="326" width="12" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="146" y="336" font-size="9" fill="#888">最后单词</text>
  <rect x="204" y="326" width="12" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="220" y="336" font-size="9" fill="#888">停止位</text>
  <rect x="266" y="326" width="12" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="282" y="336" font-size="9" fill="#888">其他字符</text>
</svg>
