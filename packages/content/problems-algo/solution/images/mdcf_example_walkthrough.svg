<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "aaabbbcc"</text>
  <text x="280" y="40" text-anchor="middle" font-size="11" fill="#888">频次：a=3, b=3, c=2 → 降序 [3, 3, 2]</text>

  <!-- ===== Table ===== -->
  <!-- Header row -->
  <rect x="20" y="52" width="520" height="26" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="55" y="70" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">步骤</text>
  <text x="120" y="70" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">字符</text>
  <text x="175" y="70" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">f</text>
  <text x="235" y="70" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">prev</text>
  <text x="310" y="70" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">target</text>
  <text x="385" y="70" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">删除数</text>
  <text x="465" y="70" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">新 prev</text>
  <text x="515" y="70" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">唯一?</text>

  <!-- Row 1: a, f=3, prev=inf -->
  <rect x="20" y="80" width="520" height="30" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="55" y="100" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="120" y="100" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">a</text>
  <text x="175" y="100" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="235" y="100" text-anchor="middle" font-size="11" fill="#888">∞</text>
  <text x="310" y="100" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="385" y="100" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="465" y="100" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="515" y="100" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- Row 2: b, f=3, prev=3 -> conflict -->
  <rect x="20" y="112" width="520" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="55" y="132" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="120" y="132" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">b</text>
  <text x="175" y="132" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <text x="235" y="132" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="310" y="132" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>
  <text x="385" y="132" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">+1</text>
  <text x="465" y="132" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="515" y="132" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- Row 3: c, f=2, prev=2 -> conflict -->
  <rect x="20" y="144" width="520" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="55" y="164" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="120" y="164" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">c</text>
  <text x="175" y="164" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>
  <text x="235" y="164" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="310" y="164" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <text x="385" y="164" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">+1</text>
  <text x="465" y="164" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="515" y="164" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- Row 4: end -->
  <rect x="20" y="176" width="520" height="26" fill="#f8f8f8" stroke="#e0e0e0" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="280" y="194" text-anchor="middle" font-size="11" fill="#888">遍历结束</text>
  <text x="515" y="194" text-anchor="middle" font-size="11" fill="#888">—</text>

  <!-- ===== Bottom: visual summary ===== -->
  <text x="40" y="224" font-size="12" fill="#888">调整前后对比：</text>

  <!-- Before -->
  <text x="60" y="250" font-size="11" fill="#888">调整前频次集合:</text>
  <rect x="60" y="258" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="85" y="275" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="114" y="258" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="139" y="275" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <rect x="168" y="258" width="50" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="193" y="275" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="230" y="275" font-size="11" fill="#b85450" font-weight="bold">← 有重复!</text>

  <!-- Arrow -->
  <path d="M 300 270 L 330 270" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="315" y="262" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">贪心</text>

  <!-- After -->
  <text x="350" y="250" font-size="11" fill="#888">调整后频次集合:</text>
  <rect x="350" y="258" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="375" y="275" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="404" y="258" width="50" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="429" y="275" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="458" y="258" width="50" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="483" y="275" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <text x="520" y="275" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- Result box -->
  <rect x="120" y="296" width="320" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="318" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">答案: 2  (删 1 个 b + 1 个 c)</text>
</svg>
