<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="300" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：逐行求和 = 1 的个数；严格 &gt; 平手保留最小下标</text>

  <!-- column headers -->
  <text x="157" y="58" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">列 0</text>
  <text x="211" y="58" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">列 1</text>
  <text x="295" y="58" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">sum(row)</text>

  <!-- Row 0: chosen (tie, smallest index) -->
  <text x="118" y="98" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">row 0 ⭐</text>
  <rect x="130" y="72" width="54" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="157" y="98" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="184" y="72" width="54" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="211" y="98" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="265" y="76" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="295" y="98" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1 ✦max</text>

  <!-- Row 1: same sum, skipped by strict > -->
  <text x="118" y="148" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">row 1</text>
  <rect x="130" y="122" width="54" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="157" y="148" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="184" y="122" width="54" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="211" y="148" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="265" y="126" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="295" y="148" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="340" y="142" font-size="10" fill="#b85450" filter="url(#rough2)">1 &gt; 1 ?</text>
  <text x="340" y="156" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否 → 跳过</text>

  <!-- arrow from chosen row to result -->
  <path d="M 295 112 Q 360 150 392 196" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result box -->
  <rect x="392" y="200" width="140" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="462" y="218" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回</text>
  <text x="462" y="236" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">[ 下标 0, 数量 1 ]</text>

  <text x="280" y="278" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">示例 1：mat = [[0,1],[1,0]]，两行各 1 个 1，严格 &gt; 保留 row 0</text>
</svg>
