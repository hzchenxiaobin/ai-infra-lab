<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 422"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="700" height="422" fill="#fafafa"/>

  <text x="350" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：user1 任务列表随各操作演化</text>

  <!-- header row -->
  <rect x="10" y="46" width="688" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="37"  y="65" text-anchor="middle" font-size="11" fill="#223" filter="url(#rough2)">步骤</text>
  <text x="70"  y="65" font-size="11" fill="#223" filter="url(#rough2)">操作</text>
  <text x="294" y="65" font-size="11" fill="#223" filter="url(#rough2)">user1 未完成列表（按 due 升序）</text>
  <text x="594" y="65" font-size="11" fill="#223" filter="url(#rough2)">返回</text>

  <!-- grid: vertical separators -->
  <line x1="64"  y1="46" x2="64"  y2="402" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="288" y1="46" x2="288" y2="402" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="588" y1="46" x2="588" y2="402" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <!-- grid: horizontal separators (between data rows) -->
  <line x1="10" y1="104" x2="698" y2="104" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="10" y1="134" x2="698" y2="134" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="10" y1="164" x2="698" y2="164" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="10" y1="194" x2="698" y2="194" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="10" y1="224" x2="698" y2="224" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="10" y1="254" x2="698" y2="254" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="10" y1="284" x2="698" y2="284" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="10" y1="314" x2="698" y2="314" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="10" y1="344" x2="698" y2="344" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="10" y1="374" x2="698" y2="374" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <!-- outer border bottom -->
  <rect x="10" y="46" width="688" height="356" rx="4" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- row 1: init -->
  <text x="37"  y="93" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="70"  y="93" font-size="11" fill="#333" filter="url(#rough2)">TodoList()</text>
  <text x="294" y="93" font-size="11" fill="#999" filter="url(#rough2)">—（空）</text>
  <text x="594" y="93" font-size="11" fill="#555" filter="url(#rough2)">—</text>

  <!-- row 2: addTask Task1 -->
  <text x="37"  y="123" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <text x="70"  y="123" font-size="11" fill="#333" filter="url(#rough2)">addTask(1,"Task1",50,[])</text>
  <text x="294" y="123" font-size="11" fill="#333" filter="url(#rough2)">[Task1(50)]</text>
  <text x="594" y="123" font-size="11" fill="#b85450" filter="url(#rough2)">1</text>

  <!-- row 3: addTask Task2 -->
  <text x="37"  y="153" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3</text>
  <text x="70"  y="153" font-size="11" fill="#333" filter="url(#rough2)">addTask(1,"Task2",100,[P1])</text>
  <text x="294" y="153" font-size="11" fill="#333" filter="url(#rough2)">[Task1(50), Task2(100)]</text>
  <text x="594" y="153" font-size="11" fill="#b85450" filter="url(#rough2)">2</text>

  <!-- row 4: getAllTasks(1) -->
  <text x="37"  y="183" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4</text>
  <text x="70"  y="183" font-size="11" fill="#333" filter="url(#rough2)">getAllTasks(1)</text>
  <text x="294" y="183" font-size="11" fill="#333" filter="url(#rough2)">[Task1(50), Task2(100)]</text>
  <text x="594" y="183" font-size="11" fill="#446688" filter="url(#rough2)">[Task1, Task2]</text>

  <!-- row 5: getAllTasks(5) -->
  <text x="37"  y="213" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">5</text>
  <text x="70"  y="213" font-size="11" fill="#333" filter="url(#rough2)">getAllTasks(5)</text>
  <text x="294" y="213" font-size="11" fill="#999" filter="url(#rough2)">（user5 无任务，不影响 user1）</text>
  <text x="594" y="213" font-size="11" fill="#446688" filter="url(#rough2)">[]</text>

  <!-- row 6: addTask Task3 -->
  <text x="37"  y="243" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">6</text>
  <text x="70"  y="243" font-size="11" fill="#333" filter="url(#rough2)">addTask(1,"Task3",30,[P1])</text>
  <text x="294" y="243" font-size="11" fill="#333" filter="url(#rough2)">[Task3(30), Task1(50), Task2(100)]</text>
  <text x="594" y="243" font-size="11" fill="#b85450" filter="url(#rough2)">3</text>

  <!-- row 7: getTasksForTag(1,"P1") -->
  <text x="37"  y="273" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">7</text>
  <text x="70"  y="273" font-size="11" fill="#333" filter="url(#rough2)">getTasksForTag(1,"P1")</text>
  <text x="294" y="273" font-size="11" fill="#333" filter="url(#rough2)">含 P1：[Task3(30), Task2(100)]</text>
  <text x="594" y="273" font-size="11" fill="#446688" filter="url(#rough2)">[Task3, Task2]</text>

  <!-- row 8: completeTask(5,1) -->
  <text x="37"  y="303" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">8</text>
  <text x="70"  y="303" font-size="11" fill="#333" filter="url(#rough2)">completeTask(5,1)</text>
  <text x="294" y="303" font-size="11" fill="#999" filter="url(#rough2)">（#1 不属 user5，无操作）</text>
  <text x="594" y="303" font-size="11" fill="#555" filter="url(#rough2)">null</text>

  <!-- row 9: completeTask(1,2) -->
  <text x="37"  y="333" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">9</text>
  <text x="70"  y="333" font-size="11" fill="#333" filter="url(#rough2)">completeTask(1,2)</text>
  <text x="294" y="333" font-size="11" fill="#333" filter="url(#rough2)">Task2→done：[Task3(30), Task1(50)]</text>
  <text x="594" y="333" font-size="11" fill="#555" filter="url(#rough2)">null</text>

  <!-- row 10: getTasksForTag(1,"P1") -->
  <text x="37"  y="363" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">10</text>
  <text x="70"  y="363" font-size="11" fill="#333" filter="url(#rough2)">getTasksForTag(1,"P1")</text>
  <text x="294" y="363" font-size="11" fill="#333" filter="url(#rough2)">未完成含 P1：[Task3(30)]</text>
  <text x="594" y="363" font-size="11" fill="#446688" filter="url(#rough2)">[Task3]</text>

  <!-- row 11: getAllTasks(1) -->
  <text x="37"  y="393" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">11</text>
  <text x="70"  y="393" font-size="11" fill="#333" filter="url(#rough2)">getAllTasks(1)</text>
  <text x="294" y="393" font-size="11" fill="#333" filter="url(#rough2)">[Task3(30), Task1(50)]</text>
  <text x="594" y="393" font-size="11" fill="#446688" filter="url(#rough2)">[Task3, Task1]</text>

  <text x="350" y="416" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">Task2 完成后从所有查询消失，但对象仍在表内（done 标记，未删除）</text>
</svg>
