<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：枚举 (a, b) 对，让相同的和自己撞车</text>

  <!-- ============ 左：枚举空间 ============ -->
  <text x="48" y="66" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">枚举空间</text>

  <!-- 6×6 网格：列 = a，行 = b（自下而上），可行格填充 -->
  <g stroke="#8899aa" stroke-width="1">
    <!-- r=6（顶行）：全部超界 -->
    <rect x="48"  y="84" width="24" height="24" fill="#ffffff" filter="url(#rough2)"/>
    <rect x="72"  y="84" width="24" height="24" fill="#ffffff" filter="url(#rough2)"/>
    <rect x="96"  y="84" width="24" height="24" fill="#ffffff" filter="url(#rough2)"/>
    <rect x="120" y="84" width="24" height="24" fill="#ffffff" filter="url(#rough2)"/>
    <rect x="144" y="84" width="24" height="24" fill="#ffffff" filter="url(#rough2)"/>
    <rect x="168" y="84" width="24" height="24" fill="#ffffff" filter="url(#rough2)"/>
    <!-- r=5：c=1..4 可行，c=5 超界，c=6 不在三角内 -->
    <rect x="48"  y="108" width="24" height="24" fill="#e8f0fe" filter="url(#rough2)"/>
    <rect x="72"  y="108" width="24" height="24" fill="#e8f0fe" filter="url(#rough2)"/>
    <rect x="96"  y="108" width="24" height="24" fill="#e8f0fe" filter="url(#rough2)"/>
    <rect x="120" y="108" width="24" height="24" fill="#e8f0fe" filter="url(#rough2)"/>
    <rect x="144" y="108" width="24" height="24" fill="#ffffff" filter="url(#rough2)"/>
    <rect x="168" y="108" width="24" height="24" fill="#ffffff" filter="url(#rough2)"/>
    <!-- r=4 -->
    <rect x="48"  y="132" width="24" height="24" fill="#e8f0fe" filter="url(#rough2)"/>
    <rect x="72"  y="132" width="24" height="24" fill="#e8f0fe" filter="url(#rough2)"/>
    <rect x="96"  y="132" width="24" height="24" fill="#e8f0fe" filter="url(#rough2)"/>
    <rect x="120" y="132" width="24" height="24" fill="#e8f0fe" filter="url(#rough2)"/>
    <rect x="144" y="132" width="24" height="24" fill="#ffffff" filter="url(#rough2)"/>
    <rect x="168" y="132" width="24" height="24" fill="#ffffff" filter="url(#rough2)"/>
    <!-- r=3 -->
    <rect x="48"  y="156" width="24" height="24" fill="#e8f0fe" filter="url(#rough2)"/>
    <rect x="72"  y="156" width="24" height="24" fill="#e8f0fe" filter="url(#rough2)"/>
    <rect x="96"  y="156" width="24" height="24" fill="#e8f0fe" filter="url(#rough2)"/>
    <rect x="120" y="156" width="24" height="24" fill="#ffffff" filter="url(#rough2)"/>
    <rect x="144" y="156" width="24" height="24" fill="#ffffff" filter="url(#rough2)"/>
    <rect x="168" y="156" width="24" height="24" fill="#ffffff" filter="url(#rough2)"/>
    <!-- r=2 -->
    <rect x="48"  y="180" width="24" height="24" fill="#e8f0fe" filter="url(#rough2)"/>
    <rect x="72"  y="180" width="24" height="24" fill="#e8f0fe" filter="url(#rough2)"/>
    <rect x="96"  y="180" width="24" height="24" fill="#ffffff" filter="url(#rough2)"/>
    <rect x="120" y="180" width="24" height="24" fill="#ffffff" filter="url(#rough2)"/>
    <rect x="144" y="180" width="24" height="24" fill="#ffffff" filter="url(#rough2)"/>
    <rect x="168" y="180" width="24" height="24" fill="#ffffff" filter="url(#rough2)"/>
    <!-- r=1 -->
    <rect x="48"  y="204" width="24" height="24" fill="#e8f0fe" filter="url(#rough2)"/>
    <rect x="72"  y="204" width="24" height="24" fill="#ffffff" filter="url(#rough2)"/>
    <rect x="96"  y="204" width="24" height="24" fill="#ffffff" filter="url(#rough2)"/>
    <rect x="120" y="204" width="24" height="24" fill="#ffffff" filter="url(#rough2)"/>
    <rect x="144" y="204" width="24" height="24" fill="#ffffff" filter="url(#rough2)"/>
    <rect x="168" y="204" width="24" height="24" fill="#ffffff" filter="url(#rough2)"/>
  </g>

  <!-- a=b 对角虚线 -->
  <path d="M 48 228 L 192 84" fill="none" stroke="#446688" stroke-width="1.3" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="124" y="152" font-size="10" fill="#446688" transform="rotate(-45 124 152)" filter="url(#rough2)">a = b</text>

  <!-- 立方和上界曲线 -->
  <path d="M 50 104 Q 104 86 158 118" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough)"/>
  <text x="118" y="82" font-size="10" fill="#b85450" filter="url(#rough2)">a³+b³ &gt; n</text>

  <!-- 坐标轴 -->
  <path d="M 44 232 L 44 92" fill="none" stroke="#888" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="36" y="92" font-size="12" fill="#555" filter="url(#rough2)">b</text>
  <path d="M 44 232 L 202 232" fill="none" stroke="#888" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="204" y="237" font-size="12" fill="#555" filter="url(#rough2)">a</text>

  <text x="48" y="258" font-size="11" fill="#333" filter="url(#rough2)">a ≤ b 且 a³ + b³ ≤ n</text>
  <text x="48" y="276" font-size="11" fill="#333" filter="url(#rough2)">可行对 ≈ n^(2/3) / 2 ≈ 4.4×10^5</text>

  <!-- ============ 右：撞车示意 ============ -->
  <text x="385" y="66" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">两个不同的对撞出同一个和</text>

  <!-- 1729 组 -->
  <rect x="262" y="84" width="100" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="312" y="104" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">1³ + 12³</text>
  <rect x="262" y="134" width="100" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="312" y="154" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">9³ + 10³</text>
  <path d="M 362 99 Q 392 98 412 110" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 362 149 Q 392 150 412 130" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="414" y="98" width="76" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="452" y="126" text-anchor="middle" font-size="17" font-weight="bold" fill="#a07514" filter="url(#rough2)">1729</text>
  <rect x="414" y="148" width="76" height="22" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="452" y="163" text-anchor="middle" font-size="11" fill="#2e5a24" filter="url(#rough2)">cnt = 2 ✓</text>

  <!-- 4104 组 -->
  <rect x="262" y="184" width="100" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="312" y="204" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">2³ + 16³</text>
  <rect x="262" y="234" width="100" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="312" y="254" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">9³ + 15³</text>
  <path d="M 362 199 Q 392 198 412 210" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 362 249 Q 392 250 412 230" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="414" y="198" width="76" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="452" y="226" text-anchor="middle" font-size="17" font-weight="bold" fill="#a07514" filter="url(#rough2)">4104</text>
  <rect x="414" y="248" width="76" height="22" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="452" y="263" text-anchor="middle" font-size="11" fill="#2e5a24" filter="url(#rough2)">cnt = 2 ✓</text>

  <!-- 结论框 -->
  <rect x="262" y="288" width="228" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="376" y="305" text-anchor="middle" font-size="11.5" fill="#2e5a24" filter="url(#rough2)">哈希表计数 cnt[a³+b³]++</text>
  <text x="376" y="322" text-anchor="middle" font-size="11.5" fill="#2e5a24" filter="url(#rough2)">cnt ≥ 2 → 好整数，收集后排序返回</text>
</svg>
