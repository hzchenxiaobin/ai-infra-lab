<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr_orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心：每部分 = 内容 + 后缀 &quot;&lt;i/b&gt;&quot;，总长 = limit</text>

  <!-- anatomy bar -->
  <g filter="url(#rough2)">
    <rect x="40" y="62" width="316" height="50" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="198" y="92" text-anchor="middle" font-size="14" fill="#334455">内容（取自 message）</text>
    <rect x="356" y="62" width="164" height="50" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="438" y="92" text-anchor="middle" font-size="14" fill="#7a4a10">&lt;i/b&gt;</text>
  </g>

  <!-- brace under bar = limit -->
  <path d="M40,124 L40,134 L520,134 L520,124" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="152" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">整段 = limit（最后一部分可 ≤ limit）</text>

  <!-- formula block -->
  <g filter="url(#rough2)">
    <rect x="40" y="168" width="480" height="66" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="280" y="194" text-anchor="middle" font-size="14" fill="#b85450">后缀长 = 3 + digits(i) + digits(b)</text>
    <text x="280" y="220" text-anchor="middle" font-size="14" fill="#b85450">第 i 部分容量 cap_i = limit − 3 − digits(i) − digits(b)</text>
  </g>

  <!-- b grows -> suffix grows -->
  <text x="280" y="260" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b 越大 → digits(b) 越大 → 后缀越长 → 容量越小</text>

  <!-- three suffix examples -->
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="56" y="276" width="124" height="36" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="118" y="299" fill="#7a4a10">&lt;9/9&gt; = 5</text>
    <rect x="218" y="276" width="124" height="36" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="280" y="299" fill="#7a4a10">&lt;14/14&gt; = 7</text>
    <rect x="380" y="276" width="124" height="36" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.9"/>
    <text x="442" y="299" fill="#7a4a10">&lt;140/140&gt; = 9</text>
  </g>
  <path d="M180,294 L214,294" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr_orange)" filter="url(#rough2)"/>
  <path d="M342,294 L376,294" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr_orange)" filter="url(#rough2)"/>

  <!-- bottom note -->
  <text x="280" y="338" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">digits(b) 在 b = 10、100、… 处进位，后缀突跳</text>
  <text x="280" y="358" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">→ 后缀长度依赖 b，故必须先枚举 b 求总容量，再回头切分</text>
</svg>
