<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="680" height="420" fill="#fafafa"/>

  <text x="340" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：3 只股票的符号化求和全过程</text>

  <!-- Header -->
  <text x="180" y="58" text-anchor="end" font-size="11" fill="#888" font-weight="bold">股票</text>
  <text x="370" y="58" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">带符号价格（Buy −，Sell +）</text>
  <text x="610" y="58" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">SUM = 净损益</text>

  <!-- Separator line -->
  <path d="M 40 66 L 660 66" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- ====== Leetcode ====== -->
  <text x="180" y="96" text-anchor="end" font-size="13" fill="#446688" font-weight="bold">Leetcode</text>

  <rect x="250" y="78" width="90" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="295" y="99" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−1000</text>

  <rect x="350" y="78" width="90" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="395" y="99" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">+9000</text>

  <rect x="560" y="78" width="100" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="610" y="99" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">8000</text>

  <!-- ====== Handbags ====== -->
  <text x="180" y="146" text-anchor="end" font-size="13" fill="#446688" font-weight="bold">Handbags</text>

  <rect x="250" y="128" width="90" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="295" y="149" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−30000</text>

  <rect x="350" y="128" width="90" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="395" y="149" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">+7000</text>

  <rect x="560" y="128" width="100" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="610" y="149" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">−23000</text>

  <!-- ====== Corona Masks ====== -->
  <text x="180" y="200" text-anchor="end" font-size="13" fill="#446688" font-weight="bold">Corona Masks</text>

  <g font-size="12">
    <rect x="200" y="184" width="56" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="228" y="205" text-anchor="middle" fill="#b85450" font-weight="bold">−10</text>

    <rect x="260" y="184" width="56" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="288" y="205" text-anchor="middle" fill="#4a7a3a" font-weight="bold">+1010</text>

    <rect x="320" y="184" width="56" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="348" y="205" text-anchor="middle" fill="#b85450" font-weight="bold">−1000</text>

    <rect x="380" y="184" width="56" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="408" y="205" text-anchor="middle" fill="#4a7a3a" font-weight="bold">+500</text>

    <rect x="440" y="184" width="56" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="468" y="205" text-anchor="middle" fill="#b85450" font-weight="bold">−1000</text>

    <rect x="500" y="184" width="56" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="528" y="205" text-anchor="middle" fill="#4a7a3a" font-weight="bold">+10000</text>
  </g>

  <rect x="560" y="184" width="100" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="610" y="205" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">9500</text>

  <!-- Separator line -->
  <path d="M 40 240 L 660 240" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Verification box -->
  <rect x="40" y="260" width="600" height="140" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="340" y="282" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">验证：总损益 = Σ(Sell) − Σ(Buy)，与配对方式无关</text>

  <text x="60" y="306" font-size="11" fill="#446688" font-weight="bold">Leetcode</text>
  <text x="160" y="306" font-size="11" fill="#555">Σ(Sell)=9000, Σ(Buy)=1000 → 9000−1000 = 8000 ✓</text>

  <text x="60" y="328" font-size="11" fill="#446688" font-weight="bold">Handbags</text>
  <text x="160" y="328" font-size="11" fill="#555">Σ(Sell)=7000, Σ(Buy)=30000 → 7000−30000 = −23000 ✓</text>

  <text x="60" y="350" font-size="11" fill="#446688" font-weight="bold">Corona Masks</text>
  <text x="160" y="350" font-size="11" fill="#555">Σ(Sell)=1010+500+10000=11510, Σ(Buy)=10+1000+1000=2010</text>
  <text x="160" y="366" font-size="11" fill="#555">→ 11510−2010 = 9500 ✓</text>

  <text x="340" y="388" text-anchor="middle" font-size="10" fill="#888">配对视角：(1010−10)+(500−1000)+(10000−1000) = 1000−500+9000 = 9500 ✓ 两种视角等价</text>
</svg>
