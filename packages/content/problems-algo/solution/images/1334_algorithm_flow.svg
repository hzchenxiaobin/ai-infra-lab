<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">Floyd 求阈值内邻居最少城市：算法流程</text>

  <!-- Step 1: init matrix -->
  <rect x="60" y="56" width="440" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="80" y="78" font-size="12" fill="#446688" font-weight="bold">① 初始化距离矩阵 dist[n][n]</text>
  <text x="80" y="96" font-size="10" fill="#555">dist[i][i]=0；有边 (u,v,w) → dist[u][v]=dist[v][u]=w；其余 INF</text>
  <text x="80" y="112" font-size="10" fill="#888">INF 用 INT_MAX/2，防 dist[i][k]+dist[k][j] 溢出</text>

  <!-- arrow 1->2 -->
  <path d="M 280 122 L 280 144" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: Floyd triple loop -->
  <rect x="60" y="148" width="440" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="80" y="170" font-size="12" fill="#d6a040" font-weight="bold">② Floyd 三重循环（k 在最外层！）</text>
  <text x="80" y="190" font-size="10" fill="#555" font-family="'Comic Sans MS', monospace">for k in 0..n-1:</text>
  <text x="98" y="206" font-size="10" fill="#555" font-family="'Comic Sans MS', monospace">for i in 0..n-1:</text>
  <text x="116" y="222" font-size="10" fill="#555" font-family="'Comic Sans MS', monospace">for j in 0..n-1: dist[i][j] = min(dist[i][j], dist[i][k]+dist[k][j])</text>

  <!-- arrow 2->3 -->
  <path d="M 280 242 L 280 264" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: count neighbors -->
  <rect x="60" y="268" width="440" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="80" y="290" font-size="12" fill="#4a7a3a" font-weight="bold">③ 统计每个城市的邻居数 cnt[i]</text>
  <text x="80" y="308" font-size="10" fill="#555">cnt[i] = #{ j | j≠i 且 dist[i][j] ≤ distanceThreshold }</text>
  <text x="80" y="324" font-size="10" fill="#888">阈值是 ≤（不超过），不含自身</text>

  <!-- arrow 3->4 -->
  <path d="M 280 334 L 280 356" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: pick answer -->
  <rect x="60" y="360" width="440" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="80" y="382" font-size="12" fill="#b85450" font-weight="bold">④ 选邻居数最小者；并列取编号最大</text>
  <text x="80" y="400" font-size="10" fill="#555">正序遍历 i，if cnt[i] ≤ minCnt: 更新（≤ 保证并列留大编号）</text>
  <text x="80" y="416" font-size="10" fill="#888">返回 ans</text>

  <!-- side annotation -->
  <text x="520" y="194" text-anchor="end" font-size="10" fill="#d6a040" font-weight="bold">← 核心</text>
  <text x="520" y="396" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold">← 答案</text>

  <!-- footer -->
  <text x="280" y="448" text-anchor="middle" font-size="10" fill="#888">时间 O(n³)  ·  空间 O(n²)  ·  n≤100 时约 10^6，足够快</text>
</svg>
