<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="360" fill="#fafafa"/>

  <text x="310" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：root=[1,2,3]  voyage=[1,3,2]  →  翻转 [1]</text>

  <!-- Step 1: i=0 visit root -->
  <text x="20" y="50" font-size="11" fill="#446688" font-weight="bold">Step 1  i=0</text>
  <circle cx="70" cy="78" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="70" y="82" text-anchor="middle" font-size="11" fill="#333">1</text>
  <circle cx="45" cy="118" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="45" y="122" text-anchor="middle" font-size="9" fill="#333">2</text>
  <line x1="62" y1="90" x2="48" y2="110" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="95" cy="118" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="95" y="122" text-anchor="middle" font-size="9" fill="#333">3</text>
  <line x1="78" y1="90" x2="92" y2="110" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="148" text-anchor="middle" font-size="9" fill="#4a7a3a">voy[0]=1 ✓ i→1</text>

  <!-- Step 2: check left mismatch, flip -->
  <text x="170" y="50" font-size="11" fill="#d6a040" font-weight="bold">Step 2  i=1 判翻转</text>
  <circle cx="220" cy="78" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="220" y="82" text-anchor="middle" font-size="11" fill="#333">1</text>
  <circle cx="195" cy="118" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="195" y="122" text-anchor="middle" font-size="9" fill="#333">2</text>
  <line x1="212" y1="90" x2="198" y2="110" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="245" cy="118" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="245" y="122" text-anchor="middle" font-size="9" fill="#333">3</text>
  <line x1="228" y1="90" x2="242" y2="110" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="195" y="142" text-anchor="middle" font-size="8" fill="#b85450">2≠voy[1]=3</text>
  <text x="245" y="142" text-anchor="middle" font-size="8" fill="#4a7a3a">3=voy[1] ✓</text>
  <text x="220" y="158" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">翻转！记录 1</text>

  <!-- Arrow between step 2 and 3 -->
  <path d="M 300 95 L 330 95" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: after flip, visit 3 -->
  <text x="350" y="50" font-size="11" fill="#446688" font-weight="bold">Step 3  i=1 访 3</text>
  <circle cx="400" cy="78" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="400" y="82" text-anchor="middle" font-size="11" fill="#333">1</text>
  <circle cx="375" cy="118" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="375" y="122" text-anchor="middle" font-size="9" fill="#333">3</text>
  <line x1="392" y1="90" x2="378" y2="110" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="425" cy="118" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="425" y="122" text-anchor="middle" font-size="9" fill="#333">2</text>
  <line x1="408" y1="90" x2="422" y2="110" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="400" y="148" text-anchor="middle" font-size="9" fill="#4a7a3a">voy[1]=3 ✓ i→2</text>

  <!-- Step 4: visit 2 -->
  <text x="475" y="50" font-size="11" fill="#446688" font-weight="bold">Step 4  i=2 访 2</text>
  <circle cx="525" cy="78" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="525" y="82" text-anchor="middle" font-size="11" fill="#333">1</text>
  <circle cx="500" cy="118" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="500" y="122" text-anchor="middle" font-size="9" fill="#333">3</text>
  <line x1="517" y1="90" x2="503" y2="110" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="550" cy="118" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="550" y="122" text-anchor="middle" font-size="9" fill="#333">2</text>
  <line x1="533" y1="90" x2="547" y2="110" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="525" y="148" text-anchor="middle" font-size="9" fill="#4a7a3a">voy[2]=2 ✓ i→3</text>

  <!-- Result -->
  <rect x="120" y="186" width="380" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="10" opacity="0.4" filter="url(#rough2)"/>
  <text x="310" y="206" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">i == n（消费完毕）→ 匹配成功</text>
  <text x="310" y="222" text-anchor="middle" font-size="11" fill="#555">返回翻转列表 [1]</text>

  <!-- Trace table -->
  <text x="310" y="252" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">执行轨迹</text>

  <rect x="30" y="260" width="560" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="275" text-anchor="middle" font-size="9" fill="#555" font-weight="bold">i</text>
  <text x="120" y="275" text-anchor="middle" font-size="9" fill="#555" font-weight="bold">访问节点</text>
  <text x="200" y="275" text-anchor="middle" font-size="9" fill="#555" font-weight="bold">voyage[i]</text>
  <text x="290" y="275" text-anchor="middle" font-size="9" fill="#555" font-weight="bold">左子匹配？</text>
  <text x="390" y="275" text-anchor="middle" font-size="9" fill="#555" font-weight="bold">动作</text>
  <text x="510" y="275" text-anchor="middle" font-size="9" fill="#555" font-weight="bold">翻转列表</text>

  <rect x="30" y="284" width="560" height="22" fill="#fafafa" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="60" y="299" text-anchor="middle" font-size="9" fill="#333">0</text>
  <text x="120" y="299" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="200" y="299" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="290" y="299" text-anchor="middle" font-size="9" fill="#b85450">2≠3 ✗</text>
  <text x="390" y="299" text-anchor="middle" font-size="9" fill="#d6a040">翻转节点 1</text>
  <text x="510" y="299" text-anchor="middle" font-size="9" fill="#333">[1]</text>

  <rect x="30" y="308" width="560" height="22" fill="#fafafa" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="60" y="323" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="120" y="323" text-anchor="middle" font-size="9" fill="#333">3</text>
  <text x="200" y="323" text-anchor="middle" font-size="9" fill="#333">3</text>
  <text x="290" y="323" text-anchor="middle" font-size="9" fill="#888">无子</text>
  <text x="390" y="323" text-anchor="middle" font-size="9" fill="#4a7a3a">—</text>
  <text x="510" y="323" text-anchor="middle" font-size="9" fill="#333">[1]</text>

  <rect x="30" y="332" width="560" height="22" fill="#fafafa" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="60" y="347" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="120" y="347" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="200" y="347" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="290" y="347" text-anchor="middle" font-size="9" fill="#888">无子</text>
  <text x="390" y="347" text-anchor="middle" font-size="9" fill="#4a7a3a">完成</text>
  <text x="510" y="347" text-anchor="middle" font-size="9" fill="#333">[1]</text>
</svg>
