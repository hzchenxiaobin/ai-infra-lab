<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="7" markerHeight="7" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">头插一步：把负数节点 curr 摘下并顶到表头</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">prev 是 curr 的前驱；t = curr.next</text>

  <!-- ===== BEFORE row ===== -->
  <text x="24" y="76" font-size="11" fill="#888" font-weight="bold">before</text>
  <!-- nodes: head=0, 2, curr=-5, t=5, 10, -10 ; x=67,133,199,265,331,397 w=56 h=36 y=60 -->
  <rect x="67" y="60" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="95" y="84" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">0</text>
  <rect x="133" y="60" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="161" y="84" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">2</text>
  <rect x="199" y="60" width="56" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="227" y="84" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">−5</text>
  <rect x="265" y="60" width="56" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="293" y="84" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">5</text>
  <rect x="331" y="60" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="359" y="84" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">10</text>
  <rect x="397" y="60" width="56" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="425" y="84" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">−10</text>

  <!-- next pointers -->
  <path d="M123 78 L131 78" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M189 78 L197 78" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M255 78 L263 78" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M321 78 L329 78" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M387 78 L395 78" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- role labels under before -->
  <text x="95" y="110" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">head</text>
  <text x="161" y="110" text-anchor="middle" font-size="9.5" fill="#666">prev</text>
  <text x="227" y="110" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">curr</text>
  <text x="293" y="110" text-anchor="middle" font-size="9.5" fill="#d6a040">t</text>

  <!-- ===== three steps ===== -->
  <rect x="40" y="128" width="440" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="150" font-size="11" fill="#b85450" font-weight="bold">① prev.next = curr.next</text>
  <text x="60" y="166" font-size="10" fill="#555">prev 跨过 curr：2 → 5（把 curr 从原位置摘除）</text>
  <text x="60" y="182" font-size="10" fill="#555">② curr.next = head：curr 指向当前表头</text>
  <text x="300" y="150" font-size="11" fill="#b85450" font-weight="bold">③ head = curr</text>
  <text x="300" y="166" font-size="10" fill="#555">curr 成为新表头</text>
  <text x="300" y="182" font-size="10" fill="#555">prev 不动；curr ← t 继续扫描</text>

  <!-- arrow before -> steps -> after -->
  <path d="M260 114 L260 124" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== AFTER row ===== -->
  <text x="24" y="226" font-size="11" fill="#888" font-weight="bold">after</text>
  <rect x="67" y="210" width="56" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="95" y="234" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">−5</text>
  <rect x="133" y="210" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="161" y="234" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">0</text>
  <rect x="199" y="210" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="227" y="234" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">2</text>
  <rect x="265" y="210" width="56" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="293" y="234" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">5</text>
  <rect x="331" y="210" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="359" y="234" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">10</text>
  <rect x="397" y="210" width="56" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="425" y="234" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">−10</text>

  <!-- new link curr -> old head (red, curved up then down) -->
  <path d="M95 210 C 95 196, 120 196, 133 210" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <!-- prev -> t bridge (orange, curved) -->
  <path d="M189 228 C 210 244, 240 244, 263 228" stroke="#d6a040" stroke-width="2" fill="none" stroke-dasharray="4 3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <!-- remaining straight pointers -->
  <path d="M255 228 L263 228" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M321 228 L329 228" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M387 228 L395 228" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- role labels under after -->
  <text x="95" y="260" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">head=curr</text>
  <text x="161" y="260" text-anchor="middle" font-size="9.5" fill="#666">（旧 head）</text>
  <text x="227" y="260" text-anchor="middle" font-size="9.5" fill="#666">prev</text>
  <text x="293" y="260" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">curr=t</text>

  <!-- note box -->
  <rect x="40" y="278" width="440" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="300" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">关键：prev 在头插后「原地不动」</text>
  <text x="260" y="318" text-anchor="middle" font-size="10.5" fill="#555">因为 prev 之后仍可能遇到新的负数，它的前驱角色不变；</text>
  <text x="260" y="334" text-anchor="middle" font-size="10.5" fill="#555">只有遇到非负数时 prev 才随 curr 一起前进。故一趟扫描即可。</text>
</svg>
