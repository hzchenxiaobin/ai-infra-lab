<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">三个无重叠子数组最大和：算法流程</text>

  <!-- Step 1 -->
  <g filter="url(#rough2)">
    <rect x="110" y="48" width="300" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="260" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① 定长滑窗求 W[i] = sum(nums[i..i+k-1])</text>
    <text x="260" y="84" text-anchor="middle" font-size="10" fill="#666">W[i] = W[i−1] − nums[i−1] + nums[i+k−1]，O(n)</text>
  </g>
  <path d="M 260 92 L 260 114" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <g filter="url(#rough2)">
    <rect x="110" y="116" width="300" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="260" y="136" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">② 预处理 left[i]：W[0..i] 最大值下标</text>
    <text x="260" y="152" text-anchor="middle" font-size="10" fill="#666">从左到右扫，仅 W[i] &gt; W[left[i−1]] 更新（并列取小）</text>
  </g>
  <path d="M 260 160 L 260 182" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <g filter="url(#rough2)">
    <rect x="110" y="184" width="300" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="260" y="204" text-anchor="middle" font-size="12" fill="#a07820" font-weight="bold">③ 预处理 right[i]：W[i..m−1] 最大值下标</text>
    <text x="260" y="220" text-anchor="middle" font-size="10" fill="#666">从右到左扫，仅 W[i] ≥ W[right[i+1]] 更新（并列取小）</text>
  </g>
  <path d="M 260 228 L 260 250" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: loop -->
  <g filter="url(#rough2)">
    <polygon points="260,252 360,290 260,328 160,290" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="260" y="286" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">枚举 b ∈ [k, n−2k]</text>
    <text x="260" y="302" text-anchor="middle" font-size="10.5" fill="#b85450">a=left[b−k], c=right[b+k]</text>
  </g>
  <path d="M 260 328 L 260 350" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision -->
  <g filter="url(#rough2)">
    <polygon points="260,352 340,382 260,412 180,382" fill="#f6f6f6" stroke="#888" stroke-width="1.6"/>
    <text x="260" y="380" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">total &gt; best?</text>
    <text x="260" y="396" text-anchor="middle" font-size="9.5" fill="#888">严格更大才更新</text>
  </g>
  <!-- yes arrow back up to loop (left side) -->
  <path d="M 180 382 L 150 382 L 150 290 L 160 290" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="132" y="336" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">是 → 更新</text>
  <text x="132" y="350" text-anchor="middle" font-size="9" fill="#4a7a3a">ans=[a,b,c]</text>
  <!-- no arrow down -->
  <path d="M 260 412 L 260 432" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="424" font-size="9.5" fill="#888">否</text>

  <!-- loop back note + final -->
  <g filter="url(#rough2)">
    <rect x="190" y="434" width="140" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6"/>
    <text x="260" y="448" text-anchor="middle" font-size="10.5" fill="#3a5a2a" font-weight="bold">遍历完 → 返回 ans</text>
  </g>

  <!-- complexity box -->
  <rect x="20" y="48" width="76" height="100" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="58" y="68" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">复杂度</text>
  <text x="58" y="86" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">时间</text>
  <text x="58" y="100" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">O(n)</text>
  <text x="58" y="118" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">空间</text>
  <text x="58" y="132" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">O(n)</text>
</svg>
