<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：a = 4, b = 1</text>

  <!-- Table outer border -->
  <rect x="20" y="48" width="520" height="212" fill="none" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>

  <!-- Column headers background -->
  <rect x="20" y="48" width="520" height="32" fill="#e8f0fe" stroke="none" rx="6" filter="url(#rough2)"/>
  <rect x="20" y="72" width="520" height="8" fill="#e8f0fe" stroke="none" filter="url(#rough2)"/>
  <text x="42" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">步骤</text>
  <text x="82" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">a余</text>
  <text x="122" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">b余</text>
  <text x="172" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">末尾2字符</text>
  <text x="242" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">决策依据</text>
  <text x="312" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">写入</text>
  <text x="430" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">结果字符串</text>

  <!-- Column dividers -->
  <line x1="62" y1="48" x2="62" y2="260" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="102" y1="48" x2="102" y2="260" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="142" y1="48" x2="142" y2="260" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="202" y1="48" x2="202" y2="260" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="282" y1="48" x2="282" y2="260" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="342" y1="48" x2="342" y2="260" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row dividers -->
  <line x1="20" y1="80" x2="540" y2="80" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="116" x2="540" y2="116" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="152" x2="540" y2="152" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="188" x2="540" y2="188" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="224" x2="540" y2="224" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 1: step 1, a=4, b=1, tail=--, majority, write a -->
  <text x="42" y="102" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="82" y="102" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="122" y="102" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="172" y="102" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="242" y="102" text-anchor="middle" font-size="10" fill="#446688">多数优先</text>
  <text x="312" y="102" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">a</text>
  <rect x="362" y="90" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="376" y="105" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a</text>

  <!-- Row 2: step 2, a=3, b=1, tail="a", majority, write a -->
  <text x="42" y="138" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="82" y="138" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="122" y="138" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="172" y="138" text-anchor="middle" font-size="11" fill="#888">"a"</text>
  <text x="242" y="138" text-anchor="middle" font-size="10" fill="#446688">多数优先</text>
  <text x="312" y="138" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">a</text>
  <rect x="362" y="126" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="376" y="141" text-anchor="middle" font-size="11" fill="#333">a</text>
  <rect x="392" y="126" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="406" y="141" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a</text>

  <!-- Row 3: step 3, a=2, b=1, tail="aa", forced switch, write b -->
  <text x="42" y="174" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="82" y="174" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="122" y="174" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="172" y="174" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">"aa"</text>
  <text x="242" y="174" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">逢二必换!</text>
  <text x="312" y="174" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">b</text>
  <rect x="362" y="162" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="376" y="177" text-anchor="middle" font-size="11" fill="#333">a</text>
  <rect x="392" y="162" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="406" y="177" text-anchor="middle" font-size="11" fill="#333">a</text>
  <rect x="422" y="162" width="28" height="22" fill="#e6f4ea" stroke="#b85450" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="436" y="177" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">b</text>

  <!-- Row 4: step 4, a=2, b=0, tail="ab", majority, write a -->
  <text x="42" y="210" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="82" y="210" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="122" y="210" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="172" y="210" text-anchor="middle" font-size="11" fill="#888">"ab"</text>
  <text x="242" y="210" text-anchor="middle" font-size="10" fill="#446688">多数优先</text>
  <text x="312" y="210" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">a</text>
  <rect x="362" y="198" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="376" y="213" text-anchor="middle" font-size="11" fill="#333">a</text>
  <rect x="392" y="198" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="406" y="213" text-anchor="middle" font-size="11" fill="#333">a</text>
  <rect x="422" y="198" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="436" y="213" text-anchor="middle" font-size="11" fill="#333">b</text>
  <rect x="452" y="198" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="466" y="213" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a</text>

  <!-- Row 5: step 5, a=1, b=0, tail="ba", majority, write a -->
  <text x="42" y="246" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="82" y="246" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="122" y="246" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="172" y="246" text-anchor="middle" font-size="11" fill="#888">"ba"</text>
  <text x="242" y="246" text-anchor="middle" font-size="10" fill="#446688">多数优先</text>
  <text x="312" y="246" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">a</text>
  <rect x="362" y="234" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="376" y="249" text-anchor="middle" font-size="11" fill="#333">a</text>
  <rect x="392" y="234" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="406" y="249" text-anchor="middle" font-size="11" fill="#333">a</text>
  <rect x="422" y="234" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="436" y="249" text-anchor="middle" font-size="11" fill="#333">b</text>
  <rect x="452" y="234" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="466" y="249" text-anchor="middle" font-size="11" fill="#333">a</text>
  <rect x="482" y="234" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="496" y="249" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a</text>

  <!-- Bottom notes -->
  <text x="280" y="286" text-anchor="middle" font-size="11" fill="#888">多数优先：a &gt;= b 时写 'a'；逢二必换：末尾 "aa" 强制写 'b'（步骤 3 高亮）</text>
  <text x="280" y="308" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">最终结果 = "aabaa" ✓ （4 个 a，1 个 b，无 aaa / bbb）</text>
</svg>
