<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：双重循环填 dp 表，取全局最大</text>

  <!-- ===== init ===== -->
  <rect x="170" y="48" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="68" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">初始化</text>
  <text x="270" y="84" text-anchor="middle" font-size="10.5" fill="#555">ans = 0；dp 全 0（或 1D 数组）</text>
  <line x1="270" y1="92" x2="270" y2="112" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== outer loop i ===== -->
  <rect x="150" y="112" width="240" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="132" text-anchor="middle" font-size="11.5" fill="#3a5a2a" font-weight="bold">外层循环 i = 0 … n−1</text>
  <text x="270" y="148" text-anchor="middle" font-size="10.5" fill="#555">枚举第一个子串的结束位置</text>
  <line x1="270" y1="156" x2="270" y2="176" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== inner loop j ===== -->
  <rect x="150" y="176" width="240" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="196" text-anchor="middle" font-size="11.5" fill="#3a5a2a" font-weight="bold">内层循环 j = 0 … n−1</text>
  <text x="270" y="212" text-anchor="middle" font-size="10.5" fill="#555">枚举第二个子串的结束位置</text>
  <line x1="270" y1="220" x2="270" y2="240" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== decision diamond ===== -->
  <polygon points="270,240 370,290 270,340 170,290" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="282" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold">s[i] == s[j]</text>
  <text x="270" y="298" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold">且 i ≠ j ?</text>

  <!-- ===== yes branch ===== -->
  <line x1="170" y1="290" x2="120" y2="290" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="148" y="282" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="20" y="268" width="100" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="70" y="286" text-anchor="middle" font-size="10" fill="#3a5a2a" font-weight="bold">dp[i][j] =</text>
  <text x="70" y="302" text-anchor="middle" font-size="10" fill="#3a5a2a" font-weight="bold">dp[i−1][j−1]+1</text>

  <line x1="70" y1="312" x2="70" y2="372" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="20" y="372" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="70" y="393" text-anchor="middle" font-size="10" fill="#3a5a2a" font-weight="bold">ans = max(ans, dp)</text>

  <!-- ===== no branch ===== -->
  <line x1="370" y1="290" x2="420" y2="290" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="392" y="282" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <rect x="420" y="268" width="100" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="470" y="294" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">dp[i][j] = 0</text>

  <line x1="470" y1="312" x2="470" y2="372" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="420" y="372" width="100" height="34" fill="#f4f6f8" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="470" y="393" text-anchor="middle" font-size="10" fill="#888">不更新 ans</text>

  <!-- ===== merge arrows back to inner loop ===== -->
  <path d="M 70 406 Q 70 430 270 430 Q 470 430 470 406" stroke="#888" stroke-width="1.3" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <text x="270" y="448" text-anchor="middle" font-size="10" fill="#888">j++ → 内层循环继续；j 结束后 i++ → 外层循环继续</text>

  <!-- ===== complexity box ===== -->
  <rect x="100" y="156" width="80" height="20" fill="none" stroke="none"/>
  <text x="460" y="136" font-size="10" fill="#888">O(n²) 时间</text>
  <text x="460" y="200" font-size="10" fill="#888">O(n²) 或 O(n) 空间</text>
</svg>
