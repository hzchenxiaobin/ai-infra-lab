<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：单次遍历累加 + 奇数阶减中心</text>

  <!-- Start -->
  <ellipse cx="280" cy="50" rx="100" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="54" text-anchor="middle" font-size="11" fill="#333">sum = 0，n = mat.length，i = 0</text>

  <path d="M 280 68 L 280 82" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i < n? diamond -->
  <polygon points="280,82 384,108 280,134 176,108" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="104" text-anchor="middle" font-size="11" fill="#333">i &lt; n ?</text>
  <text x="280" y="120" text-anchor="middle" font-size="10" fill="#888">(还有行)</text>

  <!-- No -> right to check odd -->
  <path d="M 384 108 L 440 108" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="412" y="100" text-anchor="middle" font-size="10" fill="#b85450">否</text>

  <!-- Yes -> down -->
  <path d="M 280 134 L 280 156" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="150" font-size="10" fill="#82b366">是</text>

  <!-- sum += mat[i][i] + mat[i][n-1-i] -->
  <rect x="150" y="158" width="260" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="178" text-anchor="middle" font-size="11" fill="#333">sum += mat[i][i]</text>
  <text x="280" y="194" text-anchor="middle" font-size="11" fill="#333">     + mat[i][n − 1 − i]</text>

  <path d="M 280 202 L 280 216" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i++ -->
  <rect x="210" y="218" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="238" text-anchor="middle" font-size="11" fill="#333">i++，回到循环</text>

  <!-- loop back arrow -->
  <path d="M 210 233 L 56 233 L 56 108 L 176 108" stroke="#888" stroke-width="1.2" stroke-dasharray="5,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="48" y="170" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 48 170)">继续下一行</text>

  <!-- n odd? diamond at (490, 108) area, center (490,140) -->
  <path d="M 440 108 L 440 130" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="490,130 544,156 490,182 436,156" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490" y="152" text-anchor="middle" font-size="10.5" fill="#333">n 为奇数?</text>
  <text x="490" y="168" text-anchor="middle" font-size="9.5" fill="#888">(n &amp; 1)</text>

  <!-- Yes -> left to subtract center -->
  <path d="M 436 156 L 400 156 L 400 270 L 350 270" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="418" y="148" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>

  <!-- No -> down to return -->
  <path d="M 490 182 L 490 268" stroke="#82b366" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="504" y="222" font-size="10" fill="#82b366">否</text>

  <!-- Subtract center box -->
  <rect x="150" y="252" width="200" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="250" y="272" text-anchor="middle" font-size="11" fill="#333">sum −= mat[n/2][n/2]</text>
  <text x="250" y="286" text-anchor="middle" font-size="9.5" fill="#888">(减去重复的中心)</text>

  <path d="M 250 292 L 250 312 L 490 312 L 490 268" stroke="#888" stroke-width="1.2" stroke-dasharray="5,3" fill="none" filter="url(#rough2)"/>

  <!-- Merge to return -->
  <path d="M 490 312 L 490 326" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Return sum -->
  <rect x="400" y="328" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="490" y="348" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 sum ⭐</text>
  <text x="490" y="362" text-anchor="middle" font-size="10" fill="#888">主+副−(奇数中心)</text>

  <!-- Note -->
  <rect x="80" y="380" width="400" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="400" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">⚠️ 每行同时累加主、副两个元素；仅奇数阶需减一次中心</text>
</svg>
