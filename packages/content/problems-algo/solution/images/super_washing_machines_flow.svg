<svg xmlns="http://www.w3.org/2000/svg" width="780" height="600" viewBox="0 0 780 600" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="780" height="600" fill="#fdfcf7"/>
  <text x="390" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">超级洗衣机：一次线性扫描流程</text>
  <path d="M 250 42 Q 390 50 530 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 1. 求总和 -->
  <g filter="url(#sk)">
    <rect x="270" y="62" width="240" height="44" rx="22" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="390" y="89" text-anchor="middle" font-size="12.5" fill="#2b6e9e">total = Σ machines</text>
  <line x1="390" y1="106" x2="390" y2="128" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 2. 判断整除 -->
  <g filter="url(#sk)">
    <polygon points="390,130 540,180 390,230 240,180" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="390" y="178" text-anchor="middle" font-size="12.5" fill="#7a5415">total % n == 0 ?</text>
  <!-- 否：返回 -1 -->
  <text x="556" y="176" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <line x1="540" y1="180" x2="600" y2="180" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="602" y="158" width="130" height="44" rx="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="667" y="185" text-anchor="middle" font-size="13" fill="#b03a3a" font-weight="bold">返回 -1</text>
  <!-- 是：往下 -->
  <text x="372" y="248" font-size="11" fill="#2e6e2e" font-weight="bold">是</text>
  <line x1="390" y1="230" x2="390" y2="252" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 3. 算 target 并初始化 -->
  <g filter="url(#sk)">
    <rect x="240" y="254" width="300" height="50" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="390" y="276" text-anchor="middle" font-size="12" fill="#2e6e2e">target = total / n</text>
  <text x="390" y="294" text-anchor="middle" font-size="12" fill="#2e6e2e">balance = 0, ans = 0</text>
  <line x1="390" y1="304" x2="390" y2="326" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 4. for 循环 -->
  <g filter="url(#sk)">
    <rect x="250" y="328" width="280" height="48" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="390" y="357" text-anchor="middle" font-size="12.5" fill="#2e6e2e">for m in machines:</text>
  <line x1="390" y1="376" x2="390" y2="398" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 5. 算 flow 与 balance -->
  <g filter="url(#sk)">
    <rect x="230" y="400" width="320" height="62" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="390" y="422" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">flow = m - target</text>
  <text x="390" y="442" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">balance += flow</text>
  <text x="390" y="457" text-anchor="middle" font-size="10" fill="#6a96c0">flow=单机盈亏, balance=切口净流量</text>
  <line x1="390" y1="462" x2="390" y2="484" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 6. 更新 ans（决策菱形其实直接取 max） -->
  <g filter="url(#sk)">
    <rect x="210" y="486" width="360" height="52" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="390" y="508" text-anchor="middle" font-size="12" fill="#7a5415" font-family="monospace">ans = max(ans, |balance|, flow)</text>
  <text x="390" y="526" text-anchor="middle" font-size="10" fill="#a06a1a">两类下界同时维护，flow 不取绝对值</text>

  <!-- 回到 for -->
  <path d="M 210 512 L 150 512 L 150 352 L 250 352" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="96" y="430" font-size="10" fill="#888">下一台机器</text>

  <!-- 7. 返回 -->
  <line x1="570" y1="512" x2="630" y2="512" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="590" y="504" font-size="10" fill="#888">循环结束</text>
  <g filter="url(#sk)">
    <rect x="632" y="490" width="120" height="44" rx="22" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="692" y="517" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-weight="bold">返回 ans</text>

  <!-- 底部要点 -->
  <g filter="url(#sk)">
    <rect x="60" y="558" width="660" height="32" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="390" y="578" text-anchor="middle" font-size="11" fill="#444">
    <tspan font-weight="bold" fill="#2b6e9e">O(n)</tspan> 一趟扫描 ·
    <tspan font-weight="bold" fill="#b03a3a">|balance|</tspan> 管边切口 ·
    <tspan font-weight="bold" fill="#2e6e2e">flow</tspan> 管盈余机输出（亏缺机由两侧边供件，不单独成界）
  </text>
</svg>
