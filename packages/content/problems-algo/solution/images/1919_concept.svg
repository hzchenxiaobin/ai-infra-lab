<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：集合相等 = 公共数 = 各自数</text>

  <!-- ===== Case A: similar (1,2) on 2021-03-15 ===== -->
  <text x="40" y="60" font-size="12" fill="#4a7a3a" font-weight="bold">✓ 案例 A：好友 (1, 2) 在 03-15</text>

  <text x="40" y="86" font-size="11.5" fill="#888">user1 听歌集合 A：</text>
  <g font-size="13" fill="#333" text-anchor="middle">
    <rect x="40" y="94" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="62" y="114">10</text>
    <rect x="88" y="94" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="110" y="114">11</text>
    <rect x="136" y="94" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="158" y="114">12</text>
  </g>
  <text x="192" y="114" font-size="11.5" fill="#446688" font-weight="bold">|A| = 3</text>

  <text x="40" y="142" font-size="11.5" fill="#888">user2 听歌集合 B：</text>
  <g font-size="13" fill="#333" text-anchor="middle">
    <rect x="40" y="150" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="62" y="170">10</text>
    <rect x="88" y="150" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="110" y="170">11</text>
    <rect x="136" y="150" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="158" y="170">12</text>
  </g>
  <text x="192" y="170" font-size="11.5" fill="#4a7a3a" font-weight="bold">|B| = 3</text>

  <text x="40" y="198" font-size="11.5" fill="#888">公共部分 A ∩ B：</text>
  <g font-size="13" fill="#333" text-anchor="middle">
    <rect x="40" y="206" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="62" y="226">10</text>
    <rect x="88" y="206" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="110" y="226">11</text>
    <rect x="136" y="206" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="158" y="226">12</text>
  </g>
  <text x="192" y="226" font-size="11.5" fill="#b85450" font-weight="bold">|A∩B| = 3</text>

  <!-- equality check A -->
  <rect x="40" y="246" width="220" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="266" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3 = 3 = 3 → A = B → 相似 ✓</text>

  <!-- Divider -->
  <path d="M 300 50 L 300 300" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Case B: not similar (2,4) ===== -->
  <text x="320" y="60" font-size="12" fill="#b85450" font-weight="bold">✗ 案例 B：好友 (2, 4) 在 03-15</text>

  <text x="320" y="86" font-size="11.5" fill="#888">user2 集合 A：</text>
  <g font-size="13" fill="#333" text-anchor="middle">
    <rect x="320" y="94" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="342" y="114">10</text>
    <rect x="368" y="94" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="390" y="114">11</text>
    <rect x="416" y="94" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="438" y="114">12</text>
  </g>
  <text x="472" y="114" font-size="11.5" fill="#446688" font-weight="bold">|A| = 3</text>

  <text x="320" y="142" font-size="11.5" fill="#888">user4 集合 B：</text>
  <g font-size="13" fill="#333" text-anchor="middle">
    <rect x="320" y="150" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="342" y="170">10</text>
    <rect x="368" y="150" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="390" y="170">11</text>
    <rect x="416" y="150" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="438" y="170">13</text>
  </g>
  <text x="472" y="170" font-size="11.5" fill="#d6a040" font-weight="bold">|B| = 3</text>

  <text x="320" y="198" font-size="11.5" fill="#888">公共部分 A ∩ B：</text>
  <g font-size="13" fill="#333" text-anchor="middle">
    <rect x="320" y="206" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="342" y="226">10</text>
    <rect x="368" y="206" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="390" y="226">11</text>
  </g>
  <text x="472" y="226" font-size="11.5" fill="#b85450" font-weight="bold">|A∩B| = 2</text>

  <!-- equality check B -->
  <rect x="320" y="246" width="220" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="430" y="266" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2 ≠ 3 → A ≠ B → 不相似 ✗</text>

  <!-- Bottom: formula -->
  <path d="M 40 300 L 520 300" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <rect x="60" y="316" width="440" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="336" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">判定公式（同一日内）</text>
  <text x="280" y="354" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">A = B  ⟺  |A ∩ B| = |A| = |B|</text>

  <text x="60" y="384" font-size="11" fill="#555">• 同一天内两人各听 ≥1 首；公共歌数 = 各自歌数 → 集合完全相同</text>
  <text x="60" y="402" font-size="11" fill="#555">• 关键在「日」维度：(2,5) 各听 {10,11,12} 但不在同一天 → 不算相似</text>
  <text x="60" y="420" font-size="11" fill="#555">• 只比「是否有公共歌」会误判 (2,4)：公共 {10,11} 却各自还有独唱歌</text>
</svg>
