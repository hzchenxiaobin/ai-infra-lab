<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：均值 = 总商品 ÷ 总订单 —— 压缩表一次聚合，无需解压</text>

  <!-- 左：压缩表 -->
  <text x="131" y="48" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">Orders（压缩表：4 行）</text>

  <rect x="36" y="54" width="190" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="81" y="71" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">item_count</text>
  <text x="176" y="71" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">order_occurrences</text>

  <rect x="36" y="80" width="190" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="81" y="97" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="176" y="97" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">500</text>

  <rect x="36" y="106" width="190" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="81" y="123" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="176" y="123" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1000</text>

  <rect x="36" y="132" width="190" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="81" y="149" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="176" y="149" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">800</text>

  <rect x="36" y="158" width="190" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="81" y="175" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="176" y="175" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1000</text>

  <rect x="36" y="184" width="190" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="81" y="201" text-anchor="middle" font-size="11" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">合计</text>
  <text x="176" y="201" text-anchor="middle" font-size="11" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">3300</text>

  <line x1="126" y1="54" x2="126" y2="210" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="36" y="54" width="190" height="156" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- 右上：解压幻影（不需要） -->
  <rect x="318" y="64" width="170" height="100" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <text x="403" y="86" text-anchor="middle" font-size="12" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">解压成明细表？</text>
  <text x="403" y="106" text-anchor="middle" font-size="11" fill="#8f3a36" filter="url(#rough2)">3300 行（每行一单）</text>
  <text x="403" y="124" text-anchor="middle" font-size="11" fill="#8f3a36" filter="url(#rough2)">每行 × occurrences 份展开</text>
  <text x="403" y="146" text-anchor="middle" font-size="11" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">✗ 不必要！O(总订单)</text>

  <path d="M 228 116 C 252 112, 282 110, 312 110" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrO)" fill="none" filter="url(#rough2)"/>

  <!-- 右下：AVG 陷阱 -->
  <rect x="318" y="188" width="170" height="86" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="403" y="210" text-anchor="middle" font-size="11.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">陷阱：AVG(item_count)</text>
  <text x="403" y="230" text-anchor="middle" font-size="11" fill="#8f3a36" filter="url(#rough2)">= (1+2+3+4) ÷ 4 = 2.50</text>
  <text x="403" y="248" text-anchor="middle" font-size="10.5" fill="#8f3a36" filter="url(#rough2)">把「档位」当「订单」，</text>
  <text x="403" y="264" text-anchor="middle" font-size="10.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">✗ 权重全丢</text>

  <path d="M 403 166 L 403 184" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrO)" fill="none" filter="url(#rough2)"/>

  <!-- 左下：正解公式 -->
  <rect x="36" y="240" width="250" height="112" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="161" y="262" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓ 正解：加权平均（不用解压）</text>
  <text x="161" y="286" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">Σ item_count × occ</text>
  <line x1="86" y1="294" x2="236" y2="294" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="161" y="312" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">Σ occurrences</text>
  <text x="161" y="338" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">= 8900 / 3300 = 2.70 ✓</text>

  <path d="M 131 214 C 131 224, 126 230, 122 236" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
</svg>
