<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：一次遍历 + 末尾收集</text>
  <text x="260" y="48" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">线性流水线，仅在末尾对聚合表做一次「取最大」扫描</text>

  <!-- start oval -->
  <ellipse cx="200" cy="82" rx="36" ry="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="87" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>

  <!-- init -->
  <path d="M200,96 L200,106" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="70" y="106" width="260" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="123" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">total = {}, best = {}, maxPop = 0</text>

  <!-- read -->
  <path d="M200,132 L200,150" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="50" y="150" width="300" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="167" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">for i in [0, n)：读入 (c, id, v)</text>

  <!-- accumulate -->
  <path d="M200,176 L200,194" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="50" y="194" width="300" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="211" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">total[c] += v;  maxPop = max(maxPop, total[c])</text>

  <!-- conditional update -->
  <path d="M200,220 L200,238" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="40" y="238" width="320" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="253" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">若 v &gt; best[c].mv</text>
  <text x="200" y="267" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">或 (v == mv 且 id &lt; best[c].mi)：best[c] ← (v, id)</text>

  <!-- loop diamond -->
  <path d="M200,272 L200,280" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="200,280 282,306 200,332 118,306" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="310" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i + 1 &lt; n ?</text>

  <!-- Y loop back -->
  <path d="M118,306 L30,306 L30,163 L50,163" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="112" y="300" text-anchor="end" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">Y</text>
  <text x="40" y="156" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">i++ 继续 ↻</text>

  <!-- N branch down -->
  <path d="M200,332 L200,346" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="210" y="344" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">N</text>

  <!-- collect -->
  <rect x="50" y="346" width="300" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="363" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">收集 { [c, best[c].id] : total[c] == maxPop }</text>

  <!-- end -->
  <path d="M200,372 L200,384" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="200" cy="398" rx="48" ry="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="403" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">返回 ans</text>
</svg>
