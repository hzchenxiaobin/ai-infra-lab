<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="520" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">标签验证器算法流程（栈 + 单趟扫描）</text>

  <!-- Start -->
  <ellipse cx="280" cy="60" rx="100" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="12" fill="#333">code[0] == '&lt;' ? 否 → false</text>

  <path d="M 280 82 L 280 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Main loop entry -->
  <rect x="200" y="104" width="160" height="30" fill="#f4f4f4" stroke="#999" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="124" text-anchor="middle" font-size="11.5" fill="#555">i &lt; n ? 遍历字符串</text>

  <path d="M 280 134 L 280 152" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: code[i] == '<' ? -->
  <polygon points="280,156 400,196 280,236 160,196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="192" text-anchor="middle" font-size="12" fill="#333">code[i] == '&lt;' ?</text>
  <text x="280" y="208" text-anchor="middle" font-size="10.5" fill="#666">（否则 i++, 跳过普通字符）</text>

  <!-- Three branches -->
  <!-- Left: start tag -->
  <path d="M 160 196 L 100 196 L 100 248" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="188" font-size="10" fill="#82b366">字母</text>

  <rect x="36" y="252" width="128" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="100" y="272" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">起始标签</text>
  <text x="100" y="287" text-anchor="middle" font-size="10" fill="#555">提取到 '&gt;' 的名字</text>
  <text x="100" y="300" text-anchor="middle" font-size="10" fill="#555">校验 → push 栈</text>

  <!-- Center: cdata -->
  <path d="M 280 236 L 280 248" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="244" font-size="10" fill="#82b366">!</text>

  <rect x="216" y="252" width="128" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="280" y="272" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">CDATA</text>
  <text x="280" y="287" text-anchor="middle" font-size="10" fill="#555">栈空 → false</text>
  <text x="280" y="300" text-anchor="middle" font-size="10" fill="#555">跳到首个 ]]&gt; 之后</text>

  <!-- Right: end tag -->
  <path d="M 400 196 L 460 196 L 460 248" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="188" font-size="10" fill="#82b366">/</text>

  <rect x="396" y="252" width="128" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="460" y="272" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">结束标签</text>
  <text x="460" y="287" text-anchor="middle" font-size="10" fill="#555">名字 == 栈顶?</text>
  <text x="460" y="300" text-anchor="middle" font-size="10" fill="#555">pop → 栈空须到尾</text>

  <!-- Merge back to loop -->
  <path d="M 100 308 L 100 340 L 280 340 L 280 104" stroke="#666" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 308 L 280 340" stroke="#666" stroke-width="1.2" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 460 308 L 460 340 L 280 340" stroke="#666" stroke-width="1.2" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="300" y="335" font-size="9.5" fill="#999">回到循环</text>

  <!-- End check -->
  <path d="M 280 340 L 280 372" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="358" font-size="10" fill="#b85450">i == n</text>

  <!-- Final decision -->
  <polygon points="280,376 410,416 280,456 150,416" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="412" text-anchor="middle" font-size="12" fill="#333">栈为空?</text>
  <text x="280" y="428" text-anchor="middle" font-size="10.5" fill="#666">（所有标签已闭合）</text>

  <!-- Yes -->
  <path d="M 410 416 L 452 416" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="431" y="408" text-anchor="middle" font-size="11" fill="#82b366">是</text>
  <ellipse cx="500" cy="416" rx="42" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="500" y="420" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">true</text>

  <!-- No -->
  <path d="M 280 456 L 280 478" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="472" font-size="11" fill="#b85450">否</text>
  <ellipse cx="280" cy="500" rx="42" ry="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="504" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">false</text>
</svg>
