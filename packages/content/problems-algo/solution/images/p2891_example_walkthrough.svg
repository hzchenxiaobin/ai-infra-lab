<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：6 行过三关——去留 · 排序 · 投影</text>

  <!-- Panel A: filter -->
  <rect x="22" y="52" width="172" height="200" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="108" y="72" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">① 筛行 weight &gt; 100</text>

  <rect x="30" y="82" width="64" height="18" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="94" y="82" width="44" height="18" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="138" y="82" width="32" height="18" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="62" y="95" text-anchor="middle" font-size="9" fill="#ffffff" filter="url(#rough2)">name</text>
  <text x="116" y="95" text-anchor="middle" font-size="9" fill="#ffffff" filter="url(#rough2)">weight</text>
  <text x="154" y="95" text-anchor="middle" font-size="9" fill="#ffffff" filter="url(#rough2)">?</text>

  <rect x="30" y="100" width="64" height="18" fill="#e6f4ea" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="94" y="100" width="44" height="18" fill="#e6f4ea" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="138" y="100" width="32" height="18" fill="#e6f4ea" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="62" y="113" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Tatiana</text>
  <text x="116" y="113" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">464</text>
  <text x="154" y="113" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <rect x="30" y="118" width="64" height="18" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="94" y="118" width="44" height="18" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="138" y="118" width="32" height="18" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="62" y="131" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">Khaled</text>
  <text x="116" y="131" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">41</text>
  <text x="154" y="131" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <rect x="30" y="136" width="64" height="18" fill="#e6f4ea" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="94" y="136" width="44" height="18" fill="#e6f4ea" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="138" y="136" width="32" height="18" fill="#e6f4ea" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="62" y="149" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Alex</text>
  <text x="116" y="149" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">328</text>
  <text x="154" y="149" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <rect x="30" y="154" width="64" height="18" fill="#e6f4ea" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="94" y="154" width="44" height="18" fill="#e6f4ea" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="138" y="154" width="32" height="18" fill="#e6f4ea" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="62" y="167" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Jonathan</text>
  <text x="116" y="167" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">463</text>
  <text x="154" y="167" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <rect x="30" y="172" width="64" height="18" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="94" y="172" width="44" height="18" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="138" y="172" width="32" height="18" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="62" y="185" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">Stefan</text>
  <text x="116" y="185" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">50</text>
  <text x="154" y="185" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <rect x="30" y="190" width="64" height="18" fill="#e6f4ea" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="94" y="190" width="44" height="18" fill="#e6f4ea" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="138" y="190" width="32" height="18" fill="#e6f4ea" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="62" y="203" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Tommy</text>
  <text x="116" y="203" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">349</text>
  <text x="154" y="203" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <text x="108" y="230" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">Khaled(41)、Stefan(50) 被丢</text>
  <text x="108" y="244" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">6 行 → 4 行</text>

  <!-- Arrow A to B -->
  <path d="M 196 150 L 208 150" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Panel B: sort -->
  <rect x="210" y="52" width="172" height="200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="296" y="72" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">② 排序 weight 降序</text>

  <rect x="222" y="82" width="84" height="18" fill="#d6a040" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="306" y="82" width="56" height="18" fill="#d6a040" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="264" y="95" text-anchor="middle" font-size="9" fill="#ffffff" filter="url(#rough2)">name</text>
  <text x="334" y="95" text-anchor="middle" font-size="9" fill="#ffffff" filter="url(#rough2)">weight</text>

  <rect x="222" y="100" width="84" height="24" fill="#ffffff" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="306" y="100" width="56" height="24" fill="#ffffff" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="264" y="117" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">Tatiana</text>
  <text x="334" y="117" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">464</text>

  <rect x="222" y="124" width="84" height="24" fill="#ffffff" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="306" y="124" width="56" height="24" fill="#ffffff" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="264" y="141" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">Jonathan</text>
  <text x="334" y="141" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">463</text>

  <rect x="222" y="148" width="84" height="24" fill="#ffffff" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="306" y="148" width="56" height="24" fill="#ffffff" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="264" y="165" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">Tommy</text>
  <text x="334" y="165" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">349</text>

  <rect x="222" y="172" width="84" height="24" fill="#ffffff" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="306" y="172" width="56" height="24" fill="#ffffff" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="264" y="189" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">Alex</text>
  <text x="334" y="189" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">328</text>

  <text x="296" y="230" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">ascending=False</text>
  <text x="296" y="244" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">464 &gt; 463 &gt; 349 &gt; 328</text>

  <!-- Arrow B to C -->
  <path d="M 384 150 L 396 150" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Panel C: project -->
  <rect x="398" y="52" width="140" height="200" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="468" y="72" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">③ 投影 [['name']]</text>

  <rect x="410" y="82" width="116" height="18" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="468" y="95" text-anchor="middle" font-size="9" fill="#ffffff" filter="url(#rough2)">name</text>

  <rect x="410" y="100" width="116" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="468" y="117" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">Tatiana</text>

  <rect x="410" y="124" width="116" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="468" y="141" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">Jonathan</text>

  <rect x="410" y="148" width="116" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="468" y="165" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">Tommy</text>

  <rect x="410" y="172" width="116" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="468" y="189" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">Alex</text>

  <text x="468" y="230" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">weight 列投完就没了</text>
  <text x="468" y="244" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">投影必须放最后</text>

  <!-- Bottom notes -->
  <rect x="22" y="290" width="516" height="84" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="312" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">细节核对</text>
  <text x="280" y="334" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">严格大于：体重恰好 100 也不入选（&gt; 与 &gt;= 一字之差）</text>
  <text x="280" y="354" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[['name']] 双括号返回 DataFrame；单括号 ['name'] 降级成 Series，类型不符判错</text>
</svg>
