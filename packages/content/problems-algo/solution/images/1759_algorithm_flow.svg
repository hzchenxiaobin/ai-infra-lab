<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：单遍扫描，维护当前同字符段长度 len，逐位累加</text>

  <!-- Start oval -->
  <ellipse cx="280" cy="60" rx="50" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="65" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M 280 78 L 280 96" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init box -->
  <rect x="190" y="98" width="180" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="114" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans = 0,  len = 0</text>
  <text x="280" y="130" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">MOD = 10⁹+7</text>
  <path d="M 280 138 L 280 156" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop decision diamond -->
  <polygon points="280,158 360,196 280,234 200,196" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="192" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">还有字符</text>
  <text x="280" y="208" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">c = s[i] ?</text>

  <!-- No branch -> return -->
  <path d="M 360 196 L 440 196 L 440 250" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="396" y="188" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="384" y="252" width="112" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="440" y="273" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 ans % MOD</text>

  <!-- Yes branch down -->
  <path d="M 280 234 L 280 252" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="248" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- Decision: c == prev ? -->
  <polygon points="280,254 370,294 280,334 190,294" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="290" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">c == 上一个</text>
  <text x="280" y="306" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">字符 prev ?</text>

  <!-- Yes (same) -> len++ -->
  <path d="M 190 294 L 110 294" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="286" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="40" y="276" width="68" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="74" y="300" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">len += 1</text>

  <!-- No (different) -> len = 1 -->
  <path d="M 280 334 L 280 352 L 110 352 L 110 314" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="348" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="40" y="334" width="68" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="74" y="358" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">len = 1</text>

  <!-- merge to ans accumulation -->
  <path d="M 74 314 L 74 388 L 200 388" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 74 372 L 74 388 L 200 388" stroke="#666" stroke-width="2" fill="none" filter="url(#rough2)"/>

  <!-- ans accumulate box -->
  <rect x="200" y="372" width="200" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="396" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans = (ans + len) % MOD</text>

  <!-- loop back -->
  <path d="M 400 391 L 470 391 L 470 196 L 360 196" stroke="#666" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="478" y="300" font-size="11" fill="#888" filter="url(#rough2)">prev = c,</text>
  <text x="478" y="314" font-size="11" fill="#888" filter="url(#rough2)">i++，回到</text>
  <text x="478" y="328" font-size="11" fill="#888" filter="url(#rough2)">循环判断</text>

  <!-- footer note -->
  <rect x="40" y="424" width="0" height="0" fill="none"/>
  <text x="40" y="430" font-size="11" fill="#555" filter="url(#rough2)">💡 每步把「以 i 结尾的同质子串数」= len 直接累加，等价于每段贡献 1+2+…+k = k(k+1)/2</text>
</svg>
