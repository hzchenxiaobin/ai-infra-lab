<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：逐位取余，记录余数是否出现 2</text>

  <!-- ===== n = 12 band ===== -->
  <text x="34" y="62" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">n = 12</text>
  <!-- Step 1: n=12, r=0 -->
  <g filter="url(#rough2)">
    <rect x="80" y="42" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="108" y="58" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">n=12</text>
    <text x="108" y="76" text-anchor="middle" font-size="10" fill="#555">r=0</text>
  </g>
  <path d="M 138 64 L 152 64" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="145" y="56" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">÷3</text>
  <!-- Step 2: n=4, r=1 -->
  <g filter="url(#rough2)">
    <rect x="154" y="42" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="182" y="58" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">n=4</text>
    <text x="182" y="76" text-anchor="middle" font-size="10" fill="#555">r=1</text>
  </g>
  <path d="M 212 64 L 226 64" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="219" y="56" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">÷3</text>
  <!-- Step 3: n=1, r=1 -->
  <g filter="url(#rough2)">
    <rect x="228" y="42" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="256" y="58" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">n=1</text>
    <text x="256" y="76" text-anchor="middle" font-size="10" fill="#555">r=1</text>
  </g>
  <path d="M 286 64 L 300 64" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="293" y="56" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">÷3</text>
  <!-- n=0 stop -->
  <g filter="url(#rough2)">
    <rect x="302" y="42" width="50" height="44" fill="#fafafa" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3" rx="4"/>
    <text x="327" y="58" text-anchor="middle" font-size="10" fill="#888">n=0</text>
    <text x="327" y="76" text-anchor="middle" font-size="9" fill="#888">停</text>
  </g>
  <!-- result -->
  <g filter="url(#rough2)">
    <rect x="372" y="44" width="148" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="446" y="60" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">余数序列：0, 1, 1</text>
    <text x="446" y="76" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">三进制 110 → ✓ true</text>
  </g>

  <!-- ===== n = 91 band ===== -->
  <text x="34" y="120" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">n = 91</text>
  <!-- Step 1: n=91, r=1 -->
  <g filter="url(#rough2)">
    <rect x="80" y="100" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="108" y="116" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">n=91</text>
    <text x="108" y="134" text-anchor="middle" font-size="10" fill="#555">r=1</text>
  </g>
  <path d="M 138 122 L 152 122" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="145" y="114" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">÷3</text>
  <!-- Step 2: n=30, r=0 -->
  <g filter="url(#rough2)">
    <rect x="154" y="100" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="182" y="116" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">n=30</text>
    <text x="182" y="134" text-anchor="middle" font-size="10" fill="#555">r=0</text>
  </g>
  <path d="M 212 122 L 226 122" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="219" y="114" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">÷3</text>
  <!-- Step 3: n=10, r=1 -->
  <g filter="url(#rough2)">
    <rect x="228" y="100" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="256" y="116" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">n=10</text>
    <text x="256" y="134" text-anchor="middle" font-size="10" fill="#555">r=1</text>
  </g>
  <path d="M 286 122 L 300 122" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="293" y="114" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">÷3</text>
  <!-- Step 4: n=3, r=0 -->
  <g filter="url(#rough2)">
    <rect x="302" y="100" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="330" y="116" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">n=3</text>
    <text x="330" y="134" text-anchor="middle" font-size="10" fill="#555">r=0</text>
  </g>
  <path d="M 360 122 L 374 122" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="367" y="114" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">÷3</text>
  <!-- Step 5: n=1, r=1 -->
  <g filter="url(#rough2)">
    <rect x="376" y="100" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="404" y="116" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">n=1</text>
    <text x="404" y="134" text-anchor="middle" font-size="10" fill="#555">r=1</text>
  </g>
  <!-- result for 91 -->
  <g filter="url(#rough2)">
    <rect x="442" y="102" width="100" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="492" y="118" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">余数：1,0,1,0,1</text>
    <text x="492" y="134" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">10101 → ✓ true</text>
  </g>

  <!-- ===== n = 21 band ===== -->
  <text x="34" y="178" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">n = 21</text>
  <!-- Step 1: n=21, r=0 -->
  <g filter="url(#rough2)">
    <rect x="80" y="158" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="108" y="174" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">n=21</text>
    <text x="108" y="192" text-anchor="middle" font-size="10" fill="#555">r=0</text>
  </g>
  <path d="M 138 180 L 152 180" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="145" y="172" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">÷3</text>
  <!-- Step 2: n=7, r=1 -->
  <g filter="url(#rough2)">
    <rect x="154" y="158" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="182" y="174" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">n=7</text>
    <text x="182" y="192" text-anchor="middle" font-size="10" fill="#555">r=1</text>
  </g>
  <path d="M 212 180 L 226 180" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="219" y="172" text-anchor="middle" font-size="8" fill="#b85450" filter="url(#rough2)">÷3</text>
  <!-- Step 3: n=2, r=2 → FAIL -->
  <g filter="url(#rough2)">
    <rect x="228" y="158" width="56" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="256" y="174" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">n=2</text>
    <text x="256" y="192" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">r=2 ✗</text>
  </g>
  <!-- result for 21 -->
  <g filter="url(#rough2)">
    <rect x="302" y="160" width="180" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
    <text x="392" y="176" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">余数出现 2 → 立即返回</text>
    <text x="392" y="192" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">三进制 210 → ✗ false</text>
  </g>

  <!-- ===== Bottom: summary table ===== -->
  <rect x="40" y="220" width="480" height="200" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="280" y="242" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">逐步演算对照表</text>
  <line x1="52" y1="250" x2="508" y2="250" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- table header -->
  <g filter="url(#rough2)" font-size="9" fill="#888" font-weight="bold" text-anchor="middle">
    <text x="100" y="266">n</text>
    <text x="175" y="266">步骤序列 (n, r=n%3)</text>
    <text x="380" y="266">余数序列</text>
    <text x="470" y="266">结果</text>
  </g>
  <line x1="52" y1="272" x2="508" y2="272" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- n=12 row -->
  <g filter="url(#rough2)" font-size="9" fill="#555">
    <text x="100" y="290" text-anchor="middle" font-weight="bold" fill="#446688">12</text>
    <text x="175" y="290" text-anchor="middle">(12,0)→(4,1)→(1,1)→0</text>
    <text x="380" y="290" text-anchor="middle" fill="#4a7a3a">0, 1, 1</text>
    <text x="470" y="290" text-anchor="middle" fill="#4a7a3a" font-weight="bold">✓ true</text>
  </g>
  <line x1="52" y1="298" x2="508" y2="298" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- n=91 row -->
  <g filter="url(#rough2)" font-size="9" fill="#555">
    <text x="100" y="316" text-anchor="middle" font-weight="bold" fill="#446688">91</text>
    <text x="175" y="316" text-anchor="middle">(91,1)→(30,0)→(10,1)→(3,0)→(1,1)→0</text>
    <text x="380" y="316" text-anchor="middle" fill="#4a7a3a">1,0,1,0,1</text>
    <text x="470" y="316" text-anchor="middle" fill="#4a7a3a" font-weight="bold">✓ true</text>
  </g>
  <line x1="52" y1="324" x2="508" y2="324" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- n=21 row -->
  <g filter="url(#rough2)" font-size="9" fill="#555">
    <text x="100" y="342" text-anchor="middle" font-weight="bold" fill="#b85450">21</text>
    <text x="175" y="342" text-anchor="middle" fill="#b85450">(21,0)→(7,1)→(2,2✗)</text>
    <text x="380" y="342" text-anchor="middle" fill="#b85450">0, 1, 2</text>
    <text x="470" y="342" text-anchor="middle" fill="#b85450" font-weight="bold">✗ false</text>
  </g>
  <line x1="52" y1="350" x2="508" y2="350" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- insight -->
  <rect x="60" y="362" width="440" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="382" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">规律：只要某步余数为 2，n 必无法表示成不同的三的幂之和</text>
  <text x="280" y="400" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">余数序列逆序 = n 的三进制表示；全为 0/1 则 true，含 2 则 false</text>
</svg>
