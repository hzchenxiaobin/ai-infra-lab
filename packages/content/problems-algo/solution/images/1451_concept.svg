<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L8 5 L0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：稳定排序 —— 等长单词保留原序</text>

  <!-- 原句 -->
  <text x="40" y="62" font-size="12" fill="#666" font-weight="bold">原句</text>
  <g filter="url(#rough2)">
    <rect x="36" y="70" width="84" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="78" y="92" text-anchor="middle" font-size="13" fill="#333">Keep</text>
    <rect x="130" y="70" width="84" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="172" y="92" text-anchor="middle" font-size="13" fill="#333">calm</text>
    <rect x="224" y="70" width="84" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="266" y="92" text-anchor="middle" font-size="13" fill="#333">and</text>
    <rect x="318" y="70" width="84" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="360" y="92" text-anchor="middle" font-size="13" fill="#333">code</text>
    <rect x="412" y="70" width="84" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="454" y="92" text-anchor="middle" font-size="13" fill="#333">on</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#888" text-anchor="middle">
    <text x="78" y="120">len=4</text>
    <text x="172" y="120">len=4</text>
    <text x="266" y="120">len=3</text>
    <text x="360" y="120">len=4</text>
    <text x="454" y="120">len=2</text>
  </g>

  <!-- 排序箭头 -->
  <path d="M 266 130 L 266 156" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="282" y="148" font-size="11" fill="#446688" font-weight="bold">稳定排序（以长度为键）</text>

  <!-- 排序后 -->
  <text x="40" y="178" font-size="12" fill="#666" font-weight="bold">排序后</text>
  <g filter="url(#rough2)">
    <rect x="36" y="186" width="84" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="78" y="208" text-anchor="middle" font-size="13" fill="#333">on</text>
    <rect x="130" y="186" width="84" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="172" y="208" text-anchor="middle" font-size="13" fill="#333">and</text>
    <rect x="224" y="186" width="84" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="266" y="208" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">keep</text>
    <rect x="318" y="186" width="84" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="360" y="208" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">calm</text>
    <rect x="412" y="186" width="84" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="454" y="208" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">code</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#888" text-anchor="middle">
    <text x="78" y="236">len=2</text>
    <text x="172" y="236">len=3</text>
    <text x="266" y="236">len=4</text>
    <text x="360" y="236">len=4</text>
    <text x="454" y="236">len=4</text>
  </g>

  <!-- 长度=4 组的下划线括号 -->
  <path d="M 224 250 L 224 256 M 224 253 L 496 253 M 496 250 L 496 256" fill="none" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- 说明框 -->
  <rect x="120" y="276" width="320" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="298" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">长度=4 的三个词（橙色组）</text>
  <text x="280" y="318" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">keep → calm → code 仍按原句顺序</text>
</svg>
