<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="560" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [1,12,−5,−6,50,3]，k = 4</text>

  <!-- ====== 顶部：二分收敛过程 ====== -->
  <rect x="20" y="36" width="520" height="140" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="20" y="36" width="520" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="54" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">二分收敛：lo = −6, hi = 50</text>

  <!-- iteration table -->
  <text x="40" y="80" font-size="10" fill="#888" font-weight="bold">迭代</text>
  <text x="100" y="80" font-size="10" fill="#888" font-weight="bold">lo</text>
  <text x="160" y="80" font-size="10" fill="#888" font-weight="bold">hi</text>
  <text x="220" y="80" font-size="10" fill="#888" font-weight="bold">mid</text>
  <text x="290" y="80" font-size="10" fill="#888" font-weight="bold">check</text>
  <text x="370" y="80" font-size="10" fill="#888" font-weight="bold">动作</text>

  <!-- iter 1 -->
  <text x="40" y="100" font-size="10" fill="#333">1</text>
  <text x="100" y="100" font-size="10" fill="#333">−6</text>
  <text x="160" y="100" font-size="10" fill="#333">50</text>
  <text x="220" y="100" font-size="10" fill="#333">22.0</text>
  <text x="290" y="100" font-size="10" fill="#b85450" font-weight="bold">✗</text>
  <text x="370" y="100" font-size="10" fill="#b85450">hi = 22</text>

  <!-- iter 2 -->
  <text x="40" y="116" font-size="10" fill="#333">2</text>
  <text x="100" y="116" font-size="10" fill="#333">−6</text>
  <text x="160" y="116" font-size="10" fill="#333">22</text>
  <text x="220" y="116" font-size="10" fill="#333">8.0</text>
  <text x="290" y="116" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="370" y="116" font-size="10" fill="#4a7a3a">lo = 8</text>

  <!-- iter 3 -->
  <text x="40" y="132" font-size="10" fill="#333">3</text>
  <text x="100" y="132" font-size="10" fill="#333">8</text>
  <text x="160" y="132" font-size="10" fill="#333">22</text>
  <text x="220" y="132" font-size="10" fill="#333">15.0</text>
  <text x="290" y="132" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="370" y="132" font-size="10" fill="#4a7a3a">lo = 15</text>

  <!-- iter 4 -->
  <text x="40" y="148" font-size="10" fill="#333">4</text>
  <text x="100" y="148" font-size="10" fill="#333">15</text>
  <text x="160" y="148" font-size="10" fill="#333">22</text>
  <text x="220" y="148" font-size="10" fill="#333">18.5</text>
  <text x="290" y="148" font-size="10" fill="#b85450" font-weight="bold">✗</text>
  <text x="370" y="148" font-size="10" fill="#b85450">hi = 18.5</text>

  <!-- dots -->
  <text x="280" y="166" text-anchor="middle" font-size="11" fill="#888" font-style="italic">··· 收敛到 12.75 ···</text>

  <!-- ====== 下方：详细展示 iter 2 (mid=8) 的 check 过程 ====== -->
  <rect x="20" y="184" width="520" height="360" fill="#ffffff" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <rect x="20" y="184" width="520" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="202" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">详细：iter 2, mid = 8 → check(8) 过程</text>

  <!-- Step A: B 数组 -->
  <text x="36" y="228" font-size="10.5" fill="#555" font-weight="bold">① B[t] = nums[t] − 8：</text>

  <text x="36" y="252" font-size="10" fill="#888">nums:</text>
  <rect x="80" y="240" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="100" y="255" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="122" y="240" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="142" y="255" text-anchor="middle" font-size="10" fill="#333">12</text>
  <rect x="164" y="240" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="184" y="255" text-anchor="middle" font-size="10" fill="#333">−5</text>
  <rect x="206" y="240" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="226" y="255" text-anchor="middle" font-size="10" fill="#333">−6</text>
  <rect x="248" y="240" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="268" y="255" text-anchor="middle" font-size="10" fill="#333">50</text>
  <rect x="290" y="240" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="310" y="255" text-anchor="middle" font-size="10" fill="#333">3</text>

  <text x="36" y="280" font-size="10" fill="#888">B:</text>
  <rect x="80" y="268" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="100" y="283" text-anchor="middle" font-size="10" fill="#333">−7</text>
  <rect x="122" y="268" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="142" y="283" text-anchor="middle" font-size="10" fill="#333">4</text>
  <rect x="164" y="268" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="184" y="283" text-anchor="middle" font-size="10" fill="#333">−13</text>
  <rect x="206" y="268" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="226" y="283" text-anchor="middle" font-size="10" fill="#333">−14</text>
  <rect x="248" y="268" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="268" y="283" text-anchor="middle" font-size="10" fill="#333">42</text>
  <rect x="290" y="268" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="310" y="283" text-anchor="middle" font-size="10" fill="#333">−5</text>

  <text x="345" y="255" font-size="9.5" fill="#888" font-style="italic">每个元素减去 mid</text>
  <text x="345" y="270" font-size="9.5" fill="#888" font-style="italic">avg ≥ mid ⟺ ΣB ≥ 0</text>

  <!-- Step B: prefix sums -->
  <text x="36" y="312" font-size="10.5" fill="#555" font-weight="bold">② 前缀和 prefix[i+1] = Σ B[0..i]：</text>

  <text x="36" y="336" font-size="10" fill="#888">prefix:</text>
  <rect x="80" y="324" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="100" y="339" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="122" y="324" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="142" y="339" text-anchor="middle" font-size="10" fill="#333">−7</text>
  <rect x="164" y="324" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="184" y="339" text-anchor="middle" font-size="10" fill="#333">−3</text>
  <rect x="206" y="324" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="226" y="339" text-anchor="middle" font-size="10" fill="#333">−16</text>
  <rect x="248" y="324" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="268" y="339" text-anchor="middle" font-size="10" fill="#333">−30</text>
  <rect x="290" y="324" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="310" y="339" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">12</text>
  <rect x="332" y="324" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="352" y="339" text-anchor="middle" font-size="10" fill="#333">7</text>

  <text x="390" y="336" font-size="9" fill="#888">idx:</text>
  <text x="415" y="336" font-size="9" fill="#888">0  1   2   3   4   5   6</text>

  <!-- Step C: check with minPre -->
  <text x="36" y="372" font-size="10.5" fill="#555" font-weight="bold">③ 扫描检查 prefix[i+1] ≥ minPre（长度 ≥ k=4）：</text>

  <!-- i=3 (prefix[4]), first valid -->
  <rect x="36" y="382" width="470" height="28" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="400" font-size="10" fill="#555">i=3: prefix[4]=−30, minPre=prefix[0]=0</text>
  <text x="320" y="400" font-size="10" fill="#b85450" font-weight="bold">−30 ≥ 0? ✗</text>

  <!-- i=4 (prefix[5]), the hit! -->
  <rect x="36" y="414" width="470" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="50" y="434" font-size="10" fill="#333" font-weight="bold">i=4: prefix[5]=12, minPre=min(0, prefix[1])=min(0,−7)=−7</text>
  <text x="350" y="434" font-size="10.5" fill="#4a7a3a" font-weight="bold">12 ≥ −7? ✓ 命中!</text>

  <!-- highlight the subarray -->
  <path d="M 122 348 L 122 358 L 310 358 L 310 348" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <path d="M 122 268 L 122 248" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <path d="M 310 268 L 310 248" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <text x="36" y="464" font-size="10" fill="#555" font-weight="bold">④ 命中 → 子数组 B[1..4] = [4,−13,−14,42]，和 = 12−(−7) = 19 ≥ 0</text>
  <text x="36" y="482" font-size="10" fill="#888">对应 nums[1..4] = [12,−5,−6,50]，avg = 51/4 = 12.75 ≥ 8 ✓</text>

  <!-- conclusion -->
  <rect x="36" y="496" width="470" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="510" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">check(8) = true → lo = 8，继续向右搜更大值</text>
  <text x="280" y="526" text-anchor="middle" font-size="10.5" fill="#888">100 次迭代后 lo 收敛到 12.75000</text>
</svg>
