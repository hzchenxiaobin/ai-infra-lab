<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：取中位数 → 二分定位两个回文候选 → 代价取小</text>

  <!-- step 1 -->
  <rect x="90" y="52" width="340" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="75" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 排序 nums，取中位数 m = nums[(n−1)/2]</text>
  <path d="M 260 88 L 260 104" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 2 -->
  <rect x="90" y="108" width="340" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="131" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">② 预生成回文数表 pals（&lt; 10⁹，共 109998 个）</text>
  <path d="M 260 144 L 260 160" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 3 -->
  <rect x="90" y="164" width="340" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="187" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">③ 二分：i = lower_bound(pals, m)</text>

  <!-- split arrows -->
  <path d="M 240 200 L 160 226" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 280 200 L 360 226" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- step 4: two parallel candidate boxes -->
  <rect x="72" y="230" width="176" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="160" y="252" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">p_hi = pals[i]</text>
  <text x="160" y="270" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">≥ m 的最小回文数</text>
  <text x="160" y="286" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">（i 越界则无此候选）</text>

  <rect x="272" y="230" width="176" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="360" y="252" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">p_lo = pals[i−1]</text>
  <text x="360" y="270" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">≤ m 的最大回文数</text>
  <text x="360" y="286" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">（i = 0 则无此候选）</text>

  <!-- merge arrows -->
  <path d="M 160 294 L 240 322" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 360 294 L 280 322" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- step 5 -->
  <rect x="90" y="326" width="340" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="349" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">④ 计算代价 cost(y) = Σ |nums[j] − y|</text>
  <path d="M 260 362 L 260 378" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 6 -->
  <rect x="90" y="382" width="340" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="405" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⑤ 返回 min( cost(p_lo), cost(p_hi) )</text>
</svg>
