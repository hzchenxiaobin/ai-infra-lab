<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <g filter="url(#rough2)">
    <text x="280" y="22" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">算法流程：先铺 'z'，再按二进制位补字母</text>

    <!-- start -->
    <rect x="225" y="36" width="90" height="28" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="270" y="54" text-anchor="middle" font-size="11" fill="#333">开始</text>
    <path d="M 270 64 L 270 84" stroke="#446688" stroke-width="2" marker-end="url(#arr)" fill="none"/>

    <!-- A: for each x -->
    <rect x="170" y="86" width="200" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="270" y="105" text-anchor="middle" font-size="11" fill="#333">对每个 x ∈ nums</text>
    <path d="M 270 116 L 270 134" stroke="#446688" stroke-width="2" marker-end="url(#arr)" fill="none"/>

    <!-- B: z stage -->
    <rect x="155" y="136" width="230" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="270" y="155" text-anchor="middle" font-size="11" fill="#2f5527">s ← 'z' × (x ÷ 2^25)（贪心铺满）</text>
    <path d="M 270 166 L 270 184" stroke="#446688" stroke-width="2" marker-end="url(#arr)" fill="none"/>

    <!-- C: remainder -->
    <rect x="155" y="186" width="230" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="270" y="205" text-anchor="middle" font-size="11" fill="#333">r ← x mod 2^25；k ← 24</text>
    <path d="M 270 216 L 270 238" stroke="#446688" stroke-width="2" marker-end="url(#arr)" fill="none"/>

    <!-- D1: k < 0 ? -->
    <polygon points="270,240 370,268 270,296 170,268" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="270" y="272" text-anchor="middle" font-size="11" fill="#8a6d1f">k &lt; 0 ？</text>

    <!-- E: collect -->
    <path d="M 370 268 L 413 268" stroke="#446688" stroke-width="2" marker-end="url(#arr)" fill="none"/>
    <text x="391" y="260" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>
    <rect x="415" y="253" width="130" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="480" y="272" text-anchor="middle" font-size="11" fill="#2f5527">收集 s 到 ans</text>
    <text x="480" y="300" text-anchor="middle" font-size="9" fill="#b85450">x 用完 → 返回 ans</text>

    <!-- loop back E -> A -->
    <path d="M 480 253 L 480 101 L 374 101" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" fill="none"/>
    <text x="488" y="165" font-size="9.5" fill="#4a7a3a">下一个 x</text>

    <!-- D1 no -> D2 -->
    <path d="M 270 296 L 270 322" stroke="#446688" stroke-width="2" marker-end="url(#arr)" fill="none"/>
    <text x="280" y="314" font-size="10" fill="#8a6d1f">否</text>

    <!-- D2: bit set ? -->
    <polygon points="270,324 375,352 270,380 165,352" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="270" y="356" text-anchor="middle" font-size="11" fill="#8a6d1f">r 的第 k 位 = 1 ？</text>

    <!-- G: append letter -->
    <path d="M 375 352 L 420 352" stroke="#446688" stroke-width="2" marker-end="url(#arr)" fill="none"/>
    <text x="397" y="344" text-anchor="middle" font-size="10" fill="#b85450">是</text>
    <rect x="422" y="337" width="125" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="484" y="356" text-anchor="middle" font-size="11" fill="#8a3a35" font-weight="bold">s += 'a' + k</text>

    <!-- loop back G -> D1, and D2-no joins -->
    <path d="M 484 367 L 484 398 L 100 398 L 100 268 L 166 268" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" fill="none"/>
    <path d="M 165 352 L 100 352" stroke="#b85450" stroke-width="2" fill="none"/>
    <text x="130" y="344" text-anchor="middle" font-size="10" fill="#8a6d1f">否</text>
    <text x="290" y="392" text-anchor="middle" font-size="9.5" fill="#b85450">k ← k − 1，回到上方继续检查</text>
  </g>
</svg>
