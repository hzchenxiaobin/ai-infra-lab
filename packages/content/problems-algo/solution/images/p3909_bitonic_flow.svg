<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrF" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">流程：找峰 → 求和 → 比较（O(n) 时间 / O(1) 空间）</text>

  <!-- start -->
  <rect x="180" y="36" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="280" y="57" text-anchor="middle" font-size="12" fill="#333">开始：输入双调数组 nums</text>
  <path d="M 280 68 L 280 80" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- step 1: find peak -->
  <rect x="150" y="84" width="260" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="101" text-anchor="middle" font-size="11.5" fill="#a87020" font-weight="bold">① 找峰值 p：第一处下降的前一个下标</text>
  <text x="280" y="115" text-anchor="middle" font-size="10.5" fill="#a87020">while nums[p] &lt; nums[p+1]: p++</text>
  <path d="M 280 122 L 280 134" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- step 2: total -->
  <rect x="150" y="138" width="260" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="159" text-anchor="middle" font-size="11.5" fill="#3a5a2a">② total = 全数组求和</text>
  <path d="M 280 172 L 280 184" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- step 3: asc -->
  <rect x="150" y="188" width="260" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="209" text-anchor="middle" font-size="11.5" fill="#446688">③ asc = nums[0..p] 求和</text>
  <path d="M 280 222 L 280 234" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- step 4: desc -->
  <rect x="150" y="238" width="260" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="252" text-anchor="middle" font-size="11.5" fill="#446688">④ desc = total − asc + nums[p]</text>
  <text x="280" y="266" text-anchor="middle" font-size="10.5" fill="#446688">（峰值被 ②③ 各扣一次，补回一次）</text>
  <path d="M 280 272 L 280 284" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- decision 1 -->
  <polygon points="280,288 372,316 280,344 188,316" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">asc &gt; desc ?</text>

  <path d="M 372 316 L 438 316" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="404" y="308" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">是</text>
  <rect x="442" y="298" width="90" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="487" y="320" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">返回 0</text>

  <path d="M 280 344 L 280 376" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="292" y="364" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <!-- decision 2 -->
  <polygon points="280,380 372,408 280,436 188,408" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="412" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">desc &gt; asc ?</text>

  <path d="M 372 408 L 438 408" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="404" y="400" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">是</text>
  <rect x="442" y="390" width="90" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="487" y="412" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">返回 1</text>

  <path d="M 280 436 L 280 448" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="292" y="446" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="235" y="450" width="90" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="468" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">返回 −1</text>
</svg>
