<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    示例演算：parents = [-1,0,1,1]
  </text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">
    queries = [[0,2],[3,2],[2,5]]  →  ans = [2,3,7]
  </text>

  <!-- ===== Table header ===== -->
  <rect x="30" y="58" width="500" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="76" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">DFS 步骤</text>
  <text x="175" y="76" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">操作</text>
  <text x="290" y="76" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">Trie 内容</text>
  <text x="415" y="76" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">查询</text>
  <text x="500" y="76" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">结果</text>

  <!-- Row 1: enter 0 -->
  <rect x="30" y="86" width="500" height="26" fill="#f7f7f7" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="80" y="104" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">enter 0</text>
  <text x="175" y="104" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">+0</text>
  <text x="290" y="104" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">{0}</text>
  <text x="415" y="104" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">q0: val=2</text>
  <text x="500" y="104" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">2</text>

  <!-- Row 2: enter 1 -->
  <rect x="30" y="114" width="500" height="26" fill="#ffffff" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="80" y="132" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">enter 1</text>
  <text x="175" y="132" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">+1</text>
  <text x="290" y="132" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">{0, 1}</text>
  <text x="415" y="132" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">—</text>
  <text x="500" y="132" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">—</text>

  <!-- Row 3: enter 2 (highlight) -->
  <rect x="30" y="142" width="500" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="160" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">enter 2</text>
  <text x="175" y="160" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">+2</text>
  <text x="290" y="160" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">{0, 1, 2}</text>
  <text x="415" y="160" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">q2: val=5</text>
  <text x="500" y="160" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">7</text>

  <!-- Row 4: exit 2 -->
  <rect x="30" y="170" width="500" height="26" fill="#f7f7f7" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="80" y="188" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">exit 2</text>
  <text x="175" y="188" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">−2</text>
  <text x="290" y="188" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">{0, 1}</text>
  <text x="415" y="188" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">—</text>
  <text x="500" y="188" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">—</text>

  <!-- Row 5: enter 3 (highlight) -->
  <rect x="30" y="198" width="500" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="216" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">enter 3</text>
  <text x="175" y="216" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">+3</text>
  <text x="290" y="216" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">{0, 1, 3}</text>
  <text x="415" y="216" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">q1: val=2</text>
  <text x="500" y="216" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">3</text>

  <!-- Row 6: exit 3 -->
  <rect x="30" y="226" width="500" height="26" fill="#f7f7f7" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="80" y="244" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">exit 3</text>
  <text x="175" y="244" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">−3</text>
  <text x="290" y="244" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">{0, 1}</text>
  <text x="415" y="244" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">—</text>
  <text x="500" y="244" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">—</text>

  <!-- Row 7: exit 1 -->
  <rect x="30" y="254" width="500" height="26" fill="#ffffff" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="80" y="272" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">exit 1</text>
  <text x="175" y="272" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">−1</text>
  <text x="290" y="272" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">{0}</text>
  <text x="415" y="272" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">—</text>
  <text x="500" y="272" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">—</text>

  <!-- Row 8: exit 0 -->
  <rect x="30" y="282" width="500" height="26" fill="#f7f7f7" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="80" y="300" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">exit 0</text>
  <text x="175" y="300" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">−0</text>
  <text x="290" y="300" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">{ }</text>
  <text x="415" y="300" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">—</text>
  <text x="500" y="300" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">—</text>

  <!-- ===== Bottom: Trie greedy detail for q2 ===== -->
  <rect x="30" y="320" width="500" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="340" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">
    Trie 贪心查询 q2（val=5, Trie={0,1,2}，用 3 位演示）
  </text>
  <text x="50" y="358" font-size="9" fill="#333" filter="url(#rough2)">bit2: x=1, want=0 → {0,1,2} 均 bit2=0 → 走 0，val |= 100 = 4</text>
  <text x="50" y="374" font-size="9" fill="#333" filter="url(#rough2)">bit1: x=0, want=1 → 2(010) bit1=1 → 走 1，val |= 010 = 6</text>
  <text x="50" y="390" font-size="9" fill="#333" filter="url(#rough2)">bit0: x=1, want=0 → 2(010) bit0=0 → 走 0，val |= 001 = 7</text>
  <text x="440" y="390" font-size="10" fill="#b85450" filter="url(#rough2)">5⊕2=7 ✓</text>
</svg>
