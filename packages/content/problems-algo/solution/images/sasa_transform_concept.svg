<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心转换：均值相等 ⟺ 子集和为零</text>

  <!-- Box 1: original condition -->
  <rect x="100" y="44" width="340" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">avg(A) == avg(B)</text>
  <text x="270" y="82" text-anchor="middle" font-size="10" fill="#888">A, B 是 nums 的非空划分</text>

  <!-- arrow 1 -->
  <path d="M 270 96 L 270 112" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="108" font-size="9" fill="#888">B = nums \ A</text>

  <!-- Box 2: avg(A) == avg(nums) with algebra -->
  <rect x="50" y="116" width="440" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="138" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">代数推导：avg(A) == avg(nums)</text>
  <text x="270" y="158" text-anchor="middle" font-size="11" fill="#444">sum(A) / |A| = (total − sum(A)) / (n − |A|)</text>
  <text x="270" y="176" text-anchor="middle" font-size="10" fill="#888">交叉相乘 ↓</text>
  <text x="270" y="194" text-anchor="middle" font-size="11" fill="#444">sum(A)·n − sum(A)·|A| = total·|A| − sum(A)·|A|</text>
  <text x="270" y="214" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">⇒  sum(A)·n = total·|A|</text>

  <!-- arrow 2 -->
  <path d="M 270 230 L 270 246" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="242" font-size="9" fill="#888">移项</text>

  <!-- Box 3: define b[i] -->
  <rect x="70" y="250" width="400" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="272" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">令 b[i] = nums[i]·n − total</text>
  <text x="270" y="292" text-anchor="middle" font-size="11" fill="#444">则 Σ b[i] (i∈A) = n·sum(A) − total·|A|</text>
  <text x="270" y="312" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">⇒  找子集 A 使 Σ b[i] = 0</text>

  <!-- arrow 3 -->
  <path d="M 270 334 L 270 350" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 4: constraints -->
  <rect x="80" y="354" width="380" height="86" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="376" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">约束：A 非空且非全集</text>
  <text x="270" y="396" text-anchor="middle" font-size="10" fill="#555">空集 Σb=0 → 排除（|A|=0）</text>
  <text x="270" y="414" text-anchor="middle" font-size="10" fill="#555">全集 Σb=0 → 排除（|A|=n）</text>
  <text x="270" y="432" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">需 1 ≤ |A| ≤ n−1</text>
</svg>
