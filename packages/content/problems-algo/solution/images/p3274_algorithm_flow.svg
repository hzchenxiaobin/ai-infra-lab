<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：比较两个坐标的「列+行」奇偶位</text>
  <rect x="175" y="46" width="170" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="66" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">输入 coordinate1、coordinate2</text>
  <path d="M260,78 L260,98" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <rect x="130" y="100" width="260" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="119" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">解析下标：c = s[0]−'a'，r = s[1]−'1'</text>
  <text x="260" y="139" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">（a→0 … h→7，'1'→0 … '8'→7）</text>
  <path d="M260,146 L260,166" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <rect x="110" y="168" width="300" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="190" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">p1 = (c1 + r1) mod 2　　p2 = (c2 + r2) mod 2</text>
  <path d="M260,204 L260,224" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <polygon points="260,224 352,258 260,292 168,258" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="263" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">p1 == p2 ?</text>
  <path d="M168,258 L152,258" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="160" y="250" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="36" y="243" width="114" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="93" y="262" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 true（同色）</text>
  <path d="M352,258 L368,258" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="360" y="250" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="370" y="243" width="114" height="30" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="427" y="262" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 false（异色）</text>
  <rect x="55" y="312" width="410" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="331" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">一行流：(s1[0] + s1[1] + s2[0] + s2[1]) mod 2 == 0</text>
  <text x="260" y="348" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">固定偏移 'a'+'1' 对两个坐标同时生效，模 2 比较下抵消 → 字符码直接相加</text>
</svg>