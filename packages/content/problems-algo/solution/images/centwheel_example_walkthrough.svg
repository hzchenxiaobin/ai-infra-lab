<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：customers=[8,3]，boardingCost=5，runningCost=6</text>

  <!-- ===== Table header ===== -->
  <rect x="30" y="50" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">轮次</text>

  <rect x="110" y="50" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">到达</text>

  <rect x="190" y="50" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">登舱</text>

  <rect x="270" y="50" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="315" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">剩余等待</text>

  <rect x="360" y="50" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="405" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">本轮净收益</text>

  <rect x="450" y="50" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="490" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">累计利润</text>

  <!-- ===== Row 0 ===== -->
  <rect x="30" y="84" width="80" height="32" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="105" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>

  <rect x="110" y="84" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="150" y="105" text-anchor="middle" font-size="11" fill="#333">+8</text>

  <rect x="190" y="84" width="80" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="230" y="105" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>

  <rect x="270" y="84" width="90" height="32" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="315" y="105" text-anchor="middle" font-size="11" fill="#333">4</text>

  <rect x="360" y="84" width="90" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="405" y="105" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+14</text>

  <rect x="450" y="84" width="80" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="490" y="105" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">14</text>

  <!-- ===== Row 1 ===== -->
  <rect x="30" y="120" width="80" height="32" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="141" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>

  <rect x="110" y="120" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="150" y="141" text-anchor="middle" font-size="11" fill="#333">+3</text>

  <rect x="190" y="120" width="80" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="230" y="141" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>

  <rect x="270" y="120" width="90" height="32" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="315" y="141" text-anchor="middle" font-size="11" fill="#333">3</text>

  <rect x="360" y="120" width="90" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="405" y="141" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+14</text>

  <rect x="450" y="120" width="80" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="490" y="141" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">28</text>

  <!-- ===== Row 2 (MAX) ===== -->
  <rect x="30" y="156" width="80" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="177" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>

  <rect x="110" y="156" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="150" y="177" text-anchor="middle" font-size="11" fill="#333">0</text>

  <rect x="190" y="156" width="80" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="177" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>

  <rect x="270" y="156" width="90" height="32" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="315" y="177" text-anchor="middle" font-size="11" fill="#333">0</text>

  <rect x="360" y="156" width="90" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="405" y="177" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+9</text>

  <rect x="450" y="156" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="490" y="177" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">37</text>

  <!-- MAX arrow on row 2 cumulative -->
  <text x="538" y="177" font-size="9" fill="#4a7a3a" font-weight="bold">←最大</text>

  <!-- ===== Row 3 ===== -->
  <rect x="30" y="192" width="80" height="32" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="213" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">3</text>

  <rect x="110" y="192" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="150" y="213" text-anchor="middle" font-size="11" fill="#888">0</text>

  <rect x="190" y="192" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="230" y="213" text-anchor="middle" font-size="11" fill="#888">0</text>

  <rect x="270" y="192" width="90" height="32" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="315" y="213" text-anchor="middle" font-size="11" fill="#888">0</text>

  <rect x="360" y="192" width="90" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="405" y="213" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−6</text>

  <rect x="450" y="192" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="490" y="213" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">31</text>

  <!-- ===== Calculation note ===== -->
  <rect x="30" y="240" width="500" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="261" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">本轮净收益 = boardingCost × 登舱数 − runningCost</text>
  <text x="280" y="279" text-anchor="middle" font-size="10" fill="#555">轮次 2：5 × 3 − 6 = +9 → 累计 28 + 9 = 37（登不满 4 人仍盈利，因 3 × 5 = 15 &gt; 6）</text>
  <text x="280" y="294" text-anchor="middle" font-size="10" fill="#555">轮次 3：无人登舱仍要付运行成本 → 净亏 −6，应在此前停止</text>

  <!-- ===== Answer ===== -->
  <rect x="30" y="312" width="500" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="335" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">答案：3 次轮转，最大利润 = 37</text>
  <text x="280" y="355" text-anchor="middle" font-size="10" fill="#555">累计利润在轮次 2 达到最大 37，之后下降；取达到最大值的最小轮次</text>
</svg>
