<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">算法流程：逐格扫描，k = 0, 1, 2 三层各自转移</text>

  <!-- A: init -->
  <rect x="105" y="32" width="310" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="53" text-anchor="middle" font-size="10.5" fill="#2d5523" filter="url(#rough2)">初始化：dp[0][0][0] = coins[0][0]</text>
  <text x="260" y="70" text-anchor="middle" font-size="10.5" fill="#2d5523" filter="url(#rough2)">若起点为负数，再设 dp[0][0][1] = 0（起点也能感化）</text>
  <path d="M 260 76 L 260 88" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B: scan cells -->
  <rect x="140" y="88" width="240" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="105" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">按行序遍历每个格子 (i,j)（跳过起点）</text>
  <path d="M 260 114 L 260 126" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- C: layers -->
  <rect x="140" y="126" width="240" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="143" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">对该格的每层 k = 0, 1, 2 分别转移</text>
  <path d="M 260 152 L 260 164" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D: gather same layer -->
  <rect x="110" y="164" width="300" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="182" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">best = max(上格 dp[i−1][j][k], 左格 dp[i][j−1][k])</text>
  <path d="M 260 192 L 260 204" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- E: candidate 1 -->
  <rect x="110" y="204" width="300" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="222" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">cand₁ = best + coins[i][j]（不感化，照常加）</text>
  <path d="M 260 232 L 260 244" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- F: decision -->
  <polygon points="260,244 345,272 260,300 175,272" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="268" text-anchor="middle" font-size="10.5" fill="#7a5a18" filter="url(#rough2)">coins[i][j] &lt; 0</text>
  <text x="260" y="284" text-anchor="middle" font-size="10.5" fill="#7a5a18" filter="url(#rough2)">且 k ≥ 1 ?</text>

  <!-- yes branch -->
  <text x="349" y="264" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 345 272 L 360 272" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="362" y="246" width="130" height="52" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="427" y="264" text-anchor="middle" font-size="9.5" fill="#2d5523" filter="url(#rough2)">cand₂ = k−1 层</text>
  <text x="427" y="278" text-anchor="middle" font-size="9.5" fill="#2d5523" filter="url(#rough2)">来源 + 0</text>
  <text x="427" y="292" text-anchor="middle" font-size="9.5" fill="#2d5523" filter="url(#rough2)">（感化本格强盗）</text>
  <path d="M 427 298 L 427 322 L 413 322" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- no branch -->
  <text x="270" y="312" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 260 300 L 260 316" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- H: write state -->
  <rect x="110" y="316" width="300" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="334" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">dp[i][j][k] = max(cand₁, cand₂)</text>
  <path d="M 260 344 L 260 356" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- end -->
  <rect x="130" y="356" width="260" height="40" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="373" text-anchor="middle" font-size="10.5" fill="#2d5523" filter="url(#rough2)">所有格子、所有 k 层处理完</text>
  <text x="260" y="389" text-anchor="middle" font-size="10.5" fill="#2d5523" filter="url(#rough2)">返回 max dp[m−1][n−1][0..2]</text>
</svg>
