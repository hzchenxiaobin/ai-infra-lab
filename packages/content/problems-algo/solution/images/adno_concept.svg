<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrC" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：哈希预处理 + 计数器取模</text>

  <text x="30" y="62" font-size="11" fill="#446688" filter="url(#rough2)">products</text>
  <rect x="95" y="48" width="38" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="114" y="64" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="137" y="48" width="38" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="156" y="64" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="179" y="48" width="38" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="198" y="64" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="221" y="48" width="38" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="64" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="268" y="64" font-size="11" fill="#888" filter="url(#rough2)">…</text>

  <text x="30" y="100" font-size="11" fill="#4a7a3a" filter="url(#rough2)">prices</text>
  <rect x="95" y="86" width="38" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="114" y="102" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">100</text>
  <rect x="137" y="86" width="38" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="156" y="102" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">200</text>
  <rect x="179" y="86" width="38" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="198" y="102" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">300</text>
  <rect x="221" y="86" width="38" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="102" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">400</text>
  <text x="268" y="102" font-size="11" fill="#888" filter="url(#rough2)">…</text>

  <text x="114" y="126" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">i=0</text>
  <text x="156" y="126" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">i=1</text>
  <text x="198" y="126" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">i=2</text>
  <text x="240" y="126" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">i=3</text>

  <path d="M268,98 L335,98" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrC)" filter="url(#rough2)"/>
  <text x="300" y="92" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">建表</text>

  <rect x="340" y="48" width="200" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="440" y="68" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">HashMap</text>
  <text x="360" y="88" font-size="10" fill="#333" filter="url(#rough2)">1 → 100</text>
  <text x="360" y="104" font-size="10" fill="#333" filter="url(#rough2)">2 → 200</text>
  <text x="360" y="120" font-size="10" fill="#333" filter="url(#rough2)">3 → 300, 4 → 400, …</text>
  <text x="440" y="140" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">查询 O(1)</text>

  <rect x="30" y="160" width="500" height="180" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="184" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">计数器取模：每隔 n 个顾客打折（n=3 示例）</text>

  <text x="45" y="212" font-size="11" fill="#333" filter="url(#rough2)">count：</text>
  <rect x="95" y="198" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="214" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="133" y="198" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="214" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="171" y="198" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="188" y="214" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">3</text>
  <rect x="209" y="198" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="226" y="214" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="247" y="198" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="264" y="214" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <rect x="285" y="198" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="302" y="214" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">6</text>
  <rect x="323" y="198" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="214" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>
  <text x="365" y="214" font-size="11" fill="#888" filter="url(#rough2)">…</text>

  <text x="188" y="240" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">3%3=0 ✓</text>
  <text x="302" y="240" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">6%3=0 ✓</text>

  <rect x="50" y="256" width="460" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="278" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">count % n == 0 → 打折</text>

  <rect x="50" y="298" width="460" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">实付 = 原始金额 × (100 − discount) / 100</text>

</svg>
