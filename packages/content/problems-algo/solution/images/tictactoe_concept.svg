<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD2" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto">
      <path d="M0,0 L4,6 L8,0" fill="none" stroke="#b85450" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：获胜者必为最后落子者</text>

  <!-- ===== Left: board with example 1 ===== -->
  <text x="125" y="56" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">示例 1 终局（A 胜）</text>

  <!-- Row 0 -->
  <rect x="50" y="70" width="50" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <path d="M 62 82 L 88 108 M 88 82 L 62 108" stroke="#b85450" stroke-width="2.5" stroke-linecap="round" fill="none" filter="url(#rough2)"/>
  <rect x="100" y="70" width="50" height="50" fill="#f4f4f4" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="150" y="70" width="50" height="50" fill="#f4f4f4" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- Row 1 -->
  <rect x="50" y="120" width="50" height="50" fill="#f4f4f4" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="100" y="120" width="50" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <path d="M 112 132 L 138 158 M 138 132 L 112 158" stroke="#b85450" stroke-width="2.5" stroke-linecap="round" fill="none" filter="url(#rough2)"/>
  <rect x="150" y="120" width="50" height="50" fill="#f4f4f4" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- Row 2 -->
  <rect x="50" y="170" width="50" height="50" fill="#f4f4f4" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <ellipse cx="75" cy="195" rx="13" ry="13" stroke="#446688" stroke-width="2.5" fill="none" filter="url(#rough2)"/>
  <rect x="100" y="170" width="50" height="50" fill="#f4f4f4" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <ellipse cx="125" cy="195" rx="13" ry="13" stroke="#446688" stroke-width="2.5" fill="none" filter="url(#rough2)"/>
  <rect x="150" y="170" width="50" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <path d="M 162 182 L 188 208 M 188 182 L 162 208" stroke="#b85450" stroke-width="2.5" stroke-linecap="round" fill="none" filter="url(#rough2)"/>

  <!-- Winning diagonal line overlay -->
  <path d="M 75 95 L 175 195" stroke="#d6a040" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.6" filter="url(#rough2)"/>

  <!-- Last move marker -->
  <text x="175" y="168" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">最后一步</text>
  <path d="M 175 170 L 175 176" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arrD2)" filter="url(#rough2)"/>

  <!-- Legend for left -->
  <rect x="48" y="232" width="12" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="66" y="242" font-size="10" fill="#666">获胜线上的格子</text>
  <text x="48" y="258" font-size="10" fill="#b85450">✕ = A (X)</text>
  <text x="120" y="258" font-size="10" fill="#446688">○ = B (O)</text>

  <!-- ===== Right: 8 winning lines ===== -->
  <text x="380" y="56" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">8 条获胜线</text>

  <!-- Mini board grid -->
  <rect x="316" y="74" width="32" height="32" fill="#fff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <rect x="348" y="74" width="32" height="32" fill="#fff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <rect x="380" y="74" width="32" height="32" fill="#fff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <rect x="316" y="106" width="32" height="32" fill="#fff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <rect x="348" y="106" width="32" height="32" fill="#fff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <rect x="380" y="106" width="32" height="32" fill="#fff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <rect x="316" y="138" width="32" height="32" fill="#fff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <rect x="348" y="138" width="32" height="32" fill="#fff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <rect x="380" y="138" width="32" height="32" fill="#fff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>

  <!-- 3 row lines (blue) -->
  <path d="M 318 90 L 410 90" stroke="#446688" stroke-width="2" stroke-linecap="round" fill="none" filter="url(#rough2)"/>
  <path d="M 318 122 L 410 122" stroke="#446688" stroke-width="2" stroke-linecap="round" fill="none" filter="url(#rough2)"/>
  <path d="M 318 154 L 410 154" stroke="#446688" stroke-width="2" stroke-linecap="round" fill="none" filter="url(#rough2)"/>

  <!-- 3 col lines (green) -->
  <path d="M 332 76 L 332 168" stroke="#4a7a3a" stroke-width="2" stroke-linecap="round" fill="none" filter="url(#rough2)"/>
  <path d="M 364 76 L 364 168" stroke="#4a7a3a" stroke-width="2" stroke-linecap="round" fill="none" filter="url(#rough2)"/>
  <path d="M 396 76 L 396 168" stroke="#4a7a3a" stroke-width="2" stroke-linecap="round" fill="none" filter="url(#rough2)"/>

  <!-- 2 diagonal lines (red) -->
  <path d="M 318 76 L 410 168" stroke="#b85450" stroke-width="2" stroke-linecap="round" fill="none" filter="url(#rough2)"/>
  <path d="M 410 76 L 318 168" stroke="#b85450" stroke-width="2" stroke-linecap="round" fill="none" filter="url(#rough2)"/>

  <!-- Legend for right -->
  <rect x="316" y="186" width="12" height="3" fill="#446688" filter="url(#rough2)"/>
  <text x="334" y="191" font-size="10" fill="#666">3 行</text>
  <rect x="372" y="186" width="12" height="3" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="390" y="191" font-size="10" fill="#666">3 列</text>
  <rect x="316" y="200" width="12" height="3" fill="#b85450" filter="url(#rough2)"/>
  <text x="334" y="205" font-size="10" fill="#666">2 对角</text>
  <text x="380" y="205" font-size="10" fill="#888">共 8 条</text>

  <!-- ===== Bottom: insight ===== -->
  <rect x="28" y="226" width="484" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="242" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">moves 有效 → 一旦获胜游戏立即停止</text>
  <text x="270" y="258" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">→ 获胜者必为最后落子者（last = len(moves) − 1）</text>

  <rect x="28" y="270" width="484" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="290" text-anchor="middle" font-size="11" fill="#444">last 为偶数 → 检查 A (X) 是否三连</text>
  <text x="270" y="308" text-anchor="middle" font-size="11" fill="#444">last 为奇数 → 检查 B (O) 是否三连</text>
  <text x="270" y="322" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">无需检查另一位玩家</text>

  <!-- Footer -->
  <text x="270" y="352" text-anchor="middle" font-size="10" fill="#999">只需检查 1 个玩家 × 8 条线 = 最多 8 次判定</text>
</svg>
