<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：命中 vs 无不重复字符</text>

  <!-- ===== Case 1: success ===== -->
  <text x="40" y="58" font-size="12" fill="#4a7a3a" font-weight="bold">例 1（命中）：s = "leetcode"</text>

  <!-- s boxes -->
  <text x="44" y="92" font-size="11" fill="#888">s:</text>
  <rect x="70" y="72" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="87" y="94" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">l</text>
  <rect x="104" y="72" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="121" y="94" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">e</text>
  <rect x="138" y="72" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="94" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">e</text>
  <rect x="172" y="72" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="189" y="94" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">t</text>
  <rect x="206" y="72" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="223" y="94" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">c</text>
  <rect x="240" y="72" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="257" y="94" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">o</text>
  <rect x="274" y="72" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="291" y="94" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">d</text>
  <rect x="308" y="72" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="325" y="94" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">e</text>
  <text x="87" y="118" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="121" y="118" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="155" y="118" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="189" y="118" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="223" y="118" text-anchor="middle" font-size="9" fill="#aaa">4</text>
  <text x="257" y="118" text-anchor="middle" font-size="9" fill="#aaa">5</text>
  <text x="291" y="118" text-anchor="middle" font-size="9" fill="#aaa">6</text>
  <text x="325" y="118" text-anchor="middle" font-size="9" fill="#aaa">7</text>

  <!-- cnt table -->
  <text x="44" y="148" font-size="11" fill="#888">建表 cnt:</text>
  <rect x="120" y="130" width="52" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="146" y="149" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">l:1</text>
  <rect x="174" y="130" width="52" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="149" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">e:3</text>
  <rect x="228" y="130" width="52" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="254" y="149" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">t:1</text>
  <rect x="282" y="130" width="52" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="308" y="149" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">c:1</text>
  <rect x="336" y="130" width="52" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="362" y="149" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">o:1</text>
  <rect x="390" y="130" width="52" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="416" y="149" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">d:1</text>

  <!-- scan step: i=0 l cnt=1 -> hit -->
  <text x="44" y="184" font-size="11" fill="#888">i=0, s[0]=l</text>
  <text x="160" y="184" font-size="11" fill="#666">→ cnt[l]==1 ?</text>
  <rect x="280" y="168" width="56" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="308" y="187" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">是 ✓</text>
  <text x="346" y="184" font-size="11" fill="#4a7a3a" font-weight="bold">→ 命中</text>

  <!-- result -->
  <rect x="40" y="206" width="360" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="220" y="226" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">首个 cnt==1 在索引 0 → 返回 0 ✓</text>

  <!-- ===== Case 2: fail ===== -->
  <text x="40" y="270" font-size="12" fill="#b85450" font-weight="bold">例 3（无不重复字符）：s = "aabb"</text>

  <!-- s boxes -->
  <text x="44" y="304" font-size="11" fill="#888">s:</text>
  <rect x="70" y="284" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="87" y="306" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="104" y="284" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="121" y="306" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="138" y="284" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="306" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>
  <rect x="172" y="284" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="189" y="306" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>
  <text x="87" y="330" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="121" y="330" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="155" y="330" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="189" y="330" text-anchor="middle" font-size="9" fill="#aaa">3</text>

  <!-- cnt table -->
  <text x="44" y="360" font-size="11" fill="#888">建表 cnt:</text>
  <rect x="120" y="342" width="52" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="146" y="361" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a:2</text>
  <rect x="174" y="342" width="52" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="361" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">b:2</text>

  <!-- scan steps -->
  <text x="44" y="394" font-size="11" fill="#888">i=0,1 s=a</text>
  <text x="130" y="394" font-size="11" fill="#666">→ cnt[a]==2 ✗</text>
  <text x="44" y="416" font-size="11" fill="#888">i=2,3 s=b</text>
  <text x="130" y="416" font-size="11" fill="#666">→ cnt[b]==2 ✗</text>
  <text x="44" y="438" font-size="11" fill="#888">扫完</text>
  <text x="130" y="438" font-size="11" fill="#666">→ 无 cnt==1</text>

  <!-- result -->
  <rect x="290" y="394" width="230" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="405" y="416" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">无不重复字符</text>
  <text x="405" y="432" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">→ 返回 −1 ✗</text>
</svg>
