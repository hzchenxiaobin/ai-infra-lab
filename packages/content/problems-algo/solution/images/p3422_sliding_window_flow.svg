<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrGy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999999"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：每轮「插入 → 上供 → 平衡 → 结算 → 移出」</text>

  <!-- 初始化 -->
  <rect x="155" y="32" width="210" height="26" fill="#f5f5f5" stroke="#999" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="49" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">lo = hi = ∅，s_lo = s_hi = 0，ans = +∞</text>
  <path d="M 260 58 L 260 70" fill="none" stroke="#999" stroke-width="1.6" marker-end="url(#arrGy)" filter="url(#rough2)"/>

  <!-- ① 插入 -->
  <rect x="130" y="72" width="260" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="89" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">① 新元素 x = nums[i] 插入 lo（s_lo += x）</text>
  <path d="M 260 98 L 260 108" fill="none" stroke="#999" stroke-width="1.6" marker-end="url(#arrGy)" filter="url(#rough2)"/>

  <!-- ② 上供 -->
  <rect x="130" y="108" width="260" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="125" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">② lo 的最大值挪给 hi（s_lo、s_hi 同步更新）</text>
  <path d="M 260 134 L 260 144" fill="none" stroke="#999" stroke-width="1.6" marker-end="url(#arrGy)" filter="url(#rough2)"/>

  <!-- 判断：需要平衡？ -->
  <polygon points="260,144 335,167 260,190 185,167" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="171" text-anchor="middle" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">|hi| − |lo| &gt; 1 ?</text>
  <text x="343" y="159" text-anchor="middle" font-size="9" fill="#a07830" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 335 167 L 354 167" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="356" y="153" width="140" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="426" y="171" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">③ hi 的最小值挪回 lo</text>
  <path d="M 426 181 L 426 202 L 268 202" fill="none" stroke="#999" stroke-width="1.6" marker-end="url(#arrGy)" filter="url(#rough2)"/>
  <text x="270" y="204" text-anchor="middle" font-size="9" fill="#a07830" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 260 190 L 260 210" fill="none" stroke="#999" stroke-width="1.6" marker-end="url(#arrGy)" filter="url(#rough2)"/>

  <!-- 判断：窗口成型？ -->
  <polygon points="260,212 335,235 260,258 185,235" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="239" text-anchor="middle" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">i ≥ k−1 ?</text>
  <text x="110" y="227" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">否：窗口未成型</text>
  <path d="M 185 235 L 60 235 L 60 85 L 126 85" fill="none" stroke="#999" stroke-width="1.6" marker-end="url(#arrGy)" filter="url(#rough2)"/>
  <text x="270" y="262" text-anchor="middle" font-size="9" fill="#a07830" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 260 258 L 260 266" fill="none" stroke="#999" stroke-width="1.6" marker-end="url(#arrGy)" filter="url(#rough2)"/>

  <!-- ④ 结算 -->
  <rect x="112" y="266" width="296" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="283" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">④ m = min(hi)，O(1) 结算</text>
  <text x="260" y="299" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">ans ← min(ans, (s_hi − m·|hi|) + (m·|lo| − s_lo))</text>
  <path d="M 260 308 L 260 316" fill="none" stroke="#999" stroke-width="1.6" marker-end="url(#arrGy)" filter="url(#rough2)"/>

  <!-- ⑤ 移出 -->
  <rect x="112" y="316" width="296" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="333" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">⑤ 删除 nums[i−k+1]：在 hi 里就删 hi，否则删 lo（同步减和）</text>

  <!-- 回到下一轮 -->
  <path d="M 408 329 L 506 329 L 506 85 L 394 85" fill="none" stroke="#999" stroke-width="1.6" marker-end="url(#arrGy)" filter="url(#rough2)"/>
  <text x="452" y="78" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">下一轮（i+1）</text>

  <text x="260" y="357" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">遍历结束返回 ans；k ≤ n 保证至少一个窗口，ans 必为有限值</text>
</svg>
