<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="820" height="340" fill="#fafafa"/>

  <text x="410" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：mat = [[0,0,0],[0,1,0],[1,1,1]]</text>

  <!-- ===== Step 0 ===== -->
  <text x="120" y="60" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">第 0 层（初始）</text>
  <g font-size="14" filter="url(#rough2)">
    <rect x="60" y="72" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/><text x="80" y="97" text-anchor="middle" fill="#2a4a6a" font-weight="bold">0</text>
    <rect x="100" y="72" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/><text x="120" y="97" text-anchor="middle" fill="#2a4a6a" font-weight="bold">0</text>
    <rect x="140" y="72" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/><text x="160" y="97" text-anchor="middle" fill="#2a4a6a" font-weight="bold">0</text>
    <rect x="60" y="112" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/><text x="80" y="137" text-anchor="middle" fill="#2a4a6a" font-weight="bold">0</text>
    <rect x="100" y="112" width="40" height="40" fill="#fff" stroke="#bbb" stroke-dasharray="3 2"/><text x="120" y="137" text-anchor="middle" fill="#bbb">∞</text>
    <rect x="140" y="112" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/><text x="160" y="137" text-anchor="middle" fill="#2a4a6a" font-weight="bold">0</text>
    <rect x="60" y="152" width="40" height="40" fill="#fff" stroke="#bbb" stroke-dasharray="3 2"/><text x="80" y="177" text-anchor="middle" fill="#bbb">∞</text>
    <rect x="100" y="152" width="40" height="40" fill="#fff" stroke="#bbb" stroke-dasharray="3 2"/><text x="120" y="177" text-anchor="middle" fill="#bbb">∞</text>
    <rect x="140" y="152" width="40" height="40" fill="#fff" stroke="#bbb" stroke-dasharray="3 2"/><text x="160" y="177" text-anchor="middle" fill="#bbb">∞</text>
  </g>
  <text x="120" y="212" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">5 个 0 全部入队</text>

  <!-- arrow -->
  <path d="M195 132 L255 132" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#rough2)"/>

  <!-- ===== Step 1 ===== -->
  <text x="330" y="60" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">第 1 层</text>
  <g font-size="14" filter="url(#rough2)">
    <rect x="270" y="72" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/><text x="290" y="97" text-anchor="middle" fill="#2a4a6a" font-weight="bold">0</text>
    <rect x="310" y="72" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/><text x="330" y="97" text-anchor="middle" fill="#2a4a6a" font-weight="bold">0</text>
    <rect x="350" y="72" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/><text x="370" y="97" text-anchor="middle" fill="#2a4a6a" font-weight="bold">0</text>
    <rect x="270" y="112" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/><text x="290" y="137" text-anchor="middle" fill="#2a4a6a" font-weight="bold">0</text>
    <rect x="310" y="112" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/><text x="330" y="137" text-anchor="middle" fill="#2e5e2e" font-weight="bold">1</text>
    <rect x="350" y="112" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/><text x="370" y="137" text-anchor="middle" fill="#2a4a6a" font-weight="bold">0</text>
    <rect x="270" y="152" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/><text x="290" y="177" text-anchor="middle" fill="#2e5e2e" font-weight="bold">1</text>
    <rect x="310" y="152" width="40" height="40" fill="#fff" stroke="#bbb" stroke-dasharray="3 2"/><text x="330" y="177" text-anchor="middle" fill="#bbb">∞</text>
    <rect x="350" y="152" width="40" height="40" fill="#fff" stroke="#bbb" stroke-dasharray="3 2"/><text x="370" y="177" text-anchor="middle" fill="#bbb">∞</text>
  </g>
  <text x="330" y="212" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">(1,1)=1, (2,0)=1 入队</text>

  <!-- arrow -->
  <path d="M405 132 L465 132" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#rough2)"/>

  <!-- ===== Step 2 ===== -->
  <text x="540" y="60" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">第 2 层（完成）</text>
  <g font-size="14" filter="url(#rough2)">
    <rect x="480" y="72" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/><text x="500" y="97" text-anchor="middle" fill="#2a4a6a" font-weight="bold">0</text>
    <rect x="520" y="72" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/><text x="540" y="97" text-anchor="middle" fill="#2a4a6a" font-weight="bold">0</text>
    <rect x="560" y="72" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/><text x="580" y="97" text-anchor="middle" fill="#2a4a6a" font-weight="bold">0</text>
    <rect x="480" y="112" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/><text x="500" y="137" text-anchor="middle" fill="#2a4a6a" font-weight="bold">0</text>
    <rect x="520" y="112" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/><text x="540" y="137" text-anchor="middle" fill="#2e5e2e" font-weight="bold">1</text>
    <rect x="560" y="112" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/><text x="580" y="137" text-anchor="middle" fill="#2a4a6a" font-weight="bold">0</text>
    <rect x="480" y="152" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/><text x="500" y="177" text-anchor="middle" fill="#2e5e2e" font-weight="bold">1</text>
    <rect x="520" y="152" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/><text x="540" y="177" text-anchor="middle" fill="#7a5415" font-weight="bold">2</text>
    <rect x="560" y="152" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/><text x="580" y="177" text-anchor="middle" fill="#7a5415" font-weight="bold">2</text>
  </g>
  <text x="540" y="212" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">(2,1)=2, (2,2)=2，队列空</text>

  <!-- ===== Queue evolution box ===== -->
  <g filter="url(#rough2)">
    <rect x="650" y="72" width="150" height="160" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="725" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e" filter="url(#rough2)">队列演化</text>
  <g font-size="9" fill="#444" font-family="monospace">
    <text x="664" y="116">init:</text>
    <text x="664" y="128" fill="#446688">5 个 0 入队</text>
    <text x="664" y="150">第1层出队:</text>
    <text x="664" y="162" fill="#4a7a3a">push (1,1)(2,0)</text>
    <text x="664" y="184">第2层出队:</text>
    <text x="664" y="196" fill="#d6a040">push (2,1)(2,2)</text>
    <text x="664" y="218" fill="#b85450" font-weight="bold">队列空 → 结束</text>
  </g>

  <!-- ===== Bottom note ===== -->
  <g filter="url(#rough2)">
    <rect x="60" y="240" width="700" height="80" rx="8" fill="#fffdf3" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="410" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">结果：dist = [[0,0,0],[0,1,0],[1,2,1]]</text>
  <text x="410" y="286" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">蓝=第0层(0)　绿=第1层(1)　橙=第2层(2)　虚线白=未访问(∞)</text>
  <text x="410" y="306" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">每个 1 格被最近的 0 在第几层首次触达，距离就是几</text>
</svg>
