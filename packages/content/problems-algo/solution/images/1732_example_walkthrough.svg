<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：gain = [−5, 1, 5, 0, −7] → best = 1</text>
  <text x="300" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">起点 alt = 0, best = 0；每步 alt += gain[i]，best = max(best, alt)</text>

  <!-- Header row -->
  <rect x="30" y="54" width="540" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="60" y="73">步骤 i</text>
    <text x="180" y="73">gain[i]</text>
    <text x="300" y="73">alt（新海拔）</text>
    <text x="420" y="73">best</text>
    <text x="540" y="73">备注</text>
  </g>

  <!-- Row: 起点 -->
  <rect x="30" y="88" width="540" height="32" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#555" text-anchor="middle">
    <text x="60" y="108" font-weight="bold">起点</text>
    <text x="180" y="108">—</text>
    <text x="300" y="108" font-weight="bold">0</text>
    <text x="420" y="108" font-weight="bold">0</text>
    <text x="540" y="108" font-size="10" fill="#888">初值 = 起点 0</text>
  </g>

  <!-- Row: i=0, gain=-5 -->
  <rect x="30" y="122" width="540" height="32" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#555" text-anchor="middle">
    <text x="60" y="142" font-weight="bold">0</text>
    <text x="180" y="142" fill="#b85450" font-weight="bold">−5</text>
    <text x="300" y="142" fill="#b85450" font-weight="bold">−5</text>
    <text x="420" y="142" font-weight="bold">0</text>
    <text x="540" y="142" font-size="10" fill="#888">下坡，alt &lt; best</text>
  </g>

  <!-- Row: i=1, gain=+1 -->
  <rect x="30" y="156" width="540" height="32" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#555" text-anchor="middle">
    <text x="60" y="176" font-weight="bold">1</text>
    <text x="180" y="176" fill="#d6a040" font-weight="bold">+1</text>
    <text x="300" y="176" fill="#b85450" font-weight="bold">−4</text>
    <text x="420" y="176" font-weight="bold">0</text>
    <text x="540" y="176" font-size="10" fill="#888">仍 &lt; best</text>
  </g>

  <!-- Row: i=2, gain=+5  HIGHLIGHTED (best updates) -->
  <rect x="30" y="190" width="540" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="60" y="210" fill="#333" font-weight="bold">2</text>
    <text x="180" y="210" fill="#d6a040" font-weight="bold">+5</text>
    <text x="300" y="210" fill="#4a7a3a" font-weight="bold">+1</text>
    <text x="420" y="210" fill="#4a7a3a" font-weight="bold">1 ←</text>
    <text x="540" y="210" font-size="10" fill="#4a7a3a" font-weight="bold">best 更新！</text>
  </g>

  <!-- Row: i=3, gain=0 -->
  <rect x="30" y="224" width="540" height="32" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#555" text-anchor="middle">
    <text x="60" y="244" font-weight="bold">3</text>
    <text x="180" y="244" fill="#888" font-weight="bold">0</text>
    <text x="300" y="244" fill="#4a7a3a" font-weight="bold">+1</text>
    <text x="420" y="244" font-weight="bold">1</text>
    <text x="540" y="244" font-size="10" fill="#888">平路，alt = best</text>
  </g>

  <!-- Row: i=4, gain=-7 -->
  <rect x="30" y="258" width="540" height="32" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#555" text-anchor="middle">
    <text x="60" y="278" font-weight="bold">4</text>
    <text x="180" y="278" fill="#b85450" font-weight="bold">−7</text>
    <text x="300" y="278" fill="#b85450" font-weight="bold">−6</text>
    <text x="420" y="278" font-weight="bold">1</text>
    <text x="540" y="278" font-size="10" fill="#888">陡降，best 保持</text>
  </g>

  <!-- Result arrow + box -->
  <path d="M 420 294 L 420 318" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="300" y="322" width="240" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="420" y="346" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 best = 1 ✓</text>
</svg>
