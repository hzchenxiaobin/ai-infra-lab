<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：逐环求和 → 等差数列 → 闭合公式</text>

  <!-- Box 1：第1分钟 -->
  <rect x="110" y="44" width="360" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="290" y="62" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">第 1 分钟</text>
  <text x="290" y="78" text-anchor="middle" font-size="11" fill="#333">染中心 1 格（距离 d = 0），累计 = 1</text>

  <path d="M 290 90 Q 290 102 290 114" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 2：第k分钟 -->
  <rect x="110" y="116" width="360" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="290" y="134" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">第 k 分钟（k ≥ 2）</text>
  <text x="290" y="150" text-anchor="middle" font-size="11" fill="#333">向外扩一环：染满距离 = k−1 的所有格子</text>

  <path d="M 290 162 Q 290 174 290 186" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 3：该环格数 -->
  <rect x="110" y="188" width="360" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="290" y="206" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">第 k 环格子数</text>
  <text x="290" y="222" text-anchor="middle" font-size="11" fill="#333">菱形周长 = 4 × (k−1)　（环 d 含 4d 格）</text>

  <path d="M 290 234 Q 290 246 290 258" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 4：累加求和 -->
  <rect x="110" y="260" width="360" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="290" y="280" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">累计格数</text>
  <text x="290" y="298" text-anchor="middle" font-size="11" fill="#333">= 1 + Σ(k=2..n) 4(k−1)</text>
  <text x="290" y="312" text-anchor="middle" font-size="11" fill="#333">= 1 + 4 × (1 + 2 + … + (n−1))</text>

  <path d="M 290 314 Q 290 326 290 338" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 5：闭合公式（结果） -->
  <rect x="110" y="340" width="360" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="360" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">等差求和 → 闭合公式</text>
  <text x="290" y="378" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">ans = 1 + 4·(n−1)n/2 = 2n(n−1)+1</text>
  <text x="290" y="392" text-anchor="middle" font-size="10" fill="#b85450">O(1) 时间 · O(1) 空间</text>

  <!-- 溢出提醒 -->
  <rect x="80" y="402" width="420" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)" opacity="0.6"/>
  <text x="290" y="421" text-anchor="middle" font-size="10" fill="#b85450">⚠ n ≤ 10⁵：2n(n−1) ≈ 2×10¹⁰ 超 int，C++ 用 long long（2LL * n * (n−1)）</text>
</svg>
