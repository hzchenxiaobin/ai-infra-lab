<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：原地编码法（两趟扫描）</text>

  <!-- Input -->
  <rect x="160" y="44" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">输入：排列 nums（值 ∈ [0, n−1]）</text>

  <path d="M 280 80 L 280 100" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Pass 1 -->
  <rect x="40" y="106" width="480" height="150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="5,3" rx="10" filter="url(#rough2)"/>
  <text x="60" y="128" font-size="12.5" fill="#d6a040" font-weight="bold">第一趟 · 编码：把 b = nums[nums[i]] 藏进 nums[i]</text>

  <!-- step 1 -->
  <rect x="60" y="142" width="220" height="34" fill="#fafafa" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="170" y="164" text-anchor="middle" font-size="11.5" fill="#333">b = nums[nums[i]] % n</text>

  <path d="M 170 178 L 170 192" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- step 2 -->
  <rect x="60" y="196" width="280" height="34" fill="#fafafa" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="200" y="218" text-anchor="middle" font-size="11.5" fill="#333">nums[i] = nums[i] + n × b</text>

  <!-- side note -->
  <rect x="360" y="142" width="150" height="88" fill="#fafafa" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="6" filter="url(#rough2)"/>
  <text x="435" y="162" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">为什么 % n？</text>
  <text x="370" y="180" font-size="10" fill="#555">nums[nums[i]] 可能</text>
  <text x="370" y="194" font-size="10" fill="#555">已被编码成 a+n×b，</text>
  <text x="370" y="208" font-size="10" fill="#555">% n 即取回原值 a；</text>
  <text x="370" y="222" font-size="10" fill="#555">未编码时 % n = 自身。</text>

  <!-- arrow between passes -->
  <path d="M 280 260 L 280 280" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Pass 2 -->
  <rect x="40" y="286" width="480" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5,3" rx="10" filter="url(#rough2)"/>
  <text x="60" y="308" font-size="12.5" fill="#4a7a3a" font-weight="bold">第二趟 · 解码：取商即答案</text>

  <rect x="60" y="320" width="240" height="34" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="180" y="342" text-anchor="middle" font-size="11.5" fill="#333">nums[i] = nums[i] // n</text>

  <rect x="320" y="320" width="180" height="44" fill="#fafafa" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="6" filter="url(#rough2)"/>
  <text x="410" y="340" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">结果</text>
  <text x="410" y="356" text-anchor="middle" font-size="10.5" fill="#4a7a3a">nums[i] 即 ans[i]</text>

  <!-- conclusion -->
  <rect x="40" y="394" width="480" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="412" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">两趟 O(n)，额外空间 O(1)；不变式：编码后 nums[i] % n 恒为原值</text>
</svg>
