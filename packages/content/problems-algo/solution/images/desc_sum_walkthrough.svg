<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：[10,3,4,2,1] 后序遍历逐节点判定</text>

  <!-- 小树示意 -->
  <text x="90" y="56" text-anchor="middle" font-size="11" fill="#888">后序顺序</text>
  <circle cx="90" cy="74" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="78" text-anchor="middle" font-size="10" fill="#333">10</text>
  <text x="106" y="66" font-size="8" fill="#b85450">⑤</text>
  <line x1="82" y1="84" x2="62" y2="100" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="98" y1="84" x2="118" y2="100" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="58" cy="110" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="58" y="113" text-anchor="middle" font-size="9" fill="#333">3</text>
  <text x="72" y="106" font-size="8" fill="#b85450">③</text>
  <circle cx="122" cy="110" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="122" y="113" text-anchor="middle" font-size="9" fill="#333">4</text>
  <text x="136" y="106" font-size="8" fill="#b85450">④</text>
  <line x1="52" y1="118" x2="40" y2="134" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="64" y1="118" x2="76" y2="134" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="37" cy="142" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="37" y="145" text-anchor="middle" font-size="8" fill="#333">2</text>
  <text x="48" y="148" font-size="8" fill="#b85450">①</text>
  <circle cx="79" cy="142" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="79" y="145" text-anchor="middle" font-size="8" fill="#333">1</text>
  <text x="90" y="148" font-size="8" fill="#b85450">②</text>

  <!-- 表格 -->
  <!-- 表头 -->
  <rect x="190" y="48" width="410" height="26" fill="#446688" filter="url(#rough2)"/>
  <text x="231" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">节点</text>
  <text x="313" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">l+r(后代和)</text>
  <text x="395" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">val==l+r?</text>
  <text x="477" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">返回值</text>
  <text x="559" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">count</text>

  <!-- 行 ① 叶2 -->
  <rect x="190" y="74" width="410" height="28" fill="#fce4ec" filter="url(#rough2)"/>
  <text x="231" y="92" text-anchor="middle" font-size="10" fill="#333">① 叶 2</text>
  <text x="313" y="92" text-anchor="middle" font-size="10" fill="#888">0+0 = 0</text>
  <text x="395" y="92" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">❌ 2≠0</text>
  <text x="477" y="92" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="559" y="92" text-anchor="middle" font-size="10" fill="#333">0</text>

  <!-- 行 ② 叶1 -->
  <rect x="190" y="102" width="410" height="28" fill="#fce4ec" filter="url(#rough2)"/>
  <text x="231" y="120" text-anchor="middle" font-size="10" fill="#333">② 叶 1</text>
  <text x="313" y="120" text-anchor="middle" font-size="10" fill="#888">0+0 = 0</text>
  <text x="395" y="120" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">❌ 1≠0</text>
  <text x="477" y="120" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="559" y="120" text-anchor="middle" font-size="10" fill="#333">0</text>

  <!-- 行 ③ 节点3 -->
  <rect x="190" y="130" width="410" height="28" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="231" y="148" text-anchor="middle" font-size="10" fill="#333">③ 节点 3</text>
  <text x="313" y="148" text-anchor="middle" font-size="10" fill="#4a7a3a">2+1 = 3</text>
  <text x="395" y="148" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✅ 3==3</text>
  <text x="477" y="148" text-anchor="middle" font-size="10" fill="#333">6</text>
  <text x="559" y="148" text-anchor="middle" font-size="10" fill="#333">1</text>

  <!-- 行 ④ 叶4 -->
  <rect x="190" y="158" width="410" height="28" fill="#fce4ec" filter="url(#rough2)"/>
  <text x="231" y="176" text-anchor="middle" font-size="10" fill="#333">④ 叶 4</text>
  <text x="313" y="176" text-anchor="middle" font-size="10" fill="#888">0+0 = 0</text>
  <text x="395" y="176" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">❌ 4≠0</text>
  <text x="477" y="176" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="559" y="176" text-anchor="middle" font-size="10" fill="#333">1</text>

  <!-- 行 ⑤ 根10 -->
  <rect x="190" y="186" width="410" height="28" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="231" y="204" text-anchor="middle" font-size="10" fill="#333">⑤ 根 10</text>
  <text x="313" y="204" text-anchor="middle" font-size="10" fill="#4a7a3a">6+4 = 10</text>
  <text x="395" y="204" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✅ 10==10</text>
  <text x="477" y="204" text-anchor="middle" font-size="10" fill="#333">20</text>
  <text x="559" y="204" text-anchor="middle" font-size="10" fill="#333">2</text>

  <!-- 表格边框 -->
  <rect x="190" y="48" width="410" height="166" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="272" y1="74" x2="272" y2="214" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="354" y1="74" x2="354" y2="214" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="436" y1="74" x2="436" y2="214" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="518" y1="74" x2="518" y2="214" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- 结论框 -->
  <rect x="60" y="240" width="500" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="310" y="262" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">最终 count = 2 ✓</text>
  <text x="310" y="282" text-anchor="middle" font-size="10" fill="#555">节点 3（2+1=3）与 根 10（6+4=10）满足；叶子后代和为 0，均不计</text>

  <!-- 关键观察 -->
  <rect x="60" y="310" width="500" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="330" text-anchor="middle" font-size="10" fill="#555">返回值 = node.val + l + r = 子树所有节点之和（供父节点做后代和计算）</text>
  <text x="310" y="348" text-anchor="middle" font-size="10" fill="#555">后代和 = l + r：左/右子树返回值即左/右子树总和，相加得全部后代之和</text>
  <text x="310" y="366" text-anchor="middle" font-size="10" fill="#4a7a3a">根 10 处 l=6（来自节点 3 的返回）、r=4（来自节点 4 的返回）→ 6+4=10 ✓</text>
</svg>
