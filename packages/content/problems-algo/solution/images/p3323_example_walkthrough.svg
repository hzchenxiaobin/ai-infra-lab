<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 432"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="432" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：k 够长 → 跨度 1，答案减一；k 太短 → 跨度 0，插了白插</text>

  <!-- ============ 示例 1 ============ -->
  <text x="24" y="46" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 1：[[1,3],[5,6],[8,10]]，k = 3 —— 桥 [3,6] 并起前两组</text>

  <!-- 桥 -->
  <rect x="145" y="54" width="135" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="212" y="68" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">桥 [3, 6]</text>

  <!-- 组 -->
  <rect x="55" y="80" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="235" y="80" width="45" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="370" y="80" width="90" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>

  <!-- 数轴 -->
  <path d="M 45 110 L 474 110" stroke="#999" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 55 106 L 55 114 M 145 106 L 145 114 M 235 106 L 235 114 M 280 106 L 280 114 M 370 106 L 370 114 M 460 106 L 460 114" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="55" y="127" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">1</text>
  <text x="145" y="127" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">3</text>
  <text x="235" y="127" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">5</text>
  <text x="280" y="127" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">6</text>
  <text x="370" y="127" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">8</text>
  <text x="460" y="127" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">10</text>

  <!-- 演算表 -->
  <text x="70" y="148" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="150" y="148" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">eᵢ + k</text>
  <text x="240" y="148" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">j(i)</text>
  <text x="330" y="148" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">跨度 j − i</text>
  <line x1="60" y1="153" x2="366" y2="153" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="70" y="170" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <text x="150" y="170" font-size="10" fill="#333" filter="url(#rough2)">3+3=6</text>
  <text x="240" y="170" font-size="10" fill="#333" filter="url(#rough2)">1（s₂=5≤6）</text>
  <text x="330" y="170" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="70" y="189" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="150" y="189" font-size="10" fill="#333" filter="url(#rough2)">6+3=9</text>
  <text x="240" y="189" font-size="10" fill="#333" filter="url(#rough2)">2（s₃=8≤9）</text>
  <text x="330" y="189" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="70" y="208" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="150" y="208" font-size="10" fill="#333" filter="url(#rough2)">10+3=13</text>
  <text x="240" y="208" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="330" y="208" font-size="10" fill="#999" filter="url(#rough2)">0</text>

  <!-- 右侧结果 -->
  <rect x="384" y="136" width="116" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="442" y="158" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">max 跨度 = 1</text>
  <text x="442" y="178" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">ans = m − max</text>
  <text x="442" y="196" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">= 3 − 1 = 2</text>
  <text x="442" y="213" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓</text>

  <!-- ============ 示例 2 ============ -->
  <text x="24" y="244" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 2：[[5,10],[1,1],[3,3]]，k = 1 —— 空隙宽 2 &gt; k，任何桥都搭不起来</text>

  <!-- 失败的桥（虚线） -->
  <rect x="55" y="258" width="45" height="18" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="78" y="252" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">桥[1,2] ✗ 够不到 3</text>
  <rect x="145" y="258" width="45" height="18" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="168" y="288" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">桥[3,4] ✗ 够不到 5</text>

  <!-- 组（[1,1]、[3,3] 画成小方块） -->
  <rect x="51" y="284" width="12" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <rect x="141" y="284" width="12" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <rect x="235" y="284" width="225" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="348" y="301" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">组3 [5,10]</text>

  <!-- 数轴 -->
  <path d="M 45 316 L 474 316" stroke="#999" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 57 312 L 57 320 M 147 312 L 147 320 M 235 312 L 235 320 M 460 312 L 460 320" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="57" y="333" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">1</text>
  <text x="147" y="333" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">3</text>
  <text x="235" y="333" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">5</text>
  <text x="460" y="333" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">10</text>

  <!-- 演算表 -->
  <text x="70" y="356" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="150" y="356" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">eᵢ + k</text>
  <text x="240" y="356" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">j(i)</text>
  <text x="330" y="356" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">跨度 j − i</text>
  <line x1="60" y1="361" x2="366" y2="361" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="70" y="378" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <text x="150" y="378" font-size="10" fill="#333" filter="url(#rough2)">1+1=2</text>
  <text x="240" y="378" font-size="10" fill="#333" filter="url(#rough2)">0（s₁=3&gt;2）</text>
  <text x="330" y="378" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="70" y="396" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="150" y="396" font-size="10" fill="#333" filter="url(#rough2)">3+1=4</text>
  <text x="240" y="396" font-size="10" fill="#333" filter="url(#rough2)">1（s₂=5&gt;4）</text>
  <text x="330" y="396" font-size="10" fill="#999" filter="url(#rough2)">0</text>

  <!-- 右侧结果 -->
  <rect x="384" y="344" width="116" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="442" y="364" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">max 跨度 = 0</text>
  <text x="442" y="382" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">ans = 3 − 0</text>
  <text x="442" y="400" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">= 3 ✓</text>

  <text x="260" y="424" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">插入 [1,2] 只贴住组 1，组数不变——「必须插一条」条款不吃亏（保底 j(i) ≥ i）</text>
</svg>
