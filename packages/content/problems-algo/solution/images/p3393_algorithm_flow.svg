<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 450"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>

  <rect width="520" height="450" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">算法流程：行优先逐格转移，每格枚举 16 个异或值</text>

  <!-- 开始 -->
  <g filter="url(#rough2)">
    <ellipse cx="260" cy="46" rx="42" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="260" y="51" text-anchor="middle" font-size="13" fill="#2d4d22">开始</text>
    <path d="M260,64 L260,74" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- 初始化 -->
  <g filter="url(#rough2)">
    <rect x="140" y="78" width="240" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="260" y="99" text-anchor="middle" font-size="12.5" fill="#333">dp[0][0][grid[0][0]] = 1，其余状态为 0</text>
    <path d="M260,112 L260,122" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- 逐格遍历 -->
  <g filter="url(#rough2)">
    <rect x="125" y="126" width="270" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="260" y="147" text-anchor="middle" font-size="12.5" fill="#333">逐格遍历 (i, j)：i = 0…m−1，j = 0…n−1</text>
    <path d="M260,160 L260,170" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- 判定：是起点？ -->
  <g filter="url(#rough2)">
    <polygon points="190,198 260,172 330,198 260,224" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="260" y="202" text-anchor="middle" font-size="12" fill="#7a5c1e">(i,j) 是起点？</text>
    <path d="M260,224 L260,238" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <text x="268" y="236" font-size="12" fill="#555">否</text>
    <path d="M330,198 L374,198" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <text x="342" y="192" font-size="12" fill="#555">是</text>
    <rect x="378" y="180" width="112" height="36" rx="6" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <text x="434" y="201" text-anchor="middle" font-size="12" fill="#666">跳过（已初始化）</text>
    <path d="M434,180 L434,143 L399,143" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- 枚举异或值 -->
  <g filter="url(#rough2)">
    <rect x="130" y="242" width="260" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="260" y="263" text-anchor="middle" font-size="12.5" fill="#333">v = grid[i][j]，枚举 x = 0…15</text>
    <path d="M260,276 L260,288" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- 核心转移 -->
  <g filter="url(#rough2)">
    <rect x="75" y="292" width="370" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="260" y="312" text-anchor="middle" font-size="12.5" fill="#8f3a35">dp[i][j][x⊕v] += dp[i−1][j][x] + dp[i][j−1][x]</text>
    <text x="260" y="330" text-anchor="middle" font-size="11.5" fill="#8f3a35">（每次累加后 mod 1e9+7）</text>
    <path d="M260,340 L260,352" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- 判定：遍历完？ -->
  <g filter="url(#rough2)">
    <polygon points="185,380 260,356 335,380 260,404" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="260" y="384" text-anchor="middle" font-size="12" fill="#7a5c1e">全部格子遍历完？</text>
    <path d="M260,404 L260,416" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <text x="268" y="414" font-size="12" fill="#555">是</text>
    <path d="M185,380 L100,380 L100,143 L121,143" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <text x="148" y="374" font-size="12" fill="#555">否</text>
  </g>

  <!-- 返回 -->
  <g filter="url(#rough2)">
    <rect x="150" y="420" width="220" height="26" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="260" y="437" text-anchor="middle" font-size="12.5" fill="#2d4d22">返回 dp[m−1][n−1][k]</text>
  </g>
</svg>
