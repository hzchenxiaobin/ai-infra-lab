<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">对称性优化：3 类等价起点（D4 二面体群）</text>

  <!-- ============ Class 1: corners ============ -->
  <text x="30" y="60" font-size="12" fill="#444" font-weight="bold">四角类（×4）</text>

  <g transform="translate(30,70)">
    <!-- 4 rotations/mirrors showing 1,3,7,9 are equivalent -->
    <circle cx="40" cy="30" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
    <text x="40" y="34" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

    <circle cx="90" cy="30" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
    <text x="90" y="34" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>

    <circle cx="40" cy="80" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
    <text x="40" y="84" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">7</text>

    <circle cx="90" cy="80" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
    <text x="90" y="84" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9</text>

    <!-- rotation arrows -->
    <path d="M 54 30 Q 65 20 76 30" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 90 44 Q 100 55 90 66" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 76 80 Q 65 90 54 80" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 40 66 Q 30 55 40 44" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  </g>

  <rect x="150" y="90" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="195" y="108" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4 × count(1)</text>

  <!-- ============ Class 2: edges ============ -->
  <text x="290" y="60" font-size="12" fill="#444" font-weight="bold">边中心类（×4）</text>

  <g transform="translate(290,70)">
    <circle cx="40" cy="30" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="40" y="34" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

    <circle cx="90" cy="30" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="90" y="34" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>

    <circle cx="40" cy="80" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="40" y="84" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>

    <circle cx="90" cy="80" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="90" y="84" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">8</text>

    <path d="M 54 30 Q 65 20 76 30" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 90 44 Q 100 55 90 66" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 76 80 Q 65 90 54 80" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 40 66 Q 30 55 40 44" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  </g>

  <rect x="410" y="90" width="90" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="455" y="108" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4 × count(2)</text>

  <!-- ============ Class 3: center ============ -->
  <text x="180" y="170" font-size="12" fill="#444" font-weight="bold">正中心类（×1）</text>

  <g transform="translate(180,180)">
    <circle cx="60" cy="30" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="60" y="34" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  </g>

  <rect x="280" y="190" width="90" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="325" y="208" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1 × count(5)</text>

  <!-- ============ Formula ============ -->
  <rect x="100" y="250" width="400" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="300" y="274" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">total = 4·count(1) + 4·count(2) + 1·count(5)</text>
  <text x="300" y="294" text-anchor="middle" font-size="10" fill="#555">9 次回溯 → 3 次（常数优化约 3 倍）</text>

  <!-- ============ Why ============ -->
  <rect x="60" y="324" width="480" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="344" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">为什么对称性成立？</text>
  <text x="300" y="362" text-anchor="middle" font-size="10" fill="#555">skip 矩阵定义于点对的「几何中点」</text>
  <text x="300" y="376" text-anchor="middle" font-size="10" fill="#555">而几何中点关系在旋转/镜像下不变</text>
  <text x="300" y="392" text-anchor="middle" font-size="10" fill="#555">例：1↔3 经 2，旋转 90° → 3↔9 经 6（同在 skip 表）</text>
  <text x="300" y="408" text-anchor="middle" font-size="10" fill="#d6a040">→ 同类点的搜索子树完全同构，计数相同</text>

  <text x="300" y="432" text-anchor="middle" font-size="10" fill="#888">⚠️ 前提：skip 矩阵在对称变换下不变（由几何对称性保证）</text>
</svg>
