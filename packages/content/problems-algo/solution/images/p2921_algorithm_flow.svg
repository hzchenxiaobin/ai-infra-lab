<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：两遍扫描 + 一次合并，O(n log M)</text>

  <rect x="90" y="40" width="380" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="10.5" fill="#333">m = max(prices)，ans = −1</text>
  <text x="280" y="82" text-anchor="middle" font-size="10.5" fill="#333">建两个大小 m 的 max-Fenwick：t1（原值域）、t2（翻转值域）</text>
  <path d="M 280 94 L 280 106" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <rect x="90" y="108" width="380" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="128" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">左扫 i = 0 → n−1（先查后插）</text>
  <text x="280" y="146" text-anchor="middle" font-size="10" fill="#333">left[i] ← t1.query(prices[i] − 1)　（查：价格更小的前缀 max）</text>
  <text x="280" y="164" text-anchor="middle" font-size="10" fill="#333">t1.update(prices[i], profits[i])　（插：把自己挂上值域）</text>
  <path d="M 280 172 L 280 184" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <rect x="90" y="186" width="380" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="206" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">右扫 i = n−1 → 0（先查后插，值先翻转）</text>
  <text x="280" y="224" text-anchor="middle" font-size="10" fill="#333">right[i] ← t2.query(m − prices[i])　（翻转域前缀 = 原域后缀）</text>
  <text x="280" y="242" text-anchor="middle" font-size="10" fill="#333">t2.update(m + 1 − prices[i], profits[i])　（插入同样先翻转）</text>
  <path d="M 280 250 L 280 262" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <rect x="90" y="264" width="380" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="284" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">合并 j = 0 → n−1</text>
  <text x="280" y="302" text-anchor="middle" font-size="10" fill="#333">left[j] &gt; 0 且 right[j] &gt; 0 时（0 = 不存在哨兵）</text>
  <text x="280" y="320" text-anchor="middle" font-size="10" fill="#333">ans ← max(ans, left[j] + profits[j] + right[j])</text>
  <path d="M 280 328 L 280 342" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <polygon points="280,344 392,382 280,420 168,382" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="386" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">ans == −1 ?</text>

  <path d="M 168 382 L 142 382" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="156" y="375" text-anchor="middle" font-size="10" fill="#b85450">是</text>
  <rect x="28" y="360" width="112" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="84" y="386" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">返回 −1</text>

  <path d="M 392 382 L 418 382" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="406" y="375" text-anchor="middle" font-size="10" fill="#4a7a3a">否</text>
  <rect x="420" y="360" width="112" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="476" y="386" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回 ans</text>
</svg>
