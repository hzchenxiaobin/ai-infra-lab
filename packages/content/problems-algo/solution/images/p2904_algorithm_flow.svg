<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：滑动窗口 + 双关键字择优</text>

  <!-- 开始 -->
  <rect x="200" y="42" width="160" height="30" fill="#eeeeee" stroke="#888" stroke-width="1.5" rx="15" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="12" fill="#333">left = cnt = 0, ans = ""</text>

  <path d="M 280 72 L 280 86" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <!-- right 右移 -->
  <rect x="170" y="88" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="110" text-anchor="middle" font-size="12" fill="#333">right 右移，cnt += (s[right]=='1')</text>

  <path d="M 280 122 L 280 136" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <!-- 菱形1 cnt > k -->
  <polygon points="280,138 360,170 280,202 200,170" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="166" text-anchor="middle" font-size="12" fill="#333">cnt &gt; k ?</text>
  <text x="280" y="182" text-anchor="middle" font-size="11" fill="#999">超载？</text>

  <!-- 是 → 收缩框（右侧绕回） -->
  <path d="M 360 170 L 430 170" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="384" y="162" font-size="11" fill="#b85450">是</text>
  <rect x="432" y="148" width="116" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="490" y="166" text-anchor="middle" font-size="11" fill="#333">弹出 s[left]，为 '1' 则 cnt--</text>
  <text x="490" y="182" text-anchor="middle" font-size="11" fill="#333">left++，再判超载</text>
  <path d="M 432 170 L 402 170 L 360 178" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4,3" filter="url(#rough2)" marker-end="url(#arr)"/>

  <!-- 否 → 菱形2 cnt == k -->
  <path d="M 280 202 L 280 220" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <text x="288" y="216" font-size="11" fill="#4a7a3a">否</text>

  <polygon points="280,222 360,254 280,286 200,254" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="250" text-anchor="middle" font-size="12" fill="#333">cnt == k ?</text>
  <text x="280" y="266" text-anchor="middle" font-size="11" fill="#999">恰好命中？</text>

  <!-- 否 → 回到 right 右移（左侧绕回） -->
  <path d="M 200 254 L 130 254 L 130 105 L 168 105" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <text x="150" y="246" font-size="11" fill="#446688">否（1 不足）</text>

  <!-- 是 → 去前导零 -->
  <path d="M 280 286 L 280 302" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrg)"/>
  <text x="288" y="298" font-size="11" fill="#4a7a3a">是</text>

  <rect x="160" y="304" width="240" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="326" text-anchor="middle" font-size="12" fill="#333">while s[left]=='0'：left++（去前导 0）</text>

  <path d="M 280 338 L 280 352" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <!-- 候选 -->
  <rect x="190" y="354" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="374" text-anchor="middle" font-size="12" fill="#333">t = s[left .. right]（唯一候选）</text>

  <path d="M 280 384 L 280 398" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <!-- 择优 -->
  <polygon points="280,400 356,428 280,452 204,428" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="424" text-anchor="middle" font-size="11" fill="#333">t 更短，或同长</text>
  <text x="280" y="438" text-anchor="middle" font-size="11" fill="#333">且字典序更小？</text>

  <!-- 是 → ans=t；否 → 回循环 -->
  <path d="M 356 428 L 420 428" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrg)"/>
  <text x="378" y="420" font-size="11" fill="#4a7a3a">是</text>
  <rect x="422" y="412" width="110" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="477" y="433" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans = t</text>

  <path d="M 204 428 L 90 428 L 90 105 L 168 105" fill="none" stroke="#446688" stroke-width="1.4" stroke-dasharray="4,3" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <text x="96" y="420" font-size="11" fill="#999">否，继续下一轮 right</text>

  <text x="470" y="62" font-size="11" fill="#999">right 扫完 →</text>
  <text x="470" y="78" font-size="11" fill="#999">返回 ans</text>
</svg>
