<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="32" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：互为反转的两串可配对</text>

  <!-- words array row -->
  <text x="40" y="78" font-size="13" fill="#666" filter="url(#rough2)">words =</text>
  <rect x="95" y="60" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">cd</text>
  <rect x="150" y="60" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">ac</text>
  <rect x="205" y="60" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">dc</text>
  <rect x="260" y="60" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="285" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">ca</text>
  <rect x="315" y="60" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="340" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">zz</text>

  <!-- index labels -->
  <text x="120" y="52" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="175" y="52" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="230" y="52" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="285" y="52" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="340" y="52" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4</text>

  <!-- pair arc 1: cd(0) <-> dc(2) -->
  <path d="M120,92 C120,135 230,135 230,92" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)" marker-end="url(#arr)"/>
  <path d="M230,92 C230,150 120,150 120,92" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="150" y="148" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">配对 1：cd ↔ dc</text>

  <!-- pair arc 2: ac(1) <-> ca(3) -->
  <path d="M175,92 C175,185 285,185 285,92" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)" marker-end="url(#arr)"/>
  <path d="M285,92 C285,200 175,200 175,92" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="225,210" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)"></text>
  <text x="225" y="212" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">配对 2：ac ↔ ca</text>

  <!-- zz note -->
  <path d="M340,92 C360,120 375,150 360,175" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4,3" filter="url(#rough2)" marker-end="url(#arrR)"/>
  <rect x="290" y="185" width="150" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="365" y="205" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">zz 反转仍是 zz</text>
  <text x="365" y="222" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">回文串，无法配对</text>

  <!-- conclusion box -->
  <rect x="60" y="260" width="440" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="284" text-anchor="middle" font-size="13" fill="#3a5a2a" filter="url(#rough2)">每串最多配一次 → 贪心：见反转在集合中即配对</text>
  <text x="280" y="304" text-anchor="middle" font-size="13" fill="#3a5a2a" filter="url(#rough2)">配成 2 对，zz 落单 → 答案 = 2</text>
</svg>
