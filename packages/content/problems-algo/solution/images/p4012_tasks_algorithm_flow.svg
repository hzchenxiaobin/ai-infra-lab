<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="17" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">算法流程：一趟扫描 shifts，每个班次 O(1) 或 O(log n)</text>

  <!-- A 预处理 -->
  <rect x="70" y="34" width="240" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="49" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">预处理：prefix[i] = tasks[0..i] 之和</text>
  <text x="190" y="64" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">total = prefix[n−1]，done = 0</text>

  <path d="M 190 74 L 190 86" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B 取班次 -->
  <rect x="70" y="90" width="240" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="104" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">取下一个班次 j（j 用尽 → 返回 ans）</text>
  <text x="190" y="118" text-anchor="middle" font-size="9" font-weight="bold" fill="#333" filter="url(#rough2)">done += shifts[j]</text>

  <path d="M 190 126 L 190 136" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- C 判定 -->
  <polygon points="190,140 300,184 190,228 80,184" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="188" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">done ≥ total ?</text>

  <!-- 是 → D -->
  <path d="M 300 184 L 322 184" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="311" y="175" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="326" y="160" width="166" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="409" y="178" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2f5527" filter="url(#rough2)">ans[j] = 0</text>
  <text x="409" y="196" text-anchor="middle" font-size="9" fill="#2f5527" filter="url(#rough2)">done = 0（重启一轮）</text>

  <!-- 否 → E -->
  <path d="M 190 228 L 190 242" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="202" y="240" font-size="10" font-weight="bold" fill="#446688" filter="url(#rough2)">否</text>
  <rect x="70" y="246" width="240" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="263" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">c = bisect_right(prefix, done)</text>
  <text x="190" y="279" text-anchor="middle" font-size="9" font-weight="bold" fill="#333" filter="url(#rough2)">ans[j] = n − c</text>
  <text x="190" y="293" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">（正在做的任务不计入 c）</text>

  <!-- 复杂度备注 -->
  <rect x="316" y="244" width="182" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="407" y="262" text-anchor="middle" font-size="9" fill="#7a5c1a" filter="url(#rough2)">每班次：一次加法 + 至多一次二分</text>
  <text x="407" y="278" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">整体 O(n + m log n)</text>

  <!-- E → G -->
  <path d="M 190 298 L 190 320" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- G 循环 -->
  <rect x="110" y="324" width="300" height="28" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="342" text-anchor="middle" font-size="9.5" fill="#2f5527" filter="url(#rough2)">处理下一个班次，直至 shifts 用尽</text>

  <!-- D → G（右侧汇合） -->
  <path d="M 492 184 L 507 184 L 507 338 L 416 338" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- G → B 回边 -->
  <path d="M 110 338 L 40 338 L 40 108 L 64 108" fill="none" stroke="#446688" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="30" y="223" text-anchor="middle" font-size="9" fill="#446688" transform="rotate(-90 30 223)" filter="url(#rough2)">下一个班次</text>
</svg>
