<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：8×8 网格 → 四叉树</text>

  <!-- Left: 8x8 grid, cell=22, origin (30,52), total 176 -->
  <text x="118" y="46" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">grid（红虚线=切分边界）</text>
  <g filter="url(#rough2)">
    <rect x="30" y="52" width="176" height="176" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="2"/>
    <!-- grid lines -->
    <line x1="52" y1="52" x2="52" y2="228" stroke="#bbb" stroke-width="0.8"/>
    <line x1="74" y1="52" x2="74" y2="228" stroke="#bbb" stroke-width="0.8"/>
    <line x1="96" y1="52" x2="96" y2="228" stroke="#bbb" stroke-width="0.8"/>
    <line x1="118" y1="52" x2="118" y2="228" stroke="#bbb" stroke-width="0.8"/>
    <line x1="140" y1="52" x2="140" y2="228" stroke="#bbb" stroke-width="0.8"/>
    <line x1="162" y1="52" x2="162" y2="228" stroke="#bbb" stroke-width="0.8"/>
    <line x1="184" y1="52" x2="184" y2="228" stroke="#bbb" stroke-width="0.8"/>
    <line x1="30" y1="74" x2="206" y2="74" stroke="#bbb" stroke-width="0.8"/>
    <line x1="30" y1="96" x2="206" y2="96" stroke="#bbb" stroke-width="0.8"/>
    <line x1="30" y1="118" x2="206" y2="118" stroke="#bbb" stroke-width="0.8"/>
    <line x1="30" y1="140" x2="206" y2="140" stroke="#bbb" stroke-width="0.8"/>
    <line x1="30" y1="162" x2="206" y2="162" stroke="#bbb" stroke-width="0.8"/>
    <line x1="30" y1="184" x2="206" y2="184" stroke="#bbb" stroke-width="0.8"/>
    <line x1="30" y1="206" x2="206" y2="206" stroke="#bbb" stroke-width="0.8"/>
    <!-- 4-quadrant split (bold dashed) -->
    <line x1="118" y1="52" x2="118" y2="228" stroke="#b85450" stroke-width="2.2" stroke-dasharray="5,3"/>
    <line x1="30" y1="140" x2="206" y2="140" stroke="#b85450" stroke-width="2.2" stroke-dasharray="5,3"/>
    <!-- TR sub-split (cols 4-7, rows 0-3) -->
    <line x1="162" y1="52" x2="162" y2="140" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="4,3"/>
    <line x1="118" y1="96" x2="206" y2="96" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="4,3"/>
    <!-- BR sub-split (cols 4-7, rows 4-7) -->
    <line x1="162" y1="140" x2="162" y2="228" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="4,3"/>
    <line x1="118" y1="184" x2="206" y2="184" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="4,3"/>
  </g>
  <!-- cell values: 8 rows × 8 cols -->
  <g font-size="10" fill="#555" text-anchor="middle" filter="url(#rough2)">
    <!-- row0: 1 1 1 1 0 0 0 0 -->
    <text x="41" y="67">1</text><text x="63" y="67">1</text><text x="85" y="67">1</text><text x="107" y="67">1</text><text x="129" y="67">0</text><text x="151" y="67">0</text><text x="173" y="67">0</text><text x="195" y="67">0</text>
    <!-- row1 -->
    <text x="41" y="89">1</text><text x="63" y="89">1</text><text x="85" y="89">1</text><text x="107" y="89">1</text><text x="129" y="89">0</text><text x="151" y="89">0</text><text x="173" y="89">0</text><text x="195" y="89">0</text>
    <!-- row2: ...1 1 1 1 -->
    <text x="41" y="111">1</text><text x="63" y="111">1</text><text x="85" y="111">1</text><text x="107" y="111">1</text><text x="129" y="111">1</text><text x="151" y="111">1</text><text x="173" y="111">1</text><text x="195" y="111">1</text>
    <!-- row3 -->
    <text x="41" y="133">1</text><text x="63" y="133">1</text><text x="85" y="133">1</text><text x="107" y="133">1</text><text x="129" y="133">1</text><text x="151" y="133">1</text><text x="173" y="133">1</text><text x="195" y="133">1</text>
    <!-- row4: 1 1 1 1 0 0 0 0 -->
    <text x="41" y="155">1</text><text x="63" y="155">1</text><text x="85" y="155">1</text><text x="107" y="155">1</text><text x="129" y="155">0</text><text x="151" y="155">0</text><text x="173" y="155">0</text><text x="195" y="155">0</text>
    <!-- row5 -->
    <text x="41" y="177">1</text><text x="63" y="177">1</text><text x="85" y="177">1</text><text x="107" y="177">1</text><text x="129" y="177">0</text><text x="151" y="177">0</text><text x="173" y="177">0</text><text x="195" y="177">0</text>
    <!-- row6: 1 1 1 1 1 1 1 1 -->
    <text x="41" y="199">1</text><text x="63" y="199">1</text><text x="85" y="199">1</text><text x="107" y="199">1</text><text x="129" y="199">1</text><text x="151" y="199">1</text><text x="173" y="199">1</text><text x="195" y="199">1</text>
    <!-- row7 -->
    <text x="41" y="221">1</text><text x="63" y="221">1</text><text x="85" y="221">1</text><text x="107" y="221">1</text><text x="129" y="221">1</text><text x="151" y="221">1</text><text x="173" y="221">1</text><text x="195" y="221">1</text>
  </g>
  <!-- quadrant labels -->
  <text x="74" y="248" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">TL全1→叶(1)</text>
  <text x="162" y="248" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">TR混合→再切</text>
  <text x="74" y="262" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">BL全1→叶(1)</text>
  <text x="162" y="262" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">BR混合→再切</text>

  <!-- Right: quad tree -->
  <text x="440" y="46" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">Quad-Tree 结构</text>
  <!-- root internal node -->
  <rect x="392" y="60" width="96" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="440" y="80" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">root 内部</text>
  <!-- root to 4 children -->
  <path d="M 440 92 L 440 100" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 300 110 L 580 110" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 300 110 L 300 116" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 380 110 L 380 116" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 500 110 L 500 116" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 580 110 L 580 116" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- TL leaf 1 -->
  <rect x="272" y="118" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="300" y="136" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">叶 val=1</text>

  <!-- TR internal -->
  <rect x="352" y="118" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="380" y="136" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">TR 内部</text>

  <!-- BL leaf 1 -->
  <rect x="472" y="118" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="500" y="136" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">叶 val=1</text>

  <!-- BR internal -->
  <rect x="552" y="118" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="580" y="136" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">BR 内部</text>

  <!-- TR's 4 children -->
  <path d="M 380 146 L 380 154" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 336 162 L 424 162" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 336 162 L 336 168" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 365 162 L 365 168" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 395 162 L 395 168" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 424 162 L 424 168" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <rect x="318" y="170" width="36" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="336" y="185" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">叶0</text>
  <rect x="347" y="170" width="36" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="365" y="185" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">叶0</text>
  <rect x="377" y="170" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="395" y="185" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">叶1</text>
  <rect x="406" y="170" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="424" y="185" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">叶1</text>

  <!-- BR's 4 children -->
  <path d="M 580 146 L 580 154" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 536 162 L 624 162" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 536 162 L 536 168" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 565 162 L 565 168" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 595 162 L 595 168" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 624 162 L 624 168" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <rect x="518" y="170" width="36" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="536" y="185" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">叶0</text>
  <rect x="547" y="170" width="36" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="565" y="185" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">叶0</text>
  <rect x="577" y="170" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="595" y="185" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">叶1</text>
  <rect x="606" y="170" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="624" y="185" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">叶1</text>

  <!-- bottom legend -->
  <rect x="30" y="300" width="540" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="46" y="320" font-size="11" fill="#446688">绿框=叶子(val=1)，粉框=叶子(val=0)，橙框=内部节点(isLeaf=0)；TR/BR 各再切出 2 个 0 叶 + 2 个 1 叶</text>

  <!-- result note -->
  <rect x="30" y="346" width="540" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="46" y="366" font-size="11.5" fill="#4a7a3a" font-weight="bold">结果：root 非叶 → 4 子；TL/BL 直接成叶(1)；TR/BR 非叶 → 各 4 个叶子</text>
  <text x="46" y="382" font-size="11" fill="#4a7a3a">共 1 + 2 + 8 = 11 个节点（3 内部 + 8 叶）。递归在「全同」处自然终止。</text>
  <text x="46" y="398" font-size="11" fill="#4a7a3a">每层四等分 → 树高 = log₂8 = 3；同色区域越大连成的叶子越少，正是四叉树的压缩优势。</text>
</svg>
