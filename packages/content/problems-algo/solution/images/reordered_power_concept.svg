<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：重排判定 ⇔ 数字多重集合相同</text>

  <!-- 左路：n = 125 -->
  <rect x="60" y="50" width="100" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="110" y="73" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">n = 125</text>

  <path d="M 110 88 L 110 104" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="130" y="100" font-size="10" fill="#888">拆数字</text>

  <!-- 三个数字格子 -->
  <rect x="60" y="108" width="28" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="74" y="128" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="96" y="108" width="28" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="128" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="132" y="108" width="28" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="146" y="128" text-anchor="middle" font-size="13" fill="#333">5</text>

  <path d="M 110 140 L 110 158" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="130" y="154" font-size="10" fill="#888">排序</text>

  <!-- 签名框 -->
  <rect x="58" y="162" width="104" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="110" y="184" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">签名 "125"</text>

  <!-- 右路：2^9 = 512 -->
  <rect x="340" y="50" width="120" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="400" y="73" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">2⁹ = 512</text>

  <path d="M 400 88 L 400 104" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="100" font-size="10" fill="#888">拆数字</text>

  <!-- 三个数字格子 -->
  <rect x="340" y="108" width="28" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="354" y="128" text-anchor="middle" font-size="13" fill="#333">5</text>
  <rect x="376" y="108" width="28" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="390" y="128" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="412" y="108" width="28" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="426" y="128" text-anchor="middle" font-size="13" fill="#333">2</text>

  <path d="M 400 140 L 400 158" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="154" font-size="10" fill="#888">排序</text>

  <!-- 签名框 -->
  <rect x="348" y="162" width="104" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="400" y="184" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">签名 "125"</text>

  <!-- 比对箭头 -->
  <path d="M 162 179 L 346 179" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="254" y="172" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">相同？</text>

  <!-- 匹配结果 -->
  <path d="M 254 196 L 254 226" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="170" y="230" width="170" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="19" filter="url(#rough2)"/>
  <text x="255" y="254" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">匹配！→ return true</text>

  <!-- 底部说明：排列等价 -->
  <rect x="60" y="296" width="400" height="64" fill="none" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">排列等价定理</text>
  <text x="260" y="338" text-anchor="middle" font-size="10.5" fill="#666">两个数互为重排 ⇔ 各数字出现次数完全相同</text>
  <text x="260" y="354" text-anchor="middle" font-size="10.5" fill="#666">→ 不必枚举排列，只比对「数字频率签名」即可</text>
</svg>
