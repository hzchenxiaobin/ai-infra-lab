<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">树无环：已访问邻居 = 父节点，排除父节点即满足「不回访」</text>
  <text x="320" y="46" text-anchor="middle" font-size="11" fill="#888">高亮路径 1→2→4，每段概率 = 1/分支数，累乘得 1/6</text>

  <!-- ===== Left: tree with highlighted path 1->2->4 ===== -->
  <text x="175" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① 一棵树与到 target 的唯一路径</text>

  <g font-size="12">
    <!-- normal edges -->
    <line x1="175" y1="100" x2="105" y2="160" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <line x1="175" y1="100" x2="175" y2="160" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <line x1="175" y1="100" x2="245" y2="160" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <line x1="175" y1="170" x2="175" y2="230" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>

    <!-- path edges: 1->2 (red), 2->4 (red) -->
    <line x1="175" y1="100" x2="105" y2="160" stroke="#b85450" stroke-width="2.6" filter="url(#rough2)"/>
    <line x1="105" y1="170" x2="65" y2="230" stroke="#b85450" stroke-width="2.6" filter="url(#rough2)"/>
    <line x1="105" y1="170" x2="145" y2="230" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>

    <!-- branch factor labels -->
    <rect x="138" y="118" width="22" height="16" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="149" y="130" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">÷3</text>
    <rect x="70" y="188" width="22" height="16" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="81" y="200" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">÷2</text>

    <!-- nodes: path nodes (1,2,4) orange, others blue -->
    <circle cx="175" cy="92" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="175" y="97" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>

    <circle cx="105" cy="165" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="105" y="170" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>

    <circle cx="175" cy="165" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="175" y="170" text-anchor="middle" fill="#446688" font-weight="bold">3</text>

    <circle cx="245" cy="165" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="245" y="170" text-anchor="middle" fill="#446688" font-weight="bold">7</text>

    <circle cx="65" cy="235" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="65" y="240" text-anchor="middle" fill="#d6a040" font-weight="bold">4</text>

    <circle cx="145" cy="235" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="145" y="240" text-anchor="middle" fill="#446688" font-weight="bold">6</text>

    <circle cx="175" cy="235" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="175" y="240" text-anchor="middle" fill="#446688" font-weight="bold">5</text>
  </g>

  <text x="175" y="276" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1→2→4：唯一路径，概率 1/3 × 1/2</text>
  <text x="175" y="292" text-anchor="middle" font-size="10" fill="#888">节点 1 有 3 邻居 ÷3；节点 2 剔除父 1 后剩 2 邻居 ÷2</text>

  <!-- ===== Right: insight boxes ===== -->
  <text x="475" y="74" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">② 树无环 ⟹ 历史依赖消失</text>

  <rect x="355" y="86" width="240" height="80" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="475" y="108" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">已访问邻居 = 父节点（唯一）</text>
  <text x="367" y="130" font-size="11" fill="#444">剔除 parent 后，剩余邻居全部未访问</text>
  <text x="367" y="148" font-size="10" fill="#888">无环 ⟹ 邻居子树不与已访问部分相交</text>

  <rect x="355" y="178" width="240" height="80" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="475" y="200" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">概率沿父指针传播</text>
  <text x="367" y="222" font-size="11" fill="#333" font-family="monospace">cnt = deg(u) - [u≠1]</text>
  <text x="367" y="240" font-size="11" fill="#333" font-family="monospace">prob ← prob / cnt</text>

  <rect x="355" y="270" width="240" height="80" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="475" y="292" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">三态判定</text>
  <text x="367" y="312" font-size="10" fill="#444">A. time==t 且 u==target → 返回 prob</text>
  <text x="367" y="328" font-size="10" fill="#444">B. cnt==0（卡住）且 u==target → 返回 prob</text>
  <text x="367" y="344" font-size="10" fill="#444">C. cnt&gt;0 → 分发到各未访问邻居</text>

  <!-- bottom note -->
  <rect x="30" y="380" width="580" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="320" y="400" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">关键洞察：「不能回访」在树上坍缩为「不走回父节点」</text>
  <text x="320" y="416" text-anchor="middle" font-size="10" fill="#666">2^n 掩码 DP → 一个 parent 参数即可，O(n) 一趟 DFS</text>
</svg>
