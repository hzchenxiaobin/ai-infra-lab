<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="6" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>

  <rect width="720" height="380" fill="#fdfcf7"/>

  <text x="360" y="28" text-anchor="middle" font-size="17" fill="#2b2b2b" font-weight="bold">示例演算：words = ["cd","f","kl"]</text>
  <path d="M 240 36 Q 360 44 480 36" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <text x="360" y="52" text-anchor="middle" font-size="11" fill="#888">流：a→b→c→d→e→f→g→h→i→j→k→l，逐步查询（仅列关键步）</text>

  <!-- Table header -->
  <g filter="url(#sk)">
    <rect x="30" y="68" width="660" height="30" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <line x1="100" y1="68" x2="100" y2="98" stroke="#4a8edb" stroke-width="1"/>
    <line x1="240" y1="68" x2="240" y2="98" stroke="#4a8edb" stroke-width="1"/>
    <line x1="520" y1="68" x2="520" y2="98" stroke="#4a8edb" stroke-width="1"/>
    <line x1="590" y1="68" x2="590" y2="98" stroke="#4a8edb" stroke-width="1"/>
  </g>
  <text x="65" y="88" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold">query</text>
  <text x="170" y="88" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold">stream 尾部</text>
  <text x="380" y="88" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold">Trie 倒走路径（新→旧）</text>
  <text x="555" y="88" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold">命中</text>
  <text x="635" y="88" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold">结果</text>

  <!-- Row 1: query c -->
  <g filter="url(#sk)">
    <rect x="30" y="98" width="660" height="34" fill="#fffdf3" stroke="#cccccc" stroke-width="0.8"/>
    <line x1="100" y1="98" x2="100" y2="132" stroke="#cccccc" stroke-width="0.6"/>
    <line x1="240" y1="98" x2="240" y2="132" stroke="#cccccc" stroke-width="0.6"/>
    <line x1="520" y1="98" x2="520" y2="132" stroke="#cccccc" stroke-width="0.6"/>
    <line x1="590" y1="98" x2="590" y2="132" stroke="#cccccc" stroke-width="0.6"/>
  </g>
  <text x="65" y="120" text-anchor="middle" font-size="13" fill="#2b2b2b">c</text>
  <text x="170" y="120" text-anchor="middle" font-size="12" fill="#444">…c</text>
  <text x="380" y="120" text-anchor="middle" font-size="11" fill="#888">root → c? 无此边</text>
  <text x="555" y="120" text-anchor="middle" font-size="14" fill="#b85450">✗</text>
  <text x="635" y="120" text-anchor="middle" font-size="12" fill="#b85450">false</text>

  <!-- Row 2: query d -->
  <g filter="url(#sk)">
    <rect x="30" y="132" width="660" height="34" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1"/>
    <line x1="100" y1="132" x2="100" y2="166" stroke="#4a8e4a" stroke-width="0.6"/>
    <line x1="240" y1="132" x2="240" y2="166" stroke="#4a8e4a" stroke-width="0.6"/>
    <line x1="520" y1="132" x2="520" y2="166" stroke="#4a8e4a" stroke-width="0.6"/>
    <line x1="590" y1="132" x2="590" y2="166" stroke="#4a8e4a" stroke-width="0.6"/>
  </g>
  <text x="65" y="154" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold">d</text>
  <text x="170" y="154" text-anchor="middle" font-size="12" fill="#444">…cd</text>
  <text x="380" y="154" text-anchor="middle" font-size="11" fill="#4a8e4a">root → d → c ●</text>
  <text x="555" y="154" text-anchor="middle" font-size="14" fill="#4a8e4a">✓</text>
  <text x="635" y="154" text-anchor="middle" font-size="12" fill="#4a8e4a" font-weight="bold">true</text>

  <!-- Row 3: query e -->
  <g filter="url(#sk)">
    <rect x="30" y="166" width="660" height="34" fill="#fffdf3" stroke="#cccccc" stroke-width="0.8"/>
    <line x1="100" y1="166" x2="100" y2="200" stroke="#cccccc" stroke-width="0.6"/>
    <line x1="240" y1="166" x2="240" y2="200" stroke="#cccccc" stroke-width="0.6"/>
    <line x1="520" y1="166" x2="520" y2="200" stroke="#cccccc" stroke-width="0.6"/>
    <line x1="590" y1="166" x2="590" y2="200" stroke="#cccccc" stroke-width="0.6"/>
  </g>
  <text x="65" y="188" text-anchor="middle" font-size="13" fill="#2b2b2b">e</text>
  <text x="170" y="188" text-anchor="middle" font-size="12" fill="#444">…cde</text>
  <text x="380" y="188" text-anchor="middle" font-size="11" fill="#888">root → e? 无此边</text>
  <text x="555" y="188" text-anchor="middle" font-size="14" fill="#b85450">✗</text>
  <text x="635" y="188" text-anchor="middle" font-size="12" fill="#b85450">false</text>

  <!-- Row 4: query f -->
  <g filter="url(#sk)">
    <rect x="30" y="200" width="660" height="34" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1"/>
    <line x1="100" y1="200" x2="100" y2="234" stroke="#4a8e4a" stroke-width="0.6"/>
    <line x1="240" y1="200" x2="240" y2="234" stroke="#4a8e4a" stroke-width="0.6"/>
    <line x1="520" y1="200" x2="520" y2="234" stroke="#4a8e4a" stroke-width="0.6"/>
    <line x1="590" y1="200" x2="590" y2="234" stroke="#4a8e4a" stroke-width="0.6"/>
  </g>
  <text x="65" y="222" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold">f</text>
  <text x="170" y="222" text-anchor="middle" font-size="12" fill="#444">…ef</text>
  <text x="380" y="222" text-anchor="middle" font-size="11" fill="#4a8e4a">root → f ●</text>
  <text x="555" y="222" text-anchor="middle" font-size="14" fill="#4a8e4a">✓</text>
  <text x="635" y="222" text-anchor="middle" font-size="12" fill="#4a8e4a" font-weight="bold">true</text>

  <!-- Row 5: query k -->
  <g filter="url(#sk)">
    <rect x="30" y="234" width="660" height="34" fill="#fffdf3" stroke="#cccccc" stroke-width="0.8"/>
    <line x1="100" y1="234" x2="100" y2="268" stroke="#cccccc" stroke-width="0.6"/>
    <line x1="240" y1="234" x2="240" y2="268" stroke="#cccccc" stroke-width="0.6"/>
    <line x1="520" y1="234" x2="520" y2="268" stroke="#cccccc" stroke-width="0.6"/>
    <line x1="590" y1="234" x2="590" y2="268" stroke="#cccccc" stroke-width="0.6"/>
  </g>
  <text x="65" y="256" text-anchor="middle" font-size="13" fill="#2b2b2b">k</text>
  <text x="170" y="256" text-anchor="middle" font-size="12" fill="#444">…jk</text>
  <text x="380" y="256" text-anchor="middle" font-size="11" fill="#888">root → k? 无此边</text>
  <text x="555" y="256" text-anchor="middle" font-size="14" fill="#b85450">✗</text>
  <text x="635" y="256" text-anchor="middle" font-size="12" fill="#b85450">false</text>

  <!-- Row 6: query l -->
  <g filter="url(#sk)">
    <rect x="30" y="268" width="660" height="34" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1"/>
    <line x1="100" y1="268" x2="100" y2="302" stroke="#4a8e4a" stroke-width="0.6"/>
    <line x1="240" y1="268" x2="240" y2="302" stroke="#4a8e4a" stroke-width="0.6"/>
    <line x1="520" y1="268" x2="520" y2="302" stroke="#4a8e4a" stroke-width="0.6"/>
    <line x1="590" y1="268" x2="590" y2="302" stroke="#4a8e4a" stroke-width="0.6"/>
  </g>
  <text x="65" y="290" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold">l</text>
  <text x="170" y="290" text-anchor="middle" font-size="12" fill="#444">…jkl</text>
  <text x="380" y="290" text-anchor="middle" font-size="11" fill="#4a8e4a">root → l → k ●</text>
  <text x="555" y="290" text-anchor="middle" font-size="14" fill="#4a8e4a">✓</text>
  <text x="635" y="290" text-anchor="middle" font-size="12" fill="#4a8e4a" font-weight="bold">true</text>

  <!-- Bottom note -->
  <g filter="url(#sk)">
    <rect x="30" y="315" width="660" height="50" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2" stroke-dasharray="5,3"/>
  </g>
  <text x="50" y="338" font-size="11" fill="#2b2b2b" font-weight="bold">关键：</text>
  <text x="100" y="338" font-size="11" fill="#444">query('d') 时流尾部为 "…cd"，从 d 倒走：root→d→c(●) 命中 "cd"。</text>
  <text x="100" y="356" font-size="11" fill="#444">最长单词 200 字符，倒走最多 200 步即可截断，无需遍历整个流。</text>
</svg>
