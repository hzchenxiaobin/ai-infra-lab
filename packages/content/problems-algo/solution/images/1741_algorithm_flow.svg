<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">SQL 执行流程：FROM → GROUP BY → SELECT</text>

  <!-- ===== Step 1: FROM ===== -->
  <text x="60" y="52" font-size="10" fill="#888">① FROM</text>
  <g filter="url(#rough2)"><rect x="50" y="58" width="220" height="44" fill="#fff" stroke="#446688" stroke-width="1.5" rx="8"/></g>
  <text x="160" y="78" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">FROM Employees</text>
  <text x="160" y="94" text-anchor="middle" font-size="9" fill="#888">读取全部进出事件行</text>

  <!-- Arrow 1 -->
  <path d="M 160 104 L 160 118" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: GROUP BY (two columns) ===== -->
  <text x="60" y="128" font-size="10" fill="#888">② GROUP BY</text>
  <g filter="url(#rough2)"><rect x="50" y="134" width="220" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8"/></g>
  <text x="160" y="156" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">GROUP BY event_day,</text>
  <text x="160" y="172" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">emp_id</text>
  <text x="160" y="186" text-anchor="middle" font-size="9" fill="#888">按「日期 + 员工」二维键折叠</text>

  <!-- Arrow 2 -->
  <path d="M 160 194 L 160 208" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: SELECT + SUM ===== -->
  <text x="60" y="218" font-size="10" fill="#888">③ SELECT</text>
  <g filter="url(#rough2)"><rect x="50" y="224" width="220" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/></g>
  <text x="160" y="244" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">SELECT event_day AS day,</text>
  <text x="160" y="260" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">emp_id,</text>
  <text x="160" y="276" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">SUM(out_time - in_time)</text>
  <text x="160" y="294" text-anchor="middle" font-size="9" fill="#888">每组差值求和 + 列重命名</text>

  <!-- ===== Right side: note on execution order ===== -->
  <g filter="url(#rough2)"><rect x="310" y="134" width="210" height="100" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="330" y="156" font-size="11" fill="#b85450" font-weight="bold">⚠️ 执行顺序要点</text>
  <text x="330" y="174" font-size="10" fill="#b85450">FROM → WHERE → GROUP BY</text>
  <text x="330" y="190" font-size="10" fill="#b85450">→ HAVING → SELECT</text>
  <text x="330" y="206" font-size="10" fill="#b85450">→ ORDER BY → LIMIT</text>
  <text x="330" y="226" font-size="9" fill="#888">GROUP BY 早于 SELECT</text>

  <!-- ===== Right side: dual-column note ===== -->
  <g filter="url(#rough2)"><rect x="310" y="250" width="210" height="92" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <text x="330" y="272" font-size="11" fill="#2e6e2e" font-weight="bold">💡 为何分两列？</text>
  <text x="330" y="290" font-size="10" fill="#2e6e2e">「每人每天」= 二维粒度</text>
  <text x="330" y="306" font-size="10" fill="#2e6e2e">缺一列则合并过粗</text>
  <text x="330" y="324" font-size="9" fill="#888">输出非聚合列须入 GROUP BY</text>

  <!-- ===== Bottom: no ORDER BY note ===== -->
  <g filter="url(#rough2)"><rect x="50" y="316" width="220" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/></g>
  <text x="160" y="336" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">（无 ORDER BY，顺序无要求）</text>
  <text x="160" y="352" text-anchor="middle" font-size="9" fill="#888">省排序开销；调试可加 ORDER BY</text>
</svg>
