<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    示例 2 演算：cost = [[1,3,5],[4,1,1],[1,5,3]]
  </text>

  <!-- minCost2 -->
  <rect x="30" y="44" width="220" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="140" y="63" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">
    minCost2 = [1, 1, 1]（每列最小）
  </text>

  <!-- DP Table Header -->
  <!-- Column headers: mask values -->
  <text x="100" y="98" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">mask</text>
  <text x="150" y="98" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">000</text>
  <text x="195" y="98" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">001</text>
  <text x="240" y="98" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">010</text>
  <text x="285" y="98" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">011</text>
  <text x="330" y="98" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">100</text>
  <text x="375" y="98" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">101</text>
  <text x="420" y="98" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">110</text>
  <text x="465" y="98" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">111</text>

  <!-- Row: Init -->
  <text x="100" y="122" text-anchor="end" font-size="10" fill="#555" filter="url(#rough2)">初始</text>
  <rect x="135" y="108" width="30" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="150" y="123" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <text x="195" y="123" text-anchor="middle" font-size="10" fill="#ccc" filter="url(#rough2)">∞</text>
  <text x="240" y="123" text-anchor="middle" font-size="10" fill="#ccc" filter="url(#rough2)">∞</text>
  <text x="285" y="123" text-anchor="middle" font-size="10" fill="#ccc" filter="url(#rough2)">∞</text>
  <text x="330" y="123" text-anchor="middle" font-size="10" fill="#ccc" filter="url(#rough2)">∞</text>
  <text x="375" y="123" text-anchor="middle" font-size="10" fill="#ccc" filter="url(#rough2)">∞</text>
  <text x="420" y="123" text-anchor="middle" font-size="10" fill="#ccc" filter="url(#rough2)">∞</text>
  <text x="465" y="123" text-anchor="middle" font-size="10" fill="#ccc" filter="url(#rough2)">∞</text>

  <!-- Row: after point 0 -->
  <text x="100" y="152" text-anchor="end" font-size="10" fill="#555" filter="url(#rough2)">点0</text>
  <text x="150" y="153" text-anchor="middle" font-size="10" fill="#ccc" filter="url(#rough2)">∞</text>
  <rect x="180" y="138" width="30" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="195" y="153" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <rect x="225" y="138" width="30" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="240" y="153" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="285" y="153" text-anchor="middle" font-size="10" fill="#ccc" filter="url(#rough2)">∞</text>
  <rect x="315" y="138" width="30" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="330" y="153" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">5</text>
  <text x="375" y="153" text-anchor="middle" font-size="10" fill="#ccc" filter="url(#rough2)">∞</text>
  <text x="420" y="153" text-anchor="middle" font-size="10" fill="#ccc" filter="url(#rough2)">∞</text>
  <text x="465" y="153" text-anchor="middle" font-size="10" fill="#ccc" filter="url(#rough2)">∞</text>

  <!-- Row: after point 1 -->
  <text x="100" y="182" text-anchor="end" font-size="10" fill="#555" filter="url(#rough2)">点1</text>
  <text x="150" y="183" text-anchor="middle" font-size="10" fill="#ccc" filter="url(#rough2)">∞</text>
  <text x="195" y="183" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">5</text>
  <text x="240" y="183" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4</text>
  <rect x="270" y="168" width="30" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="285" y="183" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="330" y="183" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">6</text>
  <rect x="360" y="168" width="30" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="375" y="183" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <rect x="405" y="168" width="30" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="420" y="183" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4</text>
  <text x="465" y="183" text-anchor="middle" font-size="10" fill="#ccc" filter="url(#rough2)">∞</text>

  <!-- Row: after point 2 (final dp) -->
  <text x="100" y="212" text-anchor="end" font-size="10" fill="#555" filter="url(#rough2)">点2</text>
  <text x="150" y="213" text-anchor="middle" font-size="10" fill="#ccc" filter="url(#rough2)">∞</text>
  <text x="195" y="213" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">6</text>
  <text x="240" y="213" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">9</text>
  <rect x="270" y="198" width="30" height="22" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="285" y="213" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="330" y="213" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">9</text>
  <rect x="360" y="198" width="30" height="22" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="375" y="213" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="420" y="213" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">7</text>
  <text x="465" y="213" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">5</text>

  <!-- Separator line -->
  <line x1="30" y1="234" x2="510" y2="234" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Final answer computation -->
  <text x="270" y="258" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    最终：dp[mask] + extraCost[mask]
  </text>

  <!-- Answer table -->
  <text x="100" y="288" text-anchor="end" font-size="10" fill="#555" filter="url(#rough2)">mask=011</text>
  <text x="200" y="288" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">dp=3</text>
  <text x="280" y="288" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">未覆盖{2}</text>
  <text x="380" y="288" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">extra=1</text>
  <rect x="430" y="274" width="50" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="455" y="289" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4 ⭐</text>

  <text x="100" y="318" text-anchor="end" font-size="10" fill="#555" filter="url(#rough2)">mask=101</text>
  <text x="200" y="318" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">dp=3</text>
  <text x="280" y="318" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">未覆盖{1}</text>
  <text x="380" y="318" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">extra=1</text>
  <rect x="430" y="304" width="50" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="455" y="319" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4 ⭐</text>

  <text x="100" y="348" text-anchor="end" font-size="10" fill="#555" filter="url(#rough2)">mask=111</text>
  <text x="200" y="348" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">dp=5</text>
  <text x="280" y="348" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">全覆盖</text>
  <text x="380" y="348" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">extra=0</text>
  <text x="455" y="349" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">5</text>

  <text x="100" y="378" text-anchor="end" font-size="10" fill="#555" filter="url(#rough2)">mask=001</text>
  <text x="200" y="378" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">dp=6</text>
  <text x="280" y="378" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">未覆盖{1,2}</text>
  <text x="380" y="378" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">extra=2</text>
  <text x="455" y="379" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">8</text>

  <!-- Answer box -->
  <rect x="150" y="400" width="240" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="420" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    答案 = 4 ✓
  </text>
</svg>
