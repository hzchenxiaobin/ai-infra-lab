<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = &quot;abab&quot;，n = 4</text>

  <!-- header row of step table -->
  <rect x="30" y="48" width="520" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="60" y="65" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">步</text>
  <text x="120" y="65" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">i, j, k</text>
  <text x="200" y="65" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">比较 s[i+k] vs s[j+k]</text>
  <text x="320" y="65" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">判定</text>
  <text x="470" y="65" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">动作</text>

  <!-- Step 1 -->
  <rect x="30" y="74" width="520" height="30" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="60" y="93" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="120" y="93" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0,1,0</text>
  <text x="200" y="93" text-anchor="middle" font-size="11" fill="#b85450">a</text>
  <text x="222" y="93" text-anchor="middle" font-size="11" fill="#888">&lt;</text>
  <text x="244" y="93" text-anchor="middle" font-size="11" fill="#4a7a3a">b</text>
  <text x="320" y="93" text-anchor="middle" font-size="10.5" fill="#b85450">i 落败</text>
  <text x="470" y="93" text-anchor="middle" font-size="10.5" fill="#555">i=1; i≥j → j=2; k=0</text>

  <!-- Step 2 -->
  <rect x="30" y="104" width="520" height="30" fill="#f7f7f7" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="60" y="123" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="120" y="123" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1,2,0</text>
  <text x="200" y="123" text-anchor="middle" font-size="11" fill="#4a7a3a">b</text>
  <text x="222" y="123" text-anchor="middle" font-size="11" fill="#888">&gt;</text>
  <text x="244" y="123" text-anchor="middle" font-size="11" fill="#b85450">a</text>
  <text x="320" y="123" text-anchor="middle" font-size="10.5" fill="#4a7a3a">j 落败</text>
  <text x="470" y="123" text-anchor="middle" font-size="10.5" fill="#555">j=3; k=0</text>

  <!-- Step 3 -->
  <rect x="30" y="134" width="520" height="30" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="60" y="153" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="120" y="153" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1,3,0</text>
  <text x="200" y="153" text-anchor="middle" font-size="11" fill="#888">b</text>
  <text x="222" y="153" text-anchor="middle" font-size="11" fill="#888">=</text>
  <text x="244" y="153" text-anchor="middle" font-size="11" fill="#888">b</text>
  <text x="320" y="153" text-anchor="middle" font-size="10.5" fill="#446688">相等</text>
  <text x="470" y="153" text-anchor="middle" font-size="10.5" fill="#555">k=1</text>

  <!-- Step 4: loop end -->
  <rect x="30" y="164" width="520" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="60" y="183" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="120" y="183" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1,3,1</text>
  <text x="200" y="183" text-anchor="middle" font-size="10.5" fill="#888">j+k=4 ≮ n</text>
  <text x="320" y="183" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">循环结束</text>
  <text x="470" y="183" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">返回 s[1:]=&quot;bab&quot;</text>

  <!-- final pointer state visualization -->
  <text x="40" y="222" font-size="12" fill="#888" font-weight="bold">终态：i=1 指向最大后缀起点</text>

  <text x="40" y="248" font-size="11" fill="#888">s =</text>
  <!-- abab cells -->
  <rect x="80" y="232" width="44" height="34" fill="#f2f2f2" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="102" y="253" text-anchor="middle" font-size="14" fill="#aaa" font-weight="bold">a</text>
  <rect x="124" y="232" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="146" y="253" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>
  <rect x="168" y="232" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="253" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="212" y="232" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="234" y="253" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>

  <!-- i pointer arrow -->
  <path d="M 146 222 L 146 230" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="146" y="216" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">i=1</text>

  <text x="80" y="288" font-size="11" fill="#4a7a3a" font-weight="bold">答案后缀 s[1:] = &quot;bab&quot;</text>

  <line x1="30" y1="306" x2="550" y2="306" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- quick check leetcode -->
  <text x="40" y="328" font-size="12" fill="#888" font-weight="bold">同法验证 s = &quot;leetcode&quot; → i 最终停在 3 → s[3:]=&quot;tcode&quot; ✓</text>

  <text x="40" y="352" font-size="10.5" fill="#666">要点：i、j 是两个候选后缀起点；k 记已对齐长度；</text>
  <text x="40" y="368" font-size="10.5" fill="#666">失配时败方一次性跳 k+1 步（败方及其后 k 个起点都无望），保证均摊线性。</text>

  <rect x="30" y="384" width="520" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="290" y="402" text-anchor="middle" font-size="10.5" fill="#555" font-style="italic">i、j 总共只向前移动，每步比较均摊 O(1) → 全程 O(n)</text>
</svg>
