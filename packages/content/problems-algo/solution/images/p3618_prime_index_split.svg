<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：分割只看「下标」是否为质数</text>

  <!-- 数组格子（示例 2：nums = [-1, 5, 7, 0]） -->
  <rect x="140" y="56" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="163" y="79" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−1</text>
  <rect x="190" y="56" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="213" y="79" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="240" y="56" width="46" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="263" y="79" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <rect x="290" y="56" width="46" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="313" y="79" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>

  <text x="163" y="112" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=0</text>
  <text x="213" y="112" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=1</text>
  <text x="263" y="112" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">i=2</text>
  <text x="313" y="112" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">i=3</text>

  <!-- 分桶箭头 -->
  <path d="M 163 118 C 195 150, 330 158, 372 186" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 213 118 C 255 158, 355 168, 418 186" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 263 118 C 235 150, 165 160, 110 186" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 313 118 C 305 158, 235 172, 165 186" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 桶 A -->
  <rect x="48" y="190" width="150" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="123" y="210" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">A：质数下标</text>
  <text x="123" y="230" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">元素 {7, 0}</text>
  <text x="123" y="252" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">sum(A) = 7</text>

  <!-- 桶 B -->
  <rect x="322" y="190" width="150" height="78" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="397" y="210" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">B：其余下标</text>
  <text x="397" y="230" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">元素 {−1, 5}</text>
  <text x="397" y="252" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">sum(B) = 4</text>

  <!-- 汇聚到结果 -->
  <path d="M 123 268 C 123 290, 200 296, 232 300" fill="none" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 397 268 C 397 290, 320 296, 288 300" fill="none" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <rect x="170" y="304" width="180" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="325" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">|7 − 4| = 3</text>

  <!-- 侧注 -->
  <text x="452" y="70" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">绿色 → 质数下标</text>
  <text x="452" y="90" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">蓝色 → 其余下标</text>
  <text x="452" y="110" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">注意 0、1 非质数</text>

  <text x="16" y="348" font-size="10" fill="#999" filter="url(#rough2)">注：质数 = 大于 1 且仅有 1 和自身两个因子的自然数</text>
</svg>
