<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：公司 A 与 B 的中位数定位过程</text>

  <!-- Company A walkthrough -->
  <text x="60" y="56" font-size="11" fill="#b85450" font-weight="bold">公司 A：6 人，排序后 rn=1→6，中位数区间 [⌊7/2⌋, ⌊8/2⌋] = [3, 4]</text>

  <!-- Row 1 -->
  <rect x="30" y="66" width="540" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="84" font-size="9.5" fill="#666">rn=1</text>
  <text x="110" y="84" font-size="10" fill="#333">salary=15</text>
  <text x="220" y="84" font-size="9.5" fill="#666">cnt=6</text>
  <text x="300" y="84" font-size="10" fill="#888">3 ≤ 1 ≤ 4?</text>
  <text x="420" y="84" font-size="10" fill="#888">否 → 跳过</text>

  <!-- Row 2 -->
  <rect x="30" y="96" width="540" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="114" font-size="9.5" fill="#666">rn=2</text>
  <text x="110" y="114" font-size="10" fill="#333">salary=341</text>
  <text x="220" y="114" font-size="9.5" fill="#666">cnt=6</text>
  <text x="300" y="114" font-size="10" fill="#888">3 ≤ 2 ≤ 4?</text>
  <text x="420" y="114" font-size="10" fill="#888">否 → 跳过</text>

  <!-- Row 3 - HIT -->
  <rect x="30" y="126" width="540" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="50" y="146" font-size="10" fill="#b85450" font-weight="bold">rn=3</text>
  <text x="110" y="146" font-size="10" fill="#b85450" font-weight="bold">salary=451</text>
  <text x="220" y="146" font-size="9.5" fill="#666">cnt=6</text>
  <text x="300" y="146" font-size="10" fill="#b85450" font-weight="bold">3 ≤ 3 ≤ 4?</text>
  <text x="420" y="146" font-size="10" fill="#b85450" font-weight="bold">是 → 输出 (id=5, 451)</text>

  <!-- Row 4 - HIT -->
  <rect x="30" y="160" width="540" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="50" y="180" font-size="10" fill="#b85450" font-weight="bold">rn=4</text>
  <text x="110" y="180" font-size="10" fill="#b85450" font-weight="bold">salary=513</text>
  <text x="220" y="180" font-size="9.5" fill="#666">cnt=6</text>
  <text x="300" y="180" font-size="10" fill="#b85450" font-weight="bold">3 ≤ 4 ≤ 4?</text>
  <text x="420" y="180" font-size="10" fill="#b85450" font-weight="bold">是 → 输出 (id=6, 513)</text>

  <!-- Row 5 -->
  <rect x="30" y="194" width="540" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="212" font-size="9.5" fill="#666">rn=5</text>
  <text x="110" y="212" font-size="10" fill="#333">salary=2341</text>
  <text x="220" y="212" font-size="9.5" fill="#666">cnt=6</text>
  <text x="300" y="212" font-size="10" fill="#888">3 ≤ 5 ≤ 4?</text>
  <text x="420" y="212" font-size="10" fill="#888">否 → 跳过</text>

  <!-- Row 6 -->
  <rect x="30" y="224" width="540" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="242" font-size="9.5" fill="#666">rn=6</text>
  <text x="110" y="242" font-size="10" fill="#333">salary=15314</text>
  <text x="220" y="242" font-size="9.5" fill="#666">cnt=6</text>
  <text x="300" y="242" font-size="10" fill="#888">3 ≤ 6 ≤ 4?</text>
  <text x="420" y="242" font-size="10" fill="#888">否 → 跳过</text>

  <!-- Divider -->
  <line x1="30" y1="262" x2="570" y2="262" stroke="#4a7a3a" stroke-width="0.8" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Company B walkthrough -->
  <text x="60" y="282" font-size="11" fill="#4a7a3a" font-weight="bold">公司 B：4 人，排序后 rn=1→4，中位数区间 [⌊5/2⌋, ⌊6/2⌋] = [2, 3]</text>

  <!-- Row 1 -->
  <rect x="30" y="292" width="540" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="308" font-size="9.5" fill="#666">rn=1</text>
  <text x="110" y="308" font-size="10" fill="#333">salary=13</text>
  <text x="220" y="308" font-size="9.5" fill="#666">cnt=4</text>
  <text x="300" y="308" font-size="10" fill="#888">2 ≤ 1 ≤ 3?</text>
  <text x="420" y="308" font-size="10" fill="#888">否 → 跳过</text>

  <!-- Row 2 - HIT -->
  <rect x="30" y="318" width="540" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="50" y="336" font-size="10" fill="#b85450" font-weight="bold">rn=2</text>
  <text x="110" y="336" font-size="10" fill="#b85450" font-weight="bold">salary=15</text>
  <text x="220" y="336" font-size="9.5" fill="#666">cnt=4</text>
  <text x="300" y="336" font-size="10" fill="#b85450" font-weight="bold">2 ≤ 2 ≤ 3?</text>
  <text x="420" y="336" font-size="10" fill="#b85450" font-weight="bold">是 → 输出 (id=7, 15)</text>

  <!-- Row 3 - HIT -->
  <rect x="30" y="348" width="540" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="50" y="366" font-size="10" fill="#b85450" font-weight="bold">rn=3</text>
  <text x="110" y="366" font-size="10" fill="#b85450" font-weight="bold">salary=1154</text>
  <text x="220" y="366" font-size="9.5" fill="#666">cnt=4</text>
  <text x="300" y="366" font-size="10" fill="#b85450" font-weight="bold">2 ≤ 3 ≤ 3?</text>
  <text x="420" y="366" font-size="10" fill="#b85450" font-weight="bold">是 → 输出 (id=9, 1154)</text>

  <!-- Row 4 -->
  <rect x="30" y="378" width="540" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="394" font-size="9.5" fill="#666">rn=4</text>
  <text x="110" y="394" font-size="10" fill="#333">salary=1345</text>
  <text x="220" y="394" font-size="9.5" fill="#666">cnt=4</text>
  <text x="300" y="394" font-size="10" fill="#888">2 ≤ 4 ≤ 3?</text>
  <text x="420" y="394" font-size="10" fill="#888">否 → 跳过</text>

  <text x="300" y="412" text-anchor="middle" font-size="9.5" fill="#666">↑ 偶数 n 取两行；奇数 n（如 n=5）区间 [3,3] 只取一行</text>
</svg>
