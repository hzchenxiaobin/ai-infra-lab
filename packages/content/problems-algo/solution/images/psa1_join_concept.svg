<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="360" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：用 product_id 桥接 Sales 与 Product</text>

  <!-- Sales label -->
  <text x="139" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Sales 表（销售记录）</text>

  <!-- Sales header -->
  <rect x="24" y="60" width="230" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="45" y="75" text-anchor="middle" font-size="9" fill="#446688">sale_id</text>
  <text x="94" y="75" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">product_id</text>
  <text x="143" y="75" text-anchor="middle" font-size="9" fill="#446688">year</text>
  <text x="189" y="75" text-anchor="middle" font-size="9" fill="#446688">quantity</text>
  <text x="234" y="75" text-anchor="middle" font-size="9" fill="#446688">price</text>

  <!-- Sales product_id column highlight -->
  <rect x="66" y="82" width="56" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>

  <!-- Sales data rows -->
  <text x="45" y="97" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="94" y="97" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">100</text>
  <text x="143" y="97" text-anchor="middle" font-size="9" fill="#333">2008</text>
  <text x="189" y="97" text-anchor="middle" font-size="9" fill="#333">10</text>
  <text x="234" y="97" text-anchor="middle" font-size="9" fill="#333">5000</text>

  <text x="45" y="115" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="94" y="115" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">100</text>
  <text x="143" y="115" text-anchor="middle" font-size="9" fill="#333">2009</text>
  <text x="189" y="115" text-anchor="middle" font-size="9" fill="#333">12</text>
  <text x="234" y="115" text-anchor="middle" font-size="9" fill="#333">5000</text>

  <text x="45" y="133" text-anchor="middle" font-size="9" fill="#333">7</text>
  <text x="94" y="133" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">200</text>
  <text x="143" y="133" text-anchor="middle" font-size="9" fill="#333">2011</text>
  <text x="189" y="133" text-anchor="middle" font-size="9" fill="#333">15</text>
  <text x="234" y="133" text-anchor="middle" font-size="9" fill="#333">9000</text>

  <!-- Sales dividers -->
  <line x1="66" y1="60" x2="66" y2="136" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="122" y1="60" x2="122" y2="136" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="164" y1="60" x2="164" y2="136" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="214" y1="60" x2="214" y2="136" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="24" y1="82" x2="254" y2="82" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <rect x="24" y="60" width="230" height="76" fill="none" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>

  <!-- Product label -->
  <text x="458" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Product 表（产品信息）</text>

  <!-- Product header -->
  <rect x="356" y="60" width="204" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="398" y="75" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">product_id</text>
  <text x="500" y="75" text-anchor="middle" font-size="9" fill="#446688">product_name</text>

  <!-- Product product_id column highlight -->
  <rect x="356" y="82" width="84" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>

  <!-- Product data rows -->
  <text x="398" y="97" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">100</text>
  <text x="500" y="97" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">Nokia</text>

  <text x="398" y="115" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">200</text>
  <text x="500" y="115" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">Apple</text>

  <text x="398" y="133" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">300</text>
  <text x="500" y="133" text-anchor="middle" font-size="9" fill="#b85450">Samsung</text>

  <!-- Product dividers -->
  <line x1="440" y1="60" x2="440" y2="136" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="356" y1="82" x2="560" y2="82" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <rect x="356" y="60" width="204" height="76" fill="none" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>

  <!-- Bridge arrow -->
  <path d="M254 109 L350 109" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="302" y="102" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">JOIN ON</text>
  <text x="302" y="123" text-anchor="middle" font-size="8" fill="#d6a040">product_id</text>

  <!-- Down arrow to result -->
  <path d="M300 146 L300 174" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Result table -->
  <rect x="190" y="180" width="220" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="235" y="195" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">product_name</text>
  <text x="315" y="195" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">year</text>
  <text x="375" y="195" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">price</text>

  <rect x="190" y="202" width="220" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="235" y="215" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">Nokia</text>
  <text x="315" y="215" text-anchor="middle" font-size="9" fill="#333">2008</text>
  <text x="375" y="215" text-anchor="middle" font-size="9" fill="#333">5000</text>

  <rect x="190" y="220" width="220" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="235" y="233" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">Nokia</text>
  <text x="315" y="233" text-anchor="middle" font-size="9" fill="#333">2009</text>
  <text x="375" y="233" text-anchor="middle" font-size="9" fill="#333">5000</text>

  <rect x="190" y="238" width="220" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="235" y="251" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">Apple</text>
  <text x="315" y="251" text-anchor="middle" font-size="9" fill="#333">2011</text>
  <text x="375" y="251" text-anchor="middle" font-size="9" fill="#333">9000</text>

  <line x1="280" y1="180" x2="280" y2="256" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="350" y1="180" x2="350" y2="256" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- Column source annotations -->
  <text x="235" y="270" text-anchor="middle" font-size="8" fill="#4a7a3a">← 来自 Product</text>
  <text x="362" y="270" text-anchor="middle" font-size="8" fill="#446688">← 来自 Sales</text>

  <!-- Note box -->
  <rect x="70" y="284" width="460" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="304" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">Samsung（product_id=300）在 Sales 中无销售记录</text>
  <text x="300" y="322" text-anchor="middle" font-size="10" fill="#555">INNER JOIN 只保留两表 product_id 匹配的行对</text>
  <text x="300" y="336" text-anchor="middle" font-size="10" fill="#555">无匹配的 Product 行（300/Samsung）被丢弃，不在结果中</text>
</svg>
