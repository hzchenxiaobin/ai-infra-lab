<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="520" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：数位数 → 逐位取幂求和 → 比较</text>

  <!-- Phase 1 label -->
  <text x="40" y="48" font-size="11" fill="#446688" font-weight="bold">阶段一：统计位数 k</text>

  <!-- Start -->
  <ellipse cx="270" cy="76" rx="110" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="80" text-anchor="middle" font-size="12" fill="#333">开始: 输入 n</text>

  <path d="M 270 94 L 270 104" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- count digits box -->
  <rect x="150" y="108" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="130" text-anchor="middle" font-size="11.5" fill="#333">k = len(str(n))  // 位数</text>

  <path d="M 270 142 L 270 152" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init box -->
  <rect x="160" y="156" width="220" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="176" text-anchor="middle" font-size="12" fill="#333">temp = n, sum = 0</text>

  <path d="M 270 186 L 270 198" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Phase 2 label -->
  <text x="40" y="206" font-size="11" fill="#4a7a3a" font-weight="bold">阶段二：逐位取幂累加</text>

  <!-- Diamond 1: temp > 0? -->
  <polygon points="270,200 390,232 270,264 150,232" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="228" text-anchor="middle" font-size="12" fill="#333">temp &gt; 0</text>
  <text x="270" y="244" text-anchor="middle" font-size="11" fill="#666">?</text>

  <!-- Yes -> down -->
  <path d="M 270 264 L 270 278" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="274" font-size="11" fill="#82b366">是</text>

  <!-- extract digit box -->
  <rect x="120" y="282" width="300" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="302" text-anchor="middle" font-size="11.5" fill="#333">digit = temp % 10</text>

  <path d="M 270 312 L 270 322" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- power sum box -->
  <rect x="120" y="326" width="300" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="346" text-anchor="middle" font-size="11.5" fill="#333">sum += digit ^ k  // 累加 k 次方</text>

  <path d="M 270 356 L 270 366" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- shrink temp box -->
  <rect x="160" y="370" width="220" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="389" text-anchor="middle" font-size="11.5" fill="#333">temp = temp / 10</text>

  <!-- loop back LEFT to diamond1 -->
  <path d="M 160 384 L 64 384 L 64 232 L 150 232" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="48" y="308" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 48 308)">下一位</text>

  <!-- No -> right then down -->
  <path d="M 390 232 L 432 232" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="408" y="224" text-anchor="middle" font-size="11" fill="#b85450">否</text>

  <!-- Phase 3 label -->
  <text x="40" y="420" font-size="11" fill="#b85450" font-weight="bold">阶段三：比较求和与原数</text>

  <!-- connector from No down to compare diamond -->
  <path d="M 432 232 L 432 436 L 270 436" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond 2: sum == n? -->
  <polygon points="270,438 380,466 270,494 160,466" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="462" text-anchor="middle" font-size="12" fill="#333">sum == n</text>
  <text x="270" y="478" text-anchor="middle" font-size="11" fill="#666">?</text>

  <!-- Yes -> left to true -->
  <path d="M 160 466 L 110 466" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="138" y="458" text-anchor="middle" font-size="11" fill="#82b366">是</text>

  <ellipse cx="62" cy="466" rx="48" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="62" y="470" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">true</text>

  <!-- No -> right to false -->
  <path d="M 380 466 L 430 466" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="404" y="458" text-anchor="middle" font-size="11" fill="#b85450">否</text>

  <ellipse cx="478" cy="466" rx="48" ry="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="478" y="470" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">false</text>

  <!-- summary -->
  <text x="270" y="514" text-anchor="middle" font-size="10" fill="#888">两趟遍历各 O(log n) → 总 O(log n)；空间 O(1)</text>
</svg>
