<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">状态机：只记「末尾奇偶 × 结尾同奇偶连续段长」</text>

  <!-- 新元素 -->
  <rect x="196" y="46" width="128" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="67" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">新元素 x（奇）</text>

  <!-- 四个状态框 -->
  <rect x="28" y="160" width="104" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="180" text-anchor="middle" font-size="14" fill="#334" filter="url(#rough2)">(偶, 1)</text>
  <text x="80" y="197" text-anchor="middle" font-size="10" fill="#667" filter="url(#rough2)">以 1 个偶数结尾</text>

  <rect x="148" y="160" width="104" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="180" text-anchor="middle" font-size="14" fill="#334" filter="url(#rough2)">(偶, 2)</text>
  <text x="200" y="197" text-anchor="middle" font-size="10" fill="#667" filter="url(#rough2)">连续 2 个偶数结尾</text>

  <rect x="288" y="160" width="104" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340" y="180" text-anchor="middle" font-size="14" fill="#334" filter="url(#rough2)">(奇, 1)</text>
  <text x="340" y="197" text-anchor="middle" font-size="10" fill="#667" filter="url(#rough2)">以 1 个奇数结尾</text>

  <rect x="408" y="160" width="104" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="460" y="180" text-anchor="middle" font-size="14" fill="#334" filter="url(#rough2)">(奇, 2)</text>
  <text x="460" y="197" text-anchor="middle" font-size="10" fill="#667" filter="url(#rough2)">连续 2 个奇数结尾</text>

  <!-- 单开新序列: x -> (奇,1) -->
  <path d="M 278 78 C 300 108, 316 130, 336 156" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="316" y="112" font-size="11" fill="#7a5a10" filter="url(#rough2)">单开 [x]</text>

  <!-- (奇,1) -> (奇,2) 接龙，画上方弧线 -->
  <path d="M 350 158 C 374 132, 428 132, 452 158" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="401" y="130" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">接奇数：连长 1→2</text>

  <!-- (偶,1) -> (奇,1) 下方弧线 -->
  <path d="M 80 208 C 92 252, 300 254, 334 212" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- (偶,2) -> (奇,1) 下方弧线 -->
  <path d="M 200 208 C 214 240, 302 240, 332 212" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="215" y="248" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">结尾是偶数 ⇒ 奇数接上，连长重置为 1</text>

  <!-- (奇,2) 封死 -->
  <text x="460" y="226" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">✗ 不能再接奇数</text>
  <text x="460" y="243" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否则三连同奇！</text>

  <!-- 底部说明 -->
  <rect x="40" y="272" width="440" height="72" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="295" text-anchor="middle" font-size="12" fill="#2f5a24" filter="url(#rough2)">偶数到来时完全对称：把上图的 奇 ↔ 偶 互换即可</text>
  <text x="260" y="314" text-anchor="middle" font-size="12" fill="#2f5a24" filter="url(#rough2)">能否延长只取决于这 4 个状态，与元素具体数值无关！</text>
  <text x="260" y="333" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">长度 1 / 2 的子序列天然稳定，无需任何检查</text>
</svg>
