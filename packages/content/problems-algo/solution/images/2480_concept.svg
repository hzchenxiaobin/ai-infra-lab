<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>

  <!-- Title -->
  <text x="360" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心概念：Metal 与 Nonmetal 配对即形成化学键</text>
  <text x="360" y="42" text-anchor="middle" font-size="10.5" fill="#888">electrons 描述「给出 / 需要电子数」，仅作化学背景，不参与查询条件</text>

  <!-- ============ Elements table (left) ============ -->
  <text x="40" y="78" font-size="11.5" fill="#666" font-weight="bold">Elements 表</text>

  <!-- header row -->
  <rect x="40" y="86" width="222" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="72" y="104" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">symbol</text>
  <text x="140" y="104" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">type</text>
  <text x="216" y="104" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">electrons</text>

  <!-- He | Noble | 0  (gray - excluded) -->
  <rect x="40" y="114" width="222" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="72" y="131" text-anchor="middle" font-size="11" fill="#999">He</text>
  <text x="140" y="131" text-anchor="middle" font-size="11" fill="#999">Noble</text>
  <text x="216" y="131" text-anchor="middle" font-size="11" fill="#999">0</text>
  <!-- strikethrough hint: excluded -->
  <text x="276" y="131" font-size="11" fill="#bbb" filter="url(#rough2)">✗</text>

  <!-- Na | Metal | 1  (green) -->
  <rect x="40" y="140" width="222" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72" y="157" text-anchor="middle" font-size="11" fill="#333">Na</text>
  <text x="140" y="157" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Metal</text>
  <text x="216" y="157" text-anchor="middle" font-size="11" fill="#333">1</text>

  <!-- Ca | Metal | 2  (green) -->
  <rect x="40" y="166" width="222" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72" y="183" text-anchor="middle" font-size="11" fill="#333">Ca</text>
  <text x="140" y="183" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Metal</text>
  <text x="216" y="183" text-anchor="middle" font-size="11" fill="#333">2</text>

  <!-- La | Metal | 3  (green) -->
  <rect x="40" y="192" width="222" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72" y="209" text-anchor="middle" font-size="11" fill="#333">La</text>
  <text x="140" y="209" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Metal</text>
  <text x="216" y="209" text-anchor="middle" font-size="11" fill="#333">3</text>

  <!-- Cl | Nonmetal | 1  (blue) -->
  <rect x="40" y="218" width="222" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72" y="235" text-anchor="middle" font-size="11" fill="#333">Cl</text>
  <text x="140" y="235" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Nonmetal</text>
  <text x="216" y="235" text-anchor="middle" font-size="11" fill="#333">1</text>

  <!-- O | Nonmetal | 2  (blue) -->
  <rect x="40" y="244" width="222" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72" y="261" text-anchor="middle" font-size="11" fill="#333">O</text>
  <text x="140" y="261" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Nonmetal</text>
  <text x="216" y="261" text-anchor="middle" font-size="11" fill="#333">2</text>

  <!-- N | Nonmetal | 3  (blue) -->
  <rect x="40" y="270" width="222" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72" y="287" text-anchor="middle" font-size="11" fill="#333">N</text>
  <text x="140" y="287" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Nonmetal</text>
  <text x="216" y="287" text-anchor="middle" font-size="11" fill="#333">3</text>

  <!-- arrows: metal group → rule, nonmetal group → rule -->
  <path d="M 262 168 L 340 168" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 262 252 L 340 252" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ============ Rule box (right) ============ -->
  <rect x="348" y="130" width="330" height="160" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="513" y="152" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">成键规则</text>

  <!-- Metal block -->
  <rect x="366" y="166" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="401" y="185" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Metal</text>

  <text x="448" y="185" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold" filter="url(#rough2)">+</text>

  <!-- Nonmetal block -->
  <rect x="462" y="166" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="507" y="185" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Nonmetal</text>

  <text x="566" y="185" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold" filter="url(#rough2)">→</text>

  <rect x="582" y="166" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="622" y="185" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">化学键 ✓</text>

  <!-- Noble excluded -->
  <rect x="366" y="210" width="70" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="401" y="229" text-anchor="middle" font-size="11" fill="#999">Noble</text>
  <text x="448" y="229" text-anchor="middle" font-size="14" fill="#bbb" font-weight="bold" filter="url(#rough2)">×</text>
  <rect x="462" y="210" width="90" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="507" y="229" text-anchor="middle" font-size="11" fill="#999">任意</text>
  <text x="566" y="229" text-anchor="middle" font-size="14" fill="#bbb" font-weight="bold" filter="url(#rough2)">→</text>
  <rect x="582" y="210" width="80" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="622" y="229" text-anchor="middle" font-size="10.5" fill="#999">不参与 ✗</text>

  <text x="513" y="262" text-anchor="middle" font-size="10" fill="#888">electrons（给出/需要数）仅为化学语义，</text>
  <text x="513" y="276" text-anchor="middle" font-size="10" fill="#888">查询只按 type 配对，与 electrons 无关</text>

  <!-- Bottom takeaway -->
  <rect x="40" y="316" width="640" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="360" y="338" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">查询本质 = 笛卡尔积：{Metal} × {Nonmetal}</text>
  <text x="360" y="356" text-anchor="middle" font-size="10.5" fill="#555">3 个 Metal × 3 个 Nonmetal = 9 对；Noble 被排除；electrons 列不参与判定</text>
  <text x="360" y="372" text-anchor="middle" font-size="10.5" fill="#555">每对输出 (metal, nonmetal) 两列，顺序任意</text>

  <text x="360" y="408" text-anchor="middle" font-size="9.5" fill="#bbb">Electrons 的化学含义：Metal=给出电子数 / Nonmetal=需要电子数 / Noble=0（已稳定）</text>
</svg>
