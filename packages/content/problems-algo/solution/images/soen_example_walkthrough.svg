<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 310" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="310" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：A = [1,2,3,4]，queries = [[1,0],[−3,1],[−4,0],[2,3]]</text>

  <!-- Table outer border -->
  <rect x="10" y="42" width="540" height="244" fill="none" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>

  <!-- Header row background -->
  <rect x="10" y="42" width="540" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <rect x="10" y="58" width="540" height="10" fill="#e8f0fe" filter="url(#rough2)"/>

  <!-- Header text -->
  <text x="36" y="59" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">步骤</text>
  <text x="110" y="59" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">查询 [val, idx]</text>
  <text x="210" y="59" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">old → new</text>
  <text x="290" y="59" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">ΔS</text>
  <text x="346" y="59" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">偶数和 S</text>
  <text x="458" y="59" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">数组状态</text>

  <!-- Column separators -->
  <path d="M 64 42 L 64 286" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 156 42 L 156 286" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 264 42 L 264 286" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 316 42 L 316 286" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 376 42 L 376 286" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row separators -->
  <path d="M 10 72 L 550 72" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 10 114 L 550 114" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 10 156 L 550 156" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 10 198 L 550 198" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 10 240 L 550 240" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 0: initial -->
  <text x="36" y="98" text-anchor="middle" font-size="12" fill="#888">初始</text>
  <text x="110" y="98" text-anchor="middle" font-size="12" fill="#bbb">—</text>
  <text x="210" y="98" text-anchor="middle" font-size="12" fill="#bbb">—</text>
  <text x="290" y="98" text-anchor="middle" font-size="12" fill="#bbb">—</text>
  <text x="346" y="98" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <text x="458" y="98" text-anchor="middle" font-size="12"><tspan fill="#999">1</tspan>, <tspan fill="#4a7a3a" font-weight="bold">2</tspan>, <tspan fill="#999">3</tspan>, <tspan fill="#4a7a3a" font-weight="bold">4</tspan></text>

  <!-- Row 1: [1,0] old=1 -> 2, old奇 new偶, ΔS=+2(new) -->
  <text x="36" y="140" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="110" y="140" text-anchor="middle" font-size="12" fill="#333">[1, 0]</text>
  <text x="210" y="140" text-anchor="middle" font-size="12"><tspan fill="#999">1</tspan> → <tspan fill="#4a7a3a" font-weight="bold">2</tspan></text>
  <text x="290" y="140" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">+2</text>
  <text x="346" y="140" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>
  <text x="458" y="140" text-anchor="middle" font-size="12"><tspan fill="#4a7a3a" font-weight="bold">2</tspan>, <tspan fill="#4a7a3a" font-weight="bold">2</tspan>, <tspan fill="#999">3</tspan>, <tspan fill="#4a7a3a" font-weight="bold">4</tspan></text>

  <!-- Row 2: [-3,1] old=2 -> -1, old偶 new奇, ΔS=-2(old) -->
  <text x="36" y="182" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="110" y="182" text-anchor="middle" font-size="12" fill="#333">[−3, 1]</text>
  <text x="210" y="182" text-anchor="middle" font-size="12"><tspan fill="#4a7a3a" font-weight="bold">2</tspan> → <tspan fill="#999">−1</tspan></text>
  <text x="290" y="182" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−2</text>
  <text x="346" y="182" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <text x="458" y="182" text-anchor="middle" font-size="12"><tspan fill="#4a7a3a" font-weight="bold">2</tspan>, <tspan fill="#999">−1</tspan>, <tspan fill="#999">3</tspan>, <tspan fill="#4a7a3a" font-weight="bold">4</tspan></text>

  <!-- Row 3: [-4,0] old=2 -> -2, old偶 new偶, ΔS=-4(val) -->
  <text x="36" y="224" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="110" y="224" text-anchor="middle" font-size="12" fill="#333">[−4, 0]</text>
  <text x="210" y="224" text-anchor="middle" font-size="12"><tspan fill="#4a7a3a" font-weight="bold">2</tspan> → <tspan fill="#4a7a3a" font-weight="bold">−2</tspan></text>
  <text x="290" y="224" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−4</text>
  <text x="346" y="224" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <text x="458" y="224" text-anchor="middle" font-size="12"><tspan fill="#4a7a3a" font-weight="bold">−2</tspan>, <tspan fill="#999">−1</tspan>, <tspan fill="#999">3</tspan>, <tspan fill="#4a7a3a" font-weight="bold">4</tspan></text>

  <!-- Row 4: [2,3] old=4 -> 6, old偶 new偶, ΔS=+2(val) -->
  <text x="36" y="266" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="110" y="266" text-anchor="middle" font-size="12" fill="#333">[2, 3]</text>
  <text x="210" y="266" text-anchor="middle" font-size="12"><tspan fill="#4a7a3a" font-weight="bold">4</tspan> → <tspan fill="#4a7a3a" font-weight="bold">6</tspan></text>
  <text x="290" y="266" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">+2</text>
  <text x="346" y="266" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <text x="458" y="266" text-anchor="middle" font-size="12"><tspan fill="#4a7a3a" font-weight="bold">−2</tspan>, <tspan fill="#999">−1</tspan>, <tspan fill="#999">3</tspan>, <tspan fill="#4a7a3a" font-weight="bold">6</tspan></text>

  <!-- footnote -->
  <text x="280" y="302" text-anchor="middle" font-size="11" fill="#888">输出 ans = [8, 6, 2, 4]（绿色=偶数；ΔS 按四象限规则：奇→偶加 new，偶→奇减 old，偶→偶加 val）</text>
</svg>
