<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：n = 3 的 5 条生成路径</text>

  <!-- 表头 -->
  <rect x="30" y="48" width="460" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="47" y="64" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">#</text>
  <text x="150" y="64" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">生成路径</text>
  <text x="279" y="64" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">答案</text>
  <text x="406" y="64" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">途中被剪的岔路</text>

  <!-- 行 -->
  <rect x="30" y="72" width="460" height="24" fill="none" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="47" y="88" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="150" y="88" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ε → 0 → 01 → 010</text>
  <rect x="236" y="72" width="86" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="279" y="88" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">010</text>
  <text x="406" y="88" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>

  <rect x="30" y="96" width="460" height="24" fill="none" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="47" y="112" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <text x="150" y="112" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ε → 0 → 01 → 011</text>
  <rect x="236" y="96" width="86" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="279" y="112" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">011</text>
  <text x="406" y="112" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>

  <rect x="30" y="120" width="460" height="24" fill="none" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="47" y="136" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3</text>
  <text x="150" y="136" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ε → 1 → 10 → 101</text>
  <rect x="236" y="120" width="86" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="279" y="136" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">101</text>
  <text x="406" y="136" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">10 → 100 ✗</text>

  <rect x="30" y="144" width="460" height="24" fill="none" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="47" y="160" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4</text>
  <text x="150" y="160" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ε → 1 → 11 → 110</text>
  <rect x="236" y="144" width="86" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="279" y="160" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">110</text>
  <text x="406" y="160" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>

  <rect x="30" y="168" width="460" height="24" fill="none" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="47" y="184" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">5</text>
  <text x="150" y="184" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ε → 1 → 11 → 111</text>
  <rect x="236" y="168" width="86" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="279" y="184" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">111</text>
  <text x="406" y="184" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>

  <!-- 底部说明 -->
  <rect x="30" y="212" width="460" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="234" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">另一处剪枝：0 之后不能接 0 —— "00" 子树整体不存在，</text>
  <text x="260" y="254" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">"000"、"001" 根本不会被生成（暴力法是先生成完再扔掉）</text>

  <rect x="30" y="284" width="460" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="306" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">n = 18 时答案 6765 个 = F(20)，搜索树节点约 1.8 万个；</text>
  <text x="260" y="326" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">对照暴力 2¹⁸ = 26.2 万个候选 —— 97% 是废物</text>
</svg>
