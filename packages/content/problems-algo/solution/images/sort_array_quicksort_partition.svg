<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">三向切分：一次扫描分成 &lt; pivot / == pivot / &gt; pivot</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">pivot = nums[lo]（随机交换后）；三指针 lt / i / gt 维护四段</text>

  <!-- ===== Three-region bar ===== -->
  <text x="30" y="86" font-size="11" fill="#446688" font-weight="bold">划分后的区间结构</text>
  <g font-size="10">
    <rect x="30" y="96" width="110" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="85" y="116" text-anchor="middle" fill="#4a7a3a" font-weight="bold">&lt; pivot</text>
    <text x="85" y="142" text-anchor="middle" font-size="9" fill="#888">[lo .. lt-1]</text>

    <rect x="144" y="96" width="110" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="199" y="116" text-anchor="middle" fill="#d6a040" font-weight="bold">== pivot</text>
    <text x="199" y="142" text-anchor="middle" font-size="9" fill="#888">[lt .. i-1]</text>

    <rect x="258" y="96" width="110" height="32" fill="#f6f6f6" stroke="#aaa" stroke-width="1.2" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
    <text x="313" y="116" text-anchor="middle" fill="#888" font-weight="bold">未处理</text>
    <text x="313" y="142" text-anchor="middle" font-size="9" fill="#888">[i .. gt]</text>

    <rect x="372" y="96" width="110" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="427" y="116" text-anchor="middle" fill="#b85450" font-weight="bold">&gt; pivot</text>
    <text x="427" y="142" text-anchor="middle" font-size="9" fill="#888">[gt+1 .. hi]</text>
  </g>

  <!-- pointer labels above bar -->
  <text x="144" y="78" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">lt ↓</text>
  <text x="258" y="78" text-anchor="middle" font-size="9" fill="#666" font-weight="bold">i ↓</text>
  <text x="372" y="78" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">gt ↓</text>

  <!-- ===== Decision rules ===== -->
  <text x="30" y="172" font-size="11" fill="#446688" font-weight="bold">看 nums[i] 与 pivot 的关系（i ≤ gt 时循环）</text>

  <!-- Rule 1: < pivot -->
  <rect x="30" y="184" width="160" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="110" y="206" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">nums[i] &lt; pivot</text>
  <text x="110" y="225" text-anchor="middle" font-size="10" fill="#555">swap(a[lt], a[i])</text>
  <text x="110" y="242" text-anchor="middle" font-size="10" fill="#555">lt++;  i++</text>

  <!-- Rule 2: == pivot -->
  <rect x="200" y="184" width="160" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="206" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">nums[i] == pivot</text>
  <text x="280" y="225" text-anchor="middle" font-size="10" fill="#555">i++</text>
  <text x="280" y="242" text-anchor="middle" font-size="9" fill="#d6a040">直接归入等于段</text>

  <!-- Rule 3: > pivot -->
  <rect x="370" y="184" width="160" height="74" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="450" y="206" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">nums[i] &gt; pivot</text>
  <text x="450" y="225" text-anchor="middle" font-size="10" fill="#555">swap(a[i], a[gt])</text>
  <text x="450" y="242" text-anchor="middle" font-size="10" fill="#b85450">gt--;  i 不动 ⚠️</text>

  <!-- ===== Loop end ===== -->
  <rect x="30" y="276" width="500" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="296" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">循环结束：i &gt; gt（未处理段清空）</text>
  <text x="280" y="312" text-anchor="middle" font-size="10" fill="#555">[lt..gt] 全是 == pivot，一次性归位，递归 (lo, lt-1) 与 (gt+1, hi)</text>

  <!-- ===== swap illustration ===== -->
  <text x="30" y="348" font-size="11" fill="#d6a040" font-weight="bold">「&gt; pivot」时为何 i 不自增？</text>
  <rect x="30" y="358" width="500" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="378" text-anchor="middle" font-size="10" fill="#555">swap(a[i], a[gt]) 把 gt 处的值换到 i，该值还没考察（可能 &lt;/==/&gt; pivot）</text>
  <text x="280" y="394" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">必须留在 i 下一轮判断，否则漏看一个元素 → 划分错误</text>
</svg>
