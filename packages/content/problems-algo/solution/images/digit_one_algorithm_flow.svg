<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="620" height="560" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：逐位累加，按 cur 分三种情况</text>

  <!-- Start -->
  <ellipse cx="310" cy="60" rx="50" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="64" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始</text>
  <line x1="310" y1="78" x2="310" y2="96" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init -->
  <rect x="240" y="98" width="140" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="310" y="122" text-anchor="middle" font-size="12" fill="#333">ans = 0, factor = 1</text>
  <line x1="310" y1="136" x2="310" y2="154" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: factor <= n ? -->
  <polygon points="310,156 410,196 310,236 210,196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="192" text-anchor="middle" font-size="12" fill="#333">factor ≤ n ?</text>
  <text x="310" y="208" text-anchor="middle" font-size="11" fill="#888">还有位没处理</text>

  <!-- No branch -> return ans (right) -->
  <line x1="410" y1="196" x2="498" y2="196" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="454" y="190" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <ellipse cx="540" cy="196" rx="44" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="540" y="194" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">返回 ans</text>
  <text x="540" y="208" text-anchor="middle" font-size="10" fill="#888">结束</text>

  <!-- Yes branch -> down -->
  <line x1="310" y1="236" x2="310" y2="258" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="324" y="252" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Compute high / cur / low -->
  <rect x="170" y="260" width="280" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="310" y="280" text-anchor="middle" font-size="11" fill="#333">high = n / (factor×10)</text>
  <text x="310" y="296" text-anchor="middle" font-size="11" fill="#333">cur = (n / factor) % 10；low = n % factor</text>
  <line x1="310" y1="308" x2="310" y2="326" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: cur ? -->
  <polygon points="310,328 380,360 310,392 240,360" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="364" text-anchor="middle" font-size="12" fill="#333">cur = ?</text>

  <!-- Three branches: lines from diamond to three boxes -->
  <!-- left to cur==0 -->
  <line x1="240" y1="360" x2="140" y2="360" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="140" y1="360" x2="140" y2="408" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="354" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">= 0</text>
  <!-- down to cur==1 -->
  <line x1="310" y1="392" x2="310" y2="408" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="326" y="402" font-size="11" fill="#d6a040" font-weight="bold">= 1</text>
  <!-- right to cur>=2 -->
  <line x1="380" y1="360" x2="480" y2="360" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="480" y1="360" x2="480" y2="408" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="438" y="354" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">≥ 2</text>

  <!-- Three action boxes -->
  <rect x="50" y="410" width="180" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="140" y="430" text-anchor="middle" font-size="11" fill="#333">ans += high × factor</text>
  <text x="140" y="448" text-anchor="middle" font-size="10" fill="#888">高位走 0..high−1</text>

  <rect x="220" y="410" width="180" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="310" y="430" text-anchor="middle" font-size="11" fill="#333">ans += high×factor</text>
  <text x="310" y="446" text-anchor="middle" font-size="11" fill="#333">        + low + 1</text>

  <rect x="390" y="410" width="180" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="480" y="430" text-anchor="middle" font-size="11" fill="#333">ans += (high+1)×factor</text>
  <text x="480" y="448" text-anchor="middle" font-size="10" fill="#888">高位走 0..high</text>

  <!-- merge to factor *= 10 -->
  <line x1="140" y1="460" x2="140" y2="486" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="310" y1="460" x2="310" y2="486" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="480" y1="460" x2="480" y2="486" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="140" y1="486" x2="480" y2="486" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="310" y1="486" x2="310" y2="502" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- factor *= 10 -->
  <rect x="240" y="504" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="310" y="526" text-anchor="middle" font-size="12" fill="#333">factor ×= 10</text>

  <!-- loop back arrow: from factor*=10 box left side, up along left to the factor<=n diamond left side -->
  <path d="M 240 521 L 60 521 L 60 196 L 210 196" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="48" y="360" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 48 360)">回到判断 factor ≤ n</text>
</svg>
