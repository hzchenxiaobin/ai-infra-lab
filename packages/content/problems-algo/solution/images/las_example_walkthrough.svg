<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [20, 1, 15, 3, 10, 5, 8]　追踪 d = −5 链</text>

  <!-- ===== Table header ===== -->
  <rect x="40" y="44" width="40" height="30" fill="#ddd" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="64" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">i</text>

  <rect x="80" y="44" width="60" height="30" fill="#ddd" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="64" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">nums[i]</text>

  <rect x="140" y="44" width="100" height="30" fill="#ddd" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="58" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">关键前驱</text>
  <text x="190" y="68" text-anchor="middle" font-size="8" fill="#888">(j, d)</text>

  <rect x="240" y="44" width="190" height="30" fill="#ddd" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="335" y="58" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">dp[i][d] 更新</text>
  <text x="335" y="68" text-anchor="middle" font-size="8" fill="#888">（d=−5 加粗标红）</text>

  <rect x="430" y="44" width="60" height="30" fill="#ddd" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="460" y="64" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">ans</text>

  <!-- ===== Row i=0 ===== -->
  <rect x="40" y="78" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="98" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="80" y="78" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="98" text-anchor="middle" font-size="12" fill="#333">20</text>
  <rect x="140" y="78" width="100" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="190" y="98" text-anchor="middle" font-size="11" fill="#999">—（无前驱）</text>
  <rect x="240" y="78" width="190" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="335" y="98" text-anchor="middle" font-size="11" fill="#999">dp[0] = {}</text>
  <rect x="430" y="78" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="460" y="98" text-anchor="middle" font-size="12" fill="#333">0</text>

  <!-- ===== Row i=1 ===== -->
  <rect x="40" y="112" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="132" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="80" y="112" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="132" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="140" y="112" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="132" text-anchor="middle" font-size="11" fill="#333">j=0, d=−19</text>
  <rect x="240" y="112" width="190" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="335" y="132" text-anchor="middle" font-size="11" fill="#333">dp[1][−19] = 2</text>
  <rect x="430" y="112" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="460" y="132" text-anchor="middle" font-size="12" fill="#333">2</text>

  <!-- ===== Row i=2 (d=-5 chain starts!) ===== -->
  <rect x="40" y="146" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="166" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="80" y="146" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="166" text-anchor="middle" font-size="12" fill="#333">15</text>
  <rect x="140" y="146" width="100" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="166" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">j=0, d=−5</text>
  <rect x="240" y="146" width="190" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="335" y="166" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">dp[2][−5] = 2</text>
  <rect x="430" y="146" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="460" y="166" text-anchor="middle" font-size="12" fill="#333">2</text>

  <!-- ===== Row i=3 ===== -->
  <rect x="40" y="180" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="200" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="80" y="180" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="200" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="140" y="180" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="200" text-anchor="middle" font-size="11" fill="#333">j=1, d=2</text>
  <rect x="240" y="180" width="190" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="335" y="200" text-anchor="middle" font-size="11" fill="#333">dp[3][2] = 2</text>
  <rect x="430" y="180" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="460" y="200" text-anchor="middle" font-size="12" fill="#333">2</text>

  <!-- ===== Row i=4 (d=-5 chain grows to 3) ===== -->
  <rect x="40" y="214" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="234" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="80" y="214" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="234" text-anchor="middle" font-size="12" fill="#333">10</text>
  <rect x="140" y="214" width="100" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="234" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">j=2, d=−5</text>
  <rect x="240" y="214" width="190" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="335" y="234" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">dp[4][−5] = dp[2][−5]+1 = 3</text>
  <rect x="430" y="214" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="460" y="234" text-anchor="middle" font-size="12" fill="#333">3</text>

  <!-- ===== Row i=5 (ANSWER! d=-5 chain grows to 4) ===== -->
  <rect x="40" y="248" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="268" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="80" y="248" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="268" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="140" y="248" width="100" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="268" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">j=4, d=−5</text>
  <rect x="240" y="248" width="190" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="335" y="268" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">dp[5][−5] = dp[4][−5]+1 = 4 ⭐</text>
  <rect x="430" y="248" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="460" y="268" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">4 ⭐</text>

  <!-- ===== Row i=6 ===== -->
  <rect x="40" y="282" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="302" text-anchor="middle" font-size="12" fill="#333">6</text>
  <rect x="80" y="282" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="302" text-anchor="middle" font-size="12" fill="#333">8</text>
  <rect x="140" y="282" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="302" text-anchor="middle" font-size="11" fill="#333">j=5, d=3</text>
  <rect x="240" y="282" width="190" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="335" y="302" text-anchor="middle" font-size="11" fill="#333">dp[6][3] = 2</text>
  <rect x="430" y="282" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="460" y="302" text-anchor="middle" font-size="12" fill="#333">4</text>

  <!-- d=-5 chain arrow on left side connecting rows 2->4->5 -->
  <path d="M 32 161 L 24 161 L 24 229 L 32 229" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 32 229 L 24 229 L 24 263 L 32 263" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="14" y="200" font-size="9" fill="#b85450" transform="rotate(-90 14 200)">d=−5 链</text>

  <!-- ===== Bottom explanation ===== -->
  <rect x="40" y="324" width="500" height="124" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="60" y="348" font-size="12" fill="#444" font-weight="bold">逐步解读（仅列每行最关键的前驱，其余公差同理）：</text>
  <text x="60" y="370" font-size="11" fill="#555">• i=0: 无前驱，dp[0] 为空</text>
  <text x="60" y="388" font-size="11" fill="#555">• i=1: j=0, d=1−20=−19，dp[0] 无 −19 → dp[1][−19]=2</text>
  <text x="60" y="406" font-size="11" fill="#b85450" font-weight="bold">• i=2: j=0, d=15−20=−5，dp[0] 无 −5 → dp[2][−5]=2（序列 [20,15]）</text>
  <text x="60" y="424" font-size="11" fill="#b85450" font-weight="bold">• i=4: j=2, d=10−15=−5，dp[2][−5]=2 → dp[4][−5]=3（[20,15,10]）</text>
  <text x="60" y="442" font-size="11" fill="#b85450" font-weight="bold">• i=5: j=4, d=5−10=−5，dp[4][−5]=3 → dp[5][−5]=4 ⭐（[20,15,10,5]）</text>
</svg>
