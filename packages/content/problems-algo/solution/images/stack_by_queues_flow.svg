<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="880" height="540" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">用队列实现栈：算法流程</text>
  <path d="M 270 42 Q 440 50 610 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- push 分支 -->
  <g filter="url(#sk)">
    <rect x="50" y="70" width="180" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="140" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">push(x)</text>
  <text x="140" y="106" text-anchor="middle" font-size="10" fill="#666">压栈顶</text>

  <g filter="url(#sk)">
    <rect x="50" y="140" width="180" height="56" rx="4" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2"/>
  </g>
  <text x="140" y="164" text-anchor="middle" font-size="12" fill="#333">q.push(x)</text>
  <text x="140" y="182" text-anchor="middle" font-size="10" fill="#2e6e2e">先入队到队尾，O(1)</text>
  <path d="M 140 114 L 140 140" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 旋转循环框 -->
  <g filter="url(#sk)">
    <rect x="50" y="222" width="180" height="78" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="140" y="244" text-anchor="middle" font-size="12" fill="#7a2828" font-weight="bold">n = q.size()</text>
  <text x="140" y="264" text-anchor="middle" font-size="11" fill="#7a2828">for i in 1..n-1:</text>
  <text x="140" y="282" text-anchor="middle" font-size="11" fill="#7a2828">  旋转 = 出队首再入队尾</text>
  <text x="140" y="296" text-anchor="middle" font-size="10" fill="#b85450">把 x 前的 n-1 个绕到后面</text>
  <path d="M 140 196 L 140 222" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <!-- 循环回旋箭头 -->
  <path d="M 230 268 C 250 268 250 282 232 282" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="50" y="320" width="180" height="40" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="140" y="345" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">结束 O(n)</text>
  <path d="M 140 300 L 140 320" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 分隔 -->
  <path d="M 260 90 L 260 360" stroke="#c8c8c8" stroke-width="1.5" stroke-dasharray="4 4" filter="url(#sk)"/>

  <!-- pop / top 分支 -->
  <g filter="url(#sk)">
    <rect x="300" y="70" width="220" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="410" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">pop() / top()</text>
  <text x="410" y="106" text-anchor="middle" font-size="10" fill="#666">弹栈顶 / 取栈顶</text>

  <g filter="url(#sk)">
    <rect x="300" y="140" width="220" height="78" rx="4" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2"/>
  </g>
  <text x="410" y="164" text-anchor="middle" font-size="12" fill="#333">队首即栈顶（不变量）</text>
  <text x="410" y="184" text-anchor="middle" font-size="11" fill="#7a5415">pop()  → q.pop()</text>
  <text x="410" y="202" text-anchor="middle" font-size="11" fill="#7a5415">top()  → q.front()</text>
  <path d="M 410 114 L 410 140" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="300" y="240" width="220" height="40" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="410" y="265" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">返回结果 O(1)，无需旋转</text>
  <path d="M 410 218 L 410 240" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- empty 分支 -->
  <g filter="url(#sk)">
    <rect x="580" y="70" width="200" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="680" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">empty()</text>
  <text x="680" y="106" text-anchor="middle" font-size="10" fill="#666">判空</text>
  <g filter="url(#sk)">
    <rect x="580" y="140" width="200" height="56" rx="4" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2"/>
  </g>
  <text x="680" y="164" text-anchor="middle" font-size="12" fill="#333">q.empty()</text>
  <text x="680" y="182" text-anchor="middle" font-size="10" fill="#2e6e2e">单队列，直接判空</text>
  <path d="M 680 114 L 680 140" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="580" y="226" width="200" height="40" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="680" y="251" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">空 → true，O(1)</text>
  <path d="M 680 196 L 680 226" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 底部说明 -->
  <g filter="url(#sk)">
    <rect x="50" y="392" width="780" height="128" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/>
  </g>
  <text x="70" y="416" font-size="13" font-weight="bold" fill="#2b2b2b">关键不变量 &amp; 复杂度要点</text>
  <text x="70" y="440" font-size="11" fill="#444">① 不变量：队首 = 栈顶。push 后立刻旋转 size-1 次维持此性质；pop/top 直接操作队首，不破坏它。</text>
  <text x="70" y="460" font-size="11" fill="#444">② push 是最坏 O(n)（不是摊还）：每次都要旋转当前 size-1 次，连续 push n 次总成本 O(n²)。</text>
  <text x="70" y="480" font-size="11" fill="#444">③ 旋转次数是 size-1 不是 size：刚入队的 x 在队尾，需把它前面 n-1 个绕到后面；绕 n 次等于没转。</text>
  <text x="70" y="502" font-size="11" fill="#b85450">⚠ 与 232 的根本差异：栈倒换逆转顺序（可懒倒换摊还 O(1)），队列搬运保序（无法摊销，必须当场旋转）。</text>
</svg>
