<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 370" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="370" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1,2,3,4,5]（排序后）</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每轮固定顺序：先收缩 → 再 query(y) → 后 insert(y)</text>

  <!-- 表头 -->
  <rect x="42" y="62" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="67" y="81" text-anchor="middle" font-size="11" fill="#33507a" font-weight="bold" filter="url(#rough2)">right</text>
  <rect x="92" y="62" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="112" y="81" text-anchor="middle" font-size="11" fill="#33507a" font-weight="bold" filter="url(#rough2)">y</text>
  <rect x="132" y="62" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="212" y="81" text-anchor="middle" font-size="11" fill="#33507a" font-weight="bold" filter="url(#rough2)">窗口收缩</text>
  <rect x="292" y="62" width="74" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="329" y="81" text-anchor="middle" font-size="11" fill="#33507a" font-weight="bold" filter="url(#rough2)">Trie</text>
  <rect x="366" y="62" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="411" y="81" text-anchor="middle" font-size="11" fill="#33507a" font-weight="bold" filter="url(#rough2)">query(y)</text>
  <rect x="456" y="62" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="481" y="81" text-anchor="middle" font-size="11" fill="#33507a" font-weight="bold" filter="url(#rough2)">ans</text>

  <!-- 第 0 行 -->
  <rect x="42" y="94" width="50" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="67" y="118" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="92" y="94" width="40" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="112" y="118" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="132" y="94" width="160" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="212" y="118" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">—（1 ≤ 2×1）</text>
  <rect x="292" y="94" width="74" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="329" y="118" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">∅</text>
  <rect x="366" y="94" width="90" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="411" y="118" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">0（空集）</text>
  <rect x="456" y="94" width="50" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="481" y="118" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>

  <!-- 第 1 行 -->
  <rect x="42" y="136" width="50" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="67" y="160" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="92" y="136" width="40" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="112" y="160" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="132" y="136" width="160" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="212" y="160" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">—（2 ≤ 2×1）</text>
  <rect x="292" y="136" width="74" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="329" y="160" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">{1}</text>
  <rect x="366" y="136" width="90" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="411" y="160" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2⊕1 = 3</text>
  <rect x="456" y="136" width="50" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="481" y="160" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- 第 2 行 -->
  <rect x="42" y="178" width="50" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="67" y="202" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="92" y="178" width="40" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="112" y="202" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="132" y="178" width="160" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="212" y="202" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">删 1（3 &gt; 2×1）</text>
  <rect x="292" y="178" width="74" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="329" y="202" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">{2}</text>
  <rect x="366" y="178" width="90" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="411" y="202" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3⊕2 = 1</text>
  <rect x="456" y="178" width="50" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="481" y="202" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>

  <!-- 第 3 行（答案行，高亮） -->
  <rect x="42" y="220" width="50" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="67" y="244" text-anchor="middle" font-size="11.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="92" y="220" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="112" y="244" text-anchor="middle" font-size="11.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="132" y="220" width="160" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="212" y="244" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">—（4 ≤ 2×2）</text>
  <rect x="292" y="220" width="74" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="329" y="244" text-anchor="middle" font-size="11.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">{2,3}</text>
  <rect x="366" y="220" width="90" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="411" y="244" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">4⊕3 = 7 ★</text>
  <rect x="456" y="220" width="50" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="481" y="244" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">7</text>

  <!-- 第 4 行 -->
  <rect x="42" y="262" width="50" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="67" y="286" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="92" y="262" width="40" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="112" y="286" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <rect x="132" y="262" width="160" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="212" y="286" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">删 2（5 &gt; 2×2）</text>
  <rect x="292" y="262" width="74" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="329" y="286" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">{3,4}</text>
  <rect x="366" y="262" width="90" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="411" y="286" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5⊕3 = 6</text>
  <rect x="456" y="262" width="50" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="481" y="286" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">7</text>

  <!-- 底部说明 -->
  <rect x="36" y="312" width="300" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="186" y="331" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">查询时 Trie 恰为 [left, right−1]：每个强数对</text>
  <text x="186" y="349" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">（x ≤ y）在 y 作右端时统计一次，不重不漏</text>

  <rect x="348" y="312" width="158" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="427" y="331" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">最终返回</text>
  <text x="427" y="351" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans = 7 = 3 ⊕ 4 ✓</text>
</svg>
