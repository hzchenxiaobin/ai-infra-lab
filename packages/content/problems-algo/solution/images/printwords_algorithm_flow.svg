<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">
    算法流程：转置 + 截断右边界
  </text>

  <!-- Step 1 -->
  <rect x="40" y="50" width="220" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="72" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">① 按空格切分单词</text>
  <text x="150" y="92" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">words = s.split(' ')</text>

  <path d="M 150 112 L 150 138" fill="none" stroke="#446688" stroke-width="2"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="40" y="140" width="220" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="162" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">② 求最长单词长度</text>
  <text x="150" y="182" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">L = max(len(w) for w in words)</text>

  <path d="M 150 200 L 150 226" fill="none" stroke="#446688" stroke-width="2"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: loop header -->
  <rect x="40" y="228" width="220" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="250" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">③ 遍历每一行 i</text>
  <text x="150" y="270" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">for i in 0 .. L−1</text>

  <path d="M 150 288 L 150 314" fill="none" stroke="#446688" stroke-width="2"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: find rightmost word -->
  <rect x="40" y="316" width="220" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="338" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">④ 找最右有效单词</text>
  <text x="150" y="358" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">last = 最右 len&gt;i 的下标</text>

  <path d="M 150 376 L 150 402" fill="none" stroke="#446688" stroke-width="2"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5 -->
  <rect x="40" y="404" width="220" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="424" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⑤ 拼行：word[j][i] 或空格</text>

  <!-- Right side: detail of step 4/5 -->
  <rect x="300" y="50" width="220" height="384" fill="none" stroke="#cccccc" stroke-width="1" stroke-dasharray="4,3" rx="8" filter="url(#rough2)"/>
  <text x="410" y="72" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">第 i 行构造示意</text>

  <!-- words list -->
  <text x="320" y="100" font-size="11" fill="#888" filter="url(#rough2)">words[0..n−1]:</text>
  <rect x="320" y="108" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="337" y="126" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">w0</text>
  <rect x="356" y="108" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="373" y="126" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">w1</text>
  <rect x="392" y="108" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="409" y="126" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">w2</text>
  <rect x="428" y="108" width="34" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="445" y="126" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">…</text>
  <rect x="464" y="108" width="34" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="481" y="126" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">wn</text>

  <!-- length comparison for index i -->
  <text x="320" y="156" font-size="11" fill="#888" filter="url(#rough2)">len(w) &gt; i ?</text>
  <rect x="320" y="164" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="337" y="182" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <rect x="356" y="164" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="373" y="182" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <rect x="392" y="164" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="409" y="182" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <rect x="428" y="164" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="445" y="182" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗</text>
  <rect x="464" y="164" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="481" y="182" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- last marker -->
  <path d="M 409 196 L 409 214" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="230" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">last=2</text>

  <!-- build row -->
  <text x="320" y="256" font-size="11" fill="#888" filter="url(#rough2)">拼第 i 行（仅 0..last）:</text>
  <rect x="320" y="264" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="337" y="284" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">w0[i]</text>
  <rect x="356" y="264" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="373" y="284" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">w1[i]</text>
  <rect x="392" y="264" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="409" y="284" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">w2[i]</text>
  <text x="436" y="284" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ row</text>

  <!-- compare with naive rstrip -->
  <rect x="320" y="312" width="178" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="409" y="332" text-anchor="middle" font-size="11" fill="#444" font-weight="bold" filter="url(#rough2)">截断 vs rstrip</text>
  <text x="328" y="350" font-size="10" fill="#666" filter="url(#rough2)">朴素：拼到 w[n−1] 再 rstrip</text>
  <text x="328" y="366" font-size="10" fill="#666" filter="url(#rough2)">优化：只拼到 last，天然无尾空格</text>
  <text x="328" y="382" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">省去生成+删除的浪费</text>

  <!-- loop back arrow -->
  <path d="M 40 419 Q 24 419 24 256 Q 24 256 40 256" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="20" y="340" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)" transform="rotate(-90 20 340)">下一行 i+1</text>
</svg>
