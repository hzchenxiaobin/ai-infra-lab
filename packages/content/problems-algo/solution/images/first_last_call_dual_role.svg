<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    UNION ALL 把每通电话展开成「用户视角」两行
  </text>

  <text x="60" y="70" font-size="13" fill="#b85450" filter="url(#rough2)">Calls 表的一行：</text>

  <rect x="60" y="80" width="440" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="100" y="105" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">caller_id</text>
  <text x="100" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">8</text>
  <text x="240" y="105" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">recipient_id</text>
  <text x="240" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">4</text>
  <text x="400" y="105" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">call_time</text>
  <text x="400" y="120" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">08-24 17:46</text>

  <path d="M 150 130 Q 130 165 110 195" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 410 130 Q 430 165 450 195" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="100" y="180" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">主叫视角</text>
  <text x="460" y="180" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">被叫视角</text>

  <rect x="50" y="195" width="180" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="140" y="215" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">user_id  other_id  call_time</text>
  <text x="80" y="238" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">8</text>
  <text x="140" y="238" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="210" y="238" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">17:46</text>

  <rect x="330" y="195" width="180" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="420" y="215" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">user_id  other_id  call_time</text>
  <text x="360" y="238" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">4</text>
  <text x="420" y="238" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>
  <text x="490" y="238" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">17:46</text>

  <path d="M 140 252 Q 200 275 280 290" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 420 252 Q 360 275 280 290" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="280" y="278" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">UNION ALL</text>

  <rect x="120" y="295" width="320" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="315" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">统一用户视角关系 c</text>
  <text x="280" y="333" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">(user_id, other_id, call_time)</text>
</svg>
