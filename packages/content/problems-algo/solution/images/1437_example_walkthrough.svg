<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：相邻 1 的间距 = i − prev − 1，逐对检查是否 ≥ k</text>

  <!-- ============ Example 1 ============ -->
  <text x="40" y="56" font-size="12.5" fill="#333" font-weight="bold">示例 1：nums = [1,0,0,0,1,0,0,1]，k = 2 → <tspan fill="#4a7a3a">true</tspan></text>

  <!-- cells: width 44, gap 4, start x=120, y=80 -->
  <rect x="120" y="80" width="44" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="142" y="106" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="168" y="80" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="190" y="106" text-anchor="middle" font-size="14" fill="#333">0</text>
  <rect x="216" y="80" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="238" y="106" text-anchor="middle" font-size="14" fill="#333">0</text>
  <rect x="264" y="80" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="286" y="106" text-anchor="middle" font-size="14" fill="#333">0</text>
  <rect x="312" y="80" width="44" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="334" y="106" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="360" y="80" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="382" y="106" text-anchor="middle" font-size="14" fill="#333">0</text>
  <rect x="408" y="80" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="430" y="106" text-anchor="middle" font-size="14" fill="#333">0</text>
  <rect x="456" y="80" width="44" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="478" y="106" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <!-- index labels -->
  <text x="142" y="132" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="190" y="132" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="238" y="132" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="286" y="132" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="334" y="132" text-anchor="middle" font-size="10" fill="#888">4</text>
  <text x="382" y="132" text-anchor="middle" font-size="10" fill="#888">5</text>
  <text x="430" y="132" text-anchor="middle" font-size="10" fill="#888">6</text>
  <text x="478" y="132" text-anchor="middle" font-size="10" fill="#888">7</text>

  <!-- arc 1: idx0(142) -> idx4(334), gap 3 -->
  <path d="M 142 140 Q 238 180 334 140" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <rect x="196" y="158" width="84" height="24" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="238" y="175" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">间距 = 3 ✓</text>

  <!-- arc 2: idx4(334) -> idx7(478), gap 2 -->
  <path d="M 334 140 Q 406 198 478 140" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <rect x="364" y="176" width="84" height="24" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="406" y="193" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">间距 = 2 ✓</text>

  <text x="310" y="216" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">两对相邻 1 间距 3、2 均 ≥ 2 ⟹ 返回 true</text>

  <!-- separator -->
  <path d="M 60 236 L 560 236" stroke="#e0e0e0" stroke-width="1.2" stroke-dasharray="5,5" fill="none" filter="url(#rough2)"/>

  <!-- ============ Example 2 ============ -->
  <text x="40" y="262" font-size="12.5" fill="#333" font-weight="bold">示例 2：nums = [1,0,0,1,0,1]，k = 2 → <tspan fill="#b85450">false</tspan></text>

  <!-- cells: 6 cells, start x=168, y=286 -->
  <rect x="168" y="286" width="44" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="190" y="312" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="216" y="286" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="238" y="312" text-anchor="middle" font-size="14" fill="#333">0</text>
  <rect x="264" y="286" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="286" y="312" text-anchor="middle" font-size="14" fill="#333">0</text>
  <rect x="312" y="286" width="44" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="334" y="312" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="360" y="286" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="382" y="312" text-anchor="middle" font-size="14" fill="#333">0</text>
  <rect x="408" y="286" width="44" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="430" y="312" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <!-- index labels -->
  <text x="190" y="338" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="238" y="338" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="286" y="338" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="334" y="338" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="382" y="338" text-anchor="middle" font-size="10" fill="#888">4</text>
  <text x="430" y="338" text-anchor="middle" font-size="10" fill="#888">5</text>

  <!-- arc 1: idx0(190) -> idx3(334), gap 2 (ok) -->
  <path d="M 190 346 Q 262 384 334 346" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <rect x="220" y="364" width="84" height="24" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="262" y="381" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">间距 = 2 ✓</text>

  <!-- arc 2: idx3(334) -> idx5(430), gap 1 (FAIL) -->
  <path d="M 334 346 Q 382 392 430 346" stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <rect x="340" y="372" width="84" height="24" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="382" y="389" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">间距 = 1 ✗</text>

  <text x="310" y="416" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">第二个 1 ↔ 第三个 1 间距 1 &lt; 2 ⟹ 返回 false</text>

  <!-- footer note -->
  <rect x="60" y="430" width="500" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310" y="450" text-anchor="middle" font-size="10.5" fill="#555">间距 = curr − prev − 1 = 两 1 之间的元素个数；只需查相邻对，非相邻对间距更大</text>
</svg>
