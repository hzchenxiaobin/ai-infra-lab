<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">三步换轨：数组 → 质数序列 → 窗口定界 × 间隔计数</text>

  <!-- ① 原数组 -->
  <text x="130" y="38" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">#0</text>
  <text x="182" y="38" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">#1</text>
  <text x="234" y="38" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">#2</text>
  <text x="286" y="38" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">#3</text>
  <text x="338" y="38" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">#4</text>
  <text x="390" y="38" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">#5</text>

  <rect x="104" y="42" width="52" height="44" rx="4" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="130" y="70" text-anchor="middle" font-size="15" fill="#888888" filter="url(#rough2)">4</text>
  <rect x="156" y="42" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="182" y="70" text-anchor="middle" font-size="15" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">2</text>
  <rect x="208" y="42" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="234" y="70" text-anchor="middle" font-size="15" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">3</text>
  <rect x="260" y="42" width="52" height="44" rx="4" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="286" y="70" text-anchor="middle" font-size="15" fill="#888888" filter="url(#rough2)">8</text>
  <rect x="312" y="42" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="338" y="70" text-anchor="middle" font-size="15" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">5</text>
  <rect x="364" y="42" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="390" y="70" text-anchor="middle" font-size="15" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">7</text>

  <rect x="430" y="48" width="46" height="24" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="453" y="65" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">k=3</text>

  <text x="260" y="100" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">绿格 = 质数；非质数不参与判定，只撑宽 l / r 的可选范围</text>

  <path d="M 260 106 L 260 122" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="117" font-size="10" fill="#446688" filter="url(#rough2)">① 筛出质数，抽出（值 @ 位置）序列</text>

  <!-- ② 质数序列 + 窗口 -->
  <rect x="256" y="124" width="156" height="58" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>

  <rect x="114" y="130" width="70" height="48" rx="4" fill="#f2f2f2" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="149" y="152" text-anchor="middle" font-size="15" fill="#aaaaaa" filter="url(#rough2)">2</text>
  <text x="149" y="168" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">@ #1</text>
  <path d="M 158 134 L 172 148 M 172 134 L 158 148" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>

  <rect x="188" y="130" width="70" height="48" rx="4" fill="#f2f2f2" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="223" y="152" text-anchor="middle" font-size="15" fill="#aaaaaa" filter="url(#rough2)">3</text>
  <text x="223" y="168" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">@ #2</text>
  <path d="M 232 134 L 246 148 M 246 134 L 232 148" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>

  <rect x="262" y="130" width="70" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="297" y="152" text-anchor="middle" font-size="15" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">5</text>
  <text x="297" y="168" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">@ #4</text>

  <rect x="336" y="130" width="70" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="371" y="152" text-anchor="middle" font-size="15" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">7</text>
  <text x="371" y="168" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">@ #5</text>

  <text x="260" y="192" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">j=3（值 7）入窗：{2,3,5,7} 极差 5 &gt; 3 → 踢 2；{3,5,7} 极差 4 &gt; 3 → 踢 3</text>
  <text x="260" y="207" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">窗口 [i₀=2, j=3] = {5,7}：极差 7−5 = 2 ≤ 3 ✓</text>

  <path d="M 260 214 L 260 228" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="272" y="224" font-size="10" fill="#4a7a3a" filter="url(#rough2)">② 用位置间隔数子数组</text>

  <!-- ③ 计数 -->
  <rect x="20" y="232" width="236" height="88" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="138" y="250" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">l 的选法（左端点）</text>
  <text x="138" y="267" text-anchor="middle" font-size="11" fill="#2a5a2a" filter="url(#rough2)">l ∈ ( q[i₀−1], q[j−1] ] = (2, 4]</text>
  <text x="138" y="283" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">= q[j−1] − q[i₀−1] = 4 − 2 = 2 种</text>
  <text x="138" y="299" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">左界：再左会圈进失效质数 3@2</text>
  <text x="138" y="313" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">右界：再右窗口里只剩 1 个质数</text>

  <rect x="264" y="232" width="236" height="88" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="382" y="250" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">r 的选法（右端点）</text>
  <text x="382" y="267" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">r ∈ [ q[j], q[j+1] ) = [5, 6)</text>
  <text x="382" y="283" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">= q[j+1] − q[j] = 6 − 5 = 1 种</text>
  <text x="382" y="299" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">下界：必须圈住最右质数 7@5</text>
  <text x="382" y="313" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">上界：6 = n 是数组越界哨兵</text>

  <rect x="84" y="328" width="352" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="260" y="346" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">贡献 = 2 × 1 = 2 → 子数组 [8,5,7] 与 [5,7]</text>
  <text x="260" y="362" text-anchor="middle" font-size="9.5" fill="#8a6d3a" filter="url(#rough2)">每个 j 恰好统计「最右质数 = q[j]」的子数组 → 不重不漏</text>

  <text x="260" y="388" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">所有 j 的贡献求和即为答案</text>
</svg>
