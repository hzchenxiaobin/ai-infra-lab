<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一遍扫描 + 单栈求值</text>

  <!-- Start -->
  <rect x="180" y="46" width="160" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="17" filter="url(#rough2)"/>
  <text x="260" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">初始化空栈 stack</text>

  <path d="M 260 80 L 260 96" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: 还有 token? -->
  <polygon points="260,98 360,150 260,202 160,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="146" text-anchor="middle" font-size="12" fill="#333">还有 token?</text>
  <text x="260" y="162" text-anchor="middle" font-size="10" fill="#888">遍历 tokens</text>

  <!-- No branch: return -->
  <path d="M 360 150 L 430 150 L 430 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="142" font-size="10" fill="#4a7a3a">否</text>
  <rect x="370" y="64" width="130" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="17" filter="url(#rough2)"/>
  <text x="435" y="86" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">return stack.top()</text>

  <!-- Yes branch: read token -->
  <path d="M 260 202 L 260 218" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="214" font-size="10" fill="#4a7a3a">是</text>
  <rect x="170" y="220" width="180" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="241" text-anchor="middle" font-size="12" fill="#333">读入 token</text>

  <path d="M 260 252 L 260 268" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: 是运算符? -->
  <polygon points="260,270 350,316 260,362 170,316" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="313" text-anchor="middle" font-size="12" fill="#333">token ∈</text>
  <text x="260" y="329" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">{+ − * /}?</text>

  <!-- Yes (operator): pop two -->
  <path d="M 170 316 L 110 316 L 110 230 L 170 230" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="308" font-size="10" fill="#b85450">是</text>
  <rect x="20" y="206" width="180" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="110" y="226" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">b = pop,  a = pop</text>
  <text x="110" y="242" text-anchor="middle" font-size="11" fill="#333">push( a op b )</text>

  <!-- No (operand): push -->
  <path d="M 350 316 L 410 316 L 410 230 L 350 230" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="308" font-size="10" fill="#446688">否</text>
  <rect x="320" y="206" width="180" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="410" y="234" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">push( stoi(token) )</text>

  <!-- loop back to diamond -->
  <path d="M 110 206 L 110 60 L 260 60" stroke="#666" stroke-width="1.2" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 410 206 L 410 60 L 260 60" stroke="#666" stroke-width="1.2" stroke-dasharray="4,3" fill="none" filter="url(#rough2)"/>
  <text x="300" y="54" font-size="10" fill="#888">↑ 回到循环，处理下一个 token</text>

  <!-- bottom callout -->
  <rect x="30" y="376" width="460" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="393" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">每个 token 处理 O(1)，共 n 个 token → 总时间 O(n)，空间 O(n)</text>
  <text x="260" y="407" text-anchor="middle" font-size="10" fill="#888">弹出顺序：先弹右操作数 b，再弹左操作数 a，保证 a − b、a / b 正确</text>
</svg>
