<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：贡献法 + 前缀和的前缀和</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">每个 strength[i] 作最小值管辖一片子数组，贡献 = strength[i] ×（这些子数组之和的总和）</text>

  <text x="48" y="78" font-size="10.5" fill="#666">strength</text>
  <rect x="80" y="58" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="105" y="79" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="132" y="58" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="157" y="79" text-anchor="middle" font-size="14" fill="#333">3</text>
  <rect x="184" y="58" width="50" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="209" y="79" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">1</text>
  <rect x="236" y="58" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="261" y="79" text-anchor="middle" font-size="14" fill="#333">2</text>

  <text x="105" y="52" text-anchor="middle" font-size="9" fill="#888">i=0</text>
  <text x="157" y="52" text-anchor="middle" font-size="9" fill="#888">i=1</text>
  <text x="209" y="52" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">i=2 ←当前</text>
  <text x="261" y="52" text-anchor="middle" font-size="9" fill="#888">i=3</text>

  <text x="44" y="100" font-size="10.5" fill="#888">值=1，最小</text>

  <path d="M 56 96 L 74 96" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="44" y="112" font-size="9" fill="#4a7a3a">L=−1</text>
  <text x="44" y="124" font-size="8.5" fill="#4a7a3a">(左严格更小)</text>
  <text x="286" y="100" font-size="10.5" fill="#888">无更小或相等</text>
  <path d="M 286 96 L 304 96" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="306" y="112" font-size="9" fill="#4a7a3a">R=4(=n)</text>
  <text x="306" y="124" font-size="8.5" fill="#4a7a3a">(右更小或相等)</text>

  <text x="105" y="118" text-anchor="middle" font-size="8.5" fill="#999">↑</text>
  <text x="209" y="118" text-anchor="middle" font-size="8.5" fill="#b85450">↑</text>

  <rect x="80" y="100" width="50" height="22" fill="none" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="105" y="135" text-anchor="middle" font-size="8.5" fill="#4a7a3a">左端点 l</text>
  <text x="105" y="147" text-anchor="middle" font-size="8.5" fill="#4a7a3a">取 [L+1, i]</text>
  <text x="105" y="158" text-anchor="middle" font-size="8.5" fill="#4a7a3a">= [0, 2]</text>
  <text x="157" y="135" text-anchor="middle" font-size="8.5" fill="#4a7a3a">↓</text>
  <text x="209" y="135" text-anchor="middle" font-size="8.5" fill="#4a7a3a">↓</text>
  <rect x="184" y="100" width="50" height="22" fill="none" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="236" y="135" text-anchor="middle" font-size="8.5" fill="#4a7a3a">右端点 r</text>
  <text x="236" y="147" text-anchor="middle" font-size="8.5" fill="#4a7a3a">取 [i, R−1]</text>
  <text x="236" y="158" text-anchor="middle" font-size="8.5" fill="#4a7a3a">= [2, 3]</text>

  <rect x="40" y="176" width="240" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="160" y="196" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">目标：i 管辖的子数组之和的总和</text>
  <text x="160" y="216" text-anchor="middle" font-size="10.5" fill="#555">Σ Σ (sum[l..r])，l∈[L+1,i], r∈[i,R−1]</text>
  <text x="160" y="234" text-anchor="middle" font-size="10.5" fill="#555">= Σ Σ (P[r+1] − P[l])</text>
  <text x="160" y="252" text-anchor="middle" font-size="10" fill="#888">P 为前缀和，subarray sum = P[r+1] − P[l]</text>

  <path d="M 286 222 L 312 222" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="299" y="214" text-anchor="middle" font-size="9" fill="#666">拆分</text>

  <rect x="316" y="176" width="220" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="426" y="196" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">用前缀和的前缀和 PP</text>
  <text x="426" y="214" text-anchor="middle" font-size="10" fill="#555">右端点贡献：(i−L)·(PP[R+1]−PP[i+1])</text>
  <text x="426" y="230" text-anchor="middle" font-size="10" fill="#555">左端点贡献：(R−i)·(PP[i+1]−PP[L+1])</text>
  <text x="426" y="252" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">两者相减 → O(1) 求和</text>

  <rect x="40" y="284" width="496" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="288" y="304" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">元素 i 的总贡献</text>
  <text x="288" y="324" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">strength[i] × [(i−L)·(PP[R+1]−PP[i+1]) − (R−i)·(PP[i+1]−PP[L+1])]</text>

  <rect x="40" y="350" width="496" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="288" y="370" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">与 907 的关系：907 只数个数 count=(i−L)·(R−i)</text>
  <text x="288" y="388" text-anchor="middle" font-size="10.5" fill="#555">2281 还要乘子数组之和 → 无法只数个数，需前缀和的前缀和 PP</text>
  <text x="288" y="404" text-anchor="middle" font-size="10" fill="#888">单调栈定边界（左严格更小 / 右更小或相等）防等值重复</text>
  <text x="288" y="418" text-anchor="middle" font-size="9.5" fill="#aaa">PP[k] = P[0]+P[1]+…+P[k−1]，区间 P 之和 = PP[b+1]−PP[a]</text>
</svg>
