<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：奇数 ±1 后必再 /2，挑让 (n±1)/2 为偶数者</text>

  <!-- ===== Top: odd n box ===== -->
  <rect x="220" y="48" width="120" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="70" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">n 为奇数（n &gt; 3）</text>

  <!-- two branches -->
  <path d="M 250 82 Q 200 96 150 108" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 310 82 Q 360 96 410 108" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="98" font-size="10.5" fill="#888" font-weight="bold">选 n − 1</text>
  <text x="358" y="98" font-size="10.5" fill="#888" font-weight="bold">选 n + 1</text>

  <!-- ===== Row: n-1 (even) / n+1 (even) ===== -->
  <rect x="80" y="112" width="140" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="150" y="132" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">n − 1 = 偶数</text>
  <rect x="340" y="112" width="140" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="410" y="132" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">n + 1 = 偶数</text>

  <!-- arrows: 必再 /2 -->
  <path d="M 150 144 Q 150 156 150 166" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 410 144 Q 410 156 410 166" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="164" y="160" font-size="10.5" fill="#888">/2</text>
  <text x="424" y="160" font-size="10.5" fill="#888">/2</text>

  <!-- ===== Row: (n-1)/2 vs (n+1)/2 ===== -->
  <rect x="80" y="170" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="150" y="190" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">(n − 1) / 2</text>
  <rect x="340" y="170" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="410" y="190" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">(n + 1) / 2</text>
  <text x="280" y="190" text-anchor="middle" font-size="10.5" fill="#888">二者必一偶一奇</text>

  <!-- arrows down to verdict -->
  <path d="M 150 202 Q 150 214 150 224" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 410 202 Q 410 214 410 224" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Two example columns ===== -->
  <!-- Left example: n = 13, 13 % 4 == 1 -->
  <rect x="40" y="228" width="220" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="150" y="248" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">例：n = 13，13 % 4 == 1</text>
  <text x="54" y="270" font-size="11" fill="#333">(13−1)/2 = 6</text>
  <rect x="170" y="258" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="274" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">偶✓</text>
  <text x="54" y="294" font-size="11" fill="#333">(13+1)/2 = 7</text>
  <rect x="170" y="282" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="190" y="298" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">奇✗</text>
  <rect x="54" y="312" width="180" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="144" y="330" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">→ 选 n − 1，下一步免费 /2</text>

  <!-- Right example: n = 15, 15 % 4 == 3 -->
  <rect x="300" y="228" width="220" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="410" y="248" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">例：n = 15，15 % 4 == 3</text>
  <text x="314" y="270" font-size="11" fill="#333">(15−1)/2 = 7</text>
  <rect x="430" y="258" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="450" y="274" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">奇✗</text>
  <text x="314" y="294" font-size="11" fill="#333">(15+1)/2 = 8</text>
  <rect x="430" y="282" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="450" y="298" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">偶✓</text>
  <rect x="314" y="312" width="180" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="404" y="330" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">→ 选 n + 1，下一步免费 /2</text>

  <!-- ===== Special case n = 3 ===== -->
  <rect x="120" y="360" width="320" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="382" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">⚠ 特例 n = 3：(3−1)/2 = 1 直达终点，选 n − 1</text>

  <!-- ===== Rule box ===== -->
  <rect x="40" y="402" width="480" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="422" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">规则：n%4==1 → n−1；n%4==3 且 n≠3 → n+1；n=3 → n−1</text>
</svg>
