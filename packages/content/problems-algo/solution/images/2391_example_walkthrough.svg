<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="330" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：garbage = ["G","P","GP","GG"]，travel = [2,4,3]</text>

  <!-- ============ Table header ============ -->
  <g filter="url(#rough2)">
    <rect x="40" y="56" width="580" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="60"  y="75" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">房子 i</text>
    <text x="150" y="75" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">garbage[i]</text>
    <text x="250" y="75" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">收集 len</text>
    <text x="430" y="75" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">last 更新（M / P / G）</text>
    <line x1="105" y1="56" x2="105" y2="84" stroke="#446688" stroke-width="1"/>
    <line x1="200" y1="56" x2="200" y2="84" stroke="#446688" stroke-width="1"/>
    <line x1="300" y1="56" x2="300" y2="84" stroke="#446688" stroke-width="1"/>
  </g>

  <!-- ============ column dividers spanning rows ============ -->
  <g filter="url(#rough2)">
    <line x1="105" y1="84" x2="105" y2="240" stroke="#ddd" stroke-width="1"/>
    <line x1="200" y1="84" x2="200" y2="240" stroke="#ddd" stroke-width="1"/>
    <line x1="300" y1="84" x2="300" y2="240" stroke="#ddd" stroke-width="1"/>
  </g>

  <!-- row 0: "G" -->
  <g filter="url(#rough2)">
    <rect x="40" y="84" width="580" height="38" fill="#eef6ef" stroke="#e0e0e0" stroke-width="0.8"/>
    <text x="60"  y="108" text-anchor="middle" font-size="12" fill="#666">0</text>
    <text x="150" y="108" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">G</text>
    <text x="250" y="108" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">+1</text>
    <text x="430" y="108" text-anchor="middle" font-size="12" fill="#444">M: —　P: —　<tspan fill="#4a7a3a" font-weight="bold">G: 0</tspan></text>
  </g>

  <!-- row 1: "P" -->
  <g filter="url(#rough2)">
    <rect x="40" y="122" width="580" height="38" fill="#eef6ef" stroke="#e0e0e0" stroke-width="0.8"/>
    <text x="60"  y="146" text-anchor="middle" font-size="12" fill="#666">1</text>
    <text x="150" y="146" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">P</text>
    <text x="250" y="146" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">+1</text>
    <text x="430" y="146" text-anchor="middle" font-size="12" fill="#444">M: —　<tspan fill="#446688" font-weight="bold">P: 1</tspan>　G: 0</text>
  </g>

  <!-- row 2: "GP" -->
  <g filter="url(#rough2)">
    <rect x="40" y="160" width="580" height="38" fill="#eef6ef" stroke="#e0e0e0" stroke-width="0.8"/>
    <text x="60"  y="184" text-anchor="middle" font-size="12" fill="#666">2</text>
    <text x="150" y="184" text-anchor="middle" font-size="14"><tspan fill="#4a7a3a" font-weight="bold">G</tspan><tspan fill="#446688" font-weight="bold">P</tspan></text>
    <text x="250" y="184" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">+2</text>
    <text x="430" y="184" text-anchor="middle" font-size="12" fill="#444">M: —　<tspan fill="#446688" font-weight="bold">P: 2</tspan>　<tspan fill="#4a7a3a" font-weight="bold">G: 2</tspan></text>
  </g>

  <!-- row 3: "GG" -->
  <g filter="url(#rough2)">
    <rect x="40" y="198" width="580" height="38" fill="#eef6ef" stroke="#e0e0e0" stroke-width="0.8"/>
    <text x="60"  y="222" text-anchor="middle" font-size="12" fill="#666">3</text>
    <text x="150" y="222" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">GG</text>
    <text x="250" y="222" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">+2</text>
    <text x="430" y="222" text-anchor="middle" font-size="12" fill="#444">M: —　P: 2　<tspan fill="#4a7a3a" font-weight="bold">G: 3</tspan></text>
  </g>

  <!-- divider -->
  <line x1="40" y1="248" x2="620" y2="248" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ====== Summary: collection ====== -->
  <text x="330" y="270" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">收集合计（串行）= 1 + 1 + 2 + 2 = <tspan fill="#4a7a3a">6</tspan></text>

  <!-- ====== Summary: travel ====== -->
  <g filter="url(#rough2)">
    <rect x="60" y="282" width="540" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10"/>
  </g>
  <text x="330" y="300" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold">行驶合计：每辆车开到其 last，沿途 travel 累加</text>
  <text x="80" y="322" font-size="12" fill="#4a7a3a" font-weight="bold">玻璃车 G</text>
  <text x="180" y="322" font-size="12" fill="#444">last = 3 → travel[0]+travel[1]+travel[2] = 2+4+3 = <tspan fill="#4a7a3a" font-weight="bold">9</tspan></text>
  <text x="80" y="342" font-size="12" fill="#446688" font-weight="bold">纸车 P</text>
  <text x="180" y="342" font-size="12" fill="#444">last = 2 → travel[0]+travel[1] = 2+4 = <tspan fill="#446688" font-weight="bold">6</tspan></text>
  <text x="80" y="362" font-size="12" fill="#a87020" font-weight="bold">金属车 M</text>
  <text x="180" y="362" font-size="12" fill="#444">无 M 垃圾 → last = 0 → 不行驶 = <tspan fill="#a87020" font-weight="bold">0</tspan></text>

  <!-- ====== Final answer box ====== -->
  <rect x="100" y="392" width="460" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="330" y="418" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold">答案 = 6 + (9 + 6 + 0) = 21 ✓</text>

  <text x="330" y="456" text-anchor="middle" font-size="11" fill="#888">读法：先按房子累加收集、刷新 last；再按车型累加行驶前缀</text>
</svg>
