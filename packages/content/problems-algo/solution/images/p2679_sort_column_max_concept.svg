<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：每行排序 → 按列取最大 → 求和</text>

  <!-- ===== Input matrix (left) ===== -->
  <text x="113" y="54" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">原始矩阵 nums</text>
  <!-- row 0 -->
  <rect x="50" y="62" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="71" y="83" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="92" y="62" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="113" y="83" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="134" y="62" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="83" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <!-- row 1 -->
  <rect x="50" y="94" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="71" y="115" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="92" y="94" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="113" y="115" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="134" y="94" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="115" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <!-- row 2 -->
  <rect x="50" y="126" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="71" y="147" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="92" y="126" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="113" y="147" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="134" y="126" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="147" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <!-- row 3 -->
  <rect x="50" y="158" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="71" y="179" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="92" y="158" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="113" y="179" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="134" y="158" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="179" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- ===== Arrow: sort each row ===== -->
  <path d="M 188 142 L 238 142" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="213" y="132" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每行 sort</text>
  <text x="213" y="156" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">升序</text>

  <!-- ===== Sorted matrix (right) ===== -->
  <text x="300" y="54" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">排序后矩阵</text>
  <!-- row 0: 1,2,7  (7 is col max) -->
  <rect x="250" y="62" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="271" y="83" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="292" y="62" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="313" y="83" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="334" y="62" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="355" y="83" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">7</text>
  <!-- row 1: 2,4,6 -->
  <rect x="250" y="94" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="271" y="115" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="292" y="94" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="313" y="115" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="334" y="94" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="355" y="115" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>
  <!-- row 2: 3,5,6  (3 and 5 are col max) -->
  <rect x="250" y="126" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="271" y="147" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="292" y="126" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="313" y="147" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="334" y="126" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="355" y="147" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>
  <!-- row 3: 1,2,3 -->
  <rect x="250" y="158" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="271" y="179" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="292" y="158" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="313" y="179" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="334" y="158" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="355" y="179" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- column brackets + downward arrows to col-max boxes -->
  <path d="M 250 198 L 250 206 L 376 206 L 376 198" stroke="#b85450" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 271 208 L 271 220" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 313 208 L 313 220" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 355 208 L 355 220" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- column max boxes -->
  <rect x="250" y="226" width="42" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="271" y="248" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="292" y="226" width="42" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="313" y="248" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="334" y="226" width="42" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="355" y="248" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold" filter="url(#rough2)">7</text>

  <text x="425" y="248" font-size="12" fill="#888" filter="url(#rough2)">← 每列最大值</text>

  <!-- sum box -->
  <path d="M 355 264 L 355 280" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="200" y="286" width="260" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="330" y="312" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">score = 3 + 5 + 7 = 15</text>

  <!-- Legend -->
  <rect x="40" y="346" width="480" height="16" fill="none"/>
  <rect x="40" y="346" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="358" font-size="11" fill="#555" filter="url(#rough2)">原始</text>
  <rect x="100" y="346" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="120" y="358" font-size="11" fill="#555" filter="url(#rough2)">排序后</text>
  <rect x="170" y="346" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="190" y="358" font-size="11" fill="#555" filter="url(#rough2)">列最大元素</text>
  <rect x="260" y="346" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="280" y="358" font-size="11" fill="#555" filter="url(#rough2)">列最大值</text>
  <text x="40" y="380" font-size="11" fill="#888" filter="url(#rough2)">排序后第 k 轮删除的元素恰好对齐到同一列，故逐轮取最大 = 逐列取最大</text>
</svg>
