<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：nums = [4,3,2,6]</text>
  <text x="260" y="50" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">P = [0, 4, 7, 9, 15]，初始栈只放哨兵 j=0（t=0）</text>

  <!-- 表格 -->
  <rect x="36" y="62" width="448" height="166" fill="none" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <path d="M 36 92 L 484 92" fill="none" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 36 126 L 484 126 M 36 160 L 484 160 M 36 194 L 484 194" fill="none" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 74 62 L 74 228 M 134 62 L 134 228 M 284 62 L 284 228 M 346 62 L 346 228 M 406 62 L 406 228" fill="none" stroke="#999" stroke-width="1" filter="url(#rough2)"/>

  <text x="55" y="81" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">i</text>
  <text x="104" y="81" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">P[i]</text>
  <text x="209" y="81" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">查询时栈内 t（自底→顶）</text>
  <text x="315" y="81" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">选中 j*</text>
  <text x="376" y="81" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">dp[i]</text>
  <text x="445" y="81" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">v[i]</text>

  <text x="55" y="112" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="104" y="112" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="209" y="112" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="315" y="112" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="376" y="112" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="445" y="112" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>

  <text x="55" y="146" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="104" y="146" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <text x="209" y="146" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0, 8</text>
  <text x="315" y="146" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="376" y="146" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="445" y="146" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>

  <text x="55" y="180" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="104" y="180" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">9</text>
  <text x="209" y="180" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0, 8, 14</text>
  <text x="315" y="180" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="376" y="180" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="445" y="180" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>

  <text x="55" y="214" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="104" y="214" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">15</text>
  <text x="209" y="214" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0, 8, 14</text>
  <text x="315" y="214" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">3</text>
  <text x="376" y="214" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">3</text>
  <text x="445" y="214" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>

  <!-- 注释 -->
  <text x="36" y="252" font-size="11" fill="#d6a040" filter="url(#rough2)">i=3：t[3] = P[3]+v[3] = 14，弹出被支配的 j=2（t=14 ≥ 14）后压入 i=3 —— 栈仍是 0, 8, 14</text>
  <text x="36" y="274" font-size="11" fill="#d6a040" filter="url(#rough2)">i=2：虽然 i=1 时 dp=1 已算出，但 t[1]=8 &gt; P[2]=7，只能退回哨兵 j=0（整段 [4,3] 并作一段）</text>

  <!-- 结果 -->
  <rect x="36" y="292" width="448" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">dp[4] = 3：[4] [3,2] [6] → 段和 4, 5, 6 非递减 ✓</text>
  <text x="260" y="348" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">要 4 段必须一次都不合并，而 4 &gt; 3 已递减 → 3 就是最优</text>
</svg>
