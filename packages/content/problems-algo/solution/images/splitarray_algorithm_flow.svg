<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：枚举中间切点 j，左建集合、右查匹配</text>

  <!-- step 1: prefix sum -->
  <rect x="180" y="48" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="70" text-anchor="middle" font-size="11.5" fill="#333">① 预处理前缀和 s[]（s[0]=0）</text>
  <path d="M 270 82 L 270 96" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2: loop j -->
  <rect x="150" y="98" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="120" text-anchor="middle" font-size="11.5" fill="#333">② 枚举中间切点 j ∈ [3, n−4]</text>
  <path d="M 270 132 L 270 146" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 3: left build set -->
  <rect x="40" y="148" width="220" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="150" y="168" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">③ 左侧：枚举 i ∈ [1, j−2]</text>
  <text x="150" y="186" text-anchor="middle" font-size="10.5" fill="#444">若 s[i] == s[j] − s[i+1]</text>
  <text x="150" y="202" text-anchor="middle" font-size="10.5" fill="#555">→ 把 s[i] 加入集合 seen</text>

  <!-- step 4: right scan -->
  <rect x="280" y="148" width="220" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="390" y="168" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">④ 右侧：枚举 k ∈ [j+2, n−2]</text>
  <text x="390" y="186" text-anchor="middle" font-size="10.5" fill="#444">若 s[k]−s[j+1] == s[n]−s[k+1]</text>
  <text x="390" y="202" text-anchor="middle" font-size="10.5" fill="#555">且该和 ∈ seen → 命中</text>

  <!-- arrow from left set to right check -->
  <path d="M 260 180 L 280 180" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="174" text-anchor="middle" font-size="9" fill="#b85450">seen</text>

  <!-- step 5: hit? -->
  <path d="M 390 212 L 390 226" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <path d="M 390 230 L 440 256 L 390 282 L 340 256 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="390" y="254" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">命中？</text>
  <text x="390" y="270" text-anchor="middle" font-size="10" fill="#555">(在 seen 中)</text>

  <!-- yes branch -->
  <path d="M 440 256 L 470 256 L 470 300" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="456" y="250" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="410" y="300" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="470" y="322" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">返回 true</text>

  <!-- no branch back to j loop -->
  <path d="M 340 256 L 150 256 L 150 132" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="250" font-size="10" fill="#888">否，下一个 j</text>

  <!-- j exhausted -->
  <path d="M 150 98 L 150 84 L 110 84 L 110 300" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4 3"/>
  <text x="60" y="74" font-size="9.5" fill="#888">j 遍历完</text>
  <rect x="40" y="300" width="140" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="110" y="322" text-anchor="middle" font-size="11.5" fill="#888" font-weight="bold">返回 false</text>

  <!-- complexity note -->
  <rect x="40" y="352" width="460" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="270" y="375" text-anchor="middle" font-size="11" fill="#446688">每个 j：左 O(j) 建集合 + 右 O(n−j) 查匹配 ⇒ 总 O(n²)</text>
</svg>
