<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="450" fill="#fafafa"/>

  <text x="320" y="32" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">示例演算：n=4，upload(3)→(1)→(2)</text>

  <!-- column headers -->
  <text x="95" y="74" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">操作</text>
  <text x="248" y="62" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">seen[1..4]</text>
  <g font-size="11" fill="#aaa" filter="url(#rough2)">
    <text x="170" y="80" text-anchor="middle">1</text>
    <text x="214" y="80" text-anchor="middle">2</text>
    <text x="258" y="80" text-anchor="middle">3</text>
    <text x="302" y="80" text-anchor="middle">4</text>
  </g>
  <text x="388" y="74" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">ans</text>
  <text x="520" y="74" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">推进过程</text>

  <!-- separator line -->
  <path d="M40 90 L620 90" stroke="#ddd" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- Row 1: upload(3)  seen=[F,F,T,F] ans=0 -->
  <text x="95" y="120" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">upload(3)</text>
  <g filter="url(#rough2)">
    <rect x="148" y="98" width="44" height="34" fill="#f0f0f0" stroke="#999" stroke-width="1.3" rx="4"/>
    <rect x="192" y="98" width="44" height="34" fill="#f0f0f0" stroke="#999" stroke-width="1.3" rx="4"/>
    <rect x="236" y="98" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="280" y="98" width="44" height="34" fill="#f0f0f0" stroke="#999" stroke-width="1.3" rx="4"/>
  </g>
  <g font-size="14" filter="url(#rough2)">
    <text x="170" y="120" text-anchor="middle" fill="#bbb">·</text>
    <text x="214" y="120" text-anchor="middle" fill="#bbb">·</text>
    <text x="258" y="120" text-anchor="middle" fill="#4a7a3a">✓</text>
    <text x="302" y="120" text-anchor="middle" fill="#bbb">·</text>
  </g>
  <text x="388" y="120" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="430" y="120" text-anchor="start" font-size="12" fill="#888" filter="url(#rough2)">seen[1]=F → 不动</text>

  <!-- Row 2: upload(1)  seen=[T,F,T,F] ans=1 -->
  <text x="95" y="170" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">upload(1)</text>
  <g filter="url(#rough2)">
    <rect x="148" y="148" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="192" y="148" width="44" height="34" fill="#f0f0f0" stroke="#999" stroke-width="1.3" rx="4"/>
    <rect x="236" y="148" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="280" y="148" width="44" height="34" fill="#f0f0f0" stroke="#999" stroke-width="1.3" rx="4"/>
  </g>
  <g font-size="14" filter="url(#rough2)">
    <text x="170" y="170" text-anchor="middle" fill="#4a7a3a">✓</text>
    <text x="214" y="170" text-anchor="middle" fill="#bbb">·</text>
    <text x="258" y="170" text-anchor="middle" fill="#4a7a3a">✓</text>
    <text x="302" y="170" text-anchor="middle" fill="#bbb">·</text>
  </g>
  <text x="388" y="170" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="430" y="170" text-anchor="start" font-size="12" fill="#333" filter="url(#rough2)">seen[1]=T→ans=1；seen[2]=F→停</text>

  <!-- Row 3: upload(2)  seen=[T,T,T,F] ans=3 -->
  <text x="95" y="220" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">upload(2)</text>
  <g filter="url(#rough2)">
    <rect x="148" y="198" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="192" y="198" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="236" y="198" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="280" y="198" width="44" height="34" fill="#f0f0f0" stroke="#999" stroke-width="1.3" rx="4"/>
  </g>
  <g font-size="14" filter="url(#rough2)">
    <text x="170" y="220" text-anchor="middle" fill="#4a7a3a">✓</text>
    <text x="214" y="220" text-anchor="middle" fill="#4a7a3a">✓</text>
    <text x="258" y="220" text-anchor="middle" fill="#4a7a3a">✓</text>
    <text x="302" y="220" text-anchor="middle" fill="#bbb">·</text>
  </g>
  <text x="388" y="220" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="430" y="216" text-anchor="start" font-size="12" fill="#333" filter="url(#rough2)">seen[2]=T→2；seen[3]=T→3</text>
  <text x="430" y="232" text-anchor="start" font-size="12" fill="#888" filter="url(#rough2)">seen[4]=F→停</text>

  <!-- results box -->
  <rect x="60" y="270" width="520" height="150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="84" y="296" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">longest() 返回值（指针已在 upload 维护好）：</text>
  <text x="84" y="322" font-size="12" fill="#333" filter="url(#rough2)">• upload(3) 后 → longest() = 0（视频 1 未上传）</text>
  <text x="84" y="346" font-size="12" fill="#333" filter="url(#rough2)">• upload(1) 后 → longest() = 1（前缀 [1] 连续）</text>
  <text x="84" y="370" font-size="12" fill="#333" filter="url(#rough2)">• upload(2) 后 → longest() = 3（前缀 [1,2,3] 连续）</text>
  <text x="84" y="400" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">三次 longest() 输出 [0, 1, 3] ✓</text>
</svg>
