<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 510" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#888"/>
    </marker>
    <marker id="arrU" markerWidth="8" markerHeight="8" refX="4" refY="1" orient="auto">
      <path d="M0,8 L4,1 L8,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="480" height="510" fill="#fafafa"/>

  <text x="240" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">DFS 回溯流程：铺瓷砖</text>

  <!-- 1. Entry oval -->
  <ellipse cx="240" cy="52" rx="58" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="240" y="57" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">dfs(count)</text>

  <path d="M 240 72 L 240 86" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- 2. Find empty cell -->
  <rect x="120" y="88" width="240" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="240" y="112" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">找最左上空格 (r, c)</text>

  <path d="M 240 126 L 240 140" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- 3. Diamond: found empty? -->
  <polygon points="240,142 330,176 240,210 150,176" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="240" y="173" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">找到空格?</text>
  <text x="240" y="189" text-anchor="middle" font-size="9.5" fill="#888">无空格=铺满</text>

  <!-- No → right: best=count, return -->
  <text x="343" y="170" font-size="11" fill="#b85450" font-weight="bold">No</text>
  <path d="M 330 176 L 370 176" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="370" y="156" width="100" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="420" y="174" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">best=count</text>
  <text x="420" y="190" text-anchor="middle" font-size="10.5" fill="#888">返回</text>

  <!-- Yes → down -->
  <text x="252" y="222" font-size="11" fill="#4a7a3a" font-weight="bold">Yes</text>
  <path d="M 240 210 L 240 228" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- 4. Diamond: count >= best? -->
  <polygon points="240,228 330,262 240,296 150,262" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="240" y="259" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">count ≥ best?</text>
  <text x="240" y="275" text-anchor="middle" font-size="9.5" fill="#888">剪枝判定</text>

  <!-- Yes → right: prune -->
  <text x="343" y="256" font-size="11" fill="#b85450" font-weight="bold">Yes</text>
  <path d="M 330 262 L 370 262" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="370" y="242" width="100" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="420" y="267" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">剪枝返回</text>

  <!-- No → down -->
  <text x="252" y="308" font-size="11" fill="#4a7a3a" font-weight="bold">No</text>
  <path d="M 240 296 L 240 314" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- 5. Box: for size = max ↓ 1 -->
  <rect x="100" y="314" width="280" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="240" y="338" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">for size = min(n−r, m−c) ↓ 1</text>

  <path d="M 240 352 L 240 368" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- 6. Diamond: size×size all empty? -->
  <polygon points="240,370 340,404 240,438 140,404" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="240" y="401" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">size×size</text>
  <text x="240" y="417" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">全空?</text>

  <!-- No → left: skip, loop back -->
  <text x="120" y="398" font-size="11" fill="#b85450" font-weight="bold">No</text>
  <path d="M 140 404 L 90 404" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <rect x="14" y="384" width="76" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="52" y="409" text-anchor="middle" font-size="10.5" fill="#333">跳过此 size</text>
  <!-- loop up to for box -->
  <path d="M 52 384 L 52 333 L 100 333" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Yes → down -->
  <text x="252" y="450" font-size="11" fill="#4a7a3a" font-weight="bold">Yes</text>
  <path d="M 240 438 L 240 452" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- 7. Box: place → dfs → undo -->
  <rect x="80" y="454" width="320" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="240" y="480" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">放置 → dfs(count+1) → 撤销</text>

  <!-- loop back to for box (right side) -->
  <path d="M 400 465 L 452 465 L 452 333 L 380 333" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="460" y="400" font-size="9.5" fill="#aaa" transform="rotate(-90 460 400)">下一个 size</text>

  <!-- bottom note -->
  <text x="240" y="504" text-anchor="middle" font-size="10.5" fill="#d6a040" font-style="italic">for 结束 → 返回（所有 size 尝试完毕）</text>
</svg>
