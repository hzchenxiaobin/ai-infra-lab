<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#888888"/>
    </marker>
  </defs>

  <rect width="620" height="360" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：k 定了，选谁就被「锁定」</text>
  <text x="310" y="46" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">nums = [6,0,3,3,6,7,2,7] 排序后 a = [0,2,3,3,6,6,7,7]，n = 8，试 k = 4</text>

  <text x="306" y="74" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">k = 4 人</text>
  <path d="M 306 80 L 306 176" stroke="#b85450" stroke-width="2" stroke-dasharray="7 5" fill="none" filter="url(#rough2)"/>

  <text x="180" y="104" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">选中组最大值 a[3] = 3 &lt; 4 ✓</text>
  <path d="M 222 110 Q 260 116 272 126" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="432" y="104" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">落选组最小值 a[4] = 6 &gt; 4 ✓</text>
  <path d="M 390 110 Q 352 116 340 126" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- selected cells (blue) -->
  <rect x="54" y="130" width="56" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="82" y="157" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="118" y="130" width="56" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="146" y="157" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="182" y="130" width="56" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="210" y="157" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="246" y="130" width="56" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="274" y="157" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>

  <!-- unselected cells (green) -->
  <rect x="310" y="130" width="56" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="338" y="157" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>
  <rect x="374" y="130" width="56" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="402" y="157" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>
  <rect x="438" y="130" width="56" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="466" y="157" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7</text>
  <rect x="502" y="130" width="56" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="530" y="157" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7</text>

  <!-- indices -->
  <text x="82" y="190" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="146" y="190" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">1</text>
  <text x="210" y="190" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">2</text>
  <text x="274" y="190" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">3</text>
  <text x="338" y="190" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">4</text>
  <text x="402" y="190" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">5</text>
  <text x="466" y="190" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">6</text>
  <text x="530" y="190" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">7</text>

  <!-- group labels -->
  <text x="178" y="216" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">选中的 k 人：都要 nums[i] &lt; k</text>
  <text x="434" y="216" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">落选的 n−k 人：都要 nums[i] &gt; k</text>

  <!-- conclusion box -->
  <rect x="60" y="244" width="500" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="270" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold" filter="url(#rough2)">k 可行 ⟺ a[k−1] &lt; k 且 a[k] &gt; k</text>
  <text x="310" y="292" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">（哨兵：a[−1] = −1、a[n] = +∞，统一 k = 0 与 k = n 边界）</text>

  <text x="310" y="338" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">⚠️ 值恰为 k 的学生：入选要求 k &gt; k ✗，落选要求 k &lt; k ✗——两边违约，该 k 直接作废</text>
</svg>
