<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    示例演算：示例 2 逐步执行
  </text>
  <text x="280" y="44" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">
    n=3, languages=[[2],[1,3],[1,2],[3]], friendships=[[1,4],[1,2],[3,4],[2,3]]
  </text>

  <!-- ===== Phase 1: user language sets ===== -->
  <text x="30" y="68" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">① 用户语言集</text>
  <g filter="url(#rough2)">
    <rect x="40" y="76" width="100" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <rect x="160" y="76" width="100" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <rect x="280" y="76" width="100" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <rect x="400" y="76" width="100" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
  </g>
  <g font-size="11" filter="url(#rough2)">
    <text x="90" y="92" text-anchor="middle" fill="#333" font-weight="bold">用户1</text>
    <text x="90" y="106" text-anchor="middle" fill="#446688">语{2}</text>
    <text x="210" y="92" text-anchor="middle" fill="#333" font-weight="bold">用户2</text>
    <text x="210" y="106" text-anchor="middle" fill="#446688">语{1,3}</text>
    <text x="330" y="92" text-anchor="middle" fill="#333" font-weight="bold">用户3</text>
    <text x="330" y="106" text-anchor="middle" fill="#446688">语{1,2}</text>
    <text x="450" y="92" text-anchor="middle" fill="#333" font-weight="bold">用户4</text>
    <text x="450" y="106" text-anchor="middle" fill="#446688">语{3}</text>
  </g>

  <!-- ===== Phase 2: filter friendships ===== -->
  <text x="30" y="134" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">② 过滤好友对（检查语言交集）</text>

  <!-- table background -->
  <rect x="30" y="140" width="500" height="94" fill="#fffdf3" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <!-- header -->
  <g font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">
    <text x="60" y="156">好友对</text>
    <text x="200" y="156">语言交集</text>
    <text x="380" y="156">能否沟通</text>
  </g>
  <line x1="40" y1="162" x2="520" y2="162" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- rows -->
  <g font-size="11" filter="url(#rough2)">
    <text x="60" y="178" fill="#444">(1, 4)</text>
    <text x="200" y="178" fill="#888">{2} ∩ {3} = ∅</text>
    <text x="380" y="178" fill="#b85450" font-weight="bold">✗ 不能沟通</text>

    <text x="60" y="196" fill="#444">(1, 2)</text>
    <text x="200" y="196" fill="#888">{2} ∩ {1,3} = ∅</text>
    <text x="380" y="196" fill="#b85450" font-weight="bold">✗ 不能沟通</text>

    <text x="60" y="214" fill="#444">(3, 4)</text>
    <text x="200" y="214" fill="#888">{1,2} ∩ {3} = ∅</text>
    <text x="380" y="214" fill="#b85450" font-weight="bold">✗ 不能沟通</text>
  </g>
  <!-- last row highlighted (satisfied) -->
  <rect x="34" y="218" width="492" height="14" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <g font-size="11" filter="url(#rough2)">
    <text x="60" y="228" fill="#2e6e2e">(2, 3)</text>
    <text x="200" y="228" fill="#4a7a3a">{1,3} ∩ {1,2} = {1}</text>
    <text x="380" y="228" fill="#2e6e2e" font-weight="bold">✓ 已能沟通</text>
  </g>

  <!-- needy set note -->
  <rect x="30" y="240" width="500" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="255" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">
    需教集合 S = {1, 2, 3, 4}（未满足好友对中的去重用户）
  </text>

  <!-- ===== Phase 3: enumerate languages ===== -->
  <text x="30" y="284" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">③ 枚举语言 L，统计 S 中不掌握 L 的人数</text>

  <rect x="30" y="290" width="500" height="88" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <!-- header -->
  <g font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">
    <text x="60" y="306">语言 L</text>
    <text x="180" y="306">S 中不掌握 L 的用户</text>
    <text x="420" y="306">需教人数</text>
  </g>
  <line x1="40" y1="312" x2="520" y2="312" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- rows -->
  <g font-size="11" filter="url(#rough2)">
    <text x="60" y="328" fill="#444">L = 1</text>
    <text x="180" y="328" fill="#444">用户1(语{2}), 用户4(语{3})</text>
    <text x="420" y="328" fill="#d6a040" font-weight="bold">2</text>

    <text x="60" y="348" fill="#444">L = 2</text>
    <text x="180" y="348" fill="#444">用户2(语{1,3}), 用户4(语{3})</text>
    <text x="420" y="348" fill="#d6a040" font-weight="bold">2</text>

    <text x="60" y="368" fill="#444">L = 3</text>
    <text x="180" y="368" fill="#444">用户1(语{2}), 用户3(语{1,2})</text>
    <text x="420" y="368" fill="#d6a040" font-weight="bold">2</text>
  </g>

  <!-- ===== Answer banner ===== -->
  <rect x="30" y="390" width="500" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="412" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">
    minTeach = min(2, 2, 2) = 2
  </text>
  <text x="280" y="432" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">
    教语言 3 给用户 1 和用户 3 → 所有好友均可沟通 ✓
  </text>
</svg>
