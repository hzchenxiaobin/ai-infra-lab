<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#666" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <!-- 开始 -->
  <rect x="215" y="16" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="14" filter="url(#rough2)"/>
  <text x="260" y="35" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">开始</text>
  <path d="M 260 44 L 260 58" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="150" y="60" width="220" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="80" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">dp0..dp3, ans ← −∞</text>
  <path d="M 260 90 L 260 104" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 -->
  <polygon points="260,106 330,132 260,158 190,132" fill="#ffffff" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="260" y="137" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">还有元素 v?</text>

  <path d="M 330 132 L 403 132" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="355" y="126" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="405" y="118" width="90" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="450" y="137" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">返回 ans</text>

  <path d="M 260 158 L 260 170" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="168" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 取元素并计算 -->
  <rect x="130" y="172" width="260" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="193" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">m ← v·k ，d ← trunc(v/k)（向零取整）</text>
  <path d="M 260 204 L 260 216" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 四个转移框 -->
  <rect x="45" y="218" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="145" y="239" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">dp0 ← max(dp0+v, v)</text>

  <rect x="275" y="218" width="205" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="377" y="239" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">dp1 ← max(dp1+m, dp0+m, m)</text>

  <rect x="45" y="262" width="200" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="145" y="283" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">dp2 ← max(dp2+d, dp0+d, d)</text>

  <rect x="275" y="262" width="205" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="377" y="283" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">dp3 ← max(dp3+v, dp1+v, dp2+v)</text>

  <path d="M 260 294 L 260 306" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ans 更新 -->
  <rect x="135" y="308" width="250" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="328" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">ans ← max(ans, dp0, dp1, dp2, dp3)</text>

  <!-- 回边 -->
  <path d="M 135 323 L 40 323 L 40 132 L 186 132" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="32" y="230" font-size="11" fill="#888" transform="rotate(-90 32 230)" text-anchor="middle" filter="url(#rough2)">下一个元素</text>

  <text x="260" y="368" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">四个新值全部基于旧值并行算出后，再统一回写（顺序不可颠倒）</text>
  <text x="260" y="388" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">单趟扫描 O(n)，仅 4 个滚动变量 O(1) 空间</text>
</svg>
