<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一遍找峰，逐峰 O(1) 贡献累加</text>

  <!-- 左列流程 -->
  <g filter="url(#rough2)">
    <rect x="24" y="36" width="280" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="164" y="52" text-anchor="middle" font-size="10.5" fill="#33506b">① 一遍扫描 i = 1 … n−2</text>
    <text x="164" y="68" text-anchor="middle" font-size="10.5" fill="#33506b">nums[i] 严格大于两侧邻居 → 收进 peaks</text>

    <path d="M164 76 L164 88" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>

    <polygon points="164,90 240,118 164,146 88,118" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="164" y="122" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">peaks 为空？</text>

    <path d="M240 118 L266 118" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="252" y="110" text-anchor="middle" font-size="10" fill="#8a3030" font-weight="bold">是</text>
    <rect x="270" y="104" width="64" height="28" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <text x="302" y="122" text-anchor="middle" font-size="10" fill="#8a3030">返回 0</text>

    <path d="M164 146 L164 158" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="174" y="156" font-size="10" fill="#2f5d24" font-weight="bold">否</text>

    <rect x="94" y="160" width="140" height="24" rx="12" fill="#ffffff" stroke="#888" stroke-width="1.4" stroke-dasharray="5,3"/>
    <text x="164" y="176" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">for j：p = peaks[j]</text>

    <path d="M164 184 L164 196" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>

    <rect x="24" y="198" width="280" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="164" y="214" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold">② 三重边界</text>
    <text x="164" y="230" text-anchor="middle" font-size="10.5" fill="#8a6d1a">L = max(p−k, 前峰+1, 0)</text>
    <text x="164" y="246" text-anchor="middle" font-size="10.5" fill="#8a6d1a">R = min(p+k, 后峰−1, n−1)</text>

    <path d="M164 254 L164 266" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>

    <rect x="24" y="268" width="280" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="164" y="283" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">③ ans += (p−L+1)×(R−p+1)</text>
    <text x="164" y="300" text-anchor="middle" font-size="10" fill="#2f5d24">乘法原理：左端点数 × 右端点数（long long）</text>

    <path d="M304 288 L332 288 L332 172 L238 172" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)"/>
    <text x="330" y="150" text-anchor="middle" font-size="9" fill="#999">下一个峰</text>

    <path d="M164 308 L164 320" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>

    <rect x="24" y="322" width="280" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="164" y="341" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold">④ 全部峰处理完 → 返回 ans</text>
  </g>

  <!-- 右列要点 -->
  <g filter="url(#rough2)">
    <text x="444" y="52" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">要点速记</text>

    <rect x="352" y="60" width="184" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="444" y="78" text-anchor="middle" font-size="10" fill="#8a6d1a" font-weight="bold">三重边界取 max / min：</text>
    <text x="444" y="96" text-anchor="middle" font-size="10" fill="#8a6d1a">L 下界：p−k、前峰+1、0</text>
    <text x="444" y="114" text-anchor="middle" font-size="10" fill="#8a6d1a">R 上界：p+k、后峰−1、n−1</text>

    <rect x="352" y="132" width="184" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="444" y="150" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold">不重不漏：</text>
    <text x="444" y="166" text-anchor="middle" font-size="10" fill="#2f5d24">每个有效子数组恰含一个峰</text>
    <text x="444" y="182" text-anchor="middle" font-size="10" fill="#2f5d24">按峰独立计数（贡献法）</text>

    <rect x="352" y="196" width="184" height="60" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <text x="444" y="214" text-anchor="middle" font-size="10" fill="#8a3030" font-weight="bold">溢出警示：</text>
    <text x="444" y="230" text-anchor="middle" font-size="10" fill="#8a3030">总和 ≤ n²/4 ≈ 2.5×10⁹</text>
    <text x="444" y="246" text-anchor="middle" font-size="10" fill="#8a3030">超 int32 → C++ 用 long long</text>

    <rect x="352" y="264" width="184" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="444" y="281" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">时间 O(n)　空间 O(n)</text>
    <text x="444" y="298" text-anchor="middle" font-size="9.5" fill="#33506b">峰值表可流式维护 → O(1) 额外</text>

    <rect x="352" y="316" width="184" height="56" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.2"/>
    <text x="444" y="334" text-anchor="middle" font-size="9.5" fill="#555">边界自检：n ≤ 2 无峰</text>
    <text x="444" y="350" text-anchor="middle" font-size="9.5" fill="#555">相等平台不成峰（严格 &gt;）</text>
    <text x="444" y="366" text-anchor="middle" font-size="9.5" fill="#555">L ≤ p ≤ R 恒成立，无需判空</text>
  </g>
</svg>
