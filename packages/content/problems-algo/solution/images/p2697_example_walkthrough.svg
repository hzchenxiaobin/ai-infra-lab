<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：三组配对逐对决策</text>

  <!-- Header row -->
  <rect x="40" y="40" width="480" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="58" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">输入</text>
  <text x="150" y="58" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">配对 (i, j)</text>
  <text x="250" y="58" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">原字符</text>
  <text x="330" y="58" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">比较</text>
  <text x="430" y="58" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">操作 / 结果</text>

  <!-- Example 1: egcfe -->
  <rect x="40" y="68" width="480" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="82" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">egcfe</text>
  <text x="280" y="82" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">— 三对配对如下 —</text>

  <rect x="40" y="90" width="480" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="80" y="106" text-anchor="middle" font-size="11" fill="#333"></text>
  <text x="150" y="106" text-anchor="middle" font-size="11" fill="#333">(0, 4)</text>
  <text x="250" y="106" text-anchor="middle" font-size="11" fill="#333">e, e</text>
  <text x="330" y="106" text-anchor="middle" font-size="11" fill="#4a7a3a">相等</text>
  <text x="430" y="106" text-anchor="middle" font-size="11" fill="#4a7a3a">不动（0 次）</text>

  <rect x="40" y="116" width="480" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="150" y="132" text-anchor="middle" font-size="11" fill="#333">(1, 3)</text>
  <text x="250" y="132" text-anchor="middle" font-size="11" fill="#333">g, f</text>
  <text x="330" y="132" text-anchor="middle" font-size="11" fill="#b85450">g &gt; f</text>
  <text x="430" y="132" text-anchor="middle" font-size="11" fill="#b85450">改 g→f（1 次）</text>

  <rect x="40" y="142" width="480" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="150" y="158" text-anchor="middle" font-size="11" fill="#333">中心 2</text>
  <text x="250" y="158" text-anchor="middle" font-size="11" fill="#333">c</text>
  <text x="330" y="158" text-anchor="middle" font-size="11" fill="#d6a040">—</text>
  <text x="430" y="158" text-anchor="middle" font-size="11" fill="#d6a040">单字符不动</text>

  <rect x="40" y="168" width="480" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="280" y="183" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">→ efcfe（1 次操作）✓</text>

  <!-- Example 2: abcd -->
  <rect x="40" y="198" width="480" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="212" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">abcd</text>
  <text x="280" y="212" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">— 两对配对如下 —</text>

  <rect x="40" y="220" width="480" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="150" y="236" text-anchor="middle" font-size="11" fill="#333">(0, 3)</text>
  <text x="250" y="236" text-anchor="middle" font-size="11" fill="#333">a, d</text>
  <text x="330" y="236" text-anchor="middle" font-size="11" fill="#b85450">a &lt; d</text>
  <text x="430" y="236" text-anchor="middle" font-size="11" fill="#b85450">改 d→a（1 次）</text>

  <rect x="40" y="246" width="480" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="150" y="262" text-anchor="middle" font-size="11" fill="#333">(1, 2)</text>
  <text x="250" y="262" text-anchor="middle" font-size="11" fill="#333">b, c</text>
  <text x="330" y="262" text-anchor="middle" font-size="11" fill="#b85450">b &lt; c</text>
  <text x="430" y="262" text-anchor="middle" font-size="11" fill="#b85450">改 c→b（1 次）</text>

  <rect x="40" y="272" width="480" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="280" y="287" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">→ abba（2 次操作）✓</text>

  <!-- Example 3: seven -->
  <rect x="40" y="302" width="480" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="316" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">seven</text>
  <text x="280" y="316" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">— 两对 + 中心 —</text>

  <rect x="40" y="324" width="480" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="150" y="340" text-anchor="middle" font-size="11" fill="#333">(0, 4)</text>
  <text x="250" y="340" text-anchor="middle" font-size="11" fill="#333">s, n</text>
  <text x="330" y="340" text-anchor="middle" font-size="11" fill="#b85450">n &lt; s</text>
  <text x="430" y="340" text-anchor="middle" font-size="11" fill="#b85450">改 s→n（1 次）</text>

  <rect x="40" y="350" width="480" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="150" y="366" text-anchor="middle" font-size="11" fill="#333">(1, 3)</text>
  <text x="250" y="366" text-anchor="middle" font-size="11" fill="#333">e, e</text>
  <text x="330" y="366" text-anchor="middle" font-size="11" fill="#4a7a3a">相等</text>
  <text x="430" y="366" text-anchor="middle" font-size="11" fill="#4a7a3a">不动（0 次）</text>

  <rect x="40" y="376" width="480" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="280" y="390" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">→ neven（1 次操作）✓</text>
</svg>
