<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：餐品字典序 vs 桌号数值序，两个有序容器分管</text>
  <text x="300" y="46" text-anchor="middle" font-size="11" fill="#888">桌号必须转 int 排序，否则 "10" &lt; "3"（字典序）致行序错乱</text>

  <!-- ===== Left: 餐品列 set<string> 字典序 ===== -->
  <rect x="28" y="68" width="262" height="190" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="159" y="90" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">餐品列：set&lt;string&gt;</text>
  <text x="159" y="106" text-anchor="middle" font-size="10" fill="#666">按字母（字典）顺序</text>

  <g font-size="11">
    <rect x="48" y="120" width="222" height="24" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="159" y="136" text-anchor="middle" fill="#333">Beef Burrito</text>

    <rect x="48" y="150" width="222" height="24" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="159" y="166" text-anchor="middle" fill="#333">Ceviche</text>

    <rect x="48" y="180" width="222" height="24" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="159" y="196" text-anchor="middle" fill="#333">Fried Chicken</text>

    <rect x="48" y="210" width="222" height="24" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="159" y="226" text-anchor="middle" fill="#333">Water</text>
  </g>
  <!-- alphabetical arrow -->
  <path d="M 38 232 L 38 122" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="34" y="180" text-anchor="middle" font-size="9" fill="#446688" transform="rotate(-90 34 180)">A→Z</text>

  <!-- ===== Right: 桌号行 set<int> 数值序 ===== -->
  <rect x="310" y="68" width="262" height="190" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="441" y="90" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">桌号行：set&lt;int&gt;</text>
  <text x="441" y="106" text-anchor="middle" font-size="10" fill="#666">按数值升序</text>

  <g font-size="13">
    <rect x="330" y="120" width="60" height="30" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="360" y="140" text-anchor="middle" fill="#333" font-weight="bold">3</text>

    <rect x="411" y="120" width="60" height="30" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="441" y="140" text-anchor="middle" fill="#333" font-weight="bold">5</text>

    <rect x="492" y="120" width="60" height="30" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="522" y="140" text-anchor="middle" fill="#333" font-weight="bold">10</text>
  </g>
  <!-- numeric order arrow -->
  <path d="M 332 162 L 552 162" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="441" y="178" text-anchor="middle" font-size="10" fill="#4a7a3a">3 &lt; 5 &lt; 10 ✓</text>

  <!-- warning: string sort would be wrong -->
  <rect x="330" y="192" width="222" height="54" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="441" y="210" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">⚠ 若按字符串字典序</text>
  <text x="441" y="226" text-anchor="middle" font-size="11" fill="#b85450">"10" &lt; "3" &lt; "5"</text>
  <text x="441" y="240" text-anchor="middle" font-size="10" fill="#b85450">→ 10 排到 3 前面 ✗</text>

  <!-- ===== Bottom: 计数表 + 拼表 ===== -->
  <path d="M 159 262 L 159 286" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 441 262 L 441 286" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <text x="300" y="300" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">嵌套哈希 cnt[table][food] 累计计数 → 按 行×列 拼表</text>

  <!-- mini output table -->
  <g font-size="10">
    <!-- header -->
    <rect x="60" y="312" width="80" height="22" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="100" y="327" text-anchor="middle" fill="#444" font-weight="bold">Table</text>
    <rect x="140" y="312" width="100" height="22" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="190" y="327" text-anchor="middle" fill="#444" font-weight="bold">Beef Burrito</text>
    <rect x="240" y="312" width="70" height="22" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="275" y="327" text-anchor="middle" fill="#444" font-weight="bold">Ceviche</text>
    <rect x="310" y="312" width="100" height="22" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="360" y="327" text-anchor="middle" fill="#444" font-weight="bold">Fried Chicken</text>
    <rect x="410" y="312" width="60" height="22" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="440" y="327" text-anchor="middle" fill="#444" font-weight="bold">Water</text>

    <!-- row 3 -->
    <rect x="60" y="334" width="80" height="22" rx="3" fill="#ffffff" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <text x="100" y="349" text-anchor="middle" fill="#333" font-weight="bold">3</text>
    <rect x="140" y="334" width="100" height="22" rx="3" fill="#ffffff" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <text x="190" y="349" text-anchor="middle" fill="#999">0</text>
    <rect x="240" y="334" width="70" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="275" y="349" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <rect x="310" y="334" width="100" height="22" rx="3" fill="#ffffff" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <text x="360" y="349" text-anchor="middle" fill="#333">1</text>
    <rect x="410" y="334" width="60" height="22" rx="3" fill="#ffffff" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <text x="440" y="349" text-anchor="middle" fill="#999">0</text>

    <!-- row 5 -->
    <rect x="60" y="356" width="80" height="22" rx="3" fill="#ffffff" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <text x="100" y="371" text-anchor="middle" fill="#333" font-weight="bold">5</text>
    <rect x="140" y="356" width="100" height="22" rx="3" fill="#ffffff" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <text x="190" y="371" text-anchor="middle" fill="#999">0</text>
    <rect x="240" y="356" width="70" height="22" rx="3" fill="#ffffff" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <text x="275" y="371" text-anchor="middle" fill="#333">1</text>
    <rect x="310" y="356" width="100" height="22" rx="3" fill="#ffffff" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <text x="360" y="371" text-anchor="middle" fill="#999">0</text>
    <rect x="410" y="356" width="60" height="22" rx="3" fill="#ffffff" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <text x="440" y="371" text-anchor="middle" fill="#333">1</text>

    <!-- row 10 -->
    <rect x="60" y="378" width="80" height="22" rx="3" fill="#ffffff" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <text x="100" y="393" text-anchor="middle" fill="#333" font-weight="bold">10</text>
    <rect x="140" y="378" width="100" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="190" y="393" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="240" y="378" width="70" height="22" rx="3" fill="#ffffff" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <text x="275" y="393" text-anchor="middle" fill="#999">0</text>
    <rect x="310" y="378" width="100" height="22" rx="3" fill="#ffffff" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <text x="360" y="393" text-anchor="middle" fill="#999">0</text>
    <rect x="410" y="378" width="60" height="22" rx="3" fill="#ffffff" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <text x="440" y="393" text-anchor="middle" fill="#999">0</text>
  </g>

  <!-- bottom note -->
  <rect x="40" y="418" width="520" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="300" y="435" text-anchor="middle" font-size="11" fill="#444">餐品用 set&lt;string&gt; 取字典序作列，桌号用 set&lt;int&gt; 取数值序作行</text>
  <text x="300" y="450" text-anchor="middle" font-size="11" fill="#444">嵌套哈希 cnt[t][f] 累计，缺失补 "0"，姓名全程丢弃</text>
</svg>
