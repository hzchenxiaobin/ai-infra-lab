<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：偶数用 n/2 条直径，奇数用 n 条半径</text>

  <!-- ====== n = 1 : plain circle, 0 cuts ====== -->
  <circle cx="54" cy="120" r="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="54" cy="120" r="3" fill="#446688" filter="url(#rough2)"/>
  <rect x="14" y="184" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="54" y="202" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">n=1 → 0</text>
  <text x="54" y="226" text-anchor="middle" font-size="9.5" fill="#888">整圆已 1 等分</text>

  <!-- ====== n = 2 : 1 diameter ====== -->
  <circle cx="162" cy="120" r="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="162" cy="120" r="3" fill="#446688" filter="url(#rough2)"/>
  <line x1="120" y1="120" x2="204" y2="120" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <rect x="122" y="184" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="162" y="202" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">n=2 → 1</text>
  <text x="162" y="226" text-anchor="middle" font-size="9.5" fill="#888">1 条直径</text>

  <!-- ====== n = 3 : 3 radii (120° apart) ====== -->
  <circle cx="270" cy="120" r="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="270" cy="120" r="3" fill="#d6a040" filter="url(#rough2)"/>
  <!-- up -->
  <line x1="270" y1="120" x2="270" y2="78" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <!-- down-left (210°) -->
  <line x1="270" y1="120" x2="234" y2="141" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <!-- down-right (330°) -->
  <line x1="270" y1="120" x2="306" y2="141" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <rect x="230" y="184" width="80" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="202" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">n=3 → 3</text>
  <text x="270" y="226" text-anchor="middle" font-size="9.5" fill="#888">3 条半径</text>

  <!-- ====== n = 4 : 2 perpendicular diameters ====== -->
  <circle cx="378" cy="120" r="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="378" cy="120" r="3" fill="#446688" filter="url(#rough2)"/>
  <line x1="336" y1="120" x2="420" y2="120" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <line x1="378" y1="78" x2="378" y2="162" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <rect x="338" y="184" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="378" y="202" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">n=4 → 2</text>
  <text x="378" y="226" text-anchor="middle" font-size="9.5" fill="#888">2 条直径</text>

  <!-- ====== n = 6 : 3 diameters (60° apart) ====== -->
  <circle cx="486" cy="120" r="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="486" cy="120" r="3" fill="#446688" filter="url(#rough2)"/>
  <!-- horizontal (0°) -->
  <line x1="444" y1="120" x2="528" y2="120" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <!-- 60° / 240° diameter -->
  <line x1="507" y1="84" x2="465" y2="156" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <!-- 120° / 300° diameter -->
  <line x1="465" y1="84" x2="507" y2="156" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <rect x="446" y="184" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="486" y="202" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">n=6 → 3</text>
  <text x="486" y="226" text-anchor="middle" font-size="9.5" fill="#888">3 条直径</text>

  <!-- footer note -->
  <rect x="40" y="262" width="460" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="270" y="284" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">规律：ans = (n == 1) ? 0 : (n 偶 ? n/2 : n)</text>
  <text x="270" y="306" text-anchor="middle" font-size="11" fill="#333">偶数 n：每条直径贡献 2 条分割线 → n/2 条直径</text>
  <text x="270" y="326" text-anchor="middle" font-size="11" fill="#333">奇数 n：分割线无法两两对径 → 全用半径，共 n 条</text>
</svg>
