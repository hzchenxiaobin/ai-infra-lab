<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">离线排序 + 并查集 算法流程</text>

  <!-- Step 1: sort edges -->
  <rect x="50" y="44" width="460" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="70" y="60" font-size="11" fill="#446688" font-weight="bold">①</text>
  <text x="280" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">边按长度升序排序</text>
  <text x="280" y="74" text-anchor="middle" font-size="10" fill="#666">sort(edgeList, by dis)</text>
  <line x1="280" y1="80" x2="280" y2="100" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: sort queries -->
  <rect x="50" y="100" width="460" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="70" y="116" font-size="11" fill="#4a7a3a" font-weight="bold">②</text>
  <text x="280" y="116" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">查询按 limit 升序排序（记录原下标 idx）</text>
  <text x="280" y="130" text-anchor="middle" font-size="10" fill="#666">sort(queries, by limit) → 保留原始位置</text>
  <line x1="280" y1="136" x2="280" y2="156" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: init UF -->
  <rect x="150" y="156" width="260" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="178" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ 初始化并查集 parent[i]=i，边指针 e=0</text>
  <line x1="280" y1="190" x2="280" y2="210" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: loop over sorted queries -->
  <rect x="80" y="210" width="400" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="232" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">④ 遍历排序后的每个查询 (p, q, limit)</text>
  <line x1="280" y1="244" x2="280" y2="264" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: add edges -->
  <rect x="60" y="264" width="440" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="80" y="282" font-size="11" fill="#446688" font-weight="bold">⑤</text>
  <text x="280" y="282" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">while e &lt; m and edgeList[e].dis &lt; limit:</text>
  <text x="280" y="298" text-anchor="middle" font-size="10.5" fill="#666">union(edge.u, edge.v);  e++   ← 增量加边</text>
  <line x1="280" y1="308" x2="280" y2="328" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 6: check connectivity -->
  <path d="M 280 328 L 420 360 L 280 392 L 140 360 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="358" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">find(p) == find(q) ?</text>
  <text x="280" y="374" text-anchor="middle" font-size="10" fill="#888">同根即连通</text>

  <!-- yes -->
  <text x="435" y="356" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <line x1="420" y1="360" x2="460" y2="360" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="460" y="346" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="500" y="366" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">ans=true</text>

  <!-- no -->
  <text x="100" y="356" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <line x1="140" y1="360" x2="100" y2="360" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="20" y="346" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="60" y="366" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">ans=false</text>

  <!-- back to loop -->
  <path d="M 280 392 Q 280 420 280 227" stroke="#888" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="418" font-size="10" fill="#888">下一个查询</text>

  <!-- Step 7: restore -->
  <rect x="80" y="430" width="400" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="280" y="447" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">⑥ ans[i] 写回原下标 → 返回原序结果</text>
</svg>
