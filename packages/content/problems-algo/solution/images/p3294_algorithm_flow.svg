<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrgr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：两阶段 —— 归位（walk prev）+ 采集（walk next）</text>

  <!-- 开始 -->
  <rect x="105" y="38" width="230" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="57" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">cur ← 给定节点；ans ← 空数组</text>

  <path d="M 220,68 L 220,84" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 1：是否还有前驱 -->
  <polygon points="220,88 318,124 220,160 122,124" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="129" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">cur.prev ≠ null ?</text>

  <text x="328" y="116" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M 318,124 L 354,124" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <!-- 归位动作 -->
  <rect x="358" y="104" width="150" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="433" y="121" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">cur ← cur.prev</text>
  <text x="433" y="137" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">向前一步（归位）</text>

  <!-- 回到判定 -->
  <path d="M 433,104 L 433,76 L 228,76" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="330" y="70" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">回到判定</text>

  <text x="230" y="176" font-size="11" fill="#888" filter="url(#rough2)">否</text>
  <path d="M 220,160 L 220,194" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 已归位 -->
  <rect x="105" y="198" width="230" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="217" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">cur 已是头节点（head）</text>

  <path d="M 220,228 L 220,244" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 2：是否还有节点 -->
  <polygon points="220,248 318,284 220,320 122,284" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="289" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">cur ≠ null ?</text>

  <text x="328" y="276" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 318,284 L 354,284" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrgr)" filter="url(#rough2)"/>

  <!-- 采集动作 -->
  <rect x="358" y="266" width="150" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="433" y="283" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">ans 追加 cur.val</text>
  <text x="433" y="299" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">cur ← cur.next</text>

  <!-- 回到判定 -->
  <path d="M 433,266 L 433,242 L 228,242" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="5 4" fill="none" marker-end="url(#arrgr)" filter="url(#rough2)"/>
  <text x="330" y="236" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">继续采集</text>

  <text x="230" y="336" font-size="11" fill="#888" filter="url(#rough2)">否</text>
  <path d="M 220,320 L 220,348" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 返回 -->
  <rect x="140" y="352" width="160" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="220" y="370" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 ans</text>
  <text x="220" y="385" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓ 从头到尾的完整序列</text>

  <!-- 底部注释 -->
  <rect x="60" y="404" width="400" height="28" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="260" y="422" text-anchor="middle" font-size="11" fill="#a06a10" filter="url(#rough2)">归位至多 n−1 步 + 采集 n 步：每个节点至多被访问 2 次 → 整体 O(n)</text>
</svg>
