<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：i=1, j=0 → 循环 j&lt;len → Push i → i==target[j]? → 保留/Pop → i++ → 返回</text>

  <!-- Start -->
  <ellipse cx="180" cy="54" rx="42" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="58" text-anchor="middle" font-size="12" fill="#333">开始</text>

  <path d="M 180 70 L 180 82" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box1: init -->
  <rect x="100" y="84" width="160" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="104" text-anchor="middle" font-size="11.5" fill="#333">res=[ ]; i=1; j=0</text>

  <path d="M 180 116 L 180 128" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: j < len(target) ? -->
  <polygon points="180,130 264,168 180,206 96,168" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="172" text-anchor="middle" font-size="11.5" fill="#333">j &lt; len(target) ?</text>

  <!-- No branch right -->
  <path d="M 264 168 L 306 168" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="162" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <!-- Box return res -->
  <rect x="306" y="152" width="120" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="366" y="172" text-anchor="middle" font-size="11.5" fill="#333">返回 res</text>

  <path d="M 366 184 L 366 196" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- End -->
  <ellipse cx="366" cy="214" rx="42" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="366" y="218" text-anchor="middle" font-size="12" fill="#333">结束</text>

  <!-- Yes branch down -->
  <path d="M 180 206 L 180 222" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="190" y="218" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Box2: Push i -->
  <rect x="92" y="224" width="176" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="244" text-anchor="middle" font-size="11.5" fill="#333">res.append("Push")</text>

  <path d="M 180 256 L 180 268" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: i == target[j] ? -->
  <polygon points="180,270 264,308 180,346 96,308" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="312" text-anchor="middle" font-size="11.5" fill="#333">i == target[j] ?</text>

  <!-- Yes (keep) branch left -->
  <path d="M 96 308 L 60 308 L 60 362" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="64" y="302" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="20" y="364" width="92" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="66" y="383" text-anchor="middle" font-size="11" fill="#333">j += 1（保留）</text>

  <!-- No (pop) branch right -->
  <path d="M 264 308 L 300 308 L 300 362" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="302" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="248" y="364" width="104" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="383" text-anchor="middle" font-size="11" fill="#333">res.append("Pop")</text>

  <!-- merge: both go to i += 1 -->
  <path d="M 66 394 L 66 410 L 180 410" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 300 394 L 300 410 L 180 410" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- Box i += 1 -->
  <rect x="130" y="402" width="100" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="420" text-anchor="middle" font-size="11.5" fill="#333">i += 1</text>

  <!-- loop back: i+=1 up to diamond j<len -->
  <path d="M 180 402 L 180 396 L 40 396 L 40 168 L 96 168" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="44" y="160" font-size="10.5" fill="#4a7a3a">回到判断</text>

  <!-- footer note -->
  <rect x="350" y="392" width="200" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="450" y="410" text-anchor="middle" font-size="10.5" fill="#555">循环执行 target[-1] 轮</text>
  <text x="450" y="424" text-anchor="middle" font-size="10" fill="#888">每轮 O(1) → 总 O(target[-1])</text>
  <text x="450" y="438" text-anchor="middle" font-size="10" fill="#888">集齐即停 → 操作最短</text>
</svg>
