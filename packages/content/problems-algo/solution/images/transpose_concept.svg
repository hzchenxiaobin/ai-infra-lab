<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arL" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="900" height="360" fill="#fafafa"/>

  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">转置 (Transpose)：行变列，列变行</text>
  <path d="M 300 44 Q 450 52 600 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 输入标注 -->
  <text x="190" y="86" text-anchor="middle" font-size="13" fill="#888">输入 file.txt（3 行 × 2 列）</text>

  <!-- 输入网格 3×2 -->
  <!-- 列1 蓝色 -->
  <g filter="url(#sk)">
    <rect x="80" y="100" width="120" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="80" y="152" width="120" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="80" y="204" width="120" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <!-- 列2 绿色 -->
  <g filter="url(#sk)">
    <rect x="200" y="100" width="120" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="200" y="152" width="120" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="200" y="204" width="120" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <!-- 输入文本 -->
  <text x="140" y="132" text-anchor="middle" font-size="13" fill="#2b6e9e">name</text>
  <text x="140" y="184" text-anchor="middle" font-size="13" fill="#2b6e9e">alice</text>
  <text x="140" y="236" text-anchor="middle" font-size="13" fill="#2b6e9e">ryan</text>
  <text x="260" y="132" text-anchor="middle" font-size="13" fill="#2e6e2e">age</text>
  <text x="260" y="184" text-anchor="middle" font-size="13" fill="#2e6e2e">21</text>
  <text x="260" y="236" text-anchor="middle" font-size="13" fill="#2e6e2e">30</text>

  <!-- 列标号 -->
  <text x="140" y="276" text-anchor="middle" font-size="11" fill="#2b6e9e">第 1 列</text>
  <text x="260" y="276" text-anchor="middle" font-size="11" fill="#2e6e2e">第 2 列</text>

  <!-- 转置箭头 -->
  <path d="M 330 178 Q 430 178 530 150" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="375" y="150" width="110" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="430" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">转置 T</text>
  <text x="430" y="200" text-anchor="middle" font-size="10" fill="#888">B[j][i] = A[i][j]</text>

  <!-- 输出标注 -->
  <text x="720" y="100" text-anchor="middle" font-size="13" fill="#888">输出（2 行 × 3 列）</text>

  <!-- 输出网格 2×3 -->
  <!-- 行1 蓝色（原列1） -->
  <g filter="url(#sk)">
    <rect x="560" y="112" width="120" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="680" y="112" width="120" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="800" y="112" width="80" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <!-- 行2 绿色（原列2） -->
  <g filter="url(#sk)">
    <rect x="560" y="160" width="120" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="680" y="160" width="120" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="800" y="160" width="80" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <!-- 输出文本 -->
  <text x="620" y="142" text-anchor="middle" font-size="13" fill="#2b6e9e">name</text>
  <text x="740" y="142" text-anchor="middle" font-size="13" fill="#2b6e9e">alice</text>
  <text x="840" y="142" text-anchor="middle" font-size="13" fill="#2b6e9e">ryan</text>
  <text x="620" y="190" text-anchor="middle" font-size="13" fill="#2e6e2e">age</text>
  <text x="740" y="190" text-anchor="middle" font-size="13" fill="#2e6e2e">21</text>
  <text x="840" y="190" text-anchor="middle" font-size="13" fill="#2e6e2e">30</text>

  <!-- 行标号 -->
  <text x="620" y="226" text-anchor="middle" font-size="11" fill="#2b6e9e">第 1 行 ← 原第 1 列</text>
  <text x="740" y="248" text-anchor="middle" font-size="11" fill="#2e6e2e">第 2 行 ← 原第 2 列</text>

  <!-- 底部说明 -->
  <g filter="url(#sk)">
    <rect x="560" y="268" width="320" height="60" rx="8" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="4 3"/>
  </g>
  <text x="720" y="290" text-anchor="middle" font-size="11" fill="#555">输入的第 i 行 → 输出的第 i 列</text>
  <text x="720" y="308" text-anchor="middle" font-size="11" fill="#555">输入的第 j 列 → 输出的第 j 行</text>
  <text x="720" y="322" text-anchor="middle" font-size="10" fill="#888">R×C 矩阵转置后变 C×R</text>
</svg>
