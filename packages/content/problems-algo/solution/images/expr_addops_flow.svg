<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    回溯流程：backtrack(pos, curVal, prevOperand, path)
  </text>

  <!-- Entry -->
  <rect x="210" y="42" width="180" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="63" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">进入 backtrack(pos, ...)</text>
  <path d="M300,74 L300,92" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: pos == n? -->
  <polygon points="300,96 380,128 300,160 220,128" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="124" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">pos == n ?</text>
  <text x="300" y="138" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">数字用尽</text>

  <!-- Yes branch: terminate -->
  <path d="M300,160 L300,182" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="176" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="210" y="184" width="180" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="200" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">若 curVal == target</text>
  <text x="300" y="216" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">→ 收集 path，return</text>

  <!-- No branch: loop -->
  <path d="M380,128 Q450,128 450,180 L450,236" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="408" y="122" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="350" y="238" width="200" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="450" y="255" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">for end = pos … n−1：</text>
  <text x="450" y="270" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">operand = operand×10 + 数字</text>

  <path d="M450,278 L450,296" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: pos == 0? -->
  <polygon points="450,300 520,328 450,356 380,328" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="450" y="324" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">pos == 0 ?</text>
  <text x="450" y="338" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">首段</text>

  <!-- pos==0 branch: first operand, no operator -->
  <path d="M380,328 L210,328" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="322" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="30" y="312" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="120" y="328" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">递归(end+1, operand,</text>
  <text x="120" y="342" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">operand, seg)</text>

  <!-- pos>0 branch: three operator branches -->
  <path d="M450,356 L450,372" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="460" y="368" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="300" y="374" width="84" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="342" y="388" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">+ 分支</text>
  <text x="342" y="398" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">val+op, +op</text>

  <rect x="390" y="374" width="84" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="432" y="388" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">− 分支</text>
  <text x="432" y="398" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">val−op, −op</text>

  <rect x="480" y="374" width="100" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="530" y="388" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">* 分支</text>
  <text x="530" y="398" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">val−prev+prev×op</text>

  <!-- leading zero prune note -->
  <rect x="30" y="374" width="200" height="40" fill="#fff" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="130" y="390" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">⚠ 前导零剪枝</text>
  <text x="130" y="405" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">if num[pos]=='0'：break</text>

  <text x="300" y="430" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">
    末尾 break：保证 '0' 单字符已探索，但禁止拼成 '05' 等前导零
  </text>
</svg>
