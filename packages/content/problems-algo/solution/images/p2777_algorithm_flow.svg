<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">生成器流程：while 循环 + yield</text>

  <!-- Start node -->
  <rect x="210" y="44" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="17" filter="url(#rough2)"/>
  <text x="260" y="65" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始</text>

  <!-- Init: current = start.getTime() -->
  <rect x="160" y="100" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="120" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">初始化</text>
  <text x="260" y="136" text-anchor="middle" font-size="10" fill="#555">current = start.getTime()</text>

  <!-- arrow start -> init -->
  <path d="M 260 78 L 260 98" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Diamond: current <= end? -->
  <polygon points="260,164 360,210 260,256 160,210" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="206" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">current</text>
  <text x="260" y="222" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">&le; end?</text>

  <!-- arrow init -> diamond -->
  <path d="M 260 144 L 260 162" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Yes branch: yield -->
  <rect x="60" y="190" width="80" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="100" y="207" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">yield</text>
  <text x="100" y="222" text-anchor="middle" font-size="9" fill="#888">当前日期</text>
  <!-- arrow diamond -> yield (left) -->
  <path d="M 160 210 L 142 210" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="150" y="200" text-anchor="middle" font-size="9" fill="#4a7a3a">是</text>

  <!-- Increment: current += step * DAY_MS -->
  <rect x="60" y="250" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="160" y="275" text-anchor="middle" font-size="10" fill="#555">current += step &times; 86400000 ms</text>
  <!-- arrow yield -> increment -->
  <path d="M 100 230 L 100 248" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Loop back arrow: increment -> diamond -->
  <path d="M 160 290 Q 220 300 260 280 L 260 258" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" stroke-dasharray="0" filter="url(#rough2)"/>
  <text x="225" y="310" text-anchor="middle" font-size="9" fill="#888">回到条件判断</text>

  <!-- No branch: return (done) -->
  <rect x="380" y="190" width="100" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="17" filter="url(#rough2)"/>
  <text x="430" y="207" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">生成结束</text>
  <text x="430" y="222" text-anchor="middle" font-size="9" fill="#888">return</text>
  <!-- arrow diamond -> done (right) -->
  <path d="M 360 210 L 378 210" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="370" y="200" text-anchor="middle" font-size="9" fill="#b85450">否</text>

  <!-- Bottom note -->
  <rect x="40" y="340" width="440" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="360" text-anchor="middle" font-size="11" fill="#555">关键点：用时间戳运算避免时区陷阱</text>
  <text x="260" y="376" text-anchor="middle" font-size="10" fill="#888">date-only 字符串按 UTC 解析，86400000 ms = 恰好 1 天</text>
</svg>
