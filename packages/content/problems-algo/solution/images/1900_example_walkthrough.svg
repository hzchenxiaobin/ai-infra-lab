<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    示例演算：n=11, firstPlayer=2, secondPlayer=4
  </text>

  <!-- ====== EARLIEST PATH (round 3) ====== -->
  <rect x="30" y="32" width="500" height="170" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="8" filter="url(#rough2)" opacity="0.3"/>
  <text x="280" y="48" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">
    最早路径 → 回合 3 相遇
  </text>

  <!-- R1: 11 players. Box: w=24,h=20,gap=3. Start x=133. -->
  <text x="55" y="68" font-size="9" fill="#888" filter="url(#rough2)">R1</text>
  <!-- players 1..11, special 2,4 green, 6 orange -->
  <rect x="133" y="58" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="145" y="72" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <rect x="160" y="58" width="24" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="172" y="72" text-anchor="middle" font-size="10" fill="#2a4a1a" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="187" y="58" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="199" y="72" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <rect x="214" y="58" width="24" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="226" y="72" text-anchor="middle" font-size="10" fill="#2a4a1a" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="241" y="58" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="253" y="72" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">5</text>
  <rect x="268" y="58" width="24" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="280" y="72" text-anchor="middle" font-size="10" fill="#5a4a1a" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="295" y="58" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="307" y="72" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">7</text>
  <rect x="322" y="58" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="334" y="72" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">8</text>
  <rect x="349" y="58" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="361" y="72" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">9</text>
  <rect x="376" y="58" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="388" y="72" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">10</text>
  <rect x="403" y="58" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="415" y="72" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">11</text>

  <!-- arrow + annotation R1→R2 -->
  <path d="M280,80 L280,92" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="91" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">11,2,3,4,5 胜; 6 轮空</text>

  <!-- R2: 6 players: 2,3,4,5,6,11. Start x=200. -->
  <text x="55" y="108" font-size="9" fill="#888" filter="url(#rough2)">R2</text>
  <rect x="200" y="98" width="24" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="212" y="112" text-anchor="middle" font-size="10" fill="#2a4a1a" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="227" y="98" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="239" y="112" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <rect x="254" y="98" width="24" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="266" y="112" text-anchor="middle" font-size="10" fill="#2a4a1a" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="281" y="98" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="293" y="112" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">5</text>
  <rect x="308" y="98" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="320" y="112" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">6</text>
  <rect x="335" y="98" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="347" y="112" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">11</text>

  <!-- arrow + annotation R2→R3 -->
  <path d="M280,120 L280,132" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="131" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">2,3,4 胜</text>

  <!-- R3: 3 players: 2,3,4. Start x=241. -->
  <text x="55" y="148" font-size="9" fill="#888" filter="url(#rough2)">R3</text>
  <rect x="241" y="138" width="24" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="253" y="152" text-anchor="middle" font-size="10" fill="#2a4a1a" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="268" y="138" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="280" y="152" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <rect x="295" y="138" width="24" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="307" y="152" text-anchor="middle" font-size="10" fill="#2a4a1a" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- meet marker -->
  <path d="M253,160 L307,160" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M307,160 L253,160" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="280" y="190" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">回合 3：2 ↔ 4 相遇！</text>

  <!-- ====== LATEST PATH (round 4) ====== -->
  <rect x="30" y="210" width="500" height="195" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="8" filter="url(#rough2)" opacity="0.3"/>
  <text x="280" y="226" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">
    最晚路径 → 回合 4 相遇
  </text>

  <!-- R1: 11 players (same layout) -->
  <text x="55" y="246" font-size="9" fill="#888" filter="url(#rough2)">R1</text>
  <rect x="133" y="236" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="145" y="250" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <rect x="160" y="236" width="24" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="172" y="250" text-anchor="middle" font-size="10" fill="#2a4a1a" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="187" y="236" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="199" y="250" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <rect x="214" y="236" width="24" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="226" y="250" text-anchor="middle" font-size="10" fill="#2a4a1a" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="241" y="236" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="253" y="250" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">5</text>
  <rect x="268" y="236" width="24" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="280" y="250" text-anchor="middle" font-size="10" fill="#5a4a1a" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="295" y="236" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="307" y="250" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">7</text>
  <rect x="322" y="236" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="334" y="250" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">8</text>
  <rect x="349" y="236" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="361" y="250" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">9</text>
  <rect x="376" y="236" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="388" y="250" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">10</text>
  <rect x="403" y="236" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="415" y="250" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">11</text>

  <!-- arrow + annotation R1→R2 -->
  <path d="M280,258 L280,270" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="269" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">1,2,3,4,5 胜; 6 轮空</text>

  <!-- R2: 6 players: 1,2,3,4,5,6. Start x=200. -->
  <text x="55" y="286" font-size="9" fill="#888" filter="url(#rough2)">R2</text>
  <rect x="200" y="276" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="212" y="290" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <rect x="227" y="276" width="24" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="239" y="290" text-anchor="middle" font-size="10" fill="#2a4a1a" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="254" y="276" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="266" y="290" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <rect x="281" y="276" width="24" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="293" y="290" text-anchor="middle" font-size="10" fill="#2a4a1a" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="308" y="276" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="320" y="290" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">5</text>
  <rect x="335" y="276" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="347" y="290" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">6</text>

  <!-- arrow + annotation R2→R3 -->
  <path d="M280,298 L280,310" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="309" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">1,2 胜; 4 胜(淘汰3)</text>

  <!-- R3: 3 players: 1,2,4. Start x=241. -->
  <text x="55" y="326" font-size="9" fill="#888" filter="url(#rough2)">R3</text>
  <rect x="241" y="316" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="253" y="330" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <rect x="268" y="316" width="24" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="280" y="330" text-anchor="middle" font-size="10" fill="#2a4a1a" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="295" y="316" width="24" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="307" y="330" text-anchor="middle" font-size="10" fill="#2a4a1a" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- arrow + annotation R3→R4 -->
  <path d="M280,338 L280,350" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="349" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">4 胜(淘汰1); 2 轮空</text>

  <!-- R4: 2 players: 2,4. Start x=254. -->
  <text x="55" y="366" font-size="9" fill="#888" filter="url(#rough2)">R4</text>
  <rect x="254" y="356" width="24" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="266" y="370" text-anchor="middle" font-size="10" fill="#2a4a1a" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="281" y="356" width="24" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="293" y="370" text-anchor="middle" font-size="10" fill="#2a4a1a" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- meet marker -->
  <path d="M266,378 L293,378" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M293,378 L266,378" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="280" y="400" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">回合 4：2 ↔ 4 相遇！</text>
</svg>
