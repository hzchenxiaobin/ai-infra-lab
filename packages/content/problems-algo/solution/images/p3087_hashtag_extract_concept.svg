<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 392" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="392" fill="#fafafa"/>

  <text x="290" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：hashtag = 最后一个 '#' 右侧的第一个单词</text>
  <text x="290" y="40" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">推文 14「Another #HappyDay with good vibes!」—— 标签恰好在句中，一刀切不干净</text>

  <rect x="102" y="56" width="86" height="34" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="145" y="78" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">Another</text>
  <rect x="188" y="56" width="30" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="203" y="78" text-anchor="middle" font-size="12" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">#</text>
  <rect x="218" y="56" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="268" y="78" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">HappyDay</text>
  <rect x="318" y="56" width="160" height="34" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="398" y="78" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">with good vibes!</text>

  <text x="145" y="104" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">前缀（无关）</text>
  <text x="203" y="104" text-anchor="middle" font-size="9" fill="#8a6d1a" filter="url(#rough2)">分隔符</text>
  <text x="268" y="104" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">标签本体 ★</text>
  <text x="398" y="104" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">尾巴（要截掉）</text>

  <rect x="40" y="120" width="245" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="162" y="142" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">第一刀：SUBSTRING_INDEX(tweet, '#', -1)</text>
  <text x="162" y="161" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">→ 'HappyDay with good vibes!'（最后一个 # 右侧全部）</text>

  <path d="M 288 149 L 305 149" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="310" y="120" width="230" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="425" y="142" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">第二刀：SUBSTRING_INDEX(↑, ' ', 1)</text>
  <text x="425" y="161" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">→ 'HappyDay'（第一个空格左侧）</text>

  <rect x="40" y="190" width="500" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="209" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">拼回分隔符：CONCAT('#', 第二刀结果) → '#HappyDay' ★</text>
  <text x="290" y="227" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">'#' 在第一刀里被切掉，统计前记得拼回去</text>

  <rect x="40" y="248" width="500" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="290" y="268" text-anchor="middle" font-size="10" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">⚠️ 为什么必须两刀？—— 标签不一定在句尾！</text>
  <text x="290" y="284" text-anchor="middle" font-size="9" fill="#8a6d1a" filter="url(#rough2)">推文 14 的 #HappyDay 后面还跟着半句话，只切第一刀会把</text>
  <text x="290" y="300" text-anchor="middle" font-size="9" fill="#8a6d1a" filter="url(#rough2)">'HappyDay with good vibes!' 整串当成标签名，分组结果直接错；</text>
  <text x="290" y="316" text-anchor="middle" font-size="9" fill="#8a6d1a" filter="url(#rough2)">第二刀按空格收口，正好把尾巴截掉</text>

  <rect x="40" y="334" width="500" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="290" y="354" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">💡 为什么取「最后一个 #」（-1）？MySQL 没有直接的「第一个 # 右侧」写法</text>
  <text x="290" y="370" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">（正数 k 是左侧）；负数索引一步到位，题目保证只有一个 #，两种取法等价且「最后一个」更鲁棒</text>
</svg>
