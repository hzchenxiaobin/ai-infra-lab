<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1：反图 Kahn 剥出度演算</text>
  <text x="280" y="40" text-anchor="middle" font-size="10" fill="#888">outdeg = [2,2,1,1,1,0,0]，radj[5]={2,4} radj[2]={0,1}</text>

  <!-- Table outline -->
  <rect x="10" y="52" width="540" height="180" fill="none" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- Column dividers -->
  <line x1="50" y1="52" x2="50" y2="232" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="100" y1="52" x2="100" y2="232" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="180" y1="52" x2="180" y2="232" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="340" y1="52" x2="340" y2="232" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="440" y1="52" x2="440" y2="232" stroke="#888" stroke-width="1" filter="url(#rough2)"/>

  <!-- Header row separator -->
  <line x1="10" y1="78" x2="550" y2="78" stroke="#666" stroke-width="1.3" filter="url(#rough2)"/>

  <!-- Headers -->
  <text x="30" y="71" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">步骤</text>
  <text x="75" y="71" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">取u</text>
  <text x="140" y="71" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">radj[u]</text>
  <text x="260" y="71" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">outdeg 变化</text>
  <text x="390" y="71" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">队列</text>
  <text x="495" y="71" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">已确认安全</text>

  <!-- Row separators -->
  <line x1="10" y1="106" x2="550" y2="106" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="10" y1="134" x2="550" y2="134" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="10" y1="162" x2="550" y2="162" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="10" y1="190" x2="550" y2="190" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Row: 初始 (y center ~92) -->
  <text x="30" y="96" text-anchor="middle" font-size="10" fill="#333">初始</text>
  <text x="75" y="96" text-anchor="middle" font-size="10" fill="#888">—</text>
  <text x="140" y="96" text-anchor="middle" font-size="10" fill="#888">—</text>
  <text x="260" y="96" text-anchor="middle" font-size="9" fill="#555">0:2 1:2 2:1 3:1 4:1 5:0 6:0</text>
  <text x="390" y="96" text-anchor="middle" font-size="10" fill="#333">[5,6]</text>
  <text x="495" y="96" text-anchor="middle" font-size="10" fill="#888">{}</text>

  <!-- Row 1: pop 5 (y ~120) -->
  <text x="30" y="124" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="75" y="124" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">5</text>
  <text x="140" y="124" text-anchor="middle" font-size="10" fill="#333">2, 4</text>
  <text x="260" y="124" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">2:0✓ 4:0✓</text>
  <text x="390" y="124" text-anchor="middle" font-size="10" fill="#333">[6,2,4]</text>
  <text x="495" y="124" text-anchor="middle" font-size="10" fill="#4a7a3a">{5}</text>

  <!-- Row 2: pop 6 (y ~148) -->
  <text x="30" y="152" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="75" y="152" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">6</text>
  <text x="140" y="152" text-anchor="middle" font-size="10" fill="#888">—</text>
  <text x="260" y="152" text-anchor="middle" font-size="10" fill="#888">—</text>
  <text x="390" y="152" text-anchor="middle" font-size="10" fill="#333">[2,4]</text>
  <text x="495" y="152" text-anchor="middle" font-size="10" fill="#4a7a3a">{5,6}</text>

  <!-- Row 3: pop 2 (y ~176) -->
  <text x="30" y="180" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="75" y="180" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="140" y="180" text-anchor="middle" font-size="10" fill="#333">0, 1</text>
  <text x="260" y="180" text-anchor="middle" font-size="10" fill="#555">0:1 1:1</text>
  <text x="390" y="180" text-anchor="middle" font-size="10" fill="#333">[4]</text>
  <text x="495" y="180" text-anchor="middle" font-size="10" fill="#4a7a3a">{5,6,2}</text>

  <!-- Row 4: pop 4 (y ~204) -->
  <text x="30" y="208" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="75" y="208" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="140" y="208" text-anchor="middle" font-size="10" fill="#888">—</text>
  <text x="260" y="208" text-anchor="middle" font-size="10" fill="#888">—</text>
  <text x="390" y="208" text-anchor="middle" font-size="10" fill="#888">[]</text>
  <text x="495" y="208" text-anchor="middle" font-size="10" fill="#4a7a3a">{5,6,2,4}</text>

  <!-- Bottom note -->
  <rect x="20" y="248" width="520" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="266" text-anchor="middle" font-size="11" fill="#444">队列空 → 安全集 = {2,4,5,6}，升序返回 [2,4,5,6]</text>
  <text x="280" y="280" text-anchor="middle" font-size="10" fill="#b85450">0,1,3 出度仍为 1（环 0→1→3→0），永远降不到 0 → 不安全</text>

  <text x="280" y="312" text-anchor="middle" font-size="10" fill="#888">绿色=安全节点 · 红色=出度归零的关键变化 · 灰色=无变化</text>
</svg>
