<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：从高位到低位逐位贪心取最大 —— 只有小时两位互相耦合</text>

  <!-- red dashed group around hour digits -->
  <rect x="86" y="44" width="116" height="88" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" rx="10" filter="url(#rough2)"/>
  <text x="144" y="148" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">互相耦合</text>

  <!-- green dashed group around minute digits -->
  <rect x="278" y="44" width="116" height="88" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="6 4" rx="10" filter="url(#rough2)"/>
  <text x="336" y="148" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">彼此独立</text>

  <!-- five position boxes -->
  <rect x="96" y="54" width="44" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="118" y="90" text-anchor="middle" font-size="22" fill="#446688" font-weight="bold" filter="url(#rough2)">?</text>

  <rect x="148" y="54" width="44" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="170" y="90" text-anchor="middle" font-size="22" fill="#446688" font-weight="bold" filter="url(#rough2)">?</text>

  <rect x="212" y="54" width="30" height="58" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="227" y="90" text-anchor="middle" font-size="22" fill="#888" font-weight="bold" filter="url(#rough2)">:</text>

  <rect x="288" y="54" width="44" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="310" y="90" text-anchor="middle" font-size="22" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">?</text>

  <rect x="340" y="54" width="44" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="362" y="90" text-anchor="middle" font-size="22" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">?</text>

  <!-- position captions -->
  <text x="118" y="122" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">s[0] 时十位</text>
  <text x="170" y="122" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">s[1] 时个位</text>
  <text x="310" y="122" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">s[3] 分十位</text>
  <text x="362" y="122" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">s[4] 分个位</text>

  <!-- arrows from hour group to 档 boxes -->
  <path d="M 120 136 L 108 172" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 168 136 L 240 172" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- 档 boxes -->
  <rect x="52" y="178" width="130" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="117" y="200" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1 档：10 ~ 11</text>
  <text x="117" y="218" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">个位只能 0 / 1</text>
  <text x="117" y="234" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">最优 11 ← 更晚，优先冲</text>

  <rect x="220" y="178" width="130" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="285" y="200" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">0 档：00 ~ 09</text>
  <text x="285" y="218" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">个位自由 0 ~ 9</text>
  <text x="285" y="234" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">最优 09（退而求其次）</text>

  <!-- minute arrow -->
  <path d="M 336 138 L 336 254" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)" stroke-dasharray="5 4"/>

  <rect x="372" y="188" width="136" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="440" y="208" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">分钟与小时无耦合</text>
  <text x="440" y="226" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">十位 '?' → '5'</text>
  <text x="440" y="237" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">个位 '?' → '9'，永凑 59</text>

  <!-- hour fill rules -->
  <rect x="40" y="262" width="228" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="154" y="282" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">时十位 '?'：</text>
  <text x="154" y="298" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">个位为 '?' 或 ≤1 → 填 '1'（冲 1 档）</text>
  <text x="154" y="310" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">个位 ≥2 → 只能填 '0'（退 0 档）</text>

  <rect x="284" y="262" width="228" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="398" y="282" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">时个位 '?'：</text>
  <text x="398" y="298" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">十位 '0' → 填 '9'（凑 09）</text>
  <text x="398" y="310" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">十位 '1' → 填 '1'（凑 11）</text>

  <!-- ordering note -->
  <rect x="40" y="326" width="472" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="276" y="347" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">处理顺序：先时十位（定档）→ 再时个位（看已定十位）→ 分钟两位随意</text>

  <!-- bottom insight -->
  <rect x="40" y="372" width="472" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="276" y="393" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">定长零填充 + ':' 固定 → 字典序最大 ⇔ 时间最晚</text>
  <text x="276" y="412" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">高位优先贪心成立；固定字符只是「约束已钦定」，贪心在剩余自由度里取最大</text>
</svg>
