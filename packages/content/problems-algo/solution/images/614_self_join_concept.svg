<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">自连接拼接二级关注链：f1.follower = f2.followee</text>

  <!-- Top: follow graph chain X <- Y <- Z -->
  <text x="280" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">关注链：X ← Y ← Z（Y 关注 X，Z 关注 Y → Z 是 X 的二级关注者）</text>

  <!-- node X -->
  <ellipse cx="110" cy="100" rx="26" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="110" y="105" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">X</text>
  <text x="110" y="138" text-anchor="middle" font-size="9" fill="#446688">被关注者</text>
  <text x="110" y="150" text-anchor="middle" font-size="9" fill="#446688">f1.followee</text>

  <!-- node Y -->
  <ellipse cx="280" cy="100" rx="26" ry="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="280" y="105" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">Y</text>
  <text x="280" y="138" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">中间人（桥接）</text>
  <text x="280" y="150" text-anchor="middle" font-size="9" fill="#d6a040">f1.follower = f2.followee</text>

  <!-- node Z -->
  <ellipse cx="450" cy="100" rx="26" ry="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="450" y="105" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">Z</text>
  <text x="450" y="138" text-anchor="middle" font-size="9" fill="#b85450">二级关注者</text>
  <text x="450" y="150" text-anchor="middle" font-size="9" fill="#b85450">f2.follower</text>

  <!-- arrow Y -> X (Y follows X): follows direction -->
  <path d="M254 100 L138 100" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="196" y="92" text-anchor="middle" font-size="9" fill="#4a7a3a">关注</text>

  <!-- arrow Z -> Y (Z follows Y) -->
  <path d="M424 100 L308 100" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="366" y="92" text-anchor="middle" font-size="9" fill="#4a7a3a">关注</text>

  <!-- dashed bridge: X <- Z (second degree) -->
  <path d="M440 122 C 380 180, 180 180, 120 122" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5,4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="280" y="186" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">二级关注（跨两跳）</text>

  <!-- Bottom: two table copies with JOIN -->
  <!-- f1 table (left) -->
  <text x="100" y="222" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Follow f1</text>
  <rect x="40" y="228" width="120" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="243" font-size="9.5" fill="#446688" font-weight="bold">followee</text>
  <text x="125" y="243" font-size="9.5" fill="#d6a040" font-weight="bold">follower</text>
  <line x1="90" y1="228" x2="90" y2="250" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="40" y="250" width="120" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="264" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">X</text>
  <text x="125" y="264" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">Y</text>
  <line x1="90" y1="250" x2="90" y2="270" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- f2 table (right) -->
  <text x="400" y="222" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Follow f2</text>
  <rect x="340" y="228" width="120" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="243" font-size="9.5" fill="#d6a040" font-weight="bold">followee</text>
  <text x="425" y="243" font-size="9.5" fill="#b85450" font-weight="bold">follower</text>
  <line x1="390" y1="228" x2="390" y2="250" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="340" y="250" width="120" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="370" y="264" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">Y</text>
  <text x="425" y="264" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">Z</text>
  <line x1="390" y1="250" x2="390" y2="270" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- JOIN condition: highlight f1.follower (Y) = f2.followee (Y) -->
  <rect x="155" y="250" width="20" height="20" fill="none" stroke="#d6a040" stroke-width="2.2" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <rect x="365" y="250" width="20" height="20" fill="none" stroke="#d6a040" stroke-width="2.2" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>

  <path d="M175 260 L365 260" stroke="#d6a040" stroke-width="2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="270" y="254" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">JOIN ON f1.follower = f2.followee</text>

  <!-- result row -->
  <text x="280" y="300" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">拼接结果（一行）</text>
  <rect x="180" y="306" width="200" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="215" y="321" font-size="9.5" fill="#446688" font-weight="bold">followee</text>
  <text x="345" y="321" font-size="9.5" fill="#b85450" font-weight="bold">follower</text>
  <line x1="280" y1="306" x2="280" y2="328" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="180" y="328" width="200" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="230" y="342" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">X</text>
  <text x="330" y="342" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">Z</text>
  <line x1="280" y1="328" x2="280" y2="348" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- arrows from f1.followee and f2.follower into result -->
  <path d="M70 270 C 70 295, 230 295, 230 328" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M425 270 C 425 295, 330 295, 330 328" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- bottom note -->
  <rect x="30" y="362" width="500" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="50" y="381" font-size="10" fill="#333">核心：Y 既是 f1 的 <tspan fill="#d6a040" font-weight="bold">follower</tspan> 又是 f2 的 <tspan fill="#d6a040" font-weight="bold">followee</tspan> → 自连接把两跳拼成 (X, Z)</text>
</svg>
