<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：分组 → 三并联聚合 → HAVING 双闸门 → 双键排序</text>

  <rect x="120" y="36" width="200" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="220" y="54" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">① FROM cities（15 行）</text>

  <path d="M 220 64 L 220 76" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="78" width="200" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="220" y="96" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">② GROUP BY state（→ 4 组）</text>

  <path d="M 220 106 L 220 118" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="96" y="120" width="248" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="220" y="137" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">③ 三并联聚合（一趟扫描）</text>
  <text x="220" y="152" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">GROUP_CONCAT(city ORDER BY city SEPARATOR ', ')</text>
  <text x="220" y="165" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">COUNT(*)　＋　SUM(LEFT(city,1) = LEFT(state,1))</text>

  <path d="M 220 172 L 220 184" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="220,186 322,222 220,258 118,222" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="220" y="215" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">④ HAVING</text>
  <text x="220" y="229" text-anchor="middle" font-size="8.5" fill="#444" filter="url(#rough2)">COUNT(*) ≥ 3 且 匹配数 ≥ 1 ?</text>

  <path d="M 322 222 L 372 222" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="335" y="214" font-size="8.5" fill="#b85450" filter="url(#rough2)">✗</text>

  <rect x="376" y="196" width="168" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="460" y="213" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">California 被拦下</text>
  <text x="460" y="227" text-anchor="middle" font-size="8.5" fill="#8a3030" filter="url(#rough2)">4 ≥ 3 ✓ 但匹配数 0 ✗</text>
  <text x="460" y="240" text-anchor="middle" font-size="8.5" fill="#8a3030" filter="url(#rough2)">（没有任何 'C' 开头的城市）</text>

  <path d="M 220 258 L 220 270" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="232" y="268" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">✓ 3 组幸存</text>

  <rect x="96" y="272" width="248" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="220" y="291" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">⑤ ORDER BY count DESC, state ASC</text>

  <path d="M 220 302 L 220 314" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="96" y="316" width="248" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="220" y="333" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⑥ 输出（3 行）</text>
  <text x="120" y="349" font-size="8.5" fill="#333" filter="url(#rough2)">Pennsylvania · 3</text>
  <text x="120" y="362" font-size="8.5" fill="#333" filter="url(#rough2)">Texas　　　　 · 3</text>
  <text x="120" y="375" font-size="8.5" fill="#333" filter="url(#rough2)">New York　　 · 2</text>
  <text x="286" y="349" font-size="8.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">← 平局！</text>
  <text x="286" y="362" font-size="8.5" fill="#b85450" filter="url(#rough2)">P &lt; T 按州名</text>
  <text x="286" y="375" font-size="8.5" fill="#b85450" filter="url(#rough2)">升序分先后</text>

  <rect x="376" y="272" width="168" height="40" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="5,4" rx="8" filter="url(#rough2)"/>
  <text x="460" y="288" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">⚠ 过滤的是「组」不是「行」</text>
  <text x="460" y="302" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">WHERE 阶段聚合尚不存在</text>
</svg>
