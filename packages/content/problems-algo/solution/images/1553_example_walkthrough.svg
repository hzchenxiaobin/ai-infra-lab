<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 10，预期 4 天</text>

  <!-- tree nodes -->
  <!-- f(10) root -->
  <ellipse cx="310" cy="56" rx="42" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="310" y="62" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">f(10)=4</text>

  <!-- edges from 10 -->
  <path d="M 278 66 Q 220 90 180 110" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 342 66 Q 400 90 440 110" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <rect x="186" y="78" width="72" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.6" rx="3" filter="url(#rough2)"/>
  <text x="222" y="90" text-anchor="middle" font-size="9.5" fill="#4a7a3a">÷2: 0+1=1</text>
  <rect x="362" y="78" width="72" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="0.6" rx="3" filter="url(#rough2)"/>
  <text x="398" y="90" text-anchor="middle" font-size="9.5" fill="#b85450">÷3: 1+1=2</text>

  <!-- f(5) and f(3) -->
  <ellipse cx="180" cy="120" rx="38" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="125" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">f(5)=4</text>
  <ellipse cx="440" cy="120" rx="38" ry="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="440" y="125" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">f(3)=2</text>

  <!-- edges from 5 -->
  <path d="M 152 132 Q 120 150 100 170" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 208 132 Q 230 150 240 170" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <rect x="96" y="148" width="64" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.5" rx="3" filter="url(#rough2)"/>
  <text x="128" y="159" text-anchor="middle" font-size="9" fill="#4a7a3a">÷2: 1+1=2</text>
  <rect x="210" y="148" width="64" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="0.5" rx="3" filter="url(#rough2)"/>
  <text x="242" y="159" text-anchor="middle" font-size="9" fill="#b85450">÷3: 2+1=3</text>

  <!-- edges from 3 -->
  <path d="M 412 132 Q 390 150 380 170" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 468 132 Q 490 150 500 170" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <rect x="346" y="148" width="64" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.5" rx="3" filter="url(#rough2)"/>
  <text x="378" y="159" text-anchor="middle" font-size="9" fill="#4a7a3a">÷2: 1+1=2</text>
  <rect x="460" y="148" width="64" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="0.5" rx="3" filter="url(#rough2)"/>
  <text x="492" y="159" text-anchor="middle" font-size="9" fill="#b85450">÷3: 0+1=1</text>

  <!-- f(2), f(1) children of 5 -->
  <ellipse cx="100" cy="180" rx="34" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="100" y="184" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">f(2)=2</text>
  <ellipse cx="240" cy="180" rx="34" ry="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="184" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">f(1)=1</text>

  <!-- f(1) children of 3 -->
  <ellipse cx="380" cy="180" rx="34" ry="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="184" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">f(1)=1</text>
  <ellipse cx="500" cy="180" rx="34" ry="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="500" y="184" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">f(1)=1</text>

  <!-- edge from 2 to 1 -->
  <path d="M 100 198 L 100 228" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="108" y="206" width="56" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.5" rx="3" filter="url(#rough2)"/>
  <text x="136" y="217" text-anchor="middle" font-size="9" fill="#4a7a3a">÷2: 0+1=1</text>
  <ellipse cx="100" cy="240" rx="30" ry="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="100" y="244" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">f(1)=1</text>

  <!-- summary table -->
  <rect x="30" y="270" width="560" height="26" fill="#446688" rx="4" filter="url(#rough2)"/>
  <text x="70" y="288" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">n</text>
  <text x="140" y="288" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">÷2 代价</text>
  <text x="250" y="288" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">÷3 代价</text>
  <text x="360" y="288" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">min 选取</text>
  <text x="510" y="288" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">f(n)</text>

  <g font-size="10.5" fill="#333" filter="url(#rough2)">
    <rect x="30" y="296" width="560" height="22" fill="#ffffff" stroke="#ddd" stroke-width="0.8"/>
    <text x="70" y="311" text-anchor="middle">10</text>
    <text x="140" y="311" text-anchor="middle" fill="#4a7a3a">0+1+f(5)=1+4</text>
    <text x="250" y="311" text-anchor="middle" fill="#b85450" font-weight="bold">1+1+f(3)=2+2</text>
    <text x="360" y="311" text-anchor="middle" fill="#b85450">÷3 分支</text>
    <text x="510" y="311" text-anchor="middle" font-weight="bold">4</text>

    <rect x="30" y="318" width="560" height="22" fill="#f7f7f7" stroke="#ddd" stroke-width="0.8"/>
    <text x="70" y="333" text-anchor="middle">5</text>
    <text x="140" y="333" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1+1+f(2)=2+2</text>
    <text x="250" y="333" text-anchor="middle" fill="#b85450">2+1+f(1)=3+1</text>
    <text x="360" y="333" text-anchor="middle" fill="#444">两者并列</text>
    <text x="510" y="333" text-anchor="middle" font-weight="bold">4</text>

    <rect x="30" y="340" width="560" height="22" fill="#ffffff" stroke="#ddd" stroke-width="0.8"/>
    <text x="70" y="355" text-anchor="middle">3</text>
    <text x="140" y="355" text-anchor="middle" fill="#4a7a3a">1+1+f(1)=3</text>
    <text x="250" y="355" text-anchor="middle" fill="#b85450" font-weight="bold">0+1+f(1)=2</text>
    <text x="360" y="355" text-anchor="middle" fill="#b85450">÷3 分支</text>
    <text x="510" y="355" text-anchor="middle" font-weight="bold">2</text>

    <rect x="30" y="362" width="560" height="22" fill="#f7f7f7" stroke="#ddd" stroke-width="0.8"/>
    <text x="70" y="377" text-anchor="middle">2</text>
    <text x="140" y="377" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0+1+f(1)=2</text>
    <text x="250" y="377" text-anchor="middle" fill="#aaa">—</text>
    <text x="360" y="377" text-anchor="middle" fill="#4a7a3a">÷2 分支</text>
    <text x="510" y="377" text-anchor="middle" font-weight="bold">2</text>

    <rect x="30" y="384" width="560" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <text x="70" y="399" text-anchor="middle" font-weight="bold">1</text>
    <text x="140" y="399" text-anchor="middle" fill="#aaa">—</text>
    <text x="250" y="399" text-anchor="middle" fill="#aaa">—</text>
    <text x="360" y="399" text-anchor="middle" fill="#d6a040">边界</text>
    <text x="510" y="399" text-anchor="middle" font-weight="bold">1</text>
  </g>

  <!-- conclusion -->
  <rect x="40" y="416" width="540" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="438" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">f(10) = min(10, 1+f(5), 2+f(3)) = min(10, 5, 4) = 4 ✓</text>
</svg>
