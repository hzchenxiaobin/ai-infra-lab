<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：word = "abacaba"（n = 7），k = 3</text>

  <!-- word strip -->
  <text x="40" y="70" font-size="11.5" fill="#888" filter="url(#rough2)">word =</text>

  <rect x="100" y="48" width="44" height="32" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122" y="69" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="144" y="48" width="44" height="32" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="166" y="69" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <rect x="188" y="48" width="44" height="32" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="69" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="232" y="48" width="44" height="32" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="254" y="69" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>
  <rect x="276" y="48" width="44" height="32" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="298" y="69" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="320" y="48" width="44" height="32" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="342" y="69" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <rect x="364" y="48" width="44" height="32" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="386" y="69" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>

  <text x="122" y="94" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="166" y="94" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="210" y="94" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="254" y="94" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>
  <text x="298" y="94" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">4</text>
  <text x="342" y="94" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">5</text>
  <text x="386" y="94" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">6</text>

  <!-- z strip -->
  <text x="46" y="142" font-size="11.5" fill="#888" filter="url(#rough2)">z[i] =</text>

  <rect x="100" y="120" width="44" height="30" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122" y="140" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <rect x="144" y="120" width="44" height="30" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="166" y="140" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="188" y="120" width="44" height="30" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="140" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="232" y="120" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="254" y="140" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="276" y="120" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="298" y="140" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="320" y="120" width="44" height="30" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="342" y="140" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="364" y="120" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="386" y="140" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="280" y="172" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">z[i]：word 与 word[i:] 的最长公共前缀长度（z[0] 约定为 n）</text>

  <!-- check 1 -->
  <rect x="50" y="186" width="460" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="210" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">t = 1 → i = 3：word[3:] = "caba" 想当 word 的前缀，可前 4 个字符是 "abac"</text>
  <text x="280" y="230" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">z[3] = 0 &lt; n − i = 4 → ✗（1 秒回不去）</text>

  <!-- check 2 -->
  <rect x="50" y="254" width="460" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="278" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">t = 2 → i = 6：word[6:] = "a"，word 的前 1 个字符恰是 "a"</text>
  <text x="280" y="298" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">z[6] = 1 ≥ n − i = 1 → ✓ 返回 2（尾部 6 个任意字符抄 word 尾部）</text>

  <!-- note 1 -->
  <rect x="50" y="322" width="460" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="347" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">若 k = 4：t = 1 → i = 4，z[4] = 3 ≥ 3 → 返回 1（示例 2）</text>

  <!-- note 2 -->
  <rect x="50" y="370" width="460" height="40" fill="#fafafa" stroke="#999" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="395" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">"abcbabcd"、k = 2：z[2]、z[4]、z[6] 均不达标 → 返回 ⌈8/2⌉ = 4（示例 3，删光重建）</text>
</svg>
