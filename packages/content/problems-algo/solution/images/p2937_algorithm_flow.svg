<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">一趟扫描求 LCP 长度 L，再套公式</text>

  <!-- start -->
  <rect x="196" y="42" width="128" height="36" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="65" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">i = 0（L 计数器）</text>
  <path d="M 260 78 L 260 96" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond 1 -->
  <path d="M 260 100 L 415 156 L 260 212 L 105 156 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="150" text-anchor="middle" font-size="11.5" fill="#7a5a10" filter="url(#rough2)">i &lt; n1 且 i &lt; n2 且 i &lt; n3</text>
  <text x="260" y="170" text-anchor="middle" font-size="11.5" fill="#7a5a10" filter="url(#rough2)">且 s1[i] = s2[i] = s3[i] ?</text>

  <!-- yes branch: i++ and loop back -->
  <text x="424" y="146" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 419 156 L 434 156" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="438" y="140" width="64" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="470" y="161" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">i++</text>
  <path d="M 470 140 L 470 90 L 272 90" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="370" y="84" font-size="10" fill="#4a7a3a" filter="url(#rough2)">回到判断（while 循环）</text>

  <!-- no branch -->
  <text x="270" y="230" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 260 212 L 260 238" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="278" y="232" font-size="10" fill="#888" filter="url(#rough2)">此时 i = L</text>

  <!-- diamond 2 -->
  <path d="M 260 242 L 332 280 L 260 318 L 188 280 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="286" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">i == 0 ?</text>

  <!-- yes: return -1 -->
  <text x="180" y="270" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 188 280 L 168 280" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="34" y="258" width="132" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="100" y="276" text-anchor="middle" font-size="12.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">return −1</text>
  <text x="100" y="293" text-anchor="middle" font-size="9.5" fill="#8f3a36" filter="url(#rough2)">首字符互异，永不能相等</text>

  <!-- no: return answer -->
  <text x="340" y="270" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 332 280 L 352 280" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="356" y="258" width="150" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="431" y="276" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">return n1+n2+n3 − 3i</text>
  <text x="431" y="293" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">i 即 LCP 长度 L</text>

  <!-- bottom note -->
  <rect x="60" y="338" width="400" height="44" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="356" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">一趟三向逐位比较：最先到头的串决定扫描长度</text>
  <text x="260" y="373" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">不排序、不建 Trie，时间 O(min(n1, n2, n3))，空间 O(1)</text>
</svg>
