<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心归约：不常见 ⟺ 合并后总频次 == 1</text>

  <!-- table frame -->
  <rect x="80" y="50" width="440" height="232" fill="#ffffff" stroke="#888" stroke-width="1.4" rx="6" filter="url(#rough2)"/>

  <!-- header row -->
  <rect x="80" y="50" width="440" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <g font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">
    <text x="135" y="72" text-anchor="middle">c₁ (s1 频次)</text>
    <text x="225" y="72" text-anchor="middle">c₂ (s2 频次)</text>
    <text x="355" y="72" text-anchor="middle">是否不常见</text>
    <text x="475" y="72" text-anchor="middle">c₁+c₂</text>
  </g>

  <!-- column separators -->
  <g stroke="#bbb" stroke-width="1" filter="url(#rough2)">
    <line x1="180" y1="84" x2="180" y2="282"/>
    <line x1="270" y1="84" x2="270" y2="282"/>
    <line x1="420" y1="84" x2="420" y2="282"/>
  </g>

  <!-- row 1: (1,0) green -->
  <rect x="80" y="84" width="440" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <g font-size="12" filter="url(#rough2)">
    <text x="135" y="108" text-anchor="middle" fill="#333">1</text>
    <text x="225" y="108" text-anchor="middle" fill="#333">0</text>
    <text x="355" y="108" text-anchor="middle" fill="#4a7a3a" font-weight="bold">✅ 不常见</text>
    <text x="475" y="108" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
  </g>

  <!-- row 2: (0,1) green -->
  <rect x="80" y="122" width="440" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <g font-size="12" filter="url(#rough2)">
    <text x="135" y="146" text-anchor="middle" fill="#333">0</text>
    <text x="225" y="146" text-anchor="middle" fill="#333">1</text>
    <text x="355" y="146" text-anchor="middle" fill="#4a7a3a" font-weight="bold">✅ 不常见</text>
    <text x="475" y="146" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
  </g>

  <!-- row 3: (1,1) red -->
  <rect x="80" y="160" width="440" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <g font-size="12" filter="url(#rough2)">
    <text x="135" y="184" text-anchor="middle" fill="#333">1</text>
    <text x="225" y="184" text-anchor="middle" fill="#333">1</text>
    <text x="355" y="184" text-anchor="middle" fill="#b85450" font-weight="bold">❌ 两句都出现</text>
    <text x="475" y="184" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
  </g>

  <!-- row 4: (2,0) red -->
  <rect x="80" y="198" width="440" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <g font-size="12" filter="url(#rough2)">
    <text x="135" y="222" text-anchor="middle" fill="#333">2</text>
    <text x="225" y="222" text-anchor="middle" fill="#333">0</text>
    <text x="355" y="222" text-anchor="middle" fill="#b85450" font-weight="bold">❌ s1 非恰好一次</text>
    <text x="475" y="222" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
  </g>

  <!-- row 5: (0,2) red -->
  <rect x="80" y="236" width="440" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <g font-size="12" filter="url(#rough2)">
    <text x="135" y="260" text-anchor="middle" fill="#333">0</text>
    <text x="225" y="260" text-anchor="middle" fill="#333">2</text>
    <text x="355" y="260" text-anchor="middle" fill="#b85450" font-weight="bold">❌ s2 非恰好一次</text>
    <text x="475" y="260" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
  </g>

  <!-- arrow down -->
  <path d="M 300 290 L 300 312" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- conclusion box -->
  <rect x="80" y="316" width="440" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="342" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">结论：只有 c₁+c₂ == 1 的行是不常见的</text>

  <!-- takeaway -->
  <rect x="80" y="366" width="440" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="300" y="386" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">不常见 ⟺ 合并后总频次 == 1</text>
  <text x="300" y="402" text-anchor="middle" font-size="10" fill="#666">两张句频表合并成一张，一行过滤 c == 1</text>
</svg>
