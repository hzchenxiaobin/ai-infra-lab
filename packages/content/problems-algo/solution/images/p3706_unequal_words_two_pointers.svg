<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">核心观察：最优对贴边 ⇒ 锚定首词右扫 + 锚定末词左扫</text>

  <!-- 示例 2 的数组 -->
  <text x="124" y="40" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">锚① 首词</text>
  <text x="396" y="40" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">锚② 末词</text>

  <rect x="94" y="46" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="124" y="69" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>

  <rect x="162" y="46" width="60" height="36" fill="#ffffff" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="192" y="69" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>

  <rect x="230" y="46" width="60" height="36" fill="#ffffff" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="69" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>

  <rect x="298" y="46" width="60" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="328" y="69" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>

  <rect x="366" y="46" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="396" y="69" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>

  <text x="124" y="96" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="192" y="96" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="260" y="96" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="328" y="96" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="396" y="96" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">4</text>

  <!-- 两个候选对（双端箭头，横坐标对齐格子中心） -->
  <text x="192" y="114" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">候选① (0, 2)：距离 3</text>
  <path d="M 124 126 L 260 126" fill="none" stroke="#446688" stroke-width="1.8"
        marker-start="url(#arrB)" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <text x="294" y="148" text-anchor="middle" font-size="10.5" filter="url(#rough2)"><tspan fill="#4a7a3a">候选② (1, 4)：距离 4 </tspan><tspan fill="#b85450" font-weight="bold">✓ 答案</tspan></text>
  <path d="M 192 160 L 396 160" fill="none" stroke="#4a7a3a" stroke-width="1.8"
        marker-start="url(#arrG)" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 两趟扫描说明框 -->
  <rect x="25" y="182" width="230" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="140" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">右扫：锚定首词 words[0]</text>
  <text x="140" y="224" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">从 n−1 向左，跳过所有 = words[0] 的词</text>
  <text x="140" y="240" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">停在最右异词 ⇒ 候选 (0, j)，距离 j+1</text>

  <rect x="265" y="182" width="230" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="380" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">左扫：锚定末词 words[n−1]</text>
  <text x="380" y="224" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">从 0 向右，跳过所有 = words[n−1] 的词</text>
  <text x="380" y="240" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">停在最左异词 ⇒ 候选 (i, n−1)，距离 n−i</text>

  <!-- 定理反证框 -->
  <rect x="25" y="260" width="470" height="90" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="282" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">为什么只需两个锚？——最优对必有一端贴边（反证）</text>
  <text x="260" y="304" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">反设最优对 (i, j) 两端都在内部 ⇒ 换更远端必不合法：words[0] = words[j]，words[n−1] = words[i]</text>
  <text x="260" y="324" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">⇒ words[0] ≠ words[n−1]，对 (0, n−1) 距离 n 反而更大，矛盾！</text>
  <text x="260" y="344" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">∴ 枚举 (0, j) 与 (i, n−1) 两族候选即够；首 ≠ 末时答案直接 = n</text>
</svg>
