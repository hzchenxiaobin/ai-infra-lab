<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- 坐标轴 -->
  <line x1="70" y1="320" x2="520" y2="320" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="70" y1="320" x2="70" y2="40" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="525" y="336" font-size="15" fill="#446688" filter="url(#rough2)">x = nums1[j]</text>
  <text x="48" y="38" font-size="15" fill="#446688" filter="url(#rough2)">y = nums2[j]</text>
  <text x="62" y="336" font-size="12" fill="#888" filter="url(#rough2)">0</text>

  <!-- 查询点 (xi, yi) 与右上角区域 -->
  <rect x="250" y="90" width="270" height="230" fill="#fff8e1" fill-opacity="0.55"
        stroke="#d6a040" stroke-width="1.5" stroke-dasharray="6 4" rx="4" filter="url(#rough2)"/>
  <circle cx="250" cy="320" r="0.1"/>
  <line x1="250" y1="320" x2="250" y2="90" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <line x1="70" y1="90" x2="250" y2="90" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <circle cx="250" cy="90" r="4.5" fill="#b85450" stroke="#7a3a36" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="258" y="84" font-size="14" fill="#b85450" filter="url(#rough2)">查询 (x_i, y_i)</text>

  <!-- 右上角区域标注 -->
  <text x="370" y="200" font-size="15" fill="#a07020" filter="url(#rough2)">x ≥ x_i  且  y ≥ y_i</text>
  <text x="385" y="222" font-size="13" fill="#a07020" filter="url(#rough2)">（右上角区域）</text>

  <!-- 散点 -->
  <!-- 区域外 -->
  <circle cx="130" cy="270" r="5" fill="#e8f0fe" stroke="#88a0c8" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="180" cy="220" r="5" fill="#e8f0fe" stroke="#88a0c8" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="210" cy="150" r="5" fill="#e8f0fe" stroke="#88a0c8" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="160" cy="120" r="5" fill="#e8f0fe" stroke="#88a0c8" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="120" cy="180" r="5" fill="#e8f0fe" stroke="#88a0c8" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="300" cy="300" r="5" fill="#e8f0fe" stroke="#88a0c8" stroke-width="1.5" filter="url(#rough2)"/>
  <!-- 区域内：高亮 -->
  <circle cx="290" cy="180" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="350" cy="140" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="420" cy="210" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <!-- 最优：和最大，红圈强调 -->
  <circle cx="460" cy="130" r="7" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="430" y="122" font-size="13" fill="#b85450" filter="url(#rough2)">max(x+y)</text>

  <!-- 图例 -->
  <rect x="90" y="48" width="430" height="0.1"/>
  <circle cx="100" cy="358" r="5" fill="#e8f0fe" stroke="#88a0c8" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="112" y="362" font-size="12" fill="#666" filter="url(#rough2)">不满足约束的点</text>
  <circle cx="250" cy="358" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="262" y="362" font-size="12" fill="#666" filter="url(#rough2)">区域内候选点</text>
  <circle cx="400" cy="358" r="7" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="412" y="362" font-size="12" fill="#666" filter="url(#rough2)">答案（和最大）</text>

  <text x="180" y="62" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">把每个 j 看成二维点，查询 = 右上角区域内取 max(x+y)</text>
</svg>
