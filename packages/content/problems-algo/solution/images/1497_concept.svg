<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：余数 r 与余数 (k−r) 配对，和为 k → 被 k 整除（以 k=5 为例）</text>

  <!-- guide circle (dashed) -->
  <circle cx="300" cy="210" r="90" fill="none" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="4,4" filter="url(#rough2)"/>
  <text x="430" y="160" font-size="10" fill="#aaa">余数环 0..k−1</text>

  <!-- Pairing chords (drawn first so buckets overlay endpoints) -->
  <!-- chord 1<->4 : (386,182) to (214,182) horizontal -->
  <path d="M 386 182 L 214 182" stroke="#446688" stroke-width="2" fill="none" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="300" y="206" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1 + 4 = 5 ≡ 0</text>

  <!-- chord 2<->3 : (353,283) to (247,283) horizontal -->
  <path d="M 353 283 L 247 283" stroke="#4a7a3a" stroke-width="2" fill="none" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="300" y="305" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2 + 3 = 5 ≡ 0</text>

  <!-- self loop on bucket 0 (top, 300,120) -->
  <path d="M 288 112 C 268 86, 268 70, 300 68 C 332 70, 332 86, 312 112"
        stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="300" y="56" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">0 + 0 = 0（自配，需偶数）</text>

  <!-- Buckets at 5 points on circle -->
  <!-- bucket 0 : top (300,120) orange -->
  <circle cx="300" cy="120" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="125" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>

  <!-- bucket 1 : (386,182) blue -->
  <circle cx="386" cy="182" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="386" y="187" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <!-- bucket 4 : (214,182) blue -->
  <circle cx="214" cy="182" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="214" y="187" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>

  <!-- bucket 2 : (353,283) green -->
  <circle cx="353" cy="283" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="353" y="288" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>

  <!-- bucket 3 : (247,283) green -->
  <circle cx="247" cy="283" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="247" y="288" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>

  <!-- pairing labels next to each bucket -->
  <text x="412" y="178" font-size="10" fill="#446688">↔4</text>
  <text x="188" y="178" font-size="10" fill="#446688">↔1</text>
  <text x="379" y="285" font-size="10" fill="#4a7a3a">↔3</text>
  <text x="221" y="285" font-size="10" fill="#4a7a3a">↔2</text>

  <!-- bottom note: judge conditions -->
  <rect x="50" y="336" width="500" height="74" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="300" y="358" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">判定条件（统计 cnt[0..k−1] 后逐项检查）</text>
  <text x="70" y="378" font-size="11" fill="#d6a040" font-weight="bold">• cnt[0] 为偶数（余 0 自配）</text>
  <text x="290" y="378" font-size="11" fill="#446688" font-weight="bold">• r ≠ k−r：cnt[r] == cnt[k−r]</text>
  <text x="70" y="398" font-size="11" fill="#4a7a3a" font-weight="bold">• r = k−r（k 偶中点）：cnt[r] 为偶数</text>
  <text x="290" y="398" font-size="11" fill="#888">余数互补 → 只需计数匹配，无需构造配对</text>
</svg>
