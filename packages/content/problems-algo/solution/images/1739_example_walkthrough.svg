<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="520" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：n=10（完整四面体）与 n=15（含扩展）</text>

  <!-- ===== Example 1: n=10 ===== -->
  <text x="140" y="56" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">n = 10：完整四面体 m=3</text>

  <!-- Layer 3 (top, 1 box) -->
  <g filter="url(#rough2)" font-size="10" font-weight="bold" text-anchor="middle">
    <rect x="124" y="70" width="32" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3"/>
    <text x="140" y="86" fill="#b85450">1</text>
  </g>
  <text x="175" y="86" font-size="9" fill="#b85450" filter="url(#rough2)">第 3 层: 1</text>

  <!-- Layer 2 (3 boxes) -->
  <g filter="url(#rough2)" font-size="10" font-weight="bold" text-anchor="middle">
    <rect x="108" y="98" width="32" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="124" y="114" fill="#4a7a3a">3</text>
    <rect x="142" y="98" width="32" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="158" y="114" fill="#4a7a3a">3</text>
    <rect x="176" y="98" width="32" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="192" y="114" fill="#4a7a3a">3</text>
  </g>
  <text x="225" y="114" font-size="9" fill="#4a7a3a" filter="url(#rough2)">第 2 层: 3</text>

  <!-- Layer 1 (ground, 6 boxes) -->
  <g filter="url(#rough2)" font-size="10" font-weight="bold" text-anchor="middle">
    <rect x="92" y="126" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="108" y="142" fill="#446688">6</text>
    <rect x="126" y="126" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="142" y="142" fill="#446688">6</text>
    <rect x="160" y="126" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="176" y="142" fill="#446688">6</text>
    <rect x="194" y="126" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="210" y="142" fill="#446688">6</text>
    <rect x="228" y="126" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="244" y="142" fill="#446688">6</text>
    <rect x="262" y="126" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="278" y="142" fill="#446688">6</text>
  </g>
  <text x="175" y="166" font-size="9" fill="#446688" filter="url(#rough2)">地面层: 6 (边长 3)</text>

  <!-- Ground line -->
  <line x1="80" y1="154" x2="304" y2="154" stroke="#b8860b" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Calculation box -->
  <rect x="40" y="178" width="260" height="78" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="52" y="196" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">计算过程：</text>
  <text x="52" y="212" font-size="10" fill="#555" filter="url(#rough2)">T(3) = 3×4×5/6 = 10 ≤ 10 ✓</text>
  <text x="52" y="228" font-size="10" fill="#555" filter="url(#rough2)">r = 10 − 10 = 0 → 无需扩展</text>
  <text x="52" y="246" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = 3×4/2 = 6 ✓</text>

  <!-- ===== Divider ===== -->
  <line x1="40" y1="272" x2="520" y2="272" stroke="#ddd" stroke-width="1" stroke-dasharray="5,5" filter="url(#rough2)"/>

  <!-- ===== Example 2: n=15 ===== -->
  <text x="280" y="296" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">n = 15：四面体 m=3 + 扩展 k=3</text>

  <!-- Existing tetrahedron (compact) -->
  <text x="80" y="318" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">已有四面体 (10 个)</text>

  <g filter="url(#rough2)" font-size="9" font-weight="bold" text-anchor="middle">
    <!-- Top -->
    <rect x="68" y="328" width="24" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/>
    <text x="80" y="342" fill="#b85450">1</text>
    <!-- Layer 2 -->
    <rect x="56" y="352" width="24" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="68" y="366" fill="#4a7a3a">3</text>
    <rect x="82" y="352" width="24" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="94" y="366" fill="#4a7a3a">3</text>
    <rect x="108" y="352" width="24" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="120" y="366" fill="#4a7a3a">3</text>
    <!-- Ground (6) -->
    <rect x="44" y="376" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="56" y="390" fill="#446688">6</text>
    <rect x="70" y="376" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="82" y="390" fill="#446688">6</text>
    <rect x="96" y="376" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="108" y="390" fill="#446688">6</text>
    <rect x="122" y="376" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="134" y="390" fill="#446688">6</text>
    <rect x="148" y="376" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="160" y="390" fill="#446688">6</text>
    <rect x="174" y="376" width="24" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="186" y="390" fill="#446688">6</text>
  </g>
  <line x1="36" y1="400" x2="206" y2="400" stroke="#b8860b" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Extension arrow -->
  <path d="M 210 388 L 240 388" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="215" y="380" font-size="8" fill="#d6a040" font-weight="bold" filter="url(#rough2)">扩展</text>

  <!-- Extension: k=3 new ground boxes + upper layers -->
  <text x="330" y="318" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">扩展部分 (k=3, 容量 6, 用 5)</text>

  <g filter="url(#rough2)" font-size="9" font-weight="bold" text-anchor="middle">
    <!-- Top of extension (1 box) -->
    <rect x="324" y="328" width="24" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <text x="336" y="342" fill="#d6a040">1</text>
    <!-- Layer 2 of extension (2 boxes) -->
    <rect x="312" y="352" width="24" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <text x="324" y="366" fill="#d6a040">2</text>
    <rect x="338" y="352" width="24" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <text x="350" y="366" fill="#d6a040">2</text>
    <!-- New ground boxes (3) -->
    <rect x="300" y="376" width="24" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3"/>
    <text x="312" y="390" fill="#d6a040">新</text>
    <rect x="326" y="376" width="24" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3"/>
    <text x="338" y="390" fill="#d6a040">新</text>
    <rect x="352" y="376" width="24" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3"/>
    <text x="364" y="390" fill="#d6a040">新</text>
  </g>
  <line x1="292" y1="400" x2="388" y2="400" stroke="#b8860b" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- "Wall" label (existing tetrahedron acts as wall) -->
  <text x="285" y="360" font-size="8" fill="#446688" font-style="italic" filter="url(#rough2)">四面体</text>
  <text x="285" y="372" font-size="8" fill="#446688" font-style="italic" filter="url(#rough2)">= "墙"</text>

  <!-- Calculation for n=15 -->
  <rect x="40" y="414" width="480" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="52" y="434" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">计算过程：</text>
  <text x="52" y="450" font-size="10" fill="#555" filter="url(#rough2)">① m=3, T(3)=10, r = 15−10 = 5</text>
  <text x="52" y="466" font-size="10" fill="#555" filter="url(#rough2)">② 找最小 k: k=2 → 2×3/2=3 &lt; 5 ✗; k=3 → 3×4/2=6 ≥ 5 ✓</text>
  <text x="52" y="486" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">答案 = 6 + 3 = 9（6 原有地面 + 3 新增地面 = 9 个接触地面）</text>
</svg>
