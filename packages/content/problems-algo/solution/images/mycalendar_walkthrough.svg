<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：六次 book 调用，事件集合的演化</text>

  <line x1="180" y1="46" x2="460" y2="46" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="180" y1="42" x2="180" y2="50" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="220" y1="42" x2="220" y2="50" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="260" y1="42" x2="260" y2="50" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="300" y1="42" x2="300" y2="50" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="340" y1="42" x2="340" y2="50" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="380" y1="42" x2="380" y2="50" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="420" y1="42" x2="420" y2="50" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="460" y1="42" x2="460" y2="50" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="180" y="62" text-anchor="middle" font-size="9.5" fill="#888">0</text>
  <text x="220" y="62" text-anchor="middle" font-size="9.5" fill="#888">10</text>
  <text x="260" y="62" text-anchor="middle" font-size="9.5" fill="#888">15</text>
  <text x="300" y="62" text-anchor="middle" font-size="9.5" fill="#888">20</text>
  <text x="340" y="62" text-anchor="middle" font-size="9.5" fill="#888">25</text>
  <text x="380" y="62" text-anchor="middle" font-size="9.5" fill="#888">30</text>
  <text x="420" y="62" text-anchor="middle" font-size="9.5" fill="#888">35</text>
  <text x="460" y="62" text-anchor="middle" font-size="9.5" fill="#888">40</text>

  <text x="30" y="88" font-size="10.5" fill="#333" font-weight="bold">① book(10, 20)</text>
  <rect x="220" y="78" width="80" height="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" rx="3" filter="url(#rough2)"/>
  <rect x="220" y="92" width="80" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="485" y="102" font-size="10.5" fill="#4a7a3a" font-weight="bold">true</text>

  <text x="30" y="122" font-size="10.5" fill="#333" font-weight="bold">② book(15, 25)</text>
  <rect x="220" y="116" width="80" height="10" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="260" y="116" width="80" height="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" rx="3" filter="url(#rough2)"/>
  <text x="300" y="123" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">撞 [10,20)</text>
  <text x="485" y="122" font-size="10.5" fill="#b85450" font-weight="bold">false</text>

  <text x="30" y="158" font-size="10.5" fill="#333" font-weight="bold">③ book(20, 30)</text>
  <rect x="220" y="152" width="80" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="300" y="146" width="80" height="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" rx="3" filter="url(#rough2)"/>
  <text x="340" y="153" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">端点相接 ✓</text>
  <rect x="300" y="162" width="80" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="485" y="168" font-size="10.5" fill="#4a7a3a" font-weight="bold">true</text>

  <text x="30" y="200" font-size="10.5" fill="#333" font-weight="bold">④ book(5, 10)</text>
  <rect x="220" y="194" width="80" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="300" y="194" width="80" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="180" y="188" width="40" height="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" rx="3" filter="url(#rough2)"/>
  <rect x="180" y="204" width="40" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="485" y="210" font-size="10.5" fill="#4a7a3a" font-weight="bold">true</text>

  <text x="30" y="244" font-size="10.5" fill="#333" font-weight="bold">⑤ book(25, 35)</text>
  <rect x="180" y="238" width="40" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="220" y="238" width="80" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="300" y="238" width="80" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="340" y="232" width="80" height="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" rx="3" filter="url(#rough2)"/>
  <text x="380" y="239" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">端点相接 ✓</text>
  <rect x="340" y="248" width="80" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="485" y="254" font-size="10.5" fill="#4a7a3a" font-weight="bold">true</text>

  <text x="30" y="290" font-size="10.5" fill="#333" font-weight="bold">⑥ book(18, 28)</text>
  <rect x="180" y="284" width="40" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="220" y="284" width="80" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="300" y="284" width="80" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="340" y="284" width="80" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="256" y="276" width="88" height="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" rx="3" filter="url(#rough2)"/>
  <text x="300" y="283" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">撞 [20,30)</text>
  <text x="485" y="290" font-size="10.5" fill="#b85450" font-weight="bold">false</text>

  <rect x="36" y="312" width="488" height="136" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="334" font-size="12" fill="#4a7a3a" font-weight="bold">关键观察</text>
  <text x="56" y="354" font-size="11" fill="#555">• ③ [20,30) 与 [10,20) 端点 20 相接 → 半开区间 [10,20) 不含 20 → 不算重叠 → 可预订</text>
  <text x="56" y="372" font-size="11" fill="#555">• ④ [5,10) 接在 [10,20) 左侧端点 → 同理不重叠，集合扩展为 4 段</text>
  <text x="56" y="390" font-size="11" fill="#555">• ⑤ [25,35) 与 [20,30) 在端点 30 相接 → 不重叠；与 [30,40) 端点相接 → 不重叠</text>
  <text x="56" y="408" font-size="11" fill="#b85450" font-weight="bold">• ⑥ [18,28)：prev=[10,20).end=20 &gt; 18 → 撞前段；it=[20,30).start=20 &lt; 28 → 撞后段</text>
  <text x="56" y="426" font-size="11" fill="#555">  （双侧只要一侧重叠即拒绝，无需合并——这是与 731/732 的本质差异）</text>
</svg>
