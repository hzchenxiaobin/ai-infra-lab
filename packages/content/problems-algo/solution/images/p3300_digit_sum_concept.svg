<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心概念：模运算提取数位，边算边维护最小值</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">示例 3：nums = [999, 19, 199] → 替换后 [27, 10, 19] → 最小 10</text>

  <!-- 左：nums 原数组 -->
  <text x="84" y="70" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">nums（原数组）</text>
  <rect x="40" y="82" width="88" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="84" y="99" text-anchor="middle" font-size="12" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">999</text>
  <rect x="40" y="122" width="88" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="84" y="139" text-anchor="middle" font-size="12" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">19</text>
  <rect x="40" y="162" width="88" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="84" y="179" text-anchor="middle" font-size="12" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">199</text>

  <path d="M 130 95 Q 145 95 154 102" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <path d="M 130 135 Q 145 135 154 135" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <path d="M 130 175 Q 145 175 154 168" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrGreen)" filter="url(#rough2)"/>

  <!-- 中：数位求和机器 -->
  <rect x="158" y="76" width="190" height="182" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="253" y="96" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">数位求和（内层 while）</text>
  <text x="253" y="118" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">while x &gt; 0:</text>
  <text x="253" y="136" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">s += x % 10 ← 取末位</text>
  <text x="253" y="154" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">x //= 10　 ← 砍末位</text>
  <rect x="170" y="164" width="166" height="82" rx="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="253" y="182" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">999 的取位轨迹：</text>
  <text x="253" y="200" text-anchor="middle" font-size="10.5" fill="#2f5424" filter="url(#rough2)">x：999 → 99 → 9 → 0</text>
  <text x="253" y="218" text-anchor="middle" font-size="10.5" fill="#2f5424" filter="url(#rough2)">s：9 → 18 → 27</text>
  <text x="253" y="238" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">每元素循环 ≤ 5 次（≤ 10⁴）</text>

  <path d="M 348 95 Q 364 95 384 95" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 348 135 Q 364 135 384 135" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 348 175 Q 364 175 384 175" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 右：替换后 -->
  <text x="432" y="70" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">数位和（替换后）</text>
  <rect x="388" y="82" width="88" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="432" y="99" text-anchor="middle" font-size="12" fill="#2f5424" filter="url(#rough2)">27</text>
  <rect x="388" y="122" width="88" height="26" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="432" y="139" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">10 ★</text>
  <rect x="388" y="162" width="88" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="432" y="179" text-anchor="middle" font-size="12" fill="#2f5424" filter="url(#rough2)">19</text>
  <text x="432" y="208" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans = 10（在线 min）</text>

  <!-- 底部要点框 -->
  <rect x="40" y="272" width="440" height="72" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="292" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">观察①：数位提取是纯算术（%10 取位、/10 去位），无需字符串、零分配</text>
  <text x="260" y="310" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">观察②：min 在线维护——每算出一个 s 立刻比较，省掉 O(n) 新数组和第二遍扫描</text>
  <text x="260" y="328" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">观察③：nums[i] ≤ 10⁴ ⇒ 数位和 ≤ 36，天然无溢出</text>
</svg>
