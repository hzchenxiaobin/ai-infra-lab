<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：双指针对撞 + 贪心取 min</text>

  <!-- Start -->
  <rect x="230" y="44" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="280" y="65" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">开始</text>
  <path d="M280,76 L280,92" stroke="#888" stroke-width="1.6" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Init -->
  <rect x="200" y="94" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="280" y="116" text-anchor="middle" font-size="12" fill="#333">i = 0, j = n−1</text>
  <path d="M280,128 L280,144" stroke="#888" stroke-width="1.6" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Decision: i < j ? -->
  <path d="M280,146 L380,190 L280,234 L180,190 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="187" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">i &lt; j ?</text>
  <text x="280" y="202" text-anchor="middle" font-size="10" fill="#888">（还有未配对的对称对）</text>

  <!-- No branch: end -->
  <path d="M180,190 L120,190 L120,250" stroke="#888" stroke-width="1.6" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="150" y="184" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="60" y="252" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="120" y="274" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 s（回文）</text>

  <!-- Yes branch: down to equality decision -->
  <path d="M280,234 L280,258" stroke="#888" stroke-width="1.6" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="294" y="248" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Decision: s[i] == s[j] ? -->
  <path d="M280,260 L420,300 L280,340 L140,300 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="297" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">s[i] == s[j] ?</text>
  <text x="280" y="312" text-anchor="middle" font-size="10" fill="#888">（这对字符是否已相等）</text>

  <!-- Yes (equal): just move pointers -->
  <path d="M420,300 L470,300 L470,116 L360,116" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrF)" fill="none" filter="url(#rough2)"/>
  <text x="436" y="294" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="476" y="100" width="72" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="512" y="121" text-anchor="middle" font-size="11" fill="#446688">i++, j−−</text>
  <text x="512" y="148" text-anchor="middle" font-size="9" fill="#888">（0 次操作）</text>
  <path d="M512,134 L512,150 L360,150 L360,110" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="3,3" fill="none" filter="url(#rough2)" marker-end="url(#arrF)"/>

  <!-- No (differ): change larger to smaller -->
  <path d="M280,340 L280,358" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="294" y="332" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="120" y="356" width="320" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="280" y="370" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">c=min(s[i],s[j]); s[i]=s[j]=c; i++; j−− （1 次操作）</text>

  <!-- loop-back arrow from differ to top decision -->
  <path d="M120,366 L70,366 L70,190 L180,190" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4,3" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="78" y="360" font-size="9" fill="#b85450">回到 i&lt;j 判定</text>
</svg>
