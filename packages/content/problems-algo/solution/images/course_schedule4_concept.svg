<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">传递闭包：直接先修 + 间接先修</text>

  <!-- Edges: chain 0->1->2->3 (solid, direct) -->
  <path d="M 108 132 L 222 132" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 268 132 L 382 132" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 428 132 L 542 132" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Indirect (transitive) edge 0->3, dashed red -->
  <path d="M 96 152 C 200 220, 360 220, 522 152" stroke="#b85450" stroke-width="1.8"
        fill="none" stroke-dasharray="6 4" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Nodes -->
  <circle cx="84" cy="132" r="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="84" y="137" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>

  <circle cx="244" cy="132" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="244" y="137" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <circle cx="404" cy="132" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="404" y="137" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>

  <circle cx="524" cy="132" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="524" y="137" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>

  <!-- Edge labels -->
  <text x="166" y="124" text-anchor="middle" font-size="10" fill="#4a7a3a">直接</text>
  <text x="326" y="124" text-anchor="middle" font-size="10" fill="#4a7a3a">直接</text>
  <text x="486" y="124" text-anchor="middle" font-size="10" fill="#4a7a3a">直接</text>
  <text x="300" y="244" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">间接(传递): 0→1→2→3 ⟹ 0 是 3 的先修</text>

  <!-- Reachability matrix -->
  <text x="84" y="288" font-size="12" fill="#555" font-weight="bold">reach 矩阵 (u 能达 v = u 是 v 的先修):</text>

  <!-- column headers -->
  <text x="186" y="306" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="222" y="306" text-anchor="middle" font-size="11" fill="#888">1</text>
  <text x="258" y="306" text-anchor="middle" font-size="11" fill="#888">2</text>
  <text x="294" y="306" text-anchor="middle" font-size="11" fill="#888">3</text>
  <!-- row headers -->
  <text x="158" y="324" text-anchor="end" font-size="11" fill="#888">0</text>
  <text x="158" y="342" text-anchor="end" font-size="11" fill="#888">1</text>
  <text x="158" y="360" text-anchor="end" font-size="11" fill="#888">2</text>

  <!-- row 0: -, T, T, T -->
  <rect x="170" y="314" width="32" height="18" fill="#eeeeee" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <rect x="206" y="314" width="32" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="242" y="314" width="32" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="278" y="314" width="32" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="186" y="327" text-anchor="middle" font-size="10" fill="#999">·</text>
  <text x="222" y="327" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">T</text>
  <text x="258" y="327" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">T</text>
  <text x="294" y="327" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">T</text>

  <!-- row 1: -, ·, T, T -->
  <rect x="170" y="332" width="32" height="18" fill="#eeeeee" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <rect x="206" y="332" width="32" height="18" fill="#eeeeee" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <rect x="242" y="332" width="32" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="278" y="332" width="32" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="186" y="345" text-anchor="middle" font-size="10" fill="#999">·</text>
  <text x="222" y="345" text-anchor="middle" font-size="10" fill="#999">·</text>
  <text x="258" y="345" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">T</text>
  <text x="294" y="345" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">T</text>

  <!-- row 2: -, ·, ·, T -->
  <rect x="170" y="350" width="32" height="18" fill="#eeeeee" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <rect x="206" y="350" width="32" height="18" fill="#eeeeee" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <rect x="242" y="350" width="32" height="18" fill="#eeeeee" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <rect x="278" y="350" width="32" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="186" y="363" text-anchor="middle" font-size="10" fill="#999">·</text>
  <text x="222" y="363" text-anchor="middle" font-size="10" fill="#999">·</text>
  <text x="258" y="363" text-anchor="middle" font-size="10" fill="#999">·</text>
  <text x="294" y="363" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">T</text>

  <!-- side note -->
  <rect x="330" y="312" width="216" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="438" y="330" text-anchor="middle" font-size="11" fill="#444">预计算 reach[u][v] (传递闭包)</text>
  <text x="438" y="346" text-anchor="middle" font-size="11" fill="#444">查询 [u,v] → 直接返回 reach[u][v]</text>
  <text x="438" y="361" text-anchor="middle" font-size="10" fill="#888">O(V³) 预处理 / O(1) 查询</text>
</svg>
