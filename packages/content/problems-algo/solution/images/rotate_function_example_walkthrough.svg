<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [4, 3, 2, 6]，Σ = 15，n = 4</text>

  <!-- Table header -->
  <rect x="30" y="48" width="60" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="60" y="68" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">k</text>
  <rect x="90" y="48" width="160" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="170" y="68" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">nums[n−k] 移到首</text>
  <rect x="250" y="48" width="120" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="310" y="68" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">Σ − n·nums[n−k]</text>
  <rect x="370" y="48" width="70" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="405" y="68" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">F(k)</text>
  <rect x="440" y="48" width="70" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="475" y="68" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">ans</text>

  <!-- Row k=0 -->
  <rect x="30" y="84" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="60" y="104" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <rect x="90" y="84" width="160" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="170" y="104" text-anchor="middle" font-size="10.5" fill="#888">（初始）</text>
  <rect x="250" y="84" width="120" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="310" y="104" text-anchor="middle" font-size="10.5" fill="#888">—</text>
  <rect x="370" y="84" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="405" y="104" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">25</text>
  <rect x="440" y="84" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="475" y="104" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">25</text>

  <!-- Row k=1 -->
  <rect x="30" y="120" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="60" y="140" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="90" y="120" width="160" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="140" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">nums[3] = 6</text>
  <rect x="250" y="120" width="120" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="310" y="140" text-anchor="middle" font-size="11" fill="#555">15 − 24 = −9</text>
  <rect x="370" y="120" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="405" y="140" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">16</text>
  <rect x="440" y="120" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="475" y="140" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">25</text>

  <!-- Row k=2 -->
  <rect x="30" y="156" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="60" y="176" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="90" y="156" width="160" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="176" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">nums[2] = 2</text>
  <rect x="250" y="156" width="120" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="310" y="176" text-anchor="middle" font-size="11" fill="#555">15 − 8 = 7</text>
  <rect x="370" y="156" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="405" y="176" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">23</text>
  <rect x="440" y="156" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="475" y="176" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">25</text>

  <!-- Row k=3 -->
  <rect x="30" y="192" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="60" y="212" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="90" y="192" width="160" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="212" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">nums[1] = 3</text>
  <rect x="250" y="192" width="120" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="310" y="212" text-anchor="middle" font-size="11" fill="#555">15 − 12 = 3</text>
  <rect x="370" y="192" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="405" y="212" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">26</text>
  <rect x="440" y="192" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="475" y="212" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">26</text>

  <!-- F(0) detail box -->
  <rect x="30" y="248" width="490" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="268" font-size="11" fill="#446688" font-weight="bold">F(0) 初始：</text>
  <text x="60" y="288" font-size="11" fill="#333">0×4 + 1×3 + 2×2 + 3×6 = 0 + 3 + 4 + 18 = 25</text>

  <!-- Result box -->
  <rect x="30" y="316" width="490" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="338" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">max = F(3) = 26</text>
  <text x="270" y="356" text-anchor="middle" font-size="10.5" fill="#4a7a3a">对应旋转：[3, 2, 6, 4]，系数 [0,1,2,3]</text>

  <!-- note -->
  <rect x="30" y="376" width="490" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="396" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">每步只算 Σ − n·nums[n−k] 一次乘法 + 一次加减</text>
  <text x="270" y="414" text-anchor="middle" font-size="10.5" fill="#555">不需要重新构造旋转后的数组，O(1) 状态转移</text>
</svg>
