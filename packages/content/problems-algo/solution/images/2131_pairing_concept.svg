<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：两类配对 + 至多一个中心位</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888">镜像对贡献 4 · 自回文对贡献 4 · 单个自回文词可放正中 +2</text>

  <!-- ===== Left: mirror pair ===== -->
  <rect x="20" y="60" width="235" height="148" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="138" y="80" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">镜像配对 (ab ↔ ba)</text>
  <text x="138" y="96" text-anchor="middle" font-size="10" fill="#446688">w[0] ≠ w[1]</text>

  <rect x="40" y="110" width="42" height="30" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="61" y="130" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">ab</text>

  <rect x="92" y="110" width="42" height="30" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="113" y="130" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">ba</text>

  <path d="M142 125 L162 125" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="110" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="130" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">abba</text>

  <text x="138" y="160" text-anchor="middle" font-size="10.5" fill="#555">取 min(cnt[ab], cnt[ba]) 对</text>
  <text x="138" y="178" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">每对贡献 4</text>
  <text x="138" y="196" text-anchor="middle" font-size="10" fill="#888">分置回文串两侧</text>

  <!-- ===== Right: self-palindrome pair ===== -->
  <rect x="265" y="60" width="235" height="148" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="383" y="80" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">自回文配对 (aa + aa)</text>
  <text x="383" y="96" text-anchor="middle" font-size="10" fill="#d6a040">w[0] == w[1]</text>

  <rect x="285" y="110" width="42" height="30" fill="#fff" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="306" y="130" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">aa</text>

  <rect x="337" y="110" width="42" height="30" fill="#fff" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="358" y="130" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">aa</text>

  <path d="M387 125 L407 125" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="415" y="110" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="445" y="130" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">aaaa</text>

  <text x="383" y="160" text-anchor="middle" font-size="10.5" fill="#555">取 cnt[aa] // 2 对</text>
  <text x="383" y="178" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">每对贡献 4</text>
  <text x="383" y="196" text-anchor="middle" font-size="10" fill="#888">分置回文串两侧</text>

  <!-- ===== Bottom: center slot ===== -->
  <rect x="20" y="220" width="480" height="100" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="240" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">中心位（至多 1 个 · 贡献 +2）</text>
  <text x="260" y="256" text-anchor="middle" font-size="10" fill="#b85450">某自回文词 cnt 为奇数时，余下 1 个可放回文串正中</text>

  <!-- center illustration: lc + gg + cl = lcggcl -->
  <rect x="100" y="270" width="50" height="30" fill="#fff" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="290" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">lc</text>

  <rect x="160" y="267" width="50" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="185" y="290" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">gg</text>

  <rect x="220" y="270" width="50" height="30" fill="#fff" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="245" y="290" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">cl</text>

  <path d="M280 285 L300 285" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="310" y="270" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="370" y="290" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">lcggcl</text>

  <!-- Footer -->
  <text x="260" y="338" text-anchor="middle" font-size="10" fill="#aaa">镜像对走 min · 自回文对走 //2 · 中心位最多 1 个</text>
  <text x="260" y="352" text-anchor="middle" font-size="10" fill="#aaa">时间 O(n) · 空间 O(|Σ|²) = O(676)</text>
</svg>
