<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="17" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">核心观察：过程天然串行 —— 未来只由状态 (i, f0, f1, b0, b1) 决定</text>

  <!-- 左侧：状态快照 -->
  <text x="24" y="38" font-size="10" fill="#666" filter="url(#rough2)">车 i 被允许那一刻（记作相对 0 点）：</text>

  <rect x="24" y="46" width="96" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="72" y="59" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">车 i</text>
  <text x="72" y="71" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">d = demand[i]</text>

  <path d="M 72 76 L 72 100" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="90" y="92" font-size="9" fill="#888" filter="url(#rough2)">二选一</text>

  <rect x="24" y="102" width="214" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="34" y="117" font-size="10.5" font-weight="bold" fill="#2f5527" filter="url(#rough2)">加油机 0</text>
  <text x="34" y="131" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">剩余燃料 f0（≥ d 才能开工）</text>
  <text x="34" y="143" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">距空闲还需 b0 秒</text>

  <rect x="24" y="154" width="214" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="34" y="169" font-size="10.5" font-weight="bold" fill="#2f5527" filter="url(#rough2)">加油机 1</text>
  <text x="34" y="183" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">剩余燃料 f1（≥ d 才能开工）</text>
  <text x="34" y="195" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">距空闲还需 b1 秒</text>

  <rect x="24" y="208" width="214" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="131" y="224" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">状态 = (i, f0, f1, b0, b1)</text>
  <text x="131" y="239" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">历史全部浓缩于此 → 记忆化搜索</text>

  <rect x="24" y="254" width="214" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="131" y="268" text-anchor="middle" font-size="9.5" fill="#8c3a35" filter="url(#rough2)">两台燃料都 &lt; d ⇒ 谁也开不了工</text>
  <text x="131" y="281" text-anchor="middle" font-size="9.5" fill="#8c3a35" filter="url(#rough2)">过程终止：已服务前 i 辆</text>

  <!-- 右侧：转移规则 -->
  <rect x="252" y="46" width="250" height="122" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="377" y="62" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">转移：车 i 交给加油机 j（须 fj ≥ d）</text>
  <text x="262" y="80" font-size="9.5" fill="#7a5c1a" filter="url(#rough2)">· 本车等待 = bj</text>
  <text x="262" y="95" font-size="9.5" fill="#7a5c1a" filter="url(#rough2)">· fj ← fj − d（开工即扣燃料）</text>
  <text x="262" y="110" font-size="9.5" fill="#7a5c1a" filter="url(#rough2)">· bj ← d（它要忙 d 秒）</text>
  <text x="262" y="125" font-size="9.5" fill="#7a5c1a" filter="url(#rough2)">· b别台 ← max(0, b别台 − bj)</text>
  <text x="262" y="140" font-size="9.5" fill="#7a5c1a" filter="url(#rough2)">· 车 i+1 恰在「车 i 开始」时被允许</text>
  <text x="262" y="155" font-size="9.5" fill="#7a5c1a" filter="url(#rough2)">　（新 0 点 = 车 i 的开始时刻）</text>

  <rect x="252" y="178" width="250" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="377" y="194" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">为什么不能贪心？</text>
  <text x="377" y="208" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">空闲机够料时，也可能偏要等忙碌的那台</text>
  <text x="377" y="220" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">——把空闲机的燃料省给后车，</text>
  <text x="377" y="232" text-anchor="middle" font-size="9" font-weight="bold" fill="#b85450" filter="url(#rough2)">如 [3,6,10],[9,10]：等 3 秒多服务 1 辆</text>

  <rect x="252" y="244" width="250" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="377" y="259" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f5527" filter="url(#rough2)">目标（字典序双层）</text>
  <text x="377" y="272" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">① 服务的车辆数最多</text>
  <text x="377" y="285" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">② 其中「最大等待」最小</text>

  <!-- 底部：时间线 -->
  <path d="M 70 316 L 200 316" stroke="#b85450" stroke-width="6" stroke-linecap="round" filter="url(#rough2)"/>
  <path d="M 200 316 L 340 316" stroke="#4a7a3a" stroke-width="6" stroke-linecap="round" filter="url(#rough2)"/>
  <path d="M 30 316 L 490 316" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 70 308 L 70 324" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 200 308 L 200 324" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 340 308 L 340 324" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="135" y="306" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">等待 bj</text>
  <text x="270" y="306" text-anchor="middle" font-size="9" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">加油 d 秒（新 bj = d）</text>

  <text x="70" y="336" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">车 i 被允许（0 点）</text>
  <text x="200" y="336" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">车 i 开始 ⇢ 车 i+1 被允许</text>
  <text x="340" y="336" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">机 j 空闲</text>

  <text x="260" y="353" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">转移后以「车 i 开始」为新 0 点重算两台的 b —— 绝对时间不必进状态</text>
</svg>
