<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1,1 L5,9 L9,1 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">回溯流程：dfs(pos, path, cnt)</text>
  <text x="300" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">cnt = 当前末尾连续缩写了多少个字符（尚未落盘成数字）</text>

  <!-- 入口 -->
  <rect x="210" y="60" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="300" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">调用 dfs(pos, path, cnt)</text>

  <line x1="300" y1="96" x2="300" y2="116" stroke="#446688" stroke-width="1.6" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- 菱形判定：pos == n ? -->
  <polygon points="300,120 410,165 300,210 190,165" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="160" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">pos == n?</text>
  <text x="300" y="176" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">所有字符决策完</text>

  <!-- 是 -> 收集 -->
  <line x1="190" y1="165" x2="120" y2="165" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="140" y="158" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="20" y="148" width="100" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="70" y="166" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">若 cnt&gt;0：</text>
  <text x="70" y="178" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">path += str(cnt)</text>

  <line x1="70" y1="184" x2="70" y2="208" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="20" y="210" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="70" y="232" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans 收集 path</text>

  <line x1="70" y1="244" x2="70" y2="270" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="30" y="272" width="80" height="28" fill="#f5f5f5" stroke="#888" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="70" y="290" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">return</text>

  <!-- 否 -> 两分支 -->
  <line x1="300" y1="210" x2="300" y2="236" stroke="#446688" stroke-width="1.6" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="308" y="228" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- 分支汇合点说明 -->
  <text x="300" y="252" text-anchor="middle" font-size="11" fill="#444" font-weight="bold" filter="url(#rough2)">对 word[pos] 二选一</text>

  <!-- 左分支：缩写 A -->
  <line x1="280" y1="260" x2="180" y2="290" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="200" y="278" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">缩写</text>
  <rect x="100" y="292" width="200" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="200" y="310" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">dfs(pos+1, path, cnt+1)</text>
  <text x="200" y="324" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">不写字符，只让计数+1</text>

  <!-- 右分支：保留 K -->
  <line x1="320" y1="260" x2="420" y2="290" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="380" y="278" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">保留</text>
  <rect x="340" y="292" width="240" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="460" y="310" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">若 cnt&gt;0：path += str(cnt)</text>
  <text x="460" y="324" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">path += word[pos]</text>
  <text x="460" y="338" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">dfs(pos+1, path, 0) → 撤销</text>

  <!-- 回溯弧线回到顶部 -->
  <path d="M 460 292 Q 560 180 460 78" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arrR)" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="548" y="180" font-size="9" fill="#666" filter="url(#rough2)">回溯</text>
  <text x="548" y="192" font-size="9" fill="#666" filter="url(#rough2)">下一层</text>

  <!-- 底部注释 -->
  <rect x="40" y="372" width="520" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="390" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">每个字符 2 分支 → n 层 → 2ⁿ 个叶子，每叶 O(n) 落盘</text>
  <text x="300" y="404" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">时间 O(n·2ⁿ)　空间 O(n)（递归栈 + path，不计结果）</text>
</svg>
