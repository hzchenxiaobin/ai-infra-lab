<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="320" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：low = 1000, high = 13000</text>
  <text x="300" y="42" text-anchor="middle" font-size="11" fill="#888">按位数 L 分层扫描 36 个候选，升序命中即收录，越界即终止</text>

  <!-- 表头 -->
  <rect x="24" y="54" width="552" height="28" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="56" y="72" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">位数 L</text>
  <text x="160" y="72" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">候选范围</text>
  <text x="330" y="72" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">与 [1000, 13000] 关系</text>
  <text x="500" y="72" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">入选</text>

  <!-- L=2 : 全 < low -->
  <rect x="24" y="86" width="552" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="56" y="106" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">2</text>
  <text x="160" y="106" text-anchor="middle" font-size="11" fill="#666">12 → 89</text>
  <text x="330" y="106" text-anchor="middle" font-size="11" fill="#b85450">全 &lt; low (1000)</text>
  <text x="500" y="106" text-anchor="middle" font-size="11" fill="#999">—</text>

  <!-- L=3 : 全 < low -->
  <rect x="24" y="118" width="552" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="56" y="138" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">3</text>
  <text x="160" y="138" text-anchor="middle" font-size="11" fill="#666">123 → 789</text>
  <text x="330" y="138" text-anchor="middle" font-size="11" fill="#b85450">全 &lt; low (1000)</text>
  <text x="500" y="138" text-anchor="middle" font-size="11" fill="#999">—</text>

  <!-- L=4 : 全在区间 -->
  <rect x="24" y="150" width="552" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="56" y="170" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="160" y="170" text-anchor="middle" font-size="11" fill="#4a7a3a">1234 → 6789</text>
  <text x="330" y="170" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">全在 [low, high] ✓</text>
  <text x="500" y="167" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">1234, 2345, 3456</text>
  <text x="500" y="178" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">4567, 5678, 6789</text>

  <!-- L=5 : 部分命中，触发终止 -->
  <rect x="24" y="182" width="552" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="56" y="202" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">5</text>
  <text x="160" y="202" text-anchor="middle" font-size="11" fill="#666">12345 → 56789</text>
  <text x="330" y="202" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">12345 ✓；23456 &gt; high → 终止</text>
  <text x="500" y="202" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">12345</text>

  <!-- L=6+ : 已终止 -->
  <rect x="24" y="214" width="552" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="4 3" rx="3" filter="url(#rough2)"/>
  <text x="56" y="234" text-anchor="middle" font-size="11.5" fill="#999" font-weight="bold">6+</text>
  <text x="160" y="234" text-anchor="middle" font-size="11" fill="#999">123456 → …</text>
  <text x="330" y="234" text-anchor="middle" font-size="11" fill="#999">已终止（全 &gt; high）</text>
  <text x="500" y="234" text-anchor="middle" font-size="11" fill="#999">—</text>

  <!-- 结果框 -->
  <rect x="24" y="256" width="552" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="56" y="284" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">结果</text>
  <text x="300" y="284" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">[1234, 2345, 3456, 4567, 5678, 6789, 12345]</text>

  <text x="300" y="314" text-anchor="middle" font-size="10.5" fill="#888">升序枚举 → 首次 num &gt; high 即整体终止，无需扫描剩余 L=6..9 候选</text>
</svg>
