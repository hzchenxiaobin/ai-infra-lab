<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：统计 freq → 遍历 x → 续接 / 新建 / 失败</text>

  <!-- step 1: 统计频率 -->
  <rect x="190" y="40" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="11.5" fill="#333">① 统计 freq，tails 清空</text>
  <path d="M 280 76 L 280 92" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2: 遍历 nums 中每个 x -->
  <rect x="190" y="94" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="114" text-anchor="middle" font-size="11.5" fill="#333">② 遍历 nums 中每个 x</text>
  <path d="M 280 130 L 280 146" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision 1: freq[x]==0? -->
  <path d="M 280 150 L 360 182 L 280 214 L 200 182 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="180" text-anchor="middle" font-size="11" fill="#333">freq[x]==0 ?</text>
  <text x="280" y="196" text-anchor="middle" font-size="10" fill="#888">已被消耗?</text>

  <!-- yes: skip -->
  <path d="M 200 182 L 90 182" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="145" y="174" text-anchor="middle" font-size="10.5" fill="#4a7a3a">是</text>
  <rect x="30" y="166" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="60" y="186" text-anchor="middle" font-size="11" fill="#333">跳过</text>
  <path d="M 60 198 L 60 410 L 186 410" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- no: continue down -->
  <path d="M 280 214 L 280 230" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="226" font-size="10.5" fill="#888">否</text>

  <!-- decision 2: tails[x-1]>0? -->
  <path d="M 280 234 L 370 268 L 280 302 L 190 268 Z" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="266" text-anchor="middle" font-size="11" fill="#333">tails[x-1] &gt; 0 ?</text>
  <text x="280" y="282" text-anchor="middle" font-size="10" fill="#888">有可续接序列?</text>

  <!-- yes: 续接 -->
  <path d="M 190 268 L 90 268" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="145" y="260" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">是·优先</text>
  <rect x="20" y="250" width="70" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="55" y="266" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">续接</text>
  <text x="55" y="280" text-anchor="middle" font-size="9" fill="#555">tails[x]++</text>
  <path d="M 55 286 L 55 410 L 186 410" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- no: continue down -->
  <path d="M 280 302 L 280 318" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="314" font-size="10.5" fill="#888">否</text>

  <!-- decision 3: freq[x+1]>0 && freq[x+2]>0? -->
  <path d="M 280 322 L 390 358 L 280 394 L 170 358 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="354" text-anchor="middle" font-size="10.5" fill="#333">freq[x+1]&gt;0</text>
  <text x="280" y="370" text-anchor="middle" font-size="10.5" fill="#333">且 freq[x+2]&gt;0 ?</text>

  <!-- yes: 新建 -->
  <path d="M 390 358 L 470 358" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="350" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">是</text>
  <rect x="470" y="340" width="70" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="505" y="356" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">新建</text>
  <text x="505" y="370" text-anchor="middle" font-size="9" fill="#555">[x,x+1,x+2]</text>
  <path d="M 505 376 L 505 410 L 374 410" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- no: return false -->
  <path d="M 170 358 L 90 358" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="130" y="350" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  <rect x="40" y="340" width="70" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="75" y="362" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return</text>
  <text x="75" y="376" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">false</text>

  <!-- loop back: 下一个 x -->
  <rect x="190" y="394" width="180" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="414" text-anchor="middle" font-size="11" fill="#333">freq[x]−−，处理下一个 x</text>

  <path d="M 280 426 L 280 436 L 460 436 L 460 114 L 372 114" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- final -->
  <rect x="430" y="40" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="485" y="60" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">遍历完→true</text>
</svg>
