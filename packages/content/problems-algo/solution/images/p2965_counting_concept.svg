<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：值入桶 —— 重复的桶收两颗，缺失的桶空着</text>

  <!-- 3x3 grid: example 2 -->
  <rect x="48" y="56" width="42" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="69" y="79" text-anchor="middle" font-size="14" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">9</text>
  <rect x="94" y="56" width="42" height="36" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="115" y="79" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">1</text>
  <rect x="140" y="56" width="42" height="36" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="161" y="79" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">7</text>
  <rect x="48" y="96" width="42" height="36" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="69" y="119" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">8</text>
  <rect x="94" y="96" width="42" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="115" y="119" text-anchor="middle" font-size="14" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">9</text>
  <rect x="140" y="96" width="42" height="36" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="161" y="119" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">2</text>
  <rect x="48" y="136" width="42" height="36" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="69" y="159" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">3</text>
  <rect x="94" y="136" width="42" height="36" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="115" y="159" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">4</text>
  <rect x="140" y="136" width="42" height="36" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="161" y="159" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">6</text>

  <text x="114" y="196" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">grid（n = 3，值域 1..9）</text>

  <!-- explanation box -->
  <rect x="218" y="56" width="264" height="118" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="350" y="84" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">① 摊平：位置无所谓，就是 n² 个值</text>
  <text x="350" y="108" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">② 值域恰是连续 [1, n²] ⇒ 开 m+1 个桶</text>
  <text x="350" y="132" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">③ cnt[v]==2 → 重复 a；==0 → 缺失 b</text>

  <path d="M 186 115 L 214 115" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- section label -->
  <text x="48" y="218" font-size="11.5" fill="#555" filter="url(#rough2)">扫一遍矩阵，每个值 v 落进自己的桶 cnt[v]，计数如下：</text>

  <!-- value labels above buckets -->
  <text x="62" y="236" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">v=1</text>
  <text x="112" y="236" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">v=2</text>
  <text x="162" y="236" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">v=3</text>
  <text x="212" y="236" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">v=4</text>
  <text x="262" y="236" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">v=5</text>
  <text x="312" y="236" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">v=6</text>
  <text x="362" y="236" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">v=7</text>
  <text x="412" y="236" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">v=8</text>
  <text x="462" y="236" text-anchor="middle" font-size="10" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">v=9</text>

  <!-- buckets -->
  <rect x="40" y="244" width="44" height="46" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="62" y="274" text-anchor="middle" font-size="13.5" fill="#555" filter="url(#rough2)">1</text>
  <rect x="90" y="244" width="44" height="46" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="112" y="274" text-anchor="middle" font-size="13.5" fill="#555" filter="url(#rough2)">1</text>
  <rect x="140" y="244" width="44" height="46" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="162" y="274" text-anchor="middle" font-size="13.5" fill="#555" filter="url(#rough2)">1</text>
  <rect x="190" y="244" width="44" height="46" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="212" y="274" text-anchor="middle" font-size="13.5" fill="#555" filter="url(#rough2)">1</text>
  <rect x="240" y="244" width="44" height="46" fill="#ffffff" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" rx="4" filter="url(#rough2)"/>
  <text x="262" y="274" text-anchor="middle" font-size="13.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="290" y="244" width="44" height="46" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="312" y="274" text-anchor="middle" font-size="13.5" fill="#555" filter="url(#rough2)">1</text>
  <rect x="340" y="244" width="44" height="46" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="362" y="274" text-anchor="middle" font-size="13.5" fill="#555" filter="url(#rough2)">1</text>
  <rect x="390" y="244" width="44" height="46" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="412" y="274" text-anchor="middle" font-size="13.5" fill="#555" filter="url(#rough2)">1</text>
  <rect x="440" y="244" width="44" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="462" y="274" text-anchor="middle" font-size="13.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- callout arrows -->
  <path d="M 262 294 L 262 306" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 462 294 L 462 306" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- callout boxes -->
  <rect x="182" y="310" width="160" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="262" y="333" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">空桶 ⇒ 缺失 b = 5</text>
  <rect x="356" y="310" width="158" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="435" y="333" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">两颗球 ⇒ 重复 a = 9</text>

  <!-- bottom note -->
  <rect x="48" y="360" width="424" height="58" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="382" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">不用哈希表的理由：值域连续且上界小，数组下标当键省去哈希开销；</text>
  <text x="260" y="404" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">且按序扫 1..n² 时，计数为 0 的「缺席者」天然暴露。</text>
</svg>
