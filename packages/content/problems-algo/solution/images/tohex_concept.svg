<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="470" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：32 位补码按 4 位切 8 个 hex 位</text>

  <!-- ===== Example 1: num = 26 (positive) ===== -->
  <text x="40" y="62" font-size="12" fill="#446688" font-weight="bold">正数 num = 26</text>

  <!-- 8 cells: bits on top, hex digit below -->
  <!-- 26 = 0000 0000 0000 0000 0000 0000 0001 1010 -->
  <!-- cell x positions: 92,142,192,242,292,342,392,442 ; width 46 ; bits y=82, hex y=108 -->
  <rect x="92"  y="68" width="46" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="142" y="68" width="46" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="192" y="68" width="46" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="242" y="68" width="46" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="292" y="68" width="46" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="342" y="68" width="46" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <!-- non-zero cells highlighted -->
  <rect x="392" y="68" width="46" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="442" y="68" width="46" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>

  <!-- bits (small) -->
  <text x="115" y="84" text-anchor="middle" font-size="9" fill="#888">0000</text>
  <text x="165" y="84" text-anchor="middle" font-size="9" fill="#888">0000</text>
  <text x="215" y="84" text-anchor="middle" font-size="9" fill="#888">0000</text>
  <text x="265" y="84" text-anchor="middle" font-size="9" fill="#888">0000</text>
  <text x="315" y="84" text-anchor="middle" font-size="9" fill="#888">0000</text>
  <text x="365" y="84" text-anchor="middle" font-size="9" fill="#888">0000</text>
  <text x="415" y="84" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">0001</text>
  <text x="465" y="84" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">1010</text>

  <!-- hex digits (big) -->
  <text x="115" y="106" text-anchor="middle" font-size="13" fill="#bbb">0</text>
  <text x="165" y="106" text-anchor="middle" font-size="13" fill="#bbb">0</text>
  <text x="215" y="106" text-anchor="middle" font-size="13" fill="#bbb">0</text>
  <text x="265" y="106" text-anchor="middle" font-size="13" fill="#bbb">0</text>
  <text x="315" y="106" text-anchor="middle" font-size="13" fill="#bbb">0</text>
  <text x="365" y="106" text-anchor="middle" font-size="13" fill="#bbb">0</text>
  <text x="415" y="106" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">1</text>
  <text x="465" y="106" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">a</text>

  <!-- result for 26 -->
  <path d="M 465 116 L 465 130" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="420" y="132" width="92" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="466" y="150" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">"1a"</text>
  <text x="410" y="148" font-size="10" fill="#888">跳过前导 0</text>

  <!-- ===== arrow down to example 2 ===== -->
  <path d="M 290 168 L 290 182" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Example 2: num = -1 (negative) ===== -->
  <text x="40" y="204" font-size="12" fill="#b85450" font-weight="bold">负数 num = -1</text>

  <!-- reinterpretation box -->
  <rect x="92" y="194" width="396" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="290" y="213" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">int -1  →  unsigned 4294967295（位模式 0xFFFFFFFF 不变，重解释）</text>

  <!-- 8 cells for -1: all 1111 / f -->
  <rect x="92"  y="232" width="46" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="142" y="232" width="46" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="192" y="232" width="46" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="242" y="232" width="46" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="292" y="232" width="46" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="342" y="232" width="46" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="392" y="232" width="46" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="442" y="232" width="46" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>

  <text x="115" y="248" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1111</text>
  <text x="165" y="248" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1111</text>
  <text x="215" y="248" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1111</text>
  <text x="265" y="248" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1111</text>
  <text x="315" y="248" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1111</text>
  <text x="365" y="248" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1111</text>
  <text x="415" y="248" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1111</text>
  <text x="465" y="248" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1111</text>

  <text x="115" y="270" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">f</text>
  <text x="165" y="270" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">f</text>
  <text x="215" y="270" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">f</text>
  <text x="265" y="270" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">f</text>
  <text x="315" y="270" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">f</text>
  <text x="365" y="270" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">f</text>
  <text x="415" y="270" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">f</text>
  <text x="465" y="270" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">f</text>

  <!-- result for -1 -->
  <path d="M 465 280 L 465 294" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="400" y="296" width="130" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="465" y="314" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">"ffffffff"</text>
  <text x="392" y="312" font-size="10" fill="#888">8 轮抠满</text>

  <!-- ===== formula box ===== -->
  <rect x="40" y="350" width="500" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="372" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">每轮：d = n &amp; 0xf  →  hex[d]；n &gt;&gt;= 4（无符号右移）；直到 n == 0</text>

  <!-- ===== key insight notes ===== -->
  <rect x="40" y="398" width="240" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="160" y="418" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">16 = 2⁴，hex 位对齐 4 bit</text>
  <text x="160" y="436" text-anchor="middle" font-size="10.5" fill="#555">位运算 &amp; 0xf 取代算术 % 16</text>
  <text x="160" y="450" text-anchor="middle" font-size="10.5" fill="#555">高效且天然兼容补码</text>

  <rect x="300" y="398" width="240" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="420" y="418" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">负数 = 无符号重解释</text>
  <text x="420" y="436" text-anchor="middle" font-size="10.5" fill="#555">int 位模式 → unsigned</text>
  <text x="420" y="450" text-anchor="middle" font-size="10.5" fill="#555">算术右移变逻辑右移，归零</text>
</svg>
