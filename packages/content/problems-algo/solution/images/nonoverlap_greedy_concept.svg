<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">贪心 + 前缀和：最早结束优先，命中即重置</text>

  <!-- nums row -->
  <text x="20" y="74" font-size="12" fill="#888">nums:</text>
  <rect x="80" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="78" text-anchor="middle" font-size="12" fill="#333">−1</text>
  <rect x="130" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="78" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="180" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="205" y="78" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="230" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="78" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="280" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="305" y="78" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="330" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="355" y="78" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="380" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="405" y="78" text-anchor="middle" font-size="12" fill="#333">−9</text>

  <text x="105" y="102" text-anchor="middle" font-size="9" fill="#aaa">i=0</text>
  <text x="155" y="102" text-anchor="middle" font-size="9" fill="#aaa">i=1</text>
  <text x="205" y="102" text-anchor="middle" font-size="9" fill="#aaa">i=2</text>
  <text x="255" y="102" text-anchor="middle" font-size="9" fill="#aaa">i=3</text>
  <text x="305" y="102" text-anchor="middle" font-size="9" fill="#aaa">i=4</text>
  <text x="355" y="102" text-anchor="middle" font-size="9" fill="#aaa">i=5</text>
  <text x="405" y="102" text-anchor="middle" font-size="9" fill="#aaa">i=6</text>

  <!-- prefix row -->
  <text x="20" y="146" font-size="12" fill="#888">prefix:</text>
  <rect x="30" y="130" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="150" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="80" y="130" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="150" text-anchor="middle" font-size="12" fill="#333">−1</text>
  <rect x="130" y="130" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="150" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="180" y="130" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="205" y="150" text-anchor="middle" font-size="12" fill="#333">7</text>
  <rect x="230" y="130" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="150" text-anchor="middle" font-size="12" fill="#333">8</text>
  <rect x="280" y="130" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="305" y="150" text-anchor="middle" font-size="12" fill="#333">12</text>
  <rect x="330" y="130" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="355" y="150" text-anchor="middle" font-size="12" fill="#333">14</text>
  <rect x="380" y="130" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="405" y="150" text-anchor="middle" font-size="12" fill="#333">5</text>

  <text x="55" y="176" text-anchor="middle" font-size="9" fill="#aaa">p[0]</text>
  <text x="105" y="176" text-anchor="middle" font-size="9" fill="#aaa">p[1]</text>
  <text x="155" y="176" text-anchor="middle" font-size="9" fill="#aaa">p[2]</text>
  <text x="205" y="176" text-anchor="middle" font-size="9" fill="#aaa">p[3]</text>
  <text x="255" y="176" text-anchor="middle" font-size="9" fill="#aaa">p[4]</text>
  <text x="305" y="176" text-anchor="middle" font-size="9" fill="#aaa">p[5]</text>
  <text x="355" y="176" text-anchor="middle" font-size="9" fill="#aaa">p[6]</text>
  <text x="405" y="176" text-anchor="middle" font-size="9" fill="#aaa">p[7]</text>

  <!-- Reset boundary at p[4] (x=255) -->
  <path d="M 255 128 L 255 300" stroke="#d6a040" stroke-width="2" fill="none" stroke-dasharray="4,4" filter="url(#rough2)"/>
  <text x="255" y="124" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">重置</text>

  <!-- Arc 1: [5,1] p[2]→p[4], selected -->
  <path d="M 155 188 Q 155 208 205 208 L 255 188" stroke="#4a7a3a" stroke-width="2.5" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="205" y="222" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">[5,1]→6 ✓ 选取①</text>

  <!-- Arc 2: [4,2] p[4]→p[6], selected -->
  <path d="M 255 188 Q 255 240 305 240 L 355 188" stroke="#4a7a3a" stroke-width="2.5" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="305" y="254" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">[4,2]→6 ✓ 选取②</text>

  <!-- Arc 3: [3,5,1,4,2,-9] p[1]→p[7], not selected (overlaps) -->
  <path d="M 105 188 Q 105 280 255 280 L 405 188" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="6,3" filter="url(#rough2)"/>
  <text x="255" y="294" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">[3,5,1,4,2,−9]→6 ✗ 跨越重置线，丢弃</text>

  <!-- Explanation box -->
  <rect x="30" y="306" width="460" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="328" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">贪心策略：发现和=target 的子数组立即选取，选完清空哈希表重置</text>
  <text x="260" y="346" text-anchor="middle" font-size="10.5" fill="#555">最早结束 → 后续可选空间最大 → 最优（交换论证）</text>
  <text x="260" y="360" text-anchor="middle" font-size="10" fill="#888">target=6，选取 2 个不重叠子数组，ans=2</text>
</svg>
