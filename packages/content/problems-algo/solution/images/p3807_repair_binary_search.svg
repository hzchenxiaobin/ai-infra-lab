<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">money 越大 → 可用边越多：可行性单调，可以二分</text>

  <!-- 左面板：money = 10，不可行 -->
  <rect x="26" y="52" width="232" height="312" rx="10" fill="#ffffff" stroke="#7a8aa0" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="142" y="76" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">money = 10 ✗</text>
  <text x="142" y="92" text-anchor="middle" font-size="10" fill="#7a8aa0" filter="url(#rough2)">示例 1（k=1）：只保留 w ≤ 10 的边</text>

  <!-- 边 0-1 / 1-2（可用） -->
  <g filter="url(#rough2)">
    <line x1="80" y1="272" x2="142" y2="140" stroke="#446688" stroke-width="2"/>
    <text x="97" y="206" font-size="11" fill="#33506b">10</text>
    <line x1="142" y1="140" x2="205" y2="272" stroke="#446688" stroke-width="2"/>
    <text x="184" y="206" font-size="11" fill="#33506b">10</text>
  </g>

  <!-- 边 0-2：被阈值禁用 -->
  <g filter="url(#rough2)">
    <line x1="80" y1="272" x2="205" y2="272" stroke="#b85450" stroke-width="2" stroke-dasharray="7 5"/>
    <line x1="135" y1="265" x2="149" y2="279" stroke="#b85450" stroke-width="2.5"/>
    <line x1="149" y1="265" x2="135" y2="279" stroke="#b85450" stroke-width="2.5"/>
    <text x="142" y="300" text-anchor="middle" font-size="10" fill="#b85450">100 &gt; money，禁用</text>
  </g>

  <!-- 节点 -->
  <g filter="url(#rough2)">
    <circle cx="80" cy="272" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="80" y="277" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold">0</text>
    <circle cx="142" cy="140" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="142" y="145" text-anchor="middle" font-size="12.5" fill="#33506b" font-weight="bold">1</text>
    <circle cx="205" cy="272" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="205" y="277" text-anchor="middle" font-size="12.5" fill="#33506b" font-weight="bold">2</text>
  </g>

  <text x="142" y="340" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">0→1→2 要 2 跳 &gt; k=1 ✗</text>

  <!-- 中间箭头 -->
  <text x="280" y="196" text-anchor="middle" font-size="11" fill="#8a6d1a" filter="url(#rough2)">money ↑</text>
  <path d="M 262 208 L 296 208" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 右面板：money = 100，可行 -->
  <rect x="302" y="52" width="232" height="312" rx="10" fill="#ffffff" stroke="#7a8aa0" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="418" y="76" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">money = 100 ✓</text>
  <text x="418" y="92" text-anchor="middle" font-size="10" fill="#7a8aa0" filter="url(#rough2)">示例 1（k=1）：w ≤ 100 的边全部可用</text>

  <g filter="url(#rough2)">
    <line x1="356" y1="272" x2="418" y2="140" stroke="#446688" stroke-width="2"/>
    <text x="373" y="206" font-size="11" fill="#33506b">10</text>
    <line x1="418" y1="140" x2="481" y2="272" stroke="#446688" stroke-width="2"/>
    <text x="460" y="206" font-size="11" fill="#33506b">10</text>
  </g>

  <!-- 直达边 0-2：可用 -->
  <g filter="url(#rough2)">
    <line x1="356" y1="272" x2="481" y2="272" stroke="#d6a040" stroke-width="3.2"/>
    <text x="418" y="262" text-anchor="middle" font-size="11.5" fill="#8a6d1a" font-weight="bold">100 ✓</text>
  </g>

  <g filter="url(#rough2)">
    <circle cx="356" cy="272" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="356" y="277" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold">0</text>
    <circle cx="418" cy="140" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="418" y="145" text-anchor="middle" font-size="12.5" fill="#33506b" font-weight="bold">1</text>
    <circle cx="481" cy="272" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
    <text x="481" y="277" text-anchor="middle" font-size="12.5" fill="#8a6d1a" font-weight="bold">2</text>
  </g>

  <text x="418" y="340" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">0→2 直达：1 跳 ≤ k=1 ✓</text>

  <!-- 底部说明 -->
  <g filter="url(#rough2)">
    <rect x="40" y="386" width="480" height="76" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="280" y="410" text-anchor="middle" font-size="11.5" fill="#8a6d1a">可行性 check 关于 money 单调：先全 ✗ 后全 ✓（0…01…1 结构）</text>
    <text x="280" y="430" text-anchor="middle" font-size="11" fill="#8a6d1a">答案必是某条边的边权 → 在去重排序的边权数组 W 上二分下标</text>
    <text x="280" y="450" text-anchor="middle" font-size="11" fill="#8a6d1a">第一个 ✓ 的 W[i] 即最小 money；全部 ✗（含最大边权）→ 返回 −1</text>
  </g>
</svg>
