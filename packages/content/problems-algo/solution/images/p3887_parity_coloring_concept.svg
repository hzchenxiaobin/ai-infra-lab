<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：环权全为偶 ⟺ 存在染色 f，使 f(u) ⊕ f(v) = w</text>

  <!-- ============ 左半：示例 1（拒绝） ============ -->
  <text x="140" y="54" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">示例 1：环和 = 3（奇）→ 拒绝</text>

  <!-- 边 -->
  <g filter="url(#rough2)">
    <path d="M 140 112 L 78 200" stroke="#446688" stroke-width="2" fill="none"/>
    <path d="M 78 200 L 202 200" stroke="#446688" stroke-width="2" fill="none"/>
    <path d="M 140 112 L 202 200" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="6 4"/>
  </g>
  <g filter="url(#rough2)" font-size="11" font-weight="bold" text-anchor="middle">
    <text x="94" y="146" fill="#446688">w=1</text>
    <text x="140" y="224" fill="#446688">w=1</text>
    <text x="192" y="146" fill="#b85450">w=1</text>
  </g>

  <!-- 节点 -->
  <g filter="url(#rough2)">
    <circle cx="140" cy="112" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <circle cx="78" cy="200" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="202" cy="200" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="140" y="117">0</text>
    <text x="78" y="205">1</text>
    <text x="202" y="205">2</text>
  </g>
  <g filter="url(#rough2)" font-size="10.5" fill="#666" text-anchor="middle">
    <text x="140" y="146">f=0</text>
    <text x="78" y="233">f=1</text>
    <text x="202" y="233">f=0</text>
  </g>
  <text x="140" y="180" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">1+1+1=3 奇 ✗</text>

  <g filter="url(#rough2)">
    <rect x="25" y="256" width="230" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="140" y="278" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">点 0、点 2 同为 f=0（同色）</text>
    <text x="140" y="298" text-anchor="middle" font-size="10.5" fill="#b85450">却要求权 1 的边相连 → 必生奇环</text>
  </g>

  <!-- ============ 右半：示例 2（接受） ============ -->
  <text x="420" y="54" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">示例 2：环和 = 2（偶）→ 接受</text>

  <!-- 边 -->
  <g filter="url(#rough2)">
    <path d="M 420 112 L 358 200" stroke="#446688" stroke-width="2" fill="none"/>
    <path d="M 358 200 L 482 200" stroke="#446688" stroke-width="2" fill="none"/>
    <path d="M 420 112 L 482 200" stroke="#4a7a3a" stroke-width="2" fill="none" stroke-dasharray="6 4"/>
  </g>
  <g filter="url(#rough2)" font-size="11" font-weight="bold" text-anchor="middle">
    <text x="374" y="146" fill="#446688">w=1</text>
    <text x="420" y="224" fill="#446688">w=1</text>
    <text x="472" y="146" fill="#2f5d24">w=0</text>
  </g>

  <!-- 节点 -->
  <g filter="url(#rough2)">
    <circle cx="420" cy="112" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <circle cx="358" cy="200" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="482" cy="200" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="420" y="117">0</text>
    <text x="358" y="205">1</text>
    <text x="482" y="205">2</text>
  </g>
  <g filter="url(#rough2)" font-size="10.5" fill="#666" text-anchor="middle">
    <text x="420" y="146">f=0</text>
    <text x="358" y="233">f=1</text>
    <text x="482" y="233">f=1</text>
  </g>
  <text x="420" y="180" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1+1+0=2 偶 ✓</text>

  <g filter="url(#rough2)">
    <rect x="305" y="256" width="230" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="420" y="278" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">权 0 连「同色」，权 1 连「异色」</text>
    <text x="420" y="298" text-anchor="middle" font-size="10.5" fill="#2f5d24">约束全部相容 → 染色存在 → 环全偶</text>
  </g>

  <!-- ============ 底部结论框 ============ -->
  <g filter="url(#rough2)">
    <rect x="26" y="336" width="508" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="357" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold">加边 (u, v, w) 合法 ⟺ 新约束 f(u) ⊕ f(v) = w 与已有约束相容</text>
    <text x="280" y="377" text-anchor="middle" font-size="10.5" fill="#33506b">带权并查集维护 d[x] = x 到根的路径权奇偶 —— 一次 find 即可判定</text>
  </g>
</svg>
