<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="12" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="900" height="480" fill="#fdfcf7"/>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">最短的桥：示例演算（grid = [[0,1,0],[0,0,0],[0,0,1]]）</text>
  <path d="M 300 40 Q 450 46 600 40" stroke="#888" stroke-width="1.2" fill="none" filter="url(#sk)"/>

  <!-- ===== State 1: step=0 (after DFS) ===== -->
  <text x="155" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#sk)">step = 0（DFS 后）</text>
  <g filter="url(#sk)" font-size="14">
    <rect x="80" y="82" width="50" height="50" fill="#fff" stroke="#bbb" rx="2"/><text x="105" y="113" text-anchor="middle" fill="#aaa">0</text>
    <rect x="130" y="82" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="2"/><text x="155" y="113" text-anchor="middle" fill="#335577" font-weight="bold">2</text>
    <rect x="180" y="82" width="50" height="50" fill="#fff" stroke="#bbb" rx="2"/><text x="205" y="113" text-anchor="middle" fill="#aaa">0</text>
    <rect x="80" y="132" width="50" height="50" fill="#fff" stroke="#bbb" rx="2"/><text x="105" y="163" text-anchor="middle" fill="#aaa">0</text>
    <rect x="130" y="132" width="50" height="50" fill="#fff" stroke="#bbb" rx="2"/><text x="155" y="163" text-anchor="middle" fill="#aaa">0</text>
    <rect x="180" y="132" width="50" height="50" fill="#fff" stroke="#bbb" rx="2"/><text x="205" y="163" text-anchor="middle" fill="#aaa">0</text>
    <rect x="80" y="182" width="50" height="50" fill="#fff" stroke="#bbb" rx="2"/><text x="105" y="213" text-anchor="middle" fill="#aaa">0</text>
    <rect x="130" y="182" width="50" height="50" fill="#fff" stroke="#bbb" rx="2"/><text x="155" y="213" text-anchor="middle" fill="#aaa">0</text>
    <rect x="180" y="182" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="2"/><text x="205" y="213" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>
  </g>
  <!-- Queue -->
  <g filter="url(#sk)">
    <rect x="84" y="248" width="142" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="155" y="265" text-anchor="middle" font-size="10" fill="#335577" filter="url(#sk)">queue = [(0,1)]</text>
  <text x="155" y="290" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">岛 A 入队，开始 BFS</text>

  <!-- Arrow -->
  <path d="M 236 157 L 292 157" stroke="#5a5a5a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="264" y="148" text-anchor="middle" font-size="9" fill="#888" filter="url(#sk)">扩展</text>

  <!-- ===== State 2: step=1 (layer 1 added) ===== -->
  <text x="400" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#sk)">step = 1（扩展第 1 层水）</text>
  <g filter="url(#sk)" font-size="14">
    <rect x="325" y="82" width="50" height="50" fill="#fff3e0" stroke="#d6a040" stroke-width="2" rx="2"/><text x="350" y="113" text-anchor="middle" fill="#8a6d3b" font-size="12">0→2</text>
    <rect x="375" y="82" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="2"/><text x="400" y="113" text-anchor="middle" fill="#335577" font-weight="bold">2</text>
    <rect x="425" y="82" width="50" height="50" fill="#fff3e0" stroke="#d6a040" stroke-width="2" rx="2"/><text x="450" y="113" text-anchor="middle" fill="#8a6d3b" font-size="12">0→2</text>
    <rect x="325" y="132" width="50" height="50" fill="#fff" stroke="#bbb" rx="2"/><text x="350" y="163" text-anchor="middle" fill="#aaa">0</text>
    <rect x="375" y="132" width="50" height="50" fill="#fff3e0" stroke="#d6a040" stroke-width="2" rx="2"/><text x="400" y="163" text-anchor="middle" fill="#8a6d3b" font-size="12">0→2</text>
    <rect x="425" y="132" width="50" height="50" fill="#fff" stroke="#bbb" rx="2"/><text x="450" y="163" text-anchor="middle" fill="#aaa">0</text>
    <rect x="325" y="182" width="50" height="50" fill="#fff" stroke="#bbb" rx="2"/><text x="350" y="213" text-anchor="middle" fill="#aaa">0</text>
    <rect x="375" y="182" width="50" height="50" fill="#fff" stroke="#bbb" rx="2"/><text x="400" y="213" text-anchor="middle" fill="#aaa">0</text>
    <rect x="425" y="182" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="2"/><text x="450" y="213" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>
  </g>
  <!-- Queue -->
  <g filter="url(#sk)">
    <rect x="329" y="248" width="142" height="26" rx="4" fill="#fff3e0" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="400" y="265" text-anchor="middle" font-size="9" fill="#8a6d3b" filter="url(#sk)">queue = [(0,0),(0,2),(1,1)]</text>
  <text x="400" y="290" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">3 个水格被标记入队</text>

  <!-- Arrow -->
  <path d="M 481 157 L 537 157" stroke="#5a5a5a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="509" y="148" text-anchor="middle" font-size="9" fill="#888" filter="url(#sk)">扩展</text>

  <!-- ===== State 3: step=2 (found island B) ===== -->
  <text x="645" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">step = 2（发现岛 B！）</text>
  <g filter="url(#sk)" font-size="14">
    <rect x="570" y="82" width="50" height="50" fill="#fff3e0" stroke="#d6a040" rx="2"/><text x="595" y="113" text-anchor="middle" fill="#8a6d3b" font-size="10">2</text>
    <rect x="620" y="82" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="2"/><text x="645" y="113" text-anchor="middle" fill="#335577" font-weight="bold">2</text>
    <rect x="670" y="82" width="50" height="50" fill="#fff3e0" stroke="#d6a040" rx="2"/><text x="695" y="113" text-anchor="middle" fill="#8a6d3b" font-size="10">2</text>
    <rect x="570" y="132" width="50" height="50" fill="#ffe0b2" stroke="#d6a040" stroke-width="2" rx="2"/><text x="595" y="163" text-anchor="middle" fill="#8a6d3b" font-size="12">0→2</text>
    <rect x="620" y="132" width="50" height="50" fill="#fff3e0" stroke="#d6a040" rx="2"/><text x="645" y="163" text-anchor="middle" fill="#8a6d3b" font-size="10">2</text>
    <rect x="670" y="132" width="50" height="50" fill="#ffe0b2" stroke="#d6a040" stroke-width="2" rx="2"/><text x="695" y="163" text-anchor="middle" fill="#8a6d3b" font-size="12">0→2</text>
    <rect x="570" y="182" width="50" height="50" fill="#fff" stroke="#bbb" rx="2"/><text x="595" y="213" text-anchor="middle" fill="#aaa">0</text>
    <rect x="620" y="182" width="50" height="50" fill="#ffe0b2" stroke="#d6a040" stroke-width="2" rx="2"/><text x="645" y="213" text-anchor="middle" fill="#8a6d3b" font-size="12">0→2</text>
    <rect x="670" y="182" width="50" height="50" fill="#e6f4ea" stroke="#b85450" stroke-width="3" rx="2"/><text x="695" y="213" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1★</text>
  </g>
  <!-- Discovery arrow: from (1,2) to (2,2) -->
  <path d="M 695 132 L 695 182" stroke="#b85450" stroke-width="2.5" stroke-dasharray="4 2" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="730" y="162" font-size="10" font-weight="bold" fill="#b85450" filter="url(#sk)">发现 1!</text>
  <!-- Result box -->
  <g filter="url(#sk)">
    <rect x="574" y="248" width="142" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="645" y="265" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">答案 = step = 2</text>
  <text x="645" y="290" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">翻转 2 个 0 即可连通</text>

  <!-- ===== Bottom: step-by-step explanation ===== -->
  <g filter="url(#sk)">
    <rect x="50" y="320" width="820" height="140" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="460" y="346" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">逐步解析</text>
  <g font-size="11" fill="#444">
    <text x="70" y="372" filter="url(#sk)"><tspan font-weight="bold" fill="#446688">step=0</tspan>：弹出 (0,1)，检查四邻居 → (0,0)=0、(0,2)=0、(1,1)=0 均为水</text>
    <text x="90" y="390" filter="url(#sk)">→ 标记为 2 并入队，step++ → 1</text>
    <text x="70" y="414" filter="url(#sk)"><tspan font-weight="bold" fill="#d6a040">step=1</tspan>：弹出 (0,0)、(0,2)、(1,1)，各检查四邻居 → (1,0)=0、(1,2)=0、(2,1)=0 均为水</text>
    <text x="90" y="432" filter="url(#sk)">→ 标记为 2 并入队，step++ → 2</text>
    <text x="70" y="456" filter="url(#sk)"><tspan font-weight="bold" fill="#4a7a3a">step=2</tspan>：弹出 (1,2)，检查邻居 (2,2)=<tspan font-weight="bold" fill="#b85450">1</tspan> → 命中岛 B！返回 step = <tspan font-weight="bold" fill="#b85450">2</tspan></text>
  </g>
</svg>
