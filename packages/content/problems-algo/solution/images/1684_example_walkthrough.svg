<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    示例演算：allowed = "cad"，mask = 0b1101 = 13
  </text>

  <!-- header row -->
  <rect x="40" y="50" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="69" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">word</text>
  <rect x="124" y="50" width="160" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="204" y="69" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">w_mask（二进制 = 十进制）</text>
  <rect x="288" y="50" width="100" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="338" y="69" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">w_mask &amp; ~mask</text>
  <rect x="392" y="50" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="422" y="69" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">一致?</text>
  <rect x="456" y="50" width="64" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="488" y="69" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">滚动 ans</text>

  <!-- Row: "cc" -> 0b0100=4, 0, yes, 1 -->
  <rect x="40" y="84" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">"cc"</text>
  <rect x="124" y="84" width="160" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="204" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0b0100 = 4</text>
  <rect x="288" y="84" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="338" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="392" y="84" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="422" y="102" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <rect x="456" y="84" width="64" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="488" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1 ← 新</text>

  <!-- Row: "acd" -> 0b1101=13, 0, yes, 2 -->
  <rect x="40" y="114" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">"acd"</text>
  <rect x="124" y="114" width="160" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="204" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0b1101 = 13</text>
  <rect x="288" y="114" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="338" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="392" y="114" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="422" y="132" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <rect x="456" y="114" width="64" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="488" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2 ← 新</text>

  <!-- Row: "b" -> 0b0010=2, 2, no, 2 -->
  <rect x="40" y="144" width="80" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="162" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">"b"</text>
  <rect x="124" y="144" width="160" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="204" y="162" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0b0010 = 2</text>
  <rect x="288" y="144" width="100" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="338" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">2</text>
  <rect x="392" y="144" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="422" y="162" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">✗</text>
  <rect x="456" y="144" width="64" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="488" y="162" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">2</text>

  <!-- Row: "ba" -> 0b0011=3, 2, no, 2 -->
  <rect x="40" y="174" width="80" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="192" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">"ba"</text>
  <rect x="124" y="174" width="160" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="204" y="192" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0b0011 = 3</text>
  <rect x="288" y="174" width="100" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="338" y="192" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">2</text>
  <rect x="392" y="174" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="422" y="192" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">✗</text>
  <rect x="456" y="174" width="64" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="488" y="192" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">2</text>

  <!-- Row: "bac" -> 0b0111=7, 2, no, 2 -->
  <rect x="40" y="204" width="80" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="222" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">"bac"</text>
  <rect x="124" y="204" width="160" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="204" y="222" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0b0111 = 7</text>
  <rect x="288" y="204" width="100" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="338" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">2</text>
  <rect x="392" y="204" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="422" y="222" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">✗</text>
  <rect x="456" y="204" width="64" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="488" y="222" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">2</text>

  <!-- Row: "bad" -> 0b1011=11, 2, no, 2 -->
  <rect x="40" y="234" width="80" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="252" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">"bad"</text>
  <rect x="124" y="234" width="160" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="204" y="252" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0b1011 = 11</text>
  <rect x="288" y="234" width="100" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="338" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">2</text>
  <rect x="392" y="234" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="422" y="252" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">✗</text>
  <rect x="456" y="234" width="64" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="488" y="252" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">2</text>

  <!-- Row: "ac" -> 0b0101=5, 0, yes, 3 -->
  <rect x="40" y="264" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="282" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">"ac"</text>
  <rect x="124" y="264" width="160" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="204" y="282" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0b0101 = 5</text>
  <rect x="288" y="264" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="338" y="282" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="392" y="264" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="422" y="282" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <rect x="456" y="264" width="64" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="488" y="282" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3 ← 新</text>

  <!-- answer row -->
  <rect x="40" y="294" width="412" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="0" rx="4" filter="url(#rough2)"/>
  <path d="M488,290 L488,300" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="456" y="294" width="64" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="488" y="310" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">4 ✓</text>
  <text x="246" y="310" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">
    含 b 的词一次位与即被排除（~mask 中 bit 1 = 1）
  </text>
</svg>
