<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：26 字母频次表 + 上升 a→z / 下降 z→a 来回扫描</text>
  <text x="320" y="46" text-anchor="middle" font-size="11" fill="#888">s 只含小写字母 ⇒ 压成 freq[26]，挑字符 = 在 26 格上来回扫，O(|Σ|·n)</text>

  <!-- ====== Row 1: frequency table (26 cells, show a..z compressed) ====== -->
  <text x="110" y="92" text-anchor="end" font-size="12" fill="#d6a040" font-weight="bold">freq</text>
  <text x="110" y="106" text-anchor="end" font-size="10" fill="#888">26 格</text>

  <!-- a b c filled, others sketchy -->
  <g font-size="14">
    <rect x="124" y="78" width="40" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="144" y="96" text-anchor="middle" font-size="9" fill="#888">a</text>
    <text x="144" y="111" text-anchor="middle" fill="#d6a040" font-weight="bold">4</text>

    <rect x="166" y="78" width="40" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="186" y="96" text-anchor="middle" font-size="9" fill="#888">b</text>
    <text x="186" y="111" text-anchor="middle" fill="#d6a040" font-weight="bold">4</text>

    <rect x="208" y="78" width="40" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="228" y="96" text-anchor="middle" font-size="9" fill="#888">c</text>
    <text x="228" y="111" text-anchor="middle" fill="#d6a040" font-weight="bold">4</text>

    <rect x="250" y="78" width="40" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="270" y="96" text-anchor="middle" font-size="9" fill="#bbb">d</text>
    <text x="270" y="111" text-anchor="middle" fill="#ccc">0</text>

    <rect x="292" y="78" width="40" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="312" y="96" text-anchor="middle" font-size="9" fill="#bbb">e</text>
    <text x="312" y="111" text-anchor="middle" fill="#ccc">0</text>

    <rect x="334" y="78" width="40" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="354" y="96" text-anchor="middle" font-size="9" fill="#bbb">…</text>

    <rect x="376" y="78" width="40" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="396" y="96" text-anchor="middle" font-size="9" fill="#bbb">x</text>
    <text x="396" y="111" text-anchor="middle" fill="#ccc">0</text>

    <rect x="418" y="78" width="40" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="438" y="96" text-anchor="middle" font-size="9" fill="#bbb">y</text>
    <text x="438" y="111" text-anchor="middle" fill="#ccc">0</text>

    <rect x="460" y="78" width="40" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="480" y="96" text-anchor="middle" font-size="9" fill="#bbb">z</text>
    <text x="480" y="111" text-anchor="middle" fill="#ccc">0</text>
  </g>

  <!-- arrow down to scan row -->
  <path d="M 320 126 L 320 144" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="330" y="140" font-size="10" fill="#666">每轮 = 上升段 + 下降段</text>

  <!-- ====== Row 2: upward scan a→z ====== -->
  <text x="60" y="172" font-size="12" fill="#446688" font-weight="bold">上升段</text>
  <text x="60" y="186" font-size="10" fill="#888">a → z</text>
  <!-- scan arrow from a to c -->
  <path d="M 144 158 L 228 158" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="144" y="152" font-size="10" fill="#446688">a</text>
  <text x="186" y="152" font-size="10" fill="#446688">b</text>
  <text x="228" y="152" font-size="10" fill="#446688">c</text>

  <!-- taken chars -->
  <text x="500" y="172" font-size="12" fill="#446688" font-weight="bold">取走：</text>
  <g font-size="15">
    <rect x="540" y="158" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="555" y="178" text-anchor="middle" fill="#446688" font-weight="bold">a</text>
    <rect x="572" y="158" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="587" y="178" text-anchor="middle" fill="#446688" font-weight="bold">b</text>
    <rect x="604" y="158" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="619" y="178" text-anchor="middle" fill="#446688" font-weight="bold">c</text>
  </g>

  <!-- ====== Row 3: downward scan z→a ====== -->
  <text x="60" y="226" font-size="12" fill="#b85450" font-weight="bold">下降段</text>
  <text x="60" y="240" font-size="10" fill="#888">z → a</text>
  <!-- scan arrow from c to a (reverse) -->
  <path d="M 228 232 L 144 232" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="144" y="248" font-size="10" fill="#b85450">a</text>
  <text x="186" y="248" font-size="10" fill="#b85450">b</text>
  <text x="228" y="248" font-size="10" fill="#b85450">c</text>

  <!-- taken chars -->
  <text x="500" y="226" font-size="12" fill="#b85450" font-weight="bold">取走：</text>
  <g font-size="15">
    <rect x="540" y="212" width="30" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="555" y="232" text-anchor="middle" fill="#b85450" font-weight="bold">c</text>
    <rect x="572" y="212" width="30" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="587" y="232" text-anchor="middle" fill="#b85450" font-weight="bold">b</text>
    <rect x="604" y="212" width="30" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="619" y="232" text-anchor="middle" fill="#b85450" font-weight="bold">a</text>
  </g>

  <!-- arrow down to result of one round -->
  <path d="M 320 256 L 320 276" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="330" y="272" font-size="10" fill="#666">一轮产出 = 上升 + 下降</text>

  <!-- ====== Row 4: one round result ====== -->
  <text x="60" y="304" font-size="12" fill="#4a7a3a" font-weight="bold">第 1 轮</text>
  <text x="60" y="318" font-size="10" fill="#888">result</text>
  <g font-size="15">
    <rect x="180" y="288" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="197" y="310" text-anchor="middle" fill="#446688" font-weight="bold">a</text>
    <rect x="216" y="288" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="233" y="310" text-anchor="middle" fill="#446688" font-weight="bold">b</text>
    <rect x="252" y="288" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="269" y="310" text-anchor="middle" fill="#446688" font-weight="bold">c</text>
    <rect x="288" y="288" width="34" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="305" y="310" text-anchor="middle" fill="#b85450" font-weight="bold">c</text>
    <rect x="324" y="288" width="34" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="341" y="310" text-anchor="middle" fill="#b85450" font-weight="bold">b</text>
    <rect x="360" y="288" width="34" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="377" y="310" text-anchor="middle" fill="#b85450" font-weight="bold">a</text>
  </g>
  <text x="197" y="284" font-size="9" fill="#446688">↑上升</text>
  <text x="338" y="284" font-size="9" fill="#b85450">下降↑</text>

  <!-- loop indicator -->
  <path d="M 410 305 C 470 305 470 305 470 305" stroke="#666" stroke-width="1.4" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <text x="430" y="298" font-size="10" fill="#666">反复轮询</text>
  <text x="430" y="320" font-size="10" fill="#666">直到 freq 全 0</text>

  <!-- bottom note -->
  <rect x="40" y="350" width="560" height="92" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="374" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">字符只 26 种 ⇒ 压成 freq[26]，「挑最小/最大」退化为指针来回扫</text>
  <text x="320" y="394" text-anchor="middle" font-size="11" fill="#666">上升段 a→z：遇到 freq&gt;0 取一个，等价「每步取比上一个大一档的最小字符」</text>
  <text x="320" y="412" text-anchor="middle" font-size="11" fill="#666">下降段 z→a：遇到 freq&gt;0 取一个，等价「每步取比上一个小一档的最大字符」</text>
  <text x="320" y="430" text-anchor="middle" font-size="10" fill="#888">两段合为一轮，反复直到 |result| == |s|，整体 O(|Σ|·n)，|Σ|=26 为常数</text>
</svg>
