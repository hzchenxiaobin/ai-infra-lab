<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1,2,4], k = 5</text>

  <!-- ===== Step 1: right=0 ===== -->
  <text x="310" y="54" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">步骤 1：right=0，窗口 [1]</text>

  <g filter="url(#rough2)">
    <rect x="180" y="62" width="50" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="205" y="83" text-anchor="middle" font-size="13" fill="#333">1</text>
    <rect x="234" y="62" width="50" height="32" fill="#fafafa" stroke="#ccc" stroke-width="0.8" rx="4"/>
    <text x="259" y="83" text-anchor="middle" font-size="13" fill="#ccc">2</text>
    <rect x="288" y="62" width="50" height="32" fill="#fafafa" stroke="#ccc" stroke-width="0.8" rx="4"/>
    <text x="313" y="83" text-anchor="middle" font-size="13" fill="#ccc">4</text>
  </g>
  <text x="310" y="108" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">s=1，代价 = 1×1 − 1 = 0 ≤ 5 ✓ → ans=1</text>

  <path d="M310 116 L310 132" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- ===== Step 2: right=1 ===== -->
  <text x="310" y="148" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">步骤 2：right=1，窗口 [1,2]</text>

  <g filter="url(#rough2)">
    <rect x="180" y="156" width="50" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="205" y="177" text-anchor="middle" font-size="13" fill="#333">1</text>
    <rect x="234" y="156" width="50" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="259" y="177" text-anchor="middle" font-size="13" fill="#333">2</text>
    <rect x="288" y="156" width="50" height="32" fill="#fafafa" stroke="#ccc" stroke-width="0.8" rx="4"/>
    <text x="313" y="177" text-anchor="middle" font-size="13" fill="#ccc">4</text>
  </g>
  <text x="310" y="202" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">s=3，代价 = 2×2 − 3 = 1 ≤ 5 ✓ → ans=2</text>

  <path d="M310 210 L310 226" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- ===== Step 3: right=2 ===== -->
  <text x="310" y="242" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">步骤 3：right=2，窗口 [1,2,4]，目标=4</text>

  <g filter="url(#rough2)">
    <rect x="180" y="250" width="50" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="205" y="271" text-anchor="middle" font-size="13" fill="#333">1</text>
    <rect x="234" y="250" width="50" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="259" y="271" text-anchor="middle" font-size="13" fill="#333">2</text>
    <rect x="288" y="250" width="50" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="313" y="271" text-anchor="middle" font-size="13" fill="#333">4</text>
  </g>

  <!-- raise arrows + target row -->
  <path d="M205 286 L205 300" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <path d="M259 286 L259 300" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="190" y="296" text-anchor="middle" font-size="8" fill="#d6a040" filter="url(#rough2)">+3</text>
  <text x="244" y="296" text-anchor="middle" font-size="8" fill="#d6a040" filter="url(#rough2)">+2</text>

  <g filter="url(#rough2)">
    <rect x="180" y="306" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="205" y="325" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4</text>
    <rect x="234" y="306" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="259" y="325" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4</text>
    <rect x="288" y="306" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="313" y="325" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4</text>
  </g>

  <text x="310" y="350" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">s=7，代价 = 4×3 − 7 = 5 ≤ 5 ✓ → ans=3</text>

  <!-- Summary box -->
  <rect x="120" y="366" width="380" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="310" y="386" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">最终结果：ans = 3</text>
  <text x="310" y="402" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">代价 (4−1)+(4−2)+(4−4) = 3+2+0 = 5 = k，恰好用尽预算</text>

  <text x="310" y="430" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">红色框 = 当前窗口 ｜ 绿色框 = 抬升后的目标值</text>
</svg>
