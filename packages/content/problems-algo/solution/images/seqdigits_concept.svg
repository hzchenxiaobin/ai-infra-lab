<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">顺次数：固定 36 个候选（与 low/high 无关）</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">枚举 (位数 L, 首位 d)，约束 d + L − 1 ≤ 9 → 天然三角阵</text>

  <!-- 左侧 位数 轴标签 -->
  <text x="56" y="80" font-size="11" fill="#888" font-weight="bold">位数 L</text>

  <!-- L=2 -->
  <text x="58" y="81" font-size="11" fill="#888">L=2</text>
  <rect x="170" y="64" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="81" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">12</text>
  <rect x="210" y="64" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="81" text-anchor="middle" font-size="12" fill="#446688">23</text>
  <rect x="250" y="64" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="270" y="81" text-anchor="middle" font-size="12" fill="#446688">34</text>
  <rect x="290" y="64" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="310" y="81" text-anchor="middle" font-size="12" fill="#446688">45</text>
  <rect x="330" y="64" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="350" y="81" text-anchor="middle" font-size="12" fill="#446688">56</text>
  <rect x="370" y="64" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="390" y="81" text-anchor="middle" font-size="12" fill="#446688">67</text>
  <rect x="410" y="64" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="430" y="81" text-anchor="middle" font-size="12" fill="#446688">78</text>
  <rect x="450" y="64" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="470" y="81" text-anchor="middle" font-size="12" fill="#446688">89</text>

  <!-- L=3 -->
  <text x="58" y="115" font-size="11" fill="#888">L=3</text>
  <rect x="162" y="98" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="186" y="115" text-anchor="middle" font-size="12" fill="#446688">123</text>
  <rect x="210" y="98" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="234" y="115" text-anchor="middle" font-size="12" fill="#446688">234</text>
  <rect x="258" y="98" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="282" y="115" text-anchor="middle" font-size="12" fill="#446688">345</text>
  <rect x="306" y="98" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="330" y="115" text-anchor="middle" font-size="12" fill="#446688">456</text>
  <rect x="354" y="98" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="378" y="115" text-anchor="middle" font-size="12" fill="#446688">567</text>
  <rect x="402" y="98" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="426" y="115" text-anchor="middle" font-size="12" fill="#446688">678</text>
  <rect x="450" y="98" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="474" y="115" text-anchor="middle" font-size="12" fill="#446688">789</text>

  <!-- L=4 -->
  <text x="58" y="149" font-size="11" fill="#888">L=4</text>
  <rect x="162" y="132" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="149" text-anchor="middle" font-size="12" fill="#446688">1234</text>
  <rect x="218" y="132" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="246" y="149" text-anchor="middle" font-size="12" fill="#446688">2345</text>
  <rect x="274" y="132" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="302" y="149" text-anchor="middle" font-size="12" fill="#446688">3456</text>
  <rect x="330" y="132" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="358" y="149" text-anchor="middle" font-size="12" fill="#446688">4567</text>
  <rect x="386" y="132" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="414" y="149" text-anchor="middle" font-size="12" fill="#446688">5678</text>
  <rect x="442" y="132" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="470" y="149" text-anchor="middle" font-size="12" fill="#446688">6789</text>

  <!-- L=5 -->
  <text x="58" y="183" font-size="11" fill="#888">L=5</text>
  <rect x="170" y="166" width="64" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="202" y="183" text-anchor="middle" font-size="12" fill="#446688">12345</text>
  <rect x="234" y="166" width="64" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="266" y="183" text-anchor="middle" font-size="12" fill="#446688">23456</text>
  <rect x="298" y="166" width="64" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="330" y="183" text-anchor="middle" font-size="12" fill="#446688">34567</text>
  <rect x="362" y="166" width="64" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="394" y="183" text-anchor="middle" font-size="12" fill="#446688">45678</text>
  <rect x="426" y="166" width="64" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="458" y="183" text-anchor="middle" font-size="12" fill="#446688">56789</text>

  <!-- L=6 -->
  <text x="58" y="217" font-size="11" fill="#888">L=6</text>
  <rect x="186" y="200" width="72" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="222" y="217" text-anchor="middle" font-size="12" fill="#446688">123456</text>
  <rect x="258" y="200" width="72" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="294" y="217" text-anchor="middle" font-size="12" fill="#446688">234567</text>
  <rect x="330" y="200" width="72" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="366" y="217" text-anchor="middle" font-size="12" fill="#446688">345678</text>
  <rect x="402" y="200" width="72" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="438" y="217" text-anchor="middle" font-size="12" fill="#446688">456789</text>

  <!-- L=7 -->
  <text x="58" y="251" font-size="11" fill="#888">L=7</text>
  <rect x="210" y="234" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="251" text-anchor="middle" font-size="12" fill="#446688">1234567</text>
  <rect x="290" y="234" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="330" y="251" text-anchor="middle" font-size="12" fill="#446688">2345678</text>
  <rect x="370" y="234" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="410" y="251" text-anchor="middle" font-size="12" fill="#446688">3456789</text>

  <!-- L=8 -->
  <text x="58" y="285" font-size="11" fill="#888">L=8</text>
  <rect x="242" y="268" width="88" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="286" y="285" text-anchor="middle" font-size="12" fill="#446688">12345678</text>
  <rect x="330" y="268" width="88" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="374" y="285" text-anchor="middle" font-size="12" fill="#446688">23456789</text>

  <!-- L=9 -->
  <text x="58" y="319" font-size="11" fill="#888">L=9</text>
  <rect x="282" y="302" width="96" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="330" y="319" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">123456789</text>

  <!-- 三角形虚线轮廓 -->
  <path d="M 170 64 L 490 64 L 282 328 Z" stroke="#bbb" stroke-width="1" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>

  <!-- 标注 最小 / 最大 -->
  <text x="190" y="56" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">最小 12</text>
  <text x="330" y="340" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">最大 123456789</text>

  <!-- 右侧计数公式 -->
  <rect x="470" y="350" width="120" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="530" y="370" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">总数</text>
  <text x="530" y="388" text-anchor="middle" font-size="11" fill="#555">8+7+6+5+4</text>
  <text x="530" y="404" text-anchor="middle" font-size="11" fill="#555">+3+2+1 = 36</text>

  <!-- 底部说明 -->
  <rect x="30" y="350" width="350" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="205" y="372" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">先枚举全部 36 个候选，再过滤 [low, high]</text>
  <text x="205" y="392" text-anchor="middle" font-size="11" fill="#666">候选集合固定且极小（仅 36 个），与 low/high 无关</text>
  <text x="205" y="406" text-anchor="middle" font-size="10.5" fill="#888">→ 无需遍历区间，O(36) = O(1) 直接生成</text>
</svg>
