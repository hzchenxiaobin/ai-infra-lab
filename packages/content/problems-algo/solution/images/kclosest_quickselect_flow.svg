<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">快速选择 QuickSelect 流程（Hoare 划分）</text>

  <!-- Start -->
  <ellipse cx="270" cy="62" rx="110" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="12" fill="#333">quickSelect(lo, hi, k)</text>

  <path d="M 270 82 L 270 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: lo >= hi? -->
  <polygon points="270,104 380,150 270,196 160,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="146" text-anchor="middle" font-size="12" fill="#333">lo ≥ hi ?</text>
  <text x="270" y="162" text-anchor="middle" font-size="11" fill="#666">(区间长度 ≤ 1)</text>

  <!-- Yes -> return -->
  <path d="M 160 150 L 100 150" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="132" y="142" text-anchor="middle" font-size="11" fill="#82b366">是</text>
  <ellipse cx="58" cy="150" rx="44" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="58" y="154" text-anchor="middle" font-size="11" fill="#333">返回（已定）</text>

  <!-- No down -->
  <path d="M 270 196 L 270 214" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="210" font-size="11" fill="#b85450">否</text>

  <!-- Partition step -->
  <rect x="120" y="216" width="300" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="238" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">划分：pivot = dist(pts[lo])</text>
  <text x="270" y="256" text-anchor="middle" font-size="11" fill="#666">双指针 i/j 收拢交换，使 [lo..j] ≤ pivot，[j+1..hi] ≥ pivot</text>

  <path d="M 270 272 L 270 290" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Compute leftLen -->
  <rect x="150" y="292" width="240" height="40" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="270" y="316" text-anchor="middle" font-size="12" fill="#444">leftLen = j − lo + 1</text>

  <path d="M 270 332 L 270 350" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Three-way decision -->
  <polygon points="270,354 420,404 270,454 120,404" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="398" text-anchor="middle" font-size="12" fill="#333">k 与 leftLen 的关系</text>

  <!-- left: k < leftLen -->
  <path d="M 120 404 L 70 404" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="14" y="384" width="58" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="43" y="402" text-anchor="middle" font-size="10" fill="#333">k &lt; leftLen</text>
  <text x="43" y="416" text-anchor="middle" font-size="9" fill="#888">递归左</text>

  <!-- middle: k == leftLen -->
  <path d="M 270 454 L 270 462" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- right: k > leftLen -->
  <path d="M 420 404 L 470 404" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="468" y="384" width="62" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="499" y="402" text-anchor="middle" font-size="10" fill="#333">k &gt; leftLen</text>
  <text x="499" y="416" text-anchor="middle" font-size="9" fill="#888">递归右 k−leftLen</text>

  <!-- loop back arrows -->
  <path d="M 43 384 L 43 62 L 160 62" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 499 384 L 499 62 L 380 62" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- done annotation under middle -->
  <text x="270" y="466" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">k == leftLen → 完成，前 k 个即答案</text>
</svg>
