<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 390"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrC" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="390" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：GCD 归约 —— 把「整除所有」塌缩成「整除一个」</text>

  <!-- numsDivide cells -->
  <text x="120" y="64" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">numsDivide</text>
  <rect x="40" y="70" width="42" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="61" y="90" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>
  <rect x="86" y="70" width="42" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="107" y="90" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <rect x="132" y="70" width="42" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="153" y="90" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>
  <rect x="178" y="70" width="42" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="199" y="90" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="224" y="70" width="42" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="245" y="90" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">15</text>

  <!-- arrow to GCD -->
  <path d="M150,102 L150,128" stroke="#446688" stroke-width="1.6" marker-end="url(#arrC)" fill="none" filter="url(#rough2)"/>
  <text x="172" y="120" font-size="10" fill="#446688" filter="url(#rough2)">逐个 gcd</text>

  <!-- GCD box -->
  <rect x="100" y="132" width="100" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="150" y="158" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">g = gcd = 3</text>

  <!-- equivalence box -->
  <rect x="40" y="190" width="220" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="150" y="212" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">x 整除 numsDivide 所有元素</text>
  <text x="150" y="232" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">⟺</text>
  <text x="150" y="252" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">x 整除 g（即 g % x == 0）</text>

  <!-- divider -->
  <line x1="290" y1="56" x2="290" y2="320" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- right side: sorted nums scan -->
  <text x="430" y="64" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">nums 升序排序</text>
  <rect x="312" y="70" width="38" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="331" y="90" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">2</text>
  <rect x="354" y="70" width="38" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="373" y="90" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">2</text>
  <rect x="396" y="70" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="415" y="90" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="438" y="70" width="38" height="30" fill="#f4f8ff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="457" y="90" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="480" y="70" width="38" height="30" fill="#f4f8ff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="499" y="90" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>

  <!-- check marks under cells -->
  <text x="331" y="116" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">3%2=1 ✗</text>
  <text x="373" y="116" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">3%2=1 ✗</text>
  <text x="415" y="116" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3%3=0 ✓</text>
  <text x="457" y="116" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">命中即停</text>

  <!-- index bracket -->
  <path d="M312,124 L312,138 L434,138 L434,124" stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="373" y="154" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">前 2 个必须删除（&lt; 命中值）</text>

  <!-- arrow down to result -->
  <path d="M415,160 L415,188" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>

  <!-- result box -->
  <rect x="320" y="192" width="190" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="415" y="214" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">删除次数 = 命中下标</text>
  <text x="415" y="236" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">= 2 ✓</text>

  <!-- bottom takeaway -->
  <rect x="40" y="300" width="480" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">直觉：「逐个验证 x 能否整除 numsDivide 每个元素」= O(n·m)</text>
  <text x="280" y="344" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">归约：先算 g = gcd(numsDivide)，验证降为 O(1)，整体 O(n log n)</text>
  <text x="280" y="360" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">（g 是所有元素的公因子，整除 g 当且仅当整除每一个）</text>
</svg>
