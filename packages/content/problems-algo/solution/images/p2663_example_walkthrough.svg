<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "abcz", k = 26 → "abda"</text>

  <!-- table header -->
  <rect x="20" y="44" width="540" height="28" fill="#446688" rx="4" filter="url(#rough2)"/>
  <text x="55" y="63" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">步</text>
  <text x="170" y="63" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">考察位置 i</text>
  <text x="300" y="63" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">尝试增大</text>
  <text x="420" y="63" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">合法性检查</text>
  <text x="515" y="63" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">结果</text>

  <line x1="90" y1="44" x2="90" y2="206" stroke="#fff" stroke-width="1" filter="url(#rough2)"/>
  <line x1="250" y1="44" x2="250" y2="206" stroke="#fff" stroke-width="1" filter="url(#rough2)"/>
  <line x1="360" y1="44" x2="360" y2="206" stroke="#fff" stroke-width="1" filter="url(#rough2)"/>
  <line x1="480" y1="44" x2="480" y2="206" stroke="#fff" stroke-width="1" filter="url(#rough2)"/>

  <!-- row i=3 -->
  <rect x="20" y="72" width="540" height="30" fill="#fce4ec" rx="0" filter="url(#rough2)"/>
  <text x="55" y="91" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="170" y="91" text-anchor="middle" font-size="10" fill="#555">i=3 (z)</text>
  <text x="300" y="91" text-anchor="middle" font-size="10" fill="#555">z→？（已最大）</text>
  <text x="420" y="91" text-anchor="middle" font-size="10" fill="#b85450">无更大字母</text>
  <text x="515" y="91" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">✗ 左移</text>

  <!-- row i=2 -->
  <rect x="20" y="102" width="540" height="30" fill="#e6f4ea" rx="0" filter="url(#rough2)"/>
  <text x="55" y="121" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="170" y="121" text-anchor="middle" font-size="10" fill="#555">i=2 (c)</text>
  <text x="300" y="121" text-anchor="middle" font-size="10" fill="#555">试 d,e,f…</text>
  <text x="420" y="121" text-anchor="middle" font-size="10" fill="#4a7a3a">d≠b(前1) d≠a(前2)</text>
  <text x="515" y="121" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓ 定位</text>

  <line x1="20" y1="132" x2="560" y2="132" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- row fill -->
  <rect x="20" y="132" width="540" height="30" fill="#fff8e1" rx="4" filter="url(#rough2)"/>
  <text x="55" y="151" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="170" y="151" text-anchor="middle" font-size="10" fill="#555">i+1=3 待填</text>
  <text x="300" y="151" text-anchor="middle" font-size="10" fill="#555">试 a,b,c…</text>
  <text x="420" y="151" text-anchor="middle" font-size="10" fill="#4a7a3a">a≠d(前1) a≠b(前2)</text>
  <text x="515" y="151" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓ 填 a</text>

  <!-- summary -->
  <rect x="20" y="162" width="540" height="44" fill="#fce4ec" rx="4" filter="url(#rough2)"/>
  <text x="290" y="180" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">公共前缀 "ab" + 增大点 'd' + 贪心填 'a'</text>
  <text x="290" y="198" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">"abda" 既是美丽串又 &gt; "abcz" 且字典序最小 ✓</text>

  <!-- before/after string visual -->
  <text x="290" y="232" text-anchor="middle" font-size="11" fill="#888">改造过程可视化</text>

  <!-- original s = abcz -->
  <g filter="url(#rough2)">
    <rect x="120" y="248" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="140" y="274" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>
    <rect x="164" y="248" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="184" y="274" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">b</text>
    <rect x="208" y="248" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="228" y="274" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">c</text>
    <rect x="252" y="248" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="272" y="274" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">z</text>
    <text x="170" y="306" text-anchor="middle" font-size="10" fill="#888">原串 s = "abcz"</text>
  </g>

  <!-- arrow down -->
  <path d="M 206 312 L 206 328" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="260" y="324" font-size="9" fill="#888">i=2 增 c→d，i=3 填 a</text>

  <!-- result abda -->
  <g filter="url(#rough2)">
    <rect x="120" y="332" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="140" y="358" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>
    <rect x="164" y="332" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="184" y="358" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">b</text>
    <rect x="208" y="332" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <text x="228" y="358" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">d</text>
    <rect x="252" y="332" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <text x="272" y="358" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>
    <text x="170" y="390" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">结果 = "abda"</text>
  </g>

  <!-- right side: why no palindrome -->
  <rect x="320" y="248" width="240" height="124" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="440" y="270" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">"abda" 美丽性验证</text>
  <text x="335" y="290" font-size="10" fill="#555">相邻对：ab bd da → 全不同 ✓</text>
  <text x="335" y="308" font-size="10" fill="#555">相隔2：ad ba → 全不同 ✓</text>
  <text x="335" y="326" font-size="10" fill="#555">无 len2/len3 回文 ⟹ 全美丽 ✓</text>
  <text x="335" y="350" font-size="10" fill="#4a7a3a" font-weight="bold">且首差位 i=2：d&gt;c ✓</text>
</svg>
