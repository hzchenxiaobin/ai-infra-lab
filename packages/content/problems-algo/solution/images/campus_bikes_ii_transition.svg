<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">状压 DP：用 bitmask 记录已分配的自行车</text>

  <!-- ===== Top: mask concept ===== -->
  <rect x="30" y="44" width="500" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>

  <text x="50" y="66" font-size="11" fill="#446688" font-weight="bold">状态 mask（m 位二进制）：</text>

  <!-- Bit cells: B3 B2 B1 B0 -->
  <g filter="url(#rough2)">
    <rect x="200" y="52" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="220" y="70" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
    <rect x="240" y="52" width="40" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1.5" rx="4"/>
    <text x="260" y="70" text-anchor="middle" font-size="12" fill="#ccc" font-weight="bold">0</text>
    <rect x="280" y="52" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="300" y="70" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
    <rect x="320" y="52" width="40" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1.5" rx="4"/>
    <text x="340" y="70" text-anchor="middle" font-size="12" fill="#ccc" font-weight="bold">0</text>
  </g>

  <text x="220" y="100" text-anchor="middle" font-size="9" fill="#d6a040">B3 ✓</text>
  <text x="260" y="100" text-anchor="middle" font-size="9" fill="#aaa">B2</text>
  <text x="300" y="100" text-anchor="middle" font-size="9" fill="#d6a040">B1 ✓</text>
  <text x="340" y="100" text-anchor="middle" font-size="9" fill="#aaa">B0</text>

  <text x="400" y="66" font-size="10.5" fill="#555">mask = 1010₂ = 10</text>
  <text x="400" y="82" font-size="10.5" fill="#555">已用 2 辆车 (B1, B3)</text>
  <text x="400" y="98" font-size="10.5" fill="#b85450" font-weight="bold">→ 正在分第 3 个工人</text>

  <!-- ===== Middle: transition diagram ===== -->
  <text x="280" y="148" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">状态转移：dp[mask | (1&lt;&lt;j)] = min(dp[mask] + dist(Wₖ, Bⱼ))</text>

  <!-- From state: mask=0000 (W0 to assign) -->
  <rect x="60" y="168" width="100" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="110" y="186" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">mask=0000</text>
  <text x="110" y="202" text-anchor="middle" font-size="9.5" fill="#888">分 W0, dp=0</text>

  <!-- Arrows to two next states -->
  <path d="M 160 180 L 230 180" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="180" y="174" font-size="9" fill="#446688">W0→B0</text>
  <text x="180" y="196" font-size="9" fill="#888">d=3</text>

  <path d="M 160 200 L 230 270" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="180" y="248" font-size="9" fill="#446688">W0→B1</text>
  <text x="180" y="262" font-size="9" fill="#888">d=6</text>

  <!-- State: mask=0001 (W1 to assign) -->
  <rect x="230" y="158" width="100" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="176" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">mask=0001</text>
  <text x="280" y="192" text-anchor="middle" font-size="9.5" fill="#888">分 W1, dp=3</text>

  <!-- State: mask=0010 (W1 to assign) -->
  <rect x="230" y="248" width="100" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="266" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">mask=0010</text>
  <text x="280" y="282" text-anchor="middle" font-size="9.5" fill="#888">分 W1, dp=6</text>

  <!-- Arrows to final state -->
  <path d="M 330 180 L 400 180" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="350" y="174" font-size="9" fill="#4a7a3a">W1→B1</text>
  <text x="350" y="196" font-size="9" fill="#888">d=3</text>

  <path d="M 330 270 L 400 210" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="350" y="240" font-size="9" fill="#b85450">W1→B0</text>
  <text x="350" y="254" font-size="9" fill="#888">d=2</text>

  <!-- Final state: mask=0011 -->
  <rect x="400" y="168" width="100" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="450" y="186" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">mask=0011</text>
  <text x="450" y="202" text-anchor="middle" font-size="9.5" fill="#888">dp=6 ✓</text>

  <rect x="400" y="226" width="100" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="450" y="244" text-anchor="middle" font-size="9.5" fill="#aaa">dp=8 ✗</text>

  <!-- ===== Bottom: formula ===== -->
  <rect x="30" y="318" width="500" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="340" font-size="11" fill="#4a7a3a" font-weight="bold">关键公式：</text>
  <text x="50" y="358" font-size="10.5" fill="#555">dp[mask] = 已用自行车集合为 mask 时，前 popcount(mask) 个工人的最小总距离</text>
  <text x="50" y="372" font-size="10.5" fill="#555">k = popcount(mask) → 第 k 个工人尝试所有未用自行车 j → dp[mask|(1&lt;&lt;j)]</text>
</svg>
