<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">中心对称数构造：对称对从两端向中间填充</text>

  <!-- ===== Left: symmetric pairs table ===== -->
  <text x="130" y="50" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">对称对（5 对）</text>

  <!-- pair 0-0 -->
  <rect x="44" y="60" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <text x="86" y="78" font-size="11" fill="#555">↔</text>
  <rect x="104" y="60" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <text x="152" y="78" font-size="10" fill="#b85450">首位禁用</text>

  <!-- pair 1-1 -->
  <rect x="44" y="96" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="116" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="86" y="114" font-size="11" fill="#555">↔</text>
  <rect x="104" y="96" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="116" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <!-- pair 6-9 -->
  <rect x="44" y="132" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="60" y="152" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">6</text>
  <text x="86" y="150" font-size="11" fill="#555">↔</text>
  <rect x="104" y="132" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="120" y="152" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">9</text>

  <!-- pair 8-8 -->
  <rect x="44" y="168" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="188" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>
  <text x="86" y="186" font-size="11" fill="#555">↔</text>
  <rect x="104" y="168" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="188" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>

  <!-- pair 9-6 -->
  <rect x="44" y="204" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="60" y="224" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">9</text>
  <text x="86" y="222" font-size="11" fill="#555">↔</text>
  <rect x="104" y="204" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="120" y="224" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">6</text>

  <!-- middle digit note -->
  <rect x="30" y="248" width="200" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="130" y="266" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">中间位（奇数长度）</text>
  <text x="130" y="284" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">只能取 0, 1, 8</text>

  <!-- ===== Right: construction example length=3 ===== -->
  <text x="380" y="50" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">构造示例：长度 = 3</text>

  <!-- skeleton _ _ _ -->
  <rect x="300" y="62" width="40" height="32" fill="#fff" stroke="#446688" stroke-width="1.5" stroke-dasharray="4,2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="84" text-anchor="middle" font-size="14" fill="#ccc">_</text>
  <rect x="346" y="62" width="40" height="32" fill="#fff" stroke="#446688" stroke-width="1.5" stroke-dasharray="4,2" rx="4" filter="url(#rough2)"/>
  <text x="366" y="84" text-anchor="middle" font-size="14" fill="#ccc">_</text>
  <rect x="392" y="62" width="40" height="32" fill="#fff" stroke="#446688" stroke-width="1.5" stroke-dasharray="4,2" rx="4" filter="url(#rough2)"/>
  <text x="412" y="84" text-anchor="middle" font-size="14" fill="#ccc">_</text>

  <text x="380" y="108" text-anchor="middle" font-size="10" fill="#888">pos 0 / 2 → 选对称对 (1,1)</text>

  <!-- fill outer pair 1 _ 1 -->
  <rect x="300" y="116" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="320" y="138" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="346" y="116" width="40" height="32" fill="#fff" stroke="#446688" stroke-width="1.5" stroke-dasharray="4,2" rx="4" filter="url(#rough2)"/>
  <text x="366" y="138" text-anchor="middle" font-size="14" fill="#ccc">_</text>
  <rect x="392" y="116" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="412" y="138" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <text x="380" y="162" text-anchor="middle" font-size="10" fill="#888">pos 1（中间）→ 取 0, 1, 8</text>

  <!-- three results -->
  <rect x="300" y="170" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="320" y="192" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="346" y="170" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="366" y="192" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="392" y="170" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="412" y="192" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="444" y="190" font-size="12" fill="#4a7a3a" font-weight="bold">→ 101 ✓</text>

  <rect x="300" y="210" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="320" y="232" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="346" y="210" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="366" y="232" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="392" y="210" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="412" y="232" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="444" y="230" font-size="12" fill="#4a7a3a" font-weight="bold">→ 111 ✓</text>

  <rect x="300" y="250" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="320" y="272" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="346" y="250" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="366" y="272" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">8</text>
  <rect x="392" y="250" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="412" y="272" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="444" y="270" font-size="12" fill="#4a7a3a" font-weight="bold">→ 181 ✓</text>

  <!-- ===== Bottom: counts ===== -->
  <rect x="30" y="310" width="480" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="332" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">各长度中心对称数个数：L=1→3, L=2→4, L=3→12, L=4→20, ..., L=10→2500</text>

  <rect x="30" y="356" width="480" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="376" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">总数 ≈ 5000，逐一构造 + 筛选 ≤ n 即可，O(5^(L/2)) 远小于 O(n)</text>
</svg>
