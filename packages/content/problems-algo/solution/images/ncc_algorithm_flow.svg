<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">并查集求连通分量流程</text>

  <!-- init -->
  <rect x="190" y="44" width="160" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="62" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">初始化</text>
  <text x="270" y="78" text-anchor="middle" font-size="10.5" fill="#666">parent[i]=i, count=n</text>
  <line x1="270" y1="88" x2="270" y2="108" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop -->
  <rect x="170" y="108" width="200" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="129" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">遍历每条边 (u, v) ∈ edges</text>
  <line x1="270" y1="142" x2="270" y2="162" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- find box -->
  <rect x="150" y="162" width="240" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="180" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">ru = find(u), rv = find(v)</text>
  <text x="270" y="194" text-anchor="middle" font-size="10" fill="#666">带路径压缩地找根</text>
  <line x1="270" y1="200" x2="270" y2="218" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision -->
  <path d="M 270 218 L 390 262 L 270 306 L 150 262 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="258" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">ru == rv ?</text>
  <text x="270" y="274" text-anchor="middle" font-size="10" fill="#888">两端已同根</text>

  <!-- yes branch: skip -->
  <text x="404" y="258" font-size="11" fill="#888" font-weight="bold">是</text>
  <line x1="390" y1="262" x2="430" y2="262" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="430" y="244" width="96" height="38" fill="#f0f0f0" stroke="#bbb" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="478" y="261" text-anchor="middle" font-size="11.5" fill="#666" font-weight="bold">跳过</text>
  <text x="478" y="275" text-anchor="middle" font-size="10" fill="#888">同分量，不计数</text>

  <!-- no branch: union + count-- -->
  <text x="120" y="258" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <line x1="150" y1="262" x2="110" y2="262" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="14" y="238" width="96" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="62" y="256" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">union(u,v)</text>
  <text x="62" y="272" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">count−−</text>

  <!-- union -> back to loop -->
  <path d="M 62 238 Q 62 150 170 126" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="40" y="190" font-size="10" fill="#888">回到循环</text>

  <!-- end: return count -->
  <line x1="270" y1="306" x2="270" y2="326" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)" opacity="0.6"/>
  <text x="300" y="318" font-size="10" fill="#888">边处理完</text>
  <rect x="170" y="326" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="346" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">返回 count</text>
  <text x="270" y="360" text-anchor="middle" font-size="10.5" fill="#666">= n − 成功合并次数</text>

  <!-- note -->
  <rect x="120" y="372" width="300" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="270" y="388" text-anchor="middle" font-size="10.5" fill="#444">边列表形式：只需 O(m) 遍历边，稀疏图更高效</text>
</svg>
