<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：s = "165462", k = 60 → 贪心 4 段</text>

  <!-- String header -->
  <text x="28" y="56" font-size="10.5" fill="#666">位置</text>
  <text x="76" y="56" font-size="9.5" fill="#aaa">0</text>
  <text x="126" y="56" font-size="9.5" fill="#aaa">1</text>
  <text x="176" y="56" font-size="9.5" fill="#aaa">2</text>
  <text x="226" y="56" font-size="9.5" fill="#aaa">3</text>
  <text x="276" y="56" font-size="9.5" fill="#aaa">4</text>
  <text x="326" y="56" font-size="9.5" fill="#aaa">5</text>

  <!-- Digit cards row: 1 6 5 4 6 2, w=44 gap=6 start=56 -->
  <rect x="56" y="62" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="78" y="85" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="106" y="62" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="128" y="85" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>
  <rect x="156" y="62" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="85" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <rect x="206" y="62" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="228" y="85" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <rect x="256" y="62" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="278" y="85" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>
  <rect x="306" y="62" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="328" y="85" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>

  <!-- Step 1: from pos 0, "16" taken (green), "165" rejected (red) -->
  <text x="28" y="118" font-size="10.5" fill="#666">步骤1</text>
  <!-- green bracket over pos 0-1 -->
  <rect x="56" y="104" width="94" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)" opacity="0.6"/>
  <!-- red bracket over pos 0-2 (attempt) -->
  <path d="M 56 104 L 56 100 L 200 100 L 200 104" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="128" y="96" text-anchor="middle" font-size="9.5" fill="#b85450">"165"=165 ✗</text>
  <text x="80" y="126" font-size="10" fill="#4a7a3a" font-weight="bold">"16"=16 ✓</text>
  <text x="370" y="126" font-size="10.5" fill="#333">→ i=2, count=1</text>

  <!-- Step 2: from pos 2, "54" taken -->
  <text x="28" y="158" font-size="10.5" fill="#666">步骤2</text>
  <rect x="156" y="144" width="94" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)" opacity="0.6"/>
  <path d="M 156 144 L 156 140 L 300 140 L 300 144" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="228" y="136" text-anchor="middle" font-size="9.5" fill="#b85450">"546"=546 ✗</text>
  <text x="180" y="166" font-size="10" fill="#4a7a3a" font-weight="bold">"54"=54 ✓</text>
  <text x="370" y="166" font-size="10.5" fill="#333">→ i=4, count=2</text>

  <!-- Step 3: from pos 4, "6" taken -->
  <text x="28" y="198" font-size="10.5" fill="#666">步骤3</text>
  <rect x="256" y="184" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)" opacity="0.6"/>
  <path d="M 256 184 L 256 180 L 344 180 L 344 184" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="300" y="176" text-anchor="middle" font-size="9.5" fill="#b85450">"62"=62 ✗</text>
  <text x="266" y="206" font-size="10" fill="#4a7a3a" font-weight="bold">"6"=6 ✓</text>
  <text x="370" y="206" font-size="10.5" fill="#333">→ i=5, count=3</text>

  <!-- Step 4: from pos 5, "2" taken (end) -->
  <text x="28" y="238" font-size="10.5" fill="#666">步骤4</text>
  <rect x="306" y="224" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)" opacity="0.6"/>
  <text x="316" y="246" font-size="10" fill="#4a7a3a" font-weight="bold">"2"=2 ✓</text>
  <text x="370" y="246" font-size="10.5" fill="#333">→ i=6=n, count=4</text>

  <!-- Divider -->
  <path d="M 40 276 L 480 276" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Final result -->
  <text x="28" y="300" font-size="10.5" fill="#666">最终分割</text>
  <!-- 4 green segments -->
  <rect x="80" y="288" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="108" y="307" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">16</text>
  <path d="M 136 302 L 146 302" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="146" y="288" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="174" y="307" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">54</text>
  <path d="M 202 302 L 212 302" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="212" y="288" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="232" y="307" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
  <path d="M 252 302 L 262 302" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="262" y="288" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="282" y="307" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="320" y="307" font-size="13" fill="#4a7a3a" font-weight="bold">= 4 段 ✓</text>

  <!-- Example 2 note -->
  <rect x="40" y="332" width="440" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="350" text-anchor="middle" font-size="10.5" fill="#555">示例 2：s="238182", k=5 → '8' 单字符 8 &gt; 5，j==i，返回 -1</text>
  <text x="260" y="364" text-anchor="middle" font-size="10" fill="#888">单字符超 k = 无法属于任何合法子串 → 无解</text>
</svg>
