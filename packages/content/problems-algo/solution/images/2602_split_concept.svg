<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：排序后按 q 二分切点，左侧需增、右侧需减</text>

  <!-- sorted nums row: 1 3 | 6 8 , query q=5 -->
  <!-- left part (smaller than q, increase) -->
  <text x="100" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">左侧 &lt; q（需增大）</text>
  <rect x="90" y="80" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="118" y="116" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">1</text>
  <rect x="150" y="80" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="178" y="116" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">3</text>

  <!-- split dashed line at pos=2 -->
  <path d="M 214 74 L 214 152" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 4" fill="none" filter="url(#rough2)"/>
  <text x="214" y="66" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">切点 pos=2</text>

  <!-- right part (>= q, decrease) -->
  <text x="430" y="68" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">右侧 ≥ q（需减小）</text>
  <rect x="230" y="80" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="258" y="116" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">6</text>
  <rect x="290" y="80" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="318" y="116" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">8</text>

  <!-- index ticks -->
  <text x="118" y="152" text-anchor="middle" font-size="10" fill="#888">i=0</text>
  <text x="178" y="152" text-anchor="middle" font-size="10" fill="#888">i=1</text>
  <text x="258" y="152" text-anchor="middle" font-size="10" fill="#888">i=2</text>
  <text x="318" y="152" text-anchor="middle" font-size="10" fill="#888">i=3</text>

  <!-- increase arrows for left part: 1->5 (+4), 3->5 (+2) -->
  <path d="M 118 80 C 118 40 360 40 360 108" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <rect x="360" y="96" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="382" y="114" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">+4</text>
  <path d="M 178 80 C 178 52 360 52 360 110" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="3 3" filter="url(#rough2)"/>

  <!-- decrease arrows for right part: 6->5 (-1), 8->5 (-3) -->
  <path d="M 258 80 C 258 40 410 40 410 96" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <path d="M 318 80 C 318 52 410 52 410 100" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <rect x="410" y="96" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="432" y="114" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">−1, −3</text>

  <!-- query target q=5 marker -->
  <rect x="465" y="96" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="495" y="114" text-anchor="middle" font-size="11.5" fill="#a87020" font-weight="bold">目标 q=5</text>

  <!-- divider -->
  <path d="M 40 168 L 520 168" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- binary search arrow -->
  <text x="280" y="190" text-anchor="middle" font-size="11.5" fill="#888">二分找 pos = lower_bound(q)：首个 nums[i] ≥ q 的下标</text>
  <rect x="120" y="200" width="320" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="218" text-anchor="middle" font-size="11.5" fill="#a87020" font-weight="bold">pos ∈ [0, n]，O(log n) 定位切点</text>

  <!-- formula box -->
  <rect x="30" y="240" width="500" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="262" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">answer = ( q·pos − prefix[pos] ) + ( (total − prefix[pos]) − q·(n−pos) )</text>
  <text x="280" y="282" text-anchor="middle" font-size="11" fill="#555">左侧贡献 = 每个 (q − nums[i]) 之和；右侧贡献 = 每个 (nums[i] − q) 之和</text>
  <text x="280" y="298" text-anchor="middle" font-size="10.5" fill="#888">排序后左右绝对值方向确定 → 用前缀和 O(1) 求区间和</text>

  <!-- takeaway -->
  <rect x="30" y="318" width="500" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="340" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">排序使切点两侧绝对值方向固定，无需逐元素算</text>
  <text x="280" y="358" text-anchor="middle" font-size="10.5" fill="#555">左侧 q·pos − prefix[pos]：q 乘个数减左半和</text>
  <text x="280" y="374" text-anchor="middle" font-size="10.5" fill="#555">右侧右半和 − q·(n−pos)：右半和减 q 乘个数</text>
  <text x="280" y="388" text-anchor="middle" font-size="10.5" fill="#888">预处理排序 O(n log n) + 前缀和 O(n)，每次查询 O(log n)</text>
</svg>
