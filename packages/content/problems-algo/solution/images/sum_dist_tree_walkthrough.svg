<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n=6, edges=[[0,1],[0,2],[2,3],[2,4],[2,5]]</text>

  <!-- ===== Left: tree with cnt/dist annotations ===== -->
  <text x="140" y="54" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">第一趟 dfs1 后：cnt[] / dist[]</text>

  <!-- edges -->
  <line x1="140" y1="74" x2="75" y2="134" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="140" y1="74" x2="205" y2="134" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="205" y1="134" x2="145" y2="194" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="205" y1="134" x2="205" y2="194" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="205" y1="134" x2="265" y2="194" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>

  <!-- nodes -->
  <circle cx="140" cy="74" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="78" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="140" y="100" text-anchor="middle" font-size="9" fill="#446688">c=6 d=8</text>

  <circle cx="75" cy="134" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="75" y="138" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="75" y="160" text-anchor="middle" font-size="9" fill="#446688">c=1 d=0</text>

  <circle cx="205" cy="134" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="205" y="138" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="205" y="160" text-anchor="middle" font-size="9" fill="#4a7a3a">c=4 d=3</text>

  <circle cx="145" cy="194" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145" y="198" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="145" y="220" text-anchor="middle" font-size="9" fill="#4a7a3a">c=1 d=0</text>

  <circle cx="205" cy="194" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="205" y="198" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="205" y="220" text-anchor="middle" font-size="9" fill="#4a7a3a">c=1 d=0</text>

  <circle cx="265" cy="194" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="265" y="198" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="265" y="220" text-anchor="middle" font-size="9" fill="#4a7a3a">c=1 d=0</text>

  <!-- ===== Right: DFS2 reroot computation ===== -->
  <text x="430" y="54" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">第二趟 dfs2 换根递推 ans[]</text>

  <!-- header row -->
  <rect x="315" y="66" width="40" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="335" y="82" text-anchor="middle" font-size="10" fill="#888">节点</text>
  <rect x="357" y="66" width="110" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="412" y="82" text-anchor="middle" font-size="10" fill="#888">公式</text>
  <rect x="469" y="66" width="50" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="494" y="82" text-anchor="middle" font-size="10" fill="#888">ans</text>

  <!-- row 0: root -->
  <rect x="315" y="94" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="335" y="111" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <rect x="357" y="94" width="110" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="412" y="111" text-anchor="middle" font-size="10" fill="#333">= dist[0]</text>
  <rect x="469" y="94" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="494" y="111" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">8</text>

  <!-- row 1 -->
  <rect x="315" y="124" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="335" y="141" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="357" y="124" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="412" y="141" text-anchor="middle" font-size="10" fill="#333">8−1+5</text>
  <rect x="469" y="124" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="494" y="141" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">12</text>

  <!-- row 2 -->
  <rect x="315" y="154" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="335" y="171" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="357" y="154" width="110" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="412" y="171" text-anchor="middle" font-size="10" fill="#333">8−4+2</text>
  <rect x="469" y="154" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="494" y="171" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>

  <!-- row 3 -->
  <rect x="315" y="184" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="335" y="201" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="357" y="184" width="110" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="412" y="201" text-anchor="middle" font-size="10" fill="#333">6−1+5</text>
  <rect x="469" y="184" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="494" y="201" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">10</text>

  <!-- row 4 -->
  <rect x="315" y="214" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="335" y="231" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="357" y="214" width="110" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="412" y="231" text-anchor="middle" font-size="10" fill="#333">6−1+5</text>
  <rect x="469" y="214" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="494" y="231" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">10</text>

  <!-- row 5 -->
  <rect x="315" y="244" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="335" y="261" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="357" y="244" width="110" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="412" y="261" text-anchor="middle" font-size="10" fill="#333">6−1+5</text>
  <rect x="469" y="244" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="494" y="261" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">10</text>

  <!-- result -->
  <rect x="120" y="296" width="320" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="314" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">最终结果 ans = [8, 12, 6, 10, 10, 10]</text>
  <text x="280" y="330" text-anchor="middle" font-size="10" fill="#888">节点 1 离群最远 → 距离和最大；节点 2 居中 → 距离和最小</text>

  <!-- recursion note -->
  <text x="280" y="362" text-anchor="middle" font-size="10" fill="#888">注：n ≤ 3×10⁴，链状树递归深度可达 30000，Python 需 setrecursionlimit 或改迭代</text>
</svg>
