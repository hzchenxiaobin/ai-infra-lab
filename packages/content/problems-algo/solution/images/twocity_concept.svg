<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="520" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="280" y="26" text-anchor="middle" font-size="14.5" fill="#333" font-weight="bold" filter="url(#rough2)">
    核心观察：全员去 B → 选 diff 最小的 n 人改派 A
  </text>

  <!-- ===== Step 1: baseline ===== -->
  <rect x="60" y="44" width="440" height="48" rx="8" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">
    ① 设基线：2n 人都去 b 市
  </text>
  <text x="280" y="82" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">
    baseline = Σ bCostᵢ = 20 + 200 + 50 + 20 = 290
  </text>

  <path d="M 280 92 L 280 108" stroke="#666" stroke-width="1.5" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="104" font-size="10.5" fill="#888" filter="url(#rough2)">改派第 i 人去 a</text>

  <!-- ===== Step 2: diff ===== -->
  <rect x="60" y="110" width="440" height="48" rx="8" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="130" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">
    ② 净变化 diff[i] = aCostᵢ − bCostᵢ
  </text>
  <text x="280" y="148" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">
    需选 n 人改派 → 选 diff 最小的 n 个（负得最多 = 省最多）
  </text>

  <path d="M 280 158 L 280 174" stroke="#666" stroke-width="1.5" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="170" font-size="10.5" fill="#888" filter="url(#rough2)">按 diff 升序排序</text>

  <!-- ===== Step 3 label ===== -->
  <text x="280" y="186" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">
    ③ 原始 4 人（标出 diff）
  </text>

  <!-- ===== Row 1: original 4 cards ===== -->
  <!-- card w=120 h=78 ; x=30,160,290,420 ; y=196 -->
  <g filter="url(#rough2)">
    <!-- 人0 -->
    <rect x="30"  y="196" width="120" height="78" rx="6" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4"/>
    <!-- 人1 -->
    <rect x="160" y="196" width="120" height="78" rx="6" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4"/>
    <!-- 人2 -->
    <rect x="290" y="196" width="120" height="78" rx="6" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4"/>
    <!-- 人3 -->
    <rect x="420" y="196" width="120" height="78" rx="6" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4"/>
  </g>
  <g font-size="11.5" fill="#666" text-anchor="middle" filter="url(#rough2)">
    <text x="90"  y="214">人 0</text>
    <text x="220" y="214">人 1</text>
    <text x="350" y="214">人 2</text>
    <text x="480" y="214">人 3</text>
  </g>
  <g font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="90"  y="234">a=10, b=20</text>
    <text x="220" y="234">a=30, b=200</text>
    <text x="350" y="234">a=400, b=50</text>
    <text x="480" y="234">a=30, b=20</text>
  </g>
  <g font-size="12.5" fill="#b85450" text-anchor="middle" font-weight="bold" filter="url(#rough2)">
    <text x="90"  y="258">diff = −10</text>
    <text x="220" y="258">diff = −170</text>
    <text x="350" y="258">diff = +350</text>
    <text x="480" y="258">diff = +10</text>
  </g>

  <!-- sort arrow -->
  <path d="M 280 276 L 280 300" stroke="#666" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="298" y="292" font-size="10.5" fill="#888" filter="url(#rough2)">sort(diff)</text>

  <!-- group labels for sorted row -->
  <text x="145" y="316" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">
    前 n=2 → a 市
  </text>
  <text x="405" y="316" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">
    后 n=2 → b 市
  </text>

  <!-- divider between groups -->
  <line x1="285" y1="324" x2="285" y2="412" stroke="#888" stroke-width="1.2"
        stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Row 2: sorted 4 cards ===== -->
  <!-- sorted order: 人1(-170), 人0(-10) | 人3(+10), 人2(+350) -->
  <g filter="url(#rough2)">
    <!-- 人1 -> A (green) -->
    <rect x="30"  y="324" width="120" height="78" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <!-- 人0 -> A (green) -->
    <rect x="160" y="324" width="120" height="78" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <!-- 人3 -> B (blue) -->
    <rect x="290" y="324" width="120" height="78" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <!-- 人2 -> B (blue) -->
    <rect x="420" y="324" width="120" height="78" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <g font-size="11.5" fill="#666" text-anchor="middle" filter="url(#rough2)">
    <text x="90"  y="342">人 1</text>
    <text x="220" y="342">人 0</text>
    <text x="350" y="342">人 3</text>
    <text x="480" y="342">人 2</text>
  </g>
  <g font-size="11" fill="#555" text-anchor="middle" filter="url(#rough2)">
    <text x="90"  y="362">diff = −170</text>
    <text x="220" y="362">diff = −10</text>
    <text x="350" y="362">diff = +10</text>
    <text x="480" y="362">diff = +350</text>
  </g>
  <g font-size="13" text-anchor="middle" font-weight="bold" filter="url(#rough2)">
    <text x="90"  y="388" fill="#4a7a3a">取 a = 30</text>
    <text x="220" y="388" fill="#4a7a3a">取 a = 10</text>
    <text x="350" y="388" fill="#446688">取 b = 20</text>
    <text x="480" y="388" fill="#446688">取 b = 50</text>
  </g>

  <!-- ===== Result box ===== -->
  <rect x="60" y="420" width="440" height="78" rx="10" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="442" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">
    总费用 = 30 + 10 + 20 + 50 = 110
  </text>
  <text x="280" y="462" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">
    = baseline + Σ(前 n 个 diff) = 290 + (−170) + (−10)
  </text>
  <text x="280" y="480" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">
    = 290 − 180 = 110 ✓
  </text>
</svg>
