<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">pick() 流程：二分选矩形 → 矩形内均匀取点</text>

  <!-- 开始 -->
  <rect x="220" y="44" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="14" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">pick()</text>

  <path d="M 280 74 L 280 96" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- r = rand() % total -->
  <rect x="180" y="98" width="200" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="117" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">r = rand() % total</text>

  <path d="M 280 126 L 280 148" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化二分 -->
  <rect x="180" y="150" width="200" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="169" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">lo = 0, hi = n − 1</text>

  <path d="M 280 178 L 280 204" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定1: lo < hi ? -->
  <path d="M 280 206 L 376 240 L 280 274 L 184 240 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="238" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">lo &lt; hi ?</text>
  <text x="280" y="254" text-anchor="middle" font-size="10" fill="#888">二分循环</text>

  <!-- 否分支：lo 即矩形下标 i -->
  <path d="M 376 240 L 460 240" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="398" y="234" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="452" y="226" width="100" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="502" y="246" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">i = lo (矩形)</text>

  <!-- 是分支 -->
  <path d="M 280 274 L 280 296" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="290" y="290" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- mid + 比较 -->
  <rect x="196" y="298" width="168" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="317" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">mid = (lo+hi)/2</text>

  <path d="M 280 326 L 280 348" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 280 352 L 392 386 L 280 420 L 168 386 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="384" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">pre[mid] ≤ r ?</text>

  <!-- 是分支（左）：lo = mid + 1 -->
  <path d="M 168 386 L 100 386" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="134" y="380" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="40" y="372" width="96" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="88" y="391" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">lo = mid+1</text>
  <path d="M 88 372 L 88 190 L 280 190 L 280 206" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="5 3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="44" y="300" font-size="10" fill="#4a7a3a">回到循环</text>

  <!-- 否分支（右）：hi = mid -->
  <path d="M 392 386 L 460 386" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="416" y="380" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="460" y="372" width="84" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="502" y="391" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">hi = mid</text>
  <path d="M 502 372 L 502 190 L 280 190" stroke="#b85450" stroke-width="1.3" stroke-dasharray="5 3" fill="none" filter="url(#rough2)"/>

  <!-- 矩形内取点（从 i=lo 向下） -->
  <path d="M 502 256 L 502 410" stroke="none"/>
  <rect x="36" y="410" width="488" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="428" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">选定矩形 i 后：x = xi + rand() % (ai − xi + 1)，y = yi + rand() % (bi − yi + 1)</text>
  <text x="280" y="444" text-anchor="middle" font-size="10.5" fill="#888">在 rect i 的整数点网格内均匀取一个点 → 返回 [x, y]</text>
</svg>
