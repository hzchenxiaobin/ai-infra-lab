<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：同字母传送门 = 一个 0 成本「超点」</text>

  <!-- 示例 1 网格 -->
  <g filter="url(#rough2)">
    <rect x="106" y="76" width="46" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="152" y="76" width="46" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="60" y="122" width="46" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="152" y="122" width="46" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="60" y="168" width="46" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="106" y="168" width="46" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="129" y="104" text-anchor="middle" font-size="15" fill="#446688">.</text>
    <text x="175" y="104" text-anchor="middle" font-size="15" fill="#446688">.</text>
    <text x="83" y="150" text-anchor="middle" font-size="15" fill="#446688">.</text>
    <text x="175" y="150" text-anchor="middle" font-size="15" fill="#446688">.</text>
    <text x="83" y="196" text-anchor="middle" font-size="15" fill="#446688">.</text>
    <text x="129" y="196" text-anchor="middle" font-size="15" fill="#446688">.</text>

    <rect x="60" y="76" width="46" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="106" y="122" width="46" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="83" y="105" text-anchor="middle" font-size="18" fill="#a07818">A</text>
    <text x="129" y="151" text-anchor="middle" font-size="18" fill="#a07818">A</text>

    <rect x="152" y="168" width="46" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="175" y="196" text-anchor="middle" font-size="15" fill="#4a7a3a">.</text>
  </g>

  <!-- 超点虚线圈：把两个 A 圈在一起 -->
  <ellipse cx="106" cy="122" rx="70" ry="46" transform="rotate(45 106 122)"
           fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="8 6" filter="url(#rough2)"/>

  <!-- 0 成本传送箭头 -->
  <path d="M 88 98 C 120 106, 128 114, 133 140" fill="none" stroke="#b85450" stroke-width="2"
        marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="140" y="112" font-size="13" fill="#b85450" filter="url(#rough2)">0 步</text>

  <!-- 起点 / 终点标注 -->
  <text x="83" y="62" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">起点</text>
  <path d="M 83 65 L 83 73" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="178" y="240" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">终点</text>
  <path d="M 177 230 L 176 217" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <text x="129" y="262" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">示例 1 网格："A.." / ".A." / "..."</text>

  <!-- 右侧三个要点 -->
  <g filter="url(#rough2)">
    <rect x="272" y="70" width="234" height="72" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="284" y="92" font-size="13" fill="#446688">① 缩成超点</text>
    <text x="284" y="110" font-size="12" fill="#333">踏入任意一个 A，等价于 0 成本</text>
    <text x="284" y="128" font-size="12" fill="#333">「同时站在所有 A 格上」</text>

    <rect x="272" y="156" width="234" height="88" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="284" y="178" font-size="13" fill="#a07818">② 「每字母只用一次」可忽略</text>
    <text x="284" y="196" font-size="12" fill="#333">用同一字母两次的路径，第二次传送</text>
    <text x="284" y="214" font-size="12" fill="#333">可并入第一次，步数只减不增；</text>
    <text x="284" y="232" font-size="12" fill="#333">⇒ 无限制最短路 = 原题答案</text>

    <rect x="272" y="258" width="234" height="72" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="284" y="280" font-size="13" fill="#4a7a3a">③ 0/1 边权 ⇒ BFS 同层扩张</text>
    <text x="284" y="298" font-size="12" fill="#333">「发现」新格时若是未使用字母，</text>
    <text x="284" y="316" font-size="12" fill="#333">同字母格全部按相同距离入队</text>
  </g>

  <path d="M 204 122 C 236 122, 244 112, 270 108" fill="none" stroke="#446688" stroke-width="1.8"
        marker-end="url(#arrB)" filter="url(#rough2)"/>

  <text x="260" y="356" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">普通 BFS +「发现时」0 成本扩张 ⇒ O(mn) 求出最短路</text>
</svg>
