<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：逐数组去重登记 → 扫值域筛 popcount ≥ 2</text>

  <!-- 1. init mask table -->
  <rect x="150" y="44" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="62" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">① 建表 mask[1..100] = 0</text>
  <text x="270" y="78" text-anchor="middle" font-size="10.5" fill="#555">值域数组，下标即值</text>

  <path d="M 270 84 L 270 102" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. loop over 3 arrays -->
  <rect x="110" y="102" width="320" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="122" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">② 对 i = 0,1,2 遍历三个数组</text>
  <text x="270" y="139" text-anchor="middle" font-size="10.5" fill="#555">nums₁ (i=0) · nums₂ (i=1) · nums₃ (i=2)</text>

  <path d="M 270 152 L 270 170" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. dedupe -->
  <rect x="130" y="170" width="280" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="188" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">③ set(nums_i) 数组内去重</text>
  <text x="270" y="203" text-anchor="middle" font-size="10" fill="#a87020">同一数组重复只算一次归属</text>

  <path d="M 270 210 L 270 228" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4. OR bit -->
  <rect x="110" y="228" width="320" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="246" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">④ 对 v ∈ set：mask[v] |= (1 &lt;&lt; i)</text>
  <text x="270" y="261" text-anchor="middle" font-size="10" fill="#555">把「出现在第 i 个数组」登记进第 i 位</text>

  <path d="M 270 268 L 270 286" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 5. scan value range -->
  <rect x="130" y="286" width="280" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="304" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">⑤ 遍历 v = 1 .. 100</text>
  <text x="270" y="319" text-anchor="middle" font-size="10" fill="#555">值域扫描，天然升序去重</text>

  <path d="M 270 326 L 270 344" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 6. decision diamond -->
  <polygon points="270,344 380,378 270,412 160,378" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="374" text-anchor="middle" font-size="11" fill="#333">popcount(mask[v])</text>
  <text x="270" y="390" text-anchor="middle" font-size="11" fill="#333">≥ 2 ?</text>

  <!-- yes -> ans -->
  <path d="M 380 378 L 440 378" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="408" y="372" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="430" y="364" width="100" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="480" y="383" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">ans.append(v)</text>

  <!-- no -> skip -->
  <path d="M 160 378 L 100 378" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="132" y="372" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="30" y="364" width="72" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="66" y="383" text-anchor="middle" font-size="10.5" fill="#b85450">跳过</text>

  <!-- footer -->
  <text x="270" y="436" text-anchor="middle" font-size="10.5" fill="#888">登记 O(n₁+n₂+n₃)，收集 O(V=100)，全程无嵌套循环</text>
  <text x="270" y="452" text-anchor="middle" font-size="10" fill="#aaa">关键：归属用位编码，「至少 2 个」= popcount ≥ 2</text>
</svg>
