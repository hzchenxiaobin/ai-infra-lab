<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：加密 8 个 dictionary 词建计数表，decrypt 一次命中</text>

  <!-- Mapping summary -->
  <rect x="60" y="44" width="480" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="62" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">映射：'a'→"ei"，'b'→"zf"，'c'→"ei"（与 a 重！），'d'→"am"</text>
  <text x="300" y="78" text-anchor="middle" font-size="10" fill="#b85450">注：'a' 与 'c' 同映 "ei" → 加密多对一 → 解密一对多</text>

  <!-- Table header -->
  <rect x="40" y="96" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="85" y="115" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">dictionary</text>

  <rect x="130" y="96" width="150" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="205" y="115" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">逐字符加密</text>

  <rect x="280" y="96" width="180" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="115" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">encrypt(w)</text>

  <rect x="460" y="96" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="510" y="115" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">cnt 累计</text>

  <!-- Rows: 8 dictionary words -->
  <!-- row abcd -->
  <rect x="40" y="126" width="90" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="85" y="143" text-anchor="middle" font-size="11" fill="#333">abcd</text>
  <rect x="130" y="126" width="150" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="205" y="143" text-anchor="middle" font-size="10" fill="#555">ei+zf+ei+am</text>
  <rect x="280" y="126" width="180" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="370" y="143" text-anchor="middle" font-size="11" fill="#333">eizfeiam</text>
  <rect x="460" y="126" width="100" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="510" y="143" text-anchor="middle" font-size="11" fill="#4a7a3a">cnt=1</text>

  <!-- row acbd -->
  <rect x="40" y="152" width="90" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="85" y="169" text-anchor="middle" font-size="11" fill="#333">acbd</text>
  <rect x="130" y="152" width="150" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="205" y="169" text-anchor="middle" font-size="10" fill="#555">ei+ei+zf+am</text>
  <rect x="280" y="152" width="180" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="370" y="169" text-anchor="middle" font-size="11" fill="#333">eieizfam</text>
  <rect x="460" y="152" width="100" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="510" y="169" text-anchor="middle" font-size="11" fill="#4a7a3a">cnt=1</text>

  <!-- row adbc -->
  <rect x="40" y="178" width="90" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="85" y="195" text-anchor="middle" font-size="11" fill="#333">adbc</text>
  <rect x="130" y="178" width="150" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="205" y="195" text-anchor="middle" font-size="10" fill="#555">ei+am+zf+ei</text>
  <rect x="280" y="178" width="180" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="370" y="195" text-anchor="middle" font-size="11" fill="#333">eiamzfei</text>
  <rect x="460" y="178" width="100" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="510" y="195" text-anchor="middle" font-size="11" fill="#4a7a3a">cnt=1</text>

  <!-- row badc -->
  <rect x="40" y="204" width="90" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="85" y="221" text-anchor="middle" font-size="11" fill="#333">badc</text>
  <rect x="130" y="204" width="150" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="205" y="221" text-anchor="middle" font-size="10" fill="#555">zf+ei+am+ei</text>
  <rect x="280" y="204" width="180" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="370" y="221" text-anchor="middle" font-size="11" fill="#333">zfeiamei</text>
  <rect x="460" y="204" width="100" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="510" y="221" text-anchor="middle" font-size="11" fill="#4a7a3a">cnt=1</text>

  <!-- row dacb -->
  <rect x="40" y="230" width="90" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="85" y="247" text-anchor="middle" font-size="11" fill="#333">dacb</text>
  <rect x="130" y="230" width="150" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="205" y="247" text-anchor="middle" font-size="10" fill="#555">am+ei+ei+zf</text>
  <rect x="280" y="230" width="180" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="370" y="247" text-anchor="middle" font-size="11" fill="#333">ameieizf</text>
  <rect x="460" y="230" width="100" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="510" y="247" text-anchor="middle" font-size="11" fill="#4a7a3a">cnt=1</text>

  <!-- row cadb -->
  <rect x="40" y="256" width="90" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="85" y="273" text-anchor="middle" font-size="11" fill="#333">cadb</text>
  <rect x="130" y="256" width="150" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="205" y="273" text-anchor="middle" font-size="10" fill="#555">ei+ei+am+zf</text>
  <rect x="280" y="256" width="180" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="370" y="273" text-anchor="middle" font-size="11" fill="#333">eieiamzf</text>
  <rect x="460" y="256" width="100" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="510" y="273" text-anchor="middle" font-size="11" fill="#4a7a3a">cnt=1</text>

  <!-- row cbda -->
  <rect x="40" y="282" width="90" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="85" y="299" text-anchor="middle" font-size="11" fill="#333">cbda</text>
  <rect x="130" y="282" width="150" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="205" y="299" text-anchor="middle" font-size="10" fill="#555">ei+zf+am+ei</text>
  <rect x="280" y="282" width="180" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="370" y="299" text-anchor="middle" font-size="11" fill="#333">eizfamei</text>
  <rect x="460" y="282" width="100" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="510" y="299" text-anchor="middle" font-size="11" fill="#4a7a3a">cnt=1</text>

  <!-- row abad (highlight - collision) -->
  <rect x="40" y="308" width="90" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="85" y="325" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">abad</text>
  <rect x="130" y="308" width="150" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="205" y="325" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">ei+zf+ei+am</text>
  <rect x="280" y="308" width="180" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="370" y="325" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">eizfeiam ⭐</text>
  <rect x="460" y="308" width="100" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="510" y="325" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">cnt=2</text>

  <!-- collision note -->
  <rect x="40" y="344" width="520" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="364" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⭐ 碰撞：abcd 与 abad 加密结果同为 eizfeiam</text>
  <text x="300" y="380" text-anchor="middle" font-size="10" fill="#666">因 'a' 与 'c' 同映 "ei"，第 3 位是 a 还是 c 不影响密文 → cnt 归并到 2</text>

  <!-- Query result -->
  <rect x="40" y="400" width="520" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="422" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">encrypt("abcd") = "eizfeiam"　|　decrypt("eizfeiam") = cnt["eizfeiam"] = 2</text>
  <text x="300" y="440" text-anchor="middle" font-size="10" fill="#888">两次查询：encrypt 逐字符拼接 O(n)，decrypt 直接查表 O(1)</text>
</svg>
