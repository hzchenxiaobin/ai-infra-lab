<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="980" height="440" fill="#fafafa"/>

  <text x="490" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：hours = [9,9,6,0,6,6,9]  →  ans = 3</text>

  <!-- Panel 0: i=0, h=9  score>0 -->
  <rect x="10" y="40" width="128" height="360" fill="#ffffff" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <rect x="10" y="40" width="128" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="74" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i=0, h=9 ★</text>
  <text x="20" y="90" font-size="11" fill="#888">>8 → +1</text>
  <text x="20" y="116" font-size="11" fill="#888">score：</text>
  <text x="108" y="116" text-anchor="end" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <text x="20" y="142" font-size="11" fill="#888">分支：</text>
  <text x="108" y="142" text-anchor="end" font-size="10" fill="#82b366" font-weight="bold">score&gt;0</text>
  <text x="20" y="168" font-size="11" fill="#888">长度：</text>
  <text x="108" y="168" text-anchor="end" font-size="11" fill="#82b366" font-weight="bold">i+1 = 1</text>
  <rect x="20" y="182" width="108" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="74" y="201" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">ans = 1</text>
  <text x="74" y="228" text-anchor="middle" font-size="10.5" fill="#888">seen：</text>
  <rect x="18" y="236" width="112" height="40" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="74" y="254" text-anchor="middle" font-size="10" fill="#333">{1:0}</text>
  <text x="74" y="270" text-anchor="middle" font-size="9.5" fill="#d6a040">写入 seen[1]</text>
  <text x="74" y="312" text-anchor="middle" font-size="10" fill="#aaa" font-style="italic">[0..0]=</text>
  <text x="74" y="328" text-anchor="middle" font-size="10" fill="#aaa" font-style="italic">[9]，长 1</text>

  <!-- Panel 1: i=1, h=9  score>0 -->
  <rect x="148" y="40" width="128" height="360" fill="#ffffff" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <rect x="148" y="40" width="128" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="212" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i=1, h=9</text>
  <text x="158" y="90" font-size="11" fill="#888">>8 → +1</text>
  <text x="158" y="116" font-size="11" fill="#888">score：</text>
  <text x="246" y="116" text-anchor="end" font-size="12" fill="#d6a040" font-weight="bold">2</text>
  <text x="158" y="142" font-size="11" fill="#888">分支：</text>
  <text x="246" y="142" text-anchor="end" font-size="10" fill="#82b366" font-weight="bold">score&gt;0</text>
  <text x="158" y="168" font-size="11" fill="#888">长度：</text>
  <text x="246" y="168" text-anchor="end" font-size="11" fill="#82b366" font-weight="bold">i+1 = 2</text>
  <rect x="158" y="182" width="108" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="212" y="201" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">ans = 2</text>
  <text x="212" y="228" text-anchor="middle" font-size="10.5" fill="#888">seen：</text>
  <rect x="156" y="236" width="112" height="40" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="212" y="254" text-anchor="middle" font-size="9.5" fill="#333">{1:0, 2:1}</text>
  <text x="212" y="270" text-anchor="middle" font-size="9.5" fill="#d6a040">写入 seen[2]</text>
  <text x="212" y="312" text-anchor="middle" font-size="10" fill="#aaa" font-style="italic">[0..1]=</text>
  <text x="212" y="328" text-anchor="middle" font-size="10" fill="#aaa" font-style="italic">[9,9]，长 2</text>

  <!-- Panel 2: i=2, h=6  score>0 (final ans) -->
  <rect x="286" y="40" width="128" height="360" fill="#ffffff" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <rect x="286" y="40" width="128" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="350" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i=2, h=6 ★</text>
  <text x="296" y="90" font-size="11" fill="#888">≤8 → −1</text>
  <text x="296" y="116" font-size="11" fill="#888">score：</text>
  <text x="384" y="116" text-anchor="end" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <text x="296" y="142" font-size="11" fill="#888">分支：</text>
  <text x="384" y="142" text-anchor="end" font-size="10" fill="#82b366" font-weight="bold">score&gt;0</text>
  <text x="296" y="168" font-size="11" fill="#888">长度：</text>
  <text x="384" y="168" text-anchor="end" font-size="11" fill="#82b366" font-weight="bold">i+1 = 3</text>
  <rect x="296" y="182" width="108" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="350" y="201" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">ans = 3</text>
  <text x="350" y="228" text-anchor="middle" font-size="10.5" fill="#888">seen：</text>
  <rect x="294" y="236" width="112" height="40" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="350" y="254" text-anchor="middle" font-size="9.5" fill="#333">{1:0, 2:1}</text>
  <text x="350" y="270" text-anchor="middle" font-size="9.5" fill="#b85450">seen[1] 已存在</text>
  <text x="350" y="312" text-anchor="middle" font-size="10" fill="#b85450" font-style="italic">[0..2]=</text>
  <text x="350" y="328" text-anchor="middle" font-size="10" fill="#b85450" font-style="italic">[9,9,6]，长 3</text>

  <!-- Panel 3: i=3, h=0  no hit, record seen[0] -->
  <rect x="424" y="40" width="128" height="360" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="424" y="40" width="128" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="488" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i=3, h=0</text>
  <text x="434" y="90" font-size="11" fill="#888">≤8 → −1</text>
  <text x="434" y="116" font-size="11" fill="#888">score：</text>
  <text x="522" y="116" text-anchor="end" font-size="12" fill="#446688" font-weight="bold">0</text>
  <text x="434" y="142" font-size="11" fill="#888">查询：</text>
  <text x="522" y="142" text-anchor="end" font-size="10" fill="#b85450">−1 不在</text>
  <text x="434" y="168" font-size="11" fill="#888">命中：</text>
  <text x="522" y="168" text-anchor="end" font-size="11" fill="#aaa">—</text>
  <rect x="434" y="182" width="108" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="488" y="201" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans = 3</text>
  <text x="488" y="228" text-anchor="middle" font-size="10.5" fill="#888">seen：</text>
  <rect x="432" y="236" width="112" height="40" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="488" y="254" text-anchor="middle" font-size="9" fill="#333">{1:0,2:1,0:3}</text>
  <text x="488" y="270" text-anchor="middle" font-size="9.5" fill="#d6a040">写入 seen[0]</text>
  <text x="488" y="312" text-anchor="middle" font-size="10" fill="#aaa" font-style="italic">score≤0 且</text>
  <text x="488" y="328" text-anchor="middle" font-size="10" fill="#aaa" font-style="italic">无更早下标</text>

  <!-- Panel 4: i=4, h=6  no hit, record seen[-1] -->
  <rect x="562" y="40" width="128" height="360" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="562" y="40" width="128" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="626" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i=4, h=6</text>
  <text x="572" y="90" font-size="11" fill="#888">≤8 → −1</text>
  <text x="572" y="116" font-size="11" fill="#888">score：</text>
  <text x="660" y="116" text-anchor="end" font-size="12" fill="#446688" font-weight="bold">−1</text>
  <text x="572" y="142" font-size="11" fill="#888">查询：</text>
  <text x="660" y="142" text-anchor="end" font-size="10" fill="#b85450">−2 不在</text>
  <text x="572" y="168" font-size="11" fill="#888">命中：</text>
  <text x="660" y="168" text-anchor="end" font-size="11" fill="#aaa">—</text>
  <rect x="572" y="182" width="108" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="626" y="201" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans = 3</text>
  <text x="626" y="228" text-anchor="middle" font-size="10.5" fill="#888">seen：</text>
  <rect x="570" y="236" width="112" height="40" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="626" y="254" text-anchor="middle" font-size="8.5" fill="#333">{1:0,2:1,0:3,−1:4}</text>
  <text x="626" y="270" text-anchor="middle" font-size="9.5" fill="#d6a040">写入 seen[−1]</text>
  <text x="626" y="312" text-anchor="middle" font-size="10" fill="#aaa" font-style="italic">前缀和首次</text>
  <text x="626" y="328" text-anchor="middle" font-size="10" fill="#aaa" font-style="italic">降为负，记录</text>

  <!-- Panel 5: i=5, h=6  no hit, record seen[-2] -->
  <rect x="700" y="40" width="128" height="360" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="700" y="40" width="128" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="764" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i=5, h=6</text>
  <text x="710" y="90" font-size="11" fill="#888">≤8 → −1</text>
  <text x="710" y="116" font-size="11" fill="#888">score：</text>
  <text x="798" y="116" text-anchor="end" font-size="12" fill="#446688" font-weight="bold">−2</text>
  <text x="710" y="142" font-size="11" fill="#888">查询：</text>
  <text x="798" y="142" text-anchor="end" font-size="10" fill="#b85450">−3 不在</text>
  <text x="710" y="168" font-size="11" fill="#888">命中：</text>
  <text x="798" y="168" text-anchor="end" font-size="11" fill="#aaa">—</text>
  <rect x="710" y="182" width="108" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="764" y="201" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans = 3</text>
  <text x="764" y="228" text-anchor="middle" font-size="10.5" fill="#888">seen：</text>
  <rect x="708" y="236" width="112" height="40" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="764" y="254" text-anchor="middle" font-size="8" fill="#333">{1:0,2:1,0:3,−1:4,−2:5}</text>
  <text x="764" y="270" text-anchor="middle" font-size="9.5" fill="#d6a040">写入 seen[−2]</text>
  <text x="764" y="312" text-anchor="middle" font-size="10" fill="#aaa" font-style="italic">谷底，留待</text>
  <text x="764" y="328" text-anchor="middle" font-size="10" fill="#aaa" font-style="italic">日后回查</text>

  <!-- Panel 6: i=6, h=9  score-1 lookup HIT -->
  <rect x="838" y="40" width="128" height="360" fill="#ffffff" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <rect x="838" y="40" width="128" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="902" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i=6, h=9 ★</text>
  <text x="848" y="90" font-size="11" fill="#888">>8 → +1</text>
  <text x="848" y="116" font-size="11" fill="#888">score：</text>
  <text x="936" y="116" text-anchor="end" font-size="12" fill="#d6a040" font-weight="bold">−1</text>
  <text x="848" y="142" font-size="11" fill="#888">查询：</text>
  <text x="936" y="142" text-anchor="end" font-size="9.5" fill="#82b366" font-weight="bold">−2 在@5</text>
  <text x="848" y="168" font-size="11" fill="#888">长度：</text>
  <text x="936" y="168" text-anchor="end" font-size="10.5" fill="#82b366" font-weight="bold">6−5=1</text>
  <rect x="848" y="182" width="108" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="902" y="201" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans = 3</text>
  <text x="902" y="228" text-anchor="middle" font-size="10.5" fill="#888">seen：</text>
  <rect x="846" y="236" width="112" height="40" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="902" y="254" text-anchor="middle" font-size="8" fill="#333">{1:0,2:1,0:3,−1:4,−2:5}</text>
  <text x="902" y="270" text-anchor="middle" font-size="9.5" fill="#b85450">seen[−1] 不覆盖</text>
  <text x="902" y="312" text-anchor="middle" font-size="10" fill="#82b366" font-style="italic">命中 [6..6]</text>
  <text x="902" y="328" text-anchor="middle" font-size="10" fill="#aaa" font-style="italic">长 1 ≤ 3</text>

  <!-- bottom summary -->
  <rect x="10" y="410" width="956" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="490" y="427" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">i=2 时 score&gt;0 直接取整段得 ans=3；i=6 查 score−1=−2 命中但长度仅 1，ans 不变</text>
</svg>
