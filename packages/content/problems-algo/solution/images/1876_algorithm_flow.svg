<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="500" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：枚举每个起点 + 三次两两比较</text>

  <!-- Start -->
  <ellipse cx="290" cy="54" rx="40" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="59" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">开始</text>

  <path d="M 290 72 L 290 88" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init -->
  <rect x="140" y="92" width="300" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="290" y="113" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">初始化 ans = 0</text>
  <text x="290" y="129" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">n = s.size()（窗口数 = n − 2）</text>

  <path d="M 290 138 L 290 158" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop entry -->
  <rect x="150" y="162" width="280" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="185" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">枚举窗口起点 i ∈ [0, n−3]</text>

  <path d="M 290 198 L 290 214" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: three chars pairwise distinct? -->
  <polygon points="290,218 440,262 290,306 140,262" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="256" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">s[i],s[i+1],s[i+2]</text>
  <text x="290" y="272" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">两两不同 ?</text>
  <text x="290" y="288" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">三次 ≠ 比较</text>

  <!-- Yes branch: right -->
  <text x="448" y="260" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 440 262 L 472 262" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="472" y="244" width="96" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="520" y="268" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans += 1</text>

  <!-- Yes branch loops back up -->
  <path d="M 520 244 L 520 180 L 430 180" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- No branch: left -->
  <text x="96" y="260" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 140 262 L 108 262" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="12" y="244" width="96" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="268" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">跳过</text>

  <!-- No branch loops back up -->
  <path d="M 60 244 L 60 180 L 150 180" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="60" y="232" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">循环</text>

  <!-- After loop -->
  <path d="M 290 306 L 290 372" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="306" y="340" font-size="9.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">遍历结束</text>

  <rect x="80" y="376" width="420" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="290" y="402" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">窗口起点 i 遍历完 [0, n−3]</text>

  <path d="M 290 418 L 290 442" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Return -->
  <ellipse cx="290" cy="464" rx="90" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="290" y="469" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans</text>
</svg>
