<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一趟扫描，升则续累、断则重启，维护全局最大</text>

  <!-- Start: init -->
  <rect x="150" y="46" width="220" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">初始化</text>
  <text x="260" y="80" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">cur = ans = nums[0],  i = 1</text>

  <path d="M 260 92 L 260 110" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="372" y="116" font-size="9" fill="#aaa" filter="url(#rough2)">← 循环回跳</text>

  <!-- Decision: i < n ? -->
  <polygon points="260,114 340,154 260,194 180,154" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="150" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">i &lt; n ?</text>
  <text x="260" y="166" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">是否未遍历完</text>

  <!-- No branch: return -->
  <path d="M 340 154 L 430 154" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="384" y="148" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="430" y="134" width="76" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="468" y="152" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回</text>
  <text x="468" y="168" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans</text>

  <!-- Yes branch: down -->
  <path d="M 260 194 L 260 212" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="208" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- Decision: nums[i] > nums[i-1] ? -->
  <polygon points="260,216 360,256 260,296 160,256" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="252" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">nums[i] &gt; nums[i-1] ?</text>
  <text x="260" y="268" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">严格递增？</text>

  <!-- Yes (left): cur += nums[i] -->
  <path d="M 160 256 L 96 256" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="128" y="250" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="20" y="234" width="80" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="60" y="252" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">续接</text>
  <text x="60" y="268" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">cur += nums[i]</text>

  <!-- No (right): cur = nums[i] -->
  <path d="M 360 256 L 424 256" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="250" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="424" y="234" width="84" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="466" y="252" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">重启新段</text>
  <text x="466" y="268" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">cur = nums[i]</text>

  <!-- merge down to ans = max(ans, cur) -->
  <path d="M 60 278 L 60 322 L 200 322" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 466 278 L 466 322 L 320 322" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ans = max(ans, cur) -->
  <rect x="170" y="306" width="180" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="330" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans = max(ans, cur)</text>

  <path d="M 260 344 L 260 362" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i++ -->
  <rect x="200" y="364" width="120" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="386" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">i += 1</text>

  <!-- loop back arrow: from i++ up to i<n? decision -->
  <path d="M 200 382 L 50 382 L 50 154 L 180 154" stroke="#666" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="34" y="272" font-size="9" fill="#aaa" filter="url(#rough2)">循环</text>

  <!-- Footer -->
  <text x="260" y="424" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">单遍 O(n) / O(1)：续接与重启各一步，每步更新全局最大</text>
  <text x="260" y="442" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">等价 DP：dp[i] = dp[i-1]+nums[i]（升）或 nums[i]（断），ans = max(dp)</text>
</svg>
