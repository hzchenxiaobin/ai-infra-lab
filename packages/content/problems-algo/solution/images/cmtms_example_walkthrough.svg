<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
  </defs>
  <rect width="560" height="440" fill="#fdfcf7"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b">示例演算：target = [9, 3, 5]</text>
  <path d="M 170 36 Q 280 44 390 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- table header -->
  <g filter="url(#sk)">
    <rect x="32" y="58" width="496" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="62" y="78" text-anchor="middle" font-size="11.5" fill="#2b4b6e" font-weight="bold">轮次</text>
  <text x="150" y="78" text-anchor="middle" font-size="11.5" fill="#2b4b6e" font-weight="bold">堆中元素</text>
  <text x="270" y="78" text-anchor="middle" font-size="11.5" fill="#2b4b6e" font-weight="bold">total</text>
  <text x="345" y="78" text-anchor="middle" font-size="11.5" fill="#2b4b6e" font-weight="bold">M / rest</text>
  <text x="475" y="78" text-anchor="middle" font-size="11.5" fill="#2b4b6e" font-weight="bold">prev = M%rest</text>

  <!-- row 1 -->
  <g filter="url(#sk)">
    <rect x="32" y="92" width="496" height="30" rx="3" fill="#fff" stroke="#ccc" stroke-width="1.2"/>
  </g>
  <text x="62" y="112" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">0</text>
  <text x="150" y="112" text-anchor="middle" font-size="11.5" fill="#333">[9, 5, 3]</text>
  <text x="270" y="112" text-anchor="middle" font-size="11.5" fill="#333">17</text>
  <text x="345" y="112" text-anchor="middle" font-size="11.5" fill="#b03a3a" font-weight="bold">9 / 8</text>
  <text x="475" y="112" text-anchor="middle" font-size="11.5" fill="#7a5415" font-weight="bold">9 % 8 = 1</text>

  <!-- row 2 -->
  <g filter="url(#sk)">
    <rect x="32" y="124" width="496" height="30" rx="3" fill="#fffdf3" stroke="#ccc" stroke-width="1.2"/>
  </g>
  <text x="62" y="144" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">1</text>
  <text x="150" y="144" text-anchor="middle" font-size="11.5" fill="#333">[5, 3, 1]</text>
  <text x="270" y="144" text-anchor="middle" font-size="11.5" fill="#333">9</text>
  <text x="345" y="144" text-anchor="middle" font-size="11.5" fill="#b03a3a" font-weight="bold">5 / 4</text>
  <text x="475" y="144" text-anchor="middle" font-size="11.5" fill="#7a5415" font-weight="bold">5 % 4 = 1</text>

  <!-- row 3 -->
  <g filter="url(#sk)">
    <rect x="32" y="156" width="496" height="30" rx="3" fill="#fff" stroke="#ccc" stroke-width="1.2"/>
  </g>
  <text x="62" y="176" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">2</text>
  <text x="150" y="176" text-anchor="middle" font-size="11.5" fill="#333">[3, 1, 1]</text>
  <text x="270" y="176" text-anchor="middle" font-size="11.5" fill="#333">5</text>
  <text x="345" y="176" text-anchor="middle" font-size="11.5" fill="#b03a3a" font-weight="bold">3 / 2</text>
  <text x="475" y="176" text-anchor="middle" font-size="11.5" fill="#7a5415" font-weight="bold">3 % 2 = 1</text>

  <!-- row 4: done -->
  <g filter="url(#sk)">
    <rect x="32" y="188" width="496" height="30" rx="3" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="62" y="208" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-weight="bold">3</text>
  <text x="150" y="208" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-weight="bold">[1, 1, 1]</text>
  <text x="270" y="208" text-anchor="middle" font-size="11.5" fill="#2e6e2e">3</text>
  <text x="345" y="208" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-weight="bold">M=1</text>
  <text x="475" y="208" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-weight="bold">→ return True ✓</text>

  <!-- separator -->
  <path d="M 60 236 Q 280 244 500 236" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5 4" fill="none" filter="url(#sk)"/>

  <!-- modulo optimization panel -->
  <text x="280" y="264" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">取模加速：target = [1, 1000000000]</text>

  <!-- naive -->
  <g filter="url(#sk)">
    <rect x="32" y="280" width="240" height="74" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="48" y="302" font-size="12" fill="#b03a3a" font-weight="bold">朴素逐次减：M − rest 重复减</text>
  <text x="48" y="320" font-size="11" fill="#b03a3a">M = 10⁹，rest = 1</text>
  <text x="48" y="336" font-size="11" fill="#b03a3a">需 10⁹ 次减法 → </text>
  <text x="170" y="336" font-size="11.5" fill="#b03a3a" font-weight="bold">TLE ✗</text>
  <text x="48" y="350" font-size="10.5" fill="#b03a3a">[1,10⁹]→[1,10⁹−1]→…→[1,1]</text>

  <!-- modulo -->
  <g filter="url(#sk)">
    <rect x="288" y="280" width="240" height="74" rx="8" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="304" y="302" font-size="12" fill="#2e6e2e" font-weight="bold">取模一次到位</text>
  <text x="304" y="320" font-size="11" fill="#2e6e2e">prev = 10⁹ % 1 = 0 → prev = rest = 1</text>
  <text x="304" y="336" font-size="11" fill="#2e6e2e">仅 2 次堆操作 → </text>
  <text x="430" y="336" font-size="11.5" fill="#2e6e2e" font-weight="bold">AC ✓</text>
  <text x="304" y="350" font-size="10.5" fill="#2e6e2e">[1,10⁹]→[1,1] 直达全 1</text>

  <!-- explanation box -->
  <g filter="url(#sk)">
    <rect x="32" y="368" width="496" height="60" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="48" y="390" font-size="11.5" fill="#444">同一位置反复是最大值时，rest 不变 → 等价于反复减 rest 直到落到 [1, rest]</text>
  <text x="48" y="408" font-size="11.5" fill="#7a5415" font-weight="bold">这正是辗转相减 → 一 次 M % rest 等价 k 次减法，把 O(值域) 压成 O(log 值域)</text>
  <text x="48" y="422" font-size="10.5" fill="#888">注：M % rest == 0 时取 prev = rest（保证 ≥1，落到全 1 基态或后续被判矛盾）</text>
</svg>
