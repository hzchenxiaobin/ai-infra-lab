<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="560" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算</text>

  <!-- ========= Example 1 ========= -->
  <text x="280" y="50" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">示例 1：a = [1, 3]，b = [2, 1]</text>

  <!-- original stones -->
  <text x="40" y="80" font-size="10" fill="#888">原始：</text>
  <g font-size="11">
    <rect x="80" y="66" width="90" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="125" y="84" text-anchor="middle" fill="#446688">石子0</text>
    <text x="125" y="100" text-anchor="middle" font-size="10" fill="#333">a=1, b=2</text>

    <rect x="190" y="66" width="90" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="235" y="84" text-anchor="middle" fill="#446688">石子1</text>
    <text x="235" y="100" text-anchor="middle" font-size="10" fill="#333">a=3, b=1</text>
  </g>

  <!-- compute sums -->
  <path d="M 125 112 L 125 126" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 235 112 L 235 126" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <text x="40" y="142" font-size="10" fill="#888">求和：</text>
  <g font-size="11">
    <rect x="80" y="128" width="90" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="125" y="149" text-anchor="middle" fill="#333">s[0] = <tspan fill="#d6a040" font-weight="bold">3</tspan></text>

    <rect x="190" y="128" width="90" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="235" y="149" text-anchor="middle" fill="#333">s[1] = <tspan fill="#d6a040" font-weight="bold">4</tspan></text>
  </g>

  <!-- sort arrow -->
  <path d="M 280 144 L 320 144" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="300" y="138" text-anchor="middle" font-size="9" fill="#b85450">降序排</text>

  <!-- sorted -->
  <text x="350" y="142" font-size="10" fill="#888">排序后：</text>
  <g font-size="11">
    <rect x="410" y="128" width="60" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="440" y="149" text-anchor="middle" fill="#b85450" font-weight="bold">石子1 (4)</text>
    <rect x="478" y="128" width="60" height="32" fill="#f0f0f0" stroke="#999" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
    <text x="508" y="149" text-anchor="middle" fill="#666">石子0 (3)</text>
  </g>

  <!-- alternate pick -->
  <text x="40" y="186" font-size="10" fill="#888">交替取：</text>
  <path d="M 440 162 L 440 176" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="440" y="172" text-anchor="middle" font-size="9" fill="#446688">↓ Alice 先取</text>

  <rect x="370" y="184" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="440" y="206" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Alice 取石子1 → +3</text>

  <path d="M 508 162 L 508 230 L 440 230 L 440 244" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="475" y="224" font-size="9" fill="#4a7a3a">Bob 取</text>

  <rect x="370" y="246" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="440" y="268" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Bob 取石子0 → +2</text>

  <!-- result ex1 -->
  <rect x="80" y="246" width="240" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="200" y="271" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">Alice 3 &gt; Bob 2 → 返回 1</text>

  <!-- divider -->
  <path d="M 40 300 L 520 300" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ========= Example 3 ========= -->
  <text x="280" y="324" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">示例 3：a = [2, 4, 3]，b = [1, 6, 7]</text>

  <!-- three stones with sums -->
  <g font-size="10">
    <rect x="60" y="340" width="120" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="120" y="358" text-anchor="middle" fill="#446688">石子0</text>
    <text x="120" y="374" text-anchor="middle" fill="#333">a=2, b=1</text>
    <text x="120" y="386" text-anchor="middle" font-size="9" fill="#d6a040">s = 3</text>

    <rect x="200" y="340" width="120" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="260" y="358" text-anchor="middle" fill="#446688">石子1</text>
    <text x="260" y="374" text-anchor="middle" fill="#333">a=4, b=6</text>
    <text x="260" y="386" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">s = 10</text>

    <rect x="340" y="340" width="120" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="400" y="358" text-anchor="middle" fill="#446688">石子2</text>
    <text x="400" y="374" text-anchor="middle" fill="#333">a=3, b=7</text>
    <text x="400" y="386" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">s = 10</text>
  </g>

  <path d="M 280 392 L 280 408" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="295" y="404" font-size="9" fill="#b85450">按 s 降序</text>

  <!-- sorted pick sequence -->
  <g font-size="10">
    <rect x="60" y="412" width="120" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="120" y="430" text-anchor="middle" fill="#446688" font-weight="bold">石子1 (s=10)</text>
    <text x="120" y="445" text-anchor="middle" font-size="9" fill="#446688">Alice → +4</text>

    <rect x="200" y="412" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="260" y="430" text-anchor="middle" fill="#4a7a3a" font-weight="bold">石子2 (s=10)</text>
    <text x="260" y="445" text-anchor="middle" font-size="9" fill="#4a7a3a">Bob → +7</text>

    <rect x="340" y="412" width="120" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
    <text x="400" y="430" text-anchor="middle" fill="#446688" font-weight="bold">石子0 (s=3)</text>
    <text x="400" y="445" text-anchor="middle" font-size="9" fill="#446688">Alice → +2</text>
  </g>

  <text x="280" y="470" text-anchor="middle" font-size="9" fill="#888">（石子1、2 的 s 相等，谁先谁后不影响分差 —— 同和互换不改变结果）</text>

  <!-- result ex3 -->
  <rect x="120" y="486" width="320" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="506" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">Alice = 4 + 2 = 6，Bob = 7</text>
  <text x="280" y="523" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">6 &lt; 7 → 返回 −1（Bob 胜）</text>

  <text x="280" y="548" text-anchor="middle" font-size="10" fill="#888">两例均验证：按 s = a + b 降序贪心取即为最优策略</text>
</svg>
