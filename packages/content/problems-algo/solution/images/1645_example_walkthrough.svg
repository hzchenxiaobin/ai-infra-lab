<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="600" height="520" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：2020 年逐月已接单的距离 / 时长均值</text>

  <!-- 表头 -->
  <rect x="60" y="44" width="480" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="100" y="62" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">month</text>
  <text x="260" y="62" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">average_ride_distance</text>
  <text x="460" y="62" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">average_ride_duration</text>
  <line x1="160" y1="44" x2="160" y2="70" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="360" y1="44" x2="360" y2="70" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- 12 行数据：蓝色=无接单(0.00)，红色=有接单 -->
  <!-- 行高 26，从 y=70 起 -->
  <g filter="url(#rough2)">
    <rect x="60" y="70" width="480" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <rect x="60" y="96" width="480" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <rect x="60" y="122" width="480" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3"/>
    <rect x="60" y="148" width="480" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <rect x="60" y="174" width="480" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <rect x="60" y="200" width="480" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3"/>
    <rect x="60" y="226" width="480" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3"/>
    <rect x="60" y="252" width="480" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3"/>
    <rect x="60" y="278" width="480" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <rect x="60" y="304" width="480" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <rect x="60" y="330" width="480" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3"/>
    <rect x="60" y="356" width="480" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3"/>
  </g>

  <!-- 行内容 -->
  <g font-size="10" fill="#333">
    <text x="100" y="87" text-anchor="middle">1</text>
    <text x="260" y="87" text-anchor="middle" fill="#446688">0.00</text>
    <text x="460" y="87" text-anchor="middle" fill="#446688">0.00</text>

    <text x="100" y="113" text-anchor="middle">2</text>
    <text x="260" y="113" text-anchor="middle" fill="#446688">0.00</text>
    <text x="460" y="113" text-anchor="middle" fill="#446688">0.00</text>

    <text x="100" y="139" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
    <text x="260" y="139" text-anchor="middle" fill="#b85450" font-weight="bold">63.00</text>
    <text x="460" y="139" text-anchor="middle" fill="#b85450" font-weight="bold">38.00</text>

    <text x="100" y="165" text-anchor="middle">4</text>
    <text x="260" y="165" text-anchor="middle" fill="#446688">0.00</text>
    <text x="460" y="165" text-anchor="middle" fill="#446688">0.00</text>

    <text x="100" y="191" text-anchor="middle">5</text>
    <text x="260" y="191" text-anchor="middle" fill="#446688">0.00</text>
    <text x="460" y="191" text-anchor="middle" fill="#446688">0.00</text>

    <text x="100" y="217" text-anchor="middle" fill="#b85450" font-weight="bold">6</text>
    <text x="260" y="217" text-anchor="middle" fill="#b85450" font-weight="bold">73.00</text>
    <text x="460" y="217" text-anchor="middle" fill="#b85450" font-weight="bold">96.00</text>

    <text x="100" y="243" text-anchor="middle" fill="#b85450" font-weight="bold">7</text>
    <text x="260" y="243" text-anchor="middle" fill="#b85450" font-weight="bold">100.00</text>
    <text x="460" y="243" text-anchor="middle" fill="#b85450" font-weight="bold">28.00</text>

    <text x="100" y="269" text-anchor="middle" fill="#b85450" font-weight="bold">8</text>
    <text x="260" y="269" text-anchor="middle" fill="#b85450" font-weight="bold">119.00</text>
    <text x="460" y="269" text-anchor="middle" fill="#b85450" font-weight="bold">68.00</text>

    <text x="100" y="295" text-anchor="middle">9</text>
    <text x="260" y="295" text-anchor="middle" fill="#446688">0.00</text>
    <text x="460" y="295" text-anchor="middle" fill="#446688">0.00</text>

    <text x="100" y="321" text-anchor="middle">10</text>
    <text x="260" y="321" text-anchor="middle" fill="#446688">0.00</text>
    <text x="460" y="321" text-anchor="middle" fill="#446688">0.00</text>

    <text x="100" y="347" text-anchor="middle" fill="#b85450" font-weight="bold">11</text>
    <text x="260" y="347" text-anchor="middle" fill="#b85450" font-weight="bold">81.50</text>
    <text x="460" y="347" text-anchor="middle" fill="#b85450" font-weight="bold">96.50</text>

    <text x="100" y="373" text-anchor="middle" fill="#b85450" font-weight="bold">12</text>
    <text x="260" y="373" text-anchor="middle" fill="#b85450" font-weight="bold">6.00</text>
    <text x="460" y="373" text-anchor="middle" fill="#b85450" font-weight="bold">38.00</text>
  </g>

  <!-- 列分隔线（贯穿） -->
  <line x1="160" y1="70" x2="160" y2="382" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="360" y1="70" x2="360" y2="382" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- 11 月特写 callout -->
  <path d="M540 347 L500 347" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="60" y="398" width="480" height="104" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="420" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">11 月特写：当月有两单已接 → AVG 取均值</text>
  <text x="80" y="442" font-size="10" fill="#333">ride_id=20：ride_distance=121, ride_duration=92</text>
  <text x="80" y="460" font-size="10" fill="#333">ride_id= 5：ride_distance= 42, ride_duration=101</text>
  <text x="80" y="482" font-size="10" fill="#b85450" font-weight="bold">AVG(distance) = (121 + 42) / 2 = 81.50</text>
  <text x="300" y="482" font-size="10" fill="#b85450" font-weight="bold">AVG(duration) = (92 + 101) / 2 = 96.50</text>
  <text x="80" y="498" font-size="9" fill="#888">其余有接单月仅一单 → AVG = 该单值本身；无接单月 → COALESCE(NULL,0) = 0.00</text>
</svg>
