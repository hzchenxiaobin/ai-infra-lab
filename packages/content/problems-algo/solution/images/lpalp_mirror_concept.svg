<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：镜像构造 2n 位回文</text>

  <!-- ===== Row 1: x = 90 (n=2), blue ===== -->
  <text x="48" y="84" font-size="12.5" fill="#446688" font-weight="bold">x = 90</text>
  <text x="48" y="100" font-size="10" fill="#888">n = 2 位</text>
  <text x="194" y="56" text-anchor="middle" font-size="10" fill="#888">x 的位</text>
  <rect x="170" y="62" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="195" y="86" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">9</text>
  <rect x="226" y="62" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="251" y="86" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">0</text>
  <text x="292" y="86" font-size="10.5" fill="#888">← 取上界附近</text>

  <!-- mirror arrow + label -->
  <path d="M 251 104 Q 251 118 251 128" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="292" y="120" font-size="11" fill="#4a7a3a" font-weight="bold">拼接 reverse(x)</text>

  <!-- ===== Row 2: P = 9009 (left blue = x, right orange = reverse) ===== -->
  <text x="48" y="166" font-size="12.5" fill="#d6a040" font-weight="bold">P = 9009</text>
  <text x="48" y="182" font-size="10" fill="#888">2n = 4 位回文</text>
  <rect x="150" y="146" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="175" y="170" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">9</text>
  <rect x="206" y="146" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="231" y="170" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">0</text>
  <!-- mirror seam -->
  <line x1="258" y1="142" x2="258" y2="186" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <rect x="262" y="146" width="50" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="287" y="170" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">0</text>
  <rect x="318" y="146" width="50" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="343" y="170" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">9</text>
  <text x="378" y="170" font-size="10.5" fill="#b85450" font-weight="bold">← 镜像对称</text>

  <!-- = line -->
  <line x1="150" y1="194" x2="368" y2="194" stroke="#888" stroke-width="1.4" stroke-dasharray="3 3" filter="url(#rough2)"/>

  <!-- ===== Row 3: factorization 9009 = 99 × 91 ===== -->
  <text x="48" y="232" font-size="12.5" fill="#b85450" font-weight="bold">验证因式</text>
  <text x="48" y="248" font-size="10" fill="#888">两 n 位因子</text>
  <rect x="150" y="214" width="70" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="185" y="238" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">99</text>
  <text x="232" y="238" text-anchor="middle" font-size="16" fill="#555" font-weight="bold">×</text>
  <rect x="250" y="214" width="70" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="285" y="238" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">91</text>
  <text x="334" y="238" font-size="11" fill="#4a7a3a" font-weight="bold">两个都是 2 位 ✓</text>

  <!-- formula box -->
  <rect x="40" y="276" width="240" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="160" y="296" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">回文构造公式</text>
  <text x="160" y="318" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">P = x · 10^n + reverse(x)</text>
  <text x="160" y="336" text-anchor="middle" font-size="10.5" fill="#d6a040">x 从大到小枚举</text>

  <!-- insight box -->
  <rect x="300" y="276" width="220" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="410" y="296" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">关键转化</text>
  <text x="410" y="316" text-anchor="middle" font-size="11" fill="#4a7a3a">生成回文（降序）</text>
  <text x="410" y="332" text-anchor="middle" font-size="11" fill="#4a7a3a">再验可分解性</text>

  <!-- bottom note -->
  <rect x="40" y="356" width="480" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="376" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">首个能分解为两个 n 位因子之积的回文即答案</text>
  <text x="280" y="392" text-anchor="middle" font-size="10.5" fill="#b85450">n ≥ 2 时答案恒为 2n 位；n = 1 特判返回 9</text>

  <rect x="40" y="408" width="480" height="0" fill="none"/>
</svg>
