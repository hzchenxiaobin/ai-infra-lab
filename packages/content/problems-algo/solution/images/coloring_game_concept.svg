<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="30" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">染 x=3 后，树被切成三个互不相通的区域</text>

  <!-- 区域底色块（粗略圈出三块） -->
  <path d="M 250 60 Q 220 130 80 200 Q 40 280 50 330 Q 200 360 280 260 Q 300 160 250 60 Z"
        fill="#e8f0fe" opacity="0.5" filter="url(#rough2)"/>
  <path d="M 330 180 Q 360 210 360 240 Q 360 270 330 250 Q 330 210 330 180 Z"
        fill="#e6f4ea" opacity="0.6" filter="url(#rough2)"/>
  <path d="M 450 180 Q 490 210 490 240 Q 490 270 450 250 Q 450 210 450 180 Z"
        fill="#fff8e1" opacity="0.6" filter="url(#rough2)"/>

  <!-- 树边 -->
  <line x1="300" y1="82" x2="180" y2="150" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="312" y1="82" x2="420" y2="150" stroke="#b85450" stroke-width="2" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <line x1="170" y1="162" x2="100" y2="230" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="190" y1="162" x2="260" y2="230" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="410" y1="162" x2="360" y2="230" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <line x1="430" y1="162" x2="480" y2="230" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <line x1="92" y1="242" x2="60" y2="310" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="108" y1="242" x2="140" y2="310" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="252" y1="242" x2="220" y2="310" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="268" y1="242" x2="300" y2="310" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>

  <!-- 父方区域节点（蓝色） -->
  <circle cx="300" cy="70" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="74" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>

  <circle cx="180" cy="150" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="154" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>

  <circle cx="100" cy="230" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="100" y="234" text-anchor="middle" font-size="10" fill="#333">4</text>
  <circle cx="260" cy="230" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="260" y="234" text-anchor="middle" font-size="10" fill="#333">5</text>

  <circle cx="60" cy="310" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="60" y="314" text-anchor="middle" font-size="9" fill="#333">8</text>
  <circle cx="140" cy="310" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="140" y="314" text-anchor="middle" font-size="9" fill="#333">9</text>
  <circle cx="220" cy="310" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="220" y="314" text-anchor="middle" font-size="9" fill="#333">10</text>
  <circle cx="300" cy="310" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="300" y="314" text-anchor="middle" font-size="9" fill="#333">11</text>

  <!-- x 节点（红色屏障） -->
  <circle cx="420" cy="150" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="420" y="154" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <text x="448" y="146" font-size="11" fill="#b85450" font-weight="bold">x</text>

  <!-- 左子树区域节点（绿） -->
  <circle cx="360" cy="230" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="234" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">6</text>

  <!-- 右子树区域节点（橙） -->
  <circle cx="480" cy="230" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="480" y="234" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">7</text>

  <!-- 三区域标注 -->
  <rect x="430" y="355" width="170" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="515" y="374" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">父方区域 = 8</text>
  <text x="515" y="389" text-anchor="middle" font-size="9" fill="#666">{1,2,4,5,8,9,10,11}</text>

  <rect x="315" y="355" width="105" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="367" y="374" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">左子树 = 1</text>
  <text x="367" y="389" text-anchor="middle" font-size="9" fill="#666">{6}</text>

  <rect x="200" y="355" width="105" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="252" y="374" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">右子树 = 1</text>
  <text x="252" y="389" text-anchor="middle" font-size="9" fill="#666">{7}</text>

  <text x="310" y="425" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">x 是屏障：三条通道在 x 处同时锁死，区域间互不相通</text>
  <text x="310" y="443" text-anchor="middle" font-size="10" fill="#666">三块和 = n - 1 = 10，二号取最大那块 8 &gt; n/2=5.5 ⇒ 必胜</text>
</svg>
