<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一趟正向扫描 + 奇偶分流</text>

  <!-- Step 1: init -->
  <rect x="200" y="44" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">开始</text>
  <text x="280" y="77" text-anchor="middle" font-size="10" fill="#555">n==0? 返回 0</text>

  <line x1="280" y1="84" x2="280" y2="100" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init box -->
  <rect x="190" y="100" width="180" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="118" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">初始化</text>
  <text x="280" y="134" text-anchor="middle" font-size="10" fill="#555">nums[0]=0, nums[1]=1, ans=1</text>

  <line x1="280" y1="144" x2="280" y2="160" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop header -->
  <rect x="170" y="160" width="220" height="40" fill="#fff" stroke="#666" stroke-width="1.5" rx="20" filter="url(#rough2)"/>
  <text x="280" y="184" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">for j = 2 .. n</text>

  <line x1="280" y1="200" x2="280" y2="216" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision diamond: j even? -->
  <polygon points="280,216 360,256 280,296 200,256" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="252" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">j 是偶数？</text>
  <text x="280" y="266" text-anchor="middle" font-size="9" fill="#888">(j &amp; 1) == 0</text>

  <!-- left: even branch -->
  <line x1="200" y1="256" x2="120" y2="256" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="250" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="36" y="238" width="84" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="78" y="260" text-anchor="middle" font-size="10" fill="#4a7a3a">nums[j]=nums[j/2]</text>

  <!-- right: odd branch -->
  <line x1="360" y1="256" x2="440" y2="256" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="250" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">否</text>
  <rect x="440" y="238" width="104" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="492" y="252" text-anchor="middle" font-size="9" fill="#d6a040">nums[j]=nums[j/2]</text>
  <text x="492" y="264" text-anchor="middle" font-size="9" fill="#d6a040">+ nums[j/2+1]</text>

  <!-- merge down -->
  <line x1="78" y1="274" x2="78" y2="312" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="492" y1="274" x2="492" y2="312" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="78" y1="312" x2="492" y2="312" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="280" y1="312" x2="280" y2="328" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- update max -->
  <rect x="180" y="328" width="200" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="346" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">刷新最大值</text>
  <text x="280" y="362" text-anchor="middle" font-size="10" fill="#555">ans = max(ans, nums[j])</text>

  <!-- loop back -->
  <path d="M 380 348 L 540 348 L 540 180 L 390 180" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="544" y="266" font-size="9" fill="#999" text-anchor="middle" transform="rotate(90 544 266)">下一轮 j</text>

  <!-- end -->
  <line x1="280" y1="368" x2="280" y2="384" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="210" y="384" width="140" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="402" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">循环结束</text>
  <text x="280" y="416" text-anchor="middle" font-size="10" fill="#555">返回 ans</text>

  <!-- side note -->
  <rect x="36" y="332" width="130" height="90" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="46" y="350" font-size="10" fill="#d6a040" font-weight="bold">边界</text>
  <text x="46" y="366" font-size="10" fill="#555">• n=0 → 只有 nums[0]=0</text>
  <text x="46" y="380" font-size="10" fill="#555">  直接返回 0</text>
  <text x="46" y="394" font-size="10" fill="#555">• n=1 → ans 初始化为 1</text>
  <text x="46" y="408" font-size="10" fill="#555">  循环不执行</text>
</svg>
