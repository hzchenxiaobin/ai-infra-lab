<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="372" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一条 SELECT 走完——派生列 → RANK 打名次 → 排序输出</text>

  <rect x="56" y="38" width="408" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="76" y="56" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">① FROM TeamStats</text>
  <text x="76" y="72" font-size="10" fill="#333" filter="url(#rough2)">n 行原始表：team_id · team_name · wins · draws（losses / matches_played 用不上）</text>

  <path d="M 260 84 L 260 96" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="56" y="98" width="408" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="76" y="116" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">② SELECT 投影派生列</text>
  <text x="76" y="134" font-size="10" fill="#333" filter="url(#rough2)">points = wins × 3 + draws —— 一行表达式，聚合、连接统统不需要</text>

  <path d="M 260 146 L 260 158" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="56" y="160" width="408" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="76" y="178" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">③ 窗口函数打名次</text>
  <text x="76" y="194" font-size="10" fill="#333" filter="url(#rough2)">RANK() OVER (ORDER BY wins × 3 + draws DESC) AS position</text>
  <text x="76" y="210" font-size="10" fill="#333" filter="url(#rough2)">同分同名次；并列占坑，名次跳号 → 1, 1, 3, 4, 5</text>

  <path d="M 260 220 L 260 232" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="56" y="234" width="408" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="76" y="252" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">④ 外层排序输出（与名次解耦）</text>
  <text x="76" y="268" font-size="10" fill="#333" filter="url(#rough2)">ORDER BY points DESC, team_name ASC</text>
  <text x="76" y="284" font-size="10" fill="#333" filter="url(#rough2)">并列内部按队名字典序：Liverpool &lt; Manchester City</text>

  <rect x="56" y="300" width="408" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="316" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠️ 两套 ORDER BY 各管各的：窗口里的管「名次怎么打」，</text>
  <text x="260" y="332" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">外层的管「行怎么排」；并列内部谁先谁后不影响 position 的值</text>

  <text x="260" y="360" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">逻辑顺序：FROM → WHERE → GROUP BY → 窗口函数 → SELECT → ORDER BY</text>
</svg>
