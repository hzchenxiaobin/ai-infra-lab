<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#666"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心转化：双排列 → 单数组 → 递增三元组计数</text>
  <text x="290" y="44" text-anchor="middle" font-size="10.5" fill="#888">好三元组 (x,y,z)：pos1 递增 且 pos2 递增 ⟺ A 中递增三元组</text>

  <!-- ===== Step 1: Two arrays ===== -->
  <text x="30" y="72" font-size="11.5" fill="#446688" font-weight="bold">① 两个排列（值 v 在两数组中的位置）</text>

  <!-- nums1 row -->
  <text x="30" y="94" font-size="10" fill="#888">nums1:</text>
  <text x="78" y="90" text-anchor="middle" font-size="8.5" fill="#888">pos1=0</text>
  <text x="118" y="90" text-anchor="middle" font-size="8.5" fill="#888">1</text>
  <text x="158" y="90" text-anchor="middle" font-size="8.5" fill="#888">2</text>
  <text x="198" y="90" text-anchor="middle" font-size="8.5" fill="#888">3</text>
  <rect x="58" y="96" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="78" y="116" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="98" y="96" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="116" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="138" y="96" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="158" y="116" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="178" y="96" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="198" y="116" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>

  <!-- nums2 row -->
  <text x="30" y="146" font-size="10" fill="#888">nums2:</text>
  <text x="78" y="142" text-anchor="middle" font-size="8.5" fill="#888">pos2=0</text>
  <text x="118" y="142" text-anchor="middle" font-size="8.5" fill="#888">1</text>
  <text x="158" y="142" text-anchor="middle" font-size="8.5" fill="#888">2</text>
  <text x="198" y="142" text-anchor="middle" font-size="8.5" fill="#888">3</text>
  <rect x="58" y="148" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="78" y="168" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="98" y="148" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="168" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="138" y="148" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="158" y="168" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="178" y="148" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="198" y="168" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>

  <!-- arrow down to transform -->
  <path d="M 128 184 L 128 198" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="230" y="194" font-size="10" fill="#888">A[i] = pos2[nums1[i]]，按 nums1 顺序记录每个值在 nums2 中的位置</text>

  <!-- ===== Step 2: Transformed array A ===== -->
  <text x="30" y="216" font-size="11.5" fill="#b85450" font-weight="bold">② 转化为一维数组 A（关键是 A 的递增三元组 = 好三元组）</text>

  <text x="30" y="238" font-size="10" fill="#888">A:</text>
  <text x="78" y="234" text-anchor="middle" font-size="8.5" fill="#888">i=0</text>
  <text x="118" y="234" text-anchor="middle" font-size="8.5" fill="#888">1</text>
  <text x="158" y="234" text-anchor="middle" font-size="8.5" fill="#888">2</text>
  <text x="198" y="234" text-anchor="middle" font-size="8.5" fill="#888">3</text>
  <rect x="58" y="240" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="78" y="260" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="98" y="240" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="260" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="138" y="240" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="158" y="260" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="178" y="240" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="198" y="260" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>

  <!-- highlight the increasing triplet (0,1,3) at positions 1,2,3 -->
  <path d="M 118 276 L 118 284 L 198 284 L 198 276" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="158" y="298" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">A[1]=0 &lt; A[2]=1 &lt; A[3]=3 ✓ 递增三元组</text>

  <!-- ===== Right side: Counting formula ===== -->
  <line x1="280" y1="210" x2="280" y2="430" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <text x="430" y="72" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">③ 拆分计数：固定中间元素 j</text>

  <!-- formula box 1 -->
  <rect x="300" y="84" width="260" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="430" y="104" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">好三元组 = (i, j, k)</text>
  <text x="430" y="120" text-anchor="middle" font-size="10.5" fill="#555">i &lt; j &lt; k 且 A[i] &lt; A[j] &lt; A[k]</text>
  <text x="430" y="136" text-anchor="middle" font-size="10" fill="#888">固定中间 j，左右独立选择</text>

  <path d="M 430 148 L 430 162" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- left count -->
  <rect x="300" y="166" width="120" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="360" y="186" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">left[j]</text>
  <text x="360" y="202" text-anchor="middle" font-size="9.5" fill="#555">i &lt; j 且</text>
  <text x="360" y="216" text-anchor="middle" font-size="9.5" fill="#555">A[i] &lt; A[j]</text>
  <text x="360" y="228" text-anchor="middle" font-size="9" fill="#888">BIT 从左扫</text>

  <!-- right count -->
  <rect x="440" y="166" width="120" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="500" y="186" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">right[j]</text>
  <text x="500" y="202" text-anchor="middle" font-size="9.5" fill="#555">k &gt; j 且</text>
  <text x="500" y="216" text-anchor="middle" font-size="9.5" fill="#555">A[k] &gt; A[j]</text>
  <text x="500" y="228" text-anchor="middle" font-size="9" fill="#888">BIT 从右扫</text>

  <path d="M 360 234 L 360 248 L 500 248 L 500 234" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 430 248 L 430 262" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <!-- multiply -->
  <rect x="360" y="266" width="140" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="430" y="289" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">left[j] × right[j]</text>

  <path d="M 430 306 L 430 320" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- final formula -->
  <rect x="320" y="324" width="220" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="430" y="346" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">答案 = Σ left[j]·right[j]</text>
  <text x="430" y="362" text-anchor="middle" font-size="10" fill="#888">对每个 j 枚举，乘法原理</text>

  <!-- ===== Bottom: why it works ===== -->
  <rect x="30" y="320" width="230" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="145" y="340" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">为什么转化等价？</text>
  <text x="40" y="358" font-size="10" fill="#555">• A 按 nums1 的顺序排列</text>
  <text x="40" y="372" font-size="10" fill="#555">  → i &lt; j &lt; k ⟺ pos1 递增</text>
  <text x="40" y="390" font-size="10" fill="#555">• A[i] = pos2[值]</text>
  <text x="40" y="404" font-size="10" fill="#555">  → A[i]&lt;A[j]&lt;A[k] ⟺ pos2 递增</text>
  <text x="40" y="422" font-size="10" fill="#b85450" font-weight="bold">  两个条件同时满足 = 好三元组 ✓</text>
</svg>
