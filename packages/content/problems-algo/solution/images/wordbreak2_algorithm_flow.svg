<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="480" height="500" fill="#fafafa"/>

  <!-- Title -->
  <text x="240" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">单词拆分 II：记忆化 DFS 算法流程</text>

  <!-- Start: dfs(start) -->
  <rect x="170" y="40" width="140" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="15" filter="url(#rough2)"/>
  <text x="240" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">调用 dfs(start)</text>

  <!-- arrow -->
  <path d="M 240 70 L 240 88" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: start == n? -->
  <polygon points="240,90 330,130 240,170 150,130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="126" text-anchor="middle" font-size="11" fill="#333">start == n ?</text>
  <text x="240" y="140" text-anchor="middle" font-size="10" fill="#888">后缀为空</text>

  <!-- Yes branch: return [""] -->
  <path d="M 330 130 L 380 130" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="356" y="124" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="380" y="116" width="84" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="422" y="135" text-anchor="middle" font-size="10" fill="#333">return [“”]</text>

  <!-- No arrow down -->
  <path d="M 240 170 L 240 188" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="252" y="184" font-size="10" fill="#888">否</text>

  <!-- Decision: start in memo? -->
  <polygon points="240,190 340,230 240,270 140,230" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="226" text-anchor="middle" font-size="11" fill="#333">start ∈ memo ?</text>
  <text x="240" y="240" text-anchor="middle" font-size="10" fill="#888">命中缓存</text>

  <!-- Yes: return memo[start] -->
  <path d="M 340 230 L 380 230" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="356" y="224" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="380" y="216" width="92" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="426" y="235" text-anchor="middle" font-size="10" fill="#333">return memo</text>

  <!-- No down -->
  <path d="M 240 270 L 240 288" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="252" y="284" font-size="10" fill="#888">否</text>

  <!-- Init results -->
  <rect x="170" y="290" width="140" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="240" y="309" text-anchor="middle" font-size="11" fill="#333">results = []</text>

  <path d="M 240 318 L 240 336" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop: for each word length L -->
  <rect x="130" y="338" width="220" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="240" y="357" text-anchor="middle" font-size="11" fill="#333">遍历每个 word ∈ wordDict</text>

  <path d="M 240 366 L 240 384" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: match? -->
  <polygon points="240,386 340,416 240,446 140,416" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="412" text-anchor="middle" font-size="10" fill="#333">s[start:end]</text>
  <text x="240" y="425" text-anchor="middle" font-size="10" fill="#333">== word ?</text>

  <!-- Yes: recurse + combine -->
  <path d="M 340 416 L 380 416" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="356" y="410" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="380" y="396" width="92" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="426" y="412" text-anchor="middle" font-size="9" fill="#333">sub = dfs(end)</text>
  <text x="426" y="426" text-anchor="middle" font-size="9" fill="#333">拼接进 results</text>

  <!-- No: next word (loop back) -->
  <path d="M 140 416 L 60 416" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="90" y="410" font-size="9" fill="#888">否</text>
  <path d="M 60 416 L 60 352 L 130 352" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="40" y="386" font-size="9" fill="#888">下一个</text>
  <text x="40" y="398" font-size="9" fill="#888">word</text>

  <!-- after loop: store memo + return -->
  <path d="M 240 446 L 240 460" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="456" font-size="9" fill="#888">遍历结束</text>
  <rect x="150" y="462" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="240" y="482" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">memo[start]=results; return</text>
</svg>
