<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">
    核心观察：相邻两个 1 之间的「空隙」决定切分方式数
  </text>

  <!-- nums array [0,1,0,0,1] -->
  <text x="40" y="78" font-size="12" fill="#888" filter="url(#rough2)">nums:</text>
  <!-- index 0: 0 -->
  <rect x="90" y="58" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="84" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="120" y="112" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">0</text>
  <!-- index 1: 1 -->
  <rect x="158" y="58" width="60" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="188" y="112" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">1</text>
  <!-- index 2: 0 -->
  <rect x="226" y="58" width="60" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="256" y="84" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="256" y="112" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">2</text>
  <!-- index 3: 0 -->
  <rect x="294" y="58" width="60" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="324" y="84" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="324" y="112" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">3</text>
  <!-- index 4: 1 -->
  <rect x="362" y="58" width="60" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="392" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="392" y="112" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">4</text>

  <!-- 1s positions -->
  <text x="188" y="50" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">p₁=1</text>
  <text x="392" y="50" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">p₂=4</text>

  <!-- Gap bracket between the two 1s -->
  <path d="M 188 130 Q 290 150 392 130" stroke="#d6a040" stroke-width="2" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <rect x="252" y="138" width="76" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="156" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">空隙 = 2 个 0</text>

  <!-- Formula box -->
  <rect x="60" y="186" width="520" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="320" y="210" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">
    该空隙的切分方式数 = (0 的个数) + 1 = (p₂ − p₁)
  </text>
  <text x="320" y="232" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">
    切点可放在「紧跟 p₁ 之后」…「紧贴 p₂ 之前」共 (p₂−p₁) 处
  </text>

  <!-- Answer for this gap -->
  <rect x="180" y="262" width="280" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="320" y="282" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">本例答案 = (p₂ − p₁) = (4 − 1) = </text>
  <text x="320" y="300" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450" filter="url(#rough2)">3</text>

  <text x="320" y="328" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">
    多个 1 时：总方式数 = ∏ (相邻两个 1 的下标差) ，每个空隙独立选择切点位置
  </text>
</svg>
