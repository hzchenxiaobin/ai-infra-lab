<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：逐词独立排列，连乘得总数</text>

  <text x="40" y="62" font-size="11" fill="#888">s =</text>
  <rect x="70" y="48" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="85" y="66" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">t</text>
  <rect x="100" y="48" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="66" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">o</text>
  <rect x="130" y="48" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="145" y="66" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">o</text>
  <text x="172" y="66" text-anchor="middle" font-size="13" fill="#aaa">␣</text>
  <rect x="190" y="48" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="205" y="66" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">h</text>
  <rect x="220" y="48" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="235" y="66" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">o</text>
  <rect x="250" y="48" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="265" y="66" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">t</text>

  <path d="M 115 78 L 115 96" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="40" y="100" width="190" height="120" fill="#f6fff7" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="135" y="120" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">单词 "too"</text>
  <text x="135" y="140" text-anchor="middle" font-size="11" fill="#333">L = 3　频次 {t:1, o:2}</text>
  <text x="135" y="162" text-anchor="middle" font-size="12" fill="#333">P = 3! / (1! · 2!)</text>
  <text x="135" y="182" text-anchor="middle" font-size="11" fill="#888">= 6 / 2</text>
  <rect x="92" y="190" width="86" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="205" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">P = 3</text>

  <text x="280" y="172" text-anchor="middle" font-size="24" fill="#b85450" font-weight="bold">×</text>

  <path d="M 265 78 L 265 96" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="330" y="100" width="190" height="120" fill="#f3f7ff" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="425" y="120" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">单词 "hot"</text>
  <text x="425" y="140" text-anchor="middle" font-size="11" fill="#333">L = 3　频次 {h:1, o:1, t:1}</text>
  <text x="425" y="162" text-anchor="middle" font-size="12" fill="#333">P = 3! / (1!·1!·1!)</text>
  <text x="425" y="182" text-anchor="middle" font-size="11" fill="#888">= 6 / 1</text>
  <rect x="382" y="190" width="86" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="425" y="205" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">P = 6</text>

  <text x="280" y="254" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">ans = 3 × 6 = <tspan fill="#b85450" font-weight="bold" font-size="18">18</tspan></text>

  <rect x="40" y="282" width="480" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="304" text-anchor="middle" font-size="12.5" fill="#333">单词排列数 P(w) = L! / ∏ c_i!　（多重集全排列，相同字符去重）</text>
  <text x="280" y="326" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">总数 = 各单词 P(w) 连乘（乘法原理：词间独立）</text>
</svg>
