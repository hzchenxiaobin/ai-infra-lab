<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">算法流程：按符号分治，正数升序+前导零修正，负数降序</text>

  <!-- Input -->
  <rect x="200" y="30" width="140" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="270" y="51" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">输入 num</text>

  <!-- Arrow down -->
  <path d="M 270 64 L 270 76" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: num == 0? -->
  <polygon points="270,78 350,102 270,126 190,102" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="106" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">num == 0?</text>

  <!-- Yes -> return 0 -->
  <path d="M 350 102 L 400 102" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="98" font-size="9.5" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="400" y="88" width="90" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="445" y="107" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回 0</text>

  <!-- No -> down -->
  <path d="M 270 126 L 270 138" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="134" font-size="9.5" fill="#888">否</text>

  <!-- Decision: num > 0? -->
  <polygon points="270,140 360,168 270,196 180,168" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="172" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">num > 0?</text>

  <!-- Yes -> left branch -->
  <path d="M 180 168 L 135 168 L 135 188" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="148" y="164" font-size="9.5" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- No -> right branch -->
  <path d="M 360 168 L 405 168 L 405 188" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="164" font-size="9.5" fill="#b85450" font-weight="bold">否</text>

  <!-- ===== Left branch (positive) ===== -->
  <rect x="75" y="190" width="120" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="135" y="208" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">提取数位</text>
  <text x="135" y="221" text-anchor="middle" font-size="9.5" fill="#888">str(num) → 字符列表</text>

  <path d="M 135 228 L 135 240" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="75" y="242" width="120" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="135" y="260" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">升序排序</text>
  <text x="135" y="273" text-anchor="middle" font-size="9.5" fill="#888">小数位 → 高位</text>

  <path d="M 135 280 L 135 292" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="65" y="294" width="140" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="135" y="312" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">处理前导零</text>
  <text x="135" y="326" text-anchor="middle" font-size="9.5" fill="#888">首个非零换到首位</text>

  <path d="M 135 336 L 135 348" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="75" y="350" width="120" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="135" y="373" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">拼成正整数</text>

  <!-- ===== Right branch (negative) ===== -->
  <rect x="345" y="190" width="120" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="405" y="208" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">提取 |num| 数位</text>
  <text x="405" y="221" text-anchor="middle" font-size="9.5" fill="#888">先取绝对值</text>

  <path d="M 405 228 L 405 240" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="345" y="242" width="120" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="405" y="260" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">降序排序</text>
  <text x="405" y="273" text-anchor="middle" font-size="9.5" fill="#888">大数位 → 高位</text>

  <path d="M 405 280 L 405 292" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="335" y="294" width="140" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="405" y="312" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">首位必非零</text>
  <text x="405" y="326" text-anchor="middle" font-size="9.5" fill="#888">降序保证，无需修正</text>

  <path d="M 405 336 L 405 348" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="345" y="350" width="120" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="405" y="373" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">拼成整数并取负</text>

  <!-- Converge to return -->
  <path d="M 135 386 L 135 402 L 268 402" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 405 386 L 405 402 L 272 402" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <rect x="200" y="406" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="15" filter="url(#rough2)"/>
  <text x="270" y="426" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回结果</text>
</svg>
