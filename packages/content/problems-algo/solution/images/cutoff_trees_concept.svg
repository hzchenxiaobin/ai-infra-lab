<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
      <path d="M0 0 L7 3 L0 6 z" fill="#555"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
      <path d="M0 0 L7 3 L0 6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="760" height="400" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">为高尔夫比赛砍树：高度排序 + 顺序 BFS 求段距</text>
  <path d="M 240 40 Q 380 48 520 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== Left: forest grid (example 1) ===== -->
  <text x="115" y="74" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">forest 网格（0=障碍, 1=地面, &gt;1=树高）</text>
  <g font-size="15" filter="url(#rough2)">
    <!-- row 0: 1 2 3 -->
    <rect x="60" y="90" width="50" height="50" fill="#fff" stroke="#bbb"/>
    <text x="85" y="122" text-anchor="middle" fill="#888">1</text>
    <rect x="110" y="90" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="135" y="122" text-anchor="middle" fill="#2e5e2e" font-weight="bold">2</text>
    <rect x="160" y="90" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="185" y="122" text-anchor="middle" fill="#2e5e2e" font-weight="bold">3</text>
    <!-- row 1: 0 0 4 -->
    <rect x="60" y="140" width="50" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="85" y="172" text-anchor="middle" fill="#b03a3a" font-weight="bold">0</text>
    <rect x="110" y="140" width="50" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="135" y="172" text-anchor="middle" fill="#b03a3a" font-weight="bold">0</text>
    <rect x="160" y="140" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="185" y="172" text-anchor="middle" fill="#2e5e2e" font-weight="bold">4</text>
    <!-- row 2: 7 6 5 -->
    <rect x="60" y="190" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="85" y="222" text-anchor="middle" fill="#2e5e2e" font-weight="bold">7</text>
    <rect x="110" y="190" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="135" y="222" text-anchor="middle" fill="#2e5e2e" font-weight="bold">6</text>
    <rect x="160" y="190" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="185" y="222" text-anchor="middle" fill="#2e5e2e" font-weight="bold">5</text>
  </g>
  <circle cx="85" cy="115" r="9" fill="none" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="115" y="262" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">↑ 起点 (0,0)</text>

  <!-- arrow: collect & sort -->
  <path d="M225 155 L290 155" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="257" y="146" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">收集&gt;1</text>
  <text x="257" y="170" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">按高排序</text>

  <!-- ===== Middle: sorted tree list ===== -->
  <g filter="url(#rough2)">
    <rect x="295" y="88" width="150" height="170" rx="8" fill="#fffdf3" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="370" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#rough2)">砍树序列（高度↑）</text>
  <g font-size="12" fill="#444" filter="url(#rough2)">
    <text x="312" y="132">h=2 → (0,1)</text>
    <text x="312" y="152">h=3 → (0,2)</text>
    <text x="312" y="172">h=4 → (1,2)</text>
    <text x="312" y="192">h=5 → (2,2)</text>
    <text x="312" y="212">h=6 → (2,1)</text>
    <text x="312" y="232">h=7 → (2,0)</text>
  </g>
  <text x="370" y="252" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">顺序由高度唯一确定</text>

  <!-- arrow: sequential BFS -->
  <path d="M450 155 L515 155" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="482" y="146" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">逐段</text>
  <text x="482" y="170" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">BFS</text>

  <!-- ===== Right: chain of segments ===== -->
  <text x="640" y="74" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">分段求距并累加</text>
  <g font-size="11" filter="url(#rough2)">
    <!-- start node -->
    <rect x="525" y="92" width="70" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="560" y="109" text-anchor="middle" fill="#2a4a6a" font-weight="bold">start(0,0)</text>
    <!-- seg 1 -->
    <path d="M595 105 L625 105" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)"/>
    <text x="610" y="98" text-anchor="middle" font-size="9" fill="#4a7a3a">+1</text>
    <!-- T1 -->
    <rect x="625" y="92" width="60" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="655" y="109" text-anchor="middle" fill="#2e5e2e" font-weight="bold">T1:h2</text>

    <path d="M655 118 L655 138" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)"/>
    <text x="668" y="132" font-size="9" fill="#4a7a3a">+1</text>
    <rect x="625" y="138" width="60" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="655" y="155" text-anchor="middle" fill="#2e5e2e" font-weight="bold">T2:h3</text>

    <path d="M655 164 L655 184" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)"/>
    <text x="668" y="178" font-size="9" fill="#4a7a3a">+1</text>
    <rect x="625" y="184" width="60" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="655" y="201" text-anchor="middle" fill="#2e5e2e" font-weight="bold">T3:h4</text>

    <path d="M655 210 L655 230" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)"/>
    <text x="668" y="224" font-size="9" fill="#4a7a3a">+1</text>
    <rect x="625" y="230" width="60" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="655" y="247" text-anchor="middle" fill="#2e5e2e" font-weight="bold">T4:h5</text>

    <text x="655" y="276" text-anchor="middle" font-size="10" fill="#888">⋮ 继续至 T6</text>
  </g>
  <text x="640" y="300" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans = Σ 段距</text>

  <!-- ===== Bottom note ===== -->
  <g filter="url(#rough2)">
    <rect x="60" y="318" width="640" height="68" rx="8" fill="#fffdf3" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="380" y="342" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">核心：顺序固定 → 分解为 k 段独立最短路 → 每段 BFS</text>
  <g font-size="11" fill="#444" filter="url(#rough2)">
    <text x="80" y="366">· 砍树序列由高度升序唯一确定，无法跳序（可能要先绕远砍矮树再折返）</text>
    <text x="80" y="382">· 每段独立 BFS 求最短步数；任一段返回 -1 则整体 -1。砍后格子变 1 仍可通行，只有 0 是障碍。</text>
  </g>
</svg>
