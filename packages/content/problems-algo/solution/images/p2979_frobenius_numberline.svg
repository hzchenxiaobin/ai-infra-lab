<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：价格轴上最后一个红格 = a·b − a − b</text>
  <text x="280" y="48" text-anchor="middle" font-size="12" fill="#666">以硬币面值 a = 2，b = 5 为例</text>

  <!-- 数轴格子 0..12 -->
  <g>
    <rect x="38" y="110" width="38" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="57" y="136" text-anchor="middle" font-size="13" fill="#333">0</text>
    <rect x="76" y="110" width="38" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="95" y="136" text-anchor="middle" font-size="13" fill="#333">1</text>
    <rect x="114" y="110" width="38" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="133" y="136" text-anchor="middle" font-size="13" fill="#333">2</text>
    <rect x="152" y="110" width="38" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
    <text x="171" y="136" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">3</text>
    <rect x="190" y="110" width="38" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="209" y="136" text-anchor="middle" font-size="13" fill="#333">4</text>
    <rect x="228" y="110" width="38" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="247" y="136" text-anchor="middle" font-size="13" fill="#333">5</text>
    <rect x="266" y="110" width="38" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="285" y="136" text-anchor="middle" font-size="13" fill="#333">6</text>
    <rect x="304" y="110" width="38" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="323" y="136" text-anchor="middle" font-size="13" fill="#333">7</text>
    <rect x="342" y="110" width="38" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="361" y="136" text-anchor="middle" font-size="13" fill="#333">8</text>
    <rect x="380" y="110" width="38" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="399" y="136" text-anchor="middle" font-size="13" fill="#333">9</text>
    <rect x="418" y="110" width="38" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="437" y="136" text-anchor="middle" font-size="13" fill="#333">10</text>
    <rect x="456" y="110" width="38" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="475" y="136" text-anchor="middle" font-size="13" fill="#333">11</text>
    <rect x="494" y="110" width="38" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="513" y="136" text-anchor="middle" font-size="13" fill="#333">12</text>
  </g>

  <!-- 气泡指向 3 -->
  <rect x="96" y="62" width="176" height="36" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="184" y="85" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">最后一个红格：g = 2×5−2−5 = 3</text>
  <path d="M 171 98 L 171 108" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)" marker-end="url(#arrr)"/>

  <!-- 从 4 起全可买箭头 -->
  <path d="M 209 168 L 528 168" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)" marker-end="url(#arrg)"/>
  <text x="368" y="162" text-anchor="middle" font-size="11.5" fill="#4a7a3a">从 4 = (a−1)(b−1) 起：全部可买</text>

  <!-- 图例 -->
  <text x="60" y="196" font-size="11.5" fill="#4a7a3a">■ 绿格 = 可买：v = 2x + 5y 有非负解</text>
  <text x="60" y="214" font-size="11.5" fill="#b85450">■ 红格 = 买不到：无法恰好付清</text>

  <!-- 单调传播 -->
  <rect x="36" y="232" width="250" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="161" y="256" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">单调传播</text>
  <text x="161" y="276" text-anchor="middle" font-size="11.5" fill="#333">v 可买 ⇒ v+a、v+b 都可买（多付一枚）</text>

  <!-- 公式框 -->
  <rect x="308" y="232" width="222" height="60" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="419" y="256" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">g(a, b) = a·b − a − b</text>
  <text x="419" y="276" text-anchor="middle" font-size="11" fill="#666">质数必互质 → 公式恒适用</text>

  <!-- 对称性 -->
  <rect x="56" y="308" width="448" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="332" text-anchor="middle" font-size="11.5" fill="#333">对称性：0 ≤ v ≤ g 中恰一半可买——v 可买 ⇔ g − v 买不到（一一配对）</text>
</svg>
