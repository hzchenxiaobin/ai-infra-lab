<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：枚举起点 × 带值集合回溯的 DFS</text>

  <rect x="30" y="40" width="240" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="57" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">① 遍历收集全部节点</text>
  <text x="150" y="73" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">树即无向图：左孩 / 右孩 / 父，3 个邻居</text>

  <path d="M 150 80 L 150 92" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="96" width="240" height="24" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="112" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">② 枚举起点 s：dfs(s, null, s.val)</text>

  <path d="M 150 120 L 150 132" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="136" width="240" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="152" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">③ 进入节点 u：ans = max(ans, sum)</text>
  <text x="150" y="168" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">seen.insert(u.val)</text>

  <path d="M 150 174 L 150 184" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 150 184 L 244 216 L 150 248 L 56 216 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="212" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">邻居 v 非空 且</text>
  <text x="150" y="228" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">v.val ∉ seen ?</text>

  <text x="252" y="208" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 244 216 L 282 216" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="286" y="198" width="204" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="388" y="212" text-anchor="middle" font-size="10" fill="#a0433f" font-weight="bold" filter="url(#rough2)">跳过 v —— 树上路径唯一，</text>
  <text x="388" y="227" text-anchor="middle" font-size="10" fill="#a0433f" filter="url(#rough2)">v 背后的整棵子树不可达</text>

  <text x="158" y="254" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 150 248 L 150 262" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="266" width="180" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="150" y="283" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">④ dfs(v, u, sum + v.val)</text>

  <path d="M 60 279 L 26 279 L 26 216 L 52 216" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="22" y="302" font-size="9" fill="#888" filter="url(#rough2)">递归返回后取下一邻居</text>

  <path d="M 150 292 L 150 308" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="158" y="304" font-size="9" fill="#888" filter="url(#rough2)">邻居耗尽</text>

  <rect x="60" y="312" width="180" height="24" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="328" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">⑤ seen.erase(u.val)，回溯返回</text>

  <rect x="286" y="252" width="204" height="28" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="388" y="270" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">⑥ 所有起点跑完 → 返回 ans</text>

  <rect x="286" y="296" width="204" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="388" y="314" text-anchor="middle" font-size="9.6" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">复杂度：每个起点至多访问 n 个节点</text>
  <text x="388" y="330" text-anchor="middle" font-size="9.4" fill="#8a6d1f" filter="url(#rough2)">总 O(n²)；全树同值 → 每起点 O(1)</text>
  <text x="388" y="344" text-anchor="middle" font-size="9.4" fill="#8a6d1f" filter="url(#rough2)">值全互异 → 预判分流 124 模板 O(n)</text>
</svg>
