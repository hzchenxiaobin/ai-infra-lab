<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：筛 → 编号 → 差分 → 分组聚合 → 取最长 → 排序输出</text>

  <!-- ① 筛选 -->
  <rect x="30" y="52" width="140" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="100" y="74" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">① 筛 free = 1</text>
  <text x="100" y="92" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">WHERE free = 1</text>
  <text x="100" y="108" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">只留空余座位，被占的成缺口</text>

  <path d="M 172 85 L 186 85" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ② 编号 -->
  <rect x="190" y="52" width="140" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="74" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">② ROW_NUMBER 编号</text>
  <text x="260" y="92" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">OVER (ORDER BY seat_id)</text>
  <text x="260" y="108" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">升序连续编号 1, 2, 3, …</text>

  <path d="M 332 85 L 346 85" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ③ 差分 -->
  <rect x="350" y="52" width="140" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="420" y="74" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">③ 差分造岛 id</text>
  <text x="420" y="92" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">gid = seat_id − rn</text>
  <text x="420" y="108" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">同段同值、断档跳变</text>

  <!-- ③ → ④ 向下箭头 -->
  <path d="M 420 120 L 420 158" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ④ 聚合 -->
  <rect x="350" y="162" width="140" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="420" y="184" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">④ 分组聚合</text>
  <text x="420" y="202" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">GROUP BY gid:</text>
  <text x="420" y="218" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">MIN/MAX/COUNT → (首, 尾, 长)</text>

  <path d="M 348 195 L 334 195" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ⑤ 取最长 -->
  <rect x="190" y="162" width="140" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="184" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">⑤ 取最长段</text>
  <text x="260" y="202" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">len = MAX(len)</text>
  <text x="260" y="218" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">RANK = 1，并列全取</text>

  <path d="M 188 195 L 174 195" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ⑥ 排序输出 -->
  <rect x="30" y="162" width="140" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="100" y="184" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">⑥ 排序输出</text>
  <text x="100" y="202" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">ORDER BY</text>
  <text x="100" y="218" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">first_seat_id 升序</text>

  <!-- 注意框 -->
  <rect x="30" y="244" width="460" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="266" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠️ 窗口函数不能直接写进 WHERE——求值在 SELECT 阶段</text>
  <text x="260" y="284" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">逻辑执行顺序：FROM → WHERE → GROUP BY → SELECT(窗口) → ORDER BY</text>
  <text x="260" y="300" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">rn、gid、rk 都要靠 CTE / 子查询「包一层」再被外层引用</text>

  <text x="260" y="336" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">本题两个窗口分层：内层 ROW_NUMBER 造 gid（分组前），外层 RANK 选最长（分组后）</text>
  <text x="260" y="354" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">全程一趟窗口排序 + 一趟分组，复杂度 O(n log n)</text>
</svg>
