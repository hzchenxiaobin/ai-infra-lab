<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：逐行求 s，超过 k = 20 立即 break</text>
  <text x="260" y="50" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">grid = [[7,2,9],[1,5,0],[2,6,6]]，左列标注处理完该行后的 col[]</text>

  <!-- 行 0 -->
  <text x="44" y="88" font-size="12" fill="#446688" filter="url(#rough2)">i=0</text>
  <text x="44" y="106" font-size="11" fill="#666" filter="url(#rough2)">col=[7,2,9]</text>
  <rect x="140" y="72" width="58" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="200" y="72" width="58" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="260" y="72" width="58" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="169" y="96" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7 ✓</text>
  <text x="229" y="96" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">9 ✓</text>
  <text x="289" y="96" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">18 ✓</text>
  <rect x="360" y="76" width="70" height="34" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="395" y="98" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">计 3</text>

  <!-- 行 1 -->
  <text x="44" y="158" font-size="12" fill="#446688" filter="url(#rough2)">i=1</text>
  <text x="44" y="176" font-size="11" fill="#666" filter="url(#rough2)">col=[8,7,9]</text>
  <rect x="140" y="142" width="58" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="200" y="142" width="58" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="260" y="142" width="58" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="169" y="166" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">8 ✓</text>
  <text x="229" y="166" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">15 ✓</text>
  <text x="289" y="166" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">24 ✗</text>
  <text x="330" y="166" font-size="11.5" fill="#b85450" filter="url(#rough2)">break!</text>
  <rect x="360" y="146" width="70" height="34" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="395" y="168" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">计 2</text>

  <!-- 行 2 -->
  <text x="44" y="228" font-size="12" fill="#446688" filter="url(#rough2)">i=2</text>
  <text x="44" y="246" font-size="11" fill="#666" filter="url(#rough2)">col=[10,13,15]</text>
  <rect x="140" y="212" width="58" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="200" y="212" width="58" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="260" y="212" width="58" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="169" y="236" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">10 ✓</text>
  <text x="229" y="236" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">21 ✗</text>
  <text x="270" y="236" font-size="11.5" fill="#b85450" filter="url(#rough2)">break!</text>
  <text x="289" y="236" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">✗</text>
  <rect x="360" y="216" width="70" height="34" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="395" y="238" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">计 1</text>
  <text x="452" y="236" font-size="10.5" fill="#999" filter="url(#rough2)">没扫到</text>

  <!-- 答案框 -->
  <rect x="36" y="278" width="448" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="52" y="303" font-size="14" fill="#d6a040" font-weight="bold" filter="url(#rough2)">答案 ans = 3 + 2 + 1 = 6 ✓</text>
  <text x="52" y="325" font-size="12" fill="#333" filter="url(#rough2)">每行只扫到「刚好超标」的格子为止；行 2 的第 3 格根本没被访问（虚线格）</text>
</svg>
