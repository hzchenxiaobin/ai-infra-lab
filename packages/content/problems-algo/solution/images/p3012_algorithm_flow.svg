<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="360" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：求最小值 → 查非倍数 → 数出现次数，O(n)</text>

  <!-- start -->
  <rect x="210" y="42" width="200" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="64" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">输入：正整数数组 nums</text>

  <path d="M 310 76 L 310 90" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- min -->
  <rect x="210" y="94" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="116" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">m ← min(nums)</text>

  <path d="M 310 128 L 310 144" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="310,150 462,192 310,234 158,192" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="187" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">存在 x 使</text>
  <text x="310" y="205" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">x % m ≠ 0 ?</text>

  <!-- yes branch -->
  <text x="470" y="186" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 462 192 L 494 192" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="498" y="174" width="104" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="550" y="197" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">return 1</text>
  <text x="550" y="230" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">造出更小的唯一最小值</text>
  <text x="550" y="246" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">再逐个清场到只剩它</text>

  <!-- no branch -->
  <text x="324" y="250" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 310 234 L 310 252" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- count -->
  <rect x="178" y="256" width="264" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="278" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">cnt ← m 在 nums 中的出现次数</text>

  <path d="M 310 290 L 310 304" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return -->
  <rect x="210" y="308" width="200" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="330" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return (cnt + 1) / 2</text>
  <text x="176" y="329" text-anchor="end" font-size="10.5" fill="#999" filter="url(#rough2)">⌈cnt / 2⌉</text>

  <text x="310" y="354" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">⚠️ 方向别搞反：i 取 m、j 取 y 是保命清场；i 取 y、j 取 m 是赌更小值</text>
</svg>
