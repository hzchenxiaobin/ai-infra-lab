<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">pd.concat([df1, df2])：两表行块垂直堆叠</text>

  <!-- df1 -->
  <text x="127" y="52" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">df1（4 行）</text>
  <rect x="40" y="60" width="175" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <line x1="40" y1="84" x2="215" y2="84" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="115" y1="60" x2="115" y2="180" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="170" y1="60" x2="170" y2="180" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="40" y1="108" x2="215" y2="108" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="40" y1="132" x2="215" y2="132" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="40" y1="156" x2="215" y2="156" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <text x="77" y="77" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">student_id</text>
  <text x="142" y="77" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">name</text>
  <text x="192" y="77" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">age</text>
  <text x="77" y="100" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="142" y="100" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Mason</text>
  <text x="192" y="100" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8</text>
  <text x="77" y="124" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="142" y="124" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Ava</text>
  <text x="192" y="124" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <text x="77" y="148" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="142" y="148" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Taylor</text>
  <text x="192" y="148" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">15</text>
  <text x="77" y="172" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="142" y="172" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Georgia</text>
  <text x="192" y="172" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">17</text>

  <!-- df2 -->
  <text x="127" y="202" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">df2（2 行）</text>
  <rect x="40" y="210" width="175" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <line x1="40" y1="234" x2="215" y2="234" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <line x1="115" y1="210" x2="115" y2="282" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="170" y1="210" x2="170" y2="282" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="40" y1="258" x2="215" y2="258" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>
  <text x="77" y="227" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">student_id</text>
  <text x="142" y="227" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">name</text>
  <text x="192" y="227" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">age</text>
  <text x="77" y="251" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="142" y="251" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Leo</text>
  <text x="192" y="251" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>
  <text x="77" y="275" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <text x="142" y="275" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Alex</text>
  <text x="192" y="275" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>

  <!-- arrows into concat -->
  <path d="M 217 120 L 243 152" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 217 246 L 243 192" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- concat box -->
  <rect x="245" y="140" width="112" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="301" y="163" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">pd.concat</text>
  <text x="301" y="181" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">[df1, df2]</text>
  <text x="301" y="197" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">axis=0 堆行</text>

  <!-- arrow to result -->
  <path d="M 359 172 L 388 172" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result -->
  <text x="477" y="52" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">结果（6 行 = 4 + 2）</text>
  <rect x="390" y="60" width="175" height="168" fill="#ffffff" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <rect x="391" y="180" width="173" height="47" fill="#e6f4ea" filter="url(#rough2)"/>
  <line x1="390" y1="84" x2="565" y2="84" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <line x1="465" y1="60" x2="465" y2="228" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="520" y1="60" x2="520" y2="228" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="390" y1="108" x2="565" y2="108" stroke="#d6a040" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="390" y1="132" x2="565" y2="132" stroke="#d6a040" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="390" y1="156" x2="565" y2="156" stroke="#d6a040" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="390" y1="204" x2="565" y2="204" stroke="#d6a040" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="390" y1="180" x2="565" y2="180" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="427" y="77" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">student_id</text>
  <text x="492" y="77" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">name</text>
  <text x="542" y="77" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">age</text>
  <text x="427" y="100" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="492" y="100" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Mason</text>
  <text x="542" y="100" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8</text>
  <text x="427" y="124" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="492" y="124" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Ava</text>
  <text x="542" y="124" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <text x="427" y="148" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="492" y="148" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Taylor</text>
  <text x="542" y="148" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">15</text>
  <text x="427" y="172" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="492" y="172" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Georgia</text>
  <text x="542" y="172" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">17</text>
  <text x="427" y="196" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="492" y="196" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Leo</text>
  <text x="542" y="196" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>
  <text x="427" y="220" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <text x="492" y="220" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Alex</text>
  <text x="542" y="220" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>
  <text x="568" y="184" text-anchor="start" font-size="9" fill="#b85450" filter="url(#rough2)">← df1/df2 分界</text>
  <text x="477" y="250" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">先 df1 后 df2，各自原序</text>

  <!-- bottom summary -->
  <rect x="60" y="290" width="480" height="88" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="314" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">① axis=0：沿行方向堆叠 → 列数不变，行数 n + m</text>
  <text x="300" y="338" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">② 按列名对齐：同构表严丝合缝；列名不一致时并集补 NaN</text>
  <text x="300" y="362" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">③ 返回全新 DataFrame，df1 / df2 原表零改动</text>
</svg>
