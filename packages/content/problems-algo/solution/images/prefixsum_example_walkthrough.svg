<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 2 演算：nums = [3, −5, −2, 6]</text>

  <!-- ===== 表头 ===== -->
  <rect x="30" y="42" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="62" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i</text>
  <rect x="84" y="42" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="62" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">x</text>
  <rect x="144" y="42" width="76" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="182" y="62" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">s(加后)</text>
  <rect x="224" y="42" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="269" y="62" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">小根堆</text>
  <rect x="318" y="42" width="64" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="350" y="62" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">s&lt;0?</text>
  <rect x="386" y="42" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="466" y="62" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">动作</text>

  <!-- ===== Row 0: i=0 x=3 s=3 heap=∅ no ===== -->
  <rect x="30" y="76" width="50" height="30" fill="#fafafa" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="55" y="96" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="84" y="76" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="112" y="96" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="144" y="76" width="76" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="182" y="96" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <rect x="224" y="76" width="90" height="30" fill="#fafafa" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="269" y="96" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">∅</text>
  <rect x="318" y="76" width="64" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="350" y="96" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="386" y="76" width="160" height="30" fill="#fafafa" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="466" y="96" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>

  <!-- ===== Row 1: i=1 x=-5 s=-2 heap={-5} yes pop ===== -->
  <rect x="30" y="110" width="50" height="30" fill="#fafafa" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="55" y="130" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="84" y="110" width="56" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="130" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">−5</text>
  <rect x="144" y="110" width="76" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="182" y="130" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">−2 ✗</text>
  <rect x="224" y="110" width="90" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="269" y="130" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">{ −5 }</text>
  <rect x="318" y="110" width="64" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="350" y="130" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="386" y="110" width="160" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="466" y="130" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">pop −5，s=3，ans=1</text>

  <!-- ===== Row 2: i=2 x=-2 s=1 heap={-2} no ===== -->
  <rect x="30" y="144" width="50" height="30" fill="#fafafa" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="55" y="164" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="84" y="144" width="56" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="112" y="164" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">−2</text>
  <rect x="144" y="144" width="76" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="182" y="164" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <rect x="224" y="144" width="90" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="269" y="164" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">{ −2 }</text>
  <rect x="318" y="144" width="64" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="350" y="164" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="386" y="144" width="160" height="30" fill="#fafafa" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="466" y="164" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>

  <!-- ===== Row 3: i=3 x=6 s=7 heap={-2} no ===== -->
  <rect x="30" y="178" width="50" height="30" fill="#fafafa" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="55" y="198" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="84" y="178" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="112" y="198" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <rect x="144" y="178" width="76" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="182" y="198" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">7</text>
  <rect x="224" y="178" width="90" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="269" y="198" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">{ −2 }</text>
  <rect x="318" y="178" width="64" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="350" y="198" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="386" y="178" width="160" height="30" fill="#fafafa" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="466" y="198" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>

  <!-- ===== 结论区 ===== -->
  <path d="M30,228 L550,228" fill="none" stroke="#cccccc" stroke-width="1" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <text x="290" y="252" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">挪走 −5（索引 1）→ 末尾拼回</text>

  <!-- 结果数组 -->
  <text x="60" y="290" font-size="12" fill="#446688" filter="url(#rough2)">结果:</text>
  <rect x="110" y="276" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="296" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="174" y="276" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="204" y="296" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−2</text>
  <rect x="238" y="276" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="268" y="296" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <rect x="302" y="276" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="332" y="296" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">−5</text>
  <text x="372" y="290" font-size="11" fill="#4a7a3a" filter="url(#rough2)">← 挪来的</text>

  <!-- prefix -->
  <text x="60" y="328" font-size="12" fill="#4a7a3a" filter="url(#rough2)">prefix:</text>
  <text x="140" y="328" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="204" y="328" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="268" y="328" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">7</text>
  <text x="332" y="328" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">2</text>

  <text x="290" y="358" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">全部 ≥ 0 ✓  最小操作次数 ans = 1</text>
</svg>
