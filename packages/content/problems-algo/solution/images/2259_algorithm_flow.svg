<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：一次扫描 + 贪心判定</text>
  <text x="270" y="42" text-anchor="middle" font-size="10.5" fill="#888">左到右扫，遇 digit 查下一位；变大即删，全扫完删最后</text>

  <!-- Step 1: Start -->
  <rect x="200" y="56" width="140" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="270" y="77" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">开始：lastPos = −1</text>
  <path d="M 270 88 L 270 104" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: loop -->
  <rect x="180" y="106" width="180" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="127" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">for i = 0 … n−1</text>
  <path d="M 270 138 L 270 154" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: number[i] == digit? -->
  <polygon points="270,156 370,196 270,236 170,196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="194" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">number[i]</text>
  <text x="270" y="208" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">== digit?</text>

  <!-- No branch: skip, back to loop -->
  <path d="M 370 196 L 430 196" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="378" y="188" font-size="10" fill="#888" font-weight="bold">否</text>
  <rect x="430" y="182" width="60" height="28" fill="#f5f5f5" stroke="#aaa" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="460" y="200" text-anchor="middle" font-size="10" fill="#888">跳过</text>
  <!-- loop back arrow from skip to for-loop -->
  <path d="M 460 182 L 460 122 L 360 122" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Yes branch -->
  <path d="M 270 236 L 270 252" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="278" y="248" font-size="10" fill="#888" font-weight="bold">是</text>

  <!-- Decision: i+1 < n and number[i+1] > digit? -->
  <polygon points="270,254 390,298 270,342 150,298" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="292" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">number[i+1]</text>
  <text x="270" y="306" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">&gt; digit ?</text>

  <!-- Yes: remove here, return -->
  <path d="M 150 298 L 80 298" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="290" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="20" y="280" width="62" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="51" y="296" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">立即删 i</text>
  <text x="51" y="308" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">返回 ✓</text>

  <!-- No: update lastPos, continue loop -->
  <path d="M 270 342 L 270 362" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="278" y="356" font-size="10" fill="#d6a040" font-weight="bold">否</text>
  <rect x="190" y="364" width="160" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="384" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">lastPos = i，继续循环</text>
  <!-- loop back from lastPos update to for-loop -->
  <path d="M 350 379 L 420 379 L 420 122 L 360 122" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- After loop: remove lastPos -->
  <rect x="170" y="404" width="200" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="424" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">循环结束 → 删 number[lastPos]，返回</text>
</svg>
