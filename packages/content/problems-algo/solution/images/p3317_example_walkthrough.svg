<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例 3 演算：n = 3，x = 3，y = 4</text>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">逐位入场维护 dp[j]（恰好占 j 个节目的方案数），最后一轮乘 y^k 求和</text>

  <!-- 表头 -->
  <rect x="25" y="56" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="55" y="73" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">i ↓</text>
  <rect x="85" y="56" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="135" y="73" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">j = 1</text>
  <rect x="185" y="56" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="235" y="73" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">j = 2</text>
  <rect x="285" y="56" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="335" y="73" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">j = 3</text>

  <!-- i = 1 -->
  <rect x="25" y="82" width="60" height="28" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="55" y="100" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="85" y="82" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="135" y="100" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="185" y="82" width="100" height="28" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="235" y="100" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="285" y="82" width="100" height="28" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="335" y="100" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>

  <!-- i = 2 -->
  <rect x="25" y="110" width="60" height="28" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="55" y="128" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="85" y="110" width="100" height="28" fill="#fff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="135" y="128" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="185" y="110" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="235" y="128" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="285" y="110" width="100" height="28" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="335" y="128" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>

  <!-- i = 3 -->
  <rect x="25" y="138" width="60" height="28" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="55" y="156" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="85" y="138" width="100" height="28" fill="#fff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="135" y="156" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="185" y="138" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="235" y="156" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">18</text>
  <rect x="285" y="138" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="335" y="156" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">6</text>

  <!-- 图例 -->
  <rect x="400" y="82" width="108" height="84" rx="8" fill="#fff" stroke="#999" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="412" y="94" width="18" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="446" y="105" font-size="9" fill="#666" filter="url(#rough2)">首个非空</text>
  <rect x="412" y="116" width="18" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="446" y="127" font-size="9" fill="#666" filter="url(#rough2)">本轮新值</text>
  <rect x="412" y="138" width="18" height="14" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="446" y="149" font-size="9" fill="#666" filter="url(#rough2)">仍为 0</text>

  <!-- 逐轮注释 -->
  <text x="25" y="186" font-size="10" fill="#446688" filter="url(#rough2)">i=1：第 1 人独占一个节目，3 个节目任选 → dp[1] = 3</text>
  <text x="25" y="206" font-size="10" fill="#4a7a3a" filter="url(#rough2)">i=2：dp[2] ← dp[1]·(x−j+1) = 3·2 = 6（新开空节目还剩 2 个）；dp[1] ← 3·1 = 3（挤进已有）</text>
  <text x="25" y="226" font-size="10" fill="#4a7a3a" filter="url(#rough2)">i=3：dp[3] ← dp[2]·1 = 6；dp[2] ← 2·6 + 2·3 = 18；dp[1] 不变</text>

  <!-- 打分求和 -->
  <rect x="15" y="246" width="490" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="270" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">打分收尾：ans = dp[1]·4¹ + dp[2]·4² + dp[3]·4³</text>
  <text x="260" y="296" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">= 3·4 + 18·16 + 6·64 = 12 + 288 + 384</text>
  <text x="260" y="326" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">= 684 ✓</text>
</svg>
