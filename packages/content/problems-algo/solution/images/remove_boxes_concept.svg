<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">为什么需要第三维 k？——跨区间合并让二维失效</text>

  <!-- ===== Row 1: original boxes [1,3,2,2,2,3,4,3,1] ===== -->
  <text x="40" y="62" font-size="11" fill="#888">boxes:</text>

  <!-- 1 -->
  <rect x="92" y="48" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="109" y="69" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <!-- 3 -->
  <rect x="128" y="48" width="34" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="145" y="69" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <!-- 2 2 2 (highlight group) -->
  <rect x="164" y="46" width="34" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="181" y="69" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="200" y="46" width="34" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="217" y="69" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="236" y="46" width="34" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="253" y="69" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <!-- 3 -->
  <rect x="272" y="48" width="34" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="289" y="69" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <!-- 4 -->
  <rect x="308" y="48" width="34" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="325" y="69" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <!-- 3 -->
  <rect x="344" y="48" width="34" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="361" y="69" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <!-- 1 -->
  <rect x="380" y="48" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="397" y="69" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <text x="181" y="42" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">先消这三个 2</text>

  <!-- arrow down -->
  <path d="M 236 86 L 236 108" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="100" font-size="10" fill="#888">移除 [2,2,2]，得 3×3=9 分</text>

  <!-- ===== Row 2: after removing 2,2,2 -> [1,3,3,4,3,1] (three 3s merge-able) ===== -->
  <text x="40" y="132" font-size="11" fill="#888">after:</text>
  <!-- 1 -->
  <rect x="92" y="118" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="109" y="139" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <!-- 3 (first) highlight -->
  <rect x="128" y="116" width="34" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="145" y="139" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <!-- 3 (second) highlight -->
  <rect x="164" y="116" width="34" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="181" y="139" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <!-- 4 -->
  <rect x="200" y="118" width="34" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="217" y="139" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <!-- 3 (third) highlight -->
  <rect x="236" y="116" width="34" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="253" y="139" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <!-- 1 -->
  <rect x="272" y="118" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="289" y="139" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <text x="181" y="168" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">三个 3 现在可被攒到一起消，得 3×3=9 分</text>

  <!-- ===== explanation box: why 2D fails ===== -->
  <rect x="40" y="186" width="480" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="208" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">二维 dp[i][j] 的困境</text>
  <text x="280" y="228" text-anchor="middle" font-size="11" fill="#555">消掉中间的 [2,2,2] 后，左右两个 3 "贴"到一起——</text>
  <text x="280" y="238" text-anchor="middle" font-size="11" fill="#555">子问题不再独立，单看左段或右段都不知道"外面还有几个同色盒等着合并"</text>

  <!-- ===== solution: add k dimension ===== -->
  <rect x="40" y="254" width="480" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="276" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">破局：升一维 dp[i][j][k]</text>
  <text x="280" y="296" text-anchor="middle" font-size="11" fill="#444">k = 区间 boxes[i..j] 左侧已挂"颜色=boxes[i]"的盒子数</text>
  <text x="280" y="312" text-anchor="middle" font-size="11" fill="#444">把"区间外的同色挂载"编码进状态，子问题在给定 k 下重新独立</text>

  <!-- mini illustration of k -->
  <text x="60" y="350" font-size="10" fill="#888">左侧挂 k 个同色:</text>
  <!-- k boxes (dashed) -->
  <rect x="160" y="338" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" stroke-dasharray="3 2" rx="3" filter="url(#rough2)"/>
  <rect x="186" y="338" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" stroke-dasharray="3 2" rx="3" filter="url(#rough2)"/>
  <text x="216" y="350" font-size="11" fill="#446688" font-weight="bold">… k 个</text>
  <path d="M 218 350 L 248 350" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <!-- interval i..j -->
  <rect x="252" y="338" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="266" y="355" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i</text>
  <rect x="282" y="338" width="28" height="24" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="296" y="355" text-anchor="middle" font-size="10" fill="#777">…</text>
  <rect x="312" y="338" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="326" y="355" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">j</text>
  <text x="280" y="378" text-anchor="middle" font-size="10" fill="#888">这 k 个迟早会和 boxes[i] 一起被消掉 → 消时得 (k+1)² 分</text>

  <!-- bottom takeaway -->
  <rect x="40" y="388" width="480" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="404" text-anchor="middle" font-size="11" fill="#555">原问题答案 = dp[0][n-1][0]（整段盒子，左侧无挂载）</text>
</svg>
