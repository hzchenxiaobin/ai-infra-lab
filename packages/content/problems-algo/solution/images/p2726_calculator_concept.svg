<svg xmlns="http://www.w3.org/200/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2726c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arr2726g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">方法链核心：变更方法「更新 result + return this」串成链</text>

  <!-- chain expression -->
  <rect x="56" y="42" width="448" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="12.5" fill="#8a5a20" font-weight="bold">new Calculator(10).add(5).subtract(7).getResult()  →  8</text>

  <!-- method call boxes (4 columns, w=108, x=26/166/306/446) -->
  <rect x="26"  y="104" width="108" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="80"  y="128" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">new Calculator(10)</text>

  <rect x="166" y="104" width="108" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="220" y="128" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">.add(5)</text>

  <rect x="306" y="104" width="108" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="360" y="128" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">.subtract(7)</text>

  <rect x="446" y="104" width="108" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="500" y="128" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">.getResult()</text>

  <!-- horizontal chain arrows: return this -->
  <path d="M134,123 L162,123" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr2726g)" filter="url(#rough2)"/>
  <path d="M274,123 L302,123" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr2726g)" filter="url(#rough2)"/>
  <path d="M414,123 L442,123" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr2726g)" filter="url(#rough2)"/>
  <text x="148" y="116" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">this</text>
  <text x="288" y="116" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">this</text>
  <text x="428" y="116" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">this</text>

  <!-- vertical arrows: updates result -->
  <path d="M80,146 L80,176"  stroke="#446688" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr2726c)" filter="url(#rough2)"/>
  <path d="M220,146 L220,176" stroke="#446688" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr2726c)" filter="url(#rough2)"/>
  <path d="M360,146 L360,176" stroke="#446688" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr2726c)" filter="url(#rough2)"/>
  <path d="M500,146 L500,176" stroke="#446688" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr2726c)" filter="url(#rough2)"/>

  <!-- result state boxes -->
  <rect x="26"  y="180" width="108" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="80"  y="199" text-anchor="middle" font-size="10.5" fill="#888">init</text>
  <text x="80"  y="217" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold">result = 10</text>

  <rect x="166" y="180" width="108" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="220" y="199" text-anchor="middle" font-size="10.5" fill="#888">10 + 5</text>
  <text x="220" y="217" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold">result = 15</text>

  <rect x="306" y="180" width="108" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="360" y="199" text-anchor="middle" font-size="10.5" fill="#888">15 − 7</text>
  <text x="360" y="217" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold">result = 8</text>

  <rect x="446" y="180" width="108" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="500" y="199" text-anchor="middle" font-size="10.5" fill="#888">取值</text>
  <text x="500" y="217" text-anchor="middle" font-size="13.5" fill="#d6a040" font-weight="bold">return 8</text>

  <!-- explanation box -->
  <rect x="40" y="252" width="480" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="271" text-anchor="middle" font-size="12" fill="#333">每个变更方法做两件事：① 用 value 更新 result  ② return this</text>
  <text x="280" y="288" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 this = 让下一次「.方法」调到同一对象 → 串联成链</text>

  <!-- exception callout -->
  <rect x="40" y="312" width="480" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="332" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">⚠ 特例：divide(0) 不更新、不返回 this，而是抛出错误</text>
  <text x="280" y="348" text-anchor="middle" font-size="11" fill="#b85450">throw "Division by zero is not allowed"</text>
</svg>
