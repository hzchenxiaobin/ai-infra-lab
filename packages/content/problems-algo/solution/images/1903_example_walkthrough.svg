<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="600" height="500" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：三组样例的最右奇位定位</text>
  <text x="300" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">奇数位绿色 / 偶数位蓝色 / 最右奇位橙色高亮</text>

  <!-- ============ Example 1: num = "52" ============ -->
  <text x="40" y="86" font-size="11.5" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1：num = "52"</text>
  <!-- index labels -->
  <g filter="url(#rough2)" font-size="9" fill="#aaa" text-anchor="middle">
    <text x="172" y="86">0</text>
    <text x="216" y="86">1</text>
  </g>
  <!-- digits -->
  <g filter="url(#rough2)" font-size="14" text-anchor="middle">
    <rect x="150" y="92" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <text x="172" y="114" fill="#d6a040" font-weight="bold">5</text>
    <rect x="194" y="92" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="216" y="114" fill="#446688" font-weight="bold">2</text>
  </g>
  <!-- arrow to rightmost odd (idx 0) -->
  <path d="M 172 146 L 172 130" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO3)" filter="url(#rough2)"/>
  <text x="270" y="114" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">最右奇位 i=0 → 取前缀 num[0..0]</text>
  <!-- answer -->
  <rect x="380" y="98" width="170" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="465" y="122" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 "5"</text>

  <!-- Divider -->
  <line x1="60" y1="150" x2="540" y2="150" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ============ Example 2: num = "4206" ============ -->
  <text x="40" y="186" font-size="11.5" fill="#444" font-weight="bold" filter="url(#rough2)">示例 2：num = "4206"</text>
  <g filter="url(#rough2)" font-size="9" fill="#aaa" text-anchor="middle">
    <text x="172" y="186">0</text>
    <text x="216" y="186">1</text>
    <text x="260" y="186">2</text>
    <text x="304" y="186">3</text>
  </g>
  <g filter="url(#rough2)" font-size="14" text-anchor="middle">
    <rect x="150" y="192" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="172" y="214" fill="#446688" font-weight="bold">4</text>
    <rect x="194" y="192" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="216" y="214" fill="#446688" font-weight="bold">2</text>
    <rect x="238" y="192" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="260" y="214" fill="#446688" font-weight="bold">0</text>
    <rect x="282" y="192" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="304" y="214" fill="#446688" font-weight="bold">6</text>
  </g>
  <text x="350" y="214" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">全为偶数位，无奇位 → i 扫到 −1</text>
  <rect x="380" y="198" width="170" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="465" y="222" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 ""</text>

  <!-- Divider -->
  <line x1="60" y1="250" x2="540" y2="250" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ============ Example 3: num = "35427" ============ -->
  <text x="40" y="286" font-size="11.5" fill="#444" font-weight="bold" filter="url(#rough2)">示例 3：num = "35427"</text>
  <g filter="url(#rough2)" font-size="9" fill="#aaa" text-anchor="middle">
    <text x="172" y="286">0</text>
    <text x="216" y="286">1</text>
    <text x="260" y="286">2</text>
    <text x="304" y="286">3</text>
    <text x="348" y="286">4</text>
  </g>
  <g filter="url(#rough2)" font-size="14" text-anchor="middle">
    <rect x="150" y="292" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="172" y="314" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="194" y="292" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="216" y="314" fill="#4a7a3a" font-weight="bold">5</text>
    <rect x="238" y="292" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="260" y="314" fill="#446688" font-weight="bold">4</text>
    <rect x="282" y="292" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="304" y="314" fill="#446688" font-weight="bold">2</text>
    <rect x="326" y="292" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <text x="348" y="314" fill="#d6a040" font-weight="bold">7</text>
  </g>
  <!-- arrow to rightmost odd (idx 4) -->
  <path d="M 348 346 L 348 330" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO3)" filter="url(#rough2)"/>
  <text x="356" y="344" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">最右奇位 i=4</text>
  <rect x="380" y="298" width="170" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="465" y="322" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 "35427"</text>

  <!-- Divider -->
  <line x1="60" y1="358" x2="540" y2="358" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ============ Trace table header ============ -->
  <text x="300" y="380" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold" filter="url(#rough2)">逆序扫描轨迹（示例 3）</text>

  <!-- Trace: i=4 num[i]=7 odd -> hit -->
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <rect x="60" y="392" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="100" y="411" fill="#d6a040" font-weight="bold">i = 4</text>
    <text x="170" y="411" fill="#333">num[4] = 7</text>
    <text x="290" y="411" fill="#4a7a3a" font-weight="bold">奇 ✓</text>
    <text x="380" y="411" fill="#4a7a3a" font-weight="bold">命中 → 返回 num[0..4]</text>
  </g>

  <!-- Note -->
  <rect x="50" y="438" width="500" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="457" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">观察：示例 3 从右数第 1 位即奇数，扫描 1 步命中；</text>
  <text x="300" y="473" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">若末位为偶（如 "35420"），需继续向左直到首个奇位或越界</text>
</svg>
