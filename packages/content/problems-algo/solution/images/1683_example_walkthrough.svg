<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="660" height="400" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：tweet 1 长度 14 有效，tweet 2 长度 32 无效</text>

  <!-- ===== Left: Tweets table ===== -->
  <text x="140" y="56" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">Tweets 表</text>

  <rect x="50" y="64" width="60" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="80" y="80" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">tweet_id</text>
  <rect x="110" y="64" width="170" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="195" y="80" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">content</text>

  <rect x="50" y="86" width="60" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="80" y="104" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="110" y="86" width="170" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="195" y="104" text-anchor="middle" font-size="10" fill="#b85450">Vote for Biden</text>

  <rect x="50" y="114" width="60" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="80" y="132" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="110" y="114" width="170" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="195" y="132" text-anchor="middle" font-size="8" fill="#b85450">Let us make America great again!</text>

  <!-- Arrow to detail -->
  <path d="M285 108 L325 108" stroke="#446688" stroke-width="2.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="305" y="100" text-anchor="middle" font-size="8.5" fill="#888">CHAR_LENGTH</text>

  <!-- ===== Right: result ===== -->
  <text x="545" y="56" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">结果（无效）</text>

  <rect x="490" y="64" width="110" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="545" y="80" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">tweet_id</text>

  <rect x="490" y="86" width="110" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="545" y="104" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- Arrow from WHERE to result -->
  <path d="M410 108 L486 108" stroke="#4a7a3a" stroke-width="2.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="448" y="100" text-anchor="middle" font-size="8.5" fill="#4a7a3a">&gt; 15 ?</text>

  <!-- ===== Bottom: detail breakdown ===== -->
  <rect x="30" y="156" width="600" height="228" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="330" y="180" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">逐行字符计数详解（空格也算 1 个字符）</text>

  <!-- Row 1: tweet 1 -->
  <text x="50" y="206" font-size="10.5" fill="#4a7a3a" font-weight="bold">tweet_id = 1, content = "Vote for Biden"</text>

  <!-- char boxes -->
  <g filter="url(#rough2)">
    <rect x="50" y="214" width="20" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="60" y="230" text-anchor="middle" font-size="10" fill="#333">V</text>
    <rect x="70" y="214" width="20" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="80" y="230" text-anchor="middle" font-size="10" fill="#333">o</text>
    <rect x="90" y="214" width="20" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="100" y="230" text-anchor="middle" font-size="10" fill="#333">t</text>
    <rect x="110" y="214" width="20" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="120" y="230" text-anchor="middle" font-size="10" fill="#333">e</text>
    <rect x="130" y="214" width="20" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <text x="140" y="230" text-anchor="middle" font-size="9" fill="#d6a040">␣</text>
    <rect x="150" y="214" width="20" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="160" y="230" text-anchor="middle" font-size="10" fill="#333">f</text>
    <rect x="170" y="214" width="20" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="180" y="230" text-anchor="middle" font-size="10" fill="#333">o</text>
    <rect x="190" y="214" width="20" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="200" y="230" text-anchor="middle" font-size="10" fill="#333">r</text>
    <rect x="210" y="214" width="20" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <text x="220" y="230" text-anchor="middle" font-size="9" fill="#d6a040">␣</text>
    <rect x="230" y="214" width="20" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="240" y="230" text-anchor="middle" font-size="10" fill="#333">B</text>
    <rect x="250" y="214" width="20" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="260" y="230" text-anchor="middle" font-size="10" fill="#333">i</text>
    <rect x="270" y="214" width="20" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="280" y="230" text-anchor="middle" font-size="10" fill="#333">d</text>
    <rect x="290" y="214" width="20" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="300" y="230" text-anchor="middle" font-size="10" fill="#333">e</text>
    <rect x="310" y="214" width="20" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="320" y="230" text-anchor="middle" font-size="10" fill="#333">n</text>
  </g>

  <rect x="340" y="214" width="140" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="230" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">长度 = 14 ≤ 15 ✓ 有效</text>

  <!-- Separator -->
  <line x1="50" y1="250" x2="610" y2="250" stroke="#d6a040" stroke-width="0.8" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- Row 2: tweet 2 -->
  <text x="50" y="276" font-size="10.5" fill="#b85450" font-weight="bold">tweet_id = 2, content = "Let us make America great again!"</text>

  <!-- compressed char boxes: show segments with counts -->
  <g filter="url(#rough2)">
    <rect x="50" y="284" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="80" y="300" text-anchor="middle" font-size="9" fill="#333">"Let us</text>
    <rect x="110" y="284" width="20" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <text x="120" y="300" text-anchor="middle" font-size="9" fill="#d6a040">␣</text>
    <rect x="130" y="284" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="160" y="300" text-anchor="middle" font-size="9" fill="#333">make A</text>
    <rect x="190" y="284" width="20" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <text x="200" y="300" text-anchor="middle" font-size="9" fill="#d6a040">␣</text>
    <rect x="210" y="284" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="250" y="300" text-anchor="middle" font-size="9" fill="#333">merica great</text>
    <rect x="290" y="284" width="20" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <text x="300" y="300" text-anchor="middle" font-size="9" fill="#d6a040">␣</text>
    <rect x="310" y="284" width="50" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="335" y="300" text-anchor="middle" font-size="9" fill="#333">again</text>
    <rect x="360" y="284" width="20" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3"/>
    <text x="370" y="300" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">!</text>
  </g>

  <rect x="390" y="284" width="200" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="490" y="300" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">长度 = 32 &gt; 15 ✗ 无效</text>

  <!-- counting note -->
  <rect x="50" y="320" width="540" height="52" fill="#fafafa" stroke="#999" stroke-width="1" stroke-dasharray="3,2" rx="6" filter="url(#rough2)"/>
  <text x="60" y="340" font-size="10" fill="#555">数法：每个字母/数字/空格/'!' 均计 1 个字符。␣ = 空格（黄色格）。</text>
  <text x="60" y="358" font-size="10" fill="#555">tweet 1：14 个字符（含 2 空格）≤ 15 → 有效；tweet 2：32 个字符（含 5 空格 + 1 个 '!'）&gt; 15 → 无效。</text>
</svg>
