<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">找出数组的最大公约数：算法流程</text>

  <!-- Start -->
  <rect x="210" y="44" width="140" height="34" rx="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#333">输入数组 nums</text>

  <line x1="280" y1="78" x2="280" y2="98" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- find min/max -->
  <rect x="170" y="100" width="220" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="118" text-anchor="middle" font-size="12" fill="#333">一次遍历求</text>
  <text x="280" y="134" text-anchor="middle" font-size="12" fill="#333">mn = min, mx = max</text>

  <line x1="280" y1="140" x2="280" y2="160" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init -->
  <rect x="200" y="162" width="160" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="184" text-anchor="middle" font-size="12" fill="#333">a = mx, b = mn</text>

  <line x1="280" y1="196" x2="280" y2="216" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond: b == 0? -->
  <polygon points="280,216 384,256 280,296 176,256" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="252" text-anchor="middle" font-size="12" fill="#444">b == 0 ?</text>
  <text x="280" y="268" text-anchor="middle" font-size="10" fill="#888">（余数归零？）</text>

  <!-- Yes branch: return a -->
  <line x1="384" y1="256" x2="420" y2="256" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="250" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="420" y="240" width="116" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="478" y="262" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 a</text>
  <text x="478" y="290" text-anchor="middle" font-size="10" fill="#888">a 即 gcd</text>

  <!-- No branch: update -->
  <line x1="176" y1="256" x2="120" y2="256" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="148" y="250" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <rect x="40" y="238" width="80" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="252" text-anchor="middle" font-size="11" fill="#333">r = a mod b</text>
  <text x="80" y="266" text-anchor="middle" font-size="11" fill="#333">a = b; b = r</text>

  <!-- loop back arrow: from update box up then right to diamond top -->
  <path d="M 80 238 L 80 216 L 176 216" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="92" y="210" font-size="10" fill="#b85450">继续辗转</text>

  <!-- side note -->
  <rect x="40" y="320" width="480" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="342" font-size="11" fill="#555">要点：</text>
  <text x="100" y="342" font-size="11" fill="#b85450" font-weight="bold">① min/max 一趟扫描 O(n)</text>
  <text x="290" y="342" font-size="11" fill="#4a7a3a" font-weight="bold">② 辗转相除迭代写法避递归栈</text>
  <text x="100" y="362" font-size="11" fill="#555">③ 每步余数严格递减，至多 O(log min(a,b)) 轮</text>
  <text x="330" y="362" font-size="11" fill="#888">（标准库 gcd 可直接调用）</text>
</svg>
