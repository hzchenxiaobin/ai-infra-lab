<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">元音后继规则：状态转移有向图</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">箭头 X → Y 表示「X 后面可以接 Y」</text>

  <!-- ===== Edges (drawn before nodes; endpoints sit just outside circles) ===== -->
  <g stroke="#666" stroke-width="1.3" fill="none">
    <!-- a ↔ e -->
    <path d="M 283 80 Q 355 92 392 150" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 392 150 Q 325 138 283 80" marker-end="url(#arr)" filter="url(#rough2)"/>
    <!-- e ↔ i -->
    <path d="M 389 171 Q 335 192 286 194" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 286 194 Q 335 172 389 171" marker-end="url(#arr)" filter="url(#rough2)"/>
    <!-- i → a -->
    <path d="M 250 173 L 250 92" marker-end="url(#arr)" filter="url(#rough2)"/>
    <!-- i ↔ o -->
    <path d="M 234 194 Q 185 185 131 171" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 131 171 Q 185 213 234 194" marker-end="url(#arr)" filter="url(#rough2)"/>
    <!-- i → u -->
    <path d="M 270 227 L 270 308" marker-end="url(#arr)" filter="url(#rough2)"/>
    <!-- o → u -->
    <path d="M 123 185 Q 118 272 242 315" marker-end="url(#arr)" filter="url(#rough2)"/>
    <!-- u → a (curve far right, clear of center & e) -->
    <path d="M 280 308 Q 480 200 280 92" marker-end="url(#arr)" filter="url(#rough2)"/>
  </g>

  <!-- ===== Nodes ===== -->
  <g>
    <circle cx="260" cy="65" r="25" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="260" y="71" text-anchor="middle" font-size="17" fill="#446688" font-weight="bold">a</text>

    <circle cx="415" cy="165" r="25" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="415" y="171" text-anchor="middle" font-size="17" fill="#4a7a3a" font-weight="bold">e</text>

    <circle cx="260" cy="200" r="25" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="260" y="206" text-anchor="middle" font-size="17" fill="#d6a040" font-weight="bold">i</text>

    <circle cx="105" cy="165" r="25" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="105" y="171" text-anchor="middle" font-size="17" fill="#b85450" font-weight="bold">o</text>

    <circle cx="260" cy="335" r="25" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="260" y="341" text-anchor="middle" font-size="17" fill="#446688" font-weight="bold">u</text>
  </g>

  <!-- ===== Note ===== -->
  <rect x="40" y="370" width="440" height="24" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="260" y="386" text-anchor="middle" font-size="10" fill="#555">i 是枢纽（4 条出边）；a↔e、e↔i、i↔o 双向可达</text>
</svg>
