<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="560" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 20，s = "20"，k = 2</text>

  <!-- ===== 根节点 ===== -->
  <rect x="200" y="40" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">dfs(0, tight=T, lead=T, mask=0)</text>
  <text x="300" y="74" text-anchor="middle" font-size="10" fill="#333">up = s[0] = 2，遍历 d = 0, 1, 2</text>

  <!-- 三条分支箭头 -->
  <path d="M 250 82 L 120 104" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 300 82 L 300 104" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 350 82 L 480 104" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== d=0 分支 (lead, 前导零) ===== -->
  <rect x="20" y="106" width="200" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="120" y="126" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">d = 0（前导零）</text>
  <text x="120" y="144" text-anchor="middle" font-size="10" fill="#333">→ dfs(1, F, T, mask=0)</text>
  <text x="120" y="162" text-anchor="middle" font-size="10" fill="#333">up = 9（tight=F），d=1..9</text>
  <text x="120" y="180" text-anchor="middle" font-size="10" fill="#333">每个 d 无冲突 → 各返回 1</text>
  <text x="120" y="198" text-anchor="middle" font-size="10" fill="#333">d=0 返回 0（lead 到终点）</text>
  <text x="120" y="218" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">小计 = 9　（数字 1~9）</text>

  <!-- ===== d=1 分支 ===== -->
  <rect x="240" y="106" width="200" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="340" y="126" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">d = 1</text>
  <text x="340" y="144" text-anchor="middle" font-size="10" fill="#333">→ dfs(1, F, F, mask={1})</text>
  <text x="340" y="162" text-anchor="middle" font-size="10" fill="#333">up = 9，遍历 d=0..9</text>
  <text x="340" y="180" text-anchor="middle" font-size="10" fill="#333">d=1 冲突跳过，其余 9 个 OK</text>
  <text x="340" y="198" text-anchor="middle" font-size="10" fill="#333">10, 12, 13, …, 19</text>
  <text x="340" y="218" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">小计 = 9　（不含 11）</text>

  <!-- ===== d=2 分支 ===== -->
  <rect x="460" y="106" width="120" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="520" y="126" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">d = 2</text>
  <text x="520" y="144" text-anchor="middle" font-size="10" fill="#333">→ dfs(1, T, F, {2})</text>
  <text x="520" y="162" text-anchor="middle" font-size="10" fill="#333">up = s[1] = 0</text>
  <text x="520" y="180" text-anchor="middle" font-size="10" fill="#333">d=0：无冲突</text>
  <text x="520" y="198" text-anchor="middle" font-size="10" fill="#333">→ 数字 20 ✓</text>
  <text x="520" y="218" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">小计 = 1</text>

  <!-- 汇聚 -->
  <path d="M 120 228 L 120 240 L 520 240 L 520 228" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <path d="M 300 240 L 300 254" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== f(n) 结果 ===== -->
  <rect x="140" y="256" width="320" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="276" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">f(20) = 9 + 9 + 1 = 19</text>
  <text x="300" y="294" text-anchor="middle" font-size="10" fill="#888">各位互异数：1~9, 10, 12~19, 20</text>

  <path d="M 300 300 L 300 314" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== 最终答案 ===== -->
  <rect x="100" y="316" width="400" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="338" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">答案 = n − f(n) = 20 − 19 = 1</text>
  <text x="300" y="356" text-anchor="middle" font-size="10" fill="#888">唯一的重复数字数：11</text>

  <!-- ===== 验证 n=100 ===== -->
  <rect x="20" y="380" width="560" height="170" fill="#f6f8fb" stroke="#888" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="400" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">快速验证：n = 100（k = 3）</text>

  <rect x="30" y="410" width="170" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="115" y="430" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">位数 &lt; 3（分支 A）</text>
  <text x="115" y="446" text-anchor="middle" font-size="10" fill="#333">1 位：9 个</text>
  <text x="115" y="460" text-anchor="middle" font-size="10" fill="#333">2 位：9×9 = 81 个</text>

  <rect x="215" y="410" width="170" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="300" y="430" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">位数 = 3（分支 B）</text>
  <text x="300" y="446" text-anchor="middle" font-size="10" fill="#333">d=0→分支A补</text>
  <text x="300" y="460" text-anchor="middle" font-size="10" fill="#333">d=1→s[1]=0, s[2]=0</text>

  <rect x="400" y="410" width="170" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="485" y="430" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">结果</text>
  <text x="485" y="446" text-anchor="middle" font-size="10" fill="#333">f(100) = 9+81+0 = 90</text>
  <text x="485" y="460" text-anchor="middle" font-size="10" fill="#333">答案 = 100−90 = 10</text>

  <text x="300" y="486" text-anchor="middle" font-size="10" fill="#888">3 位匹配 "100"：d=1 时 tight 继续，s[1]=0 → d=0 继续（mask 无冲突），</text>
  <text x="300" y="500" text-anchor="middle" font-size="10" fill="#888">s[2]=0 → d=0 但 mask 已含 0 → 跳过 → 100 自身有重复 0，不计入 f(n)</text>
  <text x="300" y="522" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">💡 100 的各位是 1,0,0 — 数字 0 重复，恰好被 mask 拦截，f(n) 不含 100</text>
  <text x="300" y="540" text-anchor="middle" font-size="10" fill="#b85450">答案 10 = {11,22,33,44,55,66,77,88,99,100} ✓</text>
</svg>
