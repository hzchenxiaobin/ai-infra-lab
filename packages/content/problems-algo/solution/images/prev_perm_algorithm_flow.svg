<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="470" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">
    算法流程：一次交换求先前排列
  </text>

  <rect x="190" y="44" width="140" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="15" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">输入 arr</text>

  <path d="M 260 76 L 260 92" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="80" y="94" width="360" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="114" text-anchor="middle" font-size="11" fill="#444" font-weight="bold" filter="url(#rough2)">① 从右往左找首个 arr[i] &gt; arr[i+1]</text>
  <text x="260" y="131" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i = n-2; while i ≥ 0 and arr[i] ≤ arr[i+1]: i ←</text>

  <path d="M 260 142 L 260 158" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,160 350,200 260,240 170,200" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="205" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">i ≥ 0 ?</text>

  <path d="M 350 200 L 410 200" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="368" y="194" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="410" y="184" width="92" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="456" y="200" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">已是最小</text>
  <text x="456" y="212" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 arr</text>

  <path d="M 260 240 L 260 256" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="252" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="80" y="258" width="360" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="278" text-anchor="middle" font-size="11" fill="#444" font-weight="bold" filter="url(#rough2)">② 后缀中找 &lt; arr[i] 的最大值</text>
  <text x="260" y="295" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j = n-1; while arr[j] ≥ arr[i]: j ←</text>

  <path d="M 260 306 L 260 322" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="80" y="324" width="360" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="344" text-anchor="middle" font-size="11" fill="#444" font-weight="bold" filter="url(#rough2)">③ 重复值取最左位置</text>
  <text x="260" y="361" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">k = j; while k &gt; i+1 and arr[k-1] == arr[j]: k ←</text>

  <path d="M 260 372 L 260 388" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="80" y="390" width="360" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="412" text-anchor="middle" font-size="11" fill="#444" font-weight="bold" filter="url(#rough2)">④ swap(arr[i], arr[k])，返回 arr</text>

  <rect x="40" y="434" width="440" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="453" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">
    后缀非递减 → 从右扫首个 &lt; arr[i] 即最大较小值，无需排序
  </text>
</svg>
