<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="500" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">DFS 枚举 + 剪枝算法流程</text>

  <!-- Start: iterate bases -->
  <rect x="160" y="38" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">遍历每个 base，调用 DFS(0, base)</text>

  <path d="M 270 74 L 270 92" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Update ans -->
  <rect x="130" y="96" width="280" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="115" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">更新 ans：比较 |cost − target|</text>
  <text x="270" y="130" text-anchor="middle" font-size="10" fill="#4a7a3a">更近则替换；等距取较小 cost</text>

  <path d="M 270 138 L 270 156" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: cost >= target? -->
  <polygon points="270,160 380,205 270,250 160,205" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="202" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">cost ≥ target ?</text>
  <text x="270" y="218" text-anchor="middle" font-size="9" fill="#888">配料全为正，加只会更远</text>

  <!-- Yes: prune -->
  <path d="M 380 205 L 440 205 L 440 160 L 416 160" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="198" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="296" y="146" width="120" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="356" y="165" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">剪枝返回 ✂</text>

  <!-- No: continue -->
  <path d="M 270 250 L 270 268" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="264" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- Decision: idx == m? -->
  <polygon points="270,272 370,312 270,352 170,312" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="310" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">idx == m ?</text>
  <text x="270" y="326" text-anchor="middle" font-size="9" fill="#888">配料用完</text>

  <!-- Yes: return -->
  <path d="M 370 312 L 430 312 L 430 268 L 406 268" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="382" y="305" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">是</text>
  <rect x="296" y="254" width="110" height="28" fill="#f0f0f0" stroke="#888" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="351" y="273" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">返回（叶节点）</text>

  <!-- No: branch -->
  <path d="M 270 352 L 270 370" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="366" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- Three branches -->
  <text x="270" y="384" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">对 toppingCosts[idx] 选 0 / 1 / 2 份</text>

  <!-- Branch boxes -->
  <rect x="30" y="398" width="150" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="105" y="416" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0 份</text>
  <text x="105" y="430" text-anchor="middle" font-size="10" fill="#666">DFS(idx+1, cost)</text>

  <rect x="195" y="398" width="150" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="416" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1 份</text>
  <text x="270" y="430" text-anchor="middle" font-size="10" fill="#666">DFS(idx+1, cost+t)</text>

  <rect x="360" y="398" width="150" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="435" y="416" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2 份</text>
  <text x="435" y="430" text-anchor="middle" font-size="10" fill="#666">DFS(idx+1, cost+2t)</text>

  <!-- Arrows from branch point to boxes -->
  <path d="M 270 376 L 105 396" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 270 376 L 270 396" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 270 376 L 435 396" stroke="#d6a040" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop back arrow -->
  <path d="M 105 438 L 105 460 L 270 460 L 270 116" stroke="#666" stroke-width="1.1" stroke-dasharray="5,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 435 438 L 435 460 L 270 460" stroke="#666" stroke-width="1.1" stroke-dasharray="5,3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="400" font-size="9" fill="#999" transform="rotate(-90 60 400)">递归</text>
</svg>
