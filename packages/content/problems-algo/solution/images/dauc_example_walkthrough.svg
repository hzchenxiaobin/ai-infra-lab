<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="520" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：10 条记录 → 筛日期 → 分组去重计数</text>

  <!-- ===== Step 1: Raw Activity table ===== -->
  <text x="290" y="46" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">步骤 ①  原始 Activity 表（10 条记录）</text>

  <!-- table header -->
  <rect x="60" y="54" width="460" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="68" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">user_id</text>
  <text x="180" y="68" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">session_id</text>
  <text x="290" y="68" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">activity_date</text>
  <text x="430" y="68" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">activity_type</text>
  <line x1="140" y1="54" x2="140" y2="74" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="220" y1="54" x2="220" y2="74" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="360" y1="54" x2="360" y2="74" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- 11 rows (2 excluded, 9 kept) -->
  <!-- row 1: user 1, 07-20, open -->
  <rect x="60" y="74" width="460" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
  <text x="100" y="84" text-anchor="middle" font-size="7.5" fill="#333">1</text>
  <text x="180" y="84" text-anchor="middle" font-size="7.5" fill="#333">1</text>
  <text x="290" y="84" text-anchor="middle" font-size="7.5" fill="#4a7a3a" font-weight="bold">2019-07-20</text>
  <text x="430" y="84" text-anchor="middle" font-size="7.5" fill="#888">open_session</text>

  <!-- row 2: user 1, 07-20, scroll -->
  <rect x="60" y="88" width="460" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
  <text x="100" y="98" text-anchor="middle" font-size="7.5" fill="#333">1</text>
  <text x="180" y="98" text-anchor="middle" font-size="7.5" fill="#333">1</text>
  <text x="290" y="98" text-anchor="middle" font-size="7.5" fill="#4a7a3a" font-weight="bold">2019-07-20</text>
  <text x="430" y="98" text-anchor="middle" font-size="7.5" fill="#888">scroll_down</text>

  <!-- row 3: user 1, 07-20, end -->
  <rect x="60" y="102" width="460" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
  <text x="100" y="112" text-anchor="middle" font-size="7.5" fill="#333">1</text>
  <text x="180" y="112" text-anchor="middle" font-size="7.5" fill="#333">1</text>
  <text x="290" y="112" text-anchor="middle" font-size="7.5" fill="#4a7a3a" font-weight="bold">2019-07-20</text>
  <text x="430" y="112" text-anchor="middle" font-size="7.5" fill="#888">end_session</text>

  <!-- row 4: user 2, 07-20, open -->
  <rect x="60" y="116" width="460" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
  <text x="100" y="126" text-anchor="middle" font-size="7.5" fill="#333">2</text>
  <text x="180" y="126" text-anchor="middle" font-size="7.5" fill="#333">4</text>
  <text x="290" y="126" text-anchor="middle" font-size="7.5" fill="#4a7a3a" font-weight="bold">2019-07-20</text>
  <text x="430" y="126" text-anchor="middle" font-size="7.5" fill="#888">open_session</text>

  <!-- row 5: user 2, 07-21, send -->
  <rect x="60" y="130" width="460" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
  <text x="100" y="140" text-anchor="middle" font-size="7.5" fill="#333">2</text>
  <text x="180" y="140" text-anchor="middle" font-size="7.5" fill="#333">4</text>
  <text x="290" y="140" text-anchor="middle" font-size="7.5" fill="#4a7a3a" font-weight="bold">2019-07-21</text>
  <text x="430" y="140" text-anchor="middle" font-size="7.5" fill="#888">send_message</text>

  <!-- row 6: user 2, 07-21, end -->
  <rect x="60" y="144" width="460" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
  <text x="100" y="154" text-anchor="middle" font-size="7.5" fill="#333">2</text>
  <text x="180" y="154" text-anchor="middle" font-size="7.5" fill="#333">4</text>
  <text x="290" y="154" text-anchor="middle" font-size="7.5" fill="#4a7a3a" font-weight="bold">2019-07-21</text>
  <text x="430" y="154" text-anchor="middle" font-size="7.5" fill="#888">end_session</text>

  <!-- row 7: user 3, 07-21, open -->
  <rect x="60" y="158" width="460" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
  <text x="100" y="168" text-anchor="middle" font-size="7.5" fill="#333">3</text>
  <text x="180" y="168" text-anchor="middle" font-size="7.5" fill="#333">2</text>
  <text x="290" y="168" text-anchor="middle" font-size="7.5" fill="#4a7a3a" font-weight="bold">2019-07-21</text>
  <text x="430" y="168" text-anchor="middle" font-size="7.5" fill="#888">open_session</text>

  <!-- row 8: user 3, 07-21, send -->
  <rect x="60" y="172" width="460" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
  <text x="100" y="182" text-anchor="middle" font-size="7.5" fill="#333">3</text>
  <text x="180" y="182" text-anchor="middle" font-size="7.5" fill="#333">2</text>
  <text x="290" y="182" text-anchor="middle" font-size="7.5" fill="#4a7a3a" font-weight="bold">2019-07-21</text>
  <text x="430" y="182" text-anchor="middle" font-size="7.5" fill="#888">send_message</text>

  <!-- row 9: user 3, 07-21, end -->
  <rect x="60" y="186" width="460" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.5" rx="1" filter="url(#rough2)"/>
  <text x="100" y="196" text-anchor="middle" font-size="7.5" fill="#333">3</text>
  <text x="180" y="196" text-anchor="middle" font-size="7.5" fill="#333">2</text>
  <text x="290" y="196" text-anchor="middle" font-size="7.5" fill="#4a7a3a" font-weight="bold">2019-07-21</text>
  <text x="430" y="196" text-anchor="middle" font-size="7.5" fill="#888">end_session</text>

  <!-- row 10: user 4, 06-25, open (EXCLUDED) -->
  <rect x="60" y="200" width="460" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
  <text x="100" y="210" text-anchor="middle" font-size="7.5" fill="#888">4</text>
  <text x="180" y="210" text-anchor="middle" font-size="7.5" fill="#888">3</text>
  <text x="290" y="210" text-anchor="middle" font-size="7.5" fill="#b85450" font-weight="bold" text-decoration="line-through">2019-06-25</text>
  <text x="430" y="210" text-anchor="middle" font-size="7.5" fill="#888">open_session</text>

  <!-- row 11: user 4, 06-25, end (EXCLUDED) -->
  <rect x="60" y="214" width="460" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="1" filter="url(#rough2)"/>
  <text x="100" y="224" text-anchor="middle" font-size="7.5" fill="#888">4</text>
  <text x="180" y="224" text-anchor="middle" font-size="7.5" fill="#888">3</text>
  <text x="290" y="224" text-anchor="middle" font-size="7.5" fill="#b85450" font-weight="bold" text-decoration="line-through">2019-06-25</text>
  <text x="430" y="224" text-anchor="middle" font-size="7.5" fill="#888">end_session</text>

  <!-- column lines for all rows -->
  <line x1="140" y1="74" x2="140" y2="228" stroke="#446688" stroke-width="0.4" filter="url(#rough2)"/>
  <line x1="220" y1="74" x2="220" y2="228" stroke="#446688" stroke-width="0.4" filter="url(#rough2)"/>
  <line x1="360" y1="74" x2="360" y2="228" stroke="#446688" stroke-width="0.4" filter="url(#rough2)"/>

  <!-- arrow down to step 2 -->
  <path d="M290 232 L290 250" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="310" y="246" font-size="8" fill="#d6a040" font-weight="bold">WHERE DATEDIFF &lt; 30</text>
  <text x="310" y="256" font-size="7" fill="#b85450">06-25 差值=32 ≥ 30 → 丢弃</text>

  <!-- ===== Step 2: Grouped by date ===== -->
  <text x="290" y="272" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">步骤 ②  GROUP BY activity_date（2 个分组）</text>

  <!-- Group 07-20 -->
  <rect x="40" y="282" width="240" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="160" y="298" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">分组：2019-07-20</text>
  <line x1="55" y1="304" x2="265" y2="304" stroke="#d6a040" stroke-width="0.5" filter="url(#rough2)"/>
  <text x="70" y="316" font-size="7.5" fill="#333">user_id: 1 (open)</text>
  <text x="70" y="328" font-size="7.5" fill="#333">user_id: 1 (scroll)</text>
  <text x="70" y="340" font-size="7.5" fill="#333">user_id: 1 (end)</text>
  <text x="70" y="352" font-size="7.5" fill="#333">user_id: 2 (open)</text>
  <rect x="55" y="358" width="210" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.6" rx="3" filter="url(#rough2)"/>
  <text x="160" y="370" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">4 条记录，user_id = {1, 1, 1, 2}</text>

  <!-- Group 07-21 -->
  <rect x="300" y="282" width="240" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="420" y="298" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">分组：2019-07-21</text>
  <line x1="315" y1="304" x2="525" y2="304" stroke="#d6a040" stroke-width="0.5" filter="url(#rough2)"/>
  <text x="330" y="316" font-size="7.5" fill="#333">user_id: 2 (send)</text>
  <text x="330" y="328" font-size="7.5" fill="#333">user_id: 2 (end)</text>
  <text x="330" y="340" font-size="7.5" fill="#333">user_id: 3 (open)</text>
  <text x="330" y="352" font-size="7.5" fill="#333">user_id: 3 (send), 3 (end)</text>
  <rect x="315" y="358" width="210" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.6" rx="3" filter="url(#rough2)"/>
  <text x="420" y="370" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">5 条记录，user_id = {2, 2, 3, 3, 3}</text>

  <!-- arrow down to step 3 -->
  <path d="M290 386 L290 404" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="310" y="400" font-size="8" fill="#b85450" font-weight="bold">COUNT(DISTINCT user_id)</text>

  <!-- ===== Step 3: Final result ===== -->
  <text x="290" y="420" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">步骤 ③  去重计数 → 最终结果</text>

  <!-- result table -->
  <rect x="160" y="430" width="260" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="220" y="445" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">day</text>
  <text x="350" y="445" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">active_users</text>
  <line x1="280" y1="430" x2="280" y2="452" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="160" y="452" width="260" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="220" y="464" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">2019-07-20</text>
  <text x="350" y="464" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">2</text>
  <line x1="280" y1="452" x2="280" y2="470" stroke="#b85450" stroke-width="0.6" filter="url(#rough2)"/>

  <rect x="160" y="470" width="260" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="220" y="482" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">2019-07-21</text>
  <text x="350" y="482" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">2</text>
  <line x1="280" y1="470" x2="280" y2="488" stroke="#b85450" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- annotation arrows from groups to result -->
  <path d="M160 380 Q160 410 220 430" stroke="#4a7a3a" stroke-width="1" fill="none" stroke-dasharray="3,2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="120" y="408" font-size="7" fill="#4a7a3a" font-weight="bold">{1,2} → 2</text>

  <path d="M420 380 Q420 410 350 430" stroke="#4a7a3a" stroke-width="1" fill="none" stroke-dasharray="3,2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="440" y="408" font-size="7" fill="#4a7a3a" font-weight="bold">{2,3} → 2</text>

  <!-- pitfall note -->
  <rect x="20" y="430" width="130" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="85" y="446" text-anchor="middle" font-size="7.5" fill="#d6a040" font-weight="bold">⚠️ 若用 COUNT(*)</text>
  <text x="85" y="460" text-anchor="middle" font-size="7.5" fill="#b85450">07-20 → 4（错）</text>
  <text x="85" y="472" text-anchor="middle" font-size="7.5" fill="#b85450">07-21 → 5（错）</text>
  <text x="85" y="484" text-anchor="middle" font-size="7" fill="#4a7a3a" font-weight="bold">必须 COUNT(DISTINCT)</text>

  <rect x="430" y="430" width="130" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="495" y="446" text-anchor="middle" font-size="7.5" fill="#d6a040" font-weight="bold">💡 30 天窗口</text>
  <text x="495" y="460" text-anchor="middle" font-size="7.5" fill="#333">06-28 ~ 07-27</text>
  <text x="495" y="472" text-anchor="middle" font-size="7.5" fill="#333">共 30 天</text>
  <text x="495" y="484" text-anchor="middle" font-size="7" fill="#4a7a3a" font-weight="bold">DATEDIFF &lt; 30</text>
</svg>
