<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：逐员工配对经理，比较 salary</text>

  <!-- Header row: Employee e -->
  <text x="105" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">员工 e（按 id 升序）</text>
  <rect x="30" y="62" width="160" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="48" y="79" font-size="9.5" fill="#333">e.id</text>
  <text x="80" y="79" font-size="9.5" fill="#333">e.name</text>
  <text x="125" y="79" font-size="9.5" fill="#333">e.salary</text>
  <text x="168" y="79" font-size="9.5" fill="#b85450">mgrId</text>
  <line x1="65" y1="62" x2="65" y2="88" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="110" y1="62" x2="110" y2="88" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="160" y1="62" x2="160" y2="88" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- 4 employee rows -->
  <!-- Joe -->
  <rect x="30" y="88" width="160" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="48" y="104" font-size="9.5" fill="#333">1</text>
  <text x="80" y="104" font-size="9.5" fill="#333">Joe</text>
  <text x="125" y="104" font-size="9.5" fill="#333">70000</text>
  <text x="168" y="104" font-size="9.5" fill="#b85450" font-weight="bold">3</text>
  <line x1="65" y1="88" x2="65" y2="112" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="110" y1="88" x2="110" y2="112" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="160" y1="88" x2="160" y2="112" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Henry -->
  <rect x="30" y="112" width="160" height="24" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="48" y="128" font-size="9.5" fill="#333">2</text>
  <text x="80" y="128" font-size="9.5" fill="#333">Henry</text>
  <text x="125" y="128" font-size="9.5" fill="#333">80000</text>
  <text x="168" y="128" font-size="9.5" fill="#b85450" font-weight="bold">4</text>
  <line x1="65" y1="112" x2="65" y2="136" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="110" y1="112" x2="110" y2="136" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="160" y1="112" x2="160" y2="136" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Sam -->
  <rect x="30" y="136" width="160" height="24" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="48" y="152" font-size="9.5" fill="#333">3</text>
  <text x="80" y="152" font-size="9.5" fill="#333">Sam</text>
  <text x="125" y="152" font-size="9.5" fill="#333">60000</text>
  <text x="168" y="152" font-size="9.5" fill="#888">NULL</text>
  <line x1="65" y1="136" x2="65" y2="160" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="110" y1="136" x2="110" y2="160" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="160" y1="136" x2="160" y2="160" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Max -->
  <rect x="30" y="160" width="160" height="24" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="48" y="176" font-size="9.5" fill="#333">4</text>
  <text x="80" y="176" font-size="9.5" fill="#333">Max</text>
  <text x="125" y="176" font-size="9.5" fill="#333">90000</text>
  <text x="168" y="176" font-size="9.5" fill="#888">NULL</text>
  <line x1="65" y1="160" x2="65" y2="184" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="110" y1="160" x2="110" y2="184" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="160" y1="160" x2="160" y2="184" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Manager lookup arrows (middle column) -->
  <path d="M190 100 L300 100" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="245" y="94" text-anchor="middle" font-size="9" fill="#b85450">查 id=3</text>

  <path d="M190 124 L300 124" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="245" y="118" text-anchor="middle" font-size="9" fill="#b85450">查 id=4</text>

  <path d="M190 148 L240 148" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="245" y="152" text-anchor="middle" font-size="9" fill="#888">NULL → 跳过</text>

  <path d="M190 172 L240 172" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="245" y="176" text-anchor="middle" font-size="9" fill="#888">NULL → 跳过</text>

  <!-- Manager m table (right) -->
  <text x="435" y="56" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">经理 m（同表另一副本）</text>
  <rect x="360" y="62" width="150" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="378" y="79" font-size="9.5" fill="#333">m.id</text>
  <text x="410" y="79" font-size="9.5" fill="#333">m.name</text>
  <text x="460" y="79" font-size="9.5" fill="#333">m.salary</text>
  <line x1="395" y1="62" x2="395" y2="88" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="440" y1="62" x2="440" y2="88" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="360" y="88" width="150" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="378" y="104" font-size="9.5" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="410" y="104" font-size="9.5" fill="#333">Sam</text>
  <text x="460" y="104" font-size="9.5" fill="#333">60000</text>
  <line x1="395" y1="88" x2="395" y2="112" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="440" y1="88" x2="440" y2="112" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="360" y="112" width="150" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="378" y="128" font-size="9.5" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="410" y="128" font-size="9.5" fill="#333">Max</text>
  <text x="460" y="128" font-size="9.5" fill="#333">90000</text>
  <line x1="395" y1="112" x2="395" y2="136" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="440" y1="112" x2="440" y2="136" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Comparison verdict rows -->
  <text x="280" y="206" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">逐行判定 e.salary &gt; m.salary ?</text>

  <!-- Verdict table -->
  <rect x="60" y="216" width="440" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="233" font-size="9.5" fill="#333">员工</text>
  <text x="160" y="233" font-size="9.5" fill="#333">e.salary</text>
  <text x="250" y="233" font-size="9.5" fill="#333">经理</text>
  <text x="330" y="233" font-size="9.5" fill="#333">m.salary</text>
  <text x="430" y="233" font-size="9.5" fill="#333">判定</text>
  <line x1="130" y1="216" x2="130" y2="242" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="220" y1="216" x2="220" y2="242" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="300" y1="216" x2="300" y2="242" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="400" y1="216" x2="400" y2="242" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Joe verdict -->
  <rect x="60" y="242" width="440" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="80" y="258" font-size="9.5" fill="#333">Joe</text>
  <text x="160" y="258" font-size="9.5" fill="#333">70000</text>
  <text x="250" y="258" font-size="9.5" fill="#333">Sam</text>
  <text x="330" y="258" font-size="9.5" fill="#333">60000</text>
  <text x="430" y="258" font-size="9.5" fill="#b85450" font-weight="bold">✓ 输出</text>
  <line x1="130" y1="242" x2="130" y2="266" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="220" y1="242" x2="220" y2="266" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="300" y1="242" x2="300" y2="266" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="400" y1="242" x2="400" y2="266" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Henry verdict -->
  <rect x="60" y="266" width="440" height="24" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="80" y="282" font-size="9.5" fill="#333">Henry</text>
  <text x="160" y="282" font-size="9.5" fill="#333">80000</text>
  <text x="250" y="282" font-size="9.5" fill="#333">Max</text>
  <text x="330" y="282" font-size="9.5" fill="#333">90000</text>
  <text x="430" y="282" font-size="9.5" fill="#888">✗ 80000 &lt; 90000</text>
  <line x1="130" y1="266" x2="130" y2="290" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="220" y1="266" x2="220" y2="290" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="300" y1="266" x2="300" y2="290" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="400" y1="266" x2="400" y2="290" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Sam verdict -->
  <rect x="60" y="290" width="440" height="24" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="80" y="306" font-size="9.5" fill="#333">Sam</text>
  <text x="160" y="306" font-size="9.5" fill="#333">60000</text>
  <text x="250" y="306" font-size="9.5" fill="#888">—（无经理）</text>
  <text x="330" y="306" font-size="9.5" fill="#888">NULL</text>
  <text x="430" y="306" font-size="9.5" fill="#888">✗ JOIN 无匹配</text>
  <line x1="130" y1="290" x2="130" y2="314" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="220" y1="290" x2="220" y2="314" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="300" y1="290" x2="300" y2="314" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="400" y1="290" x2="400" y2="314" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Max verdict -->
  <rect x="60" y="314" width="440" height="24" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="80" y="330" font-size="9.5" fill="#333">Max</text>
  <text x="160" y="330" font-size="9.5" fill="#333">90000</text>
  <text x="250" y="330" font-size="9.5" fill="#888">—（无经理）</text>
  <text x="330" y="330" font-size="9.5" fill="#888">NULL</text>
  <text x="430" y="330" font-size="9.5" fill="#888">✗ JOIN 无匹配</text>
  <line x1="130" y1="314" x2="130" y2="338" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="220" y1="314" x2="220" y2="338" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="300" y1="314" x2="300" y2="338" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="400" y1="314" x2="400" y2="338" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Result -->
  <path d="M280 346 L280 372" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="160" y="376" width="240" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="398" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">最终结果</text>
  <rect x="240" y="408" width="80" height="24" fill="#fff" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="424" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">Joe</text>
  <text x="280" y="448" text-anchor="middle" font-size="9" fill="#888">仅 Joe 薪资超过其经理 Sam</text>
</svg>
