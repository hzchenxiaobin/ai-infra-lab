<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="460" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="230" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：求和 → 算差距 → 上取整</text>

  <!-- Start -->
  <rect x="160" y="46" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="230" y="68" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">开始</text>
  <path d="M 230 80 L 230 96" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 1: sum -->
  <rect x="120" y="100" width="220" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="230" y="120" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">① 求数组总和</text>
  <text x="230" y="136" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">S = Σ nums[i]   （用 long long）</text>
  <path d="M 230 144 L 230 160" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: diff -->
  <rect x="120" y="164" width="220" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="230" y="184" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">② 计算差距</text>
  <text x="230" y="200" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">diff = goal − S</text>
  <path d="M 230 208 L 230 224" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: diff == 0? -->
  <polygon points="230,228 320,272 230,316 140,272" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="268" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">diff == 0 ?</text>
  <text x="230" y="284" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">（已相等）</text>

  <!-- Yes branch → right -->
  <path d="M 320 272 L 372 272" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="346" y="266" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="376" y="256" width="72" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="412" y="278" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return 0</text>

  <!-- No branch → down -->
  <path d="M 230 316 L 230 338" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="248" y="332" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- Step 3: ceil division -->
  <rect x="90" y="342" width="280" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="230" y="362" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">③ 上取整除法</text>
  <text x="230" y="380" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ans = (|diff| + limit − 1) // limit</text>
  <path d="M 230 390 L 230 406" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Return ans -->
  <rect x="150" y="410" width="160" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="230" y="432" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return ans</text>

  <!-- side note -->
  <rect x="332" y="346" width="120" height="64" fill="#fafafa" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3" rx="6" filter="url(#rough2)"/>
  <text x="392" y="364" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">整数上取整技巧</text>
  <text x="392" y="380" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">⌈a/b⌉</text>
  <text x="392" y="396" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">=(a+b−1)//b</text>
  <text x="392" y="408" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">避免浮点</text>
</svg>
