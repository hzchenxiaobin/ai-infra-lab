<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="32" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">示例演算：nums=[2,1,1,1,3,4,1], k=2</text>

  <!-- index header -->
  <g filter="url(#rough2)">
    <text x="60" y="76" text-anchor="end" font-size="12" fill="#888">下标 i</text>
  </g>
  <g font-size="12" fill="#888" filter="url(#rough2)">
    <text x="130" y="76" text-anchor="middle">0</text>
    <text x="190" y="76" text-anchor="middle">1</text>
    <text x="250" y="76" text-anchor="middle">2</text>
    <text x="310" y="76" text-anchor="middle">3</text>
    <text x="370" y="76" text-anchor="middle">4</text>
    <text x="430" y="76" text-anchor="middle">5</text>
    <text x="490" y="76" text-anchor="middle">6</text>
  </g>

  <!-- nums row -->
  <text x="60" y="110" text-anchor="end" font-size="13" fill="#333" filter="url(#rough2)">nums</text>
  <g filter="url(#rough2)">
    <rect x="104" y="86" width="52" height="34" fill="#f0f0f0" stroke="#999" stroke-width="1.3" rx="4"/>
    <rect x="164" y="86" width="52" height="34" fill="#f0f0f0" stroke="#999" stroke-width="1.3" rx="4"/>
    <rect x="224" y="86" width="52" height="34" fill="#f0f0f0" stroke="#999" stroke-width="1.3" rx="4"/>
    <rect x="284" y="86" width="52" height="34" fill="#f0f0f0" stroke="#999" stroke-width="1.3" rx="4"/>
    <rect x="344" y="86" width="52" height="34" fill="#f0f0f0" stroke="#999" stroke-width="1.3" rx="4"/>
    <rect x="404" y="86" width="52" height="34" fill="#f0f0f0" stroke="#999" stroke-width="1.3" rx="4"/>
    <rect x="464" y="86" width="52" height="34" fill="#f0f0f0" stroke="#999" stroke-width="1.3" rx="4"/>
  </g>
  <g font-size="15" fill="#333" filter="url(#rough2)">
    <text x="130" y="108" text-anchor="middle">2</text>
    <text x="190" y="108" text-anchor="middle">1</text>
    <text x="250" y="108" text-anchor="middle">1</text>
    <text x="310" y="108" text-anchor="middle">1</text>
    <text x="370" y="108" text-anchor="middle">3</text>
    <text x="430" y="108" text-anchor="middle">4</text>
    <text x="490" y="108" text-anchor="middle">1</text>
  </g>

  <!-- inc row (blue, highlight cols 1,2 since used for good idx 2,3) -->
  <text x="60" y="162" text-anchor="end" font-size="13" fill="#446688" filter="url(#rough2)">inc (←非递增)</text>
  <g filter="url(#rough2)">
    <rect x="104" y="138" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="164" y="138" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="224" y="138" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4"/>
    <rect x="284" y="138" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="344" y="138" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="404" y="138" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="464" y="138" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
  </g>
  <g font-size="15" fill="#333" filter="url(#rough2)">
    <text x="130" y="160" text-anchor="middle">1</text>
    <text x="190" y="160" text-anchor="middle">2</text>
    <text x="250" y="160" text-anchor="middle">3</text>
    <text x="310" y="160" text-anchor="middle">4</text>
    <text x="370" y="160" text-anchor="middle">1</text>
    <text x="430" y="160" text-anchor="middle">1</text>
    <text x="490" y="160" text-anchor="middle">2</text>
  </g>

  <!-- dec row (green, highlight cols 3,4 since used for good idx 2,3) -->
  <text x="60" y="214" text-anchor="end" font-size="13" fill="#4a7a3a" filter="url(#rough2)">dec (非递减→)</text>
  <g filter="url(#rough2)">
    <rect x="104" y="190" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <rect x="164" y="190" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="224" y="190" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <rect x="284" y="190" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="344" y="190" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="404" y="190" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <rect x="464" y="190" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
  </g>
  <g font-size="15" fill="#333" filter="url(#rough2)">
    <text x="130" y="212" text-anchor="middle">1</text>
    <text x="190" y="212" text-anchor="middle">5</text>
    <text x="250" y="212" text-anchor="middle">4</text>
    <text x="310" y="212" text-anchor="middle">3</text>
    <text x="370" y="212" text-anchor="middle">2</text>
    <text x="430" y="212" text-anchor="middle">1</text>
    <text x="490" y="212" text-anchor="middle">1</text>
  </g>

  <!-- verdict row -->
  <text x="60" y="266" text-anchor="end" font-size="13" fill="#333" filter="url(#rough2)">判定 i∈[2,4]</text>
  <g filter="url(#rough2)">
    <rect x="104" y="242" width="52" height="34" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="4"/>
    <rect x="164" y="242" width="52" height="34" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="4"/>
    <rect x="224" y="242" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="284" y="242" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="344" y="242" width="52" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="404" y="242" width="52" height="34" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="4"/>
    <rect x="464" y="242" width="52" height="34" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="4"/>
  </g>
  <g font-size="13" fill="#333" filter="url(#rough2)">
    <text x="250" y="264" text-anchor="middle">✓</text>
    <text x="310" y="264" text-anchor="middle">✓</text>
    <text x="370" y="264" text-anchor="middle">✗</text>
  </g>

  <!-- reasoning notes -->
  <rect x="70" y="300" width="480" height="146" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="84" y="324" font-size="12" fill="#333" filter="url(#rough2)">• i=2：inc[1]=2≥2 ✓，dec[3]=3≥2 ✓ → 好下标</text>
  <text x="84" y="346" font-size="12" fill="#333" filter="url(#rough2)">• i=3：inc[2]=3≥2 ✓，dec[4]=2≥2 ✓ → 好下标</text>
  <text x="84" y="368" font-size="12" fill="#b85450" filter="url(#rough2)">• i=4：inc[3]=4≥2 ✓，但 dec[5]=1＜2 ✗ → 不是</text>
  <text x="84" y="392" font-size="12" fill="#333" filter="url(#rough2)">  （[4,1] 非非递减：4≤1 不成立，后 k 段断裂）</text>
  <text x="84" y="424" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">结果 ans = [2, 3] ✓</text>
</svg>
