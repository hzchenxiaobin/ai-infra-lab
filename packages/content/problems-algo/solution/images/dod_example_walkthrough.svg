<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：word1="sea" 与 word2="eat"，答案 dp[3][3]=2</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">保留公共子序列 "ea"，删 word1 的 's' + 删 word2 的 't' = 2 步</text>

  <!-- ===== dp table 4x4 (rows: "" s e a, cols: "" e a t) ===== -->
  <g font-size="11">
    <!-- corner -->
    <rect x="70" y="60" width="50" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="95" y="82" text-anchor="middle" font-size="9" fill="#888">w2→</text>
    <text x="62" y="50" font-size="9" fill="#888" font-weight="bold">w1↓</text>

    <!-- col headers -->
    <rect x="120" y="60" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="145" y="82" text-anchor="middle" fill="#888">""</text>
    <rect x="170" y="60" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="195" y="82" text-anchor="middle" fill="#446688" font-weight="bold">e</text>
    <rect x="220" y="60" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="245" y="82" text-anchor="middle" fill="#446688" font-weight="bold">a</text>
    <rect x="270" y="60" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="295" y="82" text-anchor="middle" fill="#446688" font-weight="bold">t</text>

    <!-- row headers -->
    <rect x="70" y="94" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="95" y="116" text-anchor="middle" fill="#888">""</text>
    <rect x="70" y="128" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="95" y="150" text-anchor="middle" fill="#446688" font-weight="bold">s</text>
    <rect x="70" y="162" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="95" y="184" text-anchor="middle" fill="#446688" font-weight="bold">e</text>
    <rect x="70" y="196" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="95" y="218" text-anchor="middle" fill="#446688" font-weight="bold">a</text>

    <!-- row "" (边界) -->
    <rect x="120" y="94" width="50" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="145" y="116" text-anchor="middle" fill="#b85450" font-weight="bold">0</text>
    <rect x="170" y="94" width="50" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="195" y="116" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="220" y="94" width="50" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="245" y="116" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <rect x="270" y="94" width="50" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="295" y="116" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>

    <!-- row s: 1, 2, 3, 4 -->
    <rect x="120" y="128" width="50" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="145" y="150" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="170" y="128" width="50" height="34" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="195" y="150" text-anchor="middle" fill="#555">2</text>
    <rect x="220" y="128" width="50" height="34" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="245" y="150" text-anchor="middle" fill="#555">3</text>
    <rect x="270" y="128" width="50" height="34" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="295" y="150" text-anchor="middle" fill="#555">4</text>

    <!-- row e: 2, 1(match), 2, 3 -->
    <rect x="120" y="162" width="50" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="145" y="184" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <rect x="170" y="162" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="195" y="184" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="220" y="162" width="50" height="34" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="245" y="184" text-anchor="middle" fill="#555">2</text>
    <rect x="270" y="162" width="50" height="34" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="295" y="184" text-anchor="middle" fill="#555">3</text>

    <!-- row a: 3, 2, 1(match), 2(answer) -->
    <rect x="120" y="196" width="50" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="145" y="218" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
    <rect x="170" y="196" width="50" height="34" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="195" y="218" text-anchor="middle" fill="#555">2</text>
    <rect x="220" y="196" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="245" y="218" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="270" y="196" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="295" y="218" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
  </g>

  <!-- ===== match arrow: dp[2][1]=1 from dp[1][0]=1 (e==e) ===== -->
  <path d="M 145 162 L 188 174" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="4,2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="120" y="158" font-size="9" fill="#4a7a3a" font-weight="bold">e==e 保留</text>

  <!-- ===== match arrow: dp[3][2]=1 from dp[2][1]=1 (a==a) ===== -->
  <path d="M 188 196 L 230 208" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="4,2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="195" y="200" font-size="9" fill="#4a7a3a" font-weight="bold">a==a</text>

  <!-- ===== answer arrow: dp[3][3]=2 from dp[3][2]=1 (a!=t, 删t) ===== -->
  <path d="M 240 214 L 268 214" stroke="#d6a040" stroke-width="1.8" fill="none" stroke-dasharray="4,2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="232" y="234" font-size="9" fill="#d6a040" font-weight="bold">a≠t 删t +1</text>

  <!-- ===== right side: step legend ===== -->
  <rect x="340" y="60" width="220" height="200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="450" y="80" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">关键填表步骤</text>

  <text x="354" y="100" font-size="9" fill="#4a7a3a" font-weight="bold">dp[2][1] e==e:</text>
  <text x="354" y="112" font-size="9" fill="#555">= dp[1][0] = 1（保留）</text>

  <text x="354" y="130" font-size="9" fill="#4a7a3a" font-weight="bold">dp[3][2] a==a:</text>
  <text x="354" y="142" font-size="9" fill="#555">= dp[2][1] = 1（保留）</text>

  <text x="354" y="160" font-size="9" fill="#d6a040" font-weight="bold">dp[3][3] a≠t:</text>
  <text x="354" y="172" font-size="9" fill="#555">= 1 + min(</text>
  <text x="362" y="184" font-size="9" fill="#888">dp[2][3]=3,  ← 删 a</text>
  <text x="362" y="196" font-size="9" fill="#888">dp[3][2]=1)  ← 删 t ✓</text>
  <text x="354" y="208" font-size="9" fill="#555">= 1 + 1 = 2</text>

  <text x="354" y="226" font-size="9" fill="#d6a040" font-weight="bold">→ 删 t 更省</text>
  <text x="354" y="238" font-size="9" fill="#555">保留 "ea"，删 s + 删 t</text>
  <text x="354" y="250" font-size="9" fill="#4a7a3a" font-weight="bold">答案 = 2 ✓</text>

  <!-- ===== bottom: 删除结果示意 ===== -->
  <rect x="40" y="280" width="500" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="290" y="300" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">回溯：保留公共子序列 "ea"</text>
  <text x="70" y="322" font-size="11" fill="#b85450" font-weight="bold">word1: </text>
  <text x="130" y="322" font-size="12" fill="#888" text-decoration="line-through">s</text>
  <text x="150" y="322" font-size="13" fill="#4a7a3a" font-weight="bold">e</text>
  <text x="175" y="322" font-size="13" fill="#4a7a3a" font-weight="bold">a</text>
  <text x="210" y="322" font-size="10" fill="#888">→ 删 's' (1步)</text>
  <text x="330" y="322" font-size="11" fill="#b85450" font-weight="bold">word2: </text>
  <text x="390" y="322" font-size="13" fill="#4a7a3a" font-weight="bold">e</text>
  <text x="415" y="322" font-size="13" fill="#4a7a3a" font-weight="bold">a</text>
  <text x="440" y="322" font-size="12" fill="#888" text-decoration="line-through">t</text>
  <text x="465" y="322" font-size="10" fill="#888">→ 删 't' (1步)</text>

  <rect x="40" y="374" width="500" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="290" y="388" text-anchor="middle" font-size="10" fill="#555">总步数 = (m-L) + (n-L) = (3-2) + (3-2) = 2，其中 L = LCS = 2</text>
</svg>
