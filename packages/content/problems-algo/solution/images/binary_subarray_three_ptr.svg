<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD2" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">三指针：合法左端点形成连续区间</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">以 nums=[1,0,1,0,1], goal=2, right=4 为例</text>

  <!-- index labels -->
  <text x="100" y="78" text-anchor="middle" font-size="9.5" fill="#aaa">下标 0</text>
  <text x="170" y="78" text-anchor="middle" font-size="9.5" fill="#aaa">1</text>
  <text x="240" y="78" text-anchor="middle" font-size="9.5" fill="#aaa">2</text>
  <text x="310" y="78" text-anchor="middle" font-size="9.5" fill="#aaa">3</text>
  <text x="380" y="78" text-anchor="middle" font-size="9.5" fill="#aaa">4</text>

  <!-- array cells: 5 cells, 70 wide each, starting x=65 -->
  <rect x="65" y="86" width="70" height="34" fill="#f6f6f6" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="108" text-anchor="middle" font-size="14" fill="#bbb">1</text>
  <rect x="135" y="86" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="170" y="108" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="205" y="86" width="70" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="240" y="108" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">1</text>
  <rect x="275" y="86" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="310" y="108" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="345" y="86" width="70" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="380" y="108" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">1</text>

  <!-- valid range bracket [l1, l2) = [1, 3) -->
  <path d="M 170 130 L 170 138 L 310 138 L 310 130" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="240" y="154" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">合法左端点区间 [l1, l2) = [1, 3)</text>

  <!-- pointer markers below cells -->
  <!-- l1 at index 1 (x=170) -->
  <path d="M 170 168 L 170 182" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrD2)" filter="url(#rough2)"/>
  <rect x="148" y="186" width="44" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="170" y="201" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">l1</text>
  <text x="170" y="222" text-anchor="middle" font-size="9" fill="#446688">和 ≤ goal</text>
  <text x="170" y="234" text-anchor="middle" font-size="9" fill="#888">的最左 left</text>

  <!-- l2 at index 3 (x=310) -->
  <path d="M 310 168 L 310 182" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrD2)" filter="url(#rough2)"/>
  <rect x="288" y="186" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="310" y="201" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">l2</text>
  <text x="310" y="222" text-anchor="middle" font-size="9" fill="#4a7a3a">和 &lt; goal</text>
  <text x="310" y="234" text-anchor="middle" font-size="9" fill="#888">的最左 left</text>

  <!-- r at index 4 (x=380) -->
  <path d="M 380 168 L 380 182" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrD2)" filter="url(#rough2)"/>
  <rect x="358" y="186" width="44" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="380" y="201" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">r</text>
  <text x="380" y="222" text-anchor="middle" font-size="9" fill="#b85450">右端点</text>

  <!-- Divider -->
  <path d="M 40 256 L 520 256" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Three example windows -->
  <text x="280" y="280" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">三个左端点的窗口和对比（固定 r=4）</text>

  <!-- left=l1=1: [0,1,0,1] sum=2 -->
  <rect x="40" y="296" width="150" height="76" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="115" y="316" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">left = l1 = 1</text>
  <text x="115" y="338" text-anchor="middle" font-size="10" fill="#555">窗口 [0,1,0,1]</text>
  <text x="115" y="358" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">sum = 2 = goal ✓</text>

  <!-- left=2 (in [l1,l2)): [1,0,1] sum=2 -->
  <rect x="205" y="296" width="150" height="76" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="316" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">left = 2（区间内）</text>
  <text x="280" y="338" text-anchor="middle" font-size="10" fill="#555">窗口 [1,0,1]</text>
  <text x="280" y="358" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">sum = 2 = goal ✓</text>

  <!-- left=l2=3: [0,1] sum=1 -->
  <rect x="370" y="296" width="150" height="76" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="445" y="316" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">left = l2 = 3</text>
  <text x="445" y="338" text-anchor="middle" font-size="10" fill="#555">窗口 [0,1]</text>
  <text x="445" y="358" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">sum = 1 &lt; goal ✗</text>

  <!-- Bottom formula -->
  <rect x="100" y="386" width="360" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="405" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">贡献 = l2 − l1 = 3 − 1 = 2 个</text>
</svg>
