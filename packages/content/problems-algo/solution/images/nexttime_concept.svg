<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：1440 分钟时间环上从「当前+1」起逐分钟试探</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">一天仅 1440 分钟 → 暴力模拟即最优；% 1440 自动跨天回绕</text>

  <!-- ===== allowed digits ===== -->
  <text x="40" y="82" font-size="12" fill="#888">可用数字：</text>
  <rect x="108" y="66" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="125" y="86" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="146" y="66" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="163" y="86" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">9</text>
  <rect x="184" y="66" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="201" y="86" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="222" y="66" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="239" y="86" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <text x="266" y="86" font-size="11" fill="#888">→ allowed = {1, 9, 3, 4}</text>

  <!-- divider -->
  <line x1="40" y1="108" x2="520" y2="108" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== time walk: 19:34 -> 19:39 ===== -->
  <text x="40" y="138" font-size="12.5" fill="#446688" font-weight="bold">从当前 +1 分钟起，逐分钟检查数位是否全在集合：</text>

  <!-- 19:34 start (blue) -->
  <rect x="40" y="152" width="74" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="77" y="178" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">19:34</text>
  <text x="77" y="206" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">起点 start</text>

  <!-- arrow -->
  <path d="M 116 172 L 132 172" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 19:35 cross (red) -->
  <rect x="136" y="152" width="68" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="170" y="178" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">19:35</text>
  <text x="170" y="206" text-anchor="middle" font-size="10" fill="#b85450">5 ∉ 集合 ✗</text>

  <path d="M 206 172 L 222 172" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 19:36 cross -->
  <rect x="226" y="152" width="68" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="178" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">19:36</text>
  <text x="260" y="206" text-anchor="middle" font-size="10" fill="#b85450">6 ∉ 集合 ✗</text>

  <path d="M 296 172 L 312 172" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 19:37 cross -->
  <rect x="316" y="152" width="68" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="350" y="178" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">19:37</text>
  <text x="350" y="206" text-anchor="middle" font-size="10" fill="#b85450">7 ∉ 集合 ✗</text>

  <path d="M 386 172 L 402 172" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 19:38 cross -->
  <rect x="406" y="152" width="68" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="440" y="178" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">19:38</text>
  <text x="440" y="206" text-anchor="middle" font-size="10" fill="#b85450">8 ∉ 集合 ✗</text>

  <path d="M 476 172 L 492 172" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 19:39 hit (green) -->
  <rect x="40" y="232" width="74" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.6" rx="6" filter="url(#rough2)"/>
  <text x="77" y="258" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">19:39</text>
  <text x="77" y="286" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">✓ 命中！返回</text>

  <!-- wrap arrow from 19:38 down to 19:39 -->
  <path d="M 440 214 Q 440 232 320 252 L 118 252" stroke="#4a7a3a" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="280" y="246" text-anchor="middle" font-size="10.5" fill="#4a7a3a">第一次命中 = 最近</text>

  <!-- divider -->
  <line x1="40" y1="306" x2="520" y2="306" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== circular wrap concept ===== -->
  <text x="40" y="336" font-size="12.5" fill="#b85450" font-weight="bold">跨天回绕：23:59 +1 → 00:00（次日），% 1440 一行搞定</text>

  <!-- time ring (ellipse) -->
  <ellipse cx="280" cy="384" rx="150" ry="34" fill="none" stroke="#888" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="130" y="388" font-size="11" fill="#888">00:00</text>
  <text x="420" y="388" font-size="11" fill="#888">12:00</text>
  <text x="280" y="356" text-anchor="middle" font-size="11" fill="#888">06:00</text>
  <text x="280" y="416" text-anchor="middle" font-size="11" fill="#888">18:00</text>

  <!-- wrap arrow at top of ring -->
  <path d="M 320 352 Q 360 340 396 352" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="358" y="338" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">回绕</text>
  <text x="358" y="372" text-anchor="middle" font-size="9.5" fill="#b85450">+1 % 1440</text>

  <rect x="40" y="372" width="76" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="78" y="388" text-anchor="middle" font-size="11" fill="#666">23:59→00:00</text>
  <text x="78" y="400" text-anchor="middle" font-size="9.5" fill="#888">跨天自动</text>

  <rect x="444" y="372" width="76" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="482" y="388" text-anchor="middle" font-size="11" fill="#666">走满 1440</text>
  <text x="482" y="400" text-anchor="middle" font-size="9.5" fill="#888">必命中</text>
</svg>
