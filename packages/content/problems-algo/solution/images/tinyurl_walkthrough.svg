<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：连续 encode 三条长 URL</text>

  <text x="40" y="56" font-size="11" fill="#888">long2code 哈希（避免同一长 URL 重复分配 id）</text>
  <text x="40" y="72" font-size="11" fill="#888">code2long 数组（按下标 = id O(1) 取回长 URL）</text>

  <rect x="36" y="86" width="488" height="58" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>

  <text x="52" y="106" font-size="11" fill="#444" font-weight="bold">调用</text>
  <text x="140" y="106" font-size="11" fill="#444" font-weight="bold">longUrl</text>
  <text x="340" y="106" font-size="11" fill="#444" font-weight="bold">是否已存在</text>
  <text x="440" y="106" font-size="11" fill="#444" font-weight="bold">结果</text>
  <line x1="44" y1="114" x2="520" y2="114" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <text x="52" y="132" font-size="10.5" fill="#555">encode #1</text>
  <text x="140" y="132" font-size="10.5" fill="#446688">leetcode.com/1</text>
  <text x="340" y="132" font-size="10.5" fill="#888">否</text>
  <text x="440" y="132" font-size="10.5" fill="#4a7a3a" font-weight="bold">id=1 → "1"</text>

  <text x="40" y="158" font-size="11.5" fill="#888" font-weight="bold">第 1 次 encode 后的两个表：</text>

  <rect x="40" y="170" width="220" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="150" y="190" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">long2code</text>
  <line x1="50" y1="196" x2="250" y2="196" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="214" font-size="10.5" fill="#555">leetcode.com/1</text>
  <text x="200" y="214" font-size="10.5" fill="#b85450" font-weight="bold">→ "1"</text>
  <text x="60" y="232" font-size="10.5" fill="#bbb">（无其他条目）</text>

  <rect x="290" y="170" width="230" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="405" y="190" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">code2long（数组，下标=id）</text>
  <line x1="300" y1="196" x2="510" y2="196" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="310" y="214" font-size="10.5" fill="#555">[0]</text>
  <text x="345" y="214" font-size="10.5" fill="#bbb">（哨兵/占位）</text>
  <text x="310" y="232" font-size="10.5" fill="#555">[1]</text>
  <text x="345" y="232" font-size="10.5" fill="#4a7a3a" font-weight="bold">leetcode.com/1</text>

  <path d="M 280 256 L 280 276" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="36" y="276" width="488" height="42" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="52" y="294" font-size="10.5" fill="#555">encode #2</text>
  <text x="140" y="294" font-size="10.5" fill="#446688">leetcode.com/2</text>
  <text x="340" y="294" font-size="10.5" fill="#888">否</text>
  <text x="440" y="294" font-size="10.5" fill="#4a7a3a" font-weight="bold">id=2 → "2"</text>
  <text x="52" y="312" font-size="10.5" fill="#b85450" font-weight="bold">encode #3</text>
  <text x="140" y="312" font-size="10.5" fill="#b85450">leetcode.com/1（同 #1）</text>
  <text x="340" y="312" font-size="10.5" fill="#4a7a3a" font-weight="bold">是！命中</text>
  <text x="440" y="312" font-size="10.5" fill="#d6a040" font-weight="bold">复用 "1"</text>

  <text x="40" y="342" font-size="11.5" fill="#888" font-weight="bold">第 3 次后：id 不增长，表无新增</text>

  <rect x="40" y="354" width="480" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="60" y="378" font-size="12" fill="#4a7a3a" font-weight="bold">两个关键不变量</text>
  <text x="60" y="398" font-size="11" fill="#555">• <tspan fill="#b85450" font-weight="bold">幂等</tspan>：long2code 命中则直接返回旧 code，同一长 URL 永远拿到同一短码</text>
  <text x="60" y="416" font-size="11" fill="#555">• <tspan fill="#d6a040" font-weight="bold">无碰撞</tspan>：id 严格自增 → code 严格唯一，base62 双射可逆</text>
  <text x="60" y="434" font-size="11" fill="#4a7a3a">→ decode 只需 base62⁻¹(code) 得 id，再 code2long[id] 即可，O(len(code))</text>
</svg>
