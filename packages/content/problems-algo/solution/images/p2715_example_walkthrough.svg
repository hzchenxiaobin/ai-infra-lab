<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">三个示例时间线演算</text>

  <!-- 表头 -->
  <text x="30" y="62" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">示例</text>
  <text x="100" y="62" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">t (fn 延迟)</text>
  <text x="190" y="62" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">cancel (取消)</text>
  <text x="285" y="62" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">时间线</text>
  <text x="470" y="62" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">输出</text>
  <line x1="20" y1="70" x2="540" y2="70" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <!-- 示例1 -->
  <text x="30" y="100" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="100" y="100" font-size="11" fill="#4a7a3a" filter="url(#rough2)">t=20</text>
  <text x="190" y="100" font-size="11" fill="#d6a040" filter="url(#rough2)">cancel=50</text>
  <!-- 时间线1 -->
  <line x1="290" y1="100" x2="460" y2="100" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <circle cx="310" cy="100" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="310" y="90" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">20 fn</text>
  <circle cx="360" cy="100" r="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="360" y="90" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">50 cancel</text>
  <text x="470" y="104" font-size="10" fill="#4a7a3a" filter="url(#rough2)">[{t:20,r:10}]</text>

  <line x1="20" y1="115" x2="540" y2="115" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- 示例2 -->
  <text x="30" y="145" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="100" y="145" font-size="11" fill="#4a7a3a" filter="url(#rough2)">t=100</text>
  <text x="190" y="145" font-size="11" fill="#d6a040" filter="url(#rough2)">cancel=50</text>
  <!-- 时间线2 -->
  <line x1="290" y1="145" x2="460" y2="145" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <circle cx="320" cy="145" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="135" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">50 cancel</text>
  <circle cx="430" cy="145" r="5" fill="none" stroke="#ccc" stroke-width="2" stroke-dasharray="2,2" filter="url(#rough2)"/>
  <text x="430" y="135" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">100 fn(取消)</text>
  <text x="470" y="149" font-size="10" fill="#b85450" filter="url(#rough2)">[]</text>

  <line x1="20" y1="160" x2="540" y2="160" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- 示例3 -->
  <text x="30" y="190" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="100" y="190" font-size="11" fill="#4a7a3a" filter="url(#rough2)">t=30</text>
  <text x="190" y="190" font-size="11" fill="#d6a040" filter="url(#rough2)">cancel=100</text>
  <!-- 时间线3 -->
  <line x1="290" y1="190" x2="460" y2="190" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <circle cx="305" cy="190" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="305" y="180" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">30 fn</text>
  <circle cx="420" cy="190" r="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="420" y="180" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">100 cancel</text>
  <text x="470" y="194" font-size="10" fill="#4a7a3a" filter="url(#rough2)">[{t:30,r:8}]</text>

  <line x1="20" y1="205" x2="540" y2="205" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <!-- 判定规则框 -->
  <rect x="40" y="225" width="480" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="52" y="245" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">判定规则</text>
  <text x="52" y="265" font-size="11" fill="#333" filter="url(#rough2)">● cancelTimeMs ≥ t → fn 已在 t ms 执行 → 输出 [{time: t, returned: fn(...args)}]</text>
  <text x="52" y="283" font-size="11" fill="#333" filter="url(#rough2)">● cancelTimeMs &lt; t → clearTimeout 在 t 前取消 → fn 永不执行 → 输出 []</text>

  <!-- 关键点 -->
  <rect x="40" y="310" width="480" height="55" fill="none" stroke="#446688" stroke-width="1.5" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="52" y="328" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">注意</text>
  <text x="52" y="346" font-size="10" fill="#333" filter="url(#rough2)">测试框架的 fn 实为 log 包装器，记录 {time, returned}；time = performance.now() - start。</text>
  <text x="52" y="360" font-size="10" fill="#333" filter="url(#rough2)">我们只须在 t ms 后调用传入的 fn(...args)，取消则不调用。</text>
</svg>
