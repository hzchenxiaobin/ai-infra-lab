<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：数对枚举不动，改数「每个 gcd 值拥有多少对」</text>
  <text x="260" y="38" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">n = 10⁵ ⇒ ≈5×10⁹ 个数对；但 gcd 只取 1…5×10⁴ —— 统计维度从「数对」换成「值」</text>

  <!-- 左：数对视角（不可行） -->
  <rect x="26" y="52" width="228" height="158" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="140" y="70" text-anchor="middle" font-size="11" fill="#8a3833" font-weight="bold" filter="url(#rough2)">数对视角（枚举 ✗）</text>

  <!-- 上三角格子：对 (i,j) -->
  <g filter="url(#rough2)">
    <!-- row 0 -->
    <rect x="42" y="80" width="13" height="13" fill="#ffffff" stroke="#c99" stroke-width="1"/>
    <rect x="59" y="80" width="13" height="13" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
    <rect x="76" y="80" width="13" height="13" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
    <rect x="93" y="80" width="13" height="13" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
    <rect x="110" y="80" width="13" height="13" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
    <rect x="127" y="80" width="13" height="13" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
    <rect x="144" y="80" width="13" height="13" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
    <rect x="161" y="80" width="13" height="13" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
    <!-- row 1 -->
    <rect x="42" y="97" width="13" height="13" fill="#ffffff" stroke="#c99" stroke-width="1"/>
    <rect x="59" y="97" width="13" height="13" fill="#ffffff" stroke="#c99" stroke-width="1"/>
    <rect x="76" y="97" width="13" height="13" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
    <rect x="93" y="97" width="13" height="13" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
    <rect x="110" y="97" width="13" height="13" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
    <rect x="127" y="97" width="13" height="13" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
    <rect x="144" y="97" width="13" height="13" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
    <rect x="161" y="97" width="13" height="13" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
    <!-- row 2 -->
    <rect x="42" y="114" width="13" height="13" fill="#ffffff" stroke="#c99" stroke-width="1"/>
    <rect x="59" y="114" width="13" height="13" fill="#ffffff" stroke="#c99" stroke-width="1"/>
    <rect x="76" y="114" width="13" height="13" fill="#ffffff" stroke="#c99" stroke-width="1"/>
    <rect x="93" y="114" width="13" height="13" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
    <rect x="110" y="114" width="13" height="13" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
    <rect x="127" y="114" width="13" height="13" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
    <rect x="144" y="114" width="13" height="13" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
    <rect x="161" y="114" width="13" height="13" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
    <!-- row 3 -->
    <rect x="42" y="131" width="13" height="13" fill="#ffffff" stroke="#c99" stroke-width="1"/>
    <rect x="59" y="131" width="13" height="13" fill="#ffffff" stroke="#c99" stroke-width="1"/>
    <rect x="76" y="131" width="13" height="13" fill="#ffffff" stroke="#c99" stroke-width="1"/>
    <rect x="93" y="131" width="13" height="13" fill="#ffffff" stroke="#c99" stroke-width="1"/>
    <rect x="110" y="131" width="13" height="13" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
    <rect x="127" y="131" width="13" height="13" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
    <rect x="144" y="131" width="13" height="13" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
    <rect x="161" y="131" width="13" height="13" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
    <text x="184" y="142" font-size="12" fill="#888">⋯</text>
  </g>
  <text x="120" y="141" text-anchor="middle" font-size="30" fill="#b85450" font-weight="bold" opacity="0.75" filter="url(#rough2)">✗</text>
  <text x="140" y="164" text-anchor="middle" font-size="9.5" fill="#7a3030" font-weight="bold" filter="url(#rough2)">≈5×10⁹ 对：算 gcd、排序都无从谈起</text>
  <text x="140" y="181" text-anchor="middle" font-size="9" fill="#a07070" filter="url(#rough2)">（连查询下标都到 5×10⁹，超 int32）</text>
  <text x="140" y="199" text-anchor="middle" font-size="8.5" fill="#a07070" filter="url(#rough2)">格子 = 数对 (i, j)，只画得出零头</text>

  <!-- 中间箭头 -->
  <path d="M 258 130 L 292 130" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="275" y="120" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">换维度</text>

  <!-- 右：值域视角（可行） -->
  <rect x="296" y="52" width="198" height="158" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="395" y="70" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">值域视角（计数 ✓）</text>
  <text x="395" y="87" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">gcd 只有 V = 5×10⁴ 种取值</text>

  <rect x="312" y="96" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="329" y="112" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">g=1</text>
  <rect x="358" y="96" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="375" y="112" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">g=2</text>
  <rect x="404" y="96" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="421" y="112" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">g=3</text>
  <rect x="450" y="96" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="467" y="112" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">g=4</text>

  <text x="329" y="140" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="375" y="140" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="421" y="140" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="467" y="140" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="302" y="140" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">对数</text>

  <text x="395" y="162" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">E[g] = gcd 恰好等于 g 的数对个数</text>
  <text x="395" y="180" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">求出 E 后做前缀和 → 排名查询 O(log V)</text>
  <text x="395" y="199" text-anchor="middle" font-size="9" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">（示例 [4,4,2,1]：E = {3,2,0,1}）</text>

  <!-- 桥梁：等价转化 -->
  <rect x="26" y="222" width="468" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="241" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">桥梁：gcd(a, b) 是 g 的倍数 ⇔ a、b 都是 g 的倍数</text>
  <text x="260" y="259" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">⇒ P(g) :=「gcd 为 g 的倍数」的对数 = C(m(g), 2)，其中 m(g) = 值为 g 的倍数的元素个数</text>

  <!-- 倒序容斥 -->
  <rect x="26" y="282" width="468" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="301" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">倒序容斥：E[g] = P(g) − Σ (k≥2) E[k·g]，g 从大到小算</text>
  <text x="260" y="319" text-anchor="middle" font-size="9.5" fill="#7a5a20" filter="url(#rough2)">P(g) 数的是 gcd ∈ {g, 2g, 3g, …} 的所有对，减去 gcd 恰为 2g、3g… 的，剩下的才是「恰为 g」</text>
  <text x="260" y="337" text-anchor="middle" font-size="9.5" fill="#7a5a20" filter="url(#rough2)">例 [4,4,2,1]：E[4]=P(4)=1 → E[2]=P(2)−E[4]=3−1=2 → E[1]=P(1)−E[2]−E[3]−E[4]=6−3=3</text>
</svg>
