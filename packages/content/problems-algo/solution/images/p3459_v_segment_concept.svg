<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">核心观察：值定相位 + 顺时针方向环 → 四元组记忆化</text>

  <!-- Left: example grid -->
  <text x="36" y="50" font-size="12" fill="#333" filter="url(#rough2)">示例 1：V 形段，值序列 1, 2, 0, 2, 0</text>

  <!-- V route under cells -->
  <path d="M 116 72 L 148 104 L 180 136 L 148 168 L 116 200" fill="none" stroke="#4a7a3a"
        stroke-width="4" opacity="0.32" stroke-linecap="round" stroke-linejoin="round" filter="url(#rough2)"/>
  <!-- direction arrows along route -->
  <path d="M 128 84 L 138 94" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 160 116 L 170 126" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 170 148 L 160 158" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 138 180 L 128 190" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- row 0 -->
  <rect x="36" y="56" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="77" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="68" y="56" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="84" y="77" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="100" y="56" width="32" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="116" y="77" text-anchor="middle" font-size="13" fill="#2d5523" filter="url(#rough2)">1</text>
  <rect x="132" y="56" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="148" y="77" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="164" y="56" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="77" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>

  <!-- row 1 -->
  <rect x="36" y="88" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="109" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="68" y="88" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="84" y="109" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="100" y="88" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="116" y="109" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="132" y="88" width="32" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="148" y="109" text-anchor="middle" font-size="13" fill="#2d5523" filter="url(#rough2)">2</text>
  <rect x="164" y="88" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="109" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>

  <!-- row 2 -->
  <rect x="36" y="120" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="141" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="68" y="120" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="84" y="141" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="100" y="120" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="116" y="141" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="132" y="120" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="148" y="141" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="164" y="120" width="32" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="180" y="141" text-anchor="middle" font-size="13" fill="#7a5a18" filter="url(#rough2)">0</text>

  <!-- row 3 -->
  <rect x="36" y="152" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="173" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="68" y="152" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="84" y="173" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="100" y="152" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="116" y="173" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="132" y="152" width="32" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="148" y="173" text-anchor="middle" font-size="13" fill="#2d5523" filter="url(#rough2)">2</text>
  <rect x="164" y="152" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="173" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>

  <!-- row 4 -->
  <rect x="36" y="184" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="205" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="68" y="184" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="84" y="205" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="100" y="184" width="32" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="116" y="205" text-anchor="middle" font-size="13" fill="#2d5523" filter="url(#rough2)">0</text>
  <rect x="132" y="184" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="148" y="205" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="164" y="184" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="205" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>

  <!-- start / turn annotations -->
  <text x="112" y="66" font-size="9.5" fill="#2d5523" filter="url(#rough2)">起</text>
  <text x="202" y="128" font-size="9.5" fill="#b07516" filter="url(#rough2)">拐点：</text>
  <text x="202" y="140" font-size="9.5" fill="#b07516" filter="url(#rough2)">顺时针转向</text>
  <path d="M 196 136 L 200 136" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- legend under grid -->
  <rect x="36" y="226" width="14" height="11" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="55" y="235" font-size="9.5" fill="#555" filter="url(#rough2)">V 形段格子（长度 5）</text>
  <rect x="36" y="246" width="14" height="11" rx="2" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="55" y="255" font-size="9.5" fill="#555" filter="url(#rough2)">拐点：顺时针 90°，最多一次</text>

  <!-- Right: clockwise direction ring -->
  <text x="390" y="50" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">方向按顺时针编号，转向 = +1</text>

  <rect x="395" y="64" width="62" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="426" y="84" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">↗ d=0</text>

  <rect x="395" y="144" width="62" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="426" y="164" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">↘ d=1</text>

  <rect x="303" y="144" width="62" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="334" y="164" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">↙ d=2</text>

  <rect x="303" y="64" width="62" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="334" y="84" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">↖ d=3</text>

  <!-- clockwise arrows -->
  <path d="M 426 94 L 426 142" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 395 159 L 367 159" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 334 144 L 334 96" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 365 79 L 393 79" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="116" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">顺时针转向</text>
  <text x="380" y="130" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">d → (d+1)%4</text>

  <!-- state box -->
  <rect x="280" y="196" width="215" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="387" y="215" text-anchor="middle" font-size="11" fill="#2d5523" filter="url(#rough2)">状态：dfs(r, c, d, turned)</text>
  <text x="387" y="232" text-anchor="middle" font-size="9.5" fill="#2d5523" filter="url(#rough2)">= 从 (r,c) 沿方向 d 还能延伸的格数</text>
  <text x="387" y="249" text-anchor="middle" font-size="9.5" fill="#2d5523" filter="url(#rough2)">turned：转向预算（0/1）</text>

  <!-- phase note -->
  <text x="280" y="272" font-size="10" fill="#7a4a2b" filter="url(#rough2)">值定相位（省掉步数维）：</text>
  <text x="280" y="287" font-size="10" fill="#7a4a2b" filter="url(#rough2)">v = 2 ⇒ 下一格要 0</text>
  <text x="280" y="302" font-size="10" fill="#7a4a2b" filter="url(#rough2)">v ∈ {0, 1} ⇒ 下一格要 2</text>

  <!-- bottom note -->
  <rect x="25" y="316" width="470" height="52" fill="#f5f0e6" stroke="#b85450" stroke-width="1" stroke-dasharray="5 3" rx="8" filter="url(#rough2)"/>
  <text x="260" y="336" text-anchor="middle" font-size="10.5" fill="#7a4a2b" filter="url(#rough2)">转移：直走匹配 1+dfs(同方向) ∨ 顺时针转向匹配 1+dfs(新方向, 1)（仅一次）</text>
  <text x="260" y="356" text-anchor="middle" font-size="10.5" fill="#7a4a2b" filter="url(#rough2)">答案：max over grid[i][j]=1, d of ( 1 + dfs(i, j, d, 0) )，状态共 8nm 个</text>
</svg>
