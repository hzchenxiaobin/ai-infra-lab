<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="470" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums=[5,−7,3,5], goal=6 → 答案 0</text>

  <!-- Split -->
  <text x="40" y="58" font-size="11" fill="#888">拆分 mid=2</text>
  <rect x="120" y="46" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="135" y="64" font-size="10" fill="#446688" font-weight="bold">L:</text>
  <rect x="150" y="46" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="164" y="64" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>

  <rect x="182" y="46" width="28" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="196" y="64" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">-7</text>

  <rect x="300" y="46" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="316" y="64" font-size="10" fill="#b85450" font-weight="bold">R:</text>
  <rect x="330" y="46" width="28" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="344" y="64" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>

  <rect x="362" y="46" width="28" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="376" y="64" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>

  <!-- LS table -->
  <text x="40" y="104" font-size="11" fill="#446688" font-weight="bold">左子集和 LS</text>
  <rect x="120" y="88" width="200" height="110" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="134" y="108" font-size="10" fill="#888">mask</text>
  <text x="190" y="108" font-size="10" fill="#888">选</text>
  <text x="280" y="108" font-size="10" fill="#888">sum</text>
  <line x1="130" y1="114" x2="310" y2="114" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="134" y="130" font-size="10" fill="#333">00</text>
  <text x="190" y="130" font-size="10" fill="#333">{ }</text>
  <text x="290" y="130" font-size="10" fill="#333" text-anchor="end">0</text>

  <text x="134" y="148" font-size="10" fill="#333">01</text>
  <text x="190" y="148" font-size="10" fill="#333">{5}</text>
  <text x="290" y="148" font-size="10" fill="#333" text-anchor="end">5</text>

  <text x="134" y="166" font-size="10" fill="#333">10</text>
  <text x="190" y="166" font-size="10" fill="#333">{-7}</text>
  <text x="290" y="166" font-size="10" fill="#333" text-anchor="end">-7</text>

  <text x="134" y="184" font-size="10" fill="#333">11</text>
  <text x="190" y="184" font-size="10" fill="#333">{5,-7}</text>
  <text x="290" y="184" font-size="10" fill="#333" text-anchor="end">-2</text>

  <!-- RS table sorted -->
  <text x="370" y="104" font-size="11" fill="#b85450" font-weight="bold">右子集和 RS（排序后）</text>
  <rect x="370" y="88" width="220" height="110" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="384" y="108" font-size="10" fill="#888">mask</text>
  <text x="440" y="108" font-size="10" fill="#888">选</text>
  <text x="560" y="108" font-size="10" fill="#888">sum</text>
  <line x1="380" y1="114" x2="580" y2="114" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="384" y="130" font-size="10" fill="#333">00</text>
  <text x="440" y="130" font-size="10" fill="#333">{ }</text>
  <text x="570" y="130" font-size="10" fill="#333" text-anchor="end">0</text>

  <text x="384" y="148" font-size="10" fill="#333">01</text>
  <text x="440" y="148" font-size="10" fill="#333">{3}</text>
  <text x="570" y="148" font-size="10" fill="#333" text-anchor="end">3</text>

  <text x="384" y="166" font-size="10" fill="#333">10</text>
  <text x="440" y="166" font-size="10" fill="#333">{5}</text>
  <text x="570" y="166" font-size="10" fill="#333" text-anchor="end">5</text>

  <text x="384" y="184" font-size="10" fill="#333">11</text>
  <text x="440" y="184" font-size="10" fill="#333">{3,5}</text>
  <text x="570" y="184" font-size="10" fill="#333" text-anchor="end">8</text>

  <!-- meet process -->
  <text x="40" y="226" font-size="11" fill="#4a7a3a" font-weight="bold">遍历 LS，二分 RS 找最接近 target=6−LS[i] 的值</text>

  <!-- process table -->
  <rect x="40" y="238" width="540" height="160" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>

  <text x="58" y="258" font-size="10" fill="#888">LS[i]</text>
  <text x="120" y="258" font-size="10" fill="#888">target=6−LS[i]</text>
  <text x="240" y="258" font-size="10" fill="#888">lower_bound(RS,target)</text>
  <text x="380" y="258" font-size="10" fill="#888">候选 RS[j]</text>
  <text x="480" y="258" font-size="10" fill="#888">|LS+RS−6|</text>
  <line x1="50" y1="264" x2="572" y2="264" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="58" y="282" font-size="10" fill="#333">0</text>
  <text x="120" y="282" font-size="10" fill="#333">6</text>
  <text x="240" y="282" font-size="10" fill="#333">指向末尾(无≥6)</text>
  <text x="380" y="282" font-size="10" fill="#333">RS[3]=8</text>
  <text x="480" y="282" font-size="10" fill="#333">|0+8−6|=2</text>

  <text x="58" y="304" font-size="10" fill="#333">5</text>
  <text x="120" y="304" font-size="10" fill="#333">1</text>
  <text x="240" y="304" font-size="10" fill="#333">指向 RS[1]=3</text>
  <text x="380" y="304" font-size="10" fill="#333">RS[0]=0 / RS[1]=3</text>
  <text x="480" y="304" font-size="10" fill="#333">|5+0−6|=1 ✓</text>

  <text x="58" y="326" font-size="10" fill="#333">-7</text>
  <text x="120" y="326" font-size="10" fill="#333">13</text>
  <text x="240" y="326" font-size="10" fill="#333">指向末尾(无≥13)</text>
  <text x="380" y="326" font-size="10" fill="#333">RS[3]=8</text>
  <text x="480" y="326" font-size="10" fill="#333">|-7+8−6|=5</text>

  <text x="58" y="348" font-size="10" fill="#d6a040" font-weight="bold">-2</text>
  <text x="120" y="348" font-size="10" fill="#d6a040" font-weight="bold">8</text>
  <text x="240" y="348" font-size="10" fill="#d6a040" font-weight="bold">指向 RS[3]=8</text>
  <text x="380" y="348" font-size="10" fill="#d6a040" font-weight="bold">RS[3]=8 (命中)</text>
  <text x="480" y="348" font-size="10" fill="#b85450" font-weight="bold">|-2+8−6|=0 ★</text>

  <line x1="50" y1="358" x2="572" y2="358" stroke="#888" stroke-width="0.8" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="58" y="378" font-size="10" fill="#4a7a3a" font-weight="bold">ans</text>
  <text x="480" y="378" font-size="10" fill="#b85450" font-weight="bold">min = 0</text>

  <!-- conclusion -->
  <rect x="120" y="418" width="380" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="310" y="436" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">LS={5,-7}→-2 与 RS={3,5}→8 配对</text>
  <text x="310" y="452" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">-2 + 8 = 6 = goal，绝对差 0</text>
</svg>
