<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一次遍历递推求最大值</text>

  <!-- Start -->
  <ellipse cx="270" cy="64" rx="130" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="68" text-anchor="middle" font-size="12" fill="#333">开始：Σ = Σnums[i]，F = Σ i·nums[i]，ans = F</text>

  <path d="M 270 86 L 270 108" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: k < n ? -->
  <polygon points="270,112 410,160 270,208 130,160" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="164" text-anchor="middle" font-size="12" fill="#333">k &lt; n ?</text>

  <!-- No branch -> return ans -->
  <path d="M 410 160 L 470 160" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="152" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="492" cy="160" rx="44" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="492" y="156" text-anchor="middle" font-size="11" fill="#333">返回</text>
  <text x="492" y="170" text-anchor="middle" font-size="11" fill="#333">ans</text>

  <!-- Yes branch down -->
  <path d="M 270 208 L 270 230" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="226" font-size="11" fill="#82b366">是</text>

  <!-- Step box: F = F + sum - n*nums[n-k] -->
  <rect x="80" y="234" width="380" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="256" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">F = F + Σ − n · nums[n−k]</text>
  <text x="270" y="276" text-anchor="middle" font-size="10.5" fill="#555">nums[n−k] = 本次从尾移到首的元素</text>

  <path d="M 270 290 L 270 310" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step box: ans = max(ans, F); k++ -->
  <rect x="120" y="314" width="300" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="336" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans = max(ans, F)；k++</text>
  <text x="270" y="352" text-anchor="middle" font-size="10.5" fill="#555">回到判定</text>

  <!-- loop back arrow -->
  <path d="M 120 338 L 60 338 L 60 160 L 130 160" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="60" y="250" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 60 250)">继续循环</text>

  <!-- summary -->
  <text x="270" y="394" text-anchor="middle" font-size="11" fill="#888">预处理 O(n) + 递推 n−1 步每步 O(1)，合计 O(n)</text>
</svg>
