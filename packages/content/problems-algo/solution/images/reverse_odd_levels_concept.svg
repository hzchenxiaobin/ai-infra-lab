<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心：只翻转「奇数层」的值，树结构（指针）纹丝不动</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">完美二叉树 → 每层节点数 = 2^depth，对奇数层做整体反转</text>

  <!-- ===== Tree (before) ===== -->
  <text x="40" y="76" font-size="11" fill="#446688" font-weight="bold">反转前（奇数层橙色，偶数层蓝色）</text>

  <g font-size="11">
    <!-- edges (drawn first, behind nodes) -->
    <line x1="270" y1="100" x2="162" y2="170" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <line x1="270" y1="100" x2="378" y2="170" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <line x1="162" y1="170" x2="108" y2="240" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <line x1="162" y1="170" x2="216" y2="240" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <line x1="378" y1="170" x2="324" y2="240" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <line x1="378" y1="170" x2="432" y2="240" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <!-- level 3 edges -->
    <line x1="108" y1="240" x2="81" y2="318" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <line x1="108" y1="240" x2="135" y2="318" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <line x1="216" y1="240" x2="189" y2="318" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <line x1="216" y1="240" x2="243" y2="318" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <line x1="324" y1="240" x2="297" y2="318" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <line x1="324" y1="240" x2="351" y2="318" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <line x1="432" y1="240" x2="405" y2="318" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <line x1="432" y1="240" x2="459" y2="318" stroke="#888" stroke-width="1" filter="url(#rough2)"/>

    <!-- L0 root (even, stay) -->
    <circle cx="270" cy="92" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
    <text x="270" y="97" text-anchor="middle" fill="#446688" font-weight="bold">0</text>

    <!-- L1 (odd, reverse) -->
    <circle cx="162" cy="170" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="162" y="175" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <circle cx="378" cy="170" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="378" y="175" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
    <!-- L1 reverse arc -->
    <path d="M 148 168 Q 270 142 392 168" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 392 172 Q 270 158 148 172" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- L2 (even, stay) -->
    <circle cx="108" cy="240" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="108" y="245" text-anchor="middle" fill="#446688" font-size="10">0</text>
    <circle cx="216" cy="240" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="216" y="245" text-anchor="middle" fill="#446688" font-size="10">0</text>
    <circle cx="324" cy="240" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="324" y="245" text-anchor="middle" fill="#446688" font-size="10">0</text>
    <circle cx="432" cy="240" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="432" y="245" text-anchor="middle" fill="#446688" font-size="10">0</text>

    <!-- L3 (odd, reverse) 8 nodes 1,1,1,1,2,2,2,2 -->
    <circle cx="81" cy="318" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="81" y="322" text-anchor="middle" fill="#d6a040" font-size="9">1</text>
    <circle cx="135" cy="318" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="135" y="322" text-anchor="middle" fill="#d6a040" font-size="9">1</text>
    <circle cx="189" cy="318" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="189" y="322" text-anchor="middle" fill="#d6a040" font-size="9">1</text>
    <circle cx="243" cy="318" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="243" y="322" text-anchor="middle" fill="#d6a040" font-size="9">1</text>
    <circle cx="297" cy="318" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="297" y="322" text-anchor="middle" fill="#b85450" font-size="9">2</text>
    <circle cx="351" cy="318" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="351" y="322" text-anchor="middle" fill="#b85450" font-size="9">2</text>
    <circle cx="405" cy="318" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="405" y="322" text-anchor="middle" fill="#b85450" font-size="9">2</text>
    <circle cx="459" cy="318" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="459" y="322" text-anchor="middle" fill="#b85450" font-size="9">2</text>
    <!-- L3 reverse arc (outer pair) -->
    <path d="M 70 316 Q 270 292 470 316" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 470 320 Q 270 306 70 320" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- layer labels -->
    <text x="22" y="97" font-size="9" fill="#446688" font-weight="bold">L0</text>
    <text x="22" y="175" font-size="9" fill="#d6a040" font-weight="bold">L1*</text>
    <text x="22" y="245" font-size="9" fill="#446688" font-weight="bold">L2</text>
    <text x="22" y="322" font-size="9" fill="#d6a040" font-weight="bold">L3*</text>
  </g>

  <!-- ===== Per-level array reversal panel ===== -->
  <g font-size="10">
    <text x="478" y="76" font-size="11" fill="#444" font-weight="bold">逐层值数组</text>
    <!-- L1 -->
    <rect x="452" y="86" width="84" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="494" y="103" text-anchor="middle" fill="#d6a040">L1*: [1,2]→[2,1]</text>
    <!-- L2 -->
    <rect x="452" y="118" width="84" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="494" y="135" text-anchor="middle" fill="#446688">L2:  不动</text>
    <!-- L3 -->
    <rect x="436" y="150" width="100" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="486" y="167" text-anchor="middle" fill="#b85450" font-size="9">L3*: 1,1,1,1,2,2,2,2</text>
    <text x="486" y="180" text-anchor="middle" fill="#b85450" font-size="9"> → 2,2,2,2,1,1,1,1</text>
  </g>

  <!-- ===== bottom note ===== -->
  <rect x="30" y="350" width="480" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="270" y="368" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">反转 = 对称配对交换：第 i 个 ↔ 第 n−1−i 个，共 ⌊n/2⌋ 次交换</text>
  <text x="270" y="382" text-anchor="middle" font-size="9" fill="#555">只改 val，不动 left/right 指针；偶数层（含根）完全跳过</text>
</svg>
