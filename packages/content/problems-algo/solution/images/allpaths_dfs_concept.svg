<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrGy" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：DAG 中枚举 0 → n−1 的所有路径</text>

  <!-- ===== graph nodes ===== -->
  <!-- 0 (source, blue) -->
  <circle cx="92" cy="180" r="26" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="92" y="186" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">0</text>
  <text x="92" y="148" text-anchor="middle" font-size="10" fill="#446688">起点</text>

  <!-- 1 (top middle, blue path) -->
  <circle cx="260" cy="104" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="110" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>

  <!-- 2 (bottom middle, green path) -->
  <circle cx="260" cy="256" r="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="262" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>

  <!-- 3 (target, red) -->
  <circle cx="428" cy="180" r="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="428" y="186" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">3</text>
  <text x="428" y="148" text-anchor="middle" font-size="10" fill="#b85450">终点 n−1</text>

  <!-- ===== edges ===== -->
  <!-- 0 -> 1 (blue, path A) -->
  <path d="M 116 168 L 236 112" stroke="#446688" stroke-width="2.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <!-- 0 -> 2 (green, path B) -->
  <path d="M 116 192 L 236 248" stroke="#4a7a3a" stroke-width="2.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- 1 -> 3 (blue, path A) -->
  <path d="M 284 112 L 404 168" stroke="#446688" stroke-width="2.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <!-- 2 -> 3 (green, path B) -->
  <path d="M 284 248 L 404 192" stroke="#4a7a3a" stroke-width="2.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== path labels ===== -->
  <text x="172" y="132" text-anchor="middle" font-size="10.5" fill="#446688">边 0→1</text>
  <text x="172" y="236" text-anchor="middle" font-size="10.5" fill="#4a7a3a">边 0→2</text>
  <text x="346" y="132" text-anchor="middle" font-size="10.5" fill="#446688">边 1→3</text>
  <text x="346" y="236" text-anchor="middle" font-size="10.5" fill="#4a7a3a">边 2→3</text>

  <!-- ===== two paths callout ===== -->
  <rect x="40" y="300" width="440" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="320" text-anchor="middle" font-size="11.5" fill="#333">
    路径 A（蓝）：<tspan fill="#446688" font-weight="bold">0 → 1 → 3</tspan>　　路径 B（绿）：<tspan fill="#4a7a3a" font-weight="bold">0 → 2 → 3</tspan>
  </text>
  <text x="260" y="338" text-anchor="middle" font-size="11" fill="#666">从起点 DFS，沿邻接表递归到底，记录每条到达终点的完整路径</text>
</svg>
