<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>

  <line x1="280" y1="10" x2="280" y2="322" stroke="#d8d8d8" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== allocate (left) ===== -->
  <text x="140" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">allocate(size, mID)</text>

  <rect x="54" y="38" width="84" height="22" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="96" y="54" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">run = 0</text>
  <path d="M 96 60 L 96 72" fill="none" stroke="#555" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="72" width="112" height="22" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="96" y="88" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">for i ← 0 … n−1  ↻</text>
  <path d="M 96 94 L 96 106" fill="none" stroke="#555" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="96,106 152,130 96,154 40,130" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="96" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">mem[i]==0?</text>
  <path d="M 152 130 L 174 130" fill="none" stroke="#b85450" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="163" y="124" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗</text>
  <rect x="174" y="118" width="96" height="24" rx="5" fill="#f5f5f5" stroke="#a8a8a8" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="222" y="134" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">↻ run=0，续下一轮</text>
  <path d="M 96 154 L 96 166" fill="none" stroke="#555" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="108" y="162" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <rect x="50" y="166" width="92" height="22" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="96" y="182" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">run = run + 1</text>
  <path d="M 96 188 L 96 200" fill="none" stroke="#555" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="96,200 156,224 96,248 36,224" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="96" y="228" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">run==size?</text>
  <path d="M 156 224 L 174 224" fill="none" stroke="#4a7a3a" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="165" y="218" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <rect x="174" y="212" width="104" height="24" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="226" y="228" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">写 mID；返回 i−size+1</text>
  <path d="M 96 248 L 96 260" fill="none" stroke="#555" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="108" y="258" font-size="10" fill="#b85450" filter="url(#rough2)">✗</text>

  <rect x="50" y="260" width="92" height="22" rx="5" fill="#f5f5f5" stroke="#a8a8a8" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="96" y="276" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">↻ 续下一轮</text>
  <path d="M 96 282 L 96 294" fill="none" stroke="#555" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="38" y="294" width="116" height="24" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="96" y="310" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">（i 走完 n）return −1</text>

  <!-- ===== freeMemory (right) ===== -->
  <text x="420" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">freeMemory(mID)</text>

  <rect x="338" y="38" width="84" height="22" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="54" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">cnt = 0</text>
  <path d="M 380 60 L 380 72" fill="none" stroke="#555" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="324" y="72" width="112" height="22" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="88" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">for i ← 0 … n−1  ↻</text>
  <path d="M 380 94 L 380 106" fill="none" stroke="#555" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="380,106 446,130 380,154 314,130" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">mem[i]==mID?</text>
  <path d="M 446 130 L 468 130" fill="none" stroke="#b85450" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="457" y="124" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗</text>
  <rect x="468" y="118" width="74" height="24" rx="5" fill="#f5f5f5" stroke="#a8a8a8" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="505" y="134" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">↻ 跳过</text>
  <path d="M 380 154 L 380 166" fill="none" stroke="#555" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="162" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <rect x="322" y="166" width="116" height="24" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="182" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">mem[i] = 0; cnt++</text>
  <path d="M 380 190 L 380 202" fill="none" stroke="#555" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="334" y="202" width="92" height="22" rx="5" fill="#f5f5f5" stroke="#a8a8a8" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="380" y="218" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">↻ 续下一轮</text>
  <path d="M 380 224 L 380 236" fill="none" stroke="#555" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="322" y="236" width="116" height="24" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="252" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">（i 走完 n）return cnt</text>

  <text x="420" y="288" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">两方法各一趟扫描，O(n) / 次</text>
  <text x="420" y="304" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">多次同 mID 块一并释放</text>
</svg>
