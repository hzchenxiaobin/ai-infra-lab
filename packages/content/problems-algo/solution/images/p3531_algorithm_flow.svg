<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b5" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：建表一遍 + 判定一遍</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">同 x 组的 y 极值管左右；同 y 组的 x 极值管上下</text>

  <!-- 开始 -->
  <rect x="195" y="52" width="130" height="24" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="68" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">开始：n, buildings</text>
  <path d="M 260 76 L 260 86" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="110" y="86" width="300" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="104" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">初始化：rowMin/colMin ← +∞，rowMax/colMax ← −∞</text>
  <text x="260" y="119" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">长度 n+1 的数组，坐标即下标（坐标无界时换哈希表）</text>
  <path d="M 260 126 L 260 136" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 第一遍扫描 -->
  <rect x="92" y="136" width="336" height="58" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="154" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">① 第一遍扫描：对每栋 (x, y) 更新极值</text>
  <text x="260" y="170" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">rowMin[x] ← min(rowMin[x], y)　rowMax[x] ← max(rowMax[x], y)</text>
  <text x="260" y="185" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">colMin[y] ← min(colMin[y], x)　colMax[y] ← max(colMax[y], x)</text>
  <path d="M 260 194 L 260 204" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 第二遍循环（虚线框） -->
  <rect x="108" y="198" width="392" height="114" rx="12" fill="none" stroke="#9aa7b5" stroke-width="1.4" stroke-dasharray="6 5" filter="url(#rough2)"/>
  <text x="492" y="212" text-anchor="end" font-size="9.5" fill="#888" filter="url(#rough2)">对每栋 (x, y) 循环</text>

  <rect x="130" y="208" width="260" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="225" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">② 第二遍扫描：逐栋夹逼判定</text>
  <path d="M 260 234 L 260 246" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="260,246 388,276 260,306 132,276" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="272" text-anchor="middle" font-size="10.5" fill="#8a6d3a" filter="url(#rough2)">rowMin[x] &lt; y &lt; rowMax[x]</text>
  <text x="260" y="288" text-anchor="middle" font-size="10.5" fill="#8a6d3a" filter="url(#rough2)">且 colMin[y] &lt; x &lt; colMax[y] ？</text>

  <!-- 是 → ans++ -->
  <path d="M 388 276 L 414 276" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="400" y="269" text-anchor="middle" font-size="10" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">是</text>
  <rect x="414" y="262" width="74" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="451" y="281" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">ans++</text>

  <!-- 否 → 跳过 -->
  <path d="M 260 306 L 260 322" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="272" y="318" font-size="10" fill="#b85450" filter="url(#rough2)">否（跳过）</text>

  <!-- ans++ → 返回 -->
  <path d="M 451 290 C 451 322, 410 340, 356 340" fill="none" stroke="#9aa7b5" stroke-width="1.6" marker-end="url(#arrn)" filter="url(#rough2)"/>

  <!-- 返回 -->
  <rect x="170" y="326" width="180" height="28" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="344" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">返回 ans（被覆盖数）</text>
</svg>
