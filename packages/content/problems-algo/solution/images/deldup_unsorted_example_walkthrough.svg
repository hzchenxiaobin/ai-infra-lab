    <rect x="168" y="194" width="40" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="188" y="213" text-anchor="middle" fill="#888">2</text>
    <rect x="216" y="194" width="40" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="236" y="213" text-anchor="middle" fill="#888">1</text>
    <rect x="264" y="194" width="40" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="284" y="213" text-anchor="middle" fill="#888">3</text>
    <rect x="312" y="194" width="40" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="332" y="213" text-anchor="middle" fill="#888">2</text>
  </g>
  <text x="42" y="182" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">prev</text>
  <text x="188" y="182" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">curr</text>
  <path d="M 64 208 Q 126 176 168 208" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- ===== 步骤3: curr=2 freq[2]=3>1 删除 ===== -->
  <text x="20" y="242" font-size="11" fill="#b85450" font-weight="bold">步骤3：curr=2，freq[2]=3&gt;1 → 删除，prev.next→1，prev 不动</text>
  <rect x="20" y="250" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="42" y="269" text-anchor="middle" fill="#8a6a20" font-size="9" font-weight="bold">dummy</text>
  <g font-size="12">
    <rect x="72" y="250" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="92" y="269" text-anchor="middle" fill="#ddd" font-weight="bold" text-decoration="line-through">3</text>
    <rect x="120" y="250" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="140" y="269" text-anchor="middle" fill="#ddd" font-weight="bold" text-decoration="line-through">2</text>
    <rect x="168" y="250" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="188" y="269" text-anchor="middle" fill="#bbb" font-weight="bold" text-decoration="line-through">2</text>
    <rect x="216" y="250" width="40" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
