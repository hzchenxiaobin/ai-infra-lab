<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 640" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="640" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：3→2→2→1→3→2 逐步过滤</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">蓝=prev，红=curr，灰框删除线=已移除，绿=保留</text>

  <!-- ===== 步骤0: 计数 ===== -->
  <text x="20" y="72" font-size="11" fill="#446688" font-weight="bold">步骤0：第一趟计数 → freq = {3:2, 2:3, 1:1}</text>
  <rect x="20" y="80" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="42" y="99" text-anchor="middle" fill="#8a6a20" font-size="9" font-weight="bold">dummy</text>
  <g font-size="12">
    <rect x="72" y="80" width="40" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="92" y="99" text-anchor="middle" fill="#888">3</text>
    <rect x="120" y="80" width="40" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="140" y="99" text-anchor="middle" fill="#888">2</text>
    <rect x="168" y="80" width="40" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="188" y="99" text-anchor="middle" fill="#888">2</text>
    <rect x="216" y="80" width="40" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="236" y="99" text-anchor="middle" fill="#888">1</text>
    <rect x="264" y="80" width="40" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="284" y="99" text-anchor="middle" fill="#888">3</text>
    <rect x="312" y="80" width="40" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="332" y="99" text-anchor="middle" fill="#888">2</text>
  </g>
  <text x="362" y="99" font-size="10" fill="#888">→∅</text>
  <text x="42" y="68" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">prev</text>
  <text x="92" y="68" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">curr</text>

  <!-- ===== 步骤1: curr=3 freq[3]=2>1 删除 ===== -->
  <text x="20" y="130" font-size="11" fill="#b85450" font-weight="bold">步骤1：curr=3，freq[3]=2&gt;1 → 删除，prev.next→2，prev 不动</text>
  <rect x="20" y="138" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="42" y="157" text-anchor="middle" fill="#8a6a20" font-size="9" font-weight="bold">dummy</text>
  <g font-size="12">
    <rect x="72" y="138" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="92" y="157" text-anchor="middle" fill="#bbb" font-weight="bold" text-decoration="line-through">3</text>
    <rect x="120" y="138" width="40" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="140" y="157" text-anchor="middle" fill="#888">2</text>
    <rect x="168" y="138" width="40" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="188" y="157" text-anchor="middle" fill="#888">2</text>
    <rect x="216" y="138" width="40" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="236" y="157" text-anchor="middle" fill="#888">1</text>
    <rect x="264" y="138" width="40" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="284" y="157" text-anchor="middle" fill="#888">3</text>
    <rect x="312" y="138" width="40" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="332" y="157" text-anchor="middle" fill="#888">2</text>
  </g>
  <text x="42" y="126" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">prev</text>
  <text x="140" y="126" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">curr</text>
  <path d="M 64 152 Q 100 120 120 152" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- ===== 步骤2: curr=2 freq[2]=3>1 删除 ===== -->
  <text x="20" y="186" font-size="11" fill="#b85450" font-weight="bold">步骤2：curr=2，freq[2]=3&gt;1 → 删除，prev.next→2，prev 不动</text>
  <rect x="20" y="194" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="42" y="213" text-anchor="middle" fill="#8a6a20" font-size="9" font-weight="bold">dummy</text>
  <g font-size="12">
    <rect x="72" y="194" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="92" y="213" text-anchor="middle" fill="#ddd" font-weight="bold" text-decoration="line-through">3</text>
