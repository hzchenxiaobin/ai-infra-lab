  <path d="M 256 376 Q 294 344 312 376" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- ===== 步骤6: curr=2 freq[2]=3>1 删除 ===== -->
  <text x="20" y="410" font-size="11" fill="#b85450" font-weight="bold">步骤6：curr=2，freq[2]=3&gt;1 → 删除，prev.next→null，prev 不动</text>
  <rect x="20" y="418" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="42" y="437" text-anchor="middle" fill="#8a6a20" font-size="9" font-weight="bold">dummy</text>
  <g font-size="12">
    <rect x="72" y="418" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="92" y="437" text-anchor="middle" fill="#ddd" font-weight="bold" text-decoration="line-through">3</text>
