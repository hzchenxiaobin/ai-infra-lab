    <rect x="312" y="250" width="40" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="332" y="269" text-anchor="middle" fill="#888">2</text>
  </g>
  <text x="42" y="238" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">prev</text>
  <text x="236" y="238" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">curr</text>
  <path d="M 64 264 Q 150 232 216 264" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- ===== 步骤4: curr=1 freq[1]=1 保留 ===== -->
  <text x="20" y="298" font-size="11" fill="#4a7a3a" font-weight="bold">步骤4：curr=1，freq[1]=1 → 保留！prev→1，curr→3</text>
  <rect x="20" y="306" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="42" y="325" text-anchor="middle" fill="#8a6a20" font-size="9" font-weight="bold">dummy</text>
  <g font-size="12">
    <rect x="72" y="306" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="92" y="325" text-anchor="middle" fill="#ddd" font-weight="bold" text-decoration="line-through">3</text>
    <rect x="120" y="306" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="140" y="325" text-anchor="middle" fill="#ddd" font-weight="bold" text-decoration="line-through">2</text>
    <rect x="168" y="306" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="188" y="325" text-anchor="middle" fill="#ddd" font-weight="bold" text-decoration="line-through">2</text>
    <rect x="216" y="306" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="236" y="325" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="264" y="306" width="40" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="284" y="325" text-anchor="middle" fill="#888">3</text>
    <rect x="312" y="306" width="40" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="332" y="325" text-anchor="middle" fill="#888">2</text>
  </g>
  <text x="236" y="294" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">prev</text>
  <text x="284" y="294" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">curr</text>

  <!-- ===== 步骤5: curr=3 freq[3]=2>1 删除 ===== -->
  <text x="20" y="354" font-size="11" fill="#b85450" font-weight="bold">步骤5：curr=3，freq[3]=2&gt;1 → 删除，prev.next→2，prev 不动</text>
  <rect x="20" y="362" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="42" y="381" text-anchor="middle" fill="#8a6a20" font-size="9" font-weight="bold">dummy</text>
  <g font-size="12">
    <rect x="72" y="362" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="92" y="381" text-anchor="middle" fill="#ddd" font-weight="bold" text-decoration="line-through">3</text>
    <rect x="120" y="362" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="140" y="381" text-anchor="middle" fill="#ddd" font-weight="bold" text-decoration="line-through">2</text>
    <rect x="168" y="362" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="188" y="381" text-anchor="middle" fill="#ddd" font-weight="bold" text-decoration="line-through">2</text>
    <rect x="216" y="362" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="236" y="381" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="264" y="362" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="284" y="381" text-anchor="middle" fill="#bbb" font-weight="bold" text-decoration="line-through">3</text>
    <rect x="312" y="362" width="40" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="332" y="381" text-anchor="middle" fill="#888">2</text>
  </g>
  <text x="236" y="350" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">prev</text>
