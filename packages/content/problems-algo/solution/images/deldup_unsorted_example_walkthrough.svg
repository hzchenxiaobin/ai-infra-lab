  <!-- ===== 最终结果 ===== -->
  <rect x="20" y="466" width="540" height="154" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="34" y="488" font-size="12" fill="#4a7a3a" font-weight="bold">最终结果：dummy.next → 1 ✓</text>
  <g font-size="13">
    <rect x="34" y="500" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="56" y="519" text-anchor="middle" fill="#8a6a20" font-size="9" font-weight="bold">dummy</text>
    <rect x="86" y="500" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="106" y="519" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <line x1="78" y1="514" x2="86" y2="514" stroke="#446688" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="140" y="519" font-size="11" fill="#888">→∅</text>
  </g>
  <text x="34" y="548" font-size="10" fill="#555">freq[3]=2、freq[2]=3 均大于 1，所有 3、2 节点被移除</text>
  <text x="34" y="566" font-size="10" fill="#555">freq[1]=1，节点 1 保留 → 结果 [1]</text>
  <text x="34" y="592" font-size="10" fill="#888">对比 82 题（有序）：相邻比较单趟搞定；本题（无序）：必须先计数再过滤</text>
  <text x="34" y="610" font-size="10" fill="#888">两题删除策略相同（freq/相邻 &gt;1 全删，哑节点统一头删），差异在"如何发现重复"</text>
</svg>
