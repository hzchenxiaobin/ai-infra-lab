<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：arr = [1,3,4,8]</text>

  <!-- Part 1: prefix construction -->
  <text x="40" y="50" font-size="12" fill="#4a7a3a" font-weight="bold">① 构建异或前缀数组</text>

  <rect x="10" y="58" width="540" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="50" y="75" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">i</text>
  <text x="120" y="75" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">arr[i]</text>
  <text x="220" y="75" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">prefix[i]</text>
  <text x="340" y="75" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">递推</text>
  <text x="470" y="75" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">prefix[i+1]</text>

  <!-- row i=0 -->
  <rect x="10" y="86" width="540" height="26" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="103" text-anchor="middle" font-size="10.5" fill="#888">0</text>
  <rect x="106" y="90" width="28" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="120" y="103" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">1</text>
  <text x="220" y="103" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="340" y="103" text-anchor="middle" font-size="10" fill="#555">0 ^ 1</text>
  <text x="470" y="103" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>

  <!-- row i=1 -->
  <rect x="10" y="114" width="540" height="26" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="131" text-anchor="middle" font-size="10.5" fill="#888">1</text>
  <rect x="106" y="118" width="28" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="120" y="131" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">3</text>
  <text x="220" y="131" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="340" y="131" text-anchor="middle" font-size="10" fill="#555">1 ^ 3</text>
  <text x="470" y="131" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>

  <!-- row i=2 -->
  <rect x="10" y="142" width="540" height="26" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="159" text-anchor="middle" font-size="10.5" fill="#888">2</text>
  <rect x="106" y="146" width="28" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="120" y="159" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">4</text>
  <text x="220" y="159" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="340" y="159" text-anchor="middle" font-size="10" fill="#555">2 ^ 4</text>
  <text x="470" y="159" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">6</text>

  <!-- row i=3 -->
  <rect x="10" y="170" width="540" height="26" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="50" y="187" text-anchor="middle" font-size="10.5" fill="#888">3</text>
  <rect x="106" y="174" width="28" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="120" y="187" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">8</text>
  <text x="220" y="187" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">6</text>
  <text x="340" y="187" text-anchor="middle" font-size="10" fill="#555">6 ^ 8</text>
  <text x="470" y="187" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">14</text>

  <text x="280" y="212" text-anchor="middle" font-size="10.5" fill="#888">prefix = [0, 1, 2, 6, 14]  （长度 n+1 = 5）</text>

  <!-- Part 2: query answering -->
  <text x="40" y="240" font-size="12" fill="#4a7a3a" font-weight="bold">② 回答每个查询：ans = prefix[R+1] ^ prefix[L]</text>

  <rect x="10" y="248" width="540" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="265" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">查询</text>
  <text x="130" y="265" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">L</text>
  <text x="180" y="265" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">R</text>
  <text x="270" y="265" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">prefix[R+1]</text>
  <text x="380" y="265" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">prefix[L]</text>
  <text x="490" y="265" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">结果</text>

  <!-- q=[0,1] -->
  <rect x="10" y="276" width="540" height="26" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="60" y="293" text-anchor="middle" font-size="10.5" fill="#555">[0,1]</text>
  <text x="130" y="293" text-anchor="middle" font-size="10.5" fill="#888">0</text>
  <text x="180" y="293" text-anchor="middle" font-size="10.5" fill="#888">1</text>
  <text x="270" y="293" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">p[2]=2</text>
  <text x="380" y="293" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">p[0]=0</text>
  <text x="490" y="293" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>

  <!-- q=[1,2] -->
  <rect x="10" y="304" width="540" height="26" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="60" y="321" text-anchor="middle" font-size="10.5" fill="#555">[1,2]</text>
  <text x="130" y="321" text-anchor="middle" font-size="10.5" fill="#888">1</text>
  <text x="180" y="321" text-anchor="middle" font-size="10.5" fill="#888">2</text>
  <text x="270" y="321" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">p[3]=6</text>
  <text x="380" y="321" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">p[1]=1</text>
  <text x="490" y="321" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">7</text>

  <!-- q=[0,3] highlight -->
  <rect x="10" y="332" width="540" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="349" text-anchor="middle" font-size="10.5" fill="#555">[0,3]</text>
  <text x="130" y="349" text-anchor="middle" font-size="10.5" fill="#888">0</text>
  <text x="180" y="349" text-anchor="middle" font-size="10.5" fill="#888">3</text>
  <text x="270" y="349" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">p[4]=14</text>
  <text x="380" y="349" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">p[0]=0</text>
  <text x="490" y="349" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">14</text>

  <!-- q=[3,3] -->
  <rect x="10" y="360" width="540" height="26" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="60" y="377" text-anchor="middle" font-size="10.5" fill="#555">[3,3]</text>
  <text x="130" y="377" text-anchor="middle" font-size="10.5" fill="#888">3</text>
  <text x="180" y="377" text-anchor="middle" font-size="10.5" fill="#888">3</text>
  <text x="270" y="377" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">p[4]=14</text>
  <text x="380" y="377" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">p[3]=6</text>
  <text x="490" y="377" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">8</text>

  <!-- explanation boxes -->
  <rect x="10" y="396" width="260" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="140" y="414" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">L=R 时：prefix[R+1]^prefix[L]</text>
  <text x="140" y="430" text-anchor="middle" font-size="10" fill="#555">= prefix[L+1]^prefix[L] = arr[L]</text>

  <rect x="290" y="396" width="260" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="420" y="414" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">公共前缀自动抵消</text>
  <text x="420" y="430" text-anchor="middle" font-size="10" fill="#555">a ^ a = 0，无需额外处理</text>

  <!-- summary -->
  <rect x="10" y="448" width="540" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="464" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">输出：[2, 7, 14, 8]   每次查询 O(1)，共 O(m)</text>
</svg>
