<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">哈希法示例演算</text>

  <!-- ===== Example A: [3,5,4] -> true ===== -->
  <text x="40" y="62" font-size="13" fill="#4a7a3a" font-weight="bold">A. nums = [3, 5, 4]</text>

  <!-- step row -->
  <rect x="30" y="74" width="500" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="40" y="93" font-size="11" fill="#333">① 一趟扫描：n=3, min=3, max=5, set={3,4,5}</text>

  <path d="M280 106 L280 124" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="30" y="126" width="500" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="40" y="145" font-size="11" fill="#333">② 第一关：max−min = 5−3 = 2，n−1 = 2 → 2 == 2 ✓ 跨度合适</text>

  <path d="M280 158 L280 176" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="30" y="178" width="500" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="40" y="197" font-size="11" fill="#333">③ 第二关：len(set) = 3 == n = 3 ✓ 元素互异</text>

  <path d="M280 210 L280 228" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="190" y="230" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="250" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">两关都过 → true</text>

  <!-- ===== Example B: [1,1,3] -> false ===== -->
  <text x="40" y="300" font-size="13" fill="#b85450" font-weight="bold">B. nums = [1, 1, 3]</text>

  <rect x="30" y="312" width="500" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="40" y="331" font-size="11" fill="#333">① 一趟扫描：n=3, min=1, max=3, set={1,3}</text>

  <path d="M280 344 L280 362" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="30" y="364" width="500" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="40" y="383" font-size="11" fill="#333">② 第一关：max−min = 3−1 = 2，n−1 = 2 → 2 == 2 ✓ 跨度合适（别被它骗了！）</text>

  <path d="M280 396 L280 414" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="30" y="416" width="500" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="40" y="435" font-size="11" fill="#b85450">③ 第二关：len(set) = 2 ≠ n = 3 ✗ 有重复（1 出现两次，2 缺失）→ false</text>
</svg>
