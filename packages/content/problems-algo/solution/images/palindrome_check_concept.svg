<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：奇数次字符数 odd → 需要 ⌊odd/2⌋ 次替换</text>

  <!-- left: rearrange into palindrome -->
  <rect x="30" y="44" width="235" height="150" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="147" y="64" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 重排成「最佳回文骨架」</text>
  <line x1="42" y1="72" x2="254" y2="72" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <text x="42" y="92" font-size="10.5" fill="#444">"abcd" → 统计频次：</text>
  <rect x="42" y="98" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="59" y="114" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a×1</text>
  <rect x="80" y="98" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="97" y="114" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">b×1</text>
  <rect x="118" y="98" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="114" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">c×1</text>
  <rect x="156" y="98" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="173" y="114" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">d×1</text>
  <text x="210" y="114" font-size="10" fill="#b85450" font-weight="bold">odd=4</text>

  <text x="42" y="140" font-size="10.5" fill="#444">重排为两两配对 → 仍剩 4 个奇</text>
  <text x="42" y="158" font-size="10.5" fill="#888">_ _ _ _（无法成回文）</text>
  <text x="42" y="178" font-size="10.5" fill="#b85450" font-weight="bold">需替换：⌊4/2⌋ = 2 次</text>

  <!-- arrow between two boxes -->
  <path d="M 268 120 L 286 120" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- right: replace pairs -->
  <rect x="290" y="44" width="220" height="150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="400" y="64" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 每次替换修两个奇</text>
  <line x1="302" y1="72" x2="498" y2="72" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>

  <text x="300" y="92" font-size="10.5" fill="#444">把 d 改成 a：</text>
  <rect x="300" y="98" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="114" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">d→a</text>
  <text x="350" y="114" font-size="10.5" fill="#4a7a3a">a×2 偶 ✓</text>
  <text x="300" y="138" font-size="10.5" fill="#444">把 c 改成 b：</text>
  <rect x="300" y="144" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="160" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">c→b</text>
  <text x="350" y="160" font-size="10.5" fill="#4a7a3a">b×2 偶 ✓</text>
  <text x="300" y="180" font-size="10.5" fill="#4a7a3a" font-weight="bold">→ "abba" 回文！2 次替换</text>

  <!-- formula box -->
  <rect x="30" y="208" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="230" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">判定公式：need = ⌊odd / 2⌋</text>
  <text x="270" y="250" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">answer = (need &lt;= k)</text>

  <!-- odd=0 / odd=1 cases -->
  <rect x="30" y="276" width="235" height="88" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="147" y="296" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">odd = 0 或 1（已是回文）</text>
  <text x="42" y="316" font-size="10.5" fill="#444">所有字符偶频 → 完美对称</text>
  <text x="42" y="334" font-size="10.5" fill="#444">或仅 1 个奇 → 放中间</text>
  <text x="42" y="352" font-size="10.5" fill="#4a7a3a" font-weight="bold">need = ⌊0/2⌋=0 或 ⌊1/2⌋=0</text>

  <rect x="275" y="276" width="235" height="88" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="392" y="296" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">奇偶性只关心「奇/偶」</text>
  <text x="287" y="316" font-size="10.5" fill="#444">不必存精确频次</text>
  <text x="287" y="334" font-size="10.5" fill="#444">只需 26 位奇偶掩码 → XOR</text>
  <text x="287" y="352" font-size="10.5" fill="#b85450" font-weight="bold">odd = popcount(mask_R ^ mask_L)</text>
</svg>
