<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：年度聚合 → 对齐上一年 → 计算比率 → 排序</text>

  <rect x="110" y="42" width="300" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">user_transactions：n 行交易流水</text>

  <path d="M 260 74 L 260 88" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="92" width="400" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="112" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① 年度聚合：GROUP BY product_id, YEAR(transaction_date)</text>
  <text x="260" y="130" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">SUM(spend) AS curr_year_spend</text>

  <path d="M 260 140 L 260 154" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="158" width="300" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="178" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">年度表 T：产品 × 年，共 m 行（m ≤ n）</text>

  <path d="M 260 190 L 260 204" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="45" y="208" width="430" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="228" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">② 对齐上一年：LEFT JOIN T t2</text>
  <text x="260" y="246" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">ON 同 product_id AND t1.year = t2.year + 1</text>
  <text x="260" y="264" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">（LAG 版：LAG 取「上一行」，须校验 year = prev_year + 1）</text>

  <path d="M 260 272 L 260 286" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="290" width="400" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="310" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ 比率：ROUND((curr − prev) / prev × 100, 2)</text>
  <text x="260" y="328" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">prev 为 NULL（首年/断档）→ 比率自动为 NULL</text>

  <path d="M 260 338 L 260 352" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="356" width="300" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="376" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">④ ORDER BY product_id, year 升序输出</text>

  <text x="260" y="416" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">n = 交易行数；m = 不同 (product_id, year) 组合数，m ≤ n</text>
</svg>
