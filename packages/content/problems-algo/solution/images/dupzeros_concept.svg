<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">
    核心观察：双指针——先数后填
  </text>

  <!-- ===== 第一行：原始数组 + i 读指针（正向数）===== -->
  <text x="36" y="78" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">原始</text>
  <text x="36" y="93" font-size="10" fill="#888" filter="url(#rough2)">arr</text>

  <!-- 原始格子 [1,0,2,3,0,4,5,0] -->
  <rect x="92" y="62" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="112" y="84" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="134" y="62" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="154" y="84" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="176" y="62" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="196" y="84" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="218" y="62" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="238" y="84" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="260" y="62" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="280" y="84" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="302" y="62" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="322" y="84" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="344" y="62" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="364" y="84" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="386" y="62" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="406" y="84" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>

  <!-- i 指针 + 正向箭头 -->
  <text x="112" y="54" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">i→</text>
  <path d="M 96 48 L 420 48" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="440" y="52" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">数</text>

  <!-- 图例：零用红色 -->
  <rect x="448" y="66" width="12" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
  <text x="464" y="76" font-size="10" fill="#555" filter="url(#rough2)">=0</text>

  <!-- ===== 第二行：膨胀后（概念）+ j 写指针 ===== -->
  <text x="36" y="148" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">膨胀</text>
  <text x="36" y="163" font-size="10" fill="#888" filter="url(#rough2)">概念</text>

  <!-- 膨胀后格子：1 0 0 2 3 0 0 4 | 5 0（竖线后丢弃）-->
  <rect x="92" y="132" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="112" y="154" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="134" y="132" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="154" y="154" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="176" y="132" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="196" y="154" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="218" y="132" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="238" y="154" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="260" y="132" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="280" y="154" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="302" y="132" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="322" y="154" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="344" y="132" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="364" y="154" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="386" y="132" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="406" y="154" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- 丢弃区：5, 0 -->
  <rect x="428" y="132" width="40" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,3" rx="4" filter="url(#rough2)"/>
  <text x="448" y="154" text-anchor="middle" font-size="15" fill="#999" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="470" y="132" width="40" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,3" rx="4" filter="url(#rough2)"/>
  <text x="490" y="154" text-anchor="middle" font-size="15" fill="#999" font-weight="bold" filter="url(#rough2)">0</text>

  <!-- 保留/丢弃分界竖线 -->
  <path d="M 426 124 L 426 174" stroke="#b85450" stroke-width="2.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="448" y="120" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">丢弃</text>

  <!-- j 指针 -->
  <text x="112" y="124" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">j→</text>
  <path d="M 96 118 L 412 118" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 保留前 n=8 格 标注 -->
  <text x="249" y="184" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">← 保留前 n 格 →</text>

  <!-- ===== 第三行：从右向左回填 ===== -->
  <text x="36" y="232" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">回填</text>
  <text x="36" y="247" font-size="10" fill="#888" filter="url(#rough2)">反向</text>

  <!-- 结果格子（保留区，倒序写）-->
  <rect x="92" y="216" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="112" y="238" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="134" y="216" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="154" y="238" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="176" y="216" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="196" y="238" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="218" y="216" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="238" y="238" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="260" y="216" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="280" y="238" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="302" y="216" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="322" y="238" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="344" y="216" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="364" y="238" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="386" y="216" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="406" y="238" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- 反向箭头 ← j -->
  <text x="406" y="208" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">←j</text>
  <path d="M 412 202 L 96 202" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="76" y="206" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">填</text>

  <!-- 底部说明框 -->
  <rect x="30" y="278" width="500" height="104" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="302" text-anchor="middle" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">
    第一趟：i、j 正向计数，零让 j 多走一步
  </text>
  <text x="280" y="320" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">
    当 j ≥ n 停止 → arr[i−1] 是最后一个能留存的原始元素
  </text>
  <text x="280" y="340" text-anchor="middle" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">
    第二趟：从右向左回填，j ≥ i 永不覆盖未读数据
  </text>
  <text x="280" y="360" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">
    ⚠️ 边界：j == n 时末位零只能写一份
  </text>
</svg>
