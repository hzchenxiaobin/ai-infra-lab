<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">三重过滤 → 优先级映射 → 双关键字排序</text>

  <!-- 左列：4 张优惠券（示例 1） -->
  <text x="80" y="60" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">n 张优惠券</text>

  <rect x="18" y="72" width="124" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="80" y="91" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">SAVE20</text>
  <text x="80" y="108" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">restaurant · active</text>

  <rect x="18" y="130" width="124" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="80" y="149" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(空串)</text>
  <text x="80" y="166" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">code 为空 ✗</text>

  <rect x="18" y="188" width="124" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="80" y="207" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">PHARMA5</text>
  <text x="80" y="224" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">pharmacy · active</text>

  <rect x="18" y="246" width="124" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="80" y="265" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">SAVE@20</text>
  <text x="80" y="282" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">含 '@' ✗</text>

  <!-- 中间：过滤漏斗 -->
  <path d="M 150 105 C 175 105 175 95 195 95" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 150 211 C 175 211 175 170 195 170" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="200" y="66" width="150" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="275" y="84" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① isActive == true</text>
  <text x="275" y="99" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">未激活直接丢弃</text>

  <path d="M 275 108 L 275 128" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="200" y="132" width="150" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="275" y="150" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② code 字符校验</text>
  <text x="275" y="165" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">非空 ∧ 仅 [A-Za-z0-9_]</text>

  <path d="M 275 174 L 275 194" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="200" y="198" width="150" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="275" y="216" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ 白名单校验</text>
  <text x="275" y="231" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">businessLine ∈ 4 类</text>

  <!-- 幸存者 → rank 表 -->
  <path d="M 350 219 C 375 219 375 130 398 130" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="368" y="252" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">幸存 (rank, code)</text>

  <!-- 右上：哈希优先级表 -->
  <rect x="402" y="62" width="140" height="112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="472" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">rank 哈希表</text>
  <text x="415" y="101" font-size="10" fill="#555" filter="url(#rough2)">electronics → 0</text>
  <text x="415" y="117" font-size="10" fill="#555" filter="url(#rough2)">grocery     → 1</text>
  <text x="415" y="133" font-size="10" fill="#555" filter="url(#rough2)">pharmacy   → 2</text>
  <text x="415" y="149" font-size="10" fill="#555" filter="url(#rough2)">restaurant → 3</text>
  <text x="472" y="167" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">⚠ 类别序 ≠ 字典序(巧合)</text>

  <!-- 排序 + 输出 -->
  <path d="M 472 174 L 472 202" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="396" y="206" width="152" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="472" y="224" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">按 (rank, code) 排序</text>
  <text x="472" y="239" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">类别升序，组内 code 字典序</text>

  <path d="M 472 246 L 472 268" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="396" y="272" width="152" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="472" y="291" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">输出</text>
  <text x="472" y="308" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">["PHARMA5","SAVE20"]</text>

  <!-- 底部注解 -->
  <rect x="200" y="330" width="340" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="370" y="350" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">一次遍历完成过滤与打分，排序键退化为 pair 自然序；</text>
  <text x="370" y="368" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">条件互相独立可短路，任一不满足立即 continue</text>
</svg>
