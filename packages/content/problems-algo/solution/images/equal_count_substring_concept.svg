<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：枚举种类数 i ⇒ 定长窗口 i×count</text>

  <text x="40" y="58" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 种类数 i 一旦固定，窗口长度就被锁死 k = i × count</text>

  <rect x="40" y="70" width="150" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="115" y="90" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">i = 1</text>
  <text x="115" y="108" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">k = 3  (1×3)</text>

  <rect x="205" y="70" width="150" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="90" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">i = 2</text>
  <text x="280" y="108" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">k = 6  (2×3)</text>

  <rect x="370" y="70" width="150" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="445" y="90" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">i = 3</text>
  <text x="445" y="108" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">k = 9  (3×3)</text>

  <text x="40" y="150" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">② 滑窗统计 t = 频次恰为 count 的字母种数</text>

  <text x="40" y="172" font-size="11" fill="#666" filter="url(#rough2)">s = "aaabcbbcc",  count = 3,  取 i=2 ⇒ k=6 的窗口示例如下：</text>

  <rect x="40" y="184" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="54" y="204" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="68" y="184" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="82" y="204" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="96" y="184" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="204" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>

  <rect x="124" y="184" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="138" y="204" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="152" y="184" width="28" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="166" y="204" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="180" y="184" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="194" y="204" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="208" y="184" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="222" y="204" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="236" y="184" width="28" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="204" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="264" y="184" width="28" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="278" y="204" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">c</text>

  <path d="M 124 220 L 124 230 L 292 230 L 292 220" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="208" y="246" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">窗口 s[3..8] = "bcbbcc"  (长 6 = k)</text>

  <text x="40" y="272" font-size="11" fill="#444" filter="url(#rough2)">窗口内频次：</text>
  <rect x="135" y="260" width="90" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="180" y="277" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">b → 3 ✓</text>
  <rect x="235" y="260" width="90" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="277" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">c → 3 ✓</text>
  <text x="335" y="277" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">⇒ t = 2</text>

  <text x="40" y="316" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">③ 命中条件：t == i</text>

  <rect x="40" y="330" width="480" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="352" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">t = 2  且  i = 2  ⇒  恰 2 种字母各 count 次 ⇒ 命中 ✅</text>

  <rect x="40" y="372" width="232" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="156" y="388" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">t &lt; i：凑不齐 i 种</text>
  <rect x="288" y="372" width="232" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="404" y="388" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">t &gt; i 不可能：t·count ≤ k</text>
</svg>
