<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：先撤旧色 → 再上新色 → 答案取 len</text>

  <rect x="170" y="40" width="180" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">取下一条 query [x, y]</text>

  <path d="M 260 78 L 260 94" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,98 340,128 260,158 180,128" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="133" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">x 已染过色？</text>

  <path d="M 180 128 C 165 145 148 158 132 170" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="146" y="150" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>

  <path d="M 340 128 C 355 145 372 158 378 170" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="366" y="150" font-size="11" fill="#999" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="40" y="172" width="180" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="130" y="194" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">撤旧色：old = ball2color[x]</text>
  <text x="130" y="212" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">color2cnt[old] −= 1</text>
  <text x="130" y="232" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">减到 0 → 删键！</text>

  <rect x="300" y="172" width="160" height="76" fill="#f1f1f1" stroke="#bbb" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="380" y="202" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">球 x 是新球</text>
  <text x="380" y="222" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">没有旧颜色可撤</text>

  <path d="M 130 248 C 130 262 180 262 225 267" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 380 248 C 380 262 330 262 295 267" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="268" width="240" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="292" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">上新色：ball2color[x] = y</text>
  <text x="260" y="312" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">color2cnt[y] += 1</text>

  <path d="M 260 326 L 260 346" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="348" width="240" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="375" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">记录答案 len(color2cnt)</text>

  <path d="M 380 370 C 452 366 492 336 492 288 L 492 80 C 492 64 420 59 354 59" stroke="#999" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="504" y="215" transform="rotate(-90 504 215)" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">循环 n 次</text>
</svg>
