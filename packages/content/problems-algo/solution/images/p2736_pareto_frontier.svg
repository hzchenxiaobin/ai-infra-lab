<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="160" y="32" font-size="17" font-weight="bold" fill="#333" filter="url(#rough2)">Pareto 前沿：y 升、s 降 → 后缀最大 = 二分首位</text>

  <!-- 坐标轴 -->
  <line x1="70" y1="340" x2="540" y2="340" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="70" y1="340" x2="70" y2="70" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="545" y="356" font-size="14" fill="#446688" filter="url(#rough2)">y</text>
  <text x="50" y="68" font-size="14" fill="#446688" filter="url(#rough2)">s=x+y</text>

  <!-- 被支配点（灰色，删除） -->
  <circle cx="170" cy="250" r="5" fill="#ddd" stroke="#aaa" stroke-width="1.5" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <circle cx="230" cy="225" r="5" fill="#ddd" stroke="#aaa" stroke-width="1.5" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <circle cx="300" cy="200" r="5" fill="#ddd" stroke="#aaa" stroke-width="1.5" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="180" y="270" font-size="12" fill="#999" filter="url(#rough2)">被支配（删）</text>

  <!-- Pareto 前沿：y 升 s 降 -->
  <circle cx="130" cy="300" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="200" cy="270" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="280" cy="240" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="380" cy="200" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="470" cy="150" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <path d="M130,300 L200,270 L280,240 L380,200 L470,150" stroke="#4a7a3a" stroke-width="2"
        fill="none" stroke-dasharray="5 3" filter="url(#rough2)"/>

  <!-- 查询 yq 竖线 -->
  <line x1="260" y1="340" x2="260" y2="90" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <text x="225" y="358" font-size="13" fill="#b85450" filter="url(#rough2)">查询 yq</text>
  <!-- 二分命中：首个 y>=yq，即 (280,240) -->
  <circle cx="280" cy="240" r="9" fill="none" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="295" y="232" font-size="13" fill="#b85450" filter="url(#rough2)">首位 y≥yq → s 最大</text>
  <!-- 箭头指向该点 -->
  <path d="M390 215 Q335 222 292 236" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 单调性标注 -->
  <text x="350" y="320" font-size="13" fill="#4a7a3a" filter="url(#rough2)">y↑  s↓（严格递减）</text>
  <text x="120" y="330" font-size="12" fill="#4a7a3a" filter="url(#rough2)">(小y,大s)</text>
  <text x="430" y="140" font-size="12" fill="#4a7a3a" filter="url(#rough2)">(大y,小s)</text>

  <!-- 说明框 -->
  <rect x="90" y="370" width="460" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="100" y="385" font-size="12" fill="#335" filter="url(#rough2)">s 随 y 递减 ⇒ 后缀 [yq,∞) 中，首个 y≥yq 的点 s 最大，二分即可</text>
</svg>
