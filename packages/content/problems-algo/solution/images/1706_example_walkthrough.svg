<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrDg" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L8,0 L4,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 演算：b0 通路 + b1 卡住</text>

  <text x="150" y="56" font-size="10" fill="#888">列号</text>
  <text x="171" y="56" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="213" y="56" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="255" y="56" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="297" y="56" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="339" y="56" text-anchor="middle" font-size="10" fill="#888">4</text>

  <text x="138" y="96" text-anchor="end" font-size="10" fill="#888">行0</text>
  <text x="138" y="138" text-anchor="end" font-size="10" fill="#888">行1</text>
  <text x="138" y="180" text-anchor="end" font-size="10" fill="#888">行2</text>
  <text x="138" y="222" text-anchor="end" font-size="10" fill="#888">行3</text>
  <text x="138" y="264" text-anchor="end" font-size="10" fill="#888">行4</text>

  <!-- 行0: 1 1 1 -1 -1 -->
  <rect x="150" y="70" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="150" y1="70" x2="192" y2="112" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="154" y="82" font-size="8" fill="#446688">1</text>
  <rect x="192" y="70" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="192" y1="70" x2="234" y2="112" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="196" y="82" font-size="8" fill="#446688">1</text>
  <rect x="234" y="70" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="234" y1="70" x2="276" y2="112" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="238" y="82" font-size="8" fill="#446688">1</text>
  <rect x="276" y="70" width="42" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="318" y1="70" x2="276" y2="112" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="82" font-size="8" fill="#b85450">-1</text>
  <rect x="318" y="70" width="42" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="360" y1="70" x2="318" y2="112" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="322" y="82" font-size="8" fill="#b85450">-1</text>

  <!-- 行1: 1 1 1 -1 -1 -->
  <rect x="150" y="112" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="150" y1="112" x2="192" y2="154" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="154" y="124" font-size="8" fill="#446688">1</text>
  <rect x="192" y="112" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="192" y1="112" x2="234" y2="154" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="196" y="124" font-size="8" fill="#446688">1</text>
  <rect x="234" y="112" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="234" y1="112" x2="276" y2="154" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="238" y="124" font-size="8" fill="#446688">1</text>
  <rect x="276" y="112" width="42" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="318" y1="112" x2="276" y2="154" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="124" font-size="8" fill="#b85450">-1</text>
  <rect x="318" y="112" width="42" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="360" y1="112" x2="318" y2="154" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="322" y="124" font-size="8" fill="#b85450">-1</text>

  <!-- 行2: -1 -1 -1 1 1 -->
  <rect x="150" y="154" width="42" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="192" y1="154" x2="150" y2="196" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="154" y="166" font-size="8" fill="#b85450">-1</text>
  <rect x="192" y="154" width="42" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="234" y1="154" x2="192" y2="196" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="196" y="166" font-size="8" fill="#b85450">-1</text>
  <rect x="234" y="154" width="42" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="276" y1="154" x2="234" y2="196" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="238" y="166" font-size="8" fill="#b85450">-1</text>
  <rect x="276" y="154" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="276" y1="154" x2="318" y2="196" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="166" font-size="8" fill="#446688">1</text>
  <rect x="318" y="154" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="318" y1="154" x2="360" y2="196" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="322" y="166" font-size="8" fill="#446688">1</text>

  <!-- 行3: 1 1 1 1 -1 -->
  <rect x="150" y="196" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="150" y1="196" x2="192" y2="238" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="154" y="208" font-size="8" fill="#446688">1</text>
  <rect x="192" y="196" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="192" y1="196" x2="234" y2="238" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="196" y="208" font-size="8" fill="#446688">1</text>
  <rect x="234" y="196" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="234" y1="196" x2="276" y2="238" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="238" y="208" font-size="8" fill="#446688">1</text>
  <rect x="276" y="196" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="276" y1="196" x2="318" y2="238" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="208" font-size="8" fill="#446688">1</text>
  <rect x="318" y="196" width="42" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="360" y1="196" x2="318" y2="238" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="322" y="208" font-size="8" fill="#b85450">-1</text>

  <!-- 行4: -1 -1 -1 -1 -1 -->
  <rect x="150" y="238" width="42" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="192" y1="238" x2="150" y2="280" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="154" y="250" font-size="8" fill="#b85450">-1</text>
  <rect x="192" y="238" width="42" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="234" y1="238" x2="192" y2="280" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="196" y="250" font-size="8" fill="#b85450">-1</text>
  <rect x="234" y="238" width="42" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="276" y1="238" x2="234" y2="280" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="238" y="250" font-size="8" fill="#b85450">-1</text>
  <rect x="276" y="238" width="42" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="318" y1="238" x2="276" y2="280" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="250" font-size="8" fill="#b85450">-1</text>
  <rect x="318" y="238" width="42" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="360" y1="238" x2="318" y2="280" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="322" y="250" font-size="8" fill="#b85450">-1</text>

  <!-- b0 路径：0→1→2→1→2→1 -->
  <path d="M 171 60 L 171 91 L 213 133 L 255 175 L 213 217 L 255 259 L 213 280 L 213 302" stroke="#4a7a3a" stroke-width="2.5" fill="none" marker-end="url(#arrDg)" filter="url(#rough2)"/>
  <circle cx="171" cy="91" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="213" cy="133" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="255" cy="175" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="213" cy="217" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="255" cy="259" r="4" fill="#4a7a3a" filter="url(#rough2)"/>

  <text x="150" y="318" font-size="11" fill="#4a7a3a" font-weight="bold">b0：列0→1→2→1→2→1，出口列 1 ✓</text>

  <!-- b1 卡住标记：行1 列2-3 的 V -->
  <circle cx="276" cy="154" r="8" fill="none" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <path d="M 213 60 L 213 133 L 255 175" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <circle cx="213" cy="133" r="3.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="255" cy="175" r="3.5" fill="#b85450" filter="url(#rough2)"/>

  <text x="370" y="156" font-size="11" fill="#b85450" font-weight="bold">b1 卡在此处</text>
  <text x="370" y="172" font-size="10" fill="#b85450">行1 列2(\) 与列3(/)</text>
  <text x="370" y="186" font-size="10" fill="#b85450">相向成 V → -1</text>

  <rect x="150" y="340" width="330" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="165" y="362" font-size="11" fill="#444">b0：1→1→1→-1→-1 逐行同向，每次 col←col+d</text>
  <text x="165" y="378" font-size="11" fill="#b85450">b1：行1 列2(d=1) 欲去列3，但 grid[1][3]=-1≠1 → V</text>
</svg>
