<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：s = "aabb"（a:2, b:2）</text>

  <!-- header row -->
  <text x="60" y="66" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">频率 k</text>
  <text x="180" y="66" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">字符 a (f=2)</text>
  <text x="320" y="66" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">字符 b (f=2)</text>
  <text x="460" y="66" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">本组方案数</text>
  <line x1="20" y1="76" x2="540" y2="76" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- row k=1 -->
  <rect x="30" y="92" width="60" height="56" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="126" text-anchor="middle" font-size="18" fill="#7a5520" filter="url(#rough2)">1</text>

  <rect x="120" y="92" width="120" height="56" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="116" text-anchor="middle" font-size="13" fill="#2c3e50" filter="url(#rough2)">C(2,1)+1</text>
  <text x="180" y="136" text-anchor="middle" font-size="13" fill="#2c3e50" filter="url(#rough2)">= 2 + 1 = 3</text>

  <rect x="260" y="92" width="120" height="56" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="116" text-anchor="middle" font-size="13" fill="#2c4a22" filter="url(#rough2)">C(2,1)+1</text>
  <text x="320" y="136" text-anchor="middle" font-size="13" fill="#2c4a22" filter="url(#rough2)">= 2 + 1 = 3</text>

  <rect x="400" y="92" width="120" height="56" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="460" y="118" text-anchor="middle" font-size="13" fill="#7a2230" filter="url(#rough2)">3 × 3 − 1</text>
  <text x="460" y="138" text-anchor="middle" font-size="15" fill="#7a2230" filter="url(#rough2)">= 8</text>

  <!-- row k=2 -->
  <rect x="30" y="172" width="60" height="56" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="206" text-anchor="middle" font-size="18" fill="#7a5520" filter="url(#rough2)">2</text>

  <rect x="120" y="172" width="120" height="56" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="196" text-anchor="middle" font-size="13" fill="#2c3e50" filter="url(#rough2)">C(2,2)+1</text>
  <text x="180" y="216" text-anchor="middle" font-size="13" fill="#2c3e50" filter="url(#rough2)">= 1 + 1 = 2</text>

  <rect x="260" y="172" width="120" height="56" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="196" text-anchor="middle" font-size="13" fill="#2c4a22" filter="url(#rough2)">C(2,2)+1</text>
  <text x="320" y="216" text-anchor="middle" font-size="13" fill="#2c4a22" filter="url(#rough2)">= 1 + 1 = 2</text>

  <rect x="400" y="172" width="120" height="56" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="460" y="198" text-anchor="middle" font-size="13" fill="#7a2230" filter="url(#rough2)">2 × 2 − 1</text>
  <text x="460" y="218" text-anchor="middle" font-size="15" fill="#7a2230" filter="url(#rough2)">= 3</text>

  <!-- total -->
  <line x1="20" y1="248" x2="540" y2="248" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 460 230 L 460 270" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="120" y="276" width="340" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="290" y="304" text-anchor="middle" font-size="15" fill="#7a2230" filter="url(#rough2)">合计 = 8 + 3 = 11（对 10⁹+7 取模）</text>

  <!-- listed good subseqs -->
  <text x="290" y="346" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">k=1：a / a / b / b / ab×4 = 8 ；k=2：aa / bb / aabb = 3</text>
  <text x="290" y="365" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">（同一字符多个位置选不同次，方案分别计数）</text>
</svg>
