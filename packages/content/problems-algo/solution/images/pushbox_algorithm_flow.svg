<svg xmlns="http://www.w3.org/2000/svg" width="860" height="620" viewBox="0 0 860 620" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="860" height="620" fill="#fdfcf7"/>
  <text x="430" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">推箱子 BFS 算法流程</text>
  <path d="M 200 40 Q 430 48 660 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Main flow (left column) ===== -->
  <!-- Step 1: init -->
  <g filter="url(#sk2)">
    <rect x="60" y="62" width="280" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="200" y="88" text-anchor="middle" font-size="12" fill="#34506e" font-weight="bold">① 找 S/B/T 坐标，初始状态入队</text>
  <text x="200" y="101" text-anchor="middle" font-size="10" fill="#666">vis[箱][人] = true，steps = 0</text>
  <path d="M 200 108 L 200 128" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk2)"/>

  <!-- Step 2: pop -->
  <g filter="url(#sk2)">
    <path d="M 60 130 L 340 130 L 320 166 L 80 166 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="200" y="152" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">② 队列为空？</text>
  <!-- yes branch -->
  <path d="M 340 148 L 400 148" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk2)"/>
  <text x="362" y="142" font-size="10" fill="#888">是</text>
  <g filter="url(#sk2)">
    <rect x="400" y="130" width="120" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="460" y="152" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 -1</text>
  <!-- no branch -->
  <path d="M 200 166 L 200 186" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk2)"/>
  <text x="210" y="180" font-size="10" fill="#888">否</text>

  <!-- Step 3: pop state -->
  <g filter="url(#sk2)">
    <rect x="60" y="188" width="280" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="200" y="208" text-anchor="middle" font-size="12" fill="#34506e" font-weight="bold">③ 弹出 (箱r,c, 人r,c)</text>
  <text x="200" y="223" text-anchor="middle" font-size="10" fill="#666">本层 steps 步推动</text>
  <path d="M 200 234 L 200 254" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk2)"/>

  <!-- Step 4: check target -->
  <g filter="url(#sk2)">
    <path d="M 60 256 L 340 256 L 320 296 L 80 296 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="200" y="280" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">④ 箱在目标 T？</text>
  <!-- yes -->
  <path d="M 340 276 L 400 276" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arG)" filter="url(#sk2)"/>
  <text x="362" y="270" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <g filter="url(#sk2)">
    <rect x="400" y="258" width="120" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="460" y="280" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">返回 steps ⭐</text>
  <!-- no -->
  <path d="M 200 296 L 200 316" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk2)"/>
  <text x="210" y="310" font-size="10" fill="#888">否</text>

  <!-- Step 5: loop 4 dirs -->
  <g filter="url(#sk2)">
    <rect x="60" y="318" width="280" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="200" y="342" text-anchor="middle" font-size="12" fill="#34506e" font-weight="bold">⑤ 枚举 4 个推动方向 d</text>
  <path d="M 200 360 L 200 380" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk2)"/>

  <!-- Step 6: check new box pos -->
  <g filter="url(#sk2)">
    <path d="M 60 382 L 340 382 L 320 422 L 80 422 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="200" y="400" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">⑥ 新箱位(箱+d)合法？</text>
  <text x="200" y="416" text-anchor="middle" font-size="10" fill="#888">不越界 &amp; 非 '#' 墙</text>
  <path d="M 200 422 L 200 442" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk2)"/>
  <text x="210" y="436" font-size="10" fill="#888">是</text>

  <!-- ===== Inner BFS (highlighted box) ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="444" width="320" height="132" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" stroke-dasharray="6 3"/>
  </g>
  <text x="200" y="466" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">⑦ 内层 BFS：人可达推动位？</text>
  <text x="200" y="482" text-anchor="middle" font-size="10" fill="#b85450">从 (人r,c) 走到 (箱−d)，箱子当障碍</text>

  <g filter="url(#sk2)">
    <rect x="56" y="492" width="288" height="28" rx="5" fill="#ffffff" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="200" y="510" text-anchor="middle" font-size="10.5" fill="#444">BFS/DFS 从人位扩散 → 箱位不可过</text>

  <path d="M 200 524 L 200 540" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arR)" filter="url(#sk2)"/>

  <g filter="url(#sk2)">
    <path d="M 56 542 L 344 542 L 324 568 L 76 568 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="200" y="560" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">可达推动位？</text>
  <text x="200" y="574" text-anchor="middle" font-size="9.5" fill="#888">否 → 跳过此方向</text>

  <!-- yes from inner bfs -> step 8 -->
  <path d="M 344 555 L 420 555" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arG)" filter="url(#sk2)"/>
  <text x="372" y="549" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- ===== Right column: step 8 + loop back ===== -->
  <g filter="url(#sk2)">
    <rect x="420" y="490" width="300" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="570" y="510" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">⑧ 新状态入队</text>
  <text x="570" y="525" text-anchor="middle" font-size="10" fill="#666">新状态=(新箱, 箱旧位), vis 标记</text>

  <!-- loop back arrow: from step 8 up to step 5 -->
  <path d="M 720 512 L 760 512 L 760 338 L 340 338" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk2)" stroke-dasharray="4 3"/>
  <text x="770" y="425" font-size="9.5" fill="#888" transform="rotate(-90 770 425)">继续下一方向</text>

  <!-- layer end: steps++ and back to step 2 -->
  <g filter="url(#sk2)">
    <rect x="420" y="560" width="300" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="570" y="582" text-anchor="middle" font-size="12" fill="#34506e" font-weight="bold">⑨ 本层处理完 → steps++</text>
  <!-- arrow from step 8 to step 9 -->
  <path d="M 570 536 L 570 556" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk2)"/>
  <!-- loop back to step 2 -->
  <path d="M 420 578 L 30 578 L 30 148 L 56 148" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk2)" stroke-dasharray="4 3"/>
  <text x="38" y="370" font-size="9.5" fill="#888" transform="rotate(-90 38 370)">下一层 BFS</text>

  <!-- bottom note -->
  <text x="430" y="608" text-anchor="middle" font-size="10.5" fill="#7a5415" font-weight="bold">外层 BFS 按层扩展 → 首次命中目标即为最少推动次数</text>
</svg>
