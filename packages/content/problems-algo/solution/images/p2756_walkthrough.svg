<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例 3 演算：batchTime=100, batchFn 耗时 keys.length×100ms</text>

  <!-- table header -->
  <rect x="20" y="40" width="600" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="58" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">时刻</text>
  <text x="160" y="58" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">事件</text>
  <text x="330" y="58" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">批次队列</text>
  <text x="530" y="58" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">动作</text>

  <!-- row 1: t=10 -->
  <rect x="20" y="70" width="600" height="28" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="0" filter="url(#rough2)"/>
  <text x="60" y="88" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">10</text>
  <text x="160" y="88" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">a 到达</text>
  <text x="330" y="88" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">[a]</text>
  <text x="530" y="88" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">开定时器(100ms)</text>

  <!-- row 2: t=20 -->
  <rect x="20" y="100" width="600" height="28" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="0" filter="url(#rough2)"/>
  <text x="60" y="118" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">20</text>
  <text x="160" y="118" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">b 到达</text>
  <text x="330" y="118" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">[a, b]</text>
  <text x="530" y="118" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">仅入队</text>

  <!-- row 3: t=30 -->
  <rect x="20" y="130" width="600" height="28" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="0" filter="url(#rough2)"/>
  <text x="60" y="148" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">30</text>
  <text x="160" y="148" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">c 到达</text>
  <text x="330" y="148" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">[a, b, c]</text>
  <text x="530" y="148" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">仅入队</text>

  <!-- row 4: t=40 -->
  <rect x="20" y="160" width="600" height="28" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="0" filter="url(#rough2)"/>
  <text x="60" y="178" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">40</text>
  <text x="160" y="178" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">d 到达</text>
  <text x="330" y="178" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">[a, b, c, d]</text>
  <text x="530" y="178" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">仅入队</text>

  <!-- row 5: t=110 flush -->
  <rect x="20" y="190" width="600" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="0" filter="url(#rough2)"/>
  <text x="60" y="208" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">110</text>
  <text x="160" y="208" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">定时器到期</text>
  <text x="330" y="208" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">[ ]（已清空）</text>
  <text x="530" y="208" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">batchFn([a,b,c,d])</text>

  <!-- row 6: t=250 -->
  <rect x="20" y="220" width="600" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="0" filter="url(#rough2)"/>
  <text x="60" y="238" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">250</text>
  <text x="160" y="238" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">e 到达</text>
  <text x="330" y="238" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">[e]</text>
  <text x="530" y="238" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">开新定时器(100ms)</text>

  <!-- row 7: t=300 -->
  <rect x="20" y="250" width="600" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="0" filter="url(#rough2)"/>
  <text x="60" y="268" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">300</text>
  <text x="160" y="268" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">f 到达</text>
  <text x="330" y="268" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">[e, f]</text>
  <text x="530" y="268" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">仅入队</text>

  <!-- row 8: t=350 flush -->
  <rect x="20" y="280" width="600" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="0" filter="url(#rough2)"/>
  <text x="60" y="298" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">350</text>
  <text x="160" y="298" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">定时器到期</text>
  <text x="330" y="298" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">[ ]（已清空）</text>
  <text x="530" y="298" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">batchFn([e,f])</text>

  <!-- row 9: t=510 -->
  <rect x="20" y="310" width="600" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="0" filter="url(#rough2)"/>
  <text x="60" y="328" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">510</text>
  <text x="160" y="328" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">batch1 完成</text>
  <text x="330" y="328" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)"></text>
  <text x="530" y="328" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">resolve a,b,c,d</text>

  <!-- row 10: t=550 -->
  <rect x="20" y="340" width="600" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="0" filter="url(#rough2)"/>
  <text x="60" y="358" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">550</text>
  <text x="160" y="358" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">batch2 完成</text>
  <text x="330" y="358" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)"></text>
  <text x="530" y="358" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">resolve e,f</text>

  <!-- summary -->
  <rect x="80" y="384" width="480" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="320" y="402" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2 次调用 batchFn，两批并行执行</text>
  <text x="320" y="418" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">结果 = ["a!","b!","c!","d!","e!","f!"]</text>
</svg>
