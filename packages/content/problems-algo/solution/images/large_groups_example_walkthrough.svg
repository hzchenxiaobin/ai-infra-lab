<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 210"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="210" fill="#fafafa"/>

  <text x="270" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold">示例演算：s = "abcdddeeeeaabbbcd"（n = 17）逐段闭合</text>

  <!-- index labels: 17 cells, w=28, start x=24, centers 38,66,...,486 -->
