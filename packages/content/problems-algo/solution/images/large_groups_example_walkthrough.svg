  <text x="66" y="50" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="94" y="50" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="122" y="50" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="150" y="50" text-anchor="middle" font-size="9" fill="#888">4</text>
  <text x="178" y="50" text-anchor="middle" font-size="9" fill="#888">5</text>
  <text x="206" y="50" text-anchor="middle" font-size="9" fill="#888">6</text>
  <text x="234" y="50" text-anchor="middle" font-size="9" fill="#888">7</text>
  <text x="262" y="50" text-anchor="middle" font-size="9" fill="#888">8</text>
  <text x="290" y="50" text-anchor="middle" font-size="9" fill="#888">9</text>
  <text x="318" y="50" text-anchor="middle" font-size="9" fill="#888">10</text>
  <text x="346" y="50" text-anchor="middle" font-size="9" fill="#888">11</text>
  <text x="374" y="50" text-anchor="middle" font-size="9" fill="#888">12</text>
  <text x="402" y="50" text-anchor="middle" font-size="9" fill="#888">13</text>
  <text x="430" y="50" text-anchor="middle" font-size="9" fill="#888">14</text>
  <text x="458" y="50" text-anchor="middle" font-size="9" fill="#888">15</text>
  <text x="486" y="50" text-anchor="middle" font-size="9" fill="#888">16</text>

  <!-- cells: a b c d d d e e e e a a b b b c d -->
  <rect x="24" y="58" width="28" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="38" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="52" y="58" width="28" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="66" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>
  <rect x="80" y="58" width="28" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
