  <text x="290" y="80" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">e</text>
  <rect x="304" y="58" width="28" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="318" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="332" y="58" width="28" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="346" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="360" y="58" width="28" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="374" y="80" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">b</text>
  <rect x="388" y="58" width="28" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="402" y="80" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">b</text>
  <rect x="416" y="58" width="28" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="430" y="80" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">b</text>
  <rect x="444" y="58" width="28" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="458" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">c</text>
