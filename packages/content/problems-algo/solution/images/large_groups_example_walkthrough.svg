  <rect x="220" y="58" width="28" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="234" y="80" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">e</text>
