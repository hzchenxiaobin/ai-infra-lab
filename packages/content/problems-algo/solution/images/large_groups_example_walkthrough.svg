  <rect x="189" y="54" width="118" height="40" fill="none" stroke="#b85450" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <rect x="301" y="54" width="62" height="40" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3" rx="5" filter="url(#rough2)"/>
  <rect x="357" y="54" width="90" height="40" fill="none" stroke="#b85450" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <rect x="441" y="54" width="34" height="40" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3" rx="5" filter="url(#rough2)"/>
  <rect x="469" y="54" width="34" height="40" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3" rx="5" filter="url(#rough2)"/>

  <!-- group length labels below frames -->
  <text x="38" y="108" text-anchor="middle" font-size="10" fill="#888">1 ✗</text>
  <text x="66" y="108" text-anchor="middle" font-size="10" fill="#888">1 ✗</text>
  <text x="94" y="108" text-anchor="middle" font-size="10" fill="#888">1 ✗</text>
  <text x="150" y="108" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">3 ✓ [3,5]</text>
  <text x="248" y="108" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">4 ✓ [6,9]</text>
  <text x="332" y="108" text-anchor="middle" font-size="10" fill="#888">2 ✗</text>
  <text x="402" y="108" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">3 ✓ [12,14]</text>
  <text x="458" y="108" text-anchor="middle" font-size="10" fill="#888">1 ✗</text>
  <text x="486" y="108" text-anchor="middle" font-size="10" fill="#888">1 ✗</text>

  <!-- result box -->
  <rect x="70" y="128" width="400" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="151" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">结果 res = [[3,5], [6,9], [12,14]]</text>

  <!-- note -->
  <text x="270" y="184" text-anchor="middle" font-size="11" fill="#666">三个较大分组：ddd(长度 3)、eeee(长度 4)、bbb(长度 3)</text>
  <text x="270" y="200" text-anchor="middle" font-size="10.5" fill="#888">i = 17 (= n) 时哨兵收尾，闭合最后的 "d" 段（长度 1，不记录）</text>
