<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    算法流程：从 first 起逐项异或解码
  </text>

  <!-- Start -->
  <rect x="210" y="48" width="100" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="260" y="69" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>

  <path d="M260,80 L260,92" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- arr[0] = first ; i = 0 -->
  <rect x="170" y="96" width="180" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="118" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">arr[0] = first；i = 0</text>

  <path d="M260,130 L260,150" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond: i < n-1 ? -->
  <polygon points="260,154 332,196 260,238 188,196" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="192" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i &lt; n-1 ?</text>
  <text x="260" y="208" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">还有未解码项</text>

  <!-- No branch: right -->
  <path d="M332,196 L380,196" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="356" y="188" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="380" y="178" width="120" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="440" y="201" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">返回 arr</text>

  <!-- Yes branch: down -->
  <path d="M260,238 L260,254" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="250" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- compute box -->
  <rect x="150" y="258" width="220" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="278" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">arr[i+1] = arr[i] ⊕ encoded[i]</text>
  <text x="260" y="296" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i = i + 1</text>

  <!-- loop back: left rail up to diamond left -->
  <path d="M150,282 L110,282 L110,196 L188,196" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5 3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="96" y="240" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">循环</text>

  <!-- Insight box -->
  <rect x="50" y="322" width="420" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="342" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">
    每轮 O(1)：一次异或 + 一次自增，共 n-1 轮 → O(n)
  </text>
</svg>
