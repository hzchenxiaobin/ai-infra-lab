<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrF" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一次叉积即可判定</text>

  <!-- Step 1: 取三点 -->
  <rect x="180" y="50" width="160" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="73" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">取三点 P₁, P₂, P₃</text>

  <!-- arrow down -->
  <path d="M 260 88 L 260 108" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Step 2: 算叉积 -->
  <rect x="110" y="112" width="300" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">计算叉积（2×有向面积）</text>
  <text x="260" y="150" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">cross = (x₂−x₁)(y₃−y₁) − (x₃−x₁)(y₂−y₁)</text>

  <!-- arrow down -->
  <path d="M 260 160 L 260 180" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Decision diamond: cross == 0? -->
  <polygon points="260,184 340,230 260,276 180,230" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="226" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">cross</text>
  <text x="260" y="244" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">== 0 ?</text>

  <!-- Yes branch (left) -->
  <path d="M 180 230 L 100 230" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="140" y="222" text-anchor="middle" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="24" y="212" width="76" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="62" y="235" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">false</text>
  <text x="62" y="262" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">共线 / 重合</text>

  <!-- No branch (right) -->
  <path d="M 340 230 L 420 230" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="380" y="222" text-anchor="middle" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="420" y="212" width="76" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="458" y="235" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">true</text>
  <text x="458" y="262" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">有效回旋镖</text>

  <!-- Bottom note -->
  <rect x="40" y="296" width="440" height="86" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="260" y="320" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">为何不用单独判「点重合」？</text>
  <text x="260" y="342" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">两点重合时 P₁P₂ 或 P₁P₃ 为零向量，叉积必为 0，</text>
  <text x="260" y="360" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">已被「共线」分支一并吞掉 → cross ≠ 0 即充要条件</text>
  <text x="260" y="376" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">全程整数运算，无除零、无浮点，固定 3 点 → O(1)</text>
</svg>
