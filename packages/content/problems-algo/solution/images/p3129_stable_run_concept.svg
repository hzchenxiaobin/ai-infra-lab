<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">稳定 ⇔ 每个「极长连续段」长度 ≤ limit</text>

  <!-- Example A: stable -->
  <text x="90" y="62" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 稳定（limit = 2）</text>

  <rect x="90" y="72" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="111" y="99" text-anchor="middle" font-size="14" fill="#2c4a6b" filter="url(#rough2)">1</text>
  <rect x="132" y="72" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="153" y="99" text-anchor="middle" font-size="14" fill="#2c4a6b" filter="url(#rough2)">1</text>
  <rect x="174" y="72" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="195" y="99" text-anchor="middle" font-size="14" fill="#2d5a24" filter="url(#rough2)">0</text>
  <rect x="216" y="72" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="237" y="99" text-anchor="middle" font-size="14" fill="#2c4a6b" filter="url(#rough2)">1</text>
  <rect x="258" y="72" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="279" y="99" text-anchor="middle" font-size="14" fill="#2c4a6b" filter="url(#rough2)">1</text>
  <rect x="300" y="72" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="321" y="99" text-anchor="middle" font-size="14" fill="#2d5a24" filter="url(#rough2)">0</text>
  <rect x="342" y="72" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="363" y="99" text-anchor="middle" font-size="14" fill="#2d5a24" filter="url(#rough2)">0</text>
  <rect x="384" y="72" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="405" y="99" text-anchor="middle" font-size="14" fill="#2c4a6b" filter="url(#rough2)">1</text>

  <!-- run brackets A -->
  <path d="M92,118 L92,125 L170,125 L170,118" fill="none" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="131" y="142" text-anchor="middle" font-size="11.5" fill="#2d5a24" filter="url(#rough2)">2</text>
  <path d="M176,118 L176,125 L214,125 L214,118" fill="none" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="195" y="142" text-anchor="middle" font-size="11.5" fill="#2d5a24" filter="url(#rough2)">1</text>
  <path d="M218,118 L218,125 L296,125 L296,118" fill="none" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="257" y="142" text-anchor="middle" font-size="11.5" fill="#2d5a24" filter="url(#rough2)">2</text>
  <path d="M302,118 L302,125 L380,125 L380,118" fill="none" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="341" y="142" text-anchor="middle" font-size="11.5" fill="#2d5a24" filter="url(#rough2)">2</text>
  <path d="M386,118 L386,125 L424,125 L424,118" fill="none" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="405" y="142" text-anchor="middle" font-size="11.5" fill="#2d5a24" filter="url(#rough2)">1</text>
  <text x="492" y="130" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">每段 ≤ 2</text>
  <text x="492" y="146" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <!-- Example B: unstable -->
  <text x="90" y="176" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 不稳定（limit = 2）</text>

  <rect x="88" y="184" width="130" height="46" rx="6" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <rect x="90" y="186" width="42" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="111" y="213" text-anchor="middle" font-size="14" fill="#8c2f28" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="132" y="186" width="42" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="153" y="213" text-anchor="middle" font-size="14" fill="#8c2f28" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="174" y="186" width="42" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="195" y="213" text-anchor="middle" font-size="14" fill="#8c2f28" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="216" y="186" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="237" y="213" text-anchor="middle" font-size="14" fill="#2c4a6b" filter="url(#rough2)">1</text>
  <rect x="258" y="186" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="279" y="213" text-anchor="middle" font-size="14" fill="#2c4a6b" filter="url(#rough2)">1</text>
  <rect x="300" y="186" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="321" y="213" text-anchor="middle" font-size="14" fill="#2d5a24" filter="url(#rough2)">0</text>
  <rect x="342" y="186" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="363" y="213" text-anchor="middle" font-size="14" fill="#2c4a6b" filter="url(#rough2)">1</text>
  <rect x="384" y="186" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="405" y="213" text-anchor="middle" font-size="14" fill="#2c4a6b" filter="url(#rough2)">1</text>

  <!-- run brackets B -->
  <path d="M92,234 L92,241 L214,241 L214,234" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="153" y="258" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <path d="M218,234 L218,241 L296,241 L296,234" fill="none" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="257" y="258" text-anchor="middle" font-size="11.5" fill="#2d5a24" filter="url(#rough2)">2</text>
  <path d="M302,234 L302,241 L344,241 L344,234" fill="none" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="323" y="258" text-anchor="middle" font-size="11.5" fill="#2d5a24" filter="url(#rough2)">1</text>
  <path d="M350,234 L350,241 L424,241 L424,234" fill="none" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="387" y="258" text-anchor="middle" font-size="11.5" fill="#2d5a24" filter="url(#rough2)">2</text>
  <text x="153" y="275" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">3 个连续 0 → 违规！</text>

  <!-- bottom note -->
  <rect x="30" y="290" width="500" height="78" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="280" y="313" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">「每个长度 &gt; limit 的子数组都要同时含 0 和 1」</text>
  <text x="280" y="335" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">⟺ 不存在 limit+1 个连续相同的元素（这 limit+1 个数本身就是违规子数组）</text>
  <text x="280" y="357" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">⟺ 每个极长连续段（run）长度 ≤ limit —— 约束被收到「段」上</text>
</svg>
