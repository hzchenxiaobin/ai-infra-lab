<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arro" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：val 追加到数组末尾 → 只影响右脊</text>
  <text x="290" y="42" text-anchor="middle" font-size="11" fill="#888">中序遍历 = 原数组 A；val 在最右端 → 只与右脊（递减）节点较量</text>

  <!-- ===== LEFT: Tree with right spine ===== -->
  <text x="150" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">最大二叉树 root（A = [1,4,2,3]）</text>

  <!-- edges -->
  <line x1="136" y1="104" x2="112" y2="138" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="166" y1="104" x2="188" y2="138" stroke="#d6a040" stroke-width="2.6" filter="url(#rough2)"/>
  <line x1="208" y1="166" x2="194" y2="198" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- nodes -->
  <circle cx="150" cy="92" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="150" y="97" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">4</text>
  <circle cx="104" cy="152" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="104" y="157" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <circle cx="196" cy="152" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="196" y="157" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
  <circle cx="186" cy="212" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="186" y="217" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>

  <!-- spine label -->
  <text x="232" y="120" font-size="11" fill="#d6a040" font-weight="bold">右脊</text>
  <text x="232" y="135" font-size="10" fill="#d6a040">4 → 3</text>
  <text x="232" y="148" font-size="9" fill="#b08030">（递减）</text>
  <text x="60" y="120" font-size="9" fill="#888">不受影响</text>
  <text x="60" y="132" font-size="9" fill="#888">的左子树</text>

  <!-- array -->
  <text x="150" y="248" text-anchor="middle" font-size="10" fill="#888">中序遍历 = 原数组 A</text>
  <g font-size="11">
    <rect x="58" y="256" width="26" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="71" y="272" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <rect x="86" y="256" width="26" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
    <text x="99" y="272" text-anchor="middle" fill="#d6a040" font-weight="bold">4</text>
    <rect x="114" y="256" width="26" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="127" y="272" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <rect x="142" y="256" width="26" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
    <text x="155" y="272" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
    <text x="174" y="272" font-size="13" fill="#888">+</text>
    <rect x="186" y="256" width="34" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3" filter="url(#rough2)"/>
    <text x="203" y="272" text-anchor="middle" fill="#b85450" font-weight="bold">val</text>
  </g>
  <text x="150" y="298" text-anchor="middle" font-size="9" fill="#888">橙=右脊（后缀最大值），红=末尾追加的 val</text>

  <!-- ===== RIGHT: three cases ===== -->
  <text x="445" y="66" text-anchor="middle" font-size="12" fill="#7a5a20" font-weight="bold">插入规则（沿右脊下行）</text>

  <!-- Case 1 -->
  <rect x="328" y="80" width="232" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="340" y="98" font-size="11" fill="#d6a040" font-weight="bold">① val &gt; node</text>
  <text x="340" y="114" font-size="10" fill="#555">val 篡位：new(val)</text>
  <text x="340" y="128" font-size="10" fill="#555">new.left = node（原子树在左）</text>

  <!-- Case 2 -->
  <rect x="328" y="146" width="232" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="340" y="164" font-size="11" fill="#446688" font-weight="bold">② val &lt; node，right 非空</text>
  <text x="340" y="180" font-size="10" fill="#555">node 仍是后缀最大值</text>
  <text x="340" y="194" font-size="10" fill="#555">→ 下行 insert(node.right, val)</text>

  <!-- Case 3 -->
  <rect x="328" y="212" width="232" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="340" y="230" font-size="11" fill="#4a7a3a" font-weight="bold">③ val &lt; node，right 为空</text>
  <text x="340" y="246" font-size="10" fill="#555">val 比右脊都小</text>
  <text x="340" y="260" font-size="10" fill="#555">→ 落为 node.right（最右叶子）</text>

  <!-- arrows from val to spine cases -->
  <path d="M 220 268 Q 290 200 328 140" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="270" y="186" font-size="9" fill="#b85450">val 沿</text>
  <text x="270" y="198" font-size="9" fill="#b85450">右脊走</text>

  <!-- bottom summary -->
  <rect x="20" y="288" width="540" height="62" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="290" y="312" text-anchor="middle" font-size="11" fill="#7a3a3a" font-weight="bold">val 追加到末尾 → 只可能落在右脊上，左子树与左挂子树完全不变</text>
  <text x="290" y="332" text-anchor="middle" font-size="10" fill="#7a3a3a">递归统一返回「插入后的新子树根」：篡位返回新节点，下行/落叶返回原 node</text>
</svg>
