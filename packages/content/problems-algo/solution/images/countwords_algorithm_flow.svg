<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：哈希集合 + 逐位剥离查询</text>

  <!-- Start -->
  <rect x="240" y="44" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="280" y="63" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始</text>
  <path d="M 280 72 L 280 86" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Phase 1: build startMasks -->
  <rect x="80" y="90" width="400" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="110" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">阶段一：构建 startMasks 哈希集合</text>
  <text x="280" y="128" text-anchor="middle" font-size="11" fill="#555">for w in startWords:  mask = Σ 1&lt;&lt;(ch−'a')</text>
  <text x="280" y="144" text-anchor="middle" font-size="11" fill="#555">startMasks.add(mask)   // O(总字母数)</text>
  <path d="M 280 152 L 280 166" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- count init -->
  <rect x="210" y="170" width="140" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="188" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">count = 0</text>
  <path d="M 280 196 L 280 210" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Phase 2: per target -->
  <rect x="80" y="214" width="400" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="234" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">阶段二：遍历每个 targetWord</text>
  <text x="280" y="252" text-anchor="middle" font-size="11" fill="#555">tmask = Σ 1&lt;&lt;(ch−'a') for ch in target</text>
  <path d="M 280 260 L 280 274" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- inner loop: try each bit -->
  <rect x="80" y="278" width="400" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="298" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">逐位尝试：for bit in 0..25</text>
  <text x="280" y="316" text-anchor="middle" font-size="11" fill="#555">if tmask 有第 bit 位：probe = tmask &amp; ~(1&lt;&lt;bit)</text>
  <path d="M 280 324 L 280 338" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: probe in startMasks? -->
  <polygon points="280,342 380,372 280,402 180,372" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="376" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">probe ∈ startMasks ?</text>

  <!-- Yes -> count++ then next target -->
  <path d="M 380 372 L 470 372" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="425" y="366" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="450" y="358" width="96" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="498" y="378" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">count++; 下一个</text>

  <!-- No -> next bit (loop back) -->
  <path d="M 180 372 L 130 372 L 130 300" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="366" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <text x="110" y="338" text-anchor="middle" font-size="9" fill="#b85450">下一位</text>

  <!-- after all targets -> return -->
  <path d="M 280 402 L 280 424" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="418" font-size="10" fill="#666" font-weight="bold">所有 target 处理完</text>
  <rect x="225" y="428" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="280" y="448" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return count</text>
</svg>
