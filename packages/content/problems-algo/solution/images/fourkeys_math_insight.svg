<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">每步效率对比：本题 k^{1/(k+1)} vs 343 k^{1/k}</text>

  <!-- axes -->
  <line x1="60" y1="310" x2="520" y2="310" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="60" y1="310" x2="60" y2="60" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="528" y="326" font-size="11" fill="#446688" filter="url(#rough2)">k</text>
  <text x="40" y="56" font-size="11" fill="#446688" filter="url(#rough2)">效率</text>

  <!-- y-axis ticks -->
  <line x1="56" y1="250" x2="60" y2="250" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="50" y="254" text-anchor="end" font-size="10" fill="#666" filter="url(#rough2)">1.30</text>
  <line x1="56" y1="180" x2="60" y2="180" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="50" y="184" text-anchor="end" font-size="10" fill="#666" filter="url(#rough2)">1.40</text>
  <line x1="56" y1="110" x2="60" y2="110" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="50" y="114" text-anchor="end" font-size="10" fill="#666" filter="url(#rough2)">1.50</text>

  <!-- baseline 1.442 reference for base a=3 -->
  <line x1="60" y1="124" x2="520" y2="124" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="4,4" filter="url(#rough2)"/>
  <text x="510" y="120" text-anchor="end" font-size="10" fill="#4a7a3a" filter="url(#rough2)">基线 a=3：1.442</text>

  <!-- bars: k=2,3,4,5 for both series -->
  <!-- positions: k=2 @100, k=3 @200, k=4 @300, k=5 @400 -->

  <!-- k=2 : 343 k^{1/k}=1.414 -> y=180 ; 651 k^{1/(k+1)}=1.260 -> y~290 -->
  <rect x="92" y="180" width="16" height="130" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="110" y="290" width="16" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="110" y="328" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">k=2</text>

  <!-- k=3 : 343 1.442 -> y=124 (peak) ; 651 1.316 -> y~240 -->
  <rect x="192" y="124" width="16" height="186" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="210" y="240" width="16" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="210" y="328" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">k=3</text>
  <text x="186" y="118" text-anchor="end" font-size="9" fill="#4a7a3a" filter="url(#rough2)">343 峰</text>

  <!-- k=4 : 343 1.414 -> y=180 ; 651 1.320 -> y~226 (peak) -->
  <rect x="292" y="180" width="16" height="130" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="310" y="226" width="16" height="84" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="310" y="328" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">k=4</text>
  <text x="332" y="222" font-size="9" fill="#b85450" filter="url(#rough2)">651 峰</text>

  <!-- k=5 : 343 1.380 -> y~210 ; 651 1.308 -> y~254 -->
  <rect x="392" y="210" width="16" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="410" y="254" width="16" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="410" y="328" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">k=5</text>

  <!-- legend -->
  <rect x="70" y="350" width="14" height="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="90" y="359" font-size="10" fill="#333" filter="url(#rough2)">343：k^{1/k}（代价 k，峰在 3）</text>
  <rect x="300" y="350" width="14" height="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="320" y="359" font-size="10" fill="#333" filter="url(#rough2)">651：k^{1/(k+1)}（代价 k+1，峰在 4）</text>

  <!-- arrow showing shift 3->4 -->
  <path d="M218,90 Q260,70 300,90" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="260" y="66" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">+2 固定开销 → 峰右移</text>
</svg>
