<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="500" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：按位数分层，逐层剥离定位</text>

  <!-- ===== Row 1: 整数序列 ===== -->
  <text x="34" y="58" font-size="11" fill="#446688" font-weight="bold">整数序列</text>

  <rect x="80" y="44" width="198" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="90" y="65" font-size="11" fill="#333">1 2 3 4 5 6 7 8 9</text>

  <rect x="282" y="44" width="160" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="292" y="65" font-size="11" fill="#333">1 0 1 1 1 2 … 9 9</text>

  <rect x="446" y="44" width="110" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="456" y="65" font-size="11" fill="#333">1 0 0 …</text>

  <path d="M 290 80 Q 290 92 290 104" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Row 2: 分层信息 ===== -->
  <rect x="40" y="110" width="160" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="120" y="130" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1 位数 (d=1)</text>
  <text x="120" y="150" text-anchor="middle" font-size="11" fill="#333">范围：1 ~ 9</text>
  <text x="120" y="166" text-anchor="middle" font-size="11" fill="#333">个数：9</text>
  <text x="120" y="182" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">位数：9 × 1 = 9</text>

  <rect x="210" y="110" width="160" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="290" y="130" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2 位数 (d=2)</text>
  <text x="290" y="150" text-anchor="middle" font-size="11" fill="#333">范围：10 ~ 99</text>
  <text x="290" y="166" text-anchor="middle" font-size="11" fill="#333">个数：90</text>
  <text x="290" y="182" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">位数：90 × 2 = 180</text>

  <rect x="380" y="110" width="160" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="460" y="130" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3 位数 (d=3)</text>
  <text x="460" y="150" text-anchor="middle" font-size="11" fill="#333">范围：100 ~ 999</text>
  <text x="460" y="166" text-anchor="middle" font-size="11" fill="#333">个数：900</text>
  <text x="460" y="182" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">位数：900 × 3 = 2700</text>

  <path d="M 290 194 Q 290 206 290 218" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Row 3: 通项公式 ===== -->
  <rect x="60" y="222" width="460" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="240" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">第 d 层的总位数</text>
  <text x="290" y="258" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">count(d) = 9 × 10^(d−1) × d</text>

  <path d="M 290 268 Q 290 280 290 292" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Row 4: 三步定位策略 ===== -->
  <text x="290" y="316" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">三步定位策略</text>

  <rect x="40" y="326" width="160" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="120" y="346" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① 找位数 d</text>
  <text x="120" y="362" text-anchor="middle" font-size="10" fill="#333">n 逐层减去</text>
  <text x="120" y="376" text-anchor="middle" font-size="10" fill="#333">count(d)，直到落入某层</text>

  <rect x="210" y="326" width="160" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="290" y="346" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">② 找数字 num</text>
  <text x="290" y="362" text-anchor="middle" font-size="10" fill="#333">num = 10^(d−1)</text>
  <text x="290" y="376" text-anchor="middle" font-size="10" fill="#333">    + (n−1) // d</text>

  <rect x="380" y="326" width="160" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="460" y="346" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">③ 找数位 digit</text>
  <text x="460" y="362" text-anchor="middle" font-size="10" fill="#333">index = (n−1) % d</text>
  <text x="460" y="376" text-anchor="middle" font-size="10" fill="#333">取 str(num) 第 index 位</text>

  <path d="M 200 354 L 210 354" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 370 354 L 380 354" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Row 5: (n-1) 说明 ===== -->
  <rect x="60" y="400" width="460" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)" opacity="0.6"/>
  <text x="290" y="418" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">为什么用 (n−1) 而非 n？</text>
  <text x="290" y="434" text-anchor="middle" font-size="10" fill="#333">1-indexed → 0-indexed：第 1 位 → 第 0 个数字的第 0 位，避免边界特判</text>

  <!-- ===== Row 6: 溢出提醒 ===== -->
  <rect x="60" y="456" width="460" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)" opacity="0.6"/>
  <text x="290" y="478" text-anchor="middle" font-size="10" fill="#b85450">⚠ C++ 中 9 × 10^(d−1) × d 在 d=9 时 = 8.1×10⁹ 溢出 int，需用 long long</text>
</svg>
