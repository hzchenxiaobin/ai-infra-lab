<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="430" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一次遍历，先查再写</text>

  <!-- Start -->
  <rect x="220" y="42" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="64" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">开始</text>

  <path d="M 300 76 L 300 92" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init -->
  <rect x="150" y="94" width="300" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="113" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">初始化：cnt = {0: 1}，s = 0，ans = 0</text>
  <text x="300" y="131" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">（键 = 前缀计数 mod modulo，0:1 代表空前缀 s₀）</text>

  <path d="M 300 140 L 300 156" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop decision -->
  <polygon points="300,158 400,196 300,234 200,196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="300" y="192" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">还有元素 x ？</text>
  <text x="300" y="208" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">（遍历 nums）</text>

  <!-- No -> end -->
  <path d="M 400 196 L 470 196 L 470 318" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="432" y="188" font-size="11" fill="#999" filter="url(#rough2)">否</text>

  <!-- Yes -> step 1 -->
  <path d="M 300 234 L 300 252" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="314" y="248" font-size="11" fill="#999" filter="url(#rough2)">是</text>

  <!-- Step 1: update s -->
  <rect x="130" y="254" width="340" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="277" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">s += 1 if x % modulo == k else 0</text>

  <path d="M 300 290 L 300 308" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: query -->
  <rect x="90" y="310" width="420" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="330" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">need = (s − k + modulo) % modulo</text>
  <text x="300" y="350" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans += cnt[need]　← 先查（本步命中即贡献答案）</text>

  <path d="M 300 362 L 300 380" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: insert -->
  <rect x="90" y="382" width="420" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="405" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">cnt[s % modulo] += 1　← 再写（避免匹配到自己）</text>

  <!-- back to decision -->
  <path d="M 90 400 L 40 400 L 40 196 L 196 196" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- End -->
  <rect x="400" y="318" width="160" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="480" y="341" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">返回 ans</text>
</svg>
