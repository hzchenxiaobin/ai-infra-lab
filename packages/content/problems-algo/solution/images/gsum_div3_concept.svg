<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：按余数分桶 + 状态转移</text>

  <!-- Top: nums array with remainders -->
  <text x="40" y="62" font-size="12" fill="#888">nums:</text>
  <rect x="90" y="48" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="67" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="136" y="48" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="158" y="67" text-anchor="middle" font-size="12" fill="#333">6</text>
  <rect x="182" y="48" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="204" y="67" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="228" y="48" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="67" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="274" y="48" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="296" y="67" text-anchor="middle" font-size="12" fill="#333">8</text>

  <!-- arrows down to remainder row -->
  <path d="M 112 80 L 112 94" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 158 80 L 158 94" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 204 80 L 204 94" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 250 80 L 250 94" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 296 80 L 296 94" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- remainder row -->
  <text x="40" y="114" font-size="12" fill="#888">余数:</text>
  <rect x="90" y="100" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="119" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="136" y="100" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="158" y="119" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="182" y="100" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="204" y="119" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>
  <rect x="228" y="100" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="250" y="119" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <rect x="274" y="100" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="296" y="119" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>

  <text x="340" y="119" font-size="11" fill="#888">num%3 ∈ {0,1,2}</text>

  <!-- Divider -->
  <path d="M 40 150 L 520 150" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Middle: three state buckets -->
  <text x="280" y="174" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">三个状态：dp[0] / dp[1] / dp[2]（最大和的余数）</text>

  <!-- dp[0] bucket -->
  <rect x="70" y="196" width="120" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="130" y="220" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">dp[0]</text>
  <text x="130" y="240" text-anchor="middle" font-size="11" fill="#555">余0 最大和</text>
  <text x="130" y="262" text-anchor="middle" font-size="10.5" fill="#888">目标答案</text>

  <!-- dp[1] bucket -->
  <rect x="220" y="196" width="120" height="80" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="220" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">dp[1]</text>
  <text x="280" y="240" text-anchor="middle" font-size="11" fill="#555">余1 最大和</text>
  <text x="280" y="262" text-anchor="middle" font-size="10.5" fill="#888">中间态</text>

  <!-- dp[2] bucket -->
  <rect x="370" y="196" width="120" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="430" y="220" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">dp[2]</text>
  <text x="430" y="240" text-anchor="middle" font-size="11" fill="#555">余2 最大和</text>
  <text x="430" y="262" text-anchor="middle" font-size="10.5" fill="#888">中间态</text>

  <!-- Transitions for num with r=2 (e.g. 5): curved arrows -->
  <text x="280" y="300" text-anchor="middle" font-size="11" fill="#888">加入 num=5（余2）时的转移：</text>

  <!-- dp[0] -> dp[2] : (0+2)%3=2 -->
  <path d="M 190 230 Q 280 300 370 230" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="280" y="338" text-anchor="middle" font-size="10" fill="#b85450">dp[0]→dp[2]</text>

  <!-- dp[1] -> dp[0] : (1+2)%3=0 -->
  <path d="M 220 250 Q 160 300 190 270" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="150" y="312" text-anchor="middle" font-size="9.5" fill="#b85450">dp[1]→dp[0]</text>

  <!-- dp[2] -> dp[1] : (2+2)%3=1 -->
  <path d="M 370 250 Q 430 300 340 270" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="430" y="312" text-anchor="middle" font-size="9.5" fill="#b85450">dp[2]→dp[1]</text>

  <!-- Formula box -->
  <rect x="80" y="358" width="400" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="379" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">dp′[(i+r)%3] = max(dp′[(i+r)%3], dp[i] + num)</text>
</svg>
