<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">五个示例演算</text>

  <rect x="20" y="44" width="520" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="60" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">s</text>
  <text x="225" y="60" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">k</text>
  <text x="295" y="60" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">oddCount</text>
  <text x="350" y="60" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">n</text>
  <text x="430" y="60" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">判定</text>
  <text x="515" y="60" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">答案</text>

  <rect x="20" y="70" width="520" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="96" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">annabelle</text>
  <text x="225" y="96" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="295" y="96" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="350" y="96" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>
  <text x="430" y="96" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1≤2 且 2≤9 ✓</text>
  <text x="515" y="96" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">true</text>

  <rect x="20" y="116" width="520" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="142" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">leetcode</text>
  <text x="225" y="142" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="295" y="142" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="350" y="142" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>
  <text x="430" y="142" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">6≤3 ? 否 ✗</text>
  <text x="515" y="142" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">false</text>

  <rect x="20" y="162" width="520" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="188" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">true</text>
  <text x="225" y="188" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="295" y="188" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="350" y="188" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="430" y="188" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">4≤4 且 4≤4 ✓</text>
  <text x="515" y="188" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">true</text>

  <rect x="20" y="208" width="520" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="234" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">yzyzyzyzyzyzyzyzy</text>
  <text x="225" y="234" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="295" y="234" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="350" y="234" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">17</text>
  <text x="430" y="234" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1≤2 且 2≤17 ✓</text>
  <text x="515" y="234" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">true</text>

  <rect x="20" y="254" width="520" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="280" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">cr</text>
  <text x="225" y="280" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <text x="295" y="280" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="350" y="280" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="430" y="280" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">k≤n? 7≤2 否 ✗</text>
  <text x="515" y="280" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">false</text>

  <rect x="30" y="316" width="500" height="108" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="340" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">规律总结</text>
  <text x="50" y="362" font-size="12" fill="#333" filter="url(#rough2)">• 奇频字符过多（oddCount &gt; k）→ 槽位不够，必 false（见 leetcode, k=3）</text>
  <text x="50" y="384" font-size="12" fill="#333" filter="url(#rough2)">• 回文数过多（k &gt; n）→ 字符不够分，必 false（见 cr, k=7）</text>
  <text x="50" y="406" font-size="12" fill="#333" filter="url(#rough2)">• 其余情形两条件均满足 → true，偶频字符任意配对铺到两侧即可</text>
</svg>
