<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：ranges=[[1,3],[10,20],[2,5],[4,8]] → k=2</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">排序后 = [[1,3],[2,5],[4,8],[10,20]]；橙底 = 本轮新连通块</text>

  <!-- Table header -->
  <rect x="30" y="60" width="500" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <!-- col dividers: 90,165,250,345,465,510 -->
  <line x1="90" y1="60" x2="90" y2="92" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="165" y1="60" x2="165" y2="92" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="250" y1="60" x2="250" y2="92" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="345" y1="60" x2="345" y2="92" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="465" y1="60" x2="465" y2="92" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="60" y="80" text-anchor="middle" font-size="11" fill="#224466" font-weight="bold">步骤</text>
  <text x="127" y="80" text-anchor="middle" font-size="11" fill="#224466" font-weight="bold">cur</text>
  <text x="207" y="80" text-anchor="middle" font-size="11" fill="#224466" font-weight="bold">next</text>
  <text x="297" y="80" text-anchor="middle" font-size="11" fill="#224466" font-weight="bold">a≤curEnd?</text>
  <text x="405" y="80" text-anchor="middle" font-size="11" fill="#224466" font-weight="bold">操作</text>
  <text x="487" y="80" text-anchor="middle" font-size="11" fill="#224466" font-weight="bold">k</text>

  <!-- Row 1: [1,3] init -->
  <rect x="30" y="92" width="500" height="30" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="111" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">1</text>
  <text x="127" y="111" text-anchor="middle" font-size="11" fill="#333">[1,3]</text>
  <text x="207" y="111" text-anchor="middle" font-size="11" fill="#666">[2,5]</text>
  <rect x="255" y="94" width="84" height="26" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="297" y="111" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">2≤3 ✓</text>
  <text x="405" y="111" text-anchor="middle" font-size="10.5" fill="#666">合并 curEnd=5</text>
  <text x="487" y="111" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold">1</text>

  <!-- Row 2: [4,8] -->
  <rect x="30" y="122" width="500" height="30" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="141" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">2</text>
  <text x="127" y="141" text-anchor="middle" font-size="11" fill="#333">[1,5]</text>
  <text x="207" y="141" text-anchor="middle" font-size="11" fill="#666">[4,8]</text>
  <rect x="255" y="124" width="84" height="26" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="297" y="141" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">4≤5 ✓</text>
  <text x="405" y="141" text-anchor="middle" font-size="10.5" fill="#666">合并 curEnd=8</text>
  <text x="487" y="141" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold">1</text>

  <!-- Row 3: [10,20] new block -->
  <rect x="30" y="152" width="500" height="30" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="171" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">3</text>
  <text x="127" y="171" text-anchor="middle" font-size="11" fill="#333">[1,8]</text>
  <text x="207" y="171" text-anchor="middle" font-size="11" fill="#666">[10,20]</text>
  <rect x="255" y="154" width="84" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="297" y="171" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">10≤8 ✗</text>
  <text x="405" y="171" text-anchor="middle" font-size="10.5" fill="#666">新块 curEnd=20</text>
  <rect x="465" y="154" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="487" y="171" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>

  <!-- Row 4: end -->
  <rect x="30" y="182" width="500" height="30" fill="#f5f5f5" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="201" text-anchor="middle" font-size="11" fill="#999" font-weight="bold">末</text>
  <text x="127" y="201" text-anchor="middle" font-size="11" fill="#999">[10,20]</text>
  <text x="207" y="201" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="297" y="201" text-anchor="middle" font-size="11" fill="#999">封存</text>
  <text x="405" y="201" text-anchor="middle" font-size="10.5" fill="#999">扫描结束</text>
  <text x="487" y="201" text-anchor="middle" font-size="11" fill="#999" font-weight="bold">2</text>

  <text x="207" y="226" text-anchor="middle" font-size="9.5" fill="#b85450">↑ [1,3]与[4,8]虽不直接重叠，但经[2,5]传递 → 同一连通块</text>

  <!-- Final computation -->
  <rect x="60" y="244" width="440" height="130" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="268" text-anchor="middle" font-size="12.5" fill="#3a5a2a" font-weight="bold">最终计算</text>
  <text x="80" y="292" font-size="12" fill="#333">连通块 k = 2（{[1,3],[2,5],[4,8]} 与 {[10,20]}）</text>
  <text x="80" y="314" font-size="12" fill="#333">每个连通块独立二选一（组1 / 组2）</text>
  <text x="80" y="342" font-size="13" fill="#b85450" font-weight="bold">答案 = 2^k = 2² = 4 ✓</text>
  <text x="80" y="362" font-size="10.5" fill="#888">对照示例1 [[6,10],[5,15]]：k=1 → 2¹=2 ✓</text>
</svg>
