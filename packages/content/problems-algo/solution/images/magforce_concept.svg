<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">二分答案：间距 d 越大 → 可放球数 count(d) 越少（单调递减）</text>

  <!-- ===== Top: sorted positions with ball placement (d=3) ===== -->
  <text x="40" y="56" font-size="12" fill="#888">排序后 position = [1,2,3,4,7]，m = 3：</text>

  <!-- Gap brackets above balls -->
  <path d="M 100 82 L 100 74 L 220 74 L 220 82" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="160" y="68" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">gap = 3</text>
  <path d="M 220 82 L 220 74 L 340 74 L 340 82" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">gap = 3</text>

  <!-- Balls placed at d=3: positions 1, 4, 7 -->
  <circle cx="100" cy="100" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="100" y="105" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">●</text>
  <circle cx="220" cy="100" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="220" y="105" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">●</text>
  <circle cx="340" cy="100" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="340" y="105" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">●</text>

  <!-- Number line -->
  <line x1="80" y1="120" x2="400" y2="120" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- Position markers (small ticks) -->
  <line x1="100" y1="116" x2="100" y2="124" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="140" text-anchor="middle" font-size="11" fill="#999">1</text>
  <line x1="140" y1="116" x2="140" y2="124" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="140" y="140" text-anchor="middle" font-size="11" fill="#999">2</text>
  <line x1="180" y1="116" x2="180" y2="124" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="180" y="140" text-anchor="middle" font-size="11" fill="#999">3</text>
  <line x1="220" y1="116" x2="220" y2="124" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="220" y="140" text-anchor="middle" font-size="11" fill="#999">4</text>
  <line x1="340" y1="116" x2="340" y2="124" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="340" y="140" text-anchor="middle" font-size="11" fill="#999">7</text>

  <text x="100" y="158" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">球1</text>
  <text x="220" y="158" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">球2</text>
  <text x="340" y="158" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">球3</text>

  <!-- arrow down -->
  <path d="M 280 170 L 280 188" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="182" font-size="11" fill="#888">count(d) 单调递减</text>

  <!-- ===== Bottom: Monotonic curve ===== -->
  <!-- axes -->
  <line x1="90" y1="200" x2="90" y2="370" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="90" y1="370" x2="380" y2="370" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="84" y="206" text-anchor="end" font-size="10" fill="#888">count</text>
  <text x="384" y="374" font-size="10" fill="#888">d →</text>
  <text x="84" y="374" text-anchor="end" font-size="10" fill="#999">0</text>

  <!-- decreasing curve -->
  <path d="M 90 240 C 150 255 220 320 380 355" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="160" y="232" font-size="11" fill="#446688" font-weight="bold">d ↑ ⇒ count ↓</text>

  <!-- m threshold line -->
  <line x1="90" y1="300" x2="380" y2="300" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="384" y="304" font-size="11" fill="#b85450" font-weight="bold">m = 3</text>

  <!-- answer point at d=3, count=3 -->
  <circle cx="210" cy="300" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="210" y1="300" x2="210" y2="370" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="210" y="388" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">d = 3</text>

  <!-- feasible / infeasible labels -->
  <text x="100" y="293" font-size="10" fill="#4a7a3a">可行 ✓ (count ≥ m)</text>
  <text x="300" y="345" font-size="10" fill="#b85450">不可行 ✗ (count &lt; m)</text>

  <!-- right summary note -->
  <rect x="396" y="212" width="150" height="148" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="471" y="236" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">答案空间</text>
  <text x="471" y="258" text-anchor="middle" font-size="11" fill="#666">d ∈ [1, span/(m−1)]</text>
  <text x="471" y="280" text-anchor="middle" font-size="11" fill="#666">求最大的 d</text>
  <text x="471" y="298" text-anchor="middle" font-size="11" fill="#666">使 count(d) ≥ m</text>
  <text x="471" y="324" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">单调 ⇒ 可二分！</text>
  <text x="471" y="346" text-anchor="middle" font-size="10" fill="#888">最大化最小值</text>
</svg>
