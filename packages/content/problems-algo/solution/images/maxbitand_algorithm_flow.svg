<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一次遍历求 max + 统计 max 最长连续段（O(n)）</text>

  <!-- Init -->
  <rect x="180" y="38" width="200" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="58" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">mx = max(nums)</text>
  <text x="280" y="75" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">cur = 0, ans = 0</text>
  <path d="M 280 84 L 280 96" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond1: i < n ? -->
  <polygon points="280,96 356,124 280,152 204,124" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="128" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">i &lt; n ?</text>

  <!-- Yes branch (down) to Diamond2 -->
  <text x="288" y="166" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 280 152 L 280 170" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- No branch (right) -> exit -->
  <text x="362" y="118" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 356 124 L 394 124 L 394 124" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- exit path down right edge to return box -->
  <path d="M 394 124 L 548 124 L 548 370 L 352 370" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="500" y="250" font-size="10" fill="#888" filter="url(#rough2)">遍历结束</text>

  <!-- Diamond2: nums[i] == mx ? -->
  <polygon points="280,170 360,196 280,222 200,196" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="200" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">nums[i] == mx ?</text>

  <!-- Yes (right) -> green box -->
  <text x="366" y="190" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 360 196 L 398 196" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="400" y="178" width="140" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="470" y="200" text-anchor="middle" font-size="11" fill="#2f5a22" font-weight="bold" filter="url(#rough2)">cur++; ans=max(ans,cur)</text>

  <!-- No (left) -> pink box -->
  <text x="172" y="190" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 200 196 L 160 196" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="20" y="178" width="120" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="80" y="200" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">cur = 0</text>

  <!-- i++ box -->
  <rect x="244" y="250" width="72" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="270" text-anchor="middle" font-size="12" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">i++</text>

  <!-- green box -> i++ (right side) -->
  <path d="M 470 214 L 470 265 L 316 265" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- pink box -> i++ (left side) -->
  <path d="M 80 214 L 80 265 L 244 265" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- loopback from i++ to Diamond1 left point -->
  <path d="M 280 280 L 280 300 L 10 300 L 10 124 L 204 124" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="18" y="210" font-size="10" fill="#4a7a3a" filter="url(#rough2)">下一 i</text>

  <!-- return ans -->
  <rect x="210" y="353" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="375" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">return ans</text>
</svg>
