<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一趟扫描 —— 字母压栈，数字弹栈</text>

  <!-- start -->
  <rect x="228" y="30" width="64" height="24" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="46" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">开始</text>

  <path d="M 260 54 L 260 64" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- fetch char -->
  <rect x="180" y="66" width="160" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="85" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">取出下一个字符 c</text>

  <!-- exit path -->
  <path d="M 340 81 L 372 81" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="356" y="72" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">扫描结束</text>

  <rect x="374" y="66" width="132" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="440" y="85" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 st（底→顶拼接）</text>

  <path d="M 440 96 L 440 112" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="408" y="114" width="64" height="24" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="440" y="130" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">结束</text>
  <text x="440" y="152" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">⭐ 无需反转</text>

  <!-- main path to diamond -->
  <path d="M 260 96 L 260 106" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond -->
  <polygon points="260,108 330,144 260,180 190,144" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="149" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">c 是数字？</text>

  <!-- yes branch -->
  <path d="M 190 144 L 150 144 L 150 184" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="172" y="137" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="75" y="186" width="150" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="206" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">弹出栈顶字母（配对删除）</text>

  <!-- no branch -->
  <path d="M 330 144 L 370 144 L 370 184" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="348" y="137" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="305" y="186" width="130" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="370" y="206" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">字母 c 压栈</text>

  <!-- loop back -->
  <path d="M 150 218 L 150 268 L 52 268 L 52 81 L 178 81" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 370 218 L 370 268 L 153 268" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="100" y="284" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">循环取下一字符</text>

  <!-- invariant note -->
  <rect x="70" y="300" width="380" height="54" rx="8" fill="#fafafa" stroke="#999" stroke-width="1.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="322" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">不变量：栈中只存「尚未配对的字母」，且保持原相对顺序</text>
  <text x="260" y="344" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">数据保证可解 → 遇数字时栈必非空，弹栈顶 = 删「左边最近的幸存字母」</text>
</svg>
