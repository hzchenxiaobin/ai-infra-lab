<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)" font-weight="bold">核心结构：参数嵌套 Map trie（按 === 判等）</text>

  <!-- ===== Trie 主干：memo(a, b) 的下钻路径 ===== -->
  <rect x="40" y="58" width="480" height="150" rx="8" fill="none" stroke="#446688" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="56" y="78" font-size="13" fill="#446688" filter="url(#rough2)" font-weight="bold">memo(a, b)：沿参数逐层下钻，叶子存结果</text>

  <!-- root Map -->
  <rect x="56" y="98" width="96" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="104" y="125" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)" font-weight="bold">root Map</text>

  <!-- arrow root -> M_a, label a -->
  <path d="M 152 121 L 214 121" fill="none" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="183" y="112" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)" font-weight="bold">a</text>

  <!-- M_a intermediate Map -->
  <rect x="216" y="98" width="74" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="253" y="125" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)" font-weight="bold">Map</text>

  <!-- arrow M_a -> leaf, label b -->
  <path d="M 290 121 L 352 121" fill="none" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="321" y="112" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)" font-weight="bold">b</text>

  <!-- leaf Map with RESULT sentinel -->
  <rect x="354" y="92" width="158" height="58" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="433" y="112" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)" font-weight="bold">叶子 Map</text>
  <rect x="366" y="118" width="134" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="433" y="135" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">★ RESULT = fn(a,b)</text>

  <!-- note about sentinel -->
  <text x="104" y="170" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">私有哨兵 Symbol</text>
  <text x="433" y="170" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">与导航键隔离，互不冲突</text>

  <!-- ===== 底部对比：示例2 vs 示例3 ===== -->
  <text x="280" y="232" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)" font-weight="bold">对象参数的 === 判等：示例2 vs 示例3</text>

  <!-- 示例2 row (red, miss) -->
  <rect x="40" y="246" width="480" height="74" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="56" y="266" font-size="12" fill="#b85450" filter="url(#rough2)" font-weight="bold">示例2：每次新建 {} ，引用不同 → 不同叶子 → 全未命中（calls 1,2,3）</text>

  <rect x="56" y="276" width="40" height="30" rx="5" fill="#fff" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="296" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{}</text>
  <path d="M 98 291 L 132 291" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="134" y="276" width="58" height="30" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="163" y="296" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">leaf₁ ✗</text>

  <rect x="220" y="276" width="40" height="30" rx="5" fill="#fff" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="240" y="296" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{}</text>
  <path d="M 262 291 L 296 291" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="298" y="276" width="58" height="30" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="327" y="296" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">leaf₂ ✗</text>

  <rect x="384" y="276" width="40" height="30" rx="5" fill="#fff" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="404" y="296" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{}</text>
  <path d="M 426 291 L 460 291" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="462" y="276" width="50" height="30" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="487" y="296" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">leaf₃ ✗</text>

  <!-- 示例3 row (green, hit) -->
  <rect x="40" y="328" width="480" height="70" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="56" y="348" font-size="12" fill="#4a7a3a" filter="url(#rough2)" font-weight="bold">示例3：同一个 o ，引用相同 → 同一叶子 → 第2、3次命中（calls 保持 1）</text>

  <rect x="56" y="358" width="40" height="30" rx="5" fill="#fff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="378" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">o</text>
  <path d="M 98 373 L 132 373" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="134" y="358" width="70" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="169" y="378" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)" font-weight="bold">leaf ✓ 写</text>

  <rect x="230" y="358" width="40" height="30" rx="5" fill="#fff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="250" y="378" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">o</text>
  <path d="M 272 373 L 306 373" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="320" y="378" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)" font-weight="bold">命中 ✓</text>

  <rect x="404" y="358" width="40" height="30" rx="5" fill="#fff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="424" y="378" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">o</text>
  <path d="M 446 373 L 480 373" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="494" y="378" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)" font-weight="bold">命中 ✓</text>
</svg>
