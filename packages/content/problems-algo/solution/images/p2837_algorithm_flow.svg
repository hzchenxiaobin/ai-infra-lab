<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">四步流水线：连接 → 分组 → 兜底 → 排序</text>

  <rect x="50" y="44" width="440" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="70" y="64" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">① LEFT JOIN 连接两表</text>
  <text x="70" y="84" font-size="11" fill="#333" font-family="monospace" filter="url(#rough2)">Users LEFT JOIN Rides USING (user_id)</text>
  <text x="70" y="104" font-size="11" fill="#999" filter="url(#rough2)">左表全保留，没打车的用户补 NULL 行</text>

  <path d="M 270 114 L 270 132" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="50" y="132" width="440" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="70" y="152" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 按用户分组求和</text>
  <text x="70" y="172" font-size="11" fill="#333" font-family="monospace" filter="url(#rough2)">GROUP BY user_id, name</text>
  <text x="70" y="192" font-size="11" fill="#999" filter="url(#rough2)">每个用户的多条行程折叠成一行</text>

  <path d="M 270 202 L 270 220" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="50" y="220" width="440" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="70" y="240" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">③ NULL 兜底为 0</text>
  <text x="70" y="260" font-size="11" fill="#333" font-family="monospace" filter="url(#rough2)">IFNULL(SUM(distance), 0)</text>
  <text x="70" y="280" font-size="11" fill="#999" filter="url(#rough2)">没打车的用户距离记 0，而不是 NULL</text>

  <path d="M 270 290 L 270 308" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="50" y="308" width="440" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="70" y="328" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">④ 按 user_id 升序输出</text>
  <text x="70" y="348" font-size="11" fill="#333" font-family="monospace" filter="url(#rough2)">ORDER BY user_id</text>
  <text x="70" y="368" font-size="11" fill="#999" filter="url(#rough2)">输出 user_id、name、traveled distance 三列</text>

  <text x="270" y="416" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">坑点：列名 traveled distance 带空格，要加反引号 `traveled distance`</text>
</svg>
