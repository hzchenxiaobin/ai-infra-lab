<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrL" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">
    算法流程：逐层提取 → 取模旋转 → 写回
  </text>

  <!-- Step 1: Input -->
  <rect x="110" y="42" width="300" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="60" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">输入 m×n 矩阵 grid, 整数 k</text>
  <text x="260" y="76" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">m, n 均为偶数, 2 ≤ m,n ≤ 50</text>

  <path d="M 260 90 L 260 110" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: For each layer -->
  <rect x="110" y="112" width="300" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="130" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">遍历每一层 layer = 0 … min(m,n)/2−1</text>
  <text x="260" y="146" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每层独立处理，互不影响</text>

  <path d="M 260 160 L 260 180" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 3: Extract ring -->
  <rect x="110" y="182" width="300" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="200" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">顺时针提取环 → ring[]</text>
  <text x="260" y="216" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">上边→右边→下边(逆)→左边(逆)</text>

  <path d="M 260 230 L 260 250" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 4: Mod + Rotate -->
  <rect x="110" y="252" width="300" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="270" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">shift = k % len(ring), 左移 shift 位</text>
  <text x="260" y="286" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">k 可达 10⁹，取模避免无效旋转</text>

  <path d="M 260 300 L 260 320" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 5: Write back + return -->
  <rect x="110" y="322" width="300" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="340" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">顺时针写回矩阵, 返回结果</text>
  <text x="260" y="356" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">按提取顺序填回对应位置</text>

  <!-- Loop arrow: right side from step 5 back to step 2 -->
  <path d="M 410 344 L 450 344 L 450 134 L 412 134" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="462" y="240" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)" transform="rotate(90, 462, 240)">下一层</text>
</svg>
