<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "ababab"（true）与 s = "aba"（false）</text>

  <text x="40" y="58" font-size="12.5" fill="#446688" font-weight="bold">例 1：s = "ababab"，n = 6</text>

  <rect x="120" y="70" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="92" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="160" y="70" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="92" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>
  <rect x="200" y="70" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="92" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="240" y="70" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="92" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>
  <rect x="280" y="70" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="92" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="320" y="70" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="92" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>

  <text x="140" y="116" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="180" y="116" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="220" y="116" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="260" y="116" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="300" y="116" text-anchor="middle" font-size="9" fill="#888">4</text>
  <text x="340" y="116" text-anchor="middle" font-size="9" fill="#888">5</text>

  <rect x="380" y="70" width="36" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="398" y="84" text-anchor="middle" font-size="10" fill="#666">lps</text>
  <text x="398" y="98" text-anchor="middle" font-size="10" fill="#666">值</text>

  <rect x="120" y="124" width="40" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="140" y="140" text-anchor="middle" font-size="11" fill="#666">0</text>
  <rect x="160" y="124" width="40" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="180" y="140" text-anchor="middle" font-size="11" fill="#666">0</text>
  <rect x="200" y="124" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="220" y="140" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="240" y="124" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="260" y="140" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="280" y="124" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="300" y="140" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="320" y="124" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="340" y="140" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">4</text>

  <rect x="60" y="160" width="460" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="178" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">p = 6 − 4 = 2，6 % 2 == 0 → true（"ab" × 3）</text>

  <text x="40" y="220" font-size="12.5" fill="#b85450" font-weight="bold">例 2：s = "aba"，n = 3</text>

  <rect x="160" y="232" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="254" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="200" y="232" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="254" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>
  <rect x="240" y="232" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="254" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>

  <text x="180" y="278" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="220" y="278" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="260" y="278" text-anchor="middle" font-size="9" fill="#888">2</text>

  <rect x="300" y="232" width="36" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="318" y="246" text-anchor="middle" font-size="10" fill="#666">lps</text>
  <text x="318" y="260" text-anchor="middle" font-size="10" fill="#666">值</text>

  <rect x="160" y="286" width="40" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="180" y="302" text-anchor="middle" font-size="11" fill="#666">0</text>
  <rect x="200" y="286" width="40" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="220" y="302" text-anchor="middle" font-size="11" fill="#666">0</text>
  <rect x="240" y="286" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="260" y="302" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>

  <rect x="60" y="322" width="460" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="340" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">p = 3 − 1 = 2，但 3 % 2 = 1 ≠ 0 → false</text>

  <rect x="60" y="368" width="460" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="386" text-anchor="middle" font-size="11.5" fill="#444">⚠️ "aba" 以 2 为周期（有相同前后缀 "a"），但 2 不整除 3</text>
  <text x="290" y="402" text-anchor="middle" font-size="11.5" fill="#444">「周期」≠「整除重复」——必须同时满足 p &lt; n 且 p | n</text>
</svg>
