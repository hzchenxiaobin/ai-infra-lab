<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="340" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：一轮「标记→粉碎→下落」</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">board = [[1,1,1,5],[2,3,4,5],[2,3,4,5]]</text>

  <!-- ============ GRID 1: 初始 ============ gridX=20, cell 30x28, y=80 -->
  <!-- row0: 1 1 1 5 ; (0,0..2) blue, (0,3) green -->
  <rect x="20" y="80" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="35" y="99" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">1</text>
  <rect x="50" y="80" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="65" y="99" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">1</text>
  <rect x="80" y="80" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="95" y="99" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">1</text>
  <rect x="110" y="80" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="125" y="99" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">5</text>
  <!-- row1: 2 3 4 5 ; (1,3) green -->
  <rect x="20" y="108" width="30" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="35" y="127" text-anchor="middle" font-size="11.5" fill="#555">2</text>
  <rect x="50" y="108" width="30" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="65" y="127" text-anchor="middle" font-size="11.5" fill="#555">3</text>
  <rect x="80" y="108" width="30" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="95" y="127" text-anchor="middle" font-size="11.5" fill="#555">4</text>
  <rect x="110" y="108" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="125" y="127" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">5</text>
  <!-- row2: 2 3 4 5 ; (2,3) green -->
  <rect x="20" y="136" width="30" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="35" y="155" text-anchor="middle" font-size="11.5" fill="#555">2</text>
  <rect x="50" y="136" width="30" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="65" y="155" text-anchor="middle" font-size="11.5" fill="#555">3</text>
  <rect x="80" y="136" width="30" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="95" y="155" text-anchor="middle" font-size="11.5" fill="#555">4</text>
  <rect x="110" y="136" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="125" y="155" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">5</text>
  <text x="80" y="182" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">① 初始</text>
  <text x="80" y="196" text-anchor="middle" font-size="9.5" fill="#888">行0:[1,1,1] 列3:[5,5,5]</text>

  <!-- arrow 1->2 -->
  <path d="M 148 122 L 168 122" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ============ GRID 2: 标记(取负) ============ gridX=170 -->
  <!-- row0: -1 -1 -1 -5 -->
  <rect x="170" y="80" width="30" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="185" y="99" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">-1</text>
  <rect x="200" y="80" width="30" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="215" y="99" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">-1</text>
  <rect x="230" y="80" width="30" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="245" y="99" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">-1</text>
  <rect x="260" y="80" width="30" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="275" y="99" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">-5</text>
  <!-- row1: 2 3 4 -5 -->
  <rect x="170" y="108" width="30" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="185" y="127" text-anchor="middle" font-size="11.5" fill="#555">2</text>
  <rect x="200" y="108" width="30" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="215" y="127" text-anchor="middle" font-size="11.5" fill="#555">3</text>
  <rect x="230" y="108" width="30" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="245" y="127" text-anchor="middle" font-size="11.5" fill="#555">4</text>
  <rect x="260" y="108" width="30" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="275" y="127" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">-5</text>
  <!-- row2: 2 3 4 -5 -->
  <rect x="170" y="136" width="30" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="185" y="155" text-anchor="middle" font-size="11.5" fill="#555">2</text>
  <rect x="200" y="136" width="30" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="215" y="155" text-anchor="middle" font-size="11.5" fill="#555">3</text>
  <rect x="230" y="136" width="30" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="245" y="155" text-anchor="middle" font-size="11.5" fill="#555">4</text>
  <rect x="260" y="136" width="30" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="275" y="155" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">-5</text>
  <text x="230" y="182" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">② 标记(取负)</text>
  <text x="230" y="196" text-anchor="middle" font-size="9.5" fill="#888">命中格同赋 -v</text>

  <!-- arrow 2->3 -->
  <path d="M 298 122 L 318 122" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ============ GRID 3: 粉碎+下落后 ============ gridX=320 -->
  <!-- row0: 0 0 0 0 -->
  <rect x="320" y="80" width="30" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="335" y="99" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <rect x="350" y="80" width="30" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="365" y="99" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <rect x="380" y="80" width="30" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="395" y="99" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <rect x="410" y="80" width="30" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="425" y="99" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <!-- row1: 2 3 4 0 -->
  <rect x="320" y="108" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="335" y="127" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">2</text>
  <rect x="350" y="108" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="365" y="127" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">3</text>
  <rect x="380" y="108" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="395" y="127" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">4</text>
  <rect x="410" y="108" width="30" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="425" y="127" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <!-- row2: 2 3 4 0 -->
  <rect x="320" y="136" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="335" y="155" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">2</text>
  <rect x="350" y="136" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="365" y="155" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">3</text>
  <rect x="380" y="136" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="395" y="155" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">4</text>
  <rect x="410" y="136" width="30" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="425" y="155" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <text x="380" y="182" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">③ 粉碎+下落</text>
  <text x="380" y="196" text-anchor="middle" font-size="9.5" fill="#888">每列 &gt;0 压到底</text>

  <!-- arrow 3->4 -->
  <path d="M 448 122 L 468 122" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ============ GRID 4: 再扫→稳定 ============ gridX=470 (same as grid3 values) -->
  <rect x="470" y="80" width="30" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="485" y="99" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <rect x="500" y="80" width="30" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="515" y="99" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <rect x="530" y="80" width="30" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="545" y="99" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <rect x="560" y="80" width="30" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="575" y="99" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <rect x="470" y="108" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="485" y="127" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">2</text>
  <rect x="500" y="108" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="515" y="127" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">3</text>
  <rect x="530" y="108" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="545" y="127" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">4</text>
  <rect x="560" y="108" width="30" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="575" y="127" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <rect x="470" y="136" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="485" y="155" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">2</text>
  <rect x="500" y="136" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="515" y="155" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">3</text>
  <rect x="530" y="136" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="545" y="155" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">4</text>
  <rect x="560" y="136" width="30" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="575" y="155" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <text x="530" y="182" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">④ 再扫：无变化</text>
  <text x="530" y="196" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">✓ 稳定，返回</text>

  <!-- ============ bottom note ============ -->
  <rect x="40" y="216" width="520" height="112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="58" y="240" font-size="12" fill="#d6a040" font-weight="bold">关键点</text>
  <text x="58" y="262" font-size="11" fill="#555">① 行、列两个方向各扫一遍才构成「一轮」；本例行 0 命中 [1,1,1]、列 3 命中 [5,5,5]，互不干扰。</text>
  <text x="58" y="280" font-size="11" fill="#555">② 标记与粉碎合并：下落时只保留 &gt; 0 的格，负值与原 0 一并当空格——少一趟单独的「置 0」循环。</text>
  <text x="58" y="298" font-size="11" fill="#555">③ 下落后可能产生新的三元组（连锁），故用 changed 标志驱动 while 循环，直到某轮无命中。</text>
  <text x="58" y="316" font-size="11" fill="#b85450" font-weight="bold">本例第二轮无任何 ≥3 同值组 → changed=false → 返回 ③ 的状态。</text>
</svg>
