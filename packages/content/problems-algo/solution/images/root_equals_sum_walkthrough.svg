<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="360" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：true 与 false 各一例</text>

  <!-- 示例 1 -->
  <text x="130" y="58" text-anchor="middle" font-size="12" fill="#888">示例 1：root = [10,4,6]</text>
  <circle cx="130" cy="92" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="130" y="97" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">10</text>
  <circle cx="80" cy="160" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="80" y="165" text-anchor="middle" font-size="11" fill="#333">4</text>
  <line x1="118" y1="106" x2="92" y2="146" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="180" cy="160" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="165" text-anchor="middle" font-size="11" fill="#333">6</text>
  <line x1="142" y1="106" x2="168" y2="146" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>

  <text x="130" y="200" text-anchor="middle" font-size="11" fill="#555">4 + 6 = 10</text>
  <text x="130" y="218" text-anchor="middle" font-size="11" fill="#555">10 == 10 ✓</text>
  <rect x="80" y="232" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="130" y="253" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">return true</text>

  <!-- 分隔 -->
  <line x1="290" y1="50" x2="290" y2="280" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- 示例 2 -->
  <text x="450" y="58" text-anchor="middle" font-size="12" fill="#888">示例 2：root = [5,3,1]</text>
  <circle cx="450" cy="92" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="450" y="97" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <circle cx="400" cy="160" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="400" y="165" text-anchor="middle" font-size="11" fill="#333">3</text>
  <line x1="438" y1="106" x2="412" y2="146" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="500" cy="160" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="500" y="165" text-anchor="middle" font-size="11" fill="#333">1</text>
  <line x1="462" y1="106" x2="488" y2="146" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>

  <text x="450" y="200" text-anchor="middle" font-size="11" fill="#555">3 + 1 = 4</text>
  <text x="450" y="218" text-anchor="middle" font-size="11" fill="#555">5 != 4 ✗</text>
  <rect x="400" y="232" width="100" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="450" y="253" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">return false</text>

  <!-- 底部说明 -->
  <rect x="60" y="290" width="460" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="312" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">关键点</text>
  <text x="80" y="332" font-size="11" fill="#555">题目保证树恰有 3 个节点，root.left / root.right 必非空，直接取值比较即可</text>
</svg>
