<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrGray" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#999"/>
    </marker>
    <marker id="arrBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- ================= TOP: brute force per-dollar ================= -->
  <text x="280" y="24" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">暴力：逐元线性扫描 —— 每个 $1 重新查找所属税级</text>

  <!-- 10 dollar circles, colored by bracket -->
  <!-- blue 1,2,3 -->
  <circle cx="85" cy="78" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="85" y="82" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">$1</text>
  <circle cx="129" cy="78" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="129" y="82" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">$2</text>
  <circle cx="173" cy="78" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="173" y="82" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">$3</text>
  <!-- green 4,5,6,7 -->
  <circle cx="217" cy="78" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="217" y="82" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">$4</text>
  <circle cx="261" cy="78" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="261" y="82" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">$5</text>
  <circle cx="305" cy="78" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="305" y="82" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">$6</text>
  <circle cx="349" cy="78" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="349" y="82" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">$7</text>
  <!-- orange 8,9,10 -->
  <circle cx="393" cy="78" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="393" y="82" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">$8</text>
  <circle cx="437" cy="78" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="437" y="82" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">$9</text>
  <circle cx="481" cy="78" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="481" y="82" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">$10</text>

  <!-- 10 scan arrows down to brackets bar -->
  <path d="M 85 91 L 85 122" stroke="#999" stroke-width="1" fill="none" marker-end="url(#arrGray)" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <path d="M 129 91 L 129 122" stroke="#999" stroke-width="1" fill="none" marker-end="url(#arrGray)" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <path d="M 173 91 L 173 122" stroke="#999" stroke-width="1" fill="none" marker-end="url(#arrGray)" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <path d="M 217 91 L 217 122" stroke="#999" stroke-width="1" fill="none" marker-end="url(#arrGray)" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <path d="M 261 91 L 261 122" stroke="#999" stroke-width="1" fill="none" marker-end="url(#arrGray)" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <path d="M 305 91 L 305 122" stroke="#999" stroke-width="1" fill="none" marker-end="url(#arrGray)" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <path d="M 349 91 L 349 122" stroke="#999" stroke-width="1" fill="none" marker-end="url(#arrGray)" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <path d="M 393 91 L 393 122" stroke="#999" stroke-width="1" fill="none" marker-end="url(#arrGray)" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <path d="M 437 91 L 437 122" stroke="#999" stroke-width="1" fill="none" marker-end="url(#arrGray)" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <path d="M 481 91 L 481 122" stroke="#999" stroke-width="1" fill="none" marker-end="url(#arrGray)" stroke-dasharray="3 2" filter="url(#rough2)"/>

  <!-- brackets bar -->
  <rect x="70" y="126" width="105" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="122" y="143" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">≤3 → 50%</text>
  <rect x="175" y="126" width="140" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="245" y="143" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">≤7 → 10%</text>
  <rect x="315" y="126" width="176" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="403" y="143" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">≤12 → 25%</text>

  <text x="280" y="172" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">每个 $1 独立线性扫描 → 共 income × n 次比较</text>
  <rect x="430" y="178" width="78" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="469" y="191" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">O(income·n)</text>

  <!-- divider -->
  <line x1="40" y1="208" x2="520" y2="208" stroke="#ddd" stroke-width="1.4" stroke-dasharray="6 4" filter="url(#rough2)"/>

  <!-- ================= BOTTOM: optimal batch ================= -->
  <text x="280" y="232" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">优化：按段批量 —— 相邻 $1 同段，直接算元数</text>

  <!-- 3 segment blocks with counts (capped at income=10) -->
  <rect x="70" y="250" width="105" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="122" y="270" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3 元</text>
  <text x="122" y="286" text-anchor="middle" font-size="10.5" fill="#446688">× 50%</text>
  <rect x="175" y="250" width="140" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="245" y="270" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4 元</text>
  <text x="245" y="286" text-anchor="middle" font-size="10.5" fill="#4a7a3a">× 10%</text>
  <rect x="315" y="250" width="105" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="367" y="270" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3 元</text>
  <text x="367" y="286" text-anchor="middle" font-size="10.5" fill="#d6a040">× 25%</text>
  <!-- beyond income grayed -->
  <rect x="420" y="250" width="71" height="44" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="6" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="455" y="276" text-anchor="middle" font-size="10" fill="#999">不计</text>

  <!-- 3 arrows up to brackets -->
  <path d="M 122 250 L 122 158" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <path d="M 245 250 L 245 158" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <path d="M 367 250 L 367 158" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <text x="280" y="316" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">每段元数 = min(income, upper) − prev，一段一次乘法</text>
  <rect x="430" y="322" width="78" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="469" y="335" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">O(n)</text>

  <!-- bottom note -->
  <rect x="30" y="348" width="500" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="363" text-anchor="middle" font-size="10.5" fill="#333">关键：税级升序 ⟹ 收入轴被切成连续段，相邻 $1 必属同段，逐元查重为冗余</text>
</svg>
