<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 600" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="600" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：四段式判定</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">按钱量分四种情形，逐条短路返回</text>

  <!-- start -->
  <rect x="190" y="56" width="160" height="30" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="76" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">输入 money, children</text>
  <line x1="270" y1="90" x2="270" y2="108" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Q1: money < children ? -->
  <polygon points="270,110 410,160 270,210 130,160" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="156" text-anchor="middle" font-size="11.5" fill="#333">money &lt; children ?</text>
  <text x="270" y="172" text-anchor="middle" font-size="10" fill="#888">钱不够每人发 1</text>
  <!-- yes -> -1 -->
  <text x="425" y="156" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <path d="M 410 160 L 452 160" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <rect x="454" y="146" width="70" height="28" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="489" y="165" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold">return −1</text>
  <!-- no -->
  <text x="120" y="156" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <line x1="130" y1="160" x2="90" y2="160" stroke="#666" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 90 160 L 90 230 L 270 230" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Q2: money > 8*children ? -->
  <polygon points="270,232 410,282 270,332 130,282" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="278" text-anchor="middle" font-size="11.5" fill="#333">money &gt; 8×children ?</text>
  <text x="270" y="294" text-anchor="middle" font-size="10" fill="#888">钱太多，塞不下</text>
  <!-- yes -> children-1 -->
  <text x="425" y="282" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <path d="M 410 282 L 452 282" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <rect x="454" y="266" width="74" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="491" y="280" text-anchor="middle" font-size="10.5" fill="#7a5a20">最后 1 人吞</text>
  <text x="491" y="293" text-anchor="middle" font-size="11.5" fill="#7a5a20" font-weight="bold">return c−1</text>
  <!-- no -->
  <text x="120" y="282" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <line x1="130" y1="282" x2="90" y2="282" stroke="#666" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 90 282 L 90 352 L 270 352" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- compute k, leftover -->
  <rect x="150" y="354" width="240" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="372" text-anchor="middle" font-size="11.5" fill="#333">k = (money − children) ÷ 7</text>
  <text x="270" y="388" text-anchor="middle" font-size="11" fill="#446688">leftover = (money − children) mod 7</text>
  <line x1="270" y1="398" x2="270" y2="416" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Q3: r==1 and leftover==3 ? -->
  <polygon points="270,418 410,468 270,518 130,468" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="460" text-anchor="middle" font-size="11" fill="#333">r == 1 且</text>
  <text x="270" y="476" text-anchor="middle" font-size="11" fill="#333">leftover == 3 ?</text>
  <text x="270" y="492" text-anchor="middle" font-size="9.5" fill="#888">（r = children − k）零头逼出 4</text>
  <!-- yes -> k-1 -->
  <text x="425" y="468" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <path d="M 410 468 L 452 468" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <rect x="454" y="452" width="74" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="491" y="466" text-anchor="middle" font-size="10" fill="#b03a3a">少点亮 1 个</text>
  <text x="491" y="479" text-anchor="middle" font-size="11.5" fill="#b03a3a" font-weight="bold">return k−1</text>
  <!-- no -> k -->
  <text x="120" y="468" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <line x1="130" y1="468" x2="60" y2="468" stroke="#666" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 60 468 L 60 540 L 270 540" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- return k -->
  <rect x="190" y="546" width="160" height="34" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="568" text-anchor="middle" font-size="13" fill="#3a5a2a" font-weight="bold">return k</text>
</svg>
