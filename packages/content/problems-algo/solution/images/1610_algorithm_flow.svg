<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：极角化 → 排序拼接 → 滑动窗口</text>

  <!-- Step 1 -->
  <rect x="40" y="50" width="480" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="72" font-size="12" fill="#333" font-weight="bold">Step 1  遍历 points，分两类</text>
  <text x="56" y="90" font-size="11" fill="#444">与 location 重合 → extra++ ；否则算 θ=atan2(dy,dx)（°），归一化到 [0,360)</text>

  <path d="M280,104 L280,124" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="40" y="128" width="480" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="150" font-size="12" fill="#333" font-weight="bold">Step 2  排序 angles</text>
  <text x="56" y="168" font-size="11" fill="#444">升序排；再把每个 θ 复制一份 +360 拼到尾部（处理跨 0°/360° 的扇区）</text>

  <path d="M280,182 L280,202" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: sliding window loop -->
  <rect x="40" y="206" width="480" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="56" y="228" font-size="12" fill="#333" font-weight="bold">Step 3  双指针滑窗 l=0, 遍历 r</text>
  <text x="56" y="246" font-size="11" fill="#444">while angles[r] − angles[l] &gt; angle ：l++</text>
  <text x="56" y="264" font-size="11" fill="#444">ans = max(ans, r − l + 1)</text>
  <text x="56" y="280" font-size="10.5" fill="#888">（窗口内角度跨度 ≤ angle，所有点都落在同一扇区内）</text>

  <path d="M280,286 L280,306" fill="none" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: all points same as location? -->
  <polygon points="280,310 410,360 280,410 150,360" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">angles 为空？</text>
  <text x="280" y="368" text-anchor="middle" font-size="10.5" fill="#666">（所有点都在 location）</text>

  <!-- yes branch -->
  <path d="M150,360 L80,360 L80,400" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="110" y="354" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="30" y="400" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="80" y="416" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return extra</text>
  <text x="80" y="428" text-anchor="middle" font-size="9" fill="#888">（窗口无意义）</text>

  <!-- no branch -->
  <path d="M410,360 L480,360 L480,400" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="450" y="354" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">否</text>
  <rect x="416" y="400" width="128" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="480" y="416" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">return ans + extra</text>
  <text x="480" y="428" text-anchor="middle" font-size="9" fill="#888">窗口最大值 + 重合点</text>

  <!-- right side note -->
  <rect x="430" y="50" width="0" height="0" fill="none"/>
</svg>
