<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arL" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="760" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="380" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">两种格式 = 前缀二选一 + 公共后缀</text>
  <path d="M 210 44 Q 380 52 550 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Row labels -->
  <text x="44" y="132" font-size="12" fill="#888">格式 A</text>
  <text x="44" y="222" font-size="12" fill="#888">格式 B</text>

  <!-- ============ Format A row ============ -->
  <!-- Prefix A (blue) -->
  <g filter="url(#sk)">
    <rect x="90" y="100" width="150" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="165" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">前缀 A</text>
  <text x="165" y="146" text-anchor="middle" font-size="15" fill="#446688" font-family="'Courier New',monospace">xxx-</text>

  <!-- Suffix A (green) -->
  <g filter="url(#sk)">
    <rect x="330" y="100" width="240" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="450" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">后缀（公共）</text>
  <text x="450" y="146" text-anchor="middle" font-size="15" fill="#4a7a3a" font-family="'Courier New',monospace">xxx-xxxx</text>

  <!-- connector A -->
  <path d="M 240 129 L 328 129" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arL)" filter="url(#sk)" stroke-dasharray="4 3"/>

  <!-- ============ Format B row ============ -->
  <!-- Prefix B (orange, wider) -->
  <g filter="url(#sk)">
    <rect x="90" y="190" width="210" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="195" y="214" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">前缀 B（含尾空格）</text>
  <text x="195" y="236" text-anchor="middle" font-size="15" fill="#d6a040" font-family="'Courier New',monospace">(xxx) + 空格</text>

  <!-- Suffix B (green) -->
  <g filter="url(#sk)">
    <rect x="330" y="190" width="240" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="450" y="214" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">后缀（公共）</text>
  <text x="450" y="236" text-anchor="middle" font-size="15" fill="#4a7a3a" font-family="'Courier New',monospace">xxx-xxxx</text>

  <!-- connector B -->
  <path d="M 300 219 L 328 219" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arL)" filter="url(#sk)" stroke-dasharray="4 3"/>

  <!-- Annotations -->
  <text x="180" y="284" text-anchor="middle" font-size="12" fill="#b85450">↑ 前缀不同（二选一）</text>
  <text x="450" y="284" text-anchor="middle" font-size="12" fill="#2e6e2e">↑ 后缀完全相同（提取公因式）</text>

  <!-- Combined regex formula box -->
  <g filter="url(#sk)">
    <rect x="60" y="300" width="640" height="78" rx="10" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="4 3"/>
  </g>
  <text x="380" y="324" text-anchor="middle" font-size="12" fill="#888">合并 →  ^ ( 前缀A | 前缀B ) 后缀 $</text>
  <text x="380" y="354" text-anchor="middle" font-size="16" fill="#2b2b2b" font-family="'Courier New',monospace">^([0-9]{3}-|\([0-9]{3}\) )[0-9]{3}-[0-9]{4}$</text>
</svg>
