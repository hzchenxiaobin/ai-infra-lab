<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心思路：小根堆只留最大的 K 个，堆顶即第 K 大</text>

  <!-- Stream of numbers -->
  <text x="36" y="74" font-size="12" fill="#888">数据流:</text>
  <rect x="86" y="58" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="102" y="76" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="122" y="58" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="138" y="76" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <rect x="158" y="58" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="174" y="76" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">8</text>
  <rect x="194" y="58" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="76" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="230" y="58" width="32" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="246" y="76" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="272" y="76" font-size="14" fill="#888">···</text>

  <!-- Arrow from stream to heap -->
  <path d="M 150 90 L 150 120" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="168" y="110" font-size="10" fill="#d6a040">只留最大的 K 个</text>

  <!-- Min-heap tree (k=3) -->
  <text x="40" y="146" font-size="12" fill="#888">小根堆 (size=K=3):</text>

  <!-- Heap root (the answer) -->
  <rect x="125" y="130" width="52" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="151" y="150" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>

  <!-- Heap children -->
  <path d="M 138 162 L 100 188" stroke="#666" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 164 162 L 202 188" stroke="#666" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <rect x="76" y="188" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="100" y="208" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <rect x="178" y="188" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="202" y="208" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>

  <!-- Label: root is minimum -->
  <text x="151" y="124" text-anchor="middle" font-size="10" fill="#b85450">堆顶=最小</text>

  <!-- Arrow from heap root to result -->
  <path d="M 177 146 L 300 146" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Result box -->
  <rect x="305" y="128" width="120" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="365" y="146" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">第 K 大 = 4</text>
  <text x="365" y="160" text-anchor="middle" font-size="10" fill="#888">= 最大的 K 个里最小的</text>

  <!-- Why min-heap explanation -->
  <rect x="40" y="240" width="480" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="260" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">为什么用小根堆而不是大根堆？</text>
  <text x="280" y="278" text-anchor="middle" font-size="11" fill="#555">第 K 大 = 排序后第 K 个 = 最大的 K 个数中的最小值 → 小根堆堆顶天然就是它</text>

  <!-- Core idea box -->
  <rect x="40" y="300" width="480" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">关键直觉：维护一个大小恒为 K 的小根堆</text>
  <text x="280" y="342" text-anchor="middle" font-size="11" fill="#666">新元素 &gt; 堆顶 → 弹堆顶、推新元素（升级）；&lt; 堆顶 → 直接丢弃</text>
  <text x="280" y="358" text-anchor="middle" font-size="11" fill="#888">堆始终只存最大的 K 个，堆顶即答案，add 为 O(log K)</text>
</svg>
