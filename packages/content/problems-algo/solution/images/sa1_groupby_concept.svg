<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">按 seller_id 分组求 SUM(price)，取最大值</text>

  <text x="70" y="64" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">分组键</text>
  <text x="220" y="64" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">各组 price 明细</text>
  <text x="400" y="64" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">SUM(price)</text>

  <rect x="30" y="80" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="102" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">seller 1</text>
  <rect x="150" y="84" width="52" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="176" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2000</text>
  <text x="216" y="102" text-anchor="middle" font-size="14" fill="#888" filter="url(#rough2)">+</text>
  <rect x="232" y="84" width="52" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="258" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">800</text>
  <path d="M295 97 L355 97" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="360" y="80" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="400" y="102" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">2800 ★</text>

  <rect x="30" y="150" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="172" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">seller 2</text>
  <rect x="186" y="154" width="52" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="212" y="172" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">800</text>
  <path d="M250 167 L355 167" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="360" y="150" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="400" y="172" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">800</text>

  <rect x="30" y="220" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="242" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">seller 3</text>
  <rect x="186" y="224" width="52" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="212" y="242" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2800</text>
  <path d="M250 237 L355 237" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="360" y="220" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="400" y="242" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">2800 ★</text>

  <rect x="40" y="288" width="440" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="310" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">最大 SUM(price) = 2800，seller 1 与 seller 3 并列</text>
  <text x="260" y="328" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ 全部输出（含并列）</text>
</svg>
