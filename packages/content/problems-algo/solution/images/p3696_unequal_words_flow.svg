<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">算法流程：一次遍历，与首末元素各比一次</text>

  <!-- 主流程（左列） -->
  <rect x="125" y="36" width="110" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="180" y="53" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans = 0</text>

  <path d="M 180 62 L 180 76" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="95" y="78" width="170" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="180" y="95" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">对每个下标 i（0 ≤ i &lt; n）</text>

  <path d="M 180 104 L 180 120" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="180,122 285,164 180,206 75,164" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="168" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">words[i] ≠ words[0] ?</text>

  <path d="M 285 164 L 336 164" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="302" y="156" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="340" y="146" width="155" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="417" y="161" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ans = max(ans, i + 1)</text>
  <text x="417" y="177" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">候选对 (0, i)，距离 = i + 1</text>

  <path d="M 180 206 L 180 222" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="191" y="218" font-size="11" fill="#888" filter="url(#rough2)">否</text>

  <polygon points="180,224 285,266 180,308 75,266" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="270" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">words[i] ≠ words[n−1] ?</text>

  <path d="M 285 266 L 336 266" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="302" y="258" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="340" y="248" width="155" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="417" y="263" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ans = max(ans, n − i)</text>
  <text x="417" y="279" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">候选对 (i, n−1)，距离 = n − i</text>

  <path d="M 180 308 L 180 322" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="191" y="318" font-size="11" fill="#888" filter="url(#rough2)">否</text>

  <rect x="105" y="324" width="150" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="180" y="341" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">遍历结束，返回 ans</text>

  <!-- 循环回边 -->
  <path d="M 495 164 L 512 164 L 512 91 L 270 91" fill="none" stroke="#888" stroke-width="1.5"
        stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 495 266 L 512 266" fill="none" stroke="#888" stroke-width="1.5"
        stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="400" y="85" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">继续下一个 i</text>
</svg>
