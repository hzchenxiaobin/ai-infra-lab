<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold">示例演算：n=5, queries=[1,2,5] → 祖先链前缀异或</text>

  <!-- ===== query / cnt callout ===== -->
  <rect x="120" y="36" width="320" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="280" y="54" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">queries=[1,2,5] ⇒ cnt[1]=cnt[2]=cnt[5]=1，其余=0</text>

  <!-- ===== edges ===== -->
  <line x1="280" y1="100" x2="190" y2="172" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="280" y1="100" x2="380" y2="172" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="190" y1="196" x2="130" y2="252" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="190" y1="196" x2="240" y2="252" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- ===== nodes: caption (v · cnt) above, val big inside ===== -->
  <!-- node 1: val=1 (red) -->
  <text x="280" y="78" text-anchor="middle" font-size="9.5" fill="#888">v=1 · cnt=1</text>
  <circle cx="280" cy="100" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="280" y="107" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">1</text>

  <!-- node 2: val=0 (blue) -->
  <text x="190" y="150" text-anchor="middle" font-size="9.5" fill="#888">v=2 · cnt=1</text>
  <circle cx="190" cy="172" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="179" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">0</text>

  <!-- node 3: val=1 (red) -->
  <text x="380" y="150" text-anchor="middle" font-size="9.5" fill="#888">v=3 · cnt=0</text>
  <circle cx="380" cy="172" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="380" y="179" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">1</text>

  <!-- node 4: val=0 (blue) -->
  <text x="130" y="230" text-anchor="middle" font-size="9.5" fill="#888">v=4 · cnt=0</text>
  <circle cx="130" cy="252" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="130" y="259" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">0</text>

  <!-- node 5: val=1 (red) -->
  <text x="240" y="230" text-anchor="middle" font-size="9.5" fill="#888">v=5 · cnt=1</text>
  <circle cx="240" cy="252" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="240" y="259" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">1</text>

  <!-- ===== edge XOR labels (val[parent] ⊕ cnt[child]) ===== -->
  <text x="208" y="142" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">⊕1</text>
  <text x="352" y="142" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">⊕0</text>
  <text x="138" y="222" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">⊕0</text>
  <text x="228" y="222" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">⊕1</text>

  <!-- ===== legend ===== -->
  <rect x="430" y="150" width="120" height="58" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <circle cx="448" cy="168" r="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="462" y="172" font-size="10.5" fill="#333">val = 1</text>
  <circle cx="448" cy="192" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="462" y="196" font-size="10.5" fill="#333">val = 0</text>

  <!-- divider -->
  <line x1="30" y1="296" x2="540" y2="296" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== answer box ===== -->
  <rect x="80" y="308" width="400" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="334" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">值为 1 的节点 = {1, 3, 5} → 共 3 个 ✓</text>
</svg>
