<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：建计数数组 → 找最大 → 数并列最多</text>

  <!-- Step 1: build count array -->
  <rect x="50" y="50" width="460" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="74" y="74" font-size="12" fill="#4a7a3a" font-weight="bold">① 建计数数组 cnt[37]</text>
  <text x="74" y="94" font-size="11" fill="#666">遍历 i = 1..n：算数位和 s = digitSum(i)，执行 cnt[s]++</text>
  <text x="74" y="108" font-size="10" fill="#888">数位和 s ∈ [1,36]，每位 O(log n) 求和，共 O(n log n)</text>
  <text x="476" y="86" font-size="10" fill="#888">O(n log n)</text>

  <path d="M 280 114 L 280 128" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 2: find max size -->
  <rect x="50" y="130" width="460" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="74" y="154" font-size="12" fill="#d6a040" font-weight="bold">② 找最大组大小 maxSize</text>
  <text x="74" y="174" font-size="11" fill="#666">maxSize = max(cnt[1], cnt[2], …, cnt[36])</text>
  <text x="476" y="166" font-size="10" fill="#888">O(1)</text>

  <path d="M 280 190 L 280 206" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 3: count groups with max size -->
  <rect x="50" y="208" width="460" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="74" y="232" font-size="12" fill="#446688" font-weight="bold">③ 数并列最多的组数</text>
  <text x="74" y="252" font-size="11" fill="#666">ans = 0；遍历 s = 1..36，若 cnt[s] == maxSize 则 ans++</text>
  <text x="476" y="244" font-size="10" fill="#888">O(1)</text>

  <path d="M 280 268 L 280 284" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 4: return -->
  <rect x="170" y="286" width="220" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="308" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">返回 ans</text>
  <text x="280" y="322" text-anchor="middle" font-size="10" fill="#888">达到最大组大小的组的个数</text>

  <!-- side note: digit sum helper -->
  <rect x="50" y="346" width="460" height="80" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="74" y="368" font-size="11" fill="#555" font-weight="bold">数位和函数 digitSum(x)</text>
  <text x="74" y="386" font-size="11" fill="#777" font-family="'Comic Sans MS', monospace">  s = 0; while x:  s += x % 10;  x //= 10</text>
  <text x="74" y="404" font-size="10" fill="#888">逐位取余累加，O(位数) = O(log x)</text>
  <text x="74" y="420" font-size="10" fill="#4a7a3a">优化：dp[i] = dp[i//10] + i%10，摊还 O(1)/数（见第 5 节）</text>
</svg>
