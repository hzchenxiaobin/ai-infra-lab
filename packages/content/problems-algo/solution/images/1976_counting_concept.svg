<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">最短路计数：4 条等长最短路径</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">0 → 6 的最短时间 = 7，共有 4 条路径花费 7 分钟</text>

  <!-- ===== Graph edges (non-highlighted, light) ===== -->
  <!-- 0-1 (2) -->
  <path d="M 86 198 Q 130 150 168 118" stroke="#bbb" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="118" y="148" font-size="9" fill="#888">2</text>
  <!-- 0-4 (5) -->
  <path d="M 86 214 Q 130 250 168 282" stroke="#bbb" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="118" y="262" font-size="9" fill="#888">5</text>
  <!-- 0-6 (7) direct, highlight red -->
  <path d="M 86 206 Q 280 220 482 206" stroke="#b85450" stroke-width="2.4" fill="none" stroke-dasharray="6,3" filter="url(#rough2)"/>
  <text x="278" y="236" font-size="10" fill="#b85450" font-weight="bold">7  (路径①直连)</text>
  <!-- 1-2 (3) -->
  <path d="M 188 110 Q 240 92 290 80" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="240" y="84" font-size="9" fill="#4a7a3a" font-weight="bold">3</text>
  <!-- 1-3 (3) -->
  <path d="M 192 128 Q 240 138 290 162" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="238" y="138" font-size="9" fill="#446688" font-weight="bold">3</text>
  <!-- 2-5 (1) -->
  <path d="M 312 84 Q 360 130 392 196" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="350" y="132" font-size="9" fill="#4a7a3a" font-weight="bold">1</text>
  <!-- 3-5 (1) -->
  <path d="M 314 168 Q 360 184 392 198" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="348" y="178" font-size="9" fill="#446688" font-weight="bold">1</text>
  <!-- 3-6 (3) non-shortest -->
  <path d="M 310 172 Q 400 150 484 198" stroke="#bbb" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="398" y="156" font-size="9" fill="#888">3</text>
  <!-- 4-6 (2) highlight orange -->
  <path d="M 192 286 Q 340 300 484 216" stroke="#d6a040" stroke-width="2.4" fill="none" stroke-dasharray="6,3" filter="url(#rough2)"/>
  <text x="338" y="296" font-size="10" fill="#d6a040" font-weight="bold">2  (路径②经4)</text>
  <!-- 5-6 (1) shared by paths 3&4 -->
  <path d="M 410 206 Q 450 206 482 206" stroke="#4a7a3a" stroke-width="2.6" fill="none" filter="url(#rough2)"/>
  <text x="446" y="198" font-size="9" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- ===== Nodes ===== -->
  <!-- 0 source -->
  <circle cx="72" cy="206" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="72" y="210" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <text x="72" y="236" text-anchor="middle" font-size="9" fill="#446688">起点</text>

  <!-- 1 -->
  <circle cx="180" cy="112" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="116" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <!-- 2 -->
  <circle cx="300" cy="76" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="80" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <!-- 3 -->
  <circle cx="300" cy="168" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="172" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <!-- 4 -->
  <circle cx="180" cy="290" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="294" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <!-- 5 -->
  <circle cx="402" cy="204" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="402" y="208" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <!-- 6 destination -->
  <circle cx="498" cy="206" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="498" y="210" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
  <text x="498" y="236" text-anchor="middle" font-size="9" fill="#b85450">终点</text>

  <!-- ===== Path legend ===== -->
  <rect x="36" y="328" width="488" height="92" fill="#f0f7ff" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="50" y="346" font-size="10" fill="#446688" font-weight="bold">4 条最短路径（总耗时均为 7）：</text>

  <circle cx="58" cy="364" r="4" fill="#b85450"/>
  <text x="70" y="368" font-size="9" fill="#555">① 0 → 6  （直连 7）</text>

  <circle cx="58" cy="380" r="4" fill="#d6a040"/>
  <text x="70" y="384" font-size="9" fill="#555">② 0 → 4 → 6  （5 + 2）</text>

  <circle cx="58" cy="396" r="4" fill="#4a7a3a"/>
  <text x="70" y="400" font-size="9" fill="#555">③ 0 → 1 → 2 → 5 → 6  （2 + 3 + 1 + 1）</text>

  <circle cx="300" cy="364" r="4" fill="#446688"/>
  <text x="312" y="368" font-size="9" fill="#555">④ 0 → 1 → 3 → 5 → 6  （2 + 3 + 1 + 1）</text>

  <text x="300" y="388" font-size="9" fill="#888">→ ways[6] = 4</text>
  <text x="300" y="404" font-size="9" fill="#b85450" font-weight="bold">灰边 = 非最短路边（如 3→6 耗 8 &gt; 7）</text>
</svg>
