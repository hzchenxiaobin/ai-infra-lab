<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">回溯流程：频数表 + 选/不选 + 逐位检查</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">dfs(i, available[], curScore)：每节点更新 ans，字母不足即剪枝</text>

  <g filter="url(#rough2)" font-size="11">
    <!-- 1. Preprocess -->
    <rect x="140" y="60" width="260" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="270" y="78" text-anchor="middle" fill="#446688" font-weight="bold">① 预处理</text>
    <text x="270" y="93" text-anchor="middle" fill="#555" font-size="9" font-family="monospace">available[26] ← letters 频数；wordCount[i][26]、wordScore[i]</text>

    <path d="M 270 104 L 270 120" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>

    <!-- 2. Enter node: update ans -->
    <rect x="130" y="122" width="280" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="270" y="140" text-anchor="middle" fill="#4a7a3a" font-weight="bold">② 入节点即更新答案</text>
    <text x="270" y="155" text-anchor="middle" fill="#555" font-size="10" font-family="monospace">ans = max(ans, curScore)</text>

    <path d="M 270 162 L 270 178" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>

    <!-- 3. Decision diamond: j < n ? -->
    <polygon points="270,180 370,216 270,252 170,216" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="270" y="212" text-anchor="middle" fill="#d6a040" font-weight="bold">j &lt; n ?</text>
    <text x="270" y="228" text-anchor="middle" fill="#555" font-size="9">(还有候选单词)</text>

    <!-- No -> return -->
    <path d="M 370 216 L 440 216" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>
    <text x="405" y="208" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">否</text>
    <rect x="440" y="198" width="76" height="36" fill="#f5f5f5" stroke="#888" stroke-width="1.3" rx="6"/>
    <text x="478" y="216" text-anchor="middle" fill="#555" font-weight="bold">return</text>
    <text x="478" y="228" text-anchor="middle" fill="#555" font-size="9">(回溯上层)</text>

    <!-- Yes -> down to availability check -->
    <path d="M 270 252 L 270 268" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>
    <text x="282" y="264" font-size="10" fill="#666" font-weight="bold">是</text>

    <!-- 4. Availability check diamond -->
    <polygon points="270,270 390,306 270,342 150,306" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="270" y="300" text-anchor="middle" fill="#d6a040" font-weight="bold">∀c: wordCount[j][c]</text>
    <text x="270" y="316" text-anchor="middle" fill="#d6a040" font-weight="bold">≤ available[c] ?</text>

    <!-- Not enough -> skip (prune) -->
    <path d="M 150 306 L 80 306" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)"/>
    <text x="115" y="298" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
    <rect x="14" y="288" width="68" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6"/>
    <text x="48" y="306" text-anchor="middle" fill="#b85450" font-weight="bold">跳过 j</text>
    <text x="48" y="320" text-anchor="middle" fill="#b85450" font-size="9">字母不足 ✂</text>

    <!-- Enough -> include -->
    <path d="M 390 306 L 452 306" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)"/>
    <text x="421" y="298" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
    <rect x="452" y="282" width="82" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="493" y="300" text-anchor="middle" fill="#4a7a3a" font-weight="bold">③ 选入</text>
    <text x="493" y="316" text-anchor="middle" fill="#555" font-size="9" font-family="monospace">avail -= wc</text>
    <text x="493" y="330" text-anchor="middle" fill="#555" font-size="9" font-family="monospace">dfs(j+1,..)</text>
    <text x="493" y="344" text-anchor="middle" fill="#555" font-size="9" font-family="monospace">avail += wc</text>

    <!-- loop back: skip path -->
    <path d="M 48 326 L 48 376 L 220 376 L 220 252" stroke="#b85450" stroke-width="1.1" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)"/>
    <text x="134" y="392" font-size="9" fill="#b85450" font-weight="bold">j++ 继续下一候选</text>

    <!-- include returns back to loop -->
    <path d="M 493 354 L 493 376 L 320 376 L 320 252" stroke="#4a7a3a" stroke-width="1.1" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)"/>
    <text x="406" y="392" font-size="9" fill="#4a7a3a" font-weight="bold">递归返回，j++ 继续</text>
  </g>

  <!-- ===== Key insight box ===== -->
  <rect x="30" y="406" width="480" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="270" y="422" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">⚠️ 关键：每个节点都更新 ans；选词时减频数、回溯时加回，O(26) 检查 + O(26) 修改/恢复</text>
</svg>
