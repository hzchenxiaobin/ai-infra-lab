<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：排序 → 固定 A → 闸门扫描，O(n²)</text>

  <!-- complexity side note -->
  <rect x="286" y="44" width="216" height="88" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="394" y="64" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">n = 1000 时：</text>
  <text x="394" y="82" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">暴力 O(n³) ≈ 10⁹ 次判定 → 超时 ✗</text>
  <text x="394" y="100" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">闸门 O(n²) ≈ 10⁶ 次比较 → 毫秒级 ✓</text>
  <text x="394" y="120" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（I 版 n=50 才放过了暴力）</text>

  <!-- step 1 -->
  <rect x="60" y="46" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="160" y="66" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 排序：x 升序，同 x 则 y 降序</text>
  <path d="M 160 78 L 160 92" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 2 -->
  <rect x="60" y="92" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="160" y="112" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">② 固定 A = points[i]，maxY = −∞</text>
  <path d="M 160 124 L 160 138" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 3 -->
  <rect x="60" y="138" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="160" y="158" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">③ j = i+1 … n−1 依次向右扫</text>
  <path d="M 160 170 L 160 188" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="160,190 250,240 160,290 70,240" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="234" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">y_j ≤ y_i 且</text>
  <text x="160" y="252" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">y_j &gt; maxY ?</text>

  <!-- yes branch -->
  <text x="266" y="230" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 250 240 L 292 240" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="294" y="222" width="130" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="359" y="236" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans++，围栏成立</text>
  <text x="359" y="251" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">maxY = y_j（抬闸门）</text>
  <path d="M 359 222 L 359 158 L 262 158" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="368" y="186" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">下一个 j</text>

  <!-- no branch -->
  <path d="M 160 290 L 160 310" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="168" y="304" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 160 312 C 96 312 38 292 38 212 C 38 168 46 158 56 158" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="108" y="334" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">跳过（被挡 / Bob 在 Alice 上方）</text>

  <!-- final -->
  <path d="M 250 262 C 288 286 306 298 344 310" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="298" y="310" width="196" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="396" y="328" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">④ 全部 i、j 扫完</text>
  <text x="396" y="346" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <!-- bottom note -->
  <rect x="48" y="362" width="424" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="381" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">闸门更新藏在「是」分支里：被挡的候选 y_j ≤ maxY，更新与否结果一样</text>
</svg>
