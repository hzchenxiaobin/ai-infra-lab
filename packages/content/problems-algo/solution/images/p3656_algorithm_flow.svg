<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="470" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：排序 + 前缀和 + 二分定位 p，逐 k 验证</text>

  <!-- 开始 -->
  <ellipse cx="170" cy="52" rx="88" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="56" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">输入 nums（度数序列）</text>

  <path d="M 170 68 L 170 76" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 排序+前缀和 -->
  <rect x="95" y="78" width="150" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="170" y="98" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">降序排序；建前缀和 pre</text>

  <path d="M 170 112 L 170 120" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 奇偶判定 -->
  <polygon points="170,120 245,145 170,170 95,145" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="149" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">pre[n] 为偶数 ?</text>
  <path d="M 245 145 L 296 145" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="137" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="300" y="128" width="118" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="359" y="149" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">return false</text>

  <path d="M 170 170 L 170 180" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="179" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- k=1 -->
  <rect x="128" y="182" width="84" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="170" y="199" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">k = 1</text>

  <path d="M 170 208 L 170 216" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- k<=n? -->
  <polygon points="170,216 238,240 170,264 102,240" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="244" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">k ≤ n ?</text>
  <path d="M 238 240 L 298 240" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="232" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="302" y="224" width="118" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="361" y="244" text-anchor="middle" font-size="11.5" fill="#2f5d25" filter="url(#rough2)">return true ✓</text>

  <path d="M 170 264 L 170 272" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="271" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 二分找 p -->
  <rect x="88" y="274" width="164" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="170" y="291" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">二分找 p：[k, n) 内</text>
  <text x="170" y="306" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">第一个 d[p] ≤ k</text>

  <path d="M 170 314 L 170 322" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- rhs -->
  <rect x="88" y="324" width="164" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="170" y="343" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">rhs = k·(p−k) + pre[n] − pre[p]</text>

  <path d="M 170 354 L 170 362" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 不等式判定 -->
  <polygon points="170,362 252,390 170,418 88,390" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="387" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">pre[k] ≤</text>
  <text x="170" y="401" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">k(k−1) + rhs ?</text>
  <path d="M 252 390 L 304 390" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="278" y="382" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="308" y="374" width="118" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="367" y="394" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">return false</text>

  <path d="M 170 418 L 170 426" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="425" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- k++ -->
  <rect x="132" y="428" width="76" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="170" y="444" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">k++</text>

  <!-- 回边 -->
  <path d="M 132 440 L 46 440 L 46 240 L 98 240" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="38" y="345" text-anchor="middle" font-size="10" fill="#666" transform="rotate(-90 38 345)" filter="url(#rough2)">下一轮</text>

  <!-- 侧栏：p 的含义 -->
  <rect x="288" y="262" width="218" height="110" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="5 4" rx="8" filter="url(#rough2)"/>
  <text x="397" y="276" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">二分定位 p（d=[3,2,2,1]，k=1）</text>

  <rect x="302" y="284" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="319" y="299" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="340" y="284" width="34" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="357" y="299" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="378" y="284" width="34" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="395" y="299" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="416" y="284" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="433" y="299" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>

  <text x="319" y="322" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">前 k 个</text>
  <text x="357" y="322" text-anchor="middle" font-size="8.5" fill="#a07820" filter="url(#rough2)">记 k=1</text>
  <text x="395" y="322" text-anchor="middle" font-size="8.5" fill="#a07820" filter="url(#rough2)">记 k=1</text>
  <text x="433" y="322" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">记 d=1</text>

  <line x1="414" y1="278" x2="414" y2="330" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="414" y="341" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">p</text>

  <text x="397" y="356" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">p 左段 [k,p)：d_j &gt; k ⇒ 记 k</text>
  <text x="397" y="367" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">p 及以后：取真值 d_j</text>
</svg>
