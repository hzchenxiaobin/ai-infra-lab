<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    排序 + 哈希集合：算法流程
  </text>

  <rect x="190" y="50" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="75" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">对 words 字典序排序</text>

  <path d="M280,90 L280,110" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="110" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="135" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">built = {""}，result = ""</text>

  <path d="M280,150 L280,170" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="190" y="170" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="195" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">取下一个 word</text>

  <path d="M280,210 L280,228" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,230 380,265 280,300 180,265" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="258" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">word[:-1]</text>
  <text x="280" y="275" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">∈ built ?</text>

  <text x="395" y="268" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <text x="265" y="320" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <path d="M380,265 L470,265 L470,170 L370,170" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M280,300 L280,318" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="318" width="260" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="341" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">built.add(word)</text>

  <path d="M280,354 L280,370" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,372 380,400 280,428 180,400" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="397" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">len(word) &gt;</text>
  <text x="280" y="413" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">len(result)?</text>

  <text x="395" y="403" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M380,400 L470,400 L470,190 L370,190" stroke="#bbbbbb" stroke-width="1.5" fill="none" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M280,428 L280,440" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="280" y="448" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">result = word → 回到「取下一个」</text>
</svg>
