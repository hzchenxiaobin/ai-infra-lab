<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">核心观察：连续递增段，断裂即重置</text>

  <text x="40" y="76" font-size="12" fill="#888">nums:</text>
  <rect x="80" y="60" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="108" y="80" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="136" y="60" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="164" y="80" text-anchor="middle" font-size="13" fill="#333">3</text>
  <rect x="192" y="60" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="220" y="80" text-anchor="middle" font-size="13" fill="#333">5</text>
  <rect x="248" y="60" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="276" y="80" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="304" y="60" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="332" y="80" text-anchor="middle" font-size="13" fill="#333">7</text>

  <text x="108" y="106" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="164" y="106" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="220" y="106" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="276" y="106" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="332" y="106" text-anchor="middle" font-size="9" fill="#aaa">4</text>

  <path d="M 140 72 L 132 72" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 196 72 L 188 72" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="166" y="54" text-anchor="middle" font-size="9" fill="#4a7a3a">5&gt;3</text>
  <text x="222" y="54" text-anchor="middle" font-size="9" fill="#4a7a3a">5&gt;3</text>

  <path d="M 252 72 L 244 72" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="278" y="54" text-anchor="middle" font-size="9" fill="#b85450">4&lt;5 断裂</text>

  <path d="M 308 72 L 300 72" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="334" y="54" text-anchor="middle" font-size="9" fill="#4a7a3a">7&gt;4</text>

  <rect x="76" y="124" width="176" height="34" fill="none" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="164" y="146" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">递增段①：[1,3,5]，长度 3 ★</text>

  <rect x="300" y="124" width="64" height="34" fill="none" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="332" y="146" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">段②：[7]，长 1</text>

  <rect x="60" y="186" width="460" height="74" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="210" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">连续性约束 = 只看相邻关系 nums[i] vs nums[i−1]</text>
  <text x="290" y="230" text-anchor="middle" font-size="11.5" fill="#555">递增 → 续接：cur = cur + 1</text>
  <text x="290" y="248" text-anchor="middle" font-size="11.5" fill="#555">断裂 → 重置：cur = 1（从当前元素另起一段）</text>

  <rect x="60" y="282" width="460" height="118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="290" y="306" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">对照 300. 最长递增子序列（非连续版）</text>
  <text x="78" y="328" font-size="11" fill="#555">• 300 LIS：可跳过元素，dp[i] 要回看所有 j&lt;i 且 nums[j]&lt;nums[i] → O(n²) / O(n log n)</text>
  <text x="78" y="348" font-size="11" fill="#555">• 674 LCIS：必须连续，只需看 i−1 一格 → 状态转移退化为一维 O(n)</text>
  <text x="78" y="368" font-size="11" fill="#b85450" font-weight="bold">连续 = 自由度归零 = 无需二分/回看，一趟扫描足矣</text>
  <text x="78" y="388" font-size="11" fill="#888">cur 滚动即 dp[i]，best 即 max(dp)，无需显式数组</text>
</svg>
