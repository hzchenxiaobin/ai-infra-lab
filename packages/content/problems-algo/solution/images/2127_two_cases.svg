<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">两种环的组桌能力对比</text>

  <!-- ===== 左半：二元环可拼桌 ===== -->
  <rect x="20" y="44" width="260" height="350" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5 3" rx="10" filter="url(#rough2)"/>
  <text x="150" y="66" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">二元环（k = 2）：可拼桌 ✓</text>

  <!-- 单元 1: x1-i-j-y1 -->
  <circle cx="50" cy="110" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="50" y="114" text-anchor="middle" font-size="10" fill="#333">x₁</text>
  <circle cx="90" cy="130" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="90" y="134" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i</text>
  <circle cx="90" cy="170" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="90" y="174" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">j</text>
  <circle cx="50" cy="190" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="50" y="194" text-anchor="middle" font-size="10" fill="#333">y₁</text>
  <!-- 边 -->
  <path d="M 60 118 Q 74 124 78 126" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 88 144 Q 84 152 88 158" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 92 158 Q 96 152 92 144" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 78 174 Q 64 180 60 182" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="150" y="156" text-anchor="middle" font-size="9" fill="#4a7a3a">单元 1</text>

  <!-- 单元 2: a-k-l-b -->
  <circle cx="210" cy="110" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="114" text-anchor="middle" font-size="10" fill="#333">a</text>
  <circle cx="170" cy="130" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="170" y="134" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">k</text>
  <circle cx="170" cy="170" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="170" y="174" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">l</text>
  <circle cx="210" cy="190" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="194" text-anchor="middle" font-size="10" fill="#333">b</text>
  <path d="M 200 118 Q 186 124 182 126" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 172 144 Q 168 152 172 158" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 168 158 Q 164 152 168 144" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 182 174 Q 196 180 200 182" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="218" y="156" font-size="9" fill="#4a7a3a">单元 2</text>

  <!-- 拼接边 y1-a (虚线连接) -->
  <path d="M 50 203 Q 80 220 200 220 Q 230 220 210 203" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="4 2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="130" y="236" text-anchor="middle" font-size="9" fill="#4a7a3a">拼接边：两端 favorite 已在链内 ✓</text>

  <!-- 圆桌示意 -->
  <text x="150" y="270" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">圆桌拼桌示意</text>
  <ellipse cx="150" cy="330" rx="90" ry="40" fill="none" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="150" y="300" text-anchor="middle" font-size="9" fill="#4a7a3a">…-x₁-i-j-y₁-a-k-l-b-…-x₁</text>
  <text x="150" y="334" text-anchor="middle" font-size="10" fill="#4a7a3a">所有单元首尾相接</text>
  <text x="150" y="350" text-anchor="middle" font-size="9" fill="#666">总贡献 = Σ(2 + L_i + L_j)</text>

  <!-- ===== 右半：长环独占 ===== -->
  <rect x="300" y="44" width="240" height="350" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 3" rx="10" filter="url(#rough2)"/>
  <text x="420" y="66" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">长环（k ≥ 3）：独占一桌 ✗ 不可拼</text>

  <!-- 长环 7->8->9->7 -->
  <circle cx="370" cy="130" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="370" y="134" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7</text>
  <circle cx="470" cy="130" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="470" y="134" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">8</text>
  <circle cx="420" cy="200" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="420" y="204" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">9</text>

  <path d="M 386 128 L 454 128" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 470 146 Q 458 174 436 188" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 404 188 Q 382 174 372 146" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- 试图插入 x 失败 -->
  <circle cx="420" cy="80" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="420" y="84" text-anchor="middle" font-size="10" fill="#666">x</text>
  <path d="M 420 93 L 420 114" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3 2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="448" y="100" font-size="9" fill="#b85450">插入 7-8 间</text>
  <text x="448" y="112" font-size="9" fill="#b85450">→ 7 的 fav=8</text>
  <text x="448" y="122" font-size="9" fill="#b85450">  不在邻位 ✗</text>

  <!-- 邻位分析 -->
  <rect x="320" y="240" width="200" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="420" y="258" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">邻位自由度分析</text>
  <text x="330" y="274" font-size="9" fill="#666">• 节点 7：左邻 9，右邻 8（fav）</text>
  <text x="330" y="288" font-size="9" fill="#b85450">  → 两邻位都被环内占满，自由位 = 0</text>
  <text x="330" y="304" font-size="9" fill="#666">• 无法接挂链，无法拼别的环</text>
  <text x="330" y="316" font-size="9" fill="#b85450">  → 独占一桌，贡献 = k</text>

  <!-- 独占圆桌 -->
  <ellipse cx="420" cy="360" rx="50" ry="22" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="420" y="364" text-anchor="middle" font-size="9" fill="#b85450">7-8-9 独占</text>
</svg>
