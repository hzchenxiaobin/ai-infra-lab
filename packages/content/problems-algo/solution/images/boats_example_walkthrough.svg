<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：people = [3,2,2,1], limit = 3 → 排序 [1,2,2,3] → 3 艘船</text>

  <!-- ===== Step 1 ===== -->
  <text x="40" y="74" font-size="12" fill="#888" font-weight="bold">第1轮</text>
  <rect x="120" y="58" width="44" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="142" y="78" text-anchor="middle" font-size="13" fill="#3a5a2a" font-weight="bold">1</text>
  <rect x="170" y="58" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="192" y="78" text-anchor="middle" font-size="13" fill="#999">2</text>
  <rect x="220" y="58" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="242" y="78" text-anchor="middle" font-size="13" fill="#999">2</text>
  <rect x="270" y="58" width="44" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="292" y="78" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <text x="142" y="104" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">L</text>
  <text x="292" y="104" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">R</text>
  <text x="340" y="74" font-size="11" fill="#555">1 + 3 = 4 &gt; 3 →</text>
  <text x="340" y="90" font-size="11" fill="#b85450" font-weight="bold">3 独船, boats=1, R←2</text>

  <!-- ===== Step 2 ===== -->
  <text x="40" y="148" font-size="12" fill="#888" font-weight="bold">第2轮</text>
  <rect x="120" y="132" width="44" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="142" y="152" text-anchor="middle" font-size="13" fill="#3a5a2a" font-weight="bold">1</text>
  <rect x="170" y="132" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="192" y="152" text-anchor="middle" font-size="13" fill="#999">2</text>
  <rect x="220" y="132" width="44" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="242" y="152" text-anchor="middle" font-size="13" fill="#3a5a2a" font-weight="bold">2</text>
  <rect x="270" y="132" width="44" height="30" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="292" y="152" text-anchor="middle" font-size="13" fill="#ccc">3</text>
  <text x="142" y="178" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">L</text>
  <text x="242" y="178" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">R</text>
  <text x="340" y="148" font-size="11" fill="#555">1 + 2 = 3 ≤ 3 →</text>
  <text x="340" y="164" font-size="11" fill="#4a7a3a" font-weight="bold">同船, boats=2, L→1, R→1</text>

  <!-- ===== Step 3 ===== -->
  <text x="40" y="222" font-size="12" fill="#888" font-weight="bold">第3轮</text>
  <rect x="120" y="206" width="44" height="30" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="142" y="226" text-anchor="middle" font-size="13" fill="#ccc">1</text>
  <rect x="170" y="206" width="44" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="192" y="226" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="220" y="206" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="242" y="226" text-anchor="middle" font-size="13" fill="#999">2</text>
  <rect x="270" y="206" width="44" height="30" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="292" y="226" text-anchor="middle" font-size="13" fill="#ccc">3</text>
  <text x="192" y="252" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">L=R</text>
  <text x="340" y="222" font-size="11" fill="#555">left == right →</text>
  <text x="340" y="238" font-size="11" fill="#b85450" font-weight="bold">2 独船, boats=3</text>

  <!-- ===== Summary ===== -->
  <rect x="40" y="276" width="480" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="296" font-size="11" fill="#555">① left=0, right=3：1+3=4 &gt; 3 → 3 独船，boats=1，right=2</text>
  <text x="60" y="313" font-size="11" fill="#555">② left=0, right=2：1+2=3 ≤ 3 → 1、2 同船，boats=2，left=1，right=1</text>
  <text x="60" y="330" font-size="11" fill="#555">③ left=1, right=1：剩 1 人 → 2 独船，boats=3。最终 = 3</text>
</svg>
