  <rect x="116" y="132" width="66" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="184" y="132" width="26" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="43" y="147" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">1</text>
  <text x="86" y="147" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Mason</text>
  <text x="149" y="147" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">King</text>
  <text x="197" y="147" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">6</text>

  <rect x="30" y="154" width="26" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="58" y="154" width="56" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="116" y="154" width="66" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="184" y="154" width="26" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="43" y="169" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">2</text>
  <text x="86" y="169" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Ava</text>
  <text x="149" y="169" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Wright</text>
  <text x="197" y="169" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">7</text>

  <rect x="30" y="176" width="26" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="58" y="176" width="56" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="116" y="176" width="66" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="184" y="176" width="26" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="43" y="191" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">3</text>
  <text x="86" y="191" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Taylor</text>
  <text x="149" y="191" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Hall</text>
  <text x="197" y="191" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">16</text>

  <rect x="30" y="198" width="26" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
