  <text x="149" y="213" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Thompson</text>
  <text x="197" y="213" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">18</text>

  <rect x="30" y="220" width="26" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="58" y="220" width="56" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="116" y="220" width="66" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="184" y="220" width="26" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="43" y="235" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">5</text>
  <text x="86" y="235" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Thomas</text>
  <text x="149" y="235" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Moore</text>
  <text x="197" y="235" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">10</text>

  <text x="120" y="266" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">5 行 × 4 列</text>

  <!-- Middle arrow -->
  <path d="M 226 182 L 330 182" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="278" y="168" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">rename</text>
  <text x="278" y="204" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">columns=mapper</text>
  <text x="278" y="228" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">数据原样</text>

  <!-- Right: output table -->
  <rect x="336" y="82" width="288" height="204" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="480" y="100" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">输出（新表）</text>

  <rect x="344" y="106" width="60" height="22" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="374" y="121" text-anchor="middle" font-size="8.5" fill="#ffffff" filter="url(#rough2)">student_id</text>
  <rect x="406" y="106" width="66" height="22" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="439" y="121" text-anchor="middle" font-size="8.5" fill="#ffffff" filter="url(#rough2)">first_name</text>
  <rect x="474" y="106" width="62" height="22" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="505" y="121" text-anchor="middle" font-size="8.5" fill="#ffffff" filter="url(#rough2)">last_name</text>
  <rect x="538" y="106" width="78" height="22" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="577" y="121" text-anchor="middle" font-size="8.5" fill="#ffffff" filter="url(#rough2)">age_in_years</text>

  <rect x="344" y="132" width="60" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="406" y="132" width="66" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="474" y="132" width="62" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="538" y="132" width="78" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="374" y="147" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">1</text>
  <text x="439" y="147" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Mason</text>
  <text x="505" y="147" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">King</text>
  <text x="577" y="147" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">6</text>

  <rect x="344" y="154" width="60" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="406" y="154" width="66" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="474" y="154" width="62" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="538" y="154" width="78" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="374" y="169" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">2</text>
  <text x="439" y="169" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Ava</text>
  <text x="505" y="169" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Wright</text>
  <text x="577" y="169" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">7</text>

  <rect x="344" y="176" width="60" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="406" y="176" width="66" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="474" y="176" width="62" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="538" y="176" width="78" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="374" y="191" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">3</text>
  <text x="439" y="191" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Taylor</text>
  <text x="505" y="191" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Hall</text>
  <text x="577" y="191" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">16</text>

  <rect x="344" y="198" width="60" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="406" y="198" width="66" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="474" y="198" width="62" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="538" y="198" width="78" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="374" y="213" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">4</text>
  <text x="439" y="213" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Georgia</text>
  <text x="505" y="213" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Thompson</text>
  <text x="577" y="213" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">18</text>

  <rect x="344" y="220" width="60" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="406" y="220" width="66" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="474" y="220" width="62" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="538" y="220" width="78" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
