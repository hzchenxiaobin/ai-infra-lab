<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：表头全换，5 行数据一格不动</text>

  <!-- Mapping strip -->
  <rect x="20" y="42" width="142" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="91" y="59" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">id → student_id</text>
  <rect x="182" y="42" width="152" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="258" y="59" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">first → first_name</text>
  <rect x="354" y="42" width="142" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="425" y="59" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">last → last_name</text>
  <rect x="512" y="42" width="118" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="571" y="59" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">age → age_in_years</text>

  <!-- Left: input table -->
  <rect x="20" y="82" width="200" height="204" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="120" y="100" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">students（输入）</text>

  <rect x="30" y="106" width="26" height="22" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="43" y="121" text-anchor="middle" font-size="9" fill="#ffffff" filter="url(#rough2)">id</text>
  <rect x="58" y="106" width="56" height="22" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="86" y="121" text-anchor="middle" font-size="9" fill="#ffffff" filter="url(#rough2)">first</text>
  <rect x="116" y="106" width="66" height="22" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="149" y="121" text-anchor="middle" font-size="9" fill="#ffffff" filter="url(#rough2)">last</text>
  <rect x="184" y="106" width="26" height="22" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="197" y="121" text-anchor="middle" font-size="9" fill="#ffffff" filter="url(#rough2)">age</text>

  <rect x="30" y="132" width="26" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
