  <text x="480" y="266" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">行索引 0..4 · dtype · 行序 全不变</text>

  <!-- Bottom failure mode -->
  <rect x="20" y="300" width="604" height="120" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="322" y="324" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">⚠️ 静默失败形态：mapper 的键写错（大小写手滑）</text>
  <text x="322" y="346" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">写成 {'ID': 'student_id', ...} → 'ID' 不是已有列名，被静默忽略，得到「半改」表头：</text>

  <rect x="175" y="358" width="50" height="26" fill="#b85450" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="375" text-anchor="middle" font-size="10" fill="#ffffff" filter="url(#rough2)">id</text>
  <rect x="227" y="358" width="105" height="26" fill="#ffffff" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="279" y="375" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">first_name</text>
  <rect x="334" y="358" width="105" height="26" fill="#ffffff" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="386" y="375" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">last_name</text>
  <rect x="441" y="358" width="124" height="26" fill="#ffffff" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="503" y="375" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">age_in_years</text>

  <text x="322" y="404" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">id 列保持原名、其余三列已改——不报错，但评测按列名取数直接失败</text>
</svg>
