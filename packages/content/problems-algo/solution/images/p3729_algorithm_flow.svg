<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">计数三步：位置配对打底 + 单值修正</text>

  <!-- 开始 -->
  <rect x="190" y="42" width="140" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">输入 nums, k</text>
  <path d="M 260 72 L 260 86" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 步骤① -->
  <rect x="85" y="90" width="350" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="108" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">① 前缀和 mod k，一趟哈希配对</text>
  <text x="260" y="126" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">T = 良好「位置子数组」总数（974 套路）</text>
  <path d="M 260 134 L 260 148" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 步骤② -->
  <rect x="85" y="152" width="350" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="170" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">② 遍历每个 run (v, L)</text>
  <text x="260" y="188" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">k′ = k / gcd(v, k)，q = ⌊L / k′⌋</text>
  <path d="M 260 196 L 260 210" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 步骤③ -->
  <rect x="85" y="214" width="350" height="48" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="232" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">③ 每个良好长度 j·k′（j = 1..q）：</text>
  <text x="260" y="252" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">出现 (L − j·k′ + 1) 次，但数值序列只有 1 个</text>
  <path d="M 260 262 L 260 276" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 结果框 -->
  <rect x="65" y="280" width="390" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="260" y="304" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">ans = T − 单值出现数 + 单值序列数</text>
  <text x="260" y="328" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">出现数 = q(L+1) − k′q(q+1)/2 ，序列数 = q</text>

  <!-- 右侧修正注释 -->
  <text x="470" y="300" font-size="12" fill="#b85450" filter="url(#rough2)" text-anchor="middle">− 多算</text>
  <text x="470" y="318" font-size="12" fill="#b85450" filter="url(#rough2)" text-anchor="middle">+ 漏算</text>
</svg>
