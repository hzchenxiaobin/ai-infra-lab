<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">「或」条件照样滑窗：0 的个数 ≤ k 或 1 的个数 ≤ k</text>
  <text x="260" y="38" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">坏 ⟺ zeros &gt; k 且 ones &gt; k —— 两个都超才算坏</text>

  <!-- 行 A：坏窗口 -->
  <rect x="64" y="58" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="102" y="58" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="140" y="58" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="178" y="58" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="216" y="58" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="81" y="80" text-anchor="middle" font-size="13" fill="#8a3833" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="119" y="80" text-anchor="middle" font-size="13" fill="#8a3833" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="157" y="80" text-anchor="middle" font-size="13" fill="#8a3833" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="195" y="80" text-anchor="middle" font-size="13" fill="#8a3833" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="233" y="80" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">1</text>
  <rect x="58" y="52" width="160" height="46" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="6,4" rx="6" filter="url(#rough2)"/>
  <text x="81" y="112" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="119" y="112" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="157" y="112" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="195" y="112" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>
  <text x="233" y="112" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">4</text>
  <text x="272" y="66" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">坏窗口 [0,3]「1010」</text>
  <text x="272" y="84" font-size="10.5" fill="#b85450" filter="url(#rough2)">zeros = 2 &gt; k = 1</text>
  <text x="272" y="100" font-size="10.5" fill="#b85450" filter="url(#rough2)">ones = 2 &gt; k = 1</text>
  <text x="272" y="116" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">两个都超 → 违反约束</text>

  <!-- 收缩箭头 -->
  <path d="M 150 122 C 146 130, 154 138, 150 146" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="165" y="139" font-size="10.5" fill="#a07830" filter="url(#rough2)">收缩：left++（踢出 '1'）</text>

  <!-- 行 B：好窗口 -->
  <rect x="64" y="156" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="102" y="156" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="140" y="156" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="178" y="156" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="216" y="156" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="81" y="178" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">1</text>
  <text x="119" y="178" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="157" y="178" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="195" y="178" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="233" y="178" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">1</text>
  <rect x="96" y="150" width="122" height="46" fill="none" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="6,4" rx="6" filter="url(#rough2)"/>
  <text x="81" y="210" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="119" y="210" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="157" y="210" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="195" y="210" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>
  <text x="233" y="210" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">4</text>
  <text x="272" y="164" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">好窗口 [1,3]「010」</text>
  <text x="272" y="182" font-size="10.5" fill="#666" filter="url(#rough2)">zeros = 2 &gt; k = 1（超了！）</text>
  <text x="272" y="198" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">ones = 1 ≤ k = 1 ✓</text>
  <text x="272" y="214" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">只超一边 → 仍满足约束</text>

  <!-- 单调性说明 -->
  <rect x="36" y="222" width="448" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="240" text-anchor="middle" font-size="11.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">单调性：坏的超集仍坏 ⟺ 好的子集仍好</text>
  <text x="260" y="258" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">→ 固定 right 时，好子串的左端点是连续段 [L, right]</text>

  <!-- 计数公式 -->
  <rect x="66" y="278" width="388" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="300" text-anchor="middle" font-size="12.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">以 right 结尾的好子串数 = right − left + 1</text>
  <text x="260" y="322" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">ans = Σ (right − left + 1)</text>
</svg>
