<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">算法流程：字符串 → 分数 → 化简 → 比较</text>

  <rect x="180" y="44" width="200" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="67" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">输入字符串 s</text>

  <path d="M 280 82 L 280 102" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="106" width="320" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="128" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">按 '(' 和 '.' 定位三段</text>
  <text x="280" y="146" text-anchor="middle" font-size="10" fill="#888">整数 I、非循环 N(长度n)、循环 R(长度r)</text>

  <path d="M 280 158 L 280 178" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,182 380,214 280,246 180,214" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="212" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">有循环段 R?</text>
  <text x="280" y="228" text-anchor="middle" font-size="10" fill="#888">含 '('</text>

  <path d="M 180 214 L 100 214" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="206" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <rect x="30" y="198" width="70" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="65" y="214" text-anchor="middle" font-size="10" fill="#333">den=10^n</text>
  <text x="65" y="226" text-anchor="middle" font-size="10" fill="#333">num=I·den+N</text>

  <path d="M 280 246 L 280 266" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="295" y="260" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="130" y="270" width="300" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="292" text-anchor="middle" font-size="11" fill="#333">den = 10^n · (10^r − 1)</text>
  <text x="280" y="310" text-anchor="middle" font-size="11" fill="#333">num = I·den + N·(10^r−1) + R</text>

  <path d="M 280 322 L 280 342" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="160" y="346" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="364" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">g = gcd(num, den)</text>
  <text x="280" y="380" text-anchor="middle" font-size="10" fill="#888">num/=g, den/=g → 既约分数</text>

  <path d="M 280 388 L 280 408" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="412" width="280" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="436" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">比较 s 与 t 的既约分数</text>
  <text x="280" y="452" text-anchor="middle" font-size="10" fill="#4a7a3a">(num₁,den₁) == (num₂,den₂)?</text>

  <text x="470" y="120" font-size="10" fill="#888" font-weight="bold">关键点</text>
  <text x="430" y="138" font-size="9" fill="#666">① 长度 n,r 取自</text>
  <text x="430" y="152" font-size="9" fill="#666"> 字符串长度</text>
  <text x="430" y="166" font-size="9" fill="#666"> 而非数值位数</text>
  <text x="430" y="184" font-size="9" fill="#666">② "0001" 值为1</text>
  <text x="430" y="198" font-size="9" fill="#666"> 但长度仍为4</text>
  <text x="430" y="216" font-size="9" fill="#666">③ 化简后直接比</text>
  <text x="430" y="230" font-size="9" fill="#666"> 分子分母</text>
  <text x="430" y="244" font-size="9" fill="#666"> 避免交叉相乘</text>
  <text x="430" y="258" font-size="9" fill="#666"> 溢出</text>
</svg>
