<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="185" y="20" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：排序 + 一趟扫描</text>

  <!-- node 1: input -->
  <rect x="90" y="30" width="190" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="185" y="50" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">读入 hBars / vBars（各自独立）</text>
  <path d="M 185 62 L 185 80" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- node 2: sort -->
  <rect x="90" y="84" width="190" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="185" y="104" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">排序：sort(hBars)、sort(vBars)</text>
  <path d="M 185 116 L 185 134" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- node 3: scan -->
  <rect x="90" y="138" width="190" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="185" y="158" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">一趟扫描求最长连续段</text>
  <text x="185" y="175" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">bars[i]==bars[i−1]+1 ? run+1 : run=1</text>
  <text x="185" y="190" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">best = max(best, run)</text>
  <path d="M 185 196 L 185 214" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- node 4: compute spans -->
  <rect x="90" y="218" width="190" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="185" y="238" text-anchor="middle" font-size="11.5" fill="#2f5d24" filter="url(#rough2)">maxH = bestH+1，maxV = bestV+1</text>
  <path d="M 185 250 L 185 268" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- node 5: min diamond -->
  <polygon points="185,272 281,302 185,332 89,302" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="185" y="298" text-anchor="middle" font-size="11" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">边长 side =</text>
  <text x="185" y="314" text-anchor="middle" font-size="10.5" fill="#8f3a36" filter="url(#rough2)">min(maxH, maxV)</text>
  <path d="M 185 332 L 185 350" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- node 6: return -->
  <rect x="90" y="354" width="190" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="185" y="373" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 side × side</text>

  <!-- note 1: why +1 -->
  <path d="M 310 130 L 282 152" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <rect x="310" y="84" width="196" height="92" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="408" y="104" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">为什么 +1？</text>
  <text x="408" y="122" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">删掉连续段 [x,y] 的全部线后</text>
  <text x="408" y="138" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">空洞边界落在 x−1 与 y+1</text>
  <text x="408" y="154" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">跨度 = (y+1)−(x−1)</text>
  <text x="408" y="170" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">= 段长 + 1</text>

  <!-- note 2: n m are red herring -->
  <path d="M 310 300 L 283 302" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <rect x="310" y="252" width="196" height="80" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="408" y="272" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">n、m 是「幌子」</text>
  <text x="408" y="290" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">1 ≤ n,m ≤ 10⁹，但可删线 ≤ 100 条</text>
  <text x="408" y="306" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">答案只由 hBars / vBars 决定</text>
  <text x="408" y="322" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">n、m 仅限制编号的合法范围</text>
</svg>
