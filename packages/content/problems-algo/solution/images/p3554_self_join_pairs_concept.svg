<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="450" fill="#fafafa"/>

  <text x="330" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：先降维到「用户×类别」，同一用户内两两配对</text>

  <!-- ===== Left panel: dedupe ===== -->
  <rect x="16" y="42" width="306" height="300" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="169" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① 降维去重：Purchases ⋈ Info</text>
  <text x="169" y="78" text-anchor="middle" font-size="9" fill="#666">用户 2 的 4 条购买记录：</text>

  <rect x="41" y="86" width="256" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="49" y="99" font-size="9" fill="#333">u2 · 102 (Books)</text>
  <rect x="41" y="108" width="256" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="49" y="121" font-size="9" fill="#333">u2 · 103 (Books)</text>
  <rect x="41" y="130" width="256" height="18" fill="#fff" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="49" y="143" font-size="9" fill="#333">u2 · 101 (Electronics)</text>
  <rect x="41" y="152" width="256" height="18" fill="#fff" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="49" y="165" font-size="9" fill="#333">u2 · 201 (Clothing)</text>

  <path d="M 169 174 L 169 188" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="196" y="186" font-size="9" fill="#b85450" font-weight="bold">DISTINCT</text>

  <rect x="41" y="192" width="88" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="85" y="207" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">u2 · Books</text>
  <rect x="135" y="192" width="100" height="22" fill="#fff" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="185" y="207" text-anchor="middle" font-size="9" fill="#333">u2 · Electronics</text>
  <rect x="241" y="192" width="88" height="22" fill="#fff" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="285" y="207" text-anchor="middle" font-size="9" fill="#333">u2 · Clothing</text>

  <text x="169" y="230" text-anchor="middle" font-size="9" fill="#b85450">102/103 同属 Books ⇒ 合并为一行</text>

  <rect x="30" y="240" width="278" height="94" fill="#fff" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="42" y="256" font-size="9" fill="#446688" font-weight="bold">user_category（用户 → 类别集合）</text>
  <text x="42" y="271" font-size="8.5" fill="#333">u1: Books · Clothing · Electronics · Sports</text>
  <text x="42" y="284" font-size="8.5" fill="#333">u2: Books · Clothing · Electronics</text>
  <text x="42" y="297" font-size="8.5" fill="#333">u3: Books · Electronics · Kitchen · Sports</text>
  <text x="42" y="310" font-size="8.5" fill="#333">u4: Clothing · Electronics · Kitchen · Sports</text>
  <text x="42" y="323" font-size="8.5" fill="#333">u5: Books · Clothing</text>

  <!-- ===== Right panel: pair generation ===== -->
  <rect x="338" y="42" width="306" height="300" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="491" y="62" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">② 同一用户两两配对</text>
  <text x="491" y="78" text-anchor="middle" font-size="9" fill="#666">以用户 1（4 个类别）为例：</text>

  <rect x="352" y="86" width="68" height="22" fill="#fff" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="386" y="101" text-anchor="middle" font-size="9" fill="#333">Books</text>
  <rect x="426" y="86" width="68" height="22" fill="#fff" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="460" y="101" text-anchor="middle" font-size="9" fill="#333">Clothing</text>
  <rect x="500" y="86" width="68" height="22" fill="#fff" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="534" y="101" text-anchor="middle" font-size="9" fill="#333">Electronics</text>
  <rect x="574" y="86" width="68" height="22" fill="#fff" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="608" y="101" text-anchor="middle" font-size="9" fill="#333">Sports</text>

  <path d="M 386 112 C 380 130, 385 140, 392 148" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 386 112 C 400 132, 465 138, 490 148" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 386 112 C 420 142, 540 138, 588 148" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 460 112 C 460 130, 488 138, 492 148" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 460 112 C 490 136, 560 138, 590 148" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 534 112 C 550 132, 580 138, 592 148" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <rect x="350" y="150" width="92" height="22" fill="#fff" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="396" y="165" text-anchor="middle" font-size="8" fill="#333">Books-Clothing</text>
  <rect x="448" y="150" width="92" height="22" fill="#fff" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="494" y="165" text-anchor="middle" font-size="8" fill="#333">Books-Electronics</text>
  <rect x="546" y="150" width="92" height="22" fill="#fff" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="592" y="165" text-anchor="middle" font-size="8" fill="#333">Books-Sports</text>
  <rect x="350" y="180" width="92" height="22" fill="#fff" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="396" y="195" text-anchor="middle" font-size="8" fill="#333">Clothing-Electr.</text>
  <rect x="448" y="180" width="92" height="22" fill="#fff" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="494" y="195" text-anchor="middle" font-size="8" fill="#333">Clothing-Sports</text>
  <rect x="546" y="180" width="92" height="22" fill="#fff" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="592" y="195" text-anchor="middle" font-size="8" fill="#333">Electr.-Sports</text>

  <text x="491" y="224" text-anchor="middle" font-size="9" fill="#666">4 个类别 ⇒ C(4,2) = 6 个对（每对一个用户「证词」）</text>

  <rect x="350" y="236" width="282" height="94" fill="#fff" stroke="#b85450" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="491" y="252" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">ON a.category &lt; b.category 一箭三雕</text>
  <text x="362" y="270" font-size="9" fill="#666">① 去对称：(C,B) 与 (B,C) 只留一个</text>
  <text x="362" y="286" font-size="9" fill="#666">② 保输出序：category1 &lt; category2</text>
  <text x="362" y="302" font-size="9" fill="#666">③ 排同类：(B,B) 天然不成立</text>
  <text x="491" y="320" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">⇒ 每个无序对恰好出现一次</text>

  <!-- ===== Bottom strip ===== -->
  <rect x="16" y="356" width="628" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="330" y="376" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">③ 分组计数：GROUP BY (category1, category2) + HAVING COUNT(*) ≥ 3</text>
  <text x="330" y="396" text-anchor="middle" font-size="9.5" fill="#333">Books-Clothing: 3 ✓　　Books-Electronics: 3 ✓　　Clothing-Electronics: 3 ✓　　Electronics-Sports: 3 ✓</text>
  <text x="330" y="416" text-anchor="middle" font-size="9" fill="#b85450">其余 6 对共同用户 &lt; 3，被 HAVING 丢弃</text>
</svg>
