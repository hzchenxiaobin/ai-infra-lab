<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    算法流程：频次 → 前缀和 → 三条件取最小
  </text>

  <!-- Step 1: count freq -->
  <rect x="60" y="50" width="440" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="80" y="70" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">① 统计频次</text>
  <text x="80" y="86" font-size="10" fill="#555" filter="url(#rough2)">遍历 a、b 各一次，得到 cntA[26]、cntB[26]，记录 lenA、lenB</text>
  <path d="M 280,96 L 280,114" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: prefix sum -->
  <rect x="60" y="116" width="440" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="80" y="136" font-size="11" font-weight="bold" fill="#7a5415" filter="url(#rough2)">② 求前缀和</text>
  <text x="80" y="152" font-size="10" fill="#555" filter="url(#rough2)">preA[i] = preA[i−1] + cntA[i]，preB[i] 同理（i = 0..25）</text>
  <path d="M 280,162 L 280,180" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: three branches -->
  <text x="280" y="196" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">③ 三条件分别求最小，再取总最小</text>

  <!-- branch 1: cond1 -->
  <rect x="30" y="210" width="160" height="92" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="110" y="228" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">条件 1：a &lt; b</text>
  <text x="110" y="246" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">c ∈ 'a'..'y'</text>
  <text x="110" y="266" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">ops₁ =</text>
  <text x="110" y="280" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">(lenA−preA[c])</text>
  <text x="110" y="294" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">+ preB[c]</text>

  <!-- branch 2: cond2 -->
  <rect x="200" y="210" width="160" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="280" y="228" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415" filter="url(#rough2)">条件 2：b &lt; a</text>
  <text x="280" y="246" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">c ∈ 'a'..'y'</text>
  <text x="280" y="266" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">ops₂ =</text>
  <text x="280" y="280" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">(lenB−preB[c])</text>
  <text x="280" y="294" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">+ preA[c]</text>

  <!-- branch 3: cond3 -->
  <rect x="370" y="210" width="160" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="450" y="228" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a" filter="url(#rough2)">条件 3：同字母</text>
  <text x="450" y="246" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">c ∈ 'a'..'z'</text>
  <text x="450" y="266" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">ops₃ =</text>
  <text x="450" y="280" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">(lenA−cntA[c])</text>
  <text x="450" y="294" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">+ (lenB−cntB[c])</text>

  <!-- arrows down to merge -->
  <path d="M 110,302 L 110,318 L 280,318 L 280,330" stroke="#446688" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 280,302 L 280,330" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 450,302 L 450,318 L 280,318" stroke="#446688" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- merge: min -->
  <rect x="120" y="332" width="320" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="358" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">ans = min( min ops₁, min ops₂, min ops₃ )</text>

  <path d="M 280,372 L 280,390" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return -->
  <rect x="180" y="392" width="200" height="34" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="414" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">return ans</text>
</svg>
