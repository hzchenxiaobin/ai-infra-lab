<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">博弈型 DP：先手拿一端 → 净赚 = 该堆 − 对手剩余区间的净赚</text>

  <!-- piles row -->
  <text x="40" y="74" font-size="12" fill="#888">piles:</text>
  <rect x="160" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="185" y="78" text-anchor="middle" font-size="13" fill="#333">5</text>
  <rect x="210" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="235" y="78" text-anchor="middle" font-size="13" fill="#333">3</text>
  <rect x="260" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="285" y="78" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="310" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="335" y="78" text-anchor="middle" font-size="13" fill="#333">5</text>

  <!-- index labels -->
  <text x="185" y="104" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">i</text>
  <text x="335" y="104" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">j</text>

  <!-- bracket over whole interval -->
  <path d="M 160 50 Q 160 42 168 42 L 352 42 Q 360 42 360 50" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="260" y="36" text-anchor="middle" font-size="11" fill="#446688">区间 [i, j]</text>

  <!-- two branch arrows -->
  <path d="M 185 110 Q 120 130 100 150" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 335 110 Q 400 130 420 150" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- left branch box: 拿左 -->
  <rect x="40" y="150" width="190" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="135" y="172" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">拿左端 piles[i]</text>
  <text x="135" y="194" text-anchor="middle" font-size="11" fill="#444">剩 [i+1, j] 轮到对手先手</text>
  <text x="135" y="214" text-anchor="middle" font-size="11" fill="#444">对手净赚 = dp[i+1][j]</text>
  <text x="135" y="234" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">先手净赚 = piles[i] − dp[i+1][j]</text>

  <!-- right branch box: 拿右 -->
  <rect x="290" y="150" width="190" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="385" y="172" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">拿右端 piles[j]</text>
  <text x="385" y="194" text-anchor="middle" font-size="11" fill="#444">剩 [i, j−1] 轮到对手先手</text>
  <text x="385" y="214" text-anchor="middle" font-size="11" fill="#444">对手净赚 = dp[i][j−1]</text>
  <text x="385" y="234" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">先手净赚 = piles[j] − dp[i][j−1]</text>

  <!-- merge arrows down to equation -->
  <path d="M 135 242 Q 135 258 200 266" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="4,2" filter="url(#rough2)"/>
  <path d="M 385 242 Q 385 258 320 266" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="4,2" filter="url(#rough2)"/>
  <text x="260" y="262" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">先手取较大</text>

  <!-- equation box -->
  <rect x="40" y="276" width="440" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="300" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">dp[i][j] = max( piles[i] − dp[i+1][j] ,</text>
  <text x="318" y="320" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">piles[j] − dp[i][j−1] )</text>
</svg>
