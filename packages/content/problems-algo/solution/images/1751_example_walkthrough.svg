<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：dp 表逐行填充（示例 1, k = 2）</text>

  <!-- subtitle: sorted events -->
  <text x="40" y="48" font-size="11" fill="#888" filter="url(#rough2)">排序后：i=1 [1,2,v=4] | i=2 [2,3,v=1] | i=3 [3,4,v=3]    ends = [2, 3, 4]</text>

  <!-- Table group -->
  <g font-size="11" fill="#333" text-anchor="middle">
    <!-- Header row -->
    <rect x="60" y="66" width="378" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="78" y="84" filter="url(#rough2)">i</text>
    <text x="125" y="84" filter="url(#rough2)">startDay</text>
    <text x="174" y="84" filter="url(#rough2)">p</text>
    <text x="216" y="84" filter="url(#rough2)">v</text>
    <text x="267" y="84" filter="url(#rough2)">dp[i][0]</text>
    <text x="329" y="84" filter="url(#rough2)">dp[i][1]</text>
    <text x="400" y="84" filter="url(#rough2)">dp[i][2]</text>

    <!-- column separators -->
    <g stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)">
      <line x1="96" y1="66" x2="96" y2="240"/>
      <line x1="154" y1="66" x2="154" y2="240"/>
      <line x1="194" y1="66" x2="194" y2="240"/>
      <line x1="238" y1="66" x2="238" y2="240"/>
      <line x1="296" y1="66" x2="296" y2="240"/>
      <line x1="362" y1="66" x2="362" y2="240"/>
    </g>

    <!-- Row i=0 (base, neutral) -->
    <rect x="60" y="94" width="378" height="30" fill="#f7f7f7" stroke="#ccc" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="78" y="113" fill="#888" filter="url(#rough2)">0</text>
    <text x="125" y="113" fill="#aaa" filter="url(#rough2)">—</text>
    <text x="174" y="113" fill="#aaa" filter="url(#rough2)">—</text>
    <text x="216" y="113" fill="#aaa" filter="url(#rough2)">—</text>
    <text x="267" y="113" filter="url(#rough2)">0</text>
    <text x="329" y="113" filter="url(#rough2)">0</text>
    <text x="400" y="113" filter="url(#rough2)">0</text>

    <!-- Row i=1: s=1 p=0 v=4 → dp 0,4,4 (blue tint) -->
    <rect x="60" y="124" width="378" height="30" fill="#eef4fb" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="78" y="143" filter="url(#rough2)">1</text>
    <text x="125" y="143" filter="url(#rough2)">1</text>
    <text x="174" y="143" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
    <text x="216" y="143" filter="url(#rough2)">4</text>
    <text x="267" y="143" filter="url(#rough2)">0</text>
    <text x="329" y="143" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
    <text x="400" y="143" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>

    <!-- Row i=2: s=2 p=0 v=1 → dp 0,4,4 (blue tint) -->
    <rect x="60" y="154" width="378" height="30" fill="#eef4fb" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="78" y="173" filter="url(#rough2)">2</text>
    <text x="125" y="173" filter="url(#rough2)">2</text>
    <text x="174" y="173" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
    <text x="216" y="173" filter="url(#rough2)">1</text>
    <text x="267" y="173" filter="url(#rough2)">0</text>
    <text x="329" y="173" filter="url(#rough2)">4</text>
    <text x="400" y="173" filter="url(#rough2)">4</text>

    <!-- Row i=3: s=3 p=1 v=3 → dp 0,4,7 (orange tint, answer row) -->
    <rect x="60" y="184" width="378" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
    <text x="78" y="203" filter="url(#rough2)">3</text>
    <text x="125" y="203" filter="url(#rough2)">3</text>
    <text x="174" y="203" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
    <text x="216" y="203" filter="url(#rough2)">3</text>
    <text x="267" y="203" filter="url(#rough2)">0</text>
    <text x="329" y="203" filter="url(#rough2)">4</text>
    <!-- answer cell highlighted -->
    <rect x="362" y="184" width="76" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
    <text x="400" y="203" fill="#b85450" font-weight="bold" filter="url(#rough2)">7</text>
  </g>

  <!-- answer arrow + label -->
  <path d="M 400 216 L 400 236" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="300" y="240" width="200" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="400" y="258" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案 dp[3][2] = 7 ✓</text>

  <!-- Transition annotation for the key cell -->
  <rect x="40" y="284" width="480" height="78" fill="#fafafa" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="56" y="304" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">关键转移（i=3, j=2）：</text>
  <text x="56" y="324" font-size="11" fill="#555" filter="url(#rough2)">p = bisect_left([2,3,4], 3) = 1  （仅 endDay=2  &lt;  3）</text>
  <text x="56" y="344" font-size="11" fill="#555" filter="url(#rough2)">dp[3][2] = max( dp[2][2]=4 ,  dp[1][1] + v = 4 + 3 ) = max(4, 7) = </text>
  <text x="500" y="344" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">7</text>

  <!-- footer -->
  <text x="280" y="384" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">「不选」分支把上行的 4 平移下来；「选」分支读 dp[p][j−1]+v 取更大</text>
  <text x="280" y="400" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">注意 i=2 的 p=0：endDay=2 不 &lt; startDay=2（相等算冲突）→ 不能接在 i=1 后</text>
</svg>
