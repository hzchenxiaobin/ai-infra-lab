<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">流程：外层定右端点 i，内层 j 向左扩张，O(1) 判定后松弛</text>

  <!-- 外层 -->
  <rect x="110" y="44" width="300" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="66" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">外层 i = 1 … n：dp[i] = 前缀 s[0..i−1] 的最少段数</text>
  <line x1="260" y1="78" x2="260" y2="94" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 内层 -->
  <rect x="95" y="98" width="330" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="120" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">内层 j 从 i−1 向 0：窗口 [j, i−1] 每步向左扩一格</text>
  <line x1="260" y1="132" x2="260" y2="148" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 增量更新 -->
  <rect x="70" y="152" width="380" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="170" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">加入 s[j]：freq[c]++（首次出现则 distinct++）</text>
  <text x="260" y="188" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">maxf = max(maxf, freq[c]) —— 只增不减</text>
  <line x1="260" y1="196" x2="260" y2="212" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="260,216 385,250 260,284 135,250" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="255" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">distinct × maxf == i − j ?</text>

  <text x="272" y="300" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <line x1="260" y1="284" x2="260" y2="300" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 松弛 -->
  <rect x="140" y="304" width="240" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="327" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">dp[i] = min(dp[i], dp[j] + 1)</text>

  <text x="394" y="242" font-size="12" fill="#d6a040" filter="url(#rough2)">否</text>

  <!-- 否：右侧回环 -->
  <path d="M 385 250 L 462 250 L 462 115 L 430 115" stroke="#999" stroke-width="1.4" stroke-dasharray="6 5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="452" y="94" font-size="10" fill="#999" filter="url(#rough2)">j−− 继续</text>

  <!-- 松弛后：左侧回环 -->
  <path d="M 140 322 L 48 322 L 48 115 L 92 115" stroke="#999" stroke-width="1.4" stroke-dasharray="6 5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="95" y="342" font-size="10" fill="#999" filter="url(#rough2)">松弛后同样 j−− 继续</text>

  <!-- 返回 -->
  <line x1="260" y1="340" x2="260" y2="354" stroke="#666" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="352" font-size="10" fill="#999" filter="url(#rough2)">内外层都走完</text>
  <rect x="170" y="356" width="180" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="377" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">返回 dp[n]</text>
</svg>
