<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="720" height="500" fill="#fdfcf7"/>

  <text x="360" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">算法流程：一趟扫描交换正/倒数第 k 的值</text>
  <path d="M 210 40 Q 360 48 510 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Step 1 -->
  <g filter="url(#sk)"><rect x="220" y="64" width="280" height="46" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="240" y="84" font-size="13" font-weight="bold" fill="#2b6e9e">① first = head</text>
  <text x="240" y="102" font-size="11" fill="#555">两指针起点都在 head</text>

  <path d="M 360 110 L 360 128" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Step 2 -->
  <g filter="url(#sk)"><rect x="180" y="130" width="360" height="54" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="200" y="152" font-size="13" font-weight="bold" fill="#2b6e9e">② first 向前走 k−1 步</text>
  <text x="200" y="172" font-size="11" fill="#555">first 现在落在「正数第 k」节点（第 1 个交换点）</text>

  <path d="M 360 184 L 360 202" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Step 3 -->
  <g filter="url(#sk)"><rect x="220" y="204" width="280" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="240" y="224" font-size="13" font-weight="bold" fill="#a06a10">③ second = head</text>
  <text x="240" y="242" font-size="11" fill="#555">第二个指针从 head 出发</text>

  <path d="M 360 250 L 360 268" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Step 4 (loop) -->
  <g filter="url(#sk)"><rect x="150" y="270" width="420" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="170" y="292" font-size="13" font-weight="bold" fill="#a06a10">④ while first.next ≠ null：</text>
  <text x="190" y="312" font-size="12" fill="#555">first = first.next ; second = second.next</text>
  <text x="190" y="328" font-size="11" fill="#888">同速推进，间距恒为 k−1，first 到尾时 second 即倒数第 k</text>

  <path d="M 360 334 L 360 352" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Step 5 -->
  <g filter="url(#sk)"><rect x="170" y="354" width="380" height="54" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="190" y="376" font-size="13" font-weight="bold" fill="#b85450">⑤ swap(first.val, second.val)</text>
  <text x="190" y="396" font-size="11" fill="#555">只换值不改指针，O(1) 完成交换</text>

  <path d="M 360 408 L 360 426" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Step 6 -->
  <g filter="url(#sk)"><rect x="220" y="428" width="280" height="46" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="240" y="448" font-size="13" font-weight="bold" fill="#2e6e2e">⑥ return head</text>
  <text x="240" y="466" font-size="11" fill="#555">头节点未变，直接返回</text>
</svg>
