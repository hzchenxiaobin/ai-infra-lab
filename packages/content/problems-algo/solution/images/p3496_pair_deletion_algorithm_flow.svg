<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：一趟遍历，奇偶分栏</text>

  <!-- 开始框 -->
  <rect x="185" y="42" width="150" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="61" text-anchor="middle" font-size="12.5" fill="#2b4a6e" filter="url(#rough2)">输入 nums（n 个）</text>
  <path d="M 260 72 L 260 86" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 遍历框 -->
  <rect x="95" y="90" width="330" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="110" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">一趟遍历 i = 0 … n−1</text>
  <text x="260" y="127" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">s += nums[i]；mi = min(mi, nums[i])</text>
  <text x="260" y="144" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">若 i+1 &lt; n：t = min(t, nums[i] + nums[i+1])</text>
  <path d="M 260 152 L 260 168" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="260,170 352,203 260,236 168,203" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="208" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#6b5a1e" filter="url(#rough2)">n 是奇数？</text>

  <!-- 分支箭头 -->
  <path d="M 168 203 L 105 203 L 105 252" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="135" y="196" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 352 203 L 415 203 L 415 252" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="385" y="196" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">否</text>

  <!-- 左分支框 -->
  <rect x="20" y="254" width="170" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="105" y="274" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2d5a1e" filter="url(#rough2)">返回 s − mi</text>
  <text x="105" y="291" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">留下最小元素</text>
  <text x="105" y="307" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">[2,4,1]：7 − 1 = 6</text>

  <!-- 右分支框 -->
  <rect x="330" y="254" width="170" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="415" y="274" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">返回 s − t</text>
  <text x="415" y="291" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">留下最小相邻对</text>
  <text x="415" y="307" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">[5,−1,4,2]：10 − 3 = 7</text>

  <!-- 汇合箭头 -->
  <path d="M 105 318 L 105 334 L 194 334" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 415 318 L 415 334 L 326 334" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结束框 -->
  <rect x="198" y="318" width="124" height="32" rx="16" fill="#fafafa" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="338" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">结束 O(n) / O(1)</text>
</svg>
