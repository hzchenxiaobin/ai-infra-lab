<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：答案 = 最右质数下标 last − 最左质数下标 first</text>

  <!-- first / last labels -->
  <text x="198" y="48" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">first = 1（最左质数 2）</text>
  <path d="M 198 52 L 198 60" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="384" y="48" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">last = 4（最右质数 3）</text>
  <path d="M 384 52 L 384 60" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- array cells -->
  <rect x="108" y="64" width="56" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="136" y="89" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="170" y="64" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="198" y="89" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="232" y="64" width="56" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="89" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>
  <rect x="294" y="64" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="322" y="89" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="356" y="64" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="384" y="89" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- indices -->
  <text x="136" y="118" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">0</text>
  <text x="198" y="118" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">1</text>
  <text x="260" y="118" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">2</text>
  <text x="322" y="118" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">3</text>
  <text x="384" y="118" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">4</text>

  <!-- span bracket -->
  <path d="M 198 128 L 198 138 L 384 138 L 384 128" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="291" y="156" text-anchor="middle" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">最大距离 = last − first = 4 − 1 = 3，中间夹着谁无所谓</text>

  <!-- Panel B: proof chain -->
  <rect x="12" y="176" width="150" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="87" y="196" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">任取质数下标对</text>
  <text x="87" y="213" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">i ≤ j（可相等）</text>

  <path d="M 166 200 L 182 200" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="174" y="193" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">⇒</text>

  <rect x="186" y="176" width="150" height="48" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="261" y="196" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">夹逼：first ≤ i ≤</text>
  <text x="261" y="213" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">j ≤ last</text>

  <path d="M 340 200 L 356 200" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="348" y="193" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⇒</text>

  <rect x="360" y="176" width="148" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="434" y="196" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">j − i ≤ last − first</text>
  <text x="434" y="213" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">且 (first, last) 可取到</text>

  <!-- Panel C: boundary feel -->
  <text x="260" y="252" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">边界手感：只剩一个质数 / 全是质数 / 混入 1</text>

  <rect x="40" y="266" width="30" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="283" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8</text>
  <rect x="75" y="266" width="30" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="283" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="110" y="266" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="125" y="283" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="145" y="266" width="30" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="283" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8</text>
  <text x="105" y="310" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓ 唯一质数：first = last → 0</text>

  <rect x="210" y="266" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="223" y="283" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">2</text>
  <rect x="241" y="266" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="254" y="283" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">2</text>
  <rect x="272" y="266" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="285" y="283" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">2</text>
  <text x="251" y="310" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓ 全是质数：答案 n − 1</text>

  <rect x="368" y="266" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="383" y="283" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="430" y="283" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">1 不是质数！</text>
  <text x="408" y="310" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗ 判定必须加 x ≥ 2</text>

  <!-- Bottom notes -->
  <rect x="12" y="326" width="496" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="348" text-anchor="middle" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">题目保证至少一个质数，first 必被赋值，无需特判；两个质数可以相同（下标相同 → 距离 0）</text>
  <text x="260" y="368" text-anchor="middle" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">所以整道题 = 一趟扫描维护 (first, last) 两个变量 + 一个 O(1) 的质数判定</text>
</svg>
