<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">从高位 n−1 到低位 0，逐位决策，一趟循环</text>

  <!-- init -->
  <rect x="185" y="42" width="170" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="65" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">A = a，B = b，i = n − 1</text>

  <path d="M 270 78 L 270 100" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- diamond: i >= 0 -->
  <polygon points="270,102 352,136 270,170 188,136" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="270" y="132" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">i ≥ 0 ？</text>
  <text x="270" y="148" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">（还有位没处理）</text>

  <path d="M 270 170 L 270 192" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="279" y="186" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">是</text>

  <!-- diamond: same bit? -->
  <polygon points="270,194 366,230 270,266 174,230" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="226" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">a_i = b_i ？</text>
  <text x="270" y="243" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">（同位还是异位）</text>

  <!-- same branch (right) -->
  <path d="M 366 230 L 414 230" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="384" y="222" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">是</text>
  <rect x="418" y="210" width="104" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="470" y="226" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">双双置 1：</text>
  <text x="470" y="241" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">A |= bit, B |= bit</text>

  <!-- differ branch (down) -->
  <path d="M 270 266 L 270 288" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="279" y="282" font-size="10.5" fill="#b85450" filter="url(#rough2)">否（异位）</text>

  <!-- diamond: A < B? -->
  <polygon points="270,290 352,324 270,358 188,324" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="320" text-anchor="middle" font-size="12" fill="#8f3a36" filter="url(#rough2)">A &lt; B ？</text>
  <text x="270" y="337" text-anchor="middle" font-size="10" fill="#8f3a36" filter="url(#rough2)">（含 ≥ n 的高位！）</text>

  <!-- A smaller branch (left) -->
  <path d="M 188 324 L 140 324" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="164" y="316" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">是</text>
  <rect x="22" y="304" width="114" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="79" y="320" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">补给 A：</text>
  <text x="79" y="335" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">A|=bit, B&amp;=~bit</text>

  <!-- B smaller branch (right) -->
  <path d="M 352 324 L 400 324" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="378" y="316" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">否</text>
  <rect x="404" y="304" width="114" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="461" y="320" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">补给 B：</text>
  <text x="461" y="335" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">B|=bit, A&amp;=~bit</text>

  <!-- back edge: decrement i, next bit -->
  <path d="M 79 304 L 79 388 L 270 388 L 270 380" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)" fill="none"/>
  <path d="M 461 304 L 461 388 L 280 388" stroke="#d6a040" stroke-width="2" filter="url(#rough2)" fill="none"/>
  <rect x="204" y="378" width="120" height="26" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="264" y="396" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">i − − 换下一位</text>
  <path d="M 204 391 L 130 391 L 130 136 L 184 136" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)" fill="none"/>

  <!-- exit -->
  <path d="M 188 136 L 130 136" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 352 136 L 400 136 L 400 60 L 359 60" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)" fill="none"/>
  <text x="380" y="126" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">否：位用完</text>

  <rect x="365" y="160" width="150" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="440" y="177" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">最后一步才取模：</text>
  <text x="440" y="192" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">(A%MOD)·(B%MOD)%MOD</text>

  <!-- bottom note -->
  <rect x="70" y="424" width="400" height="36" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="270" y="441" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">⚠️ 过程中 A、B 保持真值不取模（比较大小需要真值），</text>
  <text x="270" y="455" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">A、B &lt; 2^51，long long / Python 大整数都装得下</text>
</svg>
