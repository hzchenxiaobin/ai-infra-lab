<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心概念：中游学生 = 从未在任何考试中考过最高分或最低分</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888">参加了考试，但每次都「不上不下」的学生才入选</text>

  <!-- Exam 10 -->
  <rect x="40" y="64" width="120" height="24" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="100" y="80" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">考试 10</text>
  <rect x="40" y="92" width="120" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="55" y="111" font-size="13" fill="#b85450" font-weight="bold">90</text>
  <text x="100" y="111" text-anchor="middle" font-size="10" fill="#888">stu 3</text>
  <text x="148" y="111" text-anchor="end" font-size="9" fill="#b85450">max</text>
  <rect x="40" y="124" width="120" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="55" y="143" font-size="13" fill="#4a7a3a" font-weight="bold">80</text>
  <text x="100" y="143" text-anchor="middle" font-size="10" fill="#888">stu 2</text>
  <text x="148" y="143" text-anchor="end" font-size="9" fill="#4a7a3a">中游</text>
  <rect x="40" y="156" width="120" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="55" y="175" font-size="13" fill="#446688" font-weight="bold">70</text>
  <text x="100" y="175" text-anchor="middle" font-size="10" fill="#888">stu 1</text>
  <text x="148" y="175" text-anchor="end" font-size="9" fill="#446688">min</text>

  <!-- Exam 20 -->
  <rect x="180" y="64" width="120" height="24" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="240" y="80" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">考试 20</text>
  <rect x="180" y="92" width="120" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="195" y="111" font-size="13" fill="#d6a040" font-weight="bold">80</text>
  <text x="240" y="111" text-anchor="middle" font-size="10" fill="#888">stu 1</text>
  <text x="288" y="111" text-anchor="end" font-size="9" fill="#d6a040">⚠独自</text>
  <rect x="180" y="124" width="120" height="20" rx="4" fill="none" stroke="none"/>
  <text x="240" y="138" text-anchor="middle" font-size="9" fill="#d6a040">既 max 又 min → 排除</text>

  <!-- Exam 30 -->
  <rect x="320" y="64" width="120" height="24" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="380" y="80" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">考试 30</text>
  <rect x="320" y="92" width="120" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="335" y="111" font-size="13" fill="#b85450" font-weight="bold">90</text>
  <text x="380" y="111" text-anchor="middle" font-size="10" fill="#888">stu 4</text>
  <text x="428" y="111" text-anchor="end" font-size="9" fill="#b85450">max</text>
  <rect x="320" y="124" width="120" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="335" y="143" font-size="13" fill="#4a7a3a" font-weight="bold">80</text>
  <text x="380" y="143" text-anchor="middle" font-size="10" fill="#888">stu 3</text>
  <text x="428" y="143" text-anchor="end" font-size="9" fill="#4a7a3a">中游</text>
  <rect x="320" y="156" width="120" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="335" y="175" font-size="13" fill="#446688" font-weight="bold">70</text>
  <text x="380" y="175" text-anchor="middle" font-size="10" fill="#888">stu 1</text>
  <text x="428" y="175" text-anchor="end" font-size="9" fill="#446688">min</text>

  <!-- Exam 40 -->
  <rect x="460" y="64" width="120" height="24" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="520" y="80" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">考试 40</text>
  <rect x="460" y="92" width="120" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="475" y="111" font-size="13" fill="#b85450" font-weight="bold">80</text>
  <text x="520" y="111" text-anchor="middle" font-size="10" fill="#888">stu 4</text>
  <text x="568" y="111" text-anchor="end" font-size="9" fill="#b85450">max</text>
  <rect x="460" y="124" width="120" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="475" y="143" font-size="13" fill="#4a7a3a" font-weight="bold">70</text>
  <text x="520" y="143" text-anchor="middle" font-size="10" fill="#888">stu 2</text>
  <text x="568" y="143" text-anchor="end" font-size="9" fill="#4a7a3a">中游</text>
  <rect x="460" y="156" width="120" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="475" y="175" font-size="13" fill="#446688" font-weight="bold">60</text>
  <text x="520" y="175" text-anchor="middle" font-size="10" fill="#888">stu 1</text>
  <text x="568" y="175" text-anchor="end" font-size="9" fill="#446688">min</text>

  <!-- Legend -->
  <rect x="40" y="202" width="540" height="32" rx="8" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="55" y="212" width="14" height="14" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="75" y="223" font-size="10" fill="#555">最高分 → 排除</text>
  <rect x="185" y="212" width="14" height="14" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="205" y="223" font-size="10" fill="#555">最低分 → 排除</text>
  <rect x="315" y="212" width="14" height="14" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="335" y="223" font-size="10" fill="#555">中游 → 该考试过关</text>
  <rect x="455" y="212" width="14" height="14" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="475" y="223" font-size="10" fill="#555">独自考试 → 排除</text>

  <!-- Summary: extreme students -->
  <rect x="40" y="248" width="540" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="60" y="270" font-size="11" fill="#b85450" font-weight="bold">极端学生（至少一次 max 或 min）= { 1, 3, 4 }</text>
  <text x="60" y="284" font-size="10" fill="#888">stu 1: 4 次考试全是极端 · stu 3: 考试 10 拿 max · stu 4: 考试 30/40 拿 max</text>

  <!-- Summary: took exam -->
  <rect x="40" y="298" width="540" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="60" y="320" font-size="11" fill="#446688" font-weight="bold">参加了考试的学生 = { 1, 2, 3, 4 }（stu 5 未参加任何考试）</text>
  <text x="60" y="334" font-size="10" fill="#888">中游学生 = 参加了考试 且 从未极端 = {1,2,3,4} − {1,3,4} = { 2 }</text>

  <!-- Result -->
  <rect x="40" y="350" width="540" height="92" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="60" y="374" font-size="13" fill="#4a7a3a" font-weight="bold">✓ 中游学生 = { 2 }</text>
  <text x="60" y="394" font-size="11" fill="#555">stu 2 (Jade)：考试 10 得 80（中游 ✓）、考试 40 得 70（中游 ✓）</text>
  <text x="60" y="412" font-size="11" fill="#555">→ 参加了 2 场考试，每场都不是最高分也不是最低分</text>
  <text x="60" y="430" font-size="11" fill="#555">→ 唯一的中游学生，输出 student_id = 2, student_name = 'Jade'</text>
</svg>
