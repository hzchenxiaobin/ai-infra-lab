<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心状态：每个子表达式只跟踪 (c0, c1) = (变 0 代价, 变 1 代价)</text>

  <!-- ===== Operand base cases ===== -->
  <text x="30" y="56" font-size="12" fill="#888">基础操作数：</text>

  <!-- '0' -->
  <rect x="80" y="44" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="108" y="67" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">'0'</text>
  <path d="M 136 62 L 168 62" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="172" y="48" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="212" y="67" text-anchor="middle" font-size="12" fill="#444">(0, 1)</text>
  <text x="262" y="58" font-size="10" fill="#4a7a3a">c0=0 已是 0</text>
  <text x="262" y="72" font-size="10" fill="#b85450">c1=1 翻转</text>

  <!-- '1' -->
  <rect x="80" y="92" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="108" y="115" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">'1'</text>
  <path d="M 136 110 L 168 110" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="172" y="96" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="212" y="115" text-anchor="middle" font-size="12" fill="#444">(1, 0)</text>
  <text x="262" y="106" font-size="10" fill="#b85450">c0=1 翻转</text>
  <text x="262" y="120" font-size="10" fill="#4a7a3a">c1=0 已是 1</text>

  <!-- Separator -->
  <line x1="30" y1="142" x2="530" y2="142" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Combine rules ===== -->
  <text x="30" y="164" font-size="12" fill="#888">合并 A op B 时（&amp; 与 | 优先级相同，从左到右）：</text>

  <!-- A & B box -->
  <rect x="30" y="176" width="245" height="160" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="152" y="198" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">A &amp; B</text>

  <text x="44" y="220" font-size="11" fill="#444" font-weight="bold">变 0 (c0):</text>
  <rect x="44" y="228" width="217" height="40" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="152" y="244" text-anchor="middle" font-size="11" fill="#4a7a3a">保 &amp; : min(a0, b0)</text>
  <text x="152" y="260" text-anchor="middle" font-size="11" fill="#d6a040">改 | (代价1): 1 + a0 + b0</text>

  <text x="44" y="286" font-size="11" fill="#444" font-weight="bold">变 1 (c1):</text>
  <rect x="44" y="294" width="217" height="40" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="152" y="310" text-anchor="middle" font-size="11" fill="#4a7a3a">保 &amp; : a1 + b1</text>
  <text x="152" y="326" text-anchor="middle" font-size="11" fill="#d6a040">改 | (代价1): 1 + min(a1, b1)</text>

  <!-- A | B box -->
  <rect x="290" y="176" width="245" height="160" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="412" y="198" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">A | B</text>

  <text x="304" y="220" font-size="11" fill="#444" font-weight="bold">变 0 (c0):</text>
  <rect x="304" y="228" width="217" height="40" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="412" y="244" text-anchor="middle" font-size="11" fill="#4a7a3a">保 | : a0 + b0</text>
  <text x="412" y="260" text-anchor="middle" font-size="11" fill="#d6a040">改 &amp; (代价1): 1 + min(a0, b0)</text>

  <text x="304" y="286" font-size="11" fill="#444" font-weight="bold">变 1 (c1):</text>
  <rect x="304" y="294" width="217" height="40" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="412" y="310" text-anchor="middle" font-size="11" fill="#4a7a3a">保 | : min(a1, b1)</text>
  <text x="412" y="326" text-anchor="middle" font-size="11" fill="#d6a040">改 &amp; (代价1): 1 + a1 + b1</text>

  <!-- arrow down to answer -->
  <path d="M 280 344 L 280 366" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Answer ===== -->
  <rect x="100" y="372" width="360" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="12" filter="url(#rough2)"/>
  <text x="280" y="396" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">答案 = max(c0, c1)</text>
  <text x="280" y="416" text-anchor="middle" font-size="11" fill="#666">c0 / c1 中恰有一个为 0（当前值维持代价）</text>
  <text x="280" y="432" text-anchor="middle" font-size="11" fill="#666">max 取出另一个即「翻转终值」的最小代价</text>
</svg>
