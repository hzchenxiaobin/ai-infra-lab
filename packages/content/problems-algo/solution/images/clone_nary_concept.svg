<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">克隆 N 叉树：树无环，DFS 递归即可，无需哈希表</text>
  <text x="300" y="46" text-anchor="middle" font-size="11" fill="#888">每个非根节点只有唯一父节点 → DFS 天然每点一次 → 不重复、不绕环</text>

  <!-- ===== Left: original tree ===== -->
  <text x="110" y="76" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">原树</text>

  <!-- edges original -->
  <path d="M 110 128 L 70 200" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 110 128 L 110 200" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 110 128 L 150 200" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 110 222 L 90 295" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 110 222 L 130 295" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <!-- nodes original -->
  <ellipse cx="110" cy="110" rx="22" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="110" y="115" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">1</text>

  <ellipse cx="70" cy="210" rx="20" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="70" y="215" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">3</text>

  <ellipse cx="110" cy="210" rx="20" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="110" y="215" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">2</text>

  <ellipse cx="150" cy="210" rx="20" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="215" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">4</text>

  <ellipse cx="90" cy="305" rx="18" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="90" y="310" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">5</text>

  <ellipse cx="130" cy="305" rx="18" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="130" y="310" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">6</text>

  <!-- ===== Middle: DFS note ===== -->
  <rect x="225" y="155" width="150" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="300" y="178" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">dfs(node)</text>
  <line x1="245" y1="186" x2="355" y2="186" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="300" y="204" text-anchor="middle" font-size="10" fill="#666">① 若 null 返回 null</text>
  <text x="300" y="222" text-anchor="middle" font-size="10" fill="#666">② clone = new Node(val)</text>
  <text x="300" y="240" text-anchor="middle" font-size="10" fill="#666">③ 对每个 child:</text>
  <text x="300" y="254" text-anchor="middle" font-size="10" fill="#666">　clone.children ←</text>
  <text x="300" y="266" text-anchor="middle" font-size="10" fill="#666">　　dfs(child)</text>

  <text x="300" y="294" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">⚠ 无需哈希表</text>

  <!-- arrow original -> dfs -->
  <path d="M 175 210 L 222 210" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="198" y="202" text-anchor="middle" font-size="9" fill="#d6a040">递归</text>

  <!-- arrow dfs -> clone -->
  <path d="M 378 210 L 425 210" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="402" y="202" text-anchor="middle" font-size="9" fill="#4a7a3a">返回</text>

  <!-- ===== Right: cloned tree ===== -->
  <text x="490" y="76" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">克隆树（全新节点）</text>

  <!-- edges clone -->
  <path d="M 490 128 L 450 200" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 490 128 L 490 200" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 490 128 L 530 200" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 490 222 L 470 295" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 490 222 L 510 295" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <!-- nodes clone -->
  <ellipse cx="490" cy="110" rx="22" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="490" y="115" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1′</text>

  <ellipse cx="450" cy="210" rx="20" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="450" y="215" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">3′</text>

  <ellipse cx="490" cy="210" rx="20" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="490" y="215" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">2′</text>

  <ellipse cx="530" cy="210" rx="20" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="530" y="215" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">4′</text>

  <ellipse cx="470" cy="305" rx="18" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="470" y="310" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">5′</text>

  <ellipse cx="510" cy="305" rx="18" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="510" y="310" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">6′</text>

  <!-- footer note -->
  <rect x="40" y="350" width="520" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="370" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">对比 133 克隆图：图有环 1-2-3-4-1，沿邻居走会绕回起点 → 必须 map 防无限递归</text>
  <text x="300" y="388" text-anchor="middle" font-size="10.5" fill="#666">树每条边父→子单向、每点单父 → DFS 不会绕回 → 抽掉 map 即得本题解</text>
</svg>
