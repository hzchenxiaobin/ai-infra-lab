<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：字符系数法 — 竖式加法转化为 Σ(coeff × digit) = 0</text>
  <text x="280" y="39" text-anchor="middle" font-size="10.5" fill="#888">coeff(c) = Σ 10^pos (words) − Σ 10^pos (result)</text>

  <!-- Column weight labels -->
  <text x="195" y="56" text-anchor="middle" font-size="9.5" fill="#aaa">10⁴</text>
  <text x="238" y="56" text-anchor="middle" font-size="9.5" fill="#aaa">10³</text>
  <text x="281" y="56" text-anchor="middle" font-size="9.5" fill="#aaa">10²</text>
  <text x="324" y="56" text-anchor="middle" font-size="9.5" fill="#aaa">10¹</text>
  <text x="367" y="56" text-anchor="middle" font-size="9.5" fill="#aaa">10⁰</text>

  <!-- SEND row -->
  <rect x="219" y="62" width="38" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="238" y="81" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">S</text>
  <rect x="262" y="62" width="38" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="281" y="81" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">E</text>
  <rect x="305" y="62" width="38" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="324" y="81" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">N</text>
  <rect x="348" y="62" width="38" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="367" y="81" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">D</text>

  <!-- MORE row -->
  <text x="200" y="113" font-size="13" fill="#888">+</text>
  <rect x="219" y="95" width="38" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="238" y="114" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">M</text>
  <rect x="262" y="95" width="38" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="281" y="114" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">O</text>
  <rect x="305" y="95" width="38" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="324" y="114" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">R</text>
  <rect x="348" y="95" width="38" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="367" y="114" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">E</text>

  <!-- Line -->
  <line x1="195" y1="128" x2="390" y2="128" stroke="#666" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- MONEY row -->
  <rect x="176" y="132" width="38" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="195" y="151" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">M</text>
  <rect x="219" y="132" width="38" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="238" y="151" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">O</text>
  <rect x="262" y="132" width="38" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="281" y="151" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">N</text>
  <rect x="305" y="132" width="38" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="324" y="151" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">E</text>
  <rect x="348" y="132" width="38" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="367" y="151" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">Y</text>

  <!-- Side labels -->
  <text x="430" y="81" font-size="10" fill="#446688">words → +weight</text>
  <text x="430" y="151" font-size="10" fill="#b85450">result → −weight</text>

  <!-- Example coefficient computation -->
  <rect x="30" y="172" width="500" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="42" y="190" font-size="10.5" fill="#333">M: +1000 (MORE·10³) − 10000 (MONEY·10⁴) = −9000  ← |coeff| 最大，DFS 先赋值</text>
  <text x="42" y="206" font-size="10.5" fill="#333">S: +1000 (SEND·10³) − 0 = +1000  ← 次大，紧随其后</text>

  <!-- Coefficient table header -->
  <text x="280" y="232" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">按 |coeff| 降序排列的系数表</text>

  <!-- Row 1: M, S, O, N -->
  <rect x="35" y="240" width="115" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="58" y="260" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">M</text>
  <text x="105" y="260" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−9000</text>

  <rect x="165" y="240" width="115" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="188" y="260" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">S</text>
  <text x="235" y="260" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">+1000</text>

  <rect x="295" y="240" width="115" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="318" y="260" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">O</text>
  <text x="365" y="260" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−900</text>

  <rect x="425" y="240" width="115" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="448" y="260" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">N</text>
  <text x="495" y="260" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−90</text>

  <!-- Row 2: E, R, D, Y -->
  <rect x="35" y="280" width="115" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="58" y="300" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">E</text>
  <text x="105" y="300" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">+91</text>

  <rect x="165" y="280" width="115" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="300" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">R</text>
  <text x="235" y="300" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">+10</text>

  <rect x="295" y="280" width="115" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="318" y="300" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">D</text>
  <text x="365" y="300" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">+1</text>

  <rect x="425" y="280" width="115" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="448" y="300" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">Y</text>
  <text x="495" y="300" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−1</text>

  <!-- Key equation -->
  <rect x="30" y="325" width="500" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="347" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">→ Σ(coeff × digit) = 0 ⟺ (−9000)×M + 1000×S + (−900)×O + ⋯ + (−1)×Y = 0</text>

  <!-- Footer -->
  <text x="280" y="380" text-anchor="middle" font-size="10" fill="#888">蓝 = 正系数 (words 贡献) · 红 = 负系数 (result 贡献) · 首字母 ≠ 0 · 不同字符映射不同数字</text>
  <text x="280" y="395" text-anchor="middle" font-size="9.5" fill="#aaa">大系数先赋值 → 剪枝更紧 → DFS 搜索空间大幅缩小</text>
</svg>
