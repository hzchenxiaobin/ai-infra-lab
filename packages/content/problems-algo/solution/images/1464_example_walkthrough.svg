<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：nums = [3, 4, 5, 2]，一趟维护 max1 / max2</text>

  <!-- header row: step / num / max1 / max2 / 说明 -->
  <rect x="40" y="48" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">步</text>
  <rect x="100" y="48" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">nums[i]</text>
  <rect x="170" y="48" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">max1</text>
  <rect x="250" y="48" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">max2</text>
  <rect x="330" y="48" width="250" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="455" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">说明</text>

  <!-- Row 0: i=0, num=3 -->
  <rect x="40" y="80" width="60" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="98" text-anchor="middle" font-size="11" fill="#333">i=0</text>
  <rect x="100" y="80" width="70" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="135" y="98" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="170" y="80" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="210" y="98" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="250" y="80" width="80" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="290" y="98" text-anchor="middle" font-size="11" fill="#888">−∞</text>
  <rect x="330" y="80" width="250" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="455" y="98" text-anchor="middle" font-size="10.5" fill="#555">3 &gt; −∞ ⟹ max1 = 3</text>

  <!-- Row 1: i=1, num=4 -->
  <rect x="40" y="112" width="60" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="130" text-anchor="middle" font-size="11" fill="#333">i=1</text>
  <rect x="100" y="112" width="70" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="135" y="130" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <rect x="170" y="112" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="210" y="130" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <rect x="250" y="112" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="290" y="130" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="330" y="112" width="250" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="455" y="130" text-anchor="middle" font-size="10.5" fill="#555">4 &gt; 3 ⟹ max2=3, max1=4</text>

  <!-- Row 2: i=2, num=5 -->
  <rect x="40" y="144" width="60" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="162" text-anchor="middle" font-size="11" fill="#333">i=2</text>
  <rect x="100" y="144" width="70" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="135" y="162" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <rect x="170" y="144" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="210" y="162" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <rect x="250" y="144" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="290" y="162" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <rect x="330" y="144" width="250" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="455" y="162" text-anchor="middle" font-size="10.5" fill="#555">5 &gt; 4 ⟹ max2=4, max1=5</text>

  <!-- Row 3: i=3, num=2 -->
  <rect x="40" y="176" width="60" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="194" text-anchor="middle" font-size="11" fill="#333">i=3</text>
  <rect x="100" y="176" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="135" y="194" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="170" y="176" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="210" y="194" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <rect x="250" y="176" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="290" y="194" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <rect x="330" y="176" width="250" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="455" y="194" text-anchor="middle" font-size="10.5" fill="#555">2 不大于 5 也不大于 4 ⟹ 跳过</text>

  <!-- Result box -->
  <rect x="120" y="226" width="380" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="248" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">结果：max1=5, max2=4 ⟹ (5−1)(4−1) = 12 ⭐</text>

  <!-- second example note -->
  <line x1="40" y1="286" x2="580" y2="286" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="308" font-size="12" fill="#444" font-weight="bold">示例 2：nums = [1, 5, 4, 5]</text>

  <rect x="40" y="318" width="540" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="338" text-anchor="middle" font-size="11.5" fill="#555">两趟更新后 max1=5, max2=5（两个 5 分别落入 max1 / max2）</text>

  <rect x="40" y="354" width="540" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="374" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">(5−1)(5−1) = 4 × 4 = 16 ⭐</text>

  <rect x="40" y="396" width="540" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310" y="416" text-anchor="middle" font-size="11" fill="#555">关键：新最大出现时，旧 max1 降级为 max2——天然处理「两个并列最大」</text>
</svg>
