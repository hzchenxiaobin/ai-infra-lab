<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14.5" fill="#555" font-weight="bold">示例演算：nums1=[2,4,5,8,10], nums2=[4,6,8,9]</text>

  <!-- ===== Row 1: Segment A + junction 4 ===== -->
  <text x="30" y="60" font-size="11.5" fill="#446688" font-weight="bold">① 2 &lt; 4：sum1 吃掉 2 → sum1=2, i=1</text>
  <text x="30" y="76" font-size="11.5" fill="#b85450" font-weight="bold">② 4==4：切换点！ans += max(2,0)+4 = 6</text>

  <rect x="30" y="86" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="50" y="104" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <rect x="72" y="86" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="92" y="104" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">4</text>

  <text x="124" y="104" font-size="11" fill="#b85450" font-weight="bold">ans = 6</text>

  <!-- ===== Row 2: Segment B + junction 8 ===== -->
  <text x="30" y="134" font-size="11.5" fill="#446688" font-weight="bold">③ 5 &lt; 6：sum1 吃掉 5 → sum1=5, i=3</text>
  <text x="30" y="150" font-size="11.5" fill="#446688" font-weight="bold">④ 8 &gt; 6：sum2 吃掉 6 → sum2=6, j=2</text>
  <text x="30" y="166" font-size="11.5" fill="#b85450" font-weight="bold">⑤ 8==8：切换点！ans += max(5,6)+8 = 14</text>

  <!-- nums1 row seg B -->
  <rect x="30" y="176" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="50" y="194" text-anchor="middle" font-size="11.5" fill="#333">5</text>
  <rect x="72" y="176" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="92" y="194" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">8</text>

  <!-- nums2 row seg B -->
  <rect x="72" y="208" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="92" y="226" text-anchor="middle" font-size="11.5" fill="#333">6</text>

  <text x="124" y="200" font-size="10.5" fill="#4a7a3a">sum1=5</text>
  <text x="124" y="226" font-size="10.5" fill="#4a7a3a">sum2=6</text>
  <text x="190" y="200" font-size="11" fill="#b85450" font-weight="bold">取 max=6</text>
  <text x="190" y="226" font-size="11" fill="#b85450" font-weight="bold">ans = 20</text>

  <!-- ===== Row 3: Segment C (tail) ===== -->
  <text x="30" y="262" font-size="11.5" fill="#446688" font-weight="bold">⑥ 10 &gt; 9：sum2 吃掉 9 → sum2=9, j 用尽</text>
  <text x="30" y="278" font-size="11.5" fill="#446688" font-weight="bold">⑦ 剩余 nums1 的 10 → sum1=10</text>
  <text x="30" y="294" font-size="11.5" fill="#b85450" font-weight="bold">⑧ 收尾：ans += max(10,9) = 10</text>

  <!-- nums1 tail -->
  <rect x="30" y="304" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="50" y="322" text-anchor="middle" font-size="11.5" fill="#333">10</text>
  <!-- nums2 tail -->
  <rect x="72" y="304" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="92" y="322" text-anchor="middle" font-size="11.5" fill="#333">9</text>

  <text x="124" y="322" font-size="11" fill="#b85450" font-weight="bold">取 max=10</text>

  <!-- ===== Final result ===== -->
  <rect x="30" y="348" width="500" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="50" y="370" font-size="12" fill="#333" font-weight="bold">最终得分：</text>
  <text x="50" y="390" font-size="13" fill="#b85450" font-weight="bold">ans = 6 (段A+公共值4) + 14 (段B+公共值8) + 10 (段C收尾)</text>
  <text x="50" y="408" font-size="13" fill="#b85450" font-weight="bold">     = 30</text>

  <!-- best path highlight on right -->
  <rect x="380" y="368" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="450" y="384" text-anchor="middle" font-size="10.5" fill="#4a7a3a">最优路径：</text>
  <text x="450" y="398" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">2 → 4 → 6 → 8 → 10</text>
</svg>
