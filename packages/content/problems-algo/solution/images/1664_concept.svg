<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：删除下标 i 后，i 之后的元素奇偶翻转</text>

  <!-- ===== Top: original array ===== -->
  <text x="80" y="56" font-size="10" fill="#888">原数组 nums（偶数下标蓝 / 奇数下标绿）</text>

  <rect x="80" y="62" width="80" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="88" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">2</text>

  <rect x="160" y="62" width="80" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="88" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>

  <rect x="240" y="62" width="80" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="88" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">6</text>

  <rect x="320" y="62" width="80" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="88" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">4</text>

  <!-- index labels -->
  <text x="120" y="114" text-anchor="middle" font-size="9" fill="#888">下标 0（偶）</text>
  <text x="200" y="114" text-anchor="middle" font-size="9" fill="#888">下标 1（奇）</text>
  <text x="280" y="114" text-anchor="middle" font-size="9" fill="#888">下标 2（偶）</text>
  <text x="360" y="114" text-anchor="middle" font-size="9" fill="#888">下标 3（奇）</text>

  <!-- ===== Remove marker on index 2 ===== -->
  <path d="M 280 124 L 280 50" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)" opacity="0.7"/>
  <text x="430" y="88" font-size="10" fill="#b85450" font-weight="bold">✗ 删除下标 i=2</text>

  <!-- arrow down to new array -->
  <path d="M 300 130 L 300 150" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Middle: array after removal ===== -->
  <text x="80" y="166" font-size="10" fill="#888">删除后新数组（i=2 之后的元素下标 −1，奇偶翻转）</text>

  <rect x="80" y="172" width="80" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="198" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">2</text>

  <rect x="160" y="172" width="80" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="198" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- 4 flipped: was green(odd) now blue(even), highlight with red border -->
  <rect x="240" y="172" width="80" height="40" fill="#e8f0fe" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="198" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">4</text>

  <!-- new index labels -->
  <text x="120" y="224" text-anchor="middle" font-size="9" fill="#888">新下标 0（偶）</text>
  <text x="200" y="224" text-anchor="middle" font-size="9" fill="#888">新下标 1（奇）</text>
  <text x="280" y="224" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">新下标 2（偶）</text>

  <!-- flip annotations -->
  <text x="120" y="244" text-anchor="middle" font-size="9" fill="#4a7a3a">原偶→偶 不变</text>
  <text x="200" y="244" text-anchor="middle" font-size="9" fill="#4a7a3a">原奇→奇 不变</text>
  <text x="280" y="244" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">原奇→偶 翻转!</text>

  <!-- ===== Bottom: balance condition ===== -->
  <path d="M 300 256 L 300 274" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="278" width="520" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="298" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">删除下标 i 后的奇偶归属</text>
  <text x="300" y="316" text-anchor="middle" font-size="10" fill="#666">i 之前：奇偶不变  ·  i 之后：奇偶翻转</text>

  <rect x="40" y="344" width="520" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="364" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">平衡条件</text>
  <text x="300" y="382" text-anchor="middle" font-size="10" fill="#333">新偶和 = leftEven + rightOdd</text>
  <text x="300" y="398" text-anchor="middle" font-size="10" fill="#333">新奇和 = leftOdd + rightEven</text>
  <text x="300" y="414" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">平衡 ⇔ leftEven + rightOdd = leftOdd + rightEven</text>

  <!-- ===== Legend ===== -->
  <rect x="40" y="430" width="520" height="38" fill="#fff" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <rect x="54" y="442" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="74" y="453" font-size="9" fill="#446688">偶数下标</text>
  <rect x="160" y="442" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="180" y="453" font-size="9" fill="#4a7a3a">奇数下标</text>
  <rect x="260" y="442" width="14" height="14" fill="#e8f0fe" stroke="#b85450" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="280" y="453" font-size="9" fill="#b85450">翻转后的元素</text>
  <rect x="400" y="442" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="420" y="453" font-size="9" fill="#d6a040">规则说明</text>
</svg>
