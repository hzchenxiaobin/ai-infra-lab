<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="540" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：定长滑动窗口求最小窗口和</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888">windowSize = n − k，窗口右移时 O(1) 增量更新和</text>

  <!-- Step 1: preprocess -->
  <rect x="200" y="64" width="240" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="88" text-anchor="middle" font-size="12" fill="#333">① total = Σ cardPoints，windowSize = n − k</text>
  <path d="M 320 108 L 320 124" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: decision windowSize == 0 -->
  <polygon points="320,128 410,168 320,208 230,168" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="164" text-anchor="middle" font-size="11" fill="#333">windowSize == 0 ?</text>
  <text x="320" y="180" text-anchor="middle" font-size="10" fill="#888">(即 k == n，全部取走)</text>

  <!-- Yes branch: return total -->
  <path d="M 230 168 L 150 168" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="190" y="160" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="40" y="150" width="110" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="95" y="172" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return total</text>

  <!-- No branch -->
  <path d="M 320 208 L 320 224" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="335" y="220" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <!-- Step 3: init first window -->
  <rect x="180" y="228" width="280" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="252" text-anchor="middle" font-size="12" fill="#333">② winSum = Σ[0..windowSize−1]，minSum = winSum</text>
  <path d="M 320 272 L 320 288" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: loop decision i < n -->
  <polygon points="320,292 440,332 320,372 200,332" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="328" text-anchor="middle" font-size="11" fill="#333">i &lt; n ?  (i 从 windowSize 起)</text>
  <text x="320" y="344" text-anchor="middle" font-size="10" fill="#888">窗口右端逐位推进</text>

  <!-- Yes branch: update -->
  <path d="M 320 372 L 320 388" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="335" y="384" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="120" y="392" width="400" height="58" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="414" text-anchor="middle" font-size="12" fill="#333">③ winSum += cardPoints[i] − cardPoints[i − windowSize]</text>
  <text x="320" y="434" text-anchor="middle" font-size="12" fill="#333">④ minSum = min(minSum, winSum)；i++，回到 ④ 判定</text>
  <!-- loop back arrow -->
  <path d="M 520 421 L 560 421 L 560 332 L 440 332" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="568" y="376" font-size="10" fill="#888">循环</text>

  <!-- No branch: return -->
  <path d="M 200 332 L 130 332 L 130 460" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="165" y="324" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="40" y="448" width="180" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="130" y="472" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">⑤ return total − minSum</text>

  <!-- footer note -->
  <rect x="180" y="498" width="400" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="380" y="518" text-anchor="middle" font-size="11" fill="#b85450">单趟扫描 O(n)，额外空间 O(1)；窗口和增量更新免重复求和</text>
</svg>
