<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：cur 逐层 ×10+val，叶子处累加</text>
  <text x="270" y="42" text-anchor="middle" font-size="11" fill="#888">例2　root = [4,9,0,5,1]</text>

  <!-- root 4, cur=4 -->
  <circle cx="230" cy="76" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="230" y="81" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="262" y="64" width="46" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="285" y="79" text-anchor="middle" font-size="10" fill="#333">cur=4</text>

  <!-- node 9, cur=49 -->
  <circle cx="160" cy="128" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="160" y="133" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">9</text>
  <rect x="192" y="118" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="217" y="133" text-anchor="middle" font-size="10" fill="#333">cur=49</text>

  <!-- node 0, cur=40 (leaf) -->
  <circle cx="320" cy="128" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="133" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="346" y="118" width="50" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="371" y="133" text-anchor="middle" font-size="10" fill="#333">cur=40</text>
  <rect x="346" y="146" width="50" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="371" y="160" text-anchor="middle" font-size="9" fill="#8a6a20" font-weight="bold">叶 → 40</text>

  <path d="M 216 90 L 176 112" stroke="#4a7a3a" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <path d="M 244 90 L 304 112" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- node 5, cur=495 (leaf) -->
  <circle cx="100" cy="190" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.8" filter="url(#rough2)"/>
  <text x="100" y="195" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <rect x="126" y="180" width="58" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="155" y="195" text-anchor="middle" font-size="10" fill="#333">cur=495</text>
  <rect x="126" y="208" width="58" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="155" y="222" text-anchor="middle" font-size="9" fill="#8a6a20" font-weight="bold">叶 → 495</text>

  <!-- node 1, cur=491 (leaf) -->
  <circle cx="220" cy="190" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="220" y="195" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="246" y="180" width="58" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="275" y="195" text-anchor="middle" font-size="10" fill="#333">cur=491</text>
  <rect x="246" y="208" width="58" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="275" y="222" text-anchor="middle" font-size="9" fill="#8a6a20" font-weight="bold">叶 → 491</text>

  <path d="M 147 144 L 113 172" stroke="#4a7a3a" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <path d="M 173 144 L 207 172" stroke="#4a7a3a" stroke-width="2.2" fill="none" filter="url(#rough2)"/>

  <!-- sum row -->
  <path d="M 30 260 L 510 260" stroke="#dddddd" stroke-width="1.2" stroke-dasharray="3,4" filter="url(#rough2)"/>
  <text x="270" y="282" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">叶子累加</text>

  <rect x="60" y="296" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="120" y="314" text-anchor="middle" font-size="10" fill="#333">4 → 9 → 5</text>
  <text x="120" y="330" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">495</text>

  <rect x="200" y="296" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="314" text-anchor="middle" font-size="10" fill="#333">4 → 9 → 1</text>
  <text x="260" y="330" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">491</text>

  <rect x="340" y="296" width="120" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="400" y="314" text-anchor="middle" font-size="10" fill="#333">4 → 0</text>
  <text x="400" y="330" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">40</text>

  <!-- total -->
  <rect x="130" y="350" width="280" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="374" text-anchor="middle" font-size="14" fill="#8a6a20" font-weight="bold">495 + 491 + 40 = 1026</text>
</svg>
