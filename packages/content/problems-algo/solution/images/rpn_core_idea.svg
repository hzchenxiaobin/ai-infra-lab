<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：后缀表达式 = 操作数栈求值，遇运算符弹两个算</text>

  <!-- Token stream: 2  1  +  3  * -->
  <text x="30" y="62" font-size="12" fill="#888">后缀式:</text>
  <rect x="96" y="46" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="68" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="148" y="46" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="68" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="200" y="46" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="220" y="68" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">+</text>
  <rect x="248" y="46" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="68" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="300" y="46" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="320" y="68" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">*</text>

  <!-- legend -->
  <rect x="400" y="48" width="12" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="416" y="58" font-size="10" fill="#555">操作数</text>
  <rect x="460" y="48" width="12" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="476" y="58" font-size="10" fill="#555">运算符</text>

  <!-- Phase 1: operands push -->
  <text x="30" y="116" font-size="11" fill="#888" font-weight="bold">遇操作数 2、1：</text>
  <text x="170" y="116" font-size="11" fill="#446688">push → 栈底 [2] 在下，[2,1] 在上</text>
  <rect x="420" y="100" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="440" y="119" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="420" y="132" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="440" y="151" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="470" y="119" font-size="10" fill="#888">← 栈顶</text>
  <text x="470" y="151" font-size="10" fill="#888">← 栈底</text>

  <path d="M 440 164 L 440 178" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Phase 2: operator + pop two -->
  <text x="30" y="196" font-size="11" fill="#888" font-weight="bold">遇 +：</text>
  <text x="80" y="196" font-size="11" fill="#b85450" font-weight="bold">弹出 b=1, a=2 → 压回 a+b = 3</text>
  <!-- pop arrows -->
  <path d="M 460 188 L 500 174" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="506" y="176" font-size="10" fill="#b85450">b=1</text>
  <path d="M 460 210 L 500 196" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="506" y="198" font-size="10" fill="#b85450">a=2</text>
  <rect x="420" y="184" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="440" y="203" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="470" y="203" font-size="10" fill="#888">← a+b 压回</text>

  <path d="M 440 216 L 440 230" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Phase 3: result note -->
  <text x="30" y="274" font-size="11" fill="#888" font-weight="bold">最终：</text>
  <text x="90" y="274" font-size="11" fill="#4a7a3a">栈中仅剩一个元素，即表达式值</text>
  <rect x="420" y="258" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="440" y="277" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="470" y="277" font-size="10" fill="#888">= 2+1</text>

  <!-- bottom callout -->
  <rect x="30" y="304" width="540" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="326" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">关键：后缀式天然消除括号与优先级，从左到右扫一遍</text>
  <text x="300" y="344" text-anchor="middle" font-size="11" fill="#888">遇操作数 → 入栈；遇运算符 → pop 两个数（先弹的是右操作数 b，后弹的是左操作数 a）→ push(a op b)</text>
  <text x="300" y="358" text-anchor="middle" font-size="10" fill="#b85450">⚠️ 减法/除法有顺序：a − b、a / b，不能颠倒</text>
</svg>
