<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 9 4 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="300" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：分组取最大薪水（一行 / 员工）</text>

  <!-- ① FROM Salary -->
  <rect x="18" y="90" width="116" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="76" y="113" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① FROM Salary</text>
  <text x="76" y="131" text-anchor="middle" font-size="9" fill="#666">读取薪水表</text>
  <text x="76" y="145" text-anchor="middle" font-size="9" fill="#666">（含历史多行）</text>

  <path d="M 138 125 L 156 125" stroke="#446688" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② GROUP BY -->
  <rect x="158" y="90" width="116" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="216" y="113" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">② GROUP BY</text>
  <text x="216" y="131" text-anchor="middle" font-size="9" fill="#666">emp_id,</text>
  <text x="216" y="145" text-anchor="middle" font-size="9" fill="#666">firstname/lastname/dept</text>

  <path d="M 278 125 L 296 125" stroke="#446688" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ MAX(salary) -->
  <rect x="298" y="90" width="116" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="356" y="113" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">③ MAX(salary)</text>
  <text x="356" y="131" text-anchor="middle" font-size="9" fill="#666">AS salary</text>
  <text x="356" y="145" text-anchor="middle" font-size="9" fill="#666">组内取最大值</text>

  <path d="M 418 125 L 436 125" stroke="#446688" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ④ ORDER BY + 输出 -->
  <rect x="438" y="90" width="112" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="494" y="113" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">④ ORDER BY</text>
  <text x="494" y="131" text-anchor="middle" font-size="9" fill="#666">emp_id</text>
  <text x="494" y="145" text-anchor="middle" font-size="9" fill="#666">→ 输出结果</text>

  <!-- lower detail: what each step does -->
  <rect x="30" y="186" width="500" height="92" fill="#f7f7f7" stroke="#ccc" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="46" y="208" font-size="10" fill="#555" font-weight="bold">逐步说明</text>
  <text x="46" y="226" font-size="10" fill="#666">① 整张 Salary 表作为输入，每位员工可能有多行不同薪水记录。</text>
  <text x="46" y="242" font-size="10" fill="#666">② 按 emp_id 分组；姓名/部门是 emp_id 的函数依赖属性，一起放入 GROUP BY 即可携带出来。</text>
  <text x="46" y="258" font-size="10" fill="#666">③ 每组对 salary 取 MAX，得到该员工当前（最大）薪水，列名仍叫 salary。</text>
  <text x="46" y="274" font-size="10" fill="#666">④ 按 emp_id 升序排列输出，保证结果稳定可读。</text>
</svg>
