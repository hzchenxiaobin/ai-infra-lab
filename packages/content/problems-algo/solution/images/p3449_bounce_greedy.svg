<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：i ↔ i+1 之间「弹跳」——2 步操作，两格各得一次落地</text>

  <!-- points 标签 -->
  <g filter="url(#rough2)">
    <text x="85" y="56" text-anchor="middle" font-size="9.5" fill="#55677d">points[i−1]</text>
    <text x="195" y="56" text-anchor="middle" font-size="9.5" fill="#55677d">points[i]</text>
    <text x="305" y="56" text-anchor="middle" font-size="9.5" fill="#55677d">points[i+1]</text>
    <text x="415" y="56" text-anchor="middle" font-size="9.5" fill="#55677d">points[i+2]</text>
  </g>

  <!-- 格子 -->
  <g filter="url(#rough2)">
    <rect x="42" y="62" width="86" height="44" fill="#f0f0f0" stroke="#999" stroke-width="1.5" rx="4"/>
    <text x="85" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">i − 1</text>
    <text x="85" y="98" text-anchor="middle" font-size="9.5" fill="#888">已达标 ✓</text>

    <rect x="152" y="62" width="86" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <text x="195" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#33506b">i</text>
    <text x="195" y="98" text-anchor="middle" font-size="9.5" fill="#33506b">缺口待补</text>

    <rect x="262" y="62" width="86" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="305" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24">i + 1</text>
    <text x="305" y="98" text-anchor="middle" font-size="9.5" fill="#2f5d24">也有缺口</text>

    <rect x="372" y="62" width="86" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="5 3" rx="4"/>
    <text x="415" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1f">i + 2</text>
    <text x="415" y="98" text-anchor="middle" font-size="9.5" fill="#8a6d1f">还没轮到</text>
  </g>

  <!-- 弹跳弧线 -->
  <path d="M 212 116 Q 252 146 288 116" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 288 138 Q 252 172 214 138" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <text x="204" y="114" text-anchor="end" font-size="10" fill="#4a7a3a">①</text>
    <text x="298" y="136" text-anchor="start" font-size="10" fill="#446688">②</text>
    <text x="252" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">1 次弹跳 = 2 步操作</text>
    <text x="252" y="212" text-anchor="middle" font-size="10" fill="#555">① 落 i+1：gs[i+1] += p[i+1]　② 弹回 i：gs[i] += p[i]</text>
  </g>

  <!-- 对比面板 -->
  <g filter="url(#rough2)">
    <rect x="40" y="224" width="215" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="147" y="244" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24">✔ 向右弹跳（喂 i+1）</text>
    <text x="147" y="260" text-anchor="middle" font-size="9.5" fill="#55677d">i+1 自己也有缺口，</text>
    <text x="147" y="273" text-anchor="middle" font-size="9.5" fill="#55677d">喂它的每一口都不浪费</text>

    <rect x="275" y="224" width="215" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
    <text x="382" y="244" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">✘ 向左弹跳（喂 i−1）</text>
    <text x="382" y="260" text-anchor="middle" font-size="9.5" fill="#8f3a35">i−1 早已达标，</text>
    <text x="382" y="273" text-anchor="middle" font-size="9.5" fill="#8f3a35">同样的 2 步全打水漂</text>
  </g>

  <!-- 底部例 1 演算 -->
  <g filter="url(#rough2)">
    <rect x="40" y="292" width="452" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
    <text x="266" y="312" text-anchor="middle" font-size="10.5" fill="#333">例 1（p=[2,4], m=3）：落 0 (+2) → 弹到 1 (+4) → 弹回 0 (+2)</text>
    <text x="266" y="330" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6d1f">3 步后 gs = [4, 4]，min = 4 —— 末格已被喂饱，右移那步全省了 ✔</text>
  </g>
</svg>
