<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：arr = [1, 2, 4]，最终 |ans| = 6</text>

  <!-- Column headers -->
  <text x="40" y="52" font-size="11" fill="#888">步</text>
  <text x="100" y="52" text-anchor="middle" font-size="11" fill="#888">x (二进制)</text>
  <text x="220" y="52" text-anchor="middle" font-size="11" fill="#888">上一轮 cur</text>
  <text x="380" y="52" text-anchor="middle" font-size="11" fill="#888">新 cur = {x} ∪ {x|y}</text>
  <text x="540" y="52" text-anchor="middle" font-size="11" fill="#888">ans 累积</text>

  <path d="M 24 60 L 576 60" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 0: x=1 -->
  <text x="40" y="88" font-size="11" fill="#555">0</text>
  <rect x="78" y="76" width="44" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="100" y="92" text-anchor="middle" font-size="11" fill="#333">1 (001)</text>
  <text x="220" y="92" text-anchor="middle" font-size="11" fill="#999">∅</text>
  <rect x="338" y="76" width="56" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="366" y="92" text-anchor="middle" font-size="11" fill="#333">1 (001)</text>
  <text x="540" y="92" text-anchor="middle" font-size="11" fill="#555">{1}</text>

  <path d="M 24 106 L 576 106" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 1: x=2 -->
  <text x="40" y="132" font-size="11" fill="#555">1</text>
  <rect x="78" y="120" width="44" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="100" y="136" text-anchor="middle" font-size="11" fill="#333">2 (010)</text>
  <rect x="200" y="120" width="40" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="220" y="136" text-anchor="middle" font-size="11" fill="#555">{1}</text>
  <rect x="318" y="120" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="340" y="136" text-anchor="middle" font-size="11" fill="#333">2 (010)</text>
  <rect x="368" y="120" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="390" y="136" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3 (011)</text>
  <text x="540" y="136" text-anchor="middle" font-size="11" fill="#555">{1,2,3}</text>

  <path d="M 24 150 L 576 150" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 2: x=4 -->
  <text x="40" y="176" font-size="11" fill="#555">2</text>
  <rect x="78" y="164" width="44" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="100" y="180" text-anchor="middle" font-size="11" fill="#333">4 (100)</text>
  <rect x="196" y="164" width="48" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="220" y="180" text-anchor="middle" font-size="11" fill="#555">{2,3}</text>
  <rect x="294" y="164" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="316" y="180" text-anchor="middle" font-size="11" fill="#333">4 (100)</text>
  <rect x="342" y="164" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="364" y="180" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">6 (110)</text>
  <rect x="390" y="164" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="412" y="180" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">7 (111)</text>
  <text x="540" y="176" text-anchor="middle" font-size="11" fill="#555">{1,2,3,</text>
  <text x="540" y="190" text-anchor="middle" font-size="11" fill="#555">4,6,7}</text>

  <path d="M 24 202 L 576 202" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- annotation -->
  <text x="40" y="226" font-size="10" fill="#888">推导：</text>
  <text x="100" y="226" font-size="10" fill="#888">步1: 1|2 = 3  (001|010 = 011)  ✓ 新增第 1 位</text>
  <text x="100" y="242" font-size="10" fill="#888">步2: 4|2 = 6  (100|010 = 110),  4|3 = 7  (100|011 = 111)  ✓ 各新增一位</text>

  <!-- Result box -->
  <rect x="40" y="262" width="520" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="280" font-size="11" fill="#888">结果:</text>
  <text x="300" y="280" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">|ans| = 6  ✓ （不同值：1, 2, 3, 4, 6, 7）</text>
  <text x="300" y="298" text-anchor="middle" font-size="10" fill="#4a7a3a">每步 |cur| ≤ 3（远小于 31），集合去重自动跳过相同 OR 的冗余子数组</text>

  <!-- bit note -->
  <rect x="40" y="322" width="520" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="340" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">观察：二进制中 1 的个数严格递增 → 每个新值至少新增一个 1 位</text>
  <text x="300" y="356" text-anchor="middle" font-size="10" fill="#888">001(1个) → 011(2个) → 111(3个)；100(1个) → 110(2个) → 111(3个)</text>
</svg>
