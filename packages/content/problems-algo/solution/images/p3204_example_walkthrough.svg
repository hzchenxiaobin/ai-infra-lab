<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="372" fill="#fafafa"/>

  <text x="290" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：逐位竖式——「与」是短板效应，「或」是长板效应</text>
  <text x="290" y="40" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">竖着看每一列：与 = 一人缺位就整列归零；或 = 一人开灯就整列点亮</text>

  <!-- 表头：bit3..bit0 -->
  <rect x="130" y="54" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="66" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">bit3</text>
  <text x="152" y="77" text-anchor="middle" font-size="8" fill="#446688" filter="url(#rough2)">值 8</text>
  <rect x="174" y="54" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="196" y="66" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">bit2</text>
  <text x="196" y="77" text-anchor="middle" font-size="8" fill="#446688" filter="url(#rough2)">值 4</text>
  <rect x="218" y="54" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="66" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">bit1</text>
  <text x="240" y="77" text-anchor="middle" font-size="8" fill="#446688" filter="url(#rough2)">值 2</text>
  <rect x="262" y="54" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="284" y="66" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">bit0</text>
  <text x="284" y="77" text-anchor="middle" font-size="8" fill="#446688" filter="url(#rough2)">值 1</text>
  <text x="320" y="70" font-size="9" fill="#888" filter="url(#rough2)">→ 权限集合（值为 1 的位）</text>

  <!-- 用户 1：5 = 0101 -->
  <text x="124" y="95" text-anchor="end" font-size="10" fill="#333" filter="url(#rough2)">用户1（5）</text>
  <rect x="130" y="80" width="44" height="22" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="152" y="95" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <rect x="174" y="80" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="196" y="95" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="218" y="80" width="44" height="22" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="240" y="95" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <rect x="262" y="80" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="284" y="95" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="320" y="95" font-size="9" fill="#555" filter="url(#rough2)">→ {bit2, bit0}</text>

  <!-- 用户 2：12 = 1100 -->
  <text x="124" y="117" text-anchor="end" font-size="10" fill="#333" filter="url(#rough2)">用户2（12）</text>
  <rect x="130" y="102" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="152" y="117" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="174" y="102" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="196" y="117" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="218" y="102" width="44" height="22" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="240" y="117" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <rect x="262" y="102" width="44" height="22" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="284" y="117" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="320" y="117" font-size="9" fill="#555" filter="url(#rough2)">→ {bit3, bit2}</text>

  <!-- 用户 3：7 = 0111 -->
  <text x="124" y="139" text-anchor="end" font-size="10" fill="#333" filter="url(#rough2)">用户3（7）</text>
  <rect x="130" y="124" width="44" height="22" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="152" y="139" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <rect x="174" y="124" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="196" y="139" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="218" y="124" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="240" y="139" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="262" y="124" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="284" y="139" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="320" y="139" font-size="9" fill="#555" filter="url(#rough2)">→ {bit2, bit1, bit0}</text>

  <!-- 用户 4：3 = 0011 -->
  <text x="124" y="161" text-anchor="end" font-size="10" fill="#333" filter="url(#rough2)">用户4（3）</text>
  <rect x="130" y="146" width="44" height="22" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="152" y="161" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <rect x="174" y="146" width="44" height="22" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="196" y="161" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <rect x="218" y="146" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="240" y="161" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="262" y="146" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="284" y="161" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="320" y="161" font-size="9" fill="#555" filter="url(#rough2)">→ {bit1, bit0}</text>

  <!-- AND 行：0000 -->
  <text x="124" y="191" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">「与」全1才1</text>
  <rect x="130" y="174" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="152" y="191" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="174" y="174" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="196" y="191" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="218" y="174" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="240" y="191" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="262" y="174" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="284" y="191" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="320" y="191" font-size="9" fill="#b85450" filter="url(#rough2)">∩ 全体 = {} = 0000₂ = 0 ★ common_perms</text>

  <!-- OR 行：1111 -->
  <text x="124" y="217" text-anchor="end" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">「或」有1就1</text>
  <rect x="130" y="200" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="152" y="217" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="174" y="200" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="196" y="217" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="218" y="200" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="240" y="217" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="262" y="200" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="284" y="217" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="320" y="217" font-size="9" fill="#4a7a3a" filter="url(#rough2)">∪ 全体 = {bit3..bit0} = 1111₂ = 15 ★ any_perms</text>

  <!-- 每列的故事 -->
  <rect x="40" y="244" width="122" height="56" fill="#fff" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="101" y="262" text-anchor="middle" font-size="9" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">bit3（值 8）</text>
  <text x="101" y="277" text-anchor="middle" font-size="8" fill="#555" filter="url(#rough2)">只有用户 2 开灯</text>
  <text x="101" y="291" text-anchor="middle" font-size="8" fill="#8a6d1a" filter="url(#rough2)">→ 与 0 / 或 1</text>

  <rect x="172" y="244" width="122" height="56" fill="#fff" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="233" y="262" text-anchor="middle" font-size="9" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">bit2（值 4）</text>
  <text x="233" y="277" text-anchor="middle" font-size="8" fill="#555" filter="url(#rough2)">用户 4 掉队</text>
  <text x="233" y="291" text-anchor="middle" font-size="8" fill="#8a6d1a" filter="url(#rough2)">→ 与 0 / 或 1</text>

  <rect x="304" y="244" width="122" height="56" fill="#fff" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="365" y="262" text-anchor="middle" font-size="9" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">bit1（值 2）</text>
  <text x="365" y="277" text-anchor="middle" font-size="8" fill="#555" filter="url(#rough2)">用户 1、2 都没有</text>
  <text x="365" y="291" text-anchor="middle" font-size="8" fill="#8a6d1a" filter="url(#rough2)">→ 与 0 / 或 1</text>

  <rect x="436" y="244" width="122" height="56" fill="#fff" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="497" y="262" text-anchor="middle" font-size="9" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">bit0（值 1）</text>
  <text x="497" y="277" text-anchor="middle" font-size="8" fill="#555" filter="url(#rough2)">用户 2 没有</text>
  <text x="497" y="291" text-anchor="middle" font-size="8" fill="#8a6d1a" filter="url(#rough2)">→ 与 0 / 或 1</text>

  <rect x="40" y="312" width="518" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="299" y="331" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">结果：common_perms = 0000₂ = 0（没有任何权限是人人都有）；any_perms = 1111₂ = 15（四种权限都有人拥有）</text>
  <text x="299" y="347" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">与取「最短木板」（一人没有 ⇒ 大家都没有）；或取「最长木板」（一人拥有 ⇒ 全员都有）</text>
</svg>
