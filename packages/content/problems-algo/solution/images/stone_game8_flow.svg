<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：博弈 DP → 后缀最大值优化</text>

  <!-- ===== 1. 状态定义 ===== -->
  <rect x="30" y="38" width="460" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="46" y="58" font-size="11.5" fill="#446688" font-weight="bold">状态定义</text>
  <text x="46" y="76" font-size="11" fill="#333">f(i) = 当前玩家在状态 i（已消耗 stones[0..i]，积累石子 = prefix[i]）</text>
  <text x="46" y="90" font-size="11" fill="#333">下能获得的最优分差（当前玩家 − 对手）</text>

  <!-- ===== 2. 递推关系 ===== -->
  <rect x="30" y="104" width="460" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="46" y="124" font-size="11.5" fill="#4a7a3a" font-weight="bold">递推关系（Minimax：我选 max，对手选 min 对我）</text>
  <text x="46" y="142" font-size="11" fill="#333">选择 j ∈ [i+1, n−1]：拿走和 = prefix[j]，对手在状态 j 获净赚 f(j)</text>
  <text x="46" y="158" font-size="11.5" fill="#b85450" font-weight="bold">f(i) = max&#8202;{ prefix[j] − f(j) : j = i+1 .. n−1 }</text>
  <text x="46" y="174" font-size="10" fill="#888">边界 f(n−1) = 0（仅剩 1 个石子，游戏结束）</text>

  <!-- ===== 3. 优化：令 g(j) = prefix[j] − f(j) ===== -->
  <rect x="30" y="190" width="460" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="46" y="210" font-size="11.5" fill="#d6a040" font-weight="bold">优化：后缀最大值</text>
  <text x="46" y="228" font-size="11" fill="#333">令 g(j) = prefix[j] − f(j)，则 f(i) = max&#8202;{ g(j) : j = i+1..n−1 } = 后缀最大值</text>
  <text x="46" y="242" font-size="11" fill="#333">从右往左扫一遍，维护 suffix_max 即可 → O(n)</text>

  <!-- ===== 4. 右往左扫描示意 ===== -->
  <text x="30" y="266" font-size="11.5" fill="#446688" font-weight="bold">从右往左扫描（n−1 → 0）</text>

  <!-- index boxes n-1 .. 0 -->
  <rect x="30" y="276" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="54" y="290" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">i = n−1</text>
  <text x="54" y="304" text-anchor="middle" font-size="9.5" fill="#333">f=0</text>

  <path d="M 80 293 L 108 293" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="110" y="276" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="290" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">i = n−2</text>
  <text x="140" y="304" text-anchor="middle" font-size="9.5" fill="#333">f=smax</text>

  <path d="M 172 293 L 200 293" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="202" y="276" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="226" y="290" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">···</text>
  <text x="226" y="304" text-anchor="middle" font-size="9.5" fill="#333">···</text>

  <path d="M 252 293 L 280 293" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="282" y="276" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="290" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">i = 1</text>
  <text x="310" y="304" text-anchor="middle" font-size="9.5" fill="#333">f=smax</text>

  <path d="M 340 293 L 368 293" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="370" y="276" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="398" y="290" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">i = 0</text>
  <text x="398" y="304" text-anchor="middle" font-size="9.5" fill="#333">答案!</text>

  <!-- smax update annotation -->
  <text x="430" y="288" font-size="9.5" fill="#888">每步:</text>
  <text x="430" y="300" font-size="9.5" fill="#333">f = smax</text>
  <text x="430" y="312" font-size="9.5" fill="#333">g = p[i]−f</text>

  <!-- loop body box -->
  <rect x="30" y="324" width="460" height="44" fill="#fafafa" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="46" y="342" font-size="10.5" fill="#555" font-weight="bold">循环体（i 从 n−2 到 1）：</text>
  <text x="46" y="358" font-size="10.5" fill="#446688">smax = max(smax, prefix[i] − smax)   ← f(i)=smax, g(i)=prefix[i]−f(i), 更新 smax</text>
  <text x="46" y="368" font-size="10" fill="#b85450" font-weight="bold">答案 = f(0) = 最终的 smax</text>
</svg>
