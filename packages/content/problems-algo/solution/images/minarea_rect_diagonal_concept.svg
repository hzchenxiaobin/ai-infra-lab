<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">对角线配对：两对角点 → 唯一确定矩形</text>

  <!-- coordinate axes -->
  <path d="M 60 320 L 380 320" stroke="#bbb" stroke-width="1.5" fill="none" filter="url(#rough)"/>
  <path d="M 80 340 L 80 80" stroke="#bbb" stroke-width="1.5" fill="none" filter="url(#rough)"/>
  <text x="386" y="324" font-size="11" fill="#aaa">x</text>
  <text x="76" y="76" font-size="11" fill="#aaa">y</text>

  <!-- rectangle fill -->
  <rect x="140" y="120" width="160" height="140" fill="#e8f0fe" fill-opacity="0.5" stroke="none" filter="url(#rough2)"/>

  <!-- rectangle edges (dashed) -->
  <path d="M 140 120 L 300 120" stroke="#6a9acc" stroke-width="2" fill="none" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <path d="M 300 120 L 300 260" stroke="#6a9acc" stroke-width="2" fill="none" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <path d="M 300 260 L 140 260" stroke="#6a9acc" stroke-width="2" fill="none" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <path d="M 140 260 L 140 120" stroke="#6a9acc" stroke-width="2" fill="none" stroke-dasharray="6,4" filter="url(#rough2)"/>

  <!-- diagonal line -->
  <path d="M 140 260 L 300 120" stroke="#d6a040" stroke-width="2.5" fill="none" filter="url(#rough2)"/>

  <!-- p1 = (x1, y1) bottom-left -->
  <circle cx="140" cy="260" r="7" fill="#b85450" stroke="#8a3a36" stroke-width="2" filter="url(#rough2)"/>
  <text x="110" y="278" font-size="12" fill="#b85450" font-weight="bold">p₁=(x₁,y₁)</text>

  <!-- p2 = (x2, y2) top-right -->
  <circle cx="300" cy="120" r="7" fill="#b85450" stroke="#8a3a36" stroke-width="2" filter="url(#rough2)"/>
  <text x="312" y="114" font-size="12" fill="#b85450" font-weight="bold">p₂=(x₂,y₂)</text>

  <!-- derived corner (x1, y2) top-left -->
  <circle cx="140" cy="120" r="6" fill="#82b366" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="80" y="114" font-size="11" fill="#4a7a3a" font-weight="bold">(x₁,y₂)</text>
  <text x="80" y="100" font-size="9.5" fill="#82b366">待查存在?</text>

  <!-- derived corner (x2, y1) bottom-right -->
  <circle cx="300" cy="260" r="6" fill="#82b366" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="312" y="270" font-size="11" fill="#4a7a3a" font-weight="bold">(x₂,y₁)</text>
  <text x="312" y="284" font-size="9.5" fill="#82b366">待查存在?</text>

  <!-- hash set box -->
  <rect x="400" y="110" width="100" height="170" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="450" y="132" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">point_set</text>
  <line x1="412" y1="140" x2="488" y2="140" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="450" y="158" text-anchor="middle" font-size="10" fill="#555">{ (1,1),</text>
  <text x="450" y="172" text-anchor="middle" font-size="10" fill="#555">(1,3),</text>
  <text x="450" y="186" text-anchor="middle" font-size="10" fill="#555">(3,1),</text>
  <text x="450" y="200" text-anchor="middle" font-size="10" fill="#555">(3,3),</text>
  <text x="450" y="214" text-anchor="middle" font-size="10" fill="#555">... }</text>
  <text x="450" y="240" text-anchor="middle" font-size="9.5" fill="#82b366">count → O(1)</text>
  <text x="450" y="254" text-anchor="middle" font-size="9.5" fill="#82b366">查点存在性</text>

  <!-- arrows from derived corners to hash set -->
  <path d="M 155 112 Q 280 90 398 150" stroke="#82b366" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <path d="M 315 258 Q 380 230 398 175" stroke="#82b366" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- area formula -->
  <rect x="100" y="340" width="320" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="361" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">area = |x₁−x₂| × |y₁−y₂|  → 更新 min</text>
</svg>
