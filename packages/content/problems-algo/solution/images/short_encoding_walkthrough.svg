<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">示例演算：words = ["time","me","bell"]</text>

  <!-- Step rows -->
  <text x="30" y="60" font-size="11" fill="#888" font-weight="bold">插入过程（逐词反转后入树）：</text>

  <!-- step 1: time -->
  <rect x="30" y="68" width="540" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="44" y="92" font-size="11" fill="#446688" font-weight="bold">① time</text>
  <text x="100" y="92" font-size="10.5" fill="#555">→ 反转 emit → 建 root-e-m-i-t，t 为叶子</text>
  <text x="430" y="92" font-size="10.5" fill="#2e8b57" font-weight="bold">此时 t 是叶子</text>

  <!-- step 2: me -->
  <rect x="30" y="114" width="540" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="44" y="138" font-size="11" fill="#b85450" font-weight="bold">② me</text>
  <text x="100" y="138" font-size="10.5" fill="#555">→ 反转 em → 复用 root-e-m，m 标记为词尾</text>
  <text x="430" y="138" font-size="10.5" fill="#b85450" font-weight="bold">m 现在有子节点 i</text>

  <!-- step 3: bell -->
  <rect x="30" y="160" width="540" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="44" y="184" font-size="11" fill="#4a7a3a" font-weight="bold">③ bell</text>
  <text x="100" y="184" font-size="10.5" fill="#555">→ 反转 lleb → 建 root-l-l-e-b，b 为叶子</text>
  <text x="430" y="184" font-size="10.5" fill="#2e8b57" font-weight="bold">b 是叶子</text>

  <!-- DFS scan -->
  <text x="30" y="226" font-size="11" fill="#888" font-weight="bold">DFS 扫描叶子并累加：</text>

  <rect x="30" y="234" width="540" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="44" y="257" font-size="10.5" fill="#555">root → e：e 有子节点(继续) → m：m 有子节点(继续) → i → t：</text>
  <text x="478" y="257" font-size="10.5" fill="#2e8b57" font-weight="bold">叶子 d=4</text>

  <rect x="30" y="276" width="540" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="44" y="299" font-size="10.5" fill="#555">root → l：l 有子节点(继续) → l → e → b：</text>
  <text x="390" y="299" font-size="10.5" fill="#2e8b57" font-weight="bold">叶子 d=4</text>

  <!-- accumulation table -->
  <text x="30" y="340" font-size="11" fill="#888" font-weight="bold">累加结果：</text>

  <rect x="30" y="348" width="180" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="120" y="368" text-anchor="middle" font-size="10.5" fill="#2e6e2e" font-weight="bold">叶子 t (time)</text>
  <text x="120" y="386" text-anchor="middle" font-size="11" fill="#555">4 + 1 = 5</text>
  <text x="120" y="400" text-anchor="middle" font-size="9.5" fill="#2e8b57">未被覆盖 ✓</text>

  <rect x="230" y="348" width="140" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="300" y="368" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">词尾 m (me)</text>
  <text x="300" y="386" text-anchor="middle" font-size="11" fill="#555">非叶子 = 0</text>
  <text x="300" y="400" text-anchor="middle" font-size="9.5" fill="#b85450">被 time 覆盖 ✗</text>

  <rect x="390" y="348" width="180" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="480" y="368" text-anchor="middle" font-size="10.5" fill="#2e6e2e" font-weight="bold">叶子 b (bell)</text>
  <text x="480" y="386" text-anchor="middle" font-size="11" fill="#555">4 + 1 = 5</text>
  <text x="480" y="400" text-anchor="middle" font-size="9.5" fill="#2e8b57">未被覆盖 ✓</text>

  <!-- final -->
  <rect x="180" y="412" width="240" height="0" fill="none"/>
  <path d="M 120 404 Q 180 416 240 404" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 480 404 Q 420 416 360 404" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="416" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">ans = 5 + 5 = 10</text>
</svg>
