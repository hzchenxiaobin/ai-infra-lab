<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：扫描断点，断点处闭合上一段、开启新段</text>

  <!-- Start -->
  <rect x="200" y="44" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="17" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">start = nums[0], i = 1</text>
  <path d="M 280 80 L 280 100" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop header -->
  <rect x="190" y="104" width="180" height="30" fill="#f6f6f6" stroke="#888" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="124" text-anchor="middle" font-size="11.5" fill="#333">for i in [1, n−1]</text>
  <path d="M 280 136 L 280 158" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision diamond: nums[i] == nums[i-1]+1 ? -->
  <path d="M 280 162 L 380 210 L 280 258 L 180 210 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="206" text-anchor="middle" font-size="11.5" fill="#333">nums[i] ==</text>
  <text x="280" y="222" text-anchor="middle" font-size="11.5" fill="#333">nums[i−1]+1 ?</text>

  <!-- Yes branch: left, back to loop -->
  <path d="M 180 210 L 120 210 L 120 119 L 190 119" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="148" y="202" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <text x="100" y="170" text-anchor="middle" font-size="10" fill="#4a7a3a" font-style="italic">连续，跳过</text>

  <!-- No branch: down -->
  <path d="M 280 258 L 280 282" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="296" y="274" font-size="11" fill="#b85450" font-weight="bold">否（断点）</text>

  <!-- close range box -->
  <rect x="140" y="286" width="280" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="308" text-anchor="middle" font-size="11.5" fill="#333">闭合上一段：</text>
  <text x="280" y="326" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">start == nums[i−1] ? "start" : "start-&gt;nums[i−1]"</text>
  <text x="280" y="344" text-anchor="middle" font-size="11" fill="#333">start = nums[i]</text>

  <!-- back to loop from close box -->
  <path d="M 420 318 L 470 318 L 470 119 L 370 119" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- after loop: close last range -->
  <path d="M 280 350 L 280 372" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="140" y="376" width="280" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="394" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">循环结束：闭合最后一段</text>
  <text x="280" y="412" text-anchor="middle" font-size="11" fill="#446688">start == nums[n−1] ? "start" : "start-&gt;nums[n−1]"</text>

  <!-- end -->
  <path d="M 280 420 L 280 440" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="210" y="444" width="140" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="461" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return res</text>
</svg>
