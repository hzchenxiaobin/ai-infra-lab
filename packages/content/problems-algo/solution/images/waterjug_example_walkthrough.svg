<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：x=3, y=5, target=4（gcd=1，4%1=0，4≤8 → 数学法判 true）</text>

  <text x="50" y="56" font-size="11" fill="#446688" font-weight="bold">模拟倒水过程（每格=1 升）</text>

  <!-- 壶图例：左壶容量 3，右壶容量 5 -->
  <text x="430" y="56" font-size="10.5" fill="#888">左壶容量 3 · 右壶容量 5</text>

  <!-- ===================== Row 1: states 1-4, baseline by=150 ===================== -->

  <!-- State 1: (0,0) cx=60 -->
  <path d="M 28 108 L 28 150 L 54 150 L 54 108" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <line x1="26" y1="108" x2="56" y2="108" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 66 80 L 66 150 L 92 150 L 92 80" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <line x1="64" y1="80" x2="94" y2="80" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="168" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">(0, 0)</text>
  <text x="60" y="182" text-anchor="middle" font-size="9.5" fill="#888">初始</text>

  <!-- arrow 1->2 -->
  <path d="M 100 130 L 138 130" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="119" y="122" text-anchor="middle" font-size="9" fill="#4a7a3a">装满5</text>

  <!-- State 2: (0,5) cx=180 -->
  <path d="M 148 108 L 148 150 L 174 150 L 174 108" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <line x1="146" y1="108" x2="176" y2="108" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 186 80 L 186 150 L 212 150 L 212 80" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <line x1="184" y1="80" x2="214" y2="80" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="187" y="80" width="24" height="70" fill="#e8f0fe" filter="url(#rough2)"/>
  <text x="180" y="168" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">(0, 5)</text>
  <text x="180" y="182" text-anchor="middle" font-size="9.5" fill="#888">壶5满</text>

  <!-- arrow 2->3 -->
  <path d="M 220 130 L 258 130" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="239" y="122" text-anchor="middle" font-size="9" fill="#4a7a3a">5→3</text>

  <!-- State 3: (3,2) cx=310 -->
  <path d="M 278 108 L 278 150 L 304 150 L 304 108" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <line x1="276" y1="108" x2="306" y2="108" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="279" y="108" width="24" height="42" fill="#e8f0fe" filter="url(#rough2)"/>
  <path d="M 316 80 L 316 150 L 342 150 L 342 80" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <line x1="314" y1="80" x2="344" y2="80" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="317" y="122" width="24" height="28" fill="#e8f0fe" filter="url(#rough2)"/>
  <text x="310" y="168" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">(3, 2)</text>
  <text x="310" y="182" text-anchor="middle" font-size="9.5" fill="#888">壶3满</text>

  <!-- arrow 3->4 -->
  <path d="M 350 130 L 388 130" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="369" y="122" text-anchor="middle" font-size="9" fill="#4a7a3a">倒空3</text>

  <!-- State 4: (0,2) cx=440 -->
  <path d="M 408 108 L 408 150 L 434 150 L 434 108" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <line x1="406" y1="108" x2="436" y2="108" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 446 80 L 446 150 L 472 150 L 472 80" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <line x1="444" y1="80" x2="474" y2="80" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="447" y="122" width="24" height="28" fill="#e8f0fe" filter="url(#rough2)"/>
  <text x="440" y="168" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">(0, 2)</text>
  <text x="440" y="182" text-anchor="middle" font-size="9.5" fill="#888">剩2升</text>

  <!-- wrap arrow 4 -> 5 (down then left) -->
  <path d="M 460 192 Q 460 220 380 220 Q 60 220 60 248" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="260" y="214" text-anchor="middle" font-size="9.5" fill="#4a7a3a">2→3（把壶5剩的2升倒进壶3）</text>

  <!-- ===================== Row 2: states 5-7, baseline by=300 ===================== -->

  <!-- State 5: (2,0) cx=60 -->
  <path d="M 28 258 L 28 300 L 54 300 L 54 258" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <line x1="26" y1="258" x2="56" y2="258" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="29" y="272" width="24" height="28" fill="#e8f0fe" filter="url(#rough2)"/>
  <path d="M 66 230 L 66 300 L 92 300 L 92 230" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <line x1="64" y1="230" x2="94" y2="230" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="318" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">(2, 0)</text>

  <!-- arrow 5->6 -->
  <path d="M 100 280 L 138 280" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="119" y="272" text-anchor="middle" font-size="9" fill="#4a7a3a">装满5</text>

  <!-- State 6: (2,5) cx=180 -->
  <path d="M 148 258 L 148 300 L 174 300 L 174 258" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <line x1="146" y1="258" x2="176" y2="258" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="149" y="272" width="24" height="28" fill="#e8f0fe" filter="url(#rough2)"/>
  <path d="M 186 230 L 186 300 L 212 300 L 212 230" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <line x1="184" y1="230" x2="214" y2="230" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="187" y="230" width="24" height="70" fill="#e8f0fe" filter="url(#rough2)"/>
  <text x="180" y="318" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">(2, 5)</text>

  <!-- arrow 6->7 -->
  <path d="M 220 280 L 258 280" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="239" y="272" text-anchor="middle" font-size="9" fill="#4a7a3a">5→3</text>

  <!-- State 7: (3,4) cx=310 — target reached, highlight -->
  <rect x="266" y="222" width="92" height="106" fill="#fce4ec" stroke="#b85450" stroke-width="0" rx="8" filter="url(#rough2)" opacity="0.45"/>
  <path d="M 278 258 L 278 300 L 304 300 L 304 258" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <line x1="276" y1="258" x2="306" y2="258" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="279" y="258" width="24" height="42" fill="#fce4ec" filter="url(#rough2)"/>
  <path d="M 316 230 L 316 300 L 342 300 L 342 230" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <line x1="314" y1="230" x2="344" y2="230" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="317" y="244" width="24" height="56" fill="#fce4ec" filter="url(#rough2)"/>
  <text x="310" y="318" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">(3, 4)</text>

  <!-- target callout -->
  <path d="M 360 270 L 398 270" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="400" y="252" width="140" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="470" y="270" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">壶5 中剩 4 升</text>
  <text x="470" y="285" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">= target ✓</text>

  <!-- bottom note -->
  <rect x="60" y="400" width="440" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="421" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">数学法只需：gcd(3,5)=1，4 % 1 == 0，4 ≤ 3+5=8 → true</text>
  <text x="280" y="440" text-anchor="middle" font-size="10.5" fill="#4a7a3a">模拟 6 步找到，数学法 O(log min(x,y)) 一步判定</text>
</svg>
