<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">示例 2：nums = [2,3,5,7,7,7,5]，andValues = [0, 7, 5]</text>

  <!-- legend -->
  <rect x="482" y="14" width="12" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="498" y="24" font-size="9.5" fill="#a07818" filter="url(#rough2)">组尾</text>

  <!-- ============ row 1 (best) ============ -->
  <text x="56" y="83" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">①</text>
  <g filter="url(#rough2)">
    <path d="M 76 56 L 210 56 M 76 56 L 76 51 M 210 56 L 210 51" stroke="#4a7a3a" stroke-width="1.4" fill="none"/>
    <path d="M 217 56 L 351 56 M 217 56 L 217 51 M 351 56 L 351 51" stroke="#4a7a3a" stroke-width="1.4" fill="none"/>
    <path d="M 358 56 L 398 56 M 358 56 L 358 51 M 398 56 L 398 51" stroke="#4a7a3a" stroke-width="1.4" fill="none"/>
  </g>
  <g font-size="9.5" fill="#4a7a3a" font-weight="bold" text-anchor="middle" filter="url(#rough2)">
    <text x="143" y="46">2&amp;3&amp;5 = 0 ✓</text>
    <text x="284" y="46">7&amp;7&amp;7 = 7 ✓</text>
    <text x="378" y="46">5 ✓</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="76" y="64" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="123" y="64" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="170" y="64" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="217" y="64" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="264" y="64" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="311" y="64" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="358" y="64" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
  </g>
  <g font-size="12" fill="#333" font-weight="bold" text-anchor="middle" filter="url(#rough2)">
    <text x="96" y="83">2</text>
    <text x="143" y="83">3</text>
    <text x="190" y="83">5</text>
    <text x="237" y="83">7</text>
    <text x="284" y="83">7</text>
    <text x="331" y="83">7</text>
    <text x="378" y="83">5</text>
  </g>
  <g font-size="11" fill="#a07818" font-weight="bold" text-anchor="middle" filter="url(#rough2)">
    <text x="190" y="112">+5</text>
    <text x="331" y="112">+7</text>
    <text x="378" y="112">+5</text>
  </g>
  <text x="491" y="52" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">最小 ✓</text>
  <rect x="436" y="62" width="110" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="491" y="83" text-anchor="middle" font-size="12.5" fill="#3a6230" font-weight="bold" filter="url(#rough2)">5+7+5 = 17</text>

  <!-- ============ row 2 ============ -->
  <text x="56" y="163" font-size="12" fill="#888" font-weight="bold" filter="url(#rough2)">②</text>
  <g filter="url(#rough2)">
    <path d="M 76 136 L 257 136 M 76 136 L 76 131 M 257 136 L 257 131" stroke="#999" stroke-width="1.3" fill="none"/>
    <path d="M 264 136 L 351 136 M 264 136 L 264 131 M 351 136 L 351 131" stroke="#999" stroke-width="1.3" fill="none"/>
    <path d="M 358 136 L 398 136 M 358 136 L 358 131 M 398 136 L 398 131" stroke="#999" stroke-width="1.3" fill="none"/>
  </g>
  <g font-size="9.5" fill="#888" text-anchor="middle" filter="url(#rough2)">
    <text x="166" y="126">2&amp;3&amp;5&amp;7 = 0 ✓</text>
    <text x="307" y="126">7&amp;7 = 7 ✓</text>
    <text x="378" y="126">5 ✓</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="76" y="144" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="123" y="144" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="170" y="144" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="217" y="144" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="264" y="144" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="311" y="144" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="358" y="144" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
  </g>
  <g font-size="12" fill="#333" font-weight="bold" text-anchor="middle" filter="url(#rough2)">
    <text x="96" y="163">2</text>
    <text x="143" y="163">3</text>
    <text x="190" y="163">5</text>
    <text x="237" y="163">7</text>
    <text x="284" y="163">7</text>
    <text x="331" y="163">7</text>
    <text x="378" y="163">5</text>
  </g>
  <g font-size="11" fill="#a07818" font-weight="bold" text-anchor="middle" filter="url(#rough2)">
    <text x="237" y="192">+7</text>
    <text x="331" y="192">+7</text>
    <text x="378" y="192">+5</text>
  </g>
  <rect x="436" y="142" width="110" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="491" y="163" text-anchor="middle" font-size="12" fill="#a04038" font-weight="bold" filter="url(#rough2)">7+7+5 = 19</text>

  <!-- ============ row 3 ============ -->
  <text x="56" y="243" font-size="12" fill="#888" font-weight="bold" filter="url(#rough2)">③</text>
  <g filter="url(#rough2)">
    <path d="M 76 216 L 304 216 M 76 216 L 76 211 M 304 216 L 304 211" stroke="#999" stroke-width="1.3" fill="none"/>
    <path d="M 311 216 L 351 216 M 311 216 L 311 211 M 351 216 L 351 211" stroke="#999" stroke-width="1.3" fill="none"/>
    <path d="M 358 216 L 398 216 M 358 216 L 358 211 M 398 216 L 398 211" stroke="#999" stroke-width="1.3" fill="none"/>
  </g>
  <g font-size="9.5" fill="#888" text-anchor="middle" filter="url(#rough2)">
    <text x="190" y="206">2&amp;3&amp;5&amp;7&amp;7 = 0 ✓</text>
    <text x="331" y="206">7 ✓</text>
    <text x="378" y="206">5 ✓</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="76" y="224" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="123" y="224" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="170" y="224" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="217" y="224" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="264" y="224" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="311" y="224" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="358" y="224" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
  </g>
  <g font-size="12" fill="#333" font-weight="bold" text-anchor="middle" filter="url(#rough2)">
    <text x="96" y="243">2</text>
    <text x="143" y="243">3</text>
    <text x="190" y="243">5</text>
    <text x="237" y="243">7</text>
    <text x="284" y="243">7</text>
    <text x="331" y="243">7</text>
    <text x="378" y="243">5</text>
  </g>
  <g font-size="11" fill="#a07818" font-weight="bold" text-anchor="middle" filter="url(#rough2)">
    <text x="284" y="272">+7</text>
    <text x="331" y="272">+7</text>
    <text x="378" y="272">+5</text>
  </g>
  <rect x="436" y="222" width="110" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="491" y="243" text-anchor="middle" font-size="12" fill="#a04038" font-weight="bold" filter="url(#rough2)">7+7+5 = 19</text>

  <!-- bottom note -->
  <rect x="36" y="300" width="488" height="76" fill="#ffffff" stroke="#999" stroke-width="1.2" stroke-dasharray="6,4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="11" fill="#335" font-weight="bold" filter="url(#rough2)">三种划分的各组 AND 全部命中 —— 差别只在组尾切在哪</text>
  <text x="280" y="342" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">最优解让第一组收在小值 5 上、把 7 藏进组内：最小化 = 为每次闭合挑最便宜的组尾</text>
  <text x="280" y="362" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">示例 1 唯一划分 4+3+3+2 = 12；示例 3 中 1&amp;2&amp;3&amp;4 = 0 ≠ 2，一组都闭不上 → −1</text>
</svg>
