<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：recordTweet / getTweetCountsPerFrequency</text>

  <!-- recordTweet 分支 -->
  <rect x="40" y="56" width="150" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="115" y="83" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">recordTweet(name, t)</text>

  <rect x="40" y="116" width="150" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="115" y="143" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">insort：有序插入 t</text>
  <path d="M115,100 L115,116" stroke="#446688" stroke-width="1.6" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- getTweetCountsPerFrequency 分支 -->
  <rect x="300" y="56" width="220" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="410" y="83" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">getTweetCountsPerFrequency(...)</text>

  <rect x="300" y="116" width="220" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="410" y="138" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">delta = minute60/hour3600/day86400</text>
  <text x="410" y="153" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">n = (endTime − startTime)/delta + 1</text>
  <path d="M410,100 L410,116" stroke="#446688" stroke-width="1.6" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- 循环菱形 -->
  <polygon points="410,184 470,214 410,244 350,214" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="410" y="210" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i = 0 … n−1 ?</text>
  <text x="410" y="226" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">遍历每个 chunk</text>
  <path d="M410,160 L410,184" stroke="#446688" stroke-width="1.6" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- 循环体 -->
  <rect x="300" y="262" width="220" height="64" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="410" y="282" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">lo = startTime + i·delta</text>
  <text x="410" y="298" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">hi = min(lo+delta−1, endTime)</text>
  <text x="410" y="316" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">l=bisect_left(lo), r=bisect_right(hi)</text>
  <path d="M470,214 Q520,214 520,294 L520,294 Q520,294 520,294" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- 计数入结果 -->
  <rect x="300" y="346" width="220" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="410" y="373" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">res.append(r − l)</text>
  <path d="M410,326 L410,346" stroke="#446688" stroke-width="1.6" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- 回到菱形 -->
  <path d="M300,368 Q250,368 250,214 L350,214" fill="none" stroke="#446688" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="244" y="300" font-size="11" fill="#888" filter="url(#rough2)">下一 chunk</text>

  <!-- 返回 -->
  <rect x="300" y="412" width="220" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="410" y="435" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">return res</text>
  <path d="M410,390 L410,412" stroke="#446688" stroke-width="1.6" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="478" y="408" font-size="11" fill="#888" filter="url(#rough2)">i ≥ n</text>
</svg>
