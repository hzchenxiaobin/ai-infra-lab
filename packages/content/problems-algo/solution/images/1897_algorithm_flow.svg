<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：统计总数 → 逐字符验整除性</text>

  <!-- N1: 统计频次 + n -->
  <rect x="80" y="42" width="260" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="210" y="62" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">统计 count[c] = 所有 words 中字符 c 的总数</text>
  <text x="210" y="78" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">n = len(words)</text>
  <path d="M 210 86 L 210 104" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- N2: 取下一个字符 c -->
  <rect x="110" y="104" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="210" y="124" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">取下一个字符 c ∈ a..z</text>
  <path d="M 210 134 L 210 152" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- N3: diamond count[c] % n == 0 ?  center (210,167) -->
  <polygon points="210,152 278,167 210,182 142,167" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="210" y="171" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">count[c] % n == 0 ?</text>
  <!-- N3 No -> right: 返回 false -->
  <path d="M 278 167 L 360 167" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="318" y="162" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="360" y="152" width="120" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="420" y="172" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 false</text>
  <!-- N3 Yes -> down -->
  <path d="M 210 182 L 210 210" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="224" y="200" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- N4: diamond 还有下一个字符 ?  center (210,225) -->
  <polygon points="210,210 272,225 210,240 148,225" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="210" y="229" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">还有下一个字符 ?</text>
  <!-- N4 Yes -> loop back to N2: left to x=40, up to y=119, right to N2 left (110,119) -->
  <path d="M 148 225 L 50 225 L 50 119 L 106 119" stroke="#666" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="58" y="175" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">是：继续</text>
  <!-- N4 No -> down -->
  <path d="M 210 240 L 210 268" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="224" y="258" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- N5: 遍历结束 -->
  <rect x="130" y="268" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="210" y="288" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">所有字符均整除</text>
  <path d="M 210 298 L 210 316" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- N6: 返回 true -->
  <rect x="130" y="316" width="160" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="210" y="338" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 true</text>

  <!-- Divider -->
  <path d="M 40 380 L 480 380" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Insight box -->
  <rect x="50" y="394" width="420" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="414" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">关键不变式</text>
  <text x="70" y="434" font-size="11" fill="#333" filter="url(#rough2)">• 字符可在串间任意移动 → 各字符总数在操作前后不变</text>
  <text x="70" y="450" font-size="11" fill="#333" filter="url(#rough2)">• n 串相等 ⇔ 每个字符总数恰被 n 整除 → 每串分到 count[c]/n 个</text>
</svg>
