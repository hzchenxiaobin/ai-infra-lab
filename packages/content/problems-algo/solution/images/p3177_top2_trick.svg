<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">「排除 v 列的行最大值」怎么 O(1)？—— 每行只记前两名</text>
  <text x="260" y="42" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">以第 j−1 行的 dp 值为例（6 列，值只增不减）</text>

  <rect x="110" y="52" width="48" height="30" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="134" y="72" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4</text>
  <rect x="160" y="52" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="184" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="210" y="52" width="48" height="30" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="234" y="72" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <rect x="260" y="52" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="284" y="72" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="310" y="52" width="48" height="30" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="334" y="72" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">5</text>
  <rect x="360" y="52" width="48" height="30" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="384" y="72" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>

  <text x="134" y="98" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">列0</text>
  <text x="184" y="98" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">列1</text>
  <text x="234" y="98" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">列2</text>
  <text x="284" y="98" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">列3</text>
  <text x="334" y="98" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">列4</text>
  <text x="384" y="98" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">列5</text>

  <text x="80" y="124" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">mx₁ = 7（arg₁ = 列1）</text>
  <path d="M 118 113 C 122 102, 128 94, 133 86" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="340" y="124" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">mx₂ = 7（列3）</text>
  <path d="M 338 113 C 334 102, 328 94, 313 86" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="40" y="132" width="216" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="148" y="152" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">当前 v ≠ arg₁（如 v = 列2）</text>
  <text x="148" y="172" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">max{y≠v} = mx₁ = 7</text>
  <text x="148" y="190" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">直接取行最大即可 ✓</text>

  <rect x="264" y="132" width="216" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="372" y="152" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">当前 v = arg₁（v = 列1）</text>
  <text x="372" y="172" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">行最大被 v 自己占用 → 用 mx₂ = 7</text>
  <text x="372" y="190" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">次大顶上 ✓</text>

  <rect x="40" y="216" width="440" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="236" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">每次写入 dp[j][x] = 新值（值只增）→ 三分支 O(1) 增量维护</text>
  <text x="58" y="256" font-size="9.5" fill="#555" filter="url(#rough2)">① arg₁ = x：mx₁ ← 新值（最大仍在自己手里）</text>
  <text x="58" y="274" font-size="9.5" fill="#555" filter="url(#rough2)">② 新值 &gt; mx₁：mx₂ ← mx₁，mx₁ ← 新值，arg₁ ← x（新王登基）</text>
  <text x="58" y="292" font-size="9.5" fill="#555" filter="url(#rough2)">③ 新值 &gt; mx₂：mx₂ ← 新值（只挤掉次大）；三条都不中则不动</text>

  <rect x="40" y="318" width="440" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="260" y="330" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">对照 940「总和减自身」：计数半环可用总和减自己；max 半环没有减法，</text>
  <text x="260" y="346" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">但「前两名」足以表达排除任意单列的最大值</text>
</svg>
