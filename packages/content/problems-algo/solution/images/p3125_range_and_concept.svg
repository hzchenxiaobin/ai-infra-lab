<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：最高位是「最后一面倒下的旗」</text>
  <text x="260" y="46" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">以 n = 17 = 0b10001 为例，x = 4（最高置位比特）</text>

  <text x="185" y="64" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">↓ 最后一面旗</text>

  <!-- bit column headers -->
  <text x="185" y="80" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">2^4</text>
  <text x="228" y="80" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">2^3</text>
  <text x="271" y="80" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">2^2</text>
  <text x="314" y="80" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">2^1</text>
  <text x="357" y="80" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">2^0</text>

  <!-- row 17 -->
  <text x="152" y="106" text-anchor="end" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">n = 17</text>
  <rect x="165" y="86" width="41" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="185" y="106" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="208" y="86" width="41" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="228" y="106" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="251" y="86" width="41" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="271" y="106" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="294" y="86" width="41" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="314" y="106" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="337" y="86" width="41" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="357" y="106" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="400" y="106" font-size="11" fill="#aaa" filter="url(#rough2)">起点</text>

  <!-- row 16 -->
  <text x="152" y="142" text-anchor="end" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">16</text>
  <rect x="165" y="122" width="41" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="185" y="142" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="208" y="122" width="41" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="228" y="142" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="251" y="122" width="41" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="271" y="142" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="294" y="122" width="41" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="314" y="142" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="337" y="122" width="41" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="357" y="142" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="400" y="136" font-size="11" fill="#4a7a3a" filter="url(#rough2)">100…0</text>
  <text x="400" y="150" font-size="11" fill="#4a7a3a" filter="url(#rough2)">清光低位</text>

  <!-- row 15 -->
  <text x="152" y="178" text-anchor="end" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">15</text>
  <rect x="165" y="158" width="41" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="185" y="178" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="208" y="158" width="41" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="228" y="178" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="251" y="158" width="41" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="271" y="178" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="294" y="158" width="41" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="314" y="178" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="337" y="158" width="41" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="357" y="178" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="400" y="172" font-size="11" fill="#b85450" filter="url(#rough2)">011…1</text>
  <text x="400" y="186" font-size="11" fill="#b85450" filter="url(#rough2)">击穿第 x 位</text>

  <!-- conclusion boxes -->
  <rect x="48" y="202" width="424" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="223" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">[16, 17]：人人第 4 位都是 1 → AND = 0b10000 ≠ 0</text>

  <path d="M 260 234 L 260 248" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="48" y="252" width="424" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="273" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">[15, 17]：16 清光低位 + 15 击穿高位 → AND = 0</text>

  <rect x="48" y="294" width="424" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="314" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">ans = 2^x − 1 = 2^4 − 1 = 15</text>

  <rect x="48" y="336" width="424" height="26" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="353" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">m ≥ 2^x 时区间 ⊆ [2^x, 2^(x+1))，第 x 位全为 1 —— 上界被卡死</text>

  <rect x="48" y="370" width="424" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="386" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">从 n 下降连与：低位陆续熄灭，最后倒下的旗 = 最高位</text>
</svg>
