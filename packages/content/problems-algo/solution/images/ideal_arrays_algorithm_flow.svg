<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：预处理组合数 + SPF 分解求积性前缀和</text>

  <!-- Box 1 -->
  <rect x="70" y="40" width="380" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="60" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① maxE = ⌊log₂ maxValue⌋  （maxValue≤10⁴ ⟹ maxE≤13）</text>

  <path d="M 260 74 L 260 88" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 2 -->
  <rect x="70" y="90" width="380" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="110" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② 预处理 fact / invFact ∈[0, n−1+maxE] ⟹ C(a,b) 取 O(1)</text>

  <path d="M 260 124 L 260 138" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 3 -->
  <rect x="70" y="140" width="380" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="160" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ SPF 筛：spf[x] = x 的最小质因子  O(M log log M)</text>

  <path d="M 260 174 L 260 188" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 4 -->
  <rect x="70" y="190" width="380" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="210" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">④ 遍历 v ∈[1, maxValue]：</text>
  <text x="260" y="228" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">分解 v，cnt(v) = ∏ⱼ C(n−1+eⱼ, eⱼ) mod p</text>

  <path d="M 260 236 L 260 250" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 5 -->
  <rect x="70" y="252" width="380" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="272" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">⑤ ans = Σ cnt(v) mod 1e9+7</text>

  <!-- Footer notes -->
  <text x="260" y="308" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">时间 O(maxValue·log maxValue + n)，空间 O(maxValue + n)</text>
  <text x="260" y="326" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">② 与 ③ 顺序可换；④ 的分解用 spf 逐步除，每个 v 仅 O(log v) 步</text>
  <text x="260" y="344" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">maxE 仅 13 ⟹ fact 数组至多 ~10013 项，预处理极快</text>
</svg>
