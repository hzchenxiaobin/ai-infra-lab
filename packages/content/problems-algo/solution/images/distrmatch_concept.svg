<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">贪心策略：I 取最小 low，D 取最大 high</text>

  <!-- Row 1: input string s = IDID -->
  <text x="40" y="74" font-size="12" fill="#888">输入 s:</text>
  <rect x="100" y="54" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="128" y="75" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">I</text>
  <rect x="160" y="54" width="56" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="75" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">D</text>
  <rect x="220" y="54" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="248" y="75" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">I</text>
  <rect x="280" y="54" width="56" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="308" y="75" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">D</text>

  <!-- arrows under each char: I=up, D=down -->
  <text x="128" y="102" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">↑ 递增</text>
  <text x="188" y="102" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">↓ 递减</text>
  <text x="248" y="102" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">↑ 递增</text>
  <text x="308" y="102" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">↓ 递减</text>

  <!-- Row 2: candidate value pool [0,1,2,3,4] with low / high -->
  <text x="40" y="148" font-size="12" fill="#888">值池:</text>
  <rect x="100" y="128" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="128" y="149" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="160" y="128" width="56" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="188" y="149" text-anchor="middle" font-size="13" fill="#888">1</text>
  <rect x="220" y="128" width="56" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="248" y="149" text-anchor="middle" font-size="13" fill="#888">2</text>
  <rect x="280" y="128" width="56" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="308" y="149" text-anchor="middle" font-size="13" fill="#888">3</text>
  <rect x="340" y="128" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="368" y="149" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>

  <!-- low / high pointer labels -->
  <text x="128" y="176" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">↑ low</text>
  <text x="368" y="176" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">high ↑</text>

  <!-- bracket arrow: low and high converge -->
  <path d="M 128 184 Q 248 200 368 184" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="248" y="204" text-anchor="middle" font-size="11" fill="#888">两端向中间收拢</text>

  <!-- Row 3: result permutation -->
  <text x="40" y="252" font-size="12" fill="#888">结果:</text>
  <rect x="100" y="232" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="128" y="253" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="160" y="232" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="188" y="253" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="220" y="232" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="248" y="253" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="280" y="232" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="308" y="253" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="340" y="232" width="56" height="32" fill="#f5f5f5" stroke="#888" stroke-width="1.5" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="368" y="253" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">2</text>

  <!-- annotations linking result to pointer -->
  <text x="128" y="282" text-anchor="middle" font-size="10" fill="#4a7a3a">I→low</text>
  <text x="188" y="282" text-anchor="middle" font-size="10" fill="#d6a040">D→high</text>
  <text x="248" y="282" text-anchor="middle" font-size="10" fill="#4a7a3a">I→low</text>
  <text x="308" y="282" text-anchor="middle" font-size="10" fill="#d6a040">D→high</text>
  <text x="368" y="282" text-anchor="middle" font-size="10" fill="#888">收尾</text>

  <!-- Insight box -->
  <rect x="40" y="300" width="460" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="322" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">I → 取 low（当前最小值），low++；D → 取 high（当前最大值），high--</text>
  <text x="270" y="342" text-anchor="middle" font-size="11" fill="#666">留出最大余量：I 后必更大故取最小，D 后必更小故取最大</text>
  <text x="270" y="358" text-anchor="middle" font-size="11" fill="#666">最后 low == high，填入末位即可</text>
</svg>
