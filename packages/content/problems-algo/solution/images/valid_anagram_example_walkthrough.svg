<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s="anagram", t="nagaram"</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">逐对抵消：cnt[s[i]]++ 与 cnt[t[i]]−− 同步进行</text>

  <!-- ====== Two strings with current index marker ====== -->
  <text x="16" y="72" font-size="11" fill="#446688" font-weight="bold">s：</text>
  <g font-size="12">
    <rect x="48" y="56" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="64" y="75" text-anchor="middle" fill="#333">a</text>
    <rect x="82" y="56" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="98" y="75" text-anchor="middle" fill="#333">n</text>
    <rect x="116" y="56" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="132" y="75" text-anchor="middle" fill="#333">a</text>
    <rect x="150" y="56" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="166" y="75" text-anchor="middle" fill="#333">g</text>
    <rect x="184" y="56" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="200" y="75" text-anchor="middle" fill="#333">r</text>
    <rect x="218" y="56" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="234" y="75" text-anchor="middle" fill="#333">a</text>
    <rect x="252" y="56" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="268" y="75" text-anchor="middle" fill="#333">m</text>
  </g>

  <text x="16" y="108" font-size="11" fill="#4a7a3a" font-weight="bold">t：</text>
  <g font-size="12">
    <rect x="48" y="92" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="64" y="111" text-anchor="middle" fill="#333">n</text>
    <rect x="82" y="92" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="98" y="111" text-anchor="middle" fill="#333">a</text>
    <rect x="116" y="92" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="132" y="111" text-anchor="middle" fill="#333">g</text>
    <rect x="150" y="92" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="166" y="111" text-anchor="middle" fill="#333">a</text>
    <rect x="184" y="92" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="200" y="111" text-anchor="middle" fill="#333">r</text>
    <rect x="218" y="92" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="234" y="111" text-anchor="middle" fill="#333">a</text>
    <rect x="252" y="92" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="268" y="111" text-anchor="middle" fill="#333">m</text>
  </g>

  <!-- index labels -->
  <g font-size="8.5" fill="#aaa">
    <text x="64" y="130" text-anchor="middle">0</text>
    <text x="98" y="130" text-anchor="middle">1</text>
    <text x="132" y="130" text-anchor="middle">2</text>
    <text x="166" y="130" text-anchor="middle">3</text>
    <text x="200" y="130" text-anchor="middle">4</text>
    <text x="234" y="130" text-anchor="middle">5</text>
    <text x="268" y="130" text-anchor="middle">6</text>
  </g>

  <!-- ====== Counter state table ====== -->
  <text x="16" y="158" font-size="11" fill="#446688" font-weight="bold">cnt[26] 状态（只列 a/g/m/n/r，其余恒为 0）</text>

  <!-- header -->
  <g font-size="10">
    <text x="40" y="180" text-anchor="middle" fill="#888" font-weight="bold">步</text>
    <rect x="58" y="168" width="48" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="82" y="183" text-anchor="middle" fill="#888">a</text>
    <rect x="108" y="168" width="48" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="132" y="183" text-anchor="middle" fill="#888">g</text>
    <rect x="158" y="168" width="48" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="182" y="183" text-anchor="middle" fill="#888">m</text>
    <rect x="208" y="168" width="48" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="232" y="183" text-anchor="middle" fill="#888">n</text>
    <rect x="258" y="168" width="48" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="282" y="183" text-anchor="middle" fill="#888">r</text>
    <text x="330" y="183" font-size="9.5" fill="#888">操作</text>
  </g>

  <!-- rows: step / a / g / m / n / r / action -->
  <g font-size="10.5">
    <!-- init -->
    <text x="40" y="206" text-anchor="middle" fill="#888">初始</text>
    <rect x="58" y="194" width="48" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="82" y="209" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>
    <rect x="108" y="194" width="48" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="132" y="209" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>
    <rect x="158" y="194" width="48" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="182" y="209" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>
    <rect x="208" y="194" width="48" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="232" y="209" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>
    <rect x="258" y="194" width="48" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="282" y="209" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>
    <text x="330" y="209" font-size="9.5" fill="#888">cnt={0}</text>

    <!-- i=0: s[0]=a (+1), t[0]=n (-1) -->
    <text x="40" y="232" text-anchor="middle" fill="#d6a040" font-weight="bold">i=0</text>
    <rect x="58" y="220" width="48" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="82" y="235" text-anchor="middle" fill="#333">1</text>
    <rect x="108" y="220" width="48" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="132" y="235" text-anchor="middle" fill="#aaa">0</text>
    <rect x="158" y="220" width="48" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="182" y="235" text-anchor="middle" fill="#aaa">0</text>
    <rect x="208" y="220" width="48" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="232" y="235" text-anchor="middle" fill="#333">−1</text>
    <rect x="258" y="220" width="48" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="282" y="235" text-anchor="middle" fill="#aaa">0</text>
    <text x="330" y="235" font-size="9.5" fill="#555">a+1, n−1</text>

    <!-- i=1: s[1]=n (+1), t[1]=a (-1) -->
    <text x="40" y="258" text-anchor="middle" fill="#d6a040" font-weight="bold">i=1</text>
    <rect x="58" y="246" width="48" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="82" y="261" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>
    <rect x="108" y="246" width="48" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="132" y="261" text-anchor="middle" fill="#aaa">0</text>
    <rect x="158" y="246" width="48" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="182" y="261" text-anchor="middle" fill="#aaa">0</text>
    <rect x="208" y="246" width="48" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="232" y="261" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>
    <rect x="258" y="246" width="48" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="282" y="261" text-anchor="middle" fill="#aaa">0</text>
    <text x="330" y="261" font-size="9.5" fill="#555">n+1, a−1 → 抵消</text>

    <!-- i=2: s[2]=a (+1), t[2]=g (-1) -->
    <text x="40" y="284" text-anchor="middle" fill="#d6a040" font-weight="bold">i=2</text>
    <rect x="58" y="272" width="48" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="82" y="287" text-anchor="middle" fill="#333">1</text>
    <rect x="108" y="272" width="48" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="132" y="287" text-anchor="middle" fill="#333">−1</text>
    <rect x="158" y="272" width="48" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="182" y="287" text-anchor="middle" fill="#aaa">0</text>
    <rect x="208" y="272" width="48" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="232" y="287" text-anchor="middle" fill="#aaa">0</text>
    <rect x="258" y="272" width="48" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="282" y="287" text-anchor="middle" fill="#aaa">0</text>
    <text x="330" y="287" font-size="9.5" fill="#555">a+1, g−1</text>

    <!-- i=3: s[3]=g (+1), t[3]=a (-1) -->
    <text x="40" y="310" text-anchor="middle" fill="#d6a040" font-weight="bold">i=3</text>
    <rect x="58" y="298" width="48" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="82" y="313" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>
    <rect x="108" y="298" width="48" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="132" y="313" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>
    <rect x="158" y="298" width="48" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="182" y="313" text-anchor="middle" fill="#aaa">0</text>
    <rect x="208" y="298" width="48" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="232" y="313" text-anchor="middle" fill="#aaa">0</text>
    <rect x="258" y="298" width="48" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="282" y="313" text-anchor="middle" fill="#aaa">0</text>
    <text x="330" y="313" font-size="9.5" fill="#555">g+1, a−1 → 抵消</text>

    <!-- i=4,5,6 combined -->
    <text x="40" y="336" text-anchor="middle" fill="#d6a040" font-weight="bold">i=4~6</text>
    <rect x="58" y="324" width="48" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="82" y="339" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>
    <rect x="108" y="324" width="48" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="132" y="339" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>
    <rect x="158" y="324" width="48" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="182" y="339" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>
    <rect x="208" y="324" width="48" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="232" y="339" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>
    <rect x="258" y="324" width="48" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="282" y="339" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>
    <text x="330" y="339" font-size="9.5" fill="#555">r,m,a 各自抵消</text>

    <!-- final -->
    <text x="40" y="362" text-anchor="middle" fill="#4a7a3a" font-weight="bold">校验</text>
    <rect x="58" y="350" width="248" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="182" y="365" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">全 0 → return true ✓</text>
  </g>

  <!-- ====== legend ====== -->
  <rect x="420" y="194" width="128" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="484" y="212" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">图例</text>
  <rect x="432" y="220" width="16" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="456" y="230" font-size="9.5" fill="#555">s 计数 +1</text>
  <rect x="432" y="238" width="16" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="456" y="248" font-size="9.5" fill="#555">t 抵消 −1</text>
  <rect x="432" y="256" width="16" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="456" y="266" font-size="9.5" fill="#555">归零 ✓</text>
  <rect x="432" y="274" width="16" height="12" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="2" filter="url(#rough2)"/>
  <text x="456" y="284" font-size="9.5" fill="#555">未涉及 = 0</text>
</svg>
