<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">一次放置 = 在剩余篮子里找最左的 容量 ≥ f 的位置</text>

  <!-- Part A: 扫描 fruit 4 -->
  <text x="78" y="58" text-anchor="end" font-size="11" fill="#888">水果:</text>
  <rect x="90" y="40" width="54" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="117" y="58" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="152" y="58" font-size="10" fill="#666">fruits[0]，数量 4</text>

  <text x="78" y="122" text-anchor="end" font-size="11" fill="#888">baskets:</text>
  <rect x="90" y="104" width="54" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="117" y="122" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="150" y="104" width="54" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="177" y="122" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="210" y="104" width="54" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="237" y="122" text-anchor="middle" font-size="12" fill="#333">4</text>

  <path d="M 117 70 C 117 86, 148 90, 170 101" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="175" y="84" font-size="9.5" fill="#666">从左往右扫</text>

  <text x="300" y="110" font-size="10" fill="#888">跳过容量不足的，</text>
  <text x="300" y="126" font-size="10" fill="#888">停在第一个够装的</text>

  <text x="117" y="144" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">✗ 3 &lt; 4</text>
  <text x="177" y="144" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓ 5 ≥ 4 占用!</text>
  <text x="237" y="144" text-anchor="middle" font-size="9" fill="#999">（还没轮到）</text>

  <!-- Part B: 示例 1 最终结果 -->
  <text x="260" y="172" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">示例 1 全过程：fruits = [4,2,5]，baskets = [3,5,4] → 答案 1</text>

  <text x="78" y="204" text-anchor="end" font-size="11" fill="#888">fruits:</text>
  <rect x="90" y="186" width="54" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="117" y="204" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="150" y="186" width="54" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="177" y="204" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="210" y="186" width="54" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="237" y="204" text-anchor="middle" font-size="12" fill="#333">5</text>

  <text x="78" y="250" text-anchor="end" font-size="11" fill="#888">baskets:</text>
  <rect x="90" y="232" width="54" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="117" y="250" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="150" y="232" width="54" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="177" y="250" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="210" y="232" width="54" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="237" y="250" text-anchor="middle" font-size="12" fill="#333">4</text>

  <path d="M 122 214 C 140 221, 156 225, 172 229" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 172 214 C 156 221, 140 225, 122 229" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="237" y="226" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">✗</text>
  <text x="298" y="250" font-size="10" fill="#b85450">5 &gt; 4 装不下 → 未放置</text>

  <text x="117" y="274" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">装水果 2</text>
  <text x="177" y="274" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">装水果 4</text>
  <text x="237" y="274" text-anchor="middle" font-size="9.5" fill="#999">空着</text>

  <rect x="40" y="286" width="440" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="305" text-anchor="middle" font-size="11" fill="#333">占用即删除：篮子被占用后置 0（哨兵），后续水果视它不存在</text>

  <rect x="40" y="324" width="440" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="343" text-anchor="middle" font-size="11" fill="#333">n ≤ 100 用双重循环；数据放大 = 线段树「最左 ≥ x」原语（3479）</text>
</svg>
