<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：按右端点排序，a[i] 左侧劈成「相容前缀」与「重叠禁选区」</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">示例 1：块内为区间 / 权重（原下标）；考察橙色 a[i] = [6,9]，l = 6</text>

  <!-- sorted interval blocks -->
  <text x="20" y="84" font-size="11" fill="#333" filter="url(#rough2)">排序后：</text>

  <rect x="88" y="62" width="70" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="123" y="81" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1,3]</text>
  <text x="123" y="98" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">w2 (0)</text>

  <rect x="162" y="62" width="70" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="197" y="81" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1,5]</text>
  <text x="197" y="98" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">w5 (2)</text>

  <rect x="236" y="62" width="70" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="271" y="81" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[4,5]</text>
  <text x="271" y="98" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">w2 (1)</text>

  <rect x="310" y="62" width="70" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="345" y="81" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[6,7]</text>
  <text x="345" y="98" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">w1 (4)</text>
  <path d="M 312 64 L 378 106 M 378 64 L 312 106" stroke="#b85450" stroke-width="1.4" opacity="0.5" filter="url(#rough2)"/>

  <rect x="384" y="62" width="70" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="419" y="81" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[6,9]</text>
  <text x="419" y="98" text-anchor="middle" font-size="10" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">w3 (3)</text>
  <text x="448" y="52" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">a[i] ↙</text>
  <path d="M 445 56 L 432 60" fill="none" stroke="#d6a040" stroke-width="1.3" marker-end="url(#arro)" filter="url(#rough2)"/>

  <rect x="458" y="62" width="50" height="46" rx="4" fill="#f3f3f3" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="483" y="81" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">[8,9]</text>
  <text x="483" y="98" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">w1(5)</text>

  <text x="123" y="118" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">0</text>
  <text x="197" y="118" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">1</text>
  <text x="271" y="118" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">2</text>
  <text x="345" y="118" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">3</text>
  <text x="419" y="118" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">4 = i</text>
  <text x="483" y="118" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">5</text>

  <!-- green bracket for compatible prefix -->
  <path d="M 88 128 L 88 134 L 304 134 L 304 128" fill="none" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="196" y="150" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">相容前缀 [0, k=3)：r &lt; 6，可与 a[i] 同选 → f[k][j−1]</text>

  <!-- red label for overlapping zone -->
  <text x="345" y="150" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">r ≥ 6，重叠禁选 ✗</text>

  <!-- gray note for positions after i -->
  <text x="483" y="150" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">位置 &gt; i，</text>
  <text x="483" y="163" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">后续才处理</text>

  <!-- transition section -->
  <text x="20" y="188" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">转移：两条出路汇入 min 比较器（状态 = (−得分, 下标序列)）</text>

  <rect x="36" y="202" width="170" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="121" y="223" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">不选 a[i]</text>
  <text x="121" y="242" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">f[i][j] 原样传递</text>

  <rect x="314" y="202" width="170" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="399" y="223" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">选 a[i]（必是已选的最右一个）</text>
  <text x="399" y="242" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">f[k][j−1] + w，并入 idx</text>

  <path d="M 121 254 C 150 281 205 291 238 292" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 399 254 C 370 281 315 291 282 292" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <circle cx="260" cy="302" r="21" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="307" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">min</text>

  <path d="M 260 324 L 260 340" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arro)" filter="url(#rough2)"/>

  <rect x="170" y="344" width="180" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="366" text-anchor="middle" font-size="12.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">f[i+1][j]</text>

  <text x="260" y="392" text-anchor="middle" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">min 比较序：先比 −得分（小 ⇒ 得分更大）；得分并列再比下标序列（字典序小 ⇒ 字典序最小）</text>
</svg>
