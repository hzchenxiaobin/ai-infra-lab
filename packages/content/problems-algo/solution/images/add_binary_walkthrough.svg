<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 680" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="680" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：1010 + 1011，逐位累加得到 10101</text>

  <!-- ===== Round 1 (bit0) : a[3]=0, b[3]=1, carry=0 -> sum=1, bit=1, carry=0 ===== -->
  <text x="40" y="62" font-size="12" fill="#b85450" font-weight="bold">第 1 轮（最低位 2⁰）</text>
  <text x="44" y="92" font-size="11" fill="#888">a:</text>
  <rect x="130" y="76" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="148" y="97" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="168" y="76" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="186" y="97" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="206" y="76" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="224" y="97" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="244" y="76" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="262" y="97" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <text x="262" y="66" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">i=3</text>
  <text x="44" y="128" font-size="11" fill="#888">b:</text>
  <rect x="130" y="112" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="148" y="133" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="168" y="112" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="186" y="133" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="206" y="112" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="224" y="133" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="244" y="112" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="262" y="133" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="262" y="156" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">j=3</text>
  <text x="300" y="104" font-size="11" fill="#666">→ 0 + 1 + 0 =</text>
  <rect x="404" y="88" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="424" y="108" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="456" y="104" font-size="11" fill="#4a7a3a">写 1，carry=0</text>

  <!-- ===== Round 2 (bit1) : a[2]=1, b[2]=1, carry=0 -> sum=2, bit=0, carry=1 ===== -->
  <text x="40" y="196" font-size="12" fill="#b85450" font-weight="bold">第 2 轮（2¹）</text>
  <text x="44" y="226" font-size="11" fill="#888">a:</text>
  <rect x="130" y="210" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="148" y="231" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="168" y="210" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="186" y="231" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="206" y="210" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="224" y="231" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="244" y="210" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="262" y="231" text-anchor="middle" font-size="13" fill="#bbb">0</text>
  <text x="224" y="200" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">i=2</text>
  <text x="44" y="262" font-size="11" fill="#888">b:</text>
  <rect x="130" y="246" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="148" y="267" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="168" y="246" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="186" y="267" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="206" y="246" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="224" y="267" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="244" y="246" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="262" y="267" text-anchor="middle" font-size="13" fill="#bbb">1</text>
  <text x="224" y="290" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">j=2</text>
  <text x="300" y="238" font-size="11" fill="#666">→ 1 + 1 + 0 =</text>
  <rect x="404" y="222" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="424" y="242" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <text x="456" y="238" font-size="11" fill="#4a7a3a">写 0，carry=1</text>

  <!-- ===== Round 3 (bit2) : a[1]=0, b[1]=0, carry=1 -> sum=1, bit=1, carry=0 ===== -->
  <text x="40" y="330" font-size="12" fill="#b85450" font-weight="bold">第 3 轮（2²）</text>
  <text x="44" y="360" font-size="11" fill="#888">a:</text>
  <rect x="130" y="344" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="148" y="365" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="168" y="344" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="186" y="365" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="206" y="344" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="224" y="365" text-anchor="middle" font-size="13" fill="#bbb">1</text>
  <rect x="244" y="344" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="262" y="365" text-anchor="middle" font-size="13" fill="#bbb">0</text>
  <text x="186" y="334" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">i=1</text>
  <text x="44" y="396" font-size="11" fill="#888">b:</text>
  <rect x="130" y="380" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="148" y="401" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="168" y="380" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="186" y="401" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="206" y="380" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="224" y="401" text-anchor="middle" font-size="13" fill="#bbb">1</text>
  <rect x="244" y="380" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="262" y="401" text-anchor="middle" font-size="13" fill="#bbb">1</text>
  <text x="186" y="424" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">j=1</text>
  <text x="300" y="372" font-size="11" fill="#666">→ 0 + 0 + 1 =</text>
  <rect x="404" y="356" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="424" y="376" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="456" y="372" font-size="11" fill="#4a7a3a">写 1，carry=0</text>

  <!-- ===== Round 4 (bit3) : a[0]=1, b[0]=1, carry=0 -> sum=2, bit=0, carry=1 ===== -->
  <text x="40" y="464" font-size="12" fill="#b85450" font-weight="bold">第 4 轮（2³，最高有效位）</text>
  <text x="44" y="494" font-size="11" fill="#888">a:</text>
  <rect x="130" y="478" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="499" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="168" y="478" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="186" y="499" text-anchor="middle" font-size="13" fill="#bbb">0</text>
  <rect x="206" y="478" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="224" y="499" text-anchor="middle" font-size="13" fill="#bbb">1</text>
  <rect x="244" y="478" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="262" y="499" text-anchor="middle" font-size="13" fill="#bbb">0</text>
  <text x="148" y="468" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">i=0</text>
  <text x="44" y="530" font-size="11" fill="#888">b:</text>
  <rect x="130" y="514" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="535" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="168" y="514" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="186" y="535" text-anchor="middle" font-size="13" fill="#bbb">0</text>
  <rect x="206" y="514" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="224" y="535" text-anchor="middle" font-size="13" fill="#bbb">1</text>
  <rect x="244" y="514" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="262" y="535" text-anchor="middle" font-size="13" fill="#bbb">1</text>
  <text x="148" y="558" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">j=0</text>
  <text x="300" y="506" font-size="11" fill="#666">→ 1 + 1 + 0 =</text>
  <rect x="404" y="490" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="424" y="510" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <text x="456" y="506" font-size="11" fill="#4a7a3a">写 0，carry=1</text>

  <!-- ===== Round 5 (bit4) : both exhausted, carry=1 -> sum=1, bit=1, carry=0 ===== -->
  <text x="40" y="598" font-size="12" fill="#b85450" font-weight="bold">第 5 轮（2⁴，两串已扫完，仅残留进位）</text>
  <text x="44" y="628" font-size="11" fill="#888">a:</text>
  <rect x="130" y="612" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="148" y="633" text-anchor="middle" font-size="13" fill="#bbb">—</text>
  <rect x="168" y="612" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="186" y="633" text-anchor="middle" font-size="13" fill="#bbb">—</text>
  <rect x="206" y="612" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="224" y="633" text-anchor="middle" font-size="13" fill="#bbb">—</text>
  <rect x="244" y="612" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="262" y="633" text-anchor="middle" font-size="13" fill="#bbb">—</text>
  <text x="186" y="602" text-anchor="middle" font-size="9" fill="#888">i &lt; 0</text>
  <text x="44" y="660" font-size="11" fill="#888">b:</text>
  <text x="186" y="660" text-anchor="middle" font-size="9" fill="#888">j &lt; 0，靠 carry&gt;0 多走一轮</text>
  <text x="300" y="624" font-size="11" fill="#666">→ 0 + 0 + 1 =</text>
  <rect x="404" y="608" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="424" y="628" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="456" y="624" font-size="11" fill="#4a7a3a">写 1，carry=0</text>
</svg>
