<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="500" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：排序候选 → 循环取候选 → 跳过/选中</text>

  <!-- START -->
  <ellipse cx="260" cy="58" rx="46" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M260,74 L260,86" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- N1 排序 -->
  <rect x="100" y="88" width="320" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="112" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">按下标排序：键 = (nums[i] ↑, i ↑)</text>
  <path d="M260,126 L260,138" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- N2 init -->
  <rect x="130" y="140" width="260" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="164" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">marked[0..n−1]=false；score=0；p=0</text>
  <path d="M260,178 L260,194" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- D1 还有候选? -->
  <polygon points="260,194 360,236 260,278 160,236" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="240" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">p &lt; n ？</text>

  <!-- D1 否 → return -->
  <path d="M360,236 L406,236" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="372" y="230" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="406" y="218" width="98" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="455" y="242" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">return score</text>

  <!-- D1 是 ↓ -->
  <path d="M260,278 L260,294" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="268" y="290" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- N3 取候选 -->
  <rect x="130" y="296" width="260" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="320" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">idx = order[p++]</text>
  <path d="M260,334 L260,350" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- D2 marked? -->
  <polygon points="260,350 360,392 260,434 160,392" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="396" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">marked[idx]？</text>

  <!-- D2 是 → 跳过：左行汇入回环主干(60,392) -->
  <path d="M160,392 L66,392" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="100" y="386" font-size="11" fill="#b85450" filter="url(#rough2)">是·跳过</text>

  <!-- D2 否 ↓ 到 N4 -->
  <path d="M260,434 L260,446" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="268" y="444" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- N4 选中动作 -->
  <rect x="100" y="448" width="320" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="466" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">score += nums[idx]</text>
  <text x="260" y="481" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">marked[idx−1] = marked[idx] = marked[idx+1] = true</text>

  <!-- 回环主干：N4 左出 → 左到 x=60 → 上行 → 右入 D1 左(160,236) -->
  <path d="M100,468 L60,468 L60,236 L150,236" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M150,236 L160,236" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="68" y="350" font-size="10" fill="#446688" filter="url(#rough2)" transform="rotate(-90 68 350)">回到循环顶部</text>
</svg>
