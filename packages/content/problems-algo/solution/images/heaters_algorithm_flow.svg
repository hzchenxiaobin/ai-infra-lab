<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="520" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">排序 + 二分查找最近供暖器 算法流程</text>

  <!-- Start node -->
  <ellipse cx="270" cy="62" rx="140" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="12" fill="#333">开始: sort(heaters), ans = 0</text>

  <!-- arrow down -->
  <path d="M 270 82 L 270 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- For each house loop -->
  <rect x="120" y="104" width="300" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="126" text-anchor="middle" font-size="12" fill="#333">遍历每个房屋 h ∈ houses</text>

  <!-- arrow down -->
  <path d="M 270 138 L 270 156" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- lower_bound step -->
  <rect x="80" y="160" width="380" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="182" text-anchor="middle" font-size="12" fill="#333">idx = lower_bound(heaters, h)</text>
  <text x="270" y="200" text-anchor="middle" font-size="11" fill="#555">找到 heaters 中首个 ≥ h 的下标 idx</text>

  <!-- arrow down -->
  <path d="M 270 208 L 270 226" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Check right candidate -->
  <polygon points="270,230 380,270 270,310 160,270" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="266" text-anchor="middle" font-size="12" fill="#333">idx &lt; m ?</text>
  <text x="270" y="282" text-anchor="middle" font-size="11" fill="#666">(右候选 heaters[idx] 存在?)</text>

  <!-- Yes: compute right distance -->
  <path d="M 380 270 L 440 270" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="262" text-anchor="middle" font-size="11" fill="#82b366">是</text>
  <rect x="442" y="250" width="88" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="486" y="268" text-anchor="middle" font-size="10" fill="#333">d_right =</text>
  <text x="486" y="282" text-anchor="middle" font-size="10" fill="#333">heaters[idx] − h</text>

  <!-- No: skip -->
  <path d="M 270 310 L 270 326" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="320" font-size="11" fill="#b85450">否</text>

  <!-- Check left candidate -->
  <polygon points="270,330 380,370 270,410 160,370" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="366" text-anchor="middle" font-size="12" fill="#333">idx &gt; 0 ?</text>
  <text x="270" y="382" text-anchor="middle" font-size="11" fill="#666">(左候选 heaters[idx−1] 存在?)</text>

  <!-- Yes: compute left distance -->
  <path d="M 380 370 L 440 370" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="362" text-anchor="middle" font-size="11" fill="#82b366">是</text>
  <rect x="442" y="350" width="88" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="486" y="368" text-anchor="middle" font-size="10" fill="#333">d_left =</text>
  <text x="486" y="382" text-anchor="middle" font-size="10" fill="#333">h − heaters[idx−1]</text>

  <!-- No: skip -->
  <path d="M 270 410 L 270 426" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="420" font-size="11" fill="#b85450">否</text>

  <!-- Update ans -->
  <rect x="100" y="430" width="340" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="452" text-anchor="middle" font-size="12" fill="#333">d = min(有效候选); ans = max(ans, d)</text>

  <!-- Loop back -->
  <path d="M 100 447 L 50 447 L 50 121 L 120 121" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="44" y="290" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 44 290)">下一个房屋</text>

  <!-- End node -->
  <path d="M 270 464 L 270 482" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="270" cy="500" rx="80" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="504" text-anchor="middle" font-size="12" fill="#333">返回 ans</text>
</svg>
