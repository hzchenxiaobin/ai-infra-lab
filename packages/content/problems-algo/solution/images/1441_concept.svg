<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：流 1..n 连续递增，target 是其子序列，用指针 j 对齐</text>
  <text x="300" y="42" text-anchor="middle" font-size="10.5" fill="#888">每读一个 i → Push；i == target[j] 则保留 (j++)，否则 Pop</text>

  <!-- Stream row label -->
  <text x="40" y="92" font-size="12" fill="#888">stream</text>

  <!-- Stream values 1 2 3 4 5 ... n -->
  <rect x="80" y="72" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="93" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="124" y="72" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="144" y="93" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="168" y="72" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="188" y="93" text-anchor="middle" font-size="13" fill="#333">3</text>
  <rect x="212" y="72" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="232" y="93" text-anchor="middle" font-size="13" fill="#333">4</text>
  <text x="260" y="93" font-size="12" fill="#888">…</text>
  <rect x="284" y="72" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="304" y="93" text-anchor="middle" font-size="12" fill="#333">n</text>

  <!-- arrows from stream down to stack (Push) -->
  <path d="M 100 104 L 100 152" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 144 104 L 144 152" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 188 104 L 188 152" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Stack box -->
  <text x="40" y="178" font-size="12" fill="#888">stack</text>
  <rect x="80" y="154" width="60" height="100" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <!-- stack slots: top is 3, then 1 -->
  <rect x="86" y="222" width="48" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="239" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="86" y="194" width="48" height="24" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="110" y="211" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="150" y="240" font-size="10.5" fill="#888">底</text>
  <text x="150" y="200" font-size="10.5" fill="#888">顶</text>

  <!-- Pop arrow (value 2 popped) -->
  <path d="M 144 168 L 200 168" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="206" y="172" font-size="11" fill="#b85450" font-weight="bold">Pop 2</text>

  <!-- target row -->
  <text x="40" y="300" font-size="12" fill="#888">target</text>
  <text x="300" y="276" text-anchor="middle" font-size="10.5" fill="#888">target = [1, 3]</text>
  <rect x="80" y="282" width="56" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="108" y="303" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="168" y="282" width="56" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="196" y="303" text-anchor="middle" font-size="13" fill="#333">3</text>

  <!-- pointer j under target[0]=1 (already matched) -->
  <path d="M 108 318 L 108 332" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="108" y="346" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">j=1</text>
  <text x="80" y="346" font-size="10" fill="#888">已匹配</text>

  <!-- pointer next: target[j]=3 aligned with stream value 3 -->
  <path d="M 188 318 L 196 318" stroke="#d6a040" stroke-width="0" fill="none"/>
  <path d="M 196 318 L 196 332" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="196" y="346" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">下一个匹配</text>

  <!-- alignment dashed line: stream 3 to target 3 -->
  <path d="M 188 104 L 196 282" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="4,3" fill="none" filter="url(#rough2)"/>

  <!-- footer note -->
  <rect x="60" y="362" width="480" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="300" y="381" text-anchor="middle" font-size="10.5" fill="#555">流递增 → i 自增即可；target 递增 → target[j] 是下一个该留的值 → i==target[j]? 单次比较</text>
</svg>
