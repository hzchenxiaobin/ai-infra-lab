<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：inc / dec 双计数器并行接龙（nums = [1,4,3,3,2]）</text>

  <!-- alignment dashed lines -->
  <line x1="144" y1="82" x2="144" y2="124" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <line x1="202" y1="82" x2="202" y2="124" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <line x1="260" y1="82" x2="260" y2="124" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <line x1="318" y1="82" x2="318" y2="124" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <line x1="376" y1="82" x2="376" y2="124" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <line x1="144" y1="154" x2="144" y2="170" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <line x1="202" y1="154" x2="202" y2="170" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <line x1="260" y1="154" x2="260" y2="170" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <line x1="318" y1="154" x2="318" y2="170" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <line x1="376" y1="154" x2="376" y2="170" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- array boxes -->
  <rect x="120" y="44" width="48" height="36" fill="#ffffff" stroke="#888" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="144" y="67" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="178" y="44" width="48" height="36" fill="#ffffff" stroke="#888" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="202" y="67" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="236" y="44" width="48" height="36" fill="#ffffff" stroke="#888" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="260" y="67" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="294" y="44" width="48" height="36" fill="#ffffff" stroke="#888" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="318" y="67" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="352" y="44" width="48" height="36" fill="#ffffff" stroke="#888" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="376" y="67" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>

  <!-- comparison symbols -->
  <text x="161" y="68" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">&gt;</text>
  <text x="219" y="68" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">&lt;</text>
  <text x="277" y="68" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">=</text>
  <text x="335" y="68" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">&lt;</text>

  <!-- inc lane -->
  <text x="106" y="146" text-anchor="end" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">inc</text>
  <rect x="120" y="126" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="144" y="145" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="178" y="126" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="145" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="236" y="126" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="145" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="294" y="126" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="318" y="145" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="352" y="126" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="376" y="145" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1</text>
  <text x="408" y="145" font-size="9.5" fill="#446688" filter="url(#rough2)">← [1,4] 接龙</text>

  <!-- dec lane -->
  <text x="106" y="190" text-anchor="end" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">dec</text>
  <rect x="120" y="170" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="144" y="189" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <rect x="178" y="170" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="189" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <rect x="236" y="170" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="189" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="294" y="170" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="318" y="189" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <rect x="352" y="170" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="376" y="189" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="408" y="189" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">← [4,3] / [3,2] 接龙</text>

  <!-- annotations -->
  <text x="260" y="228" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">inc / dec：以 i 结尾的最长严格递增 / 严格递减子数组长度</text>
  <text x="260" y="248" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">答案 = 全程 max(inc, dec) = 2</text>

  <!-- rules box -->
  <rect x="46" y="262" width="428" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="284" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">比前一个大 ↑：inc += 1，dec = 1（递减段断裂）</text>
  <text x="260" y="306" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">比前一个小 ↓：dec += 1，inc = 1（递增段断裂）</text>
  <text x="260" y="328" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">与前一个等 ＝：inc = dec = 1（两个方向同时断裂）</text>
</svg>
