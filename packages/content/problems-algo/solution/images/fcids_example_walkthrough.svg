<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="330" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：DataStream(4, 3) 四次 consec</text>

  <!-- column headers -->
  <text x="40" y="54" font-size="12" fill="#888" filter="url(#rough2)">consec 调用</text>
  <text x="150" y="54" font-size="12" fill="#888" filter="url(#rough2)">数据流尾部</text>
  <text x="360" y="54" font-size="12" fill="#888" filter="url(#rough2)">cnt</text>
  <text x="500" y="54" font-size="12" fill="#888" filter="url(#rough2)">返回</text>
  <line x1="20" y1="62" x2="580" y2="62" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Row 1: consec(4) -> cnt 1 -> false ===== -->
  <text x="40" y="96" font-size="13" fill="#223" filter="url(#rough2)">consec(4)</text>
  <rect x="128" y="74" width="44" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="100" text-anchor="middle" font-size="14" fill="#2c4a22" filter="url(#rough2)">4</text>
  <text x="186" y="100" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">+1</text>
  <text x="360" y="100" font-size="14" fill="#4a7a3a" filter="url(#rough2)">→ 1</text>
  <rect x="455" y="80" width="90" height="28" rx="14" fill="#f0f4f8" stroke="#9aa8b4" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="500" y="99" text-anchor="middle" font-size="12" fill="#445" filter="url(#rough2)">false</text>

  <!-- ===== Row 2: consec(4) -> cnt 2 -> false ===== -->
  <text x="40" y="166" font-size="13" fill="#223" filter="url(#rough2)">consec(4)</text>
  <rect x="128" y="144" width="44" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="170" text-anchor="middle" font-size="14" fill="#2c4a22" filter="url(#rough2)">4</text>
  <rect x="178" y="144" width="44" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="170" text-anchor="middle" font-size="14" fill="#2c4a22" filter="url(#rough2)">4</text>
  <text x="236" y="170" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">+1</text>
  <text x="360" y="170" font-size="14" fill="#4a7a3a" filter="url(#rough2)">→ 2</text>
  <rect x="455" y="150" width="90" height="28" rx="14" fill="#f0f4f8" stroke="#9aa8b4" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="500" y="169" text-anchor="middle" font-size="12" fill="#445" filter="url(#rough2)">false</text>

  <!-- ===== Row 3: consec(4) -> cnt 3 -> true (hit) ===== -->
  <text x="40" y="236" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">consec(4)</text>
  <rect x="126" y="212" width="136" height="44" rx="6" fill="none" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="128" y="214" width="44" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="240" text-anchor="middle" font-size="14" fill="#2c4a22" filter="url(#rough2)">4</text>
  <rect x="178" y="214" width="44" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="240" text-anchor="middle" font-size="14" fill="#2c4a22" filter="url(#rough2)">4</text>
  <rect x="228" y="214" width="44" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="240" text-anchor="middle" font-size="14" fill="#2c4a22" filter="url(#rough2)">4</text>
  <text x="290" y="240" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">+1 ⇒ cnt=k</text>
  <text x="360" y="240" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ 3</text>
  <rect x="455" y="220" width="90" height="28" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="500" y="239" text-anchor="middle" font-size="12" fill="#2c4a22" font-weight="bold" filter="url(#rough2)">true</text>

  <!-- ===== Row 4: consec(3) -> cnt 0 -> false (mismatch reset) ===== -->
  <text x="40" y="306" font-size="13" fill="#223" filter="url(#rough2)">consec(3)</text>
  <rect x="128" y="284" width="44" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="310" text-anchor="middle" font-size="14" fill="#2c4a22" filter="url(#rough2)">4</text>
  <rect x="178" y="284" width="44" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="310" text-anchor="middle" font-size="14" fill="#2c4a22" filter="url(#rough2)">4</text>
  <rect x="228" y="284" width="44" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="310" text-anchor="middle" font-size="14" fill="#2c4a22" filter="url(#rough2)">4</text>
  <rect x="278" y="284" width="44" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="310" text-anchor="middle" font-size="14" fill="#7a2230" filter="url(#rough2)">3</text>
  <path d="M 300 330 C 332 322, 350 312, 356 304" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="360" y="310" font-size="14" fill="#b85450" filter="url(#rough2)">→ 0</text>
  <rect x="455" y="290" width="90" height="28" rx="14" fill="#f0f4f8" stroke="#9aa8b4" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="500" y="309" text-anchor="middle" font-size="12" fill="#445" filter="url(#rough2)">false</text>
  <text x="360" y="324" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">失配归零</text>
</svg>
