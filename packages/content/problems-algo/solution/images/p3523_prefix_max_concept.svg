<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="20" text-anchor="middle" font-size="14.5" fill="#333" font-weight="bold" filter="url(#rough2)">操作的本质：切成连续块，每块收缩为块内最大值</text>
  <text x="24" y="40" font-size="11.5" fill="#333" filter="url(#rough2)">示例 1：nums = [4, 2, 5, 3, 5]　绿 = 幸存（前缀最大值），灰 = 被吸收</text>

  <!-- 块划分括号 -->
  <text x="92" y="58" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#d6a040" filter="url(#rough2)">块①</text>
  <text x="218" y="58" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#d6a040" filter="url(#rough2)">块②</text>
  <text x="386" y="58" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#d6a040" filter="url(#rough2)">块③</text>
  <path d="M 58 72 L 58 62 L 126 62 L 126 72" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 142 72 L 142 62 L 294 62 L 294 72" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 310 72 L 310 62 L 462 62 L 462 72" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- 原数组格子 -->
  <rect x="56" y="78" width="72" height="56" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="92" y="114" text-anchor="middle" font-size="16" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">4</text>

  <rect x="140" y="78" width="72" height="56" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.5" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="176" y="114" text-anchor="middle" font-size="16" font-weight="bold" fill="#999" filter="url(#rough2)">2</text>

  <rect x="224" y="78" width="72" height="56" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="260" y="114" text-anchor="middle" font-size="16" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">5</text>

  <rect x="308" y="78" width="72" height="56" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.5" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="344" y="114" text-anchor="middle" font-size="16" font-weight="bold" fill="#999" filter="url(#rough2)">3</text>

  <rect x="392" y="78" width="72" height="56" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="428" y="114" text-anchor="middle" font-size="16" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">5</text>

  <!-- 幸存/吸收标注 -->
  <text x="92" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">#0 幸存</text>
  <text x="176" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#999" filter="url(#rough2)">#1 吸收</text>
  <text x="260" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">#2 幸存</text>
  <text x="344" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#999" filter="url(#rough2)">#3 吸收</text>
  <text x="428" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">#4 幸存</text>

  <text x="92" y="166" text-anchor="middle" font-size="10.5" fill="#2a5a2a" filter="url(#rough2)">首个必幸存</text>
  <text x="176" y="166" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">2 &lt; 4</text>
  <text x="260" y="166" text-anchor="middle" font-size="10.5" fill="#2a5a2a" filter="url(#rough2)">5 ≥ 4</text>
  <text x="344" y="166" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">3 &lt; 5</text>
  <text x="428" y="166" text-anchor="middle" font-size="10.5" fill="#2a5a2a" filter="url(#rough2)">5 ≥ 5 相等也算</text>

  <!-- 收缩箭头 -->
  <path d="M 92 176 L 92 202" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 218 176 L 218 202" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 386 176 L 386 202" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="254" y="192" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">压成 max</text>

  <!-- 最终数组 -->
  <text x="24" y="206" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">最终数组</text>

  <rect x="60" y="212" width="64" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="92" y="244" text-anchor="middle" font-size="16" font-weight="bold" fill="#446688" filter="url(#rough2)">4</text>

  <rect x="186" y="212" width="64" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="218" y="244" text-anchor="middle" font-size="16" font-weight="bold" fill="#446688" filter="url(#rough2)">5</text>

  <rect x="354" y="212" width="64" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="386" y="244" text-anchor="middle" font-size="16" font-weight="bold" fill="#446688" filter="url(#rough2)">5</text>

  <text x="280" y="286" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">[4, 5, 5] 非递减 ✓　长度 3 = 幸存者个数</text>

  <!-- 结论框 -->
  <rect x="48" y="304" width="464" height="84" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="330" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">幸存条件：nums[i] ≥ max(nums[0..i−1])（前缀最大值，相等也算）</text>
  <text x="280" y="352" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">被吸收元素并入相邻块：它小于幸存者 ⇒ 块最大值不受影响</text>
  <text x="280" y="374" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">⇒ 答案 = 前缀最大值个数（含首元素），一遍扫描数出来</text>
</svg>
