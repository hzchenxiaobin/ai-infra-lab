<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：s = "aabccabba" 的两步删除后停在 cca</text>

  <!-- index row -->
  <text x="44" y="74" font-size="11" fill="#888" filter="url(#rough2)">下标</text>
  <g font-size="11" fill="#888" text-anchor="middle">
    <text x="110" y="74" filter="url(#rough2)">0</text>
    <text x="154" y="74" filter="url(#rough2)">1</text>
    <text x="198" y="74" filter="url(#rough2)">2</text>
    <text x="242" y="74" filter="url(#rough2)">3</text>
    <text x="286" y="74" filter="url(#rough2)">4</text>
    <text x="330" y="74" filter="url(#rough2)">5</text>
    <text x="374" y="74" filter="url(#rough2)">6</text>
    <text x="418" y="74" filter="url(#rough2)">7</text>
    <text x="462" y="74" filter="url(#rough2)">8</text>
  </g>

  <!-- char cells: a a b c c a b b a -->
  <g font-size="14" fill="#333" text-anchor="middle">
    <rect x="88" y="84" width="44" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="110" y="108" filter="url(#rough2)">a</text>
    <rect x="132" y="84" width="44" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="154" y="108" filter="url(#rough2)">a</text>
    <rect x="176" y="84" width="44" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="198" y="108" filter="url(#rough2)">b</text>
    <rect x="220" y="84" width="44" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="242" y="108" filter="url(#rough2)">c</text>
    <rect x="264" y="84" width="44" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="286" y="108" filter="url(#rough2)">c</text>
    <rect x="308" y="84" width="44" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="330" y="108" filter="url(#rough2)">a</text>
    <rect x="352" y="84" width="44" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="374" y="108" filter="url(#rough2)">b</text>
    <rect x="396" y="84" width="44" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="418" y="108" filter="url(#rough2)">b</text>
    <rect x="440" y="84" width="44" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="462" y="108" filter="url(#rough2)">a</text>
  </g>

  <!-- Step 1 bracket [0,8] -->
  <path d="M 88 128 L 88 134 L 484 134 L 484 128" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="56" y="156" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">①</text>
  <rect x="76" y="142" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="156" y="162" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[0,8] 两端 a/a 同 → 删 aa + a</text>
  <text x="286" y="162" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">l: 0→2,  r: 8→7</text>

  <!-- Step 2 bracket [2,7] -->
  <path d="M 176 184 L 176 190 L 440 190 L 440 184" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="56" y="212" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">②</text>
  <rect x="76" y="198" width="172" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="162" y="218" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[2,7] 两端 b/b 同 → 删 b + bb</text>
  <text x="308" y="218" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">l: 2→3,  r: 7→5</text>

  <!-- Step 3 bracket [3,5] with mismatched ends highlighted -->
  <rect x="218" y="82" width="48" height="40" fill="none" stroke="#446688" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <rect x="306" y="82" width="48" height="40" fill="none" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <path d="M 220 240 L 220 246 L 352 246 L 352 240" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="56" y="268" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">③</text>
  <rect x="76" y="254" width="180" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="166" y="274" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[3,5] 两端 c / a 不同 → 停止</text>
  <text x="354" y="274" font-size="10.5" fill="#888" filter="url(#rough2)">剩 "cca"</text>

  <!-- Result -->
  <path d="M 40 300 L 520 300" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="120" y="312" width="320" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="336" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 r − l + 1 = 5 − 3 + 1 = 3 ✓</text>
</svg>
