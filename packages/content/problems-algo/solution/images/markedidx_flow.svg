<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：排序 → 双指针贪心（i 锁小值池，j 扫大值池）</text>

  <!-- 1. sort -->
  <rect x="200" y="44" width="160" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">① 对 nums 升序排序</text>
  <path d="M 280 84 L 280 100" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. init -->
  <rect x="180" y="104" width="200" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="128" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">② 初始化 i=0, j=n/2, ans=0</text>
  <path d="M 280 144 L 280 162" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. condition diamond -->
  <polygon points="280,166 404,212 280,258 156,212" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="206" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">2·nums[i] ≤ nums[j] ?</text>
  <text x="280" y="222" text-anchor="middle" font-size="10" fill="#888">（且 i &lt; n/2, j &lt; n）</text>

  <!-- yes branch (left) -->
  <path d="M 156 212 L 96 212 L 96 248" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="120" y="204" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="20" y="252" width="152" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="96" y="274" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">标记 i, j</text>
  <text x="96" y="292" text-anchor="middle" font-size="11" fill="#333">ans += 2</text>
  <text x="96" y="308" text-anchor="middle" font-size="11" fill="#333">i++, j++</text>

  <!-- no branch (right) -->
  <path d="M 404 212 L 464 212 L 464 248" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="440" y="204" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="388" y="252" width="152" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="464" y="274" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">j 太小不够大</text>
  <text x="464" y="292" text-anchor="middle" font-size="11" fill="#333">放弃此 j</text>
  <text x="464" y="308" text-anchor="middle" font-size="11" fill="#333">j++</text>

  <!-- merge down to loop check -->
  <path d="M 96 314 L 96 344 L 280 344" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 464 314 L 464 344 L 280 344" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <!-- loop check -->
  <rect x="170" y="338" width="220" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i &lt; n/2 且 j &lt; n ?  → 回到判定</text>
  <path d="M 170 355 L 120 355 L 120 212 L 156 212" stroke="#446688" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="284" text-anchor="middle" font-size="9.5" fill="#446688">循环回</text>

  <!-- exit to return -->
  <path d="M 390 355 L 470 355 L 470 380" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="348" text-anchor="middle" font-size="9.5" fill="#446688">否, 退出</text>
  <rect x="400" y="372" width="150" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="475" y="390" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">返回 ans</text>
</svg>
