<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="34" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">
    山形 = 左侧 LIS ↑ + 右侧 LDS ↓ 在峰顶拼接
  </text>

  <!-- 数组格子（按值高低摆放，模拟山形） -->
  <!-- 左侧递增段：1, 5, 6（峰顶） -->
  <rect x="70" y="250" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="94" y="272" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>

  <rect x="140" y="190" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="164" y="212" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">5</text>

  <!-- 峰顶 6 -->
  <rect x="210" y="120" width="52" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="236" y="144" text-anchor="middle" font-size="17" fill="#b85450" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="236" y="108" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">峰顶 i</text>

  <!-- 右侧递减段：3, 1 -->
  <rect x="290" y="190" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="314" y="212" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>

  <rect x="360" y="250" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="384" y="272" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>

  <!-- 上升箭头（左侧 LIS） -->
  <path d="M118,265 Q150,235 138,205" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M188,205 Q220,175 210,140" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 下降箭头（右侧 LDS） -->
  <path d="M264,140 Q290,175 300,205" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M338,205 Q365,235 374,265" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- 标注：左侧 LIS -->
  <text x="100" y="320" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">lis[i]=3</text>
  <text x="100" y="338" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">以 i 结尾的 LIS ↑</text>

  <!-- 标注：右侧 LDS -->
  <text x="384" y="320" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">lds[i]=3</text>
  <text x="384" y="338" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">从 i 出发的 LDS ↓</text>

  <!-- 中间公式 -->
  <rect x="180" y="305" width="160" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="328" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">山形长度</text>
  <text x="260" y="346" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">= lis[i] + lds[i] − 1</text>
</svg>
