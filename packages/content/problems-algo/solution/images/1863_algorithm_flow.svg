<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：DFS 回溯 vs 位运算公式</text>

  <!-- vertical divider -->
  <path d="M 300 40 L 300 450" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Left: DFS backtracking ===== -->
  <text x="150" y="56" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">方法一：DFS 回溯枚举子集</text>

  <!-- start: dfs(0, 0) -->
  <rect x="90" y="68" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="150" y="88" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">dfs(i, curXor)</text>
  <path d="M 150 98 L 150 114" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond: i == n ? -->
  <polygon points="150,114 202,134 150,154 98,134" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="138" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">i == n ?</text>

  <!-- Yes -> right: total += curXor -->
  <path d="M 202 134 L 240 134" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="221" y="129" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="240" y="119" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="265" y="139" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">累加</text>

  <!-- No -> down: two branches -->
  <path d="M 150 154 L 150 170" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="164" y="166" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- branch labels -->
  <text x="150" y="186" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">对 nums[i] 二选一</text>

  <!-- left branch: 不选 -->
  <rect x="40" y="196" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="90" y="212" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">不选 i</text>
  <text x="90" y="225" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">dfs(i+1, curXor)</text>

  <!-- right branch: 选 -->
  <rect x="160" y="196" width="110" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="215" y="212" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">选 i</text>
  <text x="215" y="225" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">dfs(i+1, curXor^x)</text>

  <!-- arrows from split to branches -->
  <path d="M 130 186 L 90 196" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 170 186 L 215 196" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop back arrows -->
  <path d="M 90 230 L 90 250 L 150 250 L 150 114" stroke="#666" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 215 230 L 215 256 L 150 256 L 150 114" stroke="#666" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- complexity note -->
  <rect x="40" y="276" width="250" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="165" y="296" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">复杂度：O(n · 2ⁿ)</text>
  <text x="165" y="314" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">n ≤ 12 时 2¹² = 4096，可接受</text>

  <!-- DFS feature box -->
  <rect x="40" y="346" width="250" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="165" y="366" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">DFS 要点</text>
  <text x="50" y="386" font-size="10" fill="#333" filter="url(#rough2)">• 空子集 curXor = 0，自然计入</text>
  <text x="50" y="404" font-size="10" fill="#333" filter="url(#rough2)">• 沿递归路径累乘异或，无需维护</text>
  <text x="50" y="422" font-size="10" fill="#333" filter="url(#rough2)">  额外子集列表</text>
  <text x="50" y="438" font-size="10" fill="#333" filter="url(#rough2)">• 叶子（i==n）累加 curXor 到 ans</text>

  <!-- ===== Right: Math formula ===== -->
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">方法二：位运算数学公式</text>

  <!-- step 1: or = 0 -->
  <rect x="370" y="68" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="450" y="88" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">or = 0</text>
  <path d="M 450 98 L 450 114" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2: for x: or |= x -->
  <rect x="350" y="114" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="450" y="135" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">for x in nums:  or |= x</text>
  <path d="M 450 148 L 450 164" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond: 遍历完? -->
  <polygon points="450,164 510,184 450,204 390,184" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="450" y="188" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">遍历完?</text>
  <path d="M 390 184 L 360 184 L 360 130 L 350 130" stroke="#666" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="368" y="160" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 450 204 L 450 222" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="464" y="218" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- step 3: ans = or << (n-1) -->
  <rect x="340" y="222" width="220" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="450" y="240" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans = or &lt;&lt; (n − 1)</text>
  <text x="450" y="255" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">即 or × 2^(n−1)</text>
  <path d="M 450 260 L 450 276" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return -->
  <rect x="380" y="276" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="450" y="296" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return ans</text>

  <!-- complexity note -->
  <rect x="340" y="326" width="220" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="450" y="346" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">复杂度：O(n) / O(1)</text>
  <text x="450" y="364" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">一次遍历求 OR，移位即出答案</text>

  <!-- Math insight box -->
  <rect x="340" y="392" width="220" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="450" y="412" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">为何成立？</text>
  <text x="450" y="430" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">每 bit 在 OR 中为 1 时</text>
  <text x="450" y="444" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">恰 2^(n−1) 个子集异或该位为 1</text>
</svg>
