<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="410" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">两个结构各司其职：哈希表管单点，有序集合管全局</text>

  <!-- left: hash map cnt -->
  <text x="130" y="52" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">cnt：id → 当前频率</text>

  <rect x="52" y="62" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="78" y="82" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <path d="M 110 77 L 160 77" stroke="#999" stroke-width="1.4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="166" y="62" width="52" height="30" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="192" y="82" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>

  <rect x="52" y="108" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="78" y="128" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <path d="M 110 123 L 160 123" stroke="#999" stroke-width="1.4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="166" y="108" width="52" height="30" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="192" y="128" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">2</text>

  <rect x="52" y="154" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="78" y="174" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <path d="M 110 169 L 160 169" stroke="#999" stroke-width="1.4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="166" y="154" width="52" height="30" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="192" y="174" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">1</text>

  <text x="130" y="212" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">O(1) 改单个 ID</text>
  <text x="130" y="228" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">频率 0 也如实记录（灰色）</text>

  <!-- divider -->
  <path d="M 262 44 L 262 230" stroke="#bbb" stroke-width="1.2" stroke-dasharray="6 5" filter="url(#rough2)"/>

  <!-- right: ordered multiset -->
  <text x="394" y="52" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ms：正频率有序多重集合</text>

  <rect x="300" y="62" width="44" height="30" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="322" y="82" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">1</text>
  <rect x="352" y="62" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="374" y="82" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">2</text>
  <path d="M 462 92 C 440 100 415 98 402 90" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="468" y="64" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">*rbegin()</text>
  <text x="468" y="108" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">= 最大频率</text>

  <text x="394" y="130" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">频率 0 的 ID 不进集合</text>
  <text x="394" y="146" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">删旧值 / 插新值：O(log n)</text>

  <!-- note: update propagation -->
  <rect x="48" y="186" width="424" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="210" text-anchor="middle" font-size="11.5" fill="#3a5a2e" filter="url(#rough2)">改 cnt 只动一格；ms 只删一个旧值、插一个新值 —— 两边都是 O(log n) 内同步</text>

  <!-- divider -->
  <path d="M 40 246 L 480 246" stroke="#bbb" stroke-width="1.2" stroke-dasharray="6 5" filter="url(#rough2)"/>
  <text x="260" y="270" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold" filter="url(#rough2)">一次更新的传导：示例 1 第 2 步（id = 2, freq = −3）</text>

  <text x="52" y="300" font-size="11" fill="#888" filter="url(#rough2)">cnt[2]：3 → 0</text>

  <text x="150" y="300" font-size="11" fill="#888" filter="url(#rough2)">ms：</text>
  <rect x="176" y="282" width="42" height="26" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="197" y="300" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">2</text>
  <rect x="226" y="282" width="42" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="247" y="300" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <path d="M 232 286 L 262 304" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 262 286 L 232 304" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="272" y="278" font-size="10" fill="#b85450" filter="url(#rough2)">erase(旧值 3)</text>

  <path d="M 292 295 L 318 295" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="326" y="282" width="42" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="347" y="300" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="326" y="322" font-size="10" fill="#4a7a3a" filter="url(#rough2)">最大 3 → 2</text>

  <rect x="400" y="278" width="88" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="444" y="300" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">ans = 2</text>

  <!-- bottom warning -->
  <rect x="48" y="344" width="424" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="364" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">⚠️ C++ 删除必须 erase(ms.find(old))——只删一个；erase(old) 会把同频的所有 ID 一起误删</text>
  <text x="260" y="382" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">集合被删空（全部频率归 0）⇒ ans[i] = 0（对应示例 2 的第 1 步）</text>
</svg>
