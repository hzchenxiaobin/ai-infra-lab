<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [1,1,1,2,2,3]，每个元素最多保留两次</text>

  <!-- Initial array -->
  <text x="40" y="52" font-size="11" fill="#888">初始:</text>
  <text x="120" y="52" font-size="11" fill="#888" font-weight="bold">下标 0   1   2   3   4   5</text>

  <!-- char cells -->
  <rect x="100" y="58" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="146" y="58" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="168" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="192" y="58" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="214" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="238" y="58" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="284" y="58" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="306" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="330" y="58" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="352" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>

  <text x="400" y="80" font-size="11" fill="#888">slow = fast = 2</text>

  <!-- Table header -->
  <text x="40" y="118" font-size="12" fill="#444" font-weight="bold">步骤</text>
  <text x="100" y="118" font-size="12" fill="#444" font-weight="bold">fast</text>
  <text x="155" y="118" font-size="12" fill="#444" font-weight="bold">值</text>
  <text x="215" y="118" font-size="12" fill="#444" font-weight="bold">slow−2</text>
  <text x="280" y="118" font-size="12" fill="#444" font-weight="bold">值</text>
  <text x="320" y="118" font-size="12" fill="#444" font-weight="bold">判定</text>
  <text x="410" y="118" font-size="12" fill="#444" font-weight="bold">动作</text>
  <text x="500" y="118" font-size="12" fill="#444" font-weight="bold">slow</text>

  <line x1="30" y1="124" x2="550" y2="124" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Step 1: fast=2, nums[2]=1, nums[0]=1, equal, skip, slow=2 -->
  <text x="40" y="144" font-size="11" fill="#333">1</text>
  <text x="100" y="144" font-size="11" fill="#333">2</text>
  <text x="155" y="144" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="225" y="144" font-size="11" fill="#333">0</text>
  <text x="280" y="144" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="320" y="144" font-size="11" fill="#b85450">1 = 1, 已两份</text>
  <text x="410" y="144" font-size="11" fill="#b85450">跳过</text>
  <text x="500" y="144" font-size="11" fill="#333" font-weight="bold">2</text>

  <!-- Step 2: fast=3, nums[3]=2, nums[0]=1, not equal, write, slow=3 -->
  <text x="40" y="168" font-size="11" fill="#333">2</text>
  <text x="100" y="168" font-size="11" fill="#333">3</text>
  <text x="155" y="168" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="225" y="168" font-size="11" fill="#333">0</text>
  <text x="280" y="168" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="320" y="168" font-size="11" fill="#82b366">2 ≠ 1</text>
  <text x="410" y="168" font-size="11" fill="#4a7a3a">写入, slow→3</text>
  <text x="500" y="168" font-size="11" fill="#333" font-weight="bold">3</text>

  <!-- Step 3: fast=4, nums[4]=2, nums[1]=1, not equal, write, slow=4 -->
  <text x="40" y="192" font-size="11" fill="#333">3</text>
  <text x="100" y="192" font-size="11" fill="#333">4</text>
  <text x="155" y="192" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="225" y="192" font-size="11" fill="#333">1</text>
  <text x="280" y="192" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="320" y="192" font-size="11" fill="#82b366">2 ≠ 1</text>
  <text x="410" y="192" font-size="11" fill="#4a7a3a">写入, slow→4</text>
  <text x="500" y="192" font-size="11" fill="#333" font-weight="bold">4</text>

  <!-- Step 4: fast=5, nums[5]=3, nums[2]=2, not equal, write, slow=5 -->
  <text x="40" y="216" font-size="11" fill="#333">4</text>
  <text x="100" y="216" font-size="11" fill="#333">5</text>
  <text x="155" y="216" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="225" y="216" font-size="11" fill="#333">2</text>
  <text x="280" y="216" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="320" y="216" font-size="11" fill="#82b366">3 ≠ 2</text>
  <text x="410" y="216" font-size="11" fill="#4a7a3a">写入, slow→5</text>
  <text x="500" y="216" font-size="11" fill="#333" font-weight="bold">5 ⭐</text>

  <!-- Array state after processing -->
  <text x="40" y="256" font-size="12" fill="#888">最终数组:</text>

  <!-- final array cells -->
  <rect x="100" y="270" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122" y="292" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="146" y="270" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="168" y="292" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="192" y="270" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="214" y="292" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="238" y="270" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="292" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="284" y="270" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="306" y="292" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="330" y="270" width="44" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="352" y="292" text-anchor="middle" font-size="14" fill="#999">3</text>

  <!-- bracket showing k=5 -->
  <path d="M 100 314 Q 100 322 106 322 L 322 322 Q 328 322 328 314" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="214" y="338" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">前 slow = 5 个元素为结果</text>

  <!-- result box -->
  <rect x="60" y="356" width="460" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="378" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">答案 = 5，结果 = [1, 1, 2, 2, 3]</text>
  <text x="290" y="396" text-anchor="middle" font-size="11" fill="#888">第 3 个 1 被跳过，其余元素依次覆写到 slow 位置</text>

  <!-- legend -->
  <rect x="60" y="418" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="80" y="429" font-size="11" fill="#555">保留</text>
  <rect x="130" y="418" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="150" y="429" font-size="11" fill="#555">待处理</text>
  <text x="220" y="429" font-size="11" fill="#888">⭐ = 最终返回值</text>
</svg>
