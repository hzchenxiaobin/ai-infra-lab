<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="520" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：层序 BFS + 提前终止 + 四关键字排序</text>

  <!-- Step 1: Init -->
  <rect x="160" y="48" width="240" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 初始化</text>
  <text x="280" y="82" text-anchor="middle" font-size="11" fill="#555">dist 全 -1, q 压入 start, dist[sr][sc]=0</text>

  <!-- arrow down -->
  <path d="M 280 92 L 280 108" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: Check start cell -->
  <rect x="140" y="112" width="280" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="132" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 检查起点 (距离 0)</text>
  <text x="280" y="148" text-anchor="middle" font-size="11" fill="#555">grid[sr][sc] ∈ [low,high] ?</text>
  <text x="280" y="160" text-anchor="middle" font-size="10" fill="#4a7a3a">是 → 收集 (0, price, sr, sc)</text>

  <!-- arrow down to decision -->
  <path d="M 280 166 L 280 182" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: items >= k ? -->
  <polygon points="280,186 380,220 280,254 180,220" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="216" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">items.size</text>
  <text x="280" y="230" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">≥ k ?</text>

  <!-- Yes arrow -> right to sort -->
  <path d="M 380 220 L 440 220" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="410" y="214" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- No arrow -> down to BFS loop -->
  <path d="M 280 254 L 280 274" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="295" y="268" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- Step 3: BFS Loop -->
  <rect x="120" y="278" width="320" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="298" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ 层序 BFS（d 递增）</text>
  <text x="280" y="314" text-anchor="middle" font-size="10" fill="#555">处理队列中当前层全部节点</text>
  <text x="280" y="328" text-anchor="middle" font-size="10" fill="#555">→ 四方向扩展邻居（跳过墙/越界/已访问）</text>
  <text x="280" y="342" text-anchor="middle" font-size="10" fill="#4a7a3a">→ 范围内物品收集 (d, price, r, c)</text>

  <!-- arrow down -->
  <path d="M 280 352 L 280 368" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: items >= k after level ? -->
  <polygon points="280,372 380,406 280,440 180,406" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="402" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">层后</text>
  <text x="280" y="416" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">≥ k ?</text>

  <!-- No -> loop back up to BFS -->
  <path d="M 180 406 Q 80 406 80 314 L 120 314" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="4,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="80" y="360" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <text x="80" y="374" text-anchor="middle" font-size="9" fill="#b85450">下一层</text>

  <!-- Yes -> right to sort -->
  <path d="M 380 406 L 440 406" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="410" y="400" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Step 4: Sort -->
  <rect x="440" y="200" width="100" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="490" y="220" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">④ 排序</text>
  <text x="490" y="236" text-anchor="middle" font-size="9" fill="#555">(距离,价格</text>
  <text x="490" y="246" text-anchor="middle" font-size="9" fill="#555">,行,列)</text>

  <!-- arrow down from sort to return -->
  <path d="M 490 250 L 490 460" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- arrow from step 4 yes to sort (merge) -->
  <path d="M 490 406 L 490 250" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Step 5: Return top k -->
  <rect x="380" y="462" width="160" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="460" y="482" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">⑤ 返回前 k 个</text>
  <text x="460" y="498" text-anchor="middle" font-size="10" fill="#555">坐标 [row, col]</text>

  <!-- bottom note -->
  <text x="200" y="490" font-size="10" fill="#888">提前终止: 收集够 k 件即跳出 BFS</text>
</svg>
