<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：窗口外每种字符 ≤ target</text>

  <!-- String with window highlighted -->
  <text x="40" y="62" font-size="12" fill="#888">s =</text>

  <!-- Outside left: Q -->
  <rect x="80" y="48" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="68" text-anchor="middle" font-size="13" fill="#333">Q</text>

  <!-- Window: QQ (highlighted orange) -->
  <rect x="124" y="46" width="84" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <rect x="126" y="48" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="146" y="68" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">Q</text>
  <rect x="168" y="48" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="188" y="68" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">Q</text>

  <!-- Outside right: W -->
  <rect x="212" y="48" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="232" y="68" text-anchor="middle" font-size="13" fill="#333">W</text>

  <!-- Window label -->
  <text x="166" y="40" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">待替换窗口</text>

  <!-- Outside labels -->
  <text x="100" y="92" text-anchor="middle" font-size="9" fill="#888">窗外</text>
  <text x="166" y="92" text-anchor="middle" font-size="9" fill="#d6a040">窗内(可替换)</text>
  <text x="232" y="92" text-anchor="middle" font-size="9" fill="#888">窗外</text>

  <!-- Divider -->
  <path d="M 40 110 L 520 110" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Outside count table -->
  <text x="280" y="136" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">窗口外字符计数 vs target</text>

  <!-- Headers -->
  <rect x="120" y="150" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="167" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">Q</text>
  <rect x="190" y="150" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="167" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">W</text>
  <rect x="260" y="150" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="167" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">E</text>
  <rect x="330" y="150" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="167" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">R</text>

  <!-- target row -->
  <text x="90" y="200" text-anchor="end" font-size="10.5" fill="#888">target</text>
  <rect x="120" y="184" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="201" text-anchor="middle" font-size="11" fill="#4a7a3a">1</text>
  <rect x="190" y="184" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="201" text-anchor="middle" font-size="11" fill="#4a7a3a">1</text>
  <rect x="260" y="184" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="201" text-anchor="middle" font-size="11" fill="#4a7a3a">1</text>
  <rect x="330" y="184" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="201" text-anchor="middle" font-size="11" fill="#4a7a3a">1</text>

  <!-- outside count row -->
  <text x="90" y="236" text-anchor="end" font-size="10.5" fill="#888">窗外</text>
  <rect x="120" y="220" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="237" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="190" y="220" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="237" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="260" y="220" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="237" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="330" y="220" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="237" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>

  <!-- check marks -->
  <text x="150" y="258" text-anchor="middle" font-size="10" fill="#4a7a3a">✓ ≤1</text>
  <text x="220" y="258" text-anchor="middle" font-size="10" fill="#4a7a3a">✓ ≤1</text>
  <text x="290" y="258" text-anchor="middle" font-size="10" fill="#4a7a3a">✓ ≤1</text>
  <text x="360" y="258" text-anchor="middle" font-size="10" fill="#4a7a3a">✓ ≤1</text>

  <!-- Formula box -->
  <rect x="80" y="280" width="400" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="302" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">缺口之和 = Σ(target − 窗外[c]) = 窗口长度</text>
  <text x="280" y="322" text-anchor="middle" font-size="11" fill="#888">缺口 = (1−1)+(1−1)+(1−0)+(1−0) = 0+0+1+1 = 2 = 窗口长度 ✓</text>

  <!-- Conclusion -->
  <rect x="80" y="348" width="400" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="371" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">条件满足 → 窗口内填 E,R 即可平衡</text>
</svg>
