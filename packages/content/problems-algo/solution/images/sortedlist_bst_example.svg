<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：head = [-10, -3, 0, 5, 9]</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">中序模拟的「取值」步骤：填值顺序 = 链表顺序</text>

  <!-- ===== 演算表 ===== -->
  <!-- 表头 -->
  <rect x="24" y="60" width="532" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="64" y="78" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">步骤</text>
  <text x="186" y="78" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">递归到达</text>
  <text x="312" y="78" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">curr 指向</text>
  <text x="430" y="78" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">填入节点</text>
  <line x1="120" y1="60" x2="120" y2="86" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="252" y1="60" x2="252" y2="86" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="372" y1="60" x2="372" y2="86" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <!-- 行 1 -->
  <rect x="24" y="86" width="532" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="64" y="104" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">①</text>
  <text x="186" y="104" text-anchor="middle" font-size="11" fill="#333">build(0,0)</text>
  <text x="312" y="104" text-anchor="middle" font-size="11" fill="#333">-10</text>
  <text x="430" y="104" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">-10</text>
  <line x1="120" y1="86" x2="120" y2="114" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="252" y1="86" x2="252" y2="114" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="372" y1="86" x2="372" y2="114" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <!-- 行 2 -->
  <rect x="24" y="114" width="532" height="28" fill="#fafafa" stroke="#d6a040" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="64" y="132" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">②</text>
  <text x="186" y="132" text-anchor="middle" font-size="11" fill="#333">build(1,1)</text>
  <text x="312" y="132" text-anchor="middle" font-size="11" fill="#333">-3</text>
  <text x="430" y="132" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">-3</text>
  <line x1="120" y1="114" x2="120" y2="142" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="252" y1="114" x2="252" y2="142" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="372" y1="114" x2="372" y2="142" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <!-- 行 3 -->
  <rect x="24" y="142" width="532" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="64" y="160" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">③</text>
  <text x="186" y="160" text-anchor="middle" font-size="11" fill="#333">build(0,4) 根</text>
  <text x="312" y="160" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="430" y="160" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>
  <line x1="120" y1="142" x2="120" y2="170" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="252" y1="142" x2="252" y2="170" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="372" y1="142" x2="372" y2="170" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <!-- 行 4 -->
  <rect x="24" y="170" width="532" height="28" fill="#fafafa" stroke="#d6a040" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="64" y="188" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">④</text>
  <text x="186" y="188" text-anchor="middle" font-size="11" fill="#333">build(3,3)</text>
  <text x="312" y="188" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="430" y="188" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">5</text>
  <line x1="120" y1="170" x2="120" y2="198" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="252" y1="170" x2="252" y2="198" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="372" y1="170" x2="372" y2="198" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <!-- 行 5 -->
  <rect x="24" y="198" width="532" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="64" y="216" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⑤</text>
  <text x="186" y="216" text-anchor="middle" font-size="11" fill="#333">build(4,4)</text>
  <text x="312" y="216" text-anchor="middle" font-size="11" fill="#333">9</text>
  <text x="430" y="216" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">9</text>
  <line x1="120" y1="198" x2="120" y2="226" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="252" y1="198" x2="252" y2="226" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="372" y1="198" x2="372" y2="226" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <text x="290" y="246" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">填值顺序：-10, -3, 0, 5, 9 = 链表顺序 ✓（即中序遍历顺序）</text>

  <!-- ===== 最终树 ===== -->
  <text x="290" y="276" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">构造结果（高度平衡 BST）</text>

  <circle cx="290" cy="300" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="290" y="304" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>

  <circle cx="210" cy="352" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="356" text-anchor="middle" font-size="11" fill="#333">-10</text>
  <line x1="278" y1="312" x2="220" y2="340" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>

  <circle cx="370" cy="352" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370" y="356" text-anchor="middle" font-size="11" fill="#333">5</text>
  <line x1="302" y1="312" x2="360" y2="340" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>

  <circle cx="250" cy="404" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="250" y="408" text-anchor="middle" font-size="10" fill="#333">-3</text>
  <line x1="218" y1="364" x2="244" y2="394" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>

  <circle cx="410" cy="404" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="410" y="408" text-anchor="middle" font-size="10" fill="#333">9</text>
  <line x1="378" y1="364" x2="404" y2="394" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>

  <text x="120" y="382" font-size="10" fill="#888">左子树高 2</text>
  <text x="470" y="382" font-size="10" fill="#888">右子树高 2</text>
  <text x="290" y="430" text-anchor="middle" font-size="10" fill="#888">根 0 左右子树高度差 = 0 ≤ 1，平衡 ✓</text>
</svg>
