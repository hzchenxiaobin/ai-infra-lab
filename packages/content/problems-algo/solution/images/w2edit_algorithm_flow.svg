<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 600"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="600" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：双重循环 + 逐位计数 + 超过 2 即剪枝</text>

  <!-- ① init -->
  <rect x="180" y="44" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① ans = [ ]</text>
  <line x1="280" y1="78" x2="280" y2="98" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ◇ Diamond 1: query left? -->
  <polygon points="280,102 384,148 280,194 176,148" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="144" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">queries 还有</text>
  <text x="280" y="160" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">下一个 q ?</text>

  <!-- No (left) → return -->
  <line x1="176" y1="148" x2="96" y2="148" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="138" y="142" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="12" y="130" width="86" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="55" y="146" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return</text>
  <text x="55" y="159" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">ans</text>

  <!-- Yes (down) -->
  <line x1="280" y1="194" x2="280" y2="214" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="294" y="208" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- ② found=false -->
  <rect x="150" y="218" width="260" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="240" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② found = false</text>
  <line x1="280" y1="252" x2="280" y2="272" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ◇ Diamond 2: dict word left? -->
  <polygon points="280,276 384,322 280,368 176,322" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="318" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">dictionary 还有</text>
  <text x="280" y="334" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">下一个 w ?</text>

  <!-- No (left) → append check -->
  <line x1="176" y1="322" x2="120" y2="322" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="316" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">否</text>
  <rect x="12" y="304" width="108" height="38" fill="#f4f7fb" stroke="#888" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="66" y="321" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">found ?</text>
  <text x="66" y="335" text-anchor="middle" font-size="10" fill="#555">append(q)</text>
  <!-- back to query loop -->
  <path d="M 66 304 L 66 148 L 176 148" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="34" y="230" text-anchor="middle" font-size="9.5" fill="#888">下一 q</text>

  <!-- Yes (down) -->
  <line x1="280" y1="368" x2="280" y2="388" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="294" y="382" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- ③ diff=0; i=0 -->
  <rect x="140" y="392" width="280" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="414" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ diff = 0;  遍历 i = 0 .. n−1</text>
  <line x1="280" y1="426" x2="280" y2="446" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ◇ Diamond 3: q[i] != w[i] -->
  <polygon points="280,450 372,490 280,530 188,490" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="486" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">q[i] ≠ w[i] ?</text>
  <text x="280" y="502" text-anchor="middle" font-size="9.5" fill="#888">是 → diff++</text>

  <!-- right side: prune box -->
  <rect x="408" y="392" width="142" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="479" y="410" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">剪枝：diff &gt; 2 ?</text>
  <text x="479" y="424" text-anchor="middle" font-size="10" fill="#b85450">是 → break 本 w</text>

  <!-- arrow from diamond3 to prune box -->
  <path d="M 372 490 Q 420 488 440 434" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="418" y="468" text-anchor="middle" font-size="9" fill="#b85450">diff&gt;2</text>

  <!-- prune box → back to diamond2 (next w) -->
  <path d="M 479 392 L 479 322 L 388 322" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="498" y="358" text-anchor="middle" font-size="9.5" fill="#b85450">下一 w</text>

  <!-- success: i loop exhausted (down) → diff<=2 diamond -->
  <line x1="280" y1="530" x2="280" y2="552" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="546" font-size="9.5" fill="#888">i 遍历完</text>

  <polygon points="280,556 360,582 280,608 200,582" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="580" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">diff ≤ 2 ?</text>
  <text x="280" y="596" text-anchor="middle" font-size="9.5" fill="#888">是 → found=true</text>

  <!-- yes → back to diamond2 (found, break dict) -->
  <path d="M 360 582 L 400 582 L 400 322 L 388 322" fill="none" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="430" y="450" text-anchor="middle" font-size="9.5" fill="#4a7a3a">命中</text>

  <!-- No → next w (left side around) -->
  <line x1="200" y1="582" x2="160" y2="582" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="576" text-anchor="middle" font-size="9.5" fill="#888">否</text>
  <path d="M 160 582 L 130 582 L 130 322 L 176 322" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
