<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">错位排列：每个元素都不在原来的位置</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">perm[i] ≠ i 对所有 i 成立（以 n=4 为例）</text>

  <!-- ===== Row 1: original array (position labels) ===== -->
  <text x="30" y="78" font-size="11" fill="#888" font-weight="bold">位置下标</text>
  <g font-size="10" fill="#999" text-anchor="middle">
    <text x="100" y="78">1</text>
    <text x="160" y="78">2</text>
    <text x="220" y="78">3</text>
    <text x="280" y="78">4</text>
  </g>

  <!-- ===== Row 2: NOT a derangement (identity) ===== -->
  <text x="30" y="112" font-size="11" fill="#b85450" font-weight="bold">非错排</text>
  <g filter="url(#rough2)">
    <rect x="80" y="92" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="140" y="92" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="200" y="92" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="260" y="92" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#b85450" text-anchor="middle" font-weight="bold">
    <text x="100" y="118">1</text>
    <text x="160" y="118">2</text>
    <text x="220" y="118">3</text>
    <text x="280" y="118">4</text>
  </g>
  <!-- check marks: each element at its own position -->
  <g filter="url(#rough2)" font-size="10" fill="#b85450" text-anchor="middle">
    <text x="100" y="148">✗ i=1</text>
    <text x="160" y="148">✗ i=2</text>
    <text x="220" y="148">✗ i=3</text>
    <text x="280" y="148">✗ i=4</text>
  </g>
  <text x="360" y="118" font-size="11" fill="#b85450">每个数都在原位 → 0 个合法</text>

  <!-- ===== Row 3: a derangement ===== -->
  <text x="30" y="182" font-size="11" fill="#4a7a3a" font-weight="bold">是错排 ✓</text>
  <g filter="url(#rough2)">
    <rect x="80" y="162" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="140" y="162" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="200" y="162" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="260" y="162" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#4a7a3a" text-anchor="middle" font-weight="bold">
    <text x="100" y="188">2</text>
    <text x="160" y="188">1</text>
    <text x="220" y="188">4</text>
    <text x="280" y="188">3</text>
  </g>
  <g filter="url(#rough2)" font-size="10" fill="#4a7a3a" text-anchor="middle">
    <text x="100" y="218">✓ 2≠1</text>
    <text x="160" y="218">✓ 1≠2</text>
    <text x="220" y="218">✓ 4≠3</text>
    <text x="280" y="218">✓ 3≠4</text>
  </g>
  <text x="360" y="188" font-size="11" fill="#4a7a3a">每个数都换了位 → 合法</text>

  <!-- ===== Row 4: partial fixed → NOT a derangement ===== -->
  <text x="30" y="252" font-size="11" fill="#d6a040" font-weight="bold">非错排</text>
  <g filter="url(#rough2)">
    <rect x="80" y="232" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="140" y="232" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="200" y="232" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="260" y="232" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="14" text-anchor="middle" font-weight="bold">
    <text x="100" y="258" fill="#b85450">1</text>
    <text x="160" y="258" fill="#4a7a3a">3</text>
    <text x="220" y="258" fill="#4a7a3a">2</text>
    <text x="280" y="258" fill="#b85450">4</text>
  </g>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <text x="100" y="288" fill="#b85450">✗ 1=1</text>
    <text x="160" y="288" fill="#4a7a3a">✓ 3≠2</text>
    <text x="220" y="288" fill="#4a7a3a">✓ 2≠3</text>
    <text x="280" y="288" fill="#b85450">✗ 4=4</text>
  </g>
  <text x="360" y="258" font-size="11" fill="#d6a040">1、4 没动 → 不合法</text>

  <!-- ===== Bottom: definition box ===== -->
  <rect x="40" y="310" width="480" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="334" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">错位排列（Derangement）定义</text>
  <text x="280" y="356" text-anchor="middle" font-size="12" fill="#444">[1..n] 的排列 perm，满足 perm[i] ≠ i（∀i ∈ [1, n]）</text>
  <text x="280" y="374" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">记 D(n) = n 个元素的错排数</text>
</svg>
