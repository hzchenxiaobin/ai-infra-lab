<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 620"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="620" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：前缀 DP，O(n·R·L)</text>

  <!-- 开始 -->
  <rect x="105" y="44" width="140" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="12" filter="url(#rough2)"/>
  <text x="175" y="62" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">开始</text>
  <path d="M175,70 L175,84" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- A: 初始化 -->
  <rect x="95" y="88" width="160" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="104" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">① dp[0] ← 0</text>
  <text x="175" y="120" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">dp[1..n] ← INF</text>
  <path d="M175,126 L175,142" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- A 侧注：长度特判 -->
  <path d="M255,107 L292,107" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="298" y="103" font-size="9.5" fill="#b85450" filter="url(#rough2)">len(source) ≠ len(target)</text>
  <text x="298" y="117" font-size="9.5" fill="#b85450" filter="url(#rough2)">⇒ 等长替换，直接 −1</text>

  <!-- B: for i -->
  <rect x="95" y="146" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="168" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② for i = 0 … n−1</text>
  <path d="M175,180 L175,196" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B 右出：i 用完 → 返回 -->
  <path d="M255,174 L485,174 L485,577 L261,577" fill="none" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="360" y="168" text-anchor="middle" font-size="9.5" fill="#d6a040" filter="url(#rough2)">i 用完 ↓</text>

  <!-- C: dp[i]=INF? -->
  <polygon points="175,200 253,232 175,264 97,232" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="175" y="236" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">dp[i] = INF ?</text>
  <!-- C 是 → 跳回 B -->
  <path d="M97,232 L58,232 L58,170 L91,170" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="86" y="224" text-anchor="end" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>
  <!-- C 否 → D -->
  <path d="M175,264 L175,282" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="183" y="278" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- D: 免费保留 -->
  <rect x="95" y="286" width="160" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="303" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">③ 若 source[i] = target[i]</text>
  <text x="175" y="319" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">dp[i+1] ← dp[i]（免费）</text>
  <path d="M175,328 L175,342" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- F: for k -->
  <rect x="95" y="346" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="368" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">④ for k = 0 … R−1</text>
  <path d="M175,380 L175,406" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- F 底部左出：k 用完 → 下一个 i -->
  <path d="M110,380 L110,394 L28,394 L28,158 L91,158" fill="none" stroke="#999" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text transform="rotate(-90 21 285)" x="21" y="285" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">k 用完 → 下一个 i</text>

  <!-- G: 规则可用? -->
  <polygon points="175,410 272,445 175,480 78,445" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="175" y="438" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">i+L ≤ n 且 target 段</text>
  <text x="175" y="451" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">= replacement 且 pattern</text>
  <text x="175" y="464" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">通配匹配 source 段？</text>
  <!-- G 否 → 回 F -->
  <path d="M78,445 L45,445 L45,363 L91,363" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="70" y="437" text-anchor="end" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <!-- G 是 → H -->
  <path d="M175,480 L175,496" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="183" y="492" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- H: 转移 -->
  <rect x="80" y="500" width="190" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="522" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">⑤ dp[i+L] ← dp[i] + costs[k] + stars_k</text>
  <!-- H → 下一条 k -->
  <path d="M270,517 L440,517 L440,369 L259,369" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="355" y="509" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">转下一条 k</text>
  <!-- H 侧注 -->
  <text x="290" y="536" font-size="9" fill="#888" filter="url(#rough2)">stars_k = pattern 中 '*' 的个数</text>

  <!-- 返回 -->
  <path d="M175,534 L175,556" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arro)" filter="url(#rough2)"/>
  <rect x="95" y="560" width="160" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="175" y="582" text-anchor="middle" font-size="12" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">⑥ 返回 dp[n]（INF→−1）</text>
</svg>
