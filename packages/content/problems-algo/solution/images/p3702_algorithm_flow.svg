<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="20" y="18" font-size="12" fill="#888" filter="url(#rough2)">O(n) 一趟判定</text>

  <rect x="140" y="26" width="240" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="46" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">一趟扫描 nums，同时维护</text>
  <text x="260" y="64" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">totalXor ^= x 与 hasNonZero</text>

  <path d="M260,72 L260,86" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,88 370,124 260,160 150,124" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="129" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">totalXor ≠ 0 ?</text>

  <path d="M370,124 L396,124" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="382" y="114" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="400" y="102" width="104" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="452" y="121" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">返回 n</text>
  <text x="452" y="138" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">（全保留）</text>

  <path d="M260,160 L260,178" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="173" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>

  <polygon points="260,180 365,214 260,248 155,214" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="219" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">存在非零元素 ?</text>

  <path d="M365,214 L393,214" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="378" y="205" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="396" y="192" width="112" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="452" y="211" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">返回 n − 1</text>
  <text x="452" y="228" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">（删一个非零）</text>

  <path d="M260,248 L260,284" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="270" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="180" y="286" width="160" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="305" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">返回 0</text>
  <text x="260" y="322" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">（全零，无解）</text>
</svg>
