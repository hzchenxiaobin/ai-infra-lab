<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心：矩形整数点数 = (a−x+1)×(b−y+1) → 前缀和 → 按点数加权</text>

  <!-- ===== 三个矩形示意（带整数点） ===== -->
  <text x="40" y="58" font-size="11" fill="#888">三个非重叠矩形（整数点用圆点表示）</text>

  <!-- 矩形 0: (-2,-2)→(1,1), 4×4=16 点 -->
  <rect x="44" y="66" width="80" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <!-- 16 个点 4×4 -->
  <circle cx="54" cy="76" r="2.2" fill="#446688"/><circle cx="74" cy="76" r="2.2" fill="#446688"/><circle cx="94" cy="76" r="2.2" fill="#446688"/><circle cx="114" cy="76" r="2.2" fill="#446688"/>
  <circle cx="54" cy="96" r="2.2" fill="#446688"/><circle cx="74" cy="96" r="2.2" fill="#446688"/><circle cx="94" cy="96" r="2.2" fill="#446688"/><circle cx="114" cy="96" r="2.2" fill="#446688"/>
  <circle cx="54" cy="116" r="2.2" fill="#446688"/><circle cx="74" cy="116" r="2.2" fill="#446688"/><circle cx="94" cy="116" r="2.2" fill="#446688"/><circle cx="114" cy="116" r="2.2" fill="#446688"/>
  <circle cx="54" cy="136" r="2.2" fill="#446688"/><circle cx="74" cy="136" r="2.2" fill="#446688"/><circle cx="94" cy="136" r="2.2" fill="#446688"/><circle cx="114" cy="136" r="2.2" fill="#446688"/>
  <text x="84" y="160" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">rect0: 4×4=16</text>

  <!-- 矩形 1: (0,0)→(1,0), 2×1=2 点 -->
  <rect x="170" y="106" width="40" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <circle cx="180" cy="116" r="2.2" fill="#4a7a3a"/><circle cx="200" cy="116" r="2.2" fill="#4a7a3a"/>
  <text x="190" y="142" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">rect1: 2×1=2</text>

  <!-- 矩形 2: (3,0)→(3,2), 1×3=3 点 -->
  <rect x="296" y="66" width="20" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <circle cx="306" cy="76" r="2.2" fill="#d6a040"/><circle cx="306" cy="96" r="2.2" fill="#d6a040"/><circle cx="306" cy="116" r="2.2" fill="#d6a040"/>
  <text x="306" y="142" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">rect2: 1×3=3</text>

  <!-- +1 公式说明 -->
  <rect x="370" y="70" width="170" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="455" y="90" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⚠️ 整数点数 ≠ 面积</text>
  <text x="455" y="108" text-anchor="middle" font-size="10.5" fill="#555">点数 = (a − x + 1) × (b − y + 1)</text>
  <text x="455" y="122" text-anchor="middle" font-size="10" fill="#888">坐标含端点，所以要 +1</text>

  <!-- ===== 前缀和 → 加权轴 ===== -->
  <text x="40" y="182" font-size="11" fill="#888">前缀和 pre[i]</text>

  <rect x="112" y="164" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="136" y="183" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">16</text>

  <rect x="248" y="164" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="272" y="183" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">18</text>

  <rect x="384" y="164" width="48" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="408" y="183" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">21</text>

  <text x="446" y="182" font-size="11" fill="#888">=total</text>

  <!-- 虚线连接 -->
  <path d="M 136 194 L 136 222" stroke="#446688" stroke-width="1" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <path d="M 272 194 L 272 222" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <path d="M 408 194 L 408 222" stroke="#d6a040" stroke-width="1" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>

  <!-- 整数轴分段（宽度按点数比例） 112..408, total=21 → ~14.1px/点 -->
  <rect x="112" y="224" width="226" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="225" y="243" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">rect0 (16点)</text>

  <rect x="338" y="224" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="352" y="243" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">r1</text>

  <rect x="366" y="224" width="42" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="387" y="243" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">rect2</text>

  <!-- 刻度 -->
  <text x="112" y="266" text-anchor="middle" font-size="10" fill="#666">0</text>
  <text x="338" y="266" text-anchor="middle" font-size="10" fill="#666">16</text>
  <text x="366" y="266" text-anchor="middle" font-size="10" fill="#666">18</text>
  <text x="408" y="266" text-anchor="middle" font-size="10" fill="#666">21</text>

  <!-- ===== 两步采样说明 ===== -->
  <rect x="36" y="282" width="488" height="124" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="306" font-size="12" fill="#4a7a3a" font-weight="bold">为什么「按点数加权选矩形」+「矩形内均匀取点」= 全局均匀？</text>
  <text x="56" y="328" font-size="11" fill="#555">• 第一步：r = rand() % total 均匀落 [0,total)，按段长映射选矩形 i，P(选i) = 点数[i] / total</text>
  <text x="56" y="348" font-size="11" fill="#555">• 第二步：在 rect i 内 x ∈ [xi, ai] 均匀取整、y ∈ [yi, bi] 均匀取整，每个点概率 1 / 点数[i]</text>
  <text x="56" y="372" font-size="11" fill="#b85450" font-weight="bold">任一点被选中概率 = (点数[i]/total) × (1/点数[i]) = 1/total → 全局完全均匀 ✓</text>
  <text x="56" y="392" font-size="10.5" fill="#888">本质：528 的加权采样（选矩形）+ 矩形内二维均匀采样（选点），两步独立</text>
</svg>
