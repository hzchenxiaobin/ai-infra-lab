<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：rem = numWays[i] − f[i] 只能是 0 或 1</text>
  <text x="260" y="38" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">示例 1 · 扫描到 i = 6 时已确定面值 S = {2, 4}，f 是 S 的完全背包方案数</text>

  <!-- ============ Panel 1: numWays 数组 ============ -->
  <text x="34" y="64" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">① 目标 numWays</text>

  <g filter="url(#rough2)">
    <rect x="122" y="50" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="164" y="50" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="206" y="50" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="248" y="50" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="290" y="50" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <rect x="332" y="50" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="374" y="50" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="416" y="50" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>

    <text x="139" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
    <text x="181" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
    <text x="223" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
    <text x="265" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
    <text x="307" y="68" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">6</text>
    <text x="349" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">7</text>
    <text x="391" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">8</text>
    <text x="433" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">10</text>

    <text x="139" y="90" text-anchor="middle" font-size="8" fill="#999">1</text>
    <text x="181" y="90" text-anchor="middle" font-size="8" fill="#999">2</text>
    <text x="223" y="90" text-anchor="middle" font-size="8" fill="#999">3</text>
    <text x="265" y="90" text-anchor="middle" font-size="8" fill="#999">4</text>
    <text x="307" y="90" text-anchor="middle" font-size="8" fill="#b85450">i=6</text>
    <text x="349" y="90" text-anchor="middle" font-size="8" fill="#999">7</text>
    <text x="391" y="90" text-anchor="middle" font-size="8" fill="#999">8</text>
    <text x="433" y="90" text-anchor="middle" font-size="8" fill="#999">10</text>

    <text x="307" y="44" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">金额 i 的方法数 = 3</text>
  </g>

  <text x="260" y="110" text-anchor="middle" font-size="14" fill="#888" font-weight="bold" filter="url(#rough2)">−（减去已解释的部分）</text>

  <!-- ============ Panel 2: f 数组 ============ -->
  <text x="34" y="140" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 已选 {2,4} 的 f</text>

  <g filter="url(#rough2)">
    <rect x="122" y="126" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="164" y="126" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="206" y="126" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="248" y="126" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="290" y="126" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="332" y="126" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="374" y="126" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="416" y="126" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>

    <text x="139" y="144" text-anchor="middle" font-size="12" fill="#2a5a2a" font-weight="bold">0</text>
    <text x="181" y="144" text-anchor="middle" font-size="12" fill="#2a5a2a" font-weight="bold">1</text>
    <text x="223" y="144" text-anchor="middle" font-size="12" fill="#2a5a2a" font-weight="bold">0</text>
    <text x="265" y="144" text-anchor="middle" font-size="12" fill="#2a5a2a" font-weight="bold">2</text>
    <text x="307" y="144" text-anchor="middle" font-size="12.5" fill="#2a5a2a" font-weight="bold">2</text>
    <text x="349" y="144" text-anchor="middle" font-size="12" fill="#2a5a2a" font-weight="bold">0</text>
    <text x="391" y="144" text-anchor="middle" font-size="12" fill="#2a5a2a" font-weight="bold">3</text>
    <text x="433" y="144" text-anchor="middle" font-size="12" fill="#2a5a2a" font-weight="bold">3</text>

    <text x="139" y="166" text-anchor="middle" font-size="8" fill="#999">1</text>
    <text x="181" y="166" text-anchor="middle" font-size="8" fill="#999">2</text>
    <text x="223" y="166" text-anchor="middle" font-size="8" fill="#999">3</text>
    <text x="265" y="166" text-anchor="middle" font-size="8" fill="#999">4</text>
    <text x="307" y="166" text-anchor="middle" font-size="8" fill="#4a7a3a">i=6</text>
    <text x="349" y="166" text-anchor="middle" font-size="8" fill="#999">7</text>
    <text x="391" y="166" text-anchor="middle" font-size="8" fill="#999">8</text>
    <text x="433" y="166" text-anchor="middle" font-size="8" fill="#999">10</text>

    <text x="307" y="120" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">用 {2,4} 凑 6 的方法数 = 2（[2,2,2]、[2,4]）</text>
  </g>

  <path d="M 260 176 L 260 194" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ============ Panel 3: rem 结论 ============ -->
  <g filter="url(#rough2)">
    <rect x="150" y="200" width="220" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8"/>
    <text x="260" y="222" text-anchor="middle" font-size="13" fill="#8a6d1f" font-weight="bold">rem = 3 − 2 = 1 ⟹ 6 必是面值！</text>
  </g>

  <!-- ============ Panel 4: 为什么只能是单枚 ============ -->
  <text x="34" y="258" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">③ 为什么 rem ∈ {0,1}？未确定面值全 ≥ i = 6</text>

  <g filter="url(#rough2)">
    <ellipse cx="120" cy="292" rx="22" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="120" y="297" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">6</text>
    <text x="120" y="322" text-anchor="middle" font-size="9.5" fill="#2a5a2a" font-weight="bold">单枚 = 6 ✓</text>

    <ellipse cx="230" cy="285" rx="19" ry="15" fill="#f7f7f7" stroke="#aaa" stroke-width="1.5"/>
    <ellipse cx="272" cy="298" rx="19" ry="15" fill="#f7f7f7" stroke="#aaa" stroke-width="1.5"/>
    <text x="230" y="290" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">≥6</text>
    <text x="272" y="303" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">≥6</text>
    <text x="251" y="322" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">两枚 ≥ 12 &gt; 6 ✗</text>

    <rect x="330" y="264" width="160" height="58" fill="#f7f7f7" stroke="#aaa" stroke-width="1.3" rx="8"/>
    <text x="410" y="284" text-anchor="middle" font-size="9.5" fill="#555">至少用一枚「未确定面值」</text>
    <text x="410" y="298" text-anchor="middle" font-size="9.5" fill="#555">凑出 6 的组合：只能是 [6]</text>
    <text x="410" y="312" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">计数非 0 即 1，无第二种解释</text>
  </g>

  <!-- ============ 结果框 ============ -->
  <g filter="url(#rough2)">
    <rect x="50" y="340" width="420" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="260" y="359" text-anchor="middle" font-size="11.5" fill="#2a5a2a" font-weight="bold">rem=1 ⟹ 面值 6 加入答案 {2,4,6}，再做一趟正向完全背包补齐 f</text>
    <text x="260" y="377" text-anchor="middle" font-size="8.5" fill="#333">rem=0 ⟹ i 不是面值直接跳过；rem&lt;0 或 ≥2 ⟹ 输入矛盾，返回空数组</text>
  </g>
</svg>
