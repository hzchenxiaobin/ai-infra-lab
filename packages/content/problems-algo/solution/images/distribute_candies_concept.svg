<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：两个独立上界取 min</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">容量上界 n/2  与  种类上界 |unique|  同时压顶</text>

  <!-- ===== Left branch: 容量上界 n/2 ===== -->
  <text x="110" y="84" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">容量上界</text>
  <rect x="40" y="94" width="140" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="110" y="118" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">医生只许吃 n/2 颗</text>
  <text x="110" y="136" text-anchor="middle" font-size="11" fill="#666">每颗最多 1 种新类型</text>
  <path d="M 110 154 L 110 178" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="50" y="182" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="110" y="204" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold">≤ n/2 种</text>

  <!-- ===== Right branch: 种类上界 |unique| ===== -->
  <text x="420" y="84" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">种类上界</text>
  <rect x="350" y="94" width="140" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="420" y="118" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">糖果本身只有这么多类</text>
  <text x="420" y="136" text-anchor="middle" font-size="11" fill="#666">吃光了也只有 |unique| 种</text>
  <path d="M 420 154 L 420 178" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="360" y="182" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="420" y="204" text-anchor="middle" font-size="13" fill="#3a5a2a" font-weight="bold">≤ |unique| 种</text>

  <!-- ===== min funnel ===== -->
  <path d="M 110 220 L 280 256" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 420 220 L 280 256" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="262" width="220" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="290" text-anchor="middle" font-size="14" fill="#7a4a10" font-weight="bold">ans = min(n/2, |unique|)</text>

  <!-- ===== insight box ===== -->
  <rect x="24" y="316" width="512" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="338" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">构造可达：unique≥n/2 时每种取一颗凑 n/2；unique&lt;n/2 时先取全种类再补满</text>
  <text x="280" y="356" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">两个上界独立成立 → 直接取 min，无需搜索</text>
</svg>
