<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="430" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：ninexsix —— 命中吞词、失配吐格</text>

  <!-- step 1: i=0, nine -->
  <text x="24" y="66" font-size="11.5" fill="#446688" font-weight="bold">① i=0</text>
  <rect x="70" y="46" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="87" y="66" text-anchor="middle" font-size="13" fill="#333">n</text>
  <rect x="110" y="46" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="127" y="66" text-anchor="middle" font-size="13" fill="#333">i</text>
  <rect x="150" y="46" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="167" y="66" text-anchor="middle" font-size="13" fill="#333">n</text>
  <rect x="190" y="46" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="207" y="66" text-anchor="middle" font-size="13" fill="#333">e</text>
  <rect x="230" y="46" width="34" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="247" y="66" text-anchor="middle" font-size="13" fill="#333">x</text>
  <rect x="270" y="46" width="34" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="287" y="66" text-anchor="middle" font-size="13" fill="#333">s</text>
  <rect x="310" y="46" width="34" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="327" y="66" text-anchor="middle" font-size="13" fill="#333">i</text>
  <rect x="350" y="46" width="34" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="367" y="66" text-anchor="middle" font-size="13" fill="#333">x</text>
  <text x="87" y="94" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">▲i=0</text>
  <text x="445" y="56" font-size="10.5" fill="#333">行走 n→i→n→e，j=4 到 nine 终端</text>
  <text x="445" y="74" font-size="10.5" fill="#4a7a3a" font-weight="bold">输出 9；i 跳到 4（吞掉整词）</text>

  <!-- step 2: i=4, x fail -->
  <text x="24" y="158" font-size="11.5" fill="#446688" font-weight="bold">② i=4</text>
  <rect x="70" y="138" width="34" height="30" fill="#eee" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="87" y="158" text-anchor="middle" font-size="13" fill="#999">n</text>
  <rect x="110" y="138" width="34" height="30" fill="#eee" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="127" y="158" text-anchor="middle" font-size="13" fill="#999">i</text>
  <rect x="150" y="138" width="34" height="30" fill="#eee" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="167" y="158" text-anchor="middle" font-size="13" fill="#999">n</text>
  <rect x="190" y="138" width="34" height="30" fill="#eee" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="207" y="158" text-anchor="middle" font-size="13" fill="#999">e</text>
  <rect x="230" y="138" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="247" y="158" text-anchor="middle" font-size="13" fill="#333">x</text>
  <rect x="270" y="138" width="34" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="287" y="158" text-anchor="middle" font-size="13" fill="#333">s</text>
  <rect x="310" y="138" width="34" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="327" y="158" text-anchor="middle" font-size="13" fill="#333">i</text>
  <rect x="350" y="138" width="34" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="367" y="158" text-anchor="middle" font-size="13" fill="#333">x</text>
  <text x="247" y="186" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">▲i=4</text>
  <text x="445" y="148" font-size="10.5" fill="#333">根没有 x 的子边：一步断链</text>
  <text x="445" y="166" font-size="10.5" fill="#d6a040" font-weight="bold">输出 x；i=5（只吐一个字符）</text>

  <!-- step 3: i=5, six -->
  <text x="24" y="250" font-size="11.5" fill="#446688" font-weight="bold">③ i=5</text>
  <rect x="70" y="230" width="34" height="30" fill="#eee" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="87" y="250" text-anchor="middle" font-size="13" fill="#999">n</text>
  <rect x="110" y="230" width="34" height="30" fill="#eee" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="127" y="250" text-anchor="middle" font-size="13" fill="#999">i</text>
  <rect x="150" y="230" width="34" height="30" fill="#eee" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="167" y="250" text-anchor="middle" font-size="13" fill="#999">n</text>
  <rect x="190" y="230" width="34" height="30" fill="#eee" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="207" y="250" text-anchor="middle" font-size="13" fill="#999">e</text>
  <rect x="230" y="230" width="34" height="30" fill="#eee" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="247" y="250" text-anchor="middle" font-size="13" fill="#999">x</text>
  <rect x="270" y="230" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="287" y="250" text-anchor="middle" font-size="13" fill="#333">s</text>
  <rect x="310" y="230" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="327" y="250" text-anchor="middle" font-size="13" fill="#333">i</text>
  <rect x="350" y="230" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="367" y="250" text-anchor="middle" font-size="13" fill="#333">x</text>
  <text x="287" y="278" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">▲i=5</text>
  <text x="445" y="240" font-size="10.5" fill="#333">行走 s→i→x，j=8 到 six 终端</text>
  <text x="445" y="258" font-size="10.5" fill="#4a7a3a" font-weight="bold">输出 6；i=8（吞掉整词）</text>

  <!-- step 4: done -->
  <text x="24" y="342" font-size="11.5" fill="#446688" font-weight="bold">④ i=8</text>
  <rect x="70" y="322" width="34" height="30" fill="#eee" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="87" y="342" text-anchor="middle" font-size="13" fill="#999">n</text>
  <rect x="110" y="322" width="34" height="30" fill="#eee" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="127" y="342" text-anchor="middle" font-size="13" fill="#999">i</text>
  <rect x="150" y="322" width="34" height="30" fill="#eee" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="167" y="342" text-anchor="middle" font-size="13" fill="#999">n</text>
  <rect x="190" y="322" width="34" height="30" fill="#eee" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="207" y="342" text-anchor="middle" font-size="13" fill="#999">e</text>
  <rect x="230" y="322" width="34" height="30" fill="#eee" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="247" y="342" text-anchor="middle" font-size="13" fill="#999">x</text>
  <rect x="270" y="322" width="34" height="30" fill="#eee" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="287" y="342" text-anchor="middle" font-size="13" fill="#999">s</text>
  <rect x="310" y="322" width="34" height="30" fill="#eee" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="327" y="342" text-anchor="middle" font-size="13" fill="#999">i</text>
  <rect x="350" y="322" width="34" height="30" fill="#eee" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="367" y="342" text-anchor="middle" font-size="13" fill="#999">x</text>
  <text x="220" y="370" text-anchor="middle" font-size="10.5" fill="#888">i = 8 = n：扫描结束</text>
  <rect x="445" y="322" width="160" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="525" y="342" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">返回 "9x6"</text>

  <!-- pitfall -->
  <rect x="24" y="390" width="580" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="314" y="410" text-anchor="middle" font-size="11" fill="#b85450">⚠️ 失配后从 i+1 重启（不是断链处）；命中后吞整词不回溯 —— "sevenine" 的 nine 永远等不到</text>
</svg>
