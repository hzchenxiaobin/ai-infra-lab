<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">Fisher-Yates 洗牌：自后向前扫描，i 与 [0,i] 中随机 j 交换</text>

  <!-- 数组格子 [1,2,3,4,5] -->
  <text x="40" y="78" font-size="11" fill="#888">数组 arr（n=5）</text>
  <rect x="40" y="86" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="65" y="108" text-anchor="middle" font-size="13" fill="#446688">1</text>
  <rect x="92" y="86" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="117" y="108" text-anchor="middle" font-size="13" fill="#446688">2</text>
  <rect x="144" y="86" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="169" y="108" text-anchor="middle" font-size="13" fill="#446688">3</text>
  <rect x="196" y="86" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="221" y="108" text-anchor="middle" font-size="13" fill="#446688">4</text>
  <rect x="248" y="86" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="273" y="108" text-anchor="middle" font-size="13" fill="#446688">5</text>

  <!-- 下标标注 -->
  <text x="65" y="138" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="117" y="138" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="169" y="138" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="221" y="138" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="273" y="138" text-anchor="middle" font-size="10" fill="#888">4</text>

  <!-- 当前 i 指针（指向位置 4，红色加粗） -->
  <text x="273" y="74" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">i=4</text>
  <path d="M 273 80 L 273 84" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- 候选范围 [0,i] 标注（下划线弧） -->
  <path d="M 60 150 Q 168 168 278 150" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 3" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="168" y="166" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">候选范围 [0, i]，含 i 自身</text>

  <!-- 随机选 j（橙色框高亮 j=1） -->
  <rect x="90" y="84" width="54" height="38" fill="none" stroke="#d6a040" stroke-width="2.4" rx="6" filter="url(#rough2)"/>
  <text x="117" y="64" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">j=1（随机）</text>

  <!-- 交换箭头：arr[1] <-> arr[4] -->
  <path d="M 117 124 Q 195 196 273 124" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 273 124 Q 195 200 117 124" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="195" y="216" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">swap(arr[i], arr[j])</text>

  <!-- 右侧：锁定区说明 -->
  <rect x="330" y="86" width="210" height="110" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="350" y="110" font-size="12" fill="#4a7a3a" font-weight="bold">交换 = 锁定 arr[i]</text>
  <text x="350" y="130" font-size="11" fill="#555">交换后 arr[i] 不再参与</text>
  <text x="350" y="148" font-size="11" fill="#555">后续选择，等价于「移入</text>
  <text x="350" y="166" font-size="11" fill="#555">结果区 / 从池中移除」。</text>
  <text x="350" y="186" font-size="10.5" fill="#888">前缀 [0, i-1] 进入下一轮</text>

  <!-- 底部：均匀性公式 -->
  <rect x="30" y="262" width="500" height="118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="50" y="286" font-size="12" fill="#d6a040" font-weight="bold">为何均匀？任意排列 π 的概率</text>
  <text x="50" y="308" font-size="12.5" fill="#555">P(π) = (1/n) · (1/(n−1)) · … · (1/1) = 1 / n!</text>
  <text x="50" y="330" font-size="10.5" fill="#555">每条「选择路径」唯一对应一个排列，n! 条路径覆盖全部排列</text>
  <text x="50" y="350" font-size="10.5" fill="#888">⚠️ j 必须 ∈ [0, i] 含 i：写成 rand()%i 会系统性排除恒等排列</text>
  <text x="50" y="370" font-size="10.5" fill="#888">实现：for i=n-1 downto 1:  j = rand()%(i+1);  swap(arr[i],arr[j]);</text>
</svg>
