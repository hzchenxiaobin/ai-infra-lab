<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程</text>

  <!-- Start -->
  <ellipse cx="260" cy="54" rx="46" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="59" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">开始</text>

  <path d="M 260 74 L 260 92" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 1: init -->
  <rect x="80" y="94" width="360" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="116" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">初始化 dp 为 (m+1)×(n+1) 全 0，ans = 0</text>
  <text x="260" y="134" text-anchor="middle" font-size="11" fill="#666">首行首列 = 空边界，公共子数组长度 0</text>

  <path d="M 260 146 L 260 164" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: loop -->
  <rect x="80" y="166" width="360" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="193" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">for i = 1..m,  j = 1..n  逐行填表</text>

  <path d="M 260 212 L 260 230" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Diamond: match? -->
  <polygon points="260,230 350,272 260,314 170,272" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="268" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">nums1[i−1]</text>
  <text x="260" y="284" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">== nums2[j−1] ?</text>

  <!-- yes branch (right) -->
  <path d="M 350 272 L 392 272" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="370" y="266" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="392" y="250" width="118" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="451" y="270" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">dp[i][j] =</text>
  <text x="451" y="286" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">dp[i−1][j−1] + 1</text>

  <!-- ans update -->
  <path d="M 451 294 L 451 312" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="392" y="314" width="118" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="451" y="339" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">ans = max(ans, dp)</text>

  <!-- no branch (left) -->
  <path d="M 170 272 L 128 272" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="148" y="266" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="10" y="250" width="118" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="69" y="270" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">dp[i][j] = 0</text>
  <text x="69" y="286" text-anchor="middle" font-size="10.5" fill="#888">连续段断裂</text>

  <!-- merge arrows down to loop-back -->
  <path d="M 69 294 Q 69 360 200 360 L 256 360" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 451 354 Q 451 360 320 360 L 264 360" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- loop back arrow to step 2 -->
  <path d="M 260 360 Q 60 360 60 188 L 78 188" stroke="#888" stroke-width="1.6" stroke-dasharray="4,3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="44" y="280" text-anchor="middle" font-size="10.5" fill="#888" font-style="italic">下一格</text>

  <!-- end -->
  <path d="M 260 360 L 260 392" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="280" y="378" font-size="10.5" fill="#888" font-style="italic">填表完毕</text>
  <rect x="150" y="394" width="220" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="420" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">返回 ans ⭐</text>
</svg>
