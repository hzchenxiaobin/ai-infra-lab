<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：s = "banana"（n = 6）</text>
  <text x="300" y="48" text-anchor="middle" font-size="11" fill="#888">二分长度 L：mid=3 命中 "ana" → 试 L=4 失败 → 最长重复子串 "ana"</text>

  <!-- ===== 二分过程 ===== -->
  <rect x="30" y="62" width="540" height="86" fill="#f4f6f8" stroke="#bbb" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="48" y="84" font-size="12" fill="#444" font-weight="bold">① 外层二分（lo=1, hi=5）</text>
  <text x="48" y="104" font-size="11" fill="#555">第 1 轮 mid=3：check(3)=找到 → ✓ 记 bestLen=3, bestStart=1，lo=4</text>
  <text x="48" y="122" font-size="11" fill="#555">第 2 轮 mid=4：check(4)=−1 → ✗ 无重复长度 4，hi=3</text>
  <text x="48" y="140" font-size="11" fill="#3a5a2a" font-weight="bold">lo=4 &gt; hi=3 结束 → 答案 s[1..1+3] = "ana"</text>

  <!-- ===== check(3) 滚动过程 ===== -->
  <text x="30" y="170" font-size="12" fill="#2a4a66" font-weight="bold">② check(3)：枚举所有长度 3 的子串，双哈希查重</text>

  <!-- 字符串格子 b a n a n a -->
  <g font-size="11">
    <rect x="60" y="182" width="40" height="30" fill="#eee" stroke="#bbb" rx="3" filter="url(#rough2)"/>
    <text x="80" y="202" text-anchor="middle" fill="#888" font-weight="bold">b</text>
    <rect x="100" y="182" width="40" height="30" fill="#eee" stroke="#bbb" rx="3" filter="url(#rough2)"/>
    <text x="120" y="202" text-anchor="middle" fill="#888" font-weight="bold">a</text>
    <rect x="140" y="182" width="40" height="30" fill="#eee" stroke="#bbb" rx="3" filter="url(#rough2)"/>
    <text x="160" y="202" text-anchor="middle" fill="#888" font-weight="bold">n</text>
    <rect x="180" y="182" width="40" height="30" fill="#eee" stroke="#bbb" rx="3" filter="url(#rough2)"/>
    <text x="200" y="202" text-anchor="middle" fill="#888" font-weight="bold">a</text>
    <rect x="220" y="182" width="40" height="30" fill="#eee" stroke="#bbb" rx="3" filter="url(#rough2)"/>
    <text x="240" y="202" text-anchor="middle" fill="#888" font-weight="bold">n</text>
    <rect x="260" y="182" width="40" height="30" fill="#eee" stroke="#bbb" rx="3" filter="url(#rough2)"/>
    <text x="280" y="202" text-anchor="middle" fill="#888" font-weight="bold">a</text>
  </g>
  <text x="60" y="226" font-size="9" fill="#888">下标 0   1   2   3   4   5</text>

  <!-- 子串表 -->
  <rect x="350" y="178" width="220" height="180" fill="#fff" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="460" y="196" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">哈希表（双哈希键 → 位置）</text>
  <line x1="360" y1="202" x2="560" y2="202" stroke="#ddd"/>
  <text x="362" y="220" font-size="10" fill="#446688" font-family="monospace">i=0 "ban" → key_b</text>
  <text x="362" y="238" font-size="10" fill="#4a7a3a" font-family="monospace">i=1 "ana" → key_a</text>
  <text x="362" y="256" font-size="10" fill="#446688" font-family="monospace">i=2 "nan" → key_n</text>
  <text x="362" y="276" font-size="10" fill="#b85450" font-family="monospace" font-weight="bold">i=3 "ana" → key_a ★命中</text>
  <text x="362" y="296" font-size="9" fill="#888">key_a 已在位置 1 出现</text>
  <text x="362" y="314" font-size="9" fill="#888">→ s[1..3]=="ana" 重复！</text>
  <text x="362" y="334" font-size="9" fill="#b85450" font-weight="bold">返回首次位置 p = 1</text>
  <text x="362" y="352" font-size="9" fill="#888">(滚动 O(1)，无需重算)</text>

  <!-- 两个 "ana" 窗口高亮 -->
  <rect x="100" y="248" width="120" height="30" fill="none" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="180" y="248" width="120" height="30" fill="none" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="266" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">ana (i=1)</text>
  <text x="240" y="266" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">ana (i=3)</text>

  <text x="60" y="294" font-size="10" fill="#666">两个窗口内容相同 → 双哈希键相同 → 哈希表第二次插入时命中</text>
  <text x="60" y="310" font-size="10" fill="#666">→ 存在长度 3 的重复子串，check(3) 返回位置 1</text>

  <!-- ===== check(4) 失败 ===== -->
  <rect x="30" y="372" width="540" height="86" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="48" y="394" font-size="12" fill="#b85450" font-weight="bold">③ check(4)：长度 4 子串 = {bana, anan, nana}，三者各异 → 无命中 → 返回 −1</text>
  <text x="48" y="414" font-size="11" fill="#555">→ 不存在长度 4 的重复，hi = mid−1 = 3</text>
  <text x="48" y="434" font-size="11" fill="#3a5a2a" font-weight="bold">最终 bestLen=3 → 返回 s.substr(1, 3) = "ana"  ✓</text>
  <text x="48" y="452" font-size="10" fill="#888">整个过程 O(n log n) 次哈希运算：log₂5 ≈ 3 轮，每轮 O(6)。</text>
</svg>
