<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：一趟 GROUP BY，并联产出「拼串 / 总数 / 匹配数」三列</text>

  <text x="128" y="48" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">① GROUP BY state：15 行 → 4 组</text>

  <rect x="30" y="56" width="196" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="71" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">New York（N）</text>
  <text x="48" y="85" font-size="8.5" fill="#333" filter="url(#rough2)">• New York City　• Newark</text>
  <text x="48" y="98" font-size="8.5" fill="#333" filter="url(#rough2)">• Buffalo　• Rochester</text>
  <text x="48" y="118" font-size="8.5" fill="#888" filter="url(#rough2)">4 城：N N B R</text>

  <rect x="30" y="134" width="196" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="149" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">California（C）</text>
  <text x="48" y="163" font-size="8.5" fill="#333" filter="url(#rough2)">• San Francisco　• Sacramento</text>
  <text x="48" y="176" font-size="8.5" fill="#333" filter="url(#rough2)">• San Diego　• Los Angeles</text>
  <text x="48" y="196" font-size="8.5" fill="#b85450" filter="url(#rough2)">4 城：S S S L（无 C！）</text>

  <rect x="30" y="212" width="196" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="40" y="227" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">Texas（T）★ 单组放大</text>
  <text x="48" y="241" font-size="8.5" fill="#333" filter="url(#rough2)">• Tyler　• Temple</text>
  <text x="48" y="254" font-size="8.5" fill="#333" filter="url(#rough2)">• Taylor　• Dallas</text>
  <text x="48" y="274" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">4 城：T T T D</text>

  <rect x="30" y="290" width="196" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="305" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">Pennsylvania（P）</text>
  <text x="48" y="319" font-size="8.5" fill="#333" filter="url(#rough2)">• Philadelphia　• Pittsburgh</text>
  <text x="48" y="332" font-size="8.5" fill="#333" filter="url(#rough2)">• Pottstown</text>

  <path d="M 232 96 L 252 96" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="242" y="88" font-size="8" fill="#888" filter="url(#rough2)">→</text>

  <text x="400" y="48" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 组内逐行：LEFT(city,1) = LEFT(state,1) ?</text>

  <rect x="260" y="56" width="120" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="70" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Tyler</text>
  <rect x="386" y="56" width="92" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="432" y="70" text-anchor="middle" font-size="9" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">T = T → 1</text>

  <rect x="260" y="80" width="120" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="94" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Temple</text>
  <rect x="386" y="80" width="92" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="432" y="94" text-anchor="middle" font-size="9" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">T = T → 1</text>

  <rect x="260" y="104" width="120" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="118" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Taylor</text>
  <rect x="386" y="104" width="92" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="432" y="118" text-anchor="middle" font-size="9" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">T = T → 1</text>

  <rect x="260" y="128" width="120" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="142" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Dallas</text>
  <rect x="386" y="128" width="92" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="432" y="142" text-anchor="middle" font-size="9" fill="#8a3030" font-weight="bold" filter="url(#rough2)">D ≠ T → 0</text>

  <path d="M 332 152 L 332 168" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="344" y="164" font-size="9" fill="#4a7a3a" filter="url(#rough2)">边扫边记账，不过滤行！</text>

  <rect x="260" y="172" width="80" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="300" y="189" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">COUNT(*)</text>
  <text x="300" y="205" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">= 4 总数</text>

  <rect x="348" y="172" width="80" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="388" y="189" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">SUM(匹配)</text>
  <text x="388" y="205" text-anchor="middle" font-size="9" fill="#8a3030" font-weight="bold" filter="url(#rough2)">= 1+1+1+0 = 3</text>

  <rect x="436" y="172" width="98" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="485" y="189" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">GROUP_CONCAT</text>
  <text x="485" y="205" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">排序 + ', ' 拼串</text>

  <rect x="260" y="222" width="274" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="397" y="241" text-anchor="middle" font-size="9.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">"Dallas, Taylor, Temple, Tyler"</text>

  <rect x="260" y="262" width="274" height="40" fill="none" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="5,4" rx="8" filter="url(#rough2)"/>
  <text x="397" y="279" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">条件计数 ≠ 行级过滤</text>
  <text x="397" y="294" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">Dallas 留在组里拼串，只是不进 SUM 的账</text>

  <rect x="30" y="358" width="504" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="282" y="372" text-anchor="middle" font-size="10" fill="#444" font-weight="bold" filter="url(#rough2)">一个分组 → 一行：state + cities + matching_letter_count</text>
  <text x="282" y="386" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">三个聚合并联共享一趟分组扫描——免子查询、免 JOIN</text>
</svg>
