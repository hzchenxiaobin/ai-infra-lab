<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="520" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：逐窗口判定三连相同，维护最大数字</text>

  <!-- ===== Example 1: "6777133339" ===== -->
  <text x="40" y="50" font-size="12" fill="#446688" font-weight="bold">示例 1：num = "6777133339"（n=10，窗口 i=0..7）</text>

  <!-- Table header -->
  <rect x="60" y="58" width="380" height="26" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="76" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">i</text>
  <text x="165" y="76" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">窗口</text>
  <text x="265" y="76" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">三连相同？</text>
  <text x="395" y="76" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">best</text>

  <!-- column separators -->
  <line x1="120" y1="58" x2="120" y2="280" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="210" y1="58" x2="210" y2="280" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="320" y1="58" x2="320" y2="280" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>

  <!-- rows: i, window, match, best ; row height 26, start y=84 -->
  <!-- i=0 -->
  <rect x="60" y="84" width="380" height="26" fill="#f4f7fb" stroke="none"/>
  <text x="90" y="101" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="165" y="101" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">677</text>
  <text x="265" y="101" text-anchor="middle" font-size="11" fill="#888">✗</text>
  <text x="395" y="101" text-anchor="middle" font-size="11" fill="#888">""</text>

  <!-- i=1 HIGHLIGHT -->
  <rect x="60" y="110" width="380" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="90" y="127" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <text x="165" y="127" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">777</text>
  <text x="265" y="127" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓ d=7</text>
  <text x="395" y="127" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">"777"</text>

  <!-- i=2 -->
  <rect x="60" y="136" width="380" height="26" fill="#fff" stroke="none"/>
  <text x="90" y="153" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="165" y="153" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">771</text>
  <text x="265" y="153" text-anchor="middle" font-size="11" fill="#888">✗</text>
  <text x="395" y="153" text-anchor="middle" font-size="11" fill="#888">"777"</text>

  <!-- i=3 -->
  <rect x="60" y="162" width="380" height="26" fill="#f4f7fb" stroke="none"/>
  <text x="90" y="179" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="165" y="179" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">713</text>
  <text x="265" y="179" text-anchor="middle" font-size="11" fill="#888">✗</text>
  <text x="395" y="179" text-anchor="middle" font-size="11" fill="#888">"777"</text>

  <!-- i=4 -->
  <rect x="60" y="188" width="380" height="26" fill="#fff" stroke="none"/>
  <text x="90" y="205" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="165" y="205" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">133</text>
  <text x="265" y="205" text-anchor="middle" font-size="11" fill="#888">✗</text>
  <text x="395" y="205" text-anchor="middle" font-size="11" fill="#888">"777"</text>

  <!-- i=5 HIGHLIGHT (333 found but not bigger) -->
  <rect x="60" y="214" width="380" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="90" y="231" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">5</text>
  <text x="165" y="231" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">333</text>
  <text x="265" y="231" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓ d=3</text>
  <text x="395" y="231" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">"777" (3&lt;7)</text>

  <!-- i=6 -->
  <rect x="60" y="240" width="380" height="26" fill="#f4f7fb" stroke="none"/>
  <text x="90" y="257" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="165" y="257" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">333</text>
  <text x="265" y="257" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓ d=3</text>
  <text x="395" y="257" text-anchor="middle" font-size="11" fill="#888">不换</text>

  <!-- i=7 -->
  <rect x="60" y="266" width="380" height="14" fill="#fff" stroke="none"/>
  <text x="90" y="277" text-anchor="middle" font-size="10" fill="#333">7</text>
  <text x="165" y="277" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">339</text>
  <text x="265" y="277" text-anchor="middle" font-size="10" fill="#888">✗</text>
  <text x="395" y="277" text-anchor="middle" font-size="10" fill="#888">"777"</text>

  <!-- table outer border -->
  <rect x="60" y="58" width="380" height="222" fill="none" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- result ex1 -->
  <rect x="460" y="110" width="90" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="505" y="131" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">答案</text>
  <text x="505" y="144" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">"777"</text>

  <!-- ===== Example 2: "2300019" → "000" ===== -->
  <text x="40" y="312" font-size="12" fill="#b85450" font-weight="bold">示例 2：num = "2300019"（验证 '0' 也是合法答案）</text>

  <!-- Table header -->
  <rect x="60" y="320" width="380" height="26" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="338" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">i</text>
  <text x="165" y="338" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">窗口</text>
  <text x="265" y="338" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">三连相同？</text>
  <text x="395" y="338" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">best</text>

  <line x1="120" y1="320" x2="120" y2="452" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="210" y1="320" x2="210" y2="452" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="320" y1="320" x2="320" y2="452" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>

  <!-- i=0 -->
  <rect x="60" y="346" width="380" height="26" fill="#f4f7fb" stroke="none"/>
  <text x="90" y="363" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="165" y="363" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">230</text>
  <text x="265" y="363" text-anchor="middle" font-size="11" fill="#888">✗</text>
  <text x="395" y="363" text-anchor="middle" font-size="11" fill="#888">""</text>

  <!-- i=1 -->
  <rect x="60" y="372" width="380" height="26" fill="#fff" stroke="none"/>
  <text x="90" y="389" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="165" y="389" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">300</text>
  <text x="265" y="389" text-anchor="middle" font-size="11" fill="#888">✗</text>
  <text x="395" y="389" text-anchor="middle" font-size="11" fill="#888">""</text>

  <!-- i=2 HIGHLIGHT (000 found!) -->
  <rect x="60" y="398" width="380" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="415" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="165" y="415" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">000</text>
  <text x="265" y="415" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓ d=0</text>
  <text x="395" y="415" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">"000" ★</text>

  <!-- i=3 -->
  <rect x="60" y="424" width="380" height="14" fill="#f4f7fb" stroke="none"/>
  <text x="90" y="435" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="165" y="435" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">001</text>
  <text x="265" y="435" text-anchor="middle" font-size="10" fill="#888">✗</text>
  <text x="395" y="435" text-anchor="middle" font-size="10" fill="#888">"000"</text>

  <!-- i=4 -->
  <rect x="60" y="438" width="380" height="14" fill="#fff" stroke="none"/>
  <text x="90" y="449" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="165" y="449" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">019</text>
  <text x="265" y="449" text-anchor="middle" font-size="10" fill="#888">✗</text>
  <text x="395" y="449" text-anchor="middle" font-size="10" fill="#888">"000"</text>

  <!-- table outer border ex2 -->
  <rect x="60" y="320" width="380" height="132" fill="none" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- trap callout -->
  <rect x="460" y="398" width="90" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="505" y="419" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">答案</text>
  <text x="505" y="432" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">"000"</text>

  <!-- footer warning -->
  <rect x="40" y="472" width="480" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="489" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">⚠ 陷阱：'0' 是合法数字！"000" 是有效答案，不可当作"无匹配"返回空串</text>
  <text x="280" y="503" text-anchor="middle" font-size="10" fill="#888">用空串 "" 作哨兵而非 "000"，或用布尔标记是否命中</text>
</svg>
