<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="28" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    算法流程：前缀最大值 + 后缀最小值
  </text>

  <!-- Step 1: compute prefixMax -->
  <rect x="130" y="50" width="260" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="68" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">① 从左到右计算 prefixMax</text>
  <text x="260" y="83" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">prefixMax[i] = max(arr[0..i])</text>
  <line x1="260" y1="92" x2="260" y2="110" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: compute suffixMin -->
  <rect x="130" y="110" width="260" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="128" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">② 从右到左计算 suffixMin</text>
  <text x="260" y="143" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">suffixMin[i] = min(arr[i..n-1])</text>
  <line x1="260" y1="152" x2="260" y2="170" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: initialize count -->
  <rect x="170" y="170" width="180" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="193" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">③ count = 0，遍历 i = 0 … n−2</text>
  <line x1="260" y1="206" x2="260" y2="224" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="260,224 360,270 260,316 160,270" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="265" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">prefixMax[i]</text>
  <text x="260" y="280" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">≤ suffixMin[i+1]?</text>

  <!-- Yes branch -->
  <line x1="360" y1="270" x2="410" y2="270" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="385" y="262" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="410" y="252" width="95" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="457" y="268" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">count++</text>
  <text x="457" y="280" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">此处可切刀</text>

  <!-- No branch -->
  <line x1="160" y1="270" x2="110" y2="270" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="135" y="262" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="15" y="252" width="95" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="62" y="268" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">不切</text>
  <text x="62" y="280" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">并入当前块</text>

  <!-- Loop back arrow -->
  <path d="M 457 288 Q 457 340 260 340 Q 200 340 200 193" stroke="#446688" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 62 288 Q 62 340 200 340" stroke="#446688" stroke-width="1.2" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="260" y="335" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">i++，继续遍历</text>

  <!-- Step 4: return -->
  <line x1="260" y1="348" x2="260" y2="372" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="130" y="372" width="260" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="390" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">④ 返回 count + 1</text>
  <text x="260" y="405" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">(切 count 刀 → count+1 个块)</text>

  <!-- Note -->
  <rect x="80" y="425" width="360" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="260" y="443" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">
    两遍预处理 O(n) + 一遍扫描 O(n)，总时间 O(n)，空间 O(n)
  </text>
</svg>
