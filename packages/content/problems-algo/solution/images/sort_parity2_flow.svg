<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：索引奇偶性双指针分轨扫描</text>

  <!-- Start node -->
  <ellipse cx="270" cy="56" rx="120" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="60" text-anchor="middle" font-size="12" fill="#333">开始: i = 0（偶下标）, j = 1（奇下标）</text>

  <!-- arrow down -->
  <path d="M 270 76 L 270 96" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 1: i < n? -->
  <polygon points="270,100 376,134 270,168 164,134" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="130" text-anchor="middle" font-size="12" fill="#333">i &lt; n ?</text>
  <text x="270" y="146" text-anchor="middle" font-size="10" fill="#666">(偶下标未处理完)</text>

  <!-- No -> end -->
  <path d="M 376 134 L 420 134" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="398" y="126" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="472" cy="134" rx="48" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="472" y="138" text-anchor="middle" font-size="12" fill="#333">返回 nums</text>

  <!-- Yes -> down -->
  <path d="M 270 168 L 270 188" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="184" font-size="11" fill="#82b366">是</text>

  <!-- Decision 2: nums[i] even? -->
  <polygon points="270,192 386,226 270,260 154,226" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="222" text-anchor="middle" font-size="11" fill="#333">nums[i] 偶数 ?</text>
  <text x="270" y="238" text-anchor="middle" font-size="10" fill="#666">(偶下标已放偶数)</text>

  <!-- Yes -> i += 2 -->
  <path d="M 386 226 L 424 226" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="405" y="218" text-anchor="middle" font-size="11" fill="#82b366">是</text>
  <rect x="424" y="208" width="64" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="456" y="231" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i += 2</text>

  <!-- No -> down -->
  <path d="M 270 260 L 270 280" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="276" font-size="11" fill="#b85450">否</text>

  <!-- Decision 3: nums[j] odd? -->
  <polygon points="270,284 386,318 270,352 154,318" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="314" text-anchor="middle" font-size="11" fill="#333">nums[j] 奇数 ?</text>
  <text x="270" y="330" text-anchor="middle" font-size="10" fill="#666">(奇下标已放奇数，跳过)</text>

  <!-- Yes -> j += 2, loop back to Decision 3 -->
  <path d="M 386 318 L 424 318" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="405" y="310" text-anchor="middle" font-size="11" fill="#82b366">是</text>
  <rect x="424" y="300" width="64" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="456" y="323" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">j += 2</text>

  <!-- j += 2 loop-back: up then left back to Decision 3 right vertex -->
  <path d="M 488 318 L 504 318 L 504 226 L 504 318" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <path d="M 488 318 L 392 318" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="498" y="272" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 498 272)">继续找 j</text>

  <!-- No -> down to swap -->
  <path d="M 270 352 L 270 372" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="368" font-size="11" fill="#b85450">否</text>

  <!-- Swap box -->
  <rect x="150" y="374" width="240" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="392" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">swap(nums[i], nums[j])</text>
  <text x="270" y="406" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">i += 2</text>

  <!-- loop-back: from swap bottom -> left -> up -> back to Decision 1 left -->
  <path d="M 270 414 L 270 428 L 50 428 L 50 134 L 164 134" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="50" y="280" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 50 280)">继续循环</text>

  <!-- i += 2 loop-back: down then merge into main loop -->
  <path d="M 456 244 L 456 428" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>

  <!-- summary note -->
  <text x="270" y="464" text-anchor="middle" font-size="11" fill="#888">i、j 各走 n/2 步且单调递增 → O(n)；原地交换 → O(1) 空间</text>
</svg>
