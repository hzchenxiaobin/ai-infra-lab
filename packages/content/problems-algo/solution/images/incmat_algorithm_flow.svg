<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="560" height="300" fill="#fafafa"/>

  <text x="280" y="34" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：标记 → 还原</text>

  <!-- 4 phase boxes -->
  <g filter="url(#rough2)">
    <!-- 1 -->
    <rect x="18" y="74" width="116" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="76" y="100" text-anchor="middle" font-size="13" fill="#2b2b2b">① 建差分数组</text>
    <text x="76" y="122" text-anchor="middle" font-size="12" fill="#446688">d: (n+1)×(n+1)</text>
    <text x="76" y="140" text-anchor="middle" font-size="12" fill="#446688">全部初始化为 0</text>
    <text x="76" y="156" text-anchor="middle" font-size="11" fill="#888">O(n²)</text>

    <!-- 2 -->
    <rect x="158" y="74" width="116" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="216" y="100" text-anchor="middle" font-size="13" fill="#2b2b2b">② 逐 query 打标记</text>
    <text x="216" y="122" text-anchor="middle" font-size="12" fill="#4a7a3a">每个子矩阵 +1</text>
    <text x="216" y="140" text-anchor="middle" font-size="12" fill="#4a7a3a">→ 4 个单点修改</text>
    <text x="216" y="156" text-anchor="middle" font-size="11" fill="#888">O(1)/次, 共 q 次</text>

    <!-- 3 -->
    <rect x="298" y="74" width="116" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
    <text x="356" y="100" text-anchor="middle" font-size="13" fill="#2b2b2b">③ 二维前缀和</text>
    <text x="356" y="122" text-anchor="middle" font-size="12" fill="#d6a040">对 d 逐格累加</text>
    <text x="356" y="140" text-anchor="middle" font-size="12" fill="#d6a040">还原每格真实值</text>
    <text x="356" y="156" text-anchor="middle" font-size="11" fill="#888">O(n²)</text>

    <!-- 4 -->
    <rect x="438" y="74" width="116" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
    <text x="496" y="100" text-anchor="middle" font-size="13" fill="#2b2b2b">④ 取答案</text>
    <text x="496" y="122" text-anchor="middle" font-size="12" fill="#b85450">取左上 n×n 子矩阵</text>
    <text x="496" y="140" text-anchor="middle" font-size="12" fill="#b85450">即为最终 mat</text>
    <text x="496" y="156" text-anchor="middle" font-size="11" fill="#888">O(n²)</text>

    <!-- arrows -->
    <path d="M136,120 L156,120" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arr)"/>
    <path d="M276,120 L296,120" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arr)"/>
    <path d="M416,120 L436,120" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arr)"/>
  </g>

  <!-- total complexity -->
  <g filter="url(#rough2)">
    <rect x="120" y="200" width="320" height="64" fill="#fafafa" stroke="#888" stroke-width="1.4" stroke-dasharray="5 4" rx="8"/>
    <text x="280" y="228" text-anchor="middle" font-size="14" fill="#333">总复杂度 O(q + n²)</text>
    <text x="280" y="250" text-anchor="middle" font-size="12" fill="#666">标记阶段 O(q) + 还原阶段 O(n²)，与暴力 O(q·n²) 拉开差距</text>
  </g>
</svg>
