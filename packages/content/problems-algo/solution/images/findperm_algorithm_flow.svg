<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="520" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：栈法求字典序最小排列</text>
  <text x="260" y="44" text-anchor="middle" font-size="10.5" fill="#888">遇 I 弹栈（D 段天然逆序输出），遇 D 压栈</text>

  <!-- Start -->
  <ellipse cx="260" cy="68" rx="44" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="73" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">开始</text>

  <line x1="260" y1="86" x2="260" y2="100" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init -->
  <rect x="80" y="104" width="360" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="129" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">res = []，stack = []，val = 1</text>

  <line x1="260" y1="144" x2="260" y2="158" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop header -->
  <rect x="80" y="162" width="360" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="187" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">for i in 0 .. n：压入 val，val += 1</text>

  <line x1="260" y1="202" x2="260" y2="216" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond: s[i] == 'I' or i == n? -->
  <polygon points="260,220 370,270 260,320 150,270" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="264" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">s[i]=='I'</text>
  <text x="260" y="280" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">或 i==n ?</text>

  <!-- Yes branch: right -->
  <line x1="370" y1="270" x2="410" y2="270" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="388" y="264" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="410" y="248" width="100" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="460" y="268" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">弹出 stack</text>
  <text x="460" y="282" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">全部加入 res</text>

  <!-- arrow back up to loop -->
  <path d="M 460 248 L 460 182 L 440 182" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- No branch: left -->
  <line x1="150" y1="270" x2="110" y2="270" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="132" y="264" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否(D)</text>

  <rect x="20" y="248" width="90" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="65" y="274" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">跳过</text>
  <text x="65" y="288" text-anchor="middle" font-size="9" fill="#b85450">(留栈中)</text>

  <!-- arrow back up to loop -->
  <path d="M 65 248 L 65 182 L 80 182" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <line x1="260" y1="320" x2="260" y2="338" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="334" font-size="10" fill="#888">循环结束</text>

  <!-- Final pop -->
  <rect x="80" y="342" width="360" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="367" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">弹出 stack 剩余元素 → 加入 res</text>

  <line x1="260" y1="382" x2="260" y2="396" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- End -->
  <ellipse cx="260" cy="414" rx="44" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="419" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 res</text>

  <!-- note box -->
  <rect x="30" y="448" width="460" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="468" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">关键：栈天然把 D 连续段逆序输出</text>
  <text x="260" y="484" text-anchor="middle" font-size="10.5" fill="#446688">D 段被压入栈，遇到 I 时弹出 → 后进先出 = 翻转</text>
  <text x="260" y="498" text-anchor="middle" font-size="10.5" fill="#446688">I 位置的值先弹出（小），D 段值后弹出（大→小）→ 递增 + 递减</text>
</svg>
