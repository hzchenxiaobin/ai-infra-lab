<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">
    示例演算：5 行 → 过滤 → 排序 → 2 行
  </text>

  <text x="160" y="62" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">原始 cinema 表</text>

  <rect x="40" y="70" width="36" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="58" y="87" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">id</text>
  <rect x="80" y="70" width="100" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="130" y="87" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">movie</text>
  <rect x="184" y="70" width="100" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="234" y="87" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">description</text>
  <rect x="288" y="70" width="50" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="313" y="87" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">rating</text>

  <rect x="40" y="98" width="36" height="22" rx="3" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="58" y="114" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="80" y="98" width="100" height="22" rx="3" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="130" y="114" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">War</text>
  <rect x="184" y="98" width="100" height="22" rx="3" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="234" y="114" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">great 3D</text>
  <rect x="288" y="98" width="50" height="22" rx="3" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="313" y="114" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8.9</text>

  <rect x="40" y="122" width="36" height="22" rx="3" fill="#eee" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="58" y="138" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2</text>
  <rect x="80" y="122" width="100" height="22" rx="3" fill="#eee" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="130" y="138" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">Science</text>
  <rect x="184" y="122" width="100" height="22" rx="3" fill="#eee" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="234" y="138" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">fiction</text>
  <rect x="288" y="122" width="50" height="22" rx="3" fill="#eee" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="313" y="138" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">8.5</text>

  <rect x="40" y="146" width="36" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="58" y="162" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">3</text>
  <rect x="80" y="146" width="100" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="130" y="162" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">irish</text>
  <rect x="184" y="146" width="100" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="234" y="162" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">boring</text>
  <rect x="288" y="146" width="50" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="313" y="162" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">6.2</text>

  <rect x="40" y="170" width="36" height="22" rx="3" fill="#eee" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="58" y="186" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">4</text>
  <rect x="80" y="170" width="100" height="22" rx="3" fill="#eee" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="130" y="186" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">Ice song</text>
  <rect x="184" y="170" width="100" height="22" rx="3" fill="#eee" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="234" y="186" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">Fantacy</text>
  <rect x="288" y="170" width="50" height="22" rx="3" fill="#eee" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="313" y="186" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">8.6</text>

  <rect x="40" y="194" width="36" height="22" rx="3" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="58" y="210" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <rect x="80" y="194" width="100" height="22" rx="3" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="130" y="210" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">House card</text>
  <rect x="184" y="194" width="100" height="22" rx="3" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="234" y="210" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Interesting</text>
  <rect x="288" y="194" width="50" height="22" rx="3" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="313" y="210" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">9.1</text>

  <text x="60" y="240" text-anchor="start" font-size="12" fill="#b85450" filter="url(#rough2)">✗ id=3 → boring（描述过滤掉）</text>
  <text x="60" y="258" text-anchor="start" font-size="12" fill="#888" filter="url(#rough2)">✗ id=2,4 → 偶数 id（奇偶过滤掉）</text>
  <text x="60" y="276" text-anchor="start" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓ id=1,5 → 奇 id 且非 boring → 保留</text>

  <path d="M 345 175 Q 400 230 460 280" fill="none" stroke="#446688"
        stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="395" y="225" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">ORDER BY rating DESC</text>

  <text x="490" y="62" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">输出结果</text>

  <rect x="420" y="70" width="36" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="438" y="87" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">id</text>
  <rect x="460" y="70" width="80" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="500" y="87" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">movie</text>
  <rect x="544" y="70" width="40" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="564" y="87" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">rating</text>

  <rect x="420" y="98" width="36" height="22" rx="3" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="438" y="114" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <rect x="460" y="98" width="80" height="22" rx="3" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="500" y="114" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">House card</text>
  <rect x="544" y="98" width="40" height="22" rx="3" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="564" y="114" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">9.1</text>

  <rect x="420" y="122" width="36" height="22" rx="3" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="438" y="138" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="460" y="122" width="80" height="22" rx="3" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="500" y="138" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">War</text>
  <rect x="544" y="122" width="40" height="22" rx="3" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="564" y="138" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8.9</text>

  <text x="490" y="165" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">9.1 &gt; 8.9 → DESC 排序</text>
  <text x="490" y="182" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">大在前，小在后</text>

  <rect x="60" y="312" width="500" height="100" rx="10" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="338" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">判定逻辑回顾</text>
  <text x="80" y="362" text-anchor="start" font-size="12" fill="#a07020" filter="url(#rough2)">id=1: 奇 ✓ + great 3D≠boring ✓ → 保留, rating=8.9</text>
  <text x="80" y="382" text-anchor="start" font-size="12" fill="#a07020" filter="url(#rough2)">id=3: 奇 ✓ + boring ✗ → 淘汰（描述命中 boring）</text>
  <text x="80" y="402" text-anchor="start" font-size="12" fill="#a07020" filter="url(#rough2)">id=5: 奇 ✓ + Interesting≠boring ✓ → 保留, rating=9.1</text>
</svg>
