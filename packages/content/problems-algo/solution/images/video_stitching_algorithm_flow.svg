<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">贪心算法流程：排序 → 扫描扩展 → 判定可行性</text>

  <!-- Step 1: Sort -->
  <rect x="180" y="40" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">排序：起点↑ 同起点终点↓</text>
  <path d="M 280 72 L 280 86" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: Init -->
  <rect x="170" y="88" width="220" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">初始化 curEnd=0, ans=0, i=0</text>
  <path d="M 280 120 L 280 134" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: curEnd < time? -->
  <polygon points="280,136 380,172 280,208 180,172" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="168" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">curEnd &lt; time?</text>
  <text x="280" y="184" text-anchor="middle" font-size="10" fill="#666">（还需覆盖？）</text>

  <!-- No -> return ans -->
  <path d="M 380 172 L 460 172" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="166" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="460" y="156" width="90" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="505" y="176" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 ans</text>

  <!-- Yes -> scan -->
  <path d="M 280 208 L 280 222" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="218" font-size="10" fill="#b85450" font-weight="bold">是</text>

  <!-- Step 3: scan clips -->
  <rect x="120" y="224" width="320" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="242" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">扫描所有 clips[i].start ≤ curEnd</text>
  <text x="280" y="258" text-anchor="middle" font-size="10" fill="#666">nextEnd = max(nextEnd, clips[i].end), i++</text>
  <path d="M 280 268 L 280 282" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: nextEnd == curEnd? -->
  <polygon points="280,284 380,320 280,356 180,320" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="316" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">nextEnd == curEnd?</text>
  <text x="280" y="332" text-anchor="middle" font-size="10" fill="#666">（无法扩展？）</text>

  <!-- Yes -> return -1 -->
  <path d="M 380 320 L 460 320" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="314" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="460" y="304" width="90" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="505" y="324" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 -1</text>

  <!-- No -> update and loop -->
  <path d="M 280 356 L 280 370" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="366" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- Step 4: update -->
  <rect x="150" y="372" width="260" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="392" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">curEnd = nextEnd, ans++</text>

  <!-- Loop back arrow -->
  <path d="M 150 388 L 80 388 L 80 172 L 180 172" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="88" y="280" font-size="10" fill="#4a7a3a" font-weight="bold">回到</text>
  <text x="88" y="294" font-size="10" fill="#4a7a3a" font-weight="bold">循环</text>

  <!-- Note -->
  <rect x="370" y="372" width="180" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="460" y="390" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">关键不变式</text>
  <text x="460" y="406" text-anchor="middle" font-size="9" fill="#888">i 单调递增</text>
  <text x="460" y="420" text-anchor="middle" font-size="9" fill="#888">每片段最多访问一次</text>
</svg>
