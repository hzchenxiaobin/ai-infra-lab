<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：3 Metal × 3 Nonmetal = 9 对化学键</text>
  <text x="310" y="42" text-anchor="middle" font-size="10.5" fill="#888">每行 Metal 与每列 Nonmetal 配对，输出 (metal, nonmetal)</text>

  <!-- axis labels -->
  <text x="150" y="76" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Metal ↓</text>
  <text x="380" y="76" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Nonmetal →</text>

  <!-- Nonmetal column headers: Cl, O, N -->
  <rect x="200" y="86" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="240" y="108" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">Cl</text>

  <rect x="296" y="86" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="336" y="108" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">O</text>

  <rect x="392" y="86" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="432" y="108" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">N</text>

  <!-- ============ Row 1: Na ============ -->
  <rect x="104" y="128" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="144" y="150" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">Na</text>

  <rect x="200" y="128" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="150" text-anchor="middle" font-size="11" fill="#333">Na–Cl</text>

  <rect x="296" y="128" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="336" y="150" text-anchor="middle" font-size="11" fill="#333">Na–O</text>

  <rect x="392" y="128" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="432" y="150" text-anchor="middle" font-size="11" fill="#333">Na–N</text>

  <!-- ============ Row 2: Ca ============ -->
  <rect x="104" y="170" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="144" y="192" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">Ca</text>

  <rect x="200" y="170" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="192" text-anchor="middle" font-size="11" fill="#333">Ca–Cl</text>

  <rect x="296" y="170" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="336" y="192" text-anchor="middle" font-size="11" fill="#333">Ca–O</text>

  <rect x="392" y="170" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="432" y="192" text-anchor="middle" font-size="11" fill="#333">Ca–N</text>

  <!-- ============ Row 3: La ============ -->
  <rect x="104" y="212" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="144" y="234" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">La</text>

  <rect x="200" y="212" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="234" text-anchor="middle" font-size="11" fill="#333">La–Cl</text>

  <rect x="296" y="212" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="336" y="234" text-anchor="middle" font-size="11" fill="#333">La–O</text>

  <rect x="392" y="212" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="432" y="234" text-anchor="middle" font-size="11" fill="#333">La–N</text>

  <!-- bracket: 9 pairs -->
  <path d="M 200 254 L 200 262 L 472 262 L 472 254" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="336" y="280" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">共 9 对化学键</text>

  <!-- Output table snippet -->
  <text x="310" y="306" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">输出（任意顺序）</text>
  <rect x="170" y="312" width="280" height="22" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="230" y="328" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">metal</text>
  <text x="390" y="328" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">nonmetal</text>
  <text x="310" y="352" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">La–Cl, Ca–Cl, Na–Cl, La–O, Ca–O, Na–O,</text>
  <text x="310" y="368" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">La–N, Ca–N, Na–N</text>

  <text x="310" y="390" text-anchor="middle" font-size="9.5" fill="#bbb">electrons 列不参与配对——即使 Na(1)–O(2) 电子数不同也成键</text>
</svg>
