<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arro" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="470" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：后序 DFS + 三状态贪心决策</text>

  <!-- 1. dfs(node) 入口 -->
  <rect x="225" y="44" width="130" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="64" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">dfs(node)</text>
  <line x1="290" y1="76" x2="290" y2="90" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. node == null ? -->
  <polygon points="290,92 380,128 290,164 200,128" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="124" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold">node ==</text>
  <text x="290" y="138" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold">null ?</text>

  <!-- 是 → return 已覆盖 -->
  <line x1="380" y1="128" x2="440" y2="128" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="120" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>
  <rect x="440" y="112" width="120" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="500" y="133" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return 已覆盖(1)</text>

  <!-- 否 → 递归左右 -->
  <line x1="290" y1="164" x2="290" y2="178" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="304" y="174" font-size="10" fill="#446688">否</text>
  <rect x="190" y="180" width="200" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="200" text-anchor="middle" font-size="11" fill="#446688">left = dfs(l); right = dfs(r)</text>
  <line x1="290" y1="212" x2="290" y2="226" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. 任一子节点未覆盖 ? -->
  <polygon points="290,228 410,266 290,304 170,266" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="262" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">任一子节点</text>
  <text x="290" y="276" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">未覆盖(0) ?</text>

  <!-- 是 → 设摄像头 -->
  <line x1="410" y1="266" x2="440" y2="266" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="425" y="258" text-anchor="middle" font-size="10" fill="#d6a040">是</text>
  <rect x="440" y="250" width="120" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="500" y="266" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">count++</text>
  <text x="500" y="278" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">return 摄像头(2)</text>

  <!-- 否 → 下一判定 -->
  <line x1="290" y1="304" x2="290" y2="318" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="304" y="314" font-size="10" fill="#446688">否</text>

  <!-- 4. 任一子节点有摄像头 ? -->
  <polygon points="290,320 410,356 290,392 170,356" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="352" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold">任一子节点</text>
  <text x="290" y="366" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold">有摄像头(2) ?</text>

  <!-- 是 → return 已覆盖 -->
  <line x1="410" y1="356" x2="440" y2="356" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="425" y="348" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>
  <rect x="440" y="340" width="120" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="500" y="361" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return 已覆盖(1)</text>

  <!-- 否 → return 未覆盖 -->
  <line x1="290" y1="392" x2="290" y2="406" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="304" y="402" font-size="10" fill="#446688">否</text>
  <rect x="225" y="408" width="130" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="428" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return 未覆盖(0)</text>

  <!-- 主函数补充说明 -->
  <rect x="40" y="408" width="160" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="120" y="428" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">主函数收尾</text>
  <text x="120" y="444" text-anchor="middle" font-size="9" fill="#555">dfs(root)==0 则 count++</text>
</svg>
