<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：ParkingSystem(1, 1, 0) 依次 addCar(1/2/3/1)</text>

  <!-- Grid outer frame -->
  <rect x="25" y="40" width="510" height="246" fill="none" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- Column headers -->
  <rect x="25" y="40" width="510" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="52" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">步骤</text>
  <text x="162" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">操作</text>
  <text x="280" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">大型(1)</text>
  <text x="350" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">中型(2)</text>
  <text x="420" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">小型(3)</text>
  <text x="495" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">返回</text>

  <!-- Vertical separators -->
  <line x1="80" y1="40" x2="80" y2="286" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="245" y1="40" x2="245" y2="286" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="315" y1="40" x2="315" y2="286" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="385" y1="40" x2="385" y2="286" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="455" y1="40" x2="455" y2="286" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Row 0: init -->
  <text x="52" y="92" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">init</text>
  <text x="162" y="92" text-anchor="middle" font-size="11" fill="#333">ParkingSystem(1,1,0)</text>
  <text x="280" y="92" text-anchor="middle" font-size="13" fill="#333" font-family="monospace" font-weight="bold">1</text>
  <text x="350" y="92" text-anchor="middle" font-size="13" fill="#333" font-family="monospace" font-weight="bold">1</text>
  <text x="420" y="92" text-anchor="middle" font-size="13" fill="#333" font-family="monospace" font-weight="bold">0</text>
  <text x="495" y="92" text-anchor="middle" font-size="11" fill="#888">—</text>
  <line x1="25" y1="104" x2="535" y2="104" stroke="#446688" stroke-width="0.6" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- Row 1: addCar(1) -> true, big 1->0 -->
  <text x="52" y="128" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">①</text>
  <text x="162" y="128" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">addCar(1)</text>
  <rect x="260" y="112" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="280" y="128" text-anchor="middle" font-size="13" fill="#b85450" font-family="monospace" font-weight="bold">0</text>
  <text x="350" y="128" text-anchor="middle" font-size="13" fill="#333" font-family="monospace">1</text>
  <text x="420" y="128" text-anchor="middle" font-size="13" fill="#333" font-family="monospace">0</text>
  <text x="495" y="128" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">true</text>
  <line x1="25" y1="140" x2="535" y2="140" stroke="#446688" stroke-width="0.6" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- Row 2: addCar(2) -> true, medium 1->0 -->
  <text x="52" y="164" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">②</text>
  <text x="162" y="164" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">addCar(2)</text>
  <text x="280" y="164" text-anchor="middle" font-size="13" fill="#333" font-family="monospace">0</text>
  <rect x="330" y="148" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="350" y="164" text-anchor="middle" font-size="13" fill="#b85450" font-family="monospace" font-weight="bold">0</text>
  <text x="420" y="164" text-anchor="middle" font-size="13" fill="#333" font-family="monospace">0</text>
  <text x="495" y="164" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">true</text>
  <line x1="25" y1="176" x2="535" y2="176" stroke="#446688" stroke-width="0.6" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- Row 3: addCar(3) -> false, small already 0 -->
  <text x="52" y="200" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">③</text>
  <text x="162" y="200" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">addCar(3)</text>
  <text x="280" y="200" text-anchor="middle" font-size="13" fill="#333" font-family="monospace">0</text>
  <text x="350" y="200" text-anchor="middle" font-size="13" fill="#333" font-family="monospace">0</text>
  <rect x="400" y="184" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="420" y="200" text-anchor="middle" font-size="13" fill="#b85450" font-family="monospace" font-weight="bold">0</text>
  <text x="495" y="200" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">false</text>
  <line x1="25" y1="212" x2="535" y2="212" stroke="#446688" stroke-width="0.6" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- Row 4: addCar(1) -> false, big already 0 -->
  <text x="52" y="236" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">④</text>
  <text x="162" y="236" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">addCar(1)</text>
  <rect x="260" y="220" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="280" y="236" text-anchor="middle" font-size="13" fill="#b85450" font-family="monospace" font-weight="bold">0</text>
  <text x="350" y="236" text-anchor="middle" font-size="13" fill="#333" font-family="monospace">0</text>
  <text x="420" y="236" text-anchor="middle" font-size="13" fill="#333" font-family="monospace">0</text>
  <text x="495" y="236" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">false</text>

  <!-- Bottom note -->
  <text x="280" y="312" text-anchor="middle" font-size="10.5" fill="#555">红色单元格 = 本次操作触及的车位类型；计数为 0 时无法减一，直接返回 false</text>
  <text x="280" y="330" text-anchor="middle" font-size="10.5" fill="#888">三类车位互相独立，互不影响——这正是用数组分别计数的前提</text>
</svg>
