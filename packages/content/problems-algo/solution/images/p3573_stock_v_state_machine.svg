<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：三状态机——做空是做多的镜像</text>

  <!-- 对称性说明框 -->
  <rect x="30" y="48" width="232" height="66" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="146" y="70" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">做多：买入 −p[i] → 卖出 +p[j]</text>
  <text x="146" y="88" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">做空：卖出 +p[i] → 买回 −p[j]</text>
  <text x="146" y="106" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">符号恰好相反 ⇒ 状态机对称</text>

  <!-- 空闲 -->
  <rect x="64" y="186" width="140" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="134" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">空闲</text>
  <text x="134" y="228" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">已完成 j 笔</text>
  <text x="134" y="262" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">f[i][j][0] = 已落袋利润</text>

  <!-- 做多持仓 -->
  <rect x="326" y="86" width="164" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="408" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">做多持仓</text>
  <text x="408" y="126" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">等待卖出平仓</text>
  <text x="408" y="158" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">f[i][j][1] = 落袋 − 买入价</text>

  <!-- 做空持仓 -->
  <rect x="326" y="276" width="164" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="408" y="298" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">做空持仓</text>
  <text x="408" y="316" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">等待买回平仓</text>
  <text x="408" y="350" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">f[i][j][2] = 落袋 + 卖出价</text>

  <!-- 开多：空闲 → 做多 -->
  <path d="M206,196 C250,180 285,150 320,114" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="262" y="146" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">开多：买入 −p[i]</text>

  <!-- 平多：做多 → 空闲 -->
  <path d="M320,134 C285,165 250,192 206,216" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="284" y="206" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">平多：卖出 +p[i]（j+1 笔）</text>

  <!-- 开空：空闲 → 做空 -->
  <path d="M206,234 C250,252 285,272 320,296" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="256" y="250" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">开空：卖出 +p[i]</text>

  <!-- 平空：做空 → 空闲 -->
  <path d="M320,312 C285,290 250,268 206,248" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="252" y="304" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">平空：买回 −p[i]（j+1 笔）</text>

  <!-- 自环：不动 -->
  <path d="M96,184 C78,158 148,150 142,184" stroke="#999" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="119" y="154" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">不动</text>
  <path d="M378,84 C383,58 433,58 438,84" stroke="#999" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="408" y="54" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">不动</text>
  <path d="M378,274 C383,250 433,250 438,274" stroke="#999" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="408" y="246" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">不动</text>

  <!-- 底部要点 -->
  <rect x="30" y="358" width="460" height="38" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="374" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">平仓（红箭头）完成后 j → j+1；开仓（蓝箭头）不改变 j</text>
  <text x="260" y="390" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">所有转移读「前一天」的 f ⇒ 同一天最多一次操作，平仓当天不能再开新仓</text>
</svg>
