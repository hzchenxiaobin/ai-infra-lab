<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="410" fill="#fafafa"/>

  <text x="16" y="24" font-size="15" fill="#333" filter="url(#rough2)">示例演算：n = 5, x = 2, y = 4</text>
  <text x="504" y="24" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">L = 3，m1 = m2 = 1</text>

  <!-- 小图：链 1..5 + 弦 2–4 -->
  <g stroke="#446688" stroke-width="1.5" filter="url(#rough2)">
    <line x1="130" y1="79" x2="170" y2="79"/>
    <line x1="200" y1="79" x2="240" y2="79"/>
    <line x1="270" y1="79" x2="310" y2="79"/>
    <line x1="340" y1="79" x2="380" y2="79"/>
  </g>
  <rect x="100" y="64" width="30" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="170" y="64" width="30" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="240" y="64" width="30" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="310" y="64" width="30" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="380" y="64" width="30" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <g text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    <text x="115" y="84">1</text>
    <text x="185" y="84">2</text>
    <text x="255" y="84">3</text>
    <text x="325" y="84">4</text>
    <text x="395" y="84">5</text>
  </g>
  <path d="M 185 62 Q 255 14 323 60" fill="none" stroke="#4a7a3a" stroke-width="2.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <g text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">
    <text x="185" y="110">x</text>
    <text x="325" y="110">y</text>
  </g>

  <!-- 演算表 -->
  <g filter="url(#rough2)">
    <rect x="24" y="124" width="112" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
    <rect x="136" y="124" width="168" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
    <rect x="304" y="124" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
    <rect x="364" y="124" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
    <rect x="424" y="124" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">
    <text x="80" y="140">类别</text>
    <text x="220" y="140">差分打标</text>
    <text x="334" y="140">d = 1</text>
    <text x="394" y="140">d = 2</text>
    <text x="454" y="140">d = 3</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="24" y="148" width="112" height="24" fill="#ffffff" stroke="#999" stroke-width="0.8"/>
    <rect x="136" y="148" width="168" height="24" fill="#ffffff" stroke="#999" stroke-width="0.8"/>
    <rect x="304" y="148" width="60" height="24" fill="#ffffff" stroke="#999" stroke-width="0.8"/>
    <rect x="364" y="148" width="60" height="24" fill="#ffffff" stroke="#999" stroke-width="0.8"/>
    <rect x="424" y="148" width="60" height="24" fill="#ffffff" stroke="#999" stroke-width="0.8"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="24" y="172" width="112" height="24" fill="#ffffff" stroke="#999" stroke-width="0.8"/>
    <rect x="136" y="172" width="168" height="24" fill="#ffffff" stroke="#999" stroke-width="0.8"/>
    <rect x="304" y="172" width="60" height="24" fill="#ffffff" stroke="#999" stroke-width="0.8"/>
    <rect x="364" y="172" width="60" height="24" fill="#ffffff" stroke="#999" stroke-width="0.8"/>
    <rect x="424" y="172" width="60" height="24" fill="#ffffff" stroke="#999" stroke-width="0.8"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="24" y="196" width="112" height="24" fill="#ffffff" stroke="#999" stroke-width="0.8"/>
    <rect x="136" y="196" width="168" height="24" fill="#ffffff" stroke="#999" stroke-width="0.8"/>
    <rect x="304" y="196" width="60" height="24" fill="#ffffff" stroke="#999" stroke-width="0.8"/>
    <rect x="364" y="196" width="60" height="24" fill="#ffffff" stroke="#999" stroke-width="0.8"/>
    <rect x="424" y="196" width="60" height="24" fill="#ffffff" stroke="#999" stroke-width="0.8"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="24" y="220" width="112" height="24" fill="#ffffff" stroke="#999" stroke-width="0.8"/>
    <rect x="136" y="220" width="168" height="24" fill="#ffffff" stroke="#999" stroke-width="0.8"/>
    <rect x="304" y="220" width="60" height="24" fill="#ffffff" stroke="#999" stroke-width="0.8"/>
    <rect x="364" y="220" width="60" height="24" fill="#ffffff" stroke="#999" stroke-width="0.8"/>
    <rect x="424" y="220" width="60" height="24" fill="#ffffff" stroke="#999" stroke-width="0.8"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="24" y="244" width="112" height="24" fill="#ffffff" stroke="#999" stroke-width="0.8"/>
    <rect x="136" y="244" width="168" height="24" fill="#ffffff" stroke="#999" stroke-width="0.8"/>
    <rect x="304" y="244" width="60" height="24" fill="#ffffff" stroke="#999" stroke-width="0.8"/>
    <rect x="364" y="244" width="60" height="24" fill="#ffffff" stroke="#999" stroke-width="0.8"/>
    <rect x="424" y="244" width="60" height="24" fill="#ffffff" stroke="#999" stroke-width="0.8"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="24" y="268" width="112" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/>
    <rect x="136" y="268" width="168" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/>
    <rect x="304" y="268" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/>
    <rect x="364" y="268" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/>
    <rect x="424" y="268" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="24" y="292" width="112" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1"/>
    <rect x="136" y="292" width="168" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1"/>
    <rect x="304" y="292" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1"/>
    <rect x="364" y="292" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1"/>
    <rect x="424" y="292" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1"/>
  </g>

  <g font-size="11" fill="#333" filter="url(#rough2)">
    <text x="30" y="164">① 尾巴内部</text>
    <text x="142" y="164" font-size="10.5">m1 = m2 = 1：无点对</text>
    <text x="30" y="188">② 环内</text>
    <text x="142" y="188" font-size="10.5">t = 1 &lt; L/2：+3 @ d=1</text>
    <text x="30" y="212">③ 左尾↔环</text>
    <text x="142" y="212" font-size="10.5">t=0：+1 @ d=1；t=1：+2 @ d=2</text>
    <text x="30" y="236">③ 右尾↔环</text>
    <text x="142" y="236" font-size="10.5">t=0：+1 @ d=1；t=1：+2 @ d=2</text>
    <text x="30" y="260">④ 左尾↔右尾</text>
    <text x="142" y="260" font-size="10.5">a = b = 1：+1 @ d=3</text>
    <text x="30" y="284" font-weight="bold">无序合计</text>
    <text x="142" y="284" font-size="10.5">前缀和还原</text>
    <text x="30" y="308" font-weight="bold">有序 = 无序×2</text>
    <text x="142" y="308" font-size="10.5">res[1..3]，后面补 0</text>
  </g>
  <g text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    <text x="334" y="164">0</text>
    <text x="394" y="164">0</text>
    <text x="454" y="164">0</text>
    <text x="334" y="188">3</text>
    <text x="394" y="188">0</text>
    <text x="454" y="188">0</text>
    <text x="334" y="212">1</text>
    <text x="394" y="212">2</text>
    <text x="454" y="212">0</text>
    <text x="334" y="236">1</text>
    <text x="394" y="236">2</text>
    <text x="454" y="236">0</text>
    <text x="334" y="260">0</text>
    <text x="394" y="260">0</text>
    <text x="454" y="260">1</text>
    <text x="334" y="284" font-weight="bold">5</text>
    <text x="394" y="284" font-weight="bold">4</text>
    <text x="454" y="284" font-weight="bold">1</text>
    <text x="334" y="308" font-weight="bold">10</text>
    <text x="394" y="308" font-weight="bold">8</text>
    <text x="454" y="308" font-weight="bold">2</text>
  </g>

  <!-- 底部结论 -->
  <rect x="60" y="336" width="400" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="260" y="357" text-anchor="middle" font-size="12.5" fill="#2d5a1f" filter="url(#rough2)">返回 [10, 8, 2, 0, 0] ✓（与逐对公式完全一致）</text>
  <text x="260" y="377" text-anchor="middle" font-size="12" fill="#2d5a1f" filter="url(#rough2)">自检：Σ = 20 = 5×4 = n(n−1) ✓</text>
</svg>
