<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="660" height="520" fill="#fafafa"/>

  <text x="330" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：words = ["acca","bbbb","caca"]，target = "aba"（输出 6）</text>

  <!-- ===== cnt 频次表 ===== -->
  <text x="40" y="54" font-size="12" fill="#4a7a3a" font-weight="bold">列频次表（target 字符高亮）</text>

  <g filter="url(#rough2)" font-size="11" fill="#555" font-weight="bold">
    <rect x="40" y="62" width="440" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="80" y="79" text-anchor="middle">j</text>
    <text x="160" y="79" text-anchor="middle">0</text>
    <text x="240" y="79" text-anchor="middle">1</text>
    <text x="320" y="79" text-anchor="middle">2</text>
    <text x="400" y="79" text-anchor="middle">3</text>
  </g>

  <g filter="url(#rough2)" font-size="11" fill="#333">
    <rect x="40" y="86" width="440" height="22" fill="#fafafa" stroke="#ddd" stroke-width="0.8" rx="2"/>
    <text x="80" y="102" text-anchor="middle" fill="#b85450" font-weight="bold">cnt[j]['a']</text>
    <text x="160" y="102" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <text x="240" y="102" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <text x="320" y="102" text-anchor="middle" fill="#888">0</text>
    <text x="400" y="102" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>

    <rect x="40" y="108" width="440" height="22" fill="#fff" stroke="#ddd" stroke-width="0.8" rx="2"/>
    <text x="80" y="124" text-anchor="middle" fill="#446688" font-weight="bold">cnt[j]['b']</text>
    <text x="160" y="124" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <text x="240" y="124" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <text x="320" y="124" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <text x="400" y="124" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
  </g>

  <!-- ===== DP 表 ===== -->
  <text x="40" y="166" font-size="12" fill="#446688" font-weight="bold">DP 表 dp[i][j]（行 = target 前 i 字符，列 = 前 j 列）</text>

  <!-- 表头 -->
  <g filter="url(#rough2)" font-size="11" fill="#555" font-weight="bold">
    <rect x="40" y="174" width="520" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="80" y="192" text-anchor="middle">i \ j</text>
    <text x="160" y="192" text-anchor="middle">0</text>
    <text x="240" y="192" text-anchor="middle">1</text>
    <text x="320" y="192" text-anchor="middle">2</text>
    <text x="400" y="192" text-anchor="middle">3</text>
    <text x="480" y="192" text-anchor="middle">4</text>
  </g>

  <!-- i=0 (base) -->
  <g filter="url(#rough2)" font-size="12" fill="#333">
    <rect x="40" y="200" width="520" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2"/>
    <text x="80" y="219" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0 (空)</text>
    <text x="160" y="219" text-anchor="middle">1</text>
    <text x="240" y="219" text-anchor="middle">1</text>
    <text x="320" y="219" text-anchor="middle">1</text>
    <text x="400" y="219" text-anchor="middle">1</text>
    <text x="480" y="219" text-anchor="middle">1</text>
  </g>

  <!-- i=1 (target[0]='a') -->
  <g filter="url(#rough2)" font-size="12" fill="#333">
    <rect x="40" y="228" width="520" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2"/>
    <text x="80" y="247" text-anchor="middle" fill="#d6a040" font-weight="bold">1 (a)</text>
    <text x="160" y="247" text-anchor="middle" fill="#888">0</text>
    <text x="240" y="247" text-anchor="middle">1</text>
    <text x="320" y="247" text-anchor="middle">2</text>
    <text x="400" y="247" text-anchor="middle">2</text>
    <text x="480" y="247" text-anchor="middle">4</text>
  </g>

  <!-- i=2 (target[1]='b') -->
  <g filter="url(#rough2)" font-size="12" fill="#333">
    <rect x="40" y="256" width="520" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2"/>
    <text x="80" y="275" text-anchor="middle" fill="#d6a040" font-weight="bold">2 (b)</text>
    <text x="160" y="275" text-anchor="middle" fill="#888">0</text>
    <text x="240" y="275" text-anchor="middle" fill="#888">0</text>
    <text x="320" y="275" text-anchor="middle">1</text>
    <text x="400" y="275" text-anchor="middle">3</text>
    <text x="480" y="275" text-anchor="middle" fill="#b85450" font-weight="bold">5</text>
  </g>

  <!-- i=3 (target[2]='a') -->
  <g filter="url(#rough2)" font-size="12" fill="#333">
    <rect x="40" y="284" width="520" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2"/>
    <text x="80" y="303" text-anchor="middle" fill="#b85450" font-weight="bold">3 (a)</text>
    <text x="160" y="303" text-anchor="middle" fill="#888">0</text>
    <text x="240" y="303" text-anchor="middle" fill="#888">0</text>
    <text x="320" y="303" text-anchor="middle" fill="#888">0</text>
    <text x="400" y="303" text-anchor="middle" fill="#888">0</text>
    <text x="480" y="303" text-anchor="middle" fill="#b85450" font-weight="bold" font-size="14">6</text>
  </g>

  <!-- 列标注：cnt[j-1][target[i-1]] -->
  <text x="580" y="247" font-size="9" fill="#b85450">cnt['a']:</text>
  <text x="580" y="259" font-size="9" fill="#b85450">1,1,0,2</text>
  <text x="580" y="275" font-size="9" fill="#446688">cnt['b']:</text>
  <text x="580" y="287" font-size="9" fill="#446688">1,1,1,1</text>
  <text x="580" y="303" font-size="9" fill="#b85450">cnt['a']:</text>
  <text x="580" y="315" font-size="9" fill="#b85450">1,1,0,2</text>

  <!-- ===== 关键转移标注 ===== -->
  <rect x="40" y="330" width="580" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="352" font-size="12" fill="#446688" font-weight="bold">关键转移拆解（以 dp[3][4] 为例）：</text>
  <text x="56" y="372" font-size="11" fill="#333">dp[3][4] = dp[3][3] ＋ dp[2][3] × cnt[3][target[2]] = 0 ＋ 3 × cnt[3]['a'] = 0 ＋ 3 × 2 = 6</text>
  <text x="56" y="390" font-size="10" fill="#888">① 跳过 col3（dp[3][3]=0，col3 之前无法凑出 3 个 'a'）  ② 用 col3 匹配 target[2]='a'，乘以 col3 中 'a' 的个数 2</text>

  <!-- 箭头标注 dp[2][3] → dp[3][4] -->
  <path d="M 400 268 Q 440 300 470 298" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="3 2" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="430" y="294" font-size="9" fill="#b85450" font-weight="bold">×cnt[3]['a']=2</text>

  <!-- ===== 答案 ===== -->
  <rect x="180" y="420" width="300" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="330" y="442" text-anchor="middle" font-size="12" fill="#555">答案 = dp[n][m] = dp[3][4]</text>
  <text x="330" y="462" text-anchor="middle" font-size="18" fill="#b85450" font-weight="bold">= 6  ✓</text>

  <!-- 六种方案提示 -->
  <text x="330" y="495" text-anchor="middle" font-size="10" fill="#888">6 种方案 = (col0,col1,col3) 各 1×1×2 + (col0,col2,col3) 1×1×2 = 2+2 + (col1,col2,col3) … 共 6</text>
</svg>
