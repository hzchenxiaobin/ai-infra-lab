<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一趟扫描 —— 两次独立翻转 ＋ 带符号累加</text>

  <!-- ===================== 起点 ===================== -->
  <g filter="url(#rough2)">
    <rect x="145" y="38" width="170" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="230" y="58" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">初始化 diff=0，sign=+1</text>
    <path d="M 230 70 V 82" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)"/>
  </g>

  <!-- ===================== 循环头 ===================== -->
  <g filter="url(#rough2)">
    <rect x="105" y="86" width="250" height="28" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="230" y="104" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold">对每场比赛 i = 0 … n−1 循环</text>
    <path d="M 230 114 V 126" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)"/>
  </g>

  <!-- ===================== 判定① ===================== -->
  <g filter="url(#rough2)">
    <polygon points="230,130 322,168 230,206 138,168" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <text x="230" y="172" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold">nums[i] 是奇数？</text>
    <path d="M 322 168 H 348" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="336" y="160" text-anchor="middle" font-size="10" fill="#b85450">是</text>
    <rect x="352" y="152" width="162" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="433" y="172" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold">sign = −sign（规则①）</text>
    <path d="M 433 184 V 224 H 242" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)"/>
    <path d="M 230 206 V 234" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)"/>
    <text x="222" y="226" text-anchor="end" font-size="10" fill="#4a7a3a">否</text>
  </g>

  <!-- ===================== 判定② ===================== -->
  <g filter="url(#rough2)">
    <polygon points="230,238 322,276 230,314 138,276" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <text x="230" y="280" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold">i mod 6 == 5？</text>
    <path d="M 322 276 H 348" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="336" y="268" text-anchor="middle" font-size="10" fill="#b85450">是</text>
    <rect x="352" y="260" width="162" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="433" y="280" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold">sign = −sign（规则②）</text>
    <path d="M 433 292 V 330 H 242" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)"/>
    <path d="M 230 314 V 334" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)"/>
    <text x="222" y="330" text-anchor="end" font-size="10" fill="#4a7a3a">否</text>
  </g>

  <!-- ===================== 计分与出口 ===================== -->
  <g filter="url(#rough2)">
    <rect x="130" y="338" width="200" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="230" y="359" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold">diff += sign × nums[i]</text>
    <path d="M 330 355 H 378" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="352" y="348" text-anchor="middle" font-size="9.5" fill="#a07020">比完</text>
    <rect x="382" y="338" width="130" height="34" rx="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="447" y="359" text-anchor="middle" font-size="11.5" fill="#a07020" font-weight="bold">返回 diff</text>
    <path d="M 230 372 V 396 H 64 V 100 H 98" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)"/>
    <text x="146" y="391" text-anchor="middle" font-size="10" fill="#33506b">下一场 i+1</text>
  </g>

  <!-- ===================== 底部要点 ===================== -->
  <g filter="url(#rough2)">
    <rect x="28" y="414" width="504" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="280" y="430" text-anchor="middle" font-size="10.5" fill="#a07020" font-weight="bold">两个独立 if 顺序叠加 ⇒ 双重命中自动抵消；合并成「或」只翻一次就 WA</text>
    <text x="280" y="445" text-anchor="middle" font-size="9.5" fill="#a07020">计分永远放在两次翻转之后（规则按序：先换人、再得分）</text>
  </g>
</svg>
