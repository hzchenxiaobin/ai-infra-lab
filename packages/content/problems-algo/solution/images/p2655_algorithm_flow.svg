<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 9 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="4.5" refY="8" orient="auto">
      <path d="M 4.5 0 L 9 9 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="360" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：排序 → 合并 → 扫描间隙</text>

  <!-- Step 1: Sort -->
  <rect x="40" y="50" width="160" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="120" y="72" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">① 按 start 排序</text>
  <text x="120" y="90" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">ranges.sort(key=lambda x:x[0])</text>
  <text x="120" y="106" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">O(m log m)</text>

  <!-- arrow 1→2 -->
  <path d="M 200 85 L 230 85" stroke="#446688" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Step 2: Merge -->
  <rect x="230" y="50" width="160" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="72" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">② 合并重叠/相邻区间</text>
  <text x="310" y="90" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">next.start ≤ cur.end + 1 ?</text>
  <text x="310" y="106" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">O(m)</text>

  <!-- arrow 2→3 -->
  <path d="M 390 85 L 420 85" stroke="#446688" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Step 3: Scan gaps -->
  <rect x="420" y="50" width="160" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="500" y="72" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">③ 扫描间隙</text>
  <text x="500" y="90" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">gap = [prev.end+1, next.start-1]</text>
  <text x="500" y="106" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">O(m)</text>

  <!-- Data rows showing transformation -->
  <text x="30" y="160" font-size="11" fill="#999" filter="url(#rough2)">输入</text>
  <rect x="80" y="140" width="48" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="104" y="160" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">[3,5]</text>
  <rect x="132" y="140" width="48" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="156" y="160" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">[7,8]</text>
  <text x="200" y="160" font-size="10" fill="#999" filter="url(#rough2)">（可能乱序）</text>

  <!-- down arrow -->
  <path d="M 120 178 L 120 192" stroke="#446688" stroke-width="1.6" stroke-dasharray="3 2" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <text x="30" y="212" font-size="11" fill="#446688" filter="url(#rough2)">排序后</text>
  <rect x="80" y="194" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="104" y="214" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">[3,5]</text>
  <rect x="132" y="194" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="156" y="214" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">[7,8]</text>

  <!-- down arrow -->
  <path d="M 120 228 L 120 242" stroke="#446688" stroke-width="1.6" stroke-dasharray="3 2" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <text x="30" y="262" font-size="11" fill="#d6a040" filter="url(#rough2)">合并后</text>
  <rect x="80" y="244" width="48" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="104" y="264" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">[3,5]</text>
  <rect x="132" y="244" width="48" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="156" y="264" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">[7,8]</text>
  <text x="200" y="264" font-size="10" fill="#999" filter="url(#rough2)">（无重叠，不合并）</text>

  <!-- down arrow -->
  <path d="M 120 278 L 120 292" stroke="#446688" stroke-width="1.6" stroke-dasharray="3 2" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <text x="30" y="312" font-size="11" fill="#4a7a3a" filter="url(#rough2)">间隙</text>
  <rect x="80" y="294" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="104" y="314" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">[0,2]</text>
  <rect x="132" y="294" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="156" y="314" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">[6,6]</text>
  <rect x="184" y="294" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="208" y="314" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">[9,9]</text>

  <!-- right side: gap formula -->
  <rect x="300" y="180" width="280" height="150" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="440" y="204" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">间隙判定公式</text>
  <text x="440" y="228" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">首段间隙：[0, merged[0].start − 1]</text>
  <text x="440" y="248" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">中间间隙：[prev.end+1, next.start−1]</text>
  <text x="440" y="268" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">末段间隙：[merged[−1].end+1, n−1]</text>
  <text x="440" y="290" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">仅当 start ≤ end 才记录</text>
  <text x="440" y="312" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">全程不遍历数组，只处理区间端点</text>

  <text x="310" y="346" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">三步流水线，复杂度 O(m log m)，与数组长度 n 无关</text>
</svg>
