<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：邻接矩阵 + 度数公式 + 枚举三元组取最小</text>

  <!-- Start -->
  <ellipse cx="280" cy="60" rx="50" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="65" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M 280 78 L 280 94" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Build graph -->
  <rect x="140" y="96" width="280" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="116" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">建邻接矩阵 g[][]，计算 degree[]</text>
  <text x="280" y="134" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每条边 (u,v)：g[u][v]=g[v][u]=true，deg[u]++, deg[v]++</text>
  <path d="M 280 146 L 280 160" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init ans -->
  <rect x="210" y="162" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="184" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans = +∞</text>
  <path d="M 280 196 L 280 210" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Triple loop decision -->
  <polygon points="280,212 400,256 280,300 160,256" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="248" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">枚举 i &lt; j &lt; k</text>
  <text x="280" y="266" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">g[i][j] &amp;&amp; g[i][k]</text>
  <text x="280" y="282" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">&amp;&amp; g[j][k] ?</text>

  <!-- No branch -->
  <path d="M 400 256 L 450 256" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="412" y="250" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="452" y="240" width="64" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="484" y="262" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">跳过</text>

  <!-- Yes branch -->
  <path d="M 280 300 L 280 316" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="312" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- Compute degree -->
  <rect x="130" y="318" width="300" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="343" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">d = deg[i] + deg[j] + deg[k] − 6</text>
  <path d="M 280 358 L 280 372" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Update min -->
  <rect x="180" y="374" width="200" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="396" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans = min(ans, d)</text>

  <!-- Loop back -->
  <path d="M 380 391 L 470 391 L 470 256 L 400 256" stroke="#666" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="478" y="324" font-size="11" fill="#888" filter="url(#rough2)">继续</text>
  <text x="478" y="338" font-size="11" fill="#888" filter="url(#rough2)">枚举</text>

  <!-- Return -->
  <path d="M 280 408 L 280 422" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="140" y="424" width="280" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="446" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 ans == +∞ ? −1 : ans</text>
</svg>
