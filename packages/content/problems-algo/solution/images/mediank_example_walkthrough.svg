<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums=[3,2,1,4,5], k=4, p=3</text>

  <text x="324" y="40" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">p=3</text>
  <path d="M324 42 L324 50" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="52" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="192" y="73" text-anchor="middle" font-size="13" fill="#333">3</text>
  <rect x="214" y="52" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="236" y="73" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="258" y="52" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="73" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="302" y="52" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="324" y="73" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">4</text>
  <rect x="346" y="52" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="368" y="73" text-anchor="middle" font-size="13" fill="#333">5</text>

  <rect x="170" y="88" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="192" y="107" text-anchor="middle" font-size="12" fill="#4a7a3a">−1</text>
  <rect x="214" y="88" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="236" y="107" text-anchor="middle" font-size="12" fill="#4a7a3a">−1</text>
  <rect x="258" y="88" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="280" y="107" text-anchor="middle" font-size="12" fill="#4a7a3a">−1</text>
  <rect x="302" y="88" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="324" y="107" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>
  <rect x="346" y="88" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="368" y="107" text-anchor="middle" font-size="12" fill="#4a7a3a">+1</text>

  <text x="100" y="106" text-anchor="end" font-size="10.5" fill="#888">变换数组</text>

  <text x="40" y="138" font-size="12" fill="#446688" font-weight="bold">左半累加 → leftCount 表</text>
  <text x="300" y="138" font-size="12" fill="#d6a040" font-weight="bold">右半扫描 → 查表累加</text>

  <rect x="40" y="146" width="40" height="22" fill="#446688" filter="url(#rough2)"/>
  <text x="60" y="162" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">l</text>
  <rect x="80" y="146" width="56" height="22" fill="#446688" filter="url(#rough2)"/>
  <text x="108" y="162" text-anchor="middle" font-size="11" fill="#fff">val</text>
  <rect x="136" y="146" width="48" height="22" fill="#446688" filter="url(#rough2)"/>
  <text x="160" y="162" text-anchor="middle" font-size="11" fill="#fff">run</text>
  <rect x="184" y="146" width="96" height="22" fill="#446688" filter="url(#rough2)"/>
  <text x="232" y="162" text-anchor="middle" font-size="11" fill="#fff">leftCount[run]</text>

  <rect x="40" y="168" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="184" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="80" y="168" width="56" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="108" y="184" text-anchor="middle" font-size="11" fill="#888">空</text>
  <rect x="136" y="168" width="48" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="160" y="184" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <rect x="184" y="168" width="96" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="232" y="184" text-anchor="middle" font-size="11" fill="#333">+1</text>

  <rect x="40" y="190" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="206" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="80" y="190" width="56" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="108" y="206" text-anchor="middle" font-size="11" fill="#4a7a3a">−1</text>
  <rect x="136" y="190" width="48" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="160" y="206" text-anchor="middle" font-size="11" fill="#333">−1</text>
  <rect x="184" y="190" width="96" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="232" y="206" text-anchor="middle" font-size="11" fill="#333">+1</text>

  <rect x="40" y="212" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="228" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="80" y="212" width="56" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="108" y="228" text-anchor="middle" font-size="11" fill="#4a7a3a">−1</text>
  <rect x="136" y="212" width="48" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="160" y="228" text-anchor="middle" font-size="11" fill="#333">−2</text>
  <rect x="184" y="212" width="96" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="232" y="228" text-anchor="middle" font-size="11" fill="#333">+1</text>

  <rect x="40" y="234" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="250" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="80" y="234" width="56" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="108" y="250" text-anchor="middle" font-size="11" fill="#4a7a3a">−1</text>
  <rect x="136" y="234" width="48" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="160" y="250" text-anchor="middle" font-size="11" fill="#333">−3</text>
  <rect x="184" y="234" width="96" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="232" y="250" text-anchor="middle" font-size="11" fill="#333">+1</text>

  <rect x="300" y="146" width="40" height="22" fill="#d6a040" filter="url(#rough2)"/>
  <text x="320" y="162" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">r</text>
  <rect x="340" y="146" width="44" height="22" fill="#d6a040" filter="url(#rough2)"/>
  <text x="362" y="162" text-anchor="middle" font-size="11" fill="#fff">val</text>
  <rect x="384" y="146" width="40" height="22" fill="#d6a040" filter="url(#rough2)"/>
  <text x="404" y="162" text-anchor="middle" font-size="11" fill="#fff">run</text>
  <rect x="424" y="146" width="116" height="22" fill="#d6a040" filter="url(#rough2)"/>
  <text x="482" y="162" text-anchor="middle" font-size="10" fill="#fff">查询 / 贡献</text>

  <rect x="300" y="168" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="320" y="184" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="340" y="168" width="44" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="362" y="184" text-anchor="middle" font-size="11" fill="#888">空</text>
  <rect x="384" y="168" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="404" y="184" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <rect x="424" y="168" width="116" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="482" y="184" text-anchor="middle" font-size="11" fill="#333">{0,1}→ +1</text>

  <rect x="300" y="190" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="320" y="206" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="340" y="190" width="44" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="362" y="206" text-anchor="middle" font-size="11" fill="#4a7a3a">+1</text>
  <rect x="384" y="190" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="404" y="206" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <rect x="424" y="190" width="116" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="482" y="206" text-anchor="middle" font-size="11" fill="#333">{−1,0}→ +2</text>

  <rect x="300" y="212" width="160" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="380" y="228" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">合计 ans = 3</text>

  <text x="40" y="284" font-size="12" fill="#555" font-weight="bold">命中的 3 个子数组：</text>

  <rect x="40" y="294" width="490" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="60" y="314" font-size="12" fill="#333">r=3, leftPart=0 ⟹ [4] —— 排序 [4]，中位 = 4 ✓</text>

  <rect x="40" y="330" width="490" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="60" y="350" font-size="12" fill="#333">r=4, leftPart=−1 ⟹ [1,4,5] —— 排序 [1,4,5]，中位 = 4 ✓</text>

  <rect x="40" y="366" width="490" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="60" y="386" font-size="12" fill="#333">r=4, leftPart=0 ⟹ [4,5] —— 排序 [4,5]，偶长取靠左中位 = 4 ✓</text>
</svg>
