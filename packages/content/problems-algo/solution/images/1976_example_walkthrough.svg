<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例 1 演算：dist[] 与 ways[] 逐步演化</text>
  <text x="290" y="42" text-anchor="middle" font-size="10" fill="#888">每格上行为 dist（蓝），下行为 ways（绿）；绿底=更短更新，橙底=等长累加</text>

  <!-- ===== Column headers ===== -->
  <text x="46" y="72" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">步骤</text>
  <text x="100" y="72" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">弹出(d,u)</text>
  <!-- Node column headers 0..6 -->
  <text x="170" y="72" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">0</text>
  <text x="220" y="72" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">1</text>
  <text x="270" y="72" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">2</text>
  <text x="320" y="72" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">3</text>
  <text x="370" y="72" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">4</text>
  <text x="420" y="72" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">5</text>
  <text x="475" y="72" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">6</text>
  <text x="545" y="72" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">事件</text>

  <!-- header underline -->
  <path d="M 20 80 L 565 80" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>

