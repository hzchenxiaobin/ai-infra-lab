<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2e8b57"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="760" height="480" fill="#fdfcf7"/>

  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">连接词核心：排序后逐词做 Word Break</text>
  <path d="M 220 42 Q 380 50 540 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="380" y="58" text-anchor="middle" font-size="11" fill="#888">连接词 = 由 ≥2 个更短词拼成 → 按长度升序处理，字典只装更短词</text>

  <!-- ===== Step 1: Sort by length ===== -->
  <text x="40" y="86" font-size="13" font-weight="bold" fill="#2b2b2b">① 按长度升序排序</text>
  <g filter="url(#sk)">
    <rect x="40" y="96" width="60" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="104" y="96" width="60" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="168" y="96" width="68" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="240" y="96" width="76" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <text x="70" y="115" fill="#2b6e9e">"a"</text>
    <text x="134" y="115" fill="#2b6e9e">"b"</text>
    <text x="202" y="115" fill="#9a6a20">"ab"</text>
    <text x="278" y="115" fill="#2b6e9e">"abc"</text>
  </g>
  <g font-size="9" fill="#888" text-anchor="middle">
    <text x="70" y="88">len=1</text>
    <text x="134" y="88">len=1</text>
    <text x="202" y="88">len=2</text>
    <text x="278" y="88">len=3</text>
  </g>

  <!-- ===== Step 2: For each word, dict = preWords ===== -->
  <line x1="40" y1="140" x2="720" y2="140" stroke="#eee" stroke-width="1" filter="url(#sk)"/>
  <text x="40" y="164" font-size="13" font-weight="bold" fill="#2b2b2b">② 对每个词 w：用「已处理更短词集合 preWords」做 Word Break</text>

  <!-- Row: w="a" -->
  <g filter="url(#sk)">
    <rect x="40" y="178" width="150" height="44" rx="6" fill="#f6f6f6" stroke="#bbb" stroke-width="1.1"/>
  </g>
  <text x="50" y="196" font-size="10" fill="#888" font-weight="bold">preWords</text>
  <text x="115" y="214" text-anchor="middle" font-size="12" fill="#aaa">∅（空）</text>

  <text x="210" y="204" font-size="13" fill="#2b6e9e" font-weight="bold">w="a"</text>
  <path d="M 200 200 L 230 200" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="360" y="184" width="200" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="460" y="204" text-anchor="middle" font-size="11" fill="#a03040">拆不出来 → ✗ 非连接词</text>
  <g filter="url(#sk)">
    <rect x="580" y="184" width="120" height="32" rx="6" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.2"/>
  </g>
  <text x="640" y="204" text-anchor="middle" font-size="10" fill="#2e6e2e">加入 preWords</text>

  <!-- Row: w="b" -->
  <g filter="url(#sk)">
    <rect x="40" y="232" width="150" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.1"/>
  </g>
  <text x="50" y="250" font-size="10" fill="#888" font-weight="bold">preWords</text>
  <text x="115" y="268" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">{a}</text>

  <text x="210" y="258" font-size="13" fill="#2b6e9e" font-weight="bold">w="b"</text>
  <path d="M 200 254 L 230 254" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="360" y="238" width="200" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="460" y="258" text-anchor="middle" font-size="11" fill="#a03040">"b"∉{a} → ✗ 非连接词</text>
  <g filter="url(#sk)">
    <rect x="580" y="238" width="120" height="32" rx="6" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.2"/>
  </g>
  <text x="640" y="258" text-anchor="middle" font-size="10" fill="#2e6e2e">加入 preWords</text>

  <!-- Row: w="ab" -->
  <g filter="url(#sk)">
    <rect x="40" y="286" width="150" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.1"/>
  </g>
  <text x="50" y="304" font-size="10" fill="#888" font-weight="bold">preWords</text>
  <text x="115" y="322" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">{a, b}</text>

  <text x="210" y="312" font-size="13" fill="#9a6a20" font-weight="bold">w="ab"</text>
  <path d="M 200 308 L 230 308" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="360" y="292" width="200" height="32" rx="6" fill="#e6f4ea" stroke="#2e8b57" stroke-width="2"/>
  </g>
  <text x="460" y="312" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">"a"+"b" → ✓ 连接词!</text>
  <g filter="url(#sk)">
    <rect x="580" y="292" width="120" height="32" rx="6" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.2"/>
  </g>
  <text x="640" y="312" text-anchor="middle" font-size="10" fill="#2e6e2e">加入 preWords</text>

  <!-- Row: w="abc" -->
  <g filter="url(#sk)">
    <rect x="40" y="340" width="150" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.1"/>
  </g>
  <text x="50" y="358" font-size="10" fill="#888" font-weight="bold">preWords</text>
  <text x="115" y="376" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">{a,b,ab}</text>

  <text x="210" y="366" font-size="13" fill="#2b6e9e" font-weight="bold">w="abc"</text>
  <path d="M 200 362 L 230 362" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="360" y="346" width="200" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="460" y="366" text-anchor="middle" font-size="11" fill="#a03040">无法拼成 → ✗ 非连接词</text>
  <g filter="url(#sk)">
    <rect x="580" y="346" width="120" height="32" rx="6" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.2"/>
  </g>
  <text x="640" y="366" text-anchor="middle" font-size="10" fill="#2e6e2e">加入 preWords</text>

  <!-- ===== Bottom insight ===== -->
  <line x1="40" y1="396" x2="720" y2="396" stroke="#eee" stroke-width="1" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="60" y="412" width="640" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="76" y="434" font-size="11" fill="#9a6a20" font-weight="bold">💡 两个关键设计</text>
  <text x="76" y="452" font-size="10" fill="#555">① 排序保证：处理 w 时 preWords 只含更短词 → 天然防止 w 拿自己拼自己（自匹配）</text>
  <text x="76" y="466" font-size="10" fill="#555">② 复用 139 Word Break：对每个 w 跑一遍 dp，dp[len]=true 即由 ≥2 更短词拼成 → 是连接词</text>
</svg>
