<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums=[8,1,2], k=2</text>

  <!-- Step A: suffix or table -->
  <text x="40" y="56" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">① 后缀或 suf[i]（从右往左预处理）</text>

  <!-- header -->
  <rect x="40" y="64" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="80" y="82" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">i</text>
  <rect x="120" y="64" width="100" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="170" y="82" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">nums[i]</text>
  <rect x="220" y="64" width="140" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="290" y="82" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">suf[i] = 右侧或</text>

  <!-- row 0 -->
  <rect x="40" y="90" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="80" y="108" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="120" y="90" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="170" y="108" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <rect x="220" y="90" width="140" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="290" y="108" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1 | 2 = 3</text>

  <!-- row 1 -->
  <rect x="40" y="116" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="80" y="134" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="120" y="116" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="170" y="134" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="220" y="116" width="140" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="290" y="134" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <!-- row 2 -->
  <rect x="40" y="142" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="80" y="160" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="120" y="142" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="170" y="160" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="220" y="142" width="140" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="290" y="160" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">0（哨兵）</text>

  <!-- Step B: enumerate -->
  <text x="40" y="194" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 枚举 i，维护前缀或 pre，算候选值取最大</text>

  <!-- header -->
  <rect x="40" y="202" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="60" y="220" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">i</text>
  <rect x="80" y="202" width="70" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="115" y="220" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">pre</text>
  <rect x="150" y="202" width="110" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="205" y="220" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">nums[i]&lt;&lt;k</text>
  <rect x="260" y="202" width="70" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="295" y="220" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">suf[i]</text>
  <rect x="330" y="202" width="110" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="385" y="220" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">候选(OR)</text>
  <rect x="440" y="202" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="490" y="220" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">二进制</text>

  <!-- row i=0 (best) -->
  <rect x="40" y="228" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="246" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="80" y="228" width="70" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="115" y="246" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="150" y="228" width="110" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="205" y="246" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">32</text>
  <rect x="260" y="228" width="70" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="295" y="246" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="330" y="228" width="110" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="385" y="246" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">35 ⭐</text>
  <rect x="440" y="228" width="100" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="490" y="246" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">100011</text>

  <!-- row i=1 -->
  <rect x="40" y="254" width="40" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="272" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">1</text>
  <rect x="80" y="254" width="70" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="115" y="272" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">8</text>
  <rect x="150" y="254" width="110" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="205" y="272" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">4</text>
  <rect x="260" y="254" width="70" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="295" y="272" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">2</text>
  <rect x="330" y="254" width="110" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="385" y="272" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">14</text>
  <rect x="440" y="254" width="100" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="490" y="272" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">001110</text>

  <!-- row i=2 -->
  <rect x="40" y="280" width="40" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="298" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">2</text>
  <rect x="80" y="280" width="70" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="115" y="298" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">9</text>
  <rect x="150" y="280" width="110" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="205" y="298" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">8</text>
  <rect x="260" y="280" width="70" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="295" y="298" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">0</text>
  <rect x="330" y="280" width="110" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="385" y="298" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">9</text>
  <rect x="440" y="280" width="100" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="490" y="298" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">001001</text>

  <!-- Annotation -->
  <rect x="40" y="324" width="500" height="84" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="56" y="346" font-size="12" fill="#555" filter="url(#rough2)">• i=0 时 pre=0（左侧无数）、suf[0]=3（右侧 1|2）</text>
  <text x="56" y="366" font-size="12" fill="#555" filter="url(#rough2)">• i=2 时 suf[2]=0（右侧无数，哨兵免特判）</text>
  <text x="56" y="386" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">• 最大值 35，集中在 i=0（8 左移 2 位 → 32）</text>
  <text x="56" y="404" font-size="11" fill="#888" filter="url(#rough2)">  pre 每步累入 nums[i]：0→8→9，边走边更新</text>
</svg>
