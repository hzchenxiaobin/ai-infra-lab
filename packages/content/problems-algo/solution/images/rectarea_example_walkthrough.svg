<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 演算：A=(−3,0,3,4)，B=(0,−1,9,2) → 45</text>

  <!-- Axes -->
  <!-- x axis: math y=0 -> svg y=190, from x=70 (math -4) to x=440 (math ~11) -->
  <line x1="70" y1="190" x2="440" y2="190" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="448" y="194" font-size="10" fill="#888">x</text>
  <!-- y axis: math x=0 -> svg x=174, from y=250 (math -2) to y=50 (math ~5.3) -->
  <line x1="174" y1="250" x2="174" y2="50" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="170" y="46" text-anchor="end" font-size="10" fill="#888">y</text>

  <!-- origin label -->
  <text x="168" y="204" text-anchor="end" font-size="9" fill="#aaa">0</text>

  <!-- Rectangle A: math (-3,0)-(3,4) -> svg (96,190)-(252,86) -->
  <rect x="96" y="86" width="156" height="104" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="108" y="104" font-size="12" fill="#446688" font-weight="bold">A</text>
  <text x="108" y="120" font-size="9" fill="#888">6 × 4 = 24</text>
  <!-- A corner labels -->
  <text x="96" y="204" text-anchor="middle" font-size="9" fill="#446688">(−3,0)</text>
  <text x="252" y="82" text-anchor="middle" font-size="9" fill="#446688">(3,4)</text>

  <!-- Rectangle B: math (0,-1)-(9,2) -> svg (174,216)-(408,138) -->
  <rect x="174" y="138" width="234" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="386" y="156" text-anchor="end" font-size="12" fill="#4a7a3a" font-weight="bold">B</text>
  <text x="398" y="172" text-anchor="end" font-size="9" fill="#888">9 × 3 = 27</text>
  <!-- B corner labels -->
  <text x="174" y="232" text-anchor="middle" font-size="9" fill="#4a7a3a">(0,−1)</text>
  <text x="408" y="134" text-anchor="middle" font-size="9" fill="#4a7a3a">(9,2)</text>

  <!-- Overlap: math x[0,3] y[0,2] -> svg (174,190)-(252,138) -->
  <rect x="174" y="138" width="78" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="213" y="168" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">重叠</text>
  <text x="213" y="182" text-anchor="middle" font-size="9" fill="#888">3 × 2 = 6</text>

  <!-- Computation summary -->
  <rect x="40" y="270" width="460" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="290" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">容斥计算</text>

  <!-- areaA box -->
  <rect x="56" y="300" width="120" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="116" y="318" text-anchor="middle" font-size="10" fill="#446688">|A| = 6×4</text>
  <text x="116" y="336" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">= 24</text>

  <text x="188" y="326" font-size="16" fill="#555">+</text>

  <!-- areaB box -->
  <rect x="204" y="300" width="120" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="264" y="318" text-anchor="middle" font-size="10" fill="#4a7a3a">|B| = 9×3</text>
  <text x="264" y="336" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">= 27</text>

  <text x="336" y="326" font-size="16" fill="#555">−</text>

  <!-- overlap box -->
  <rect x="352" y="300" width="132" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="418" y="318" text-anchor="middle" font-size="10" fill="#d6a040">|A∩B| = 3×2</text>
  <text x="418" y="336" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">= 6</text>

  <!-- result -->
  <text x="270" y="370" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">总面积 = 24 + 27 − 6 = 45</text>
</svg>
