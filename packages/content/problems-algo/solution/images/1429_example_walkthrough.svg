<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="680" height="560" fill="#fafafa"/>

  <!-- Title -->
  <text x="340" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：[7,7,7,7,7,7] → add(3) → add(3) → add(7) → add(17)</text>
  <text x="340" y="46" text-anchor="middle" font-size="11" fill="#888">观察「重复值留队，查询时惰性弹出」的全过程</text>

  <!-- ===== Step table ===== -->
  <!-- header -->
  <rect x="30" y="62" width="620" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="70" y="82" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">步骤</text>
  <text x="180" y="82" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">操作</text>
  <text x="340" y="82" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">count 变化</text>
  <text x="490" y="82" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">候选队列 queue</text>
  <text x="615" y="82" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">返回</text>

  <!-- Step 1: FirstUnique([7,7,7,7,7,7]) -->
  <rect x="30" y="94" width="620" height="40" rx="4" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="70" y="119" text-anchor="middle" font-size="11" fill="#333">①</text>
  <text x="180" y="119" text-anchor="middle" font-size="11" fill="#333">FirstUnique([7×6])</text>
  <text x="340" y="113" text-anchor="middle" font-size="11" fill="#4a7a3a">7: 0→1→6</text>
  <text x="340" y="128" text-anchor="middle" font-size="10" fill="#888">首现入队，后续不入</text>
  <text x="490" y="119" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">[7]</text>
  <text x="615" y="119" text-anchor="middle" font-size="11" fill="#888">—</text>

  <!-- Step 2: showFirstUnique -> -1 -->
  <rect x="30" y="136" width="620" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="161" text-anchor="middle" font-size="11" fill="#333">②</text>
  <text x="180" y="161" text-anchor="middle" font-size="11" fill="#333">showFirstUnique()</text>
  <text x="340" y="155" text-anchor="middle" font-size="11" fill="#888">7: 6（不变）</text>
  <text x="340" y="170" text-anchor="middle" font-size="10" fill="#b85450">peek 7, count=6&gt;1 ⇒ pop</text>
  <text x="490" y="161" text-anchor="middle" font-size="11" fill="#888">[ ]（空）</text>
  <text x="615" y="161" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">-1</text>

  <!-- Step 3: add(3) -->
  <rect x="30" y="178" width="620" height="40" rx="4" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="70" y="203" text-anchor="middle" font-size="11" fill="#333">③</text>
  <text x="180" y="203" text-anchor="middle" font-size="11" fill="#333">add(3)</text>
  <text x="340" y="197" text-anchor="middle" font-size="11" fill="#4a7a3a">3: 0→1</text>
  <text x="340" y="212" text-anchor="middle" font-size="10" fill="#4a7a3a">首次 ⇒ 入队</text>
  <text x="490" y="203" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">[3]</text>
  <text x="615" y="203" text-anchor="middle" font-size="11" fill="#888">—</text>

  <!-- Step 4: add(3) -->
  <rect x="30" y="220" width="620" height="40" rx="4" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="70" y="245" text-anchor="middle" font-size="11" fill="#333">④</text>
  <text x="180" y="245" text-anchor="middle" font-size="11" fill="#333">add(3)</text>
  <text x="340" y="239" text-anchor="middle" font-size="11" fill="#b85450">3: 1→2</text>
  <text x="340" y="254" text-anchor="middle" font-size="10" fill="#b85450">已重复 ⇒ 不入队</text>
  <text x="490" y="245" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">[3✗]</text>
  <text x="615" y="245" text-anchor="middle" font-size="11" fill="#888">—</text>

  <!-- Step 5: add(7) -->
  <rect x="30" y="262" width="620" height="40" rx="4" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="70" y="287" text-anchor="middle" font-size="11" fill="#333">⑤</text>
  <text x="180" y="287" text-anchor="middle" font-size="11" fill="#333">add(7)</text>
  <text x="340" y="281" text-anchor="middle" font-size="11" fill="#b85450">7: 6→7</text>
  <text x="340" y="296" text-anchor="middle" font-size="10" fill="#b85450">已重复 ⇒ 不入队</text>
  <text x="490" y="287" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">[3✗]</text>
  <text x="615" y="287" text-anchor="middle" font-size="11" fill="#888">—</text>

  <!-- Step 6: add(17) -->
  <rect x="30" y="304" width="620" height="40" rx="4" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="70" y="329" text-anchor="middle" font-size="11" fill="#333">⑥</text>
  <text x="180" y="329" text-anchor="middle" font-size="11" fill="#333">add(17)</text>
  <text x="340" y="323" text-anchor="middle" font-size="11" fill="#4a7a3a">17: 0→1</text>
  <text x="340" y="338" text-anchor="middle" font-size="10" fill="#4a7a3a">首次 ⇒ 入队</text>
  <text x="490" y="329" text-anchor="middle" font-size="11" fill="#333">[3✗, 17]</text>
  <text x="615" y="329" text-anchor="middle" font-size="11" fill="#888">—</text>

  <!-- Step 7: showFirstUnique -> 17 -->
  <rect x="30" y="346" width="620" height="52" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="70" y="368" text-anchor="middle" font-size="11" fill="#333">⑦</text>
  <text x="180" y="368" text-anchor="middle" font-size="11" fill="#333">showFirstUnique()</text>
  <text x="340" y="362" text-anchor="middle" font-size="10" fill="#b85450">peek 3, count=2&gt;1 ⇒ pop</text>
  <text x="340" y="377" text-anchor="middle" font-size="10" fill="#4a7a3a">peek 17, count=1 == 1 ⇒ 停</text>
  <text x="340" y="392" text-anchor="middle" font-size="10" fill="#888">惰性弹出 1 个陈旧值</text>
  <text x="490" y="368" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">[17]</text>
  <text x="615" y="368" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">17</text>

  <!-- ===== Insight box ===== -->
  <rect x="30" y="412" width="620" height="130" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="340" y="436" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">关键观察：陈旧值「3」在步骤④变重复，但直到步骤⑦才被弹出</text>
  <text x="46" y="458" font-size="11" fill="#555">• add(3) 第二次时 count[3]=2，3 不再唯一，但它仍留在队列里（标记 ✗）</text>
  <text x="46" y="476" font-size="11" fill="#555">• 没有任何 add 操作去主动清理它——清理推迟到 showFirstUnique 需要它让位时</text>
  <text x="46" y="494" font-size="11" fill="#555">• 步骤⑦连续 peek→pop 直到队首是 17（count=1），整个过程只 pop 1 次</text>
  <text x="46" y="512" font-size="11" fill="#555">• 跨全部调用：push 共 3 次（7, 3, 17），pop 共 2 次（7, 3），每次操作均摊 O(1)</text>
  <text x="46" y="530" font-size="11" fill="#b85450" font-weight="bold">⇒ 「惰性删除」用「推迟清理」换「add 的 O(1)」，清理成本由查询均摊吸收</text>
</svg>
