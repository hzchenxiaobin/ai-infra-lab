<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：seats = [1,0,0,0,1,0,1]，人在下标 0、4、6</text>

  <!-- index labels -->
  <text x="60" y="62" font-size="10" fill="#888">下标</text>
  <rect x="120" y="48" width="50" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="145" y="63" text-anchor="middle" font-size="10" fill="#888">0</text>
  <rect x="172" y="48" width="50" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="197" y="63" text-anchor="middle" font-size="10" fill="#888">1</text>
  <rect x="224" y="48" width="50" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="249" y="63" text-anchor="middle" font-size="10" fill="#888">2</text>
  <rect x="276" y="48" width="50" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="301" y="63" text-anchor="middle" font-size="10" fill="#888">3</text>
  <rect x="328" y="48" width="50" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="353" y="63" text-anchor="middle" font-size="10" fill="#888">4</text>
  <rect x="380" y="48" width="50" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="405" y="63" text-anchor="middle" font-size="10" fill="#888">5</text>
  <rect x="432" y="48" width="50" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="457" y="63" text-anchor="middle" font-size="10" fill="#888">6</text>

  <!-- seat row -->
  <text x="60" y="104" font-size="11" fill="#888">座位</text>
  <rect x="120" y="88" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="145" y="109" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="172" y="88" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="197" y="109" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="224" y="88" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="249" y="109" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="276" y="88" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="301" y="109" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="328" y="88" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="353" y="109" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="380" y="88" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="405" y="109" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="432" y="88" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="457" y="109" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>

  <!-- forward row -->
  <text x="60" y="150" font-size="11" fill="#4a7a3a" font-weight="bold">正向 i−last</text>
  <rect x="120" y="134" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="145" y="152" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="172" y="134" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="197" y="152" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="224" y="134" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="249" y="152" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="276" y="134" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="301" y="152" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="328" y="134" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="353" y="152" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="380" y="134" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="405" y="152" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="432" y="134" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="457" y="152" text-anchor="middle" font-size="12" fill="#333">0</text>

  <!-- backward row -->
  <text x="60" y="188" font-size="11" fill="#b85450" font-weight="bold">反向 last−i</text>
  <rect x="120" y="172" width="50" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="145" y="190" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="172" y="172" width="50" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="197" y="190" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="224" y="172" width="50" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="249" y="190" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="276" y="172" width="50" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="301" y="190" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="328" y="172" width="50" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="353" y="190" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="380" y="172" width="50" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="405" y="190" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="432" y="172" width="50" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="457" y="190" text-anchor="middle" font-size="12" fill="#333">0</text>

  <!-- min row (highlight index 2) -->
  <text x="60" y="226" font-size="11" fill="#d6a040" font-weight="bold">最近距离 min</text>
  <rect x="120" y="210" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="145" y="228" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="172" y="210" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="197" y="228" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="224" y="210" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="249" y="228" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2</text>
  <rect x="276" y="210" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="301" y="228" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="328" y="210" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="353" y="228" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="380" y="210" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="405" y="228" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="432" y="210" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="457" y="228" text-anchor="middle" font-size="12" fill="#333">0</text>

  <!-- arrow from index 2 seat to min -->
  <path d="M 249 124 L 249 206" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- best seat annotation -->
  <rect x="174" y="258" width="152" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="250" y="278" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">下标 2 坐正中：min(2,2)=2</text>

  <!-- max answer -->
  <rect x="190" y="302" width="220" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="324" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">答案 = max = 2</text>

  <text x="300" y="356" text-anchor="middle" font-size="10" fill="#888">下标 2 夹在人(0)与人(4)正中，两侧等距 2，是所有空座里最近距离最大的</text>
  <text x="300" y="372" text-anchor="middle" font-size="10" fill="#888">下标 1/3/5 的最近距离都只有 1，被某一侧的人压低</text>
</svg>
