<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：计数 DP 四步法</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">状态 → 转移 → 初始化 → 顺序，自底向上填表</text>

  <!-- ===== Step 1: 状态定义 ===== -->
  <rect x="70" y="58" width="380" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <circle cx="92" cy="80" r="11" fill="#446688" filter="url(#rough2)"/>
  <text x="92" y="84" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">1</text>
  <text x="112" y="76" font-size="11" fill="#446688" font-weight="bold">状态定义</text>
  <text x="112" y="92" font-size="11" fill="#333">G(n) = n 个节点组成的不同 BST 种数</text>

  <path d="M 260 104 L 260 122" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: 转移方程 ===== -->
  <rect x="70" y="126" width="380" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <circle cx="92" cy="148" r="11" fill="#b85450" filter="url(#rough2)"/>
  <text x="92" y="152" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">2</text>
  <text x="112" y="144" font-size="11" fill="#b85450" font-weight="bold">转移方程</text>
  <text x="112" y="160" font-size="11" fill="#333">G(n) = Σ G(i-1) × G(n-i)   （枚举根 i，左右相乘）</text>

  <path d="M 260 172 L 260 190" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: 初始条件 ===== -->
  <rect x="70" y="194" width="380" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <circle cx="92" cy="216" r="11" fill="#d6a040" filter="url(#rough2)"/>
  <text x="92" y="220" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">3</text>
  <text x="112" y="212" font-size="11" fill="#d6a040" font-weight="bold">初始条件</text>
  <text x="112" y="228" font-size="11" fill="#333">G(0) = 1（空树算 1 种），G(1) = 1（单节点）</text>

  <path d="M 260 240 L 260 258" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 4: 计算顺序 ===== -->
  <rect x="70" y="262" width="380" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <circle cx="92" cy="284" r="11" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="92" y="288" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">4</text>
  <text x="112" y="280" font-size="11" fill="#4a7a3a" font-weight="bold">计算顺序</text>
  <text x="112" y="296" font-size="11" fill="#333">自底向上：n = 2 → 3 → … → N，小规模先算</text>

  <!-- ===== Note ===== -->
  <rect x="70" y="316" width="380" height="32" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="260" y="336" text-anchor="middle" font-size="10" fill="#888">双重循环 O(n²) 时间，O(n) 空间；答案即卡塔兰数 C_n</text>
</svg>
