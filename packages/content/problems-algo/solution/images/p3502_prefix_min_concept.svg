<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">付费一次跳到前缀最便宜处，再免费退回目标</text>

  <!-- ① 付费弧线：你 -> 编号 1 -->
  <path d="M 446 72 C 446 40, 150 42, 141 70" fill="none" stroke="#b85450" stroke-width="2.2" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="293" y="40" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">① 付费 3：与前缀 [0..2] 中最便宜的编号 1 交换</text>

  <!-- 队伍：7 个格子 -->
  <rect x="46" y="78" width="56" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="74" y="93" text-anchor="middle" font-size="9.5" fill="#8a6d3a" filter="url(#rough2)">#0</text>
  <text x="74" y="116" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">5</text>

  <rect x="108" y="78" width="56" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="136" y="93" text-anchor="middle" font-size="9.5" fill="#2a5a2a" filter="url(#rough2)">#1</text>
  <text x="136" y="116" text-anchor="middle" font-size="16" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">3</text>

  <rect x="170" y="78" width="56" height="48" rx="4" fill="#fff8e1" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="198" y="93" text-anchor="middle" font-size="9.5" fill="#8a6d3a" filter="url(#rough2)">#2</text>
  <text x="198" y="116" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">4</text>
  <text x="205" y="141" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">目标 i=2</text>

  <rect x="232" y="78" width="56" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="93" text-anchor="middle" font-size="9.5" fill="#8a6d3a" filter="url(#rough2)">#3</text>
  <text x="260" y="116" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">1</text>

  <rect x="294" y="78" width="56" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="322" y="93" text-anchor="middle" font-size="9.5" fill="#8a6d3a" filter="url(#rough2)">#4</text>
  <text x="322" y="116" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">3</text>

  <rect x="356" y="78" width="56" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="384" y="93" text-anchor="middle" font-size="9.5" fill="#8a6d3a" filter="url(#rough2)">#5</text>
  <text x="384" y="116" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">2</text>

  <rect x="418" y="78" width="56" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="446" y="93" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">编号 n</text>
  <text x="446" y="116" text-anchor="middle" font-size="16" font-weight="bold" fill="#446688" filter="url(#rough2)">你</text>

  <!-- ② 免费弧线：编号 1 -> 编号 2 -->
  <path d="M 112 130 C 108 152, 180 152, 178 130" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="145" y="168" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">② 免费：编号 2 在你身后</text>

  <text x="260" y="184" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">编号 k 初始站在位置 k；你是编号 n，从队尾出发（cost = [5,3,4,1,3,2]）</text>

  <!-- 对照表 -->
  <text x="260" y="205" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">一遍扫描：cost → answer（前缀最小值）</text>

  <text x="100" y="229" text-anchor="end" font-size="12" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">cost</text>
  <rect x="110" y="210" width="46" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="133" y="230" text-anchor="middle" font-size="13" fill="#8a6d3a" filter="url(#rough2)">5</text>
  <rect x="166" y="210" width="46" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="189" y="230" text-anchor="middle" font-size="13" fill="#8a6d3a" filter="url(#rough2)">3</text>
  <rect x="222" y="210" width="46" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="245" y="230" text-anchor="middle" font-size="13" fill="#8a6d3a" filter="url(#rough2)">4</text>
  <rect x="278" y="210" width="46" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="301" y="230" text-anchor="middle" font-size="13" fill="#8a6d3a" filter="url(#rough2)">1</text>
  <rect x="334" y="210" width="46" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="357" y="230" text-anchor="middle" font-size="13" fill="#8a6d3a" filter="url(#rough2)">3</text>
  <rect x="390" y="210" width="46" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="413" y="230" text-anchor="middle" font-size="13" fill="#8a6d3a" filter="url(#rough2)">2</text>

  <text x="100" y="269" text-anchor="end" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">answer</text>
  <rect x="110" y="250" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="133" y="270" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">5</text>
  <rect x="166" y="250" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="189" y="270" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">3</text>
  <rect x="222" y="250" width="46" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="245" y="270" text-anchor="middle" font-size="13" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="278" y="250" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="301" y="270" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="334" y="250" width="46" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="357" y="270" text-anchor="middle" font-size="13" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="390" y="250" width="46" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="413" y="270" text-anchor="middle" font-size="13" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="260" y="296" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">绿格 = 继承前面更小的值（免费退回带来的好处）</text>

  <!-- 结论公式 -->
  <rect x="95" y="308" width="330" height="46" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="327" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">answer[i] = min(cost[0], …, cost[i])</text>
  <text x="260" y="345" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">付一次前缀最低价，身后的位置全部免费</text>
</svg>
