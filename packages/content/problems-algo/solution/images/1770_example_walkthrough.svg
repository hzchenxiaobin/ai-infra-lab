<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="500" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [1,2,3], multipliers = [3,2,1]</text>

  <!-- Input -->
  <text x="30" y="50" font-size="11" fill="#888">nums:</text>
  <rect x="70" y="36" width="30" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="85" y="52" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="102" y="36" width="30" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="117" y="52" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="134" y="36" width="30" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="149" y="52" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="180" y="50" font-size="11" fill="#888">mult: [3, 2, 1]，n=3, m=3</text>

  <!-- ===== Stage k=0 ===== -->
  <rect x="20" y="72" width="540" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)" opacity="0.5"/>
  <text x="36" y="90" font-size="11" fill="#444" font-weight="bold">k=0, m[0]=3</text>
  <text x="36" y="108" font-size="10" fill="#888">dp（前）:</text>
  <rect x="92" y="94" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="109" y="111" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>

  <text x="150" y="111" font-size="10" fill="#666">→</text>

  <!-- two choices -->
  <rect x="172" y="86" width="180" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="262" y="101" text-anchor="middle" font-size="10" fill="#555">取右 nums[2]=3: 0+3×3=9</text>
  <rect x="172" y="112" width="180" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="262" y="127" text-anchor="middle" font-size="10" fill="#555">取左 nums[0]=1: 0+3×1=3</text>

  <text x="366" y="111" font-size="10" fill="#666">→ ndp:</text>
  <rect x="406" y="94" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="423" y="111" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">9</text>
  <rect x="442" y="94" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="459" y="111" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="486" y="111" font-size="9" fill="#888">i=0,1</text>

  <!-- ===== Stage k=1 ===== -->
  <rect x="20" y="172" width="540" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)" opacity="0.5"/>
  <text x="36" y="190" font-size="11" fill="#444" font-weight="bold">k=1, m[1]=2</text>
  <text x="36" y="208" font-size="10" fill="#888">dp（前）:</text>
  <rect x="92" y="194" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="109" y="211" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">9</text>
  <rect x="128" y="194" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="145" y="211" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>

  <text x="176" y="211" font-size="10" fill="#666">→</text>

  <rect x="196" y="182" width="178" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="285" y="196" text-anchor="middle" font-size="9" fill="#555">i=0 取右 nums[1]=2: 9+4=13</text>
  <rect x="196" y="204" width="178" height="20" fill="#f4eee0" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="285" y="218" text-anchor="middle" font-size="9" fill="#555">i=1 取左 11 / 取右 9 → 11</text>
  <rect x="196" y="226" width="178" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="285" y="240" text-anchor="middle" font-size="9" fill="#555">i=2 取左 nums[1]=2: 3+4=7</text>

  <text x="390" y="211" font-size="10" fill="#666">→ ndp:</text>
  <rect x="428" y="194" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="443" y="211" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">13</text>
  <rect x="460" y="194" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="475" y="211" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">11</text>
  <rect x="492" y="194" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="507" y="211" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">7</text>

  <!-- ===== Stage k=2 ===== -->
  <rect x="20" y="272" width="540" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)" opacity="0.5"/>
  <text x="36" y="290" font-size="11" fill="#444" font-weight="bold">k=2, m[2]=1</text>
  <text x="36" y="308" font-size="10" fill="#888">dp（前）:</text>
  <rect x="92" y="294" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="107" y="311" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">13</text>
  <rect x="124" y="294" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="139" y="311" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">11</text>
  <rect x="156" y="294" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="171" y="311" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">7</text>

  <text x="200" y="311" font-size="10" fill="#666">→</text>

  <rect x="220" y="280" width="180" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="310" y="294" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">i=0 取右 nums[0]=1: 13+1=14 ★</text>
  <rect x="220" y="302" width="180" height="20" fill="#f4eee0" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="310" y="316" text-anchor="middle" font-size="9" fill="#555">i=1 取左 14 / 取右 13 → 14</text>
  <rect x="220" y="324" width="180" height="20" fill="#f4eee0" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="310" y="338" text-anchor="middle" font-size="9" fill="#555">i=2 取左 13 / 取右 10 → 13</text>
  <rect x="220" y="346" width="180" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="310" y="360" text-anchor="middle" font-size="9" fill="#555">i=3 取左 nums[2]=3: 7+3=10</text>

  <text x="414" y="318" font-size="10" fill="#666">→ ndp:</text>
  <rect x="452" y="302" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="466" y="318" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">14</text>
  <rect x="482" y="302" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="496" y="318" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">14</text>
  <rect x="512" y="302" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="526" y="318" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">13</text>
  <rect x="542" y="302" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="556" y="318" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">10</text>

  <!-- ===== Answer ===== -->
  <path d="M 290 384 L 290 398" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="402" width="500" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="426" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">答案 = max(dp) = 14</text>
  <text x="290" y="448" text-anchor="middle" font-size="11" fill="#555">最优路径：始终取右端（i=0）→ 3×3 + 2×2 + 1×1 = 9+4+1 = 14</text>
  <text x="290" y="466" text-anchor="middle" font-size="10" fill="#888">每步的「取右」对应 ndp[0]，由上一轮 dp[0] 接力，红色 ★ 标记最优转移</text>
</svg>
