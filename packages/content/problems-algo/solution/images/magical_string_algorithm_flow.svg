<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 600" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="600" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：双指针自生成（边写边数 '1'）</text>

  <!-- Start: init -->
  <rect x="160" y="44" width="240" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="20" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">开始：s = [1,2,2]，head = 2，tail = 3，ones = 1</text>
  <text x="280" y="76" text-anchor="middle" font-size="9.5" fill="#555">种子 "122" 含 1 个 '1'</text>

  <path d="M 280 86 L 280 104" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Outer loop check: tail < n ? -->
  <polygon points="280,108 410,156 280,204 150,156" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="152" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">tail &lt; n ?</text>
  <text x="280" y="170" text-anchor="middle" font-size="10" fill="#888">（还需生成更多位）</text>

  <!-- No: return -->
  <path d="M 410 156 L 470 156" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="440" y="150" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="474" y="138" width="72" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="510" y="161" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回 ones</text>

  <!-- Yes: down -->
  <path d="M 280 204 L 280 222" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="292" y="218" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Read cnt + compute val -->
  <rect x="140" y="226" width="280" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="246" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">cnt = s[head]，val = 3 − s[tail − 1]</text>
  <text x="280" y="263" text-anchor="middle" font-size="10" fill="#555">读计数 / 组值交替 1↔2</text>

  <path d="M 280 278 L 280 296" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Inner loop check: i < cnt and tail < n ? -->
  <polygon points="280,300 400,340 280,380 160,340" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="338" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">i &lt; cnt 且 tail &lt; n ?</text>
  <text x="280" y="354" text-anchor="middle" font-size="9.5" fill="#888">（本组还没写完且没越界）</text>

  <!-- Yes: write one char -->
  <path d="M 400 340 L 460 340" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="430" y="334" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="464" y="320" width="82" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="505" y="338" text-anchor="middle" font-size="10" fill="#555">s.append(val)</text>
  <text x="505" y="352" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">val==1 → ones++</text>

  <!-- loop back from write box to inner check -->
  <path d="M 505 360 L 505 300 L 400 300 L 400 320" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="3,3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="450" y="294" text-anchor="middle" font-size="9" fill="#888">tail++, i++ 继续本组</text>

  <!-- No: head++ -->
  <path d="M 280 380 L 280 398" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="292" y="394" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <rect x="200" y="402" width="160" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="425" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">head += 1</text>

  <!-- back to outer loop check -->
  <path d="M 200 420 L 80 420 L 80 156 L 150 156" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="3,3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="92" y="290" font-size="9.5" fill="#888">回外层判断</text>

  <!-- divider -->
  <path d="M 36 466 L 524 466" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>

  <!-- notes -->
  <text x="36" y="490" font-size="11.5" fill="#446688" font-weight="bold">关键守卫与不变量</text>

  <rect x="36" y="500" width="488" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="520" font-size="10.5" fill="#555">• <tspan fill="#b85450" font-weight="bold">越界守卫</tspan>：内层循环带「tail &lt; n」，某组 cnt=2 但距 n 仅差 1 时只写 1 个即停，避免多计 '1'</text>
  <text x="50" y="538" font-size="10.5" fill="#555">• <tspan fill="#4a7a3a" font-weight="bold">读滞后于写</tspan>：生成第 k 组读 s[k−1]，前 k−1 组累计长度 ≥ k−1，故 s[head] 读取时必已存在（head ≤ tail）</text>
  <text x="50" y="556" font-size="10.5" fill="#555">• <tspan fill="#d6a040" font-weight="bold">组值交替</tspan>：val = 3 − s[tail−1]，极大游程保证相邻组字符不同，1↔2 互翻</text>
  <text x="50" y="574" font-size="10.5" fill="#555">• <tspan fill="#446688" font-weight="bold">种子</tspan>：s = [1,2,2] 锁定前两组（"1" 与 "22"），head 从 2 起读第 3 组计数</text>
</svg>
