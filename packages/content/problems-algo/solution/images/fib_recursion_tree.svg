<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">暴力递归树：fib(5) 的调用过程</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">15 次调用，但只有 6 个不同子问题——重复计算是性能瓶颈的根源</text>

  <!-- ===== edges (behind nodes) ===== -->
  <g stroke="#aaa" stroke-width="1.2" fill="none" filter="url(#rough2)">
    <!-- F(5) -> F(4), F(3)@400 -->
    <line x1="280" y1="65" x2="180" y2="105"/>
    <line x1="280" y1="65" x2="400" y2="105"/>
    <!-- F(4) -> F(3)@110, F(2)@250 -->
    <line x1="180" y1="130" x2="110" y2="180"/>
    <line x1="180" y1="130" x2="250" y2="180"/>
    <!-- F(3)@400 -> F(2)@350, F(1)@470 -->
    <line x1="400" y1="130" x2="350" y2="180"/>
    <line x1="400" y1="130" x2="470" y2="180"/>
    <!-- F(3)@110 -> F(2)@70, F(1)@150 -->
    <line x1="110" y1="205" x2="70" y2="255"/>
    <line x1="110" y1="205" x2="150" y2="255"/>
    <!-- F(2)@250 -> F(1)@215, F(0)@285 -->
    <line x1="250" y1="205" x2="215" y2="255"/>
    <line x1="250" y1="205" x2="285" y2="255"/>
    <!-- F(2)@350 -> F(1)@320, F(0)@380 -->
    <line x1="350" y1="205" x2="320" y2="255"/>
    <line x1="350" y1="205" x2="380" y2="255"/>
    <!-- F(2)@70 -> F(1)@45, F(0)@95 -->
    <line x1="70" y1="280" x2="45" y2="330"/>
    <line x1="70" y1="280" x2="95" y2="330"/>
  </g>

  <!-- ===== nodes ===== -->
  <!-- green = first computation, red = repeat (wasted) -->
  <g font-size="12" font-weight="bold">
    <!-- Level 0 -->
    <circle cx="280" cy="50" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="280" y="54" text-anchor="middle" font-size="11" fill="#2d4d22">5</text>

    <!-- Level 1 -->
    <circle cx="180" cy="115" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="180" y="119" text-anchor="middle" font-size="11" fill="#2d4d22">4</text>
    <circle cx="400" cy="115" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="400" y="119" text-anchor="middle" font-size="11" fill="#7a3530">3</text>

    <!-- Level 2 -->
    <circle cx="110" cy="190" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="110" y="194" text-anchor="middle" font-size="11" fill="#2d4d22">3</text>
    <circle cx="250" cy="190" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="250" y="194" text-anchor="middle" font-size="11" fill="#7a3530">2</text>
    <circle cx="350" cy="190" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="350" y="194" text-anchor="middle" font-size="11" fill="#7a3530">2</text>
    <circle cx="470" cy="190" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="470" y="194" text-anchor="middle" font-size="11" fill="#7a3530">1</text>

    <!-- Level 3 -->
    <circle cx="70" cy="265" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="70" y="269" text-anchor="middle" font-size="11" fill="#2d4d22">2</text>
    <circle cx="150" cy="265" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="150" y="269" text-anchor="middle" font-size="11" fill="#7a3530">1</text>
    <circle cx="215" cy="265" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="215" y="269" text-anchor="middle" font-size="11" fill="#7a3530">1</text>
    <circle cx="285" cy="265" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="285" y="269" text-anchor="middle" font-size="11" fill="#7a3530">0</text>
    <circle cx="320" cy="265" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="320" y="269" text-anchor="middle" font-size="11" fill="#7a3530">1</text>
    <circle cx="380" cy="265" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="380" y="269" text-anchor="middle" font-size="11" fill="#7a3530">0</text>

    <!-- Level 4 -->
    <circle cx="45" cy="340" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="45" y="344" text-anchor="middle" font-size="11" fill="#2d4d22">1</text>
    <circle cx="95" cy="340" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="95" y="344" text-anchor="middle" font-size="11" fill="#2d4d22">0</text>
  </g>

  <!-- ===== legend ===== -->
  <g filter="url(#rough2)">
    <rect x="395" y="320" width="155" height="62" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6"/>
    <circle cx="412" cy="338" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="428" y="342" font-size="10" fill="#333">首次计算（6 个）</text>
    <circle cx="412" cy="362" r="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="428" y="366" font-size="10" fill="#333">重复计算（9 个）</text>
  </g>

  <text x="280" y="388" text-anchor="middle" font-size="10" fill="#888">调用总数 = 2·F(n+1) − 1，随 n 指数增长</text>
</svg>
