<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一次遍历累加差异边界的最小翻转成本</text>

  <!-- Start node -->
  <rect x="190" y="40" width="140" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="20" filter="url(#rough2)"/>
  <text x="260" y="65" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans = 0, i = 0</text>

  <path d="M 260 80 L 260 105" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Condition diamond: i < n-1? -->
  <polygon points="260,110 340,150 260,190 180,150" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="148" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i &lt; n-1 ?</text>
  <text x="260" y="162" text-anchor="middle" font-size="10" fill="#888">（还有边界要检查）</text>

  <!-- No branch -> return -->
  <path d="M 340 150 L 400 150" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="370" y="143" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="400" y="130" width="100" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="450" y="148" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回 ans</text>
  <text x="450" y="162" text-anchor="middle" font-size="9" fill="#888">最小成本</text>

  <!-- Yes branch down -->
  <path d="M 260 190 L 260 215" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="275" y="206" font-size="10" fill="#b85450" font-weight="bold">是</text>

  <!-- Condition: s[i] != s[i+1]? -->
  <polygon points="260,220 370,258 260,296 150,258" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="256" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">s[i] ≠ s[i+1] ?</text>
  <text x="260" y="270" text-anchor="middle" font-size="10" fill="#888">（差异边界）</text>

  <!-- No branch (same chars) -> skip -->
  <path d="M 370 258 L 430 258 L 430 310" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="395" y="250" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">否，跳过</text>

  <!-- Yes branch -> accumulate -->
  <path d="M 260 296 L 260 320" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="275" y="315" font-size="10" fill="#b85450" font-weight="bold">是</text>

  <rect x="140" y="320" width="240" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="345" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">ans += min(i+1, n-i-1)</text>

  <!-- i++ and loop back -->
  <path d="M 140 340 L 80 340 L 80 150 L 175 150" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 430 310 L 430 340 L 380 340" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="60" y="248" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">i++</text>
  <text x="60" y="262" text-anchor="middle" font-size="9" fill="#888">继续</text>
</svg>
