<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：小根堆 m 路归并</text>

  <!-- 开始 -->
  <rect x="165" y="34" width="190" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="13" filter="url(#rough2)"/>
  <text x="260" y="52" text-anchor="middle" font-size="11.5" fill="#333">d = 1，ans = 0</text>
  <path d="M260,60 L260,72" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="118" y="74" width="284" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="92" text-anchor="middle" font-size="11" fill="#333">各店行尾 (values[i][n−1], i) 全部入小根堆</text>
  <path d="M260,100 L260,112" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 菱形：堆空？ -->
  <polygon points="260,114 336,142 260,170 184,142" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="147" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">堆空？</text>
  <path d="M336,142 L392,142" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="356" y="136" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- 返回 -->
  <rect x="394" y="129" width="102" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="445" y="147" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">返回 ans</text>

  <text x="268" y="186" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  <path d="M260,170 L260,182" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 弹出堆顶 -->
  <rect x="130" y="184" width="260" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="202" text-anchor="middle" font-size="11" fill="#333">弹出堆顶 (v, i)：当前各店行尾中的最小值</text>
  <path d="M260,210 L260,222" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 累加 -->
  <rect x="130" y="224" width="260" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="242" text-anchor="middle" font-size="11" fill="#333">第 d 天买走 v：ans += v × d；d += 1</text>
  <path d="M260,250 L260,262" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 菱形：还有货？ -->
  <polygon points="260,264 352,290 260,316 168,290" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="295" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">店 i 还有货？</text>

  <path d="M352,290 L390,290" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="360" y="284" font-size="10.5" fill="#b85450" font-weight="bold">是</text>

  <!-- 新行尾入堆 -->
  <rect x="392" y="276" width="112" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="448" y="295" text-anchor="middle" font-size="11" fill="#333">新行尾入堆</text>

  <!-- 回环线 -->
  <path d="M448,276 L448,176 L100,176" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M260,316 L260,328 L100,328 L100,142 L182,142" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="228" y="312" font-size="10.5" fill="#4a7a3a" font-weight="bold">否（该店买空）</text>

  <!-- 注记 -->
  <rect x="50" y="336" width="420" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="350" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">O(mn log m)；ans 最大约 5×10¹⁵，必须用 64 位整数</text>
</svg>
