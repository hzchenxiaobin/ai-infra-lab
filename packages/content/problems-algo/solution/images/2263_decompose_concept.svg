<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：拆成「非递减」与「非递增」两个子问题，取较小者</text>
  <text x="270" y="42" text-anchor="middle" font-size="10.5" fill="#888">单步操作 ±1 → 总代价 = Σ|a_i − b_i|；翻转数组即可把非递增归约为非递减</text>

  <!-- ===== Original array nums = [3,2,4,5,0] ===== -->
  <text x="40" y="120" font-size="10.5" fill="#666">nums</text>
  <rect x="74" y="100" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="94" y="120" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="116" y="100" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="136" y="120" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="158" y="100" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="120" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="200" y="100" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="120" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <rect x="242" y="100" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="262" y="120" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>

  <!-- branch arrows: up (non-decreasing) and down (non-increasing) -->
  <path d="M 178 100 Q 178 80 250 76 L 330 76" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 178 130 Q 178 150 250 234 L 330 234" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="196" y="74" font-size="10.5" fill="#446688" font-weight="bold">非递减</text>
  <text x="196" y="160" font-size="10.5" fill="#4a7a3a" font-weight="bold">非递增</text>

  <!-- ===== Non-decreasing target (blue) ===== -->
  <text x="350" y="56" font-size="10.5" fill="#446688" font-weight="bold">b ↑ (非递减)</text>
  <rect x="350" y="62" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="368" y="81" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="388" y="62" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="406" y="81" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="426" y="62" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="444" y="81" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="464" y="62" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="482" y="81" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="502" y="62" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="520" y="81" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="350" y="96" width="188" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="444" y="111" text-anchor="middle" font-size="10.5" fill="#333">代价 = 3+0+0+1+4 = 6</text>

  <!-- ===== Non-increasing target (green) ===== -->
  <text x="350" y="216" font-size="10.5" fill="#4a7a3a" font-weight="bold">b ↓ (非递增)</text>
  <rect x="350" y="222" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="368" y="241" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="388" y="222" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="406" y="241" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="426" y="222" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="444" y="241" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="464" y="222" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="482" y="241" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="502" y="222" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="520" y="241" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="350" y="256" width="188" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="444" y="271" text-anchor="middle" font-size="10.5" fill="#333">代价 = 0+1+1+2+0 = 4</text>

  <!-- ===== take min ===== -->
  <line x1="444" y1="118" x2="444" y2="150" stroke="#888" stroke-width="1.4" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <line x1="444" y1="278" x2="444" y2="150" stroke="#888" stroke-width="1.4" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <path d="M 444 150 L 250 150 L 250 312" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="120" y="312" width="300" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="334" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">min(6, 4) = 4 → 答案</text>

  <!-- ===== operation note (left-bottom) ===== -->
  <rect x="36" y="276" width="248" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="52" y="296" font-size="11" fill="#333" font-weight="bold">单步操作：nums[i] ← nums[i] ± 1</text>
  <text x="52" y="313" font-size="10.5" fill="#555">把 a_i 调整到 b_i 需 |a_i − b_i| 步</text>
  <text x="52" y="328" font-size="10.5" fill="#555">总代价 = Σ |a_i − b_i|（L1 距离）</text>

  <!-- footer -->
  <text x="270" y="384" text-anchor="middle" font-size="10" fill="#888">非递增 ⇔ 把数组翻转后求「非递减」→ 同一个 solve 复用两次</text>
</svg>
