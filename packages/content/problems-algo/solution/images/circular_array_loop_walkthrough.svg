<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrW" markerWidth="8" markerHeight="8" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L6,2.5 L0,5 Z" fill="#555"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    示例演算：nums = [2, −1, 1, 2, 2]
  </text>

  <!-- Step 1 -->
  <text x="20" y="50" font-size="11" fill="#4a7a3a" filter="url(#rough2)">Step 1: i=0, slow=0, fast=next(0)=2</text>
  <g filter="url(#rough2)">
    <!-- mini graph: 0(2) 2(1) 3(2) -->
    <circle cx="60" cy="80" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="60" y="84" text-anchor="middle" font-size="10" fill="#333">0</text>
    <circle cx="160" cy="80" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="160" y="84" text-anchor="middle" font-size="10" fill="#333">2</text>
    <circle cx="110" cy="135" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="110" y="139" text-anchor="middle" font-size="10" fill="#333">3</text>
    <path d="M 76 78 Q 110 65 144 78" fill="none" stroke="#555" stroke-width="1" marker-end="url(#arrW)"/>
    <path d="M 148 92 Q 130 110 122 122" fill="none" stroke="#555" stroke-width="1" marker-end="url(#arrW)"/>
    <path d="M 98 128 Q 70 110 58 96" fill="none" stroke="#555" stroke-width="1" marker-end="url(#arrW)"/>
    <!-- slow marker -->
    <text x="60" y="60" text-anchor="middle" font-size="9" fill="#446688">slow</text>
    <text x="160" y="60" text-anchor="middle" font-size="9" fill="#b85450">fast</text>
    <text x="250" y="80" font-size="9" fill="#555">方向一致 ✓，继续追及</text>
    <text x="250" y="95" font-size="9" fill="#888">slow≠fast</text>
  </g>

  <!-- Step 2 -->
  <text x="20" y="170" font-size="11" fill="#4a7a3a" filter="url(#rough2)">Step 2: slow=next(0)=2, fast=next(next(2))=next(3)=0</text>
  <g filter="url(#rough2)">
    <circle cx="60" cy="200" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="60" y="204" text-anchor="middle" font-size="10" fill="#333">0</text>
    <circle cx="160" cy="200" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="160" y="204" text-anchor="middle" font-size="10" fill="#333">2</text>
    <circle cx="110" cy="255" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="110" y="259" text-anchor="middle" font-size="10" fill="#333">3</text>
    <path d="M 76 198 Q 110 185 144 198" fill="none" stroke="#555" stroke-width="1" marker-end="url(#arrW)"/>
    <path d="M 148 212 Q 130 230 122 242" fill="none" stroke="#555" stroke-width="1" marker-end="url(#arrW)"/>
    <path d="M 98 248 Q 70 230 58 216" fill="none" stroke="#555" stroke-width="1" marker-end="url(#arrW)"/>
    <text x="160" y="180" text-anchor="middle" font-size="9" fill="#446688">slow</text>
    <text x="60" y="180" text-anchor="middle" font-size="9" fill="#b85450">fast</text>
    <text x="250" y="200" font-size="9" fill="#555">方向一致 ✓，继续追及</text>
    <text x="250" y="215" font-size="9" fill="#888">slow≠fast</text>
  </g>

  <!-- Step 3 -->
  <text x="20" y="290" font-size="11" fill="#4a7a3a" filter="url(#rough2)">Step 3: slow=next(2)=3, fast=next(next(0))=next(2)=3</text>
  <g filter="url(#rough2)">
    <circle cx="60" cy="320" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="60" y="324" text-anchor="middle" font-size="10" fill="#333">0</text>
    <circle cx="160" cy="320" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="160" y="324" text-anchor="middle" font-size="10" fill="#333">2</text>
    <circle cx="110" cy="365" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/>
    <text x="110" y="369" text-anchor="middle" font-size="10" fill="#333">3</text>
    <path d="M 76 318 Q 110 305 144 318" fill="none" stroke="#555" stroke-width="1" marker-end="url(#arrW)"/>
    <path d="M 148 332 Q 130 350 122 362" fill="none" stroke="#555" stroke-width="1" marker-end="url(#arrW)"/>
    <path d="M 98 358 Q 70 340 58 326" fill="none" stroke="#555" stroke-width="1" marker-end="url(#arrW)"/>
    <text x="110" y="300" text-anchor="middle" font-size="9" fill="#b85450">fast</text>
    <text x="130" y="365" font-size="9" fill="#446688">slow</text>
    <text x="250" y="320" font-size="10" fill="#4a7a3a">slow == fast → 追上!</text>
    <text x="250" y="335" font-size="9" fill="#555">next(3)=0 ≠ 3, 长度&gt;1</text>
    <text x="250" y="350" font-size="10" fill="#4a7a3a">→ return True ✓</text>
  </g>
</svg>
