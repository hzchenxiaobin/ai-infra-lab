<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：贡献系数 +「最大值开局」的锯齿构造</text>

  <!-- 面板一：跳跃模型 -->
  <rect x="18" y="30" width="484" height="96" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="48" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">① 从地面（高度 0）起跳——每跳燃烧 |Δh|，第 0 号平台被多计数一次</text>

  <path d="M 44 114 L 292 114" stroke="#666" stroke-width="1.3" stroke-dasharray="6 4" fill="none" filter="url(#rough2)"/>
  <text x="48" y="126" font-size="9" fill="#666" filter="url(#rough2)">地面(0)</text>

  <rect x="62" y="60" width="36" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="80" y="54" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">9</text>
  <rect x="152" y="106" width="36" height="8" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="242" y="72" width="36" height="42" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="66" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>

  <path d="M 48 112 C 40 92, 48 72, 64 64" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="36" y="90" font-size="10" fill="#b85450" filter="url(#rough2)">+9</text>
  <path d="M 100 62 C 120 74, 136 92, 150 103" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="116" y="76" font-size="10" fill="#b85450" filter="url(#rough2)">+8</text>
  <path d="M 190 104 C 208 96, 224 86, 240 74" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="206" y="98" font-size="10" fill="#b85450" filter="url(#rough2)">+6</text>

  <text x="312" y="62" font-size="11.5" fill="#333" filter="url(#rough2)">重排 [1,7,9] → [9,1,7]</text>
  <text x="312" y="82" font-size="11.5" fill="#446688" filter="url(#rough2)">卡路里 = 9+8+6 = 23</text>
  <text x="312" y="102" font-size="9.5" fill="#666" filter="url(#rough2)">最大值开局：先从地面爬升 9，</text>
  <text x="312" y="117" font-size="9.5" fill="#666" filter="url(#rough2)">再俯冲到最小值 1 —— 吃满 +2 系数</text>

  <!-- 面板二：排序 + 双指针分发 -->
  <rect x="18" y="134" width="484" height="116" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="152" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">② 排序后双指针分发：大端 j 喂偶数位（峰），小端 i 喂奇数位（谷）</text>

  <rect x="70" y="162" width="36" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="88" y="180" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1</text>
  <rect x="114" y="162" width="36" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="132" y="180" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">7</text>
  <rect x="158" y="162" width="36" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="176" y="180" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">9</text>
  <text x="60" y="178" font-size="9" fill="#666" filter="url(#rough2)">排序</text>
  <text x="88" y="203" font-size="10" fill="#b85450" filter="url(#rough2)">↑i 小端</text>
  <text x="176" y="203" font-size="10" fill="#446688" filter="url(#rough2)">↑j 大端</text>

  <path d="M 208 172 C 244 160, 262 186, 288 174" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="248" y="196" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">分发</text>

  <text x="300" y="156" font-size="9" fill="#666" filter="url(#rough2)">下标 0    1    2</text>
  <rect x="300" y="162" width="36" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="318" y="180" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">9</text>
  <rect x="344" y="162" width="36" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="362" y="180" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1</text>
  <rect x="388" y="162" width="36" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="406" y="180" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">7</text>
  <text x="318" y="203" font-size="9" fill="#446688" filter="url(#rough2)">偶(峰)</text>
  <text x="362" y="203" font-size="9" fill="#b85450" filter="url(#rough2)">奇(谷)</text>
  <text x="406" y="203" font-size="9" fill="#446688" filter="url(#rough2)">偶(峰)</text>

  <text x="60" y="226" font-size="10" fill="#333" filter="url(#rough2)">大端依次给偶数位：9 → 下标 0，7 → 下标 2（非增）</text>
  <text x="60" y="243" font-size="10" fill="#333" filter="url(#rough2)">小端依次给奇数位：1 → 下标 1（非减）—— 正是官方提示的构造</text>

  <!-- 面板三：系数视角 -->
  <rect x="18" y="258" width="484" height="94" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="276" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">③ 系数视角：ans = Σ cᵢ·hᵢ —— 偶位 +2、奇位 −2、末位最弱</text>

  <text x="46" y="301" font-size="10" fill="#666" filter="url(#rough2)">构造</text>
  <rect x="90" y="286" width="38" height="22" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="109" y="302" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="136" y="286" width="38" height="22" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="155" y="302" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="182" y="286" width="38" height="22" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="201" y="302" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="228" y="286" width="38" height="22" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="247" y="302" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="274" y="286" width="38" height="22" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="293" y="302" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>

  <text x="46" y="327" font-size="10" fill="#666" filter="url(#rough2)">系数</text>
  <rect x="90" y="312" width="38" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="109" y="328" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">+2</text>
  <rect x="136" y="312" width="38" height="22" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="155" y="328" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">−2</text>
  <rect x="182" y="312" width="38" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="201" y="328" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">+2</text>
  <rect x="228" y="312" width="38" height="22" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="247" y="328" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">−2</text>
  <rect x="274" y="312" width="38" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="293" y="328" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">+1</text>

  <text x="330" y="296" font-size="11" fill="#333" filter="url(#rough2)">2×5 + 2×4 + 1×3</text>
  <text x="330" y="313" font-size="11" fill="#333" filter="url(#rough2)">− 2×1 − 2×2 = 15</text>
  <text x="330" y="334" font-size="9" fill="#666" filter="url(#rough2)">[1,2,3,4,5] → [5,1,4,2,3]</text>
  <text x="46" y="347" font-size="9.5" fill="#666" filter="url(#rough2)">排序不等式：大值进 +2 槽、小值进 −2 槽；末位系数弱 → 放「余量」（奇数长放中位数，偶数长放小端最大者）</text>
</svg>
