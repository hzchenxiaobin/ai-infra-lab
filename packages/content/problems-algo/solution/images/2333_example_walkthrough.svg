<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：k1=k2=1, K=2, d=[4,4,4,3]</text>
  <text x="300" y="44" text-anchor="middle" font-size="10.5" fill="#888">降序排序后按层级整段削平；红=触发部分摊销的关键步</text>

  <!-- table header band -->
  <rect x="24" y="56" width="552" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="50" y="72" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">j</text>
  <text x="140" y="72" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">当前平台</text>
  <text x="226" y="72" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">下一层 nxt</text>
  <text x="320" y="72" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">cost=j×(d[j−1]−nxt)</text>
  <text x="410" y="72" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">剩余 K</text>
  <text x="512" y="72" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">动作</text>

  <!-- column dividers -->
  <line x1="90" y1="56" x2="90" y2="220" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="186" y1="56" x2="186" y2="220" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="266" y1="56" x2="266" y2="220" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="374" y1="56" x2="374" y2="220" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="450" y1="56" x2="450" y2="220" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- row j=1 -->
  <rect x="24" y="80" width="552" height="28" fill="#f4f8ff" filter="url(#rough2)"/>
  <text x="50" y="99" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">1</text>
  <text x="140" y="99" text-anchor="middle" font-size="11" fill="#333">1 @ d[0]=4</text>
  <text x="226" y="99" text-anchor="middle" font-size="11" fill="#333">d[1]=4</text>
  <text x="320" y="99" text-anchor="middle" font-size="11" fill="#333">1×(4−4)=0</text>
  <text x="410" y="99" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="512" y="99" text-anchor="middle" font-size="10" fill="#4a7a3a">整层削平(免费)→平台 2@4</text>

  <!-- row j=2 -->
  <rect x="24" y="108" width="552" height="28" fill="#f4f8ff" filter="url(#rough2)"/>
  <text x="50" y="127" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">2</text>
  <text x="140" y="127" text-anchor="middle" font-size="11" fill="#333">2 @ d[1]=4</text>
  <text x="226" y="127" text-anchor="middle" font-size="11" fill="#333">d[2]=4</text>
  <text x="320" y="127" text-anchor="middle" font-size="11" fill="#333">2×(4−4)=0</text>
  <text x="410" y="127" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="512" y="127" text-anchor="middle" font-size="10" fill="#4a7a3a">整层削平(免费)→平台 3@4</text>

  <!-- row j=3 (KEY) -->
  <rect x="24" y="136" width="552" height="28" fill="#fce4ec" filter="url(#rough2)"/>
  <text x="50" y="155" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">3</text>
  <text x="140" y="155" text-anchor="middle" font-size="11" fill="#333">3 @ d[2]=4</text>
  <text x="226" y="155" text-anchor="middle" font-size="11" fill="#333">d[3]=3</text>
  <text x="320" y="155" text-anchor="middle" font-size="11" fill="#333">3×(4−3)=3</text>
  <text x="410" y="155" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">2 &lt; 3 ⚠</text>
  <text x="512" y="155" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">削不满→部分摊销</text>

  <!-- result row -->
  <rect x="24" y="172" width="552" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="300" y="192" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">q=K/j=0,  r=K%j=2,  base=d[2]−q=4</text>
  <text x="300" y="210" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2 个降到 base−1=3，1 个保持 base=4，d[3]=3 不变 ⟹ [3,3,4,3]</text>

  <!-- array evolution strip -->
  <text x="300" y="244" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">数组演变</text>

  <!-- before: [4,4,4,3] cells at x=92,140,188,236 w=44 h=30 -->
  <rect x="92" y="252" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="114" y="272" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="140" y="252" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="162" y="272" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="188" y="252" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="210" y="272" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="236" y="252" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="258" y="272" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <text x="166" y="300" text-anchor="middle" font-size="9.5" fill="#888">削峰前 d（降序）</text>

  <!-- arrow -->
  <path d="M290 267 L332 267" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="311" y="260" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">K=2</text>

  <!-- after: [3,3,4,3] cells at x=344,392,440,488 -->
  <rect x="344" y="252" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="366" y="272" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">3</text>
  <rect x="392" y="252" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="414" y="272" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">3</text>
  <rect x="440" y="252" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="462" y="272" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="488" y="252" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="510" y="272" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <text x="440" y="300" text-anchor="middle" font-size="9.5" fill="#888">削峰后（2 个 4 被各削 1）</text>

  <!-- final sum box -->
  <rect x="60" y="318" width="480" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="338" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">差值平方和 = 3² + 3² + 4² + 3² = 9 + 9 + 16 + 9</text>
  <text x="300" y="357" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">= 43  ✓</text>

  <!-- footnote -->
  <text x="300" y="392" text-anchor="middle" font-size="10" fill="#888">相邻同值时 cost=0（免费削平），循环只对「跨层」消耗预算；本题唯一耗预算的层是 j=3</text>
  <text x="300" y="408" text-anchor="middle" font-size="10" fill="#4a7a3a">削峰贪心求出全局最小，与官方「nums1[0]+1、nums2[2]+1」的改法殊途同归</text>
</svg>
