<svg xmlns="http://www.w3.org/2000/svg" width="760" height="640" viewBox="0 0 760 640" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="6" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="760" height="640" fill="#fafafa"/>
  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">扫描线 + 大顶堆：算法流程</text>
  <path d="M 250 40 Q 380 48 510 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ① 生成事件 -->
  <g filter="url(#sk)"><rect x="80" y="52" width="260" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="210" y="77" text-anchor="middle" font-size="12" fill="#333">① 生成事件 (L,−H) 与 (R,+H)</text>
  <path d="M 210 92 L 210 108" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ② 排序 -->
  <g filter="url(#sk)"><rect x="80" y="112" width="260" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="210" y="137" text-anchor="middle" font-size="12" fill="#333">② 按 (x, h) 升序排序</text>
  <path d="M 210 152 L 210 168" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ③ 初始化 -->
  <g filter="url(#sk)"><rect x="80" y="172" width="260" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="210" y="197" text-anchor="middle" font-size="12" fill="#333">③ 初始化 heap=[0], prev=0</text>
  <path d="M 210 212 L 210 228" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 菱形A：还有事件? -->
  <g filter="url(#sk)"><path d="M 210 232 L 300 260 L 210 288 L 120 260 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="210" y="257" text-anchor="middle" font-size="12" fill="#333">还有事件 ?</text>
  <text x="210" y="273" text-anchor="middle" font-size="10" fill="#888">（i &lt; n）</text>
  <!-- 否 → 返回 res -->
  <path d="M 300 260 L 348 260" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="324" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">否</text>
  <g filter="url(#sk)"><rect x="350" y="238" width="200" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="450" y="265" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">返回 res</text>
  <!-- 是 → 下 -->
  <text x="226" y="300" font-size="12" font-weight="bold" fill="#4a7a3a">是</text>
  <path d="M 210 288 L 210 308" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ④ 取同 x 一组 -->
  <g filter="url(#sk)"><rect x="80" y="312" width="260" height="40" rx="8" fill="#fffdf3" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="210" y="337" text-anchor="middle" font-size="12" fill="#333">④ 取同 x 的一组事件</text>
  <path d="M 210 352 L 210 368" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ⑤ 进入/离开 -->
  <g filter="url(#sk)"><rect x="80" y="372" width="260" height="52" rx="8" fill="#fffdf3" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="210" y="392" text-anchor="middle" font-size="12" fill="#333">进入 h&lt;0：push(−h)</text>
  <text x="210" y="410" text-anchor="middle" font-size="12" fill="#333">离开 h&gt;0：removed[h]+=1</text>
  <path d="M 210 424 L 210 440" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ⑥ 清理堆顶 -->
  <g filter="url(#sk)"><rect x="80" y="444" width="260" height="40" rx="8" fill="#fffdf3" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="210" y="469" text-anchor="middle" font-size="12" fill="#333">⑥ 清理堆顶死节点（clean_top）</text>
  <path d="M 210 484 L 210 500" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ⑦ cur=堆顶 -->
  <g filter="url(#sk)"><rect x="80" y="504" width="260" height="40" rx="8" fill="#fffdf3" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="210" y="529" text-anchor="middle" font-size="12" fill="#333">⑦ cur = 堆顶（当前最高）</text>
  <path d="M 210 544 L 210 560" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 菱形B：cur != prev ? -->
  <g filter="url(#sk)"><path d="M 210 564 L 300 592 L 210 620 L 120 592 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="210" y="589" text-anchor="middle" font-size="12" fill="#333">cur != prev ?</text>
  <text x="210" y="605" text-anchor="middle" font-size="10" fill="#888">（高度变化）</text>
  <!-- 是 → 输出 -->
  <path d="M 300 592 L 348 592" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="324" y="584" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">是</text>
  <g filter="url(#sk)"><rect x="350" y="570" width="210" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="455" y="590" text-anchor="middle" font-size="12" fill="#333">输出 [x, cur]</text>
  <text x="455" y="607" text-anchor="middle" font-size="11" fill="#333">prev = cur</text>
  <!-- 否 → 左 -->
  <text x="100" y="584" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">否</text>

  <!-- 回环 trunk：输出box 下→左→上→菱形A 左；否 左→上 菱形A 左 -->
  <path d="M 455 616 L 455 628 L 40 628 L 40 260 L 116 260" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 120 592 L 40 592" stroke="#3a3a3a" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <text x="50" y="430" font-size="11" fill="#888" transform="rotate(-90 50 430)">回到循环开头</text>
</svg>
