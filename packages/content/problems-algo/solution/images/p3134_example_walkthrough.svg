<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold" filter="url(#rough2)">示例 3 演算：nums = [4,3,5,4]，m = 10，k = ⌈10/2⌉ = 5</text>

  <!-- binary search steps -->
  <rect x="40" y="36" width="440" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="260" y="54" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">① lo=1, hi=4 → mid=2：count(2) = 7 ≥ 5 ✓ → hi ← 2</text>

  <rect x="40" y="68" width="440" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="260" y="86" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">② lo=1, hi=2 → mid=1：count(1) = 4 &lt; 5 ✗ → lo ← 2</text>

  <rect x="40" y="100" width="440" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="118" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">③ lo = hi = 2 → 返回答案 2</text>

  <!-- table header -->
  <text x="70" y="152" text-anchor="start" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">count(2) 的滑窗过程（t = 2）：</text>

  <rect x="40" y="162" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="60" y="180" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">r</text>
  <rect x="80" y="162" width="86" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="123" y="180" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">收缩后窗口</text>
  <rect x="166" y="162" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="201" y="180" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">distinct</text>
  <rect x="236" y="162" width="84" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="278" y="180" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">收缩动作</text>
  <rect x="320" y="162" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="355" y="180" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">累加</text>
  <rect x="390" y="162" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="425" y="180" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">ans</text>

  <!-- table rows -->
  <rect x="40" y="190" width="40" height="24" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="207" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="80" y="190" width="86" height="24" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="123" y="207" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[4]</text>
  <rect x="166" y="190" width="70" height="24" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="201" y="207" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="236" y="190" width="84" height="24" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="278" y="207" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">—</text>
  <rect x="320" y="190" width="70" height="24" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="355" y="207" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+1</text>
  <rect x="390" y="190" width="70" height="24" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="425" y="207" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>

  <rect x="40" y="216" width="40" height="24" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="233" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="80" y="216" width="86" height="24" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="123" y="233" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[4,3]</text>
  <rect x="166" y="216" width="70" height="24" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="201" y="233" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="236" y="216" width="84" height="24" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="278" y="233" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">—</text>
  <rect x="320" y="216" width="70" height="24" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="355" y="233" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+2</text>
  <rect x="390" y="216" width="70" height="24" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="425" y="233" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>

  <rect x="40" y="242" width="40" height="24" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="259" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="80" y="242" width="86" height="24" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="123" y="259" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[3,5]</text>
  <rect x="166" y="242" width="70" height="24" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="201" y="259" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="236" y="242" width="84" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="278" y="259" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">移出 4</text>
  <rect x="320" y="242" width="70" height="24" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="355" y="259" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+2</text>
  <rect x="390" y="242" width="70" height="24" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="425" y="259" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">5</text>

  <rect x="40" y="268" width="40" height="24" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="285" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="80" y="268" width="86" height="24" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="123" y="285" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[5,4]</text>
  <rect x="166" y="268" width="70" height="24" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="201" y="285" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="236" y="268" width="84" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="278" y="285" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">移出 3</text>
  <rect x="320" y="268" width="70" height="24" fill="#ffffff" stroke="#999999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="355" y="285" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+2</text>
  <rect x="390" y="268" width="70" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="425" y="285" text-anchor="middle" font-size="10.5" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">7</text>

  <!-- conclusion -->
  <rect x="40" y="304" width="440" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="322" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">count(2) = 7 ≥ k = 5 而 count(1) = 4 &lt; 5 ⇒ 第 5 小 = 2</text>
  <text x="260" y="340" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">与唯一性数组 [1,1,1,1,2,2,2,3,3,3] 的第 5 个元素吻合 ✓</text>

  <!-- bottom note -->
  <rect x="40" y="356" width="440" height="28" fill="#fafafa" stroke="#888888" stroke-width="1.2" stroke-dasharray="4 3" rx="8" filter="url(#rough2)"/>
  <text x="260" y="375" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">r = 2 时窗口先成 [4,3,5]（3 种 &gt; 2）才收缩左端移出 4</text>
</svg>
