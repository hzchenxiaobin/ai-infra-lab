<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：BFS 逐层累加 sum / count，层末算均值</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">vs 102：把 level.push(val) 换成 sum += val；sum 用 long long 防溢出</text>

  <g font-size="10" fill="#333">
    <!-- Step 1: init -->
    <rect x="40" y="64" width="460" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="84" font-size="12" fill="#446688" font-weight="bold">① 初始化</text>
    <text x="140" y="84" font-family="monospace" font-size="10" fill="#555">if (!root) return {};  queue.push(root);</text>
    <text x="140" y="100" font-size="9" fill="#888">特判空树，根节点入队（题面保证非空，仍保留习惯）</text>

    <path d="M 270 110 L 270 124" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 2: while -->
    <rect x="40" y="128" width="460" height="150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="148" font-size="12" fill="#4a7a3a" font-weight="bold">② while 队列非空</text>
    <text x="54" y="166" font-family="monospace" font-size="10" fill="#555">while (!queue.empty()) {</text>
    <text x="70" y="182" font-family="monospace" font-size="10" fill="#d6a040">int size = queue.size();</text>
    <text x="70" y="198" font-family="monospace" font-size="10" fill="#b85450">long long sum = 0;        // ⭐ 防 32 位溢出</text>
    <text x="70" y="214" font-family="monospace" font-size="10" fill="#446688">for (int i = 0; i &lt; size; ++i) {</text>
    <text x="86" y="230" font-family="monospace" font-size="10" fill="#b85450">node = queue.front(); queue.pop();</text>
    <text x="86" y="246" font-family="monospace" font-size="10" fill="#b85450">sum += node-&gt;val;          // 累加而非收集</text>
    <text x="86" y="262" font-family="monospace" font-size="10" fill="#4a7a3a">if (node-&gt;left)  queue.push(node-&gt;left);</text>
    <text x="86" y="276" font-family="monospace" font-size="10" fill="#4a7a3a">if (node-&gt;right) queue.push(node-&gt;right);</text>

    <path d="M 270 282 L 270 296" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 3: layer end -->
    <rect x="40" y="300" width="460" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="318" font-family="monospace" font-size="10" fill="#555">}  // end for</text>
    <text x="54" y="334" font-family="monospace" font-size="10" fill="#b85450">result.push_back((double)sum / size);  // 层末算均值</text>
    <text x="54" y="350" font-family="monospace" font-size="10" fill="#555">}  // end while</text>

    <path d="M 270 360 L 270 374" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 4: return -->
    <rect x="40" y="378" width="460" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="398" font-size="12" fill="#b85450" font-weight="bold">③ 返回</text>
    <text x="110" y="398" font-family="monospace" font-size="10" fill="#555">return result;   // [3.0, 14.5, 11.0]</text>
    <text x="110" y="414" font-size="9" fill="#888">每层一个 double，外层按层顺序排列</text>
  </g>

  <text x="270" y="434" text-anchor="middle" font-size="9" fill="#888">count = size（当前层快照即该层节点数）→ 无需单独维护计数器</text>
</svg>
