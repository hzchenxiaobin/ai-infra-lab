  </defs>

  <rect width="560" height="270" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：三组输入的频率统计与瓶颈分析</text>
  <text x="280" y="40" text-anchor="middle" font-size="10" fill="#888">答案 = min(⌊count[b]÷1⌋, ⌊count[a]÷1⌋, ⌊count[l]÷2⌋, ⌊count[o]÷2⌋, ⌊count[n]÷1⌋)</text>

