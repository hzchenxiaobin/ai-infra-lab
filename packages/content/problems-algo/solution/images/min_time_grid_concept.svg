<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">网格最少时间：Dijkstra + 奇偶等待</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">必须不停移动 → 来回弹跳 2 步一轮来“等待”解锁</text>

  <!-- ===== Grid 3x4 ===== -->
  <text x="40" y="76" font-size="11" fill="#446688" font-weight="bold">示例 1：grid（绿格 = 最优路径，标到达时刻）</text>

  <!-- cells: x0=40, y0=86, size 54 -->
  <!-- row 0 -->
  <rect x="40" y="86" width="54" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="67" y="110" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="67" y="128" text-anchor="middle" font-size="9" fill="#4a7a3a">t=0</text>

  <rect x="96" y="86" width="54" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="123" y="110" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="123" y="128" text-anchor="middle" font-size="9" fill="#4a7a3a">t=1</text>

  <rect x="152" y="86" width="54" height="54" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="179" y="113" text-anchor="middle" font-size="13" fill="#888">3</text>

  <rect x="208" y="86" width="54" height="54" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="235" y="113" text-anchor="middle" font-size="13" fill="#888">2</text>

  <!-- row 1 -->
  <rect x="40" y="142" width="54" height="54" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="67" y="169" text-anchor="middle" font-size="13" fill="#888">5</text>

  <rect x="96" y="142" width="54" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="123" y="166" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="123" y="184" text-anchor="middle" font-size="9" fill="#4a7a3a">t=2,4,5</text>

  <rect x="152" y="142" width="54" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="179" y="166" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="179" y="184" text-anchor="middle" font-size="9" fill="#4a7a3a">t=3,5</text>

  <rect x="208" y="142" width="54" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="235" y="166" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">5</text>
  <text x="235" y="184" text-anchor="middle" font-size="9" fill="#4a7a3a">t=6</text>

  <!-- row 2 -->
  <rect x="40" y="198" width="54" height="54" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="67" y="225" text-anchor="middle" font-size="13" fill="#888">4</text>

  <rect x="96" y="198" width="54" height="54" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="123" y="225" text-anchor="middle" font-size="13" fill="#888">3</text>

  <rect x="152" y="198" width="54" height="54" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="179" y="225" text-anchor="middle" font-size="13" fill="#888">8</text>

  <rect x="208" y="198" width="54" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="235" y="222" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">6</text>
  <text x="235" y="240" text-anchor="middle" font-size="9" fill="#b85450">终点 t=7</text>

  <!-- oscillation curved arrow (1,2) -> (1,1) -> (1,2) -> (1,3) -->
  <path d="M 165 152 Q 130 138 165 152" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="135" y="136" text-anchor="middle" font-size="9" fill="#d6a040">弹回</text>

  <!-- ===== Right panel: parity formula ===== -->
  <rect x="300" y="86" width="240" height="166" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="420" y="108" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">从 (r,c) 时刻 d → 邻居 g</text>

  <text x="316" y="132" font-size="11" fill="#555">不停移动 ⇒ 走奇数步：</text>
  <text x="330" y="150" font-size="11" fill="#446688" font-weight="bold">{d+1, d+3, d+5, …}</text>
  <text x="316" y="168" font-size="11" fill="#555">取其中 ≥ g 的最小值：</text>

  <rect x="320" y="176" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="420" y="195" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">nd = max(d+1, g)</text>

  <text x="316" y="222" font-size="11" fill="#b85450" font-weight="bold">若 (nd−d) 偶数 → nd++</text>
  <text x="316" y="238" font-size="9" fill="#888">凑成奇数步（来回弹跳一轮 +2）</text>

  <!-- ===== bottom: oscillation timeline ===== -->
  <text x="40" y="284" font-size="11" fill="#446688" font-weight="bold">“等待”靠弹跳：C→P→C→P（每轮 +2）</text>
  <g font-size="10">
    <rect x="40" y="294" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="62" y="313" text-anchor="middle" fill="#446688" font-weight="bold">C</text>
    <text x="62" y="288" text-anchor="middle" font-size="8" fill="#888">d</text>

    <path d="M 84 309 L 108 309" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <rect x="110" y="294" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="132" y="313" text-anchor="middle" fill="#b85450" font-weight="bold">P</text>
    <text x="132" y="288" text-anchor="middle" font-size="8" fill="#888">d+1</text>

    <path d="M 154 309 L 178 309" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <rect x="180" y="294" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="202" y="313" text-anchor="middle" fill="#446688" font-weight="bold">C</text>
    <text x="202" y="288" text-anchor="middle" font-size="8" fill="#888">d+2</text>

    <path d="M 224 309 L 248 309" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <rect x="250" y="294" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="272" y="313" text-anchor="middle" fill="#4a7a3a" font-weight="bold">N</text>
    <text x="272" y="288" text-anchor="middle" font-size="8" fill="#4a7a3a">≥g</text>

    <text x="298" y="313" font-size="9" fill="#888">P 是来路邻居，阈值早解锁 ⇒ 可弹回</text>
  </g>

  <!-- special start note -->
  <rect x="40" y="346" width="500" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="364" font-size="11" fill="#b85450" font-weight="bold">⚠ 起点特判：</text>
  <text x="56" y="380" font-size="10" fill="#555">若 grid[0][1]&gt;1 且 grid[1][0]&gt;1 ⇒ 第 1 步走不出去（无来路可弹）→ 返回 −1</text>

  <text x="40" y="408" font-size="10" fill="#888">边权 = nd−d ≥ 1 恒正 ⇒ Dijkstra 贪心有效；终点首次出队即答案</text>
</svg>
