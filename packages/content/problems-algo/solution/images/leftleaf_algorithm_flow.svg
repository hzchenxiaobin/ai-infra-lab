<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：在父节点处判定左孩子是否为叶子</text>

  <!-- entry -->
  <rect x="200" y="40" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="58" text-anchor="middle" font-size="11" fill="#333">进入 dfs(node)</text>

  <!-- arrow down -->
  <path d="M 260 68 L 260 82" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 1: node == null? -->
  <polygon points="260,84 332,114 260,144 188,114" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="118" text-anchor="middle" font-size="11" fill="#333">node == null?</text>

  <!-- yes branch (right) -->
  <path d="M 332 114 L 372 114" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="352" y="108" text-anchor="middle" font-size="9" fill="#b85450">Yes</text>
  <rect x="374" y="100" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="424" y="118" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return 0</text>

  <!-- no branch (down) -->
  <path d="M 260 144 L 260 168" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="272" y="160" font-size="9" fill="#4a7a3a">No</text>

  <!-- diamond 2: node.left 是叶子? -->
  <polygon points="260,170 360,206 260,242 160,206" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="202" text-anchor="middle" font-size="10" fill="#333">node.left 存在</text>
  <text x="260" y="216" text-anchor="middle" font-size="10" fill="#333">且是叶子?</text>

  <!-- yes branch (right) -->
  <path d="M 360 206 L 392 206" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="378" y="200" text-anchor="middle" font-size="9" fill="#4a7a3a">Yes</text>
  <rect x="394" y="186" width="116" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="452" y="204" text-anchor="middle" font-size="10" fill="#333">左贡献 = node.left.val</text>
  <text x="452" y="220" text-anchor="middle" font-size="9" fill="#888">（不递归进左孩子）</text>

  <!-- no branch (left) -->
  <path d="M 160 206 L 128 206" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="144" y="200" text-anchor="middle" font-size="9" fill="#446688">No</text>
  <rect x="10" y="186" width="116" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="68" y="204" text-anchor="middle" font-size="10" fill="#333">左贡献 = dfs(node.left)</text>
  <text x="68" y="220" text-anchor="middle" font-size="9" fill="#888">（继续往下找）</text>

  <!-- merge arrows down to combine box -->
  <path d="M 452 228 L 452 252 L 320 258" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 68 228 L 68 252 L 200 258" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- combine: + dfs(right) -->
  <rect x="130" y="250" width="260" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="270" text-anchor="middle" font-size="11" fill="#333">总贡献 = 左贡献 + dfs(node.right)</text>

  <!-- arrow down -->
  <path d="M 260 280 L 260 296" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- return -->
  <rect x="190" y="298" width="140" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="316" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return 总贡献</text>

  <text x="260" y="346" text-anchor="middle" font-size="9" fill="#888">关键：左叶子的身份在父节点处判定，叶子自身无法判断</text>
</svg>
