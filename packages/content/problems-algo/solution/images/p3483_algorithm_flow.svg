<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：计数 + 值域三重枚举（共 450 种组合）</text>

  <!-- ===== 主流程 ===== -->
  <rect x="50" y="38" width="230" height="26" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="165" y="55" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">① 统计计数 cnt[0…9]</text>
  <path d="M 165 64 L 165 76" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="50" y="80" width="230" height="26" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="165" y="97" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">② 枚举百位 h = 1 … 9</text>
  <path d="M 165 106 L 165 118" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="50" y="122" width="230" height="26" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="165" y="139" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">③ 枚举十位 t = 0 … 9</text>
  <path d="M 165 148 L 165 160" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="50" y="164" width="230" height="26" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="165" y="181" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">④ 枚举个位 u ∈ {0,2,4,6,8}</text>
  <path d="M 165 190 L 165 202" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="165,204 292,240 165,276 38,240" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="165" y="235" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">cnt 扣减 h、t、u 各一个后</text>
  <text x="165" y="251" text-anchor="middle" font-size="11.5" fill="#8a6d3a" font-weight="bold" filter="url(#rough2)">均 ≥ 0 ？</text>

  <path d="M 292 240 L 326 240" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="306" y="232" text-anchor="middle" font-size="11" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="330" y="226" width="96" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="378" y="244" text-anchor="middle" font-size="12" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">ans += 1</text>

  <path d="M 165 276 L 165 304" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="176" y="294" font-size="10.5" fill="#b85450" filter="url(#rough2)">否（跳过该组合）</text>

  <rect x="50" y="308" width="230" height="26" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="165" y="325" text-anchor="middle" font-size="11.5" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">⑤ 枚举完全部组合 → 返回 ans</text>

  <path d="M 378 254 C 378 294, 330 318, 286 321" fill="none" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- ===== 右侧要点 ===== -->
  <rect x="316" y="38" width="188" height="168" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.2" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="410" y="58" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">三个要点</text>
  <text x="326" y="80" font-size="10.5" fill="#333" filter="url(#rough2)">· 枚举「值」，不枚举「下标」</text>
  <text x="334" y="96" font-size="10" fill="#666" filter="url(#rough2)">同一数值只会被枚举一次</text>
  <text x="326" y="118" font-size="10.5" fill="#333" filter="url(#rough2)">· 临时扣减 → 判断 → 恢复</text>
  <text x="334" y="134" font-size="10" fill="#666" filter="url(#rough2)">cnt 全程不被破坏</text>
  <text x="326" y="156" font-size="10.5" fill="#333" filter="url(#rough2)">· 总组合数 9×10×5 = 450</text>
  <text x="334" y="172" font-size="10" fill="#666" filter="url(#rough2)">常数规模，无需任何剪枝</text>
  <text x="326" y="194" font-size="10" fill="#999" filter="url(#rough2)">（n ≤ 10，计数本身就是 O(n)）</text>

  <text x="260" y="352" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">时间 O(n + 450)，空间 O(10) —— 双重常数，怎么跑都秒</text>
</svg>
