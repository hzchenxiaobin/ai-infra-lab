<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：升序排序后，最优选择 = 某个后缀</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888">排序不等式：大满意度配大系数 ⇒ 升序做；最负的拖累 ⇒ 丢弃前缀</text>

  <!-- ===== Top: raw array ===== -->
  <text x="60" y="78" font-size="11" fill="#446688" font-weight="bold">原始数组 satisfaction = [-1,-8,0,5,-9]</text>
  <g font-size="12">
    <rect x="60" y="86" width="48" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="84" y="106" text-anchor="middle" fill="#333">-1</text>
    <rect x="110" y="86" width="48" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="134" y="106" text-anchor="middle" fill="#333">-8</text>
    <rect x="160" y="86" width="48" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="184" y="106" text-anchor="middle" fill="#333">0</text>
    <rect x="210" y="86" width="48" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="234" y="106" text-anchor="middle" fill="#333">5</text>
    <rect x="260" y="86" width="48" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="284" y="106" text-anchor="middle" fill="#333">-9</text>
  </g>

  <!-- sort arrow -->
  <path d="M 168 124 L 168 150" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="180" y="142" font-size="10" fill="#b85450" font-weight="bold">升序排序</text>

  <!-- ===== Middle: sorted array with multipliers ===== -->
  <text x="60" y="170" font-size="11" fill="#446688" font-weight="bold">升序排序后 s = [-9,-8,-1,0,5]</text>

  <!-- multiplier row (k = 1..5), aligned under chosen suffix -->
  <text x="40" y="200" font-size="10" fill="#888" font-weight="bold">系数 k:</text>
  <g font-size="11" fill="#d6a040" font-weight="bold">
    <text x="84" y="200" text-anchor="middle">1</text>
    <text x="134" y="200" text-anchor="middle">2</text>
    <text x="184" y="200" text-anchor="middle">3</text>
    <text x="234" y="200" text-anchor="middle">4</text>
    <text x="284" y="200" text-anchor="middle">5</text>
  </g>

  <!-- sorted value boxes: drop prefix [-9,-8] (gray dashed), keep suffix [-1,0,5] (green highlight) -->
  <g font-size="12">
    <!-- dropped -9 -->
    <rect x="60" y="208" width="48" height="30" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="84" y="228" text-anchor="middle" fill="#bbb">-9</text>
    <!-- dropped -8 -->
    <rect x="110" y="208" width="48" height="30" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="134" y="228" text-anchor="middle" fill="#bbb">-8</text>
    <!-- kept -1 (orange: negative but worth keeping) -->
    <rect x="160" y="208" width="48" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="184" y="228" text-anchor="middle" fill="#d6a040" font-weight="bold">-1</text>
    <!-- kept 0 -->
    <rect x="210" y="208" width="48" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="234" y="228" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>
    <!-- kept 5 -->
    <rect x="260" y="208" width="48" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
    <text x="284" y="228" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>
  </g>

  <!-- bracket: drop prefix -->
  <path d="M 60 246 L 60 252 L 158 252 L 158 246" stroke="#bbb" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="109" y="266" text-anchor="middle" font-size="10" fill="#888">丢弃(最负, 拖累)</text>

  <!-- bracket: keep suffix -->
  <path d="M 160 246 L 160 252 L 308 252 L 308 246" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="234" y="266" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">保留后缀 [-1,0,5]</text>

  <!-- ===== Right: computation ===== -->
  <rect x="350" y="170" width="250" height="110" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="475" y="192" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">取后缀 [-1,0,5] 的收益</text>
  <text x="370" y="214" font-size="11" fill="#333">= 1×(-1) + 2×0 + 3×5</text>
  <text x="370" y="234" font-size="11" fill="#333">= -1 + 0 + 15</text>
  <text x="370" y="262" font-size="14" fill="#4a7a3a" font-weight="bold">= 14  ✓ (最大)</text>

  <!-- ===== Bottom: formula box ===== -->
  <rect x="40" y="300" width="560" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="322" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">最优收益 = max(0, max_i f(i))，f(i) = 取后缀 s[i..n-1] 的收益</text>
  <text x="320" y="340" text-anchor="middle" font-size="10" fill="#888">负数是否保留由「后缀和符号」决定：后缀和 &gt; 0 则保留赚、≤ 0 则丢弃</text>

  <!-- legend -->
  <g font-size="10" fill="#555">
    <rect x="40" y="370" width="14" height="12" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="60" y="380">保留(正/有益)</text>
    <rect x="160" y="370" width="14" height="12" rx="2" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="180" y="380">负但值得保留</text>
    <rect x="300" y="370" width="14" height="12" rx="2" fill="#f0f0f0" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="320" y="380">丢弃(纯拖累)</text>
  </g>
  <text x="320" y="404" text-anchor="middle" font-size="10" fill="#888">同序配对：系数 1,2,3,... 递增 ⇒ 满意度也升序配对最划算（排序不等式）</text>
</svg>
