<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
  </defs>
  <rect width="760" height="520" fill="#fdfcf7"/>

  <text x="380" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">示例演算：S = "abcdebdde"，T = "bde"</text>
  <path d="M 220 40 Q 380 48 540 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- table layout: cols -> i, S[i], dp[i][0]=b, dp[i][1]=d, dp[i][2]=e, 窗口 -->
  <!-- col x centers: 70, 130, 230, 330, 430, 560 ; row height 30, start y=70 -->
  <!-- header -->
  <g filter="url(#sk)"><rect x="40" y="62" width="680" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="70"  y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">i</text>
  <text x="130" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">S[i]</text>
  <text x="230" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">dp[i][0] (b)</text>
  <text x="330" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">dp[i][1] (d)</text>
  <text x="430" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">dp[i][2] (e)</text>
  <text x="560" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">窗口 (结尾于 i)</text>

  <!-- vertical separators -->
  <path d="M 100 62 L 100 430" stroke="#ddd" stroke-width="1" filter="url(#sk)"/>
  <path d="M 170 62 L 170 430" stroke="#ddd" stroke-width="1" filter="url(#sk)"/>
  <path d="M 280 62 L 280 430" stroke="#ddd" stroke-width="1" filter="url(#sk)"/>
  <path d="M 380 62 L 380 430" stroke="#ddd" stroke-width="1" filter="url(#sk)"/>
  <path d="M 480 62 L 480 430" stroke="#ddd" stroke-width="1" filter="url(#sk)"/>

  <!-- rows data: i, S[i], dp0, dp1, dp2, window -->
  <!-- row y centers: 70+34 + 15 + k*30 = 119 + k*30 ; k=0..8 -->
  <!-- highlight rows: i=4 (len4 bcde) and i=8 (len4 bdde) -->

  <!-- row i=0 a -1 -1 -1 -->
  <text x="70"  y="119" text-anchor="middle" font-size="12" fill="#444">0</text>
  <text x="130" y="119" text-anchor="middle" font-size="12" fill="#888">a</text>
  <text x="230" y="119" text-anchor="middle" font-size="12" fill="#bbb">-1</text>
  <text x="330" y="119" text-anchor="middle" font-size="12" fill="#bbb">-1</text>
  <text x="430" y="119" text-anchor="middle" font-size="12" fill="#bbb">-1</text>
  <text x="560" y="119" text-anchor="middle" font-size="11" fill="#bbb">—</text>

  <!-- row i=1 b 1 -1 -1 -->
  <text x="70"  y="149" text-anchor="middle" font-size="12" fill="#444">1</text>
  <text x="130" y="149" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">b</text>
  <text x="230" y="149" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="330" y="149" text-anchor="middle" font-size="12" fill="#bbb">-1</text>
  <text x="430" y="149" text-anchor="middle" font-size="12" fill="#bbb">-1</text>
  <text x="560" y="149" text-anchor="middle" font-size="11" fill="#bbb">—</text>

  <!-- row i=2 c 1 -1 -1 -->
  <text x="70"  y="179" text-anchor="middle" font-size="12" fill="#444">2</text>
  <text x="130" y="179" text-anchor="middle" font-size="12" fill="#888">c</text>
  <text x="230" y="179" text-anchor="middle" font-size="12" fill="#444">1</text>
  <text x="330" y="179" text-anchor="middle" font-size="12" fill="#bbb">-1</text>
  <text x="430" y="179" text-anchor="middle" font-size="12" fill="#bbb">-1</text>
  <text x="560" y="179" text-anchor="middle" font-size="11" fill="#bbb">—</text>

  <!-- row i=3 d 1 1 -1 -->
  <text x="70"  y="209" text-anchor="middle" font-size="12" fill="#444">3</text>
  <text x="130" y="209" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">d</text>
  <text x="230" y="209" text-anchor="middle" font-size="12" fill="#444">1</text>
  <text x="330" y="209" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="430" y="209" text-anchor="middle" font-size="12" fill="#bbb">-1</text>
  <text x="560" y="209" text-anchor="middle" font-size="11" fill="#bbb">—</text>

  <!-- row i=4 e 1 1 1  -> bcde len4 highlight -->
  <g filter="url(#sk)"><rect x="40" y="195" width="680" height="28" rx="3" fill="#eaf6ee" stroke="none" opacity="0.55"/></g>
  <text x="70"  y="239" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">4</text>
  <text x="130" y="239" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">e</text>
  <text x="230" y="239" text-anchor="middle" font-size="12" fill="#444">1</text>
  <text x="330" y="239" text-anchor="middle" font-size="12" fill="#444">1</text>
  <text x="430" y="239" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="560" y="239" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">bcde (len 4) ✓</text>

  <!-- row i=5 b 5 1 1 -->
  <text x="70"  y="269" text-anchor="middle" font-size="12" fill="#444">5</text>
  <text x="130" y="269" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">b</text>
  <text x="230" y="269" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">5</text>
  <text x="330" y="269" text-anchor="middle" font-size="12" fill="#444">1</text>
  <text x="430" y="269" text-anchor="middle" font-size="12" fill="#444">1</text>
  <text x="560" y="269" text-anchor="middle" font-size="11" fill="#888">S[1..5] len 5</text>

  <!-- row i=6 d 5 5 1 -->
  <text x="70"  y="299" text-anchor="middle" font-size="12" fill="#444">6</text>
  <text x="130" y="299" text-anchor="middle" font-size="12" fill="#888">d</text>
  <text x="230" y="299" text-anchor="middle" font-size="12" fill="#444">5</text>
  <text x="330" y="299" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">5</text>
  <text x="430" y="299" text-anchor="middle" font-size="12" fill="#444">1</text>
  <text x="560" y="299" text-anchor="middle" font-size="11" fill="#888">S[1..6] len 6</text>

  <!-- row i=7 d 5 5 1 -->
  <text x="70"  y="329" text-anchor="middle" font-size="12" fill="#444">7</text>
  <text x="130" y="329" text-anchor="middle" font-size="12" fill="#888">d</text>
  <text x="230" y="329" text-anchor="middle" font-size="12" fill="#444">5</text>
  <text x="330" y="329" text-anchor="middle" font-size="12" fill="#444">5</text>
  <text x="430" y="329" text-anchor="middle" font-size="12" fill="#444">1</text>
  <text x="560" y="329" text-anchor="middle" font-size="11" fill="#888">S[1..7] len 7</text>

  <!-- row i=8 e 5 5 5 -> bdde len4 highlight -->
  <g filter="url(#sk)"><rect x="40" y="315" width="680" height="28" rx="3" fill="#fce4ec" stroke="none" opacity="0.5"/></g>
  <text x="70"  y="359" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">8</text>
  <text x="130" y="359" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">e</text>
  <text x="230" y="359" text-anchor="middle" font-size="12" fill="#444">5</text>
  <text x="330" y="359" text-anchor="middle" font-size="12" fill="#444">5</text>
  <text x="430" y="359" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">5</text>
  <text x="560" y="359" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">bdde (len 4)</text>

  <!-- table outer border -->
  <path d="M 40 62 L 40 430" stroke="#bbb" stroke-width="1.4" filter="url(#sk)"/>
  <path d="M 720 62 L 720 430" stroke="#bbb" stroke-width="1.4" filter="url(#sk)"/>
  <path d="M 40 430 L 720 430" stroke="#bbb" stroke-width="1.4" filter="url(#sk)"/>

  <!-- conclusion -->
  <g filter="url(#sk)">
    <rect x="40" y="450" width="680" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="5 3"/>
  </g>
  <text x="60" y="474" font-size="12" font-weight="bold" fill="#7a5415">结论：</text>
  <text x="60" y="494" font-size="11" fill="#444">两个长度 4 的窗口：i=4 → "bcde"（起点 1），i=8 → "bdde"（起点 5）。长度相同取最左 → 返回 "bcde"。</text>
</svg>
