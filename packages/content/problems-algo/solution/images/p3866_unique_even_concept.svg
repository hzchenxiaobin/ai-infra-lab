<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：计数与判定分离 —— freq 先定型，再按原序查双条件</text>

  <!-- nums 数组 -->
  <text x="36" y="45" font-size="11" fill="#888" filter="url(#rough2)">示例 1：nums =</text>

  <rect x="150" y="52" width="38" height="28" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="169" y="71" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="192" y="52" width="38" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="211" y="71" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="234" y="52" width="38" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="253" y="71" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="276" y="52" width="38" height="28" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="295" y="71" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="318" y="52" width="38" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="337" y="71" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="360" y="52" width="38" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="379" y="71" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">6</text>

  <text x="169" y="92" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="211" y="92" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="253" y="92" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="295" y="92" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>
  <text x="337" y="92" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">4</text>
  <text x="379" y="92" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">5</text>

  <rect x="412" y="54" width="10" height="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="428" y="63" font-size="10" fill="#666" filter="url(#rough2)">偶数</text>
  <rect x="412" y="72" width="10" height="10" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="428" y="81" font-size="10" fill="#666" filter="url(#rough2)">奇数</text>

  <!-- 第一趟：freq -->
  <path d="M 274 98 L 274 136" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="36" y="110" width="180" height="24" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="126" y="126" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">① 第一趟：统计 freq 定型</text>

  <rect x="36" y="142" width="58" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="65" y="158" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">3 → 1</text>
  <rect x="100" y="142" width="58" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="129" y="158" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">4 → 2</text>
  <rect x="164" y="142" width="58" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="193" y="158" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">2 → 1</text>
  <rect x="228" y="142" width="58" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="257" y="158" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">5 → 1</text>
  <rect x="292" y="142" width="58" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="321" y="158" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">6 → 1</text>

  <rect x="356" y="140" width="160" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="436" y="152" text-anchor="middle" font-size="9.5" fill="#a0433f" filter="url(#rough2)">下标 3 的第二个 4</text>
  <text x="436" y="165" text-anchor="middle" font-size="9.5" fill="#a0433f" filter="url(#rough2)">把 freq[4] 改写成 2</text>

  <!-- 第二趟：判定 -->
  <path d="M 193 170 L 193 179" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="36" y="182" width="180" height="24" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="126" y="198" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">② 第二趟：按原序逐个判定</text>

  <!-- 行 1：x=3 -->
  <rect x="36" y="216" width="32" height="24" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="52" y="232" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">3</text>
  <path d="M 70 228 L 86 228" fill="none" stroke="#888" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="94" y="232" font-size="10.5" fill="#666" filter="url(#rough2)">奇数 —— 第一个条件（偶数）就不过</text>
  <circle cx="396" cy="228" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="396" y="232" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <!-- 行 2：x=4 -->
  <rect x="36" y="244" width="32" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="52" y="260" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">4</text>
  <path d="M 70 256 L 86 256" fill="none" stroke="#888" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="94" y="260" font-size="10.5" fill="#333" filter="url(#rough2)">偶数 ✓，但 freq[4] = 2 ≠ 1</text>
  <circle cx="396" cy="256" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="396" y="260" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <!-- 行 3：x=2（命中，绿色高亮带） -->
  <rect x="30" y="270" width="482" height="30" rx="6" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="36" y="272" width="32" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="52" y="288" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">2</text>
  <path d="M 70 284 L 86 284" fill="none" stroke="#888" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="94" y="288" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">偶数 ✓ 且 freq[2] = 1 —— 双条件命中</text>
  <circle cx="396" cy="284" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="396" y="288" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="414" y="288" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">→ 返回 2</text>

  <!-- 底部洞察 -->
  <rect x="30" y="308" width="460" height="42" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="326" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">💡 为什么计数与判定必须分两趟？</text>
  <text x="260" y="343" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">下标 1 的 4「当下看似唯一」，下标 3 的第二个 4 才把它否决 —— 次数须全数组扫完才定型</text>
</svg>
