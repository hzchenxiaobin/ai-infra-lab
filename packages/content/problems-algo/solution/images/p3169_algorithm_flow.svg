<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="500" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：排序 → 线性扫描数空隙 → 补尾部收尾</text>

  <rect x="160" y="38" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="270" y="59" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">按左端点排序 meetings</text>

  <path d="M 270 72 L 270 88" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="130" y="92" width="280" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="270" y="113" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">free = 0；cur_end = 0（哨兵：第 0 天）</text>

  <path d="M 270 126 L 270 144" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="160" y="148" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="270" y="169" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">取下一个会议 [s, e]</text>

  <path d="M 270 182 L 270 200" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="175,236 270,204 365,236 270,268" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="241" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">s &gt; cur_end ?</text>

  <path d="M 365 236 L 394 236" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="378" y="228" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="398" y="220" width="112" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="454" y="240" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">free += s−cur_end−1</text>

  <path d="M 454 252 L 454 313 L 386 313" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <path d="M 270 268 L 270 294" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="280" y="286" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="160" y="298" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="270" y="319" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">cur_end = max(cur_end, e)</text>

  <path d="M 270 332 L 270 348" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="205,382 270,350 335,382 270,414" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="387" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">还有会议 ?</text>

  <path d="M 205 382 L 92 382 L 92 167 L 152 167" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="188" y="376" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <path d="M 270 414 L 270 438" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="280" y="430" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="130" y="442" width="280" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="464" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">free += days − cur_end → 返回 free</text>

  <rect x="392" y="352" width="112" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="448" y="372" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">复杂度</text>
  <text x="448" y="390" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">排序 O(n log n)</text>
  <text x="448" y="406" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">扫描 O(n)</text>
  <text x="448" y="422" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">空间 O(1)</text>
</svg>
