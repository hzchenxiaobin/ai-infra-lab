<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：找一条「根→叶」路径，使路径和 = targetSum</text>

  <!-- tree -->
  <text x="220" y="50" text-anchor="middle" font-size="11" fill="#888">targetSum = 22</text>

  <!-- node 5 (root, on path) -->
  <circle cx="220" cy="74" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="220" y="79" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>

  <!-- node 4 (on path) -->
  <circle cx="160" cy="124" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="160" y="129" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <!-- node 8 (off path) -->
  <circle cx="280" cy="124" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="129" text-anchor="middle" font-size="13" fill="#333">8</text>

  <!-- edges level 1 -->
  <path d="M 207 87 L 173 111" stroke="#4a7a3a" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <path d="M 233 87 L 267 111" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- node 11 (on path) -->
  <circle cx="160" cy="176" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="160" y="181" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">11</text>
  <!-- node 13 (off path) -->
  <circle cx="250" cy="176" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="181" text-anchor="middle" font-size="13" fill="#333">13</text>
  <!-- node 4 (off path) -->
  <circle cx="310" cy="176" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="181" text-anchor="middle" font-size="13" fill="#333">4</text>

  <!-- edges level 2 -->
  <path d="M 160 142 L 160 158" stroke="#4a7a3a" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <path d="M 270 142 L 258 158" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 290 142 L 302 158" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- node 7 (off path leaf) -->
  <circle cx="118" cy="228" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="118" y="233" text-anchor="middle" font-size="13" fill="#333">7</text>
  <!-- node 2 (on path leaf) -->
  <circle cx="178" cy="228" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.8" filter="url(#rough2)"/>
  <text x="178" y="233" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <!-- node 1 (off path leaf) -->
  <circle cx="332" cy="228" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="332" y="233" text-anchor="middle" font-size="13" fill="#333">1</text>

  <!-- edges level 3 -->
  <path d="M 147 193 L 130 211" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 173 193 L 172 211" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 314 193 L 328 211" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- running sum chips on the path -->
  <text x="40" y="80" font-size="10" fill="#4a7a3a" font-weight="bold">累加和 →</text>
  <rect x="86" y="68" width="26" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="99" y="82" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="86" y="118" width="26" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="99" y="132" text-anchor="middle" font-size="11" fill="#333">9</text>
  <rect x="86" y="170" width="26" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="99" y="184" text-anchor="middle" font-size="11" fill="#333">20</text>
  <rect x="86" y="222" width="26" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="99" y="236" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">22</text>

  <!-- right side: explanation -->
  <path d="M 380 56 L 380 280" stroke="#dddddd" stroke-width="1.2" stroke-dasharray="3,4" filter="url(#rough2)"/>

  <text x="440" y="64" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">判定要点</text>

  <rect x="392" y="78" width="120" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="452" y="96" text-anchor="middle" font-size="10" fill="#333">绿色路径：到叶子 2</text>
  <text x="452" y="112" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">5+4+11+2 = 22 ✓</text>

  <rect x="392" y="134" width="120" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="452" y="152" text-anchor="middle" font-size="10" fill="#333">蓝色路径：到叶子 7</text>
  <text x="452" y="168" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5+4+11+7 = 27 ✗</text>

  <rect x="392" y="190" width="120" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="452" y="208" text-anchor="middle" font-size="10" fill="#333">只需存在一条即可</text>
  <text x="452" y="224" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">→ 返回 true</text>

  <text x="440" y="262" text-anchor="middle" font-size="10" fill="#888">叶子 = 无左右孩子</text>
  <text x="440" y="276" text-anchor="middle" font-size="10" fill="#888">内部节点命中不算</text>
</svg>
