<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">相邻对 = 无向链：端点度数 1，内部度数 2</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">把 [u,v] 当无向边 → 图是一条链 → 度数 1 即端点</text>

  <!-- ===== top: adjacentPairs boxes ===== -->
  <text x="40" y="78" font-size="11" fill="#888">相邻对 adjacentPairs =</text>
  <g font-size="11" fill="#333">
    <rect x="40" y="84" width="64" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="72" y="100" text-anchor="middle">[2,1]</text>
    <rect x="112" y="84" width="64" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="144" y="100" text-anchor="middle">[3,4]</text>
    <rect x="184" y="84" width="64" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="216" y="100" text-anchor="middle">[3,2]</text>
  </g>
  <text x="262" y="100" font-size="11" fill="#888">→ 无序、可颠倒</text>

  <!-- arrow down to chain -->
  <path d="M 150 116 L 150 138" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ===== middle: the chain graph ===== -->
  <text x="40" y="150" font-size="11" fill="#888">无向链：</text>

  <!-- chain nodes: 1 - 2 - 3 - 4, centered around x=280 -->
  <!-- node 1 (endpoint) -->
  <circle cx="120" cy="180" r="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="120" y="185" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">1</text>
  <text x="120" y="222" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">端点</text>
  <text x="120" y="234" text-anchor="middle" font-size="9" fill="#b85450">度=1</text>

  <!-- edge 1-2 -->
  <path d="M 144 180 L 216 180" stroke="#666" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- node 2 (internal) -->
  <circle cx="240" cy="180" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="185" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">2</text>
  <text x="240" y="222" text-anchor="middle" font-size="9" fill="#446688">内部</text>
  <text x="240" y="234" text-anchor="middle" font-size="9" fill="#446688">度=2</text>

  <!-- edge 2-3 -->
  <path d="M 264 180 L 336 180" stroke="#666" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- node 3 (internal) -->
  <circle cx="360" cy="180" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="185" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">3</text>
  <text x="360" y="222" text-anchor="middle" font-size="9" fill="#446688">内部</text>
  <text x="360" y="234" text-anchor="middle" font-size="9" fill="#446688">度=2</text>

  <!-- edge 3-4 -->
  <path d="M 384 180 L 456 180" stroke="#666" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- node 4 (endpoint) -->
  <circle cx="480" cy="180" r="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="480" y="185" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">4</text>
  <text x="480" y="222" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">端点</text>
  <text x="480" y="234" text-anchor="middle" font-size="9" fill="#b85450">度=1</text>

  <!-- ===== bottom: adjacency table ===== -->
  <text x="40" y="270" font-size="11" fill="#888">邻接表 adj：</text>

  <!-- table header -->
  <g font-size="10" fill="#666">
    <rect x="100" y="276" width="80" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="140" y="291" text-anchor="middle" font-weight="bold">元素</text>
    <rect x="180" y="276" width="120" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="240" y="291" text-anchor="middle" font-weight="bold">邻居</text>
    <rect x="300" y="276" width="60" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="330" y="291" text-anchor="middle" font-weight="bold">度数</text>
  </g>

  <!-- row 1: element 1 -->
  <g font-size="10" fill="#333">
    <rect x="100" y="298" width="80" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="140" y="312" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="180" y="298" width="120" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="240" y="312" text-anchor="middle">[2]</text>
    <rect x="300" y="298" width="60" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="330" y="312" text-anchor="middle" fill="#b85450" font-weight="bold">1 ★</text>
  </g>

  <!-- row 2: element 2 -->
  <g font-size="10" fill="#333">
    <rect x="100" y="318" width="80" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="140" y="332" text-anchor="middle">2</text>
    <rect x="180" y="318" width="120" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="240" y="332" text-anchor="middle">[1, 3]</text>
    <rect x="300" y="318" width="60" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="330" y="332" text-anchor="middle">2</text>
  </g>

  <!-- row 3: element 3 -->
  <g font-size="10" fill="#333">
    <rect x="100" y="338" width="80" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="140" y="352" text-anchor="middle">3</text>
    <rect x="180" y="338" width="120" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="240" y="352" text-anchor="middle">[4, 2]</text>
    <rect x="300" y="338" width="60" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="330" y="352" text-anchor="middle">2</text>
  </g>

  <!-- row 4: element 4 -->
  <g font-size="10" fill="#333">
    <rect x="100" y="358" width="80" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="140" y="372" text-anchor="middle" fill="#b85450" font-weight="bold">4</text>
    <rect x="180" y="358" width="120" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="240" y="372" text-anchor="middle">[3]</text>
    <rect x="300" y="358" width="60" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
    <text x="330" y="372" text-anchor="middle" fill="#b85450" font-weight="bold">1 ★</text>
  </g>

  <!-- note on right -->
  <rect x="400" y="278" width="140" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="470" y="298" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">找端点策略</text>
  <text x="470" y="316" text-anchor="middle" font-size="9" fill="#333">扫 adj，找</text>
  <text x="470" y="330" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">度数 == 1</text>
  <text x="470" y="344" text-anchor="middle" font-size="9" fill="#333">的节点 → 起点</text>

  <!-- star markers on degree-1 -->
  <text x="408" y="312" font-size="12" fill="#b85450" font-weight="bold">★</text>
  <text x="408" y="372" font-size="12" fill="#b85450" font-weight="bold">★</text>
</svg>
