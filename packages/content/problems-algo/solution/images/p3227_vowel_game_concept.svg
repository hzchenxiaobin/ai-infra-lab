<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：删子串的花招全是烟雾弹，胜负只看元音总数 k</text>

  <!-- 情形一：k = 0 -->
  <rect x="20" y="42" width="480" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="40" y="64" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">情形一：k = 0（一个元音都没有）</text>
  <text x="40" y="84" font-size="11" fill="#333" filter="url(#rough2)">任何非空子串的元音数都是 0（偶数）→ Alice 第一步就无合法操作 → false</text>

  <!-- 情形二：k 奇数 -->
  <rect x="20" y="110" width="480" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="40" y="132" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">情形二：k = 奇数 → 一波带走</text>
  <text x="40" y="152" font-size="11" fill="#333" filter="url(#rough2)">整个串就是「含奇数个元音的子串」，Alice 全删光 → Bob 对着空串干瞪眼 → true</text>

  <!-- 情形三：k 偶数 -->
  <rect x="20" y="178" width="480" height="74" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="40" y="200" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">情形三：k = 偶数 ≥ 2 → 递烫手山芋</text>
  <text x="40" y="220" font-size="11" fill="#333" filter="url(#rough2)">Alice 删一个恰好含 1 个元音的子串 → 把「奇数个元音」塞给 Bob</text>
  <text x="40" y="240" font-size="11" fill="#333" filter="url(#rough2)">Bob 每轮只能删偶数 e 个 → 剩 m−e 仍为奇数且 ≥ 1（偶数 e 够不到奇数 m）</text>

  <!-- 结论 -->
  <rect x="20" y="266" width="480" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="291" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">结论：Alice 必胜 ⇔ s 至少含 1 个元音，即 return（元音数 &gt; 0）</text>

  <!-- 脚注 -->
  <text x="260" y="334" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">※ Bob 删纯辅音段（0 个元音）也翻不了盘：k 不变，白烧一回合</text>
</svg>
