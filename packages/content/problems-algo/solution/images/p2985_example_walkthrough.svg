<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：两个累加器逐行推进，一趟扫完得 8900 / 3300</text>

  <!-- 表头 -->
  <rect x="30" y="48" width="460" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="67" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">order_id</text>
  <text x="130" y="67" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">item_count</text>
  <text x="220" y="67" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">order_occurrences</text>
  <text x="307" y="67" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">乘积 x·w</text>
  <text x="380" y="67" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">累计 Σ x·w</text>
  <text x="453" y="67" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">累计 Σ w</text>

  <!-- 行 1 -->
  <rect x="30" y="78" width="460" height="30" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="97" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">10</text>
  <text x="130" y="97" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="220" y="97" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">500</text>
  <text x="307" y="97" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">500</text>
  <text x="380" y="97" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">500</text>
  <text x="453" y="97" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">500</text>

  <!-- 行 2 -->
  <rect x="30" y="108" width="460" height="30" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="127" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">11</text>
  <text x="130" y="127" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="220" y="127" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1000</text>
  <text x="307" y="127" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2000</text>
  <text x="380" y="127" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2500</text>
  <text x="453" y="127" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1500</text>

  <!-- 行 3 -->
  <rect x="30" y="138" width="460" height="30" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="157" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">12</text>
  <text x="130" y="157" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="220" y="157" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">800</text>
  <text x="307" y="157" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2400</text>
  <text x="380" y="157" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4900</text>
  <text x="453" y="157" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2300</text>

  <!-- 行 4（终值高亮） -->
  <rect x="30" y="168" width="460" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="187" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">13</text>
  <text x="130" y="187" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="220" y="187" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1000</text>
  <text x="307" y="187" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4000</text>
  <text x="380" y="187" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">8900</text>
  <text x="453" y="187" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">3300</text>

  <!-- 合计行 -->
  <rect x="30" y="198" width="460" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="217" text-anchor="middle" font-size="11" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">合计</text>
  <text x="130" y="217" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">—</text>
  <text x="220" y="217" text-anchor="middle" font-size="11" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">3300</text>
  <text x="307" y="217" text-anchor="middle" font-size="11" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">8900</text>
  <text x="418" y="217" text-anchor="middle" font-size="10" fill="#7a5a10" filter="url(#rough2)">（= 两列累计终值）</text>

  <line x1="90" y1="48" x2="90" y2="228" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="170" y1="48" x2="170" y2="228" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="270" y1="48" x2="270" y2="228" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="344" y1="48" x2="344" y2="228" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="417" y1="48" x2="417" y2="228" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="30" y="48" width="460" height="180" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- 左下：收尾计算 -->
  <rect x="30" y="244" width="260" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="160" y="266" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">8900 ÷ 3300 = 2.696969…</text>
  <text x="160" y="288" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">第 3 位小数 6 ≥ 5 → 向上进位</text>
  <text x="160" y="310" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">ROUND(·, 2) = 2.70 ✓</text>
  <text x="160" y="330" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">输出 average_items_per_order = 2.70</text>

  <path d="M 200 232 C 190 238, 178 240, 164 242" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 右下：对照错误 -->
  <rect x="312" y="244" width="178" height="100" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="401" y="266" text-anchor="middle" font-size="11" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">对照错误：AVG(item_count)</text>
  <text x="401" y="288" text-anchor="middle" font-size="11" fill="#8f3a36" filter="url(#rough2)">= (1+2+3+4) ÷ 4 = 2.50</text>
  <text x="401" y="308" text-anchor="middle" font-size="10.5" fill="#8f3a36" filter="url(#rough2)">只数「档位」不数订单，</text>
  <text x="401" y="326" text-anchor="middle" font-size="10.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">✗ occurrences 权重全丢</text>
</svg>
