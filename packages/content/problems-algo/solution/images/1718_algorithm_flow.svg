<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="580" height="560" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：贪心回溯 dfs(pos)</text>

  <!-- Start -->
  <rect x="230" y="44" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="15" filter="url(#rough2)"/>
  <text x="290" y="64" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">dfs(pos)</text>

  <!-- Arrow down -->
  <path d="M 290 76 L 290 92" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: pos == size? -->
  <polygon points="290,96 380,136 290,176 200,136" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="290" y="134" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">pos == 2n−1?</text>
  <text x="290" y="150" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">(全部填完?)</text>

  <!-- Yes: return True -->
  <path d="M 380 136 L 430 136" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="396" y="130" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="434" y="120" width="110" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="15" filter="url(#rough2)"/>
  <text x="489" y="140" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return True ✓</text>

  <!-- No: arrow down -->
  <path d="M 290 176 L 290 192" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="188" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- Decision: ans[pos] != 0? -->
  <polygon points="290,196 390,236 290,276 190,236" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="290" y="234" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">ans[pos] ≠ 0?</text>
  <text x="290" y="250" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">(已锁定?)</text>

  <!-- Yes: skip to pos+1 -->
  <path d="M 390 236 L 460 236" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="406" y="230" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="464" y="220" width="90" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="509" y="240" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">dfs(pos+1)</text>
  <!-- loop back arrow from skip to start -->
  <path d="M 509 220 L 509 59 L 350 59" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- No: arrow down -->
  <path d="M 290 276 L 290 294" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="290" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- Action: try i from n to 1 -->
  <rect x="190" y="298" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="290" y="318" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">for i = n → 1（从大到小）</text>

  <!-- Arrow down -->
  <path d="M 290 330 L 290 346" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: used[i]? -->
  <polygon points="290,350 370,384 290,418 210,384" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="382" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">used[i]?</text>

  <!-- Yes: skip (loop back to for) -->
  <path d="M 370 384 L 430 384 L 430 313 L 390 313" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="400" y="378" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">是,跳过</text>

  <!-- No: arrow down -->
  <path d="M 290 418 L 290 434" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="430" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- Branch: i==1 vs i>=2 -->
  <!-- i == 1 path (left) -->
  <rect x="40" y="438" width="210" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="50" y="456" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">i == 1</text>
  <text x="50" y="472" font-size="10" fill="#555" filter="url(#rough2)">ans[pos] = 1; used[1] = T</text>
  <text x="50" y="488" font-size="10" fill="#555" filter="url(#rough2)">dfs(pos+1)? 成功→return T</text>
  <text x="50" y="498" font-size="9" fill="#888" filter="url(#rough2)">失败→撤销 ans[pos]=0</text>

  <!-- i >= 2 path (right) -->
  <rect x="330" y="438" width="220" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="340" y="456" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">i ≥ 2</text>
  <text x="340" y="472" font-size="10" fill="#555" filter="url(#rough2)">j = pos+i; 查 j<size 且 ans[j]==0</text>
  <text x="340" y="488" font-size="10" fill="#555" filter="url(#rough2)">放 ans[pos]=ans[j]=i; dfs(pos+1)</text>
  <text x="340" y="498" font-size="9" fill="#888" filter="url(#rough2)">成功→return T; 失败→撤销两格</text>

  <!-- Branch arrows from decision -->
  <path d="M 270 434 L 145 438" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 310 434 L 440 438" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- Bottom: all tried, return False -->
  <path d="M 290 500 L 290 516" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="220" y="518" width="140" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="15" filter="url(#rough2)"/>
  <text x="290" y="538" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">return False ✗</text>
  <text x="375" y="538" font-size="9" fill="#888" filter="url(#rough2)">← 所有数都试过仍无解</text>

  <!-- Footer -->
  <text x="290" y="554" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">核心：从大到小试填 → 放数时同时占两格 → 找到第一个解即返回</text>
</svg>
