<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：分组 → 排序 → 贪心回填</text>

  <!-- Step 1: extract digits -->
  <rect x="200" y="46" width="160" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="70" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① 提取数字各位</text>

  <path d="M 280 90 L 280 108" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: separate by parity -->
  <rect x="160" y="114" width="240" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="138" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">② 按值奇偶性分两组</text>

  <!-- branch out to two groups -->
  <path d="M 240 156 L 160 176" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 320 156 L 400 176" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- odd group box -->
  <rect x="70" y="182" width="180" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="160" y="202" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">奇数集合</text>
  <text x="160" y="220" text-anchor="middle" font-size="10" fill="#d6a040">{1,3,5,7,9} 子集</text>

  <!-- even group box -->
  <rect x="310" y="182" width="180" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="400" y="202" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">偶数集合</text>
  <text x="400" y="220" text-anchor="middle" font-size="10" fill="#446688">{0,2,4,6,8} 子集</text>

  <!-- merge down to sort -->
  <path d="M 160 236 L 240 256" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 400 236 L 320 256" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: sort desc -->
  <rect x="170" y="262" width="220" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="286" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">③ 各组降序排序</text>

  <path d="M 280 304 L 280 322" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: greedy refill - decision diamond -->
  <polygon points="280,326 380,366 280,406 180,366" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">④ 遍历原位</text>
  <text x="280" y="376" text-anchor="middle" font-size="10" fill="#b85450">该位原数字是奇？</text>

  <!-- left branch: odd -->
  <path d="M 180 366 L 90 366" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="358" font-size="10" fill="#d6a040">奇</text>
  <rect x="20" y="350" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="60" y="372" text-anchor="middle" font-size="10" fill="#d6a040">取最大奇数</text>

  <!-- right branch: even -->
  <path d="M 380 366 L 470 366" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="358" font-size="10" fill="#446688">偶</text>
  <rect x="460" y="350" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="500" y="372" text-anchor="middle" font-size="10" fill="#446688">取最大偶数</text>

  <!-- merge down to assemble -->
  <path d="M 60 388 L 60 410 L 280 410" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 500 388 L 500 410 L 280 410" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 280 410 L 280 422" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: result -->
  <rect x="180" y="428" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="448" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">⑤ 拼接 → 返回最大值</text>
</svg>
