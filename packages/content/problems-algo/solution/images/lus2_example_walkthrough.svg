<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算</text>

  <!-- ===== Example 1 ===== -->
  <text x="40" y="52" font-size="12" fill="#446688" font-weight="bold">示例 1：strs = ["aba", "cdc", "eae"]</text>

  <!-- sorted strings (all len 3) -->
  <text x="44" y="74" font-size="10.5" fill="#555">排序后（均 len=3）：</text>

  <rect x="170" y="60" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="200" y="79" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">aba</text>

  <rect x="240" y="60" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="270" y="79" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">cdc</text>

  <rect x="310" y="60" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="340" y="79" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">eae</text>

  <!-- check row: aba -->
  <text x="44" y="108" font-size="10.5" fill="#333" font-weight="bold">i=0 "aba"</text>
  <text x="120" y="108" font-size="10" fill="#555">⊂ "cdc"?</text>
  <rect x="180" y="96" width="34" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="197" y="110" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>
  <text x="224" y="108" font-size="10" fill="#555">⊂ "eae"?</text>
  <rect x="284" y="96" width="34" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="301" y="110" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>
  <text x="330" y="108" font-size="10.5" fill="#4a7a3a" font-weight="bold">→ 不包含于任何他者！</text>

  <!-- answer -->
  <rect x="330" y="118" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="370" y="135" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回 3 ✓</text>

  <!-- divider -->
  <line x1="40" y1="158" x2="500" y2="158" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== Example 2 ===== -->
  <text x="40" y="182" font-size="12" fill="#b85450" font-weight="bold">示例 2：strs = ["aaa", "aaa", "aa"]</text>

  <!-- sorted by length desc -->
  <text x="44" y="204" font-size="10.5" fill="#555">排序后：</text>

  <rect x="120" y="190" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="150" y="209" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">aaa</text>
  <text x="120" y="228" font-size="9" fill="#888" text-anchor="middle">len=3</text>

  <rect x="200" y="190" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="230" y="209" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">aaa</text>
  <text x="230" y="228" font-size="9" fill="#888" text-anchor="middle">len=3</text>

  <rect x="280" y="190" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="310" y="209" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">aa</text>
  <text x="310" y="228" font-size="9" fill="#888" text-anchor="middle">len=2</text>

  <!-- check i=0: aaa -->
  <text x="44" y="250" font-size="10.5" fill="#333" font-weight="bold">i=0 "aaa"</text>
  <text x="120" y="250" font-size="10" fill="#555">⊂ "aaa"[1]?</text>
  <rect x="196" y="238" width="34" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="213" y="252" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <text x="240" y="250" font-size="10" fill="#b85450" font-weight="bold">→ 重复串，跳过</text>

  <!-- check i=1: aaa -->
  <text x="44" y="274" font-size="10.5" fill="#333" font-weight="bold">i=1 "aaa"</text>
  <text x="120" y="274" font-size="10" fill="#555">⊂ "aaa"[0]?</text>
  <rect x="196" y="262" width="34" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="213" y="276" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <text x="240" y="274" font-size="10" fill="#b85450" font-weight="bold">→ 重复串，跳过</text>

  <!-- check i=2: aa -->
  <text x="44" y="298" font-size="10.5" fill="#333" font-weight="bold">i=2 "aa"</text>
  <text x="120" y="298" font-size="10" fill="#555">⊂ "aaa"?</text>
  <rect x="176" y="286" width="34" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="193" y="300" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <text x="220" y="298" font-size="10" fill="#b85450" font-weight="bold">→ "aa" 是 "aaa" 的子序列，跳过</text>

  <!-- answer -->
  <rect x="300" y="314" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="350" y="333" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 -1</text>

  <!-- divider -->
  <line x1="40" y1="356" x2="500" y2="356" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== Key takeaway ===== -->
  <rect x="44" y="370" width="452" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="270" y="392" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">关键细节</text>
  <text x="60" y="412" font-size="10.5" fill="#555">• 重复串互为子序列 → 自动被排除（无需额外去重逻辑）</text>
  <text x="60" y="430" font-size="10.5" fill="#555">• 短串不会是长串的「超序列」→ 只需检查 len ≥ 当前的串，排序后即 j ≤ i</text>
  <text x="60" y="448" font-size="10.5" fill="#555">• 第一个通过检查的串即为最长（因已按长度降序）</text>
</svg>
