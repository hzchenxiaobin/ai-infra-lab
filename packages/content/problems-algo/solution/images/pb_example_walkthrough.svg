<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：成功染色 vs 奇环冲突</text>

  <!-- ===== Left panel: Example 1 (success, tree-like) ===== -->
  <rect x="20" y="44" width="276" height="280" rx="10" fill="#f4faf6" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="158" y="66" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">✓ 示例 1：n=4</text>
  <text x="158" y="82" text-anchor="middle" font-size="10" fill="#555">dislikes=[[1,2],[1,3],[2,4]]</text>

  <!-- edges (drawn before nodes): 1-2, 1-3, 2-4 -->
  <path d="M 90 120 L 210 120" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 90 120 L 210 195" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 90 195 L 210 120" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- nodes: 1=blue, 4=blue, 2=green, 3=green -->
  <circle cx="90" cy="120" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="90" y="125" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <circle cx="90" cy="195" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="90" y="200" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <circle cx="210" cy="120" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="210" y="125" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <circle cx="210" cy="195" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="210" y="200" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <!-- step labels -->
  <text x="158" y="240" text-anchor="middle" font-size="11" fill="#555">① 染 1=蓝</text>
  <text x="158" y="256" text-anchor="middle" font-size="11" fill="#555">② 邻居 2,3 → 绿</text>
  <text x="158" y="272" text-anchor="middle" font-size="11" fill="#555">③ 2 的邻居 4 → 蓝</text>
  <text x="158" y="288" text-anchor="middle" font-size="11" fill="#555">④ 检查 3 的邻居 1：蓝✓</text>
  <text x="158" y="312" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">无冲突 → true</text>

  <!-- ===== Right panel: Example 3 (failure, 5-cycle) ===== -->
  <rect x="312" y="44" width="268" height="280" rx="10" fill="#fdf3f4" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="446" y="66" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold">✗ 示例 3：n=5（5-环）</text>
  <text x="446" y="82" text-anchor="middle" font-size="10" fill="#555">dislikes=[[1,2],[2,3],[3,4],[4,5],[1,5]]</text>

  <!-- 5-cycle edges: 1-2, 2-3, 3-4, 4-5, 5-1 -->
  <path d="M 380 130 L 470 110" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 470 110 L 510 175" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 510 175 L 470 240" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 470 240 L 380 240" stroke="#b85450" stroke-width="2.5" fill="none" filter="url(#rough2)"/>
  <path d="M 380 240 L 380 130" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- nodes: 1=blue, 2=green, 3=blue, 4=green, 5=green(conflict with 4) -->
  <circle cx="380" cy="130" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="380" y="135" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <circle cx="470" cy="110" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="470" y="115" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <circle cx="510" cy="175" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="510" y="180" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <circle cx="470" cy="240" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="470" y="245" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <circle cx="380" cy="240" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="380" y="245" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>

  <!-- step labels -->
  <text x="446" y="240" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold" opacity="0">.</text>
  <text x="446" y="272" text-anchor="middle" font-size="11" fill="#555">① 1=蓝 → 2,5=绿</text>
  <text x="446" y="288" text-anchor="middle" font-size="11" fill="#555">② 2 的邻居 3=蓝</text>
  <text x="446" y="304" text-anchor="middle" font-size="11" fill="#555">③ 5 的邻居 4 应=蓝，但</text>
  <text x="446" y="318" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">边 4–5 两端同色 → false</text>

  <!-- ===== Bottom note box ===== -->
  <rect x="40" y="340" width="520" height="100" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="362" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">奇环 = 无法二着色</text>
  <text x="300" y="382" text-anchor="middle" font-size="11" fill="#666">示例 3 是一个长度为 5 的环（1–2–3–4–5–1），5 是奇数，</text>
  <text x="300" y="398" text-anchor="middle" font-size="11" fill="#666">绕一圈颜色翻 5 次后回到起点必与原色相反 → 同色相邻冲突。</text>
  <text x="300" y="418" text-anchor="middle" font-size="11" fill="#666">偶环（如示例 1 的 4-环 1–2–4–3–1）翻偶数次回到原色，无冲突。</text>
</svg>
