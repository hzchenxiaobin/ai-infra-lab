<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">对角线编号 d = i − j：左下三角降序，右上三角升序</text>
  <text x="260" y="38" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">沿 ↘ 方向 i、j 同步 +1，i − j 不变；格中数字即该格的 d</text>

  <!-- column header j -->
  <g font-size="10" fill="#888" filter="url(#rough2)">
    <text x="88"  y="50" text-anchor="middle">j=0</text>
    <text x="144" y="50" text-anchor="middle">1</text>
    <text x="200" y="50" text-anchor="middle">2</text>
    <text x="256" y="50" text-anchor="middle">3</text>
  </g>
  <!-- row header i -->
  <g font-size="10" fill="#888" filter="url(#rough2)">
    <text x="52" y="86"  text-anchor="end">i=0</text>
    <text x="52" y="130" text-anchor="end">1</text>
    <text x="52" y="174" text-anchor="end">2</text>
    <text x="52" y="218" text-anchor="end">3</text>
  </g>

  <!-- row 0 -->
  <rect x="60" y="56" width="56" height="44" fill="#e8f0fe" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="88" y="86" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="116" y="56" width="56" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="144" y="86" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">−1</text>
  <rect x="172" y="56" width="56" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="86" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">−2</text>
  <rect x="228" y="56" width="56" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="256" y="86" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">−3</text>

  <!-- row 1 -->
  <rect x="60" y="100" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="88" y="130" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="116" y="100" width="56" height="44" fill="#e8f0fe" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="144" y="130" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="172" y="100" width="56" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="130" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">−1</text>
  <rect x="228" y="100" width="56" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="256" y="130" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">−2</text>

  <!-- row 2 -->
  <rect x="60" y="144" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="88" y="174" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <rect x="116" y="144" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="144" y="174" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="172" y="144" width="56" height="44" fill="#e8f0fe" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="174" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="228" y="144" width="56" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="256" y="174" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">−1</text>

  <!-- row 3 -->
  <rect x="60" y="188" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="88" y="218" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <rect x="116" y="188" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="144" y="218" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <rect x="172" y="188" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="218" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="228" y="188" width="56" height="44" fill="#e8f0fe" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="256" y="218" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>

  <!-- traversal arrows along d=1 (blue) and d=-1 (orange) -->
  <path d="M 88 134 L 200 222" stroke="#446688" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <path d="M 144 90 L 256 178" stroke="#d6a040" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrO)" fill="none" filter="url(#rough2)"/>
  <text x="96" y="230" font-size="9" fill="#446688" filter="url(#rough2)">↘ 收集/写回方向</text>

  <!-- right legend -->
  <g filter="url(#rough2)">
    <rect x="316" y="62" width="190" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10"/>
    <text x="411" y="82" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33506b">左下三角 + 主对角线</text>
    <text x="411" y="100" text-anchor="middle" font-size="10.5" fill="#33506b">d = i − j ≥ 0</text>
    <text x="411" y="114" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">→ 非递增（降序）</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="316" y="134" width="190" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10"/>
    <text x="411" y="154" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d1f">右上三角</text>
    <text x="411" y="172" text-anchor="middle" font-size="10.5" fill="#8a6d1f">d = i − j &lt; 0</text>
    <text x="411" y="186" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">→ 非递减（升序）</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="316" y="206" width="190" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10"/>
    <text x="411" y="226" text-anchor="middle" font-size="11" font-weight="bold" fill="#8f3a35">红框 = 主对角线 d = 0</text>
    <text x="411" y="244" text-anchor="middle" font-size="10.5" fill="#8f3a35">归左下三角（降序），是分界线</text>
  </g>

  <!-- bottom notes -->
  <g filter="url(#rough2)">
    <rect x="60" y="252" width="210" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10"/>
    <text x="165" y="272" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24">n = 4：d ∈ [−3, 3]</text>
    <text x="165" y="289" text-anchor="middle" font-size="10.5" fill="#2f5d24">共 2n − 1 = 7 条对角线</text>
    <text x="165" y="303" text-anchor="middle" font-size="10" fill="#55677d">最长的是主对角线（n 格）</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="292" y="252" width="214" height="58" fill="#ffffff" stroke="#9db4c9" stroke-width="1.4" stroke-dasharray="5 3" rx="10"/>
    <text x="399" y="272" text-anchor="middle" font-size="11" font-weight="bold" fill="#33506b">收集与写回都沿 ↘</text>
    <text x="399" y="289" text-anchor="middle" font-size="10.5" fill="#55677d">第 k 个值 ↔ 第 k 个格子</text>
    <text x="399" y="303" text-anchor="middle" font-size="10" fill="#55677d">顺序一致，位置不会错位</text>
  </g>

  <text x="260" y="340" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">示例 1：主对角线 [1,8,6] → 降序 [8,6,1]；d=−1 线 [7,2] → 升序 [2,7]</text>
</svg>
