<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：父指针 + 路径求交</text>

  <!-- Step 1: Build parent map -->
  <rect x="30" y="55" width="240" height="80" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="78" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">Step 1: 建立父指针哈希</text>
  <text x="150" y="98" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">遍历 regions 每行</text>
  <text x="150" y="115" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">parent[child] = regions[i][0]</text>
  <text x="150" y="130" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">O(n) 建表</text>

  <!-- Arrow step1 -> step2 -->
  <path d="M150,135 L150,160" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 2: Collect region1 ancestors -->
  <rect x="30" y="165" width="240" height="95" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="188" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">Step 2: 收集 region1 祖先</text>
  <text x="150" y="208" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">cur = region1</text>
  <text x="150" y="224" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">while cur 存在:</text>
  <text x="150" y="240" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">  ancestors.add(cur)</text>
  <text x="150" y="255" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">  cur = parent[cur]</text>

  <!-- Arrow step2 -> step3 -->
  <path d="M150,260 L150,285" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 3: Walk region2 upward -->
  <rect x="30" y="290" width="240" height="110" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="313" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">Step 3: region2 向上找交点</text>
  <text x="150" y="333" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">cur = region2</text>
  <text x="150" y="350" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">while cur not in ancestors:</text>
  <text x="150" y="366" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">  cur = parent[cur]</text>
  <text x="150" y="386" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">return cur  ← 第一个交点</text>

  <!-- Right side: Path intersection illustration -->
  <rect x="310" y="55" width="230" height="345" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="425" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">路径求交示意</text>

  <!-- region1 path (left column) -->
  <text x="370" y="105" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">region1 路径</text>
  <rect x="335" y="115" width="80" height="26" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="375" y="133" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Quebec</text>
  <path d="M375,141 L375,153" stroke="#4a7a3a" stroke-width="1.2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <rect x="335" y="155" width="80" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="375" y="173" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Canada</text>
  <path d="M375,181 L375,193" stroke="#4a7a3a" stroke-width="1.2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <rect x="320" y="195" width="110" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="375" y="213" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">North America</text>
  <path d="M375,221 L375,233" stroke="#4a7a3a" stroke-width="1.2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <rect x="350" y="235" width="50" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="375" y="253" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Earth</text>

  <!-- region2 path (right column) -->
  <text x="475" y="105" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">region2 路径</text>
  <rect x="440" y="115" width="70" height="26" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="475" y="133" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">New York</text>
  <path d="M475,141 L475,153" stroke="#446688" stroke-width="1.2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <rect x="430" y="155" width="90" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="475" y="173" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">United States</text>
  <path d="M475,181 L475,193" stroke="#446688" stroke-width="1.2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <rect x="420" y="195" width="110" height="26" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="475" y="213" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">North America ⭐</text>

  <!-- Intersection circle -->
  <ellipse cx="425" cy="208" rx="55" ry="18" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="425" y="290" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">第一个出现在 region1</text>
  <text x="425" y="306" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">路径中的节点 = LCA</text>

  <text x="425" y="340" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">两路径从根到 LCA 共享前缀</text>
  <text x="425" y="356" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">LCA 之上必相同，之下必不同</text>
  <text x="425" y="385" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">⇒ 第一个交点即最近公共祖先</text>
</svg>
