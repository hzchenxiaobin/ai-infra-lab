<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">重新排列单词间的空格 算法流程</text>

  <!-- Start -->
  <ellipse cx="270" cy="56" rx="110" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="60" text-anchor="middle" font-size="12" fill="#333">开始：输入 text</text>

  <path d="M 270 76 L 270 96" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Process: count spaces & extract words -->
  <rect x="135" y="98" width="270" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="120" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">遍历 text</text>
  <text x="270" y="138" text-anchor="middle" font-size="11" fill="#555">统计空格数 spaces + 提取单词列表 words</text>

  <path d="M 270 148 L 270 168" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: words == 1 ? -->
  <polygon points="270,168 380,213 270,258 160,213" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="217" text-anchor="middle" font-size="12" fill="#333">单词数 n == 1 ?</text>

  <!-- Yes branch: right -->
  <path d="M 380 213 L 410 213" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="395" y="205" text-anchor="middle" font-size="11" fill="#82b366">是</text>
  <rect x="410" y="191" width="120" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="470" y="210" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">特判：无间隔</text>
  <text x="470" y="226" text-anchor="middle" font-size="10.5" fill="#555">word[0] + 全部空格</text>

  <!-- Yes path: down then left to End -->
  <path d="M 470 235 L 470 410 L 358 410" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- No branch: down -->
  <path d="M 270 258 L 270 278" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="272" font-size="11" fill="#b85450">否</text>

  <!-- Compute box -->
  <rect x="135" y="280" width="270" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="302" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">计算分配参数</text>
  <text x="270" y="322" text-anchor="middle" font-size="11" fill="#555">gap = n − 1（间隔数）</text>
  <text x="270" y="340" text-anchor="middle" font-size="11" fill="#555">per = spaces ÷ gap，extra = spaces mod gap</text>

  <path d="M 270 356 L 270 376" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Join box -->
  <rect x="135" y="378" width="270" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="400" text-anchor="middle" font-size="11" fill="#333">用 per 个空格连接单词 + 末尾追加 extra 个空格</text>

  <path d="M 270 422 L 270 440" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- End -->
  <ellipse cx="270" cy="448" rx="86" ry="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="452" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">返回结果字符串</text>
</svg>
