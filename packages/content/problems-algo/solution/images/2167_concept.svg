<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：选分割点 i → 左右两半各自独立优化</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">左半 [0..i] 只用左删+直删；右半 [i+1..n−1] 只用右删+直删</text>

  <!-- Index labels -->
  <text x="124" y="56" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="170" y="56" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="216" y="56" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="262" y="56" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="308" y="56" text-anchor="middle" font-size="9" fill="#888">4</text>
  <text x="354" y="56" text-anchor="middle" font-size="9" fill="#888">5</text>

  <!-- String s = "110101" -->
  <rect x="104" y="62" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="124" y="85" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <rect x="150" y="62" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="85" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <rect x="196" y="62" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="216" y="85" text-anchor="middle" font-size="14" fill="#333">0</text>

  <rect x="242" y="62" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="262" y="85" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <rect x="288" y="62" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="308" y="85" text-anchor="middle" font-size="14" fill="#333">0</text>

  <rect x="334" y="62" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="354" y="85" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <!-- Split line between index 1 and 2 -->
  <path d="M 193 58 L 193 102" stroke="#b85450" stroke-width="2" stroke-dasharray="4,3" fill="none" filter="url(#rough2)"/>
  <text x="193" y="52" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">分割点 i</text>

  <!-- Left bracket -->
  <path d="M 104 104 L 104 110 L 190 110 L 190 104" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="147" y="124" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">左半 [0..i]</text>

  <!-- Right bracket -->
  <path d="M 196 104 L 196 110 L 374 110 L 374 104" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="285" y="124" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">右半 [i+1..n−1]</text>

  <!-- Left strategy box -->
  <rect x="25" y="138" width="225" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="137" y="156" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">左半策略</text>
  <text x="38" y="174" font-size="10" fill="#333">① 左删 i+1 车 → cost = i+1</text>
  <text x="38" y="190" font-size="10" fill="#333">② 直删 '1' → cost = 2/个</text>
  <text x="38" y="210" font-size="10" fill="#555" font-style="italic">left[i] = min(left[i−1]+c, i+1)</text>
  <text x="38" y="224" font-size="9.5" fill="#888">c = 2 if s[i]='1' else 0</text>

  <!-- Right strategy box -->
  <rect x="270" y="138" width="225" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="382" y="156" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">右半策略</text>
  <text x="283" y="174" font-size="10" fill="#333">① 右删 n−i 车 → cost = n−i</text>
  <text x="283" y="190" font-size="10" fill="#333">② 直删 '1' → cost = 2/个</text>
  <text x="283" y="210" font-size="10" fill="#555" font-style="italic">right[i] = min(right[i+1]+c, n−i)</text>
  <text x="283" y="224" font-size="9.5" fill="#888">c = 2 if s[i]='1' else 0</text>

  <!-- Answer formula box -->
  <rect x="45" y="248" width="430" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="269" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans = min (left[i] + right[i+1])，i ∈ [−1, n−1]</text>
  <text x="260" y="287" text-anchor="middle" font-size="10" fill="#666">left[−1] = 0（空前缀），right[n] = 0（空后缀）</text>

  <!-- Three operations summary -->
  <text x="260" y="318" text-anchor="middle" font-size="10" fill="#888">操作1：左端删 cost=1  |  操作2：右端删 cost=1  |  操作3：任意位置删 cost=2</text>
  <text x="260" y="336" text-anchor="middle" font-size="9.5" fill="#aaa">关键洞察：左删覆盖前缀所有 '1'，右删覆盖后缀所有 '1'，分割点让左右解耦</text>
  <text x="260" y="352" text-anchor="middle" font-size="9.5" fill="#aaa">'0' 不含违禁货物无需移除 → 直删 cost 仅对 '1' 计</text>
</svg>
