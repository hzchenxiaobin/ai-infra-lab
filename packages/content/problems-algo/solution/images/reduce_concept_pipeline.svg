<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 300"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="300" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">左折叠 foldl：累加器逐元素推进</text>

  <!-- nums row -->
  <text x="70" y="80" font-size="13" fill="#4a7a3a" filter="url(#rough2)">nums[i]</text>
  <rect x="129" y="64" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="149" y="83" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="239" y="64" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="259" y="83" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="349" y="64" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="369" y="83" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="459" y="64" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="479" y="83" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>

  <!-- down arrows feeding each element into the accumulator transition -->
  <path d="M149,93 L149,194" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M259,93 L259,194" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M369,93 L369,194" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M479,93 L479,194" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- accumulator pipeline -->
  <text x="70" y="198" font-size="13" fill="#446688" filter="url(#rough2)">acc</text>
  <rect x="70" y="176" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="94" y="199" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="94" y="170" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">init</text>

  <rect x="180" y="176" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="204" y="199" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <rect x="290" y="176" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="314" y="199" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>

  <rect x="400" y="176" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="424" y="199" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>

  <rect x="510" y="176" width="48" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="534" y="199" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10</text>
  <text x="534" y="230" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">结果</text>

  <!-- horizontal fn arrows -->
  <path d="M118,194 L176,194" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M228,194 L286,194" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M338,194 L396,194" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M448,194 L506,194" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="147" y="188" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">fn</text>
  <text x="257" y="188" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">fn</text>
  <text x="367" y="188" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">fn</text>
  <text x="477" y="188" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">fn</text>

  <text x="290" y="270" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">每一步：acc ← fn(acc, nums[i])，串行推进，不可并行</text>
</svg>
