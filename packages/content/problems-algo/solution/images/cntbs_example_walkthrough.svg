<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [4,3,1,2,4] → ans = 2</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">pref = 前缀异或；橙底行 = 命中（找到等值前缀 → 一个美丽子数组）</text>

  <!-- Table header -->
  <rect x="30" y="56" width="500" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <!-- dividers: 90, 140, 200, 300, 380 -->
  <line x1="90" y1="56" x2="90" y2="86" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="140" y1="56" x2="140" y2="86" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="200" y1="56" x2="200" y2="86" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="300" y1="56" x2="300" y2="86" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="380" y1="56" x2="380" y2="86" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="60" y="75" text-anchor="middle" font-size="11" fill="#224466" font-weight="bold">步骤</text>
  <text x="115" y="75" text-anchor="middle" font-size="11" fill="#224466" font-weight="bold">x</text>
  <text x="170" y="75" text-anchor="middle" font-size="11" fill="#224466" font-weight="bold">pref</text>
  <text x="250" y="75" text-anchor="middle" font-size="11" fill="#224466" font-weight="bold">命中count</text>
  <text x="340" y="75" text-anchor="middle" font-size="11" fill="#224660" font-weight="bold">累计ans</text>
  <text x="455" y="75" text-anchor="middle" font-size="11" fill="#224466" font-weight="bold">count 更新</text>

  <!-- Row 初始 -->
  <rect x="30" y="86" width="500" height="28" fill="#f5f5f5" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="104" text-anchor="middle" font-size="11" fill="#999" font-weight="bold">初始</text>
  <text x="115" y="104" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="170" y="104" text-anchor="middle" font-size="11" fill="#999" font-family="monospace">0</text>
  <text x="250" y="104" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="340" y="104" text-anchor="middle" font-size="11" fill="#999" font-weight="bold">0</text>
  <text x="455" y="104" text-anchor="middle" font-size="11" fill="#999" font-family="monospace">{0:1}</text>

  <!-- Row 1: x=4 -->
  <rect x="30" y="114" width="500" height="28" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="132" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">1</text>
  <text x="115" y="132" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="170" y="132" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">4</text>
  <text x="250" y="132" text-anchor="middle" font-size="11" fill="#666">0</text>
  <text x="340" y="132" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold">0</text>
  <text x="455" y="132" text-anchor="middle" font-size="10.5" fill="#666" font-family="monospace">+{4:1}</text>

  <!-- Row 2: x=3 -->
  <rect x="30" y="142" width="500" height="28" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="160" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">2</text>
  <text x="115" y="160" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="170" y="160" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">7</text>
  <text x="250" y="160" text-anchor="middle" font-size="11" fill="#666">0</text>
  <text x="340" y="160" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold">0</text>
  <text x="455" y="160" text-anchor="middle" font-size="10.5" fill="#666" font-family="monospace">+{7:1}</text>

  <!-- Row 3: x=1 -->
  <rect x="30" y="170" width="500" height="28" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="188" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">3</text>
  <text x="115" y="188" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="170" y="188" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">6</text>
  <text x="250" y="188" text-anchor="middle" font-size="11" fill="#666">0</text>
  <text x="340" y="188" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold">0</text>
  <text x="455" y="188" text-anchor="middle" font-size="10.5" fill="#666" font-family="monospace">+{6:1}</text>

  <!-- Row 4: x=2  HIT -->
  <rect x="30" y="198" width="500" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="216" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">4</text>
  <text x="115" y="216" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="170" y="216" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">4</text>
  <rect x="222" y="200" width="56" height="24" rx="3" fill="#fff0d0" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="250" y="216" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">1 ✓</text>
  <text x="340" y="216" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <text x="455" y="216" text-anchor="middle" font-size="10.5" fill="#666" font-family="monospace">4→2</text>

  <!-- Row 5: x=4  HIT -->
  <rect x="30" y="226" width="500" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="244" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">5</text>
  <text x="115" y="244" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="170" y="244" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">0</text>
  <rect x="222" y="228" width="56" height="24" rx="3" fill="#fff0d0" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="250" y="244" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">1 ✓</text>
  <text x="340" y="244" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>
  <text x="455" y="244" text-anchor="middle" font-size="10.5" fill="#666" font-family="monospace">0→2</text>

  <!-- annotations for the two hits -->
  <text x="250" y="276" text-anchor="middle" font-size="10.5" fill="#b03a3a">↑ 步骤4：pref=4 命中首处 pref=4 → 子数组 nums[1..3]=[3,1,2]</text>
  <text x="250" y="292" text-anchor="middle" font-size="10.5" fill="#b03a3a">↑ 步骤5：pref=0 命中初始 pref=0 → 子数组 nums[0..4]=[4,3,1,2,4]</text>

  <!-- final box -->
  <rect x="80" y="308" width="400" height="90" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="332" text-anchor="middle" font-size="12.5" fill="#3a5a2a" font-weight="bold">最终结果</text>
  <text x="280" y="356" text-anchor="middle" font-size="12" fill="#333">两次命中 = 2 个美丽子数组</text>
  <text x="280" y="378" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">答案 = 2 ✓</text>
  <text x="280" y="396" text-anchor="middle" font-size="10" fill="#888">对照示例2 [1,10,4]：pref=[0,1,11,15] 全异 → ans=0 ✓</text>
</svg>
