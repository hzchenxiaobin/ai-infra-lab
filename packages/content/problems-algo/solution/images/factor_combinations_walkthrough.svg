<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 12</text>
  <text x="300" y="42" text-anchor="middle" font-size="11" fill="#888">√12 ≈ 3.46，根层枚举 i = 2, 3</text>

  <!-- Step 1: dfs(12, 2), i=2 -->
  <rect x="30" y="58" width="540" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="44" y="76" font-size="11" fill="#446688" font-weight="bold">步骤 ①</text>
  <text x="44" y="94" font-size="11" fill="#333">dfs(remain=12, start=2)</text>
  <text x="44" y="108" font-size="10" fill="#555">i=2 → 12%2==0 ✓</text>
  <!-- 收尾 -->
  <rect x="250" y="68" width="120" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="310" y="84" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">收尾分支</text>
  <text x="310" y="100" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[2, 6] ✓</text>
  <!-- 续拆 -->
  <rect x="400" y="68" width="150" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="475" y="84" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">续拆分支</text>
  <text x="475" y="100" text-anchor="middle" font-size="10" fill="#333">dfs(6, start=2)</text>

  <path d="M 300 114 L 300 130" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: dfs(6, 2), i=2 -->
  <rect x="30" y="132" width="540" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="44" y="150" font-size="11" fill="#446688" font-weight="bold">步骤 ②</text>
  <text x="44" y="168" font-size="11" fill="#333">dfs(remain=6, start=2)</text>
  <text x="44" y="182" font-size="10" fill="#555">i=2 → 6%2==0 ✓</text>
  <rect x="250" y="142" width="120" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="310" y="158" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">收尾分支</text>
  <text x="310" y="174" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[2,2,3] ✓</text>
  <rect x="400" y="142" width="150" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="475" y="158" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">续拆分支</text>
  <text x="475" y="174" text-anchor="middle" font-size="10" fill="#b85450">dfs(3,2) → 2×2&gt;3 ✗</text>

  <path d="M 300 188 L 300 204" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: back to root, i=3 -->
  <rect x="30" y="206" width="540" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="44" y="224" font-size="11" fill="#d6a040" font-weight="bold">步骤 ③</text>
  <text x="44" y="242" font-size="11" fill="#333">回到根 dfs(12,2)，i=3</text>
  <text x="44" y="256" font-size="10" fill="#555">i=3 → 12%3==0 ✓</text>
  <rect x="250" y="216" width="120" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="310" y="232" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">收尾分支</text>
  <text x="310" y="248" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[3,4] ✓</text>
  <rect x="400" y="216" width="150" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="475" y="232" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">续拆分支</text>
  <text x="475" y="248" text-anchor="middle" font-size="10" fill="#b85450">dfs(4,3) → 3×3&gt;4 ✗</text>

  <path d="M 300 262 L 300 278" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: i=4 stop -->
  <rect x="30" y="280" width="540" height="36" fill="#fafafa" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3" rx="8" filter="url(#rough2)"/>
  <text x="44" y="302" font-size="11" fill="#888">步骤 ④　i=4 → 4×4=16 &gt; 12，越过 √12，循环结束</text>

  <!-- Result -->
  <rect x="120" y="326" width="360" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="300" y="345" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">结果</text>
  <text x="300" y="360" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">[[2,6], [2,2,3], [3,4]]</text>
</svg>
