<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：把 num 拆成数位，逐位试除 num，数命中个数</text>

  <!-- ====== TOP: num box ====== -->
  <rect x="200" y="42" width="140" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="60" text-anchor="middle" font-size="11" fill="#888">原数（取余时不动）</text>
  <text x="270" y="76" text-anchor="middle" font-size="17" fill="#333" font-weight="bold">num = 1248</text>

  <!-- arrow down to split -->
  <path d="M 270 84 L 270 104" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="298" y="98" text-anchor="middle" font-size="10.5" fill="#888">% 10 取低位</text>

  <!-- ====== MIDDLE: four digit cells ====== -->
  <text x="270" y="124" text-anchor="middle" font-size="11.5" fill="#888">逐位拆出（从低到高）</text>

  <rect x="170" y="134" width="46" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="193" y="160" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">8</text>

  <rect x="232" y="134" width="46" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="255" y="160" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">4</text>

  <rect x="294" y="134" width="46" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="317" y="160" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">2</text>

  <rect x="356" y="134" width="46" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="379" y="160" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">1</text>

  <!-- arrows down to checks -->
  <path d="M 193 174 L 193 196" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 255 174 L 255 196" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 317 174 L 317 196" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 379 174 L 379 196" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ====== CHECK ROW: num % d == 0 ? ====== -->
  <rect x="170" y="200" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="193" y="217" text-anchor="middle" font-size="9.5" fill="#888">1248%8</text>
  <text x="193" y="232" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">=0 ✓</text>

  <rect x="232" y="200" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="255" y="217" text-anchor="middle" font-size="9.5" fill="#888">1248%4</text>
  <text x="255" y="232" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">=0 ✓</text>

  <rect x="294" y="200" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="317" y="217" text-anchor="middle" font-size="9.5" fill="#888">1248%2</text>
  <text x="317" y="232" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">=0 ✓</text>

  <rect x="356" y="200" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="379" y="217" text-anchor="middle" font-size="9.5" fill="#888">1248%1</text>
  <text x="379" y="232" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">=0 ✓</text>

  <!-- converge arrows to count -->
  <path d="M 193 240 L 193 262 L 270 262" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 255 240 L 255 258 L 270 258" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 317 240 L 317 258 L 270 258" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 379 240 L 379 262 L 270 262" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 270 262 L 270 278" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ====== ANSWER ====== -->
  <rect x="180" y="282" width="180" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="307" text-anchor="middle" font-size="13.5" fill="#b85450" font-weight="bold">命中数 = 4 → return 4</text>

  <!-- ====== bottom annotation ====== -->
  <rect x="50" y="330" width="440" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="346" text-anchor="middle" font-size="10.5" fill="#555">要点：取余用原始 num，拆位用临时副本 t；位 0 不出现故无需防除零</text>
</svg>
