<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 演算：nums = [8, 7, 3, 5, 7, 2, 4, 9]（n = 8）</text>

  <!-- 数组格子 -->
  <text x="90" y="50" text-anchor="end" font-size="11" fill="#888">核 P(i) →</text>
  <text x="119" y="50" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="165" y="50" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">2</text>
  <text x="211" y="50" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">3</text>
  <text x="257" y="50" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="303" y="50" text-anchor="middle" font-size="10" fill="#999">5</text>
  <text x="349" y="50" text-anchor="middle" font-size="10" fill="#999">6</text>
  <text x="395" y="50" text-anchor="middle" font-size="10" fill="#999">7</text>
  <text x="441" y="50" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">2</text>

  <text x="90" y="72" text-anchor="end" font-size="11" fill="#888">下标 i →</text>
  <rect x="97" y="56" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="119" y="74" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="143" y="56" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="165" y="74" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="189" y="56" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="211" y="74" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="235" y="56" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="257" y="74" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="281" y="56" width="44" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="303" y="74" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="327" y="56" width="44" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="349" y="74" text-anchor="middle" font-size="12" fill="#333">6</text>
  <rect x="373" y="56" width="44" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="395" y="74" text-anchor="middle" font-size="12" fill="#333">7</text>
  <rect x="419" y="56" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="441" y="74" text-anchor="middle" font-size="12" fill="#333">8</text>

  <text x="90" y="104" text-anchor="end" font-size="11" fill="#888">元素值 →</text>
  <rect x="97" y="88" width="44" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="119" y="106" text-anchor="middle" font-size="12" fill="#333">8</text>
  <rect x="143" y="88" width="44" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="165" y="106" text-anchor="middle" font-size="12" fill="#333">7</text>
  <rect x="189" y="88" width="44" height="26" fill="#ffffff" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="211" y="106" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="235" y="88" width="44" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="257" y="106" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="281" y="88" width="44" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
