  <rect x="327" y="88" width="44" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="349" y="106" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="373" y="88" width="44" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="395" y="106" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="419" y="88" width="44" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="441" y="106" text-anchor="middle" font-size="12" fill="#333">9</text>

  <!-- 分组求和表 -->
  <text x="280" y="132" text-anchor="middle" font-size="12" fill="#555">按核分组求和：</text>

  <rect x="55" y="140" width="76" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="93" y="158" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">核 k</text>
  <rect x="131" y="140" width="148" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="205" y="158" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">组内下标（k·m²）</text>
  <rect x="279" y="140" width="136" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="347" y="158" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">求和过程</text>
  <rect x="415" y="140" width="86" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="458" y="158" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">组和</text>

  <rect x="55" y="166" width="76" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="93" y="184" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="131" y="166" width="148" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="205" y="184" text-anchor="middle" font-size="12" fill="#333">1, 4</text>
  <rect x="279" y="166" width="136" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="347" y="184" text-anchor="middle" font-size="12" fill="#333">8 + 5</text>
  <rect x="415" y="166" width="86" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="458" y="184" text-anchor="middle" font-size="12" fill="#333">13</text>

  <rect x="55" y="192" width="76" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="93" y="210" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="131" y="192" width="148" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="205" y="210" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2, 8</text>
  <rect x="279" y="192" width="136" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="347" y="210" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">7 + 9</text>
  <rect x="415" y="192" width="86" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="458" y="210" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">16 ★</text>

  <rect x="55" y="218" width="76" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="93" y="236" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="131" y="218" width="148" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="205" y="236" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="279" y="218" width="136" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="347" y="236" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="415" y="218" width="86" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="458" y="236" text-anchor="middle" font-size="12" fill="#333">3</text>

  <rect x="55" y="244" width="76" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="93" y="262" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="131" y="244" width="148" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="205" y="262" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="279" y="244" width="136" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="347" y="262" text-anchor="middle" font-size="12" fill="#333">7</text>
  <rect x="415" y="244" width="86" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="458" y="262" text-anchor="middle" font-size="12" fill="#333">7</text>

  <rect x="55" y="270" width="76" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="93" y="288" text-anchor="middle" font-size="12" fill="#333">6</text>
  <rect x="131" y="270" width="148" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="205" y="288" text-anchor="middle" font-size="12" fill="#333">6</text>
  <rect x="279" y="270" width="136" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="347" y="288" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="415" y="270" width="86" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="458" y="288" text-anchor="middle" font-size="12" fill="#333">2</text>

  <rect x="55" y="296" width="76" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="93" y="314" text-anchor="middle" font-size="12" fill="#333">7</text>
  <rect x="131" y="296" width="148" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="205" y="314" text-anchor="middle" font-size="12" fill="#333">7</text>
  <rect x="279" y="296" width="136" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="347" y="314" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="415" y="296" width="86" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="458" y="314" text-anchor="middle" font-size="12" fill="#333">4</text>

  <!-- 结论框 -->
  <rect x="30" y="344" width="500" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="370" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">ans = max(13, 16, 3, 7, 2, 4) = 16</text>
  <text x="280" y="396" text-anchor="middle" font-size="12" fill="#b85450">选下标 {2, 8}：2×8 = 16 = 4²，组内任意对的乘积都是完全平方数</text>
</svg>
