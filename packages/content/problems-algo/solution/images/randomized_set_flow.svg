<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="900" height="560" fill="#fdfcf7"/>
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">三操作流程：insert · remove · getRandom</text>
  <path d="M 300 46 Q 450 54 600 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Column 1: insert ===== -->
  <text x="150" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">insert(val)</text>
  <!-- start -->
  <g filter="url(#sk)"><rect x="90" y="92" width="120" height="30" rx="14" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="150" y="112" text-anchor="middle" font-size="12" fill="#2b6e9e">开始 insert</text>
  <path d="M 150 122 L 150 138" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <!-- diamond -->
  <g filter="url(#sk)"><path d="M 150 140 L 215 172 L 150 204 L 85 172 Z" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="150" y="170" text-anchor="middle" font-size="11" fill="#7a5415">val ∈ idx ?</text>
  <text x="150" y="184" text-anchor="middle" font-size="10" fill="#7a5415">(已存在?)</text>
  <!-- yes -->
  <path d="M 85 172 L 50 172 L 50 250" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="55" y="166" font-size="10.5" fill="#b85450" font-weight="bold">是</text>
  <g filter="url(#sk)"><rect x="14" y="252" width="92" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="60" y="272" text-anchor="middle" font-size="11" fill="#b03a3a">return</text>
  <text x="60" y="288" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">false</text>
  <!-- no -->
  <path d="M 215 172 L 250 172 L 250 232" stroke="#2e6e2e" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="225" y="166" font-size="10.5" fill="#2e6e2e" font-weight="bold">否</text>
  <g filter="url(#sk)"><rect x="170" y="234" width="160" height="40" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <text x="250" y="252" text-anchor="middle" font-size="11" fill="#2e6e2e">idx[val] = vals.size()</text>
  <text x="250" y="267" text-anchor="middle" font-size="11" fill="#2e6e2e">vals.push_back(val)</text>
  <path d="M 250 274 L 250 296" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="190" y="298" width="120" height="40" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="250" y="324" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">return true</text>
  <text x="150" y="360" text-anchor="middle" font-size="10" fill="#888">尾插 + 记下标  O(1)</text>

  <!-- ===== Column 2: remove ===== -->
  <text x="465" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">remove(val)</text>
  <g filter="url(#sk)"><rect x="405" y="92" width="120" height="30" rx="14" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="465" y="112" text-anchor="middle" font-size="12" fill="#7a5415">开始 remove</text>
  <path d="M 465 122 L 465 138" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><path d="M 465 140 L 530 172 L 465 204 L 400 172 Z" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="465" y="170" text-anchor="middle" font-size="11" fill="#7a5415">val ∈ idx ?</text>
  <text x="465" y="184" text-anchor="middle" font-size="10" fill="#7a5415">(存在?)</text>
  <!-- no -->
  <path d="M 400 172 L 365 172 L 365 250" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="370" y="166" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  <g filter="url(#sk)"><rect x="329" y="252" width="92" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="375" y="272" text-anchor="middle" font-size="11" fill="#b03a3a">return</text>
  <text x="375" y="288" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">false</text>
  <!-- yes -->
  <path d="M 530 172 L 565 172 L 565 226" stroke="#2e6e2e" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="540" y="166" font-size="10.5" fill="#2e6e2e" font-weight="bold">是</text>
  <g filter="url(#sk)"><rect x="470" y="228" width="190" height="40" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <text x="565" y="246" text-anchor="middle" font-size="10.5" fill="#2e6e2e">i = idx[val] ;  last = vals.back()</text>
  <text x="565" y="261" text-anchor="middle" font-size="10.5" fill="#2e6e2e">vals[i]=last ;  idx[last]=i  ← 搬末尾</text>
  <path d="M 565 268 L 565 286" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="470" y="288" width="190" height="34" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="565" y="310" text-anchor="middle" font-size="11" fill="#7a5415">vals.pop_back() ;  idx.erase(val)</text>
  <path d="M 565 322 L 565 342" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="505" y="344" width="120" height="40" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="565" y="370" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">return true</text>
  <text x="465" y="404" text-anchor="middle" font-size="10" fill="#888">交换末尾删除  O(1)</text>

  <!-- ===== Column 3: getRandom ===== -->
  <text x="780" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">getRandom()</text>
  <g filter="url(#sk)"><rect x="720" y="92" width="120" height="30" rx="14" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="780" y="112" text-anchor="middle" font-size="12" fill="#2e6e2e">开始 getRandom</text>
  <path d="M 780 122 L 780 146" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="690" y="148" width="180" height="50" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <text x="780" y="170" text-anchor="middle" font-size="11" fill="#2e6e2e">r = rand() % vals.size()</text>
  <text x="780" y="187" text-anchor="middle" font-size="11" fill="#2e6e2e">return vals[r]</text>
  <path d="M 780 198 L 780 222" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="710" y="224" width="140" height="40" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="780" y="250" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">等概率返回</text>
  <!-- probability illustration -->
  <g font-size="10" fill="#888">
    <text x="780" y="290" text-anchor="middle">vals = [1, 5, 7]</text>
    <g filter="url(#sk)"><rect x="710" y="298" width="40" height="22" rx="3" fill="#fff" stroke="#4a8e4a"/></g>
    <text x="730" y="313" text-anchor="middle">1</text>
    <g filter="url(#sk)"><rect x="750" y="298" width="40" height="22" rx="3" fill="#fff" stroke="#4a8e4a"/></g>
    <text x="770" y="313" text-anchor="middle">5</text>
    <g filter="url(#sk)"><rect x="790" y="298" width="40" height="22" rx="3" fill="#fff" stroke="#4a8e4a"/></g>
    <text x="810" y="313" text-anchor="middle">7</text>
    <text x="780" y="338" text-anchor="middle" fill="#2e6e2e">每个 1/3 概率</text>
  </g>
  <text x="780" y="370" text-anchor="middle" font-size="10" fill="#888">取模 + 下标访问  O(1)</text>

  <!-- ===== bottom invariant note ===== -->
  <g filter="url(#sk)"><rect x="60" y="448" width="780" height="86" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2" stroke-dasharray="5 3"/></g>
  <text x="450" y="474" text-anchor="middle" font-size="12.5" fill="#7a5415" font-weight="bold">不变式（Invariant）</text>
  <text x="450" y="494" text-anchor="middle" font-size="11" fill="#542">idx 始终记录每个 val 的当前下标；vals 头部始终紧凑排列所有有效元素、无空洞</text>
  <text x="450" y="512" text-anchor="middle" font-size="11" fill="#542">remove 后数组长度 = 哈希表大小 = 元素个数 → getRandom 永远命中有效元素</text>
  <text x="450" y="528" text-anchor="middle" font-size="10" fill="#b03a3a">顺序：idx[last]=i 必须在 erase(val) 之前（覆盖「删的就是末尾」边界）</text>
</svg>
