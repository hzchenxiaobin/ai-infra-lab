<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto">
      <path d="M 0 0 L 8 0 L 4 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="360" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">由 r = tot mod C 落入哪一段 ⇒ O(1) 定位位置与朝向</text>
  <text x="320" y="46" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">r 沿周界四段递增（图按 5×3 网格等比例：段长 4/2/4/2）</text>

  <rect x="48" y="148" width="172" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="220" y="148" width="86" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="306" y="148" width="172" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="478" y="148" width="86" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>

  <text x="134" y="170" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">东 East</text>
  <text x="263" y="170" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">北 North</text>
  <text x="392" y="170" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">西 West</text>
  <text x="521" y="170" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">南 South</text>

  <g font-size="10.5" fill="#666" filter="url(#rough2)" text-anchor="middle">
    <text x="48" y="200">0</text>
    <text x="220" y="200">w−1</text>
    <text x="306" y="200">w+h−2</text>
    <text x="478" y="200">2w+h−3</text>
    <text x="564" y="200">C</text>
  </g>
  <g stroke="#bbb" stroke-width="1" filter="url(#rough2)">
    <line x1="48" y1="182" x2="48" y2="190"/>
    <line x1="220" y1="182" x2="220" y2="190"/>
    <line x1="306" y1="182" x2="306" y2="190"/>
    <line x1="478" y1="182" x2="478" y2="190"/>
    <line x1="564" y1="182" x2="564" y2="190"/>
  </g>

  <text x="306" y="116" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">r 增大 →</text>

  <circle cx="48" cy="165" r="6" fill="#b85450" stroke="#fff" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="10" y="62" width="156" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="88" y="80" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">特例 r = 0：位置 (0,0)</text>
  <text x="88" y="96" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">moved=false → 东 East</text>
  <text x="88" y="108" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">moved=true  → 南 South</text>
  <path d="M 48 110 L 48 142" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="40" y="220" width="188" height="58" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="134" y="240" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">东段 · k = r</text>
    <text x="134" y="257" text-anchor="middle" font-size="11" fill="#444">pos (k, 0)</text>
    <text x="134" y="272" text-anchor="middle" font-size="10" fill="#888">r ∈ [1, w−1]</text>

    <rect x="232" y="220" width="110" height="58" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="287" y="240" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">北段 · k=r−(w−1)</text>
    <text x="287" y="257" text-anchor="middle" font-size="11" fill="#444">pos (w−1, k)</text>
    <text x="287" y="272" text-anchor="middle" font-size="10" fill="#888">r ∈ [w, w+h−2]</text>

    <rect x="346" y="220" width="188" height="58" fill="#fafafa" stroke="#d6a040" stroke-width="1.5" rx="6"/>
    <text x="440" y="240" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">西段 · k=r−(w+h−2)</text>
    <text x="440" y="257" text-anchor="middle" font-size="11" fill="#444">pos (w−1−k, h−1)</text>
    <text x="440" y="272" text-anchor="middle" font-size="10" fill="#888">r ∈ [w+h−1, 2w+h−3]</text>

    <rect x="540" y="220" width="86" height="58" fill="#fafafa" stroke="#b85450" stroke-width="1.5" rx="6"/>
    <text x="583" y="237" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">南段</text>
    <text x="583" y="251" text-anchor="middle" font-size="10" fill="#444">k=r−(2w+h−3)</text>
    <text x="583" y="265" text-anchor="middle" font-size="10" fill="#444">pos (0, h−1−k)</text>
  </g>

  <rect x="40" y="300" width="560" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="320" y="318" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">累计扣除：每段判 r &lt; w / r &lt; h，扣完即得段内偏移 k</text>
  <text x="320" y="334" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⇒ getPos / getDir 至多 4 次比较，O(1) 定位</text>
</svg>
