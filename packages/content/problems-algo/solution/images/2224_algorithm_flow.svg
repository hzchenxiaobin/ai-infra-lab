<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：解析时间 → 求差 → 逐面额取商累加</text>

  <!-- ===== Step 1: parse ===== -->
  <rect x="160" y="40" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="58" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">解析 "HH:MM" → 分钟数</text>
  <text x="260" y="73" text-anchor="middle" font-size="10" fill="#555">mins = HH × 60 + MM</text>

  <path d="M 260 82 L 260 98" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: diff ===== -->
  <rect x="160" y="100" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="118" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">求差值 d</text>
  <text x="260" y="133" text-anchor="middle" font-size="10" fill="#555">d = correct − current（分钟）</text>

  <path d="M 260 142 L 260 158" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: init ops ===== -->
  <rect x="200" y="160" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="180" text-anchor="middle" font-size="11" fill="#333">ops = 0</text>

  <path d="M 260 192 L 260 208" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Loop: for each denom in [60,15,5,1] ===== -->
  <polygon points="260,210 370,250 260,290 150,250" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="240" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">还有面额</text>
  <text x="260" y="256" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">denom 待处理？</text>

  <!-- No branch: return -->
  <path d="M 370 250 L 420 250" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="390" y="244" text-anchor="middle" font-size="10" fill="#888">否</text>
  <rect x="420" y="232" width="86" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="463" y="248" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">返回 ops</text>
  <text x="463" y="262" text-anchor="middle" font-size="9" fill="#888">最优解</text>

  <!-- Yes branch down -->
  <path d="M 260 290 L 260 306" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="278" y="302" font-size="10" fill="#888">是</text>

  <!-- ===== Greedy body ===== -->
  <rect x="80" y="308" width="360" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="326" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">ops += d / denom ；d %= denom</text>
  <text x="260" y="341" text-anchor="middle" font-size="10" fill="#555">denom 依次取 60 → 15 → 5 → 1</text>

  <!-- loop back arrow -->
  <path d="M 80 328 L 50 328 L 50 250 L 150 250" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <text x="58" y="290" font-size="9.5" fill="#888">下一面额</text>
</svg>
