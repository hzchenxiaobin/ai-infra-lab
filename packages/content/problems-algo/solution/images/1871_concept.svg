<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心直觉：对位置 j，只需窗口 [j−maxJump, j−minJump] 中有可达的 0</text>

  <!-- String s row -->
  <text x="40" y="56" font-size="12" fill="#888" filter="url(#rough2)">s =</text>
  <!-- cells: 0 1 1 0 1 0  (indices 0..5), cell width 50, start x=80 -->
  <rect x="80" y="44" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="68" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="130" y="44" width="50" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="68" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="180" y="44" width="50" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="205" y="68" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="230" y="44" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="68" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="280" y="44" width="50" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="305" y="68" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="330" y="44" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="355" y="68" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>

  <!-- index labels -->
  <text x="105" y="96" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=0</text>
  <text x="155" y="96" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=1</text>
  <text x="205" y="96" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=2</text>
  <text x="255" y="96" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=3</text>
  <text x="305" y="96" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=4</text>
  <text x="355" y="96" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j=5</text>

  <!-- dp row -->
  <text x="40" y="128" font-size="12" fill="#888" filter="url(#rough2)">dp=</text>
  <rect x="80" y="116" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="136" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">T</text>
  <rect x="130" y="116" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="136" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">F</text>
  <rect x="180" y="116" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="205" y="136" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">F</text>
  <rect x="230" y="116" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="136" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">T</text>
  <rect x="280" y="116" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="305" y="136" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">F</text>
  <rect x="330" y="116" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="355" y="136" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">T?</text>

  <!-- Window highlight for j=5: [5-3, 5-2] = [2, 3] -->
  <rect x="180" y="110" width="100" height="42" fill="none" stroke="#d6a040" stroke-width="2.5" stroke-dasharray="6,3" rx="6" filter="url(#rough2)"/>
  <text x="230" y="168" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">窗口 [j−maxJump, j−minJump] = [2, 3]</text>

  <!-- Arrow from window to j=5 -->
  <path d="M 280 150 Q 310 175 340 150" stroke="#d6a040" stroke-width="2" fill="none" stroke-dasharray="4,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="185" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">dp[3]=T 在窗口内 → count=1</text>

  <!-- Formula box -->
  <rect x="420" y="44" width="180" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="510" y="64" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">转移条件</text>
  <text x="510" y="82" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">dp[j] = (s[j]=='0')</text>
  <text x="510" y="98" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">  且 count &gt; 0</text>

  <!-- Sliding window explanation -->
  <rect x="420" y="124" width="180" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="510" y="144" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">滑动窗口维护</text>
  <text x="510" y="162" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">j++ 时右端入窗</text>
  <text x="510" y="176" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">左端出窗</text>
  <text x="510" y="194" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">count 增/减 O(1)</text>

  <!-- Bottom: sliding window arrow -->
  <text x="40" y="220" font-size="12" fill="#888" filter="url(#rough2)">窗口随 j 右移（minJump=2, maxJump=3）：</text>

  <!-- j=2: window [0,0] -->
  <rect x="80" y="232" width="50" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="250" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[0,0]</text>
  <text x="105" y="274" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">j=2</text>

  <!-- j=3: window [0,1] -->
  <rect x="130" y="232" width="100" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="250" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[0,1]</text>
  <text x="180" y="274" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">j=3</text>

  <!-- j=4: window [1,2] -->
  <rect x="180" y="282" width="100" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="300" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[1,2]</text>
  <text x="230" y="324" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">j=4</text>

  <!-- j=5: window [2,3] -->
  <rect x="230" y="282" width="100" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="300" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[2,3]</text>
  <text x="280" y="324" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">j=5</text>

  <!-- sliding arrows -->
  <path d="M 180 266 L 230 280" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 266 L 330 280" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Bottom summary -->
  <rect x="50" y="346" width="520" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="310" y="366" text-anchor="middle" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">dp[j] = (s[j]=='0') ∧ (窗口内存在 dp[i]=true)</text>
  <text x="310" y="382" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">窗口用 count 计数维护，j 右移时右端入窗 + 左端出窗，O(n) 总时间</text>
</svg>
