<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="500" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：计数 → 查重（两阶段）</text>

  <!-- Phase 1 label -->
  <text x="40" y="46" font-size="11" fill="#446688" font-weight="bold">阶段一：遍历数组，统计每个值的出现次数</text>

  <!-- Start -->
  <ellipse cx="270" cy="74" rx="120" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="78" text-anchor="middle" font-size="12" fill="#333">开始: freq = {} , seen = {}</text>

  <path d="M 270 92 L 270 102" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond 1: more elements? -->
  <polygon points="270,104 380,134 270,164 160,134" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="130" text-anchor="middle" font-size="12" fill="#333">还有元素</text>
  <text x="270" y="146" text-anchor="middle" font-size="11" fill="#666">arr[i] ?</text>

  <!-- Yes -> down -->
  <path d="M 270 164 L 270 180" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="176" font-size="11" fill="#82b366">是</text>

  <!-- Count box -->
  <rect x="160" y="184" width="220" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="204" text-anchor="middle" font-size="12" fill="#333">freq[arr[i]] ++ ， i++</text>

  <!-- loop back LEFT to diamond1 -->
  <path d="M 160 199 L 64 199 L 64 134 L 160 134" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="48" y="170" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 48 170)">下一个</text>

  <!-- No -> right then down to phase 2 -->
  <path d="M 380 134 L 422 134" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="398" y="126" text-anchor="middle" font-size="11" fill="#b85450">否</text>

  <!-- Phase 2 label -->
  <text x="40" y="248" font-size="11" fill="#4a7a3a" font-weight="bold">阶段二：遍历频次，检查是否互不相同</text>

  <!-- connector from phase1 No down to diamond2 top -->
  <path d="M 422 134 L 422 264 L 270 264" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond 2: more freq entries? -->
  <polygon points="270,266 380,296 270,326 160,296" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="292" text-anchor="middle" font-size="12" fill="#333">还有频次</text>
  <text x="270" y="308" text-anchor="middle" font-size="11" fill="#666">freq 项 ?</text>

  <!-- Yes -> down -->
  <path d="M 270 326 L 270 342" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="338" font-size="11" fill="#82b366">是</text>

  <!-- Diamond 3: count in seen? -->
  <polygon points="270,344 392,376 270,408 148,376" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="372" text-anchor="middle" font-size="12" fill="#333">c = freq[key]</text>
  <text x="270" y="388" text-anchor="middle" font-size="11" fill="#666">c ∈ seen ?</text>

  <!-- Yes (collision) -> left to false -->
  <path d="M 148 376 L 100 376" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="124" y="368" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">是</text>

  <!-- false node -->
  <rect x="30" y="362" width="70" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="65" y="381" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">false</text>

  <!-- No (not in seen) -> right then down -->
  <path d="M 392 376 L 440 376 L 440 410" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="416" y="368" text-anchor="middle" font-size="11" fill="#82b366">否</text>

  <!-- add to seen box -->
  <rect x="360" y="412" width="160" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="440" y="431" text-anchor="middle" font-size="12" fill="#333">seen.insert(c)</text>

  <!-- loop back RIGHT to diamond2 -->
  <path d="M 520 426 L 520 296 L 380 296" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="510" y="360" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 510 360)">下一项</text>

  <!-- No (no more freq) -> left to true -->
  <path d="M 160 296 L 110 296" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="132" y="288" text-anchor="middle" font-size="11" fill="#b85450">否</text>

  <!-- true node -->
  <rect x="30" y="282" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="70" y="301" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">true</text>

  <!-- summary -->
  <text x="270" y="472" text-anchor="middle" font-size="10" fill="#888">阶段一 O(n) 计数 + 阶段二 O(m) 查重（m 为不同值数） → 总 O(n)；空间 O(m)</text>
  <text x="270" y="488" text-anchor="middle" font-size="10" fill="#888">提前命中重复即返回 false，最坏才走完全程</text>
</svg>
