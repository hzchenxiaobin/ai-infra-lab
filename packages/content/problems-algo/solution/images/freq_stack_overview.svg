<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8edb"/>
    </marker>
  </defs>
  <rect width="900" height="470" fill="#fdfcf7"/>

  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">最大频率栈：频率桶 + 哈希表</text>
  <path d="M 270 40 Q 450 48 630 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- freq hash map (left) -->
  <text x="115" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">freq 哈希表 (O(1) 取频率)</text>
  <g filter="url(#sk)">
    <rect x="40" y="84" width="150" height="170" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="62" y="106" font-size="11" fill="#444">val</text>
  <text x="165" y="106" font-size="11" fill="#444">freq</text>
  <line x1="50" y1="112" x2="180" y2="112" stroke="#9e9e9e" stroke-width="1" filter="url(#sk)"/>
  <text x="62" y="134" font-size="12" fill="#444" font-weight="bold">5</text>
  <text x="165" y="134" font-size="12" fill="#2e6e2e" font-weight="bold">3</text>
  <text x="62" y="158" font-size="12" fill="#444" font-weight="bold">7</text>
  <text x="165" y="158" font-size="12" fill="#7a5415" font-weight="bold">2</text>
  <text x="62" y="182" font-size="12" fill="#444" font-weight="bold">4</text>
  <text x="165" y="182" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <text x="58" y="216" font-size="10" fill="#888">记录每个值的</text>
  <text x="58" y="232" font-size="10" fill="#888">当前出现次数</text>

  <!-- maxFreq indicator (bottom-left) -->
  <g filter="url(#sk)">
    <rect x="40" y="270" width="150" height="52" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="115" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">maxFreq</text>
  <text x="115" y="312" text-anchor="middle" font-size="11" fill="#b85450">= 当前最大频率</text>

  <!-- Frequency bucket stacks (right) -->
  <text x="560" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">频率桶 group[f] → 栈 (同频内 LIFO)</text>

  <!-- group[1] stack -->
  <text x="260" y="118" font-size="12" font-weight="bold" fill="#b85450">group[1]</text>
  <g filter="url(#sk)">
    <rect x="320" y="104" width="56" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="348" y="124" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">4</text>
  <text x="388" y="124" font-size="9" fill="#b85450">←栈顶</text>
  <g filter="url(#sk)">
    <rect x="320" y="136" width="56" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="348" y="156" text-anchor="middle" font-size="12" fill="#b85450">7</text>
  <g filter="url(#sk)">
    <rect x="320" y="168" width="56" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="348" y="188" text-anchor="middle" font-size="12" fill="#b85450">5</text>
  <text x="392" y="180" font-size="9" fill="#888">栈底</text>

  <!-- group[2] stack -->
  <text x="470" y="118" font-size="12" font-weight="bold" fill="#7a5415">group[2]</text>
  <g filter="url(#sk)">
    <rect x="530" y="104" width="56" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="558" y="124" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">7</text>
  <text x="598" y="124" font-size="9" fill="#7a5415">←栈顶</text>
  <g filter="url(#sk)">
    <rect x="530" y="136" width="56" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="558" y="156" text-anchor="middle" font-size="12" fill="#7a5415">5</text>
  <text x="602" y="148" font-size="9" fill="#888">栈底</text>

  <!-- group[3] stack -->
  <text x="680" y="118" font-size="12" font-weight="bold" fill="#2e6e2e">group[3]</text>
  <g filter="url(#sk)">
    <rect x="740" y="104" width="56" height="30" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="768" y="124" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">5</text>
  <text x="808" y="124" font-size="9" fill="#2e6e2e" font-weight="bold">←栈顶(pop!)</text>

  <!-- maxFreq arrow to group[3] -->
  <path d="M 190 290 Q 260 200 738 116" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="5 3" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="430" y="262" font-size="10" fill="#b85450" font-style="italic">pop 时直接取 maxFreq 桶的栈顶</text>

  <!-- freq -> bucket dashed arrows -->
  <path d="M 190 128 Q 240 110 738 116" stroke="#4a8edb" stroke-width="1" fill="none" stroke-dasharray="4 2" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 190 152 Q 250 130 528 120" stroke="#4a8edb" stroke-width="1" fill="none" stroke-dasharray="4 2" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 190 176 Q 240 150 318 150" stroke="#4a8edb" stroke-width="1" fill="none" stroke-dasharray="4 2" marker-end="url(#arB)" filter="url(#sk)"/>

  <!-- operations summary -->
  <g filter="url(#sk)">
    <rect x="40" y="345" width="820" height="108" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/>
  </g>
  <text x="60" y="370" font-size="13" font-weight="bold" fill="#444">操作要点：</text>
  <text x="60" y="394" font-size="11" fill="#2e6e2e" font-weight="bold">push(val)：</text>
  <text x="180" y="394" font-size="11" fill="#444">freq[val]++ → 令 f=freq[val] → group[f].push(val) → maxFreq=max(maxFreq, f)</text>
  <text x="60" y="416" font-size="11" fill="#b85450" font-weight="bold">pop()：</text>
  <text x="180" y="416" font-size="11" fill="#444">x=group[maxFreq].pop() → freq[x]-- → 若该桶空则 maxFreq-- → return x</text>
  <text x="60" y="440" font-size="10" fill="#888" font-style="italic">同频桶内是栈(LIFO)：栈顶 = 最晚达到该频率的值，即「最接近栈顶」的那个</text>
</svg>
