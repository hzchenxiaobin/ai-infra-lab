<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：逐行更新 heights，每行复用 84 题的单调栈</text>

  <!-- Start -->
  <ellipse cx="280" cy="58" rx="105" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="11" fill="#333">开始：遍历每一行 i = 0 .. R−1</text>

  <path d="M 280 78 L 280 94" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 1 update heights -->
  <rect x="130" y="98" width="300" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="120" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 更新 heights[j]（j = 0..C−1）</text>
  <text x="280" y="138" text-anchor="middle" font-size="11" fill="#444">matrix[i][j] == '1' → heights[j] += 1</text>
  <text x="280" y="154" text-anchor="middle" font-size="11" fill="#b85450">matrix[i][j] == '0' → heights[j] = 0</text>

  <path d="M 280 160 L 280 176" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 largestRectangleArea -->
  <rect x="90" y="180" width="380" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="202" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② area = largestRectangleArea(heights)</text>
  <text x="280" y="220" text-anchor="middle" font-size="11" fill="#444">单调栈 + 末尾哨兵 0（复用第 84 题模板）</text>
  <text x="280" y="234" text-anchor="middle" font-size="10" fill="#888">出栈时 h × (i − 新栈顶 − 1) 结算面积</text>

  <path d="M 280 238 L 280 254" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 update max -->
  <rect x="160" y="258" width="240" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="283" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ maxArea = max(maxArea, area)</text>

  <path d="M 280 298 L 280 314" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: more rows? -->
  <polygon points="280,316 386,352 280,388 174,352" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="348" text-anchor="middle" font-size="11" fill="#333">还有下一行?</text>
  <text x="280" y="364" text-anchor="middle" font-size="10" fill="#888">(i &lt; R)</text>

  <!-- yes: loop back to step 1 -->
  <path d="M 174 352 L 60 352 L 60 129 L 130 129" stroke="#82b366" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="66" y="240" text-anchor="middle" font-size="10" fill="#4a7a3a" transform="rotate(-90 66 240)">是 → i++，处理下一行</text>

  <!-- no: end -->
  <path d="M 280 388 L 280 408" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="293" y="400" font-size="10" fill="#b85450">否</text>
  <ellipse cx="280" cy="430" rx="95" ry="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="434" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 maxArea</text>

  <!-- bottom note -->
  <text x="280" y="462" text-anchor="middle" font-size="11" fill="#888">每行 O(C)，共 R 行 → O(R×C)；heights 数组跨行复用，额外空间 O(C)</text>
</svg>
