<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "2-5g-3-J", k = 2</text>

  <!-- Step 1: original -->
  <text x="40" y="62" font-size="12" fill="#446688" font-weight="bold">步骤 1</text>
  <text x="40" y="78" font-size="10.5" fill="#888">原串</text>
  <rect x="120" y="48" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="140" y="70" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="162" y="48" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="182" y="70" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">-</text>
  <rect x="204" y="48" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="224" y="70" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <rect x="246" y="48" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="266" y="70" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">g</text>
  <rect x="288" y="48" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="308" y="70" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">-</text>
  <rect x="330" y="48" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="350" y="70" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="372" y="48" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="392" y="70" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">-</text>
  <rect x="414" y="48" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="434" y="70" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">J</text>
  <text x="470" y="70" font-size="10.5" fill="#888">3 个横线</text>

  <path d="M 280 88 L 280 104" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="100" font-size="10" fill="#666">去 '-' + 大写</text>

  <!-- Step 2: cleaned -->
  <text x="40" y="134" font-size="12" fill="#4a7a3a" font-weight="bold">步骤 2</text>
  <text x="40" y="150" font-size="10.5" fill="#888">清洗后 t</text>
  <rect x="170" y="116" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="194" y="138" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="220" y="116" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="244" y="138" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <rect x="270" y="116" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="294" y="138" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">G</text>
  <rect x="320" y="116" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="344" y="138" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="370" y="116" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="394" y="138" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">J</text>
  <text x="430" y="138" font-size="10.5" fill="#888">n = 5</text>
  <text x="194" y="166" text-anchor="middle" font-size="9.5" fill="#888">i=0</text>
  <text x="244" y="166" text-anchor="middle" font-size="9.5" fill="#888">i=1</text>
  <text x="294" y="166" text-anchor="middle" font-size="9.5" fill="#888">i=2</text>
  <text x="344" y="166" text-anchor="middle" font-size="9.5" fill="#888">i=3</text>
  <text x="394" y="166" text-anchor="middle" font-size="9.5" fill="#888">i=4</text>

  <path d="M 280 172 L 280 188" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="184" font-size="10" fill="#666">first = 5 % 2 = 1</text>

  <!-- Step 3: build groups table -->
  <text x="40" y="214" font-size="12" fill="#d6a040" font-weight="bold">步骤 3</text>
  <text x="40" y="230" font-size="10.5" fill="#888">逐段拼接</text>

  <!-- table header -->
  <rect x="120" y="200" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="150" y="216" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">起始 i</text>
  <rect x="182" y="200" width="80" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="222" y="216" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">切片</text>
  <rect x="264" y="200" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="294" y="216" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">片段</text>
  <rect x="326" y="200" width="170" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="411" y="216" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">res 累积</text>

  <!-- row 1: i=0 first group -->
  <rect x="120" y="228" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="245" text-anchor="middle" font-size="10.5" fill="#333">0 (首组)</text>
  <rect x="182" y="228" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="222" y="245" text-anchor="middle" font-size="10.5" fill="#333">t[0:1]</text>
  <rect x="264" y="228" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="294" y="245" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <rect x="326" y="228" width="170" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="411" y="245" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">"2"</text>

  <!-- row 2: i=1 -->
  <rect x="120" y="258" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="275" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <rect x="182" y="258" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="222" y="275" text-anchor="middle" font-size="10.5" fill="#333">t[1:3]</text>
  <rect x="264" y="258" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="294" y="275" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5G</text>
  <rect x="326" y="258" width="170" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="411" y="275" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">"2-5G"</text>

  <!-- row 3: i=3 -->
  <rect x="120" y="288" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="305" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <rect x="182" y="288" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="222" y="305" text-anchor="middle" font-size="10.5" fill="#333">t[3:5]</text>
  <rect x="264" y="288" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="294" y="305" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3J</text>
  <rect x="326" y="288" width="170" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="411" y="305" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">"2-5G-3J" ✓</text>

  <!-- Step 4: final -->
  <path d="M 280 318 L 280 336" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="40" y="362" font-size="12" fill="#b85450" font-weight="bold">结果</text>
  <rect x="170" y="342" width="60" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="200" y="368" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">2</text>
  <text x="244" y="368" text-anchor="middle" font-size="18" fill="#b85450" font-weight="bold">-</text>
  <rect x="260" y="342" width="90" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="305" y="368" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">5G</text>
  <text x="360" y="368" text-anchor="middle" font-size="18" fill="#b85450" font-weight="bold">-</text>
  <rect x="376" y="342" width="90" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="421" y="368" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">3J</text>

  <text x="280" y="408" text-anchor="middle" font-size="11" fill="#888">首组 1 字符（余数），其后每组恰为 k=2 字符</text>
</svg>
