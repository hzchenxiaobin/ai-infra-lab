<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="5" refY="9" orient="auto">
      <path d="M0,0 L5,9 L10,0 Z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="5" refY="9" orient="auto">
      <path d="M0,0 L5,9 L10,0 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="5" refY="9" orient="auto">
      <path d="M0,0 L5,9 L10,0 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [9,12,5,10,14,3,10]，pivot = 10</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">less = 3, equal = 2, greater = 2 → 起点 l=0, e=3, g=5</text>

  <!-- ===== Original array row ===== -->
  <text x="40" y="64" font-size="11" fill="#555" font-weight="bold">原数组（按扫描顺序）：</text>

  <rect x="60" y="70" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="92" y="96" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">9</text>
  <text x="92" y="124" text-anchor="middle" font-size="8.5" fill="#888">i=0</text>

  <rect x="124" y="70" width="64" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="156" y="96" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">12</text>
  <text x="156" y="124" text-anchor="middle" font-size="8.5" fill="#888">i=1</text>

  <rect x="188" y="70" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="220" y="96" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <text x="220" y="124" text-anchor="middle" font-size="8.5" fill="#888">i=2</text>

  <rect x="252" y="70" width="64" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="284" y="96" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">10</text>
  <text x="284" y="124" text-anchor="middle" font-size="8.5" fill="#888">i=3</text>

  <rect x="316" y="70" width="64" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="348" y="96" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">14</text>
  <text x="348" y="124" text-anchor="middle" font-size="8.5" fill="#888">i=4</text>

  <rect x="380" y="70" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="412" y="96" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <text x="412" y="124" text-anchor="middle" font-size="8.5" fill="#888">i=5</text>

  <rect x="444" y="70" width="64" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="476" y="96" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">10</text>
  <text x="476" y="124" text-anchor="middle" font-size="8.5" fill="#888">i=6</text>

  <!-- ===== Curved arrows: orig idx -> result idx ===== -->
  <!-- 9:  i0 -> r0  (blue, straight) -->
  <path d="M 92 110 C 92 170, 92 200, 92 250" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <!-- 12: i1 -> r5 (red, right) -->
  <path d="M 156 110 C 156 180, 412 190, 412 250" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <!-- 5:  i2 -> r1 (blue, left) -->
  <path d="M 220 110 C 220 180, 156 195, 156 250" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <!-- 10: i3 -> r3 (orange, straight) -->
  <path d="M 284 110 C 284 170, 284 200, 284 250" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <!-- 14: i4 -> r6 (red, right) -->
  <path d="M 348 110 C 348 180, 476 190, 476 250" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <!-- 3:  i5 -> r2 (blue, left) -->
  <path d="M 412 110 C 412 185, 220 195, 220 250" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <!-- 10: i6 -> r4 (orange, left) -->
  <path d="M 476 110 C 476 185, 348 195, 348 250" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- ===== Result array row ===== -->
  <text x="40" y="244" font-size="11" fill="#555" font-weight="bold">结果 ans（按类落位）：</text>

  <!-- region brackets -->
  <path d="M 60 232 L 60 226 L 252 226 L 252 232" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="156" y="222" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">less [0,3)</text>
  <path d="M 252 232 L 252 226 L 380 226 L 380 232" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="316" y="222" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">equal [3,5)</text>
  <path d="M 380 232 L 380 226 L 508 226 L 508 232" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="444" y="222" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">greater [5,7)</text>

  <rect x="60" y="250" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="92" y="276" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">9</text>
  <text x="92" y="304" text-anchor="middle" font-size="8.5" fill="#446688">l=0→1</text>

  <rect x="124" y="250" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="156" y="276" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <text x="156" y="304" text-anchor="middle" font-size="8.5" fill="#446688">l=1→2</text>

  <rect x="188" y="250" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="220" y="276" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <text x="220" y="304" text-anchor="middle" font-size="8.5" fill="#446688">l=2→3</text>

  <rect x="252" y="250" width="64" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="284" y="276" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">10</text>
  <text x="284" y="304" text-anchor="middle" font-size="8.5" fill="#d6a040">e=3→4</text>

  <rect x="316" y="250" width="64" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="348" y="276" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">10</text>
  <text x="348" y="304" text-anchor="middle" font-size="8.5" fill="#d6a040">e=4→5</text>

  <rect x="380" y="250" width="64" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="412" y="276" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">12</text>
  <text x="412" y="304" text-anchor="middle" font-size="8.5" fill="#b85450">g=5→6</text>

  <rect x="444" y="250" width="64" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="476" y="276" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">14</text>
  <text x="476" y="304" text-anchor="middle" font-size="8.5" fill="#b85450">g=6→7</text>

  <!-- ===== Bottom note ===== -->
  <rect x="40" y="324" width="480" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="346" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">同色箭头按扫描先后写入单调递增的下标 → 同类相对顺序自动保留</text>
  <text x="280" y="364" text-anchor="middle" font-size="10.5" fill="#888">最终 ans = [9, 5, 3, 10, 10, 12, 14] ✓</text>
  <text x="280" y="378" text-anchor="middle" font-size="10" fill="#888">三个游标互不干扰，扫描结束 l=3, e=5, g=7（恰好填满）</text>
</svg>
