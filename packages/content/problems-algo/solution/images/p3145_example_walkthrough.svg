<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 376"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="376" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：queries = [[2,5,3], [7,7,4]]</text>

  <!-- big_nums 前 9 个元素 -->
  <text x="30" y="35" font-size="9" fill="#999" filter="url(#rough2)">下标→</text>
  <text x="52" y="35" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="96" y="35" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="140" y="35" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="184" y="35" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>
  <text x="228" y="35" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">4</text>
  <text x="272" y="35" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">5</text>
  <text x="316" y="35" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">6</text>
  <text x="360" y="35" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">7</text>
  <text x="404" y="35" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">8</text>

  <rect x="30" y="40" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="52" y="60" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="74" y="40" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="96" y="60" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="118" y="40" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="60" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="162" y="40" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="184" y="60" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="206" y="40" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="228" y="60" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="250" y="40" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="272" y="60" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="294" y="40" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="316" y="60" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="338" y="40" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="60" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="382" y="40" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="404" y="60" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>

  <text x="52" y="84" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">e=0</text>
  <text x="96" y="84" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">e=1</text>
  <text x="140" y="84" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">e=0</text>
  <text x="184" y="84" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">e=1</text>
  <text x="228" y="84" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">e=2</text>
  <text x="272" y="84" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">e=0</text>
  <text x="316" y="84" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">e=2</text>
  <text x="360" y="84" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">e=1</text>
  <text x="404" y="84" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">e=2</text>

  <rect x="115" y="36" width="182" height="38" fill="none" stroke="#d6a040" stroke-width="2.2" stroke-dasharray="6 4" rx="6" filter="url(#rough2)"/>
  <rect x="335" y="36" width="50" height="38" fill="none" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="100" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">橙色虚线＝查询① 区间 [2,5]　　绿框＝查询② 区间 [7,7]</text>

  <!-- 查询① -->
  <rect x="22" y="112" width="238" height="196" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="141" y="134" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">查询 ① [2, 5, 3]</text>
  <text x="34" y="158" font-size="10.8" fill="#333" filter="url(#rough2)">S(6)：f(4)=5 ≤ 6 &lt; f(5)=7</text>
  <text x="34" y="178" font-size="10.8" fill="#333" filter="url(#rough2)">→ x=4，r = 6 − 5 = 1</text>
  <text x="34" y="198" font-size="10.8" fill="#333" filter="url(#rough2)">g(4) = 0+1+1+2 = 4</text>
  <text x="34" y="218" font-size="10.8" fill="#333" filter="url(#rough2)">尾巴 5=101₂ 最低 1 置位 → +0</text>
  <text x="34" y="238" font-size="10.8" fill="#333" filter="url(#rough2)">S(2)：x=2，r=0 → g(2) = 1</text>
  <text x="34" y="258" font-size="10.8" fill="#333" filter="url(#rough2)">E = 4 − 1 = 3</text>
  <text x="141" y="288" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">2³ mod 3 = 8 mod 3 = 2 ✓</text>

  <!-- 查询② -->
  <rect x="260" y="112" width="238" height="196" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="379" y="134" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">查询 ② [7, 7, 4]</text>
  <text x="272" y="158" font-size="10.8" fill="#333" filter="url(#rough2)">S(8)：f(5)=7 ≤ 8 &lt; f(6)=9</text>
  <text x="272" y="178" font-size="10.8" fill="#333" filter="url(#rough2)">→ x=5，r = 8 − 7 = 1</text>
  <text x="272" y="198" font-size="10.8" fill="#333" filter="url(#rough2)">g(5) = 6</text>
  <text x="272" y="218" font-size="10.8" fill="#333" filter="url(#rough2)">尾巴 6=110₂ 最低 1 置位 → +1</text>
  <text x="272" y="238" font-size="10.8" fill="#333" filter="url(#rough2)">S(7)：x=5，r=0 → g(5) = 6</text>
  <text x="272" y="258" font-size="10.8" fill="#333" filter="url(#rough2)">E = 7 − 6 = 1</text>
  <text x="379" y="288" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2¹ mod 4 = 2 ✓</text>

  <!-- 底注 -->
  <rect x="22" y="320" width="476" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="340" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">S(n) = g(x) ＋ x+1 的最低 r 个置位之和（x = max{x : f(x) ≤ n}，r = n − f(x)）</text>
  <text x="260" y="358" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">E = S(to+1) − S(from)，answer = 2^E mod m</text>
</svg>
