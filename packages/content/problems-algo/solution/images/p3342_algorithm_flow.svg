<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：堆优化 Dijkstra（状态 (d, x, y, p)）</text>

  <!-- 开始框 -->
  <rect x="110" y="42" width="300" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="60" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">初始化：dist[i][j][p] ← +∞；dist[0][0][0] ← 0</text>
  <text x="260" y="75" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">小根堆 ← (0, 0, 0, 0)（t=0 在起点，走了 0 步）</text>
  <path d="M 260 82 L 260 96" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 菱形：堆空？ -->
  <polygon points="260,100 360,124 260,148 160,124" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="128" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">堆空？</text>
  <path d="M 368 124 L 420 124" stroke="#446688" stroke-width="1.4" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="378" y="118" font-size="9.5" fill="#a07830" filter="url(#rough2)">是</text>
  <rect x="424" y="110" width="86" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="467" y="128" text-anchor="middle" font-size="9.5" fill="#8f3a36" filter="url(#rough2)">返回 −1（必达，不触发）</text>
  <path d="M 260 148 L 260 160" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="268" y="158" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- 弹出 -->
  <rect x="130" y="164" width="260" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="184" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">弹出堆顶 (d, x, y, p)（时间最小者优先）</text>
  <path d="M 260 196 L 260 208" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 菱形：过期？ -->
  <polygon points="260,212 356,236 260,260 164,236" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="232" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">d &gt; dist[x][y][p]？</text>
  <text x="260" y="248" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">（过期堆项）</text>
  <path d="M 364 236 C 420 236, 420 180, 396 180" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="380" y="228" font-size="9.5" fill="#a07830" filter="url(#rough2)">是，丢弃</text>
  <path d="M 260 260 L 260 272" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="268" y="270" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- 菱形：终点？ -->
  <polygon points="260,276 356,300 260,324 164,300" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="304" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">(x, y) == (n−1, m−1)？</text>
  <path d="M 364 300 L 412 300" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="374" y="294" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="416" y="286" width="94" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="463" y="304" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 d ✓</text>
  <path d="M 260 324 L 260 336" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="268" y="334" font-size="9.5" fill="#a07830" filter="url(#rough2)">否</text>

  <!-- 松弛 -->
  <rect x="86" y="340" width="348" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="358" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">cost ← (p == 0 ? 1 : 2)；枚举 (x,y) 的 4 个邻居 (nx,ny)</text>
  <text x="260" y="375" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">nd ← max(d, moveTime[nx][ny]) + cost   （门没开就等到开门再走）</text>
  <path d="M 260 384 L 260 396" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 入堆 -->
  <rect x="86" y="400" width="348" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="417" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">若 nd &lt; dist[nx][ny][p⊕1]：更新并入堆 (nd, nx, ny, p⊕1)，回到「堆空？」</text>

  <path d="M 80 413 C 30 413, 30 124, 152 124" fill="none" stroke="#446688" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrb)" filter="url(#rough2)"/>
</svg>
