<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="480" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：示例 1 — 老鼠 3 步抢食获胜</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">grid=["####F","#C...","M...."]  catJump=1  mouseJump=2</text>

  <!-- Grid with path -->
  <text x="130" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">棋盘 &amp; 老鼠获胜路径</text>
  <g filter="url(#rough2)" font-size="13">
    <!-- Row 0: ####F -->
    <rect x="40" y="76" width="36" height="36" fill="#d0d0d0" stroke="#888" stroke-width="1.2" rx="2"/>
    <text x="58" y="99" text-anchor="middle" fill="#888">#</text>
    <rect x="76" y="76" width="36" height="36" fill="#d0d0d0" stroke="#888" stroke-width="1.2" rx="2"/>
    <text x="94" y="99" text-anchor="middle" fill="#888">#</text>
    <rect x="112" y="76" width="36" height="36" fill="#d0d0d0" stroke="#888" stroke-width="1.2" rx="2"/>
    <text x="130" y="99" text-anchor="middle" fill="#888">#</text>
    <rect x="148" y="76" width="36" height="36" fill="#d0d0d0" stroke="#888" stroke-width="1.2" rx="2"/>
    <text x="166" y="99" text-anchor="middle" fill="#888">#</text>
    <rect x="184" y="76" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="2"/>
    <text x="202" y="99" text-anchor="middle" fill="#d6a040" font-weight="bold">F</text>

    <!-- Row 1: #C... -->
    <rect x="40" y="112" width="36" height="36" fill="#d0d0d0" stroke="#888" stroke-width="1.2" rx="2"/>
    <text x="58" y="135" text-anchor="middle" fill="#888">#</text>
    <rect x="76" y="112" width="36" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2"/>
    <text x="94" y="135" text-anchor="middle" fill="#b85450" font-weight="bold">C</text>
    <rect x="112" y="112" width="36" height="36" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="2"/>
    <rect x="148" y="112" width="36" height="36" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="2"/>
    <rect x="184" y="112" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2"/>
    <text x="202" y="135" text-anchor="middle" fill="#4a7a3a" font-size="9">①③</text>

    <!-- Row 2: M.... -->
    <rect x="40" y="148" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="2"/>
    <text x="58" y="171" text-anchor="middle" fill="#4a7a3a" font-weight="bold">M</text>
    <rect x="76" y="148" width="36" height="36" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="2"/>
    <rect x="112" y="148" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2"/>
    <text x="130" y="171" text-anchor="middle" fill="#4a7a3a" font-size="9">①</text>
    <rect x="148" y="148" width="36" height="36" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="2"/>
    <rect x="184" y="148" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2"/>
    <text x="202" y="171" text-anchor="middle" fill="#4a7a3a" font-size="9">②</text>
  </g>

  <!-- Mouse path arrows -->
  <path d="M 76 166 L 108 166" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <path d="M 148 166 L 180 166" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <path d="M 202 152 L 202 116" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <path d="M 202 108 L 202 84" stroke="#4a7a3a" stroke-width="2.5" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>

  <text x="130" y="200" text-anchor="middle" font-size="9" fill="#4a7a3a">鼠跳2格</text>
  <text x="200" y="200" text-anchor="middle" font-size="9" fill="#4a7a3a">鼠跳2格</text>
  <text x="215" y="130" font-size="9" fill="#4a7a3a">跳2格上</text>

  <!-- Step table -->
  <text x="400" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">逐步分析</text>
  <g filter="url(#rough2)" font-size="10">
    <!-- Header -->
    <rect x="300" y="76" width="220" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="320" y="92" text-anchor="middle" fill="#446688" font-weight="bold">回合</text>
    <text x="370" y="92" text-anchor="middle" fill="#446688" font-weight="bold">老鼠</text>
    <text x="440" y="92" text-anchor="middle" fill="#446688" font-weight="bold">猫(最优)</text>
    <text x="500" y="92" text-anchor="middle" fill="#446688" font-weight="bold">结果</text>

    <!-- Turn 1 -->
    <rect x="300" y="100" width="220" height="28" fill="#e6f4ea" stroke="#999" stroke-width="1" rx="3"/>
    <text x="320" y="118" text-anchor="middle" fill="#333">1鼠</text>
    <text x="370" y="118" text-anchor="middle" fill="#4a7a3a">(2,0)→(2,2)</text>
    <text x="440" y="118" text-anchor="middle" fill="#888">—</text>
    <text x="500" y="118" text-anchor="middle" fill="#888">进行</text>

    <!-- Turn 1 cat -->
    <rect x="300" y="128" width="220" height="28" fill="#fce4ec" stroke="#999" stroke-width="1" rx="3"/>
    <text x="320" y="146" text-anchor="middle" fill="#333">1猫</text>
    <text x="370" y="146" text-anchor="middle" fill="#888">—</text>
    <text x="440" y="146" text-anchor="middle" fill="#b85450">(1,1)→(1,2)</text>
    <text x="500" y="146" text-anchor="middle" fill="#888">追不上</text>

    <!-- Turn 2 mouse -->
    <rect x="300" y="156" width="220" height="28" fill="#e6f4ea" stroke="#999" stroke-width="1" rx="3"/>
    <text x="320" y="174" text-anchor="middle" fill="#333">2鼠</text>
    <text x="370" y="174" text-anchor="middle" fill="#4a7a3a">(2,2)→(2,4)</text>
    <text x="440" y="174" text-anchor="middle" fill="#888">—</text>
    <text x="500" y="174" text-anchor="middle" fill="#888">进行</text>

    <!-- Turn 2 cat -->
    <rect x="300" y="184" width="220" height="28" fill="#fce4ec" stroke="#999" stroke-width="1" rx="3"/>
    <text x="320" y="202" text-anchor="middle" fill="#333">2猫</text>
    <text x="370" y="202" text-anchor="middle" fill="#888">—</text>
    <text x="440" y="202" text-anchor="middle" fill="#b85450">(1,2)→(1,3)</text>
    <text x="500" y="202" text-anchor="middle" fill="#888">追不上</text>

    <!-- Turn 3 mouse wins -->
    <rect x="300" y="212" width="220" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3"/>
    <text x="320" y="230" text-anchor="middle" fill="#333">3鼠</text>
    <text x="370" y="230" text-anchor="middle" fill="#4a7a3a">(2,4)→(0,4)</text>
    <text x="440" y="230" text-anchor="middle" fill="#888">—</text>
    <text x="500" y="230" text-anchor="middle" fill="#d6a040" font-weight="bold">鼠赢!</text>
  </g>

  <!-- Analysis boxes -->
  <text x="270" y="260" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">为什么猫赢不了？</text>

  <rect x="30" y="270" width="240" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="150" y="288" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">猫追不上老鼠</text>
  <text x="150" y="304" text-anchor="middle" font-size="9" fill="#333">猫 jump=1，每回合最多移 1 格</text>
  <text x="150" y="318" text-anchor="middle" font-size="9" fill="#333">鼠 jump=2，速度是猫 2 倍 → 甩开</text>

  <rect x="290" y="270" width="240" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="410" y="288" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">猫抢不到食物</text>
  <text x="410" y="304" text-anchor="middle" font-size="9" fill="#333">猫到 F 需 4 步：(1,1)→(1,2)→(1,3)→(1,4)→(0,4)</text>
  <text x="410" y="318" text-anchor="middle" font-size="9" fill="#333">鼠到 F 只需 3 步 → 鼠先到</text>

  <!-- Contrast: example 3 -->
  <rect x="30" y="340" width="500" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="358" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">对比 示例 3：grid=["M.C...F"]  catJump=1  mouseJump=3 → 猫赢</text>
  <text x="280" y="374" text-anchor="middle" font-size="9" fill="#333">鼠 jump=3 仍不够：鼠到 F 需 2 步，但猫挡在中间</text>
  <text x="280" y="386" text-anchor="middle" font-size="9" fill="#333">猫可拦截鼠的路径 → 鼠无法在 1000 步内到 F → 猫赢</text>

  <!-- Key insight -->
  <rect x="60" y="408" width="440" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="428" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">逆向归纳视角</text>
  <text x="280" y="444" text-anchor="middle" font-size="9" fill="#333">终止态 (0,4) 即 m==food → 鼠赢，反传到 (2,4,c,0)→鼠赢→(2,2,c,0)→鼠赢→(2,0,c,0)→鼠赢</text>
  <text x="280" y="458" text-anchor="middle" font-size="9" fill="#333">初始状态 (2,0, 1,1, 0) 被解析为鼠赢(1) → return true</text>
</svg>
