<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：s = "abcd"，k = 2</text>

  <!-- 表头 -->
  <rect x="40" y="42" width="52" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="66" y="60" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">块 j</text>
  <rect x="96" y="42" width="64" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="128" y="60" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">子串</text>
  <rect x="164" y="42" width="118" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="223" y="60" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">哈希值求和</text>
  <rect x="286" y="42" width="84" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="328" y="60" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">mod 26</text>
  <rect x="374" y="42" width="86" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="417" y="60" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">result[j]</text>

  <!-- 行 j=0 -->
  <rect x="40" y="72" width="52" height="26" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="66" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="96" y="72" width="64" height="26" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="128" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">"ab"</text>
  <rect x="164" y="72" width="118" height="26" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="223" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0 + 1 = 1</text>
  <rect x="286" y="72" width="84" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="328" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a10" filter="url(#rough2)">1</text>
  <rect x="374" y="72" width="86" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="417" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">b</text>

  <!-- 行 j=1 -->
  <rect x="40" y="100" width="52" height="26" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="66" y="118" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="96" y="100" width="64" height="26" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="128" y="118" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">"cd"</text>
  <rect x="164" y="100" width="118" height="26" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="223" y="118" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2 + 3 = 5</text>
  <rect x="286" y="100" width="84" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="328" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a10" filter="url(#rough2)">5</text>
  <rect x="374" y="100" width="86" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="417" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">f</text>

  <!-- 结果串 -->
  <text x="66" y="160" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">result：</text>
  <rect x="40" y="140" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="58" y="162" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">b</text>
  <rect x="80" y="140" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="98" y="162" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">f</text>
  <text x="150" y="162" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">→ 输出 "bf"</text>

  <!-- 右侧注解框 -->
  <rect x="290" y="136" width="222" height="66" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="401" y="156" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">和 ≥ 26 要「回落」</text>
  <text x="401" y="176" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">块和可达 25 × k，取模拉回 [0, 26)</text>
  <text x="401" y="194" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">60 不是第 60 号字母，是第 8 号 'i'</text>

  <!-- 示例 2 -->
  <text x="40" y="212" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">示例 2：s = "mxz"，k = 3（整串一块）</text>

  <rect x="36" y="218" width="136" height="44" rx="6" fill="none" stroke="#446688" stroke-width="1.5" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <rect x="40" y="222" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="238" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">m</text>
  <text x="60" y="252" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">12</text>

  <rect x="84" y="222" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="104" y="238" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">x</text>
  <text x="104" y="252" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">23</text>

  <rect x="128" y="222" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="148" y="238" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">z</text>
  <text x="148" y="252" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">25</text>

  <text x="104" y="276" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">第 0 块（唯一，n/k = 1）</text>

  <path d="M104,280 L104,288" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="290" width="128" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="104" y="307" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">12 + 23 + 25 = 60</text>

  <path d="M168,303 L186,303" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="190" y="290" width="160" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="307" text-anchor="middle" font-size="11" font-weight="bold" fill="#a06a10" filter="url(#rough2)">60 mod 26 = 60 − 52 = 8</text>

  <path d="M350,303 L368,303" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="372" y="290" width="48" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="396" y="308" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">i</text>

  <text x="260" y="348" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">k = 1 时每块哈希值 = 字符本身，result ≡ s，顺手当调试基准</text>
</svg>
