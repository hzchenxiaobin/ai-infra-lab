<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">降序遍历候选，凑满 3 个质数即停</text>

  <!-- 开始 -->
  <ellipse cx="200" cy="48" rx="34" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="53" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">开始</text>
  <path d="M 200 63 L 200 76" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 枚举子串 -->
  <rect x="88" y="78" width="224" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="94" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">枚举子串 s[i:j]，数值化后入 set 去重</text>
  <text x="200" y="110" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">（前导零在数值化时自然消解）</text>
  <path d="M 200 118 L 200 130" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 降序初始化 -->
  <rect x="88" y="132" width="224" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="151" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">候选按数值降序，ans = 0，cnt = 0</text>
  <path d="M 200 162 L 200 174" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取候选 -->
  <rect x="112" y="176" width="176" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="190" text-anchor="middle" font-size="11.5" fill="#8a6d3a" filter="url(#rough2)">取下一候选 v</text>
  <text x="200" y="203" text-anchor="middle" font-size="9.5" fill="#a08040" filter="url(#rough2)">（候选耗尽 → 直接输出 ans）</text>
  <path d="M 200 208 L 200 220" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形1: 质数? -->
  <polygon points="200,222 292,248 200,274 108,248" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="253" text-anchor="middle" font-size="11.5" fill="#8a6d3a" filter="url(#rough2)">v 是质数？</text>
  <path d="M 292 248 L 436 248 L 436 192 L 292 192" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="306" y="242" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>
  <text x="442" y="224" font-size="9.5" fill="#b85450" filter="url(#rough2)">合数 / 0 / 1</text>
  <path d="M 200 274 L 200 288" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="208" y="284" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 累加 -->
  <rect x="125" y="290" width="150" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="309" text-anchor="middle" font-size="11.5" fill="#2a5a2a" filter="url(#rough2)">ans += v，cnt += 1</text>
  <path d="M 200 320 L 200 332" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形2: cnt==3? -->
  <polygon points="200,334 286,360 200,386 114,360" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="365" text-anchor="middle" font-size="11.5" fill="#8a6d3a" filter="url(#rough2)">cnt == 3 ?</text>
  <path d="M 114 360 L 52 360 L 52 192 L 106 192" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="92" y="354" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 200 386 L 200 398" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="208" y="396" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 结束 -->
  <ellipse cx="200" cy="416" rx="44" ry="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="421" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">返回 ans</text>

  <!-- 提前终止注记 -->
  <rect x="330" y="330" width="176" height="56" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="418" y="350" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">提前终止只是最好情况优化：</text>
  <text x="418" y="366" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">不同质数不足 3 个时（如 "111"）</text>
  <text x="418" y="380" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">仍要判完全部候选才能断定不足</text>
</svg>
