<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：start 行的「下一个事件」就是本次运行的终点</text>

  <rect x="35" y="44" width="90" height="26" fill="#eef2f7" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="125" y="44" width="185" height="26" fill="#eef2f7" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="310" y="44" width="195" height="26" fill="#eef2f7" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="61" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">状态</text>
  <text x="217" y="61" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">事件时间（server 1）</text>
  <text x="407" y="61" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">LEAD 下一事件时间</text>

  <rect x="35" y="70" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="125" y="70" width="185" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="310" y="70" width="195" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="88" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">start ✓</text>
  <text x="217" y="88" text-anchor="middle" font-size="10.5" fill="#333" font-family="monospace" filter="url(#rough2)">11-13 03:05:31</text>
  <text x="407" y="88" text-anchor="middle" font-size="10.5" fill="#333" font-family="monospace" filter="url(#rough2)">11-13 11:10:31</text>

  <rect x="35" y="98" width="90" height="28" fill="#f5f5f5" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="125" y="98" width="185" height="28" fill="#f5f5f5" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="310" y="98" width="195" height="28" fill="#f5f5f5" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80" y="116" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">stop ✗</text>
  <text x="217" y="116" text-anchor="middle" font-size="10.5" fill="#777" font-family="monospace" filter="url(#rough2)">11-13 11:10:31</text>
  <text x="407" y="116" text-anchor="middle" font-size="10.5" fill="#777" font-family="monospace" filter="url(#rough2)">11-20 00:27:11</text>

  <rect x="35" y="126" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="125" y="126" width="185" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="310" y="126" width="195" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="144" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">start ✓</text>
  <text x="217" y="144" text-anchor="middle" font-size="10.5" fill="#333" font-family="monospace" filter="url(#rough2)">11-20 00:27:11</text>
  <text x="407" y="144" text-anchor="middle" font-size="10.5" fill="#333" font-family="monospace" filter="url(#rough2)">11-20 01:41:11</text>

  <rect x="35" y="154" width="90" height="28" fill="#f5f5f5" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="125" y="154" width="185" height="28" fill="#f5f5f5" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="310" y="154" width="195" height="28" fill="#f5f5f5" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80" y="172" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">stop ✗</text>
  <text x="217" y="172" text-anchor="middle" font-size="10.5" fill="#777" font-family="monospace" filter="url(#rough2)">11-20 01:41:11</text>
  <text x="407" y="172" text-anchor="middle" font-size="10.5" fill="#777" font-family="monospace" filter="url(#rough2)">NULL</text>

  <path d="M 110 244 L 110 236 L 230 236 L 230 244" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="170" y="230" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">8h05m ✓</text>

  <path d="M 230 244 L 230 236 L 380 236 L 380 244" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="305" y="230" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">空闲 157h ✗</text>

  <path d="M 380 244 L 380 236 L 455 236 L 455 244" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="417" y="230" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1h14m ✓</text>

  <path d="M 70 262 L 480 262" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <circle cx="110" cy="262" r="6" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="230" cy="262" r="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="380" cy="262" r="6" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="455" cy="262" r="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <text x="110" y="284" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">11-13 03:05</text>
  <text x="230" y="284" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">11-13 11:10</text>
  <text x="380" y="284" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">11-20 00:27</text>
  <text x="455" y="284" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">11-20 01:41</text>

  <rect x="55" y="300" width="430" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="322" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">只保留 start 行：WHERE session_status = 'start'</text>
  <text x="270" y="340" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">每段运行时长 = LEAD 下一事件时间 − 当前 status_time</text>
  <text x="270" y="358" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">stop 行被 WHERE 过滤，天然不贡献任何时长</text>

  <text x="270" y="390" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">数据取自官方示例 server 1 的事件流（按时间排序，时间轴未按比例）</text>
</svg>
