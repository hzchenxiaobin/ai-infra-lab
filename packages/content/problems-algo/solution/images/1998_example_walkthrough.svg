<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [10, 5, 9, 3, 15]</text>

  <!-- step A: factorize table -->
  <text x="26" y="54" font-size="11.5" fill="#888" font-weight="bold">① 分解质因子 + union：</text>

  <text x="26" y="76" font-size="11" fill="#333">x=10</text>
  <rect x="70" y="62" width="120" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="130" y="78" text-anchor="middle" font-size="10.5" fill="#333">10 = 2 × 5 → union(10,2),(10,5)</text>

  <text x="26" y="100" font-size="11" fill="#333">x=5</text>
  <rect x="70" y="86" width="120" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="130" y="102" text-anchor="middle" font-size="10.5" fill="#333">5 = 5 → union(5,5)</text>

  <text x="26" y="124" font-size="11" fill="#333">x=9</text>
  <rect x="70" y="110" width="120" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="130" y="126" text-anchor="middle" font-size="10.5" fill="#333">9 = 3² → union(9,3)</text>

  <text x="26" y="148" font-size="11" fill="#333">x=15</text>
  <rect x="70" y="134" width="120" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="130" y="150" text-anchor="middle" font-size="10.5" fill="#333">15 = 3 × 5 → union(15,3),(15,5)</text>

  <!-- component result -->
  <rect x="220" y="62" width="300" height="94" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="370" y="82" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">最终连通分量</text>
  <text x="370" y="104" text-anchor="middle" font-size="11" fill="#333">{10, 5, 2, 5} 经 15 桥接</text>
  <text x="370" y="122" text-anchor="middle" font-size="11" fill="#333">{9, 3} 经 15 桥接</text>
  <text x="370" y="142" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">→ 全部并入同一集合 ✓</text>

  <line x1="280" y1="160" x2="280" y2="178" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step B: compare original vs sorted -->
  <text x="26" y="194" font-size="11.5" fill="#888" font-weight="bold">② 原数组 vs 排序后，逐位查同根：</text>

  <!-- header -->
  <text x="60" y="218" font-size="11" fill="#888">原 nums</text>
  <rect x="110" y="204" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="140" y="221" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">10</text>
  <rect x="172" y="204" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="202" y="221" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <rect x="234" y="204" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="264" y="221" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9</text>
  <rect x="296" y="204" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="326" y="221" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="358" y="204" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="388" y="221" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">15</text>

  <text x="60" y="256" font-size="11" fill="#888">sorted</text>
  <rect x="110" y="242" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="140" y="259" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="172" y="242" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="202" y="259" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <rect x="234" y="242" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="264" y="259" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9</text>
  <rect x="296" y="242" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="326" y="259" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">10</text>
  <rect x="358" y="242" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="388" y="259" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">15</text>

  <!-- check marks -->
  <text x="60" y="292" font-size="11" fill="#888">同根?</text>
  <text x="140" y="292" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="202" y="292" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="264" y="292" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="326" y="292" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="388" y="292" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>

  <line x1="280" y1="300" x2="280" y2="320" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- note on chain swap -->
  <rect x="40" y="320" width="480" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="340" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">关键：10 与 3 不共享质因子，但经 15 中转（10—5—15—3）</text>
  <text x="280" y="358" text-anchor="middle" font-size="11" fill="#555">同分量内可通过链式交换重排到任意位置</text>

  <!-- final result -->
  <rect x="160" y="388" width="240" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="410" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">全部同根 → return true</text>
</svg>
