<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">三人国家代表队：三校 CROSS JOIN → 名字两两不同 → 有效三元组</text>

  <rect x="15" y="52" width="178" height="276" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="104" y="46" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">三所学校（各派一名代表）</text>

  <text x="104" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">SchoolA</text>
  <rect x="25" y="74" width="158" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="50" y="89" text-anchor="middle" font-size="8" fill="#333">student_id</text>
  <text x="129" y="89" text-anchor="middle" font-size="8" fill="#333">student_name</text>
  <line x1="75" y1="74" x2="75" y2="96" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="25" y="96" width="158" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="111" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="85" y="111" font-size="10" fill="#333">Alice</text>
  <line x1="75" y1="96" x2="75" y2="118" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="25" y="118" width="158" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="133" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="85" y="133" font-size="10" fill="#333">Bob</text>
  <line x1="75" y1="118" x2="75" y2="140" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="104" y="160" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">SchoolB</text>
  <rect x="25" y="166" width="158" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="50" y="181" text-anchor="middle" font-size="8" fill="#333">student_id</text>
  <text x="129" y="181" text-anchor="middle" font-size="8" fill="#333">student_name</text>
  <line x1="75" y1="166" x2="75" y2="188" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="25" y="188" width="158" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="203" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="85" y="203" font-size="10" fill="#333">Tom</text>
  <line x1="75" y1="188" x2="75" y2="210" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="104" y="228" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">SchoolC</text>
  <rect x="25" y="234" width="158" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="50" y="249" text-anchor="middle" font-size="8" fill="#333">student_id</text>
  <text x="129" y="249" text-anchor="middle" font-size="8" fill="#333">student_name</text>
  <line x1="75" y1="234" x2="75" y2="256" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="25" y="256" width="158" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="271" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="85" y="271" font-size="10" fill="#333">Tom</text>
  <line x1="75" y1="256" x2="75" y2="278" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="25" y="278" width="158" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="293" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="85" y="293" font-size="10" fill="#333">Jerry</text>
  <line x1="75" y1="278" x2="75" y2="300" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="25" y="300" width="158" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="315" text-anchor="middle" font-size="10" fill="#333">10</text>
  <text x="85" y="315" font-size="10" fill="#333">Alice</text>
  <line x1="75" y1="300" x2="75" y2="322" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <path d="M195 185 L243 185" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="219" y="178" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">CROSS JOIN</text>

  <rect x="245" y="135" width="160" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="325" y="162" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">笛卡尔积</text>
  <text x="325" y="188" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">2 × 1 × 3 = 6</text>
  <text x="325" y="212" text-anchor="middle" font-size="11" fill="#333">候选三元组</text>

  <path d="M407 185 L455 185" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="431" y="172" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">WHERE</text>
  <text x="431" y="196" text-anchor="middle" font-size="9" fill="#b85450">两两不同</text>

  <rect x="457" y="135" width="150" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="532" y="162" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3 个</text>
  <text x="532" y="186" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">有效三元组</text>
  <text x="532" y="210" text-anchor="middle" font-size="10" fill="#333">(名字互不相同)</text>

  <rect x="60" y="348" width="500" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="373" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">有效性条件：三人名字两两不同</text>
  <text x="310" y="395" text-anchor="middle" font-size="10.5" fill="#333">A.student_name ≠ B.student_name</text>
  <text x="310" y="413" text-anchor="middle" font-size="10.5" fill="#333">且 B.student_name ≠ C.student_name  且  A.student_name ≠ C.student_name</text>
</svg>
