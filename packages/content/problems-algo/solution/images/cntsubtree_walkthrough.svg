<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：n=4, edges=[[1,2],[2,3],[2,4]] → [3,4,0]</text>

  <!-- ===== Top: original tree ===== -->
  <text x="280" y="50" text-anchor="middle" font-size="11" fill="#888">原树（星形，中心节点 2）</text>
  <!-- edges -->
  <path d="M 280 70 L 220 120" stroke="#999" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 280 70 L 340 120" stroke="#999" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 280 70 L 280 120" stroke="#999" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <!-- nodes -->
  <circle cx="280" cy="70" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="74" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <circle cx="220" cy="128" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="132" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <circle cx="280" cy="128" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="132" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <circle cx="340" cy="128" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="340" y="132" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>

  <!-- divider -->
  <path d="M 30 165 L 530 165" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- ===== Left group: diameter = 1 ===== -->
  <rect x="20" y="175" width="240" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="140" y="194" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">直径 d = 1（3 棵子树）</text>

  <!-- mini tree {1,2} -->
  <g transform="translate(35,215)">
    <path d="M 25 10 L 12 45" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
    <circle cx="25" cy="10" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="25" y="13" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">2</text>
    <circle cx="12" cy="45" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="12" y="48" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">1</text>
    <text x="22" y="68" text-anchor="middle" font-size="9" fill="#888">{1,2}</text>
  </g>

  <!-- mini tree {2,3} -->
  <g transform="translate(125,215)">
    <path d="M 25 10 L 25 45" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
    <circle cx="25" cy="10" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="25" y="13" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">2</text>
    <circle cx="25" cy="45" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="25" y="48" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">3</text>
    <text x="22" y="68" text-anchor="middle" font-size="9" fill="#888">{2,3}</text>
  </g>

  <!-- mini tree {2,4} -->
  <g transform="translate(210,215)">
    <path d="M 12 10 L 25 45" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
    <circle cx="12" cy="10" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="12" y="13" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">2</text>
    <circle cx="25" cy="45" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="25" y="48" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">4</text>
    <text x="20" y="68" text-anchor="middle" font-size="9" fill="#888">{2,4}</text>
  </g>

  <!-- ===== Right group: diameter = 2 ===== -->
  <rect x="280" y="175" width="260" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="410" y="194" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">直径 d = 2（4 棵子树）</text>

  <!-- mini tree {1,2,3} -->
  <g transform="translate(290,215)">
    <path d="M 25 10 L 12 45" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
    <path d="M 25 10 L 25 45" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
    <circle cx="25" cy="10" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="25" y="13" text-anchor="middle" font-size="8.5" fill="#333" font-weight="bold">2</text>
    <circle cx="12" cy="45" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="12" y="48" text-anchor="middle" font-size="8.5" fill="#333" font-weight="bold">1</text>
    <circle cx="25" cy="45" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="25" y="48" text-anchor="middle" font-size="8.5" fill="#333" font-weight="bold">3</text>
    <text x="20" y="68" text-anchor="middle" font-size="9" fill="#888">{1,2,3}</text>
  </g>

  <!-- mini tree {1,2,4} -->
  <g transform="translate(360,215)">
    <path d="M 25 10 L 12 45" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
    <path d="M 25 10 L 25 45" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
    <circle cx="25" cy="10" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="25" y="13" text-anchor="middle" font-size="8.5" fill="#333" font-weight="bold">2</text>
    <circle cx="12" cy="45" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="12" y="48" text-anchor="middle" font-size="8.5" fill="#333" font-weight="bold">1</text>
    <circle cx="25" cy="45" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="25" y="48" text-anchor="middle" font-size="8.5" fill="#333" font-weight="bold">4</text>
    <text x="20" y="68" text-anchor="middle" font-size="9" fill="#888">{1,2,4}</text>
  </g>

  <!-- mini tree {2,3,4} -->
  <g transform="translate(430,215)">
    <path d="M 18 10 L 10 45" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
    <path d="M 18 10 L 28 45" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
    <circle cx="18" cy="10" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="18" y="13" text-anchor="middle" font-size="8.5" fill="#333" font-weight="bold">2</text>
    <circle cx="10" cy="45" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="10" y="48" text-anchor="middle" font-size="8.5" fill="#333" font-weight="bold">3</text>
    <circle cx="28" cy="45" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="28" y="48" text-anchor="middle" font-size="8.5" fill="#333" font-weight="bold">4</text>
    <text x="18" y="68" text-anchor="middle" font-size="9" fill="#888">{2,3,4}</text>
  </g>

  <!-- mini tree {1,2,3,4} -->
  <g transform="translate(500,215)">
    <path d="M 18 10 L 6 45" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
    <path d="M 18 10 L 18 45" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
    <path d="M 18 10 L 30 45" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
    <circle cx="18" cy="10" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="18" y="13" text-anchor="middle" font-size="8" fill="#333" font-weight="bold">2</text>
    <circle cx="6" cy="45" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="6" y="48" text-anchor="middle" font-size="7.5" fill="#333" font-weight="bold">1</text>
    <circle cx="18" cy="45" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="18" y="48" text-anchor="middle" font-size="7.5" fill="#333" font-weight="bold">3</text>
    <circle cx="30" cy="45" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="30" y="48" text-anchor="middle" font-size="7.5" fill="#333" font-weight="bold">4</text>
    <text x="18" y="68" text-anchor="middle" font-size="8.5" fill="#888">{1,2,3,4}</text>
  </g>

  <!-- ===== Rejected example ===== -->
  <rect x="20" y="300" width="520" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="280" y="318" text-anchor="middle" font-size="10.5" fill="#b85450">反例：子集 {3,4} —— 诱导子图边数 = 0 ≠ 2−1，不连通（路径需经节点 2），跳过 ✗</text>

  <!-- ===== Answer ===== -->
  <path d="M 280 328 L 280 348" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="352" width="320" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="378" text-anchor="middle" font-size="13" fill="#a87020" font-weight="bold">答案：ans = [3, 4, 0]（d=1 有 3 棵，d=2 有 4 棵，d=3 有 0 棵）</text>

  <!-- legend -->
  <rect x="120" y="404" width="320" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="280" y="422" text-anchor="middle" font-size="10" fill="#888">单节点子树直径 = 0，不在 [1, n−1] 范围内，不计入任何桶</text>
</svg>
