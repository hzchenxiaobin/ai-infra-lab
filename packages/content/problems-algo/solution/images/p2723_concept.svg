<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrOrange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">核心直觉：await 把两个异步值拍平成同步变量，再相加返回</text>

  <!-- Left side: async function boundary -->
  <rect x="30" y="50" width="220" height="260" fill="none" stroke="#446688" stroke-width="1.5" stroke-dasharray="6,4" rx="10" filter="url(#rough2)"/>
  <text x="140" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">async addTwoPromises</text>

  <!-- promise1 box -->
  <rect x="50" y="85" width="180" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="140" y="103" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">await promise1</text>
  <text x="140" y="120" text-anchor="middle" font-size="11" fill="#446688">→ 挂起，resolve 后取值 a</text>

  <!-- arrow down -->
  <path d="M 140 137 L 140 158" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- promise2 box -->
  <rect x="50" y="163" width="180" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="140" y="181" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">await promise2</text>
  <text x="140" y="198" text-anchor="middle" font-size="11" fill="#446688">→ 挂起，resolve 后取值 b</text>

  <!-- arrow down -->
  <path d="M 140 215 L 140 236" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return box -->
  <rect x="50" y="241" width="180" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="140" y="259" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">return a + b</text>
  <text x="140" y="276" text-anchor="middle" font-size="10" fill="#d6a040">async 自动包成 Promise</text>

  <!-- Right side: the "sync-like" view -->
  <text x="420" y="70" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">拍平后的同步形态</text>

  <!-- a variable -->
  <rect x="330" y="85" width="80" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="370" y="102" text-anchor="middle" font-size="11" fill="#333">a = 2</text>
  <text x="370" y="115" text-anchor="middle" font-size="9" fill="#888">（来自 promise1）</text>

  <!-- plus sign -->
  <text x="425" y="112" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">+</text>

  <!-- b variable -->
  <rect x="440" y="85" width="80" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="480" y="102" text-anchor="middle" font-size="11" fill="#333">b = 5</text>
  <text x="480" y="115" text-anchor="middle" font-size="9" fill="#888">（来自 promise2）</text>

  <!-- equals arrow down -->
  <path d="M 420 130 L 420 160" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="435" y="150" font-size="10" fill="#4a7a3a">return</text>

  <!-- result -->
  <rect x="360" y="165" width="120" height="45" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="420" y="183" text-anchor="middle" font-size="11" fill="#666">Promise resolve →</text>
  <text x="420" y="200" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">7</text>

  <!-- connecting dashed arrows (async → sync) -->
  <path d="M 230 108 Q 285 108 330 105" stroke="#d6a040" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrOrange)" filter="url(#rough2)"/>
  <text x="268" y="98" font-size="9" fill="#d6a040">取值</text>

  <path d="M 230 186 Q 285 186 330 108" stroke="#d6a040" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrOrange)" filter="url(#rough2)"/>

  <!-- Bottom note -->
  <rect x="40" y="325" width="480" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="343" text-anchor="middle" font-size="11" fill="#333">await 暂停函数执行、取出 resolve 值 —— 异步代码写出同步形态</text>
  <text x="280" y="358" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return 的值自动被 async 装箱为 Promise</text>
</svg>
