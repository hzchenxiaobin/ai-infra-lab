<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：排序后最优 k 元子集必然连续</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">任意非连续选择都可被端点更近的连续窗口替换，差值不增</text>

  <!-- Row 1: original array, k=2 -->
  <text x="28" y="82" font-size="10.5" fill="#666">原数组 k=2</text>

  <rect x="157" y="64" width="42" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="88" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">9</text>

  <rect x="207" y="64" width="42" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="228" y="88" text-anchor="middle" font-size="14" fill="#333">4</text>

  <rect x="257" y="64" width="42" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="278" y="88" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <rect x="307" y="64" width="42" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="328" y="88" text-anchor="middle" font-size="14" fill="#333">7</text>

  <!-- bracket from 9 to 1 -->
  <path d="M 178 60 Q 228 40 278 60" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="228" y="48" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">非连续选 9 与 1 → 差值 8</text>

  <!-- Sort arrow -->
  <path d="M 260 110 L 260 130" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="124" font-size="10.5" fill="#666" font-weight="bold">排序</text>

  <!-- Row 2: sorted array, k=2 -->
  <text x="28" y="160" font-size="10.5" fill="#666">排序后 k=2</text>

  <rect x="157" y="142" width="42" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="166" text-anchor="middle" font-size="14" fill="#333">1</text>

  <rect x="207" y="142" width="42" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="228" y="166" text-anchor="middle" font-size="14" fill="#333">4</text>

  <rect x="257" y="142" width="42" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="278" y="166" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">7</text>

  <rect x="307" y="142" width="42" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="328" y="166" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">9</text>

  <!-- bracket from 7 to 9 -->
  <path d="M 278 138 Q 303 118 328 138" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="303" y="126" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">连续窗口 → 差值 2 ✓</text>

  <!-- Bottom note: exchange argument -->
  <rect x="40" y="202" width="440" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="224" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">交换论证：连续窗口永远不劣</text>
  <text x="260" y="243" text-anchor="middle" font-size="10.5" fill="#555">设非连续子集端点为 a[i₁], a[iₖ]（i₁ &lt; iₖ，可不连续）</text>
  <text x="260" y="259" text-anchor="middle" font-size="10.5" fill="#555">取连续窗口 [i₁, i₁+k−1]，因 i₁+k−1 ≤ iₖ → a[i₁+k−1] ≤ a[iₖ]</text>
  <text x="260" y="275" text-anchor="middle" font-size="10.5" fill="#555">→ 窗口差值 a[i₁+k−1] − a[i₁] ≤ a[iₖ] − a[i₁]，不增 ✓</text>

  <!-- Footer -->
  <text x="260" y="306" text-anchor="middle" font-size="10.5" fill="#888">排序把「任意子集」压缩到「连续窗口」，候选数从 C(n,k) 降到 n−k+1</text>
  <text x="260" y="324" text-anchor="middle" font-size="10" fill="#aaa">极差 = 右端 − 左端，只与窗口两端有关，中间 k−2 个随意填充</text>
</svg>
