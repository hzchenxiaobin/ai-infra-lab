<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：排序 + 贪心扩展可达区间</text>

  <!-- Step 1: sort -->
  <rect x="150" y="48" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="66" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 排序 coins（升序）</text>
  <text x="260" y="80" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">从小到大处理，优先填补小缺口</text>

  <path d="M 260 90 L 260 108" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: init x = 0 -->
  <rect x="150" y="112" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="130" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">② x = 0（初始可达 [0, 0]）</text>
  <text x="260" y="144" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">空集构造 0，ans 至少为 1</text>

  <path d="M 260 154 L 260 172" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: for each c -->
  <rect x="130" y="176" width="260" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="194" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">③ 遍历每个硬币 c ∈ sorted(coins)</text>
  <text x="260" y="208" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">按值从小到大逐个考虑</text>

  <path d="M 260 216 L 260 234" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="260,236 360,284 260,332 160,284" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="280" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">c ≤ x + 1 ?</text>
  <text x="260" y="296" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">能否衔接</text>

  <!-- Yes branch: right -->
  <path d="M 360 284 L 410 284" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="384" y="278" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="410" y="264" width="96" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="458" y="282" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">x = x + c</text>
  <text x="458" y="296" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">扩展到 [0,x+c]</text>

  <!-- loop back from yes to step 3 -->
  <path d="M 458 264 L 458 196 L 390 196" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" stroke-dasharray="4,2" filter="url(#rough2)"/>
  <text x="424" y="188" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">继续下一枚</text>

  <!-- No branch: down -->
  <path d="M 260 332 L 260 352" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="346" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- Step 4: break -->
  <rect x="150" y="356" width="220" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="378" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">④ break（x+1 无法构造，停止）</text>

  <path d="M 260 394 L 260 412" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: return -->
  <rect x="130" y="416" width="260" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="438" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">⑤ 返回 x + 1（连续整数个数，含 0）</text>
</svg>
