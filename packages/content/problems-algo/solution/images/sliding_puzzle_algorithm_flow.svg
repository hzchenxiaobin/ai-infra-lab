<svg xmlns="http://www.w3.org/2000/svg" width="780" height="600" viewBox="0 0 780 600" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="780" height="600" fill="#fdfcf7"/>
  <text x="390" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">滑动谜题 BFS 算法流程</text>
  <path d="M 250 42 Q 390 50 530 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- STEP 1: 编码 + 特判 -->
  <g filter="url(#sk2)">
    <rect x="60" y="68" width="660" height="78" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="84" y="92" font-size="14" font-weight="bold" fill="#34506e">① 编码 + 特判</text>
  <text x="84" y="114" font-size="12" fill="#444">start = board 按行展平成 6 位字符串；target = "123450"</text>
  <text x="84" y="132" font-size="12" fill="#444">if start == target → return 0；建静态邻居表 neigh[6]</text>

  <!-- arrow down -->
  <path d="M 390 150 L 390 172" stroke="#5a5a5a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- STEP 2: 入队起点 -->
  <g filter="url(#sk2)">
    <rect x="60" y="178" width="660" height="62" rx="8" fill="#eef6ef" stroke="#4a7e4a" stroke-width="1.6"/>
  </g>
  <text x="84" y="202" font-size="14" font-weight="bold" fill="#2e6e2e">② 起点入队</text>
  <text x="84" y="224" font-size="12" fill="#444">q.push((start, 0))；visited.insert(start)   ← 入队即标记</text>

  <!-- arrow down to loop -->
  <path d="M 390 244 L 390 268" stroke="#5a5a5a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- STEP 3: BFS 主循环 (decision diamond + loop body) -->
  <text x="390" y="288" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">③ BFS 主循环</text>

  <!-- decision: queue empty? -->
  <g filter="url(#sk2)">
    <polygon points="390,300 540,350 390,400 240,350" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="390" y="346" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">队列空了?</text>
  <text x="390" y="364" text-anchor="middle" font-size="11" fill="#7a5415">(q.empty())</text>

  <!-- YES branch -> return -1 -->
  <path d="M 240 350 L 150 350 L 150 420" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="156" y="342" font-size="11" font-weight="bold" fill="#b85450">是</text>
  <g filter="url(#sk2)">
    <rect x="60" y="426" width="180" height="56" rx="8" fill="#fdecee" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="150" y="452" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">return -1</text>
  <text x="150" y="470" text-anchor="middle" font-size="10" fill="#b85450">不可解（队空未命中）</text>

  <!-- NO branch -> pop -->
  <path d="M 540 350 L 640 350 L 640 392" stroke="#4a7e4a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="566" y="342" font-size="11" font-weight="bold" fill="#2e6e2e">否</text>

  <!-- pop (cur, step) -->
  <g filter="url(#sk2)">
    <rect x="520" y="398" width="240" height="48" rx="8" fill="#eef6ef" stroke="#4a7e4a" stroke-width="1.6"/>
  </g>
  <text x="640" y="420" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">弹出 (cur, step)</text>
  <text x="640" y="438" text-anchor="middle" font-size="10.5" fill="#444">q.front(); q.pop()</text>

  <!-- arrow down to target check -->
  <path d="M 640 446 L 640 468" stroke="#5a5a5a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- decision: cur == target? -->
  <g filter="url(#sk2)">
    <polygon points="640,472 770,512 640,552 510,512" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="640" y="510" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">cur == target?</text>

  <!-- YES -> return step -->
  <path d="M 510 512 L 420 512 L 420 540" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="426" y="504" font-size="11" font-weight="bold" fill="#b85450">是</text>
  <g filter="url(#sk2)">
    <rect x="330" y="546" width="180" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="420" y="574" text-anchor="middle" font-size="13" font-weight="bold" fill="#34506e">return step ⭐</text>

  <!-- NO -> expand neighbors -->
  <path d="M 640 552 L 640 576 L 300 576 L 300 540 L 300 460" stroke="#4a7e4a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="566" y="568" font-size="11" font-weight="bold" fill="#2e6e2e">否</text>

  <!-- expand neighbors box (left) -->
  <g filter="url(#sk2)">
    <rect x="60" y="300" width="220" height="158" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="170" y="324" text-anchor="middle" font-size="13" font-weight="bold" fill="#34506e">扩展邻居</text>
  <text x="76" y="346" font-size="11" fill="#444">pos = cur.find('0')</text>
  <text x="76" y="364" font-size="11" fill="#444">for np in neigh[pos]:</text>
  <text x="92" y="382" font-size="11" fill="#444">next = swap(cur, pos, np)</text>
  <text x="92" y="400" font-size="11" fill="#444">if next ∉ visited:</text>
  <text x="108" y="418" font-size="11" fill="#2e6e2e">visited.add(next)</text>
  <text x="108" y="436" font-size="11" fill="#2e6e2e">q.push((next, step+1))</text>
  <text x="170" y="452" text-anchor="middle" font-size="9.5" fill="#b85450">入队即标记</text>

  <!-- loop back arrow from expand box to decision diamond -->
  <path d="M 280 380 L 220 380 L 220 350 L 240 350" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" stroke-dasharray="5 3" filter="url(#sk)"/>
  <text x="232" y="372" font-size="10" fill="#5a5a5a">回到循环</text>

  <!-- legend bottom -->
  <text x="390" y="590" text-anchor="middle" font-size="10.5" fill="#5a5a5a">核心纪律：visited 在「入队时」标记 → 每个状态只进队一次，避免重复扩展</text>
</svg>
