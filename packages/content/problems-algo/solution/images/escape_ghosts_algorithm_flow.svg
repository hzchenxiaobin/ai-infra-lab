<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M 0 0 L 4 8 L 8 0 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M 0 0 L 4 8 L 8 0 z" fill="#b85450"/>
    </marker>
    <marker id="arrGr" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M 0 0 L 4 8 L 8 0 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：单遍扫描，遇到 G ≤ D 立即返回 false</text>

  <!-- 1. Start -->
  <rect x="220" y="46" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">开始</text>
  <path d="M 280 80 L 280 96" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 2. 计算 D -->
  <rect x="180" y="98" width="200" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="116" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">计算你到目的地的距离</text>
  <text x="280" y="132" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">D = |x_t| + |y_t|</text>
  <path d="M 280 140 L 280 156" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 3. 初始化 i=0 -->
  <rect x="220" y="158" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="178" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">i ← 0</text>
  <path d="M 280 192 L 280 210" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 4. 循环判断 菱形 -->
  <polygon points="280,212 380,256 280,300 180,256" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="250" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i &lt; n ?</text>
  <text x="280" y="266" text-anchor="middle" font-size="10" fill="#888">(还有阻碍者未判)</text>

  <!-- 否 → 返回 true -->
  <path d="M 380 256 L 440 256" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrGr)" filter="url(#rough2)"/>
  <text x="398" y="250" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="442" y="240" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="492" y="262" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return true</text>

  <!-- 是 → 计算 G -->
  <path d="M 280 300 L 280 318" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="290" y="312" font-size="11" fill="#666" font-weight="bold">是</text>

  <!-- 5. 计算 G_i -->
  <rect x="160" y="320" width="240" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="338" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">计算第 i 个鬼到目的地的距离</text>
  <text x="280" y="354" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">G = |x_i − x_t| + |y_i − y_t|</text>
  <path d="M 280 360 L 280 378" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 6. 判断 G <= D 菱形 -->
  <polygon points="280,380 380,420 280,460 180,420" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="416" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">G ≤ D ?</text>
  <text x="280" y="432" text-anchor="middle" font-size="9" fill="#888">(鬼能堵门)</text>

  <!-- 是 → 返回 false -->
  <path d="M 380 420 L 440 420" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="398" y="414" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <rect x="442" y="404" width="100" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="492" y="426" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return false</text>

  <!-- 否 → i++ 回到循环 -->
  <path d="M 180 420 L 100 420 L 100 256 L 178 256" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrGr)" filter="url(#rough2)"/>
  <text x="108" y="414" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <text x="108" y="340" font-size="10" fill="#888">i ← i + 1</text>

  <!-- 注释 -->
  <rect x="40" y="370" width="56" height="34" fill="#fafafa" stroke="#aaa" stroke-width="1" stroke-dasharray="3 2" rx="6" filter="url(#rough2)"/>
  <text x="68" y="385" text-anchor="middle" font-size="9" fill="#888">继续</text>
  <text x="68" y="397" text-anchor="middle" font-size="9" fill="#888">下一个鬼</text>
</svg>
