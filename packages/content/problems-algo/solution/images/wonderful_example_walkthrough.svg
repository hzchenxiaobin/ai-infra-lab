<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">示例演算：word = "aabb"（掩码 ab，仅显示 2 位）</text>

  <!-- Char row -->
  <text x="30" y="58" font-size="11" fill="#888">字符:</text>
  <rect x="60" y="44" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="82" y="63" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">a</text>
  <rect x="104" y="44" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="126" y="63" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">a</text>
  <rect x="148" y="44" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="63" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">b</text>
  <rect x="192" y="44" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="214" y="63" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">b</text>

  <!-- index labels -->
  <text x="82" y="84" text-anchor="middle" font-size="9" fill="#aaa">i=0</text>
  <text x="126" y="84" text-anchor="middle" font-size="9" fill="#aaa">i=1</text>
  <text x="170" y="84" text-anchor="middle" font-size="9" fill="#aaa">i=2</text>
  <text x="214" y="84" text-anchor="middle" font-size="9" fill="#aaa">i=3</text>

  <!-- Table header -->
  <rect x="20" y="96" width="560" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="45"  y="114" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">步</text>
  <text x="82"  y="114" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">char</text>
  <text x="140" y="114" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">mask</text>
  <text x="235" y="114" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">全偶 count[mask]</text>
  <text x="380" y="114" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">恰1奇 Σcount[mask^1&lt;&lt;k]</text>
  <text x="510" y="114" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">本步 / 累计</text>

  <!-- Step 0: char=a, mask=01 -->
  <rect x="20" y="124" width="560" height="36" fill="#ffffff" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="45"  y="147" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="82"  y="147" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">a</text>
  <text x="140" y="147" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">01</text>
  <text x="235" y="147" text-anchor="middle" font-size="11" fill="#888">count[01]=0</text>
  <text x="380" y="147" text-anchor="middle" font-size="11" fill="#7a5a20">count[00]=1（翻a）</text>
  <text x="510" y="147" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">+1 / 1</text>

  <!-- Step 1: char=a, mask=00 -->
  <rect x="20" y="160" width="560" height="36" fill="#f7f7f7" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="45"  y="183" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="82"  y="183" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">a</text>
  <text x="140" y="183" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">00</text>
  <text x="235" y="183" text-anchor="middle" font-size="11" fill="#3a5a2a">count[00]=1</text>
  <text x="380" y="183" text-anchor="middle" font-size="11" fill="#7a5a20">count[01]=1（翻a）</text>
  <text x="510" y="183" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">+2 / 3</text>

  <!-- Step 2: char=b, mask=10 -->
  <rect x="20" y="196" width="560" height="36" fill="#ffffff" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="45"  y="219" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="82"  y="219" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">b</text>
  <text x="140" y="219" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">10</text>
  <text x="235" y="219" text-anchor="middle" font-size="11" fill="#888">count[10]=0</text>
  <text x="380" y="219" text-anchor="middle" font-size="11" fill="#7a5a20">count[00]=2（翻b）</text>
  <text x="510" y="219" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">+2 / 5</text>

  <!-- Step 3: char=b, mask=00 -->
  <rect x="20" y="232" width="560" height="36" fill="#f7f7f7" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="45"  y="255" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="82"  y="255" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">b</text>
  <text x="140" y="255" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">00</text>
  <text x="235" y="255" text-anchor="middle" font-size="11" fill="#3a5a2a">count[00]=2</text>
  <text x="380" y="255" text-anchor="middle" font-size="11" fill="#7a5a20">count[01]=1 + count[10]=1</text>
  <text x="510" y="255" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">+4 / 9</text>

  <!-- Answer box -->
  <rect x="20" y="276" width="560" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="310" y="297" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">最终 ans = 1 + 2 + 2 + 4 = 9 ✓</text>

  <!-- Substrings found -->
  <text x="310" y="328" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">9 个最美子串（按步分组）</text>

  <!-- Step 0 substrings -->
  <rect x="20" y="338" width="130" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="85" y="356" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">步0 (+1)</text>
  <text x="85" y="372" text-anchor="middle" font-size="11" fill="#333">"a"（a奇）</text>

  <!-- Step 1 substrings -->
  <rect x="155" y="338" width="145" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="227" y="356" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">步1 (+2)</text>
  <text x="227" y="372" text-anchor="middle" font-size="11" fill="#333">"aa"（全偶）</text>

  <!-- Step 2 substrings -->
  <rect x="305" y="338" width="145" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="377" y="356" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">步2 (+2)</text>
  <text x="377" y="372" text-anchor="middle" font-size="11" fill="#333">"aab"（b奇）</text>

  <!-- Step 3 substrings -->
  <rect x="455" y="338" width="145" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="527" y="356" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">步3 (+4)</text>
  <text x="527" y="372" text-anchor="middle" font-size="11" fill="#333">4 个（见下）</text>

  <!-- Detailed substrings list -->
  <rect x="20" y="392" width="580" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="410" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">步3 的 4 个子串：</text>
  <text x="310" y="426" text-anchor="middle" font-size="10.5" fill="#555">全偶: "aabb", "bb" ｜ 翻a: "abb"（a奇） ｜ 翻b: "b"（b奇）</text>
  <text x="310" y="442" text-anchor="middle" font-size="10" fill="#888">步3 同时命中两个翻转位（a 和 b），故贡献 2+1+1=4</text>
</svg>
