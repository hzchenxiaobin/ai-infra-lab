<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：找最大 → 等差求和</text>

  <!-- 输入 -->
  <rect x="170" y="56" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="81" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">输入：nums, k</text>

  <path d="M260,98 L260,128" stroke="#446688" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 步骤1：找最大值 -->
  <rect x="120" y="130" width="280" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="153" text-anchor="middle" font-size="14" fill="#3a5a2a" filter="url(#rough2)">步骤 1：一次遍历找最大值</text>
  <text x="260" y="174" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">M = max(nums)   O(n)</text>

  <path d="M260,188 L260,218" stroke="#446688" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 步骤2：等差求和 -->
  <rect x="100" y="220" width="320" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="243" text-anchor="middle" font-size="14" fill="#7a5a20" filter="url(#rough2)">步骤 2：选 M, M+1, …, M+k−1，等差求和</text>
  <text x="260" y="264" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">ans = k·M + k(k−1)/2   O(1)</text>

  <path d="M260,278 L260,308" stroke="#446688" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 输出 -->
  <rect x="150" y="310" width="220" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="335" text-anchor="middle" font-size="14" fill="#7a3030" filter="url(#rough2)">返回 ans</text>
</svg>
