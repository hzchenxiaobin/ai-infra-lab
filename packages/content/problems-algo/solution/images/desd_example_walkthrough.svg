<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：元素和减数字和，差恒为 9 的倍数</text>

  <!-- ===================== Example 1: [1,15,6,3] ===================== -->
  <text x="30" y="52" font-size="13" fill="#4a7a3a" font-weight="bold">示例 1：nums = [1, 15, 6, 3]</text>

  <text x="30" y="76" font-size="11" fill="#888">元素和：</text>
  <rect x="100" y="60" width="200" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="200" y="79" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">1 + 15 + 6 + 3 = 25</text>

  <text x="30" y="104" font-size="11" fill="#888">数字和：</text>
  <rect x="100" y="88" width="250" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="225" y="107" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1 + (1+5) + 6 + 3 = 16</text>

  <rect x="370" y="74" width="150" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="445" y="93" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">|25 − 16| = 9</text>

  <!-- divider -->
  <path d="M 30 128 L 510 128" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>

  <!-- ===================== Example 2: [1,2,3,4] ===================== -->
  <text x="30" y="152" font-size="13" fill="#d6a040" font-weight="bold">示例 2：nums = [1, 2, 3, 4]</text>

  <text x="30" y="176" font-size="11" fill="#888">元素和：</text>
  <rect x="100" y="160" width="170" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="185" y="179" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">1 + 2 + 3 + 4 = 10</text>

  <text x="30" y="204" font-size="11" fill="#888">数字和：</text>
  <rect x="100" y="188" width="170" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="185" y="207" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">1 + 2 + 3 + 4 = 10</text>

  <rect x="300" y="174" width="140" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="370" y="193" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">|10 − 10| = 0</text>

  <text x="450" y="193" text-anchor="middle" font-size="10.5" fill="#888">全一位数</text>

  <!-- divider -->
  <path d="M 30 228 L 510 228" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>

  <!-- ===================== Per-element decomposition ===================== -->
  <text x="30" y="252" font-size="13" fill="#446688" font-weight="bold">逐元素拆解：value − digitSum = Σ dᵢ·(10ⁱ − 1)</text>

  <!-- element 15 -->
  <rect x="40" y="266" width="120" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="100" y="284" text-anchor="middle" font-size="11" fill="#888">元素 15</text>
  <text x="100" y="302" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">10·1 + 1·5</text>

  <path d="M 160 288 L 200 288" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- minus -->
  <rect x="205" y="266" width="120" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="265" y="284" text-anchor="middle" font-size="11" fill="#888">数字和</text>
  <text x="265" y="302" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">1 + 5 = 6</text>

  <path d="M 325 288 L 365 288" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diff -->
  <rect x="370" y="266" width="140" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="440" y="284" text-anchor="middle" font-size="11" fill="#888">差值贡献</text>
  <text x="440" y="302" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">15 − 6 = 9</text>

  <!-- annotation row -->
  <rect x="40" y="320" width="470" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="275" y="338" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">单位数 1,6,3 贡献 0；仅 15 贡献 9 → 总差 = 0+9+0+0 = 9</text>
  <text x="275" y="356" text-anchor="middle" font-size="10.5" fill="#888">10¹ − 1 = 9 是 9 的倍数；高位 10ⁱ − 1 均被 9 整除 ⇒ 总差恒为 9 的倍数</text>
  <text x="275" y="370" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">正整数恒有 value ≥ digitSum，故省 abs() 直接返回 elem − digit</text>
</svg>
