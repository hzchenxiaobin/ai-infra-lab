<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：b 起点落在首份 a 内，最多只需 k+1 次重复</text>

  <text x="40" y="54" font-size="12" fill="#666">a = "abcd"（n = 4），b = "cdabcdab"（m = 8），k = ⌈8 / 4⌉ = 2</text>

  <!-- 3 copies of a, cell width 38, height 32, starting x=80 -->
  <!-- Copy 1: blue cells for non-b, orange for b -->
  <rect x="80" y="68" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="99" y="90" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="118" y="68" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="137" y="90" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>
  <rect x="156" y="68" width="38" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="175" y="90" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">c</text>
  <rect x="194" y="68" width="38" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="213" y="90" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">d</text>
  <!-- Copy 2 -->
  <rect x="232" y="68" width="38" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="251" y="90" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">a</text>
  <rect x="270" y="68" width="38" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="289" y="90" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">b</text>
  <rect x="308" y="68" width="38" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="327" y="90" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">c</text>
  <rect x="346" y="68" width="38" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="365" y="90" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">d</text>
  <!-- Copy 3 -->
  <rect x="384" y="68" width="38" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="403" y="90" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">a</text>
  <rect x="422" y="68" width="38" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="441" y="90" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">b</text>
  <rect x="460" y="68" width="38" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="479" y="90" text-anchor="middle" font-size="14" fill="#999">c</text>
  <rect x="498" y="68" width="38" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="517" y="90" text-anchor="middle" font-size="14" fill="#999">d</text>

  <!-- Position indices -->
  <text x="99" y="114" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="137" y="114" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="175" y="114" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="213" y="114" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="251" y="114" text-anchor="middle" font-size="9" fill="#888">4</text>
  <text x="289" y="114" text-anchor="middle" font-size="9" fill="#888">5</text>
  <text x="327" y="114" text-anchor="middle" font-size="9" fill="#888">6</text>
  <text x="365" y="114" text-anchor="middle" font-size="9" fill="#888">7</text>
  <text x="403" y="114" text-anchor="middle" font-size="9" fill="#888">8</text>
  <text x="441" y="114" text-anchor="middle" font-size="9" fill="#888">9</text>

  <!-- Copy labels -->
  <path d="M80 62 L80 56 L232 56 L232 62" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="156" y="50" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">第 1 份</text>
  <path d="M232 62 L232 56 L384 56 L384 62" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="308" y="50" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">第 2 份</text>
  <path d="M384 62 L384 56 L536 56 L536 62" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="460" y="50" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">第 3 份</text>

  <!-- b span bracket -->
  <path d="M156 122 L156 130 L441 130 L441 122" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="298" y="144" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">b = "cdabcdab"（m = 8）从偏移 2 起，跨到第 3 份</text>

  <!-- k=2 not enough -->
  <rect x="40" y="158" width="480" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="178" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">k = 2 份：长度 8 ≥ m，但 b 从偏移 2 起需到位置 9 → 超出边界</text>

  <!-- k+1=3 enough -->
  <rect x="40" y="196" width="480" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="216" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">k+1 = 3 份：长度 12，覆盖位置 0–11 → b 在偏移 2 处命中 → 返回 3</text>

  <!-- Why not k+2 -->
  <text x="40" y="250" font-size="12.5" fill="#446688" font-weight="bold">为何 k+2 永远不需要？</text>

  <rect x="40" y="258" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="278" text-anchor="middle" font-size="11.5" fill="#444">b 起点 ∈ [0, n−1]，终点 ≤ n−1 + m−1 = n + m − 2</text>
  <text x="280" y="298" text-anchor="middle" font-size="11.5" fill="#444">k+1 份长度 = (k+1)·n ≥ m + n &gt; n + m − 2 → 必然覆盖</text>

  <!-- Conclusion -->
  <rect x="40" y="328" width="480" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">结论：只检查 a×k 与 a×(k+1)，命中即返回，否则 −1</text>

  <text x="280" y="386" text-anchor="middle" font-size="10.5" fill="#888">橙色列 = b 覆盖的字符；灰色列 = k+1 份内但 b 不需要</text>
</svg>
