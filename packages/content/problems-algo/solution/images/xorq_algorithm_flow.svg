<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="440" height="540" fill="#fafafa"/>

  <text x="220" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">子数组异或查询：算法流程</text>

  <!-- Phase 1: build prefix -->
  <rect x="60" y="40" width="320" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="220" y="60" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">阶段一：预处理异或前缀数组 O(n)</text>

  <path d="M 220 74 L 220 92" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Init prefix -->
  <rect x="80" y="96" width="280" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="220" y="116" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">prefix[0] = 0</text>
  <text x="220" y="132" text-anchor="middle" font-size="10.5" fill="#555">空前缀（异或单位元）</text>

  <path d="M 220 144 L 220 162" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Loop entry -->
  <rect x="80" y="166" width="280" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough)"/>
  <text x="220" y="186" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">for i in 0..n−1</text>
  <text x="220" y="202" text-anchor="middle" font-size="10.5" fill="#555">遍历 arr 每个元素</text>

  <path d="M 220 214 L 220 232" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- prefix recurrence -->
  <rect x="70" y="236" width="300" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="220" y="256" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">prefix[i+1] = prefix[i] ^ arr[i]</text>
  <text x="220" y="272" text-anchor="middle" font-size="10" fill="#4a7a3a">递推：前 i 个的异或 ^ 当前元素</text>

  <!-- loop back -->
  <path d="M 370 258 L 410 258 L 410 188 L 360 188" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <text x="416" y="224" font-size="9.5" fill="#aaa" transform="rotate(-90 416 224)">循环</text>

  <path d="M 220 284 L 220 302" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Phase 2: answer queries -->
  <rect x="60" y="306" width="320" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="220" y="326" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">阶段二：逐个回答查询 O(1)/次</text>

  <path d="M 220 340 L 220 358" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- query loop -->
  <rect x="80" y="362" width="280" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough)"/>
  <text x="220" y="382" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">for [L, R] in queries</text>
  <text x="220" y="398" text-anchor="middle" font-size="10.5" fill="#555">遍历每个查询</text>

  <path d="M 220 410 L 220 428" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- answer formula -->
  <rect x="50" y="432" width="340" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="220" y="454" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">ans = prefix[R+1] ^ prefix[L]</text>
  <text x="220" y="472" text-anchor="middle" font-size="10.5" fill="#555">两次异或抵消公共前缀，O(1) 出结果</text>

  <!-- loop back -->
  <path d="M 370 456 L 410 456 L 410 384 L 360 384" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <text x="416" y="422" font-size="9.5" fill="#aaa" transform="rotate(-90 416 422)">循环</text>

  <!-- final -->
  <text x="220" y="510" text-anchor="middle" font-size="11" fill="#d6a040" font-style="italic">总复杂度：预处理 O(n) + 查询 O(m) = O(n+m)，空间 O(n)</text>
  <text x="220" y="528" text-anchor="middle" font-size="10" fill="#aaa">对照求和前缀和：把「−」换成「^」，把单位元 0 共用</text>
</svg>
