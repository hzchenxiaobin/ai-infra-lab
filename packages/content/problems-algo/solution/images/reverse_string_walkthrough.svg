<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = ["h","e","l","l","o"]</text>

  <!-- Column headers -->
  <rect x="24" y="50" width="44" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="46" y="66" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">步</text>
  <rect x="70" y="50" width="40" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="90" y="66" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">left</text>
  <rect x="112" y="50" width="40" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="132" y="66" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">right</text>
  <rect x="154" y="50" width="120" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="214" y="66" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">操作</text>
  <rect x="276" y="50" width="270" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="411" y="66" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">数组状态</text>

  <!-- Row 0: initial -->
  <rect x="24" y="78" width="44" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="46" y="100" text-anchor="middle" font-size="11" fill="#555">0</text>
  <rect x="70" y="78" width="40" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="90" y="100" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <rect x="112" y="78" width="40" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="132" y="100" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <rect x="154" y="78" width="120" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="214" y="100" text-anchor="middle" font-size="10" fill="#888">初始</text>
  <!-- array state: h e l l o -->
  <g filter="url(#rough2)">
    <rect x="288" y="82" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <text x="310" y="100" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">h</text>
    <rect x="332" y="82" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <text x="354" y="100" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">e</text>
    <rect x="376" y="82" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <text x="398" y="100" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">l</text>
    <rect x="420" y="82" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <text x="442" y="100" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">l</text>
    <rect x="464" y="82" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <text x="486" y="100" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">o</text>
  </g>

  <!-- Row 1: swap h <-> o -->
  <rect x="24" y="118" width="44" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="46" y="140" text-anchor="middle" font-size="11" fill="#555">1</text>
  <rect x="70" y="118" width="40" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="90" y="140" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <rect x="112" y="118" width="40" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="132" y="140" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <rect x="154" y="118" width="120" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="214" y="140" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">swap(h, o)</text>
  <!-- array state: o e l l h (h and o highlighted) -->
  <g filter="url(#rough2)">
    <rect x="288" y="122" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3"/>
    <text x="310" y="140" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">o</text>
    <rect x="332" y="122" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <text x="354" y="140" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">e</text>
    <rect x="376" y="122" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <text x="398" y="140" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">l</text>
    <rect x="420" y="122" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <text x="442" y="140" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">l</text>
    <rect x="464" y="122" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3"/>
    <text x="486" y="140" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">h</text>
  </g>

  <!-- Row 2: swap e <-> l -->
  <rect x="24" y="158" width="44" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="46" y="180" text-anchor="middle" font-size="11" fill="#555">2</text>
  <rect x="70" y="158" width="40" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="90" y="180" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <rect x="112" y="158" width="40" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="132" y="180" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <rect x="154" y="158" width="120" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="214" y="180" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">swap(e, l)</text>
  <!-- array state: o l l e h (e and l(idx3) highlighted) -->
  <g filter="url(#rough2)">
    <rect x="288" y="162" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <text x="310" y="180" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">o</text>
    <rect x="332" y="162" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3"/>
    <text x="354" y="180" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">l</text>
    <rect x="376" y="162" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <text x="398" y="180" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">l</text>
    <rect x="420" y="162" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3"/>
    <text x="442" y="180" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">e</text>
    <rect x="464" y="162" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <text x="486" y="180" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">h</text>
  </g>

  <!-- Row 3: stop -->
  <rect x="24" y="198" width="44" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="46" y="220" text-anchor="middle" font-size="11" fill="#555">3</text>
  <rect x="70" y="198" width="40" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="90" y="220" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <rect x="112" y="198" width="40" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="132" y="220" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <rect x="154" y="198" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="214" y="220" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">left ≥ right 停</text>
  <!-- final array: o l l e h -->
  <g filter="url(#rough2)">
    <rect x="288" y="202" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/>
    <text x="310" y="220" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">o</text>
    <rect x="332" y="202" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/>
    <text x="354" y="220" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">l</text>
    <rect x="376" y="202" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/>
    <text x="398" y="220" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">l</text>
    <rect x="420" y="202" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/>
    <text x="442" y="220" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">e</text>
    <rect x="464" y="202" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/>
    <text x="486" y="220" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">h</text>
  </g>

  <!-- Insight box -->
  <rect x="40" y="256" width="480" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="278" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">共 ⌊n/2⌋ = ⌊5/2⌋ = 2 次交换</text>
  <text x="280" y="296" text-anchor="middle" font-size="11" fill="#555">奇数长度时最中间元素自然落在 left == right 处，无需交换</text>
  <text x="280" y="314" text-anchor="middle" font-size="11" fill="#555">每轮一次 swap 后两端指针各内移一步，区间 [left, right] 单调缩小</text>
  <text x="280" y="330" text-anchor="middle" font-size="11" fill="#888">—— 经典「对撞双指针」原地操作模板</text>
</svg>
