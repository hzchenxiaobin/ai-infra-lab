<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">BST 性质：比较 target 与 node.val，剪掉一半子树</text>

  <!-- BST 树 -->
  <text x="40" y="58" font-size="12" fill="#888">BST（target = 3.71）：</text>

  <!-- 节点 4 (root, 走左) -->
  <circle cx="200" cy="96" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="200" y="101" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <text x="234" y="100" font-size="10" fill="#b85450">target&lt;4 → 左</text>

  <!-- 节点 2 (走右) -->
  <circle cx="130" cy="160" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="130" y="164" text-anchor="middle" font-size="11" fill="#333">2</text>
  <line x1="186" y1="110" x2="140" y2="148" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="40" y="180" font-size="10" fill="#446688">target&gt;2 → 右</text>

  <!-- 节点 5 (剪掉) -->
  <circle cx="280" cy="160" r="15" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="280" y="164" text-anchor="middle" font-size="11" fill="#999">5</text>
  <line x1="214" y1="110" x2="270" y2="148" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="300" y="156" font-size="10" fill="#999">✂ 剪掉</text>

  <!-- 节点 1 (剪掉) -->
  <circle cx="80" cy="230" r="13" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="80" y="234" text-anchor="middle" font-size="10" fill="#999">1</text>
  <line x1="118" y1="172" x2="88" y2="220" stroke="#bbb" stroke-width="1.1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="30" y="250" font-size="10" fill="#999">✂ 剪掉</text>

  <!-- 节点 3 (走右→空) -->
  <circle cx="170" cy="230" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="170" y="234" text-anchor="middle" font-size="10" fill="#333">3</text>
  <line x1="142" y1="172" x2="162" y2="220" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="186" y="234" font-size="10" fill="#4a7a3a">target&gt;3 → 右</text>
  <text x="186" y="248" font-size="10" fill="#888">右=null，结束</text>

  <!-- 路径标注 -->
  <path d="M 200 78 L 200 50" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3,3" fill="none" filter="url(#rough2)"/>
  <text x="208" y="46" font-size="11" fill="#b85450" font-weight="bold">搜索路径：4→2→3</text>

  <!-- 数轴示意 -->
  <text x="40" y="300" font-size="12" fill="#888">数轴上找最近：</text>
  <line x1="60" y1="330" x2="520" y2="330" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 515 325 L 525 330 L 515 335" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 数轴刻度 -->
  <circle cx="140" cy="330" r="4" fill="#446688" filter="url(#rough2)"/>
  <text x="140" y="352" text-anchor="middle" font-size="11" fill="#446688">1</text>
  <circle cx="220" cy="330" r="4" fill="#446688" filter="url(#rough2)"/>
  <text x="220" y="352" text-anchor="middle" font-size="11" fill="#446688">2</text>
  <circle cx="300" cy="330" r="4" fill="#446688" filter="url(#rough2)"/>
  <text x="300" y="352" text-anchor="middle" font-size="11" fill="#446688">3</text>
  <circle cx="380" cy="330" r="5" fill="#b85450" filter="url(#rough2)"/>
  <text x="380" y="352" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">4</text>
  <circle cx="460" cy="330" r="4" fill="#446688" filter="url(#rough2)"/>
  <text x="460" y="352" text-anchor="middle" font-size="11" fill="#446688">5</text>

  <!-- target 标记 -->
  <path d="M 360 318 L 360 342" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="360" y="314" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3.71</text>

  <!-- 说明框 -->
  <rect x="40" y="370" width="500" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="60" y="386" font-size="11" fill="#333">BST 有序：每次比较只走一条路径，|3.71−4|=0.29 最小，无需遍历全树</text>
</svg>
