<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">atLeast(m) 滑窗流程：shrink while valid</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">主函数：ans = atLeast(k) − atLeast(k+1)，m 取 k 与 k+1 各跑一遍</text>

  <!-- 开始 -->
  <rect x="180" y="50" width="160" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="15" filter="url(#rough2)"/>
  <text x="260" y="70" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">开始：计数清零，left = 0</text>

  <path d="M 260 82 L 260 96" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 入窗 -->
  <rect x="150" y="98" width="220" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="117" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">word[right] 入窗</text>
  <text x="260" y="136" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">元音 → cnt[ch]++（新增种类则 kinds++）/ 辅音 → consonants++</text>

  <path d="M 260 146 L 260 162" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形判定 -->
  <polygon points="260,164 348,206 260,248 172,206" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="200" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">kinds == 5 且</text>
  <text x="260" y="217" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">consonants ≥ m ?</text>

  <!-- 是 → 计数+收缩 -->
  <path d="M 348 206 L 374 206" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="361" y="197" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="376" y="140" width="136" height="132" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="444" y="160" text-anchor="middle" font-size="10.5" fill="#8a3833" font-weight="bold" filter="url(#rough2)">先计数：ans += n − right</text>
  <text x="444" y="177" text-anchor="middle" font-size="9.5" fill="#8a3833" filter="url(#rough2)">（此后 r ≥ right 的</text>
  <text x="444" y="191" text-anchor="middle" font-size="9.5" fill="#8a3833" filter="url(#rough2)">延伸全部合法）</text>
  <text x="444" y="211" text-anchor="middle" font-size="10.5" fill="#8a3833" font-weight="bold" filter="url(#rough2)">再收缩：移出 word[left]</text>
  <text x="444" y="228" text-anchor="middle" font-size="9.5" fill="#8a3833" filter="url(#rough2)">元音归零 → kinds−−</text>
  <text x="444" y="243" text-anchor="middle" font-size="9.5" fill="#8a3833" filter="url(#rough2)">辅音 → consonants−−</text>
  <text x="444" y="260" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">left++，回菱形再判！</text>

  <path d="M 382 272 C 352 290, 320 278, 272 250" fill="none" stroke="#a07830" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="291" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">继续收缩</text>

  <!-- 否 → right++ -->
  <path d="M 260 248 L 260 280" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="273" y="269" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="185" y="282" width="150" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="298" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">right++</text>
  <text x="260" y="314" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">（right = n 时结束扫描）</text>

  <!-- 回到入窗 -->
  <path d="M 185 302 L 70 302 L 70 122 L 148 122" fill="none" stroke="#a07830" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="112" y="294" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">right 未到末尾</text>

  <path d="M 260 322 L 260 340" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 返回 -->
  <rect x="185" y="342" width="150" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="15" filter="url(#rough2)"/>
  <text x="260" y="362" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 ans（long long）</text>

  <!-- 易错点 -->
  <rect x="30" y="342" width="140" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="100" y="360" text-anchor="middle" font-size="10" fill="#8a3833" font-weight="bold" filter="url(#rough2)">⚠ 易错：ans 加的是</text>
  <text x="100" y="376" text-anchor="middle" font-size="10" fill="#8a3833" filter="url(#rough2)">n − right，不是 1！</text>
</svg>
