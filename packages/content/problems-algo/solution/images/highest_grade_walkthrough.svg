<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：分组排序 + 并列 tie-breaking 取 course_id 最小</text>

  <!-- Student 1 partition -->
  <text x="120" y="52" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">student_id = 1</text>
  <rect x="30" y="58" width="180" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="50" y="75" font-size="9" fill="#999">course_id</text>
  <text x="120" y="75" font-size="9" fill="#999">grade</text>
  <text x="175" y="75" font-size="9" fill="#999">rn</text>
  <line x1="95" y1="58" x2="95" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="155" y1="58" x2="155" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="84" width="180" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="50" y="99" font-size="10" fill="#446688" font-weight="bold">2</text>
  <text x="120" y="99" font-size="10" fill="#446688" font-weight="bold">99</text>
  <text x="175" y="99" font-size="10" fill="#446688" font-weight="bold">1</text>
  <line x1="95" y1="84" x2="95" y2="106" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="155" y1="84" x2="155" y2="106" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="106" width="180" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="121" font-size="10" fill="#999">1</text>
  <text x="120" y="121" font-size="10" fill="#999">90</text>
  <text x="175" y="121" font-size="10" fill="#999">2</text>
  <line x1="95" y1="106" x2="95" y2="128" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="155" y1="106" x2="155" y2="128" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="120" y="142" text-anchor="middle" font-size="9" fill="#446688">99 > 90 → course 2 排第 1</text>

  <!-- Student 2 partition -->
  <text x="120" y="162" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">student_id = 2（并列！）</text>
  <rect x="30" y="168" width="180" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="50" y="185" font-size="9" fill="#999">course_id</text>
  <text x="120" y="185" font-size="9" fill="#999">grade</text>
  <text x="175" y="185" font-size="9" fill="#999">rn</text>
  <line x1="95" y1="168" x2="95" y2="194" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="155" y1="168" x2="155" y2="194" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="194" width="180" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="50" y="209" font-size="10" fill="#b85450" font-weight="bold">2</text>
  <text x="120" y="209" font-size="10" fill="#b85450" font-weight="bold">95</text>
  <text x="175" y="209" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <line x1="95" y1="194" x2="95" y2="216" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="155" y1="194" x2="155" y2="216" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="216" width="180" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="231" font-size="10" fill="#999">3</text>
  <text x="120" y="231" font-size="10" fill="#999">95</text>
  <text x="175" y="231" font-size="10" fill="#999">2</text>
  <line x1="95" y1="216" x2="95" y2="238" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="155" y1="216" x2="155" y2="238" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="120" y="252" text-anchor="middle" font-size="9" fill="#b85450">grade 并列 95 → course_id 2 &lt; 3 → course 2 排第 1</text>

  <!-- Student 3 partition -->
  <text x="120" y="272" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">student_id = 3（并列！）</text>
  <rect x="30" y="278" width="180" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="50" y="295" font-size="9" fill="#999">course_id</text>
  <text x="120" y="295" font-size="9" fill="#999">grade</text>
  <text x="175" y="295" font-size="9" fill="#999">rn</text>
  <line x1="95" y1="278" x2="95" y2="304" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="155" y1="278" x2="155" y2="304" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="304" width="180" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="50" y="319" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="120" y="319" font-size="10" fill="#4a7a3a" font-weight="bold">80</text>
  <text x="175" y="319" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <line x1="95" y1="304" x2="95" y2="326" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="155" y1="304" x2="155" y2="326" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="326" width="180" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="341" font-size="10" fill="#999">3</text>
  <text x="120" y="341" font-size="10" fill="#999">80</text>
  <text x="175" y="341" font-size="10" fill="#999">2</text>
  <line x1="95" y1="326" x2="95" y2="348" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="155" y1="326" x2="155" y2="348" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="348" width="180" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="363" font-size="10" fill="#999">2</text>
  <text x="120" y="363" font-size="10" fill="#999">75</text>
  <text x="175" y="363" font-size="10" fill="#999">3</text>
  <line x1="95" y1="348" x2="95" y2="370" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="155" y1="348" x2="155" y2="370" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="120" y="384" text-anchor="middle" font-size="9" fill="#4a7a3a">grade 并列 80 → course_id 1 &lt; 3 → course 1 排第 1</text>

  <!-- Arrows to result -->
  <path d="M210 95 L310 95 L310 130 L370 130" stroke="#446688" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M210 205 L310 205 L310 162 L370 162" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M210 315 L310 315 L310 194 L370 194" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Result table -->
  <text x="460" y="116" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">最终输出</text>
  <rect x="370" y="122" width="170" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="388" y="139" font-size="9" fill="#333">student_id</text>
  <text x="448" y="139" font-size="9" fill="#333">course_id</text>
  <text x="510" y="139" font-size="9" fill="#333">grade</text>
  <line x1="415" y1="122" x2="415" y2="148" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="480" y1="122" x2="480" y2="148" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="370" y="148" width="170" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="388" y="163" font-size="10" fill="#333">1</text>
  <text x="448" y="163" font-size="10" fill="#446688" font-weight="bold">2</text>
  <text x="510" y="163" font-size="10" fill="#446688" font-weight="bold">99</text>
  <line x1="415" y1="148" x2="415" y2="170" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="480" y1="148" x2="480" y2="170" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="370" y="170" width="170" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="388" y="185" font-size="10" fill="#333">2</text>
  <text x="448" y="185" font-size="10" fill="#b85450" font-weight="bold">2</text>
  <text x="510" y="185" font-size="10" fill="#b85450" font-weight="bold">95</text>
  <line x1="415" y1="170" x2="415" y2="192" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="480" y1="170" x2="480" y2="192" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="370" y="192" width="170" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="388" y="207" font-size="10" fill="#333">3</text>
  <text x="448" y="207" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="510" y="207" font-size="10" fill="#4a7a3a" font-weight="bold">80</text>
  <line x1="415" y1="192" x2="415" y2="214" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="480" y1="192" x2="480" y2="214" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Bottom callout -->
  <rect x="30" y="402" width="500" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="422" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">关键：ORDER BY grade DESC, course_id ASC 让并列时 course_id 小的排前面，ROW_NUMBER 只取 rn=1</text>
</svg>
