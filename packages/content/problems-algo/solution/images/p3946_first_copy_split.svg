<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" font-size="15.5" fill="#333" text-anchor="middle" filter="url(#rough2)">核心观察：首件「激活」一次，追加件只值 1 个</text>

  <!-- 物品卡片 -->
  <rect x="30" y="46" width="200" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="66" font-size="12" fill="#33475e" text-anchor="middle" filter="url(#rough2)">物品 i = [factor_i, price_i]</text>
  <text x="130" y="86" font-size="11.5" fill="#33475e" text-anchor="middle" filter="url(#rough2)">示例：factor = 2，price = 4</text>

  <!-- 连接线 -> f_i 面板 -->
  <line x1="230" y1="72" x2="254" y2="72" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- f_i 面板 -->
  <rect x="260" y="46" width="230" height="72" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="375" y="63" font-size="10.5" fill="#2e4d24" text-anchor="middle" filter="url(#rough2)">f_i = |{ j ≠ i : factor_i 整除 factor_j }|</text>

  <!-- factor 值筹码 -->
  <rect x="274" y="73" width="22" height="17" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="285" y="86" font-size="10.5" fill="#33475e" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="300" y="73" width="22" height="17" rx="4" fill="#f0f0f0" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="311" y="86" font-size="10.5" fill="#777777" text-anchor="middle" filter="url(#rough2)">3</text>
  <rect x="326" y="73" width="22" height="17" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="337" y="86" font-size="10.5" fill="#2e4d24" text-anchor="middle" filter="url(#rough2)">4</text>
  <rect x="352" y="73" width="22" height="17" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="363" y="86" font-size="10.5" fill="#2e4d24" text-anchor="middle" filter="url(#rough2)">6</text>
  <rect x="378" y="73" width="28" height="17" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="392" y="86" font-size="10.5" fill="#2e4d24" text-anchor="middle" filter="url(#rough2)">12</text>
  <text x="452" y="86" font-size="10" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">绿=倍数</text>

  <text x="375" y="108" font-size="11" fill="#2e4d24" text-anchor="middle" filter="url(#rough2)">f_i = 3：4、6、12 各免费一份</text>

  <!-- 拆分箭头 -->
  <path d="M 90 98 L 108 164" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 170 98 L 352 164" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 首件（激活） -->
  <rect x="30" y="170" width="225" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="142" y="188" font-size="11.5" fill="#7a5c1e" text-anchor="middle" filter="url(#rough2)">首件（激活）：花费 price = 4</text>
  <text x="142" y="206" font-size="11.5" fill="#7a5c1e" text-anchor="middle" filter="url(#rough2)">收益 1 + f_i = 4（自己 + 3 个赠送）</text>
  <text x="142" y="224" font-size="11.5" fill="#7a5c1e" text-anchor="middle" filter="url(#rough2)">▸ 0/1 背包 · 倒序一趟</text>

  <!-- 追加件 -->
  <rect x="285" y="170" width="205" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="387" y="188" font-size="11.5" fill="#33475e" text-anchor="middle" filter="url(#rough2)">追加件：花费 price = 4</text>
  <text x="387" y="206" font-size="11.5" fill="#33475e" text-anchor="middle" filter="url(#rough2)">收益 1（不再触发赠送）</text>
  <text x="387" y="224" font-size="11.5" fill="#33475e" text-anchor="middle" filter="url(#rough2)">▸ 完全背包 · 正序一趟</text>

  <!-- 陷阱警示框 -->
  <rect x="30" y="254" width="460" height="86" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="274" font-size="10.5" fill="#8a3a36" text-anchor="middle" filter="url(#rough2)">⚠️ 陷阱：单趟正序里混写「dp[b-p]+1+f_i」与「dp[b-p]+1」，</text>
  <text x="260" y="292" font-size="10.5" fill="#8a3a36" text-anchor="middle" filter="url(#rough2)">首件项会读到已激活 i 的 dp[b-p]，把赠送重复计入——</text>
  <text x="260" y="310" font-size="10.5" fill="#8a3a36" text-anchor="middle" filter="url(#rough2)">单件 p=2、f=1、budget=4 时错得 4，正确答案 3；</text>
  <text x="260" y="328" font-size="10.5" fill="#8a3a36" text-anchor="middle" filter="url(#rough2)">先倒序 0/1、再正序完全，两趟循环天然规避</text>
</svg>
