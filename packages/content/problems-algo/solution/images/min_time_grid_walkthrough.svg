<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：最终 dist（到达时刻）</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">Dijkstra 贪心逐格确定；答案 = dist[2][3] = 7</text>

  <!-- ===== dist grid 3x4, cell 56 ===== -->
  <!-- row 0 -->
  <rect x="40" y="64" width="56" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="68" y="98" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">0</text>

  <rect x="98" y="64" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="126" y="98" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">1</text>

  <rect x="156" y="64" width="56" height="56" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="184" y="98" text-anchor="middle" font-size="15" fill="#888">4</text>

  <rect x="214" y="64" width="56" height="56" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="242" y="98" text-anchor="middle" font-size="15" fill="#888">5</text>

  <!-- row 1 -->
  <rect x="40" y="122" width="56" height="56" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="68" y="156" text-anchor="middle" font-size="15" fill="#888">5</text>

  <rect x="98" y="122" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="126" y="156" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">2</text>

  <rect x="156" y="122" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="184" y="156" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">3</text>

  <rect x="214" y="122" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="242" y="156" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">6</text>

  <!-- row 2 -->
  <rect x="40" y="180" width="56" height="56" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="68" y="214" text-anchor="middle" font-size="15" fill="#888">4</text>

  <rect x="98" y="180" width="56" height="56" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="126" y="214" text-anchor="middle" font-size="15" fill="#888">3</text>

  <rect x="156" y="180" width="56" height="56" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="184" y="214" text-anchor="middle" font-size="15" fill="#888">8</text>

  <rect x="214" y="180" width="56" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="242" y="214" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">7</text>

  <!-- path arrows -->
  <path d="M 84 92 L 96 92" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 126 120 L 126 122" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 154 150 L 156 150" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <!-- oscillation (1,2) -> (1,3) curved to show waiting -->
  <path d="M 212 138 Q 232 120 242 122" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="232" y="116" text-anchor="middle" font-size="9" fill="#d6a040">弹跳等待</text>
  <!-- (1,3) -> (2,3) -->
  <path d="M 242 178 L 242 180" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- ===== right: key step computation ===== -->
  <rect x="300" y="64" width="240" height="172" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="420" y="86" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">关键步：(1,2) → (1,3)</text>

  <text x="316" y="110" font-size="11" fill="#555">当前 d = dist[1][2] = 3</text>
  <text x="316" y="128" font-size="11" fill="#555">邻居阈值 g = grid[1][3] = 5</text>

  <text x="316" y="150" font-size="11" fill="#446688" font-weight="bold">nd = max(d+1, g)</text>
  <text x="330" y="166" font-size="11" fill="#446688">= max(4, 5) = 5</text>

  <text x="316" y="186" font-size="11" fill="#b85450" font-weight="bold">(nd − d) = 5 − 3 = 2 偶数</text>
  <text x="316" y="202" font-size="11" fill="#b85450" font-weight="bold">⇒ nd++ → 6</text>
  <text x="316" y="220" font-size="9" fill="#888">dist[1][3] = 6（弹回 (1,1) 一轮）</text>

  <!-- ===== bottom: trace path ===== -->
  <rect x="40" y="262" width="500" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="282" font-size="11" fill="#4a7a3a" font-weight="bold">实际轨迹（时刻 → 格子）</text>
  <text x="56" y="302" font-size="10" fill="#555">0:(0,0) → 1:(0,1) → 2:(1,1) → 3:(1,2)</text>
  <text x="56" y="318" font-size="10" fill="#d6a040">→ 4:(1,1) → 5:(1,2)   ← 弹回一轮凑奇数步</text>
  <text x="56" y="334" font-size="10" fill="#555">→ 6:(1,3) → 7:(2,3) ✓ 终点</text>
</svg>
