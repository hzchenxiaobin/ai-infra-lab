<svg xmlns="http://www.w3.org/2000/svg" width="860" height="540" viewBox="0 0 860 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="860" height="540" fill="#fdfcf7"/>
  <text x="430" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">哈希集合 = 桶数组 + 链地址法</text>
  <path d="M 250 46 Q 430 54 610 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Hash function box ===== -->
  <g filter="url(#sk)"><rect x="60" y="74" width="220" height="64" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="170" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">哈希函数</text>
  <text x="170" y="120" text-anchor="middle" font-size="15" fill="#b03a3a" font-family="'Comic Sans MS',cursive">h(key) = key % 769</text>

  <!-- ===== Bucket array (left) ===== -->
  <text x="170" y="166" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">桶数组 buckets[769]</text>
  <g font-size="13">
    <!-- bucket 0 -->
    <g filter="url(#sk)"><rect x="110" y="178" width="120" height="34" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
    <text x="130" y="200" text-anchor="middle" fill="#2b6e9e" font-weight="bold">0</text>
    <text x="190" y="200" text-anchor="middle" fill="#888" font-size="11">→ null</text>
    <!-- bucket 1 (highlighted, has chain) -->
    <g filter="url(#sk)"><rect x="110" y="216" width="120" height="34" rx="5" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="2"/></g>
    <text x="130" y="238" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>
    <!-- bucket 2 -->
    <g filter="url(#sk)"><rect x="110" y="254" width="120" height="34" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
    <text x="130" y="276" text-anchor="middle" fill="#2b6e9e" font-weight="bold">2</text>
    <text x="190" y="276" text-anchor="middle" fill="#888" font-size="11">→ null</text>
    <!-- bucket 3 (has chain) -->
    <g filter="url(#sk)"><rect x="110" y="292" width="120" height="34" rx="5" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.6"/></g>
    <text x="130" y="314" text-anchor="middle" fill="#2e6e2e" font-weight="bold">3</text>
    <!-- ellipsis -->
    <text x="170" y="346" text-anchor="middle" font-size="16" fill="#888" filter="url(#sk)">⋮</text>
    <!-- bucket 768 -->
    <g filter="url(#sk)"><rect x="110" y="360" width="120" height="34" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
    <text x="130" y="382" text-anchor="middle" fill="#2b6e9e" font-weight="bold">768</text>
    <text x="195" y="382" text-anchor="middle" fill="#888" font-size="11">→ null</text>
  </g>

  <!-- ===== Chain for bucket 1 ===== -->
  <!-- arrow from bucket 1 to first node -->
  <path d="M 230 233 L 320 233" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="324" y="216" width="56" height="34" rx="5" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="352" y="238" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">1</text>
  <!-- node 770 -->
  <path d="M 380 233 L 440 233" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="444" y="216" width="56" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="472" y="238" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">770</text>
  <!-- null terminator -->
  <path d="M 500 233 L 540 233" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="560" y="237" font-size="11" fill="#888">null</text>

  <!-- ===== Chain for bucket 3 ===== -->
  <path d="M 230 309 L 320 309" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="324" y="292" width="56" height="34" rx="5" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="352" y="314" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">3</text>
  <path d="M 380 309 L 540 309" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="560" y="313" font-size="11" fill="#888">null</text>

  <!-- ===== Collision annotation for bucket 1 ===== -->
  <path d="M 510 210 Q 540 168 560 168" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="560" y="150" width="200" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="660" y="172" text-anchor="middle" font-size="11.5" fill="#b03a3a">770 % 769 = 1 → 冲突!</text>

  <!-- ===== Right side: key operations ===== -->
  <g filter="url(#sk)"><rect x="560" y="216" width="250" height="180" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="685" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">三操作都走同一条路</text>
  <g font-size="12">
    <g filter="url(#sk)"><rect x="580" y="252" width="210" height="30" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.1"/></g>
    <text x="685" y="272" text-anchor="middle" fill="#2e6e2e">① 定桶：h(key) = key % 769</text>
    <g filter="url(#sk)"><rect x="580" y="290" width="210" height="30" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.1"/></g>
    <text x="685" y="310" text-anchor="middle" fill="#2e6e2e">② 遍历该桶的链表</text>
    <g filter="url(#sk)"><rect x="580" y="328" width="210" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/></g>
    <text x="685" y="348" text-anchor="middle" fill="#7a5415">add 无则头插 / contains 查</text>
    <g filter="url(#sk)"><rect x="580" y="366" width="210" height="24" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/></g>
    <text x="685" y="382" text-anchor="middle" fill="#7a5415" font-size="11">remove 摘节点</text>
  </g>

  <!-- ===== Bottom: why 769 ===== -->
  <text x="430" y="430" text-anchor="middle" font-size="12" fill="#5a5a5a">桶数 769 = 素数 → 让 key % 769 分布更均匀，减少冲突</text>
  <text x="430" y="450" text-anchor="middle" font-size="11" fill="#888">10⁴ 个 key ÷ 769 桶 ≈ 每桶 13 个 → 链表短，查找快</text>

  <!-- ===== key range note ===== -->
  <g filter="url(#sk)"><rect x="60" y="470" width="740" height="48" rx="8" fill="#fafafa" stroke="#ccc" stroke-width="1.2"/></g>
  <text x="430" y="492" text-anchor="middle" font-size="12" fill="#444">
    <tspan font-weight="bold" fill="#b03a3a">暴力法对照：</tspan> 直接开 bool vis[10⁶+1]，add/contains/remove 全 O(1) 但空间 10⁶ 字节
  </text>
  <text x="430" y="510" text-anchor="middle" font-size="11" fill="#888">
    桶+链法空间 O(实际 key 数)，且 key 范围再大也不受影响 —— 这才是「真正的哈希」
  </text>
</svg>
