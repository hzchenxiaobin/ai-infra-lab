<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">差分数组：一次区间加 = 两处点修改 + 前缀和还原（0-indexed）</text>

  <!-- 原数组 a 行 a[0..4] -->
  <text x="30" y="80" font-size="12" fill="#888">原数组 a：</text>
  <rect x="110" y="62" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="82" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="160" y="62" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="185" y="82" text-anchor="middle" font-size="12" fill="#333">+s</text>
  <rect x="210" y="62" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="235" y="82" text-anchor="middle" font-size="12" fill="#333">+s</text>
  <rect x="260" y="62" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="285" y="82" text-anchor="middle" font-size="12" fill="#333">+s</text>
  <rect x="310" y="62" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="335" y="82" text-anchor="middle" font-size="12" fill="#333">0</text>

  <text x="135" y="106" text-anchor="middle" font-size="9" fill="#aaa">i=0</text>
  <text x="185" y="106" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">l=1</text>
  <text x="235" y="106" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="285" y="106" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">r=3</text>
  <text x="335" y="106" text-anchor="middle" font-size="9" fill="#aaa">4</text>

  <!-- bracket spanning a[1..3] -->
  <path d="M 165 112 Q 165 120 173 120 L 282 120 Q 290 120 290 112" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="227" y="116" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">区间 [l, r] 整体 +s</text>

  <!-- arrow to diff -->
  <path d="M 227 128 L 227 150" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="239" y="144" font-size="10" fill="#446688">差分</text>

  <!-- diff row: diff[0..5] -->
  <text x="30" y="178" font-size="12" fill="#888">差分 diff：</text>
  <rect x="110" y="160" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="180" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="160" y="160" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="185" y="180" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">+s</text>
  <rect x="210" y="160" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="235" y="180" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="260" y="160" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="285" y="180" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="310" y="160" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="335" y="180" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−s</text>
  <rect x="360" y="160" width="50" height="30" fill="#f5f5f5" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3" rx="4" filter="url(#rough2)"/>
  <text x="385" y="180" text-anchor="middle" font-size="11" fill="#bbb">越界哨兵</text>

  <text x="185" y="204" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">diff[l]+=s</text>
  <text x="335" y="204" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">diff[r+1]−=s</text>

  <!-- arrow to answer -->
  <path d="M 227 212 L 227 234" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="239" y="228" font-size="10" fill="#446688">前缀和</text>

  <!-- answer row: ans[0..4] -->
  <text x="30" y="262" font-size="12" fill="#888">前缀和 ans：</text>
  <rect x="110" y="244" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="264" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="160" y="244" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="185" y="264" text-anchor="middle" font-size="12" fill="#333">s</text>
  <rect x="210" y="244" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="235" y="264" text-anchor="middle" font-size="12" fill="#333">s</text>
  <rect x="260" y="244" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="285" y="264" text-anchor="middle" font-size="12" fill="#333">s</text>
  <rect x="310" y="244" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="335" y="264" text-anchor="middle" font-size="12" fill="#333">0</text>

  <text x="135" y="288" text-anchor="middle" font-size="9" fill="#aaa">i=0</text>
  <text x="185" y="288" text-anchor="middle" font-size="9" fill="#aaa">i=1</text>
  <text x="235" y="288" text-anchor="middle" font-size="9" fill="#aaa">i=2</text>
  <text x="285" y="288" text-anchor="middle" font-size="9" fill="#aaa">i=3</text>
  <text x="335" y="288" text-anchor="middle" font-size="9" fill="#aaa">i=4</text>

  <!-- equation box -->
  <rect x="40" y="306" width="480" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="330" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">区间加 a[l..r] += s  ⇔  diff[l] += s ,  diff[r+1] −= s</text>
  <text x="280" y="354" text-anchor="middle" font-size="13" fill="#333">最后 ans[i] = ans[i−1] + diff[i] 一次前缀和还原（ans[0]=diff[0]）</text>
  <text x="280" y="374" text-anchor="middle" font-size="12" fill="#b85450">k 次区间加 → 2k 次点修改 O(1)，再 O(n) 还原</text>
</svg>
