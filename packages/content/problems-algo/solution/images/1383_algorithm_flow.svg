<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrF" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：排序 → 逐个入堆 → 维护 top-k → 更新答案</text>

  <!-- Step 1: Sort -->
  <rect x="150" y="48" width="220" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="71" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">① 按效率降序排序工程师</text>

  <path d="M 260 88 L 260 104" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Step 2: Init -->
  <rect x="150" y="108" width="220" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="131" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">② 初始化：小顶堆空, sum=0, ans=0</text>

  <path d="M 260 148 L 260 164" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Step 3: Loop -->
  <rect x="130" y="168" width="260" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="191" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">③ 遍历每个工程师 (e, s)</text>

  <path d="M 260 208 L 260 224" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Push speed -->
  <rect x="160" y="228" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="249" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">heap.push(s), sum += s</text>

  <path d="M 260 264 L 260 280" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Diamond: heap.size > k? -->
  <polygon points="260,284 350,324 260,364 170,324" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="320" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">heap.size</text>
  <text x="260" y="336" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">&gt; k ?</text>

  <!-- Yes branch: pop min -->
  <path d="M 350 324 L 410 324" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="360" y="318" font-size="10.5" fill="#b85450" font-weight="bold">是</text>
  <rect x="410" y="306" width="96" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="458" y="322" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">sum -= heap.top()</text>
  <text x="458" y="336" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">heap.pop()</text>

  <!-- No branch -->
  <path d="M 170 324 L 110 324" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="120" y="318" font-size="10.5" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="20" y="306" width="90" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="65" y="329" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">直接继续</text>

  <!-- converge to update ans -->
  <path d="M 65 342 L 65 388 L 160 388" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <path d="M 458 342 L 458 388 L 360 388" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Update ans -->
  <rect x="150" y="374" width="220" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="395" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans = max(ans, sum × e)</text>

  <!-- loop back to step 3 -->
  <path d="M 370 390 L 500 390 L 500 186 L 390 186" stroke="#d6a040" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="430" y="180" font-size="10" fill="#d6a040">下一个工程师</text>

  <!-- Return -->
  <path d="M 260 406 L 260 422" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <rect x="130" y="426" width="260" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="446" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">④ 返回 ans % (10^9 + 7)</text>
</svg>
