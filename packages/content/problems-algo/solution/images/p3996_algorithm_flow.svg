<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：奇偶判定，一行收工</text>

  <!-- main flow -->
  <ellipse cx="160" cy="62" rx="78" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="160" y="67" text-anchor="middle" font-size="12" fill="#33506e" font-weight="bold" filter="url(#rough2)">读入 start / target</text>

  <path d="M160,82 L160,100" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="75" y="104" width="170" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="125" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">p₁ = (sx + sy) mod 2</text>

  <path d="M160,136 L160,154" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="75" y="158" width="170" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="179" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">p₂ = (tx + ty) mod 2</text>

  <path d="M160,190 L160,208" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="160,212 235,250 160,288 85,250" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="160" y="255" text-anchor="middle" font-size="12.5" fill="#8f3a35" font-weight="bold" filter="url(#rough2)">p₁ == p₂ ?</text>

  <!-- yes / no branches -->
  <path d="M85,250 C85,278 100,285 100,306" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="76" y="274" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <path d="M235,250 C300,285 380,290 403,304" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="268" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="25" y="310" width="155" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="102" y="328" text-anchor="middle" font-size="12" fill="#2f5527" font-weight="bold" filter="url(#rough2)">true：偶数步可达</text>
  <text x="102" y="344" text-anchor="middle" font-size="9.5" fill="#3a5c30" filter="url(#rough2)">（0 步也算偶数）</text>

  <rect x="330" y="310" width="170" height="42" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="415" y="328" text-anchor="middle" font-size="12" fill="#8f3a35" font-weight="bold" filter="url(#rough2)">false：只能奇数步</text>
  <text x="415" y="344" text-anchor="middle" font-size="9.5" fill="#8f3a35" filter="url(#rough2)">（怎么绕都差一步）</text>

  <!-- why it works -->
  <rect x="285" y="58" width="225" height="156" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.4" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="397" y="82" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">为什么这一行就够了？</text>
  <text x="298" y="106" font-size="10" fill="#555" filter="url(#rough2)">① 每步翻转颜色：走 k 步 = 换色 k 次</text>
  <text x="298" y="128" font-size="10" fill="#555" filter="url(#rough2)">② 奇数步到不了同色格（必要性）</text>
  <text x="298" y="150" font-size="10" fill="#555" filter="url(#rough2)">③ 8×8 骑士图连通 + 二部图：</text>
  <text x="312" y="168" font-size="10" fill="#555" filter="url(#rough2)">任意路径长度奇偶唯一（充分性）</text>
  <text x="298" y="194" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⇒ 同色 ⟺ 偶数步可达</text>
</svg>
