<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="20" text-anchor="middle" font-size="13.5" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：startPos=1, endPos=2, k=3</text>

  <!-- Params line -->
  <rect x="60" y="32" width="400" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="50" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">Δ=1, d=1, r=(3+1)/2=2, l=1 ⟹ C(3,2)=3</text>

  <!-- Header row -->
  <rect x="40" y="70" width="56" height="22" fill="#446688" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="68" y="86" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold" filter="url(#rough2)">方案</text>
  <rect x="96" y="70" width="80" height="22" fill="#446688" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="136" y="86" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold" filter="url(#rough2)">选哪2步→</text>
  <rect x="176" y="70" width="300" height="22" fill="#446688" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="326" y="86" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold" filter="url(#rough2)">轨迹 (位置序列)</text>

  <!-- Row 1: RRL -->
  <rect x="40" y="94" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="68" y="112" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">①</text>
  <rect x="96" y="94" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="136" y="112" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">步 1,2</text>
  <rect x="176" y="94" width="300" height="26" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="326" y="112" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1→2→3→2  (→→←)</text>

  <!-- Row 2: RLR -->
  <rect x="40" y="122" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="68" y="140" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">②</text>
  <rect x="96" y="122" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="136" y="140" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">步 1,3</text>
  <rect x="176" y="122" width="300" height="26" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="326" y="140" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1→2→1→2  (→←→)</text>

  <!-- Row 3: LRR -->
  <rect x="40" y="150" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="68" y="168" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③</text>
  <rect x="96" y="150" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="136" y="168" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">步 2,3</text>
  <rect x="176" y="150" width="300" height="26" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="326" y="168" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1→0→1→2  (←→→)</text>

  <!-- Result -->
  <rect x="40" y="182" width="436" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="258" y="200" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">3 步中选 2 步向右 = C(3,2) = 3 ✓</text>

  <!-- Number line mini viz for method ① -->
  <text x="40" y="230" font-size="10" fill="#888" filter="url(#rough2)">方案① 轨迹：</text>
  <line x1="110" y1="244" x2="470" y2="244" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="170" cy="244" r="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="238" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">1</text>
  <circle cx="230" cy="244" r="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230" y="238" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">2</text>
  <circle cx="290" cy="244" r="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="290" y="238" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">3</text>
  <circle cx="350" cy="244" r="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350" y="238" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">2</text>

  <path d="M 174 240 Q 200 222 226 240" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="220" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">→</text>
  <path d="M 234 240 Q 260 222 286 240" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="260" y="220" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">→</text>
  <path d="M 294 248 Q 320 266 346 248" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="264" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">←</text>

  <!-- Key insight box -->
  <rect x="60" y="284" width="400" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="302" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">每条轨迹 = 2 个→ 与 1 个← 的一个排列</text>
  <text x="260" y="318" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">排列数 = C(3,2)：只关心哪 2 个位置放→</text>

  <text x="260" y="346" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">与示例 1 输出 3 完全吻合</text>
</svg>
