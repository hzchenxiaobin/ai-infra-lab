<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：单数组倒序递推</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">外层 i 推进行号，内层 j 从 i 倒序到 1 原地刷新</text>

  <!-- 1. 初始化 -->
  <rect x="180" y="62" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="80" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">初始化</text>
  <text x="270" y="96" text-anchor="middle" font-size="10" fill="#555">row = [1, 0, 0, …, 0]  (长度 k+1)</text>

  <path d="M 270 102 L 270 122" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. 外层循环 i -->
  <polygon points="270,124 360,154 270,184 180,154" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="150" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">i = 1 … k</text>
  <text x="270" y="166" text-anchor="middle" font-size="10" fill="#888">逐行推进</text>

  <path d="M 270 184 L 270 204" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. 内层循环 j -->
  <polygon points="270,206 380,238 270,270 160,238" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="234" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">j = i ↓ 1</text>
  <text x="270" y="252" text-anchor="middle" font-size="10" fill="#888">从右往左倒序</text>

  <path d="M 270 270 L 270 290" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4. 核心赋值 -->
  <rect x="150" y="292" width="240" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="270" y="312" text-anchor="middle" font-family="monospace" font-size="13" fill="#b85450" font-weight="bold">row[j] = row[j] + row[j-1]</text>
  <text x="270" y="328" text-anchor="middle" font-size="9" fill="#888">肩上两数相加，原地写入</text>

  <!-- j 回环 -->
  <path d="M 390 238 Q 430 238 430 314 Q 430 360 320 360 L 280 360 Q 270 360 270 348" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="5 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="436" y="300" font-size="9" fill="#4a7a3a">j--</text>

  <!-- i 回环 -->
  <path d="M 180 154 Q 110 154 110 100 Q 110 70 180 76" stroke="#d6a040" stroke-width="1.4" fill="none" stroke-dasharray="5 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="84" y="120" font-size="9" fill="#d6a040">i++</text>

  <path d="M 160 238 Q 60 238 60 154 Q 60 80 180 80" stroke="none"/>

  <!-- 5. 返回 -->
  <path d="M 270 336 L 270 372" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="180" y="374" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="392" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">返回 row</text>
  <text x="270" y="408" text-anchor="middle" font-size="10" fill="#555">即第 k 行：[C(k,0), …, C(k,k)]</text>

  <!-- 左侧注释 -->
  <rect x="20" y="206" width="120" height="58" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="80" y="226" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">为何倒序？</text>
  <text x="80" y="242" text-anchor="middle" font-size="9" fill="#888">保证 row[j-1]</text>
  <text x="80" y="256" text-anchor="middle" font-size="9" fill="#888">尚未被覆盖</text>
  <path d="M 140 235 L 160 238" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
