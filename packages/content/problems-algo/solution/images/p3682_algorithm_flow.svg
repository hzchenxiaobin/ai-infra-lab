<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 492"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="492" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：建表一遍 + 查表一遍</text>

  <!-- 开始 -->
  <rect x="230" y="42" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="13" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">开始</text>

  <path d="M 280 68 L 280 84" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 建表 -->
  <rect x="130" y="88" width="300" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="110" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">① 扫 nums1 建表 pos1：值 → 首次下标（不覆盖首现）</text>

  <path d="M 280 122 L 280 138" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="195" y="142" width="170" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="162" text-anchor="middle" font-size="12" fill="#b3541e" filter="url(#rough2)">② ans ← +∞（哨兵）</text>

  <path d="M 280 172 L 280 190" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环容器 -->
  <rect x="100" y="192" width="440" height="130" fill="none" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="6,4" rx="10" filter="url(#rough2)"/>
  <text x="320" y="210" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">对每个 j = 0 … m−1（扫描 nums2）</text>

  <!-- 菱形：命中判定 -->
  <polygon points="280,222 360,252 280,282 200,252" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="247" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">nums2[j]</text>
  <text x="280" y="264" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">∈ pos1 ?</text>

  <!-- 是 → 更新 -->
  <text x="368" y="242" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 360 252 L 386 252" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="390" y="228" width="132" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="456" y="248" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">s = pos1[v] + j</text>
  <text x="456" y="268" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">ans = min(ans, s)</text>

  <!-- 否 → 直落汇合线 -->
  <text x="290" y="298" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 280 282 L 280 300" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 回环：下一个 j -->
  <path d="M 456 276 L 456 300 L 140 300 L 140 252 L 194 252" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="310" y="314" font-size="10" fill="#d6a040" filter="url(#rough2)">→ 下一个 j</text>

  <!-- 扫完出循环 -->
  <path d="M 280 322 L 280 336" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="334" font-size="9" fill="#999" filter="url(#rough2)">扫完</text>

  <!-- 终判菱形 -->
  <polygon points="280,340 352,372 280,404 208,372" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="377" text-anchor="middle" font-size="12" fill="#b3541e" font-weight="bold" filter="url(#rough2)">ans = +∞ ?</text>

  <!-- 是 → 返回 -1 -->
  <text x="360" y="364" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 352 372 L 378 372" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="382" y="356" width="104" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="434" y="377" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 −1</text>

  <!-- 否 → 返回 ans -->
  <text x="290" y="422" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 280 404 L 280 424" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="222" y="428" width="116" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="449" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <!-- 复杂度旁注 -->
  <rect x="30" y="428" width="160" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="110" y="448" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">时间 O(n + m)</text>
  <text x="110" y="468" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">空间 O(min(n,m))</text>
</svg>
