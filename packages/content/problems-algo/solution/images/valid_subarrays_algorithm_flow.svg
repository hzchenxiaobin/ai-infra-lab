<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">单调递增栈算法流程</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">栈存下标（值递增），遇到更小值时弹栈结算 count</text>

  <!-- ===== Step 1: Initialize ===== -->
  <rect x="30" y="60" width="480" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="50" y="78" font-size="11" fill="#446688" font-weight="bold">① 初始化</text>
  <text x="50" y="94" font-size="10" fill="#555">空栈 stack = []，答案 ans = 0</text>

  <!-- arrow -->
  <path d="M 270 104 L 270 116" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: Iterate ===== -->
  <rect x="30" y="120" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="50" y="138" font-size="11" fill="#d6a040" font-weight="bold">② 遍历 i = 0 → n−1</text>
  <text x="50" y="154" font-size="10" fill="#555">while 栈非空 且 nums[i] &lt; nums[stack.top()]：</text>
  <text x="50" y="170" font-size="10" fill="#b85450" font-weight="bold">  top = stack.pop()；ans += i − top  （i 是 top 的下一个更小）</text>

  <!-- arrow -->
  <path d="M 270 180 L 270 192" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: Push ===== -->
  <rect x="30" y="196" width="480" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="50" y="214" font-size="11" fill="#446688" font-weight="bold">③ 入栈</text>
  <text x="50" y="230" font-size="10" fill="#555">stack.push(i)（i 尚未找到下一个更小，等待后续结算）</text>

  <!-- arrow back to step 2 -->
  <path d="M 30 216 Q 12 160 12 148 L 12 140" stroke="#666" stroke-width="1" fill="none" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="14" y="180" font-size="8" fill="#888" transform="rotate(-90 14 180)">循环</text>

  <!-- ===== Step 4: Remaining ===== -->
  <rect x="30" y="248" width="480" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="50" y="266" font-size="11" fill="#b85450" font-weight="bold">④ 遍历结束：结算栈中剩余元素</text>
  <text x="50" y="282" font-size="10" fill="#555">while 栈非空：</text>
  <text x="50" y="298" font-size="10" fill="#b85450" font-weight="bold">  top = stack.pop()；ans += n − top  （右侧无更小，一直延伸到末尾）</text>

  <!-- arrow -->
  <path d="M 270 308 L 270 320" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 5: Return ===== -->
  <rect x="30" y="324" width="480" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="342" font-size="11" fill="#4a7a3a" font-weight="bold">⑤ 返回 ans</text>
  <text x="180" y="342" font-size="10" fill="#555">每个元素入栈 1 次 + 出栈 1 次 → O(n)</text>

  <!-- ===== Key insight box ===== -->
  <rect x="30" y="370" width="480" height="40" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="6" filter="url(#rough2)"/>
  <text x="50" y="388" font-size="10" fill="#888">关键：找「下一个更小」用递增栈（栈中值从小到大排）</text>
  <text x="50" y="402" font-size="10" fill="#888">对照：找「下一个更大」用递减栈（739 每日温度）—— 方向相反，模板相同</text>
</svg>
