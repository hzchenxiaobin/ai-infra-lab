<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrGy" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">Dijkstra + 最短路计数 算法流程</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">堆只负责按距离顺序触发处理；dist/ways 数组才是真相来源</text>

  <!-- Start -->
  <rect x="210" y="58" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="280" y="80" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">初始化 dist/ways，堆压 (0,0)</text>
  <path d="M 280 92 L 280 108" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrGy)" filter="url(#rough2)"/>

  <!-- Pop -->
  <rect x="200" y="110" width="160" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="132" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">弹出堆顶 (d, u)</text>
  <path d="M 280 144 L 280 158" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrGy)" filter="url(#rough2)"/>

  <!-- Stale check -->
  <polygon points="280,160 380,196 280,232 180,196" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="194" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">d &gt; dist[u] ?</text>
  <text x="280" y="208" text-anchor="middle" font-size="9" fill="#888">(懒删除)</text>
  <!-- Yes: skip -->
  <path d="M 380 196 L 440 196" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="396" y="190" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="442" y="180" width="96" height="32" fill="#f5f5f5" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="490" y="200" text-anchor="middle" font-size="10" fill="#888">跳过 continue</text>
  <!-- No: down -->
  <path d="M 280 232 L 280 248" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrGy)" filter="url(#rough2)"/>
  <text x="290" y="244" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- For each edge -->
  <rect x="180" y="250" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="272" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">遍历 u 的每条出边 (u,v,w)</text>
  <path d="M 280 284 L 280 298" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrGy)" filter="url(#rough2)"/>

  <!-- Compare decision -->
  <polygon points="280,300 440,348 280,396 120,348" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="344" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">nd = d + w</text>
  <text x="280" y="358" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">比较 nd 与 dist[v]</text>

  <!-- Left branch: nd < dist[v] -->
  <path d="M 120 348 L 60 348 L 60 376" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="40" y="344" font-size="10" fill="#4a7a3a" font-weight="bold">&lt;</text>
  <rect x="16" y="378" width="120" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="76" y="396" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">发现更短路径</text>
  <text x="76" y="410" text-anchor="middle" font-size="9" fill="#555">dist[v]=nd</text>
  <text x="76" y="422" text-anchor="middle" font-size="9" fill="#555">ways[v]=ways[u]</text>
  <text x="76" y="434" text-anchor="middle" font-size="9" fill="#4a7a3a">压入堆 (nd,v)</text>

  <!-- Right branch: nd == dist[v] -->
  <path d="M 440 348 L 500 348 L 500 376" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="480" y="344" font-size="10" fill="#d6a040" font-weight="bold">==</text>
  <rect x="440" y="378" width="116" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="498" y="396" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">发现等长路径</text>
  <text x="498" y="410" text-anchor="middle" font-size="9" fill="#555">ways[v] += ways[u]</text>
  <text x="498" y="422" text-anchor="middle" font-size="9" fill="#555">(mod 1e9+7)</text>
  <text x="498" y="434" text-anchor="middle" font-size="9" fill="#d6a040">不入堆</text>

  <!-- middle: nd > dist[v] skip -->
  <path d="M 280 396 L 280 414" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrGy)" filter="url(#rough2)"/>
  <text x="290" y="408" font-size="9" fill="#888">&gt; 跳过</text>
  <rect x="232" y="416" width="96" height="28" fill="#f5f5f5" stroke="#888" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="434" text-anchor="middle" font-size="9" fill="#888">此边不优，忽略</text>

  <!-- Loop back arrow: from branches back up to pop -->
  <path d="M 76 434 Q 76 120 200 124" stroke="#666" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrGy)" filter="url(#rough2)"/>
  <text x="84" y="300" font-size="9" fill="#888">继续取堆顶</text>
</svg>
