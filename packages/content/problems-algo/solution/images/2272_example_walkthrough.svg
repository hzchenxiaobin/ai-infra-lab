<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 490"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="490" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：s="aababbb"，对 (X='b', Y='a')：b→+1 / a→−1</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">逐位滚动 f（无约束）与 g（含≥1 个 'a'），ans 取 g 的最大值</text>

  <!-- ===== Table ===== -->
  <!-- column header -->
  <rect x="30" y="58" width="500" height="30" fill="#446688" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="60" y="78" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">i</text>
  <text x="120" y="78" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">s[i]</text>
  <text x="185" y="78" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">val</text>
  <text x="245" y="78" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">f</text>
  <text x="310" y="78" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">g (含'a')</text>
  <text x="375" y="78" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">ans</text>
  <text x="470" y="78" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">最优含'a'子串</text>

  <!-- highlight g column background -->
  <rect x="278" y="88" width="64" height="238" fill="#fce4ec" opacity="0.35" filter="url(#rough2)"/>

  <!-- row 0: i=0, a, -1, f=-1, g=-1, ans=0 -->
  <rect x="30" y="88" width="500" height="34" fill="#ffffff" stroke="#cccccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="60" y="109" text-anchor="middle" font-size="11" fill="#666">0</text>
  <text x="120" y="109" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">a (−1)</text>
  <text x="185" y="109" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">−1</text>
  <text x="245" y="109" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">−1</text>
  <text x="310" y="109" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−1</text>
  <text x="375" y="109" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="410" y="109" font-size="10" fill="#666">单取 "a"（和 −1）</text>

  <!-- row 1: i=1, a, -1, f=-1, g=-1, ans=0 -->
  <rect x="30" y="122" width="500" height="34" fill="#f7f7f7" stroke="#cccccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="60" y="143" text-anchor="middle" font-size="11" fill="#666">1</text>
  <text x="120" y="143" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">a (−1)</text>
  <text x="185" y="143" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">−1</text>
  <text x="245" y="143" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">−1</text>
  <text x="310" y="143" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−1</text>
  <text x="375" y="143" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="410" y="143" font-size="10" fill="#666">单取 "a"（和 −1）</text>

  <!-- row 2: i=2, b, +1, f=1, g=0, ans=0 -->
  <rect x="30" y="156" width="500" height="34" fill="#ffffff" stroke="#cccccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="60" y="177" text-anchor="middle" font-size="11" fill="#666">2</text>
  <text x="120" y="177" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">b (+1)</text>
  <text x="185" y="177" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+1</text>
  <text x="245" y="177" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="310" y="177" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <text x="375" y="177" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="410" y="177" font-size="10" fill="#666">延伸含'a'前段 → "ab"（和 0）</text>

  <!-- row 3: i=3, a, -1, f=0, g=0, ans=0  (PROMOTION) -->
  <rect x="30" y="190" width="500" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="60" y="211" text-anchor="middle" font-size="11" fill="#666">3</text>
  <text x="120" y="211" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">a (−1)</text>
  <text x="185" y="211" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">−1</text>
  <text x="245" y="211" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <text x="310" y="211" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <text x="375" y="211" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="410" y="211" font-size="10" fill="#d6a040" font-weight="bold">提升 f："b"→"ba"（和 0）</text>

  <!-- row 4: i=4, b, +1, f=1, g=1, ans=1 -->
  <rect x="30" y="224" width="500" height="34" fill="#ffffff" stroke="#cccccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="60" y="245" text-anchor="middle" font-size="11" fill="#666">4</text>
  <text x="120" y="245" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">b (+1)</text>
  <text x="185" y="245" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+1</text>
  <text x="245" y="245" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="310" y="245" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="375" y="245" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="410" y="245" font-size="10" fill="#666">"bab"（和 1）</text>

  <!-- row 5: i=5, b, +1, f=2, g=2, ans=2 -->
  <rect x="30" y="258" width="500" height="34" fill="#f7f7f7" stroke="#cccccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="60" y="279" text-anchor="middle" font-size="11" fill="#666">5</text>
  <text x="120" y="279" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">b (+1)</text>
  <text x="185" y="279" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+1</text>
  <text x="245" y="279" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="310" y="279" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="375" y="279" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="410" y="279" font-size="10" fill="#666">"babb"（和 2）</text>

  <!-- row 6: i=6, b, +1, f=3, g=3, ans=3  (ANSWER) -->
  <rect x="30" y="292" width="500" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="313" text-anchor="middle" font-size="11" fill="#666">6</text>
  <text x="120" y="313" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">b (+1)</text>
  <text x="185" y="313" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+1</text>
  <text x="245" y="313" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="310" y="313" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <text x="375" y="313" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <text x="410" y="313" font-size="10" fill="#b85450" font-weight="bold">"babbb"（和 3）← 答案</text>

  <!-- ===== key transition callouts ===== -->
  <rect x="30" y="342" width="500" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="362" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">关键两步：i=2 遇 'b'(+1)：g 从 "a"(−1) 延伸为 "ab"(0)，开始追上 f</text>
  <text x="280" y="378" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">i=3 遇 'a'(−1)：g=max(0−1, 1−1, −1)=0，取 f−1=0 把无约束 "b" 提升为 "ba"</text>

  <!-- ===== answer box ===== -->
  <rect x="80" y="398" width="400" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="418" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">答案 = 3  （子串 "babbb"：count(b)=4, count(a)=1）</text>
  <text x="280" y="437" text-anchor="middle" font-size="10.5" fill="#4a7a3a">波动 = 4 − 1 = 3 ✓   枚举其余 25²−1 对均 ≤ 3，故全局最大为 3</text>

  <text x="280" y="472" text-anchor="middle" font-size="9.5" fill="#888">哨兵 g 初值 NEG=−10⁵：i=0 处被 max(·,−1) 覆盖为 −1，之后全程为真实值</text>
</svg>
