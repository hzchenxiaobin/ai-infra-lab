<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    示例演算：arr = [12,33,4,56,22,2,34,33,22,12,34,56]
  </text>

  <!-- 构造后的 pos 表（关键条目） -->
  <rect x="30" y="44" width="500" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="44" y="64" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">构造后 pos：</text>
  <g filter="url(#rough2)" font-size="11" fill="#333">
    <text x="44" y="86">33→[1,7]</text>
    <text x="150" y="86">4→[2]</text>
    <text x="220" y="86">22→[4,8]</text>
    <text x="300" y="86">34→[6,10]</text>
    <text x="392" y="86">56→[3,11]</text>
    <text x="462" y="86">12→[0,9]</text>
  </g>
  <text x="44" y="100" font-size="10" fill="#666" filter="url(#rough2)">每个列表天然升序（按下标递增收集）</text>

  <!-- 查询 1 -->
  <rect x="30" y="120" width="500" height="118" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="44" y="140" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">query(1, 2, 4)：在 arr[1..2] = [33, 4] 中数 4</text>

  <g filter="url(#rough2)" font-size="11" fill="#333">
    <text x="44" y="162">① 取 idx = pos[4] = [2]</text>
    <text x="44" y="180">② lower_bound(idx, left=1)：首个 ≥ 1 → 指向元素 2（位置 0）</text>
    <text x="44" y="198">③ upper_bound(idx, right=2)：首个 &gt; 2 → 越界（位置 1）</text>
    <text x="44" y="216">④ count = 1 − 0 = 1</text>
  </g>
  <text x="475" y="216" text-anchor="end" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">✅ 1</text>

  <!-- 查询 2 -->
  <rect x="30" y="250" width="500" height="118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="44" y="270" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">query(0, 11, 33)：全数组中数 33</text>

  <g filter="url(#rough2)" font-size="11" fill="#333">
    <text x="44" y="292">① 取 idx = pos[33] = [1, 7]</text>
    <text x="44" y="310">② lower_bound(idx, left=0)：首个 ≥ 0 → 指向元素 1（位置 0）</text>
    <text x="44" y="328">③ upper_bound(idx, right=11)：首个 &gt; 11 → 越界（位置 2）</text>
    <text x="44" y="346">④ count = 2 − 0 = 2（下标 1、7 均落在 [0,11] 内）</text>
  </g>
  <text x="475" y="346" text-anchor="end" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">✅ 2</text>
</svg>
