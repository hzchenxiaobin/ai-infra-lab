<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：13 行订单 → 过滤 2 月 → 分组求和 → 筛 ≥100 → 取名输出</text>

  <!-- ============ Step 1: All Orders ============ -->
  <rect x="20" y="38" width="520" height="142" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="35" y="55" font-size="10.5" fill="#446688" font-weight="bold">① Orders 全表（13 行）</text>
  <!-- column headers -->
  <text x="35" y="72" font-size="9" fill="#333" font-weight="bold">pid</text>
  <text x="80" y="72" font-size="9" fill="#d6a040" font-weight="bold">order_date</text>
  <text x="170" y="72" font-size="9" fill="#b85450" font-weight="bold">unit</text>
  <text x="220" y="72" font-size="9" fill="#999">|</text>
  <text x="240" y="72" font-size="9" fill="#4a7a3a" font-weight="bold">pid</text>
  <text x="285" y="72" font-size="9" fill="#d6a040" font-weight="bold">order_date</text>
  <text x="375" y="72" font-size="9" fill="#b85450" font-weight="bold">unit</text>
  <text x="430" y="72" font-size="9" fill="#999">|</text>
  <text x="450" y="72" font-size="9" fill="#4a7a3a" font-weight="bold">pid</text>
  <text x="490" y="72" font-size="9" fill="#d6a040" font-weight="bold">date</text>
  <text x="525" y="72" font-size="9" fill="#b85450" font-weight="bold">u</text>

  <!-- Left column rows (pid 1-5, first occurrences) -->
  <text x="35" y="88" font-size="9" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="80" y="88" font-size="9" fill="#d6a040" font-weight="bold">2020-02-05</text>
  <text x="170" y="88" font-size="9" fill="#b85450" font-weight="bold">60</text>
  <text x="240" y="88" font-size="9" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="285" y="88" font-size="9" fill="#999">2020-02-10</text>
  <text x="375" y="88" font-size="9" fill="#999">70</text>
  <text x="450" y="88" font-size="9" fill="#777">2</text>
  <text x="490" y="88" font-size="9" fill="#777">01-18</text>
  <text x="525" y="88" font-size="9" fill="#777">30</text>

  <text x="35" y="102" font-size="9" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="80" y="102" font-size="9" fill="#d6a040" font-weight="bold">2020-02-11</text>
  <text x="170" y="102" font-size="9" fill="#b85450" font-weight="bold">80</text>
  <text x="240" y="102" font-size="9" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="285" y="102" font-size="9" fill="#d6a040" font-weight="bold">2020-02-17</text>
  <text x="375" y="102" font-size="9" fill="#b85450" font-weight="bold">2</text>
  <text x="450" y="102" font-size="9" fill="#777">3</text>
  <text x="490" y="102" font-size="9" fill="#777">02-24</text>
  <text x="525" y="102" font-size="9" fill="#777">3</text>

  <text x="35" y="116" font-size="9" fill="#777">4</text>
  <text x="80" y="116" font-size="9" fill="#777">2020-03-01</text>
  <text x="170" y="116" font-size="9" fill="#777">20</text>
  <text x="240" y="116" font-size="9" fill="#777">4</text>
  <text x="285" y="116" font-size="9" fill="#777">2020-03-04</text>
  <text x="375" y="116" font-size="9" fill="#777">30</text>
  <text x="450" y="116" font-size="9" fill="#777">4</text>
  <text x="490" y="116" font-size="9" fill="#777">03-04</text>
  <text x="525" y="116" font-size="9" fill="#777">60</text>

  <text x="35" y="130" font-size="9" fill="#4a7a3a" font-weight="bold">5</text>
  <text x="80" y="130" font-size="9" fill="#d6a040" font-weight="bold">2020-02-25</text>
  <text x="170" y="130" font-size="9" fill="#b85450" font-weight="bold">50</text>
  <text x="240" y="130" font-size="9" fill="#4a7a3a" font-weight="bold">5</text>
  <text x="285" y="130" font-size="9" fill="#d6a040" font-weight="bold">2020-02-27</text>
  <text x="375" y="130" font-size="9" fill="#b85450" font-weight="bold">50</text>
  <text x="450" y="130" font-size="9" fill="#777">5</text>
  <text x="490" y="130" font-size="9" fill="#777">03-01</text>
  <text x="525" y="130" font-size="9" fill="#777">50</text>

  <text x="35" y="148" font-size="9" fill="#333">绿色=2月行（保留），灰色=1月/3月行（WHERE 丢弃）</text>
  <text x="35" y="166" font-size="9" fill="#d6a040" font-weight="bold">→ 2 月共 8 行：pid=1×2, pid=2×1, pid=3×2, pid=5×2</text>

  <!-- arrow -->
  <path d="M280 182 L280 196" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- ============ Step 2: GROUP BY + SUM ============ -->
  <rect x="60" y="200" width="440" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <rect x="60" y="200" width="440" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="215" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">② GROUP BY product_id → SUM(unit)</text>

  <text x="100" y="238" font-size="9.5" fill="#333" font-weight="bold">product_id</text>
  <text x="200" y="238" font-size="9.5" fill="#333" font-weight="bold">计算</text>
  <text x="350" y="238" font-size="9.5" fill="#b85450" font-weight="bold">SUM(unit)</text>

  <text x="100" y="256" font-size="9.5" fill="#333">1</text>
  <text x="200" y="256" font-size="9.5" fill="#333">60 + 70</text>
  <text x="350" y="256" font-size="9.5" fill="#b85450" font-weight="bold">130 ✓</text>

  <text x="100" y="270" font-size="9.5" fill="#333">2</text>
  <text x="200" y="270" font-size="9.5" fill="#333">80</text>
  <text x="350" y="270" font-size="9.5" fill="#777">80 ✗</text>

  <text x="100" y="284" font-size="9.5" fill="#333">3</text>
  <text x="200" y="284" font-size="9.5" fill="#333">2 + 3</text>
  <text x="350" y="284" font-size="9.5" fill="#777">5 ✗</text>

  <text x="100" y="298" font-size="9.5" fill="#333">5</text>
  <text x="200" y="298" font-size="9.5" fill="#333">50 + 50</text>
  <text x="350" y="298" font-size="9.5" fill="#b85450" font-weight="bold">100 ✓</text>

  <!-- arrow -->
  <path d="M280 294 L280 308" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- ============ Step 3: HAVING >= 100 ============ -->
  <rect x="60" y="312" width="440" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <rect x="60" y="312" width="440" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="327" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">③ HAVING SUM(unit) >= 100 → 只留 pid=1(130) 和 pid=5(100)</text>
  <text x="78" y="350" font-size="10" fill="#333">pid=2(80) 和 pid=3(5) 被丢弃，仅保留 2 行</text>

  <!-- arrow -->
  <path d="M280 362 L280 376" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- ============ Step 4: JOIN + Output ============ -->
  <rect x="60" y="380" width="440" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <rect x="60" y="380" width="440" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="395" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">④ JOIN Products 取 product_name → 输出</text>
  <text x="100" y="418" font-size="9.5" fill="#333" font-weight="bold">product_name</text>
  <text x="300" y="418" font-size="9.5" fill="#b85450" font-weight="bold">unit</text>
  <text x="100" y="434" font-size="9.5" fill="#4a7a3a" font-weight="bold">Leetcode Solutions</text>
  <text x="300" y="434" font-size="9.5" fill="#b85450" font-weight="bold">130</text>
  <text x="100" y="448" font-size="9.5" fill="#4a7a3a" font-weight="bold">Leetcode Kit</text>
  <text x="300" y="448" font-size="9.5" fill="#b85450" font-weight="bold">100</text>

  <!-- bottom note -->
  <rect x="20" y="452" width="520" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="35" y="470" font-size="9" fill="#333">关键：先 WHERE 过滤掉非 2 月行 → 再 GROUP BY 聚合 → 最后 HAVING 筛 ≥100。</text>
  <text x="35" y="484" font-size="9" fill="#333">若 WHERE 和 HAVING 颠倒（先聚合全部再筛 2 月），语义错误且效率更差。</text>
</svg>
