<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 逐天演算：values = [[8,5,2],[6,4,1],[9,7,3]]</text>

  <!-- 表头 -->
  <rect x="24" y="36" width="472" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="52" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">天 d</text>
  <text x="160" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">堆候选（各店行尾）</text>
  <text x="278" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">买入</text>
  <text x="356" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">开销 v×d</text>
  <text x="452" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">ans 累计</text>

  <!-- 行背景（交替） -->
  <rect x="24" y="88" width="472" height="27" fill="#f0f4fa" rx="3" filter="url(#rough2)"/>
  <rect x="24" y="142" width="472" height="27" fill="#f0f4fa" rx="3" filter="url(#rough2)"/>
  <rect x="24" y="196" width="472" height="27" fill="#f0f4fa" rx="3" filter="url(#rough2)"/>
  <rect x="24" y="250" width="472" height="27" fill="#f0f4fa" rx="3" filter="url(#rough2)"/>

  <!-- 第 1 行 -->
  <text x="52" y="79" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="160" y="79" text-anchor="middle" font-size="11" fill="#333">{2, 1, 3}</text>
  <text x="278" y="79" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1（店1）</text>
  <text x="356" y="79" text-anchor="middle" font-size="11" fill="#333">1×1 = 1</text>
  <text x="452" y="79" text-anchor="middle" font-size="11" fill="#333">1</text>

  <!-- 第 2 行 -->
  <text x="52" y="106" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="160" y="106" text-anchor="middle" font-size="11" fill="#333">{2, 4, 3}</text>
  <text x="278" y="106" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2（店0）</text>
  <text x="356" y="106" text-anchor="middle" font-size="11" fill="#333">2×2 = 4</text>
  <text x="452" y="106" text-anchor="middle" font-size="11" fill="#333">5</text>

  <!-- 第 3 行 -->
  <text x="52" y="133" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="160" y="133" text-anchor="middle" font-size="11" fill="#333">{5, 4, 3}</text>
  <text x="278" y="133" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3（店2）</text>
  <text x="356" y="133" text-anchor="middle" font-size="11" fill="#333">3×3 = 9</text>
  <text x="452" y="133" text-anchor="middle" font-size="11" fill="#333">14</text>

  <!-- 第 4 行 -->
  <text x="52" y="160" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="160" y="160" text-anchor="middle" font-size="11" fill="#333">{5, 4, 7}</text>
  <text x="278" y="160" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4（店1）</text>
  <text x="356" y="160" text-anchor="middle" font-size="11" fill="#333">4×4 = 16</text>
  <text x="452" y="160" text-anchor="middle" font-size="11" fill="#333">30</text>

  <!-- 第 5 行 -->
  <text x="52" y="187" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="160" y="187" text-anchor="middle" font-size="11" fill="#333">{5, 6, 7}</text>
  <text x="278" y="187" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5（店0）</text>
  <text x="356" y="187" text-anchor="middle" font-size="11" fill="#333">5×5 = 25</text>
  <text x="452" y="187" text-anchor="middle" font-size="11" fill="#333">55</text>

  <!-- 第 6 行 -->
  <text x="52" y="214" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>
  <text x="160" y="214" text-anchor="middle" font-size="11" fill="#333">{8, 6, 7}</text>
  <text x="278" y="214" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">6（店1）</text>
  <text x="356" y="214" text-anchor="middle" font-size="11" fill="#333">6×6 = 36</text>
  <text x="452" y="214" text-anchor="middle" font-size="11" fill="#333">91</text>

  <!-- 第 7 行 -->
  <text x="52" y="241" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7</text>
  <text x="160" y="241" text-anchor="middle" font-size="11" fill="#333">{8, −, 7}</text>
  <text x="278" y="241" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">7（店2）</text>
  <text x="356" y="241" text-anchor="middle" font-size="11" fill="#333">7×7 = 49</text>
  <text x="452" y="241" text-anchor="middle" font-size="11" fill="#333">140</text>

  <!-- 第 8 行 -->
  <text x="52" y="268" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">8</text>
  <text x="160" y="268" text-anchor="middle" font-size="11" fill="#333">{8, −, 9}</text>
  <text x="278" y="268" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">8（店0）</text>
  <text x="356" y="268" text-anchor="middle" font-size="11" fill="#333">8×8 = 64</text>
  <text x="452" y="268" text-anchor="middle" font-size="11" fill="#333">204</text>

  <!-- 第 9 行（高亮） -->
  <rect x="24" y="277" width="472" height="27" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="52" y="296" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">9</text>
  <text x="160" y="296" text-anchor="middle" font-size="11" fill="#333">{−, −, 9}</text>
  <text x="278" y="296" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">9（店2）</text>
  <text x="356" y="296" text-anchor="middle" font-size="11" fill="#333">9×9 = 81</text>
  <text x="452" y="296" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">285</text>

  <!-- 结论框 -->
  <rect x="24" y="318" width="472" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="342" text-anchor="middle" font-size="11.5" fill="#333">每天买走的都是当前全局剩余最小值</text>
  <text x="260" y="364" text-anchor="middle" font-size="11.5" fill="#333">⇒ 等价于把全部物品摊平后升序购买：1, 2, 3, …, 9</text>
  <text x="260" y="386" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">升序购买合法：行内更小的值更靠右，必先被买（行尾约束自动满足）</text>
  <text x="260" y="406" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">总开销 285 ✓（本例恰为 1²+2²+…+9²）</text>
</svg>
