<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="340" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">三个示例演算：夹紧求最近点 → 比距离平方与半径平方</text>

  <!-- ===== Panel 1: Example 1 (tangent, true) ===== -->
  <rect x="10" y="40" width="180" height="240" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="100" y="58" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">示例 1</text>
  <!-- circle C(0,0)->(100,150) r=30 -->
  <circle cx="100" cy="150" r="30" fill="#e8f0fe" fill-opacity="0.6" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <!-- rect x[1,3] y[-1,1] -> (130,120) w60 h60 -->
  <rect x="130" y="120" width="60" height="60" fill="#e6f4ea" fill-opacity="0.6" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <!-- center C -->
  <circle cx="100" cy="150" r="3.5" fill="#446688" filter="url(#rough2)"/>
  <text x="92" y="166" text-anchor="end" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">C</text>
  <!-- closest P(1,0)->(130,150) -->
  <circle cx="130" cy="150" r="4" fill="#b85450" filter="url(#rough2)"/>
  <text x="138" y="146" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">P</text>
  <!-- distance line -->
  <line x1="100" y1="150" x2="130" y2="150" stroke="#d6a040" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="100" y="198" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">d²=1, r²=1</text>
  <text x="100" y="212" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">d² ≤ r² ✓</text>
  <rect x="60" y="250" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="100" y="266" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">true</text>

  <!-- ===== Panel 2: Example 2 (false) ===== -->
  <rect x="210" y="40" width="180" height="240" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="300" y="58" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">示例 2</text>
  <!-- circle C(1,1)->(300,150) r=22 -->
  <circle cx="300" cy="150" r="22" fill="#e8f0fe" fill-opacity="0.6" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <!-- rect x[1,2] y[-3,-1] -> (300,172) w22 h44 -->
  <rect x="300" y="172" width="22" height="44" fill="#e6f4ea" fill-opacity="0.6" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <!-- center C -->
  <circle cx="300" cy="150" r="3.5" fill="#446688" filter="url(#rough2)"/>
  <text x="292" y="146" text-anchor="end" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">C</text>
  <!-- closest P(1,-1)->(300,172) -->
  <circle cx="300" cy="172" r="4" fill="#b85450" filter="url(#rough2)"/>
  <text x="328" y="176" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">P</text>
  <!-- distance line -->
  <line x1="300" y1="150" x2="300" y2="172" stroke="#d6a040" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="300" y="198" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">d²=4, r²=1</text>
  <text x="300" y="212" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">d² &gt; r² ✗</text>
  <rect x="260" y="250" width="80" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="266" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">false</text>

  <!-- ===== Panel 3: Example 3 (center on corner, true) ===== -->
  <rect x="410" y="40" width="180" height="240" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="500" y="58" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">示例 3</text>
  <!-- circle C(0,0)->(500,150) r=30 -->
  <circle cx="500" cy="150" r="30" fill="#e8f0fe" fill-opacity="0.6" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <!-- rect x[-1,0] y[0,1] -> (470,120) w30 h30 -->
  <rect x="470" y="120" width="30" height="30" fill="#e6f4ea" fill-opacity="0.6" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <!-- C = P at corner (500,150) -->
  <circle cx="500" cy="150" r="4" fill="#b85450" filter="url(#rough2)"/>
  <text x="510" y="146" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">P=C</text>
  <text x="500" y="198" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">d²=0, r²=1</text>
  <text x="500" y="212" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">d² ≤ r² ✓</text>
  <text x="500" y="226" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">圆心落在矩形角上</text>
  <rect x="460" y="250" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="500" y="266" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">true</text>
</svg>
