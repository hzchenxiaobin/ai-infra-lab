<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：点 -1, 0, 2 → 最短距离 1</text>

  <!-- Step 1: Input table -->
  <text x="80" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Step 1：Point 表</text>
  <rect x="40" y="68" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="85" text-anchor="middle" font-size="11" fill="#333">x</text>
  <rect x="40" y="94" width="80" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="80" y="109" text-anchor="middle" font-size="11" fill="#333">-1</text>
  <rect x="40" y="116" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="80" y="131" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="40" y="138" width="80" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="80" y="153" text-anchor="middle" font-size="11" fill="#333">2</text>

  <!-- Arrow -->
  <path d="M130 116 L180 116" stroke="#446688" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="155" y="108" text-anchor="middle" font-size="9" fill="#446688">ORDER BY x</text>

  <!-- Step 2: Sorted with LAG -->
  <text x="290" y="60" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Step 2：排序 + LAG 回看</text>
  <rect x="190" y="68" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="85" text-anchor="middle" font-size="10" fill="#333">x</text>
  <rect x="250" y="68" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="285" y="85" text-anchor="middle" font-size="10" fill="#333">prev_x</text>
  <rect x="320" y="68" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="355" y="85" text-anchor="middle" font-size="10" fill="#333">x-prev_x</text>

  <rect x="190" y="94" width="60" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="220" y="109" text-anchor="middle" font-size="11" fill="#333">-1</text>
  <rect x="250" y="94" width="70" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="285" y="109" text-anchor="middle" font-size="10" fill="#999">NULL</text>
  <rect x="320" y="94" width="70" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="355" y="109" text-anchor="middle" font-size="10" fill="#999">—</text>

  <rect x="190" y="116" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="220" y="131" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="250" y="116" width="70" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="285" y="131" text-anchor="middle" font-size="11" fill="#333">-1</text>
  <rect x="320" y="116" width="70" height="22" fill="#e6f4ea" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="355" y="131" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>

  <rect x="190" y="138" width="60" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="220" y="153" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="250" y="138" width="70" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="285" y="153" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="320" y="138" width="70" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="355" y="153" text-anchor="middle" font-size="11" fill="#333">2</text>

  <!-- Arrow to result -->
  <path d="M400 127 L450 127" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="425" y="119" text-anchor="middle" font-size="9" fill="#b85450">MIN</text>

  <!-- Step 3: Result -->
  <text x="490" y="100" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">结果</text>
  <rect x="460" y="108" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="490" y="125" text-anchor="middle" font-size="11" fill="#333">min</text>
  <rect x="460" y="134" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="490" y="151" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>

  <!-- Number line visualization -->
  <text x="280" y="190" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">数轴可视化</text>
  <line x1="80" y1="220" x2="480" y2="220" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <polygon points="480,220 472,216 472,224" fill="#446688" filter="url(#rough2)"/>

  <!-- Point -1 -->
  <circle cx="180" cy="220" r="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="210" text-anchor="middle" font-size="11" fill="#333">-1</text>

  <!-- Point 0 -->
  <circle cx="260" cy="220" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="210" text-anchor="middle" font-size="11" fill="#333">0</text>

  <!-- Point 2 -->
  <circle cx="380" cy="220" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="210" text-anchor="middle" font-size="11" fill="#333">2</text>

  <!-- Distance brackets -->
  <path d="M180 248 L180 258 L260 258 L260 248" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="220" y="276" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">|0-(-1)| = 1 ★min</text>

  <path d="M260 248 L260 258 L380 258 L380 248" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="320" y="276" text-anchor="middle" font-size="11" fill="#4a7a3a">|2-0| = 2</text>

  <!-- Callout -->
  <rect x="60" y="300" width="440" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">LAG 排序后：gap 序列 = [NULL→跳过, 1, 2]</text>
  <text x="280" y="344" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">MIN(1, 2) = 1 → 点 -1 与 0 之间最近</text>
</svg>
