<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：[5,2,-5] 后序遍历逐节点求和与计数</text>

  <!-- 小树示意 -->
  <text x="90" y="56" text-anchor="middle" font-size="11" fill="#888">后序顺序</text>
  <circle cx="90" cy="74" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="78" text-anchor="middle" font-size="10" fill="#333">5</text>
  <line x1="82" y1="84" x2="62" y2="100" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="98" y1="84" x2="118" y2="100" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="58" cy="110" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="58" y="113" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="70" y="118" font-size="8" fill="#4a7a3a">①</text>
  <circle cx="122" cy="110" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="122" y="113" text-anchor="middle" font-size="9" fill="#333">−5</text>
  <text x="134" y="118" font-size="8" fill="#d6a040">②</text>
  <text x="90" y="64" font-size="8" fill="#4a7a3a">③</text>

  <!-- 表格 -->
  <!-- 表头 -->
  <rect x="190" y="48" width="410" height="26" fill="#446688" filter="url(#rough2)"/>
  <text x="225" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">节点</text>
  <text x="300" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">求和计算</text>
  <text x="390" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">子树和</text>
  <text x="480" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">freq 更新</text>
  <text x="565" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">maxFreq</text>
  <line x1="265" y1="48" x2="265" y2="74" stroke="#fafafa" stroke-width="1"/>
  <line x1="335" y1="48" x2="335" y2="74" stroke="#fafafa" stroke-width="1"/>
  <line x1="445" y1="48" x2="445" y2="74" stroke="#fafafa" stroke-width="1"/>
  <line x1="525" y1="48" x2="525" y2="74" stroke="#fafafa" stroke-width="1"/>

  <!-- 行 ① 叶 2 -->
  <rect x="190" y="74" width="410" height="32" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="225" y="94" text-anchor="middle" font-size="10" fill="#333">① 叶 2</text>
  <text x="300" y="94" text-anchor="middle" font-size="9" fill="#888">2 + 0 + 0</text>
  <text x="390" y="94" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="480" y="94" text-anchor="middle" font-size="9" fill="#555">{2:1}</text>
  <text x="565" y="94" text-anchor="middle" font-size="10" fill="#333">1</text>

  <!-- 行 ② 叶 -5 -->
  <rect x="190" y="106" width="410" height="32" fill="#fff8e1" filter="url(#rough2)"/>
  <text x="225" y="126" text-anchor="middle" font-size="10" fill="#333">② 叶 −5</text>
  <text x="300" y="126" text-anchor="middle" font-size="9" fill="#888">−5 + 0 + 0</text>
  <text x="390" y="126" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">−5</text>
  <text x="480" y="126" text-anchor="middle" font-size="9" fill="#555">{2:1, −5:1}</text>
  <text x="565" y="126" text-anchor="middle" font-size="10" fill="#333">1</text>

  <!-- 行 ③ 根 5 -->
  <rect x="190" y="138" width="410" height="32" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="225" y="158" text-anchor="middle" font-size="10" fill="#333">③ 根 5</text>
  <text x="300" y="158" text-anchor="middle" font-size="9" fill="#4a7a3a">5 + 2 + (−5)</text>
  <text x="390" y="158" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="480" y="158" text-anchor="middle" font-size="9" fill="#555">{2:2, −5:1}</text>
  <text x="565" y="158" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">2</text>

  <!-- 表格边框 -->
  <rect x="190" y="48" width="410" height="122" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="265" y1="74" x2="265" y2="170" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="335" y1="74" x2="335" y2="170" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="445" y1="74" x2="445" y2="170" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="525" y1="74" x2="525" y2="170" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- 结论框 -->
  <rect x="60" y="195" width="500" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="310" y="217" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">最终 maxFreq = 2 → 收集 freq == 2 的子树和</text>
  <text x="310" y="237" text-anchor="middle" font-size="11" fill="#555">答案 = [ 2 ] ✓（根 5 与左叶 2 的子树和均为 2，并列最高频）</text>

  <!-- 关键观察 -->
  <rect x="60" y="265" width="500" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="285" text-anchor="middle" font-size="10" fill="#555">根的子树和 (5+2−5=2) 恰好等于左叶的子树和 (2)</text>
  <text x="310" y="303" text-anchor="middle" font-size="10" fill="#555">→ 不同节点的子树和可能相同，频次累加 → 哈希表计数是关键</text>

  <!-- 平局说明 -->
  <rect x="60" y="335" width="500" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="355" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">⚠️ 平局处理</text>
  <text x="310" y="373" text-anchor="middle" font-size="10" fill="#555">若多个子树和频次并列最高（如示例 1 的 [2,−3,4] 均 1 次），全部返回</text>
</svg>
