<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：一条流水身兼两职——客户级指标 + 类别级 Top-1</text>

  <text x="120" y="50" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">宽表 T = Transactions ⋈ Products</text>

  <rect x="24" y="56" width="194" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="54" y="70" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">cust</text>
  <text x="104" y="70" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">cat</text>
  <text x="167" y="70" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">amount</text>

  <rect x="24" y="76" width="194" height="19" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="54" y="89" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">101</text>
  <text x="104" y="89" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">A</text>
  <text x="167" y="89" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">100.00</text>

  <rect x="24" y="95" width="194" height="19" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="54" y="108" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">101</text>
  <text x="104" y="108" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">B</text>
  <text x="167" y="108" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">150.00</text>

  <rect x="24" y="114" width="194" height="19" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="54" y="127" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">102</text>
  <text x="104" y="127" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">A</text>
  <text x="167" y="127" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">100.00</text>

  <rect x="24" y="133" width="194" height="19" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="54" y="146" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">102</text>
  <text x="104" y="146" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">C</text>
  <text x="167" y="146" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">200.00</text>

  <rect x="24" y="152" width="194" height="19" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="54" y="165" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">101</text>
  <text x="104" y="165" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">C</text>
  <text x="167" y="165" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">200.00</text>

  <path d="M 220 84 L 238 84" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" fill="none" filter="url(#rough2)"/>

  <rect x="242" y="58" width="262" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="373" y="74" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">① 客户级聚合：GROUP BY customer_id</text>
  <text x="373" y="89" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">SUM(amount) → total · COUNT(*) → cnt</text>
  <text x="373" y="104" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">COUNT(DISTINCT category) · AVG(amount)</text>

  <path d="M 220 142 L 238 148" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="242" y="124" width="262" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="373" y="140" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">② 类别级聚合：GROUP BY customer_id, category</text>
  <text x="373" y="156" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">cnt = COUNT(*) · max_date = MAX(transaction_date)</text>

  <path d="M 373 166 L 373 178" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arro)" fill="none" filter="url(#rough2)"/>

  <rect x="242" y="182" width="262" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="373" y="198" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">③ 客户内取 Top-1（次数优先，平票看最近）</text>
  <text x="373" y="214" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">ROW_NUMBER() OVER (PARTITION BY customer_id</text>
  <text x="373" y="228" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">ORDER BY cnt DESC, max_date DESC) = 1</text>

  <path d="M 504 86 Q 518 210 404 286" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrg)" fill="none" filter="url(#rough2)"/>
  <path d="M 373 238 L 373 260" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arro)" fill="none" filter="url(#rough2)"/>

  <rect x="120" y="264" width="280" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="282" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">④ 1:1 JOIN 拼装（每客户各一行）</text>
  <text x="260" y="298" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">loyalty = cnt×10 + total/100 → ROUND</text>

  <rect x="40" y="326" width="440" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="342" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠️ 别拿 RANK 的并列第一去 JOIN 流水：平票多行 rn=1，</text>
  <text x="260" y="358" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">交易行翻倍 → SUM/COUNT 全被污染。ROW_NUMBER 或先聚完再 JOIN</text>

  <text x="260" y="390" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">五个数值指标是「客户级」，top_category 是「客户×类别级」——粒度不同，必须两条路各走各的</text>
</svg>
