<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrGy" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例 1 演算：maxTime=30 的状态扩展</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">passingFees=[5,1,2,20,20,3]，起点费用 5</text>

  <!-- ===== Graph layout ===== -->
  <text x="36" y="72" font-size="11" fill="#446688" font-weight="bold">城市图（边标注时间）</text>

  <!-- City 0 -->
  <circle cx="70" cy="120" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="70" y="124" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <text x="70" y="150" text-anchor="middle" font-size="9" fill="#888">fee=5</text>

  <!-- City 1 -->
  <circle cx="180" cy="100" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="180" y="104" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="180" y="130" text-anchor="middle" font-size="9" fill="#888">fee=1</text>

  <!-- City 3 -->
  <circle cx="180" cy="160" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="180" y="164" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="180" y="190" text-anchor="middle" font-size="9" fill="#888">fee=20</text>

  <!-- City 2 -->
  <circle cx="300" cy="100" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="104" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="300" y="130" text-anchor="middle" font-size="9" fill="#888">fee=2</text>

  <!-- City 4 -->
  <circle cx="300" cy="160" r="18" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="164" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <text x="300" y="190" text-anchor="middle" font-size="9" fill="#888">fee=20</text>

  <!-- City 5 (destination) -->
  <circle cx="420" cy="130" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="420" y="135" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <text x="420" y="162" text-anchor="middle" font-size="9" fill="#888">fee=3</text>

  <!-- Edges -->
  <!-- 0-1: time 10 (green, optimal path) -->
  <path d="M 86 114 Q 130 106 162 100" stroke="#4a7a3a" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <text x="124" y="100" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">10</text>

  <!-- 0-3: time 1 (orange) -->
  <path d="M 84 128 Q 130 150 162 160" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="110" y="155" font-size="9" fill="#d6a040" font-weight="bold">1</text>

  <!-- 1-2: time 10 -->
  <path d="M 198 100 L 282 100" stroke="#4a7a3a" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <text x="240" y="92" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">10</text>

  <!-- 3-4: time 10 -->
  <path d="M 198 160 L 282 160" stroke="#bbb" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="240" y="152" text-anchor="middle" font-size="9" fill="#888">10</text>

  <!-- 2-5: time 10 (green) -->
  <path d="M 316 106 Q 370 115 400 126" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="360" y="112" font-size="9" fill="#4a7a3a" font-weight="bold">10</text>

  <!-- 4-5: time 15 -->
  <path d="M 316 154 Q 370 145 400 134" stroke="#bbb" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="360" y="152" font-size="9" fill="#888">15</text>

  <!-- Path label -->
  <rect x="460" y="80" width="90" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="505" y="98" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">最优路径</text>
  <text x="505" y="112" text-anchor="middle" font-size="9" fill="#555">0→1→2→5</text>
  <text x="505" y="124" text-anchor="middle" font-size="9" fill="#4a7a3a">费11 时30</text>

  <!-- ===== Steps table ===== -->
  <text x="36" y="220" font-size="11" fill="#446688" font-weight="bold">Dijkstra 弹出顺序（按费用排序）</text>

  <!-- Table header -->
  <rect x="36" y="230" width="488" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="248" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">步骤</text>
  <text x="160" y="248" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">弹出 (cost, 城, t)</text>
  <text x="310" y="248" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">扩展产生的新状态</text>
  <text x="470" y="248" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">说明</text>

  <!-- Row 1 -->
  <rect x="36" y="260" width="488" height="28" fill="#fafafa" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="70" y="278" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="160" y="278" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">(5, 0, 0)</text>
  <text x="310" y="278" text-anchor="middle" font-size="10" fill="#555">(6, 1, 10), (25, 3, 1)</text>
  <text x="470" y="278" text-anchor="middle" font-size="9" fill="#888">起点出发</text>

  <!-- Row 2 -->
  <rect x="36" y="290" width="488" height="28" fill="#f5f5f5" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="70" y="308" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="160" y="308" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">(6, 1, 10)</text>
  <text x="310" y="308" text-anchor="middle" font-size="10" fill="#555">(8, 2, 20)</text>
  <text x="470" y="308" text-anchor="middle" font-size="9" fill="#888">0→1 费5+1</text>

  <!-- Row 3 -->
  <rect x="36" y="320" width="488" height="28" fill="#fafafa" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="70" y="338" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="160" y="338" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">(8, 2, 20)</text>
  <text x="310" y="338" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">(11, 5, 30) ✓</text>
  <text x="470" y="338" text-anchor="middle" font-size="9" fill="#888">0→1→2 费6+2</text>

  <!-- Row 4 (highlighted - answer) -->
  <rect x="36" y="350" width="488" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="70" y="368" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">4</text>
  <text x="160" y="368" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">(11, 5, 30)</text>
  <text x="310" y="368" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">u == 5 == n-1 → 返回 11</text>
  <text x="470" y="368" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">✓ 最优解</text>

  <!-- Note box -->
  <rect x="36" y="392" width="488" height="40" fill="#f0f7ff" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="408" text-anchor="middle" font-size="10" fill="#446688">💡 堆中仍有 (25, 3, 1) 等状态，但费用 25 &gt; 11，Dijkstra 贪心保证先弹出更小的 11</text>
  <text x="280" y="424" text-anchor="middle" font-size="10" fill="#888">第一次弹出终点状态即最优 → 无需遍历全部状态</text>
</svg>
