<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 4 演算：["a==b","b!=c","c==a"] → false</text>

  <!-- ===== Pass 1 table ===== -->
  <text x="280" y="54" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">第一遍（只处理 ==）</text>

  <!-- header -->
  <rect x="40" y="64" width="64" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="72" y="82" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">步骤</text>
  <rect x="104" y="64" width="96" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="82" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">方程</text>
  <rect x="200" y="64" width="150" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="275" y="82" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">操作</text>
  <rect x="350" y="64" width="180" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="440" y="82" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">等价类变化</text>

  <!-- row 1: a==b -->
  <rect x="40" y="90" width="64" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="72" y="108" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">①</text>
  <rect x="104" y="90" width="96" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="152" y="108" text-anchor="middle" font-size="11" fill="#333">a == b</text>
  <rect x="200" y="90" width="150" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="275" y="108" text-anchor="middle" font-size="11" fill="#333">union(a, b)</text>
  <rect x="350" y="90" width="180" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="440" y="108" text-anchor="middle" font-size="11" fill="#4a7a3a">{a,b}, {c}</text>

  <!-- row 2: b!=c skipped -->
  <rect x="40" y="116" width="64" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="72" y="134" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">②</text>
  <rect x="104" y="116" width="96" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="152" y="134" text-anchor="middle" font-size="11" fill="#888">b != c</text>
  <rect x="200" y="116" width="150" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="275" y="134" text-anchor="middle" font-size="11" fill="#888">跳过（!= 留第二遍）</text>
  <rect x="350" y="116" width="180" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="440" y="134" text-anchor="middle" font-size="11" fill="#888">{a,b}, {c}</text>

  <!-- row 3: c==a -->
  <rect x="40" y="142" width="64" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="72" y="160" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">③</text>
  <rect x="104" y="142" width="96" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="152" y="160" text-anchor="middle" font-size="11" fill="#333">c == a</text>
  <rect x="200" y="142" width="150" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="275" y="160" text-anchor="middle" font-size="11" fill="#333">union(c, a)</text>
  <rect x="350" y="142" width="180" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="440" y="160" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">{a, b, c}</text>

  <!-- pass 1 summary -->
  <rect x="40" y="176" width="490" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="285" y="196" text-anchor="middle" font-size="11" fill="#444">第一遍结束：find(a)==find(b)==find(c)，三者同属一类</text>

  <!-- ===== Pass 2 table ===== -->
  <text x="280" y="226" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">第二遍（只处理 !=）</text>

  <!-- header -->
  <rect x="40" y="236" width="64" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="72" y="254" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">步骤</text>
  <rect x="104" y="236" width="96" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="254" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">方程</text>
  <rect x="200" y="236" width="200" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="254" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">检查</text>
  <rect x="400" y="236" width="130" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="465" y="254" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">结果</text>

  <!-- row: b!=c conflict -->
  <rect x="40" y="262" width="64" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="72" y="282" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">①</text>
  <rect x="104" y="262" width="96" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="152" y="282" text-anchor="middle" font-size="11" fill="#333">b != c</text>
  <rect x="200" y="262" width="200" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="300" y="282" text-anchor="middle" font-size="11" fill="#333">find(b) == find(c) ?</text>
  <rect x="400" y="262" width="130" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="465" y="282" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">是 → 冲突 ⛔</text>

  <!-- final result -->
  <rect x="40" y="306" width="490" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="285" y="327" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">b、c 已被 a==b 与 c==a 强制同值</text>
  <text x="285" y="345" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">无法满足 b!=c → 返回 false</text>

  <!-- ===== order-dependence note ===== -->
  <rect x="40" y="364" width="490" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="285" y="386" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">为何两遍扫描不可省</text>
  <text x="285" y="404" text-anchor="middle" font-size="10.5" fill="#555">若换成 ["b!=c","c==a","a==b"] 单遍按序处理：</text>
  <text x="285" y="420" text-anchor="middle" font-size="10.5" fill="#b85450">处理 b!=c 时 b、c 尚未连通 → 误判"不冲突" → 错误返回 true</text>
</svg>
