<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    区间 [a, b) 与 [x, y) 的关系分类
  </text>
  <text x="280" y="50" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">
    蓝条 = 原区间，红条 = 待删除，绿条 = 保留结果
  </text>

  <!-- Case A: no overlap -->
  <rect x="40" y="68" width="480" height="78" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" opacity="0.3" filter="url(#rough2)"/>
  <text x="56" y="88" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">A：无交集（a ≥ y 或 b ≤ x）→ 保留 [a, b)</text>
  <rect x="80" y="104" width="60" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="119" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">[x,y)</text>
  <rect x="230" y="104" width="140" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="300" y="119" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">[a, b)</text>

  <!-- Case B: complete cover -->
  <rect x="40" y="154" width="480" height="78" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" opacity="0.3" filter="url(#rough2)"/>
  <text x="56" y="174" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">B：完全覆盖（x ≤ a 且 b ≤ y）→ 删除（无剩余）</text>
  <rect x="120" y="190" width="220" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="230" y="205" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">[x - - - - - - - - y)</text>
  <rect x="180" y="194" width="100" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" opacity="0.7" filter="url(#rough2)"/>
  <text x="230" y="204" text-anchor="middle" font-size="8" fill="#446688" filter="url(#rough2)">[a, b)</text>
  <text x="400" y="205" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ 空</text>

  <!-- Case C: left part kept -->
  <rect x="40" y="240" width="480" height="78" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" opacity="0.3" filter="url(#rough2)"/>
  <text x="56" y="260" font-size="13" fill="#7a5415" font-weight="bold" filter="url(#rough2)">C：删右段（a &lt; x, b ≤ y）→ 保留 [a, x)</text>
  <rect x="120" y="276" width="180" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="200" y="276" width="100" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" opacity="0.6" filter="url(#rough2)"/>
  <text x="160" y="291" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">[a,x)</text>
  <text x="250" y="291" text-anchor="middle" font-size="8" fill="#b85450" filter="url(#rough2)">删除</text>
  <text x="400" y="291" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ [a, x)</text>

  <!-- Case D: right part kept -->
  <rect x="40" y="326" width="480" height="78" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" opacity="0.3" filter="url(#rough2)"/>
  <text x="56" y="346" font-size="13" fill="#7a5415" font-weight="bold" filter="url(#rough2)">D：删左段（a ≥ x, b &gt; y）→ 保留 [y, b)</text>
  <rect x="120" y="362" width="180" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="120" y="362" width="100" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" opacity="0.6" filter="url(#rough2)"/>
  <rect x="220" y="362" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="170" y="377" text-anchor="middle" font-size="8" fill="#b85450" filter="url(#rough2)">删除</text>
  <text x="260" y="377" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">[y,b)</text>
  <text x="400" y="377" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ [y, b)</text>

  <!-- unified formula -->
  <rect x="40" y="414" width="480" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="436" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    统一处理 B/C/D：若 a &lt; x 保留 [a, x)；若 b &gt; y 保留 [y, b)
  </text>
</svg>
