<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：hh:mm 四位可填，h1↔h2 耦合，m1、m2 独立</text>

  <!-- ===== Time format row: h1 h2 : m1 m2 ===== -->
  <g filter="url(#rough2)" font-size="22" font-weight="bold" text-anchor="middle">
    <rect x="150" y="56" width="54" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <text x="177" y="88" fill="#446688">?</text>
    <rect x="210" y="56" width="54" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <text x="237" y="88" fill="#446688">?</text>
    <rect x="330" y="56" width="54" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <text x="357" y="88" fill="#446688">?</text>
    <rect x="390" y="56" width="54" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <text x="417" y="88" fill="#446688">?</text>
  </g>
  <text x="297" y="88" text-anchor="middle" font-size="22" fill="#888" font-weight="bold" filter="url(#rough2)">:</text>

  <!-- position labels -->
  <g filter="url(#rough2)" font-size="11" fill="#888" text-anchor="middle">
    <text x="177" y="116">h1</text>
    <text x="237" y="116">h2</text>
    <text x="357" y="116">m1</text>
    <text x="417" y="116">m2</text>
  </g>

  <!-- valid range per position -->
  <g filter="url(#rough2)" font-size="11" font-weight="bold" text-anchor="middle">
    <text x="177" y="140" fill="#446688">0 – 2</text>
    <text x="237" y="140" fill="#446688">0 – 9</text>
    <text x="357" y="140" fill="#4a7a3a">0 – 5</text>
    <text x="417" y="140" fill="#4a7a3a">0 – 9</text>
  </g>

  <!-- ===== Coupling bracket under h1, h2 ===== -->
  <path d="M 150 158 L 150 168 L 264 168 L 264 158" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 207 168 L 207 178" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="120" y="184" width="174" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
    <text x="207" y="203" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">hour ∈ [00, 23]：耦合</text>
  </g>

  <!-- independent tags under m1, m2 -->
  <path d="M 330 158 L 330 168 L 444 168 L 444 158" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 387 168 L 387 178" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="300" y="184" width="174" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="387" y="203" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">minute ∈ [00, 59]：独立</text>
  </g>

  <!-- ===== Two observation panels ===== -->
  <rect x="40" y="232" width="232" height="100" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="156" y="252" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">观察 ①：小时组 (h1, h2) 耦合</text>
  <line x1="52" y1="260" x2="260" y2="260" stroke="#e8c0c8" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="278" font-size="10" fill="#555" filter="url(#rough2)">h1=2 时，h2 必须 ≤ 3</text>
  <text x="52" y="294" font-size="10" fill="#555" filter="url(#rough2)">h2 锁死且 &gt; 3 时，h1 退到 1</text>
  <text x="52" y="312" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ 字典序贪心：先定 h1，再定 h2</text>
  <text x="52" y="326" font-size="9" fill="#888" filter="url(#rough2)">  h1 优先级高，h2 在 h1 约束下取最大</text>

  <rect x="288" y="232" width="232" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="404" y="252" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">观察 ②：分钟组 (m1, m2) 独立</text>
  <line x1="300" y1="260" x2="508" y2="260" stroke="#c0d8c0" stroke-width="1" filter="url(#rough2)"/>
  <text x="300" y="278" font-size="10" fill="#555" filter="url(#rough2)">m1 与 m2 互不影响</text>
  <text x="300" y="294" font-size="10" fill="#555" filter="url(#rough2)">也不受小时位影响</text>
  <text x="300" y="312" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ 直接取最大：m1=5, m2=9</text>
  <text x="300" y="326" font-size="9" fill="#888" filter="url(#rough2)">  无需任何条件判定</text>

  <!-- ===== Footer: greedy rule ===== -->
  <rect x="40" y="346" width="480" height="98" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="52" y="366" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">逐位贪心规则（处理顺序：h1 → h2 → m1 → m2）</text>
  <line x1="52" y1="372" x2="508" y2="372" stroke="#f0d8a0" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="390" font-size="10" fill="#555" filter="url(#rough2)">h1=? : (h2=='?' 或 h2≤'3') → '2' ; 否则 → '1'</text>
  <text x="52" y="406" font-size="10" fill="#555" filter="url(#rough2)">h2=? : (h1=='2') → '3' ; 否则 → '9'</text>
  <text x="52" y="422" font-size="10" fill="#555" filter="url(#rough2)">m1=? → '5'    m2=? → '9'</text>
  <text x="52" y="438" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">关键：先填 h1 再填 h2，因 h2 判定依赖 h1 的最终取值</text>
</svg>
