<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">FIFO 队列 = 滑动时间窗口 [t−3000, t] 的内容</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">ping 严格递增 → 队列天然有序 → 队首过期即永不过期 → 贪心左弹</text>

  <!-- ===== Timeline ===== -->
  <text x="30" y="86" font-size="11" fill="#446688" font-weight="bold">时间轴（ping 严格递增）</text>
  <line x1="40" y1="120" x2="500" y2="120" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- window band [2, 3002] for ping(3002): from just right of t=1 to t=3002 -->
  <rect x="62" y="110" width="392" height="20" fill="#e6f4ea" fill-opacity="0.7" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="4 3" rx="3" filter="url(#rough2)"/>
  <text x="258" y="103" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">窗口 [t−3000, t] = [2, 3002]</text>

  <!-- ping markers: 1, 100, 3001, 3002 -->
  <g font-size="10" fill="#333">
    <!-- t=1 (out of window) -->
    <circle cx="48" cy="120" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="48" y="146" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>
    <text x="48" y="158" text-anchor="middle" font-size="8" fill="#b85450">落窗外</text>

    <!-- t=100 (in window) -->
    <circle cx="130" cy="120" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="130" y="146" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">100</text>
    <text x="130" y="158" text-anchor="middle" font-size="8" fill="#4a7a3a">窗内</text>

    <!-- t=3001 (in window) -->
    <circle cx="395" cy="120" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="395" y="146" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">3001</text>
    <text x="395" y="158" text-anchor="middle" font-size="8" fill="#4a7a3a">窗内</text>

    <!-- t=3002 (in window, current) -->
    <circle cx="454" cy="120" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="454" y="146" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">3002</text>
    <text x="454" y="158" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">当前 t</text>
  </g>

  <!-- 1 falls off arrow -->
  <path d="M 48 168 L 48 188" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="78" y="180" font-size="9" fill="#b85450" font-weight="bold">1 &lt; 3002−3000=2 → 弹出</text>

  <!-- ===== FIFO Queue ===== -->
  <text x="30" y="212" font-size="11" fill="#d6a040" font-weight="bold">FIFO 队列（只装窗口内的 ping）</text>
  <g font-size="11" fill="#333">
    <!-- queue cells: front(100) ... back(3002) -->
    <rect x="120" y="226" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="160" y="248" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">100</text>

    <rect x="206" y="226" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="246" y="248" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3001</text>

    <rect x="292" y="226" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="332" y="248" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3002</text>

    <!-- front label -->
    <text x="160" y="276" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">队首 front</text>
    <text x="160" y="288" text-anchor="middle" font-size="8" fill="#b85450">popleft ←</text>
    <!-- back label -->
    <text x="332" y="276" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">队尾 back</text>
    <text x="332" y="288" text-anchor="middle" font-size="8" fill="#4a7a3a">← append</text>
  </g>

  <!-- pop arrow (left) and append arrow (right) -->
  <path d="M 120 243 L 92 243" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 388 243 L 372 243" stroke="#4a7a3a" stroke-width="0" fill="none"/>
  <path d="M 420 243 L 372 243" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== Key invariant box ===== -->
  <rect x="30" y="306" width="500" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="328" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">核心不变式：队列内容 = 当前窗口内的全部 ping</text>
  <text x="280" y="346" text-anchor="middle" font-size="10" fill="#555">① ping 严格递增 → 队列天然升序 → 只需从队首检查过期</text>
  <text x="280" y="362" text-anchor="middle" font-size="10" fill="#555">② 窗口左端 t−3000 随 t 单调右移 → 队首一旦 &lt; t−3000 便永远过期</text>
  <text x="280" y="378" text-anchor="middle" font-size="10" fill="#555">→ 每次 ping：入队 + 循环左弹过期 + 返回 len(q)，均摊 O(1)</text>
</svg>
