<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">反回文：每一对对称位置 (i, n−1−i) 的字符都不同</text>

  <!-- Row 1: palindrome bad -->
  <text x="30" y="62" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">回文 ✗</text>
  <rect x="160" y="46" width="50" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="185" y="70" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="216" y="46" width="50" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="241" y="70" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="272" y="46" width="50" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="297" y="70" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="328" y="46" width="50" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="353" y="70" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="185" y="94" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=0</text>
  <text x="241" y="94" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=1</text>
  <text x="297" y="94" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=2</text>
  <text x="353" y="94" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=3</text>
  <path d="M 185 98 C 185 112 353 112 353 98" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="269" y="116" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">a = a 相同 ✗</text>
  <path d="M 241 122 C 241 134 297 134 297 122" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="269" y="148" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">b = b 相同 ✗</text>
  <text x="400" y="66" font-size="11.5" fill="#b85450" filter="url(#rough2)">对称位成对相等，</text>
  <text x="400" y="84" font-size="11.5" fill="#b85450" filter="url(#rough2)">不是反回文</text>

  <!-- Row 2: anti-palindrome good -->
  <text x="30" y="176" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">反回文 ✓</text>
  <rect x="160" y="160" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="185" y="184" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="216" y="160" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="241" y="184" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="272" y="160" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="297" y="184" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="328" y="160" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="353" y="184" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">c</text>
  <path d="M 185 212 C 185 226 353 226 353 212" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="269" y="230" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">a ≠ c ✓</text>
  <path d="M 241 236 C 241 248 297 248 297 236" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="269" y="262" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">a ≠ b ✓</text>
  <text x="400" y="180" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">所有对称对都不同，</text>
  <text x="400" y="198" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">排序串 "aabc" 直接合法</text>

  <!-- definition box -->
  <rect x="40" y="276" width="440" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="298" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">定义：对所有 0 ≤ i &lt; n，s[i] ≠ s[n−i−1]（n 为偶数）</text>

  <!-- pigeonhole box -->
  <rect x="40" y="318" width="440" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="335" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">n/2 对配对格，每对须放两个不同字符 → 任一字母至多 n/2 个</text>
  <text x="260" y="350" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">频次 &gt; n/2 必有对称对撞车 → 返回 "-1"（如 "cccd"：c 有 3 个 &gt; 2）</text>
</svg>
