<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 390" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="390" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">转移方程：dp[j][v] = cost_j(v) + min_{u≠v} dp[j−1][u]</text>
  <text x="70" y="52" font-size="11" fill="#446688" filter="url(#rough2)">cost_j(v) = m − cnt_j[v]：该列已有 cnt_j[v] 个格子白送</text>

  <!-- prev row: u labels -->
  <text x="52" y="66" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">u:</text>
  <text x="88" y="66" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <text x="126" y="66" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <text x="164" y="66" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>
  <text x="202" y="66" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>
  <text x="240" y="66" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">4</text>
  <text x="278" y="66" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">5</text>
  <text x="316" y="66" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">6</text>
  <text x="354" y="66" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">7</text>
  <text x="392" y="66" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">8</text>
  <text x="430" y="66" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">9</text>

  <!-- prev row cells -->
  <rect x="70" y="72" width="36" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="88" y="94" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="108" y="72" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="126" y="94" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="146" y="72" width="36" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="164" y="94" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>
  <rect x="184" y="72" width="36" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="202" y="94" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <rect x="222" y="72" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="240" y="94" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="260" y="72" width="36" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="278" y="94" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>
  <rect x="298" y="72" width="36" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="316" y="94" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">11</text>
  <rect x="336" y="72" width="36" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="354" y="94" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <rect x="374" y="72" width="36" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="392" y="94" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">10</text>
  <rect x="412" y="72" width="36" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="430" y="94" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>

  <!-- m1 / m2 badges -->
  <text x="240" y="124" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">m1</text>
  <text x="126" y="124" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">m2</text>

  <!-- arrows -->
  <path d="M 232 130 C 190 168, 125 190, 92 230" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="152" y="162" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">取 m1</text>

  <path d="M 244 130 L 244 232" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 237 171 L 251 185" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <path d="M 251 171 L 237 185" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="258" y="184" text-anchor="start" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">u=v 撞值，禁用</text>

  <path d="M 130 130 C 162 178, 210 205, 234 230" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="176" y="216" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">退取 m2</text>

  <!-- current row cells -->
  <rect x="70" y="238" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="88" y="260" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">?</text>
  <rect x="108" y="238" width="36" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="126" y="260" text-anchor="middle" font-size="13" fill="#aaa" filter="url(#rough2)">?</text>
  <rect x="146" y="238" width="36" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="164" y="260" text-anchor="middle" font-size="13" fill="#aaa" filter="url(#rough2)">?</text>
  <rect x="184" y="238" width="36" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="202" y="260" text-anchor="middle" font-size="13" fill="#aaa" filter="url(#rough2)">?</text>
  <rect x="222" y="238" width="36" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="240" y="260" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">?</text>
  <rect x="260" y="238" width="36" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="278" y="260" text-anchor="middle" font-size="13" fill="#aaa" filter="url(#rough2)">?</text>
  <rect x="298" y="238" width="36" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="316" y="260" text-anchor="middle" font-size="13" fill="#aaa" filter="url(#rough2)">?</text>
  <rect x="336" y="238" width="36" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="354" y="260" text-anchor="middle" font-size="13" fill="#aaa" filter="url(#rough2)">?</text>
  <rect x="374" y="238" width="36" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="392" y="260" text-anchor="middle" font-size="13" fill="#aaa" filter="url(#rough2)">?</text>
  <rect x="412" y="238" width="36" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="430" y="260" text-anchor="middle" font-size="13" fill="#aaa" filter="url(#rough2)">?</text>

  <!-- current row: v labels -->
  <text x="52" y="292" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">v:</text>
  <text x="88" y="292" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <text x="126" y="292" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <text x="164" y="292" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>
  <text x="202" y="292" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>
  <text x="240" y="292" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">4</text>
  <text x="278" y="292" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">5</text>
  <text x="316" y="292" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">6</text>
  <text x="354" y="292" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">7</text>
  <text x="392" y="292" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">8</text>
  <text x="430" y="292" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">9</text>

  <!-- row captions -->
  <text x="452" y="92" font-size="11" fill="#555" filter="url(#rough2)">第 j−1 列</text>
  <text x="452" y="258" font-size="11" fill="#555" filter="url(#rough2)">第 j 列</text>

  <!-- formula box -->
  <rect x="40" y="308" width="440" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="332" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">dp[j][v] = (m − cnt_j[v]) + (dp[j−1][v] == m1 ? m2 : m1)</text>
  <text x="260" y="352" text-anchor="middle" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">m1 = 上一列最小，m2 = 次小；v 撞在 m1 上就退取 m2</text>
  <text x="260" y="369" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">并列最小时 m2 = m1，两条路殊途同归，无需特判</text>
</svg>
