<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="480" fill="#fafafa"/>

  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一遍遍历 nums[1…n−1]，同步维护最小 min1 与次小 min2</text>

  <!-- start -->
  <ellipse cx="270" cy="52" rx="40" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="57" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">开始</text>
  <path d="M 270 69 L 270 84" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- init -->
  <rect x="185" y="86" width="170" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="107" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">min1 = min2 = +∞</text>
  <path d="M 270 118 L 270 132" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- loop box -->
  <rect x="160" y="136" width="220" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="157" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">取下一个 x ∈ nums[1…n−1]</text>

  <!-- loop exit to end -->
  <path d="M 380 152 L 445 152 L 445 124" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="412" y="146" font-size="10.5" fill="#888" filter="url(#rough2)">取完</text>
  <rect x="360" y="74" width="170" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="445" y="92" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">遍历结束</text>
  <text x="445" y="110" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 nums[0]+min1+min2</text>

  <path d="M 270 168 L 270 182" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 1 -->
  <polygon points="270,186 345,220 270,254 195,220" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="225" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">x &lt; min1 ?</text>

  <!-- yes branch of diamond1 -->
  <path d="M 195 220 L 123 220 L 123 294" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="158" y="212" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="48" y="298" width="150" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="123" y="320" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">min2 ← min1</text>
  <text x="123" y="338" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">min1 ← x</text>
  <text x="123" y="352" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（新冠军，旧的退居次席）</text>

  <!-- no branch of diamond1 -->
  <path d="M 270 254 L 270 268" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="281" y="265" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- diamond 2 -->
  <polygon points="270,272 345,306 270,340 195,306" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="311" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">x &lt; min2 ?</text>

  <!-- yes branch of diamond2 -->
  <path d="M 345 306 L 430 306 L 430 374" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="385" y="298" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="355" y="378" width="150" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="430" y="400" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">min2 ← x</text>
  <text x="430" y="418" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（只换掉次席）</text>

  <!-- no branch of diamond2 -->
  <path d="M 270 340 L 270 374" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="281" y="362" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="195" y="378" width="140" height="50" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="265" y="400" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">跳过 x</text>
  <text x="265" y="418" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">（比两个都大）</text>

  <!-- loop back -->
  <path d="M 123 356 L 123 460" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 265 428 L 265 460" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 430 428 L 430 460" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 36 460 L 430 460" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 36 460 L 36 152 L 156 152" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="348" y="452" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">进入下一轮</text>
</svg>
