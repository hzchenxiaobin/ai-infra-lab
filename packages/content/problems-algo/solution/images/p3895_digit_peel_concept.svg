<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：x % 10 剥下最低位，x / 10 丢掉最低位</text>
  <text x="260" y="36" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">以 x = 1234 为例，从个位向高位层层剥离，直到归零</text>

  <!-- ===== digit boxes: 1234 ===== -->
  <rect x="176" y="50" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="220" y="50" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="264" y="50" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="308" y="50" width="36" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="194" y="70" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="238" y="70" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="282" y="70" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="326" y="70" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="194" y="96" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">千位</text>
  <text x="238" y="96" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">百位</text>
  <text x="282" y="96" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">十位</text>
  <text x="326" y="96" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold" filter="url(#rough2)">个位</text>
  <text x="356" y="70" text-anchor="start" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">← 最先剥走</text>

  <!-- ===== peel chain rows: y = 128, 172, 216, 260 ===== -->
  <!-- row 1: x = 1234, peel 4 -->
  <rect x="80" y="115" width="92" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="126" y="132" text-anchor="middle" font-size="11.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">x = 1234</text>
  <path d="M 176 128 L 232 128" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="205" y="122" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">取 x % 10</text>
  <circle cx="252" cy="128" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="252" y="132" text-anchor="middle" font-size="12" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">4</text>
  <path d="M 126 141 L 126 157" stroke="#999" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="140" y="153" text-anchor="start" font-size="9" fill="#999" filter="url(#rough2)">/ 10</text>
  <text x="252" y="108" text-anchor="middle" font-size="9" fill="#8a6d1a" filter="url(#rough2)">剥下的位 → 与 digit 比</text>

  <!-- row 2: x = 123, peel 3 -->
  <rect x="80" y="159" width="92" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="126" y="176" text-anchor="middle" font-size="11.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">x = 123</text>
  <path d="M 176 172 L 232 172" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="205" y="166" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">取 x % 10</text>
  <circle cx="252" cy="172" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="252" y="176" text-anchor="middle" font-size="12" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">3</text>
  <path d="M 126 185 L 126 201" stroke="#999" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="140" y="197" text-anchor="start" font-size="9" fill="#999" filter="url(#rough2)">/ 10</text>

  <!-- row 3: x = 12, peel 2 -->
  <rect x="80" y="203" width="92" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="126" y="220" text-anchor="middle" font-size="11.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">x = 12</text>
  <path d="M 176 216 L 232 216" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="205" y="210" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">取 x % 10</text>
  <circle cx="252" cy="216" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="252" y="220" text-anchor="middle" font-size="12" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">2</text>
  <path d="M 126 229 L 126 245" stroke="#999" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="140" y="241" text-anchor="start" font-size="9" fill="#999" filter="url(#rough2)">/ 10</text>

  <!-- row 4: x = 1, peel 1 -->
  <rect x="80" y="247" width="92" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="126" y="264" text-anchor="middle" font-size="11.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">x = 1</text>
  <path d="M 176 260 L 232 260" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="205" y="254" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">取 x % 10</text>
  <circle cx="252" cy="260" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="252" y="264" text-anchor="middle" font-size="12" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">1</text>
  <path d="M 126 273 L 126 289" stroke="#999" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="140" y="285" text-anchor="start" font-size="9" fill="#999" filter="url(#rough2)">/ 10</text>

  <!-- stop row: x = 0 -->
  <rect x="80" y="291" width="92" height="26" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="126" y="308" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">x = 0</text>
  <text x="186" y="308" text-anchor="start" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">停止！循环条件 x &gt; 0 不成立</text>

  <!-- ===== right note box ===== -->
  <rect x="300" y="150" width="195" height="84" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="397" y="170" text-anchor="middle" font-size="10.5" fill="#2a5a1e" font-weight="bold" filter="url(#rough2)">每一轮做两件事</text>
  <text x="312" y="188" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">① x % 10 取出最低位</text>
  <text x="312" y="204" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">② x / 10 丢掉最低位</text>
  <text x="312" y="220" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">③ 剥出的位 == digit 则 ans++</text>
  <path d="M 298 178 Q 284 174 272 170" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== bottom pitfall box ===== -->
  <rect x="35" y="326" width="450" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="344" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">免特判的两个点（nums[i] ≥ 1 送的）</text>
  <text x="47" y="362" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">① digit = 0 不需特判：剥离只经过有效位，100 → 0, 0, 1，恰好计 2 次</text>
  <text x="47" y="378" text-anchor="start" font-size="9" fill="#555" filter="url(#rough2)">② 循环条件 x &gt; 0：x ≥ 1 至少剥一轮；若允许 nums[i] = 0，需特判 0 贡献一次</text>
</svg>
