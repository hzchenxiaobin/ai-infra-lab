<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">叉乘判共线：cross = 0 即共线，cross ≠ 0 即偏离</text>

  <!-- ===== Left panel: collinear ===== -->
  <rect x="20" y="44" width="235" height="200" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="138" y="62" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✅ 共线（cross = 0）</text>

  <!-- the straight line through points (extended) -->
  <path d="M 40 250 L 235 120" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <!-- vector v01 from p0 to p1 -->
  <path d="M 70 230 L 126 193" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- vector v02 from p0 to p2 -->
  <path d="M 70 230 L 190 150" stroke="#d6a040" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- points -->
  <circle cx="70" cy="230" r="6" fill="#446688" filter="url(#rough2)"/>
  <text x="58" y="248" font-size="12" fill="#333" font-weight="bold">p0</text>
  <circle cx="130" cy="190" r="6" fill="#446688" filter="url(#rough2)"/>
  <text x="118" y="184" font-size="12" fill="#333" font-weight="bold">p1</text>
  <circle cx="190" cy="150" r="6" fill="#d6a040" filter="url(#rough2)"/>
  <text x="178" y="144" font-size="12" fill="#333" font-weight="bold">p2</text>

  <!-- vector labels -->
  <text x="80" y="218" font-size="10" fill="#446688">v01=(dx,dy)</text>
  <text x="150" y="208" font-size="10" fill="#d6a040">v02 平行 v01</text>

  <!-- cross result -->
  <rect x="40" y="262" width="195" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="138" y="282" text-anchor="middle" font-size="11" fill="#333">cross = dx·(y2−y0) − dy·(x2−x0) = 0</text>

  <!-- ===== Right panel: NOT collinear ===== -->
  <rect x="265" y="44" width="235" height="200" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="383" y="62" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">❌ 偏离（cross ≠ 0）</text>

  <!-- the line through p0,p1 extended -->
  <path d="M 285 250 L 480 120" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <!-- vector v01 from p0 to p1 -->
  <path d="M 315 230 L 371 193" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- vector v02 from p0 to p2 (p2 OFF the line) -->
  <path d="M 315 230 L 435 175" stroke="#d6a040" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- expected position on line (ghost) -->
  <circle cx="435" cy="157" r="5" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="445" y="156" font-size="9" fill="#b85450">应在</text>

  <!-- points -->
  <circle cx="315" cy="230" r="6" fill="#446688" filter="url(#rough2)"/>
  <text x="303" y="248" font-size="12" fill="#333" font-weight="bold">p0</text>
  <circle cx="375" cy="190" r="6" fill="#446688" filter="url(#rough2)"/>
  <text x="363" y="184" font-size="12" fill="#333" font-weight="bold">p1</text>
  <circle cx="435" cy="175" r="6" fill="#d6a040" filter="url(#rough2)"/>
  <text x="423" y="170" font-size="12" fill="#333" font-weight="bold">p2</text>

  <text x="325" y="218" font-size="10" fill="#446688">v01=(dx,dy)</text>
  <text x="360" y="166" font-size="10" fill="#d6a040">v02 不平行 v01</text>

  <rect x="285" y="262" width="195" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="383" y="282" text-anchor="middle" font-size="11" fill="#333">cross = dx·(y2−y0) − dy·(x2−x0) ≠ 0</text>

  <!-- ===== Summary ===== -->
  <rect x="40" y="306" width="440" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="324" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">用叉乘而非斜率：避开除零与浮点误差，纯整数运算</text>
  <text x="260" y="340" text-anchor="middle" font-size="11" fill="#666">固定 p0、p1 定方向，逐点验 pi 与 p0 的向量是否共线</text>
</svg>
