  <text x="290" y="438" font-size="10.5" fill="#4a7a3a" font-weight="bold">← Khaled exp=3 命中</text>
  <text x="290" y="460" font-size="10.5" fill="#4a7a3a" font-weight="bold">← John exp=3 并列命中</text>
  <text x="290" y="482" font-size="10.5" fill="#446688" font-weight="bold">← Khaled exp=3 命中</text>

  <!-- 提示框 -->
  <rect x="30" y="500" width="560" height="68" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="50" y="520" font-size="11" fill="#555" font-weight="bold">💡 关键细节</text>
  <text x="50" y="538" font-size="10.5" fill="#888">① Project 表本身没有经验列 → 必须先 JOIN Employee 把 experience_years 补上。</text>
  <text x="50" y="554" font-size="10.5" fill="#888">② 项目1 中 Khaled 和 John 经验均为 3（并列最高）→ RANK 均为 1 → 两行都输出，这正是「并列全保留」。</text>
  <text x="50" y="568" font-size="10.5" fill="#b85450" font-weight="bold">⚠️ 若用 ROW_NUMBER() 只会保留 1 条，漏掉 John → 与题意矛盾！</text>
</svg>
