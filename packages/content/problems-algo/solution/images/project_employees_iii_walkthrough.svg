  <text x="300" y="288" font-size="10" fill="#d6a040">← 2 &lt; 3，非最高 ✗</text>
  <text x="300" y="310" font-size="10" fill="#4a7a3a" font-weight="bold">← 项目1最高 3 ✓</text>
  <text x="300" y="332" font-size="10" fill="#446688" font-weight="bold">← 项目2最高 3 ✓</text>
