<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例 2：word1="abcc" 与 word2="aab" 交换 c↔a</text>

  <!-- ===== 交换前 panel ===== -->
  <rect x="20" y="48" width="240" height="290" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">交换前</text>

  <!-- word1 freq -->
  <text x="34" y="96" font-size="12" font-weight="bold" fill="#223" filter="url(#rough2)">word1</text>
  <!-- a -->
  <rect x="34" y="104" width="40" height="24" rx="4" fill="#fff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="54" y="121" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a:1</text>
  <!-- b -->
  <rect x="80" y="104" width="40" height="24" rx="4" fill="#fff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="100" y="121" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b:1</text>
  <!-- c highlight (will lose) -->
  <rect x="126" y="104" width="48" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="121" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">c:2</text>
  <text x="190" y="121" font-size="11" fill="#b85450" filter="url(#rough2)">←失一个</text>
  <text x="34" y="146" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">d1 = 3</text>

  <!-- word2 freq -->
  <text x="34" y="172" font-size="12" font-weight="bold" fill="#223" filter="url(#rough2)">word2</text>
  <!-- a highlight (will lose) -->
  <rect x="34" y="180" width="48" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="58" y="197" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">a:2</text>
  <text x="90" y="197" font-size="11" fill="#b85450" filter="url(#rough2)">←失一个</text>
  <!-- b -->
  <rect x="34" y="210" width="40" height="24" rx="4" fill="#fff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="54" y="227" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b:1</text>
  <!-- c = 0 highlight dashed (will gain) -->
  <rect x="80" y="210" width="48" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="104" y="227" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">c:0</text>
  <text x="136" y="227" font-size="11" fill="#4a7a3a" filter="url(#rough2)">←原无</text>
  <text x="34" y="252" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">d2 = 2</text>

  <!-- verdict before -->
  <rect x="34" y="266" width="212" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="140" y="286" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">3 ≠ 2 不等</text>

  <!-- verdict formula -->
  <text x="140" y="318" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">c1[c]=2≠1 失不减；c1[a]=1≠0 得不增</text>
  <text x="140" y="332" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">nd1=3；nd2=2+1=3</text>

  <!-- ===== center swap arrow ===== -->
  <circle cx="280" cy="150" r="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="146" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">交换</text>
  <text x="280" y="162" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">c↔a</text>
  <path d="M 262 150 L 250 150" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 298 150 L 310 150" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== 交换后 panel ===== -->
  <rect x="300" y="48" width="240" height="290" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="420" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">交换后</text>

  <!-- word1 freq after -->
  <text x="314" y="96" font-size="12" font-weight="bold" fill="#223" filter="url(#rough2)">word1="abac"</text>
  <rect x="314" y="104" width="48" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="338" y="121" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">a:2</text>
  <text x="370" y="121" font-size="11" fill="#4a7a3a" filter="url(#rough2)">得 a</text>
  <rect x="364" y="104" width="40" height="24" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="384" y="121" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b:1</text>
  <rect x="410" y="104" width="40" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="430" y="121" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">c:1</text>
  <text x="456" y="121" font-size="11" fill="#b85450" filter="url(#rough2)">失 c</text>
  <text x="314" y="146" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">d1 = 3</text>

  <!-- word2 freq after -->
  <text x="314" y="172" font-size="12" font-weight="bold" fill="#223" filter="url(#rough2)">word2="cab"</text>
  <rect x="314" y="180" width="40" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="334" y="197" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">a:1</text>
  <text x="360" y="197" font-size="11" fill="#b85450" filter="url(#rough2)">失 a</text>
  <rect x="360" y="180" width="40" height="24" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="380" y="197" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b:1</text>
  <rect x="406" y="180" width="48" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="430" y="197" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">c:1</text>
  <text x="460" y="197" font-size="11" fill="#4a7a3a" filter="url(#rough2)">得 c</text>
  <text x="314" y="227" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">(c 从 0→1，多种)</text>
  <text x="314" y="252" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">d2 = 3</text>

  <!-- verdict after -->
  <rect x="314" y="266" width="212" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="420" y="286" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c4a22" filter="url(#rough2)">3 == 3 相等 ✓ return true</text>

  <text x="420" y="318" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">word2 得到新字符 c ⇒ d2 +1</text>
  <text x="420" y="332" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">恰好补齐 d2 &lt; d1 的差距</text>

  <!-- bottom hint -->
  <rect x="20" y="352" width="520" height="36" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="280" y="372" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">精髓：word1 不同数未变（c 未减光、a 原本在），word2 因「得到新字符 c」多一种、补平差距</text>
</svg>
