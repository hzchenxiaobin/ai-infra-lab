<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="780" height="480" fill="#fafafa"/>

  <text x="390" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：两座 L 形岛 → 8 变换 → 相同规范形</text>
  <path d="M 200 42 Q 390 50 580 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== Island A section (left) ===== -->
  <text x="160" y="70" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">岛屿 A（左上角）</text>

  <!-- A: shape grid 2x2, cell=30 -->
  <g filter="url(#rough2)"><rect x="40" y="82" width="30" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="70" y="82" width="30" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="40" y="112" width="30" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="70" y="112" width="30" height="30" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="2 2"/></g>
  <text x="160" y="103" font-size="11" fill="#444">原始坐标:</text>
  <text x="160" y="120" font-size="11" fill="#2b4a66" font-family="'Comic Sans MS',monospace" font-weight="bold">{(0,0),(0,1),(1,0)}</text>

  <!-- A: arrow down -->
  <path d="M 90 152 L 90 168" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="120" y="164" font-size="10" fill="#888">8 种变换 + 归一化</text>

  <!-- A: 8 transforms table -->
  <g filter="url(#rough2)"><rect x="30" y="172" width="260" height="180" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3"/></g>
  <text x="160" y="190" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">8 组归一化坐标（去重后 4 组）</text>

  <!-- transform 1 (canonical) -->
  <g filter="url(#rough2)"><rect x="40" y="198" width="240" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="50" y="216" font-size="10" fill="#b85450" font-weight="bold">①(x,y) ⑤(y,x)</text>
  <text x="270" y="216" text-anchor="end" font-size="10" fill="#b85450" font-family="'Comic Sans MS',monospace" font-weight="bold">[(0,0),(0,1),(1,0)] ← min</text>

  <!-- transform 2 -->
  <g filter="url(#rough2)"><rect x="40" y="232" width="240" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="50" y="250" font-size="10" fill="#446688">②(x,-y) ⑥(y,-x)</text>
  <text x="270" y="250" text-anchor="end" font-size="10" fill="#446688" font-family="'Comic Sans MS',monospace">[(0,0),(0,1),(1,1)]</text>

  <!-- transform 3 -->
  <g filter="url(#rough2)"><rect x="40" y="266" width="240" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="50" y="284" font-size="10" fill="#446688">③(-x,y) ⑦(-y,x)</text>
  <text x="270" y="284" text-anchor="end" font-size="10" fill="#446688" font-family="'Comic Sans MS',monospace">[(0,0),(1,0),(1,1)]</text>

  <!-- transform 4 -->
  <g filter="url(#rough2)"><rect x="40" y="300" width="240" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="50" y="318" font-size="10" fill="#446688">④(-x,-y) ⑧(-y,-x)</text>
  <text x="270" y="318" text-anchor="end" font-size="10" fill="#446688" font-family="'Comic Sans MS',monospace">[(0,0),(1,-1),(1,0)]</text>

  <text x="160" y="345" text-anchor="middle" font-size="11" fill="#888">排序后最小 = ① → 规范形</text>

  <!-- A: canonical result -->
  <g filter="url(#rough2)"><rect x="50" y="358" width="220" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="160" y="378" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" font-family="'Comic Sans MS',monospace">[(0,0),(0,1),(1,0)]</text>

  <!-- ===== Island B section (right) ===== -->
  <text x="600" y="70" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">岛屿 B（右下角）</text>

  <!-- B: shape grid 2x2, cell=30 -->
  <g filter="url(#rough2)"><rect x="480" y="82" width="30" height="30" rx="3" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="2 2"/></g>
  <g filter="url(#rough2)"><rect x="510" y="82" width="30" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="480" y="112" width="30" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="510" y="112" width="30" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="570" y="103" font-size="11" fill="#444">原始坐标:</text>
  <text x="570" y="120" font-size="11" fill="#2e5a26" font-family="'Comic Sans MS',monospace" font-weight="bold">{(0,1),(1,0),(1,1)}</text>

  <!-- B: arrow down -->
  <path d="M 530 152 L 530 168" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="560" y="164" font-size="10" fill="#888">8 种变换 + 归一化</text>

  <!-- B: 8 transforms table -->
  <g filter="url(#rough2)"><rect x="470" y="172" width="260" height="180" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3"/></g>
  <text x="600" y="190" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">8 组归一化坐标（去重后 4 组）</text>

  <!-- transform 1 -->
  <g filter="url(#rough2)"><rect x="480" y="198" width="240" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <text x="490" y="216" font-size="10" fill="#4a7a3a">①(x,y) ⑤(y,x)</text>
  <text x="710" y="216" text-anchor="end" font-size="10" fill="#4a7a3a" font-family="'Comic Sans MS',monospace">[(0,0),(1,-1),(1,0)]</text>

  <!-- transform 2 -->
  <g filter="url(#rough2)"><rect x="480" y="232" width="240" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <text x="490" y="250" font-size="10" fill="#4a7a3a">②(x,-y) ⑥(y,-x)</text>
  <text x="710" y="250" text-anchor="end" font-size="10" fill="#4a7a3a" font-family="'Comic Sans MS',monospace">[(0,0),(1,0),(1,1)]</text>

  <!-- transform 3 -->
  <g filter="url(#rough2)"><rect x="480" y="266" width="240" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <text x="490" y="284" font-size="10" fill="#4a7a3a">③(-x,y) ⑦(-y,x)</text>
  <text x="710" y="284" text-anchor="end" font-size="10" fill="#4a7a3a" font-family="'Comic Sans MS',monospace">[(0,0),(0,1),(1,1)]</text>

  <!-- transform 4 (canonical) -->
  <g filter="url(#rough2)"><rect x="480" y="300" width="240" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="490" y="318" font-size="10" fill="#b85450" font-weight="bold">④(-x,-y) ⑧(-y,-x)</text>
  <text x="710" y="318" text-anchor="end" font-size="10" fill="#b85450" font-family="'Comic Sans MS',monospace" font-weight="bold">[(0,0),(0,1),(1,0)] ← min</text>

  <text x="600" y="345" text-anchor="middle" font-size="11" fill="#888">排序后最小 = ④ → 规范形</text>

  <!-- B: canonical result -->
  <g filter="url(#rough2)"><rect x="490" y="358" width="220" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="600" y="378" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" font-family="'Comic Sans MS',monospace">[(0,0),(0,1),(1,0)]</text>

  <!-- ===== bottom: comparison + result ===== -->
  <!-- both arrows converge -->
  <path d="M 160 390 Q 160 410 300 418" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="5 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 600 390 Q 600 410 460 418" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="5 3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- equal sign -->
  <g filter="url(#rough2)"><rect x="300" y="408" width="160" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="380" y="429" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">规范形相同！</text>

  <!-- result -->
  <path d="M 380 440 L 380 452" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="300" y="454" width="160" height="22" rx="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="380" y="470" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">不同岛屿 = 1</text>
</svg>
