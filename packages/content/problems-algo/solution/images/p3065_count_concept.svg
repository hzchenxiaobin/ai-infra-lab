<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="246" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：每次操作恰好删掉一个红格 —— 答案就是红格个数</text>

  <!-- k tag -->
  <rect x="408" y="36" width="92" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="454" y="54" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">阈值 k = 10</text>

  <!-- array cells -->
  <rect x="114" y="58" width="52" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="140" y="83" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="174" y="58" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="200" y="83" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">11</text>
  <rect x="234" y="58" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="83" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">10</text>
  <rect x="294" y="58" width="52" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="320" y="83" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="354" y="58" width="52" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="380" y="83" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- per-cell tags -->
  <text x="140" y="116" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">&lt; k · 要删</text>
  <text x="200" y="116" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">≥ k · 保留</text>
  <text x="260" y="116" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">≥ k · 保留</text>
  <text x="320" y="116" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">&lt; k · 要删</text>
  <text x="380" y="116" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">&lt; k · 要删</text>

  <path d="M 246 126 L 246 146" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- invariant box -->
  <rect x="48" y="150" width="424" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="174" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">不变量：只要数组里还有红格（值 &lt; k），当前最小值必是红格</text>
  <text x="260" y="196" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">→ 「删最小」每次恰好删掉一个红格，绝不会误删绿格</text>

  <path d="M 246 212 L 246 230" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- conclusion box -->
  <rect x="48" y="234" width="424" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="256" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">答案 = 红格个数 = #{ x ∈ nums : x &lt; k }</text>
  <text x="260" y="278" text-anchor="middle" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">本例：2、1、3 共三个红格 → 最少 3 次操作</text>

  <!-- bottom hint -->
  <rect x="48" y="308" width="424" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="326" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">「删最小」只是叙事方式——删除顺序不影响要删的集合，</text>
  <text x="260" y="343" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">一次遍历计数即可，排序和堆统统不需要</text>
</svg>
