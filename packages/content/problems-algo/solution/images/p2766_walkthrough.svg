<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">示例 1 演算：nums=[1,6,7,8]</text>

  <!-- ===== Header row ===== -->
  <g filter="url(#rough2)">
    <rect x="20" y="50" width="70" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="55" y="69" text-anchor="middle" font-size="12" fill="#7a5a20">步骤</text>
    <rect x="92" y="50" width="110" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="147" y="69" text-anchor="middle" font-size="12" fill="#7a5a20">操作 (from→to)</text>
    <rect x="204" y="50" width="336" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="372" y="69" text-anchor="middle" font-size="12" fill="#7a5a20">集合 S 的状态</text>
  </g>

  <!-- ===== Row 0: init ===== -->
  <g filter="url(#rough2)">
    <rect x="20" y="82" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="55" y="104" text-anchor="middle" font-size="12" fill="#333">初始</text>
    <rect x="92" y="82" width="110" height="34" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="147" y="104" text-anchor="middle" font-size="12" fill="#888">—</text>
    <!-- {1,6,7,8} -->
    <rect x="214" y="86" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="236" y="104" text-anchor="middle" font-size="12" fill="#333">1</text>
    <rect x="262" y="86" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="284" y="104" text-anchor="middle" font-size="12" fill="#333">6</text>
    <rect x="310" y="86" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="332" y="104" text-anchor="middle" font-size="12" fill="#333">7</text>
    <rect x="358" y="86" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="380" y="104" text-anchor="middle" font-size="12" fill="#333">8</text>
  </g>

  <!-- ===== Row 1: 1→2 ===== -->
  <g filter="url(#rough2)">
    <rect x="20" y="120" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="55" y="142" text-anchor="middle" font-size="12" fill="#333">i=0</text>
    <rect x="92" y="120" width="110" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="147" y="142" text-anchor="middle" font-size="12" fill="#b85450">1 → 2</text>
    <!-- 1 crossed out, 2 green new -->
    <rect x="214" y="124" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3"/>
    <text x="236" y="142" text-anchor="middle" font-size="12" fill="#999">1</text>
    <path d="M218,128 L254,146 M218,146 L254,128" stroke="#b85450" stroke-width="1.5" fill="none"/>
    <rect x="262" y="124" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/>
    <text x="284" y="142" text-anchor="middle" font-size="12" fill="#333">2</text>
    <rect x="310" y="124" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="332" y="142" text-anchor="middle" font-size="12" fill="#333">6</text>
    <rect x="358" y="124" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="380" y="142" text-anchor="middle" font-size="12" fill="#333">7</text>
    <rect x="406" y="124" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="428" y="142" text-anchor="middle" font-size="12" fill="#333">8</text>
  </g>

  <!-- ===== Row 2: 7→9 ===== -->
  <g filter="url(#rough2)">
    <rect x="20" y="158" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="55" y="180" text-anchor="middle" font-size="12" fill="#333">i=1</text>
    <rect x="92" y="158" width="110" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="147" y="180" text-anchor="middle" font-size="12" fill="#b85450">7 → 9</text>
    <!-- {2,6,8,9} : 7 crossed, 9 new -->
    <rect x="214" y="162" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="236" y="180" text-anchor="middle" font-size="12" fill="#333">2</text>
    <rect x="262" y="162" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="284" y="180" text-anchor="middle" font-size="12" fill="#333">6</text>
    <rect x="310" y="162" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3"/>
    <text x="332" y="180" text-anchor="middle" font-size="12" fill="#999">7</text>
    <path d="M314,166 L350,184 M314,184 L350,166" stroke="#b85450" stroke-width="1.5" fill="none"/>
    <rect x="358" y="162" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="380" y="180" text-anchor="middle" font-size="12" fill="#333">8</text>
    <rect x="406" y="162" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/>
    <text x="428" y="180" text-anchor="middle" font-size="12" fill="#333">9</text>
  </g>

  <!-- ===== Row 3: 2→5 ===== -->
  <g filter="url(#rough2)">
    <rect x="20" y="196" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="55" y="218" text-anchor="middle" font-size="12" fill="#333">i=2</text>
    <rect x="92" y="196" width="110" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="147" y="218" text-anchor="middle" font-size="12" fill="#b85450">2 → 5</text>
    <!-- {5,6,8,9} : 2 crossed, 5 new -->
    <rect x="214" y="200" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3"/>
    <text x="236" y="218" text-anchor="middle" font-size="12" fill="#999">2</text>
    <path d="M218,204 L254,222 M218,222 L254,204" stroke="#b85450" stroke-width="1.5" fill="none"/>
    <rect x="262" y="200" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/>
    <text x="284" y="218" text-anchor="middle" font-size="12" fill="#333">5</text>
    <rect x="310" y="200" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="332" y="218" text-anchor="middle" font-size="12" fill="#333">6</text>
    <rect x="358" y="200" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="380" y="218" text-anchor="middle" font-size="12" fill="#333">8</text>
    <rect x="406" y="200" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="428" y="218" text-anchor="middle" font-size="12" fill="#333">9</text>
  </g>

  <!-- ===== Final row ===== -->
  <g filter="url(#rough2)">
    <rect x="20" y="240" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="55" y="262" text-anchor="middle" font-size="12" fill="#333">排序</text>
    <rect x="92" y="240" width="110" height="34" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="147" y="262" text-anchor="middle" font-size="12" fill="#888">sort(S)</text>
    <rect x="214" y="244" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="236" y="262" text-anchor="middle" font-size="12" fill="#333">5</text>
    <rect x="262" y="244" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="284" y="262" text-anchor="middle" font-size="12" fill="#333">6</text>
    <rect x="310" y="244" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="332" y="262" text-anchor="middle" font-size="12" fill="#333">8</text>
    <rect x="358" y="244" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="380" y="262" text-anchor="middle" font-size="12" fill="#333">9</text>
  </g>

  <!-- legend -->
  <rect x="20" y="300" width="520" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="35" y="322" font-size="12" fill="#7a5a20" filter="url(#rough2)">图例：</text>
  <rect x="80" y="312" width="22" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="110" y="324" font-size="11" fill="#555" filter="url(#rough2)">已有石块</text>
  <rect x="180" y="312" width="22" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="210" y="324" font-size="11" fill="#555" filter="url(#rough2)">被移走的源（× 删除）</text>
  <rect x="340" y="312" width="22" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="370" y="324" font-size="11" fill="#555" filter="url(#rough2)">新加入的目的</text>

  <text x="35" y="352" font-size="11" fill="#7a5a20" filter="url(#rough2)">每步只做两件事：把 from 从集合删掉、把 to 加入集合。删前 from 必在集合中（题面保证 from 处有石块）。</text>
  <text x="35" y="370" font-size="11" fill="#7a5a20" filter="url(#rough2)">最终 [5,6,8,9] 与示例输出一致 ✓</text>
</svg>
