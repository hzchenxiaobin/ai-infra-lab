<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 414"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="414" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：贪心分配 → 各字母 (频次 × 成本) → 求和</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">不同字母数 ≤ 9 时全部进档 1；超过则第 10 个起进档 2</text>

  <!-- ===== Panel 1: apple ===== -->
  <rect x="24" y="58" width="512" height="148" fill="#fafafa" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="40" y="82" font-size="12.5" fill="#333" font-weight="bold">示例 1：s = "apple"</text>
  <rect x="466" y="66" width="58" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="495" y="85" text-anchor="middle" font-size="13" fill="#7a2e2a" font-weight="bold">5</text>

  <text x="40" y="108" font-size="11" fill="#555">频次（降序）：p:2, a:1, l:1, e:1 —— 仅 4 个不同字母</text>

  <rect x="40" y="118" width="180" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="143" text-anchor="middle" font-size="11" fill="#2f5a22" font-weight="bold">档 1 ×1（4 个）</text>

  <text x="236" y="135" font-size="11" fill="#888">全部塞进档 1</text>
  <text x="236" y="151" font-size="9.5" fill="#888">（4 ≤ 9）</text>

  <text x="40" y="184" font-size="12.5" fill="#333" font-weight="bold">ans = (2 + 1 + 1 + 1) × 1 = 5 ✓</text>

  <!-- ===== Panel 2: abcdefghijkl ===== -->
  <rect x="24" y="218" width="512" height="178" fill="#fafafa" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="40" y="244" font-size="12.5" fill="#333" font-weight="bold">示例 2：s = "abcdefghijkl"</text>
  <rect x="466" y="228" width="58" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="495" y="247" text-anchor="middle" font-size="13" fill="#7a2e2a" font-weight="bold">15</text>

  <text x="40" y="270" font-size="11" fill="#555">频次：12 个不同字母，各出现 1 次</text>

  <rect x="40" y="282" width="226" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="153" y="309" text-anchor="middle" font-size="11" fill="#2f5a22" font-weight="bold">档 1 ×1（9 个：a..i）</text>

  <rect x="276" y="282" width="170" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="361" y="309" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">档 2 ×2（3 个：j,k,l）</text>

  <text x="460" y="305" font-size="9.5" fill="#888">第 10 个</text>
  <text x="460" y="318" font-size="9.5" fill="#888">起进档 2</text>

  <text x="40" y="356" font-size="12.5" fill="#333" font-weight="bold">ans = 9×1 + 3×2 = 9 + 6 = 15 ✓</text>

  <!-- footer note -->
  <text x="280" y="390" text-anchor="middle" font-size="10" fill="#888">仅当不同字母数 &gt; 9 时才用得到档 2；&gt; 18 时才用得到档 3</text>
  <text x="280" y="404" text-anchor="middle" font-size="10" fill="#888">极端：26 个字母全出现 ⟹ 9×1 + 9×2 + 8×3 = 51 为单字符全频次 1 的最大开销</text>
</svg>
