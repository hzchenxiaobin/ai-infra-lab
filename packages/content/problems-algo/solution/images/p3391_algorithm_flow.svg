<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：幂等检查 + 键同步维护</text>
  <text x="260" y="42" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">构造 Matrix3D(n)：cnt 全 0，集合初始 {(0,0), (0,1), …, (0,n−1)} —— 全 0 并列时答案天然是 0</text>

  <!-- 列 1：setCell -->
  <rect x="45" y="56" width="130" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="110" y="73" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">setCell(x, y, z)</text>
  <path d="M 110 82 L 110 92" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <polygon points="110,92 165,121 110,150 55,121" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="125" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">该格已是 1？</text>
  <text x="170" y="125" font-size="10" fill="#777" filter="url(#rough2)">是 ⇒ return</text>

  <path d="M 110 150 L 110 162" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="120" y="160" font-size="10" fill="#777" filter="url(#rough2)">否</text>
  <rect x="45" y="162" width="130" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="178" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">cells 加入 (x,y,z)</text>
  <path d="M 110 186 L 110 198" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="45" y="198" width="130" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="110" y="214" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">touch(x, +1)</text>

  <!-- 列 2：unsetCell -->
  <rect x="195" y="56" width="130" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="73" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">unsetCell(x, y, z)</text>
  <path d="M 260 82 L 260 92" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <polygon points="260,92 315,121 260,150 205,121" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="125" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">该格已是 0？</text>
  <text x="320" y="125" font-size="10" fill="#777" filter="url(#rough2)">是 ⇒ return</text>

  <path d="M 260 150 L 260 162" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="270" y="160" font-size="10" fill="#777" filter="url(#rough2)">否</text>
  <rect x="195" y="162" width="130" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="178" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">cells 删除 (x,y,z)</text>
  <path d="M 260 186 L 260 198" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="195" y="198" width="130" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="214" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">touch(x, −1)</text>

  <!-- 列 3：largestMatrix -->
  <rect x="345" y="56" width="130" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="410" y="73" text-anchor="middle" font-size="11.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">largestMatrix()</text>
  <path d="M 410 82 L 410 98" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="335" y="98" width="150" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="116" text-anchor="middle" font-size="10.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">直接返回集合首键的下标</text>
  <text x="410" y="134" text-anchor="middle" font-size="10" fill="#8a6a1f" filter="url(#rough2)">s.begin()−&gt;second，O(1)</text>
  <text x="410" y="164" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">查询零维护：读现成答案</text>

  <!-- 共用 touch 框 -->
  <path d="M 110 222 L 110 248" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 260 222 L 260 248" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="45" y="248" width="430" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="268" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">touch(x, d)：键同步三步，每步 O(log n)</text>
  <text x="260" y="286" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">① 集合 erase({−cnt[x], x})  →  ② cnt[x] += d  →  ③ 集合 insert({−cnt[x], x})</text>
  <text x="260" y="302" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">旧键先删、新键再插 —— 键值与 cnt[x] 永远同步</text>

  <!-- 坑提示框 -->
  <rect x="45" y="322" width="430" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="342" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠️ 本题最大的坑：幂等</text>
  <text x="260" y="360" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">setCell / unsetCell 必须先查旧值：重复 set 同一格、unset 空格都要原地返回</text>
  <text x="260" y="376" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">否则 cnt 重复加减、集合键错乱，largestMatrix 全盘皆错</text>
</svg>
