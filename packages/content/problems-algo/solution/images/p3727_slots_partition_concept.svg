<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：平方抹符号 + 正负槽分区</text>

  <!-- 面板一：平方抹符号 -->
  <rect x="18" y="30" width="484" height="74" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="50" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">① 平方抹掉符号——负数是烟雾弹</text>

  <rect x="46" y="58" width="44" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="68" y="76" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">−3</text>

  <rect x="100" y="58" width="44" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="122" y="76" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>

  <path d="M 92 71 L 178 71" fill="none" stroke="#446688" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 146 71 L 178 71" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <circle cx="200" cy="71" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="76" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">x²</text>

  <path d="M 219 71 L 232 71" fill="none" stroke="#446688" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="236" y="58" width="44" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="258" y="76" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">9</text>

  <text x="300" y="66" font-size="11" fill="#333" filter="url(#rough2)">(−3)² = 3² = 9</text>
  <text x="300" y="82" font-size="10" fill="#666" filter="url(#rough2)">符号蒸发 ⇒ 只看 |x|，先变换再排序</text>

  <!-- 面板二：槽位等价 -->
  <rect x="18" y="112" width="484" height="88" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="130" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">② 槽位等价：偶下标全是「+ 槽」（⌈n/2⌉ 个），奇下标全是「− 槽」（⌊n/2⌋ 个）</text>
  <text x="260" y="145" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">同侧槽位任意换位得分不变 ⇒ 重排 ≡ 分组：谁进正槽？</text>

  <rect x="74" y="152" width="52" height="26" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="170" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">+x²</text>
  <rect x="136" y="152" width="52" height="26" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="162" y="170" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">−x²</text>
  <rect x="198" y="152" width="52" height="26" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="224" y="170" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">+x²</text>
  <rect x="260" y="152" width="52" height="26" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="286" y="170" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">−x²</text>
  <rect x="322" y="152" width="52" height="26" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="348" y="170" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">+x²</text>
  <rect x="384" y="152" width="52" height="26" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="410" y="170" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">−x²</text>

  <text x="100" y="192" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="162" y="192" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="224" y="192" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="286" y="192" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>
  <text x="348" y="192" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">4</text>
  <text x="410" y="192" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">5</text>

  <!-- 面板三：降序平方分组 -->
  <rect x="18" y="208" width="484" height="96" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="226" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">③ 降序平方取前 k = ⌈n/2⌉ 个进正槽（示例 2，k = 3）</text>

  <rect x="60" y="236" width="52" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="86" y="255" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">+9</text>
  <rect x="122" y="236" width="52" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="148" y="255" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">+9</text>
  <rect x="184" y="236" width="52" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="210" y="255" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">+4</text>

  <path d="M 252 232 L 252 268" fill="none" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <rect x="266" y="236" width="52" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="292" y="255" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">−4</text>
  <rect x="328" y="236" width="52" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="354" y="255" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">−1</text>
  <rect x="390" y="236" width="52" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="416" y="255" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">−1</text>

  <text x="148" y="284" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">正槽和 pos = 22</text>
  <text x="354" y="284" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">负槽和 neg = 6</text>
  <text x="260" y="300" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">score = 22 − 6 = 16 ✓（n=6，k=3）</text>

  <!-- 底部公式 -->
  <rect x="18" y="312" width="484" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="330" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">score = 2·Σₚ x² − Σx²（平方总和为常数）⇒ 正槽取前 ⌈n/2⌉ 大</text>
  <text x="260" y="346" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">交换论证：a ∈ 负槽、b ∈ 正槽 且 a² &gt; b² 时，换位增益 2(a² − b²) &gt; 0</text>
</svg>
