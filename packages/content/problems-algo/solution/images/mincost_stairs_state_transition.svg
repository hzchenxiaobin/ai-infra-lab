<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">状态转移：dp(i) = min(dp(i−1), dp(i−2)) + cost[i]</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">到达并支付第 i 阶，只能从 i−1 或 i−2 跨上来，取花费更小者</text>

  <!-- ===== Stairs ===== -->
  <g font-size="10" fill="#333">
    <!-- step i-2 -->
    <rect x="55" y="250" width="80" height="55" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="95" y="272" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">i−2 阶</text>
    <text x="95" y="288" text-anchor="middle" font-size="9" fill="#446688">dp(i−2)</text>
    <text x="95" y="300" text-anchor="middle" font-size="9" fill="#888">cost[i−2]</text>

    <!-- step i-1 -->
    <rect x="180" y="190" width="80" height="55" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="220" y="212" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">i−1 阶</text>
    <text x="220" y="228" text-anchor="middle" font-size="9" fill="#4a7a3a">dp(i−1)</text>
    <text x="220" y="240" text-anchor="middle" font-size="9" fill="#888">cost[i−1]</text>

    <!-- step i -->
    <rect x="320" y="120" width="80" height="55" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="360" y="142" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">i 阶</text>
    <text x="360" y="158" text-anchor="middle" font-size="9" fill="#b85450">dp(i)</text>
    <text x="360" y="170" text-anchor="middle" font-size="9" fill="#888">cost[i]</text>
  </g>

  <!-- arrow from i-2 to i (climb 2) -->
  <path d="M 135 260 Q 230 170 315 145" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="170" y="172" width="64" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="202" y="187" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">跨 2 阶</text>

  <!-- arrow from i-1 to i (climb 1) -->
  <path d="M 260 205 Q 295 175 315 150" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="268" y="150" width="64" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="300" y="165" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">跨 1 阶</text>

  <!-- ===== min choice annotation ===== -->
  <rect x="180" y="320" width="220" height="30" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="290" y="340" text-anchor="middle" font-size="10.5" fill="#555">两条路都需再付 cost[i]，挑更省的那条</text>

  <!-- ===== Formula ===== -->
  <rect x="55" y="355" width="410" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="370" text-anchor="middle" font-family="monospace" font-size="12" fill="#333" font-weight="bold">dp(i) = min( dp(i−1), dp(i−2) ) + cost[i]</text>
</svg>
