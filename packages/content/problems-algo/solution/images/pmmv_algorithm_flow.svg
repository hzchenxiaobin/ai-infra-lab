<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">Dijkstra 变体算法流程：最大化路径最小值</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">距离定义改为 min(A[路径])，堆按「当前得分」取最大者弹出</text>

  <!-- 1. 初始化 -->
  <rect x="170" y="62" width="220" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="82" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">初始化</text>
  <text x="280" y="98" text-anchor="middle" font-size="10" fill="#446688">dist 网格 = −1；dist[0][0] = A[0][0]</text>

  <path d="M 280 110 L 280 124" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. push start -->
  <rect x="150" y="126" width="260" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="151" text-anchor="middle" font-size="10" fill="#d6a040">大根堆 push (A[0][0], (0,0))</text>

  <path d="M 280 168 L 280 182" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. loop: pop max -->
  <rect x="120" y="184" width="320" height="40" fill="#f6f6f6" stroke="#888" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="209" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">弹出堆顶 (d, u)：d 最大的「路径得分」</text>

  <path d="M 280 226 L 280 240" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4. decision: d < dist[u] ? -->
  <polygon points="280,242 400,290 280,338 160,290" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="286" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">d &lt; dist[u] ?</text>
  <text x="280" y="302" text-anchor="middle" font-size="9" fill="#888">懒删除判定</text>

  <!-- yes branch: skip -->
  <path d="M 400 290 L 440 290" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="412" y="284" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="442" y="272" width="100" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="492" y="295" text-anchor="middle" font-size="10" fill="#b85450">跳过（过期）</text>

  <!-- no branch -->
  <path d="M 280 338 L 280 352" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="350" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- 5. decision: u == end ? -->
  <polygon points="280,354 400,396 280,438 160,396" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="393" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">u == (R−1,C−1) ?</text>

  <!-- yes: return d -->
  <path d="M 400 396 L 446 396" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="416" y="390" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="448" y="378" width="96" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="496" y="402" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回 d</text>

  <!-- no: relax neighbors -->
  <path d="M 160 396 L 120 396 L 120 210 L 120 210" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="92" y="308" font-size="10" fill="#446688" font-weight="bold">否</text>

  <!-- relax box (left side) -->
  <rect x="36" y="246" width="160" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="116" y="266" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">松弛四邻格 v</text>
  <text x="116" y="286" text-anchor="middle" font-size="10" fill="#446688">nd = min(d, A[v])</text>
  <text x="116" y="304" text-anchor="middle" font-size="10" fill="#446688">若 nd &gt; dist[v]：</text>
  <text x="116" y="320" text-anchor="middle" font-size="10" fill="#446688">  dist[v] = nd</text>
  <text x="116" y="336" text-anchor="middle" font-size="10" fill="#446688">  push (nd, v)</text>

  <!-- loop back arrow label -->
  <text x="74" y="202" font-size="9" fill="#888">回到弹堆顶</text>

  <!-- footer comparison -->
  <rect x="36" y="420" width="488" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="438" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">与 778 的差异：778 用最小堆 + max 聚合（最小化最大值）；本题用最大堆 + min 聚合（最大化最小值）</text>
  <text x="280" y="454" text-anchor="middle" font-size="10" fill="#888">松弛条件 nd &gt; dist[v]（越大越好），弹出最大者即确定该格最优得分</text>
</svg>
