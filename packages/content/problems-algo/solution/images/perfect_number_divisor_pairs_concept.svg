<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：因子成对出现，只枚举到 √num</text>
  <text x="280" y="46" text-anchor="middle" font-size="11.5" fill="#888">以 num = 28 为例，√28 ≈ 5.3</text>

  <!-- ===== top row: small divisors i = 1..6 ===== -->
  <text x="40" y="96" font-size="11.5" fill="#446688" font-weight="bold">枚举 i</text>

  <!-- i = 1 -->
  <rect x="70" y="78" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="93" y="97" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <!-- i = 2 -->
  <rect x="130" y="78" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="153" y="97" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <!-- i = 3 (not a divisor) -->
  <rect x="190" y="78" width="46" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="213" y="97" text-anchor="middle" font-size="13" fill="#999">3</text>
  <line x1="196" y1="84" x2="230" y2="100" stroke="#bbb" stroke-width="1.4" filter="url(#rough2)"/>
  <!-- i = 4 -->
  <rect x="250" y="78" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="273" y="97" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <!-- i = 5 (not a divisor) -->
  <rect x="310" y="78" width="46" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="333" y="97" text-anchor="middle" font-size="13" fill="#999">5</text>
  <line x1="316" y1="84" x2="350" y2="100" stroke="#bbb" stroke-width="1.4" filter="url(#rough2)"/>
  <!-- i = 6 (beyond sqrt, stop) -->
  <rect x="370" y="78" width="46" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="3 3" rx="4" filter="url(#rough2)"/>
  <text x="393" y="97" text-anchor="middle" font-size="13" fill="#b85450">6</text>
  <text x="424" y="97" font-size="10.5" fill="#b85450" font-weight="bold">i*i&gt;28，停！</text>

  <!-- sqrt boundary -->
  <line x1="351" y1="68" x2="351" y2="252" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="356" y="62" font-size="10.5" fill="#d6a040" font-weight="bold">√28 ≈ 5.3</text>

  <!-- ===== connecting curves (pairs) ===== -->
  <!-- 1 -> 28 -->
  <path d="M 93 108 Q 93 160 93 210" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- 2 -> 14 -->
  <path d="M 153 108 Q 165 160 178 210" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- 4 -> 7 -->
  <path d="M 273 108 Q 245 160 218 210" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== bottom row: counterpart num / i ===== -->
  <text x="40" y="232" font-size="11.5" fill="#4a7a3a" font-weight="bold">配对因子</text>

  <!-- counterpart of 1 = 28 (excluded, num itself) -->
  <rect x="70" y="214" width="46" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="93" y="233" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">28</text>
  <line x1="76" y1="220" x2="112" y2="238" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="93" y="258" text-anchor="middle" font-size="9.5" fill="#b85450">num 本身，排除</text>

  <!-- counterpart of 2 = 14 -->
  <rect x="155" y="214" width="46" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="178" y="233" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">14</text>

  <!-- counterpart of 4 = 7 -->
  <rect x="195" y="214" width="46" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="218" y="233" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">7</text>

  <!-- ===== summary equation ===== -->
  <line x1="40" y1="288" x2="520" y2="288" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <text x="40" y="312" font-size="12" fill="#555" font-weight="bold">真因子之和：</text>
  <text x="140" y="312" font-size="13" fill="#446688" font-weight="bold">1</text>
  <text x="158" y="312" font-size="13" fill="#888">+</text>
  <text x="174" y="312" font-size="13" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="190" y="312" font-size="13" fill="#888">+</text>
  <text x="206" y="312" font-size="13" fill="#4a7a3a" font-weight="bold">14</text>
  <text x="232" y="312" font-size="13" fill="#888">+</text>
  <text x="252" y="312" font-size="13" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="268" y="312" font-size="13" fill="#888">+</text>
  <text x="286" y="312" font-size="13" fill="#4a7a3a" font-weight="bold">7</text>
  <text x="308" y="312" font-size="13" fill="#888">=</text>
  <rect x="328" y="298" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="353" y="314" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">28</text>
  <text x="390" y="312" font-size="11.5" fill="#4a7a3a" font-weight="bold">→ 等于 num，是完美数 ✓</text>

  <text x="40" y="346" font-size="10.5" fill="#888">💡 枚举范围从 O(num) 缩到 O(√num)；每个 i 命中即可一次性收齐「i」与「num/i」两个因子</text>
</svg>
