<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">数据结构：HashMap&lt;key, 有序版本列表&gt;</text>

  <!-- HashMap bucket -->
  <rect x="40" y="60" width="120" height="180" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="100" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">HashMap</text>
  <line x1="52" y1="90" x2="148" y2="90" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <text x="58" y="112" font-size="11" fill="#888">key</text>
  <text x="140" y="112" text-anchor="end" font-size="11" fill="#888">→ list</text>

  <rect x="52" y="120" width="44" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="74" y="137" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">foo</text>

  <rect x="52" y="158" width="44" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="74" y="175" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">love</text>

  <rect x="52" y="196" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="74" y="213" text-anchor="middle" font-size="10" fill="#888">...</text>

  <!-- arrow from foo to version list -->
  <path d="M 96 132 L 180 132" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- version list for foo -->
  <text x="180" y="104" font-size="10" fill="#888">timestamps 严格递增 → 天然有序</text>
  <rect x="180" y="112" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="130" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="210" y="145" text-anchor="middle" font-size="9" fill="#888">bar</text>

  <rect x="240" y="112" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="130" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="270" y="145" text-anchor="middle" font-size="9" fill="#888">bar2</text>

  <rect x="300" y="112" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="130" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7</text>
  <text x="330" y="145" text-anchor="middle" font-size="9" fill="#888">bar3</text>

  <!-- query box -->
  <rect x="180" y="186" width="300" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="330" y="206" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">get("foo", timestamp = 3)</text>
  <text x="330" y="224" text-anchor="middle" font-size="11" fill="#b85450">在 [1, 4, 7] 上二分找「≤ 3 的最大」</text>

  <!-- result arrow -->
  <path d="M 210 152 L 210 186" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="4,2" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- result box -->
  <rect x="180" y="250" width="300" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="330" y="272" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">命中 ts = 1（≤ 3 的最大）</text>
  <text x="330" y="292" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">→ 返回 value = "bar"</text>

  <!-- takeaway -->
  <rect x="40" y="316" width="440" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="338" text-anchor="middle" font-size="11.5" fill="#444">set: O(1) 追加   ·   get: O(log m) 二分   ·   m 为该 key 的版本数</text>
</svg>
