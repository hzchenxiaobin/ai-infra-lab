<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：key = "love"</text>

  <!-- set phase -->
  <text x="40" y="56" font-size="11.5" fill="#888" font-weight="bold">写入两版后，版本列表：</text>

  <text x="40" y="86" font-size="11" fill="#888">ts:</text>
  <rect x="90" y="70" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="92" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">10</text>
  <rect x="170" y="70" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="92" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">20</text>

  <text x="40" y="122" font-size="11" fill="#888">val:</text>
  <rect x="90" y="106" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="128" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">high</text>
  <rect x="170" y="106" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="128" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">low</text>

  <text x="130" y="158" text-anchor="middle" font-size="9" fill="#aaa">idx 0</text>
  <text x="210" y="158" text-anchor="middle" font-size="9" fill="#aaa">idx 1</text>

  <!-- query table header -->
  <rect x="300" y="62" width="220" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="81" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">get(ts)</text>
  <text x="470" y="81" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">返回</text>
  <line x1="410" y1="62" x2="410" y2="90" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>

  <!-- rows -->
  <rect x="300" y="92" width="220" height="26" fill="#fafafa" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="360" y="110" text-anchor="middle" font-size="11" fill="#333">get(5)</text>
  <text x="470" y="110" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">""</text>
  <line x1="410" y1="92" x2="410" y2="118" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>

  <rect x="300" y="120" width="220" height="26" fill="#fafafa" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="360" y="138" text-anchor="middle" font-size="11" fill="#333">get(10)</text>
  <text x="470" y="138" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">high</text>
  <line x1="410" y1="120" x2="410" y2="146" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>

  <rect x="300" y="148" width="220" height="26" fill="#fafafa" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="360" y="166" text-anchor="middle" font-size="11" fill="#333">get(15)</text>
  <text x="470" y="166" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">high</text>
  <line x1="410" y1="148" x2="410" y2="174" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>

  <rect x="300" y="176" width="220" height="26" fill="#fafafa" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="360" y="194" text-anchor="middle" font-size="11" fill="#333">get(20)</text>
  <text x="470" y="194" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">low</text>
  <line x1="410" y1="176" x2="410" y2="202" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>

  <rect x="300" y="204" width="220" height="26" fill="#fafafa" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="360" y="222" text-anchor="middle" font-size="11" fill="#333">get(25)</text>
  <text x="470" y="222" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">low</text>
  <line x1="410" y1="204" x2="410" y2="230" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>

  <!-- annotations -->
  <text x="40" y="196" font-size="11" fill="#b85450" font-weight="bold">get(5):</text>
  <text x="40" y="214" font-size="10.5" fill="#555">ts=10 已 &gt; 5 → 无合法版本</text>
  <text x="40" y="230" font-size="10.5" fill="#555">ans = −1 → 返回 ""</text>

  <rect x="30" y="180" width="6" height="56" fill="#b85450" rx="2" filter="url(#rough2)"/>

  <!-- explanation boxes -->
  <rect x="30" y="252" width="480" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="274" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">规律：找「≤ query 的最大 ts」对应的 val</text>
  <text x="270" y="294" text-anchor="middle" font-size="11" fill="#444">query ≥ 20 → 命中 idx1(low)；10 ≤ query &lt; 20 → 命中 idx0(high)；query &lt; 10 → 空</text>

  <!-- footer -->
  <rect x="30" y="320" width="480" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="342" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">正是 upper_bound(query) − 1 的语义</text>
  <text x="270" y="358" text-anchor="middle" font-size="10.5" fill="#555">Python: bisect_right(list, query) − 1</text>
</svg>
