<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一趟遍历 + 左移累加</text>

  <!-- Step 1: init -->
  <rect x="200" y="44" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#333">初始化 ans = 0</text>
  <line x1="280" y1="78" x2="280" y2="100" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: loop condition -->
  <polygon points="280,104 380,140 280,176 180,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="138" text-anchor="middle" font-size="12" fill="#333">head ≠ ∅ ?</text>
  <text x="280" y="154" text-anchor="middle" font-size="11" fill="#888">还有结点?</text>

  <!-- No branch -> return -->
  <line x1="380" y1="140" x2="430" y2="140" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="134" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="434" y="124" width="110" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="489" y="145" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 ans</text>

  <!-- Yes branch -> accumulate -->
  <line x1="280" y1="176" x2="280" y2="196" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="266" y="190" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="120" y="200" width="320" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="217" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans = (ans &lt;&lt; 1) | head-&gt;val</text>
  <text x="280" y="233" text-anchor="middle" font-size="11" fill="#888">左移腾位，填入当前结点的 0/1</text>

  <line x1="280" y1="240" x2="280" y2="260" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: advance -->
  <rect x="180" y="264" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="286" text-anchor="middle" font-size="12" fill="#333">head = head-&gt;next</text>

  <!-- Loop back arrow -->
  <path d="M 180 281 L 100 281 L 100 140 L 180 140" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="108" y="210" font-size="11" fill="#888">回到判断</text>

  <!-- Invariant note -->
  <rect x="60" y="316" width="440" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="74" y="336" font-size="12" fill="#333" font-weight="bold">💡 不变式</text>
  <text x="74" y="354" font-size="11" fill="#555">每处理完第 k 个结点，ans 恰好 = 前 k 位构成的二进制数的十进制值</text>
</svg>
