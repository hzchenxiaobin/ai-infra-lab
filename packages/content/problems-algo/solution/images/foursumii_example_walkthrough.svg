<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：nums1=[1,2] nums2=[-2,-1] nums3=[-1,2] nums4=[0,2]</text>

  <!-- Part 1: Build table -->
  <text x="20" y="54" font-size="12" fill="#4a7a3a" font-weight="bold">第一步：建表（A 组和）</text>

  <!-- table header -->
  <rect x="20" y="62" width="50" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="45" y="77" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">i</text>
  <rect x="70" y="62" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="100" y="77" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">j</text>
  <rect x="130" y="62" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="170" y="77" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">和 a+b</text>
  <rect x="210" y="62" width="170" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="295" y="77" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">count 更新</text>

  <!-- row 1 -->
  <rect x="20" y="84" width="50" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="45" y="98" text-anchor="middle" font-size="9" fill="#333">0</text>
  <rect x="70" y="84" width="60" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="100" y="98" text-anchor="middle" font-size="9" fill="#333">0</text>
  <rect x="130" y="84" width="80" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="170" y="98" text-anchor="middle" font-size="9" fill="#333">-1</text>
  <rect x="210" y="84" width="170" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="295" y="98" text-anchor="middle" font-size="9" fill="#333">{-1:1}</text>

  <!-- row 2 -->
  <rect x="20" y="104" width="50" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="45" y="118" text-anchor="middle" font-size="9" fill="#333">0</text>
  <rect x="70" y="104" width="60" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="100" y="118" text-anchor="middle" font-size="9" fill="#333">1</text>
  <rect x="130" y="104" width="80" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="170" y="118" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">0</text>
  <rect x="210" y="104" width="170" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="295" y="118" text-anchor="middle" font-size="9" fill="#333">{-1:1, 0:1}</text>

  <!-- row 3 -->
  <rect x="20" y="124" width="50" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="45" y="138" text-anchor="middle" font-size="9" fill="#333">1</text>
  <rect x="70" y="124" width="60" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="100" y="138" text-anchor="middle" font-size="9" fill="#333">0</text>
  <rect x="130" y="124" width="80" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="170" y="138" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">0</text>
  <rect x="210" y="124" width="170" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="295" y="138" text-anchor="middle" font-size="9" fill="#333">{-1:1, 0:2}</text>

  <!-- row 4 -->
  <rect x="20" y="144" width="50" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="45" y="158" text-anchor="middle" font-size="9" fill="#333">1</text>
  <rect x="70" y="144" width="60" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="100" y="158" text-anchor="middle" font-size="9" fill="#333">1</text>
  <rect x="130" y="144" width="80" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="170" y="158" text-anchor="middle" font-size="9" fill="#333">1</text>
  <rect x="210" y="144" width="170" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="295" y="158" text-anchor="middle" font-size="9" fill="#333">{-1:1, 0:2, 1:1}</text>

  <text x="400" y="158" font-size="10" fill="#4a7a3a" font-weight="bold">← 建表完成</text>

  <!-- divider -->
  <line x1="20" y1="178" x2="560" y2="178" stroke="#ddd" stroke-width="1" stroke-dasharray="6,4" filter="url(#rough2)"/>

  <!-- Part 2: Query -->
  <text x="20" y="198" font-size="12" fill="#b85450" font-weight="bold">第二步：查表（B 组和取负查 count）</text>

  <!-- query table header -->
  <rect x="20" y="206" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="40" y="221" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">k</text>
  <rect x="60" y="206" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="80" y="221" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">l</text>
  <rect x="100" y="206" width="90" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="145" y="221" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">B 组和 c+d</text>
  <rect x="190" y="206" width="80" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="230" y="221" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">查 −(c+d)</text>
  <rect x="270" y="206" width="60" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="300" y="221" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">命中</text>
  <rect x="330" y="206" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="355" y="221" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">ans</text>

  <!-- query row 1: k=0,l=0 -->
  <rect x="20" y="228" width="40" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="242" text-anchor="middle" font-size="9" fill="#333">0</text>
  <rect x="60" y="228" width="40" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="80" y="242" text-anchor="middle" font-size="9" fill="#333">0</text>
  <rect x="100" y="228" width="90" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="145" y="242" text-anchor="middle" font-size="9" fill="#333">-1</text>
  <rect x="190" y="228" width="80" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="230" y="242" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">1</text>
  <rect x="270" y="228" width="60" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="300" y="242" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">1 ✓</text>
  <rect x="330" y="228" width="50" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="355" y="242" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">1</text>

  <!-- query row 2: k=0,l=1 -->
  <rect x="20" y="248" width="40" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="262" text-anchor="middle" font-size="9" fill="#333">0</text>
  <rect x="60" y="248" width="40" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="80" y="262" text-anchor="middle" font-size="9" fill="#333">1</text>
  <rect x="100" y="248" width="90" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="145" y="262" text-anchor="middle" font-size="9" fill="#333">1</text>
  <rect x="190" y="248" width="80" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="230" y="262" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">-1</text>
  <rect x="270" y="248" width="60" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="300" y="262" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">1 ✓</text>
  <rect x="330" y="248" width="50" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="355" y="262" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">2</text>

  <!-- query row 3: k=1,l=0 -->
  <rect x="20" y="268" width="40" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="282" text-anchor="middle" font-size="9" fill="#333">1</text>
  <rect x="60" y="268" width="40" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="80" y="282" text-anchor="middle" font-size="9" fill="#333">0</text>
  <rect x="100" y="268" width="90" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="145" y="282" text-anchor="middle" font-size="9" fill="#333">2</text>
  <rect x="190" y="268" width="80" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="230" y="282" text-anchor="middle" font-size="9" fill="#888">-2</text>
  <rect x="270" y="268" width="60" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="300" y="282" text-anchor="middle" font-size="9" fill="#888">0</text>
  <rect x="330" y="268" width="50" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="355" y="282" text-anchor="middle" font-size="9" fill="#333">2</text>

  <!-- query row 4: k=1,l=1 -->
  <rect x="20" y="288" width="40" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="302" text-anchor="middle" font-size="9" fill="#333">1</text>
  <rect x="60" y="288" width="40" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="80" y="302" text-anchor="middle" font-size="9" fill="#333">1</text>
  <rect x="100" y="288" width="90" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="145" y="302" text-anchor="middle" font-size="9" fill="#333">4</text>
  <rect x="190" y="288" width="80" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="230" y="302" text-anchor="middle" font-size="9" fill="#888">-4</text>
  <rect x="270" y="288" width="60" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="300" y="302" text-anchor="middle" font-size="9" fill="#888">0</text>
  <rect x="330" y="288" width="50" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="355" y="302" text-anchor="middle" font-size="9" fill="#333">2</text>

  <!-- result box -->
  <rect x="60" y="330" width="300" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="210" y="352" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">最终答案 ans = 2</text>

  <!-- tuple annotations -->
  <text x="20" y="384" font-size="10" fill="#888">命中 1：(0,0,0,1) → 1+(-2)+(-1)+2 = 0</text>
  <text x="20" y="400" font-size="10" fill="#888">命中 2：(1,1,0,0) → 2+(-1)+(-1)+0 = 0</text>
</svg>
