<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="410" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：位掩码当「见过集合」，二次命中即 XOR</text>

  <text x="32" y="54" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">① nums 里每个数至多出现两次</text>

  <rect x="118" y="64" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="84" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="166" y="64" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="84" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="214" y="64" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="236" y="84" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="262" y="64" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="284" y="84" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="174" y="112" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">第1次</text>
  <text x="222" y="112" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">第1次</text>
  <text x="236" y="58" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">第2次!</text>
  <text x="284" y="112" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">第2次!</text>

  <text x="330" y="84" font-size="11" fill="#8a6d3b" filter="url(#rough2)">→ 出现两次的数：1、2</text>
  <rect x="322" y="62" width="166" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="405" y="84" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">答案 = 1 ⊕ 2 = 3</text>

  <text x="32" y="146" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">② seen：一个 64 位整数，第 x 位 = 「x 见过吗」</text>

  <path d="M 236 100 C 236 130 230 140 226 156" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="136" font-size="10" fill="#888" filter="url(#rough2)">x = 2 → 查 seen 第 2 位</text>

  <rect x="110" y="162" width="34" height="34" fill="#f1f1f1" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="127" y="184" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="148" y="162" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="165" y="184" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="186" y="162" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="203" y="184" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="224" y="162" width="34" height="34" fill="#f1f1f1" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="241" y="184" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="262" y="162" width="34" height="34" fill="#f1f1f1" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="279" y="184" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="300" y="162" width="34" height="34" fill="#f1f1f1" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="317" y="184" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="338" y="162" width="34" height="34" fill="#f1f1f1" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="355" y="184" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>

  <text x="127" y="212" text-anchor="middle" font-size="9.5" fill="#bbb" filter="url(#rough2)">bit 0</text>
  <text x="165" y="212" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">bit 1</text>
  <text x="203" y="212" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">bit 2</text>
  <text x="241" y="212" text-anchor="middle" font-size="9.5" fill="#bbb" filter="url(#rough2)">bit 3</text>
  <text x="279" y="212" text-anchor="middle" font-size="9.5" fill="#bbb" filter="url(#rough2)">bit 4</text>
  <text x="317" y="212" text-anchor="middle" font-size="9.5" fill="#bbb" filter="url(#rough2)">bit 5</text>
  <text x="355" y="212" text-anchor="middle" font-size="9.5" fill="#bbb" filter="url(#rough2)">bit 6</text>

  <text x="392" y="172" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">第 2 位是 1</text>
  <text x="392" y="188" font-size="10.5" fill="#b85450" filter="url(#rough2)">→ 第二次见，命中！</text>

  <text x="32" y="244" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">③ 按位判定，二分叉单趟扫描</text>

  <rect x="40" y="258" width="215" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="147" y="282" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">第一次见 x（位是 0）</text>
  <text x="147" y="302" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">seen |= 1 &lt;&lt; x（记下来）</text>

  <rect x="265" y="258" width="215" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="372" y="282" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">第二次见 x（位是 1）</text>
  <text x="372" y="302" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">ans ^= x（累积进答案）</text>

  <rect x="32" y="340" width="456" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="360" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">💡 seen 本质 = 值域 ≤ 64 时的紧凑哈希集合</text>
  <text x="260" y="380" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">置位 = add(x)，查位 = x in seen，一个整数搞定 O(1) 空间</text>
</svg>
