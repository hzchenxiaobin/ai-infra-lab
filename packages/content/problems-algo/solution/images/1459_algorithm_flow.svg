<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    算法流程：自连接 → 过滤 → 求面积 → 排序
  </text>

  <!-- 步骤 1：Points 表 -->
  <rect x="40" y="58" width="130" height="50" rx="8" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="105" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">Points 表</text>
  <text x="105" y="97" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">id, x, y</text>

  <!-- 箭头 1→2 -->
  <line x1="170" y1="83" x2="208" y2="83" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 2：自连接 -->
  <rect x="210" y="58" width="150" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="285" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">自连接</text>
  <text x="285" y="97" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">p1.id &lt; p2.id</text>

  <!-- 箭头 2→3 -->
  <line x1="360" y1="83" x2="398" y2="83" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 3：过滤（菱形） -->
  <polygon points="450,58 510,83 450,108 390,83" fill="#fff8e1" stroke="#d6a040"
           stroke-width="1.8" filter="url(#rough2)"/>
  <text x="450" y="80" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">x₁≠x₂</text>
  <text x="450" y="95" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">且 y₁≠y₂?</text>

  <!-- 否分支：丢弃 -->
  <line x1="450" y1="108" x2="450" y2="138" stroke="#b85450" stroke-width="1.5"
        stroke-dasharray="5 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="408" y="140" width="84" height="30" rx="6" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="450" y="159" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">丢弃（面积0）</text>

  <!-- 是分支 -->
  <line x1="390" y1="83" x2="390" y2="200" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="390" y1="200" x2="300" y2="200" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="396" y="148" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 步骤 4：求面积 -->
  <rect x="140" y="175" width="160" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="197" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">求面积</text>
  <text x="220" y="214" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">ABS(Δx)·ABS(Δy)</text>

  <!-- 箭头 4→5 -->
  <line x1="140" y1="200" x2="100" y2="200" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="100" y1="200" x2="100" y2="238" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 5：排序 -->
  <rect x="30" y="240" width="170" height="50" rx="8" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="115" y="262" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">排序</text>
  <text x="115" y="279" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">area DESC, p1, p2</text>

  <!-- 箭头 5→6 -->
  <line x1="115" y1="290" x2="115" y2="318" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 6：输出 -->
  <rect x="40" y="320" width="150" height="44" rx="8" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="115" y="347" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">输出 (p1, p2, area)</text>

  <!-- 右下说明：去重保证 -->
  <rect x="250" y="320" width="260" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="340" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">
    p1.id &lt; p2.id 保证每对只出现一次
  </text>
  <text x="380" y="356" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">
    （避免 (1,2) 与 (2,1) 重复）
  </text>
</svg>
