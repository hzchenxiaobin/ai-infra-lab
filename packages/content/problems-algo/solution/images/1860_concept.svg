<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">贪心分配：每秒 i 位 → 剩余较多的内存条</text>
  <text x="270" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">取 max(mem1, mem2)；相等取内存条 1；两者都 &lt; i 则崩溃</text>

  <!-- baseline -->
  <line x1="60" y1="300" x2="480" y2="300" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- mem1 bar: value 8, scale 12/unit -> height 96, top y=204 -->
  <rect x="110" y="204" width="80" height="96" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="258" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="150" y="322" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">内存条 1</text>

  <!-- mem2 bar: value 11, height 132, top y=168 -->
  <rect x="320" y="168" width="80" height="132" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="238" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">11</text>
  <text x="360" y="322" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">内存条 2</text>

  <!-- ">" comparison hint between bars -->
  <text x="255" y="200" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold" filter="url(#rough2)">&gt;</text>
  <text x="255" y="218" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">较大</text>

  <!-- "第 i 秒" box -->
  <rect x="208" y="68" width="124" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="90" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">第 i 秒：i 位</text>

  <!-- arrow from "第 i 秒" down to mem2 (the larger) -->
  <path d="M 300 102 L 350 160" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="332" y="134" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">较大者</text>

  <!-- chunk being removed from top of mem2 -->
  <rect x="320" y="168" width="80" height="16" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="360" y="158" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">−i</text>

  <!-- crash condition callout -->
  <rect x="60" y="338" width="420" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="358" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">max(mem1, mem2) ≥ i ？扣除 i，i++；否则两根都 &lt; i → 崩溃返回</text>
</svg>
