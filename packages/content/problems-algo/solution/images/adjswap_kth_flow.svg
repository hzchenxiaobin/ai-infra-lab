<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrU" markerWidth="8" markerHeight="8" refX="4" refY="1" orient="auto">
      <path d="M8,8 L4,1 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：求目标 + 贪心匹配 + 数逆序对</text>

  <!-- Step 1: start -->
  <ellipse cx="200" cy="56" rx="70" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="61" text-anchor="middle" font-size="12" fill="#333">输入 num, k</text>

  <path d="M 200 78 L 200 96" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: target = num -->
  <rect x="120" y="98" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="200" y="120" text-anchor="middle" font-size="12" fill="#333">target ← num（副本）</text>

  <path d="M 200 134 L 200 152" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 3: diamond - already k times? -->
  <polygon points="200,154 270,194 200,234 130,194" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="190" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">已调 k 次？</text>
  <text x="200" y="206" text-anchor="middle" font-size="10" fill="#888">cnt &lt; k</text>

  <!-- No branch: right to nextPermutation box -->
  <path d="M 270 194 L 330 194" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="300" y="188" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <rect x="332" y="176" width="180" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="422" y="194" text-anchor="middle" font-size="11.5" fill="#333">nextPermutation(target)</text>
  <text x="422" y="208" text-anchor="middle" font-size="10" fill="#888">31 题四步法</text>

  <!-- loop back up: from box top to above diamond, then left back to diamond top -->
  <path d="M 422 176 L 422 140 L 200 140 L 200 152" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="320" y="134" text-anchor="middle" font-size="9.5" fill="#888">cnt++, 回到判定</text>

  <!-- Yes branch: down -->
  <path d="M 200 234 L 200 254" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="214" y="248" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Step 4: build pos queues -->
  <rect x="80" y="256" width="240" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="200" y="274" text-anchor="middle" font-size="11.5" fill="#333">为 num 各数字建队列 pos[0..9]</text>
  <text x="200" y="290" text-anchor="middle" font-size="10" fill="#888">按下标升序，队首 = 最左未用位置</text>

  <path d="M 200 302 L 200 320" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 5: build arr -->
  <rect x="80" y="322" width="240" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="200" y="340" text-anchor="middle" font-size="11.5" fill="#333">遍历 target[i]：</text>
  <text x="200" y="356" text-anchor="middle" font-size="11" fill="#333">arr[i] ← pos[target[i]].队首出队</text>
  <text x="200" y="368" text-anchor="middle" font-size="9.5" fill="#888">重复数字按出现顺序稳定匹配</text>

  <path d="M 200 374 L 200 392" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 6: count inversions -->
  <rect x="80" y="394" width="240" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="200" y="412" text-anchor="middle" font-size="11.5" fill="#333">归并排序统计 arr 逆序对 cnt</text>
  <text x="200" y="428" text-anchor="middle" font-size="10" fill="#888">O(n log n)，亦可用树状数组</text>

  <path d="M 200 440 L 200 458" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 7: return -->
  <ellipse cx="200" cy="478" rx="70" ry="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="483" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 cnt</text>

  <!-- side note: complexity -->
  <rect x="360" y="256" width="180" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="450" y="276" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">复杂度</text>
  <text x="450" y="294" text-anchor="middle" font-size="10.5" fill="#555">阶段①: O(k·n)</text>
  <text x="450" y="310" text-anchor="middle" font-size="10.5" fill="#555">阶段②: O(n log n)</text>
  <text x="450" y="326" text-anchor="middle" font-size="10" fill="#888">k,n ≤ 1000 → 约 10⁶</text>

  <!-- side note: why inversions -->
  <rect x="360" y="344" width="180" height="88" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="450" y="362" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">为什么 = 逆序对？</text>
  <text x="368" y="380" font-size="9.5" fill="#555">每次相邻交换恰好</text>
  <text x="368" y="394" font-size="9.5" fill="#555">消除一个逆序对，</text>
  <text x="368" y="408" font-size="9.5" fill="#555">故最少次数 = 逆序对</text>
  <text x="368" y="424" font-size="9.5" fill="#555">总数（冒泡排序本质）</text>
</svg>
