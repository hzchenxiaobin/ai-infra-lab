<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：两遍扫描预处理 prev/next，再逐位累加贡献</text>

  <!-- Step 1: left-to-right pass -->
  <rect x="40" y="50" width="460" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="60" y="74" font-size="13" fill="#446688" font-weight="bold">① 从左到右扫描</text>
  <text x="60" y="96" font-size="11" fill="#444">用数组 last[26] 记录每个字符上次出现的下标（初值 −1）</text>
  <text x="60" y="114" font-size="11" fill="#444">遇到 s[i]： prev[i] = last[s[i]]；再更新 last[s[i]] = i</text>
  <text x="60" y="130" font-size="11" fill="#888">→ 得到每个 i 左侧最近的同字符位置</text>

  <!-- arrow down -->
  <path d="M 270 140 L 270 158" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- Step 2: right-to-left pass -->
  <rect x="40" y="162" width="460" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="60" y="186" font-size="13" fill="#4a7a3a" font-weight="bold">② 从右到左扫描</text>
  <text x="60" y="208" font-size="11" fill="#444">复用 last[26]，初值置为 n（表示右侧无同字符）</text>
  <text x="60" y="226" font-size="11" fill="#444">遇到 s[i]： next[i] = last[s[i]]；再更新 last[s[i]] = i</text>
  <text x="60" y="242" font-size="11" fill="#888">→ 得到每个 i 右侧最近的同字符位置</text>

  <!-- arrow down -->
  <path d="M 270 252 L 270 270" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- Step 3: sum contributions -->
  <rect x="40" y="274" width="460" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="60" y="298" font-size="13" fill="#d6a040" font-weight="bold">③ 逐位累加贡献</text>
  <text x="60" y="320" font-size="11" fill="#444">遍历每个 i： ans += (i − prev[i]) × (next[i] − i)</text>
  <text x="60" y="338" font-size="11" fill="#444">每个字符只在其"恰好出现一次"的子串中被统计一次</text>
  <text x="60" y="354" font-size="11" fill="#888">→ 不重不漏，所有子串的唯一字符都被计入</text>

  <!-- complexity note -->
  <rect x="40" y="376" width="460" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="397" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">时间 O(n)，空间 O(n)（last 仅 26 项，prev/next 各 n 项）</text>
</svg>
