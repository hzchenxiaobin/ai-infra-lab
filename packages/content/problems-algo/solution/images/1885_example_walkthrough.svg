<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：nums1=[1,2,3,4], nums2=[3,2,1,4]</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888">diff = [−2, 0, 2, 0] → 排序后 [−2, 0, 0, 2] → 双指针计数</text>

  <!-- sorted diff row -->
  <text x="20" y="86" font-size="12" fill="#888">diff(已排序)：</text>
  <rect x="130" y="70" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="160" y="91" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">−2</text>
  <rect x="194" y="70" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="224" y="91" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="258" y="70" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="288" y="91" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="322" y="70" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="352" y="91" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

  <!-- index labels -->
  <text x="160" y="116" text-anchor="middle" font-size="9.5" fill="#aaa">0</text>
  <text x="224" y="116" text-anchor="middle" font-size="9.5" fill="#aaa">1</text>
  <text x="288" y="116" text-anchor="middle" font-size="9.5" fill="#aaa">2</text>
  <text x="352" y="116" text-anchor="middle" font-size="9.5" fill="#aaa">3</text>

  <!-- Step table header -->
  <text x="430" y="78" font-size="11" fill="#444" font-weight="bold">步骤演算：</text>

  <!-- Step 1: left=0, right=3 -->
  <path d="M 160 130 L 160 124" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="144" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">left</text>
  <path d="M 352 130 L 352 124" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="352" y="144" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">right</text>

  <rect x="420" y="118" width="190" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="515" y="134" text-anchor="middle" font-size="10.5" fill="#333">步骤1: −2 + 2 = 0</text>
  <text x="515" y="148" text-anchor="middle" font-size="10" fill="#888">0 ≤ 0 ✗ → left++</text>

  <!-- Step 2: left=1, right=3 -->
  <path d="M 224 192 L 224 124" stroke="#446688" stroke-width="1.6" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="224" y="206" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">left</text>
  <path d="M 352 192 L 352 124" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="352" y="206" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">right</text>

  <!-- bracket left..right-1 -->
  <path d="M 224 222 L 224 228 L 288 228 L 288 222" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="256" y="244" text-anchor="middle" font-size="9.5" fill="#888">count += 3−1 = 2</text>

  <rect x="420" y="178" width="190" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="515" y="196" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">步骤2: 0 + 2 = 2 &gt; 0 ✓</text>
  <text x="515" y="212" text-anchor="middle" font-size="10" fill="#333">count += 2, right −−</text>

  <!-- Step 3: left=1, right=2 -->
  <path d="M 224 286 L 224 124" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="2,2" filter="url(#rough2)"/>
  <text x="224" y="300" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">left</text>
  <path d="M 288 286 L 288 124" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="2,2" filter="url(#rough2)"/>
  <text x="288" y="300" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">right</text>

  <rect x="420" y="248" width="190" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="515" y="264" text-anchor="middle" font-size="10.5" fill="#333">步骤3: 0 + 0 = 0</text>
  <text x="515" y="278" text-anchor="middle" font-size="10" fill="#888">0 ≤ 0 ✗ → left++</text>

  <!-- Step 4: stop -->
  <rect x="420" y="308" width="190" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="515" y="324" text-anchor="middle" font-size="10.5" fill="#333">步骤4: left ≥ right</text>
  <text x="515" y="338" text-anchor="middle" font-size="10" fill="#888">循环结束</text>

  <!-- result box -->
  <rect x="40" y="340" width="360" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="220" y="360" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">结果：count = 2</text>
  <text x="220" y="376" text-anchor="middle" font-size="10.5" fill="#666">对应原数组下标对 (1,2) 与 (2,3) ✓</text>
</svg>
