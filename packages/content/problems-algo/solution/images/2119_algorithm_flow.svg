<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：只看末位是否为零</text>
  <text x="260" y="44" text-anchor="middle" font-size="10.5" fill="#888">无需真的执行两次反转，O(1) 判定</text>

  <!-- Start: num -->
  <rect x="200" y="64" width="120" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="20" filter="url(#rough2)"/>
  <text x="260" y="88" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">输入 num</text>

  <!-- arrow down -->
  <path d="M 260 104 L 260 124" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 1: num == 0? -->
  <polygon points="260,128 360,168 260,208 160,168" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="164" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">num == 0 ?</text>
  <text x="260" y="180" text-anchor="middle" font-size="10.5" fill="#888">特例：0 反转仍 0</text>

  <!-- Yes branch (left) → true -->
  <path d="M 160 168 L 110 168" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="135" y="160" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="40" y="150" width="64" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="72" y="172" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">true</text>

  <!-- No branch (down) -->
  <path d="M 260 208 L 260 228" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="222" font-size="11" fill="#888" font-weight="bold">否</text>

  <!-- Decision 2: num % 10 == 0? -->
  <polygon points="260,232 380,278 260,324 140,278" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="274" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">num % 10 == 0 ?</text>
  <text x="260" y="290" text-anchor="middle" font-size="10.5" fill="#888">末位为零 = 有尾随零</text>

  <!-- Yes branch (left) → false (zeros will be lost) -->
  <path d="M 140 278 L 110 278" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="135" y="270" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <rect x="40" y="260" width="64" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="72" y="282" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">false</text>

  <!-- No branch (right) → true (no trailing zero, fully recoverable) -->
  <path d="M 380 278 L 410 278" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="395" y="270" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="416" y="260" width="64" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="448" y="282" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">true</text>

  <!-- Bottom note -->
  <rect x="40" y="330" width="440" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="348" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">两条判定合起来即：num == 0 or num % 10 != 0</text>
  <text x="260" y="364" text-anchor="middle" font-size="10" fill="#888">等价于「num 不以 0 结尾，除非 num 本身就是 0」</text>
</svg>
