<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">核心观察：通用频率表 + 木桶原理（target 任意，非固定单词）</text>

  <!-- ===== Top: input strings ===== -->
  <text x="40" y="52" font-size="11" fill="#446688" font-weight="bold">输入：</text>
  <g filter="url(#rough2)">
    <rect x="80" y="40" width="220" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="190" y="58" text-anchor="middle" font-size="11.5" fill="#333">s = "ilovecodingonleetcode"</text>
    <rect x="312" y="40" width="160" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="392" y="58" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">target = "code"</text>
  </g>

  <!-- ===== Left branch: count target (requirement) ===== -->
  <text x="40" y="98" font-size="11" fill="#4a7a3a" font-weight="bold">① 统计 target 各字母需求 req</text>
  <path d="M 392 68 Q 392 80 150 92" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="60" y="108" width="4" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <rect x="70" y="108" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="100" y="126" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">c:1</text>
    <rect x="132" y="108" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="162" y="126" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">o:1</text>
    <rect x="194" y="108" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="224" y="126" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">d:1</text>
    <rect x="256" y="108" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="286" y="126" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">e:1</text>
  </g>

  <!-- ===== Right branch: count s (supply) ===== -->
  <text x="320" y="98" font-size="11" fill="#446688" font-weight="bold">② 统计 s 各字母供应 cnt</text>
  <path d="M 190 68 Q 190 80 420 92" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="330" y="108" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="360" y="126" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">c:2</text>
    <rect x="392" y="108" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="422" y="126" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">o:4</text>
    <rect x="454" y="108" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="484" y="126" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">d:2</text>
    <rect x="330" y="140" width="184" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="422" y="158" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">e:4 （只统计 target 出现的字母）</text>
  </g>

  <!-- merge arrows down -->
  <path d="M 160 140 L 200 168" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 360 170 L 320 178" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Middle: divide table ===== -->
  <text x="40" y="192" font-size="11" fill="#d6a040" font-weight="bold">③ 对每个字母算 ⌊cnt ÷ req⌋</text>

  <g filter="url(#rough2)">
    <!-- header -->
    <rect x="60" y="200" width="150" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="135" y="216" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">字母</text>
    <rect x="210" y="200" width="80" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="250" y="216" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">c</text>
    <rect x="290" y="200" width="80" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="330" y="216" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">o</text>
    <rect x="370" y="200" width="80" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="410" y="216" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">d</text>
    <rect x="450" y="200" width="80" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="490" y="216" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">e</text>

    <!-- cnt row -->
    <rect x="60" y="224" width="150" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="2"/>
    <text x="135" y="240" text-anchor="middle" font-size="11" fill="#333">cnt（s 中供应）</text>
    <rect x="210" y="224" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="2"/>
    <text x="250" y="240" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
    <rect x="290" y="224" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="2"/>
    <text x="330" y="240" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
    <rect x="370" y="224" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="2"/>
    <text x="410" y="240" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
    <rect x="450" y="224" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="2"/>
    <text x="490" y="240" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>

    <!-- req row -->
    <rect x="60" y="248" width="150" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="2"/>
    <text x="135" y="264" text-anchor="middle" font-size="11" fill="#333">req（单个 target）</text>
    <rect x="210" y="248" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="2"/>
    <text x="250" y="264" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
    <rect x="290" y="248" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="2"/>
    <text x="330" y="264" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
    <rect x="370" y="248" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="2"/>
    <text x="410" y="264" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
    <rect x="450" y="248" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="2"/>
    <text x="490" y="264" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

    <!-- divide row -->
    <rect x="60" y="272" width="150" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="2"/>
    <text x="135" y="288" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">⌊cnt ÷ req⌋</text>
    <rect x="210" y="272" width="80" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="2"/>
    <text x="250" y="288" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
    <rect x="290" y="272" width="80" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="2"/>
    <text x="330" y="288" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
    <rect x="370" y="272" width="80" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="2"/>
    <text x="410" y="288" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
    <rect x="450" y="272" width="80" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="2"/>
    <text x="490" y="288" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  </g>

  <!-- arrow to bottleneck -->
  <path d="M 280 300 L 280 314" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="100" y="318" width="360" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8"/>
    <text x="280" y="338" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">瓶颈 = min(2, 4, 2, 4) = 2</text>
  </g>

  <path d="M 280 350 L 280 362" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="120" y="366" width="320" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
    <text x="280" y="384" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">最多形成 2 个 "code" 副本</text>
  </g>
</svg>
