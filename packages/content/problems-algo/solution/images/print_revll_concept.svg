<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">不可变链表逆序打印：递归 vs 多趟遍历</text>

  <!-- The immutable linked list: 1 -> 2 -> 3 -> 4 -->
  <text x="36" y="58" font-size="12" fill="#888">head→</text>
  <rect x="80" y="44" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="100" y="65" text-anchor="middle" font-size="13" fill="#333">1</text>
  <path d="M 136 60 L 156 60" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="160" y="44" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="180" y="65" text-anchor="middle" font-size="13" fill="#333">2</text>
  <path d="M 216 60 L 236 60" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="240" y="44" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="65" text-anchor="middle" font-size="13" fill="#333">3</text>
  <path d="M 296 60 L 316 60" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="320" y="44" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="340" y="65" text-anchor="middle" font-size="13" fill="#333">4</text>
  <text x="388" y="65" font-size="12" fill="#888">NULL</text>

  <!-- Desired output -->
  <text x="36" y="100" font-size="12" fill="#888">输出:</text>
  <rect x="80" y="86" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="100" y="105" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">4</text>
  <rect x="124" y="86" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="144" y="105" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <rect x="168" y="86" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="188" y="105" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>
  <rect x="212" y="86" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="232" y="105" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>

  <!-- Divider -->
  <path d="M 40 130 L 520 130" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Left: Recursion approach -->
  <rect x="50" y="146" width="220" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="160" y="165" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">方法一：递归</text>

  <!-- recursion call stack -->
  <text x="60" y="192" font-size="11" fill="#555">递到尾，归来时打印：</text>
  <rect x="64" y="200" width="90" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="109" y="216" text-anchor="middle" font-size="11" fill="#333">dfs(1)↓</text>
  <rect x="74" y="226" width="90" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="119" y="242" text-anchor="middle" font-size="11" fill="#333">dfs(2)↓</text>
  <rect x="84" y="252" width="90" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="129" y="268" text-anchor="middle" font-size="11" fill="#333">dfs(3)↓</text>
  <rect x="94" y="278" width="90" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="139" y="294" text-anchor="middle" font-size="11" fill="#333">dfs(4)↓</text>

  <!-- return arrows with print -->
  <path d="M 188 289 L 210 289" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="218" y="293" font-size="11" fill="#b85450" font-weight="bold">print 4</text>
  <path d="M 178 263 L 210 263" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="218" y="267" font-size="11" fill="#b85450" font-weight="bold">print 3</text>
  <path d="M 168 237 L 210 237" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="218" y="241" font-size="11" fill="#b85450" font-weight="bold">print 2</text>
  <path d="M 158 211 L 210 211" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="218" y="215" font-size="11" fill="#b85450" font-weight="bold">print 1</text>

  <rect x="54" y="318" width="212" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="160" y="337" text-anchor="middle" font-size="11" fill="#444">O(n) 时间 / O(n) 空间（栈）</text>

  <!-- Right: Multi-pass approach -->
  <rect x="300" y="146" width="220" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="410" y="165" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">方法二：多趟遍历（O(1) 空间）</text>

  <text x="310" y="192" font-size="11" fill="#555">先数长度 n=4，再从第 n 个倒着打印：</text>

  <!-- round 1 -->
  <text x="310" y="218" font-size="11" fill="#446688" font-weight="bold">第 4 趟:</text>
  <rect x="360" y="206" width="36" height="22" fill="#eee" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="378" y="222" text-anchor="middle" font-size="10" fill="#aaa">1</text>
  <rect x="398" y="206" width="36" height="22" fill="#eee" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="416" y="222" text-anchor="middle" font-size="10" fill="#aaa">2</text>
  <rect x="436" y="206" width="36" height="22" fill="#eee" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="454" y="222" text-anchor="middle" font-size="10" fill="#aaa">3</text>
  <rect x="474" y="206" width="36" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="492" y="222" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <text x="516" y="222" font-size="11" fill="#b85450" font-weight="bold">→print 4</text>

  <!-- round 2 -->
  <text x="310" y="252" font-size="11" fill="#446688" font-weight="bold">第 3 趟:</text>
  <rect x="360" y="240" width="36" height="22" fill="#eee" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="378" y="256" text-anchor="middle" font-size="10" fill="#aaa">1</text>
  <rect x="398" y="240" width="36" height="22" fill="#eee" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="416" y="256" text-anchor="middle" font-size="10" fill="#aaa">2</text>
  <rect x="436" y="240" width="36" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="454" y="256" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="480" y="256" font-size="11" fill="#b85450" font-weight="bold">→print 3</text>

  <!-- round 3 -->
  <text x="310" y="286" font-size="11" fill="#446688" font-weight="bold">第 2 趟:</text>
  <rect x="360" y="274" width="36" height="22" fill="#eee" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="378" y="290" text-anchor="middle" font-size="10" fill="#aaa">1</text>
  <rect x="398" y="274" width="36" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="416" y="290" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="442" y="290" font-size="11" fill="#b85450" font-weight="bold">→print 2</text>

  <!-- round 4 -->
  <text x="310" y="320" font-size="11" fill="#446688" font-weight="bold">第 1 趟:</text>
  <rect x="360" y="308" width="36" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="378" y="324" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="404" y="324" font-size="11" fill="#b85450" font-weight="bold">→print 1</text>

  <rect x="304" y="348" width="212" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="410" y="367" text-anchor="middle" font-size="11" fill="#444">O(n²) 时间 / O(1) 空间</text>
</svg>
