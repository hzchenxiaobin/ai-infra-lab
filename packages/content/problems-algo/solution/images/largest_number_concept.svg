<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：两个数谁该在前？比 a+b 与 b+a</text>

  <!-- 方案一：3 在前 -->
  <text x="30" y="76" font-size="11.5" fill="#4a7a3a" font-weight="bold">① 3 在前</text>
  <rect x="110" y="56" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="133" y="80" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">3</text>
  <rect x="166" y="56" width="66" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="199" y="80" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">30</text>
  <path d="M240,74 L282,74" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="288" y="56" width="80" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="328" y="80" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">330</text>
  <text x="380" y="80" font-size="11.5" fill="#4a7a3a" font-weight="bold">✓ 更大</text>

  <!-- 方案二：30 在前 -->
  <text x="30" y="130" font-size="11.5" fill="#b85450" font-weight="bold">② 30 在前</text>
  <rect x="110" y="110" width="66" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="143" y="134" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">30</text>
  <rect x="186" y="110" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="209" y="134" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">3</text>
  <path d="M240,128 L282,128" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="288" y="110" width="80" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="328" y="134" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">303</text>
  <text x="380" y="134" font-size="11.5" fill="#b85450" font-weight="bold">✗ 较小</text>

  <!-- comparison row -->
  <rect x="70" y="160" width="380" height="40" fill="#f0f0f0" stroke="#888" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="185" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold">330  &gt;  303   ⇒   3 应排在 30 前面</text>

  <!-- formula box -->
  <rect x="40" y="214" width="440" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="237" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">比较准则：a 排在 b 前 ⟺ a + b &gt; b + a</text>
  <text x="260" y="257" text-anchor="middle" font-size="11" fill="#4a7a3a">（把两个数都转成字符串，拼接后比较字典序/数值）</text>

  <!-- anti-example warning -->
  <rect x="40" y="284" width="440" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="306" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">⚠ 不能直接按字典序降序排！</text>
  <text x="260" y="326" text-anchor="middle" font-size="11" fill="#333">反例：字典序 "3" &lt; "30"，但 3 应在 30 前面</text>
</svg>
