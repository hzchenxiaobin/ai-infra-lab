<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：康托尔对角线法</text>

  <!-- Start oval -->
  <rect x="210" y="44" width="100" height="28" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="63" text-anchor="middle" font-size="12" fill="#333">开始</text>

  <!-- arrow -->
  <path d="M 260 72 L 260 88" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- init answer -->
  <rect x="190" y="92" width="140" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="113" text-anchor="middle" font-size="12" fill="#333">answer = ""</text>

  <!-- arrow -->
  <path d="M 260 124 L 260 140" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- loop label -->
  <rect x="180" y="144" width="160" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="164" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">for i = 0 to n-1</text>

  <!-- arrow -->
  <path d="M 260 174 L 260 192" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- decision diamond: nums[i][i]=='0'? -->
  <path d="M 260 196 L 340 240 L 260 284 L 180 240 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="236" text-anchor="middle" font-size="11" fill="#333">nums[i][i]</text>
  <text x="260" y="252" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">== '0' ?</text>

  <!-- Yes branch left -->
  <path d="M 180 240 L 110 240" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="150" y="232" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="40" y="222" width="70" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="75" y="245" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">answer += '1'</text>

  <!-- No branch right -->
  <path d="M 340 240 L 410 240" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="370" y="232" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  <rect x="410" y="222" width="70" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="445" y="245" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">answer += '0'</text>

  <!-- merge arrows down to loop-back -->
  <path d="M 75 258 L 75 300 L 260 300" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 445 258 L 445 300 L 260 300" stroke="#888" stroke-width="2" fill="none" filter="url(#rough2)"/>

  <!-- loop-back arrow up to for label -->
  <path d="M 260 300 L 380 300 L 380 159 L 340 159" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="388" y="232" font-size="10.5" fill="#888">下一轮 i</text>

  <!-- after loop: return -->
  <path d="M 260 300 L 260 332" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="170" y="336" width="180" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="358" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">return answer</text>

  <!-- note box -->
  <rect x="40" y="388" width="440" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="408" font-size="11" fill="#555" font-weight="bold">要点</text>
  <text x="56" y="424" font-size="10.5" fill="#555">单趟遍历 n 位，每位 O(1) 翻转；无需哈希、无需枚举 2^n 种串</text>
</svg>
