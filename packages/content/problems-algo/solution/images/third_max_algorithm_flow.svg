<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 580" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="580" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：遍历 → 判重 → 区间移位 → 返回</text>

  <!-- Start: init -->
  <rect x="200" y="44" width="160" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="17" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">开始：a = b = c = −∞</text>

  <path d="M 280 80 L 280 98" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Loop: for each x -->
  <rect x="200" y="102" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="124" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">遍历下一个 x ∈ nums</text>

  <path d="M 280 138 L 280 156" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Decision 1: dedup -->
  <polygon points="280,160 400,200 280,240 160,200" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="196" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">x ∈ {a, b, c} ?</text>
  <text x="280" y="212" text-anchor="middle" font-size="10" fill="#888">（判重）</text>

  <!-- Yes: skip -->
  <path d="M 400 200 L 460 200" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="430" y="194" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="464" y="184" width="76" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="502" y="205" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">跳过</text>
  <path d="M 502 216 L 502 120 L 360 120" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="3,3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="450" y="112" font-size="9.5" fill="#888">回循环</text>

  <!-- No: down -->
  <path d="M 280 240 L 280 258" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="292" y="254" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- Decision 2: x > a ? -->
  <polygon points="280,262 380,296 280,330 180,296" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="301" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">x &gt; a ?</text>

  <path d="M 380 296 L 440 296" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="410" y="290" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="444" y="278" width="100" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="494" y="294" text-anchor="middle" font-size="10" fill="#555">c←b, b←a</text>
  <text x="494" y="307" text-anchor="middle" font-size="10" fill="#555">a←x</text>

  <path d="M 280 330 L 280 348" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="292" y="344" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- Decision 3: x > b ? -->
  <polygon points="280,352 380,386 280,420 180,386" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="391" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">x &gt; b ?</text>

  <path d="M 380 386 L 440 386" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="410" y="380" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="444" y="370" width="100" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="494" y="390" text-anchor="middle" font-size="10" fill="#555">c←b, b←x</text>

  <path d="M 280 420 L 280 436" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="292" y="432" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- Decision 4: x > c ? -->
  <polygon points="280,440 380,470 280,500 180,470" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="475" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">x &gt; c ?</text>

  <path d="M 380 470 L 440 470" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="410" y="464" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="444" y="454" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="484" y="475" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">c ← x</text>

  <path d="M 180 470 L 130 470" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="3,3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="155" y="464" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">否</text>
  <text x="92" y="474" text-anchor="middle" font-size="9.5" fill="#888">忽略</text>

  <!-- converge: all action boxes loop back -->
  <path d="M 494 314 L 494 120 L 360 120" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="3,3" marker-end="url(#arrD)" filter="url(#rough2)" opacity="0"/>
  <path d="M 494 402 L 494 120 L 360 120" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="3,3" marker-end="url(#arrD)" filter="url(#rough2)" opacity="0"/>
  <path d="M 484 486 L 484 120 L 360 120" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="3,3" marker-end="url(#arrD)" filter="url(#rough2)" opacity="0"/>

  <!-- End: return -->
  <path d="M 280 500 L 280 524" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="292" y="518" font-size="9.5" fill="#888">遍历完</text>

  <rect x="170" y="528" width="220" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="546" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回 c ≠ −∞ ? c : a</text>
  <text x="280" y="560" text-anchor="middle" font-size="9.5" fill="#555">（c 已填返第三大，否则返最大）</text>
</svg>
