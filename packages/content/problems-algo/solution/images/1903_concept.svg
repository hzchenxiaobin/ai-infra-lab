<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心：奇偶性只看末位 → 最右奇位的前缀即最大奇数</text>
  <text x="300" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">num = "35427" → 最右奇位 i=4 → 答案 num[0..4] = "35427"</text>

  <!-- Index labels -->
  <text x="44" y="92" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">下标</text>
  <g filter="url(#rough2)" font-size="9.5" fill="#aaa" text-anchor="middle">
    <text x="172" y="68">0</text>
    <text x="216" y="68">1</text>
    <text x="260" y="68">2</text>
    <text x="304" y="68">3</text>
    <text x="348" y="68">4</text>
  </g>

  <!-- String digits: 3 5 4 2 7 -->
  <text x="44" y="92" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)"></text>
  <g filter="url(#rough2)" font-size="14" text-anchor="middle">
    <!-- 3 odd -->
    <rect x="150" y="70" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="172" y="93" fill="#4a7a3a" font-weight="bold">3</text>
    <!-- 5 odd -->
    <rect x="194" y="70" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="216" y="93" fill="#4a7a3a" font-weight="bold">5</text>
    <!-- 4 even -->
    <rect x="238" y="70" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="260" y="93" fill="#446688" font-weight="bold">4</text>
    <!-- 2 even -->
    <rect x="282" y="70" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="304" y="93" fill="#446688" font-weight="bold">2</text>
    <!-- 7 odd (rightmost) -->
    <rect x="326" y="70" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <text x="348" y="93" fill="#d6a040" font-weight="bold">7</text>
  </g>

  <!-- Legend -->
  <g filter="url(#rough2)" font-size="10" fill="#555">
    <rect x="410" y="74" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <text x="430" y="85">奇数位</text>
    <rect x="410" y="94" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="430" y="105">偶数位</text>
  </g>

  <!-- Arrow pointing to rightmost odd digit (index 4) -->
  <path d="M 348 140 Q 348 116 348 110" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="356" y="134" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">最右奇位 i=4</text>

  <!-- Bracket: prefix num[0..i] -->
  <path d="M 150 150 Q 150 162 160 162 L 340 162 Q 350 162 350 150" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="250" y="180" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">前缀 num[0..i] —— 末位为 7（奇），且位数最长</text>

  <!-- Divider -->
  <line x1="60" y1="200" x2="540" y2="200" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Why largest: compare odd substrings ending at each odd position -->
  <text x="300" y="220" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold" filter="url(#rough2)">所有「奇子串」末位必落在某个奇数位 —— 各取其最长前缀比较</text>

  <!-- Row: odd position i=0 -> prefix "3" -->
  <text x="44" y="252" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">末位 i=0</text>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="150" y="236" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="172" y="256" fill="#4a7a3a" font-weight="bold">3</text>
  </g>
  <text x="220" y="256" font-size="10.5" fill="#888" filter="url(#rough2)">= 3（1 位）</text>

  <!-- Row: odd position i=1 -> prefix "35" -->
  <text x="44" y="294" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">末位 i=1</text>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="150" y="278" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="172" y="298" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="194" y="278" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="216" y="298" fill="#4a7a3a" font-weight="bold">5</text>
  </g>
  <text x="264" y="298" font-size="10.5" fill="#888" filter="url(#rough2)">= 35（2 位）</text>

  <!-- Row: odd position i=4 -> prefix "35427" (winner) -->
  <text x="44" y="336" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">末位 i=4</text>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="150" y="320" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <text x="172" y="340" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="194" y="320" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <text x="216" y="340" fill="#4a7a3a" font-weight="bold">5</text>
    <rect x="238" y="320" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <text x="260" y="340" fill="#4a7a3a" font-weight="bold">4</text>
    <rect x="282" y="320" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <text x="304" y="340" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="326" y="320" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <text x="348" y="340" fill="#d6a040" font-weight="bold">7</text>
  </g>
  <text x="396" y="340" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">= 35427（5 位，最长 → 最大）✓</text>

  <!-- Result -->
  <rect x="120" y="372" width="360" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="398" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = num[0..最右奇位] = "35427"</text>

  <!-- Note -->
  <rect x="50" y="424" width="500" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="443" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">位数越长数值越大（无前导零）→ 最右奇位给出最长奇前缀</text>
</svg>
