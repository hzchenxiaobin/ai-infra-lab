<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 演算：nums = [3,-1,-5,2,5,-9]</text>

  <!-- table header -->
  <rect x="20" y="40" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="40" y="58" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">步</text>
  <rect x="60" y="40" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="90" y="58" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">num</text>
  <rect x="120" y="40" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="175" y="58" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">curMax·num</text>
  <rect x="230" y="40" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="285" y="58" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">curMin·num</text>
  <rect x="340" y="40" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="380" y="58" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">curMax</text>
  <rect x="420" y="40" width="80" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="460" y="58" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">curMin</text>

  <!-- rows -->
  <!-- row 0 -->
  <g font-size="11" fill="#333">
    <rect x="20" y="66" width="40" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="40" y="82" text-anchor="middle">0</text>
    <rect x="60" y="66" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
    <text x="90" y="82" text-anchor="middle" fill="#d6a040">3</text>
    <rect x="120" y="66" width="110" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="175" y="82" text-anchor="middle" fill="#888">—</text>
    <rect x="230" y="66" width="110" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="285" y="82" text-anchor="middle" fill="#888">—</text>
    <rect x="340" y="66" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="380" y="82" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="420" y="66" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="460" y="82" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
  </g>

  <!-- row 1 -->
  <g font-size="11" fill="#333">
    <rect x="20" y="90" width="40" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="40" y="106" text-anchor="middle">1</text>
    <rect x="60" y="90" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
    <text x="90" y="106" text-anchor="middle" fill="#d6a040">-1</text>
    <rect x="120" y="90" width="110" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="175" y="106" text-anchor="middle">-3</text>
    <rect x="230" y="90" width="110" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="285" y="106" text-anchor="middle">-3</text>
    <rect x="340" y="90" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="380" y="106" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="420" y="90" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="460" y="106" text-anchor="middle" fill="#b85450" font-weight="bold">-3</text>
  </g>

  <!-- row 2 - flip highlight -->
  <g font-size="11" fill="#333">
    <rect x="20" y="114" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="40" y="130" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
    <rect x="60" y="114" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
    <text x="90" y="130" text-anchor="middle" fill="#d6a040">-5</text>
    <rect x="120" y="114" width="110" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="175" y="130" text-anchor="middle">-15</text>
    <rect x="230" y="114" width="110" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="285" y="130" text-anchor="middle" fill="#b85450" font-weight="bold">15 ←翻身</text>
    <rect x="340" y="114" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="380" y="130" text-anchor="middle" fill="#4a7a3a" font-weight="bold">15</text>
    <rect x="420" y="114" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="460" y="130" text-anchor="middle" fill="#b85450" font-weight="bold">-15</text>
  </g>

  <!-- row 3 -->
  <g font-size="11" fill="#333">
    <rect x="20" y="138" width="40" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="40" y="154" text-anchor="middle">3</text>
    <rect x="60" y="138" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
    <text x="90" y="154" text-anchor="middle" fill="#d6a040">2</text>
    <rect x="120" y="138" width="110" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="175" y="154" text-anchor="middle">30</text>
    <rect x="230" y="138" width="110" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="285" y="154" text-anchor="middle">-30</text>
    <rect x="340" y="138" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="380" y="154" text-anchor="middle" fill="#4a7a3a" font-weight="bold">30</text>
    <rect x="420" y="138" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="460" y="154" text-anchor="middle" fill="#b85450" font-weight="bold">-30</text>
  </g>

  <!-- row 4 -->
  <g font-size="11" fill="#333">
    <rect x="20" y="162" width="40" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="40" y="178" text-anchor="middle">4</text>
    <rect x="60" y="162" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
    <text x="90" y="178" text-anchor="middle" fill="#d6a040">5</text>
    <rect x="120" y="162" width="110" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="175" y="178" text-anchor="middle">150</text>
    <rect x="230" y="162" width="110" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="285" y="178" text-anchor="middle">-150</text>
    <rect x="340" y="162" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="380" y="178" text-anchor="middle" fill="#4a7a3a" font-weight="bold">150</text>
    <rect x="420" y="162" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="460" y="178" text-anchor="middle" fill="#b85450" font-weight="bold">-150</text>
  </g>

  <!-- row 5 - final flip highlight -->
  <g font-size="11" fill="#333">
    <rect x="20" y="186" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="40" y="202" text-anchor="middle" fill="#d6a040" font-weight="bold">5</text>
    <rect x="60" y="186" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
    <text x="90" y="202" text-anchor="middle" fill="#d6a040">-9</text>
    <rect x="120" y="186" width="110" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="175" y="202" text-anchor="middle">-1350</text>
    <rect x="230" y="186" width="110" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="285" y="202" text-anchor="middle" fill="#b85450" font-weight="bold">1350 ←翻身</text>
    <rect x="340" y="186" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
    <text x="380" y="202" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1350</text>
    <rect x="420" y="186" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="460" y="202" text-anchor="middle" fill="#b85450" font-weight="bold">-1350</text>
  </g>

  <!-- annotation arrow from curMin·num to curMax at row 5 -->
  <path d="M 340 198 Q 350 165 380 188" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)" stroke-dasharray="4 3"/>
  <text x="356" y="172" font-size="9" fill="#4a7a3a">最小翻身成最大</text>

  <!-- Result box -->
  <rect x="140" y="232" width="240" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="252" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">答案 curMax = 1350</text>
  <text x="260" y="268" text-anchor="middle" font-size="10" fill="#555">由第 5 步 curMin·(-9) 翻身而来</text>

  <!-- note -->
  <rect x="30" y="290" width="460" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="44" y="308" font-size="11" fill="#446688" font-weight="bold">关键观察</text>
  <text x="44" y="324" font-size="10" fill="#444">第 2、5 步遇负数，curMin·num 反成 newMax —— 这就是必须同时追踪 (max, min) 的原因</text>

  <rect x="20" y="338" width="480" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="350" text-anchor="middle" font-size="10" fill="#555">每行：保留旧 curMax（不选 num）/ 单取 num / curMax·num / curMin·num 四候选取极值</text>
</svg>
