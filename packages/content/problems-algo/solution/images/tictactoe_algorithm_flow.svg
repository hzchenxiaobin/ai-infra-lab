<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
      <path d="M0,0 L5,8 L10,0" fill="none" stroke="#555" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：重建棋盘 → 只查最后落子者</text>

  <!-- Step 1: replay -->
  <rect x="90" y="50" width="340" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="70" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">① 回放落子到 3×3 棋盘</text>
  <text x="260" y="88" text-anchor="middle" font-size="10.5" fill="#666" font-family="monospace">moves[i] → board[r][c]，偶数步 = X(A)，奇数步 = O(B)</text>

  <!-- arrow -->
  <path d="M 260 102 L 260 116" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: determine last mover -->
  <rect x="90" y="122" width="340" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="142" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">② 确定最后落子者</text>
  <text x="260" y="160" text-anchor="middle" font-size="10.5" fill="#666" font-family="monospace">last = len(moves) − 1，偶 → A(X)，奇 → B(O)</text>

  <!-- arrow -->
  <path d="M 260 174 L 260 188" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 3: diamond - win check -->
  <path d="M 260 192 L 360 232 L 260 272 L 160 232 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="228" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">③ 该玩家棋子</text>
  <text x="260" y="244" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">是否三连？</text>

  <!-- Yes branch (right) -->
  <path d="M 360 232 L 400 232" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="380" y="226" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="400" y="214" width="100" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="450" y="237" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">返回 "A"/"B"</text>

  <!-- No branch (down) -->
  <path d="M 260 272 L 260 286" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="274" y="282" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- Step 4: diamond - board full -->
  <path d="M 260 290 L 350 326 L 260 362 L 170 326 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="322" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">④ len(moves)</text>
  <text x="260" y="338" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">== 9 ?</text>

  <!-- Yes (left) -> Draw -->
  <path d="M 170 326 L 110 326" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="140" y="320" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">是</text>
  <rect x="20" y="308" width="90" height="36" fill="#f0f0f0" stroke="#999" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="65" y="331" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">返回 "Draw"</text>

  <!-- No (right) -> Pending -->
  <path d="M 350 326 L 410 326" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="380" y="320" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">否</text>
  <rect x="410" y="308" width="90" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="455" y="331" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">返回 "Pending"</text>

  <!-- Bottom note -->
  <rect x="60" y="388" width="400" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="408" text-anchor="middle" font-size="10.5" fill="#444">关键不变式：moves 有效 → 获胜必发生在最后一步</text>
  <text x="260" y="424" text-anchor="middle" font-size="10.5" fill="#444">因此只需检查最后落子者，无需遍历双方</text>
  <text x="260" y="440" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">检查 1 玩家 × 8 线 = O(1)</text>
</svg>
