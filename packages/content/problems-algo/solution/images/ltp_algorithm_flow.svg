<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">频率回溯算法流程：backtrack() 返回当前可组成的序列数</text>

  <!-- ====== LEFT: main flow ====== -->
  <text x="40" y="56" font-size="12" fill="#888">主流程 numTilePossibilities</text>

  <rect x="60" y="68" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="170" y="92" text-anchor="middle" font-size="12" fill="#333">count = Counter(tiles)</text>

  <line x1="170" y1="108" x2="170" y2="128" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="130" width="220" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="170" y="154" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">return backtrack()</text>

  <line x1="170" y1="170" x2="170" y2="190" stroke="#666" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="192" width="220" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="170" y="216" text-anchor="middle" font-size="12" fill="#333">返回答案（如 "AAB"→8）</text>

  <!-- arrow to backtrack detail -->
  <path d="M 280 150 Q 330 150 348 150" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="144" font-size="10" fill="#888">展开 ↓</text>

  <!-- ====== RIGHT: backtrack detail ====== -->
  <text x="360" y="56" font-size="12" fill="#888">backtrack() 内部</text>

  <!-- start -->
  <ellipse cx="470" cy="80" rx="34" ry="14" fill="#eeeeee" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="470" y="84" text-anchor="middle" font-size="11" fill="#555">进入</text>

  <line x1="470" y1="94" x2="470" y2="112" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- total = 0 -->
  <rect x="392" y="114" width="156" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="470" y="136" text-anchor="middle" font-size="12" fill="#333">total = 0</text>

  <line x1="470" y1="148" x2="470" y2="166" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- for each ch -->
  <rect x="380" y="168" width="180" height="34" fill="#ffffff" stroke="#ccc" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="470" y="190" text-anchor="middle" font-size="12" fill="#333">for ch in count 的不同字母</text>

  <line x1="470" y1="202" x2="470" y2="218" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond: count[ch]>0? -->
  <polygon points="470,220 540,250 470,280 400,250" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="470" y="248" text-anchor="middle" font-size="11" fill="#333">count[ch]</text>
  <text x="470" y="262" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">&gt; 0 ?</text>

  <!-- No branch: back to for loop -->
  <path d="M 400 250 Q 340 250 340 188 Q 340 180 380 186" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="332" y="222" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <text x="332" y="236" text-anchor="end" font-size="9" fill="#b85450">跳过该字母</text>

  <!-- Yes branch -->
  <line x1="470" y1="280" x2="470" y2="298" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="486" y="294" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- select: count[ch]-- -->
  <rect x="378" y="300" width="184" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="470" y="322" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">count[ch] -= 1  　选</text>

  <line x1="470" y1="334" x2="470" y2="352" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- total += 1 + backtrack() -->
  <rect x="356" y="354" width="228" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="470" y="372" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">total += 1 + backtrack()</text>
  <text x="470" y="388" text-anchor="middle" font-size="9" fill="#888">+1=当前序列　backtrack()=更长序列</text>

  <line x1="470" y1="394" x2="470" y2="412" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- undo: count[ch]++ -->
  <rect x="378" y="414" width="184" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="470" y="436" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">count[ch] += 1  　撤销</text>

  <!-- loop back to for -->
  <path d="M 562 431 Q 600 431 600 188 Q 600 180 560 186" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="610" y="312" font-size="9" fill="#888">回溯</text>
  <text x="610" y="326" font-size="9" fill="#888">循环</text>

  <!-- ====== bottom note ====== -->
  <rect x="60" y="300" width="220" height="148" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="170" y="322" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">三步模板</text>
  <text x="76" y="344" font-size="11" fill="#4a7a3a" font-weight="bold">① 选</text>
  <text x="110" y="344" font-size="11" fill="#555">count[ch] -= 1</text>
  <text x="76" y="366" font-size="11" fill="#b85450" font-weight="bold">② 计</text>
  <text x="110" y="366" font-size="11" fill="#555">total += 1</text>
  <text x="110" y="382" font-size="10" fill="#888">　　+ backtrack()</text>
  <text x="76" y="404" font-size="11" fill="#4a7a3a" font-weight="bold">③ 撤</text>
  <text x="110" y="404" font-size="11" fill="#555">count[ch] += 1</text>
  <text x="76" y="426" font-size="10" fill="#888">遍历"不同字母"而非"下标"，</text>
  <text x="76" y="440" font-size="10" fill="#888">天然跳过同字母重复分支。</text>
</svg>
