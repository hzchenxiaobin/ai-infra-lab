<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：逐元素状压 DP（ndp 副本法）</text>

  <!-- Start -->
  <ellipse cx="210" cy="52" rx="70" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="56" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">dp[0] = 1（空集）</text>
  <path d="M210,68 L210,82" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- ① ndp = dp -->
  <rect x="110" y="84" width="200" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="103" text-anchor="middle" font-size="11.5" fill="#333">① ndp = dp（保留不选 v 分支）</text>
  <path d="M210,114 L210,128" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- ② 还有状态 s? diamond -->
  <polygon points="210,130 300,160 210,190 120,160" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="164" text-anchor="middle" font-size="11.5" fill="#333">② 还有状态 s ?</text>

  <!-- 是 -> ③ -->
  <path d="M300,160 L356,160" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="312" y="154" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="356" y="144" width="146" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="429" y="163" text-anchor="middle" font-size="10.5" fill="#333">③ 若 s&amp;m==0：</text>
  <text x="429" y="173" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">ndp[s|m] += dp[s]</text>
  <!-- loop back to ② -->
  <path d="M429,144 L429,118 L210,118 L210,130" stroke="#666" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="300" y="114" font-size="9.5" fill="#888">↻ 下一个状态 s</text>

  <!-- 否 -> ④ -->
  <path d="M210,190 L210,208" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="216" y="204" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  <rect x="120" y="210" width="180" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="228" text-anchor="middle" font-size="11.5" fill="#333">④ dp = ndp</text>
  <path d="M210,238 L210,254" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- ⑤ 还有元素 v? diamond -->
  <polygon points="210,256 300,286 210,316 120,286" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="290" text-anchor="middle" font-size="11.5" fill="#333">⑤ 还有元素 v ?</text>

  <!-- 是 -> loop back to ① -->
  <path d="M120,286 L70,286" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="78" y="280" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M70,286 L70,99 L108,99" stroke="#666" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="44" y="190" font-size="9.5" fill="#888" transform="rotate(-90 44 190)">↻ 下一个元素 v</text>

  <!-- 否 -> ⑥ -->
  <path d="M210,316 L210,334" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="216" y="330" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  <rect x="108" y="336" width="204" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="210" y="356" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">⑥ ans = ( Σ dp[s] ) − 1</text>
  <path d="M210,368 L210,384" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- End -->
  <ellipse cx="210" cy="404" rx="64" ry="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="408" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">返回 ans（mod 1e9+7）</text>

  <!-- side note -->
  <rect x="316" y="336" width="190" height="56" rx="8" fill="#f4f4f4" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="411" y="356" text-anchor="middle" font-size="10" fill="#666">非平方自由元素（含 4/9/25）</text>
  <text x="411" y="372" text-anchor="middle" font-size="10" fill="#666">在进入循环前已过滤掉</text>
</svg>
