<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="18" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：l 从 n−1 往 0，左扩右缩的反向双指针</text>

  <!-- 开始 -->
  <rect x="120" y="30" width="220" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="12" filter="url(#rough2)"/>
  <text x="230" y="46" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">初始化：l = r = n−1，cost = 0，队列为空</text>
  <path d="M 230 54 L 230 66" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ① 左端加入 -->
  <rect x="60" y="68" width="340" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="230" y="85" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">① 左端加入 x = nums[l]（弹出队首所有 v ≤ x 的平台）</text>
  <text x="230" y="104" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">cost += (x − v)·c，压平合并成新平台 (x, Σc + 1) 入队首</text>
  <path d="M 230 114 L 230 128" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 判断 cost > k -->
  <polygon points="230,130 300,160 230,190 160,160" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="164" text-anchor="middle" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">cost &gt; k ?</text>

  <text x="312" y="152" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 300 160 L 330 160" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- ② 右端收缩 -->
  <rect x="332" y="132" width="172" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="418" y="149" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">② 右端收缩</text>
  <text x="418" y="163" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">cost −= 队尾v − nums[r]</text>
  <text x="418" y="176" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">队尾 c−−（0 则出队），r−−</text>
  <text x="418" y="189" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">单元素窗口 cost=0，必有解</text>
  <path d="M 418 132 L 418 120 L 238 120" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="430" y="115" text-anchor="middle" font-size="8" fill="#a07830" filter="url(#rough2)">仍超预算则继续收缩</text>

  <!-- 否 → ③ -->
  <text x="239" y="207" text-anchor="middle" font-size="9" fill="#33506b" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 230 190 L 230 208" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="110" y="210" width="240" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="230" y="228" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">③ ans += r − l + 1（左端为 l 的合法子数组数）</text>
  <path d="M 230 238 L 230 252" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 判断 l == 0 -->
  <polygon points="230,254 295,284 230,314 165,284" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="288" text-anchor="middle" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">l == 0 ?</text>

  <text x="238" y="331" text-anchor="middle" font-size="9" fill="#33506b" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 230 314 L 230 328" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="172" y="330" width="116" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="11" filter="url(#rough2)"/>
  <text x="230" y="345" text-anchor="middle" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">输出 ans</text>

  <!-- 否：l−− 回到 ① -->
  <text x="128" y="277" text-anchor="middle" font-size="9" fill="#33506b" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 165 284 L 85 284 L 85 91 L 56 91" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="88" y="186" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">l−−</text>
  <text x="88" y="199" text-anchor="middle" font-size="8" fill="#33506b" filter="url(#rough2)">回到 ①</text>

  <!-- 右下角复杂度注记 -->
  <rect x="340" y="236" width="172" height="104" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="426" y="255" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">复杂度 O(n)</text>
  <text x="426" y="272" text-anchor="middle" font-size="8.5" fill="#33506b" filter="url(#rough2)">· 两端指针各移动 n 次</text>
  <text x="426" y="287" text-anchor="middle" font-size="8.5" fill="#33506b" filter="url(#rough2)">· 平台合并 / 出队摊还 O(1)</text>
  <text x="426" y="302" text-anchor="middle" font-size="8.5" fill="#33506b" filter="url(#rough2)">· 单调性：r(l) 随 l 减小不增</text>
  <text x="426" y="317" text-anchor="middle" font-size="8.5" fill="#33506b" filter="url(#rough2)">· cost 峰值约 10¹⁴</text>
  <text x="426" y="332" text-anchor="middle" font-size="8.5" fill="#33506b" filter="url(#rough2)">  → C++ 用 long long</text>

  <text x="150" y="358" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">左端只「加入」，右端只「收缩」——两端操作全部摊还 O(1)</text>
</svg>
