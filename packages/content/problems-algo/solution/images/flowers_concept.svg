<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">种花问题：相邻不能种，贪心尽早种</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">从左到右扫描，遇到空位且左右都空，就立刻种下（原地改 1）</text>

  <text x="40" y="74" font-size="11" fill="#888" filter="url(#rough2)">规则：相邻两格不能都是 1；扫描时只要「自己=0 且 左=0 且 右=0」即可种</text>

  <text x="40" y="108" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">flowerbed = [1, 0, 0, 0, 0, 0, 1]    n = 2</text>

  <g filter="url(#rough2)">
    <rect x="114" y="120" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="136" y="148" text-anchor="middle" font-size="14" fill="#446688">1</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="162" y="120" width="44" height="44" fill="#f6f6f6" stroke="#bbb" stroke-width="1.5" rx="4"/>
    <text x="184" y="148" text-anchor="middle" font-size="14" fill="#888">0</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="210" y="120" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <text x="232" y="148" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="258" y="120" width="44" height="44" fill="#f6f6f6" stroke="#bbb" stroke-width="1.5" rx="4"/>
    <text x="280" y="148" text-anchor="middle" font-size="14" fill="#888">0</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="306" y="120" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <text x="328" y="148" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="354" y="120" width="44" height="44" fill="#f6f6f6" stroke="#bbb" stroke-width="1.5" rx="4"/>
    <text x="376" y="148" text-anchor="middle" font-size="14" fill="#888">0</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="402" y="120" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="424" y="148" text-anchor="middle" font-size="14" fill="#446688">1</text>
  </g>

  <g filter="url(#rough2)" font-size="9" fill="#999">
    <text x="136" y="180" text-anchor="middle">i=0</text>
    <text x="184" y="180" text-anchor="middle">i=1</text>
    <text x="232" y="180" text-anchor="middle">i=2</text>
    <text x="280" y="180" text-anchor="middle">i=3</text>
    <text x="328" y="180" text-anchor="middle">i=4</text>
    <text x="376" y="180" text-anchor="middle">i=5</text>
    <text x="424" y="180" text-anchor="middle">i=6</text>
  </g>

  <g filter="url(#rough2)" font-size="10">
    <text x="136" y="196" text-anchor="middle" fill="#888">跳过</text>
    <text x="184" y="196" text-anchor="middle" fill="#b85450">×左堵</text>
    <text x="232" y="196" text-anchor="middle" fill="#4a7a3a" font-weight="bold">种 ✓</text>
    <text x="280" y="196" text-anchor="middle" fill="#b85450">×左堵</text>
    <text x="328" y="196" text-anchor="middle" fill="#4a7a3a" font-weight="bold">种 ✓</text>
    <text x="376" y="196" text-anchor="middle" fill="#b85450">×左堵</text>
    <text x="424" y="196" text-anchor="middle" fill="#888">跳过</text>
  </g>

  <path d="M 110 215 L 450 215" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="232" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">扫描方向（从左到右，种过就原地改 1）</text>

  <rect x="80" y="250" width="400" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="272" text-anchor="middle" font-size="12" fill="#a07820" font-weight="bold" filter="url(#rough2)">已种 count：0 → 1（i=2）→ 2（i=4）</text>
  <text x="280" y="288" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">count ≥ n=2，返回 true</text>

  <rect x="40" y="306" width="480" height="44" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="280" y="326" text-anchor="middle" font-size="11" fill="#444" font-weight="bold" filter="url(#rough2)">为什么贪心最优？</text>
  <text x="280" y="342" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">在 i 种 与 在 i+1 种本段都产 1 朵；但早种能让 i+2 仍可能可种，晚种必封死 i+2。故"能种就种"不会更差。</text>
</svg>
