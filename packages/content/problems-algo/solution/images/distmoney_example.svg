<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="560" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：money=20, children=3</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">贪心点亮 k=2 触发「4 冲突」，退一档得答案 1</text>

  <!-- Step 1 -->
  <text x="40" y="76" font-size="11" fill="#888" font-weight="bold">① 每人先发 1，用掉 3，剩 extra = 17</text>
  <g filter="url(#rough2)">
    <rect x="120" y="86" width="50" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="174" y="86" width="50" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="228" y="86" width="50" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g font-size="12">
    <text x="145" y="105" text-anchor="middle" fill="#333">$1</text>
    <text x="199" y="105" text-anchor="middle" fill="#333">$1</text>
    <text x="253" y="105" text-anchor="middle" fill="#333">$1</text>
  </g>
  <text x="430" y="105" font-size="11" fill="#666">extra = 20 − 3 = 17</text>

  <!-- arrow -->
  <line x1="280" y1="120" x2="280" y2="142" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="296" y="136" font-size="10" fill="#666">k = 17 ÷ 7 = 2，点亮 2 个</text>

  <!-- Step 2 -->
  <text x="40" y="162" font-size="11" fill="#888" font-weight="bold">② 2 个孩子 +7 变 8，零头 leftover = 17 mod 7 = 3</text>
  <g filter="url(#rough2)">
    <rect x="120" y="172" width="50" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="174" y="172" width="50" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="228" y="172" width="50" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <g font-size="12">
    <text x="145" y="191" text-anchor="middle" fill="#3a5a2a" font-weight="bold">$8</text>
    <text x="199" y="191" text-anchor="middle" fill="#3a5a2a" font-weight="bold">$8</text>
    <text x="253" y="191" text-anchor="middle" fill="#7a5a20">$1+?</text>
  </g>
  <text x="145" y="214" text-anchor="middle" font-size="9" fill="#4a7a3a">+7</text>
  <text x="199" y="214" text-anchor="middle" font-size="9" fill="#4a7a3a">+7</text>
  <text x="430" y="191" font-size="11" fill="#666">r = 3 − 2 = 1 人待分</text>

  <!-- arrow -->
  <line x1="280" y1="220" x2="280" y2="242" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="298" y="236" font-size="10" fill="#b85450">零头 3 只能塞给这 1 人</text>

  <!-- Step 3 conflict -->
  <text x="40" y="262" font-size="11" fill="#b85450" font-weight="bold">③ 那 1 人被迫拿 1 + 3 = 4 → 违规！</text>
  <g filter="url(#rough2)">
    <rect x="120" y="272" width="50" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="174" y="272" width="50" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="228" y="272" width="50" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <g font-size="12">
    <text x="145" y="291" text-anchor="middle" fill="#3a5a2a" font-weight="bold">$8</text>
    <text x="199" y="291" text-anchor="middle" fill="#3a5a2a" font-weight="bold">$8</text>
    <text x="253" y="291" text-anchor="middle" fill="#b03a3a" font-weight="bold">$4</text>
  </g>
  <text x="430" y="291" font-size="11" fill="#b85450" font-weight="bold">k=2 方案不成立 ✗</text>

  <!-- arrow -->
  <line x1="280" y1="316" x2="280" y2="340" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="298" y="334" font-size="10" fill="#666">退一档 k = 1</text>

  <!-- Step 4 resolve -->
  <text x="40" y="362" font-size="11" fill="#4a7a3a" font-weight="bold">④ 少点亮 1 个：1 人得 8，剩 2 人分 20−8 = 12（如 6 + 6）</text>
  <g filter="url(#rough2)">
    <rect x="120" y="372" width="50" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="174" y="372" width="50" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="228" y="372" width="50" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <g font-size="12">
    <text x="145" y="391" text-anchor="middle" fill="#3a5a2a" font-weight="bold">$8</text>
    <text x="199" y="391" text-anchor="middle" fill="#7a5a20" font-weight="bold">$6</text>
    <text x="253" y="391" text-anchor="middle" fill="#7a5a20" font-weight="bold">$6</text>
  </g>
  <text x="430" y="391" font-size="11" fill="#4a7a3a">均 ≠ 4、≠ 8 ✓</text>

  <!-- result banner -->
  <rect x="120" y="430" width="320" height="40" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="456" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold">答案 = 1（恰好 1 人得 8 美元）</text>

  <!-- generalization note -->
  <rect x="60" y="486" width="440" height="60" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="506" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold">一般规律</text>
  <text x="280" y="522" text-anchor="middle" font-size="10.5" fill="#7a5a20">k = (money−children) ÷ 7；若 r=1 且 leftover=3 则 k−−</text>
  <text x="280" y="538" text-anchor="middle" font-size="10.5" fill="#7a5a20">退一档后多出的 7 与零头 3 合为 10，分给 2 人总能避开 4/8</text>
</svg>
