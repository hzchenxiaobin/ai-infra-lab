<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">核心观察：分隔符拼接有歧义，长度前缀无歧义</text>

  <!-- ===== 左半：暴力分隔符拼接（失败）===== -->
  <rect x="24" y="48" width="250" height="320" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6,4" rx="10" filter="url(#rough2)"/>
  <text x="149" y="70" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">暴力：分隔符拼接 ✗</text>

  <text x="40" y="96" font-size="11" fill="#555">输入列表：</text>
  <rect x="40" y="104" width="70" height="28" fill="#fff" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="75" y="122" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">"ab,cd"</text>
  <rect x="120" y="104" width="50" height="28" fill="#fff" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="145" y="122" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">"ef"</text>

  <text x="40" y="156" font-size="11" fill="#555">用逗号拼接 →</text>
  <rect x="40" y="164" width="200" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="140" y="186" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">"ab,cd,ef"</text>

  <path d="M 149 204 L 149 230" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <text x="40" y="248" font-size="11" fill="#b85450" font-weight="bold">解码时产生歧义：</text>
  <rect x="40" y="258" width="200" height="30" fill="#fff" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="140" y="278" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">["ab","cd","ef"] ?</text>

  <rect x="40" y="296" width="200" height="30" fill="#fff" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="140" y="316" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">["ab,cd","ef"] ?</text>

  <text x="149" y="350" text-anchor="middle" font-size="11" fill="#b85450">分隔符出现在内容中 → 无法区分</text>

  <!-- ===== 右半：长度前缀（成功）===== -->
  <rect x="290" y="48" width="250" height="320" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="415" y="70" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">长度前缀：len # content ✓</text>

  <text x="306" y="96" font-size="11" fill="#555">输入列表：</text>
  <rect x="306" y="104" width="70" height="28" fill="#fff" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="341" y="122" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">"ab,cd"</text>
  <rect x="386" y="104" width="50" height="28" fill="#fff" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="411" y="122" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">"ef"</text>

  <text x="306" y="156" font-size="11" fill="#555">每段前写「长度#」→</text>
  <rect x="306" y="164" width="218" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="415" y="186" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">5#ab,cd2#ef</text>

  <path d="M 415 204 L 415 230" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="306" y="248" font-size="11" fill="#4a7a3a" font-weight="bold">解码按长度精确截取：</text>
  <rect x="306" y="258" width="218" height="30" fill="#fff" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="415" y="278" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">读到# → 长度=5 → 读5字符</text>

  <rect x="306" y="296" width="218" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="415" y="316" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">["ab,cd","ef"] ✓ 唯一</text>

  <text x="415" y="350" text-anchor="middle" font-size="11" fill="#4a7a3a">长度定界 → 内容任意字符都不怕</text>
</svg>
