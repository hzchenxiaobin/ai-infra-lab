<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="560" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：求 m → 双键入表 → 边扫边配，O(n) 一趟</text>

  <ellipse cx="280" cy="54" rx="52" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="59" text-anchor="middle" font-size="13" fill="#333">开始</text>

  <path d="M 280 72 L 280 84" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <rect x="140" y="88" width="280" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="106" text-anchor="middle" font-size="12" fill="#333">试除分解 k = ∏ p^e（O(√k)，k ≤ 1000）</text>
  <text x="280" y="122" text-anchor="middle" font-size="12" fill="#333">求 m = ∏ p^⌈e/2⌉（最小 v 使 v² % k == 0）</text>

  <path d="M 280 128 L 280 140" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <rect x="140" y="144" width="280" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="162" text-anchor="middle" font-size="12" fill="#333">cnt 清空，放入空前缀 (0, 0) : 1</text>
  <text x="280" y="178" text-anchor="middle" font-size="12" fill="#446688">ans = 0，V = 0，p = 1</text>

  <path d="M 280 184 L 280 196" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <rect x="140" y="200" width="280" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="222" text-anchor="middle" font-size="12" fill="#333">V += isVowel(s[p−1])（增量维护元音数）</text>

  <path d="M 280 236 L 280 248" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <rect x="140" y="252" width="280" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="274" text-anchor="middle" font-size="12" fill="#333">key = ( 2V − p, V mod m )</text>

  <path d="M 280 288 L 280 300" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <rect x="140" y="304" width="280" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="326" text-anchor="middle" font-size="12" fill="#333">ans += cnt[key]；cnt[key] += 1</text>

  <path d="M 280 340 L 280 356" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <polygon points="280,360 384,398 280,436 176,398" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="402" text-anchor="middle" font-size="12" fill="#333">p &lt; n？</text>

  <path d="M 176 398 L 84 398 L 84 218 L 134 218" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <text x="146" y="388" text-anchor="middle" font-size="11" fill="#446688">是</text>
  <text x="30" y="390" font-size="11" fill="#446688">p++</text>

  <path d="M 280 436 L 280 452" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <text x="292" y="450" font-size="11" fill="#b85450">否</text>

  <ellipse cx="280" cy="484" rx="62" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="489" text-anchor="middle" font-size="13" fill="#333">返回 ans</text>

  <rect x="60" y="516" width="440" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="536" text-anchor="middle" font-size="11" fill="#b85450">⚠ 坑：①空前缀 (0,0) 必须先入表 ②ans 用 long long（最坏 ≈1.25×10⁹）</text>
</svg>
