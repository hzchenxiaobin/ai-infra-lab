<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 478"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="478" fill="#fafafa"/>

  <text x="290" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：每个 r 一次「收缩 → 插入 → 查询」，全程 O(15n)</text>

  <!-- 开始 -->
  <rect x="230" y="30" width="180" height="32" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="50" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">初始化：L = 0，ans = 0</text>

  <path d="M 320 62 L 320 76" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 入队 -->
  <rect x="150" y="80" width="340" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="98" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">r 右移一格：nums[r] 入双单调队列</text>
  <text x="320" y="116" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">maxDq 值递减 ｜ minDq 值递增（都存下标）</text>

  <path d="M 320 128 L 320 142" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="320,146 455,192 320,238 185,192" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="188" text-anchor="middle" font-size="11.5" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">极差 &gt; k ?</text>
  <text x="320" y="205" text-anchor="middle" font-size="8" fill="#8a6d1a" filter="url(#rough2)">nums[maxDq头] − nums[minDq头]</text>

  <!-- 是：收缩 -->
  <path d="M 320 238 L 320 255" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="330" y="252" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="90" y="260" width="280" height="70" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="278" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">Trie 删除 pref[L]（路径 cnt − 1）</text>
  <text x="230" y="296" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">两队列弹掉下标 == L 的队头</text>
  <text x="230" y="314" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">L++，回到菱形重新判定极差</text>

  <path d="M 90 295 L 64 295 L 64 192 L 178 192" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="46" y="184" font-size="9" fill="#b85450" filter="url(#rough2)">重测极差</text>

  <!-- 否：插入 -->
  <path d="M 455 192 L 525 192 L 525 213" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="482" y="184" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="440" y="217" width="120" height="54" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="500" y="239" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">Trie 插入 pref[r]</text>
  <text x="500" y="257" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">（路径 cnt + 1）</text>

  <path d="M 500 271 L 500 287" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 查询 -->
  <rect x="400" y="291" width="170" height="74" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="485" y="311" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">以 pref[r+1] 贪心查询</text>
  <text x="485" y="329" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">高位 → 低位</text>
  <text x="485" y="347" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">优先走反位 → cur</text>

  <path d="M 485 365 L 485 381" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 更新答案 -->
  <rect x="405" y="385" width="160" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="485" y="405" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">ans = max(ans, cur)</text>

  <!-- r 循环 -->
  <path d="M 405 401 L 40 401 L 40 104 L 144 104" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="416" font-size="9.5" fill="#33506b" filter="url(#rough2)">r++（未遍历完）</text>

  <!-- 均摊说明 -->
  <rect x="90" y="348" width="280" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="230" y="366" text-anchor="middle" font-size="9.5" fill="#8a6d1a" filter="url(#rough2)">均摊：每个下标至多进出队列一次、</text>
  <text x="230" y="382" text-anchor="middle" font-size="9.5" fill="#8a6d1a" filter="url(#rough2)">进出 Trie 一次（各 15 步）⇒ O(15n)</text>

  <!-- 结束 -->
  <path d="M 485 417 L 485 433" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="495" y="430" font-size="8.5" fill="#666" filter="url(#rough2)">r = n−1</text>

  <rect x="410" y="437" width="150" height="30" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="485" y="456" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 ans</text>
</svg>
