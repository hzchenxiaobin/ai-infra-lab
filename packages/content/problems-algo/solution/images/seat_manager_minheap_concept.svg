<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bbb" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：可用座位集合 = 最小堆</text>

  <!-- ===== 暴力路径（淡化）：布尔数组扫描 ===== -->
  <text x="36" y="58" font-size="11.5" fill="#aaa" font-weight="bold">暴力：布尔数组 + 每次从头扫描找最小</text>

  <rect x="36" y="64" width="34" height="26" fill="#f2f2f2" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="53" y="82" text-anchor="middle" font-size="11" fill="#999" font-weight="bold">1</text>
  <rect x="70" y="64" width="34" height="26" fill="#f2f2f2" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="87" y="82" text-anchor="middle" font-size="11" fill="#999" font-weight="bold">2</text>
  <rect x="104" y="64" width="34" height="26" fill="#fce4ec" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="121" y="82" text-anchor="middle" font-size="10" fill="#999">3</text>
  <rect x="138" y="64" width="34" height="26" fill="#f2f2f2" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="155" y="82" text-anchor="middle" font-size="10" fill="#999">4</text>
  <rect x="172" y="64" width="34" height="26" fill="#f2f2f2" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="189" y="82" text-anchor="middle" font-size="10" fill="#999">5</text>

  <path d="M 210 77 L 250 77" stroke="#bbb" stroke-width="1.3" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="230" y="71" text-anchor="middle" font-size="9" fill="#aaa">扫描</text>
  <rect x="250" y="64" width="70" height="26" fill="#f2f2f2" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="285" y="82" text-anchor="middle" font-size="11" fill="#999" font-weight="bold">→ 返回1</text>
  <text x="338" y="82" font-size="10" fill="#aaa">O(n) / 次</text>

  <path d="M 32 60 L 372 94" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="6,4" filter="url(#rough2)" opacity="0.7"/>
  <text x="430" y="72" font-size="10.5" fill="#b85450" font-weight="bold">每次预约都要</text>
  <text x="430" y="86" font-size="10.5" fill="#b85450" font-weight="bold">从头扫到尾！</text>

  <!-- ===== 核心路径（高亮）：最小堆 ===== -->
  <text x="36" y="120" font-size="11.5" fill="#4a7a3a" font-weight="bold">核心：最小堆——堆顶即最小可用座位</text>

  <!-- 堆的树形结构 -->
  <!-- root -->
  <rect x="150" y="132" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="172" y="152" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <!-- level 2 -->
  <rect x="100" y="178" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="120" y="197" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <rect x="204" y="178" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="224" y="197" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>
  <!-- level 3 -->
  <rect x="72" y="222" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="90" y="240" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">4</text>
  <rect x="120" y="222" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="138" y="240" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">5</text>

  <!-- edges -->
  <path d="M 160 162 L 120 178" stroke="#888" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 184 162 L 224 178" stroke="#888" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 110 206 L 90 222" stroke="#888" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 130 206 L 138 222" stroke="#888" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <text x="172" y="126" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">堆顶 = 全局最小</text>

  <!-- reserve: pop -->
  <text x="300" y="140" font-size="12" fill="#b85450" font-weight="bold">reserve()：弹出堆顶</text>
  <path d="M 196 147 L 290 147" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="243" y="140" text-anchor="middle" font-size="9.5" fill="#b85450">heappop</text>
  <rect x="294" y="132" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="314" y="152" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="350" y="132" width="118" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="409" y="152" text-anchor="middle" font-size="10.5" fill="#555">返回 1，O(log n)</text>

  <!-- unreserve: push -->
  <text x="300" y="200" font-size="12" fill="#4a7a3a" font-weight="bold">unreserve(x)：压回堆</text>
  <rect x="294" y="206" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="314" y="224" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
  <path d="M 334 220 L 386 220" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="360" y="214" text-anchor="middle" font-size="9.5" fill="#4a7a3a">heappush</text>
  <rect x="390" y="206" width="118" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="449" y="224" text-anchor="middle" font-size="10.5" fill="#555">座位重回可用，O(log n)</text>

  <!-- 堆顶上浮示意：push 后小元素上浮 -->
  <text x="300" y="256" font-size="9.5" fill="#888">push 后按堆性质「上浮」到正确位置</text>
  <path d="M 314 234 L 314 246" stroke="#888" stroke-width="1.3" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== 底部 insight boxes ===== -->
  <rect x="36" y="300" width="245" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="158" y="320" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">堆 = 动态维护最小值</text>
  <text x="158" y="336" text-anchor="middle" font-size="10" fill="#555">reserve 取最小 → 正好是堆顶</text>
  <text x="158" y="348" text-anchor="middle" font-size="10" fill="#555">unreserve 归还 → 压回堆即可</text>

  <rect x="300" y="300" width="245" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="422" y="320" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">堆顶永远是最小可用座位</text>
  <text x="422" y="336" text-anchor="middle" font-size="10" fill="#555">无需排序、无需扫描</text>
  <text x="422" y="348" text-anchor="middle" font-size="10" fill="#555">两操作均 O(log n)</text>

  <!-- 底部对照说明 -->
  <rect x="36" y="362" width="509" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)" opacity="0.55"/>
  <text x="290" y="382" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">对照</text>
  <text x="290" y="398" text-anchor="middle" font-size="10" fill="#555">暴力每次 O(n) 扫描 vs 堆每次 O(log n) 取/还</text>
</svg>
