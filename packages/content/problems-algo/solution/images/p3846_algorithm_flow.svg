<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrW" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#999"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="18" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：建 26 键坐标表 → 单趟扫描逐键累加</text>

  <!-- start -->
  <rect x="170" y="30" width="100" height="24" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="46" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">开始</text>
  <path d="M 220 54 L 220 66" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 1: build pos table -->
  <rect x="100" y="68" width="240" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="84" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">① 建坐标表 pos：O(26)</text>
  <text x="220" y="100" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">qwertyuiop / asdfghjkl / zxcvbnm → (r, c)</text>
  <path d="M 220 110 L 220 122" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 2: init -->
  <rect x="120" y="124" width="200" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="141" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">② pre ← 'a'（手指起点），ans ← 0</text>
  <path d="M 220 150 L 220 162" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 3: diamond -->
  <polygon points="220,164 306,196 220,228 134,196" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="220" y="200" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">③ s 还有</text>
  <text x="220" y="212" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">未处理字符？</text>

  <!-- yes branch -->
  <path d="M 220 228 L 220 242" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="230" y="240" text-anchor="start" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- step 4: process -->
  <rect x="100" y="244" width="240" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="262" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">④ 查表 pos[pre]、pos[cur]</text>
  <text x="220" y="280" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">ans += |r₁−r₂| + |c₁−c₂|；pre ← cur</text>

  <!-- loop back -->
  <path d="M 100 268 L 66 268 L 66 196 L 130 196" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>
  <text x="76" y="244" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">循环</text>
  <text x="76" y="256" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">取下一字符</text>

  <!-- no branch -->
  <path d="M 306 196 L 352 196" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="322" y="190" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- step 5: return -->
  <rect x="356" y="178" width="112" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="412" y="200" text-anchor="middle" font-size="11" fill="#2a5a1e" font-weight="bold" filter="url(#rough2)">⑤ 返回 ans</text>

  <!-- complexity box -->
  <rect x="356" y="64" width="140" height="100" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="426" y="82" text-anchor="middle" font-size="10" fill="#2a5a1e" font-weight="bold" filter="url(#rough2)">复杂度与上界</text>
  <text x="426" y="100" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">时间 O(n + 26)</text>
  <text x="426" y="116" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">空间 O(26)</text>
  <text x="426" y="132" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">每字符恰一次 O(1) 查表</text>
  <text x="426" y="150" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">ans ≤ 11×10⁴，int 安全</text>

  <!-- bottom note -->
  <rect x="36" y="306" width="448" height="60" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="326" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">示例演算：s = "hello" → a→h(+5) → e(+4) → l(+7) → l(+0) → o(+1)</text>
  <text x="260" y="344" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">ans = 5 + 4 + 7 + 0 + 1 = 17 ✓</text>
  <text x="260" y="360" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">起点固定 'a' 而非 s[0]——pre 初始化为 'a'，起点→首字符的移动并入循环，零特判</text>
</svg>
