<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#aaa"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">边积分 = 所有“指向该节点”的源编号之和（示例 1）</text>

  <!-- EDGES (drawn before nodes) -->
  <g filter="url(#rough2)">
    <!-- left mutual pair: 1 <-> 0 ; 1 at (260,120) r16, 0 at (180,120) r16 -->
    <!-- 1 -> 0 (upper line y=114, going left) -->
    <line x1="244" y1="114" x2="196" y2="114" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)"/>
    <!-- 0 -> 1 (lower line y=126, going right) : contributes 0 to node 1 -->
    <line x1="196" y1="126" x2="244" y2="126" stroke="#aaa" stroke-width="1.3" marker-end="url(#arrG)"/>

    <!-- 2 -> 0 : (90,90) -> (170,108) -->
    <line x1="106" y1="90" x2="170" y2="108" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)"/>
    <!-- 3 -> 0 : (90,150) -> (170,132) -->
    <line x1="106" y1="150" x2="170" y2="132" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)"/>
    <!-- 4 -> 0 : (90,210) -> (174,136) -->
    <line x1="106" y1="210" x2="174" y2="136" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)"/>

    <!-- right mutual pair: 5 <-> 7 ; 7 at (440,120) r16, 5 at (520,120) r16 -->
    <!-- 5 -> 7 (upper line y=114, going left) -->
    <line x1="504" y1="114" x2="456" y2="114" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)"/>
    <!-- 7 -> 5 (lower line y=126, going right) : contributes 7 to node 5 -->
    <line x1="456" y1="126" x2="504" y2="126" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arrO)"/>

    <!-- 6 -> 7 : (550,200) -> (450,134) -->
    <line x1="534" y1="200" x2="450" y2="134" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)"/>
  </g>

  <!-- NODES (circles) -->
  <g filter="url(#rough2)">
    <!-- 1 -->
    <circle cx="260" cy="120" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="260" y="125" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
    <!-- 0 : runner-up, score 10 -->
    <circle cx="180" cy="120" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="180" y="125" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
    <!-- 2,3,4 : funnel sources -->
    <circle cx="90" cy="90" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="90" y="95" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
    <circle cx="90" cy="150" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="90" y="155" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
    <circle cx="90" cy="210" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="90" y="215" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>

    <!-- 7 : answer, score 11 (red highlight) -->
    <circle cx="440" cy="120" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
    <text x="440" y="125" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">7</text>
    <!-- 5 : score 7 -->
    <circle cx="520" cy="120" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="520" y="125" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
    <!-- 6 : funnel source -->
    <circle cx="550" cy="200" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="550" y="205" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  </g>

  <!-- SCORE boxes under nodes -->
  <g filter="url(#rough2)">
    <!-- node 1 : score 0 (from node 0, whose label is 0) -->
    <rect x="237" y="145" width="46" height="20" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="260" y="160" text-anchor="middle" font-size="11" fill="#999">0</text>
    <!-- node 0 : score 10 -->
    <rect x="130" y="145" width="100" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="180" y="161" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1+2+3+4 = 10</text>

    <!-- node 2,3,4 : score 0 -->
    <rect x="67" y="113" width="46" height="18" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="90" y="126" text-anchor="middle" font-size="10" fill="#999">0</text>
    <rect x="67" y="173" width="46" height="18" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="90" y="186" text-anchor="middle" font-size="10" fill="#999">0</text>
    <rect x="67" y="233" width="46" height="18" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="90" y="246" text-anchor="middle" font-size="10" fill="#999">0</text>

    <!-- node 7 : score 11 (answer, red) -->
    <rect x="388" y="145" width="104" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="440" y="161" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5+6 = 11 ★</text>
    <!-- node 5 : score 7 (from node 7) -->
    <rect x="497" y="145" width="46" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="520" y="160" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7</text>
    <!-- node 6 : score 0 -->
    <rect x="527" y="223" width="46" height="18" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="550" y="236" text-anchor="middle" font-size="10" fill="#999">0</text>
  </g>

  <!-- insight callout -->
  <rect x="40" y="285" width="540" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="310" y="301" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">核心：每点恰一条出边 ⇒ 源 i 恰贡献一次 ⇒ score[edges[i]] += i，一次遍历 O(n)</text>

  <!-- contrast note with 2360 -->
  <rect x="40" y="320" width="540" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="338" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">同一“函数图”模型：2360 看出边方向（找环/命运），2374 看入边方向（积分/贡献）</text>
  <text x="310" y="355" text-anchor="middle" font-size="11" fill="#666">反转视角：从“谁指向我(O(n²))”翻转为“我指向谁→投进那个桶(O(n))”</text>
</svg>
