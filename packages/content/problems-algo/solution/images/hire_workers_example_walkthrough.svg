<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrW" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="560" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold">示例演算：costs=[17,12,10,2,7,2,11,20,8]，k=3，candidates=4</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">前窗候选 4 个 · 后窗候选 4 个 · 中间 1 个待入堆 · 绿框=本轮雇佣</text>

  <!-- Initial state -->
  <text x="40" y="68" font-size="12" fill="#446688" font-weight="bold">初始：left=4, right=4（中间仅 idx4=7 待入堆）</text>
  <text x="40" y="86" font-size="10.5" fill="#666">front = {(2,3),(10,2),(12,1),(17,0)}　back = {(2,5),(8,8),(11,6),(20,7)}</text>

  <path d="M 280 96 L 280 118" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>

  <!-- Session 1 -->
  <text x="40" y="138" font-size="12" fill="#446688" font-weight="bold">第 1 轮：front 堆顶 (2,3) ≤ back 堆顶 (2,5)</text>
  <text x="40" y="156" font-size="10.5" fill="#4a7a3a" font-weight="bold">代价并列=2，取下标小者 → 弹 front (idx3)</text>
  <text x="40" y="172" font-size="10.5" fill="#4a7a3a">ans += 2 → ans=2；left=4 ≤ right=4 → front 补入 (7,4)，left=5</text>
  <rect x="40" y="180" width="240" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="196" text-anchor="middle" font-size="11" fill="#333">front: {(7,4),(10,2),(12,1),(17,0)}</text>
  <rect x="300" y="180" width="220" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="410" y="196" text-anchor="middle" font-size="11" fill="#333">back: {(2,5),(8,8),(11,6),(20,7)}</text>
  <text x="460" y="216" font-size="11.5" fill="#b85450" font-weight="bold">ans = 2</text>

  <path d="M 280 228 L 280 250" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>

  <!-- Session 2 -->
  <text x="40" y="270" font-size="12" fill="#446688" font-weight="bold">第 2 轮：front 堆顶 (7,4) ＞ back 堆顶 (2,5)</text>
  <text x="40" y="288" font-size="10.5" fill="#d6a040" font-weight="bold">后窗代价更小 → 弹 back (idx5)</text>
  <text x="40" y="304" font-size="10.5" fill="#d6a040">ans += 2 → ans=4；left=5 &gt; right=4 → back 不补员（中间已耗尽）</text>
  <rect x="40" y="328" width="240" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="160" y="344" text-anchor="middle" font-size="11" fill="#333">front: {(7,4),(10,2),(12,1),(17,0)}</text>
  <rect x="300" y="328" width="220" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="410" y="344" text-anchor="middle" font-size="11" fill="#333">back: {(8,8),(11,6),(20,7)}</text>
  <text x="460" y="364" font-size="11.5" fill="#b85450" font-weight="bold">ans = 4</text>

  <path d="M 280 376 L 280 398" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>

  <!-- Session 3 -->
  <text x="40" y="418" font-size="12" fill="#446688" font-weight="bold">第 3 轮：front 堆顶 (7,4) ＜ back 堆顶 (8,8)</text>
  <text x="40" y="436" font-size="10.5" fill="#4a7a3a" font-weight="bold">弹 front (idx4)</text>
  <text x="40" y="452" font-size="10.5" fill="#4a7a3a">ans += 7 → ans=11；left=5 &gt; right=4 → front 不补员</text>
  <rect x="40" y="460" width="240" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="160" y="476" text-anchor="middle" font-size="11" fill="#333">front: {(10,2),(12,1),(17,0)}</text>
  <rect x="300" y="460" width="220" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="410" y="476" text-anchor="middle" font-size="11" fill="#333">back: {(8,8),(11,6),(20,7)}</text>
  <text x="460" y="496" font-size="11.5" fill="#b85450" font-weight="bold">ans = 11</text>

  <!-- Result -->
  <path d="M 280 504 L 280 520" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>
  <rect x="60" y="524" width="440" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="76" y="543" font-size="12.5" fill="#4a7a3a" font-weight="bold">最终结果：3 轮雇佣代价 2 + 2 + 7 = 11 ✓</text>
</svg>
