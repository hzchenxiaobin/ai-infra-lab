<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：外层打擂台（&gt; 重置 / == 累加）+ 内层剥位双聚合</text>

  <!-- 开始 -->
  <rect x="170" y="36" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="55" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">best = −1，sum = 0，遍历 nums</text>

  <path d="M 280 66 L 280 78" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 取下一个数 -->
  <rect x="155" y="80" width="250" height="32" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="100" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">取下一个 x：mx = 0，mn = 9，t = x</text>

  <path d="M 280 112 L 280 124" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 内层剥位循环（子程序框） -->
  <rect x="150" y="126" width="260" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="145" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">剥位循环 while t &gt; 0：</text>
  <text x="280" y="161" text-anchor="middle" font-size="10" fill="#8a6d1a" filter="url(#rough2)">d = t % 10；mx = max(mx, d)</text>
  <text x="280" y="175" text-anchor="middle" font-size="10" fill="#8a6d1a" filter="url(#rough2)">mn = min(mn, d)；t /= 10</text>

  <path d="M 280 182 L 280 194" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- r = mx − mn -->
  <rect x="175" y="196" width="210" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="215" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">r = mx − mn　（0 ≤ r ≤ 9）</text>

  <path d="M 280 226 L 280 240" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 菱形 1：r > best ? -->
  <polygon points="280,242 366,276 280,310 194,276" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="281" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">r &gt; best ？</text>

  <text x="370" y="266" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 366 276 L 388 276" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- 登基框 -->
  <rect x="392" y="254" width="148" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="466" y="272" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">best = r；sum = x</text>
  <text x="466" y="289" text-anchor="middle" font-size="9.5" fill="#8a3030" filter="url(#rough2)">登基 · 旧账作废（是赋值！）</text>

  <text x="290" y="328" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 280 310 L 280 328" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 菱形 2：r == best ? -->
  <polygon points="280,330 356,362 280,394 204,362" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="367" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">r == best ？</text>

  <text x="360" y="352" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 356 362 L 388 362" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 入伙框 -->
  <rect x="392" y="342" width="148" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="466" y="360" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">sum += x</text>
  <text x="466" y="376" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">平局 · 入伙</text>

  <text x="290" y="412" font-size="10.5" fill="#888" font-weight="bold" filter="url(#rough2)">否（跳过）</text>
  <path d="M 280 394 L 280 402" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 汇合点 -->
  <circle cx="280" cy="408" r="4" fill="#446688" filter="url(#rough2)"/>

  <!-- 登基/入伙回流线 -->
  <path d="M 540 278 C 552 278, 552 340, 552 408 L 292 408" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 466 382 L 466 402" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <path d="M 280 412 L 280 420" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 菱形 3：还有下一个数 ? -->
  <polygon points="280,424 362,456 280,488 198,456" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="461" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">还有下一个数 ？</text>

  <text x="192" y="446" text-anchor="end" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 198 456 C 50 456, 50 96, 151 96" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <text x="368" y="448" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 362 456 L 384 456" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 返回 -->
  <rect x="388" y="438" width="120" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="448" y="460" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 sum</text>
</svg>
