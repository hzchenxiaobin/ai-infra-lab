<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：相邻词共享衔接字符，末词绕回首词形成环</text>
  <text x="30" y="46" font-size="11.5" fill="#888">以 "leetcode exercises sound delightful" 为例：</text>

  <!-- 词块 A -->
  <rect x="40" y="62" width="95" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="78" y="87" text-anchor="middle" font-size="13" fill="#333">leetcod</text>
  <rect x="110" y="62" width="25" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="122" y="87" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">e</text>

  <!-- 衔接箭头 A→B -->
  <path d="M 135 82 L 168 82" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="151" y="74" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">e=e</text>

  <!-- 词块 B -->
  <rect x="168" y="62" width="25" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="87" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">e</text>
  <rect x="193" y="62" width="87" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="236" y="87" text-anchor="middle" font-size="13" fill="#333">exercises</text>

  <!-- 衔接箭头 B→C -->
  <path d="M 280 82 L 312 82" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="74" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">s=s</text>

  <!-- 词块 C -->
  <rect x="312" y="62" width="25" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="324" y="87" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">s</text>
  <rect x="337" y="62" width="55" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="364" y="87" text-anchor="middle" font-size="13" fill="#333">ound</text>

  <!-- 衔接箭头 C→D -->
  <path d="M 392 82 L 414 82" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="403" y="74" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">d=d</text>

  <!-- 词块 D -->
  <rect x="414" y="62" width="25" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="426" y="87" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">d</text>
  <rect x="439" y="62" width="88" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="483" y="87" text-anchor="middle" font-size="13" fill="#333">elightful</text>
  <!-- D 末字符 -->
  <rect x="527" y="62" width="22" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="538" y="87" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">l</text>

  <!-- 首尾相接 U 形箭头：D 末字符 → A 首字符 -->
  <path d="M 538 104 C 538 200, 122 200, 122 104" stroke="#446688" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="330" y="198" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">首尾相接：末词末字符 l = 首词首字符 l</text>

  <!-- 说明框 -->
  <rect x="30" y="226" width="500" height="134" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="250" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">回环的两条判定条件</text>

  <text x="50" y="276" font-size="12" fill="#446688" font-weight="bold">①</text>
  <text x="74" y="276" font-size="12" fill="#333">每个单词末字符 = 下一个单词首字符（环上相邻衔接点）</text>

  <text x="50" y="300" font-size="12" fill="#446688" font-weight="bold">②</text>
  <text x="74" y="300" font-size="12" fill="#333">最后一个单词末字符 = 第一个单词首字符（首尾闭合）</text>

  <text x="50" y="326" font-size="11.5" fill="#888">红格 = 前词末字符，绿格 = 后词首字符；相邻红/绿格必须同字母</text>
  <text x="50" y="346" font-size="11.5" fill="#888">单词内部字符（蓝格）不参与判定，只需看每个词的两端</text>
</svg>
