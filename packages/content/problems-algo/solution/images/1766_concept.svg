<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：祖先按值分桶，桶顶 = 路径中该值的最深祖先</text>

  <!-- ===== Left: Tree with ancestor path ===== -->
  <text x="95" y="56" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">DFS 到节点 i 的路径</text>

  <g filter="url(#rough2)" font-size="13" font-weight="bold" text-anchor="middle">
    <circle cx="95" cy="84" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <text x="95" y="89" fill="#446688">0</text>
    <text x="118" y="80" font-size="10" fill="#888" font-weight="normal">val=2</text>

    <circle cx="95" cy="146" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="95" y="151" fill="#4a7a3a">1</text>
    <text x="118" y="142" font-size="10" fill="#888" font-weight="normal">val=3</text>

    <circle cx="60" cy="212" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
    <text x="60" y="217" fill="#b85450">2</text>
    <text x="38" y="212" font-size="10" fill="#888" font-weight="normal">i</text>
    <text x="38" y="226" font-size="10" fill="#b85450" font-weight="normal">val=3</text>

    <circle cx="135" cy="212" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="135" y="217" fill="#d6a040">3</text>
    <text x="158" y="212" font-size="10" fill="#888" font-weight="normal">val=2</text>
  </g>

  <!-- ancestor path edges (highlighted) -->
  <g filter="url(#rough2)" stroke="#b85450" stroke-width="2.4" fill="none">
    <path d="M 95 101 L 95 129" marker-end="url(#arrR)"/>
    <path d="M 88 163 L 67 195" marker-end="url(#arrR)"/>
  </g>
  <!-- sibling edge (dashed, not on path) -->
  <g filter="url(#rough2)" stroke="#bbb" stroke-width="1.6" fill="none" stroke-dasharray="4 3">
    <path d="M 102 163 L 128 195"/>
  </g>

  <text x="95" y="252" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">红色 = 当前路径（祖先链）</text>

  <!-- Arrow: tree → buckets -->
  <path d="M 175 175 L 225 175" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="168" text-anchor="middle" font-size="9" fill="#666" font-weight="bold" filter="url(#rough2)">按值分桶</text>

  <!-- ===== Middle: per-value stacks ===== -->
  <text x="340" y="56" text-anchor="middle" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">path[v]：值为 v 的祖先栈</text>

  <g filter="url(#rough2)" font-size="10">
    <!-- path[2] -->
    <rect x="265" y="70" width="150" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5"/>
    <text x="275" y="86" font-weight="bold" fill="#446688">path[2]</text>
    <rect x="275" y="92" width="36" height="22" fill="#fff" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="293" y="106" text-anchor="middle" fill="#446688" font-weight="bold">0</text>
    <text x="320" y="108" font-size="9" fill="#888">← 栈顶(d0)</text>
    <text x="360" y="108" font-size="9" fill="#888">val=2</text>

    <!-- path[3] -->
    <rect x="265" y="136" width="150" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5"/>
    <text x="275" y="152" font-weight="bold" fill="#4a7a3a">path[3]</text>
    <rect x="275" y="158" width="36" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <text x="293" y="172" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="313" y="158" width="36" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <text x="331" y="172" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="355" y="172" font-size="9" fill="#888">← 栈顶(d2)</text>
    <text x="275" y="196" font-size="8.5" fill="#888">同值祖先按深度递增</text>

    <!-- path[其他] -->
    <rect x="265" y="218" width="150" height="34" fill="#f0f0f0" stroke="#aaa" stroke-width="1.4" rx="5"/>
    <text x="275" y="234" font-weight="bold" fill="#888">path[其他值]</text>
    <text x="275" y="248" font-size="9" fill="#888">∅（路径上未出现）</text>
  </g>

  <text x="340" y="270" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">值域 [1,50] → 最多 50 个栈，元素总数 = 路径长</text>

  <!-- Arrow: buckets → query -->
  <path d="M 420 175 L 470 175" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="445" y="168" text-anchor="middle" font-size="9" fill="#666" font-weight="bold" filter="url(#rough2)">查互质值</text>

  <!-- ===== Right: query candidate ===== -->
  <rect x="470" y="60" width="120" height="200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="530" y="80" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">节点 i: val=3</text>
  <text x="530" y="94" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">coprimes[3]</text>
  <text x="530" y="106" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">= {2,4,5,…}</text>

  <g filter="url(#rough2)" font-size="9">
    <rect x="482" y="114" width="96" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="530" y="128" text-anchor="middle" fill="#446688">u=2: path[2]顶=0</text>
    <text x="540" y="142" text-anchor="middle" font-size="8.5" fill="#888">depth 0</text>

    <rect x="482" y="148" width="96" height="22" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2" rx="3"/>
    <text x="530" y="162" text-anchor="middle" fill="#888">u=3: ✗不在表</text>
    <text x="540" y="176" text-anchor="middle" font-size="8.5" fill="#b85450">gcd(3,3)=3</text>

    <rect x="482" y="182" width="96" height="22" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2" rx="3"/>
    <text x="530" y="196" text-anchor="middle" fill="#888">u=4: path[4]=∅</text>
  </g>

  <rect x="482" y="212" width="96" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="530" y="227" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">取深度最大</text>
  <text x="530" y="240" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">ans[i] = 0</text>

  <!-- ===== Bottom: key idea ===== -->
  <rect x="60" y="290" width="530" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="72" y="310" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">值域压缩：祖先链可能 O(n) 长，但值只有 50 种 → 每个值一个栈，栈顶 = 该值最近祖先</text>
  <text x="72" y="326" font-size="9" fill="#555" filter="url(#rough2)">查询 = 扫 coprimes[val] 各桶栈顶，取深度最大者，O(50) 定位最近互质祖先</text>
  <text x="72" y="342" font-size="9" fill="#888" filter="url(#rough2)">DFS 进/出栈配对维护：进入压栈、退出弹栈，path 始终 = 根到当前节点的路径快照</text>

  <!-- Footer -->
  <text x="300" y="396" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">按值分桶 → 桶顶即最近 → 扫互质值取最深 → O(50n) = O(n)</text>
</svg>
