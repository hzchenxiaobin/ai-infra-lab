<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2760" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">三条约束：偶数起点 · 奇偶交替 · 不超阈值</text>

  <!-- nums = [3,2,5,4], threshold = 5 -->
  <text x="40" y="78" font-size="12" fill="#888">下标:</text>
  <text x="150" y="78" font-size="11" fill="#888" font-weight="bold">0</text>
  <text x="230" y="78" font-size="11" fill="#888" font-weight="bold">1</text>
  <text x="310" y="78" font-size="11" fill="#888" font-weight="bold">2</text>
  <text x="390" y="78" font-size="11" fill="#888" font-weight="bold">3</text>

  <!-- cell 0: 3 odd -> not valid start -->
  <rect x="128" y="84" width="44" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="109" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">3</text>
  <text x="150" y="142" text-anchor="middle" font-size="10" fill="#b85450">奇 · 不能起</text>

  <!-- cell 1: 2 even & <=5 -> valid start (window highlight) -->
  <rect x="208" y="84" width="44" height="40" fill="#e8f0fe" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="109" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">2</text>
  <text x="230" y="142" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">偶 · 合法起点</text>

  <!-- cell 2: 5 odd & <=5 -> in window -->
  <rect x="288" y="84" width="44" height="40" fill="#fff8e1" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="310" y="109" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">5</text>
  <text x="310" y="142" text-anchor="middle" font-size="10" fill="#4a7a3a">奇 · 交替</text>

  <!-- cell 3: 4 even & <=5 -> in window -->
  <rect x="368" y="84" width="44" height="40" fill="#e8f0fe" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="390" y="109" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">4</text>
  <text x="390" y="142" text-anchor="middle" font-size="10" fill="#4a7a3a">偶 · 交替</text>

  <!-- window bracket -->
  <path d="M 208 134 Q 208 144 214 144 L 406 144 Q 412 144 412 134" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="310" y="162" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">合法窗口 [2,5,4] 长度 3</text>

  <!-- parity alternation arrows -->
  <path d="M 252 104 L 288 104" stroke="#888" stroke-width="1.4" marker-end="url(#arr2760)" filter="url(#rough2)"/>
  <path d="M 332 104 L 368 104" stroke="#888" stroke-width="1.4" marker-end="url(#arr2760)" filter="url(#rough2)"/>
  <text x="270" y="98" text-anchor="middle" font-size="9" fill="#888">偶→奇</text>
  <text x="350" y="98" text-anchor="middle" font-size="9" fill="#888">奇→偶</text>

  <!-- threshold note -->
  <line x1="120" y1="186" x2="430" y2="186" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="440" y="190" font-size="11" fill="#d6a040" font-weight="bold">阈值 = 5</text>
  <text x="150" y="204" font-size="10" fill="#888">窗口内 2,5,4 均 ≤ 5 ✓</text>

  <!-- constraint summary box -->
  <rect x="40" y="232" width="480" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="256" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">约束的「相邻性 / 单点性」是 O(n) 的根基</text>
  <text x="60" y="280" font-size="11" fill="#666">① 起点偶数：单点约束，只看 nums[l]</text>
  <text x="60" y="300" font-size="11" fill="#666">② 奇偶交替：相邻对约束 nums[i]↔nums[i+1]，与起点无关</text>
  <text x="60" y="320" font-size="11" fill="#666">③ 不超阈值：单点约束，超阈下标不能被任何窗口包含</text>
  <text x="60" y="340" font-size="11" fill="#888">→ 首个破坏约束的位置决定了窗口终点，可一次遍历跳跃扩展</text>

  <!-- legend -->
  <rect x="450" y="40" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="470" y="52" font-size="10" fill="#555">偶数</text>
  <rect x="450" y="58" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="470" y="70" font-size="10" fill="#555">奇数</text>
</svg>
