<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：枚举候选 g + 倍数验证</text>

  <!-- 1. Start: 预处理 -->
  <rect x="90" y="40" width="380" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">预处理：M = max(nums)</text>
  <text x="280" y="78" text-anchor="middle" font-size="11" fill="#333">present[x] = (x ∈ nums);   ans = 0</text>

  <path d="M 280 90 L 280 108" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. Outer loop diamond: g <= M ? -->
  <polygon points="280,108 400,132 280,156 160,132" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="136" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">g ≤ M ?</text>
  <text x="290" y="150" font-size="10" fill="#888">是 ↓</text>

  <!-- Yes arrow down to cur=0 -->
  <path d="M 280 156 L 280 170" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. cur = 0 -->
  <rect x="170" y="170" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="190" text-anchor="middle" font-size="11" fill="#333">cur = 0   (gcd 幺元: gcd(0,x)=x)</text>

  <path d="M 280 200 L 280 215" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4. Inner loop box (highlighted) -->
  <rect x="120" y="215" width="320" height="82" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="237" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">内层循环  for m = g, 2g, 3g, … ≤ M</text>
  <line x1="140" y1="243" x2="420" y2="243" stroke="#d6a040" stroke-width="0.8" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="280" y="261" text-anchor="middle" font-size="11" fill="#333">if present[m]:   cur = gcd(cur, m)</text>
  <text x="280" y="283" text-anchor="middle" font-size="10" fill="#888">共 ⌊M/g⌋ 步，调和级数 Σ M/g = O(M log M)</text>

  <!-- Inner loop-back arrow (m += g) on left of box -->
  <path d="M 120 280 L 70 280 L 70 232 L 120 232" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="60" y="256" text-anchor="middle" font-size="10" fill="#4a7a3a" transform="rotate(-90 60 256)">↺ m += g</text>

  <path d="M 280 297 L 280 313" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 5. diamond: cur == g ? -->
  <polygon points="280,313 395,337 280,361 165,337" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="341" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">cur == g ?</text>

  <!-- Yes branch: right to ans++ -->
  <path d="M 395 337 L 420 337" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="407" y="331" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>
  <rect x="420" y="322" width="130" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="485" y="342" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans++  (g 可达)</text>

  <!-- ans++ feeds into g++ loop-back channel -->
  <path d="M 550 337 L 560 337" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- No branch: down then right to join channel -->
  <path d="M 280 361 L 280 383 L 560 383" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="296" y="376" font-size="10" fill="#b85450">否</text>

  <!-- g++ loop-back channel: up the right side back to outer diamond -->
  <path d="M 560 383 L 560 132 L 400 132" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="572" y="258" text-anchor="middle" font-size="10" fill="#4a7a3a" transform="rotate(-90 572 258)">↺ g++，回到外层</text>

  <!-- Outer No (g > M): exit left then down to 返回 ans -->
  <path d="M 160 132 L 40 132 L 40 431 L 220 431" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="28" y="280" text-anchor="middle" font-size="10" fill="#b85450" transform="rotate(-90 28 280)">否 (g &gt; M)，结束</text>

  <!-- 返回 ans -->
  <rect x="220" y="415" width="140" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="436" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 ans</text>

  <!-- Bottom note -->
  <text x="280" y="465" text-anchor="middle" font-size="10" fill="#888">时间 O(M log² M)，空间 O(M)；提前终止：cur == g 即可 break 内层（cur 是 g 的倍数，达下界不再变）</text>
</svg>
