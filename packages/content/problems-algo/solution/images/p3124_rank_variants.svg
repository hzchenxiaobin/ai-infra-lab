<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="360" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">并列口径：RANK / DENSE_RANK / ROW_NUMBER（组内时长 400, 300, 300, 200）</text>

  <text x="75" y="58" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">duration ↓</text>

  <rect x="155" y="44" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="210" y="64" text-anchor="middle" font-size="11.5" fill="#2e5c22" font-weight="bold" filter="url(#rough2)">RANK()</text>

  <rect x="280" y="44" width="110" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="335" y="64" text-anchor="middle" font-size="10.5" fill="#a06a10" font-weight="bold" filter="url(#rough2)">DENSE_RANK()</text>

  <rect x="405" y="44" width="130" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="470" y="64" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">ROW_NUMBER()</text>

  <rect x="40" y="86" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="75" y="107" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">400</text>

  <rect x="40" y="126" width="70" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="75" y="147" text-anchor="middle" font-size="12" fill="#a06a10" font-weight="bold" filter="url(#rough2)">300</text>

  <rect x="40" y="166" width="70" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="75" y="187" text-anchor="middle" font-size="12" fill="#a06a10" font-weight="bold" filter="url(#rough2)">300</text>

  <text x="118" y="156" font-size="9.5" fill="#a06a10" filter="url(#rough2)">并</text>
  <text x="118" y="170" font-size="9.5" fill="#a06a10" filter="url(#rough2)">列</text>

  <rect x="40" y="206" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="75" y="227" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">200</text>

  <rect x="160" y="86" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="107" text-anchor="middle" font-size="12" fill="#2e5c22" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="160" y="126" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="147" text-anchor="middle" font-size="12" fill="#2e5c22" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="160" y="166" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="187" text-anchor="middle" font-size="12" fill="#2e5c22" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="160" y="206" width="100" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 3" rx="4" filter="url(#rough2)"/>
  <text x="210" y="227" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">4 · 跳号</text>

  <rect x="285" y="86" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="335" y="107" text-anchor="middle" font-size="12" fill="#2e5c22" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="285" y="126" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="335" y="147" text-anchor="middle" font-size="12" fill="#2e5c22" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="285" y="166" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="335" y="187" text-anchor="middle" font-size="12" fill="#2e5c22" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="285" y="206" width="100" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="335" y="227" text-anchor="middle" font-size="12" fill="#a06a10" font-weight="bold" filter="url(#rough2)">3 · 混进</text>

  <rect x="410" y="86" width="120" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="470" y="107" text-anchor="middle" font-size="12" fill="#2e5c22" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="410" y="126" width="120" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="470" y="147" text-anchor="middle" font-size="12" fill="#2e5c22" font-weight="bold" filter="url(#rough2)">2（先后随机）</text>

  <rect x="410" y="166" width="120" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="470" y="187" text-anchor="middle" font-size="12" fill="#2e5c22" font-weight="bold" filter="url(#rough2)">3（先后随机）</text>

  <rect x="410" y="206" width="120" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 3" rx="4" filter="url(#rough2)"/>
  <text x="470" y="227" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">4 · 出局</text>

  <text x="210" y="262" text-anchor="middle" font-size="10.5" fill="#2e5c22" font-weight="bold" filter="url(#rough2)">rk≤3 → 3 行</text>
  <text x="210" y="278" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">并列第 2 都保留</text>

  <text x="335" y="262" text-anchor="middle" font-size="10.5" fill="#a06a10" font-weight="bold" filter="url(#rough2)">rk≤3 → 4 行</text>
  <text x="335" y="278" text-anchor="middle" font-size="9.5" fill="#a06a10" filter="url(#rough2)">200 名次仍是 3，混进</text>

  <text x="470" y="262" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ 恰 3 行</text>
  <text x="470" y="278" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">并列跨线时砍谁随机</text>

  <rect x="30" y="296" width="520" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="315" text-anchor="middle" font-size="10.5" fill="#a06a10" filter="url(#rough2)">官方用例无并列，三种都能过题；复合主键允许不同联系人同组同时长——并列是真实边界</text>
  <text x="290" y="334" text-anchor="middle" font-size="10.5" fill="#a06a10" font-weight="bold" filter="url(#rough2)">面试先声明口径：「前三名」的自然语义（并列第 3 都算前三）= RANK</text>
</svg>
