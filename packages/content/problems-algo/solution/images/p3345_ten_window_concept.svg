<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：连续 10 个整数中必有一个末位 0</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">末位 0 ⇒ 数位乘积 = 0 ⇒ 0 = t × 0 能被任何 t 整除 ⇒ 枚举上界 n + 9</text>

  <text x="260" y="68" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">以 n = 15 为例，候选窗口 [15, 24]（注意：包含 n 本身）：</text>

  <!-- 15..24 十个格子 -->
  <rect x="30" y="80" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="51" y="106" text-anchor="middle" font-size="14" fill="#33506b" font-weight="bold" filter="url(#rough2)">15</text>
  <rect x="77" y="80" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="98" y="106" text-anchor="middle" font-size="14" fill="#33506b" font-weight="bold" filter="url(#rough2)">16</text>
  <rect x="124" y="80" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="145" y="106" text-anchor="middle" font-size="14" fill="#33506b" font-weight="bold" filter="url(#rough2)">17</text>
  <rect x="171" y="80" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="192" y="106" text-anchor="middle" font-size="14" fill="#33506b" font-weight="bold" filter="url(#rough2)">18</text>
  <rect x="218" y="80" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="239" y="106" text-anchor="middle" font-size="14" fill="#33506b" font-weight="bold" filter="url(#rough2)">19</text>
  <rect x="265" y="80" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="286" y="106" text-anchor="middle" font-size="14" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">20</text>
  <rect x="312" y="80" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="333" y="106" text-anchor="middle" font-size="14" fill="#33506b" font-weight="bold" filter="url(#rough2)">21</text>
  <rect x="359" y="80" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="106" text-anchor="middle" font-size="14" fill="#33506b" font-weight="bold" filter="url(#rough2)">22</text>
  <rect x="406" y="80" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="427" y="106" text-anchor="middle" font-size="14" fill="#33506b" font-weight="bold" filter="url(#rough2)">23</text>
  <rect x="453" y="80" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="474" y="106" text-anchor="middle" font-size="14" fill="#33506b" font-weight="bold" filter="url(#rough2)">24</text>

  <text x="286" y="140" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">↑ 末位为 0（10 的倍数）</text>

  <!-- 箭头指向乘积 -->
  <path d="M 286 146 C 286 156, 286 158, 286 166" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <rect x="140" y="170" width="240" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="192" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">20 的数位乘积 = 2 × 0 = 0</text>

  <rect x="75" y="220" width="370" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="243" text-anchor="middle" font-size="12.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">0 % t == 0 对任何正整数 t 成立 → 这个数一定合法</text>

  <rect x="55" y="270" width="410" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="294" text-anchor="middle" font-size="12.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">结论：答案必落在 [n, n+9] 内 → 至多枚举 10 个候选</text>

  <!-- 陷阱提示 -->
  <rect x="20" y="324" width="480" height="64" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="34" y="344" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠️ 三个高频翻车点：</text>
  <text x="34" y="360" font-size="10" fill="#333" filter="url(#rough2)">① 乘积一旦乘到 0 就永远是 0，代码无需任何特判；② 「0 能被 t 整除」是 t | 0（0 = t×0），</text>
  <text x="34" y="376" font-size="10" fill="#333" filter="url(#rough2)">不是「除以 0」，两者别混；③ 答案要求 ≥ n，枚举要从 x = n 起步，n 自己也是候选。</text>
</svg>
