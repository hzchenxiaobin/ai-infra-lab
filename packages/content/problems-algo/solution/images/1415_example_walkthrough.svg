<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：n=3, k=9 → "cab"</text>
  <text x="310" y="44" text-anchor="middle" font-size="11" fill="#888">total = 3·2^2 = 12，k=9 ≤ 12 ✓；k−− → 8（0-indexed）</text>

  <!-- Table header -->
  <g filter="url(#rough2)">
    <rect x="20" y="60" width="560" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <g font-size="11" fill="#446688" font-weight="bold" text-anchor="middle">
      <text x="55" y="77">阶段</text>
      <text x="115" y="77">剩余 r</text>
      <text x="185" y="77">段大小 2^(r−1)</text>
      <text x="270" y="77">候选</text>
      <text x="325" y="77">k</text>
      <text x="380" y="77">idx=k//2^r</text>
      <text x="445" y="77">选</text>
      <text x="525" y="77">结果</text>
    </g>
  </g>

  <!-- Row 1: 首位 -->
  <g filter="url(#rough2)">
    <rect x="20" y="90" width="560" height="28" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <g font-size="11" text-anchor="middle">
      <text x="55" y="108" fill="#d6a040" font-weight="bold">首位</text>
      <text x="115" y="108" fill="#444">2</text>
      <text x="185" y="108" fill="#444">4</text>
      <text x="270" y="108" fill="#444">[a, b, c]</text>
      <text x="325" y="108" fill="#444">8</text>
      <text x="380" y="108" fill="#b85450" font-weight="bold">8//4 = 2</text>
      <text x="445" y="108" fill="#d6a040" font-weight="bold">c</text>
      <text x="525" y="108" fill="#d6a040" font-weight="bold">"c"</text>
    </g>
  </g>

  <!-- Row 2: 第2位 -->
  <g filter="url(#rough2)">
    <rect x="20" y="120" width="560" height="28" rx="3" fill="#ffffff" stroke="#aaa" stroke-width="1"/>
    <g font-size="11" text-anchor="middle">
      <text x="55" y="138" fill="#446688" font-weight="bold">第 2 位</text>
      <text x="115" y="138" fill="#444">1</text>
      <text x="185" y="138" fill="#444">2</text>
      <text x="270" y="138" fill="#444">[a, b] (≠c)</text>
      <text x="325" y="138" fill="#444">0</text>
      <text x="380" y="138" fill="#b85450" font-weight="bold">0//2 = 0</text>
      <text x="445" y="138" fill="#446688" font-weight="bold">a</text>
      <text x="525" y="138" fill="#446688" font-weight="bold">"ca"</text>
    </g>
  </g>

  <!-- Row 3: 第3位 -->
  <g filter="url(#rough2)">
    <rect x="20" y="150" width="560" height="28" rx="3" fill="#ffffff" stroke="#aaa" stroke-width="1"/>
    <g font-size="11" text-anchor="middle">
      <text x="55" y="168" fill="#446688" font-weight="bold">第 3 位</text>
      <text x="115" y="168" fill="#444">0</text>
      <text x="185" y="168" fill="#444">1</text>
      <text x="270" y="168" fill="#444">[b, c] (≠a)</text>
      <text x="325" y="168" fill="#444">0</text>
      <text x="380" y="168" fill="#b85450" font-weight="bold">0//1 = 0</text>
      <text x="445" y="168" fill="#446688" font-weight="bold">b</text>
      <text x="525" y="168" fill="#446688" font-weight="bold">"cab"</text>
    </g>
  </g>

  <!-- Result highlight strip -->
  <g filter="url(#rough2)">
    <rect x="20" y="196" width="560" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="40" y="218" font-size="12" fill="#b85450" font-weight="bold">结果拼接：</text>
    <g font-size="14" font-weight="bold">
      <rect x="130" y="206" width="30" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
      <text x="145" y="223" text-anchor="middle" fill="#d6a040">c</text>
      <rect x="166" y="206" width="30" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
      <text x="181" y="223" text-anchor="middle" fill="#446688">a</text>
      <rect x="202" y="206" width="30" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
      <text x="217" y="223" text-anchor="middle" fill="#446688">b</text>
    </g>
    <text x="250" y="223" font-size="12" fill="#b85450" font-weight="bold">← "cab"，与示例 3 一致 ✓</text>
  </g>

  <!-- Tree path visualization -->
  <text x="310" y="270" text-anchor="middle" font-size="12" fill="#666" font-weight="bold">树上的导航路径（k=9 在字典序树中走到的叶子）</text>
  <g filter="url(#rough2)">
    <!-- root -->
    <rect x="36" y="288" width="40" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="56" y="304" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">root</text>
    <!-- c -->
    <rect x="146" y="288" width="34" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="163" y="304" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">c</text>
    <!-- ca -->
    <rect x="256" y="288" width="36" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="274" y="304" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">ca</text>
    <!-- cab -->
    <rect x="366" y="286" width="42" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
    <text x="387" y="304" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">cab</text>

    <path d="M 76 300 L 146 300" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>
    <path d="M 180 300 L 256 300" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>
    <path d="M 292 300 L 366 300" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" fill="none"/>

    <text x="111" y="284" text-anchor="middle" font-size="10" fill="#b85450">idx=2</text>
    <text x="218" y="284" text-anchor="middle" font-size="10" fill="#b85450">idx=0</text>
    <text x="329" y="284" text-anchor="middle" font-size="10" fill="#b85450">idx=0</text>
  </g>

  <!-- Bottom note -->
  <g filter="url(#rough2)">
    <rect x="20" y="330" width="560" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="40" y="352" font-size="11" fill="#4a7a3a">💡 每位段大小恒为 2^(剩余)：root 分 3 段、之后每个节点分 2 段（排除前一个字符）→ 完美均匀分段，故 idx 一步定位。</text>
  </g>
</svg>
