<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算</text>

  <!-- ===== Section 1: Year ===== -->
  <rect x="40" y="42" width="460" height="140" fill="none" stroke="#446688" stroke-width="1.2" stroke-dasharray="4,3" rx="8" filter="url(#rough2)"/>
  <text x="56" y="60" font-size="12.5" fill="#446688" font-weight="bold">granularity = "Year"</text>
  <text x="56" y="76" font-size="10.5" fill="#666">s = start[:4] = "2016"   e = end[:4] = "2017"</text>

  <!-- table header -->
  <rect x="55" y="86" width="430" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="75" y="100" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">id</text>
  <text x="100" y="100" font-size="10" fill="#333" font-weight="bold">timestamp</text>
  <text x="275" y="100" font-size="10" fill="#333" font-weight="bold">ts[:len]</text>
  <text x="460" y="100" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">命中?</text>

  <!-- row 1 -->
  <text x="75" y="120" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <text x="100" y="120" font-size="10.5" fill="#555">2017:01:01:23:59:59</text>
  <text x="275" y="120" font-size="11" fill="#333" font-weight="bold">2017</text>
  <text x="460" y="120" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- row 2 -->
  <text x="75" y="140" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <text x="100" y="140" font-size="10.5" fill="#555">2017:01:01:22:59:59</text>
  <text x="275" y="140" font-size="11" fill="#333" font-weight="bold">2017</text>
  <text x="460" y="140" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- row 3 -->
  <text x="75" y="160" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <text x="100" y="160" font-size="10.5" fill="#555">2016:01:01:00:00:00</text>
  <text x="275" y="160" font-size="11" fill="#333" font-weight="bold">2016</text>
  <text x="460" y="160" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- row dividers -->
  <line x1="55" y1="106" x2="485" y2="106" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="55" y1="126" x2="485" y2="126" stroke="#eee" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="55" y1="146" x2="485" y2="146" stroke="#eee" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="95" y1="86" x2="95" y2="166" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="270" y1="86" x2="270" y2="166" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="435" y1="86" x2="435" y2="166" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- result 1 -->
  <rect x="150" y="172" width="240" height="0" fill="none"/>
  <text x="270" y="178" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">→ 返回 [1, 2, 3]</text>

  <!-- ===== Section 2: Hour ===== -->
  <rect x="40" y="198" width="460" height="140" fill="none" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3" rx="8" filter="url(#rough2)"/>
  <text x="56" y="216" font-size="12.5" fill="#b85450" font-weight="bold">granularity = "Hour"</text>
  <text x="56" y="232" font-size="10.5" fill="#666">s = start[:13] = "2016:01:01:01"   e = end[:13] = "2017:01:01:23"</text>

  <!-- table header -->
  <rect x="55" y="242" width="430" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="75" y="256" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">id</text>
  <text x="100" y="256" font-size="10" fill="#333" font-weight="bold">timestamp</text>
  <text x="275" y="256" font-size="10" fill="#333" font-weight="bold">ts[:len]</text>
  <text x="460" y="256" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">命中?</text>

  <!-- row 1 -->
  <text x="75" y="276" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <text x="100" y="276" font-size="10.5" fill="#555">2017:01:01:23:59:59</text>
  <text x="275" y="276" font-size="11" fill="#333" font-weight="bold">2017:01:01:23</text>
  <text x="460" y="276" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- row 2 -->
  <text x="75" y="296" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <text x="100" y="296" font-size="10.5" fill="#555">2017:01:01:22:59:59</text>
  <text x="275" y="296" font-size="11" fill="#333" font-weight="bold">2017:01:01:22</text>
  <text x="460" y="296" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- row 3 (excluded) -->
  <text x="75" y="316" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <text x="100" y="316" font-size="10.5" fill="#555">2016:01:01:00:00:00</text>
  <text x="275" y="316" font-size="11" fill="#b85450" font-weight="bold">2016:01:01:00</text>
  <text x="460" y="316" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>

  <!-- row dividers -->
  <line x1="55" y1="262" x2="485" y2="262" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="55" y1="282" x2="485" y2="282" stroke="#eee" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="55" y1="302" x2="485" y2="302" stroke="#eee" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="95" y1="242" x2="95" y2="322" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="270" y1="242" x2="270" y2="322" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="435" y1="242" x2="435" y2="322" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- annotation for row 3 exclusion -->
  <text x="275" y="332" font-size="9.5" fill="#b85450">↑ "00" &lt; "01"（start 的 Hour），超出范围</text>

  <!-- result 2 -->
  <text x="270" y="350" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">→ 返回 [1, 2]</text>

  <!-- takeaway -->
  <rect x="60" y="362" width="420" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="381" text-anchor="middle" font-size="11" fill="#444">同一段 start/end，粒度越细 → 命中范围越小</text>
</svg>
