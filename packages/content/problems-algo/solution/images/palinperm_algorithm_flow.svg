<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：计数 → 数奇 → 判定</text>
  <text x="270" y="44" text-anchor="middle" font-size="10.5" fill="#888">左侧为主流程（计数数组法），右侧为位运等价巧解</text>

  <!-- ====== Step 1: count freq ====== -->
  <rect x="60" y="64" width="240" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="180" y="86" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 统计频次</text>
  <text x="180" y="104" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#446688">for c in s: cnt[c - 'a'] += 1</text>
  <text x="180" y="120" text-anchor="middle" font-size="9.5" fill="#888">26 字母定长数组，O(n)</text>

  <path d="M 180 128 L 180 150" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ====== Step 2: count odds ====== -->
  <rect x="60" y="152" width="240" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="180" y="174" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 数奇数次字符</text>
  <text x="180" y="192" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#446688">odd = sum(cnt[i] % 2 for i in 0..25)</text>
  <text x="180" y="208" text-anchor="middle" font-size="9.5" fill="#888">累加所有奇数频次，O(26)</text>

  <path d="M 180 216 L 180 238" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ====== Step 3: decision ====== -->
  <polygon points="180,240 320,290 180,340 40,290" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="284" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">odd ≤ 1 ?</text>
  <text x="180" y="304" text-anchor="middle" font-size="10" fill="#888">奇数次字符至多 1 个</text>

  <!-- yes branch -->
  <path d="M 40 290 L 30 290 L 30 356" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="56" y="282" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="-8" y="358" width="76" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="30" y="378" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">true ✓</text>

  <!-- no branch -->
  <path d="M 320 290 L 330 290 L 330 356" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="304" y="282" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="292" y="358" width="76" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="330" y="378" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">false ✗</text>

  <!-- ====== right: bitmask variant ====== -->
  <rect x="360" y="64" width="170" height="200" fill="#f6f6f6" stroke="#bbb" stroke-width="1.3" stroke-dasharray="4,3" rx="8" filter="url(#rough2)"/>
  <text x="445" y="84" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">位运巧解（等价）</text>
  <text x="445" y="100" text-anchor="middle" font-size="9.5" fill="#888">一个 int 当 26 位频次表</text>

  <text x="370" y="124" font-family="monospace" font-size="10" fill="#446688">mask = 0</text>
  <text x="370" y="142" font-family="monospace" font-size="10" fill="#446688">for c in s:</text>
  <text x="382" y="158" font-family="monospace" font-size="10" fill="#446688">mask ^= 1&lt;&lt;(c-'a')</text>
  <text x="370" y="176" font-family="monospace" font-size="10" fill="#446688"># 偶次→归 0，奇次→置 1</text>

  <rect x="372" y="186" width="146" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="445" y="205" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#d6a040" font-weight="bold">mask &amp; (mask-1) == 0</text>

  <text x="370" y="232" font-size="9.5" fill="#555">= 0：全偶（偶长度）</text>
  <text x="370" y="246" font-size="9.5" fill="#555">= 2^k：恰 1 个奇</text>
  <text x="370" y="258" font-size="9.5" fill="#b85450">否则：≥2 个奇 → false</text>

  <!-- link arrow from decision to bitmask note -->
  <path d="M 320 290 L 360 230" stroke="#888" stroke-width="1.1" fill="none" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- ====== bottom complexity ====== -->
  <rect x="100" y="358" width="170" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="185" y="378" text-anchor="middle" font-size="10.5" fill="#555">O(n) 时间 / O(1) 空间</text>
</svg>
