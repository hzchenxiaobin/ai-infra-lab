<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：逐字符计算坐标 → 按顺序输出移动指令</text>

  <!-- Start: r=0, c=0 -->
  <rect x="210" y="44" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="17" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">开始 r=0, c=0</text>
  <path d="M 270 80 L 270 94" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Loop: for each ch in target -->
  <rect x="190" y="98" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="120" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">对 target 中每个 ch</text>
  <path d="M 270 134 L 270 148" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Compute nr, nc -->
  <rect x="150" y="152" width="240" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="174" text-anchor="middle" font-size="11" fill="#333">nr=(ch−'a')÷5,  nc=(ch−'a')%5</text>
  <path d="M 270 188 L 270 202" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Decision: r == 5 ? -->
  <polygon points="270,206 380,250 270,294 160,250" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="246" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">当前 r == 5？</text>
  <text x="270" y="260" text-anchor="middle" font-size="10" fill="#888">（在 z 处）</text>

  <!-- Yes branch (left) -->
  <path d="M 160 250 L 100 250 L 100 268" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="120" y="242" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="36" y="272" width="128" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="100" y="290" text-anchor="middle" font-size="10.5" fill="#333">① 先 U×(r−nr)</text>
  <text x="100" y="306" text-anchor="middle" font-size="10.5" fill="#333">② 再 R×(nc−c)</text>
  <text x="100" y="320" text-anchor="middle" font-size="9" fill="#4a7a3a">先竖直离开第5行</text>

  <!-- No branch (right) -->
  <path d="M 380 250 L 440 250 L 440 268" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="412" y="242" font-size="10" fill="#446688" font-weight="bold">否</text>
  <rect x="376" y="272" width="128" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="440" y="290" text-anchor="middle" font-size="10.5" fill="#333">① 先 L/R 调列</text>
  <text x="440" y="306" text-anchor="middle" font-size="10.5" fill="#333">② 再 U/D 调行</text>
  <text x="440" y="320" text-anchor="middle" font-size="9" fill="#446688">先水平到位</text>

  <!-- Merge to emit '!' -->
  <path d="M 100 320 L 100 344 L 270 344" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 440 320 L 440 344 L 270 344" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 270 344 L 270 352" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Emit '!' -->
  <rect x="210" y="356" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="376" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">追加 '!'，更新 r,c</text>

  <!-- Loop back arrow -->
  <path d="M 330 371 Q 500 371 500 115 L 350 115" stroke="#888" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="505" y="245" text-anchor="middle" font-size="9" fill="#888" transform="rotate(90 505 245)">下一个字符</text>
</svg>
