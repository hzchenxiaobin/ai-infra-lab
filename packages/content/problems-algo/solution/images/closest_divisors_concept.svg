<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrC" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1362 = 492 × 2：num+1、num+2 各取最接近因数对</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">（单数最接近因数对 = LeetCode 492 构造矩形）</text>

  <rect x="240" y="60" width="80" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="81" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">num = 8</text>

  <path d="M270,92 L160,116" stroke="#446688" stroke-width="1.5" marker-end="url(#arrC)" fill="none" filter="url(#rough2)"/>
  <path d="M290,92 L400,116" stroke="#446688" stroke-width="1.5" marker-end="url(#arrC)" fill="none" filter="url(#rough2)"/>

  <rect x="80" y="118" width="160" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="160" y="139" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">num+1 = 9</text>

  <rect x="320" y="118" width="160" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="400" y="139" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">num+2 = 10</text>

  <rect x="60" y="160" width="200" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="160" y="180" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">⌊√9⌋ = 3，向下找因子</text>
  <text x="160" y="198" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">9 % 3 == 0 ✓ 命中</text>
  <text x="160" y="213" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">一步命中（完全平方数）</text>

  <rect x="300" y="160" width="200" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="400" y="180" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">⌊√10⌋ = 3，向下找因子</text>
  <text x="400" y="198" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">10%3=1 ✗ → w=2：10%2=0 ✓</text>
  <text x="400" y="213" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">递减一次命中</text>

  <path d="M160,218 L160,242" stroke="#446688" stroke-width="1.5" marker-end="url(#arrC)" fill="none" filter="url(#rough2)"/>
  <path d="M400,218 L400,242" stroke="#446688" stroke-width="1.5" marker-end="url(#arrC)" fill="none" filter="url(#rough2)"/>

  <rect x="60" y="244" width="200" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="160" y="266" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">[3, 3]</text>
  <text x="160" y="286" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">|a − b| = 0 ★</text>

  <rect x="300" y="244" width="200" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="400" y="266" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">[2, 5]</text>
  <text x="400" y="286" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">|a − b| = 3</text>

  <path d="M160,300 L160,324 L280,324" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <path d="M400,300 L400,324 L280,324" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>

  <rect x="120" y="332" width="320" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="354" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">比较两个差距：0 &lt; 3</text>
  <text x="280" y="374" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">返回差距更小者 → [3, 3] ✓</text>
</svg>
