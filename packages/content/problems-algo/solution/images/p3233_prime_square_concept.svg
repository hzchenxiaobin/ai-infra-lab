<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 390" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="390" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：恰好两个真因数 ⇔ 质数的平方 p²</text>

  <!-- 左：因数成对 -->
  <text x="42" y="48" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 因数成对：d ↔ x / d</text>

  <text x="42" y="70" font-size="9.5" fill="#888" filter="url(#rough2)">x = 12（非平方数）</text>

  <rect x="40" y="78" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="55" y="95" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="75" y="78" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="90" y="95" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="110" y="78" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="125" y="95" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="145" y="78" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="160" y="95" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="180" y="78" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="195" y="95" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <rect x="215" y="78" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="230" y="95" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">12</text>

  <path d="M 55 106 C 60 134, 225 134, 230 106" stroke="#446688" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 90 106 C 95 128, 190 128, 195 106" stroke="#446688" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 125 106 C 128 124, 157 124, 160 106" stroke="#446688" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="42" y="148" font-size="9.5" fill="#446688" filter="url(#rough2)">3 对 → 6 个因数（偶数）</text>

  <text x="42" y="172" font-size="9.5" fill="#888" filter="url(#rough2)">x = 16（平方数）</text>

  <rect x="40" y="180" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="55" y="197" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="75" y="180" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="90" y="197" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="110" y="180" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="125" y="197" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="145" y="180" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="160" y="197" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8</text>
  <rect x="180" y="180" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="195" y="197" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">16</text>

  <path d="M 55 208 C 60 236, 190 236, 195 208" stroke="#446688" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 90 208 C 95 230, 155 230, 160 208" stroke="#446688" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <circle cx="125" cy="222" r="10" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="42" y="252" font-size="9.5" fill="#b85450" filter="url(#rough2)">两对 + √16 = 4 自己配自己 → 5 个因数（奇数）</text>

  <rect x="38" y="262" width="232" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="154" y="284" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">因数个数为奇 ⇒ x = m²（完全平方数）</text>

  <!-- 右：形状判定 -->
  <text x="300" y="48" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② m² 的因数含 1, m, m²</text>

  <rect x="292" y="58" width="204" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="394" y="75" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">4 = 2² → {1, 2, 4} ✓ 特殊</text>
  <rect x="292" y="90" width="204" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="394" y="107" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">9 = 3² → {1, 3, 9} ✓ 特殊</text>
  <rect x="292" y="122" width="204" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="394" y="139" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">25 = 5² → {1, 5, 25} ✓ 特殊</text>

  <rect x="292" y="154" width="204" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="394" y="171" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">16 = 4² → 5 个因数 ✗（m 合数）</text>
  <rect x="292" y="186" width="204" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="394" y="203" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">6 = 2×3 → 真因数 3 个 ✗</text>
  <rect x="292" y="218" width="204" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="394" y="235" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">质数 p → 真因数仅 1 个 ✗</text>

  <text x="394" y="266" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">m 是质数 ⇔ 恰 3 个因数 ⇔ 特殊</text>

  <!-- 底部：转化 -->
  <rect x="38" y="304" width="458" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="267" y="326" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">转化：答案 = (r − l + 1) − #{ p 质数 : l ≤ p² ≤ r }</text>
  <text x="267" y="346" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">p² ≤ r ≤ 10⁹ ⇒ p ≤ ⌊√r⌋ ≤ 31622，特殊数全值域仅 π(31622) = 3401 个</text>
  <text x="267" y="364" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">→ 不用管区间多长，筛 3 万个数就够</text>
</svg>
