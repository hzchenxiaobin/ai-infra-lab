<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：p 既是 s 的前缀又是后缀 —— 两段各对齐一次</text>

  <!-- p row (for prefix check) -->
  <text x="143" y="67" text-anchor="end" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">p = "aba"</text>
  <rect x="150" y="46" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="172" y="68" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="200" y="46" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="222" y="68" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="250" y="46" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="272" y="68" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="360" y="67" text-anchor="start" font-size="11" fill="#8a6d3b" filter="url(#rough2)">（k = 3）</text>

  <path d="M 172 82 L 172 110" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 222 82 L 222 110" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 272 82 L 272 110" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="345" y="100" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">① 前缀对齐</text>

  <!-- s row 1: prefix -->
  <text x="143" y="137" text-anchor="end" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">s = "ababa"</text>
  <rect x="150" y="116" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="172" y="138" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="200" y="116" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="222" y="138" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="250" y="116" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="272" y="138" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="300" y="116" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="322" y="138" text-anchor="middle" font-size="14" fill="#888" filter="url(#rough2)">b</text>
  <rect x="350" y="116" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="372" y="138" text-anchor="middle" font-size="14" fill="#888" filter="url(#rough2)">a</text>
  <text x="406" y="137" text-anchor="start" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">s[0:3] == p ✓</text>

  <!-- s row 2: suffix -->
  <text x="143" y="191" text-anchor="end" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">s = "ababa"</text>
  <rect x="150" y="170" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="172" y="192" text-anchor="middle" font-size="14" fill="#888" filter="url(#rough2)">a</text>
  <rect x="200" y="170" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="222" y="192" text-anchor="middle" font-size="14" fill="#888" filter="url(#rough2)">b</text>
  <rect x="250" y="170" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="272" y="192" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="300" y="170" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="322" y="192" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="350" y="170" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="372" y="192" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="406" y="191" text-anchor="start" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">s[2:5] == p ✓</text>

  <!-- arrows up from p row 2 -->
  <path d="M 272 222 L 272 208" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 322 222 L 322 208" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 372 222 L 372 208" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="160" y="218" text-anchor="start" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 后缀对齐</text>

  <!-- p row (for suffix check) -->
  <text x="243" y="245" text-anchor="end" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">p = "aba"</text>
  <rect x="250" y="224" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="272" y="246" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="300" y="224" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="322" y="246" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="350" y="224" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="372" y="246" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">a</text>

  <!-- summary box -->
  <rect x="40" y="274" width="440" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="296" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">isPrefixAndSuffix(p, s) ⟺ k ≤ m 且 s[0:k] == p 且 s[m−k:m] == p</text>
  <text x="260" y="316" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">两个检查相互独立，前缀失败即可短路；k &gt; m 时长串装不进短串，直接 false</text>
  <text x="260" y="336" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">反例："abc" 对 "abcd"：前缀 ✓ 但后缀 ✗ → false</text>
</svg>
