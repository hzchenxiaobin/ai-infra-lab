<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrg2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="240" y="20" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1 演算：source = "abbaa"，pattern = "aba"，可删 {0,1,2}</text>
  <text x="240" y="38" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">dp[i][j] = 前 i 个字符匹配 pattern 前 j 个的最大删除数（−∞ = 不可行）</text>

  <!-- 表头：左上角 -->
  <rect x="88" y="56" width="52" height="33" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="114" y="77" text-anchor="middle" font-size="9" fill="#33506e" filter="url(#rough2)">i＼j</text>

  <!-- 列头 j=0..3 -->
  <rect x="140" y="56" width="64" height="33" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="172" y="77" text-anchor="middle" font-size="10" fill="#33506e" filter="url(#rough2)">j=0</text>
  <rect x="204" y="56" width="64" height="33" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="236" y="77" text-anchor="middle" font-size="10" fill="#33506e" filter="url(#rough2)">j=1(a)</text>
  <rect x="268" y="56" width="64" height="33" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="300" y="77" text-anchor="middle" font-size="10" fill="#33506e" filter="url(#rough2)">j=2(b)</text>
  <rect x="332" y="56" width="64" height="33" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="364" y="77" text-anchor="middle" font-size="10" fill="#33506e" filter="url(#rough2)">j=3(a)</text>

  <!-- 行头 i=0..5 -->
  <rect x="88" y="89" width="52" height="33" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="114" y="110" text-anchor="middle" font-size="10" fill="#33506e" filter="url(#rough2)">i=0</text>
  <rect x="88" y="122" width="52" height="33" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="114" y="143" text-anchor="middle" font-size="10" fill="#33506e" filter="url(#rough2)">i=1(a)</text>
  <rect x="88" y="155" width="52" height="33" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="114" y="176" text-anchor="middle" font-size="10" fill="#33506e" filter="url(#rough2)">i=2(b)</text>
  <rect x="88" y="188" width="52" height="33" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="114" y="209" text-anchor="middle" font-size="10" fill="#33506e" filter="url(#rough2)">i=3(b)</text>
  <rect x="88" y="221" width="52" height="33" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="114" y="242" text-anchor="middle" font-size="10" fill="#33506e" filter="url(#rough2)">i=4(a)</text>
  <rect x="88" y="254" width="52" height="33" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="114" y="275" text-anchor="middle" font-size="10" fill="#33506e" filter="url(#rough2)">i=5(a)</text>

  <!-- 行 i=0：路径格 (0,0) 黄底 -->
  <rect x="140" y="89" width="64" height="33" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="172" y="110" text-anchor="middle" font-size="11" fill="#8a6510" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="204" y="89" width="64" height="33" fill="#efefef" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="236" y="110" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">−∞</text>
  <rect x="268" y="89" width="64" height="33" fill="#efefef" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="300" y="110" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">−∞</text>
  <rect x="332" y="89" width="64" height="33" fill="#efefef" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="364" y="110" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">−∞</text>

  <!-- 行 i=1：路径格 (1,1) -->
  <rect x="140" y="122" width="64" height="33" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="172" y="143" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="204" y="122" width="64" height="33" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="236" y="143" text-anchor="middle" font-size="11" fill="#8a6510" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="268" y="122" width="64" height="33" fill="#efefef" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="300" y="143" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">−∞</text>
  <rect x="332" y="122" width="64" height="33" fill="#efefef" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="364" y="143" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">−∞</text>

  <!-- 行 i=2：路径格 (2,2) -->
  <rect x="140" y="155" width="64" height="33" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="172" y="176" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="204" y="155" width="64" height="33" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="236" y="176" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="268" y="155" width="64" height="33" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="176" text-anchor="middle" font-size="11" fill="#8a6510" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="332" y="155" width="64" height="33" fill="#efefef" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="364" y="176" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">−∞</text>

  <!-- 行 i=3：路径格 (3,2) -->
  <rect x="140" y="188" width="64" height="33" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="172" y="209" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="204" y="188" width="64" height="33" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="236" y="209" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="268" y="188" width="64" height="33" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="209" text-anchor="middle" font-size="11" fill="#8a6510" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="332" y="188" width="64" height="33" fill="#efefef" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="364" y="209" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">−∞</text>

  <!-- 行 i=4：路径格 (4,2) -->
  <rect x="140" y="221" width="64" height="33" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="172" y="242" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="204" y="221" width="64" height="33" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="236" y="242" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="268" y="221" width="64" height="33" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="242" text-anchor="middle" font-size="11" fill="#8a6510" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="332" y="221" width="64" height="33" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="364" y="242" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <!-- 行 i=5：路径格 (5,3) = 答案 -->
  <rect x="140" y="254" width="64" height="33" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="172" y="275" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="204" y="254" width="64" height="33" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="236" y="275" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="268" y="254" width="64" height="33" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="300" y="275" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="332" y="254" width="64" height="33" fill="#fff8e1" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="364" y="275" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1 ★</text>

  <!-- 最优路径箭头 -->
  <!-- (0,0) → (1,1) 匹配：蓝对角 -->
  <path d="M 195 131 L 213 113" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrb2)" filter="url(#rough2)"/>
  <!-- (1,1) → (2,2) 匹配：蓝对角 -->
  <path d="M 259 164 L 277 146" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrb2)" filter="url(#rough2)"/>
  <!-- (2,2) → (3,2) 删除：红竖 -->
  <path d="M 282 178 L 282 201" stroke="#b85450" stroke-width="2.4" fill="none" marker-end="url(#arrr2)" filter="url(#rough2)"/>
  <!-- (3,2) → (4,2) 跳过：绿竖 -->
  <path d="M 282 214 L 282 237" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrg2)" filter="url(#rough2)"/>
  <!-- (4,2) → (5,3) 匹配：蓝对角 -->
  <path d="M 323 263 L 341 245" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrb2)" filter="url(#rough2)"/>

  <!-- 右侧图例 -->
  <text x="460" y="96" text-anchor="middle" font-size="10" fill="#666" font-weight="bold" filter="url(#rough2)">图例</text>
  <path d="M 408 122 L 428 110" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrb2)" filter="url(#rough2)"/>
  <text x="436" y="120" font-size="9.5" fill="#446688" filter="url(#rough2)">匹配 ↗ +0</text>
  <path d="M 408 146 L 428 146" stroke="#b85450" stroke-width="2.4" fill="none" marker-end="url(#arrr2)" filter="url(#rough2)"/>
  <text x="436" y="150" font-size="9.5" fill="#b85450" filter="url(#rough2)">删除 ↓ +1</text>
  <path d="M 408 170 L 428 170" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrg2)" filter="url(#rough2)"/>
  <text x="436" y="174" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">跳过 ↓ +0</text>
  <rect x="408" y="186" width="20" height="14" fill="#efefef" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="436" y="198" font-size="9.5" fill="#888" filter="url(#rough2)">−∞ 不可行</text>
  <rect x="408" y="212" width="20" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="436" y="224" font-size="9.5" fill="#8a6510" filter="url(#rough2)">最优路径格</text>
  <rect x="408" y="240" width="20" height="14" fill="#fff8e1" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="436" y="252" font-size="9.5" fill="#b85450" filter="url(#rough2)">答案 = 1</text>

  <!-- 底部结论框 -->
  <rect x="30" y="300" width="460" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="320" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">最优路径：a(0)↔a ／ b(1)↔b ／ 删 b(2)（+1）／ a(3) 跳过 ／ a(4)↔a ⇒ dp[5][3] = 1</text>
  <text x="260" y="338" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">并列最优：删 source[1] 同样得 1；dp[3][3] = −∞ 如实挡住「b,b 配 aba」的不可行状态</text>
</svg>
