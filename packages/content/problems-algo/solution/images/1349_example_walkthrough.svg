<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：3×6 教室，最优 = 4 人</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888"># = 坏座位, . = 好座位, S = 学生；最优方案跳过中间行</text>

  <!-- ===== grid: 3 rows × 6 cols, cell 48×42, origin (136, 56) ===== -->
  <g font-size="13">
    <!-- row 0: # . # # . # -->
    <rect x="136" y="56" width="48" height="42" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="160" y="83" text-anchor="middle" fill="#999">#</text>
    <rect x="184" y="56" width="48" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <circle cx="208" cy="77" r="13" fill="#446688" filter="url(#rough2)"/>
    <text x="208" y="81" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">S</text>
    <rect x="232" y="56" width="48" height="42" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="256" y="83" text-anchor="middle" fill="#999">#</text>
    <rect x="280" y="56" width="48" height="42" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="304" y="83" text-anchor="middle" fill="#999">#</text>
    <rect x="328" y="56" width="48" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <circle cx="352" cy="77" r="13" fill="#446688" filter="url(#rough2)"/>
    <text x="352" y="81" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">S</text>
    <rect x="376" y="56" width="48" height="42" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="400" y="83" text-anchor="middle" fill="#999">#</text>

    <!-- row 1: . # # # # . (empty - optimal skips this row) -->
    <rect x="136" y="98" width="48" height="42" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="160" y="125" text-anchor="middle" fill="#ccc">.</text>
    <rect x="184" y="98" width="48" height="42" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="208" y="125" text-anchor="middle" fill="#999">#</text>
    <rect x="232" y="98" width="48" height="42" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="256" y="125" text-anchor="middle" fill="#999">#</text>
    <rect x="280" y="98" width="48" height="42" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="304" y="125" text-anchor="middle" fill="#999">#</text>
    <rect x="328" y="98" width="48" height="42" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="352" y="125" text-anchor="middle" fill="#999">#</text>
    <rect x="376" y="98" width="48" height="42" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="400" y="125" text-anchor="middle" fill="#ccc">.</text>

    <!-- row 2: # . # # . # -->
    <rect x="136" y="140" width="48" height="42" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="160" y="167" text-anchor="middle" fill="#999">#</text>
    <rect x="184" y="140" width="48" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <circle cx="208" cy="161" r="13" fill="#446688" filter="url(#rough2)"/>
    <text x="208" y="165" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">S</text>
    <rect x="232" y="140" width="48" height="42" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="256" y="167" text-anchor="middle" fill="#999">#</text>
    <rect x="280" y="140" width="48" height="42" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="304" y="167" text-anchor="middle" fill="#999">#</text>
    <rect x="328" y="140" width="48" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <circle cx="352" cy="161" r="13" fill="#446688" filter="url(#rough2)"/>
    <text x="352" y="165" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">S</text>
    <rect x="376" y="140" width="48" height="42" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="400" y="167" text-anchor="middle" fill="#999">#</text>
  </g>

  <!-- row labels -->
  <text x="120" y="83" text-anchor="end" font-size="10" fill="#888">row 0</text>
  <text x="120" y="125" text-anchor="end" font-size="10" fill="#888">row 1</text>
  <text x="120" y="167" text-anchor="end" font-size="10" fill="#888">row 2</text>

  <!-- available mask annotations -->
  <text x="440" y="83" font-size="10" fill="#446688" font-family="monospace">avail=010010</text>
  <text x="440" y="125" font-size="10" fill="#888" font-family="monospace">avail=100001</text>
  <text x="440" y="167" font-size="10" fill="#446688" font-family="monospace">avail=010010</text>

  <!-- ===== DP evolution table ===== -->
  <text x="60" y="210" font-size="12" fill="#444" font-weight="bold">DP 逐行演化（仅列关键状态）：</text>

  <!-- row 0 dp -->
  <rect x="40" y="220" width="480" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="56" y="240" font-size="10" fill="#446688" font-weight="bold">row 0:</text>
  <text x="110" y="240" font-size="10" fill="#444" font-family="monospace">dp[000000]=0  dp[000010]=1  dp[010000]=1  dp[010010]=2 ★</text>

  <!-- row 1 dp -->
  <rect x="40" y="254" width="480" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="56" y="274" font-size="10" fill="#d6a040" font-weight="bold">row 1:</text>
  <text x="110" y="274" font-size="10" fill="#444" font-family="monospace">dp[000000]=2 ★  dp[000001]=2  dp[100000]=2  dp[100001]=2</text>

  <!-- row 2 dp -->
  <rect x="40" y="288" width="480" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="56" y="308" font-size="10" fill="#4a7a3a" font-weight="bold">row 2:</text>
  <text x="110" y="308" font-size="10" fill="#444" font-family="monospace">dp[000000]=2  dp[000010]=3  dp[010000]=3  dp[010010]=4 ★★★</text>

  <!-- ===== explanation ===== -->
  <rect x="40" y="330" width="480" height="86" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="350" font-size="11" fill="#b85450" font-weight="bold">关键决策：为什么 row 1 留空？</text>
  <text x="56" y="368" font-size="10" fill="#444">row 0 坐了 col 1、col 4（mask=010010，2 人）</text>
  <text x="56" y="382" font-size="10" fill="#444">row 1 仅 col 0、col 5 可用，但 col 0 的右上 = col 1（冲突），col 5 的左上 = col 4（冲突）</text>
  <text x="56" y="396" font-size="10" fill="#444">→ row 1 无法坐任何人，dp[1][000000] = 0 + dp[0][010010] = 2</text>
  <text x="56" y="410" font-size="10" fill="#b85450" font-weight="bold">→ row 2 恢复 col 1、col 4（与 row 1 空行无冲突）→ 2 + 2 = 4 ✓</text>

  <text x="280" y="442" text-anchor="middle" font-size="11" fill="#888">贪心「每行尽量多坐」会得 3（row0:1 + row1:1 + row2:1）；DP 全局最优 = 4</text>
  <text x="280" y="460" text-anchor="middle" font-size="10" fill="#888">这正是需要 DP 而非贪心的原因：局部最优 ≠ 全局最优</text>
</svg>
