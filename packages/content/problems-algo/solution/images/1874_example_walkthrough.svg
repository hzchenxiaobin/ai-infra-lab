<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums1=[5,3,4,2], nums2=[4,2,2,5]</text>

  <!-- ===== Row 0: original arrays ===== -->
  <text x="50" y="52" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">排序前</text>
  <text x="120" y="52" font-size="10" fill="#888" filter="url(#rough2)">nums1</text>
  <rect x="155" y="38" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="203" y="38" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="251" y="38" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="299" y="38" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="177" y="56" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="225" y="56" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="273" y="56" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="321" y="56" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>

  <text x="365" y="52" font-size="10" fill="#888" filter="url(#rough2)">nums2</text>
  <rect x="400" y="38" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="444" y="38" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="488" y="38" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="532" y="38" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="420" y="56" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="464" y="56" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="508" y="56" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="552" y="56" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>

  <!-- arrow down -->
  <path d="M 290 70 L 290 84" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="305" y="80" font-size="9" fill="#666" filter="url(#rough2)">排序</text>

  <!-- ===== Row 1: sorted arrays ===== -->
  <text x="50" y="104" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">排序后</text>
  <text x="120" y="104" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">nums1↑</text>
  <rect x="155" y="90" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="203" y="90" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="251" y="90" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="299" y="90" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="177" y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="225" y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="273" y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="321" y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>

  <text x="365" y="104" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">nums2↓</text>
  <rect x="400" y="90" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="444" y="90" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="488" y="90" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="532" y="90" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="420" y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="464" y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="508" y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="552" y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- divider -->
  <path d="M 40 128 L 540 128" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Step-by-step pairing ===== -->
  <text x="290" y="146" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">逐位配对累加</text>

  <!-- Column headers -->
  <text x="70" y="166" text-anchor="middle" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">步骤</text>
  <text x="170" y="166" text-anchor="middle" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">配对</text>
  <text x="290" y="166" text-anchor="middle" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">乘积</text>
  <text x="420" y="166" text-anchor="middle" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">累计和</text>

  <!-- Step i=0: 2 × 5 = 10, sum=10 -->
  <rect x="40" y="174" width="480" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="4" filter="url(#rough2)" opacity="0.5"/>
  <text x="70" y="192" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">i=0</text>
  <rect x="140" y="178" width="30" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="155" y="193" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="178" y="193" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">×</text>
  <rect x="190" y="178" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="205" y="193" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="290" y="193" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2 × 5 = 10</text>
  <text x="420" y="193" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">10</text>

  <!-- Step i=1: 3 × 4 = 12, sum=22 -->
  <rect x="40" y="204" width="480" height="28" fill="#fafafa" stroke="#eee" stroke-width="0.8" rx="4" filter="url(#rough2)" opacity="0.5"/>
  <text x="70" y="222" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">i=1</text>
  <rect x="140" y="208" width="30" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="155" y="223" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="178" y="223" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">×</text>
  <rect x="190" y="208" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="205" y="223" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="290" y="223" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3 × 4 = 12</text>
  <text x="420" y="223" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">10 + 12 = 22</text>

  <!-- Step i=2: 4 × 2 = 8, sum=30 -->
  <rect x="40" y="234" width="480" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="4" filter="url(#rough2)" opacity="0.5"/>
  <text x="70" y="252" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">i=2</text>
  <rect x="140" y="238" width="30" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="155" y="253" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="178" y="253" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">×</text>
  <rect x="190" y="238" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="205" y="253" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="290" y="253" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4 × 2 = 8</text>
  <text x="420" y="253" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">22 + 8 = 30</text>

  <!-- Step i=3: 5 × 2 = 10, sum=40 -->
  <rect x="40" y="264" width="480" height="28" fill="#fafafa" stroke="#eee" stroke-width="0.8" rx="4" filter="url(#rough2)" opacity="0.5"/>
  <text x="70" y="282" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">i=3</text>
  <rect x="140" y="268" width="30" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="155" y="283" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="178" y="283" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">×</text>
  <rect x="190" y="268" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="205" y="283" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="290" y="283" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5 × 2 = 10</text>
  <text x="420" y="283" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">30 + 10 = 40</text>

  <!-- result box -->
  <rect x="120" y="306" width="340" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="330" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = 40</text>

  <!-- contrast: 正序配对 -->
  <path d="M 290 346 L 290 360" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60" y="362" width="460" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="290" y="380" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">对照：正序配对（升序 × 升序）</text>
  <text x="290" y="396" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">2×2 + 3×2 + 4×4 + 5×5 = 4+6+16+25 = 51 &gt; 40</text>

  <!-- insight -->
  <rect x="60" y="412" width="460" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="290" y="436" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">小配大、大配小 → 逆序和 40 &lt; 顺序和 51</text>
</svg>
