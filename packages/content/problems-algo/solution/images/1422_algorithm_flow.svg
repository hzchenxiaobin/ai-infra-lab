<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：初始分割后扫一遍，计数器增量更新取最大得分</text>

  <!-- 1. init -->
  <rect x="120" y="44" width="280" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 初始分割点 i = 0（左 = s[0]，右 = s[1..]）</text>
  <text x="260" y="80" text-anchor="middle" font-size="10.5" fill="#555">leftZeros = (s[0]=='0')；rightOnes = 数 s[1..] 中的 '1'</text>

  <path d="M 260 94 L 260 112" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. score & ans -->
  <rect x="120" y="112" width="280" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="130" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② ans = leftZeros + rightOnes</text>
  <text x="260" y="146" text-anchor="middle" font-size="10.5" fill="#555">记录初始得分</text>

  <path d="M 260 156 L 260 174" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. loop check -->
  <polygon points="260,174 380,222 260,270 140,222" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="214" text-anchor="middle" font-size="12" fill="#333">i ≤ n−2 ?</text>
  <text x="260" y="232" text-anchor="middle" font-size="10.5" fill="#888">(还有右移空间)</text>

  <!-- 否 → return -->
  <path d="M 380 222 L 440 222" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="396" y="214" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  <rect x="434" y="204" width="80" height="38" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="474" y="222" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">return</text>
  <text x="474" y="236" text-anchor="middle" font-size="10" fill="#b85450">ans</text>

  <!-- 是 ↓ -->
  <path d="M 260 270 L 260 288" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="284" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- 4. branch on s[i] -->
  <rect x="110" y="288" width="300" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="306" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ s[i] 从右换到左：</text>
  <text x="260" y="324" text-anchor="middle" font-size="11" fill="#555">'0' → leftZeros += 1 ；'1' → rightOnes −= 1</text>
  <text x="260" y="338" text-anchor="middle" font-size="10" fill="#888">i 是新并入左侧的那个字符下标</text>

  <path d="M 260 344 L 260 362" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 5. update ans -->
  <rect x="120" y="362" width="280" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="380" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">④ ans = max(ans, leftZeros + rightOnes)</text>
  <text x="260" y="395" text-anchor="middle" font-size="10.5" fill="#555">i += 1，回到 ③ 判定</text>

  <!-- loop back -->
  <path d="M 110 382 L 70 382 L 70 222 L 138 222" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="46" y="300" font-size="10.5" fill="#666" font-weight="bold">i++</text>

  <!-- bottom note -->
  <rect x="50" y="416" width="420" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="260" y="434" text-anchor="middle" font-size="10.5" fill="#555">每个分割点只 O(1) 更新两个计数器，共 n−1 个分割点 ⟹ O(n) 时间、O(1) 空间</text>
  <text x="260" y="446" text-anchor="middle" font-size="10" fill="#888">初始 rightOnes 可与主循环合并：边统计总 '1' 数边减去左侧的 '1'</text>
</svg>
