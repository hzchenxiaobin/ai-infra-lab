<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：排序后小半 / 大半交错放置 → 峰谷交替</text>

  <!-- ===== Step 1: Sort ===== -->
  <text x="40" y="56" font-size="12" fill="#555" font-weight="bold">① 排序</text>
  <text x="40" y="78" font-size="11" fill="#888">原数组:</text>
  <g font-size="12" fill="#333" text-anchor="middle">
    <rect x="100" y="64" width="38" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="119" y="83">6</text>
    <rect x="138" y="64" width="38" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="157" y="83">2</text>
    <rect x="176" y="64" width="38" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="195" y="83">0</text>
    <rect x="214" y="64" width="38" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="233" y="83">9</text>
    <rect x="252" y="64" width="38" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="271" y="83">7</text>
  </g>
  <path d="M 300 78 L 330 78" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="338" y="74" font-size="10" fill="#888">排序</text>

  <text x="40" y="108" font-size="11" fill="#888">排序后:</text>
  <g font-size="12" fill="#333" text-anchor="middle">
    <rect x="100" y="94" width="38" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="119" y="113">0</text>
    <rect x="138" y="94" width="38" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="157" y="113">2</text>
    <rect x="176" y="94" width="38" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="195" y="113">6</text>
    <rect x="214" y="94" width="38" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="233" y="113">7</text>
    <rect x="252" y="94" width="38" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="271" y="113">9</text>
  </g>

  <!-- ===== Step 2: Split ===== -->
  <path d="M 40 136 L 540 136" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="40" y="158" font-size="12" fill="#555" font-weight="bold">② 分半</text>

  <text x="40" y="184" font-size="11" fill="#888">小半 (≤):</text>
  <g font-size="12" fill="#333" text-anchor="middle">
    <rect x="110" y="170" width="38" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="129" y="189">0</text>
    <rect x="148" y="170" width="38" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="167" y="189">2</text>
    <rect x="186" y="170" width="38" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="205" y="189">6</text>
  </g>
  <text x="234" y="189" font-size="10" fill="#4a7a3a">← 偶数位</text>

  <text x="40" y="218" font-size="11" fill="#888">大半 (≥):</text>
  <g font-size="12" fill="#333" text-anchor="middle">
    <rect x="110" y="204" width="38" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="129" y="223">7</text>
    <rect x="148" y="204" width="38" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="167" y="223">9</text>
  </g>
  <text x="196" y="223" font-size="10" fill="#d6a040">← 奇数位</text>

  <!-- split line -->
  <path d="M 186 94 L 186 134" stroke="#888" stroke-width="1.5" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="192" y="128" font-size="9.5" fill="#888">mid=3</text>

  <!-- ===== Step 3: Interleave ===== -->
  <path d="M 40 246 L 540 246" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="40" y="268" font-size="12" fill="#555" font-weight="bold">③ 交错放置 → zigzag 峰谷交替</text>

  <!-- index ruler -->
  <text x="40" y="294" font-size="9.5" fill="#aaa">idx:</text>
  <g font-size="9.5" fill="#aaa" text-anchor="middle">
    <text x="119" y="294">0</text>
    <text x="157" y="294">1</text>
    <text x="195" y="294">2</text>
    <text x="233" y="294">3</text>
    <text x="271" y="294">4</text>
  </g>

  <!-- result row with alternating small(谷)/large(峰) -->
  <g font-size="12" fill="#333" text-anchor="middle">
    <rect x="100" y="300" width="38" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="119" y="319">0</text>
    <rect x="138" y="300" width="38" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="157" y="319">7</text>
    <rect x="176" y="300" width="38" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="195" y="319">2</text>
    <rect x="214" y="300" width="38" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="233" y="319">9</text>
    <rect x="252" y="300" width="38" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="271" y="319">6</text>
  </g>

  <text x="300" y="319" font-size="10.5" fill="#555">= [0, 7, 2, 9, 6]</text>

  <!-- 谷/峰 labels -->
  <text x="119" y="344" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">谷</text>
  <text x="157" y="344" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">峰</text>
  <text x="195" y="344" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">谷</text>
  <text x="233" y="344" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">峰</text>
  <text x="271" y="344" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">谷</text>

  <!-- zigzag curve -->
  <path d="M 119 340 Q 157 372 195 340 Q 233 372 271 340" stroke="#888" stroke-width="2" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Verification ===== -->
  <path d="M 40 380 L 540 380" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <text x="40" y="404" font-size="11" fill="#888">校验:</text>
  <text x="80" y="404" font-size="10.5" fill="#4a7a3a">i=1: avg(0,2)=1 ≠ 7 ✓</text>
  <text x="230" y="404" font-size="10.5" fill="#4a7a3a">i=2: avg(7,9)=8 ≠ 2 ✓</text>
  <text x="380" y="404" font-size="10.5" fill="#4a7a3a">i=3: avg(2,6)=4 ≠ 9 ✓</text>
</svg>
