<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：nums = [5,3,6,1,12], original = 3</text>

  <!-- Set display at top -->
  <rect x="140" y="42" width="280" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="130" y="62" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">set:</text>
  <text x="280" y="62" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">{ 1, 3, 5, 6, 12 }</text>

  <!-- divider -->
  <path d="M 30 84 L 530 84" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ====== Step 1: original=3, in set ====== -->
  <text x="36" y="112" font-size="11" fill="#444" font-weight="bold">步 1</text>
  <rect x="80" y="96" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="110" y="118" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <text x="110" y="90" text-anchor="middle" font-size="9" fill="#888">original</text>
  <!-- check mark -->
  <text x="160" y="118" font-size="12" fill="#4a7a3a" font-weight="bold">∈ set ?</text>
  <text x="230" y="118" font-size="12" fill="#4a7a3a" font-weight="bold">✅ 是</text>
  <!-- arrow -->
  <path d="M 270 113 L 320 113" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="295" y="106" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">×2</text>
  <rect x="324" y="96" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="354" y="118" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>
  <text x="400" y="118" font-size="10" fill="#888">→ 新 original = 6</text>

  <!-- divider -->
  <path d="M 30 146 L 530 146" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ====== Step 2: original=6, in set ====== -->
  <text x="36" y="176" font-size="11" fill="#444" font-weight="bold">步 2</text>
  <rect x="80" y="160" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="110" y="182" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>
  <text x="110" y="154" text-anchor="middle" font-size="9" fill="#888">original</text>
  <text x="160" y="182" font-size="12" fill="#4a7a3a" font-weight="bold">∈ set ?</text>
  <text x="230" y="182" font-size="12" fill="#4a7a3a" font-weight="bold">✅ 是</text>
  <path d="M 270 177 L 320 177" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="295" y="170" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">×2</text>
  <rect x="324" y="160" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="354" y="182" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">12</text>
  <text x="400" y="182" font-size="10" fill="#888">→ 新 original = 12</text>

  <!-- divider -->
  <path d="M 30 210 L 530 210" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ====== Step 3: original=12, in set ====== -->
  <text x="36" y="240" font-size="11" fill="#444" font-weight="bold">步 3</text>
  <rect x="80" y="224" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="110" y="246" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">12</text>
  <text x="110" y="218" text-anchor="middle" font-size="9" fill="#888">original</text>
  <text x="160" y="246" font-size="12" fill="#4a7a3a" font-weight="bold">∈ set ?</text>
  <text x="230" y="246" font-size="12" fill="#4a7a3a" font-weight="bold">✅ 是</text>
  <path d="M 270 241 L 320 241" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="295" y="234" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">×2</text>
  <rect x="324" y="224" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="354" y="246" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">24</text>
  <text x="400" y="246" font-size="10" fill="#888">→ 新 original = 24</text>

  <!-- divider -->
  <path d="M 30 274 L 530 274" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ====== Step 4: original=24, NOT in set ====== -->
  <text x="36" y="304" font-size="11" fill="#444" font-weight="bold">步 4</text>
  <rect x="80" y="288" width="60" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="110" y="310" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">24</text>
  <text x="110" y="282" text-anchor="middle" font-size="9" fill="#888">original</text>
  <text x="160" y="310" font-size="12" fill="#b85450" font-weight="bold">∈ set ?</text>
  <text x="230" y="310" font-size="12" fill="#b85450" font-weight="bold">❌ 否</text>
  <text x="280" y="310" font-size="11" fill="#b85450">→ 24 &gt; max(nums)=12，必不在集合中，停止</text>

  <!-- divider -->
  <path d="M 30 338 L 530 338" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ====== Result ====== -->
  <rect x="140" y="354" width="280" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="380" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">返回 24 ✓（3 次倍增后停止）</text>

  <!-- summary chain -->
  <text x="280" y="412" text-anchor="middle" font-size="10" fill="#888">倍增链：3 → 6 → 12 → 24（×2 ×2 ×2，共 3 次）</text>
</svg>
