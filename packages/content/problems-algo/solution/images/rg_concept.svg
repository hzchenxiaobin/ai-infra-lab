<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：7 天滑动窗口——固定窗口大小，逐日滑动</text>

  <!-- ============ Section 1: daily aggregation timeline ============ -->
  <text x="280" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① 每日聚合 daily：GROUP BY visited_on（每天一行日合计）</text>

  <!-- 10 day boxes: 48px wide, 2px gap, start x=32 -->
  <!-- Days 1-6: gray (incomplete window, not output) -->
  <rect x="32" y="60" width="48" height="42" fill="#f0f0f0" stroke="#aaa" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="56" y="74" text-anchor="middle" font-size="8" fill="#999">01-01</text>
  <text x="56" y="92" text-anchor="middle" font-size="12" fill="#999" font-weight="bold">100</text>

  <rect x="82" y="60" width="48" height="42" fill="#f0f0f0" stroke="#aaa" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="106" y="74" text-anchor="middle" font-size="8" fill="#999">01-02</text>
  <text x="106" y="92" text-anchor="middle" font-size="12" fill="#999" font-weight="bold">110</text>

  <rect x="132" y="60" width="48" height="42" fill="#f0f0f0" stroke="#aaa" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="156" y="74" text-anchor="middle" font-size="8" fill="#999">01-03</text>
  <text x="156" y="92" text-anchor="middle" font-size="12" fill="#999" font-weight="bold">120</text>

  <rect x="182" y="60" width="48" height="42" fill="#f0f0f0" stroke="#aaa" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="206" y="74" text-anchor="middle" font-size="8" fill="#999">01-04</text>
  <text x="206" y="92" text-anchor="middle" font-size="12" fill="#999" font-weight="bold">130</text>

  <rect x="232" y="60" width="48" height="42" fill="#f0f0f0" stroke="#aaa" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="256" y="74" text-anchor="middle" font-size="8" fill="#999">01-05</text>
  <text x="256" y="92" text-anchor="middle" font-size="12" fill="#999" font-weight="bold">110</text>

  <rect x="282" y="60" width="48" height="42" fill="#f0f0f0" stroke="#aaa" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="306" y="74" text-anchor="middle" font-size="8" fill="#999">01-06</text>
  <text x="306" y="92" text-anchor="middle" font-size="12" fill="#999" font-weight="bold">140</text>

  <!-- Days 7-10: green (valid output, full 7-day window) -->
  <rect x="332" y="60" width="48" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="356" y="74" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">01-07</text>
  <text x="356" y="92" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">150</text>

  <rect x="382" y="60" width="48" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="406" y="74" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">01-08</text>
  <text x="406" y="92" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">80</text>

  <rect x="432" y="60" width="48" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="456" y="74" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">01-09</text>
  <text x="456" y="92" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">110</text>

  <rect x="482" y="60" width="48" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="506" y="74" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">01-10</text>
  <text x="506" y="92" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">280</text>

  <!-- annotation for gray days -->
  <path d="M170 50 L170 46 L292 46 L292 50" stroke="#aaa" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="231" y="42" text-anchor="middle" font-size="9" fill="#999" font-weight="bold">前 6 天：窗口未满 → 不输出</text>

  <!-- annotation for green days -->
  <path d="M340 50 L340 46 L522 46 L522 50" stroke="#4a7a3a" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="431" y="42" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">第 7 天起：窗口满 7 天 → 输出</text>

  <!-- ============ Section 2: sliding window brackets ============ -->
  <!-- Window 1: days 1-7 (x=32 to x=380) -->
  <path d="M32 116 L32 126 L380 126 L380 116" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <rect x="120" y="128" width="180" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="210" y="141" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">窗口1: 01-01~01-07 → sum=860</text>

  <!-- Window 4: days 4-10 (x=182 to x=530) -->
  <path d="M182 156 L182 166 L530 166 L530 156" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <rect x="270" y="168" width="180" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="360" y="181" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">窗口4: 01-04~01-10 → sum=1000</text>

  <!-- sliding arrow -->
  <path d="M210 152 L360 152" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="285" y="149" text-anchor="middle" font-size="8" fill="#d6a040">窗口逐日滑动 →</text>

  <!-- ============ Section 3: formula ============ -->
  <rect x="60" y="200" width="440" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="80" y="220" font-size="11" fill="#333">输出列 <tspan fill="#446688" font-weight="bold">amount</tspan> = 窗口内 7 天日合计之和</text>
  <text x="80" y="238" font-size="11" fill="#333">输出列 <tspan fill="#b85450" font-weight="bold">average_amount</tspan> = ROUND(amount / 7, 2)</text>
  <text x="80" y="252" font-size="9" fill="#888">窗口大小固定 7，逐日右移一天；前 6 天窗口不足 7 → 过滤掉</text>

  <!-- ============ Section 4: key notes ============ -->
  <rect x="20" y="272" width="520" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="40" y="290" font-size="10" fill="#333">🔑 <tspan fill="#446688" font-weight="bold">与累计求和（1308）的区别</tspan>：1308 窗口从起点<tspan fill="#446688" font-weight="bold">不断增长</tspan>到当前行；</text>
  <text x="40" y="306" font-size="10" fill="#333">    本题窗口<tspan fill="#b85450" font-weight="bold">固定大小 7</tspan>，旧端出去、新端进来——「滑动」而非「累积」。</text>
  <text x="40" y="322" font-size="10" fill="#333">    SQL 体现：<tspan fill="#d6a040" font-weight="bold">ROWS BETWEEN 6 PRECEDING AND CURRENT ROW</tspan>（固定 7 行框架）。</text>

  <!-- ============ Section 5: output preview ============ -->
  <text x="280" y="346" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">② 输出：仅含窗口满 7 天的行</text>

  <rect x="80" y="354" width="120" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="369" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">visited_on</text>
  <rect x="200" y="354" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="369" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">amount</text>
  <rect x="280" y="354" width="110" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="335" y="369" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">average_amount</text>

  <rect x="80" y="376" width="120" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="140" y="390" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">01-07</text>
  <rect x="200" y="376" width="80" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="240" y="390" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">860</text>
  <rect x="280" y="376" width="110" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="335" y="390" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">122.86</text>
</svg>
