<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="480" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：排序 + 单趟扫描维护 max_def</text>

  <!-- Start -->
  <rect x="190" y="44" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">开始</text>
  <path d="M 260 74 L 260 86" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Sort -->
  <rect x="110" y="88" width="300" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="106" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">排序 properties</text>
  <text x="260" y="120" text-anchor="middle" font-size="10" fill="#555">攻击降序；同攻击则防御升序</text>
  <path d="M 260 128 L 260 140" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init -->
  <rect x="170" y="142" width="180" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="164" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">max_def = 0,  ans = 0</text>
  <path d="M 260 176 L 260 188" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop entry -->
  <rect x="150" y="190" width="220" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="210" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">取下一个角色 p（从左到右）</text>
  <path d="M 260 222 L 260 234" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="260,236 360,276 260,316 160,276" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="272" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">p.defense</text>
  <text x="260" y="288" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">&lt; max_def ?</text>

  <!-- Yes branch: weak -->
  <path d="M 160 276 L 70 276" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="110" y="270" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="20" y="258" width="56" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="48" y="276" text-anchor="middle" font-size="10" fill="#b85450">弱角色</text>
  <text x="48" y="290" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">ans++</text>

  <!-- No branch: update max_def -->
  <path d="M 360 276 L 450 276" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="270" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">否</text>
  <rect x="448" y="258" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="478" y="276" text-anchor="middle" font-size="10" fill="#446688">更新</text>
  <text x="478" y="290" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">max_def</text>

  <!-- merge down to loop check -->
  <path d="M 48 298 L 48 340 L 258 340" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 478 298 L 478 340 L 262 340" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop check -->
  <polygon points="260,338 330,368 260,398 190,368" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="372" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">还有角色?</text>

  <!-- loop back -->
  <path d="M 330 368 L 380 368 L 380 206 L 370 206" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="388" y="290" font-size="10" fill="#4a7a3a" font-weight="bold">是 ↑</text>

  <!-- exit -->
  <path d="M 260 398 L 260 412" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="408" font-size="10" fill="#888">否</text>

  <!-- Return -->
  <rect x="180" y="414" width="160" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="260" y="434" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 ans</text>

  <!-- End -->
  <rect x="220" y="452" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="467" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">结束</text>
</svg>
