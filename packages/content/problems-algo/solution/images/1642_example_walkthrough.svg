<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="480" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：heights=[4,2,7,6,9,14,12] bricks=5 ladders=1</text>

  <!-- Table header -->
  <g filter="url(#rough2)">
    <rect x="30" y="48" width="50" height="30" fill="#446688" stroke="#446688" stroke-width="1.2"/>
    <text x="55" y="68" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">步骤</text>
    <rect x="80" y="48" width="70" height="30" fill="#446688" stroke="#446688" stroke-width="1.2"/>
    <text x="115" y="68" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">移动</text>
    <rect x="150" y="48" width="50" height="30" fill="#446688" stroke="#446688" stroke-width="1.2"/>
    <text x="175" y="68" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">gap</text>
    <rect x="200" y="48" width="180" height="30" fill="#446688" stroke="#446688" stroke-width="1.2"/>
    <text x="290" y="68" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">操作</text>
    <rect x="380" y="48" width="100" height="30" fill="#446688" stroke="#446688" stroke-width="1.2"/>
    <text x="430" y="68" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">堆（梯子组）</text>
    <rect x="480" y="48" width="70" height="30" fill="#446688" stroke="#446688" stroke-width="1.2"/>
    <text x="515" y="68" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">bricks</text>
    <rect x="550" y="48" width="40" height="30" fill="#446688" stroke="#446688" stroke-width="1.2"/>
    <text x="570" y="68" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">结果</text>
  </g>

  <!-- Row 1: 0→1, gap=-2, free -->
  <g filter="url(#rough2)">
    <rect x="30" y="78" width="50" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
    <text x="55" y="97" text-anchor="middle" font-size="11" fill="#555">1</text>
    <rect x="80" y="78" width="70" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
    <text x="115" y="97" text-anchor="middle" font-size="11" fill="#555">0→1</text>
    <rect x="150" y="78" width="50" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
    <text x="175" y="97" text-anchor="middle" font-size="11" fill="#888">−2</text>
    <rect x="200" y="78" width="180" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
    <text x="290" y="97" text-anchor="middle" font-size="10" fill="#446688">下坡，免费通行</text>
    <rect x="380" y="78" width="100" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
    <text x="430" y="97" text-anchor="middle" font-size="11" fill="#888">[]</text>
    <rect x="480" y="78" width="70" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
    <text x="515" y="97" text-anchor="middle" font-size="11" fill="#555">5</text>
    <rect x="550" y="78" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/>
    <text x="570" y="97" text-anchor="middle" font-size="11" fill="#4a7a3a">✓</text>
  </g>

  <!-- Row 2: 1→2, gap=+5, push, size=1<=1 -->
  <g filter="url(#rough2)">
    <rect x="30" y="106" width="50" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
    <text x="55" y="125" text-anchor="middle" font-size="11" fill="#555">2</text>
    <rect x="80" y="106" width="70" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
    <text x="115" y="125" text-anchor="middle" font-size="11" fill="#555">1→2</text>
    <rect x="150" y="106" width="50" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1"/>
    <text x="175" y="125" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">+5</text>
    <rect x="200" y="106" width="180" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/>
    <text x="290" y="125" text-anchor="middle" font-size="10" fill="#4a7a3a">入堆，size 1 ≤ 1，用梯子</text>
    <rect x="380" y="106" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="430" y="125" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">[5]</text>
    <rect x="480" y="106" width="70" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
    <text x="515" y="125" text-anchor="middle" font-size="11" fill="#555">5</text>
    <rect x="550" y="106" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/>
    <text x="570" y="125" text-anchor="middle" font-size="11" fill="#4a7a3a">✓</text>
  </g>

  <!-- Row 3: 2→3, gap=-1, free -->
  <g filter="url(#rough2)">
    <rect x="30" y="134" width="50" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
    <text x="55" y="153" text-anchor="middle" font-size="11" fill="#555">3</text>
    <rect x="80" y="134" width="70" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
    <text x="115" y="153" text-anchor="middle" font-size="11" fill="#555">2→3</text>
    <rect x="150" y="134" width="50" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
    <text x="175" y="153" text-anchor="middle" font-size="11" fill="#888">−1</text>
    <rect x="200" y="134" width="180" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
    <text x="290" y="153" text-anchor="middle" font-size="10" fill="#446688">下坡，免费通行</text>
    <rect x="380" y="134" width="100" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
    <text x="430" y="153" text-anchor="middle" font-size="11" fill="#888">[5]</text>
    <rect x="480" y="134" width="70" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
    <text x="515" y="153" text-anchor="middle" font-size="11" fill="#555">5</text>
    <rect x="550" y="134" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/>
    <text x="570" y="153" text-anchor="middle" font-size="11" fill="#4a7a3a">✓</text>
  </g>

  <!-- Row 4: 3→4, gap=+3, push, size=2>1, pop 3, bricks-=3 -->
  <g filter="url(#rough2)">
    <rect x="30" y="162" width="50" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
    <text x="55" y="181" text-anchor="middle" font-size="11" fill="#555">4</text>
    <rect x="80" y="162" width="70" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
    <text x="115" y="181" text-anchor="middle" font-size="11" fill="#555">3→4</text>
    <rect x="150" y="162" width="50" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1"/>
    <text x="175" y="181" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">+3</text>
    <rect x="200" y="162" width="180" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1"/>
    <text x="290" y="181" text-anchor="middle" font-size="9" fill="#d6a040">入堆→溢出→弹 3，bricks−=3</text>
    <rect x="380" y="162" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="430" y="181" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">[5]</text>
    <rect x="480" y="162" width="70" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1"/>
    <text x="515" y="181" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>
    <rect x="550" y="162" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/>
    <text x="570" y="181" text-anchor="middle" font-size="11" fill="#4a7a3a">✓</text>
  </g>

  <!-- Row 5: 4→5, gap=+5, push, size=2>1, pop 5, bricks-=5 → -3 -->
  <g filter="url(#rough2)">
    <rect x="30" y="190" width="50" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
    <text x="55" y="209" text-anchor="middle" font-size="11" fill="#555">5</text>
    <rect x="80" y="190" width="70" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
    <text x="115" y="209" text-anchor="middle" font-size="11" fill="#555">4→5</text>
    <rect x="150" y="190" width="50" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1"/>
    <text x="175" y="209" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">+5</text>
    <rect x="200" y="190" width="180" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1"/>
    <text x="290" y="209" text-anchor="middle" font-size="9" fill="#b85450">入堆→溢出→弹 5，bricks−=5</text>
    <rect x="380" y="190" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="430" y="209" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">[5]</text>
    <rect x="480" y="190" width="70" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <text x="515" y="209" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−3</text>
    <rect x="550" y="190" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <text x="570" y="209" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  </g>

  <!-- Result box -->
  <rect x="30" y="240" width="560" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="48" y="262" font-size="12" fill="#b85450" font-weight="bold">bricks = −3 &lt; 0 → 砖块耗尽，无法到达建筑 5</text>
  <text x="48" y="278" font-size="12" fill="#b85450" font-weight="bold">返回当前下标 i = 4 ✓（与示例输出一致）</text>

  <!-- Insight: heap always keeps the largest -->
  <rect x="30" y="300" width="560" height="170" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="48" y="324" font-size="12" fill="#d6a040" font-weight="bold">关键观察：堆中始终保留最大的 l 个差值</text>

  <!-- Visual: gaps 5, 3, 5 and which go where -->
  <g filter="url(#rough2)">
    <text x="48" y="350" font-size="11" fill="#555">三个正差值（按出现顺序）：</text>
    <!-- gap 5 (step 2) - ladder -->
    <rect x="70" y="360" width="60" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="100" y="379" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">+5</text>
    <text x="140" y="379" font-size="10" fill="#4a7a3a">→ 梯子（留在堆中）</text>
    <!-- gap 3 (step 4) - bricks -->
    <rect x="70" y="394" width="60" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="100" y="413" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">+3</text>
    <text x="140" y="413" font-size="10" fill="#d6a040">→ 砖块（弹出降级，扣 3）</text>
    <!-- gap 5 (step 5) - tried ladder then popped -->
    <rect x="70" y="428" width="60" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="100" y="447" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">+5</text>
    <text x="140" y="447" font-size="10" fill="#b85450">→ 入堆后弹最小=5，扣 5 → 砖块爆</text>
  </g>

  <text x="48" y="464" font-size="10" fill="#888">最终堆=[5]：最大的差值始终占梯子位，最小的被降级为砖块——这就是贪心的体现。</text>
</svg>
