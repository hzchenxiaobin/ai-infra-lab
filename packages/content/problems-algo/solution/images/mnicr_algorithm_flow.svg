<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrGy" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="410" fill="#fafafa"/>

  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：i = 1..n 顺序扫描，跳过 banned、超预算即停</text>

  <!-- start -->
  <rect x="150" y="34" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="56" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">S = set(banned);  sum = 0;  cnt = 0</text>

  <path d="M 270 68 L 270 84" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond1: i <= n ? -->
  <path d="M 270 86 L 338 110 L 270 134 L 202 110 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="114" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i ≤ n ?</text>
  <!-- No branch: left rail down to return -->
  <path d="M 202 110 L 110 110 L 110 372" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrGy)" filter="url(#rough2)"/>
  <text x="150" y="103" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">否（扫完）</text>

  <path d="M 270 134 L 270 152" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="148" font-size="10.5" fill="#446688" font-weight="bold">是</text>

  <!-- diamond2: i in banned ? -->
  <path d="M 270 154 L 338 178 L 270 202 L 202 178 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="182" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">i ∈ banned ?</text>
  <!-- Yes branch: right rail down to i++ box (skip) -->
  <path d="M 338 178 L 440 178 L 440 354" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrGy)" filter="url(#rough2)"/>
  <text x="384" y="171" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">是 跳过</text>

  <path d="M 270 202 L 270 218" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="214" font-size="10.5" fill="#446688" font-weight="bold">否</text>

  <!-- diamond3: sum + i > maxSum ? -->
  <path d="M 270 220 L 352 244 L 270 268 L 188 244 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="248" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">sum+i &gt; maxSum ?</text>
  <!-- Yes branch: left rail (merge) -->
  <path d="M 188 244 L 110 244" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="150" y="237" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">是 超预算</text>

  <path d="M 270 268 L 270 286" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="282" font-size="10.5" fill="#446688" font-weight="bold">否</text>

  <!-- update box -->
  <rect x="150" y="288" width="240" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="310" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">sum += i;  cnt++</text>

  <path d="M 270 322 L 270 340" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- shared i++ box -->
  <rect x="170" y="342" width="200" height="34" fill="#eeeeee" stroke="#888" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="364" text-anchor="middle" font-size="12" fill="#666" font-weight="bold">i++</text>

  <!-- loop back from i++ to diamond1 (right rail) -->
  <path d="M 370 359 L 470 359 L 470 110 L 338 110" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrGy)" filter="url(#rough2)"/>
  <text x="478" y="234" font-size="10.5" fill="#888" font-weight="bold">回环</text>

  <!-- return cnt box -->
  <rect x="50" y="372" width="120" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="110" y="392" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return cnt</text>

  <!-- note -->
  <text x="270" y="404" text-anchor="middle" font-size="10.5" fill="#888">扫描至多 n 步；超预算或扫完即返回 cnt，无需排序 banned</text>
</svg>
