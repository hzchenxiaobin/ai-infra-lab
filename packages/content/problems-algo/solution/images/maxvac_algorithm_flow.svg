<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="500" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">算法流程：初始化第 0 周 → 逐周逐城市枚举可达前驱取 max → 末周取最大</text>

  <!-- Step 1: init week 0 -->
  <rect x="110" y="46" width="300" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">初始化第 0 周（从城市 0 出发）</text>
  <text x="260" y="86" text-anchor="middle" font-size="10" fill="#555">dp[0][c] = days[c][0]，若 c==0 或 flights[0][c]==1</text>
  <text x="260" y="98" text-anchor="middle" font-size="10" fill="#b85450">否则 dp[0][c] = −∞（不可达）</text>

  <path d="M 260 106 L 260 124" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: outer loop week -->
  <polygon points="260,126 370,166 260,206 150,166" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="162" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">周 w = 1 .. K−1 ?</text>
  <text x="260" y="178" text-anchor="middle" font-size="10" fill="#888">逐周推进</text>

  <path d="M 260 206 L 260 224" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: inner loop city -->
  <polygon points="260,226 360,262 260,298 160,262" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="258" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">城市 c = 0 .. N−1 ?</text>
  <text x="260" y="274" text-anchor="middle" font-size="10" fill="#888">本周落脚城市</text>

  <!-- inner body (right) -->
  <path d="M 360 262 L 398 262" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="400" y="226" width="108" height="74" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="454" y="246" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">枚举前驱 p</text>
  <text x="454" y="262" text-anchor="middle" font-size="9" fill="#666">若 dp[w−1][p] &lt; 0</text>
  <text x="454" y="274" text-anchor="middle" font-size="9" fill="#b85450">  → 跳过</text>
  <text x="454" y="290" text-anchor="middle" font-size="9" fill="#4a7a3a">取 max best</text>

  <path d="M 454 226 C 454 200 360 200 360 262" stroke="#666" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="408" y="208" font-size="9" fill="#888">下一个 p</text>

  <path d="M 260 298 L 260 318" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- update dp -->
  <rect x="140" y="320" width="240" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="342" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">dp[w][c] = days[c][w] + best</text>
  <text x="260" y="358" text-anchor="middle" font-size="10" fill="#888">best 仍为 −∞ 则保持 −∞（不可达）</text>

  <!-- loop back to next city -->
  <path d="M 260 370 C 260 300 70 300 70 262 L 160 262" stroke="#666" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="84" y="232" font-size="9" fill="#888">下一个 c</text>
  <!-- loop back to next week (from city exit left) -->
  <path d="M 160 262 L 150 166" stroke="#666" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="220" font-size="9" fill="#888">下一周 w</text>

  <path d="M 260 370 L 260 396" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return -->
  <rect x="140" y="398" width="240" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="424" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return max { dp[K−1][c] }</text>

  <!-- side note -->
  <rect x="396" y="398" width="112" height="68" fill="#fafafa" stroke="#999" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="452" y="418" text-anchor="middle" font-size="10" fill="#777" font-weight="bold">可达判定</text>
  <text x="404" y="436" font-size="9" fill="#446688">p == c（留）</text>
  <text x="404" y="450" font-size="9" fill="#4a7a3a">或 flights[p][c]==1</text>
  <text x="404" y="462" font-size="9" fill="#b85450">方向别写反</text>
</svg>
