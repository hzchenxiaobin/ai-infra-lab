<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>
  <text x="270" y="30" text-anchor="middle" font-size="15" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：DFS 边沉岛边判定</text>

  <!-- start -->
  <rect x="170" y="50" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="72" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">遍历 grid2 每个格子 (i, j)</text>

  <path d="M 270 84 L 270 106" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision: grid2[i][j] == 1 ? -->
  <polygon points="270,110 390,150 270,190 150,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="146" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">grid2[i][j] == 1 ?</text>
  <text x="270" y="162" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">(未访问的陆地)</text>

  <!-- no branch: skip -->
  <path d="M 390 150 L 430 150" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="402" y="144" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="430" y="132" width="90" height="36" fill="#f4f4f4" stroke="#aaa" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="475" y="155" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">跳过</text>

  <!-- yes branch -->
  <path d="M 270 190 L 270 212" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="278" y="206" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- DFS body box -->
  <rect x="55" y="214" width="430" height="110" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="270" y="236" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">dfs(i, j, &amp;flag) 递归体</text>

  <text x="75" y="258" font-size="11.5" fill="#333" filter="url(#rough2)">1. 越界或 grid2[i][j] != 1 → return</text>
  <text x="75" y="278" font-size="11.5" fill="#333" filter="url(#rough2)">2. 若 grid1[i][j] == 0 → flag = false（本岛失配）</text>
  <text x="75" y="298" font-size="11.5" fill="#333" filter="url(#rough2)">3. grid2[i][j] = 0   （沉岛，兼做 visited）</text>
  <text x="75" y="316" font-size="11" fill="#b85450" filter="url(#rough2)">注：flag=false 仍继续 DFS 沉完整岛，避免残留</text>

  <path d="M 270 324 L 270 346" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision: flag ? -->
  <polygon points="270,350 380,386 270,422 160,386" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="184" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)"></text>
  <text x="270" y="382" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">flag == true ?</text>
  <text x="270" y="398" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">(整岛 grid1 全为 1)</text>

  <!-- yes: count++ -->
  <path d="M 160 386 L 120 386" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="138" y="380" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="20" y="368" width="100" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="70" y="378" text-anchor="middle" font-size="11" fill="#3a5a2a" filter="url(#rough2)">子岛屿！</text>
  <text x="70" y="394" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">count++</text>

  <!-- no: skip count -->
  <path d="M 380 386 L 420 386" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="396" y="380" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="420" y="368" width="100" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="470" y="388" text-anchor="middle" font-size="11" fill="#7a3030" filter="url(#rough2)">不计数</text>
</svg>
