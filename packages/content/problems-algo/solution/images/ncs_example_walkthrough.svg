<svg xmlns="http://www.w3.org/2000/svg" width="920" height="600" viewBox="0 0 920 600" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="920" height="600" fill="#fdfcf7"/>
  <text x="460" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：延迟删除如何让 find(10) 从 1 变 2</text>
  <path d="M 320 46 Q 460 54 600 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- header row -->
  <g filter="url(#sk)">
    <rect x="40" y="66" width="840" height="34" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <line x1="220" y1="66" x2="220" y2="100" stroke="#4a8edb" stroke-width="1.2"/>
    <line x1="500" y1="66" x2="500" y2="100" stroke="#4a8edb" stroke-width="1.2"/>
    <line x1="740" y1="66" x2="740" y2="100" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <g font-size="12.5" font-weight="bold" fill="#2b6e9e">
    <text x="130" y="88" text-anchor="middle">操作</text>
    <text x="360" y="88" text-anchor="middle">idx2num（真值）</text>
    <text x="620" y="88" text-anchor="middle">heaps[10] / heaps[20]</text>
    <text x="830" y="88" text-anchor="middle">返回</text>
  </g>

  <!-- Row 1: find(10) -->
  <g filter="url(#sk)"><rect x="40" y="102" width="840" height="36" rx="4" fill="#fff" stroke="#bbb" stroke-width="1"/></g>
  <line x1="220" y1="102" x2="220" y2="138" stroke="#ccc"/>
  <line x1="500" y1="102" x2="500" y2="138" stroke="#ccc"/>
  <line x1="740" y1="102" x2="740" y2="138" stroke="#ccc"/>
  <text x="130" y="124" text-anchor="middle" font-size="11.5" fill="#555">find(10)</text>
  <text x="360" y="124" text-anchor="middle" font-size="11" fill="#888">（空）</text>
  <text x="620" y="124" text-anchor="middle" font-size="11" fill="#888">— / —</text>
  <text x="830" y="124" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b03a3a">−1</text>

  <!-- Row 2: change(2,10) -->
  <g filter="url(#sk)"><rect x="40" y="140" width="840" height="36" rx="4" fill="#fff" stroke="#bbb" stroke-width="1"/></g>
  <line x1="220" y1="140" x2="220" y2="176" stroke="#ccc"/>
  <line x1="500" y1="140" x2="500" y2="176" stroke="#ccc"/>
  <line x1="740" y1="140" x2="740" y2="176" stroke="#ccc"/>
  <text x="130" y="162" text-anchor="middle" font-size="11.5" fill="#555">change(2, 10)</text>
  <text x="360" y="162" text-anchor="middle" font-size="11" fill="#2b6e9e">{2:10}</text>
  <text x="620" y="162" text-anchor="middle" font-size="11" fill="#4a7a3a">[2] / —</text>
  <text x="830" y="162" text-anchor="middle" font-size="11.5" fill="#888">null</text>

  <!-- Row 3: change(1,10) -->
  <g filter="url(#sk)"><rect x="40" y="178" width="840" height="36" rx="4" fill="#fff" stroke="#bbb" stroke-width="1"/></g>
  <line x1="220" y1="178" x2="220" y2="214" stroke="#ccc"/>
  <line x1="500" y1="178" x2="500" y2="214" stroke="#ccc"/>
  <line x1="740" y1="178" x2="740" y2="214" stroke="#ccc"/>
  <text x="130" y="200" text-anchor="middle" font-size="11.5" fill="#555">change(1, 10)</text>
  <text x="360" y="200" text-anchor="middle" font-size="11" fill="#2b6e9e">{2:10, 1:10}</text>
  <text x="620" y="200" text-anchor="middle" font-size="11" fill="#4a7a3a">[1,2] / —</text>
  <text x="620" y="210" text-anchor="middle" font-size="9" fill="#888">堆顶=1</text>
  <text x="830" y="200" text-anchor="middle" font-size="11.5" fill="#888">null</text>

  <!-- Row 4: change(3,10) -->
  <g filter="url(#sk)"><rect x="40" y="216" width="840" height="36" rx="4" fill="#fff" stroke="#bbb" stroke-width="1"/></g>
  <line x1="220" y1="216" x2="220" y2="252" stroke="#ccc"/>
  <line x1="500" y1="216" x2="500" y2="252" stroke="#ccc"/>
  <line x1="740" y1="216" x2="740" y2="252" stroke="#ccc"/>
  <text x="130" y="238" text-anchor="middle" font-size="11.5" fill="#555">change(3, 10)</text>
  <text x="360" y="238" text-anchor="middle" font-size="11" fill="#2b6e9e">{2:10, 1:10, 3:10}</text>
  <text x="620" y="238" text-anchor="middle" font-size="11" fill="#4a7a3a">[1,2,3] / —</text>
  <text x="830" y="238" text-anchor="middle" font-size="11.5" fill="#888">null</text>

  <!-- Row 5: change(5,10) -->
  <g filter="url(#sk)"><rect x="40" y="254" width="840" height="36" rx="4" fill="#fff" stroke="#bbb" stroke-width="1"/></g>
  <line x1="220" y1="254" x2="220" y2="290" stroke="#ccc"/>
  <line x1="500" y1="254" x2="500" y2="290" stroke="#ccc"/>
  <line x1="740" y1="254" x2="740" y2="290" stroke="#ccc"/>
  <text x="130" y="276" text-anchor="middle" font-size="11.5" fill="#555">change(5, 10)</text>
  <text x="360" y="276" text-anchor="middle" font-size="11" fill="#2b6e9e">+{5:10}（共 4 项）</text>
  <text x="620" y="276" text-anchor="middle" font-size="11" fill="#4a7a3a">[1,2,3,5] / —</text>
  <text x="830" y="276" text-anchor="middle" font-size="11.5" fill="#888">null</text>

  <!-- Row 6: find(10) -> 1 -->
  <g filter="url(#sk)"><rect x="40" y="292" width="840" height="40" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <line x1="220" y1="292" x2="220" y2="332" stroke="#4a7a3a" stroke-width="1.2"/>
  <line x1="500" y1="292" x2="500" y2="332" stroke="#4a7a3a" stroke-width="1.2"/>
  <line x1="740" y1="292" x2="740" y2="332" stroke="#4a7a3a" stroke-width="1.2"/>
  <text x="130" y="316" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-weight="bold">find(10)</text>
  <text x="360" y="316" text-anchor="middle" font-size="11" fill="#555">堆顶 1：idx2num[1]=10 ✓</text>
  <text x="620" y="316" text-anchor="middle" font-size="11" fill="#4a7a3a">[1,2,3,5] / —</text>
  <text x="830" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">1</text>

  <!-- Row 7: change(1,20) — key moment -->
  <g filter="url(#sk)"><rect x="40" y="334" width="840" height="40" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/></g>
  <line x1="220" y1="334" x2="220" y2="374" stroke="#c98a2b" stroke-width="1.2"/>
  <line x1="500" y1="334" x2="500" y2="374" stroke="#c98a2b" stroke-width="1.2"/>
  <line x1="740" y1="334" x2="740" y2="374" stroke="#c98a2b" stroke-width="1.2"/>
  <text x="130" y="358" text-anchor="middle" font-size="11.5" fill="#7a5415" font-weight="bold">change(1, 20)</text>
  <text x="360" y="352" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">idx2num[1]：10→20</text>
  <text x="360" y="368" text-anchor="middle" font-size="9.5" fill="#b03a3a">真值改了，但 heaps[10] 没动！</text>
  <text x="620" y="358" text-anchor="middle" font-size="11" fill="#555">[1,2,3,5] / </text>
  <text x="635" y="358" font-size="11" fill="#4a7a3a">[1]</text>
  <text x="830" y="358" text-anchor="middle" font-size="11.5" fill="#888">null</text>

  <!-- Row 8: find(10) -> 2 — lazy cleanup -->
  <g filter="url(#sk)"><rect x="40" y="376" width="840" height="52" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <line x1="220" y1="376" x2="220" y2="428" stroke="#b85450" stroke-width="1.2"/>
  <line x1="500" y1="376" x2="500" y2="428" stroke="#b85450" stroke-width="1.2"/>
  <line x1="740" y1="376" x2="740" y2="428" stroke="#b85450" stroke-width="1.2"/>
  <text x="130" y="400" text-anchor="middle" font-size="11.5" fill="#b03a3a" font-weight="bold">find(10)</text>
  <text x="360" y="392" text-anchor="middle" font-size="10.5" fill="#b03a3a">堆顶 1：idx2num[1]=20≠10 ✗ 弹</text>
  <text x="360" y="408" text-anchor="middle" font-size="10.5" fill="#2e6e2e">新堆顶 2：idx2num[2]=10 ✓ 取</text>
  <text x="620" y="394" text-anchor="middle" font-size="11" fill="#555">[2,3,5] / [1]</text>
  <text x="620" y="412" text-anchor="middle" font-size="9.5" fill="#b03a3a">1 被弹出</text>
  <text x="830" y="406" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">2</text>

  <!-- annotation -->
  <g filter="url(#sk)"><rect x="40" y="448" width="840" height="128" rx="10" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="5 3"/></g>
  <text x="460" y="474" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">关键一幕：第 7 行的 change(1, 20)</text>
  <text x="460" y="496" text-anchor="middle" font-size="11.5" fill="#555">真值表 idx2num 把下标 1 的数字改成了 20，heaps[20] 压入 1</text>
  <text x="460" y="514" text-anchor="middle" font-size="11.5" fill="#555">但 heaps[10] 里那个旧的 1 不被主动删除——它成了「过期堆顶」</text>
  <text x="460" y="532" text-anchor="middle" font-size="11.5" fill="#555">第 8 行 find(10) 用验证循环把它弹出，露出真正的最小下标 2</text>
  <text x="460" y="556" text-anchor="middle" font-size="10.5" fill="#888">若 change 时即时删除（见第 5 节），heaps[10] 会在第 7 行就把 1 摘掉——延迟与即时两条路殊途同归</text>
</svg>
