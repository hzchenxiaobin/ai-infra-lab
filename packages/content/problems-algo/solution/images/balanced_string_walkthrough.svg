<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "QQQW", target = 1</text>

  <!-- Initial state -->
  <text x="40" y="56" font-size="11" fill="#888" font-weight="bold">初始：cnt = {Q:3, W:1, E:0, R:0}，Q=3 &gt; 1 → 需替换</text>

  <!-- Step 0: right=0 -->
  <text x="40" y="86" font-size="11" fill="#555" font-weight="bold">right=0, s[0]='Q' → cnt[Q]−−</text>
  <rect x="40" y="96" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="116" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">Q</text>
  <rect x="84" y="96" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="104" y="116" text-anchor="middle" font-size="13" fill="#333">Q</text>
  <rect x="128" y="96" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="116" text-anchor="middle" font-size="13" fill="#333">Q</text>
  <rect x="172" y="96" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="192" y="116" text-anchor="middle" font-size="13" fill="#333">W</text>
  <text x="226" y="116" font-size="11" fill="#b85450">cnt={Q:2,W:1,E:0,R:0} Q=2&gt;1 ✗</text>

  <!-- Step 1: right=1 -->
  <text x="40" y="148" font-size="11" fill="#555" font-weight="bold">right=1, s[1]='Q' → cnt[Q]−−</text>
  <rect x="40" y="158" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="178" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">Q</text>
  <rect x="84" y="158" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="104" y="178" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">Q</text>
  <rect x="128" y="158" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="178" text-anchor="middle" font-size="13" fill="#333">Q</text>
  <rect x="172" y="158" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="192" y="178" text-anchor="middle" font-size="13" fill="#333">W</text>
  <text x="226" y="178" font-size="11" fill="#4a7a3a">cnt={Q:1,W:1,E:0,R:0} 全≤1 ✓</text>
  <text x="226" y="194" font-size="11" fill="#d6a040" font-weight="bold">ans = min(4, 1−0+1) = 2</text>

  <!-- Shrink arrow -->
  <path d="M 104 192 L 104 206" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="250" y="206" font-size="10" fill="#b85450">收缩：cnt[s[0]]++ → cnt={Q:2,...}, left=1, Q=2&gt;1 停</text>

  <!-- Step 2: right=2 -->
  <text x="40" y="232" font-size="11" fill="#555" font-weight="bold">right=2, s[2]='Q' → cnt[Q]−−</text>
  <rect x="40" y="242" width="40" height="30" fill="#ddd" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="262" text-anchor="middle" font-size="11" fill="#aaa">←</text>
  <rect x="84" y="242" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="104" y="262" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">Q</text>
  <rect x="128" y="242" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="262" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">Q</text>
  <rect x="172" y="242" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="192" y="262" text-anchor="middle" font-size="13" fill="#333">W</text>
  <text x="226" y="262" font-size="11" fill="#4a7a3a">cnt={Q:1,W:1,E:0,R:0} 全≤1 ✓</text>
  <text x="226" y="278" font-size="11" fill="#d6a040" font-weight="bold">ans = min(2, 2−1+1) = 2</text>

  <!-- Shrink arrow -->
  <path d="M 148 276 L 148 290" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="250" y="290" font-size="10" fill="#b85450">收缩：cnt[s[1]]++ → cnt={Q:2,...}, left=2, Q=2&gt;1 停</text>

  <!-- Step 3: right=3 -->
  <text x="40" y="316" font-size="11" fill="#555" font-weight="bold">right=3, s[3]='W' → cnt[W]−−</text>
  <rect x="40" y="326" width="40" height="30" fill="#ddd" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="346" text-anchor="middle" font-size="11" fill="#aaa">←</text>
  <rect x="84" y="326" width="40" height="30" fill="#ddd" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="104" y="346" text-anchor="middle" font-size="11" fill="#aaa">←</text>
  <rect x="128" y="326" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="346" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">Q</text>
  <rect x="172" y="326" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="192" y="346" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">W</text>
  <text x="226" y="346" font-size="11" fill="#b85450">cnt={Q:2,W:0,E:0,R:0} Q=2&gt;1 ✗</text>

  <!-- Divider -->
  <path d="M 40 380 L 520 380" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Result box -->
  <rect x="80" y="396" width="400" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="420" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">最终答案：ans = 2</text>
  <text x="280" y="440" text-anchor="middle" font-size="11" fill="#555">替换 "QQ" → "ER"，得到 "ERQW" ✓</text>

  <!-- Legend -->
  <rect x="80" y="460" width="16" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="102" y="473" font-size="10" fill="#555">窗口内</text>
  <rect x="160" y="460" width="16" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="182" y="473" font-size="10" fill="#555">窗口外</text>
  <rect x="240" y="460" width="16" height="16" fill="#ddd" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="262" y="473" font-size="10" fill="#555">已移出</text>
</svg>
