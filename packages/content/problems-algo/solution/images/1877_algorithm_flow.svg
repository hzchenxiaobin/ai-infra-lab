<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：排序 + 首尾双指针</text>

  <!-- Step 1: sort -->
  <rect x="140" y="44" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① 将 nums 升序排序</text>
  <text x="260" y="78" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">sort(nums)   // 升序</text>
  <path d="M 260 84 L 260 100" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: init pointers -->
  <rect x="130" y="100" width="260" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="118" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② 初始化双指针</text>
  <text x="260" y="134" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">i = 0,  j = n−1,  ans = 0</text>
  <path d="M 260 140 L 260 156" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond: i < j ? -->
  <path d="M 260 160 L 340 196 L 260 232 L 180 196 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="200" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">i &lt; j ?</text>

  <!-- Yes branch: right -->
  <path d="M 340 196 L 376 196" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="358" y="190" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- processing box -->
  <rect x="376" y="172" width="130" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="441" y="190" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">ans = max(ans,</text>
  <text x="441" y="204" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">nums[i]+nums[j])</text>
  <text x="441" y="218" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">i++;  j−−</text>

  <!-- loop back arrow: from box top up, left, down to diamond top -->
  <path d="M 441 172 L 441 150 L 260 150 L 260 160" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="350" y="146" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">循环</text>

  <!-- No branch: down -->
  <path d="M 260 232 L 260 252" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="246" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- Step 3: return ans -->
  <rect x="160" y="252" width="200" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="276" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">③ return ans</text>

  <!-- loop detail box -->
  <rect x="80" y="302" width="360" height="40" fill="#fafafa" stroke="#999" stroke-width="1" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="260" y="320" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">// nums[i] 最小配 nums[j] 最大 → 数对和均衡</text>
  <text x="260" y="335" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">// 维护所有数对和的最大值</text>

  <!-- complexity note -->
  <rect x="80" y="352" width="360" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="370" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">复杂度：O(n log n) / O(log n)</text>
  <text x="260" y="385" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">排序主导；值域有界时可计数排序到 O(n)</text>
</svg>
