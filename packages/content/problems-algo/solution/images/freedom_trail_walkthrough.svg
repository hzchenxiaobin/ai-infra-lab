<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#4a7a3a" stroke-width="1.8"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：ring="godding", key="gd"（n=7）</text>

  <!-- Stage labels -->
  <text x="85" y="48" text-anchor="middle" font-size="11" fill="#888">起点</text>
  <text x="245" y="48" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">① 拼 'g'（key[0]）</text>
  <text x="435" y="48" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">② 拼 'd'（key[1]）</text>

  <!-- Start node -->
  <rect x="30" y="140" width="110" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="85" y="162" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">指针 @ pos0</text>
  <text x="85" y="180" text-anchor="middle" font-size="10" fill="#666">累计 0</text>

  <!-- g@0 node (optimal branch) -->
  <rect x="180" y="74" width="130" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="8" filter="url(#rough2)"/>
  <text x="245" y="96" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">对齐 g @ pos0</text>
  <text x="245" y="114" text-anchor="middle" font-size="10" fill="#4a7a3a">旋转 0 + 按 1 = 1</text>
  <text x="245" y="125" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">累计 1 ✓</text>

  <!-- g@6 node -->
  <rect x="180" y="208" width="130" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="245" y="230" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">对齐 g @ pos6</text>
  <text x="245" y="248" text-anchor="middle" font-size="10" fill="#d6a040">旋转 1 + 按 1 = 2</text>
  <text x="245" y="259" text-anchor="middle" font-size="10" fill="#666">累计 2</text>

  <!-- d@2 from g@0 (optimal leaf) -->
  <rect x="370" y="34" width="132" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="8" filter="url(#rough2)"/>
  <text x="436" y="55" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">对齐 d @ pos2</text>
  <text x="436" y="72" text-anchor="middle" font-size="10" fill="#4a7a3a">旋转 2 + 按 1 = 3</text>
  <text x="436" y="85" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">累计 1+3=4 ⭐</text>

  <!-- d@3 from g@0 -->
  <rect x="370" y="114" width="132" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="436" y="135" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">对齐 d @ pos3</text>
  <text x="436" y="152" text-anchor="middle" font-size="10" fill="#d6a040">旋转 3 + 按 1 = 4</text>
  <text x="436" y="165" text-anchor="middle" font-size="10" fill="#666">累计 1+4=5</text>

  <!-- d@2 from g@6 -->
  <rect x="370" y="204" width="132" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="436" y="225" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">对齐 d @ pos2</text>
  <text x="436" y="242" text-anchor="middle" font-size="10" fill="#d6a040">旋转 3 + 按 1 = 4</text>
  <text x="436" y="255" text-anchor="middle" font-size="10" fill="#666">累计 2+4=6</text>

  <!-- d@3 from g@6 -->
  <rect x="370" y="284" width="132" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="436" y="305" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">对齐 d @ pos3</text>
  <text x="436" y="322" text-anchor="middle" font-size="10" fill="#d6a040">旋转 3 + 按 1 = 4</text>
  <text x="436" y="335" text-anchor="middle" font-size="10" fill="#666">累计 2+4=6</text>

  <!-- Edges: start -> g@0 (optimal, thick green) -->
  <path d="M 140 160 C 160 150, 165 120, 180 101" fill="none" stroke="#4a7a3a" stroke-width="2.4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="152" y="128" font-size="10" fill="#4a7a3a" font-weight="bold">dist=0</text>

  <!-- Edges: start -> g@6 -->
  <path d="M 140 172 C 160 185, 165 215, 180 235" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="148" y="218" font-size="10" fill="#d6a040">dist=1（逆）</text>

  <!-- Edges: g@0 -> d@2 (optimal, thick green) -->
  <path d="M 310 95 C 340 80, 345 70, 370 62" fill="none" stroke="#4a7a3a" stroke-width="2.4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="328" y="68" font-size="10" fill="#4a7a3a" font-weight="bold">dist=2</text>

  <!-- Edges: g@0 -> d@3 -->
  <path d="M 310 110 C 340 120, 345 130, 370 142" fill="none" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="138" font-size="10" fill="#d6a040">dist=3</text>

  <!-- Edges: g@6 -> d@2 -->
  <path d="M 310 225 C 340 225, 345 230, 370 232" fill="none" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="220" font-size="10" fill="#d6a040">dist=3</text>

  <!-- Edges: g@6 -> d@3 -->
  <path d="M 310 250 C 340 270, 345 280, 370 312" fill="none" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="328" y="290" font-size="10" fill="#d6a040">dist=3</text>

  <!-- Answer banner -->
  <rect x="30" y="338" width="340" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="200" y="351" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">最优路径：pos0 → pos0 → pos2，总步数 = 4</text>
</svg>
