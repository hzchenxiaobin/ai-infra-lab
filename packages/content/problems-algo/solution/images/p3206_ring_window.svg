<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">环形瓷砖 colors = [0,1,0,0,1]（0=红，1=蓝）</text>

  <!-- 环 -->
  <circle cx="160" cy="205" r="95" fill="none" stroke="#aaa" stroke-width="1.5" stroke-dasharray="6 5" filter="url(#rough2)"/>
  <text x="160" y="198" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">n = 5</text>
  <text x="160" y="215" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">首尾相接</text>

  <!-- 瓷砖 i=2 红（普通） -->
  <circle cx="216" cy="282" r="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="216" y="281" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="216" y="295" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">下标2</text>

  <!-- 瓷砖 i=3 红（普通） -->
  <circle cx="104" cy="282" r="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="104" y="281" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="104" y="295" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">下标3</text>

  <!-- 瓷砖 i=4 蓝（左邻居，高亮） -->
  <circle cx="70" cy="176" r="24" fill="#e8f0fe" stroke="#d6a040" stroke-width="3.5" filter="url(#rough2)"/>
  <text x="70" y="175" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="70" y="189" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">下标4</text>

  <!-- 瓷砖 i=0 红（中间，高亮） -->
  <circle cx="160" cy="110" r="24" fill="#fce4ec" stroke="#d6a040" stroke-width="3.5" filter="url(#rough2)"/>
  <text x="160" y="109" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="160" y="123" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">下标0</text>

  <!-- 瓷砖 i=1 蓝（右邻居，高亮） -->
  <circle cx="250" cy="176" r="24" fill="#e8f0fe" stroke="#d6a040" stroke-width="3.5" filter="url(#rough2)"/>
  <text x="250" y="175" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="250" y="189" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">下标1</text>

  <!-- 标注 -->
  <text x="160" y="52" text-anchor="middle" font-size="12" fill="#a06a10" font-weight="bold" filter="url(#rough2)">以 i=0 为中间</text>
  <path d="M160,58 L160,80" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="48" y="136" text-anchor="middle" font-size="12" fill="#a06a10" font-weight="bold" filter="url(#rough2)">左邻居</text>
  <path d="M58,143 L66,156" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="272" y="136" text-anchor="middle" font-size="12" fill="#a06a10" font-weight="bold" filter="url(#rough2)">右邻居</text>
  <path d="M262,143 L255,156" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="160" y="346" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">环：colors[4] 与 colors[0] 相邻（首尾就是邻居）</text>

  <!-- 框 A：取模 -->
  <rect x="305" y="55" width="200" height="92" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="405" y="77" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">环形邻居 = 下标取模</text>
  <text x="405" y="100" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">left = colors[(i−1+n) % n]</text>
  <text x="405" y="119" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">right = colors[(i+1) % n]</text>
  <text x="405" y="138" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（+n：防负数取模）</text>

  <!-- 框 B：两色化简 -->
  <rect x="305" y="158" width="200" height="82" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="405" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">只有 2 种颜色 ⇒</text>
  <text x="405" y="201" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">左 ≠ 中 且 右 ≠ 中</text>
  <text x="405" y="220" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">⟺ 左 = 右 ≠ 中</text>
  <text x="405" y="234" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（两侧被迫同色）</text>

  <!-- 框 C：判定示例 -->
  <rect x="305" y="250" width="200" height="92" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="405" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">判定示例（i = 0 为中间）</text>
  <text x="405" y="293" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">左 colors[4]=1 蓝，中 colors[0]=0 红</text>
  <text x="405" y="311" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">右 colors[1]=1 蓝</text>
  <text x="405" y="333" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">⇒ 交替组 ✓</text>
</svg>
