<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">BST 前序序列化：无需 null 标记，值域上下界即可重建</text>

  <!-- ===== 左侧：原 BST ===== -->
  <text x="110" y="56" text-anchor="middle" font-size="12" fill="#888">原 BST</text>
  <g filter="url(#rough2)">
    <!-- root 5 -->
    <circle cx="110" cy="82" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="110" y="87" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">5</text>
    <!-- 2 -->
    <circle cx="70" cy="140" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="70" y="145" text-anchor="middle" font-size="11" fill="#446688">2</text>
    <line x1="98" y1="94" x2="78" y2="128" stroke="#446688" stroke-width="1.2"/>
    <!-- 7 -->
    <circle cx="150" cy="140" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="150" y="145" text-anchor="middle" font-size="11" fill="#446688">7</text>
    <line x1="122" y1="94" x2="142" y2="128" stroke="#446688" stroke-width="1.2"/>
    <!-- 1 -->
    <circle cx="48" cy="196" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="48" y="201" text-anchor="middle" font-size="10" fill="#446688">1</text>
    <line x1="62" y1="152" x2="52" y2="184" stroke="#446688" stroke-width="1.1"/>
    <!-- 6 -->
    <circle cx="128" cy="196" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="128" y="201" text-anchor="middle" font-size="10" fill="#446688">6</text>
    <line x1="142" y1="152" x2="132" y2="184" stroke="#446688" stroke-width="1.1"/>
    <!-- 8 -->
    <circle cx="172" cy="196" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="172" y="201" text-anchor="middle" font-size="10" fill="#446688">8</text>
    <line x1="158" y1="152" x2="168" y2="184" stroke="#446688" stroke-width="1.1"/>
  </g>

  <!-- 箭头：前序遍历 -->
  <path d="M 200 140 L 250 140" stroke="#82b366" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="225" y="132" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">前序遍历</text>
  <text x="225" y="148" text-anchor="middle" font-size="9" fill="#4a7a3a">只存值</text>

  <!-- ===== 中间：序列 ===== -->
  <text x="330" y="56" text-anchor="middle" font-size="12" fill="#888">序列化字符串</text>
  <rect x="255" y="68" width="150" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="330" y="90" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">5,2,1,7,6,8</text>
  <text x="330" y="108" text-anchor="middle" font-size="10" fill="#888">无 # 标记，更紧凑</text>

  <!-- 对比 297 -->
  <rect x="255" y="128" width="150" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="330" y="144" text-anchor="middle" font-size="9" fill="#b85450">对比 297 普通二叉树：</text>
  <text x="330" y="156" text-anchor="middle" font-size="9" fill="#b85450" font-family="monospace">5,2,#,#,1,#,#,7,6...（需 #）</text>

  <!-- 箭头到重建 -->
  <path d="M 330 162 L 330 190" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== 右下：重建靠上下界 ===== -->
  <rect x="250" y="194" width="160" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="330" y="212" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">反序列化：按值域重建</text>
  <text x="330" y="228" text-anchor="middle" font-size="9" fill="#555">peek 下一个值 ∈ (min,max)？</text>

  <!-- 重建出的树 -->
  <text x="430" y="56" text-anchor="middle" font-size="12" fill="#888">重建 BST（相同）</text>
  <g filter="url(#rough2)">
    <circle cx="470" cy="82" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="470" y="87" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">5</text>
    <circle cx="430" cy="140" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="430" y="145" text-anchor="middle" font-size="11" fill="#4a7a3a">2</text>
    <line x1="458" y1="94" x2="438" y2="128" stroke="#4a7a3a" stroke-width="1.2"/>
    <circle cx="510" cy="140" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="510" y="145" text-anchor="middle" font-size="11" fill="#4a7a3a">7</text>
    <line x1="482" y1="94" x2="502" y2="128" stroke="#4a7a3a" stroke-width="1.2"/>
    <circle cx="408" cy="196" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="408" y="201" text-anchor="middle" font-size="10" fill="#4a7a3a">1</text>
    <line x1="422" y1="152" x2="412" y2="184" stroke="#4a7a3a" stroke-width="1.1"/>
    <circle cx="488" cy="196" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="488" y="201" text-anchor="middle" font-size="10" fill="#4a7a3a">6</text>
    <line x1="502" y1="152" x2="492" y2="184" stroke="#4a7a3a" stroke-width="1.1"/>
    <circle cx="532" cy="196" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="532" y="201" text-anchor="middle" font-size="10" fill="#4a7a3a">8</text>
    <line x1="518" y1="152" x2="528" y2="184" stroke="#4a7a3a" stroke-width="1.1"/>
  </g>

  <!-- 底部要点 -->
  <rect x="40" y="260" width="500" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="290" y="282" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">为什么 BST 不需要 null 标记？</text>
  <text x="60" y="304" font-size="10" fill="#555">① 前序首值 = 根；BST 性质给出：左子树值 &lt; 根 &lt; 右子树值</text>
  <text x="60" y="322" font-size="10" fill="#555">② 反序列化时维护 (min, max) 开区间，peek 下一个值是否落在区间内</text>
  <text x="60" y="340" font-size="10" fill="#555">③ 落入 → 消费为当前子树根，递归左右；不落入 → 该子树为空，返回 null</text>
  <text x="60" y="356" font-size="10" fill="#b85450" font-weight="bold">空子树的边界由"值不在区间内"隐式确定 → 省掉所有 # 标记</text>
</svg>
