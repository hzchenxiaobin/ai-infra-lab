<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 516"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="516" fill="#fafafa"/>

  <g filter="url(#rough2)">
    <text x="260" y="16" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">算法流程：n+1 种情形逐一打分，score 一次线性扫描</text>

    <!-- step 1 -->
    <rect x="36" y="30" width="232" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="152" y="48" text-anchor="middle" font-size="11" fill="#333">① ans ← score(nums)</text>
    <text x="152" y="64" text-anchor="middle" font-size="8.5" fill="#666666">先试「不删除」的情形</text>
    <path d="M 152 72 V 84" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>

    <!-- step 2 -->
    <rect x="36" y="88" width="232" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="152" y="106" text-anchor="middle" font-size="11" fill="#333">② 枚举删除位置 j = 0 … n−1</text>
    <text x="152" y="122" text-anchor="middle" font-size="8.5" fill="#666666">按位置枚举，不按值去重</text>
    <path d="M 152 130 V 142" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>

    <!-- per-j loop container -->
    <rect x="30" y="146" width="244" height="98" rx="10" fill="none" stroke="#446688" stroke-width="1.2" stroke-dasharray="6 4"/>
    <rect x="40" y="152" width="224" height="24" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="152" y="168" text-anchor="middle" font-size="10" fill="#333">arr = nums 去掉下标 j</text>
    <rect x="40" y="182" width="224" height="24" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="152" y="198" text-anchor="middle" font-size="10" fill="#333">cnt = score(arr) —— 见右图</text>
    <rect x="40" y="212" width="224" height="24" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="152" y="228" text-anchor="middle" font-size="10" fill="#333">ans = max(ans, cnt)</text>

    <!-- loop back -->
    <path d="M 30 195 H 18 V 109 H 34" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)"/>
    <text x="10" y="152" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" transform="rotate(-90 10 152)">下一个 j</text>

    <!-- exit -->
    <path d="M 152 244 V 258" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>
    <text x="163" y="256" font-size="9" fill="#666666">枚举完</text>

    <!-- step 3 -->
    <rect x="36" y="262" width="232" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="152" y="280" text-anchor="middle" font-size="11.5" fill="#2f5527" font-weight="bold">③ return ans</text>
    <text x="152" y="296" text-anchor="middle" font-size="8.5" fill="#4a7a3a">n+1 种情形的最大得分</text>

    <!-- call arrow -->
    <path d="M 274 195 H 292" stroke="#446688" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)" fill="none"/>
    <text x="283" y="188" text-anchor="middle" font-size="8.5" fill="#446688">调用</text>

    <!-- score subroutine -->
    <rect x="296" y="30" width="208" height="230" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="400" y="52" text-anchor="middle" font-size="11.5" fill="#2f5527" font-weight="bold">score(arr)：一次线性扫描</text>
    <text x="308" y="76" font-size="10" fill="#333333">① 从右往左建后缀 gcd 数组</text>
    <text x="308" y="92" font-size="9" fill="#1a3a5c">suf[m] = 0</text>
    <text x="308" y="106" font-size="9" fill="#1a3a5c">suf[i] = gcd(suf[i+1], arr[i])</text>
    <text x="308" y="120" font-size="8.5" fill="#557">哨兵 gcd(0, x) = x，免特判</text>
    <text x="308" y="144" font-size="10" fill="#333333">② 从左往右增量维护前缀 gcd</text>
    <text x="308" y="160" font-size="9" fill="#1a3a5c">pre = gcd(pre, arr[i])，i ≤ m−2</text>
    <text x="308" y="174" font-size="8.5" fill="#557">i 只到 m−2：右侧至少留 1 个元素</text>
    <text x="308" y="198" font-size="10" fill="#333333">③ 若 pre == suf[i+1]：cnt++</text>
    <text x="308" y="212" font-size="8.5" fill="#557">（两侧相等 ⇔ 都等于全局 g）</text>
    <rect x="336" y="224" width="128" height="24" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="400" y="240" text-anchor="middle" font-size="10" fill="#2f5527" font-weight="bold">return cnt</text>

    <!-- complexity -->
    <rect x="36" y="316" width="468" height="64" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="56" y="338" font-size="11" fill="#8a6d1f" font-weight="bold">复杂度</text>
    <text x="56" y="356" font-size="9.5" fill="#7a5c1a">时间：(n+1) 种情形 × O(n) 线性扫描 = O(n²) ≈ 2×10⁶ 次 gcd，n ≤ 1000 轻松通过</text>
    <text x="56" y="372" font-size="9.5" fill="#7a5c1a">空间：O(n)（后缀 gcd 数组；score 里跳过下标 j 可省去建 arr 的拷贝）</text>

    <!-- pitfalls -->
    <rect x="36" y="392" width="468" height="112" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="270" y="412" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">四个免踩的坑</text>
    <text x="54" y="432" font-size="9.5" fill="#8a3a35">① 别忘「不删除」的情形 —— 例 2 的最优解恰是什么都不删</text>
    <text x="54" y="452" font-size="9.5" fill="#8a3a35">② 哨兵 gcd(0, x) = x：后缀数组 suf[m] = 0 起步，前缀 pre = 0 起步</text>
    <text x="54" y="472" font-size="9.5" fill="#8a3a35">③ 分割位置只到 m−2；长度 1 的 arr（n=2 删除后）没有任何分割位置</text>
    <text x="54" y="492" font-size="9.5" fill="#8a3a35">④ 按位置枚举而非按值去重：[10,30,15,10] 删第一个 10 与删最后一个 10 结果不同</text>
  </g>
</svg>
