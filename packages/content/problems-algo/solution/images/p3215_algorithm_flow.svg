<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：三次线性扫描分桶 + 四项乘积求和</text>

  <!-- 开始 -->
  <rect x="170" y="42" width="180" height="26" rx="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="59" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">输入 a, b, c</text>
  <path d="M260,68 L260,90" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 扫描 -->
  <rect x="150" y="92" width="220" height="26" rx="4" fill="#fff" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="260" y="109" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">依次扫描三个数组的每个元素 x</text>
  <path d="M260,118 L260,138" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="260,140 348,170 260,200 172,170" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="165" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">popcount(x)</text>
  <text x="260" y="180" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">为奇？</text>

  <!-- 左分支：是 → 奇桶 -->
  <text x="160" y="160" text-anchor="end" font-size="10.5" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M172,170 L144,170" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="44" y="156" width="96" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="92" y="174" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">奇桶 Oₖ++</text>

  <!-- 右分支：否 → 偶桶 -->
  <text x="360" y="160" text-anchor="start" font-size="10.5" fill="#446688" filter="url(#rough2)">否</text>
  <path d="M348,170 L376,170" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="380" y="156" width="96" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="428" y="174" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">偶桶 Eₖ++</text>

  <!-- 汇合 -->
  <path d="M92,184 L180,210" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M428,184 L340,210" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150" y="212" width="220" height="28" rx="4" fill="#fff" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="260" y="230" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">得 (Ea,Oa) (Eb,Ob) (Ec,Oc)</text>
  <path d="M260,240 L260,256" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 四项求和 -->
  <rect x="52" y="258" width="416" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="279" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">ans = Ea·Eb·Ec + Oa·Ob·Ec + Oa·Eb·Oc + Ea·Ob·Oc</text>
  <path d="M260,292 L260,306" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结束 -->
  <rect x="170" y="308" width="180" height="26" rx="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="325" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">返回 ans（long long）</text>

  <!-- 右上注释框 -->
  <rect x="368" y="40" width="140" height="72" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="438" y="58" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">信息压缩</text>
  <text x="438" y="74" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">每个元素只留 1 bit：</text>
  <text x="438" y="88" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">popcount 的奇偶</text>
  <text x="438" y="104" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">10⁵ 个数 → 6 个计数</text>

  <text x="260" y="352" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">时间 O(n·log v)，空间 O(1)，全程无排序无哈希</text>
</svg>
