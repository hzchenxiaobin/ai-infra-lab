<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心思路：用 order 作模板，计数后按序拼装</text>

  <!-- order string -->
  <text x="40" y="62" font-size="12" fill="#888">order (模板):</text>
  <rect x="120" y="46" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="66" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">c</text>
  <text x="166" y="66" font-size="11" fill="#888">→</text>
  <rect x="182" y="46" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="66" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>
  <text x="228" y="66" font-size="11" fill="#888">→</text>
  <rect x="244" y="46" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="264" y="66" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <text x="300" y="66" font-size="11" fill="#888">(自定义优先级 c&gt;b&gt;a)</text>

  <!-- s string -->
  <text x="40" y="108" font-size="12" fill="#888">s (待排):</text>
  <rect x="120" y="92" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="138" y="111" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="158" y="92" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="176" y="111" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="196" y="92" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="214" y="111" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>
  <rect x="234" y="92" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="252" y="111" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">d</text>
  <text x="285" y="111" font-size="11" fill="#b85450">d 不在 order 中</text>

  <!-- Step 1: count -->
  <text x="40" y="152" font-size="12" fill="#888">① 计数 freq:</text>
  <rect x="120" y="136" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="146" y="155" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">c:1</text>
  <rect x="176" y="136" width="52" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="155" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b:1</text>
  <rect x="232" y="136" width="52" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="258" y="155" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a:1</text>
  <rect x="288" y="136" width="52" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="314" y="155" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">d:1</text>

  <!-- arrow down -->
  <path d="M 280 176 L 280 192" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="188" font-size="11" fill="#d6a040">按 order 顺序消费</text>

  <!-- Step 2: reconstruct -->
  <text x="40" y="216" font-size="12" fill="#888">② 按序拼装:</text>
  <rect x="120" y="200" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="142" y="219" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>
  <text x="170" y="219" font-size="11" fill="#888">+</text>
  <rect x="182" y="200" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="204" y="219" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <text x="232" y="219" font-size="11" fill="#888">+</text>
  <rect x="244" y="200" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="266" y="219" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <text x="296" y="219" font-size="11" fill="#4a7a3a">= "cba"</text>

  <!-- Step 3: append remaining -->
  <text x="40" y="266" font-size="12" fill="#888">③ 追加剩余:</text>
  <rect x="120" y="250" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="142" y="269" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">d</text>
  <text x="180" y="269" font-size="11" fill="#888">(不在 order 的字符放末尾)</text>

  <!-- Result -->
  <path d="M 280 290 L 280 308" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="40" y="328" font-size="12" fill="#888">结果:</text>
  <rect x="120" y="312" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="140" y="332" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">c</text>
  <rect x="162" y="312" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="182" y="332" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>
  <rect x="204" y="312" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="224" y="332" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="246" y="312" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="266" y="332" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">d</text>
  <text x="300" y="332" font-size="13" fill="#4a7a3a" font-weight="bold">= "cbad" ✓</text>

  <!-- core idea box -->
  <rect x="40" y="350" width="480" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="367" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">两遍扫描：先按 order 顺序消费计数，再把剩余字符一次性追加</text>
</svg>
