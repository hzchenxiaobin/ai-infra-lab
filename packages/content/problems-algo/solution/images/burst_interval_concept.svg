<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">反向思考：不想「先戳谁」，而是想「最后戳谁」</text>

  <!-- ===== val array (padded) : [1, 3, 1, 5, 8, 1] ===== -->
  <text x="40" y="78" font-size="12" fill="#888">val（两端补 1）:</text>

  <!-- index 0: val=1  (left pad) -->
  <rect x="96" y="60" width="48" height="40" fill="#eeeeee" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="86" text-anchor="middle" font-size="14" fill="#777" font-weight="bold">1</text>
  <!-- index 1: val=3  boundary i -->
  <rect x="146" y="60" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="86" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <!-- index 2: val=1  inside left sub -->
  <rect x="196" y="60" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="86" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <!-- index 3: val=5  k : last popped -->
  <rect x="246" y="58" width="48" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="86" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <!-- index 4: val=8  boundary j -->
  <rect x="296" y="60" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="86" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">8</text>
  <!-- index 5: val=1  (right pad) -->
  <rect x="346" y="60" width="48" height="40" fill="#eeeeee" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="86" text-anchor="middle" font-size="14" fill="#777" font-weight="bold">1</text>

  <!-- indices -->
  <text x="120" y="118" text-anchor="middle" font-size="10" fill="#aaa">0</text>
  <text x="170" y="118" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">i=1</text>
  <text x="220" y="118" text-anchor="middle" font-size="10" fill="#aaa">2</text>
  <text x="270" y="118" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">k=3</text>
  <text x="320" y="118" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">j=4</text>
  <text x="370" y="118" text-anchor="middle" font-size="10" fill="#aaa">5</text>

  <!-- boundary / k labels above -->
  <text x="170" y="52" text-anchor="middle" font-size="10" fill="#446688">边界(不戳)</text>
  <text x="270" y="50" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">最后戳</text>
  <text x="320" y="52" text-anchor="middle" font-size="10" fill="#446688">边界(不戳)</text>

  <!-- brackets showing sub-intervals (i,k) and (k,j) -->
  <path d="M 170 132 L 170 140 L 270 140 L 270 132" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="220" y="156" text-anchor="middle" font-size="11" fill="#4a7a3a">子问题 (i, k) = (1, 3)</text>
  <path d="M 270 132 L 270 140 L 320 140 L 320 132" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="295" y="156" text-anchor="middle" font-size="10" fill="#4a7a3a">(k, j) 空</text>

  <!-- arrow down -->
  <path d="M 280 168 L 280 188" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- contribution box : val[i]*val[k]*val[j] -->
  <rect x="120" y="192" width="320" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="214" text-anchor="middle" font-size="12" fill="#444">戳 k 时，中间已空 → 左右邻居就是边界 i、j</text>
  <text x="280" y="236" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">coins = val[i] · val[k] · val[j] = 3 · 5 · 8 = 120</text>

  <!-- arrow down -->
  <path d="M 280 248 L 280 268" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- split into two independent subproblems -->
  <rect x="70" y="272" width="220" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="180" y="290" text-anchor="middle" font-size="11" fill="#333">左子问题 dp[i][k]</text>
  <text x="180" y="306" text-anchor="middle" font-size="10" fill="#666">区间 (1,3) 内独立求最大</text>

  <rect x="310" y="272" width="220" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="420" y="290" text-anchor="middle" font-size="11" fill="#333">右子问题 dp[k][j]</text>
  <text x="420" y="306" text-anchor="middle" font-size="10" fill="#666">区间 (3,4) 内独立求最大</text>

  <!-- formula box -->
  <rect x="70" y="330" width="460" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="300" y="354" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">状态转移（区间 DP）</text>
  <text x="300" y="378" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">dp[i][j] = max&#123; dp[i][k] + dp[k][j] + val[i]·val[k]·val[j] &#125;</text>
  <text x="300" y="392" text-anchor="middle" font-size="10" fill="#888">枚举区间内「最后戳」的气球 k，拆成两个独立子区间</text>
</svg>
