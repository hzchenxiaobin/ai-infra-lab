<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M 0 0 L 4 8 L 8 0 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M 0 0 L 4 8 L 8 0 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：可行性检验 → 计数检验 → 行/列错位取最小交换</text>

  <!-- step 1: feasibility -->
  <rect x="30" y="46" width="480" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="46" y="68" font-size="12" fill="#446688" font-weight="bold">① 可行性检验：行/列是否仅两类互补</text>
  <text x="46" y="86" font-size="11" fill="#333">对所有 i, j 检查：board[0][0] ^ board[0][j] ^ board[i][0] ^ board[i][j] == 0</text>
  <text x="46" y="104" font-size="11" fill="#b85450" font-weight="bold">不满足 → 返回 -1</text>

  <path d="M 270 120 L 270 138" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 2: count check -->
  <rect x="30" y="142" width="480" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="46" y="164" font-size="12" fill="#d6a040" font-weight="bold">② 计数检验：两类行的数量须均衡</text>
  <text x="46" y="182" font-size="11" fill="#333">rowCnt = 行模式 A 的数量；colCnt = 列模式 B 的数量</text>
  <text x="46" y="200" font-size="11" fill="#333">n 偶：rowCnt == colCnt == n/2</text>
  <text x="46" y="216" font-size="11" fill="#333">n 奇：rowCnt、colCnt ∈ { ⌊n/2⌋, ⌈n/2⌉ }（多者居偶数位）</text>
  <text x="430" y="216" font-size="11" fill="#b85450" font-weight="bold">否则 -1</text>

  <path d="M 270 232 L 270 250" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 3: row swap -->
  <rect x="30" y="254" width="230" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="46" y="276" font-size="12" fill="#4a7a3a" font-weight="bold">③ 行交换次数</text>
  <text x="46" y="294" font-size="10.5" fill="#333">统计偶数位上「错位」行数 rowSwap</text>
  <text x="46" y="310" font-size="10.5" fill="#333">n 偶：min(rowSwap, n/2 − rowSwap)</text>
  <text x="46" y="326" font-size="10.5" fill="#333">n 奇：多数模式居偶位，仅一解</text>
  <text x="46" y="342" font-size="10.5" fill="#888">每次交换修复两个错位 → 交换数=错位数</text>

  <!-- step 4: col swap -->
  <rect x="280" y="254" width="230" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="296" y="276" font-size="12" fill="#4a7a3a" font-weight="bold">④ 列交换次数</text>
  <text x="296" y="294" font-size="10.5" fill="#333">统计偶数位上「错位」列数 colSwap</text>
  <text x="296" y="310" font-size="10.5" fill="#333">n 偶：min(colSwap, n/2 − colSwap)</text>
  <text x="296" y="326" font-size="10.5" fill="#333">n 奇：多数模式居偶位，仅一解</text>
  <text x="296" y="342" font-size="10.5" fill="#888">行列独立，可分别计算</text>

  <path d="M 270 356 L 270 374" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="30" y="378" width="480" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="404" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">⑤ 返回 rowSwap + colSwap（最小总交换次数）</text>

  <!-- note -->
  <rect x="30" y="424" width="480" height="12" fill="#fafafa" stroke="none"/>
</svg>
