<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="560" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">区间子数组个数：单遍扫描流程</text>

  <!-- Start node -->
  <ellipse cx="280" cy="62" rx="120" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#333">开始: lastInvalid=−1, lastValid=−1, ans=0</text>

  <!-- arrow down to diamond B -->
  <path d="M 280 82 L 280 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond B: i < n ? -->
  <polygon points="280,104 374,150 280,196 186,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="146" text-anchor="middle" font-size="12" fill="#333">i &lt; n ?</text>
  <text x="280" y="162" text-anchor="middle" font-size="10" fill="#888">(遍历右端点)</text>

  <!-- B: No -> return ans -->
  <path d="M 374 150 L 446 150" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="142" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="486" cy="150" rx="50" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="486" y="154" text-anchor="middle" font-size="12" fill="#333">返回 ans</text>

  <!-- B: Yes -> down -->
  <path d="M 280 196 L 280 214" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="210" font-size="11" fill="#82b366">是</text>

  <!-- Diamond C: nums[i] > right ? -->
  <polygon points="280,218 388,264 280,310 172,264" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="260" text-anchor="middle" font-size="12" fill="#333">nums[i] &gt; right ?</text>
  <text x="280" y="276" text-anchor="middle" font-size="10" fill="#888">(是否为墙?)</text>

  <!-- C: Yes -> lastInvalid = i (left, red) -->
  <path d="M 172 264 L 118 264" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="152" y="256" text-anchor="middle" font-size="11" fill="#b85450">是</text>
  <rect x="20" y="244" width="98" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="69" y="269" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">lastInvalid = i</text>

  <!-- C: No -> down to Diamond D -->
  <path d="M 280 310 L 280 328" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="324" font-size="11" fill="#82b366">否</text>

  <!-- Diamond D: nums[i] >= left ? -->
  <polygon points="280,332 388,378 280,424 172,378" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="374" text-anchor="middle" font-size="12" fill="#333">nums[i] ≥ left ?</text>
  <text x="280" y="390" text-anchor="middle" font-size="10" fill="#888">(在区间内?)</text>

  <!-- D: Yes -> lastValid = i (right, green) -->
  <path d="M 388 378 L 442 378" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="416" y="370" text-anchor="middle" font-size="11" fill="#82b366">是</text>
  <rect x="442" y="358" width="98" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="491" y="383" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">lastValid = i</text>

  <!-- D: No -> nothing (nums[i] < left, neutral), down to merge -->
  <path d="M 280 424 L 280 448" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="440" font-size="11" fill="#888">否(&lt;left 略过)</text>

  <!-- merge arrows from lastInvalid box & lastValid box into the ans node -->
  <path d="M 69 284 L 69 470 L 176 470" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 491 398 L 491 470 L 384 470" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Process: ans += max(0, lastValid - lastInvalid) -->
  <rect x="176" y="452" width="208" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="475" text-anchor="middle" font-size="12" fill="#333">ans += max(0, lastValid − lastInvalid)</text>

  <!-- outer loop: ans box back up to diamond B (far left, dashed) -->
  <path d="M 176 470 L 10 470 L 10 150 L 186 150" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="10" y="310" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 10 310)">i++ 继续循环</text>
</svg>
