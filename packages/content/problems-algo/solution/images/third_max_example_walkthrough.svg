<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [2, 2, 3, 1] → 返回 1</text>

  <!-- table header -->
  <rect x="20" y="48" width="560" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="48" y="66" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">步骤</text>
  <text x="108" y="66" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">x</text>
  <text x="178" y="66" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">判重</text>
  <text x="270" y="66" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">区间 / 操作</text>
  <text x="376" y="66" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">a</text>
  <text x="430" y="66" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">b</text>
  <text x="484" y="66" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">c</text>
  <text x="548" y="66" text-anchor="middle" font-size="9.5" fill="#888">说明</text>

  <!-- column separators -->
  <path d="M 78 48 L 78 76 M 138 48 L 138 76 M 218 48 L 218 76 M 346 48 L 346 76 M 400 48 L 400 76 M 454 48 L 454 76 M 514 48 L 514 76" stroke="#ccc" stroke-width="1" fill="none"/>

  <!-- Row 0: init -->
  <rect x="20" y="78" width="560" height="32" fill="#fafafa" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="48" y="98" text-anchor="middle" font-size="10.5" fill="#888">初始</text>
  <text x="108" y="98" text-anchor="middle" font-size="10.5" fill="#888">—</text>
  <text x="178" y="98" text-anchor="middle" font-size="10.5" fill="#888">—</text>
  <text x="270" y="98" text-anchor="middle" font-size="10" fill="#888">哨兵初始化</text>
  <text x="376" y="98" text-anchor="middle" font-size="11" fill="#888">−∞</text>
  <text x="430" y="98" text-anchor="middle" font-size="11" fill="#888">−∞</text>
  <text x="484" y="98" text-anchor="middle" font-size="11" fill="#888">−∞</text>
  <text x="548" y="98" text-anchor="middle" font-size="9" fill="#888">三空</text>

  <!-- Row 1: x=2, x>a -->
  <rect x="20" y="112" width="560" height="32" fill="#fffceb" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="48" y="132" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">1</text>
  <text x="108" y="132" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="178" y="132" text-anchor="middle" font-size="10" fill="#4a7a3a">否</text>
  <text x="270" y="132" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">x &gt; a → 移位</text>
  <text x="376" y="132" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>
  <text x="430" y="132" text-anchor="middle" font-size="11" fill="#888">−∞</text>
  <text x="484" y="132" text-anchor="middle" font-size="11" fill="#888">−∞</text>
  <text x="548" y="132" text-anchor="middle" font-size="9" fill="#888">a=2</text>

  <!-- Row 2: x=2, dup -->
  <rect x="20" y="146" width="560" height="32" fill="#fce4ec" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="48" y="166" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">2</text>
  <text x="108" y="166" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="178" y="166" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是 (==a)</text>
  <text x="270" y="166" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">跳过</text>
  <text x="376" y="166" text-anchor="middle" font-size="11" fill="#d6a040">2</text>
  <text x="430" y="166" text-anchor="middle" font-size="11" fill="#888">−∞</text>
  <text x="484" y="166" text-anchor="middle" font-size="11" fill="#888">−∞</text>
  <text x="548" y="166" text-anchor="middle" font-size="9" fill="#b85450">⚠ 去重</text>

  <!-- Row 3: x=3, x>a -->
  <rect x="20" y="180" width="560" height="32" fill="#fffceb" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="48" y="200" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">3</text>
  <text x="108" y="200" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="178" y="200" text-anchor="middle" font-size="10" fill="#4a7a3a">否</text>
  <text x="270" y="200" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">x &gt; a → 移位</text>
  <text x="376" y="200" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3</text>
  <text x="430" y="200" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <text x="484" y="200" text-anchor="middle" font-size="11" fill="#888">−∞</text>
  <text x="548" y="200" text-anchor="middle" font-size="9" fill="#888">a↓b</text>

  <!-- Row 4: x=1, b>x>c -->
  <rect x="20" y="214" width="560" height="32" fill="#e8f5e9" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="48" y="234" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">4</text>
  <text x="108" y="234" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="178" y="234" text-anchor="middle" font-size="10" fill="#4a7a3a">否</text>
  <text x="270" y="234" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">b &gt; x &gt; c</text>
  <text x="376" y="234" text-anchor="middle" font-size="11" fill="#d6a040">3</text>
  <text x="430" y="234" text-anchor="middle" font-size="11" fill="#446688">2</text>
  <text x="484" y="234" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="548" y="234" text-anchor="middle" font-size="9" fill="#888">c=1</text>

  <!-- Row 5: collect -->
  <rect x="20" y="248" width="560" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="48" y="268" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">返回</text>
  <text x="108" y="268" text-anchor="middle" font-size="10.5" fill="#888">—</text>
  <text x="178" y="268" text-anchor="middle" font-size="10.5" fill="#888">—</text>
  <text x="270" y="268" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">c ≠ −∞</text>
  <text x="376" y="268" text-anchor="middle" font-size="11" fill="#d6a040">3</text>
  <text x="430" y="268" text-anchor="middle" font-size="11" fill="#446688">2</text>
  <text x="484" y="268" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="548" y="268" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">→ 返 c=1</text>

  <!-- footer explanation -->
  <rect x="20" y="298" width="560" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="32" y="316" font-size="11" fill="#d6a040" font-weight="bold">★ 三种分支各命中一次：</text>
  <text x="32" y="332" font-size="10.5" fill="#555">• 步骤1（x&gt;a）：x=2 大于哨兵 −∞，整体下移，a=2</text>
  <text x="32" y="346" font-size="10.5" fill="#555">• 步骤3（x&gt;a）：x=3 大于 a=2，a 下移到 b，a=3；步骤4（b&gt;x&gt;c）：x=1 落入 b、c 之间，仅替换 c</text>

  <!-- dup emphasis -->
  <rect x="20" y="370" width="560" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="32" y="388" font-size="11" fill="#b85450" font-weight="bold">⚠ 步骤2 是本题最易踩的坑：</text>
  <text x="32" y="404" font-size="10.5" fill="#555">若不判重，第二个 2 会触发 x&gt;b 把 b 也填成 2，最终 a=b=3, c=2，错算第三大为 2 而非 1</text>

  <!-- final result -->
  <rect x="20" y="424" width="560" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="14" filter="url(#rough2)"/>
  <text x="300" y="442" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">不同数字 {3, 2, 1} → 第三大为 1 ✓</text>
</svg>
