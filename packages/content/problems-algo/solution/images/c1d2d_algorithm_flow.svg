<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：长度校验 + 行主序填充</text>

  <!-- Step 1: check length -->
  <rect x="60" y="56" width="280" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="200" y="80" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">校验 original.length == m × n ?</text>
  <text x="200" y="100" text-anchor="middle" font-size="10" fill="#888">元素总数必须恰好填满 m 行 n 列</text>

  <!-- branch No -->
  <path d="M 120 116 L 120 146" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="92" y="136" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="40" y="150" width="170" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="125" y="172" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回空数组 []</text>
  <text x="125" y="186" text-anchor="middle" font-size="10" fill="#888">无法填满，提前终止</text>

  <!-- branch Yes -->
  <path d="M 280 116 L 280 146" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="136" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Step 2: create result -->
  <rect x="200" y="150" width="240" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="320" y="172" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">创建 m × n 二维数组 result</text>
  <text x="320" y="190" text-anchor="middle" font-size="10" fill="#888">预分配 m 行，每行 n 列</text>

  <path d="M 320 204 L 320 226" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: double loop -->
  <rect x="180" y="230" width="280" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="320" y="252" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">双重循环：for i in 0..m−1, j in 0..n−1</text>
  <text x="320" y="272" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">result[i][j] = original[i × n + j]</text>

  <!-- loop back arrow -->
  <path d="M 460 258 Q 500 258 500 200 Q 500 142 320 142 Q 320 142 320 230" stroke="#666" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="510" y="200" font-size="10" fill="#888" transform="rotate(90 510 200)">填满 m×n 个位置</text>

  <path d="M 320 290 L 320 312" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: return -->
  <rect x="180" y="316" width="280" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="320" y="338" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">遍历结束</text>
  <text x="320" y="356" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return result（m × n 二维数组）</text>

  <!-- side notes -->
  <rect x="60" y="384" width="480" height="62" fill="#fafafa" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3" rx="6" filter="url(#rough2)"/>
  <text x="80" y="406" font-size="11" fill="#666" font-weight="bold">要点：</text>
  <text x="80" y="424" font-size="10" fill="#555">• 长度校验必须在填充之前，避免越界或部分填充。</text>
  <text x="80" y="438" font-size="10" fill="#555">• 下标公式 i×n+j 是行主序展开，与题目"按行填充"语义一致，O(m×n) 一趟完成。</text>
</svg>
