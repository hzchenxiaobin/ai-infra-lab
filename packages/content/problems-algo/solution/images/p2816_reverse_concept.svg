<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="600" height="460" fill="#fdfcf7"/>

  <text x="300" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">翻倍链表：正序存储 → 反转对齐个位</text>
  <path d="M 180 40 Q 300 48 420 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Row 1: forward [1,8,9] -->
  <g filter="url(#sk)">
    <rect x="200" y="70" width="50" height="38" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="252" y="70" width="50" height="38" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="304" y="70" width="50" height="38" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="225" y="94" text-anchor="middle" font-size="16" fill="#2b6e9e">1</text>
  <text x="277" y="94" text-anchor="middle" font-size="16" fill="#2b6e9e">8</text>
  <text x="329" y="94" text-anchor="middle" font-size="16" fill="#2b6e9e">9</text>
  <text x="190" y="64" font-size="11" fill="#888">最高位 →</text>
  <text x="312" y="124" font-size="11" fill="#888">← 个位</text>
  <text x="80" y="93" font-size="12" font-weight="bold" fill="#2b6e9e">正序</text>
  <text x="80" y="108" font-size="11" fill="#888">头=最高位</text>
  <text x="380" y="93" font-size="13" fill="#555">= 189</text>

  <!-- arrow down: reverse -->
  <path d="M 300 138 L 300 168" stroke="#5a5a5a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="312" y="158" font-size="12" fill="#7a5415" font-weight="bold">reverse()</text>

  <!-- Row 2: reversed [9,8,1] -->
  <g filter="url(#sk)">
    <rect x="200" y="178" width="50" height="38" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="252" y="178" width="50" height="38" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="304" y="178" width="50" height="38" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="225" y="202" text-anchor="middle" font-size="16" fill="#2e6e2e">9</text>
  <text x="277" y="202" text-anchor="middle" font-size="16" fill="#2e6e2e">8</text>
  <text x="329" y="202" text-anchor="middle" font-size="16" fill="#2e6e2e">1</text>
  <text x="190" y="172" font-size="11" fill="#888">个位 →</text>
  <text x="312" y="232" font-size="11" fill="#888">← 最高位</text>
  <text x="80" y="201" font-size="12" font-weight="bold" fill="#2e6e2e">逆序</text>
  <text x="80" y="216" font-size="11" fill="#888">头=个位</text>

  <!-- arrow down: double -->
  <path d="M 300 246 L 300 276" stroke="#5a5a5a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="312" y="266" font-size="12" fill="#b85450" font-weight="bold">逐位 ×2 + carry</text>

  <!-- Row 3: doubling process per digit -->
  <g filter="url(#sk)">
    <rect x="186" y="286" width="86" height="40" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="276" y="286" width="86" height="40" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="366" y="286" width="86" height="40" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="229" y="303" text-anchor="middle" font-size="11" fill="#555" font-family="monospace">9×2+0=18</text>
  <text x="229" y="318" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" font-family="monospace">写8 进1</text>
  <text x="319" y="303" text-anchor="middle" font-size="11" fill="#555" font-family="monospace">8×2+1=17</text>
  <text x="319" y="318" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" font-family="monospace">写7 进1</text>
  <text x="409" y="303" text-anchor="middle" font-size="11" fill="#555" font-family="monospace">1×2+1=3</text>
  <text x="409" y="318" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" font-family="monospace">写3 进0</text>

  <!-- arrow down: reverse back -->
  <path d="M 300 338 L 300 368" stroke="#5a5a5a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="312" y="358" font-size="12" fill="#7a5415" font-weight="bold">reverse() 回来</text>

  <!-- Row 4: result [3,7,8] -->
  <g filter="url(#sk)">
    <rect x="200" y="378" width="50" height="38" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="252" y="378" width="50" height="38" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="304" y="378" width="50" height="38" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="225" y="402" text-anchor="middle" font-size="16" fill="#7a5415">3</text>
  <text x="277" y="402" text-anchor="middle" font-size="16" fill="#7a5415">7</text>
  <text x="329" y="402" text-anchor="middle" font-size="16" fill="#7a5415">8</text>
  <text x="80" y="401" font-size="12" font-weight="bold" fill="#7a5415">结果</text>
  <text x="375" y="401" font-size="13" fill="#555">= 378</text>

  <g filter="url(#sk)"><rect x="60" y="430" width="480" height="22" rx="6" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/></g>
  <text x="300" y="445" text-anchor="middle" font-size="11" fill="#7a5415">💡 正序存储时个位在尾部，反转后头变个位，即可像第 2 题那样从头逐位翻倍</text>
</svg>
