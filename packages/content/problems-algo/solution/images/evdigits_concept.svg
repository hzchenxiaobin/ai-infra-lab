<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">值域分段：1 ≤ x ≤ 10⁵ 的位数奇偶分布</text>

  <!-- Column headers -->
  <rect x="40" y="50" width="210" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="145" y="69" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">值域</text>
  <rect x="260" y="50" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="305" y="69" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">位数</text>
  <rect x="360" y="50" width="150" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="435" y="69" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">奇偶（是否计数）</text>

  <!-- Row 1: 1-9, 1位, 奇 -->
  <rect x="40" y="84" width="210" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="145" y="106" text-anchor="middle" font-size="13" fill="#333">1 – 9</text>
  <rect x="260" y="84" width="90" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="305" y="106" text-anchor="middle" font-size="13" fill="#333">1 位</text>
  <rect x="360" y="84" width="150" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="435" y="106" text-anchor="middle" font-size="13" fill="#b85450">奇 ✗</text>

  <!-- Row 2: 10-99, 2位, 偶 -->
  <rect x="40" y="122" width="210" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="145" y="144" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">10 – 99</text>
  <rect x="260" y="122" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="305" y="144" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2 位</text>
  <rect x="360" y="122" width="150" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="435" y="144" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">偶 ✓ 计数</text>

  <!-- Row 3: 100-999, 3位, 奇 -->
  <rect x="40" y="160" width="210" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="145" y="182" text-anchor="middle" font-size="13" fill="#333">100 – 999</text>
  <rect x="260" y="160" width="90" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="305" y="182" text-anchor="middle" font-size="13" fill="#333">3 位</text>
  <rect x="360" y="160" width="150" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="435" y="182" text-anchor="middle" font-size="13" fill="#b85450">奇 ✗</text>

  <!-- Row 4: 1000-9999, 4位, 偶 -->
  <rect x="40" y="198" width="210" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="145" y="220" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1000 – 9999</text>
  <rect x="260" y="198" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="305" y="220" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4 位</text>
  <rect x="360" y="198" width="150" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="435" y="220" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">偶 ✓ 计数</text>

  <!-- Row 5: 10000-99999, 5位, 奇 -->
  <rect x="40" y="236" width="210" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="145" y="258" text-anchor="middle" font-size="13" fill="#333">10000 – 99999</text>
  <rect x="260" y="236" width="90" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="305" y="258" text-anchor="middle" font-size="13" fill="#333">5 位</text>
  <rect x="360" y="236" width="150" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="435" y="258" text-anchor="middle" font-size="13" fill="#b85450">奇 ✗</text>

  <!-- Row 6: 100000, 6位, 偶 -->
  <rect x="40" y="274" width="210" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="145" y="296" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">100000</text>
  <rect x="260" y="274" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="305" y="296" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6 位</text>
  <rect x="360" y="274" width="150" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="435" y="296" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">偶 ✓ 计数</text>

  <!-- Summary box -->
  <rect x="40" y="324" width="470" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="54" y="346" font-size="12" fill="#333" font-weight="bold">💡 关键洞察</text>
  <text x="54" y="364" font-size="11" fill="#555">约束 1 ≤ nums[i] ≤ 10⁵ 把值域压成 6 段，偶数位恰对应 3 段：</text>
  <text x="54" y="378" font-size="11" fill="#555">10≤x≤99  或  1000≤x≤9999  或  x==100000 → O(1) 判定，无需数位数</text>
</svg>
