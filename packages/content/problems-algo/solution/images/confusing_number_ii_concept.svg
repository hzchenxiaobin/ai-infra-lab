<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：有效数 = 易混淆 ∪ 中心对称（互斥）</text>

  <!-- ===== Big container: Valid numbers ===== -->
  <rect x="40" y="46" width="460" height="200" fill="#e8f0fe" stroke="#446688" stroke-width="2" stroke-dasharray="6,3" rx="10" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">有效数（所有位 ∈ {0, 1, 6, 8, 9}，无前导零）</text>

  <!-- Left subset: Confusing -->
  <rect x="64" y="82" width="200" height="142" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="164" y="102" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">易混淆数（confusing）</text>
  <text x="164" y="120" text-anchor="middle" font-size="11" fill="#666">旋转后 ≠ 原数</text>

  <!-- examples -->
  <rect x="80" y="132" width="36" height="26" fill="#fff" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="98" y="150" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <text x="122" y="148" font-size="10" fill="#888">→9</text>

  <rect x="142" y="132" width="46" height="26" fill="#fff" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="165" y="150" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">89</text>
  <text x="194" y="148" font-size="10" fill="#888">→68</text>

  <rect x="80" y="168" width="46" height="26" fill="#fff" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="103" y="186" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">16</text>
  <text x="132" y="184" font-size="10" fill="#888">→91</text>

  <rect x="148" y="168" width="56" height="26" fill="#fff" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="176" y="186" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">100</text>
  <text x="210" y="184" font-size="10" fill="#888">→1</text>

  <text x="164" y="212" text-anchor="middle" font-size="10" fill="#d6a040">rotated ≠ n</text>

  <!-- Right subset: Strobogrammatic -->
  <rect x="280" y="82" width="200" height="142" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="380" y="102" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">中心对称数（strobogrammatic）</text>
  <text x="380" y="120" text-anchor="middle" font-size="11" fill="#666">旋转后 = 原数</text>

  <rect x="296" y="132" width="36" height="26" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="314" y="150" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="338" y="148" font-size="10" fill="#888">→1</text>

  <rect x="358" y="132" width="36" height="26" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="376" y="150" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>
  <text x="400" y="148" font-size="10" fill="#888">→8</text>

  <rect x="296" y="168" width="36" height="26" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="314" y="186" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">11</text>
  <text x="338" y="184" font-size="10" fill="#888">→11</text>

  <rect x="358" y="168" width="36" height="26" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="376" y="186" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">69</text>
  <text x="400" y="184" font-size="10" fill="#888">→69</text>

  <rect x="416" y="168" width="36" height="26" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="434" y="186" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">88</text>
  <text x="458" y="184" font-size="10" fill="#888">→88</text>

  <text x="380" y="212" text-anchor="middle" font-size="10" fill="#4a7a3a">rotated = n</text>

  <!-- ===== Formula ===== -->
  <rect x="40" y="264" width="460" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="282" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">易混淆数个数 = 有效数个数 − 中心对称数个数</text>
  <text x="270" y="298" text-anchor="middle" font-size="11" fill="#888">两个子问题各自有高效独立算法</text>

  <!-- ===== Bottom: methods ===== -->
  <rect x="40" y="316" width="218" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="149" y="336" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">数有效数：数位计数</text>
  <text x="149" y="352" text-anchor="middle" font-size="10" fill="#888">逐位枚举 O(log n)</text>

  <rect x="282" y="316" width="218" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="391" y="336" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">数中心对称数：构造枚举</text>
  <text x="391" y="352" text-anchor="middle" font-size="10" fill="#888">递归填充 O(5^(L/2))</text>
</svg>
