<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="500" height="480" fill="#fafafa"/>

  <text x="250" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：异或 + Brian Kernighan 计数</text>

  <!-- Start oval -->
  <ellipse cx="250" cy="60" rx="48" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="65" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">开始</text>

  <line x1="250" y1="80" x2="250" y2="96" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- x = start ^ goal -->
  <rect x="120" y="100" width="260" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="250" y="125" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">x = start ^ goal   // 异或找不同位</text>

  <line x1="250" y1="140" x2="250" y2="156" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- count = 0 -->
  <rect x="170" y="160" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="250" y="182" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">count = 0  // 计数器</text>

  <line x1="250" y1="194" x2="250" y2="210" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond: x != 0 ? -->
  <polygon points="250,214 332,256 250,298 168,256" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="252" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">x ≠ 0 ?</text>
  <text x="250" y="268" text-anchor="middle" font-size="10.5" fill="#888">还有 1 没抹</text>

  <!-- Yes branch: down -->
  <text x="262" y="312" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <line x1="250" y1="298" x2="250" y2="316" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- x &= x - 1; count++ -->
  <rect x="110" y="320" width="280" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="250" y="342" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">x &amp;= x − 1   // 抹掉最低设置位</text>
  <text x="250" y="360" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">count++        // 计一次翻转</text>

  <!-- loop back to decision -->
  <line x1="390" y1="345" x2="430" y2="345" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="392" y="238" width="76" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="430" y="256" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">回判</text>
  <path d="M 430 238 Q 430 256 332 256" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- No branch: left to return -->
  <text x="150" y="250" font-size="11" fill="#d6a040" font-weight="bold">否</text>
  <path d="M 168 256 Q 90 256 90 330" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return count -->
  <rect x="20" y="332" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="90" y="354" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">return count</text>

  <line x1="90" y1="366" x2="90" y2="392" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- End oval -->
  <ellipse cx="90" cy="412" rx="42" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="90" y="417" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">结束</text>

  <!-- bottom note -->
  <rect x="150" y="392" width="320" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="310" y="410" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">第一步异或把「找不同」转为「数 1」</text>
  <text x="310" y="426" text-anchor="middle" font-size="11" fill="#446688">第二步 Brian Kernighan 数 1（承接 191）</text>

  <!-- complexity tag -->
  <rect x="150" y="442" width="320" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="310" y="462" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">时间 O(popcount)，空间 O(1)</text>
</svg>
