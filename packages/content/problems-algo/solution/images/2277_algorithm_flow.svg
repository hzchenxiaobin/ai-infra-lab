<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：建图 → 对每个查询 [s,t,node] 做 BFS + 路径回溯 + 取最小</text>

  <!-- Step 1: build graph -->
  <rect x="170" y="40" width="200" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="63" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 邻接表建无向树 O(n)</text>

  <line x1="270" y1="76" x2="270" y2="92" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: for each query -->
  <rect x="150" y="96" width="240" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="118" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② for 每个 [start, end, node]：</text>

  <line x1="270" y1="130" x2="270" y2="146" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: BFS from node -->
  <rect x="120" y="150" width="300" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="172" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">BFS 从 node 扩散 → dist[] 到每个节点 O(n)</text>

  <line x1="270" y1="184" x2="270" y2="200" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: find path -->
  <rect x="100" y="204" width="340" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="226" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">DFS/BFS 从 start 记父指针，回溯得路径 start→end O(n)</text>

  <line x1="270" y1="238" x2="270" y2="254" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: scan path for min dist -->
  <rect x="90" y="258" width="360" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="280" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">扫路径节点，取 dist[v] 最小者 → answer[i] O(路径长)</text>

  <line x1="270" y1="292" x2="270" y2="308" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: loop done? -->
  <polygon points="270,312 372,348 270,384 168,348" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="344" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">查询都</text>
  <text x="270" y="358" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">处理完?</text>

  <!-- No branch (loop back) -->
  <line x1="168" y1="348" x2="120" y2="348" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="342" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>
  <path d="M 116 348 Q 60 348 60 113 L 148 113" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="48" y="230" font-size="9.5" fill="#888">下一查询</text>

  <!-- Yes branch -->
  <line x1="372" y1="348" x2="420" y2="348" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="390" y="342" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="424" y="330" width="100" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="474" y="352" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">③ 返回 ans</text>

  <!-- complexity note -->
  <rect x="40" y="400" width="460" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="420" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">每个查询两次 O(n) 遍历（BFS 算距离 + DFS/BFS 找路径），m 个查询共 O(m·n)</text>
  <text x="270" y="438" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">n,m ≤ 1000 → 约 10⁶ 次运算；额外空间 O(n)（dist、parent、seen 每查询重置）</text>
</svg>
