<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：可行性边界判定</text>

  <!-- Number line for C=7 -->
  <text x="280" y="54" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">以 C=7 为例：可行番茄区间 [2C, 4C] = [14, 28]</text>

  <!-- valid band -->
  <rect x="250" y="74" width="210" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="355" y="91" text-anchor="middle" font-size="10.5" fill="#4a7a3a">可行区</text>

  <!-- axis line -->
  <path d="M 40 118 L 525 118" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- ticks and labels -->
  <path d="M 40 114 L 40 124" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="40" y="138" text-anchor="middle" font-size="10.5" fill="#888">0</text>

  <path d="M 250 114 L 250 124" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="138" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">14=2C</text>

  <path d="M 460 114 L 460 124" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="460" y="138" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">28=4C</text>

  <path d="M 520 114 L 520 124" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="520" y="138" text-anchor="middle" font-size="10.5" fill="#888">32</text>

  <text x="540" y="122" font-size="10" fill="#888">T</text>

  <!-- T=16 marker (in range) -->
  <circle cx="280" cy="118" r="6" fill="#b85450" stroke="#fff" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 280 112 L 280 70" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" fill="none" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">T=16 ✓</text>
  <text x="280" y="156" text-anchor="middle" font-size="10" fill="#b85450">→ x=1, y=6</text>

  <!-- T=17 marker (odd) -->
  <circle cx="295" cy="118" r="5" fill="#888" stroke="#fff" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="316" y="116" font-size="10" fill="#888">T=17 奇 ✗</text>

  <!-- Divider -->
  <path d="M 40 172 L 520 172" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Table title -->
  <text x="280" y="192" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">全部示例逐项校验</text>

  <!-- header row -->
  <rect x="40" y="202" width="480" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="65" y="218" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">例</text>
  <text x="120" y="218" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">T</text>
  <text x="180" y="218" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">C</text>
  <text x="240" y="218" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">T%2</text>
  <text x="325" y="218" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">2C≤T≤4C</text>
  <text x="450" y="218" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">结果</text>

  <!-- row dividers x: 90, 150, 210, 270, 380 -->
  <path d="M 90 202 L 90 356" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 150 202 L 150 356" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 210 202 L 210 356" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 270 202 L 270 356" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 380 202 L 380 356" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- row backgrounds -->
  <rect x="40" y="226" width="480" height="26" fill="#ffffff" filter="url(#rough2)"/>
  <rect x="40" y="252" width="480" height="26" fill="#f4f6f8" filter="url(#rough2)"/>
  <rect x="40" y="278" width="480" height="26" fill="#ffffff" filter="url(#rough2)"/>
  <rect x="40" y="304" width="480" height="26" fill="#f4f6f8" filter="url(#rough2)"/>
  <rect x="40" y="330" width="480" height="26" fill="#ffffff" filter="url(#rough2)"/>

  <!-- outer table border -->
  <rect x="40" y="202" width="480" height="154" fill="none" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>

  <!-- row 1: T=16 C=7 -->
  <text x="65" y="244" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <text x="120" y="244" text-anchor="middle" font-size="10.5" fill="#333">16</text>
  <text x="180" y="244" text-anchor="middle" font-size="10.5" fill="#333">7</text>
  <text x="240" y="244" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="325" y="244" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">14≤16≤28 ✓</text>
  <text x="450" y="244" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">[1,6]</text>

  <!-- row 2: T=17 C=4 -->
  <text x="65" y="270" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <text x="120" y="270" text-anchor="middle" font-size="10.5" fill="#333">17</text>
  <text x="180" y="270" text-anchor="middle" font-size="10.5" fill="#333">4</text>
  <text x="240" y="270" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">1</text>
  <text x="325" y="270" text-anchor="middle" font-size="10.5" fill="#b85450">奇数 ✗</text>
  <text x="450" y="270" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">[]</text>

  <!-- row 3: T=4 C=17 -->
  <text x="65" y="296" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <text x="120" y="296" text-anchor="middle" font-size="10.5" fill="#333">4</text>
  <text x="180" y="296" text-anchor="middle" font-size="10.5" fill="#333">17</text>
  <text x="240" y="296" text-anchor="middle" font-size="10.5" fill="#4a7a3a">0</text>
  <text x="325" y="296" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">34≤4 ✗</text>
  <text x="450" y="296" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">[]</text>

  <!-- row 4: T=0 C=0 -->
  <text x="65" y="322" text-anchor="middle" font-size="10.5" fill="#333">4</text>
  <text x="120" y="322" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <text x="180" y="322" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <text x="240" y="322" text-anchor="middle" font-size="10.5" fill="#4a7a3a">0</text>
  <text x="325" y="322" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">0≤0≤0 ✓</text>
  <text x="450" y="322" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">[0,0]</text>

  <!-- row 5: T=2 C=1 -->
  <text x="65" y="348" text-anchor="middle" font-size="10.5" fill="#333">5</text>
  <text x="120" y="348" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <text x="180" y="348" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <text x="240" y="348" text-anchor="middle" font-size="10.5" fill="#4a7a3a">0</text>
  <text x="325" y="348" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">2≤2≤4 ✓</text>
  <text x="450" y="348" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">[0,1]</text>

  <text x="280" y="392" text-anchor="middle" font-size="10.5" fill="#888" font-style="italic">奇偶先判 → 区间再判 → 通过则代公式，全程 O(1)</text>
</svg>
