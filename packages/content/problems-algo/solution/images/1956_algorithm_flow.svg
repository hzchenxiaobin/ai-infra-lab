<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：二分答案 t + 左下角枚举 check</text>

  <!-- Step 1: transform -->
  <rect x="60" y="44" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="160" y="64" text-anchor="middle" font-size="11.5" fill="#333">① 变换 u_i=x_i+y_i, v_i=x_i−y_i</text>

  <!-- Step 2: binary search init -->
  <rect x="300" y="44" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="400" y="64" text-anchor="middle" font-size="11.5" fill="#333">② 二分 lo=0, hi=2×10⁹</text>

  <path d="M 160 74 L 160 96" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 400 74 L 400 96" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- merge into mid -->
  <rect x="180" y="96" width="200" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="280" y="116" text-anchor="middle" font-size="11.5" fill="#333">③ mid = (lo + hi) / 2</text>

  <path d="M 280 126 L 280 150" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Diamond: check(mid) ? -->
  <path d="M 280 150 L 420 198 L 280 246 L 140 198 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="194" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">check(mid)?</text>
  <text x="280" y="212" text-anchor="middle" font-size="10.5" fill="#888">≥k 个正方形重叠?</text>

  <!-- ===== check(t) detail box on the right ===== -->
  <rect x="446" y="120" width="108" height="148" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="500" y="138" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">check(t)</text>
  <text x="452" y="158" font-size="10" fill="#333">枚举角点</text>
  <text x="452" y="174" font-size="10" fill="#333">(u_i−t, v_j−t)</text>
  <text x="452" y="190" font-size="10" fill="#555">∀i,j∈[n]</text>
  <text x="452" y="208" font-size="10" fill="#333">数覆盖正方形</text>
  <text x="452" y="222" font-size="9.5" fill="#888">|u−u_m|≤t</text>
  <text x="452" y="234" font-size="9.5" fill="#888">|v−v_m|≤t</text>
  <text x="452" y="252" font-size="10" fill="#4a7a3a" font-weight="bold">max ≥ k ?</text>
  <!-- arrow from diamond to box -->
  <path d="M 420 198 L 444 198" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="3,3" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Yes branch → down (hi = mid) -->
  <path d="M 280 246 L 280 270" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="298" y="262" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="200" y="270" width="160" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="280" y="289" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">hi = mid（缩上界）</text>

  <!-- No branch → left (lo = mid+1) -->
  <path d="M 140 198 L 96 198" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="120" y="190" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="20" y="184" width="76" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="58" y="204" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">lo=mid+1</text>

  <!-- loop back up to mid -->
  <path d="M 280 298 L 280 312" stroke="#888" stroke-width="1.6" fill="none"/>
  <path d="M 280 312 L 58 312 L 58 130 L 180 130" stroke="#aaa" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 58 312 L 280 312" stroke="none"/>
  <text x="160" y="306" font-size="10.5" fill="#888">lo &lt; hi 继续</text>

  <!-- terminate -->
  <path d="M 280 312 L 280 312" stroke="none"/>
  <rect x="180" y="338" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="280" y="358" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">lo == hi 时结束</text>
  <path d="M 280 312 L 280 338" stroke="none"/>

  <!-- arrow down to result -->
  <path d="M 280 368 L 280 392" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="200" y="392" width="160" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="14" filter="url(#rough2)"/>
  <text x="280" y="413" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">return lo</text>

  <!-- footnote -->
  <text x="280" y="450" text-anchor="middle" font-size="10.5" fill="#888">check 单次 O(n³)，二分 O(log(2×10⁹))≈31 轮，n≤50 共 ≈4×10⁶</text>
</svg>
