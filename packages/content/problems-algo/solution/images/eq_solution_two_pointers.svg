<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrF" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">双指针搜索：从 (1, maxY) 出发，沿反对角线扫描</text>
  <text x="280" y="40" text-anchor="middle" font-size="10.5" fill="#446688">以 f(x,y) = x + y, z = 5 为例（起点简化为 y=5）</text>

  <text x="255" y="66" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">x →</text>
  <text x="108" y="52" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">↑ y</text>

  <text x="155" y="74" text-anchor="middle" font-size="9.5" fill="#888">1</text>
  <text x="205" y="74" text-anchor="middle" font-size="9.5" fill="#888">2</text>
  <text x="255" y="74" text-anchor="middle" font-size="9.5" fill="#888">3</text>
  <text x="305" y="74" text-anchor="middle" font-size="9.5" fill="#888">4</text>
  <text x="355" y="74" text-anchor="middle" font-size="9.5" fill="#888">5</text>

  <text x="122" y="97" text-anchor="end" font-size="9.5" fill="#888">5</text>
  <text x="122" y="127" text-anchor="end" font-size="9.5" fill="#888">4</text>
  <text x="122" y="157" text-anchor="end" font-size="9.5" fill="#888">3</text>
  <text x="122" y="187" text-anchor="end" font-size="9.5" fill="#888">2</text>
  <text x="122" y="217" text-anchor="end" font-size="9.5" fill="#888">1</text>

  <!-- Row y=5 -->
  <rect x="130" y="78" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="155" y="97" text-anchor="middle" font-size="11" fill="#999">6</text>
  <rect x="180" y="78" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="205" y="97" text-anchor="middle" font-size="11" fill="#ccc">7</text>
  <rect x="230" y="78" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="255" y="97" text-anchor="middle" font-size="11" fill="#ccc">8</text>
  <rect x="280" y="78" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="305" y="97" text-anchor="middle" font-size="11" fill="#ccc">9</text>
  <rect x="330" y="78" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="355" y="97" text-anchor="middle" font-size="11" fill="#ccc">10</text>

  <!-- Row y=4 -->
  <rect x="130" y="108" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="155" y="127" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5 ✓</text>
  <rect x="180" y="108" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="205" y="127" text-anchor="middle" font-size="11" fill="#999">6</text>
  <rect x="230" y="108" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="255" y="127" text-anchor="middle" font-size="11" fill="#ccc">7</text>
  <rect x="280" y="108" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="305" y="127" text-anchor="middle" font-size="11" fill="#ccc">8</text>
  <rect x="330" y="108" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="355" y="127" text-anchor="middle" font-size="11" fill="#ccc">9</text>

  <!-- Row y=3 -->
  <rect x="130" y="138" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="155" y="157" text-anchor="middle" font-size="11" fill="#999">4</text>
  <rect x="180" y="138" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="205" y="157" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5 ✓</text>
  <rect x="230" y="138" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="255" y="157" text-anchor="middle" font-size="11" fill="#999">6</text>
  <rect x="280" y="138" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="305" y="157" text-anchor="middle" font-size="11" fill="#ccc">7</text>
  <rect x="330" y="138" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="355" y="157" text-anchor="middle" font-size="11" fill="#ccc">8</text>

  <!-- Row y=2 -->
  <rect x="130" y="168" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="155" y="187" text-anchor="middle" font-size="11" fill="#999">3</text>
  <rect x="180" y="168" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="205" y="187" text-anchor="middle" font-size="11" fill="#999">4</text>
  <rect x="230" y="168" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="255" y="187" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5 ✓</text>
  <rect x="280" y="168" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="305" y="187" text-anchor="middle" font-size="11" fill="#999">6</text>
  <rect x="330" y="168" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="355" y="187" text-anchor="middle" font-size="11" fill="#ccc">7</text>

  <!-- Row y=1 -->
  <rect x="130" y="198" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="155" y="217" text-anchor="middle" font-size="11" fill="#999">2</text>
  <rect x="180" y="198" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="205" y="217" text-anchor="middle" font-size="11" fill="#999">3</text>
  <rect x="230" y="198" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="255" y="217" text-anchor="middle" font-size="11" fill="#999">4</text>
  <rect x="280" y="198" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="305" y="217" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5 ✓</text>
  <rect x="330" y="198" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="355" y="217" text-anchor="middle" font-size="11" fill="#999">6</text>

  <!-- Path arrows: down (y--) in orange, right (x++) in green -->
  <!-- Down arrows offset x+18 to avoid cell text; right arrows offset y-10 -->

  <!-- Step 1: (1,5)→(1,4) down -->
  <line x1="173" y1="93" x2="173" y2="123" stroke="#d6a040" stroke-width="2.2" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <!-- Step 2: (1,4)→(2,4) right (found solution) -->
  <line x1="155" y1="113" x2="205" y2="113" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <!-- Step 3: (2,4)→(2,3) down -->
  <line x1="223" y1="123" x2="223" y2="153" stroke="#d6a040" stroke-width="2.2" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <!-- Step 4: (2,3)→(3,3) right (found solution) -->
  <line x1="205" y1="143" x2="255" y2="143" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <!-- Step 5: (3,3)→(3,2) down -->
  <line x1="273" y1="153" x2="273" y2="183" stroke="#d6a040" stroke-width="2.2" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <!-- Step 6: (3,2)→(4,2) right (found solution) -->
  <line x1="255" y1="173" x2="305" y2="173" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <!-- Step 7: (4,2)→(4,1) down -->
  <line x1="323" y1="183" x2="323" y2="213" stroke="#d6a040" stroke-width="2.2" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <!-- Step 8: (4,1)→(5,1) right (found solution) -->
  <line x1="305" y1="203" x2="355" y2="203" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <!-- Step 9: (5,1)→ stop (y-- → y=0) -->
  <line x1="373" y1="213" x2="373" y2="245" stroke="#b85450" stroke-width="2.2" stroke-dasharray="4,3" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="375" y="258" font-size="9" fill="#b85450" font-weight="bold">y=0, 停止</text>

  <!-- Start point -->
  <circle cx="155" cy="93" r="8" fill="#b85450" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)" opacity="0.3"/>
  <text x="128" y="86" font-size="9" fill="#b85450" font-weight="bold">起点</text>
  <path d="M 140 88 L 148 91" stroke="#b85450" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- Legend / movement rules -->
  <text x="420" y="90" font-size="10" fill="#555" font-weight="bold">移动规则</text>
  <line x1="410" y1="104" x2="430" y2="104" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="438" y="108" font-size="9.5" fill="#4a7a3a">f &lt; z → x++</text>
  <text x="438" y="120" font-size="8.5" fill="#888">值太小，增大 x</text>
  <line x1="410" y1="136" x2="430" y2="136" stroke="#d6a040" stroke-width="2.2" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="438" y="140" font-size="9.5" fill="#d6a040">f &gt; z → y--</text>
  <text x="438" y="152" font-size="8.5" fill="#888">值太大，减小 y</text>
  <rect x="412" y="164" width="16" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="438" y="175" font-size="9.5" fill="#4a7a3a" font-weight="bold">f = z ✓</text>
  <text x="438" y="187" font-size="8.5" fill="#888">记录解，x++</text>

  <!-- Bottom notes -->
  <rect x="30" y="278" width="500" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="50" y="298" font-size="10.5" fill="#333">💡 <tspan fill="#d6a040" font-weight="bold">锯齿路径</tspan>：找到解后右移（x++），值变大后下移（y--）回到 z，再右移……</text>
  <text x="50" y="314" font-size="10.5" fill="#333">双指针自然地「沿着反对角线走」，每步排除一行或一列的不可能区域。</text>
  <text x="50" y="328" font-size="10.5" fill="#333">9 步找到全部 4 组解，函数仅调用 9 次 → <tspan fill="#4a7a3a" font-weight="bold">O(x_max + y_max)</tspan></text>

  <rect x="30" y="344" width="500" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="50" y="364" font-size="10" fill="#333">⚠️ <tspan fill="#446688" font-weight="bold">为什么不漏解？</tspan> f(x,y)&gt;z 时，该行 x 及右侧全 &gt;z（f 随 x 递增），y-- 安全</text>
  <text x="50" y="380" font-size="10" fill="#333">f(x,y)&lt;z 时，该列 y 及下方全 &lt;z（f 随 y 递增），x++ 安全</text>
  <text x="50" y="394" font-size="10" fill="#333">每步排除不可能区域 → 保证遍历到反对角线上所有解</text>
</svg>
