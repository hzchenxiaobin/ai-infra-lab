<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：计算 k → 查 a×k → 查 a×(k+1) → 返回</text>

  <!-- Input -->
  <rect x="170" y="48" width="200" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="72" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">输入：a（n），b（m）</text>

  <path d="M270 88 L270 108" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 1: compute k -->
  <rect x="100" y="112" width="340" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="134" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">① k = ⌈m / n⌉ = (m + n − 1) / n</text>
  <text x="270" y="152" text-anchor="middle" font-size="11" fill="#666">k 份长度 ≥ m，是长度够用的最小次数</text>

  <path d="M270 162 L270 182" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 1: b in a*k? -->
  <polygon points="270,186 400,224 270,262 140,224" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="220" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">b 是 a×k 的</text>
  <text x="270" y="238" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">子串？</text>

  <!-- Yes branch -->
  <text x="110" y="228" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M190 224 L90 224 L90 280" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="30" y="284" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="90" y="306" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">return k</text>

  <!-- No branch -->
  <text x="430" y="228" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">否</text>
  <path d="M350 224 L440 224 L440 268" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: build a*(k+1) -->
  <rect x="320" y="272" width="240" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="440" y="296" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">拼接 a × (k+1)</text>

  <path d="M440 314 L440 332" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 2: b in a*(k+1)? -->
  <polygon points="440,336 520,360 440,384 360,360" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="440" y="364" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">b 在其中？</text>

  <!-- Yes -->
  <text x="356" y="360" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M400 360 L300 360 L300 376" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="230" y="380" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="402" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">return k+1</text>

  <!-- No -->
  <text x="526" y="360" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M480 360 L520 360 L520 376" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="460" y="380" width="70" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="495" y="402" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−1</text>

  <text x="270" y="430" text-anchor="middle" font-size="10" fill="#888">两次子串检查覆盖全部可能：k 份够用或 k+1 份兜底，无需更多</text>
</svg>
