<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrL" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="520" fill="#fafafa"/>

  <text x="360" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：nums=[1,3,2,4,5]，j=1 命中 → ans=2</text>

  <!-- 数组格子 -->
  <g font-size="10" fill="#bbb" text-anchor="middle" filter="url(#rough2)">
    <text x="140" y="64">下标 0</text>
    <text x="220" y="64">1</text>
    <text x="300" y="64">2</text>
    <text x="380" y="64">3</text>
    <text x="460" y="64">4</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="110" y="72" width="60" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="190" y="72" width="60" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <rect x="270" y="72" width="60" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="350" y="72" width="60" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <rect x="430" y="72" width="60" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
  </g>
  <g font-size="18" font-weight="bold" text-anchor="middle" filter="url(#rough2)">
    <text x="140" y="100" fill="#3a4e7a">1</text>
    <text x="220" y="100" fill="#7a5415">3</text>
    <text x="300" y="100" fill="#3a5a2a">2</text>
    <text x="380" y="100" fill="#b85450">4</text>
    <text x="460" y="100" fill="#b85450">5</text>
  </g>
  <g font-size="10.5" text-anchor="middle" font-weight="bold" filter="url(#rough2)">
    <text x="140" y="132" fill="#3a4e7a">i=0</text>
    <text x="220" y="132" fill="#7a5415">j=1</text>
    <text x="300" y="132" fill="#3a5a2a">k=2</text>
    <text x="380" y="132" fill="#b85450">l=3</text>
    <text x="460" y="132" fill="#b85450">l=4</text>
  </g>

  <!-- j=1 右扫轨迹标题 -->
  <text x="60" y="160" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">j=1（nums[j]=3）右扫 k: 4 → 2</text>

  <!-- 右扫步骤表 -->
  <rect x="40" y="170" width="640" height="130" fill="#fffdf3" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>

  <!-- 表头 -->
  <g font-size="10.5" fill="#888" text-anchor="middle" filter="url(#rough2)">
    <text x="110" y="190">k</text>
    <text x="180" y="190">nums[k]</text>
    <text x="300" y="190">判定</text>
    <text x="430" y="190">动作</text>
    <text x="590" y="190">greater</text>
  </g>
  <line x1="60" y1="196" x2="660" y2="196" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- k=4 -->
  <g font-size="11" fill="#333" filter="url(#rough2)">
    <text x="110" y="214" text-anchor="middle">4</text>
    <text x="180" y="214" text-anchor="middle" fill="#b85450" font-weight="bold">5</text>
    <text x="300" y="214" text-anchor="middle">5 &gt; 3</text>
    <text x="430" y="214" text-anchor="middle" fill="#b85450">greater++；less[4]++</text>
    <text x="590" y="214" text-anchor="middle" font-weight="bold">1</text>
  </g>
  <!-- k=3 -->
  <g font-size="11" fill="#333" filter="url(#rough2)">
    <text x="110" y="236" text-anchor="middle">3</text>
    <text x="180" y="236" text-anchor="middle" fill="#b85450" font-weight="bold">4</text>
    <text x="300" y="236" text-anchor="middle">4 &gt; 3</text>
    <text x="430" y="236" text-anchor="middle" fill="#b85450">greater++；less[3]++</text>
    <text x="590" y="236" text-anchor="middle" font-weight="bold">2</text>
  </g>
  <!-- k=2 命中 -->
  <rect x="60" y="244" width="600" height="24" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <g font-size="11" fill="#333" filter="url(#rough2)">
    <text x="110" y="260" text-anchor="middle" font-weight="bold">2</text>
    <text x="180" y="260" text-anchor="middle" fill="#3a5a2a" font-weight="bold">2</text>
    <text x="300" y="260" text-anchor="middle" fill="#2e6e2e" font-weight="bold">2 &lt; 3 ✓</text>
    <text x="430" y="260" text-anchor="middle" fill="#2e6e2e" font-weight="bold">ans += less[2]×greater</text>
    <text x="590" y="260" text-anchor="middle" font-weight="bold">2</text>
  </g>
  <text x="300" y="288" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">= 1 × 2 = 2</text>

  <!-- less 数组状态 -->
  <rect x="40" y="312" width="320" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="332" font-size="12" fill="#3a4e7a" font-weight="bold" filter="url(#rough2)">less[] 在 j=1 时（处理前）</text>
  <text x="60" y="352" font-size="11" fill="#333" filter="url(#rough2)">less[2] = 1（i=0，值1 &lt; nums[2]=2）</text>
  <text x="60" y="366" font-size="11" fill="#555" filter="url(#rough2)">→ 唯一合法 i：下标 0</text>

  <!-- greater 解释 -->
  <rect x="380" y="312" width="300" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="400" y="332" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">greater = 2（k=2 命中时）</text>
  <text x="400" y="352" font-size="11" fill="#333" filter="url(#rough2)">l=3（值4&gt;3）、l=4（值5&gt;3）</text>
  <text x="400" y="366" font-size="11" fill="#555" filter="url(#rough2)">→ 两个合法 l：下标 3、4</text>

  <!-- 乘法结算 -->
  <rect x="40" y="384" width="640" height="50" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="360" y="406" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">1（左选 i） × 2（右选 l） = 2 个四元组</text>
  <text x="360" y="426" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">(i,j,k,l) = (0,1,2,3) 与 (0,1,2,4)</text>

  <!-- 后续 j 无命中 -->
  <rect x="40" y="446" width="640" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="468" font-size="11.5" fill="#7a5415" font-weight="bold" filter="url(#rough2)">后续 j=2,3,4 均无命中</text>
  <text x="60" y="488" font-size="11" fill="#555" filter="url(#rough2)">j=2（值2）：右扫 k=4,3 均 &gt; 2，无 nums[k]&lt;nums[j] 的合法对</text>
  <text x="60" y="502" font-size="11" fill="#555" filter="url(#rough2)">j=3（值4）：仅 k=4（值5&gt;4）；j=4 无 k。最终 ans = 2 ✓</text>
</svg>
