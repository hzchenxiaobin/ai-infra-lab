<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [2, −5, 1, −4, 3, −2]</text>

  <!-- Table header -->
  <rect x="30" y="44" width="500" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">步骤</text>
  <text x="120" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">元素</text>
  <text x="200" y="62" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">curMax</text>
  <text x="280" y="62" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">maxSum</text>
  <text x="370" y="62" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">curMin</text>
  <text x="460" y="62" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">minSum</text>

  <!-- column separators -->
  <line x1="90" y1="44" x2="90" y2="256" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="150" y1="44" x2="150" y2="256" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="250" y1="44" x2="250" y2="256" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="330" y1="44" x2="330" y2="256" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="410" y1="44" x2="410" y2="256" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row: initial -->
  <rect x="30" y="72" width="500" height="24" fill="#fff8e1" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="60" y="88" text-anchor="middle" font-size="11" fill="#333">初始</text>
  <text x="120" y="88" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="200" y="88" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="280" y="88" text-anchor="middle" font-size="11" fill="#333">−∞</text>
  <text x="370" y="88" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="460" y="88" text-anchor="middle" font-size="11" fill="#333">+∞</text>

  <!-- Row i=0: 2 -->
  <rect x="30" y="96" width="500" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="60" y="112" text-anchor="middle" font-size="11" fill="#333">i=0</text>
  <text x="120" y="112" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="200" y="112" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="280" y="112" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="370" y="112" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="460" y="112" text-anchor="middle" font-size="11" fill="#333">2</text>

  <!-- Row i=1: -5 -->
  <rect x="30" y="120" width="500" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="60" y="136" text-anchor="middle" font-size="11" fill="#333">i=1</text>
  <text x="120" y="136" text-anchor="middle" font-size="11" fill="#333">−5</text>
  <text x="200" y="136" text-anchor="middle" font-size="11" fill="#333">−3</text>
  <text x="280" y="136" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="370" y="136" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−5</text>
  <text x="460" y="136" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−5</text>

  <!-- Row i=2: 1 -->
  <rect x="30" y="144" width="500" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="60" y="160" text-anchor="middle" font-size="11" fill="#333">i=2</text>
  <text x="120" y="160" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="200" y="160" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="280" y="160" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="370" y="160" text-anchor="middle" font-size="11" fill="#333">−4</text>
  <text x="460" y="160" text-anchor="middle" font-size="11" fill="#333">−5</text>

  <!-- Row i=3: -4  (minSum hits -8) -->
  <rect x="30" y="168" width="500" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="60" y="184" text-anchor="middle" font-size="11" fill="#333">i=3</text>
  <text x="120" y="184" text-anchor="middle" font-size="11" fill="#333">−4</text>
  <text x="200" y="184" text-anchor="middle" font-size="11" fill="#333">−3</text>
  <text x="280" y="184" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="370" y="184" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−8</text>
  <text x="460" y="184" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−8</text>

  <!-- Row i=4: 3 -->
  <rect x="30" y="192" width="500" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="60" y="208" text-anchor="middle" font-size="11" fill="#333">i=4</text>
  <text x="120" y="208" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="200" y="208" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="280" y="208" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="370" y="208" text-anchor="middle" font-size="11" fill="#333">−5</text>
  <text x="460" y="208" text-anchor="middle" font-size="11" fill="#333">−8</text>

  <!-- Row i=5: -2 (maxSum hits 3) -->
  <rect x="30" y="216" width="500" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="60" y="232" text-anchor="middle" font-size="11" fill="#333">i=5</text>
  <text x="120" y="232" text-anchor="middle" font-size="11" fill="#333">−2</text>
  <text x="200" y="232" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="280" y="232" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="370" y="232" text-anchor="middle" font-size="11" fill="#333">−7</text>
  <text x="460" y="232" text-anchor="middle" font-size="11" fill="#333">−8</text>

  <!-- Result box -->
  <rect x="40" y="268" width="480" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="292" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">遍历结束：</text>
  <text x="280" y="312" text-anchor="middle" font-size="12" fill="#4a7a3a">maxSum = 3  →  子数组 [3]，|3| = 3</text>
  <text x="280" y="332" text-anchor="middle" font-size="12" fill="#b85450">minSum = −8  →  子数组 [−5, 1, −4]，|−8| = 8</text>
  <text x="280" y="352" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">answer = max(3, 8) = 8</text>

  <!-- Footer note -->
  <text x="280" y="392" text-anchor="middle" font-size="11" fill="#888">负方向走得更远 → 答案来自最小子数组和的绝对值</text>
</svg>
