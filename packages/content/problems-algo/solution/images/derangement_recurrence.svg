<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrOrange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">递推推导：元素 1 放到位置 i，分两种情况</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">1 不能放在位置 1，故有 n−1 个目标位置可选（以 n=4, 1→位置3 为例）</text>

  <!-- ===== Setup: original positions ===== -->
  <text x="30" y="70" font-size="11" fill="#888" font-weight="bold">原排列位置</text>
  <g font-size="10" fill="#999" text-anchor="middle">
    <text x="80" y="70">位1</text>
    <text x="140" y="70">位2</text>
    <text x="200" y="70">位3</text>
    <text x="260" y="70">位4</text>
  </g>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="60" y="78" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="80" y="102" fill="#446688">1</text>
    <rect x="120" y="78" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="140" y="102" fill="#446688">2</text>
    <rect x="180" y="78" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="200" y="102" fill="#446688">3</text>
    <rect x="240" y="78" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="260" y="102" fill="#446688">4</text>
  </g>

  <!-- arrow: 1 goes to position 3 -->
  <path d="M 80 120 C 80 140, 200 140, 200 120" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="140" y="142" text-anchor="middle" font-size="10" fill="#446688">元素 1 → 位置 3（i=3，共 n−1=3 种选法）</text>

  <!-- ===== Case A: element i swaps back to position 1 ===== -->
  <rect x="20" y="160" width="250" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="145" y="182" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">情况 A：元素 i 也回到位置 1（1↔i 互换）</text>

  <!-- swap illustration -->
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="40" y="196" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="58" y="217" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="88" y="196" width="36" height="32" fill="#e8f0fe" stroke="#888" stroke-width="1" rx="4"/>
    <text x="106" y="217" fill="#888">2</text>
    <rect x="136" y="196" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="154" y="217" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="184" y="196" width="36" height="32" fill="#e8f0fe" stroke="#888" stroke-width="1" rx="4"/>
    <text x="202" y="217" fill="#888">4</text>
  </g>
  <text x="145" y="246" text-anchor="middle" font-size="10" fill="#555">1 和 3 互换，剩下 {2, 4} 在 {位2, 位4}</text>
  <text x="145" y="262" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">→ 剩 n−2 个元素的错排：D(n−2)</text>

  <!-- ===== Case B: element i does NOT go to position 1 ===== -->
  <rect x="290" y="160" width="250" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="415" y="182" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">情况 B：元素 i 不去位置 1</text>

  <!-- illustration: position 1 now "forbidden" for i -->
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="310" y="196" width="36" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="328" y="217" fill="#b85450">?</text>
    <rect x="358" y="196" width="36" height="32" fill="#e8f0fe" stroke="#888" stroke-width="1" rx="4"/>
    <text x="376" y="217" fill="#888">2</text>
    <rect x="406" y="196" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="424" y="217" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="454" y="196" width="36" height="32" fill="#e8f0fe" stroke="#888" stroke-width="1" rx="4"/>
    <text x="472" y="217" fill="#888">4</text>
  </g>
  <text x="415" y="246" text-anchor="middle" font-size="10" fill="#555">i(=3) 禁入位1，等价于 n−1 元素的错排</text>
  <text x="415" y="262" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">→ 剩 n−1 个元素的错排：D(n−1)</text>

  <!-- ===== Bottom: combine ===== -->
  <rect x="40" y="300" width="480" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="12" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">合并两种情况</text>
  <text x="280" y="348" text-anchor="middle" font-size="12" fill="#444">位置 i 有 n−1 种选法，每种选法下分 A / B 两类</text>
  <text x="280" y="372" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">D(n) = (n−1) × ( D(n−1) + D(n−2) )</text>
  <text x="280" y="392" text-anchor="middle" font-size="10" fill="#999">初始：D(1) = 0, D(2) = 1</text>
</svg>
