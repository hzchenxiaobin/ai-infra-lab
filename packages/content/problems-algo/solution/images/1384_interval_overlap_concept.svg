<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：跨年销售期 = 区间相交拆分到每年</text>

  <!-- subtitle -->
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">LC T-Shirt：period [2018-12-01 → 2020-01-01]，avg_daily_sales = 10</text>

  <!-- ============ Year columns header ============ -->
  <!-- 2018: x 50-200, 2019: x 210-360, 2020: x 370-520 -->
  <rect x="50" y="62" width="150" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="80" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2018</text>
  <rect x="210" y="62" width="150" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="285" y="80" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2019</text>
  <rect x="370" y="62" width="150" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="445" y="80" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2020</text>

  <!-- year boundary labels (01-01 / 12-31) -->
  <text x="50" y="100" text-anchor="middle" font-size="8" fill="#888">01-01</text>
  <text x="200" y="100" text-anchor="middle" font-size="8" fill="#888">12-31</text>
  <text x="210" y="100" text-anchor="middle" font-size="8" fill="#888">01-01</text>
  <text x="360" y="100" text-anchor="middle" font-size="8" fill="#888">12-31</text>
  <text x="370" y="100" text-anchor="middle" font-size="8" fill="#888">01-01</text>
  <text x="520" y="100" text-anchor="middle" font-size="8" fill="#888">12-31</text>

  <!-- ============ Period bar (schematic) ============ -->
  <!-- Dec 1 near end of 2018 (x≈178) -> Jan 1 near start of 2020 (x≈372) -->
  <rect x="178" y="112" width="196" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="276" y="125" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">销售期 period</text>

  <!-- start / end date labels -->
  <text x="178" y="146" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">12-01</text>
  <text x="374" y="146" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">01-01</text>

  <!-- ============ Overlap segments per year (schematic, widened) ============ -->
  <!-- 2018 overlap: Dec 01 -> Dec 31, schematic bar -->
  <rect x="178" y="158" width="22" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <!-- 2019 overlap: full year -->
  <rect x="210" y="158" width="150" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <!-- 2020 overlap: Jan 01 only, schematic bar -->
  <rect x="370" y="158" width="18" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>

  <!-- day count -->
  <text x="125" y="176" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">31 天</text>
  <text x="285" y="176" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">365 天</text>
  <text x="445" y="176" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1 天</text>

  <!-- amount -->
  <text x="125" y="200" text-anchor="middle" font-size="10" fill="#b85450">31×10 = 310</text>
  <text x="285" y="200" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">365×10 = 3650</text>
  <text x="445" y="200" text-anchor="middle" font-size="10" fill="#d6a040">1×10 = 10</text>

  <!-- ============ Formula box ============ -->
  <rect x="20" y="220" width="520" height="98" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <rect x="20" y="220" width="520" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="237" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">区间相交公式：[A, B] ∩ [Ys, Ye] = [max(A, Ys), min(B, Ye)]</text>

  <text x="40" y="262" font-size="10" fill="#333">每年重叠天数 =</text>
  <text x="130" y="262" font-size="10.5" fill="#b85450" font-weight="bold">DATEDIFF(</text>
  <text x="190" y="262" font-size="10" fill="#333">LEAST(period_end, year_end),</text>
  <text x="190" y="276" font-size="10" fill="#333">GREATEST(period_start, year_start)</text>
  <text x="360" y="262" font-size="10.5" fill="#b85450" font-weight="bold">) + 1</text>

  <text x="40" y="296" font-size="9.5" fill="#888">year_start = 该年 01-01</text>
  <text x="200" y="296" font-size="9.5" fill="#888">year_end = 该年 12-31</text>
  <text x="340" y="296" font-size="9.5" fill="#888">+1 因两端日期含端点（inclusive）</text>

  <!-- ============ bottom note ============ -->
  <rect x="20" y="330" width="520" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="40" y="350" font-size="10" fill="#333">关键：<tspan fill="#b85450" font-weight="bold">销售期可能跨多个自然年</tspan>。把每个销售期与「年维度表」做相交，一段跨年期被切成若干</text>
  <text x="40" y="366" font-size="10" fill="#333">「年内子段」，每段天数 × average_daily_sales = 该年销售额。年维度表用 <tspan fill="#446688" font-weight="bold">UNION ALL</tspan> 构造</text>
  <text x="40" y="382" font-size="10" fill="#333">（2018/2019/2020），<tspan fill="#446688" font-weight="bold">INNER JOIN</tspan> 条件 YEAR(period_start) ≤ yr ≤ YEAR(period_end) 只保留有交集的年份。</text>
  <text x="40" y="398" font-size="9.5" fill="#888">注：上图 2018/2020 子段按示意加宽显示，实际占比很小（31/365 vs 365/365 vs 1/366）。</text>
</svg>
