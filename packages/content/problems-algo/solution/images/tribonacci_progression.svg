<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">四种解法的演进：从递归到三变量滚动</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">与斐波那契同构——递推骨架不变，只是窗口从 2 项扩到 3 项</text>

  <!-- ===== Stage 1: 暴力递归 ===== -->
  <g filter="url(#rough2)">
    <rect x="25" y="80" width="115" height="150" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8"/>
    <text x="82" y="105" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">① 暴力递归</text>
    <line x1="40" y1="115" x2="125" y2="115" stroke="#d8a0a0" stroke-width="1"/>
    <text x="82" y="138" text-anchor="middle" font-size="10" fill="#333">直接翻译定义</text>
    <text x="82" y="155" text-anchor="middle" font-size="10" fill="#333">T(n) =</text>
    <text x="82" y="170" text-anchor="middle" font-size="10" fill="#333">T(n-1)+T(n-2)</text>
    <text x="82" y="183" text-anchor="middle" font-size="10" fill="#333">+T(n-3)</text>
    <text x="82" y="205" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">时间 O(3ⁿ)</text>
    <text x="82" y="222" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">空间 O(n)</text>
  </g>

  <!-- arrow 1->2 -->
  <path d="M 145 155 L 170 155" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="157" y="146" text-anchor="middle" font-size="9" fill="#d6a040">加缓存</text>

  <!-- ===== Stage 2: 记忆化搜索 ===== -->
  <g filter="url(#rough2)">
    <rect x="175" y="80" width="115" height="150" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8"/>
    <text x="232" y="105" text-anchor="middle" font-size="12" fill="#a07820" font-weight="bold">② 记忆化搜索</text>
    <line x1="190" y1="115" x2="275" y2="115" stroke="#e0c080" stroke-width="1"/>
    <text x="232" y="138" text-anchor="middle" font-size="10" fill="#333">递归 +备忘录</text>
    <text x="232" y="155" text-anchor="middle" font-size="10" fill="#333">算过的存数组</text>
    <text x="232" y="170" text-anchor="middle" font-size="10" fill="#333">命中直接返回</text>
    <text x="232" y="195" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">时间 O(n)</text>
    <text x="232" y="212" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">空间 O(n)</text>
    <text x="232" y="222" text-anchor="middle" font-size="9" fill="#999">备忘录+栈</text>
  </g>

  <!-- arrow 2->3 -->
  <path d="M 295 155 L 320 155" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="307" y="146" text-anchor="middle" font-size="9" fill="#d6a040">反转方向</text>

  <!-- ===== Stage 3: 自底向上 DP ===== -->
  <g filter="url(#rough2)">
    <rect x="325" y="80" width="115" height="150" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8"/>
    <text x="382" y="105" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">③ 自底向上 DP</text>
    <line x1="340" y1="115" x2="425" y2="115" stroke="#88a0c0" stroke-width="1"/>
    <text x="382" y="138" text-anchor="middle" font-size="10" fill="#333">去掉递归</text>
    <text x="382" y="155" text-anchor="middle" font-size="10" fill="#333">从小到大填表</text>
    <text x="382" y="170" text-anchor="middle" font-size="10" fill="#333">t[i]=前三项和</text>
    <text x="382" y="195" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">时间 O(n)</text>
    <text x="382" y="212" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">空间 O(n)</text>
    <text x="382" y="222" text-anchor="middle" font-size="9" fill="#999">DP 数组</text>
  </g>

  <!-- arrow 3->4 -->
  <path d="M 445 155 L 470 155" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="457" y="146" text-anchor="middle" font-size="9" fill="#d6a040">滚动</text>

  <!-- ===== Stage 4: 三变量滚动 ===== -->
  <g filter="url(#rough2)">
    <rect x="475" y="80" width="60" height="150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
    <text x="505" y="105" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">④ 三变量</text>
    <text x="505" y="120" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">滚动</text>
    <line x1="485" y1="128" x2="525" y2="128" stroke="#a0c0a0" stroke-width="1"/>
    <text x="505" y="148" text-anchor="middle" font-size="10" fill="#333">留 3 变量</text>
    <text x="505" y="165" text-anchor="middle" font-size="10" fill="#333">p1/p2/p3</text>
    <text x="505" y="195" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">时间 O(n)</text>
    <text x="505" y="212" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">空间 O(1)</text>
  </g>

  <!-- ===== bottom note ===== -->
  <rect x="25" y="260" width="510" height="78" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="280" y="284" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">DP 的本质 = 递归 + 记忆化（与 509 完全同构）</text>
  <text x="280" y="304" text-anchor="middle" font-size="10" fill="#666">① 暴露「重叠子问题」 → ② 备忘录剪重复 → ③ 递归改循环（自底向上） → ④ 压缩不再需要的历史状态</text>
  <text x="280" y="322" text-anchor="middle" font-size="10" fill="#888">从①到④：时间 O(3ⁿ)→O(n)，空间 O(n)→O(1)。仅滚动变量从 2 个变 3 个，骨架不变</text>
</svg>
