<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">哈希表检测循环节：余数 → 首次位置</text>

  <!-- LEFT: hash map -->
  <text x="30" y="56" font-size="12" fill="#446688" font-weight="bold">哈希表 pos（余数 → 位置）</text>

  <rect x="30" y="66" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="83" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">余数 r</text>
  <rect x="114" y="66" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="154" y="83" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">位置 idx</text>

  <rect x="30" y="94" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="111" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">4</text>
  <rect x="114" y="94" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="154" y="111" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>

  <rect x="30" y="122" width="80" height="24" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="139" text-anchor="middle" font-size="12" fill="#333">40</text>
  <rect x="114" y="122" width="80" height="24" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="154" y="139" text-anchor="middle" font-size="12" fill="#333">1</text>

  <rect x="30" y="150" width="80" height="24" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="167" text-anchor="middle" font-size="12" fill="#333">67</text>
  <rect x="114" y="150" width="80" height="24" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="154" y="167" text-anchor="middle" font-size="12" fill="#333">2</text>

  <text x="30" y="196" font-size="11" fill="#888">第 4 次余数又得 4 →</text>
  <text x="30" y="212" font-size="11" fill="#b85450" font-weight="bold">命中 pos[4] = 0 ⚠</text>

  <!-- RIGHT: fraction digits -->
  <text x="300" y="56" font-size="12" fill="#4a7a3a" font-weight="bold">小数串 frac 与位置</text>

  <rect x="300" y="78" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="98" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="346" y="78" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="366" y="98" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="392" y="78" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="412" y="98" text-anchor="middle" font-size="13" fill="#333">2</text>

  <text x="320" y="124" text-anchor="middle" font-size="10" fill="#888">idx 0</text>
  <text x="366" y="124" text-anchor="middle" font-size="10" fill="#888">idx 1</text>
  <text x="412" y="124" text-anchor="middle" font-size="10" fill="#888">idx 2</text>

  <!-- arrow from hash hit to position 0 -->
  <path d="M 200 110 Q 250 140 300 95" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="248" y="150" font-size="10" fill="#b85450">插 '(' 于 idx 0</text>

  <!-- after insertion -->
  <text x="300" y="158" font-size="12" fill="#4a7a3a" font-weight="bold">插入括号后：</text>
  <rect x="300" y="168" width="28" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="314" y="188" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">(</text>
  <rect x="332" y="168" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="349" y="188" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="370" y="168" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="387" y="188" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="408" y="168" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="425" y="188" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="446" y="168" width="28" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="460" y="188" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">)</text>

  <!-- final result -->
  <rect x="40" y="220" width="460" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="248" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">拼接：整数 "0" + "." + "(012)" → "0.(012)"</text>

  <!-- bottom note -->
  <rect x="40" y="282" width="460" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="304" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">模板：哈希表存「余数 → 当前小数长度」</text>
  <text x="270" y="322" text-anchor="middle" font-size="11" fill="#555">余数再次出现时，从其记录位置插入 '('，末尾补 ')' 即可</text>
</svg>
