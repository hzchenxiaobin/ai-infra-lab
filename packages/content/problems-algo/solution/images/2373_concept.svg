<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：3×3 窗口最大值 → 输出[i][j]，中心落在 (i+1, j+1)</text>

  <!-- ============ Input grid 4x4 (example 1) ============ -->
  <!-- origin x=40 y=64, cell size 42 -->
  <text x="124" y="58" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">grid (n×n)</text>

  <!-- column index ticks (top) -->
  <g font-size="10" fill="#aaa" filter="url(#rough2)">
    <text x="61"  y="62" text-anchor="middle">0</text>
    <text x="103" y="62" text-anchor="middle">1</text>
    <text x="145" y="62" text-anchor="middle">2</text>
    <text x="187" y="62" text-anchor="middle">3</text>
  </g>
  <!-- row index ticks (left) -->
  <g font-size="10" fill="#aaa" filter="url(#rough2)">
    <text x="32" y="89"  text-anchor="end">0</text>
    <text x="32" y="131" text-anchor="end">1</text>
    <text x="32" y="173" text-anchor="end">2</text>
    <text x="32" y="215" text-anchor="end">3</text>
  </g>

  <!-- 4x4 grid cells -->
  <g filter="url(#rough2)">
    <!-- Row 0: 9 9 8 1 -->
    <rect x="40"  y="68" width="42" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3"/>
    <text x="61"  y="95" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">9</text>
    <rect x="82"  y="68" width="42" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3"/>
    <text x="103" y="95" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">9</text>
    <rect x="124" y="68" width="42" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3"/>
    <text x="145" y="95" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">8</text>
    <rect x="166" y="68" width="42" height="42" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="187" y="95" text-anchor="middle" font-size="15" fill="#999">1</text>
    <!-- Row 1: 5 6 2 6 -->
    <rect x="40"  y="110" width="42" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3"/>
    <text x="61"  y="137" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">5</text>
    <!-- center cell (1,1)=6 : emphasized -->
    <rect x="82"  y="110" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2.4" rx="3"/>
    <text x="103" y="137" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">6</text>
    <rect x="124" y="110" width="42" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3"/>
    <text x="145" y="137" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
    <rect x="166" y="110" width="42" height="42" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="187" y="137" text-anchor="middle" font-size="15" fill="#999">6</text>
    <!-- Row 2: 8 2 6 4 -->
    <rect x="40"  y="152" width="42" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3"/>
    <text x="61"  y="179" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">8</text>
    <rect x="82"  y="152" width="42" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3"/>
    <text x="103" y="179" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
    <rect x="124" y="152" width="42" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3"/>
    <text x="145" y="179" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">6</text>
    <rect x="166" y="152" width="42" height="42" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="187" y="179" text-anchor="middle" font-size="15" fill="#999">4</text>
    <!-- Row 3: 6 2 2 2  (outside this window) -->
    <rect x="40"  y="194" width="42" height="42" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="61"  y="221" text-anchor="middle" font-size="15" fill="#999">6</text>
    <rect x="82"  y="194" width="42" height="42" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="103" y="221" text-anchor="middle" font-size="15" fill="#999">2</text>
    <rect x="124" y="194" width="42" height="42" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="145" y="221" text-anchor="middle" font-size="15" fill="#999">2</text>
    <rect x="166" y="194" width="42" height="42" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="187" y="221" text-anchor="middle" font-size="15" fill="#999">2</text>
  </g>

  <!-- window bracket label -->
  <text x="124" y="254" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3×3 窗口：行 [i, i+2] × 列 [j, j+2]</text>
  <text x="124" y="270" text-anchor="middle" font-size="11" fill="#446688">中心格 (i+1, j+1) = (1,1)</text>

  <!-- arrow from window (right edge ~x=166,y=131) to output cell -->
  <path d="M 170 131 L 358 131" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="264" y="122" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">取 9 格最大</text>
  <text x="264" y="146" text-anchor="middle" font-size="11" fill="#888">max(9,9,8,5,6,2,8,2,6)</text>

  <!-- ============ Output grid 2x2 ============ -->
  <!-- origin x=360 y=92, cell size 44 -->
  <text x="404" y="84" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">maxLocal ((n−2)×(n−2))</text>

  <!-- output index ticks -->
  <g font-size="10" fill="#aaa" filter="url(#rough2)">
    <text x="382" y="88" text-anchor="middle">0</text>
    <text x="426" y="88" text-anchor="middle">1</text>
    <text x="354" y="117" text-anchor="end">0</text>
    <text x="354" y="161" text-anchor="end">1</text>
  </g>

  <g filter="url(#rough2)">
    <!-- (0,0)=9 highlighted (the result of the shown window) -->
    <rect x="360" y="92" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4"/>
    <text x="382" y="121" text-anchor="middle" font-size="17" fill="#b85450" font-weight="bold">9</text>
    <rect x="404" y="92" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="426" y="121" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">9</text>
    <rect x="360" y="136" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="382" y="165" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">8</text>
    <rect x="404" y="136" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="426" y="165" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">6</text>
  </g>

  <!-- highlight arrow target label -->
  <text x="382" y="200" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">↑ maxLocal[0][0]</text>

  <!-- ============ Formula box ============ -->
  <rect x="40" y="288" width="500" height="74" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="290" y="312" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">maxLocal[i][j] = max{ grid[r][c] : i ≤ r ≤ i+2,  j ≤ c ≤ j+2 }</text>
  <text x="290" y="334" text-anchor="middle" font-size="12" fill="#444">窗口恒为 3×3（常数 9 格）→ 每个输出格 O(9)=O(1)</text>
  <text x="290" y="352" text-anchor="middle" font-size="11" fill="#888">共 (n−2)² 个输出格，总复杂度 O(n²)</text>
</svg>
