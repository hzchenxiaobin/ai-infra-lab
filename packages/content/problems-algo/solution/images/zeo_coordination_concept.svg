<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L8,0 L4,8 Z" fill="#888"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L8,0 L4,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">三轮流：turn 状态机协调三个线程</text>

  <!-- shared turn box -->
  <rect x="230" y="48" width="100" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="11" fill="#333">共享变量 turn</text>
  <text x="280" y="80" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0 / 1 / 2</text>

  <!-- three thread boxes -->
  <rect x="40" y="120" width="120" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="100" y="142" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">Thread A</text>
  <text x="100" y="160" text-anchor="middle" font-size="11" fill="#446688">zero() : turn==0</text>

  <rect x="220" y="120" width="120" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="142" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">Thread C</text>
  <text x="280" y="160" text-anchor="middle" font-size="11" fill="#4a7a3a">odd() : turn==1</text>

  <rect x="400" y="120" width="120" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="460" y="142" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">Thread B</text>
  <text x="460" y="160" text-anchor="middle" font-size="11" fill="#b85450">even() : turn==2</text>

  <!-- arrows from turn to each thread -->
  <path d="M 255 88 L 110 118" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 280 88 L 280 118" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 305 88 L 450 118" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- timeline title -->
  <text x="280" y="205" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">输出时间线（n = 5）</text>

  <!-- timeline boxes -->
  <rect x="30" y="222" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="54" y="247" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>

  <rect x="84" y="222" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="108" y="247" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <rect x="138" y="222" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="162" y="247" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>

  <rect x="192" y="222" width="48" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="216" y="247" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>

  <rect x="246" y="222" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="247" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>

  <rect x="300" y="222" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="324" y="247" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>

  <rect x="354" y="222" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="378" y="247" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>

  <rect x="408" y="222" width="48" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="432" y="247" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>

  <rect x="462" y="222" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="486" y="247" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>

  <rect x="516" y="222" width="30" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="531" y="247" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>

  <!-- arrows between timeline steps -->
  <path d="M 78 242 L 82 242" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 132 242 L 136 242" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 186 242 L 190 242" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 240 242 L 244 242" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 294 242 L 298 242" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 348 242 L 352 242" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 402 242 L 406 242" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 456 242 L 460 242" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 510 242 L 514 242" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- explanation box -->
  <rect x="40" y="290" width="480" height="92" fill="#e8f0fe" fill-opacity="0.4" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="312" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">核心：turn 充当「令牌」，谁拿到令牌谁打印</text>
  <text x="60" y="332" font-size="11" fill="#333">• turn==0：A 打印 0，再把令牌交给下一个数（奇→C / 偶→B）</text>
  <text x="60" y="350" font-size="11" fill="#333">• turn==1：C 打印奇数，打印完交还令牌给 A（turn=0）</text>
  <text x="60" y="368" font-size="11" fill="#333">• turn==2：B 打印偶数，打印完交还令牌给 A（turn=0）</text>
</svg>
