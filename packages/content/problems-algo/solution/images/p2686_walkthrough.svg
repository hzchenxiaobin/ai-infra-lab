<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 9 4 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：10 行 → 按 order_date 分 4 组 → 各组算即时占比</text>

  <!-- ===== Group 1: 08-01 ===== -->
  <rect x="20" y="40" width="520" height="82" fill="#f7f7f7" stroke="#ccc" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="35" y="60" font-size="11" fill="#446688" font-weight="bold">08-01 组（3 行）</text>

  <text x="35" y="80" font-size="10" fill="#666">#1 计划 (0)　#2 即时 (1)　#3 即时 (1)</text>
  <text x="35" y="98" font-size="10" fill="#999">布尔序列: [0, 1, 1]</text>
  <text x="260" y="80" font-size="10" fill="#4a7a3a" font-weight="bold">AVG = (0+1+1)/3 = 2/3 = 0.6667</text>
  <text x="260" y="98" font-size="10" fill="#4a7a3a" font-weight="bold">×100 → ROUND → 66.67</text>

  <rect x="430" y="52" width="96" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="478" y="70" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">66.67</text>

  <!-- ===== Group 2: 08-02 ===== -->
  <rect x="20" y="130" width="520" height="82" fill="#f7f7f7" stroke="#ccc" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="35" y="150" font-size="11" fill="#446688" font-weight="bold">08-02 组（3 行）</text>

  <text x="35" y="170" font-size="10" fill="#666">#4 计划 (0)　#5 即时 (1)　#6 即时 (1)</text>
  <text x="35" y="188" font-size="10" fill="#999">布尔序列: [0, 1, 1]</text>
  <text x="260" y="170" font-size="10" fill="#4a7a3a" font-weight="bold">AVG = (0+1+1)/3 = 2/3 = 0.6667</text>
  <text x="260" y="188" font-size="10" fill="#4a7a3a" font-weight="bold">×100 → ROUND → 66.67</text>

  <rect x="430" y="142" width="96" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="478" y="160" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">66.67</text>

  <!-- ===== Group 3: 08-03 ===== -->
  <rect x="20" y="220" width="520" height="82" fill="#f7f7f7" stroke="#ccc" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="35" y="240" font-size="11" fill="#446688" font-weight="bold">08-03 组（2 行）</text>

  <text x="35" y="260" font-size="10" fill="#666">#7 即时 (1)　#8 即时 (1)</text>
  <text x="35" y="278" font-size="10" fill="#999">布尔序列: [1, 1]</text>
  <text x="260" y="260" font-size="10" fill="#4a7a3a" font-weight="bold">AVG = (1+1)/2 = 2/2 = 1.0</text>
  <text x="260" y="278" font-size="10" fill="#4a7a3a" font-weight="bold">×100 → ROUND → 100.00</text>

  <rect x="430" y="232" width="96" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="478" y="250" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">100.00</text>

  <!-- ===== Group 4: 08-04 ===== -->
  <rect x="20" y="310" width="520" height="82" fill="#f7f7f7" stroke="#ccc" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="35" y="330" font-size="11" fill="#b85450" font-weight="bold">08-04 组（2 行）</text>

  <text x="35" y="350" font-size="10" fill="#666">#9 计划 (0)　#10 计划 (0)</text>
  <text x="35" y="368" font-size="10" fill="#999">布尔序列: [0, 0]</text>
  <text x="260" y="350" font-size="10" fill="#b85450" font-weight="bold">AVG = (0+0)/2 = 0/2 = 0.0</text>
  <text x="260" y="368" font-size="10" fill="#b85450" font-weight="bold">×100 → ROUND → 0.00</text>

  <rect x="430" y="322" width="96" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="478" y="340" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0.00</text>

  <!-- Bottom note -->
  <rect x="30" y="400" width="500" height="14" fill="none"/>
  <text x="280" y="412" text-anchor="middle" font-size="9" fill="#666">ROUND 四舍五入：2/3×100 = 66.667 → 66.67（非 66.66）；ORDER BY order_date 升序输出 4 行</text>
</svg>
