<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="6" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arob" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c98a2b"/>
    </marker>
  </defs>

  <rect width="720" height="460" fill="#fdfcf7"/>

  <text x="360" y="32" text-anchor="middle" font-size="18" fill="#2b2b2b" font-weight="bold">最大整除子集：DP 填表与前驱回溯</text>
  <path d="M 230 42 Q 360 50 490 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="360" y="56" text-anchor="middle" font-size="11" fill="#888">nums = [1,2,4,8]（已升序）　dp[i]=以 nums[i] 结尾的最长整除链长度</text>

  <!-- nums 行 -->
  <text x="50" y="92" font-size="12" fill="#888" font-weight="bold">nums</text>
  <g filter="url(#sk)">
    <rect x="120" y="76" width="80" height="32" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" rx="4"/>
    <rect x="200" y="76" width="80" height="32" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" rx="4"/>
    <rect x="280" y="76" width="80" height="32" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" rx="4"/>
    <rect x="360" y="76" width="80" height="32" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" rx="4"/>
  </g>
  <text x="160" y="97" text-anchor="middle" font-size="14" fill="#2b2b2b">1</text>
  <text x="240" y="97" text-anchor="middle" font-size="14" fill="#2b2b2b">2</text>
  <text x="320" y="97" text-anchor="middle" font-size="14" fill="#2b2b2b">4</text>
  <text x="400" y="97" text-anchor="middle" font-size="14" fill="#2b2b2b">8</text>

  <!-- i 行 -->
  <text x="50" y="128" font-size="11" fill="#888">i</text>
  <text x="160" y="128" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="240" y="128" text-anchor="middle" font-size="11" fill="#888">1</text>
  <text x="320" y="128" text-anchor="middle" font-size="11" fill="#888">2</text>
  <text x="400" y="128" text-anchor="middle" font-size="11" fill="#888">3</text>

  <!-- dp 行 -->
  <text x="50" y="162" font-size="12" fill="#888" font-weight="bold">dp[i]</text>
  <g filter="url(#sk)">
    <rect x="120" y="146" width="80" height="32" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" rx="4"/>
    <rect x="200" y="146" width="80" height="32" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" rx="4"/>
    <rect x="280" y="146" width="80" height="32" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" rx="4"/>
    <rect x="360" y="146" width="80" height="32" fill="#fef6e6" stroke="#c98a2b" stroke-width="2" rx="4"/>
  </g>
  <text x="160" y="167" text-anchor="middle" font-size="14" fill="#2b2b2b">1</text>
  <text x="240" y="167" text-anchor="middle" font-size="14" fill="#4a8e4a" font-weight="bold">2</text>
  <text x="320" y="167" text-anchor="middle" font-size="14" fill="#4a8e4a" font-weight="bold">3</text>
  <text x="400" y="167" text-anchor="middle" font-size="14" fill="#c98a2b" font-weight="bold">4</text>

  <!-- prev 行 -->
  <text x="50" y="202" font-size="12" fill="#888" font-weight="bold">prev[i]</text>
  <g filter="url(#sk)">
    <rect x="120" y="186" width="80" height="32" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" rx="4"/>
    <rect x="200" y="186" width="80" height="32" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" rx="4"/>
    <rect x="280" y="186" width="80" height="32" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" rx="4"/>
    <rect x="360" y="186" width="80" height="32" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" rx="4"/>
  </g>
  <text x="160" y="207" text-anchor="middle" font-size="13" fill="#888">-1</text>
  <text x="240" y="207" text-anchor="middle" font-size="13" fill="#2b2b2b">0</text>
  <text x="320" y="207" text-anchor="middle" font-size="13" fill="#2b2b2b">1</text>
  <text x="400" y="207" text-anchor="middle" font-size="13" fill="#2b2b2b">2</text>

  <!-- best 标注 -->
  <text x="460" y="167" font-size="12" fill="#c98a2b" font-weight="bold">← best</text>
  <text x="460" y="207" font-size="11" fill="#888">(dp 最大)</text>

  <!-- 转移说明 -->
  <g filter="url(#sk)">
    <rect x="40" y="236" width="640" height="100" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5,3"/>
  </g>
  <text x="60" y="260" font-size="12" fill="#2b2b2b" font-weight="bold">转移：dp[i] = max(dp[j]+1)，对所有 j&lt;i 且 nums[i] % nums[j] == 0</text>
  <text x="60" y="282" font-size="11" fill="#444">i=1 (2)：j=0, 2%1=0 ✓ → dp[1]=dp[0]+1=2, prev[1]=0</text>
  <text x="60" y="300" font-size="11" fill="#444">i=2 (4)：j=0, 4%1=0 ✓；j=1, 4%2=0 ✓ 且 dp[1]+1=3 更优 → dp[2]=3, prev[2]=1</text>
  <text x="60" y="318" font-size="11" fill="#444">i=3 (8)：j=2, 8%4=0 ✓ 且 dp[2]+1=4 最优 → dp[3]=4, prev[3]=2</text>

  <!-- 回溯链 -->
  <text x="60" y="362" font-size="13" fill="#c98a2b" font-weight="bold">回溯：best=3 → prev[3]=2 → prev[2]=1 → prev[1]=0 → prev[0]=-1 停</text>
  <g filter="url(#sk)">
    <rect x="120" y="376" width="60" height="30" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6" rx="4"/>
    <rect x="200" y="376" width="60" height="30" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6" rx="4"/>
    <rect x="280" y="376" width="60" height="30" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6" rx="4"/>
    <rect x="360" y="376" width="60" height="30" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6" rx="4"/>
  </g>
  <text x="150" y="396" text-anchor="middle" font-size="13" fill="#2b2b2b">1</text>
  <text x="230" y="396" text-anchor="middle" font-size="13" fill="#2b2b2b">2</text>
  <text x="310" y="396" text-anchor="middle" font-size="13" fill="#2b2b2b">4</text>
  <text x="390" y="396" text-anchor="middle" font-size="13" fill="#2b2b2b">8</text>

  <!-- 回溯箭头（从右往左） -->
  <path d="M 360 391 L 340 391" stroke="#c98a2b" stroke-width="1.6" marker-end="url(#arob)" filter="url(#sk)"/>
  <path d="M 280 391 L 260 391" stroke="#c98a2b" stroke-width="1.6" marker-end="url(#arob)" filter="url(#sk)"/>
  <path d="M 200 391 L 180 391" stroke="#c98a2b" stroke-width="1.6" marker-end="url(#arob)" filter="url(#sk)"/>
  <text x="450" y="396" font-size="12" fill="#c98a2b" font-weight="bold">→ [1,2,4,8] ✓</text>

  <text x="360" y="440" text-anchor="middle" font-size="11" fill="#888">时间 O(n²)，空间 O(n)；prev 链回溯还原具体子集</text>
</svg>
