<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：三个判断 O(1) 收工 —— 无需建网格</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">可达性已被归纳证明压缩成 3 种尺寸，剩下的只是「查表」</text>

  <!-- 开始 -->
  <g filter="url(#rough2)">
    <rect x="48" y="54" width="144" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="120" y="72" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">开始：读入 m, n</text>
    <text x="120" y="87" text-anchor="middle" font-size="8.5" fill="#666">(1 ≤ m, n ≤ 10⁶)</text>
  </g>
  <path d="M 120 94 L 120 112" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定 1 -->
  <polygon points="120,114 190,150 120,186 50,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="145" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">m == 1</text>
  <text x="120" y="161" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">且 n == 1 ?</text>

  <path d="M 190 150 L 244 150" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="216" y="143" text-anchor="middle" font-size="9.5" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">是</text>

  <g filter="url(#rough2)">
    <rect x="248" y="122" width="244" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="370" y="141" text-anchor="middle" font-size="12.5" fill="#2a5a2a" font-weight="bold">return 1</text>
    <text x="370" y="157" text-anchor="middle" font-size="9.5" fill="#333">起点即终点，只付 (0,0) 入场费</text>
    <text x="370" y="171" text-anchor="middle" font-size="9" fill="#666">(0+1)×(0+1) = 1</text>
  </g>

  <path d="M 120 186 L 120 212" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="128" y="203" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- 判定 2 -->
  <polygon points="120,214 196,250 120,286 44,250" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="245" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">(m,n) = (1,2)</text>
  <text x="120" y="261" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">或 (2,1) ?</text>

  <path d="M 196 250 L 244 250" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="221" y="243" text-anchor="middle" font-size="9.5" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">是</text>

  <g filter="url(#rough2)">
    <rect x="248" y="222" width="244" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="370" y="241" text-anchor="middle" font-size="12.5" fill="#2a5a2a" font-weight="bold">return 3</text>
    <text x="370" y="257" text-anchor="middle" font-size="9.5" fill="#333">入场 1 + 一步到隔壁 2</text>
    <text x="370" y="271" text-anchor="middle" font-size="9" fill="#666">(0,0)→(0,1) 或 (0,0)→(1,0)：1+2</text>
  </g>

  <path d="M 120 286 L 120 308" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="128" y="302" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- 兜底 -->
  <g filter="url(#rough2)">
    <rect x="48" y="312" width="144" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
    <text x="120" y="331" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">return −1</text>
    <text x="120" y="347" text-anchor="middle" font-size="9.5" fill="#333">目标不在可达集合内</text>
  </g>

  <!-- 侧注 -->
  <g filter="url(#rough2)">
    <rect x="248" y="296" width="244" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="5,3" rx="8"/>
    <text x="370" y="314" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold">为什么敢直接判？</text>
    <text x="370" y="331" text-anchor="middle" font-size="9.5" fill="#333">「偶数步必回 (0,0)」的归纳证明</text>
    <text x="370" y="347" text-anchor="middle" font-size="9.5" fill="#333">已把可达性收拢成 3 种尺寸 ⇒ O(1)</text>
  </g>
</svg>
