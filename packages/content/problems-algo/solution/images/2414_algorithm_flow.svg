<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6" fill="none" stroke="#446688" stroke-width="1.4"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6" fill="none" stroke="#b85450" stroke-width="1.4"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6" fill="none" stroke="#4a7a3a" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect width="520" height="470" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：单趟遍历，维护 cur 与 ans</text>

  <!-- Start oval -->
  <rect x="200" y="38" width="120" height="36" rx="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="61" text-anchor="middle" font-size="12" fill="#333">cur=1, ans=1, i=1</text>

  <!-- arrow down to diamond1 -->
  <path d="M 260 74 L 260 96" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond1: i < n ?  center (260,132) ; points top,right,bottom,left -->
  <polygon points="260,96 332,132 260,168 188,132" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="136" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i &lt; n ?</text>

  <!-- No branch: right to return oval -->
  <path d="M 332 132 L 380 132" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="356" y="124" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <rect x="380" y="114" width="120" height="36" rx="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="440" y="137" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return ans</text>

  <!-- Yes branch: down to diamond2 -->
  <path d="M 260 168 L 260 196" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="186" font-size="10" fill="#4a7a3a">是</text>

  <!-- Diamond2: s[i]==s[i-1]+1 ? center (260,240) -->
  <polygon points="260,196 352,240 260,284 168,240" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="236" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">s[i] ==</text>
  <text x="260" y="250" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">s[i-1]+1 ?</text>

  <!-- Yes: left to cur+=1 -->
  <path d="M 168 240 L 150 240" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="158" y="232" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>
  <rect x="50" y="222" width="100" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="100" y="245" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">cur += 1</text>

  <!-- No: right to cur=1 -->
  <path d="M 352 240 L 370 240" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="360" y="232" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <rect x="370" y="222" width="100" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="420" y="245" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">cur = 1</text>

  <!-- merge arrows to "ans=max(ans,cur)" rect -->
  <path d="M 100 258 L 100 330 L 210 330" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 420 258 L 420 330 L 310 330" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="210" y="312" width="100" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="335" text-anchor="middle" font-size="11" fill="#333">ans=max(ans,cur)</text>

  <!-- arrow down to i+=1 -->
  <path d="M 260 348 L 260 378" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="210" y="378" width="100" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="401" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i += 1</text>

  <!-- loop back: down, left, up, right to diamond1 left point (188,132) -->
  <path d="M 260 414 L 260 432 L 40 432 L 40 132 L 188 132" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="28" y="286" text-anchor="middle" font-size="11" fill="#888" transform="rotate(-90 28 286)">循环回 i&lt;n ?</text>
</svg>
