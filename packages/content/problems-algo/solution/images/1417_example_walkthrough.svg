<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L8 5 L0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：三类典型情形</text>

  <!-- 示例1 -->
  <text x="40" y="60" font-size="12" fill="#b85450" font-weight="bold">示例1</text>
  <text x="40" y="78" font-size="11" fill="#666" filter="url(#rough2)">s = "a0b1c2"</text>
  <g filter="url(#rough2)">
    <text x="40" y="98" font-size="11" fill="#446688" font-weight="bold">字母 [a,b,c] cL=3</text>
    <text x="40" y="114" font-size="11" fill="#4a7a3a" font-weight="bold">数字 [0,1,2] cD=3</text>
    <text x="220" y="106" font-size="11" fill="#d6a040" font-weight="bold">|3−3|=0 ≤1 ✓</text>
    <text x="220" y="122" font-size="11" fill="#666">相等 → 字母开头</text>
  </g>
  <!-- 交错过程 -->
  <g filter="url(#rough2)">
    <rect x="40" y="128" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="51" y="143" text-anchor="middle" font-size="11" fill="#333">a</text>
    <rect x="62" y="128" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="73" y="143" text-anchor="middle" font-size="11" fill="#333">0</text>
    <rect x="84" y="128" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="95" y="143" text-anchor="middle" font-size="11" fill="#333">b</text>
    <rect x="106" y="128" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="117" y="143" text-anchor="middle" font-size="11" fill="#333">1</text>
    <rect x="128" y="128" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="139" y="143" text-anchor="middle" font-size="11" fill="#333">c</text>
    <rect x="150" y="128" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="161" y="143" text-anchor="middle" font-size="11" fill="#333">2</text>
  </g>
  <text x="190" y="143" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ "a0b1c2"</text>

  <line x1="40" y1="162" x2="520" y2="162" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- 示例5 -->
  <text x="40" y="184" font-size="12" fill="#b85450" font-weight="bold">示例5</text>
  <text x="40" y="202" font-size="11" fill="#666" filter="url(#rough2)">s = "ab123"</text>
  <g filter="url(#rough2)">
    <text x="40" y="222" font-size="11" fill="#446688" font-weight="bold">字母 [a,b] cL=2</text>
    <text x="40" y="238" font-size="11" fill="#4a7a3a" font-weight="bold">数字 [1,2,3] cD=3</text>
    <text x="220" y="230" font-size="11" fill="#d6a040" font-weight="bold">|2−3|=1 ≤1 ✓</text>
    <text x="220" y="246" font-size="11" fill="#666">数字多 → 数字开头</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="40" y="252" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3"/>
    <text x="51" y="267" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
    <rect x="62" y="252" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="73" y="267" text-anchor="middle" font-size="11" fill="#333">a</text>
    <rect x="84" y="252" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="95" y="267" text-anchor="middle" font-size="11" fill="#333">2</text>
    <rect x="106" y="252" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="117" y="267" text-anchor="middle" font-size="11" fill="#333">b</text>
    <rect x="128" y="252" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3"/>
    <text x="139" y="267" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  </g>
  <text x="170" y="267" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ "1a2b3"</text>

  <line x1="40" y1="286" x2="520" y2="286" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- 示例4 -->
  <text x="40" y="308" font-size="12" fill="#b85450" font-weight="bold">示例4</text>
  <text x="40" y="326" font-size="11" fill="#666" filter="url(#rough2)">s = "covid2019"</text>
  <g filter="url(#rough2)">
    <text x="40" y="346" font-size="11" fill="#446688" font-weight="bold">字母 [c,o,v,i,d] cL=5</text>
    <text x="40" y="362" font-size="11" fill="#4a7a3a" font-weight="bold">数字 [2,0,1,9] cD=4</text>
    <text x="260" y="354" font-size="11" fill="#d6a040" font-weight="bold">|5−4|=1 ≤1 ✓</text>
    <text x="260" y="370" font-size="11" fill="#666">字母多 → 字母开头</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="40" y="376" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="50" y="390" text-anchor="middle" font-size="10" fill="#333">c</text>
    <rect x="60" y="376" width="20" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="70" y="390" text-anchor="middle" font-size="10" fill="#333">2</text>
    <rect x="80" y="376" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="90" y="390" text-anchor="middle" font-size="10" fill="#333">o</text>
    <rect x="100" y="376" width="20" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="110" y="390" text-anchor="middle" font-size="10" fill="#333">0</text>
    <rect x="120" y="376" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="130" y="390" text-anchor="middle" font-size="10" fill="#333">v</text>
    <rect x="140" y="376" width="20" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="150" y="390" text-anchor="middle" font-size="10" fill="#333">1</text>
    <rect x="160" y="376" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="170" y="390" text-anchor="middle" font-size="10" fill="#333">i</text>
    <rect x="180" y="376" width="20" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="190" y="390" text-anchor="middle" font-size="10" fill="#333">9</text>
    <rect x="200" y="376" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="210" y="390" text-anchor="middle" font-size="10" fill="#333">d</text>
  </g>
  <text x="240" y="390" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ "c2o0v1i9d"</text>

  <!-- 不可行情形 -->
  <line x1="40" y1="406" x2="520" y2="406" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="426" font-size="11" fill="#999" filter="url(#rough2)">s="leetcode": cL=8, cD=0, |8−0|=8 &gt; 1 → 返回 ""</text>
</svg>
