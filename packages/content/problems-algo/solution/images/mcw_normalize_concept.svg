<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">规范化三步：小写 → 标点变空格 → 按空格切单词</text>

  <!-- Step 0: raw paragraph -->
  <rect x="40" y="48" width="520" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="68" font-size="11" fill="#d6a040" font-weight="bold">① 原始 paragraph：</text>
  <text x="60" y="86" font-size="11" fill="#333">"Bob hit a ball, the hit BALL flew far after it was hit."</text>

  <!-- arrow down -->
  <path d="M 300 96 L 300 120" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="312" y="114" font-size="11" fill="#4a7a3a">lower()</text>

  <!-- Step 1: lowercase -->
  <rect x="40" y="126" width="520" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="146" font-size="11" fill="#446688" font-weight="bold">② 全部小写：</text>
  <text x="60" y="164" font-size="11" fill="#333">"bob hit a ball, the hit ball flew far after it was hit."</text>

  <!-- arrow down -->
  <path d="M 300 174 L 300 198" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="312" y="192" font-size="11" fill="#4a7a3a">非字母 → 空格</text>

  <!-- Step 2: punctuation to space -->
  <rect x="40" y="204" width="520" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="224" font-size="11" fill="#446688" font-weight="bold">③ 标点替换为空格：</text>
  <text x="60" y="244" font-size="11" fill="#333">"bob hit a ball  the hit ball flew far after it was hit "</text>
  <text x="430" y="244" font-size="11" fill="#b85450" font-weight="bold">逗号/句号→空格</text>

  <!-- arrow down -->
  <path d="M 300 256 L 300 280" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="312" y="274" font-size="11" fill="#4a7a3a">split()</text>

  <!-- Step 3: word list -->
  <rect x="40" y="286" width="520" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="306" font-size="11" fill="#4a7a3a" font-weight="bold">④ 切出的单词序列：</text>
  <text x="60" y="326" font-size="11" fill="#333">bob, hit, a, ball, the, hit, ball, flew, far, after, it, was, hit</text>
  <text x="60" y="344" font-size="10" fill="#888">空串被 split 自动丢弃，连续空格只产生一个分隔</text>

  <!-- key insight -->
  <rect x="40" y="368" width="520" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="60" y="390" font-size="12" fill="#b85450" font-weight="bold">核心定义：单词 = 字母组成的连续序列</text>
  <text x="60" y="408" font-size="11" fill="#333">把「非字母字符」统一视作分隔符，等价于 split 出纯字母单词；</text>
  <text x="60" y="422" font-size="11" fill="#333">小写化保证 Bob/BALL/bob 视作同一词，哈希计数才正确聚合。</text>
</svg>
