<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="470" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：n = 4, k = 11（迭代 + 取反标志）</text>
  <text x="290" y="48" text-anchor="middle" font-size="11" fill="#888">S₄ = 0111001 1 0110001，第 11 位 = '1'</text>

  <!-- ===== header row ===== -->
  <g font-size="11" fill="#666" font-weight="bold">
    <text x="40" y="86" text-anchor="middle" filter="url(#rough2)">步骤</text>
    <text x="100" y="86" text-anchor="middle" filter="url(#rough2)">n</text>
    <text x="150" y="86" text-anchor="middle" filter="url(#rough2)">k</text>
    <text x="210" y="86" text-anchor="middle" filter="url(#rough2)">m=2^(n−1)</text>
    <text x="300" y="86" text-anchor="middle" filter="url(#rough2)">判定</text>
    <text x="390" y="86" text-anchor="middle" filter="url(#rough2)">新 k</text>
    <text x="470" y="86" text-anchor="middle" filter="url(#rough2)">flip 累计</text>
  </g>
  <line x1="20" y1="94" x2="540" y2="94" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- ===== Step 1: n=4, k=11, m=8, k>m, new k=5, flip=ON ===== -->
  <g font-size="12" fill="#333">
    <text x="40" y="124" text-anchor="middle" filter="url(#rough2)">1</text>
    <text x="100" y="124" text-anchor="middle" font-weight="bold" filter="url(#rough2)">4</text>
    <rect x="134" y="110" width="32" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="150" y="126" text-anchor="middle" fill="#b85450" font-weight="bold" filter="url(#rough2)">11</text>
    <text x="210" y="124" text-anchor="middle" filter="url(#rough2)">8</text>
    <text x="300" y="124" text-anchor="middle" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">k &gt; m 右半</text>
    <text x="390" y="124" text-anchor="middle" fill="#4a7a3a" filter="url(#rough2)">16−11 = 5</text>
    <rect x="448" y="110" width="44" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="470" y="126" text-anchor="middle" fill="#b85450" font-weight="bold" filter="url(#rough2)">ON ✓</text>
  </g>

  <!-- arrow down -->
  <path d="M 290 134 L 290 148" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: n=3, k=5, m=4, k>m, new k=3, flip=OFF ===== -->
  <g font-size="12" fill="#333">
    <text x="40" y="178" text-anchor="middle" filter="url(#rough2)">2</text>
    <text x="100" y="178" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>
    <rect x="138" y="164" width="24" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="150" y="180" text-anchor="middle" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>
    <text x="210" y="178" text-anchor="middle" filter="url(#rough2)">4</text>
    <text x="300" y="178" text-anchor="middle" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">k &gt; m 右半</text>
    <text x="390" y="178" text-anchor="middle" fill="#4a7a3a" filter="url(#rough2)">8−5 = 3</text>
    <rect x="448" y="164" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="470" y="180" text-anchor="middle" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">OFF</text>
  </g>

  <path d="M 290 188 L 290 202" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: n=2, k=3, m=2, k>m, new k=1, flip=ON ===== -->
  <g font-size="12" fill="#333">
    <text x="40" y="232" text-anchor="middle" filter="url(#rough2)">3</text>
    <text x="100" y="232" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
    <rect x="138" y="218" width="24" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="150" y="234" text-anchor="middle" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
    <text x="210" y="232" text-anchor="middle" filter="url(#rough2)">2</text>
    <text x="300" y="232" text-anchor="middle" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">k &gt; m 右半</text>
    <text x="390" y="232" text-anchor="middle" fill="#4a7a3a" filter="url(#rough2)">4−3 = 1</text>
    <rect x="448" y="218" width="44" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="470" y="234" text-anchor="middle" fill="#b85450" font-weight="bold" filter="url(#rough2)">ON ✓</text>
  </g>

  <path d="M 290 242 L 290 256" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 4: n=1, k=1, base '0' ===== -->
  <g font-size="12" fill="#333">
    <text x="40" y="286" text-anchor="middle" filter="url(#rough2)">4</text>
    <text x="100" y="286" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
    <text x="150" y="286" text-anchor="middle" filter="url(#rough2)">1</text>
    <text x="210" y="286" text-anchor="middle" fill="#888" filter="url(#rough2)">—</text>
    <text x="300" y="286" text-anchor="middle" fill="#d6a040" font-weight="bold" filter="url(#rough2)">基例 n = 1</text>
    <text x="390" y="286" text-anchor="middle" fill="#888" filter="url(#rough2)">—</text>
    <text x="470" y="286" text-anchor="middle" fill="#333" filter="url(#rough2)">基值 '0'</text>
  </g>

  <line x1="20" y1="304" x2="540" y2="304" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- ===== unwind / result ===== -->
  <path d="M 290 314 L 290 332" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="336" width="460" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="290" y="360" text-anchor="middle" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">回溯取反：'0' —ON取反→ '1' —OFF→ '1' —ON取反→ '1'</text>
  <text x="290" y="380" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">最终结果 = '1' ✓</text>

  <!-- side note: mirror formula -->
  <rect x="60" y="408" width="460" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="290" y="428" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">右半映射：S_n 中位置 k ↔ S_{n−1} 中位置 (2ⁿ − k)，再取反</text>
  <text x="290" y="446" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（reverse 使下标镜像为 L−j+1，此处 L = 2ⁿ−1，化简得 2ⁿ−k）</text>
</svg>
