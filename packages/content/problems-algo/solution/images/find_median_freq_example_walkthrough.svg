<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：Numbers = {0:7, 1:1, 2:3, 3:1}，N=12，N/2=6</text>

  <!-- Table header -->
  <rect x="40" y="50" width="560" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="68" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">num</text>
  <text x="180" y="68" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">freq</text>
  <text x="290" y="68" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">a1(升序累计)</text>
  <text x="410" y="68" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">a2(降序累计)</text>
  <text x="540" y="68" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">a1≥6 且 a2≥6?</text>
  <line x1="135" y1="50" x2="135" y2="76" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="225" y1="50" x2="225" y2="76" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="355" y1="50" x2="355" y2="76" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="475" y1="50" x2="475" y2="76" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Row 0 -->
  <rect x="40" y="76" width="560" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="90" y="94" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <text x="180" y="94" text-anchor="middle" font-size="11" fill="#333">7</text>
  <text x="290" y="94" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">7</text>
  <text x="410" y="94" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">12</text>
  <text x="540" y="94" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓ ✓ → 中位数</text>
  <line x1="135" y1="76" x2="135" y2="104" stroke="#888" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="225" y1="76" x2="225" y2="104" stroke="#888" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="355" y1="76" x2="355" y2="104" stroke="#888" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="475" y1="76" x2="475" y2="104" stroke="#888" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- Row 1 -->
  <rect x="40" y="104" width="560" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="90" y="122" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="180" y="122" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="290" y="122" text-anchor="middle" font-size="11" fill="#446688">8 = 7+1</text>
  <text x="410" y="122" text-anchor="middle" font-size="11" fill="#b85450">5 = 1+1+3</text>
  <text x="540" y="122" text-anchor="middle" font-size="11" fill="#b85450">✓ ✗ → 排除</text>
  <line x1="135" y1="104" x2="135" y2="132" stroke="#888" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="225" y1="104" x2="225" y2="132" stroke="#888" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="355" y1="104" x2="355" y2="132" stroke="#888" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="475" y1="104" x2="475" y2="132" stroke="#888" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- Row 2 -->
  <rect x="40" y="132" width="560" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="90" y="150" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="180" y="150" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="290" y="150" text-anchor="middle" font-size="11" fill="#446688">11 = 8+3</text>
  <text x="410" y="150" text-anchor="middle" font-size="11" fill="#b85450">4 = 1+3</text>
  <text x="540" y="150" text-anchor="middle" font-size="11" fill="#b85450">✓ ✗ → 排除</text>
  <line x1="135" y1="132" x2="135" y2="160" stroke="#888" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="225" y1="132" x2="225" y2="160" stroke="#888" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="355" y1="132" x2="355" y2="160" stroke="#888" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="475" y1="132" x2="475" y2="160" stroke="#888" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- Row 3 -->
  <rect x="40" y="160" width="560" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="90" y="178" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="180" y="178" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="290" y="178" text-anchor="middle" font-size="11" fill="#446688">12 = 11+1</text>
  <text x="410" y="178" text-anchor="middle" font-size="11" fill="#b85450">1</text>
  <text x="540" y="178" text-anchor="middle" font-size="11" fill="#b85450">✓ ✗ → 排除</text>
  <line x1="135" y1="160" x2="135" y2="188" stroke="#888" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="225" y1="160" x2="225" y2="188" stroke="#888" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="355" y1="160" x2="355" y2="188" stroke="#888" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="475" y1="160" x2="475" y2="188" stroke="#888" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- expand sequence -->
  <path d="M320 196 L320 216" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="335" y="210" font-size="9.5" fill="#4a7a3a">展开核验</text>

  <rect x="40" y="222" width="560" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="60" y="240" font-size="10.5" fill="#555">展开序列（12 个）：</text>
  <text x="60" y="256" font-size="10.5" fill="#333">0,0,0,0,0,0,0, 1, 2,2,2, 3</text>
  <text x="360" y="246" font-size="9.5" fill="#b85450" font-weight="bold">位置 1..7 是 0</text>
  <text x="360" y="258" font-size="9.5" fill="#888">中位区间 6~7 均 = 0</text>

  <!-- verification box -->
  <rect x="40" y="280" width="560" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="304" font-size="11" fill="#333" font-weight="bold">核验 num=0 满足中位数定义：</text>
  <text x="60" y="324" font-size="10.5" fill="#555">• 「≤ 0 的出现次数」 = freq(0) = 7 ≥ N/2=6  ✓  （对应 a1=7）</text>
  <text x="60" y="342" font-size="10.5" fill="#555">• 「≥ 0 的出现次数」 = 7+1+3+1 = 12 ≥ N/2=6  ✓  （对应 a2=12）</text>
  <text x="60" y="360" font-size="10.5" fill="#555">• num=1 失败：「≥ 1 的出现次数」= 1+3+1 = 5 &lt; 6  （a2=5 &lt; 6）</text>
  <text x="60" y="378" font-size="10.5" fill="#4a7a3a">→ 唯一满足的是 num=0，AVG(0) = 0.000 ✓</text>

  <!-- odd/even note -->
  <rect x="40" y="400" width="560" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="60" y="420" font-size="10.5" fill="#555">奇偶泛化：N 为奇数时仅一行满足（中位数恰为正中元素）；</text>
  <text x="60" y="436" font-size="10.5" fill="#555">N 为偶数时若两个相邻 num 跨越正中分界，则两行同时满足，AVG 取均值。</text>
</svg>
