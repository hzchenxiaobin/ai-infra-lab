<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>

    <!-- reusable base grid: 6x6, cell=30, total 180x180 -->
    <g id="basegrid">
      <!-- row 0: all walls -->
      <rect x="0" y="0" width="30" height="30" fill="#5a5a5a" stroke="#3a3a3a" stroke-width="1"/>
      <rect x="30" y="0" width="30" height="30" fill="#5a5a5a" stroke="#3a3a3a" stroke-width="1"/>
      <rect x="60" y="0" width="30" height="30" fill="#5a5a5a" stroke="#3a3a3a" stroke-width="1"/>
      <rect x="90" y="0" width="30" height="30" fill="#5a5a5a" stroke="#3a3a3a" stroke-width="1"/>
      <rect x="120" y="0" width="30" height="30" fill="#5a5a5a" stroke="#3a3a3a" stroke-width="1"/>
      <rect x="150" y="0" width="30" height="30" fill="#5a5a5a" stroke="#3a3a3a" stroke-width="1"/>
      <!-- row 1: # T # # # # -->
      <rect x="0" y="30" width="30" height="30" fill="#5a5a5a" stroke="#3a3a3a" stroke-width="1"/>
      <rect x="30" y="30" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" stroke-dasharray="3 2"/>
      <rect x="60" y="30" width="30" height="30" fill="#5a5a5a" stroke="#3a3a3a" stroke-width="1"/>
      <rect x="90" y="30" width="30" height="30" fill="#5a5a5a" stroke="#3a3a3a" stroke-width="1"/>
      <rect x="120" y="30" width="30" height="30" fill="#5a5a5a" stroke="#3a3a3a" stroke-width="1"/>
      <rect x="150" y="30" width="30" height="30" fill="#5a5a5a" stroke="#3a3a3a" stroke-width="1"/>
      <!-- row 2: # . . . . # -->
      <rect x="0" y="60" width="30" height="30" fill="#5a5a5a" stroke="#3a3a3a" stroke-width="1"/>
      <rect x="30" y="60" width="30" height="30" fill="#fafafa" stroke="#cccccc" stroke-width="1"/>
      <rect x="60" y="60" width="30" height="30" fill="#fafafa" stroke="#cccccc" stroke-width="1"/>
      <rect x="90" y="60" width="30" height="30" fill="#fafafa" stroke="#cccccc" stroke-width="1"/>
      <rect x="120" y="60" width="30" height="30" fill="#fafafa" stroke="#cccccc" stroke-width="1"/>
      <rect x="150" y="60" width="30" height="30" fill="#5a5a5a" stroke="#3a3a3a" stroke-width="1"/>
      <!-- row 3: # . # # . # -->
      <rect x="0" y="90" width="30" height="30" fill="#5a5a5a" stroke="#3a3a3a" stroke-width="1"/>
      <rect x="30" y="90" width="30" height="30" fill="#fafafa" stroke="#cccccc" stroke-width="1"/>
      <rect x="60" y="90" width="30" height="30" fill="#5a5a5a" stroke="#3a3a3a" stroke-width="1"/>
      <rect x="90" y="90" width="30" height="30" fill="#5a5a5a" stroke="#3a3a3a" stroke-width="1"/>
      <rect x="120" y="90" width="30" height="30" fill="#fafafa" stroke="#cccccc" stroke-width="1"/>
      <rect x="150" y="90" width="30" height="30" fill="#5a5a5a" stroke="#3a3a3a" stroke-width="1"/>
      <!-- row 4: # . . . . # -->
      <rect x="0" y="120" width="30" height="30" fill="#5a5a5a" stroke="#3a3a3a" stroke-width="1"/>
      <rect x="30" y="120" width="30" height="30" fill="#fafafa" stroke="#cccccc" stroke-width="1"/>
      <rect x="60" y="120" width="30" height="30" fill="#fafafa" stroke="#cccccc" stroke-width="1"/>
      <rect x="90" y="120" width="30" height="30" fill="#fafafa" stroke="#cccccc" stroke-width="1"/>
      <rect x="120" y="120" width="30" height="30" fill="#fafafa" stroke="#cccccc" stroke-width="1"/>
      <rect x="150" y="120" width="30" height="30" fill="#5a5a5a" stroke="#3a3a3a" stroke-width="1"/>
      <!-- row 5: all walls -->
      <rect x="0" y="150" width="30" height="30" fill="#5a5a5a" stroke="#3a3a3a" stroke-width="1"/>
      <rect x="30" y="150" width="30" height="30" fill="#5a5a5a" stroke="#3a3a3a" stroke-width="1"/>
      <rect x="60" y="150" width="30" height="30" fill="#5a5a5a" stroke="#3a3a3a" stroke-width="1"/>
      <rect x="90" y="150" width="30" height="30" fill="#5a5a5a" stroke="#3a3a3a" stroke-width="1"/>
      <rect x="120" y="150" width="30" height="30" fill="#5a5a5a" stroke="#3a3a3a" stroke-width="1"/>
      <rect x="150" y="150" width="30" height="30" fill="#5a5a5a" stroke="#3a3a3a" stroke-width="1"/>
      <!-- target label T -->
      <text x="45" y="50" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040">T</text>
    </g>
  </defs>

  <rect width="760" height="600" fill="#fdfcf7"/>
  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例 1 演算：3 次推动将箱子推到目标</text>
  <path d="M 180 38 Q 380 44 580 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Grid 1: initial state ===== -->
  <text x="170" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#34506e">初始状态</text>
  <g filter="url(#sk2)" transform="translate(80, 84)">
    <use href="#basegrid"/>
    <!-- B at (2,3) -->
    <rect x="90" y="60" width="30" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <text x="105" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688">B</text>
    <!-- S at (4,4) -->
    <rect x="120" y="120" width="30" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="135" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a">S</text>
    <!-- player path: (4,4)->(3,4)->(2,4) -->
    <path d="M 135 135 L 135 105 L 135 80" stroke="#4a7a3a" stroke-width="2" fill="none" stroke-dasharray="5 3"/>
    <!-- push arrow: B left -->
    <path d="M 95 75 L 75 75" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arR)"/>
    <text x="85" y="68" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">推←</text>
  </g>
  <text x="170" y="282" text-anchor="middle" font-size="10" fill="#888">人走 (4,4)→(2,4)，推 B←</text>

  <!-- arrow grid1 -> grid2 -->
  <path d="M 270 170 L 320 170" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk2)"/>
  <text x="295" y="163" text-anchor="middle" font-size="9" fill="#888">推动 1</text>

  <!-- ===== Grid 2: after push 1 ===== -->
  <text x="550" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#34506e">推动 1 后</text>
  <g filter="url(#sk2)" transform="translate(460, 84)">
    <use href="#basegrid"/>
    <!-- B at (2,2) -->
    <rect x="60" y="60" width="30" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <text x="75" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688">B</text>
    <!-- S at (2,3) -->
    <rect x="90" y="60" width="30" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="105" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a">S</text>
    <!-- no walk needed, already at push position -->
    <!-- push arrow: B left -->
    <path d="M 65 75 L 45 75" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arR)"/>
    <text x="55" y="68" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">推←</text>
  </g>
  <text x="550" y="282" text-anchor="middle" font-size="10" fill="#888">人已在推位 (2,3)，推 B←</text>

  <!-- arrow grid2 -> grid3 (down) -->
  <path d="M 550 290 L 550 310 L 170 310 L 170 330" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk2)" stroke-dasharray="4 3"/>
  <text x="360" y="304" text-anchor="middle" font-size="9" fill="#888">推动 2</text>

  <!-- ===== Grid 3: after push 2 ===== -->
  <text x="170" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#34506e">推动 2 后</text>
  <g filter="url(#sk2)" transform="translate(80, 350)">
    <use href="#basegrid"/>
    <!-- B at (2,1) -->
    <rect x="30" y="60" width="30" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <text x="45" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688">B</text>
    <!-- S at (2,2) -->
    <rect x="60" y="60" width="30" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="75" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a">S</text>
    <!-- player path: long detour to (3,1) -->
    <path d="M 75 75 L 105 75 L 135 75 L 135 105 L 135 135 L 105 135 L 75 135 L 45 135 L 45 105"
          stroke="#4a7a3a" stroke-width="2" fill="none" stroke-dasharray="5 3"/>
    <!-- push position marker at (3,1) -->
    <rect x="30" y="90" width="30" height="30" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3 2"/>
    <text x="45" y="108" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">推位</text>
    <!-- push arrow: B up -->
    <path d="M 45 70 L 45 50" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arR)"/>
    <text x="62" y="60" font-size="9" fill="#b85450" font-weight="bold">推↑</text>
  </g>
  <text x="170" y="548" text-anchor="middle" font-size="10" fill="#888">人绕大圈到 (3,1)，推 B↑</text>

  <!-- arrow grid3 -> grid4 -->
  <path d="M 270 440 L 320 440" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk2)"/>
  <text x="295" y="433" text-anchor="middle" font-size="9" fill="#888">推动 3</text>

  <!-- ===== Grid 4: after push 3 (done) ===== -->
  <text x="550" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">推动 3 后 ⭐</text>
  <g filter="url(#sk2)" transform="translate(460, 350)">
    <use href="#basegrid"/>
    <!-- B at (1,1) = T, reached! -->
    <rect x="30" y="30" width="30" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="2.5"/>
    <text x="45" y="50" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688">B</text>
    <!-- star -->
    <text x="45" y="24" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">★</text>
    <!-- S at (2,1) -->
    <rect x="30" y="60" width="30" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="45" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a">S</text>
  </g>
  <text x="550" y="548" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">B 到达 T！答案 = 3</text>

  <!-- bottom summary -->
  <g filter="url(#sk2)">
    <rect x="80" y="566" width="600" height="28" rx="6" fill="#fffdf3" stroke="#c9a93a" stroke-width="1"/>
  </g>
  <text x="380" y="584" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">推动 1← · 推动 2← · 推动 3↑ = 3 次（人绕路不计入推动数）</text>
</svg>
