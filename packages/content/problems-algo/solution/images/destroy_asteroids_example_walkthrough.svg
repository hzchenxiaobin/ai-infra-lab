<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：排序后逐颗吸收</text>

  <!-- ===== Example 1 (success) ===== -->
  <text x="40" y="52" font-size="12" fill="#4a7a3a" font-weight="bold">示例 1：mass=10, asteroids=[3,9,19,5,21] → 排序 [3,5,9,19,21] ✓</text>

  <!-- asteroids sorted row: 5 asteroids at positions x=70,150,230,310,390 -->
  <g font-size="11" font-weight="bold">
    <circle cx="70" cy="80" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="70" y="85" text-anchor="middle" fill="#4a7a3a">3</text>
    <circle cx="150" cy="80" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="150" y="85" text-anchor="middle" fill="#4a7a3a">5</text>
    <circle cx="230" cy="80" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="230" y="85" text-anchor="middle" fill="#4a7a3a">9</text>
    <circle cx="310" cy="80" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="310" y="85" text-anchor="middle" fill="#4a7a3a">19</text>
    <circle cx="390" cy="80" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="390" y="85" text-anchor="middle" fill="#4a7a3a">21</text>
  </g>
  <text x="430" y="84" font-size="10" fill="#888">升序</text>

  <!-- State table -->
  <g font-size="10" fill="#444">
    <rect x="40" y="104" width="400" height="20" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="58" y="118" text-anchor="middle" font-weight="bold">步</text>
    <text x="100" y="118" text-anchor="middle" font-weight="bold">小行星</text>
    <text x="160" y="118" text-anchor="middle" font-weight="bold">比较</text>
    <text x="230" y="118" text-anchor="middle" font-weight="bold">吸收后 mass</text>
    <text x="350" y="118" text-anchor="middle" font-weight="bold">结果</text>
  </g>

  <!-- rows -->
  <g font-size="10">
    <rect x="40" y="124" width="400" height="20" fill="#fafafa" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
    <text x="58" y="138" text-anchor="middle" fill="#444">0</text>
    <text x="100" y="138" text-anchor="middle" fill="#888">—</text>
    <text x="160" y="138" text-anchor="middle" fill="#888">—</text>
    <text x="230" y="138" text-anchor="middle" fill="#446688" font-weight="bold">10</text>
    <text x="350" y="138" text-anchor="middle" fill="#888">起始</text>
  </g>
  <g font-size="10">
    <rect x="40" y="144" width="400" height="20" fill="#fafafa" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
    <text x="58" y="158" text-anchor="middle" fill="#444">1</text>
    <text x="100" y="158" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <text x="160" y="158" text-anchor="middle" fill="#4a7a3a">10 ≥ 3</text>
    <text x="230" y="158" text-anchor="middle" fill="#4a7a3a" font-weight="bold">13</text>
    <text x="350" y="158" text-anchor="middle" fill="#4a7a3a">吞 ✓</text>
  </g>
  <g font-size="10">
    <rect x="40" y="164" width="400" height="20" fill="#fafafa" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
    <text x="58" y="178" text-anchor="middle" fill="#444">2</text>
    <text x="100" y="178" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>
    <text x="160" y="178" text-anchor="middle" fill="#4a7a3a">13 ≥ 5</text>
    <text x="230" y="178" text-anchor="middle" fill="#4a7a3a" font-weight="bold">18</text>
    <text x="350" y="178" text-anchor="middle" fill="#4a7a3a">吞 ✓</text>
  </g>
  <g font-size="10">
    <rect x="40" y="184" width="400" height="20" fill="#fafafa" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
    <text x="58" y="198" text-anchor="middle" fill="#444">3</text>
    <text x="100" y="198" text-anchor="middle" fill="#4a7a3a" font-weight="bold">9</text>
    <text x="160" y="198" text-anchor="middle" fill="#4a7a3a">18 ≥ 9</text>
    <text x="230" y="198" text-anchor="middle" fill="#4a7a3a" font-weight="bold">27</text>
    <text x="350" y="198" text-anchor="middle" fill="#4a7a3a">吞 ✓</text>
  </g>
  <g font-size="10">
    <rect x="40" y="204" width="400" height="20" fill="#fafafa" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
    <text x="58" y="218" text-anchor="middle" fill="#444">4</text>
    <text x="100" y="218" text-anchor="middle" fill="#4a7a3a" font-weight="bold">19</text>
    <text x="160" y="218" text-anchor="middle" fill="#4a7a3a">27 ≥ 19</text>
    <text x="230" y="218" text-anchor="middle" fill="#4a7a3a" font-weight="bold">46</text>
    <text x="350" y="218" text-anchor="middle" fill="#4a7a3a">吞 ✓</text>
  </g>
  <g font-size="10">
    <rect x="40" y="224" width="400" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="58" y="238" text-anchor="middle" fill="#444">5</text>
    <text x="100" y="238" text-anchor="middle" fill="#4a7a3a" font-weight="bold">21</text>
    <text x="160" y="238" text-anchor="middle" fill="#4a7a3a">46 ≥ 21</text>
    <text x="230" y="238" text-anchor="middle" fill="#4a7a3a" font-weight="bold">67</text>
    <text x="350" y="238" text-anchor="middle" fill="#4a7a3a" font-weight="bold">全吞完 → true</text>
  </g>

  <!-- mass growth curve -->
  <text x="460" y="118" font-size="10" fill="#888" font-weight="bold">mass 演化</text>
  <path d="M 460 238 L 460 210 L 480 188 L 500 168 L 520 148 L 540 130" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="540" y="124" font-size="9" fill="#4a7a3a" font-weight="bold">67</text>
  <text x="455" y="244" font-size="9" fill="#888">10</text>

  <!-- ===== Example 2 (failure) ===== -->
  <text x="40" y="280" font-size="12" fill="#b85450" font-weight="bold">示例 2：mass=5, asteroids=[4,9,23,4] → 排序 [4,4,9,23] ✗</text>

  <g font-size="10">
    <rect x="40" y="292" width="400" height="20" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="58" y="306" text-anchor="middle" font-weight="bold">步</text>
    <text x="100" y="306" text-anchor="middle" font-weight="bold">小行星</text>
    <text x="160" y="306" text-anchor="middle" font-weight="bold">比较</text>
    <text x="230" y="306" text-anchor="middle" font-weight="bold">吸收后 mass</text>
    <text x="350" y="306" text-anchor="middle" font-weight="bold">结果</text>
  </g>

  <g font-size="10">
    <rect x="40" y="312" width="400" height="20" fill="#fafafa" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
    <text x="58" y="326" text-anchor="middle" fill="#444">0</text>
    <text x="100" y="326" text-anchor="middle" fill="#888">—</text>
    <text x="160" y="326" text-anchor="middle" fill="#888">—</text>
    <text x="230" y="326" text-anchor="middle" fill="#446688" font-weight="bold">5</text>
    <text x="350" y="326" text-anchor="middle" fill="#888">起始</text>
  </g>
  <g font-size="10">
    <rect x="40" y="332" width="400" height="20" fill="#fafafa" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
    <text x="58" y="346" text-anchor="middle" fill="#444">1</text>
    <text x="100" y="346" text-anchor="middle" fill="#4a7a3a" font-weight="bold">4</text>
    <text x="160" y="346" text-anchor="middle" fill="#4a7a3a">5 ≥ 4</text>
    <text x="230" y="346" text-anchor="middle" fill="#4a7a3a" font-weight="bold">9</text>
    <text x="350" y="346" text-anchor="middle" fill="#4a7a3a">吞 ✓</text>
  </g>
  <g font-size="10">
    <rect x="40" y="352" width="400" height="20" fill="#fafafa" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
    <text x="58" y="366" text-anchor="middle" fill="#444">2</text>
    <text x="100" y="366" text-anchor="middle" fill="#4a7a3a" font-weight="bold">4</text>
    <text x="160" y="366" text-anchor="middle" fill="#4a7a3a">9 ≥ 4</text>
    <text x="230" y="366" text-anchor="middle" fill="#4a7a3a" font-weight="bold">13</text>
    <text x="350" y="366" text-anchor="middle" fill="#4a7a3a">吞 ✓</text>
  </g>
  <g font-size="10">
    <rect x="40" y="372" width="400" height="20" fill="#fafafa" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
    <text x="58" y="386" text-anchor="middle" fill="#444">3</text>
    <text x="100" y="386" text-anchor="middle" fill="#4a7a3a" font-weight="bold">9</text>
    <text x="160" y="386" text-anchor="middle" fill="#4a7a3a">13 ≥ 9</text>
    <text x="230" y="386" text-anchor="middle" fill="#4a7a3a" font-weight="bold">22</text>
    <text x="350" y="386" text-anchor="middle" fill="#4a7a3a">吞 ✓</text>
  </g>
  <g font-size="10">
    <rect x="40" y="392" width="400" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="58" y="406" text-anchor="middle" fill="#444">4</text>
    <text x="100" y="406" text-anchor="middle" fill="#b85450" font-weight="bold">23</text>
    <text x="160" y="406" text-anchor="middle" fill="#b85450" font-weight="bold">22 &lt; 23</text>
    <text x="230" y="406" text-anchor="middle" fill="#b85450">—</text>
    <text x="350" y="406" text-anchor="middle" fill="#b85450" font-weight="bold">吞不动 → false</text>
  </g>

  <!-- bottom note -->
  <rect x="40" y="424" width="520" height="36" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="58" y="446" font-size="10" fill="#444">· 即使把 23 留到最后，前面三颗全吞也只攒到 22，仍 &lt; 23 ⇒ 任何顺序都失败（升序已是上界）</text>
</svg>
