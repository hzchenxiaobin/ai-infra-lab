<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrBlue" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：非递减行段的最大值 = 右端点</text>
  <text x="260" y="38" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">「每行有序」+「元素都 ≤ k」两个条件，被一个 h 值统一编码</text>

  <!-- 面板 ①：最大值在右端 -->
  <rect x="36" y="48" width="448" height="88" rx="8" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="48" y="66" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 行段非递减 ⇒ 左边的元素永远 ≤ 右端点</text>

  <rect x="110" y="74" width="44" height="28" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="132" y="93" text-anchor="middle" font-size="12.5" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="158" y="74" width="44" height="28" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="93" text-anchor="middle" font-size="12.5" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="206" y="74" width="44" height="28" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="228" y="93" text-anchor="middle" font-size="12.5" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="254" y="74" width="44" height="28" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="276" y="93" text-anchor="middle" font-size="12.5" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="276" y="116" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">最大值=右端 c₂</text>

  <text x="330" y="88" font-size="9.5" fill="#555" filter="url(#rough2)">「≤ k」检查只看右端：</text>
  <text x="330" y="106" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">右端 grid[i][c₂] ≤ k</text>
  <text x="330" y="122" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⇔ 整个行段都 ≤ k ★</text>

  <!-- 面板 ②：h 数组 -->
  <rect x="36" y="146" width="448" height="158" rx="8" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="48" y="164" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">② h[i][j] = 该格向左的最长非递减延伸；grid[i][j] &gt; k 时记 0</text>

  <text x="58" y="196" font-size="10" fill="#555" filter="url(#rough2)">grid (k=6)</text>
  <rect x="100" y="178" width="42" height="24" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="121" y="194" text-anchor="middle" font-size="11.5" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="146" y="178" width="42" height="24" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="167" y="194" text-anchor="middle" font-size="11.5" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="192" y="178" width="42" height="24" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="213" y="194" text-anchor="middle" font-size="11.5" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="238" y="178" width="42" height="24" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="259" y="194" text-anchor="middle" font-size="11.5" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="100" y="206" width="42" height="24" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="121" y="222" text-anchor="middle" font-size="11.5" fill="#8c3a36" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="146" y="206" width="42" height="24" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="167" y="222" text-anchor="middle" font-size="11.5" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="192" y="206" width="42" height="24" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="213" y="222" text-anchor="middle" font-size="11.5" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="238" y="206" width="42" height="24" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="259" y="222" text-anchor="middle" font-size="11.5" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">4</text>

  <text x="300" y="192" font-size="9.5" fill="#b85450" filter="url(#rough2)">· 7 &gt; k → h 直接记 0</text>
  <text x="300" y="210" font-size="9.5" fill="#555" filter="url(#rough2)">· 1 &lt; 2 出现递减</text>
  <text x="300" y="226" font-size="9.5" fill="#555" filter="url(#rough2)">  → run 重置为 1</text>

  <path d="M 169 238 L 169 250" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="66" y="258" font-size="11" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">h</text>
  <rect x="100" y="246" width="42" height="22" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="121" y="261" text-anchor="middle" font-size="11" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="146" y="246" width="42" height="22" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="167" y="261" text-anchor="middle" font-size="11" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="192" y="246" width="42" height="22" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="213" y="261" text-anchor="middle" font-size="11" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="238" y="246" width="42" height="22" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="259" y="261" text-anchor="middle" font-size="11" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="100" y="272" width="42" height="22" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="121" y="287" text-anchor="middle" font-size="11" fill="#8c3a36" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="146" y="272" width="42" height="22" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="167" y="287" text-anchor="middle" font-size="11" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="192" y="272" width="42" height="22" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="213" y="287" text-anchor="middle" font-size="11" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="238" y="272" width="42" height="22" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="259" y="287" text-anchor="middle" font-size="11" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">3</text>

  <text x="300" y="256" font-size="9.5" fill="#555" filter="url(#rough2)">h=3：向左 1,2,2 全都 ≤ 6</text>
  <text x="300" y="272" font-size="9.5" fill="#555" filter="url(#rough2)">且非递减 → 宽 1..3 全合法</text>
  <text x="300" y="290" font-size="9.5" fill="#555" filter="url(#rough2)">h=0：该行做不了右端点</text>

  <!-- 底部要点框 -->
  <rect x="36" y="312" width="448" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="330" text-anchor="middle" font-size="10.5" fill="#2f5424" font-weight="bold" filter="url(#rough2)">固定右端点 c₂ 后：行区间 [r₁,r₂] 的合法宽度数 = min h[i][c₂]</text>
  <text x="260" y="346" text-anchor="middle" font-size="10.5" fill="#2f5424" filter="url(#rough2)">→ 答案 = 每列做一次「子数组最小值之和」（907 单调栈）★</text>
</svg>
