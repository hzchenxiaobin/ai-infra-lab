<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：japanese 桶随操作变化的有序集合状态</text>

  <!-- ============ Snapshot A: initial ============ -->
  <text x="40" y="62" font-size="12" fill="#446688" font-weight="bold">① 初始</text>
  <text x="40" y="78" font-size="10" fill="#888">highestRated("japanese") →</text>
  <!-- bucket header -->
  <rect x="40" y="86" width="300" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="190" y="104" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">japanese（按 −评分 升序）</text>
  <!-- best -->
  <rect x="40" y="116" width="300" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="135" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">(−14, ramen)</text>
  <rect x="40" y="148" width="300" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="167" text-anchor="middle" font-size="12" fill="#666">(−12, miso)</text>
  <rect x="40" y="180" width="300" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="199" text-anchor="middle" font-size="12" fill="#666">(−8, sushi)</text>
  <!-- answer -->
  <rect x="380" y="120" width="220" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="490" y="145" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">ramen（14 分最高）</text>

  <!-- ============ Snapshot B: sushi -> 16 ============ -->
  <text x="40" y="248" font-size="12" fill="#446688" font-weight="bold">② changeRating("sushi", 16)</text>
  <text x="40" y="264" font-size="10" fill="#888">erase (−8,sushi) + insert (−16,sushi) →</text>
  <rect x="40" y="272" width="300" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="190" y="290" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">japanese（按 −评分 升序）</text>
  <!-- best -->
  <rect x="40" y="302" width="300" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="321" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">(−16, sushi)</text>
  <rect x="40" y="334" width="300" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="353" text-anchor="middle" font-size="12" fill="#666">(−14, ramen)</text>
  <rect x="40" y="366" width="300" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="385" text-anchor="middle" font-size="12" fill="#666">(−12, miso)</text>
  <rect x="380" y="306" width="220" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="490" y="331" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">sushi（16 分最高）</text>

  <!-- ============ Snapshot C: ramen -> 16 ============ -->
  <text x="40" y="434" font-size="12" fill="#446688" font-weight="bold">③ changeRating("ramen", 16)</text>
  <text x="340" y="434" font-size="11" fill="#b85450" font-weight="bold">sushi 与 ramen 同为 16 → 取字典序小者</text>
  <rect x="380" y="420" width="220" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="490" y="445" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">ramen（r &lt; s）</text>
</svg>
