<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：任意一次操作拿走的和恒为 prefix[终点下标]</text>

  <!-- ===== Stage 1: 初始石子行 ===== -->
  <text x="40" y="52" font-size="11.5" fill="#446688" font-weight="bold">① 初始石子行 stones = [−1, 2, −3, 4, −5]</text>

  <!-- stones row -->
  <rect x="40" y="60" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="62" y="80" text-anchor="middle" font-size="12" fill="#333">−1</text>
  <rect x="86" y="60" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="108" y="80" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="132" y="60" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="154" y="80" text-anchor="middle" font-size="12" fill="#333">−3</text>
  <rect x="178" y="60" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="80" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="224" y="60" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="246" y="80" text-anchor="middle" font-size="12" fill="#333">−5</text>

  <!-- prefix annotation -->
  <text x="290" y="72" font-size="10" fill="#888">前缀和 prefix:</text>
  <text x="290" y="86" font-size="10.5" fill="#b85450" font-weight="bold">[−1, 1, −2, 2, −3]</text>

  <!-- arrow: Alice removes first 4 -->
  <path d="M 154 94 L 154 122" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="164" y="112" font-size="10" fill="#4a7a3a" font-weight="bold">Alice 移除前 4 个</text>

  <!-- bracket showing removed range -->
  <path d="M 42 100 L 42 104 L 222 104 L 222 100" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== Stage 2: after Alice's move ===== -->
  <text x="40" y="138" font-size="11.5" fill="#4a7a3a" font-weight="bold">② 操作后：和 = (−1)+2+(−3)+4 = 2 = prefix[3]</text>

  <!-- new accumulated stone (green = new) -->
  <rect x="40" y="148" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="62" y="168" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="62" y="190" text-anchor="middle" font-size="9" fill="#4a7a3a">新积累石子</text>

  <!-- remaining original stone -->
  <rect x="96" y="148" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="168" text-anchor="middle" font-size="12" fill="#333">−5</text>
  <text x="118" y="190" text-anchor="middle" font-size="9" fill="#888">stones[4]</text>

  <!-- annotation: 2 = prefix[3] -->
  <path d="M 62 178 L 62 196" stroke="#4a7a3a" stroke-width="1" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- arrow: Bob removes 2 -->
  <path d="M 84 196 L 84 218" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="94" y="212" font-size="10" fill="#b85450" font-weight="bold">Bob 移除 2 个</text>

  <!-- bracket -->
  <path d="M 42 202 L 42 206 L 140 206 L 140 202" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== Stage 3: after Bob's move ===== -->
  <text x="40" y="232" font-size="11.5" fill="#b85450" font-weight="bold">③ 操作后：和 = 2 + (−5) = −3 = prefix[4]</text>

  <rect x="40" y="242" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="62" y="262" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">−3</text>
  <text x="62" y="284" text-anchor="middle" font-size="9" fill="#b85450">仅剩 1 个 → 游戏结束</text>

  <!-- key derivation on the right -->
  <rect x="180" y="242" width="300" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="190" y="258" font-size="10.5" fill="#333">Bob 拿走的和 = 积累石子 + stones[4]</text>
  <text x="190" y="274" font-size="10.5" fill="#d6a040" font-weight="bold">= prefix[3] + stones[4] = prefix[4] ✓</text>

  <!-- ===== Insight box ===== -->
  <rect x="30" y="300" width="460" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="50" y="322" font-size="12" fill="#446688" font-weight="bold">关键不变量</text>
  <text x="50" y="340" font-size="10.5" fill="#333">• 积累石子值 ≡ prefix[已消耗终点 i]，剩余原石子 = stones[i+1 .. n−1]</text>
  <text x="50" y="356" font-size="10.5" fill="#333">• 下一次拿走「积累 + stones[i+1..j]」→ 和 = prefix[i] + (prefix[j]−prefix[i]) = </text>
  <text x="320" y="356" font-size="10.5" fill="#b85450" font-weight="bold">prefix[j]</text>
  <text x="50" y="368" font-size="10.5" fill="#446688" font-weight="bold">⇒ 游戏状态仅由「已消耗到第 i 个原石子」决定 → 一维 DP</text>
</svg>
