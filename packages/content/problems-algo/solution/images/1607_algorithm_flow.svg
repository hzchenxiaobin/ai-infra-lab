<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：FROM → LEFT JOIN(ON 含年份) → IS NULL → ORDER BY</text>

  <!-- ===== Step 1: FROM Seller ===== -->
  <rect x="40" y="50" width="180" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="130" y="72" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① FROM Seller s</text>
  <text x="130" y="90" text-anchor="middle" font-size="9" fill="#666">读取全部卖家（左表，全保留）</text>
  <text x="130" y="100" text-anchor="middle" font-size="8" fill="#888">4 行：Daniel/Grace/Evelyn/Henry</text>

  <!-- arrow down -->
  <path d="M 130 110 L 130 130" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: LEFT JOIN with ON (year condition) ===== -->
  <rect x="30" y="134" width="200" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="130" y="154" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">② LEFT JOIN Orders o</text>
  <text x="130" y="172" text-anchor="middle" font-size="9" fill="#666">ON s.seller_id = o.seller_id</text>
  <text x="130" y="188" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">AND YEAR(o.sale_date)=2020</text>
  <text x="130" y="204" text-anchor="middle" font-size="8" fill="#888">仅 2020 订单参与匹配</text>
  <text x="130" y="214" text-anchor="middle" font-size="8" fill="#888">无 2020 匹配 → o.* = NULL</text>

  <!-- arrow down -->
  <path d="M 130 224 L 130 244" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: WHERE IS NULL ===== -->
  <rect x="30" y="248" width="200" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="130" y="270" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">③ WHERE o.order_id IS NULL</text>
  <text x="130" y="286" text-anchor="middle" font-size="9" fill="#666">筛出 2020 年无销售的卖家</text>
  <text x="130" y="296" text-anchor="middle" font-size="8" fill="#888">用右表主键判空最稳妥</text>

  <!-- arrow right -->
  <path d="M 230 276 L 260 276" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 4: SELECT ===== -->
  <rect x="264" y="248" width="160" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="344" y="270" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">④ SELECT seller_name</text>
  <text x="344" y="286" text-anchor="middle" font-size="9" fill="#666">取卖家姓名列</text>
  <text x="344" y="296" text-anchor="middle" font-size="8" fill="#888">Customer 表无需引用</text>

  <!-- arrow right -->
  <path d="M 424 276 L 454 276" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 5: ORDER BY ===== -->
  <rect x="458" y="248" width="140" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="528" y="270" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">⑤ ORDER BY</text>
  <text x="528" y="286" text-anchor="middle" font-size="9" fill="#666">seller_name ASC</text>
  <text x="528" y="296" text-anchor="middle" font-size="8" fill="#888">题面要求，不可省</text>

  <!-- ===== Middle table: join result illustration ===== -->
  <rect x="280" y="50" width="320" height="170" fill="#fff" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="440" y="70" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">② LEFT JOIN 后的中间表（节选）</text>
  <line x1="280" y1="78" x2="600" y2="78" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- header -->
  <text x="292" y="94" font-size="9" fill="#446688" font-weight="bold">sid  name    o.oid  o.date</text>
  <line x1="290" y1="100" x2="590" y2="100" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- s3 matched rows -->
  <text x="292" y="116" font-size="9" fill="#4a7a3a">3    Daniel  4      2020-07-03</text>
  <text x="292" y="132" font-size="9" fill="#4a7a3a">3    Daniel  6      2020-10-21</text>
  <!-- s4 matched -->
  <text x="292" y="148" font-size="9" fill="#4a7a3a">4    Grace   2      2020-05-25</text>
  <!-- s5 matched (2019 row NOT here) -->
  <text x="292" y="164" font-size="9" fill="#4a7a3a">5    Evelyn  1      2020-03-01</text>
  <text x="292" y="180" font-size="9" fill="#4a7a3a">5    Evelyn  5      2020-11-15</text>
  <!-- s6 unmatched -->
  <rect x="290" y="186" width="300" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)" opacity="0.5"/>
  <text x="292" y="202" font-size="9" fill="#b85450" font-weight="bold">6    Henry   NULL   NULL</text>

  <text x="440" y="214" text-anchor="middle" font-size="8" fill="#888">o3(2019) 不在中间表 → ON 年份条件生效</text>

  <!-- ===== Bottom note ===== -->
  <rect x="30" y="330" width="560" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="350" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">关键：年份条件写在 ON（影响匹配与否），IS NULL 写在 WHERE（影响保留与否）</text>
  <text x="310" y="368" text-anchor="middle" font-size="10" fill="#666">若把 YEAR()=2020 误放 WHERE：无 2020 订单的卖家 o.* 全 NULL → YEAR(NULL)≠2020 被滤掉 → 退化成 INNER JOIN</text>
  <text x="310" y="386" text-anchor="middle" font-size="10" fill="#666">生产建议：YEAR() 换 BETWEEN '2020-01-01' AND '2020-12-31' 保 sargable（可走索引范围扫描）</text>

  <!-- ===== SQL clause order hint ===== -->
  <text x="40" y="412" font-size="8" fill="#aaa">子句执行顺序：FROM(含JOIN/ON) → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT</text>
</svg>
