<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：limit = 22，后序遍历逐节点剪枝</text>

  <!-- Small tree on left -->
  <text x="100" y="50" text-anchor="middle" font-size="10" fill="#888">后序顺序</text>

  <!-- root 5 -->
  <circle cx="100" cy="68" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="72" text-anchor="middle" font-size="10" fill="#333">5</text>
  <text x="116" y="63" font-size="8" fill="#b85450" font-weight="bold">⑩</text>

  <!-- level 1: 4 and 8 -->
  <circle cx="68" cy="103" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="68" y="107" text-anchor="middle" font-size="9" fill="#333">4</text>
  <text x="56" y="98" font-size="8" fill="#b85450" font-weight="bold">④</text>
  <circle cx="132" cy="103" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="132" y="107" text-anchor="middle" font-size="9" fill="#333">8</text>
  <text x="144" y="98" font-size="8" fill="#b85450" font-weight="bold">⑨</text>

  <!-- edges level 1 -->
  <path d="M 91 78 L 75 95" stroke="#446688" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 109 78 L 125 95" stroke="#446688" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <!-- level 2: 11, 17, 4(R) -->
  <circle cx="52" cy="138" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="52" y="142" text-anchor="middle" font-size="9" fill="#333">11</text>
  <text x="40" y="133" font-size="8" fill="#b85450" font-weight="bold">③</text>
  <circle cx="118" cy="138" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="118" y="142" text-anchor="middle" font-size="9" fill="#333">17</text>
  <text x="106" y="133" font-size="8" fill="#b85450" font-weight="bold">⑤</text>
  <circle cx="148" cy="138" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="148" y="142" text-anchor="middle" font-size="9" fill="#333">4</text>
  <text x="160" y="133" font-size="8" fill="#b85450" font-weight="bold">⑧</text>

  <!-- edges level 2 -->
  <path d="M 63 113 L 56 129" stroke="#446688" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 128 113 L 122 129" stroke="#446688" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 137 113 L 144 129" stroke="#446688" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <!-- level 3: 7, 1, 5, 3 -->
  <circle cx="42" cy="173" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="42" y="177" text-anchor="middle" font-size="8" fill="#333">7</text>
  <text x="30" y="178" font-size="8" fill="#b85450" font-weight="bold">①</text>
  <circle cx="62" cy="173" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="62" y="177" text-anchor="middle" font-size="8" fill="#333">1</text>
  <text x="74" y="178" font-size="8" fill="#b85450" font-weight="bold">②</text>
  <circle cx="138" cy="173" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="138" y="177" text-anchor="middle" font-size="8" fill="#333">5</text>
  <text x="126" y="178" font-size="8" fill="#b85450" font-weight="bold">⑥</text>
  <circle cx="158" cy="173" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="158" y="177" text-anchor="middle" font-size="8" fill="#333">3</text>
  <text x="170" y="178" font-size="8" fill="#b85450" font-weight="bold">⑦</text>

  <!-- edges level 3 -->
  <path d="M 49 148 L 45 164" stroke="#446688" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 55 148 L 60 164" stroke="#b85450" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 145 148 L 141 164" stroke="#446688" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 151 148 L 156 164" stroke="#b85450" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <!-- ===== Table on right ===== -->
  <!-- Header -->
  <rect x="200" y="48" width="390" height="26" fill="#446688" filter="url(#rough2)"/>
  <text x="220" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">步骤</text>
  <text x="275" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">节点</text>
  <text x="345" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">limit</text>
  <text x="430" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">判定</text>
  <text x="535" y="65" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">结果</text>

  <!-- Row 1: ① 叶 7 -->
  <rect x="200" y="74" width="390" height="22" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="220" y="89" text-anchor="middle" font-size="10" fill="#333">①</text>
  <text x="275" y="89" text-anchor="middle" font-size="9" fill="#333">叶 7</text>
  <text x="345" y="89" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="430" y="89" text-anchor="middle" font-size="9" fill="#4a7a3a">7 ≥ 2 ✓</text>
  <text x="535" y="89" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">✅ 保留</text>

  <!-- Row 2: ② 叶 1 -->
  <rect x="200" y="96" width="390" height="22" fill="#fce4ec" filter="url(#rough2)"/>
  <text x="220" y="111" text-anchor="middle" font-size="10" fill="#333">②</text>
  <text x="275" y="111" text-anchor="middle" font-size="9" fill="#333">叶 1</text>
  <text x="345" y="111" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="430" y="111" text-anchor="middle" font-size="9" fill="#b85450">1 &lt; 2 ✗</text>
  <text x="535" y="111" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">❌ 删除</text>

  <!-- Row 3: ③ 节点 11 -->
  <rect x="200" y="118" width="390" height="22" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="220" y="133" text-anchor="middle" font-size="10" fill="#333">③</text>
  <text x="275" y="133" text-anchor="middle" font-size="9" fill="#333">节点 11</text>
  <text x="345" y="133" text-anchor="middle" font-size="9" fill="#333">13</text>
  <text x="430" y="133" text-anchor="middle" font-size="9" fill="#555">左留 右删</text>
  <text x="535" y="133" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">✅ 保留</text>

  <!-- Row 4: ④ 节点 4(左) -->
  <rect x="200" y="140" width="390" height="22" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="220" y="155" text-anchor="middle" font-size="10" fill="#333">④</text>
  <text x="275" y="155" text-anchor="middle" font-size="9" fill="#333">节点 4(左)</text>
  <text x="345" y="155" text-anchor="middle" font-size="9" fill="#333">17</text>
  <text x="430" y="155" text-anchor="middle" font-size="9" fill="#555">左留</text>
  <text x="535" y="155" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">✅ 保留</text>

  <!-- Row 5: ⑤ 叶 17 -->
  <rect x="200" y="162" width="390" height="22" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="220" y="177" text-anchor="middle" font-size="10" fill="#333">⑤</text>
  <text x="275" y="177" text-anchor="middle" font-size="9" fill="#333">叶 17</text>
  <text x="345" y="177" text-anchor="middle" font-size="9" fill="#333">9</text>
  <text x="430" y="177" text-anchor="middle" font-size="9" fill="#4a7a3a">17 ≥ 9 ✓</text>
  <text x="535" y="177" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">✅ 保留</text>

  <!-- Row 6: ⑥ 叶 5 -->
  <rect x="200" y="184" width="390" height="22" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="220" y="199" text-anchor="middle" font-size="10" fill="#333">⑥</text>
  <text x="275" y="199" text-anchor="middle" font-size="9" fill="#333">叶 5</text>
  <text x="345" y="199" text-anchor="middle" font-size="9" fill="#333">5</text>
  <text x="430" y="199" text-anchor="middle" font-size="9" fill="#4a7a3a">5 ≥ 5 ✓</text>
  <text x="535" y="199" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">✅ 保留</text>

  <!-- Row 7: ⑦ 叶 3 -->
  <rect x="200" y="206" width="390" height="22" fill="#fce4ec" filter="url(#rough2)"/>
  <text x="220" y="221" text-anchor="middle" font-size="10" fill="#333">⑦</text>
  <text x="275" y="221" text-anchor="middle" font-size="9" fill="#333">叶 3</text>
  <text x="345" y="221" text-anchor="middle" font-size="9" fill="#333">5</text>
  <text x="430" y="221" text-anchor="middle" font-size="9" fill="#b85450">3 &lt; 5 ✗</text>
  <text x="535" y="221" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">❌ 删除</text>

  <!-- Row 8: ⑧ 节点 4(右) -->
  <rect x="200" y="228" width="390" height="22" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="220" y="243" text-anchor="middle" font-size="10" fill="#333">⑧</text>
  <text x="275" y="243" text-anchor="middle" font-size="9" fill="#333">节点 4(右)</text>
  <text x="345" y="243" text-anchor="middle" font-size="9" fill="#333">9</text>
  <text x="430" y="243" text-anchor="middle" font-size="9" fill="#555">左留 右删</text>
  <text x="535" y="243" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">✅ 保留</text>

  <!-- Row 9: ⑨ 节点 8 -->
  <rect x="200" y="250" width="390" height="22" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="220" y="265" text-anchor="middle" font-size="10" fill="#333">⑨</text>
  <text x="275" y="265" text-anchor="middle" font-size="9" fill="#333">节点 8</text>
  <text x="345" y="265" text-anchor="middle" font-size="9" fill="#333">17</text>
  <text x="430" y="265" text-anchor="middle" font-size="9" fill="#555">左留 右留</text>
  <text x="535" y="265" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">✅ 保留</text>

  <!-- Row 10: ⑩ 根 5 -->
  <rect x="200" y="272" width="390" height="22" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="220" y="287" text-anchor="middle" font-size="10" fill="#333">⑩</text>
  <text x="275" y="287" text-anchor="middle" font-size="9" fill="#333">根 5</text>
  <text x="345" y="287" text-anchor="middle" font-size="9" fill="#333">22</text>
  <text x="430" y="287" text-anchor="middle" font-size="9" fill="#555">左留 右留</text>
  <text x="535" y="287" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">✅ 保留</text>

  <!-- Table border -->
  <rect x="200" y="48" width="390" height="246" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="240" y1="74" x2="240" y2="294" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="310" y1="74" x2="310" y2="294" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="380" y1="74" x2="380" y2="294" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="480" y1="74" x2="480" y2="294" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Result box -->
  <rect x="40" y="310" width="540" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="310" y="330" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">最终结果：[5,4,8,11,null,17,4,7,null,null,null,5]</text>
  <text x="310" y="345" text-anchor="middle" font-size="9" fill="#888">仅删除叶 1（路径和 21）和叶 3（路径和 20），其余节点均保留</text>

  <!-- Key insight box -->
  <rect x="40" y="360" width="540" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="380" text-anchor="middle" font-size="10" fill="#555">limit 递减：根 22 → 4(左)/8 得 17 → 11 得 13 → 叶 7/1 得 2</text>
  <text x="310" y="397" text-anchor="middle" font-size="10" fill="#555">叶 7：7 ≥ 2 留 · 叶 1：1 &lt; 2 删 · 节点 11：左留右删→仍有孩子→保留</text>
</svg>
