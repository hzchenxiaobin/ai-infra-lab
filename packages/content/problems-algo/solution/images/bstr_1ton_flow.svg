<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="500" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：枚举子串 + 增量建值 + 集合判满</text>

  <!-- Start -->
  <ellipse cx="260" cy="56" rx="46" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="61" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">开始</text>

  <line x1="260" y1="76" x2="260" y2="92" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- seen = set() -->
  <rect x="160" y="96" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="116" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">seen = ∅  // 收集 ∈ [1,n] 的值</text>

  <line x1="260" y1="126" x2="260" y2="142" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- for i loop -->
  <rect x="120" y="146" width="280" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="166" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">for i = 0 .. m−1   // 枚举子串起点</text>

  <line x1="260" y1="176" x2="260" y2="192" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: s[i]=='0'? -->
  <polygon points="260,196 360,234 260,272 160,234" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="230" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">s[i] == '0' ?</text>
  <text x="260" y="246" text-anchor="middle" font-size="10" fill="#888">前导零跳过</text>

  <!-- Yes: skip to next i (right) -->
  <text x="368" y="232" font-size="11" fill="#d6a040" font-weight="bold">是</text>
  <line x1="360" y1="234" x2="430" y2="234" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="430" y="218" width="64" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="462" y="238" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">continue</text>
  <text x="462" y="252" text-anchor="middle" font-size="9.5" fill="#888">下一个 i</text>

  <!-- No: down -->
  <text x="268" y="288" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <line x1="260" y1="272" x2="260" y2="296" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- val = 0 -->
  <rect x="160" y="300" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="320" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">val = 0   // 增量建二进制值</text>

  <line x1="260" y1="330" x2="260" y2="346" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- for j loop -->
  <rect x="120" y="350" width="280" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="370" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">for j = i .. m−1   // 向右扩展子串</text>

  <line x1="260" y1="380" x2="260" y2="396" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- val = val*2 + bit -->
  <rect x="120" y="400" width="280" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="420" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">val = val × 2 + (s[j] − '0')</text>

  <line x1="260" y1="430" x2="260" y2="446" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: val > n? -->
  <polygon points="260,450 350,480 260,510 170,480" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="476" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">val &gt; n ?</text>
  <text x="260" y="492" text-anchor="middle" font-size="10" fill="#888">超出范围</text>

  <!-- Yes: break (left) -->
  <text x="138" y="478" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <line x1="170" y1="480" x2="110" y2="480" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="46" y="464" width="64" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="78" y="484" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">break</text>
  <text x="78" y="498" text-anchor="middle" font-size="9.5" fill="#888">下一个 i</text>

  <!-- No: right -->
  <text x="358" y="478" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <line x1="350" y1="480" x2="400" y2="480" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="400" y="464" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="450" y="484" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">seen.add(val)</text>

  <!-- return box (bottom, spanning) -->
  <rect x="120" y="442" width="0" height="0" fill="none"/>

  <!-- Final check - placed at very bottom -->
  <rect x="60" y="442" width="400" height="0" fill="none"/>

  <!-- side note for final return -->
  <rect x="376" y="96" width="130" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="441" y="118" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">枚举结束后</text>
  <text x="441" y="138" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">return</text>
  <text x="441" y="156" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">len(seen) == n</text>
</svg>
