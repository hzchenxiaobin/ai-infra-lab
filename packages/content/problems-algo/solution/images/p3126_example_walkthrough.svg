<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="430" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：152,101 秒 ÷ 86,400 ＝ 1.76 天 → 向下取整 1 天</text>

  <rect x="35" y="44" width="70" height="26" fill="#eef2f7" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="105" y="44" width="290" height="26" fill="#eef2f7" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="395" y="44" width="110" height="26" fill="#eef2f7" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="61" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">服务器</text>
  <text x="250" y="61" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">各段运行时长（start → 下一事件）</text>
  <text x="450" y="61" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">小计</text>

  <rect x="35" y="70" width="70" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="105" y="70" width="290" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="395" y="70" width="110" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="87" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="250" y="87" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8h05m ＋ 1h14m</text>
  <text x="450" y="87" text-anchor="middle" font-size="11" fill="#333" font-family="monospace" filter="url(#rough2)">9.32h</text>

  <rect x="35" y="96" width="70" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="105" y="96" width="290" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="395" y="96" width="110" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="113" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="250" y="113" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6h47m ＋ 1h59m ＋ 2h13m（有重叠，见陷阱图）</text>
  <text x="450" y="113" text-anchor="middle" font-size="11" fill="#333" font-family="monospace" filter="url(#rough2)">10.98h</text>

  <rect x="35" y="122" width="70" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="105" y="122" width="290" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="395" y="122" width="110" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="139" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="250" y="139" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0h31m ＋ 6h32m ＋ 5h39m ＋ 7h49m</text>
  <text x="450" y="139" text-anchor="middle" font-size="11" fill="#333" font-family="monospace" filter="url(#rough2)">20.52h</text>

  <rect x="35" y="148" width="70" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="105" y="148" width="290" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="395" y="148" width="110" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="165" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="250" y="165" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1h26m</text>
  <text x="450" y="165" text-anchor="middle" font-size="11" fill="#333" font-family="monospace" filter="url(#rough2)">1.43h</text>

  <rect x="35" y="174" width="70" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="105" y="174" width="290" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="395" y="174" width="110" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="70" y="192" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">Σ 全部</text>
  <text x="250" y="192" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">四台服务器的时长全部相加</text>
  <text x="450" y="192" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" font-family="monospace" filter="url(#rough2)">42.25h</text>

  <rect x="55" y="216" width="430" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="238" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">所有 start 行的秒差之和 ＝ 152,101 秒 ≈ 42.25 小时</text>
  <text x="270" y="258" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">42.25 小时 ÷ 24 小时/天 ＝ 1.76 天</text>

  <path d="M 120 320 L 440 320" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 120 314 L 120 326" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 280 314 L 280 326" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 440 314 L 440 326" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="340" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">0 天</text>
  <text x="280" y="340" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">1 天</text>
  <text x="440" y="340" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">2 天</text>

  <path d="M 402 302 L 402 332" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <circle cx="402" cy="320" r="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="402" y="296" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1.76 天</text>
  <circle cx="280" cy="320" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <path d="M 392 352 L 292 352" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="345" y="372" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">FLOOR 向下取整</text>

  <rect x="120" y="384" width="300" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="403" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">输出（单行单列）：total_uptime_days ＝ 1</text>

  <text x="270" y="428" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">判题用例（编辑器默认 116 行）同法：968,382 秒 ≈ 269.0 小时 → 11.21 天 → 11 天</text>
</svg>
