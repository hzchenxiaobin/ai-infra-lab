<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">计数排序算法流程</text>

  <!-- Step 1: Count -->
  <rect x="170" y="48" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">阶段 1：计数</text>
  <text x="270" y="80" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">count[1001]={0}, 遍历 arr1 → count[v]++</text>

  <!-- Arrow -->
  <path d="M 270 92 L 270 115" stroke="#446688" stroke-width="1.5" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- Step 2: Fill by arr2 order -->
  <rect x="120" y="120" width="300" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="140" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">阶段 2：按 arr2 顺序填充</text>
  <text x="270" y="156" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">for v in arr2:</text>
  <text x="270" y="168" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">  追加 v × count[v] 次 → count[v] = 0</text>

  <!-- Arrow -->
  <path d="M 270 180 L 270 203" stroke="#446688" stroke-width="1.5" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- Decision: more in arr2? -->
  <polygon points="270,210 330,240 270,270 210,240" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="238" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">arr2 还有</text>
  <text x="270" y="250" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">元素?</text>

  <!-- Yes arrow back to step 2 -->
  <path d="M 210 240 Q 140 240 140 180 Q 140 148 120 148" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="100" y="210" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- No arrow down -->
  <path d="M 270 270 L 270 293" stroke="#446688" stroke-width="1.5" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="285" y="285" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- Step 3: Fill remaining sorted -->
  <rect x="120" y="298" width="300" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="318" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">阶段 3：按值域升序填充剩余</text>
  <text x="270" y="334" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">for v = 0 to 1000:</text>
  <text x="270" y="346" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">  if count[v] > 0: 追加 v × count[v] 次</text>

  <!-- Arrow -->
  <path d="M 270 358 L 270 381" stroke="#446688" stroke-width="1.5" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- Decision: v <= 1000? -->
  <polygon points="270,388 335,413 270,438 205,413" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="411" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">v ≤ 1000?</text>

  <!-- Yes arrow back to step 3 -->
  <path d="M 205 413 Q 140 413 140 358 Q 140 326 120 326" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="100" y="385" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>

  <!-- No arrow right to return -->
  <path d="M 335 413 Q 400 413 420 413" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="345" y="405" font-size="10" fill="#666" filter="url(#rough2)">否</text>

  <!-- Return -->
  <rect x="420" y="398" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="465" y="418" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">返回 res</text>

  <!-- Side notes -->
  <text x="400" y="66" font-size="9" fill="#888" filter="url(#rough2)">O(n)</text>
  <text x="400" y="148" font-size="9" fill="#888" filter="url(#rough2)">O(m)</text>
  <text x="400" y="326" font-size="9" fill="#888" filter="url(#rough2)">O(K=1001)</text>
</svg>
