<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：head = [1,2,3,4,5]</text>
  <text x="300" y="42" text-anchor="middle" font-size="11" fill="#888">目标：1→2→3→4→5  ⟹  1→5→2→4→3</text>

  <!-- Row 1: 原链表 -->
  <text x="20" y="78" font-size="11" fill="#444" font-weight="bold">原链表</text>
  <g font-size="12">
    <rect x="150" y="60" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="170" y="79" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <line x1="190" y1="74" x2="202" y2="74" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="206" y="60" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="226" y="79" text-anchor="middle" fill="#333" font-weight="bold">2</text>
    <line x1="246" y1="74" x2="258" y2="74" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="262" y="60" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="282" y="79" text-anchor="middle" fill="#333" font-weight="bold">3</text>
    <line x1="302" y1="74" x2="314" y2="74" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="318" y="60" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="338" y="79" text-anchor="middle" fill="#333" font-weight="bold">4</text>
    <line x1="358" y1="74" x2="370" y2="74" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="374" y="60" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="394" y="79" text-anchor="middle" fill="#333" font-weight="bold">5</text>
  </g>

  <!-- Row 2: ① 找中点 -->
  <text x="20" y="138" font-size="11" fill="#444" font-weight="bold">① 找中点</text>
  <text x="20" y="152" font-size="9" fill="#888">slow→3</text>
  <g font-size="12">
    <rect x="150" y="120" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="170" y="139" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <line x1="190" y1="134" x2="202" y2="134" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="206" y="120" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="226" y="139" text-anchor="middle" fill="#333" font-weight="bold">2</text>
    <line x1="246" y1="134" x2="258" y2="134" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="262" y="120" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="5" filter="url(#rough2)"/>
    <text x="282" y="139" text-anchor="middle" fill="#333" font-weight="bold">3</text>
    <line x1="301" y1="116" x2="301" y2="152" stroke="#b85450" stroke-width="1.8" stroke-dasharray="3,2" filter="url(#rough2)"/>
    <rect x="318" y="120" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="338" y="139" text-anchor="middle" fill="#333" font-weight="bold">4</text>
    <line x1="358" y1="134" x2="370" y2="134" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
    <rect x="374" y="120" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="394" y="139" text-anchor="middle" fill="#333" font-weight="bold">5</text>
  </g>

  <!-- Row 3: ② 反转右半 -->
  <text x="20" y="198" font-size="11" fill="#444" font-weight="bold">② 反转右半</text>
  <text x="20" y="212" font-size="9" fill="#888">5→4</text>
  <g font-size="12">
    <rect x="150" y="180" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="170" y="199" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <line x1="190" y1="194" x2="202" y2="194" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="206" y="180" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="226" y="199" text-anchor="middle" fill="#333" font-weight="bold">2</text>
    <line x1="246" y1="194" x2="258" y2="194" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="262" y="180" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="282" y="199" text-anchor="middle" fill="#333" font-weight="bold">3</text>
    <line x1="301" y1="176" x2="301" y2="212" stroke="#b85450" stroke-width="1.8" stroke-dasharray="3,2" filter="url(#rough2)"/>
    <rect x="318" y="180" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="5" filter="url(#rough2)"/>
    <text x="338" y="199" text-anchor="middle" fill="#b85450" font-weight="bold">5</text>
    <line x1="358" y1="194" x2="370" y2="194" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrRed)" filter="url(#rough2)"/>
    <rect x="374" y="180" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="394" y="199" text-anchor="middle" fill="#b85450" font-weight="bold">4</text>
  </g>

  <!-- Row 4: ③ 合并第 1 轮 -->
  <text x="20" y="258" font-size="11" fill="#444" font-weight="bold">③ 合并轮1</text>
  <text x="20" y="272" font-size="9" fill="#888">first→2</text>
  <text x="20" y="284" font-size="9" fill="#888">second→4</text>
  <g font-size="12">
    <rect x="150" y="240" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5" filter="url(#rough2)"/>
    <text x="170" y="259" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <line x1="190" y1="254" x2="202" y2="254" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrRed)" filter="url(#rough2)"/>
    <rect x="206" y="240" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="5" filter="url(#rough2)"/>
    <text x="226" y="259" text-anchor="middle" fill="#b85450" font-weight="bold">5</text>
    <line x1="246" y1="254" x2="258" y2="254" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="262" y="240" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5" filter="url(#rough2)"/>
    <text x="282" y="259" text-anchor="middle" fill="#333" font-weight="bold">2</text>
    <line x1="302" y1="254" x2="314" y2="254" stroke="#446688" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="330" y="260" font-size="11" fill="#888">→ 3 ⊥</text>
    <!-- dangling 4 -->
    <rect x="430" y="240" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" rx="5" filter="url(#rough2)"/>
    <text x="450" y="259" text-anchor="middle" fill="#b85450" font-weight="bold">4</text>
    <text x="450" y="284" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">second 待插</text>
  </g>

  <!-- Row 5: ③ 合并第 2 轮 = 结果 -->
  <text x="20" y="318" font-size="11" fill="#444" font-weight="bold">③ 合并轮2</text>
  <text x="20" y="332" font-size="9" fill="#888">= 结果 ✓</text>
  <g font-size="12">
    <rect x="150" y="300" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="170" y="319" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <line x1="190" y1="314" x2="202" y2="314" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="206" y="300" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="226" y="319" text-anchor="middle" fill="#b85450" font-weight="bold">5</text>
    <line x1="246" y1="314" x2="258" y2="314" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="262" y="300" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="282" y="319" text-anchor="middle" fill="#333" font-weight="bold">2</text>
    <line x1="302" y1="314" x2="314" y2="314" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="318" y="300" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="338" y="319" text-anchor="middle" fill="#b85450" font-weight="bold">4</text>
    <line x1="358" y1="314" x2="370" y2="314" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="374" y="300" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="394" y="319" text-anchor="middle" fill="#333" font-weight="bold">3</text>
  </g>
  <text x="434" y="319" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- footer -->
  <rect x="30" y="360" width="540" height="80" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="44" y="380" font-size="11" fill="#4a7a3a" font-weight="bold">观察：</text>
  <text x="44" y="398" font-size="10" fill="#555">• 前半 [1,2,3] 比右半 [5,4] 多一个节点，合并时右半先耗尽，末节点 3 留在最后。</text>
  <text x="44" y="414" font-size="10" fill="#555">• 每轮右半摘一个插到 first 后：轮1 摘 5 插到 1 后，轮2 摘 4 插到 2 后，恰好交错。</text>
  <text x="44" y="430" font-size="10" fill="#555">• 偶数长链（如 [1,2,3,4]）前后半等长，右半同样先耗尽，逻辑无需特判。</text>
</svg>
