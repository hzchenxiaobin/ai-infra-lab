<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：遍历词表 → 长度守卫 → 逐字符比较 → 计数</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888">长度不足直接跳过；逐位比较首个不等即 break</text>

  <!-- ===== Start node ===== -->
  <ellipse cx="100" cy="74" rx="46" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="78" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">开始</text>

  <!-- arrow start -> init -->
  <path d="M 100 94 L 100 118" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Init: ans=0, i=0 ===== -->
  <rect x="48" y="120" width="104" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="100" y="138" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">初始化</text>
  <text x="100" y="154" text-anchor="middle" font-size="10" fill="#555">ans=0, i=0</text>

  <!-- arrow init -> outer cond -->
  <path d="M 100 164 L 100 188" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Outer loop condition diamond ===== -->
  <polygon points="100,190 172,224 100,258 28,224" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="220" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">i &lt; n?</text>
  <text x="100" y="236" text-anchor="middle" font-size="10" fill="#555">(还有词)</text>

  <!-- ===== YES branch: go right ===== -->
  <path d="M 172 224 L 210 224" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="191" y="218" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- ===== Length guard box ===== -->
  <rect x="210" y="202" width="190" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="305" y="220" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">若 len(w) &lt; m：跳过</text>
  <text x="305" y="236" text-anchor="middle" font-size="10" fill="#555">m = len(pref)，长度守卫 O(1) 拒绝</text>

  <!-- arrow -> compare -->
  <path d="M 305 246 L 305 270" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Compare box ===== -->
  <rect x="210" y="272" width="190" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="305" y="290" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">比较 w[0..m−1] 与 pref</text>
  <text x="305" y="306" text-anchor="middle" font-size="10" fill="#555">首个 w[j]≠pref[j] 即 break</text>

  <!-- arrow compare -> update -->
  <path d="M 305 316 L 305 330" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== NO branch: go down to return ===== -->
  <path d="M 100 258 L 100 282" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="112" y="274" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- ===== Return node ===== -->
  <ellipse cx="100" cy="306" rx="56" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="100" y="302" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回 ans</text>
  <text x="100" y="318" text-anchor="middle" font-size="10" fill="#555">(匹配的词数)</text>

  <!-- ===== Update ans: ans += (all equal ? 1 : 0) ===== -->
  <rect x="210" y="332" width="190" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="305" y="346" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">ans += (全部相等?1:0) → i++ 回外层</text>

  <!-- arrow update -> back to outer cond -->
  <path d="M 400 342 L 430 342 L 430 224 L 400 224" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Footer -->
  <text x="100" y="346" text-anchor="middle" font-size="9.5" fill="#aaa">时间 O(N·m) · 空间 O(1)</text>
</svg>
