<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心概念：宽高比相同 → 矩形可互换</text>

  <!-- Group A: ratio 4:3 -->
  <text x="150" y="58" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">A 组：宽高比 = 4 : 3</text>

  <!-- Rect 1: 4x3 -->
  <rect x="70" y="70" width="80" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="110" y="104" text-anchor="middle" font-size="11" fill="#333">4 × 3</text>
  <text x="110" y="142" text-anchor="middle" font-size="9" fill="#888">w:h = 4:3</text>

  <!-- Rect 2: 8x6 (scaled) -->
  <rect x="170" y="64" width="120" height="90" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="230" y="112" text-anchor="middle" font-size="11" fill="#333">8 × 6</text>
  <text x="230" y="166" text-anchor="middle" font-size="9" fill="#888">w:h = 8:6 = 4:3</text>

  <!-- equals sign -->
  <text x="150" y="186" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">4/3 = 8/6 ✓ 可互换</text>

  <!-- Group B: ratio 3:2 -->
  <text x="420" y="58" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">B 组：宽高比 = 3 : 2</text>

  <!-- Rect 3: 3x2 -->
  <rect x="350" y="74" width="60" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="380" y="98" text-anchor="middle" font-size="11" fill="#333">3 × 2</text>
  <text x="380" y="126" text-anchor="middle" font-size="9" fill="#888">w:h = 3:2</text>

  <!-- Rect 4: 6x4 (scaled) -->
  <rect x="430" y="70" width="120" height="80" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="490" y="114" text-anchor="middle" font-size="11" fill="#333">6 × 4</text>
  <text x="490" y="162" text-anchor="middle" font-size="9" fill="#888">w:h = 6:4 = 3:2</text>

  <text x="420" y="186" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">3/2 = 6/4 ✓ 可互换</text>

  <!-- Cross comparison -->
  <rect x="60" y="210" width="460" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="80" y="232" font-size="11" fill="#d6a040" font-weight="bold">跨组比较</text>
  <text x="80" y="250" font-size="10" fill="#555" font-family="monospace">4/3 = 1.333...  ≠  3/2 = 1.5  →  A 组与 B 组不可互换</text>

  <!-- Key insight -->
  <rect x="60" y="282" width="460" height="82" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="80" y="304" font-size="12" fill="#446688" font-weight="bold">关键转换</text>
  <text x="80" y="324" font-size="10" fill="#555">两个矩形可互换 ⟺ 宽高比 w₁/h₁ = w₂/h₂ ⟺ w₁·h₂ = w₂·h₁</text>
  <text x="80" y="344" font-size="10" fill="#555">浮点除法有精度风险 → 用 GCD 把比化为最简分数 (w/g, h/g) 作哈希键</text>
  <text x="80" y="360" font-size="9" fill="#888">同组 k 个矩形 → 可互换数对数 = C(k,2) = k·(k−1)/2</text>
</svg>
