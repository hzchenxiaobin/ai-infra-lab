<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrc" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8899aa"/>
    </marker>
    <marker id="arrgr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">无权图：BFS 一层一层扩散，首次到达即最短</text>

  <!-- 上：示例 1 查询②之后的图 -->
  <path d="M 107 95 L 170 95" stroke="#8899aa" stroke-width="1.6" fill="none" marker-end="url(#arrc)" filter="url(#rough2)"/>
  <path d="M 207 95 L 270 95" stroke="#8899aa" stroke-width="1.6" fill="none" marker-end="url(#arrc)" filter="url(#rough2)"/>
  <path d="M 307 95 L 370 95" stroke="#8899aa" stroke-width="1.6" fill="none" marker-end="url(#arrc)" filter="url(#rough2)"/>
  <path d="M 407 95 L 470 95" stroke="#8899aa" stroke-width="1.6" fill="none" marker-end="url(#arrc)" filter="url(#rough2)"/>
  <path d="M 90 81 Q 190 38 290 81" stroke="#4a7a3a" stroke-width="2.5" fill="none" marker-end="url(#arrgr)" filter="url(#rough2)"/>
  <path d="M 290 81 Q 390 38 490 81" stroke="#4a7a3a" stroke-width="2.5" fill="none" marker-end="url(#arrgr)" filter="url(#rough2)"/>
  <text x="190" y="54" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">(0,2)</text>
  <text x="390" y="54" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">(2,4)</text>
  <circle cx="90" cy="95" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="190" cy="95" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="290" cy="95" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="390" cy="95" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="490" cy="95" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="90" y="99" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="190" y="99" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="290" y="99" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="390" y="99" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="490" y="99" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="260" y="128" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">示例 1 处理完查询 ② 后的图：0 → 2 → 4 就是最短路</text>

  <!-- 下：分层 -->
  <text x="128" y="172" text-anchor="end" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">层 0（dist=0）</text>
  <rect x="140" y="150" width="240" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="260" cy="168" r="13" fill="#ffffff" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="172" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>

  <path d="M 260 189 L 260 200" stroke="#8899aa" stroke-width="2" fill="none" marker-end="url(#arrc)" filter="url(#rough2)"/>
  <text x="272" y="197" font-size="10.5" fill="#888" filter="url(#rough2)">出边全部 +1</text>

  <text x="128" y="223" text-anchor="end" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">层 1（dist=1）</text>
  <rect x="140" y="202" width="240" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="225" cy="220" r="13" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="225" y="224" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="295" cy="220" r="13" fill="#ffffff" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="295" y="224" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>

  <path d="M 260 241 L 260 252" stroke="#8899aa" stroke-width="2" fill="none" marker-end="url(#arrc)" filter="url(#rough2)"/>
  <text x="272" y="249" font-size="10.5" fill="#888" filter="url(#rough2)">出边全部 +1</text>

  <text x="128" y="275" text-anchor="end" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">层 2（dist=2）</text>
  <rect x="140" y="254" width="240" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="225" cy="272" r="13" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="225" y="276" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <circle cx="295" cy="272" r="13" fill="#ffffff" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="295" y="276" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>

  <!-- 右侧注记 -->
  <text x="398" y="168" font-size="11" fill="#a07830" filter="url(#rough2)">队列先进先出</text>
  <text x="398" y="184" font-size="11" fill="#a07830" filter="url(#rough2)">同层节点抱团</text>
  <text x="398" y="238" font-size="11" fill="#a07830" filter="url(#rough2)">首次碰到 v</text>
  <text x="398" y="254" font-size="11" fill="#a07830" filter="url(#rough2)">dist 即最短</text>

  <rect x="48" y="312" width="424" height="38" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="336" text-anchor="middle" font-size="11.5" fill="#8a3a34" filter="url(#rough2)">边权全为 1：绕路只会更晚到达 —— 第一次碰到的层号就是最短距离</text>
</svg>
