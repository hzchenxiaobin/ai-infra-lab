<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <text x="20" y="28" font-size="13" fill="#333" filter="url(#rough2)">算法流程：去重建掩码 → 逐对判定 → 边判边并 → 数分量</text>

  <!-- Step 1 -->
  <rect x="150" y="46" width="220" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="61" text-anchor="middle" font-size="11.5" fill="#224466" filter="url(#rough2)">每行去重 → 位掩码 mask[i]</text>
  <text x="260" y="74" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">值 v 出现过就把第 v 位置 1（幂等，天然去重）</text>

  <path d="M260,80 L260,100" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="150" y="104" width="220" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="123" text-anchor="middle" font-size="11.5" fill="#224466" filter="url(#rough2)">双重循环：for i &lt; j ≤ n−1</text>

  <path d="M260,134 L260,154" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: decision diamond -->
  <polygon points="260,158 366,192 260,226 154,192" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="188" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">popcount(mask[i]</text>
  <text x="260" y="202" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">&amp; mask[j]) ≥ k ?</text>

  <!-- No branch: loop back -->
  <path d="M366,192 L424,192 L424,119 L370,119" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="396" y="184" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <text x="446" y="160" font-size="10" fill="#999" filter="url(#rough2)">跳过</text>
  <text x="446" y="174" font-size="10" fill="#999" filter="url(#rough2)">此对</text>

  <!-- Yes branch -->
  <path d="M260,226 L260,248" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="242" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- Step 4: union check diamond -->
  <polygon points="260,252 352,284 260,316 168,284" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="280" text-anchor="middle" font-size="11" fill="#2a4a1a" filter="url(#rough2)">find(i) ≠</text>
  <text x="260" y="294" text-anchor="middle" font-size="11" fill="#2a4a1a" filter="url(#rough2)">find(j) ?</text>

  <!-- same root: skip -->
  <path d="M168,284 L118,284 L118,119 L150,119" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="276" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <text x="76" y="252" font-size="10" fill="#999" filter="url(#rough2)">已在同</text>
  <text x="76" y="266" font-size="10" fill="#999" filter="url(#rough2)">一分量</text>

  <!-- different root: union -->
  <path d="M260,316 L260,338" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="332" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="150" y="342" width="220" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="357" text-anchor="middle" font-size="11.5" fill="#2a4a1a" filter="url(#rough2)">union(i, j)，ans−−</text>
  <text x="260" y="370" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">ans 初始为 n，只有有效合并才减</text>

  <path d="M370,359 L424,359 L424,119 L370,119" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="336" font-size="10" fill="#999" filter="url(#rough2)">下一对</text>
  <text x="440" y="350" font-size="10" fill="#999" filter="url(#rough2)">(i, j)</text>

  <path d="M150,359 L100,359 L100,414 L146,414" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="112" y="392" font-size="10" fill="#999" filter="url(#rough2)">循环结束</text>

  <!-- End -->
  <rect x="150" y="398" width="220" height="32" rx="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="418" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">返回 ans（连通分量数）</text>

  <!-- note -->
  <rect x="388" y="398" width="120" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="448" y="416" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">全程无邻接表、</text>
  <text x="448" y="430" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">无 visited、无队列</text>
</svg>
