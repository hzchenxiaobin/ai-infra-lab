<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：离散化 + max 树状数组（前缀最大值）</text>

  <!-- 步骤 1 -->
  <rect x="90" y="50" width="340" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="70" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">① 预处理：b[i] = nums[i] − i</text>
  <text x="260" y="88" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">排序去重 → 离散化排名 1..m（m ≤ n）</text>

  <path d="M 260 96 L 260 118" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环容器 -->
  <rect x="60" y="122" width="400" height="150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="7,5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="142" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">② 从左到右遍历 i = 0 … n − 1</text>

  <rect x="80" y="152" width="360" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="171" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">r = rank(b[i])；best = BIT.query(r)（b ≤ b[i] 的最大 dp）</text>

  <rect x="80" y="190" width="360" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="209" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">dp[i] = nums[i] + max(0, best)；ans = max(ans, dp[i])</text>

  <rect x="80" y="228" width="360" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="247" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">BIT.update(r, dp[i])：把自己挂上树，供后面接龙</text>

  <!-- 循环回边 -->
  <path d="M 444 244 C 458 210 458 170 444 150" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="484" y="200" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">下一个</text>
  <text x="484" y="214" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">i</text>

  <path d="M 260 272 L 260 292" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 3 -->
  <rect x="110" y="296" width="300" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="320" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">③ 返回 ans（= max dp[i]，可为负）</text>

  <!-- 要点注释 -->
  <rect x="60" y="350" width="400" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="366" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">max(0, best)：前驱全是负收益就断开，从 i 单开新序列</text>
  <text x="260" y="382" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">—— 单元素必平衡；平衡子序列删掉前缀仍平衡</text>
</svg>
