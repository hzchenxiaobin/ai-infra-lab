<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：「同时」改挂——所有新父节点都在原树上判定</text>

  <!-- ===== 左侧：原树（示例 2） ===== -->
  <text x="130" y="48" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">原树 s = "abbba"</text>

  <!-- 边 -->
  <line x1="130" y1="96" x2="85" y2="136" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="130" y1="96" x2="185" y2="136" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="85" y1="166" x2="85" y2="211" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="85" y1="241" x2="85" y2="286" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- 改挂虚线箭头 4→0（红） -->
  <path d="M 68 216 Q 18 150 110 92" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="16" y="140" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">np[4]=0</text>
  <text x="16" y="152" font-size="8" fill="#b85450" filter="url(#rough2)">'a'→最近'a'祖先</text>

  <!-- 改挂虚线箭头 2→1（橙） -->
  <path d="M 102 292 Q 170 250 100 168" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="150" y="238" font-size="9" fill="#a07830" font-weight="bold" filter="url(#rough2)">np[2]=1</text>
  <text x="150" y="250" font-size="8" fill="#a07830" filter="url(#rough2)">'b'→最近'b'祖先</text>

  <!-- 节点 0:a（蓝） -->
  <circle cx="130" cy="80" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="130" y="84" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">0:a</text>

  <!-- 节点 1:b（绿） -->
  <circle cx="85" cy="150" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="85" y="154" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1:b</text>

  <!-- 节点 3:b（绿） -->
  <circle cx="185" cy="150" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="185" y="154" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3:b</text>

  <!-- 节点 4:a（橙填充，被改挂） -->
  <circle cx="85" cy="225" r="15" fill="#fff8e1" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="85" y="229" text-anchor="middle" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">4:a</text>

  <!-- 节点 2:b（橙填充，被改挂） -->
  <circle cx="85" cy="300" r="15" fill="#fff8e1" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="85" y="304" text-anchor="middle" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">2:b</text>

  <text x="130" y="330" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">红圈＝被改挂的节点，虚线箭头＝新父节点</text>

  <!-- 分隔线 -->
  <line x1="260" y1="42" x2="260" y2="320" stroke="#ccc" stroke-width="1.2" stroke-dasharray="4 5" filter="url(#rough2)"/>

  <!-- ===== 右侧：新树 ===== -->
  <text x="395" y="48" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">新树 answer = [5,2,1,1,1]</text>

  <!-- 边：0-1, 0-3 灰；0-4 红（新边）；1-2 橙（新边） -->
  <line x1="384" y1="94" x2="330" y2="150" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="395" y1="96" x2="395" y2="150" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 408 92 Q 455 120 468 148" fill="none" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <path d="M 318 178 Q 300 200 318 226" fill="none" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>

  <!-- 节点 0:a -->
  <circle cx="395" cy="80" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="395" y="84" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">0:a</text>
  <text x="395" y="60" text-anchor="middle" font-size="9" fill="#33506b" font-weight="bold" filter="url(#rough2)">size=5</text>

  <!-- 节点 1:b -->
  <circle cx="322" cy="163" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="322" y="167" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1:b</text>
  <text x="322" y="196" text-anchor="middle" font-size="9" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">size=2</text>

  <!-- 节点 3:b -->
  <circle cx="395" cy="163" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="395" y="167" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3:b</text>
  <text x="395" y="196" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">1</text>

  <!-- 节点 4:a -->
  <circle cx="470" cy="163" r="15" fill="#fff8e1" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="470" y="167" text-anchor="middle" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">4:a</text>
  <text x="470" y="196" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">1</text>

  <!-- 节点 2:b -->
  <circle cx="322" cy="240" r="15" fill="#fff8e1" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="322" y="244" text-anchor="middle" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">2:b</text>
  <text x="322" y="272" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">1</text>

  <text x="395" y="300" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">4 挂到 0 下、2 挂到 1 下，其余不动</text>
  <text x="395" y="314" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">（同时执行，互不干扰）</text>

  <!-- ===== 底部结论框 ===== -->
  <rect x="30" y="340" width="460" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="353" text-anchor="middle" font-size="9.5" fill="#7a5a20" filter="url(#rough2)">新父节点必是原树祖先（深度更小）⇒ 无环，仍是根为 0 的树</text>
  <text x="260" y="366" text-anchor="middle" font-size="9.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">先在原树上一趟算出全部 np[x]，再统一建新树</text>
</svg>
