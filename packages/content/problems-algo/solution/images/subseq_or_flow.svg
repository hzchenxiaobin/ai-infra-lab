<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：一趟扫描，OR 进前缀和与元素</text>

  <!-- 开始 -->
  <ellipse cx="200" cy="58" rx="118" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="63" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">开始：ans = 0，prefix = 0</text>
  <path d="M200,80 L200,96" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环节点 -->
  <rect x="60" y="98" width="280" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="200" y="120" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">遍历 x ∈ nums（单趟，原序即可）</text>
  <path d="M200,134 L200,150" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- prefix += x -->
  <rect x="60" y="152" width="280" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="200" y="174" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">prefix += x    （累加前缀和）</text>
  <path d="M200,188 L200,204" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ans |= x（情形② 红） -->
  <rect x="60" y="206" width="280" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="200" y="228" text-anchor="middle" font-size="13" fill="#7a2a26" filter="url(#rough2)">ans |= x    （单元素兜底 · 情形②）</text>
  <path d="M200,242 L200,258" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ans |= prefix（情形① 绿） -->
  <rect x="60" y="260" width="280" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="200" y="282" text-anchor="middle" font-size="13" fill="#2f5a22" filter="url(#rough2)">ans |= prefix    （前缀和命中 · 情形①）</text>
  <path d="M200,296 L200,312" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 返回 -->
  <ellipse cx="200" cy="334" rx="100" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="339" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">返回 ans</text>

  <!-- 循环回边：从 ans|=prefix 右侧 → 上 → 循环节点右侧 -->
  <path d="M340,277 L372,277 L372,115 L342,115" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="388" y="200" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">下</text>
  <text x="388" y="216" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">一 x</text>

  <!-- 右侧要点 -->
  <rect x="420" y="150" width="128" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="484" y="176" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">要点</text>
  <text x="484" y="198" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">· 无需排序</text>
  <text x="484" y="218" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">· O(n) 时间</text>
  <text x="484" y="238" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">· O(1) 额外空间</text>
  <text x="484" y="258" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">· prefix 用 long long</text>
</svg>
