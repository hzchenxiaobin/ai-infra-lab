<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例 2 演算：graph = [[1,3],[0],[3],[0,2]] → 输出 1</text>

  <text x="100" y="52" text-anchor="middle" font-size="11" fill="#888">图结构</text>

  <line x1="100" y1="93" x2="64" y2="132" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="100" y1="93" x2="100" y2="156" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="100" y1="93" x2="100" y2="156" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>

  <circle cx="100" cy="78" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="100" y="83" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">洞</text>
  <text x="100" y="108" text-anchor="middle" font-size="9" fill="#d6a040">0</text>

  <circle cx="55" cy="148" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="55" y="153" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <text x="55" y="133" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">鼠</text>

  <circle cx="100" cy="172" r="14" fill="#f5f5f5" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="177" text-anchor="middle" font-size="10" fill="#888">3</text>

  <path d="M 55 136 Q 80 108 95 88" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrg)" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="30" y="104" font-size="10" fill="#4a7a3a" font-weight="bold">鼠→洞</text>

  <rect x="215" y="44" width="305" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="367" y="66" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">终态 (m=0, c=2, 猫走) → 鼠赢(1)</text>
  <text x="240" y="88" font-size="10" fill="#444">m == 0：鼠在洞口 → 鼠获胜</text>
  <text x="240" y="104" font-size="10" fill="#666">此态在初始化时染绿色并入队</text>

  <path d="M 367 114 L 367 130" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="395" y="126" font-size="9" fill="#888">找前驱</text>

  <rect x="215" y="132" width="305" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="367" y="154" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">前驱 (m=1, c=2, 鼠走)</text>
  <text x="240" y="176" font-size="10" fill="#444">t2=鼠(1) , w=鼠赢(1) → t2 == w</text>
  <text x="240" y="194" font-size="10" fill="#444">鼠在 1 号点，graph[1]=[0]</text>
  <text x="240" y="210" font-size="10" fill="#4a7a3a" font-weight="bold">→ 鼠走 1→0 即胜，染绿(1) 入队</text>

  <path d="M 367 218 L 367 236" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="238" width="370" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="335" y="266" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">color[1][2][1] = 1 → 返回 1（鼠赢）</text>

  <rect x="20" y="300" width="500" height="64" fill="#f5f5f5" stroke="#888" stroke-width="1" stroke-dasharray="3,2" rx="6" filter="url(#rough2)"/>
  <text x="270" y="322" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">对比示例 1：graph = [[2,5],[3],[0,4,5],…]</text>
  <text x="270" y="340" text-anchor="middle" font-size="10" fill="#888">鼠从 1 只能到 3，猫从 2 可走 4/5，双方反复追逃无必胜路</text>
  <text x="270" y="356" text-anchor="middle" font-size="10" fill="#888">BFS 结束后 color[1][2][1] 仍为 0 → 平局</text>
</svg>
