<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>

  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：唯一子数组向外扩一格仍唯一 ⇒ P(L) 关于长度单调</text>

  <!-- strip A -->
  <text x="120" y="72" text-anchor="end" font-size="12" fill="#555" filter="url(#rough2)">nums</text>
  <rect x="150" y="48" width="52" height="44" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="176" y="76" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="204" y="48" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="76" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="258" y="48" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="284" y="76" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="312" y="48" width="52" height="44" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="338" y="76" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="366" y="48" width="52" height="44" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="392" y="76" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>

  <path d="M 204 96 L 204 102 L 310 102 L 310 96" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="257" y="120" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">A = [1,2]：同内容的窗口全数组只有这 1 个 ⇒ 唯一</text>

  <!-- extend arrow -->
  <path d="M 280 130 L 280 148" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="292" y="144" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">向右扩一格</text>

  <!-- strip B -->
  <rect x="150" y="154" width="52" height="44" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="176" y="182" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="204" y="154" width="52" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="182" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="258" y="154" width="52" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="284" y="182" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="312" y="154" width="52" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="338" y="182" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="366" y="154" width="52" height="44" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="392" y="182" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>

  <text x="257" y="222" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">B = A 加上右邻 = [1,2,2]：若 B 还在别处出现，其前 2 格（正是 A）也出现两次 ⇒ 矛盾 ⇒ B 仍唯一</text>
  <text x="257" y="240" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">（左扩同理：[1,1,2] 的后 2 格是 A；左右总有一侧能扩，因为 L &lt; n 时 A 未铺满数组）</text>

  <!-- reasoning box -->
  <rect x="60" y="254" width="520" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="320" y="276" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">长的相同 ⇒ 短的随之相同（两边同时砍掉同一侧一格）；</text>
  <text x="320" y="296" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">于是 P(L) ⟹ P(L+1)，且 P(n) 恒真——整个数组只有一个长 n 的子数组</text>

  <!-- monotonic ladder -->
  <text x="320" y="336" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold" filter="url(#rough2)">P(L)：存在长度 L 的唯一子数组</text>

  <rect x="110" y="350" width="44" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="132" y="376" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="132" y="410" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">L=1</text>

  <rect x="170" y="350" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="192" y="376" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="192" y="410" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">L=2</text>

  <rect x="230" y="350" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="252" y="376" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="252" y="410" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">L=3</text>

  <text x="300" y="376" text-anchor="middle" font-size="14" fill="#888" filter="url(#rough2)">...</text>

  <rect x="330" y="350" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="352" y="376" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="352" y="410" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">L=n</text>

  <path d="M 420 370 L 470 370" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="476" y="352" width="120" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="536" y="375" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">二分找第一个 ✓</text>

  <text x="320" y="444" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">假…假 真…真：单调布尔序列，最小真值即「最短唯一子数组」长度</text>
</svg>
