<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="500" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    算法流程：贪心取 3-块，尾部按 4 / 2-or-3 收尾
  </text>

  <!-- Start -->
  <ellipse cx="270" cy="58" rx="44" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="62" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M270,76 L270,92" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- digits = filter; n = len -->
  <rect x="140" y="96" width="260" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="270" y="117" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">digits = 过滤掉非数字; n = len(digits)</text>
  <path d="M270,130 L270,144" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i = 0; parts = [] -->
  <rect x="214" y="148" width="112" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="168" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i = 0; parts = []</text>
  <path d="M270,178 L270,194" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond: n - i > 4 ? -->
  <polygon points="270,198 356,228 270,258 184,228" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="232" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">n − i &gt; 4 ?</text>

  <!-- yes branch: take 3 -->
  <path d="M356,228 L412,228" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="384" y="221" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="414" y="212" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="474" y="232" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">parts.append(3); i+=3</text>
  <!-- loop back to diamond top -->
  <path d="M474,212 L474,188 L270,188 L270,198" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- no branch: down to diamond2 -->
  <path d="M270,258 L270,274" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="272" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- diamond2: n - i == 4 ? -->
  <polygon points="270,278 352,308 270,338 188,308" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="312" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">n − i == 4 ?</text>

  <!-- yes (==4): left to split 2+2 -->
  <path d="M188,308 L134,308" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="161" y="301" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="14" y="292" width="120" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="74" y="313" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">拆 2 + 2：两块</text>

  <!-- no (!=4): down, append rest (2 or 3) -->
  <path d="M270,338 L270,354" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="352" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="150" y="358" width="240" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="378" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">parts.append(s[i:n])  尾 2 或 3 一块收</text>

  <!-- converge: from split-2+2 (74,326) down then right to join -->
  <path d="M74,326 L74,408 L200,408" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- from append-rest (270,390) down to join -->
  <path d="M270,390 L270,400" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- join -->
  <rect x="200" y="408" width="140" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="270" y="428" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">'-'.join(parts)</text>
  <path d="M270,440 L270,452" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return -->
  <rect x="226" y="454" width="88" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="475" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">return ans</text>
</svg>
