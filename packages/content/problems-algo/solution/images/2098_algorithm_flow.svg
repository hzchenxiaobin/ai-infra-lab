<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：排序 → 取 Top-K → 奇偶判定 → 至多一次交换</text>

  <!-- Step 1: Sort -->
  <rect x="190" y="44" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">① 降序排序 nums</text>

  <path d="M 280 80 L 280 96" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 2: Take top-k, compute sum -->
  <rect x="160" y="100" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="122" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">② 取前 K 个，求和 S</text>

  <path d="M 280 136 L 280 152" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Decision: S even? -->
  <polygon points="280,156 380,196 280,236 180,196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="192" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">S 是偶数？</text>

  <!-- Yes branch -->
  <path d="M 180 196 L 80 196 L 80 224" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" fill="none" filter="url(#rough2)"/>
  <text x="120" y="188" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="30" y="228" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="80" y="250" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 S</text>

  <!-- No branch -->
  <path d="M 380 196 L 480 196 L 480 224" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" fill="none" filter="url(#rough2)"/>
  <text x="440" y="188" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- Step 3: Find 4 candidates -->
  <rect x="370" y="228" width="220" height="72" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="480" y="248" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">③ 找四个候选</text>
  <text x="384" y="264" font-size="9.5" fill="#666" filter="url(#rough2)">min_odd_in：Top-K 中最小奇数</text>
  <text x="384" y="278" font-size="9.5" fill="#666" filter="url(#rough2)">max_even_out：剩余中最大偶数</text>
  <text x="384" y="292" font-size="9.5" fill="#666" filter="url(#rough2)">min_even_in：Top-K 中最小偶数</text>
  <text x="384" y="306" font-size="9.5" fill="#666" filter="url(#rough2)">max_odd_out：剩余中最大奇数</text>

  <path d="M 480 302 L 480 320" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 4: Two options -->
  <rect x="120" y="324" width="180" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="210" y="342" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">方案 A（若候选存在）</text>
  <text x="210" y="360" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">S − min_odd_in + max_even_out</text>

  <rect x="330" y="324" width="180" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="420" y="342" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">方案 B（若候选存在）</text>
  <text x="420" y="360" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">S − min_even_in + max_odd_out</text>

  <path d="M 210 370 L 210 386" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrg)" fill="none" filter="url(#rough2)"/>
  <path d="M 420 370 L 420 386" stroke="#d6a040" stroke-width="1.4" marker-end="url(#arro)" fill="none" filter="url(#rough2)"/>

  <!-- Step 5: Return max or -1 -->
  <rect x="120" y="390" width="390" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="315" y="412" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">④ 返回 max(有效方案)；两方案均不可行 → 返回 −1</text>
</svg>
