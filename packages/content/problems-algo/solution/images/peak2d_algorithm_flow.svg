<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="560" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">寻找峰值II：算法流程</text>

  <!-- Init -->
  <rect x="200" y="44" width="200" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="66" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">初始化</text>
  <text x="300" y="86" text-anchor="middle" font-size="11" fill="#555">top = 0,  bottom = m − 1</text>

  <path d="M 300 104 L 300 122" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Loop condition -->
  <polygon points="300,126 430,176 300,226 170,176" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="172" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">top &lt; bottom ?</text>
  <text x="300" y="190" text-anchor="middle" font-size="10.5" fill="#777">区间至少 2 行</text>

  <!-- No: exit to single row (far right) -->
  <path d="M 430 176 L 540 176 L 540 470" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="438" y="168" font-size="11" fill="#b85450" font-weight="bold">No</text>

  <path d="M 300 226 L 300 246" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="310" y="240" font-size="11" fill="#82b366" font-weight="bold">Yes</text>

  <!-- mid + find maxCol -->
  <rect x="160" y="250" width="280" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="300" y="272" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">mid = top + (bottom − top) / 2</text>
  <text x="300" y="292" text-anchor="middle" font-size="11" fill="#555">maxCol = argmax(mat[mid][*])  ← O(n)</text>

  <path d="M 300 310 L 300 328" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Decision: cur vs up/down -->
  <polygon points="300,332 440,388 300,444 160,388" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="380" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">cur &gt; up 且 cur &gt; down ?</text>
  <text x="300" y="398" text-anchor="middle" font-size="10" fill="#777">上下越界视为 −1</text>

  <!-- Yes: return peak (far left) -->
  <path d="M 160 388 L 70 388 L 70 432" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="86" y="380" font-size="11" fill="#d6a040" font-weight="bold">Yes ✓</text>
  <rect x="10" y="436" width="130" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="75" y="458" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">找到峰值</text>
  <text x="75" y="476" text-anchor="middle" font-size="10.5" fill="#d6a040">return [mid, maxCol]</text>
  <text x="75" y="490" text-anchor="middle" font-size="9" fill="#aaa">水平+垂直均满足</text>

  <!-- No: split into up/down (downward) -->
  <path d="M 300 444 L 300 460" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="310" y="456" font-size="10.5" fill="#777">No</text>

  <!-- split node -->
  <circle cx="300" cy="466" r="4" fill="#888" filter="url(#rough2)"/>

  <!-- up > cur: go to up box (left) -->
  <path d="M 300 466 L 200 466 L 200 488" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="232" y="460" font-size="10" fill="#b85450" font-weight="bold">up &gt; cur ↑</text>
  <rect x="140" y="492" width="120" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="200" y="512" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">上半区</text>
  <text x="200" y="528" text-anchor="middle" font-size="10.5" fill="#b85450">bottom = mid−1</text>

  <!-- down > cur: go to down box (right of up box) -->
  <path d="M 300 466 L 400 466 L 400 488" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="330" y="460" font-size="10" fill="#4a7a3a" font-weight="bold">down &gt; cur ↓</text>
  <rect x="340" y="492" width="120" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="400" y="512" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">下半区</text>
  <text x="400" y="528" text-anchor="middle" font-size="10.5" fill="#4a7a3a">top = mid+1</text>

  <!-- loop back from both up/down boxes to loop diamond -->
  <path d="M 200 542 L 200 554 L 300 554 L 300 176 L 170 176" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 400 542 L 400 554 L 300 554" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="220" y="550" font-size="9.5" fill="#aaa">折半后继续</text>

  <!-- single row exit box (far right bottom) -->
  <rect x="478" y="472" width="120" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="538" y="492" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">区间剩 1 行</text>
  <text x="538" y="510" text-anchor="middle" font-size="10" fill="#446688">取该行 maxCol</text>
  <text x="538" y="524" text-anchor="middle" font-size="10" fill="#446688">返回 [top, maxCol]</text>

  <!-- complexity badge -->
  <text x="300" y="548" text-anchor="middle" font-size="9.5" fill="#d6a040" font-style="italic">O(n log m), O(1)</text>
</svg>
