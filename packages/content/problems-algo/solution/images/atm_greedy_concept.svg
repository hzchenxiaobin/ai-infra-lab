<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：贪心从大到小取钞 + 原子性提交</text>

  <!-- ===== Section 1: Denominations with greedy arrow ===== -->
  <path d="M 92 58 L 478 58" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="280" y="52" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">贪心取钞方向（大到小）</text>

  <rect x="80" y="68" width="72" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="116" y="92" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">$500</text>

  <rect x="164" y="68" width="72" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="200" y="92" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">$200</text>

  <rect x="248" y="68" width="72" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="284" y="92" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">$100</text>

  <rect x="332" y="68" width="72" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="368" y="92" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">$50</text>

  <rect x="416" y="68" width="72" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="452" y="92" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">$20</text>

  <text x="280" y="124" text-anchor="middle" font-size="11" fill="#888">每种取 min(余额÷面值, 库存张数)</text>

  <!-- ===== Section 2: Atomicity ===== -->
  <rect x="40" y="140" width="480" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="160" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">原子性：先在临时副本上算方案，成功才扣库存</text>

  <rect x="60" y="170" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="120" y="192" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">临时副本算方案</text>

  <text x="195" y="192" font-size="16" fill="#888" font-weight="bold">→</text>

  <rect x="215" y="170" width="100" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="265" y="192" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">余额 = 0？</text>

  <text x="332" y="182" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <text x="332" y="204" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <rect x="360" y="166" width="86" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="403" y="184" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">扣库存 ✓</text>

  <rect x="360" y="196" width="86" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="403" y="214" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">返回 [-1] ✗</text>

  <!-- ===== Section 3: Key example ===== -->
  <rect x="40" y="232" width="480" height="140" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="252" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">关键示例：取 $600，库存 [0,1,0,3,1]（$50×1, $200×3, $500×1）</text>

  <text x="60" y="276" font-size="11" fill="#333" font-weight="bold">$500: 取 1 → 余 100</text>
  <text x="300" y="276" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="60" y="296" font-size="11" fill="#333" font-weight="bold">$200: 取 0 (100&lt;200) → 余 100</text>
  <text x="300" y="296" font-size="11" fill="#888">—</text>
  <text x="60" y="316" font-size="11" fill="#333" font-weight="bold">$100: 取 0 (库存0) → 余 100</text>
  <text x="300" y="316" font-size="11" fill="#888">—</text>
  <text x="60" y="336" font-size="11" fill="#333" font-weight="bold">$50: 取 1 (库存1) → 余 50</text>
  <text x="300" y="336" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="60" y="356" font-size="11" fill="#333" font-weight="bold">$20: 取 0 (库存0) → 余 50 ≠ 0</text>
  <text x="300" y="356" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <text x="340" y="356" font-size="12" fill="#b85450" font-weight="bold">→ 返回 [-1]</text>

  <!-- Note -->
  <rect x="40" y="382" width="480" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="401" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3×$200=$600 本可行，但 ATM 必先取 $500 → 贪心失败即拒绝</text>
</svg>
