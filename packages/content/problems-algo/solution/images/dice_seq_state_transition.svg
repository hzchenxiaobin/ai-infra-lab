<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#4a7a3a" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">状态转移：尾部窗口滑动 (a,b) → (b,x)</text>

  <!-- sequence row top: current window -->
  <text x="40" y="78" font-size="11" fill="#888">已确定尾部:</text>
  <circle cx="120" cy="72" r="18" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="120" y="77" text-anchor="middle" font-size="12" fill="#999">…</text>
  <!-- a = second to last -->
  <circle cx="172" cy="72" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="172" y="77" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">a</text>
  <!-- b = last -->
  <circle cx="224" cy="72" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="224" y="77" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">b</text>
  <text x="198" y="106" text-anchor="middle" font-size="10" fill="#888">尾部两位 = 状态</text>

  <!-- new x to place -->
  <rect x="280" y="56" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="310" y="78" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">放 x</text>
  <path d="M340 73 L380 73" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- arrow down to new window -->
  <path d="M198 112 L198 150" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- new sequence row -->
  <text x="40" y="178" font-size="11" fill="#888">滑窗后:</text>
  <circle cx="120" cy="172" r="18" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="120" y="177" text-anchor="middle" font-size="12" fill="#999">…</text>
  <circle cx="172" cy="172" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="172" y="177" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">b</text>
  <circle cx="224" cy="172" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="224" y="177" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">x</text>
  <text x="198" y="206" text-anchor="middle" font-size="10" fill="#888">新状态 (b, x)</text>

  <!-- transition constraints box -->
  <rect x="60" y="226" width="400" height="118" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="250" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">x 必须满足（仅依赖 a, b）</text>
  <text x="84" y="272" font-size="11" fill="#555">• gcd(x, b) = 1      （相邻互质）</text>
  <text x="84" y="290" font-size="11" fill="#555">• x ≠ b              （距离 1 禁同值）</text>
  <text x="84" y="308" font-size="11" fill="#555">• x ≠ a              （距离 2 禁同值）</text>
  <text x="84" y="328" font-size="11" fill="#b85450" font-weight="bold">通过 ⇒ dp_next[b][x] += dp[a][b]</text>
</svg>
