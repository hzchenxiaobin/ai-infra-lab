<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="300" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：A=[12,24,8,32], B=[13,25,32,11]</text>

  <!-- Column headers -->
  <text x="44" y="48" font-size="10" fill="#888">步骤</text>
  <text x="86" y="48" font-size="10" fill="#888">k</text>
  <text x="150" y="48" text-anchor="middle" font-size="10" fill="#888">B 当前最大</text>
  <text x="226" y="48" text-anchor="middle" font-size="10" fill="#888">A[hi]</text>
  <text x="296" y="48" font-size="10" fill="#888">能赢?</text>
  <text x="392" y="48" text-anchor="middle" font-size="10" fill="#888">分配 ans[i]</text>
  <text x="456" y="48" font-size="10" fill="#888">lo / hi</text>

  <!-- Divider under header -->
  <path d="M 30 54 L 548 54" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 1: k=3, B=32(idx2), A[hi]=32, 否, ans[2]=8(送), lo 0→1 -->
  <text x="44" y="82" font-size="11" fill="#555">1</text>
  <text x="86" y="82" font-size="11" fill="#555">3</text>
  <rect x="108" y="68" width="84" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="150" y="82" text-anchor="middle" font-size="10" fill="#333">32 (idx2)</text>
  <rect x="200" y="68" width="52" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="226" y="82" text-anchor="middle" font-size="10" fill="#333">32</text>
  <text x="296" y="82" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="340" y="68" width="104" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="392" y="82" text-anchor="middle" font-size="10" fill="#b85450">ans[2] = 8 (送)</text>
  <text x="456" y="82" font-size="10" fill="#555">lo 0→1</text>

  <!-- Row 2: k=2, B=25(idx1), A[hi]=32, 是, ans[1]=32, hi 3→2 -->
  <text x="44" y="112" font-size="11" fill="#555">2</text>
  <text x="86" y="112" font-size="11" fill="#555">2</text>
  <rect x="108" y="98" width="84" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="150" y="112" text-anchor="middle" font-size="10" fill="#333">25 (idx1)</text>
  <rect x="200" y="98" width="52" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="226" y="112" text-anchor="middle" font-size="10" fill="#333">32</text>
  <text x="296" y="112" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="340" y="98" width="104" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="392" y="112" text-anchor="middle" font-size="10" fill="#4a7a3a">ans[1] = 32</text>
  <text x="456" y="112" font-size="10" fill="#555">hi 3→2</text>

  <!-- Row 3: k=1, B=13(idx0), A[hi]=24, 是, ans[0]=24, hi 2→1 -->
  <text x="44" y="142" font-size="11" fill="#555">3</text>
  <text x="86" y="142" font-size="11" fill="#555">1</text>
  <rect x="108" y="128" width="84" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="150" y="142" text-anchor="middle" font-size="10" fill="#333">13 (idx0)</text>
  <rect x="200" y="128" width="52" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="226" y="142" text-anchor="middle" font-size="10" fill="#333">24</text>
  <text x="296" y="142" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="340" y="128" width="104" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="392" y="142" text-anchor="middle" font-size="10" fill="#4a7a3a">ans[0] = 24</text>
  <text x="456" y="142" font-size="10" fill="#555">hi 2→1</text>

  <!-- Row 4: k=0, B=11(idx3), A[hi]=12, 是, ans[3]=12, hi 1→0 -->
  <text x="44" y="172" font-size="11" fill="#555">4</text>
  <text x="86" y="172" font-size="11" fill="#555">0</text>
  <rect x="108" y="158" width="84" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="150" y="172" text-anchor="middle" font-size="10" fill="#333">11 (idx3)</text>
  <rect x="200" y="158" width="52" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="226" y="172" text-anchor="middle" font-size="10" fill="#333">12</text>
  <text x="296" y="172" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="340" y="158" width="104" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="392" y="172" text-anchor="middle" font-size="10" fill="#4a7a3a">ans[3] = 12</text>
  <text x="456" y="172" font-size="10" fill="#555">hi 1→0</text>

  <!-- Divider under rows -->
  <path d="M 30 188 L 548 188" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Result box -->
  <rect x="40" y="198" width="500" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="60" y="218" font-size="11" fill="#888">结果:</text>
  <text x="290" y="218" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">ans = [24, 32, 8, 12]</text>
  <text x="290" y="236" text-anchor="middle" font-size="11" fill="#d6a040">advantage = 3  （24&gt;13, 32&gt;25, 12&gt;11）✓</text>

  <!-- Legend -->
  <rect x="40" y="262" width="16" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="62" y="272" font-size="10" fill="#666">A[hi] 我方最大</text>
  <rect x="160" y="262" width="16" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="182" y="272" font-size="10" fill="#666">B 当前最大 / 赢</text>
  <rect x="300" y="262" width="16" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="322" y="272" font-size="10" fill="#666">牺牲（送）</text>
  <text x="430" y="272" font-size="10" fill="#999">k 从大到小 = 先决策对方最强</text>
</svg>
