<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程</text>

  <!-- Step 1 -->
  <rect x="180" y="44" width="180" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="63" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 初始化并查集</text>
  <text x="270" y="78" text-anchor="middle" font-size="10.5" fill="#666">parent[i] = i, n = len(s)</text>
  <line x1="270" y1="86" x2="270" y2="104" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="170" y="104" width="200" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="123" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 遍历 pairs，union(a, b)</text>
  <text x="270" y="138" text-anchor="middle" font-size="10.5" fill="#666">建立索引的连通关系</text>
  <line x1="270" y1="146" x2="270" y2="164" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="170" y="164" width="200" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="183" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ 按根分组</text>
  <text x="270" y="198" text-anchor="middle" font-size="10.5" fill="#666">map[find(i)].append(i)</text>
  <line x1="270" y1="206" x2="270" y2="224" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4 -->
  <rect x="160" y="224" width="220" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="243" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">④ 各分量内：提取字符并排序</text>
  <text x="270" y="258" text-anchor="middle" font-size="10.5" fill="#666">chars = sorted(s[i] for i in group)</text>
  <line x1="270" y1="266" x2="270" y2="284" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5 -->
  <rect x="160" y="284" width="220" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="303" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">⑤ 排序索引 + 回填 + 返回</text>
  <text x="270" y="318" text-anchor="middle" font-size="10.5" fill="#666">res[sorted_idx[j]] = chars[j]</text>

  <!-- Side note: optimizations -->
  <rect x="400" y="104" width="120" height="102" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="460" y="124" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">优化</text>
  <text x="460" y="140" text-anchor="middle" font-size="9.5" fill="#888">路径压缩</text>
  <text x="460" y="156" text-anchor="middle" font-size="9.5" fill="#888">+ 按秩合并</text>
  <text x="460" y="178" text-anchor="middle" font-size="9.5" fill="#aaa">find / union</text>
  <text x="460" y="192" text-anchor="middle" font-size="9.5" fill="#aaa">均摊 O(α(n))</text>

  <!-- Bottom note -->
  <rect x="60" y="338" width="420" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="270" y="358" text-anchor="middle" font-size="10.5" fill="#444">分量内排序 = 字典序最小排列（交换闭包 = 全排列）</text>
</svg>
