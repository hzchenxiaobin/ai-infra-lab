<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#d6a040"/>
    </marker>
    <pattern id="obs" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#fce4ec"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#b85450" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">障碍格截断 + 网格 DP：障碍 → 0，空格 → 上 + 左</text>

  <!-- grid label -->
  <text x="60" y="100" font-size="12" fill="#888">grid:</text>

  <!-- 3x3 grid : cell w=64 h=48 -->
  <!-- row 0 : all empty -->
  <rect x="120" y="72" width="64" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="152" y="102" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">起</text>
  <rect x="184" y="72" width="64" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="216" y="102" text-anchor="middle" font-size="13" fill="#888">0</text>
  <rect x="248" y="72" width="64" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="102" text-anchor="middle" font-size="13" fill="#888">0</text>
  <!-- row 1 : middle is obstacle -->
  <rect x="120" y="120" width="64" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="150" text-anchor="middle" font-size="13" fill="#888">0</text>
  <rect x="184" y="120" width="64" height="48" fill="url(#obs)" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="216" y="151" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">障</text>
  <rect x="248" y="120" width="64" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="150" text-anchor="middle" font-size="13" fill="#888">0</text>
  <!-- row 2 : last is finish -->
  <rect x="120" y="168" width="64" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="198" text-anchor="middle" font-size="13" fill="#888">0</text>
  <rect x="184" y="168" width="64" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="216" y="198" text-anchor="middle" font-size="13" fill="#888">0</text>
  <rect x="248" y="168" width="64" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="198" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">终</text>

  <!-- two valid paths around obstacle -->
  <!-- path A: right,right,down,down (top edge then right edge) -->
  <path d="M 152 96 L 210 96" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 216 96 L 274 96" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 280 108 L 280 138" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 280 156 L 280 186" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <!-- path B: down,down,right,right (left edge then bottom edge) -->
  <path d="M 152 108 L 152 138" stroke="#4a7a3a" stroke-width="2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 152 156 L 152 186" stroke="#4a7a3a" stroke-width="2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 164 192 L 210 192" stroke="#4a7a3a" stroke-width="2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 224 192 L 274 192" stroke="#4a7a3a" stroke-width="2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="332" y="92" font-size="10.5" fill="#d6a040" font-weight="bold">路径① 右右下下</text>
  <text x="332" y="200" font-size="10.5" fill="#4a7a3a" font-weight="bold">路径② 下下右右</text>

  <!-- recurrence illustration on the right -->
  <text x="412" y="120" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">看 (1,2) 这个空格：</text>

  <!-- from above (0,2) -->
  <rect x="384" y="136" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="412" y="158" text-anchor="middle" font-size="11.5" fill="#333">上方=1</text>
  <path d="M 412 172 L 412 192" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- from left (1,1) obstacle -->
  <rect x="320" y="198" width="56" height="34" fill="url(#obs)" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="348" y="220" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">左方=0</text>
  <path d="M 378 215 L 402 215" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- current cell -->
  <rect x="408" y="198" width="56" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="436" y="222" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">=1+0</text>

  <text x="436" y="252" text-anchor="middle" font-size="10.5" fill="#888">左方是障碍(dp=0) → 路径被削减</text>

  <!-- recurrence box -->
  <rect x="40" y="276" width="490" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="285" y="302" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">状态转移：</text>
  <text x="285" y="326" text-anchor="middle" font-size="13.5" fill="#b85450" font-weight="bold">障碍格 → dp[i][j] = 0</text>
  <text x="285" y="346" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold">空　格 → dp[i][j] = dp[i−1][j] + dp[i][j−1]</text>
</svg>
