<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：arr = [2,1,4,7,3,2,5]，n = 7</text>

  <!-- index labels -->
  <text x="118" y="54" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="172" y="54" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="226" y="54" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="280" y="54" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="334" y="54" text-anchor="middle" font-size="10" fill="#888">4</text>
  <text x="388" y="54" text-anchor="middle" font-size="10" fill="#888">5</text>
  <text x="442" y="54" text-anchor="middle" font-size="10" fill="#888">6</text>

  <!-- array cells: 2,1,4,7,3,2,5 ; w=50, x=93.. ; mountain cells 1..5 highlighted after finding -->
  <rect x="93" y="62" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="84" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="147" y="62" width="50" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="172" y="84" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">1</text>
  <rect x="201" y="62" width="50" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="226" y="84" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">4</text>
  <rect x="255" y="62" width="50" height="34" fill="#b85450" stroke="#7a2f2c" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="84" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">7</text>
  <rect x="309" y="62" width="50" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="334" y="84" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">3</text>
  <rect x="363" y="62" width="50" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="388" y="84" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">2</text>
  <rect x="417" y="62" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="442" y="84" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>

  <!-- mountain bracket below cells 1..5 -->
  <path d="M 172 100 L 172 108 L 388 108 L 388 100" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="280" y="122" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">山脉下标 1..5（峰顶 3）</text>

  <!-- step table header -->
  <rect x="40" y="140" width="480" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="157" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">轮次</text>
  <text x="120" y="157" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i</text>
  <text x="270" y="157" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">判定 arr[i−1]&lt;arr[i]&gt;arr[i+1]</text>
  <text x="430" y="157" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">动作 / ans</text>

  <!-- row 1 -->
  <rect x="40" y="168" width="480" height="34" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="190" text-anchor="middle" font-size="11" fill="#888">1</text>
  <text x="120" y="190" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">1</text>
  <text x="270" y="186" text-anchor="middle" font-size="11" fill="#333">2 &lt; 1 ? 否</text>
  <text x="270" y="198" text-anchor="middle" font-size="10" fill="#888">（arr[0]&lt;arr[1] 不成立）</text>
  <text x="430" y="186" text-anchor="middle" font-size="11" fill="#4a7a3a">非峰，i=2</text>
  <text x="430" y="198" text-anchor="middle" font-size="11" fill="#888">ans=0</text>

  <!-- row 2 -->
  <rect x="40" y="204" width="480" height="34" fill="#f6f6f6" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="226" text-anchor="middle" font-size="11" fill="#888">2</text>
  <text x="120" y="226" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">2</text>
  <text x="270" y="222" text-anchor="middle" font-size="11" fill="#333">1 &lt; 4 ✓，但 4 &gt; 7 ? 否</text>
  <text x="270" y="234" text-anchor="middle" font-size="10" fill="#888">（右侧不递减）</text>
  <text x="430" y="222" text-anchor="middle" font-size="11" fill="#4a7a3a">非峰，i=3</text>
  <text x="430" y="234" text-anchor="middle" font-size="11" fill="#888">ans=0</text>

  <!-- row 3 (peak) -->
  <rect x="40" y="240" width="480" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="70" y="262" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="120" y="262" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">3</text>
  <text x="270" y="258" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4 &lt; 7 ✓ 且 7 &gt; 3 ✓ → 峰顶！</text>
  <text x="270" y="272" text-anchor="middle" font-size="10.5" fill="#b85450">左扩：4&lt;7→l=2，1&lt;4→l=1，2&lt;1否 → l=1</text>
  <text x="270" y="286" text-anchor="middle" font-size="10.5" fill="#b85450">右扩：7&gt;3→r=4，3&gt;2→r=5，2&gt;5否 → r=5</text>
  <text x="430" y="266" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">ans=5−1+1=5</text>
  <text x="430" y="280" text-anchor="middle" font-size="11" fill="#b85450">i=r+1=6</text>

  <!-- row 4 -->
  <rect x="40" y="298" width="480" height="34" fill="#f6f6f6" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="320" text-anchor="middle" font-size="11" fill="#888">4</text>
  <text x="120" y="320" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">6</text>
  <text x="270" y="316" text-anchor="middle" font-size="11" fill="#333">i ≥ n−1 = 6</text>
  <text x="270" y="328" text-anchor="middle" font-size="10" fill="#888">（循环结束）</text>
  <text x="430" y="316" text-anchor="middle" font-size="11" fill="#4a7a3a">退出</text>
  <text x="430" y="328" text-anchor="middle" font-size="11" fill="#888">ans=5</text>

  <!-- amortized note -->
  <rect x="40" y="346" width="480" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="364" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">摊还 O(n)：每座山被左/右臂各扫一次后 i 跳到 r+1，不再回访</text>
  <text x="280" y="380" text-anchor="middle" font-size="10.5" fill="#4a7a3a">最终 ans = 5，对应子数组 [1,4,7,3,2]</text>

  <text x="280" y="416" text-anchor="middle" font-size="10.5" fill="#888">对比 [2,2,2]：全程无 arr[i−1]&lt;arr[i]&gt;arr[i+1]，每轮 i++，ans 保持 0</text>
</svg>
