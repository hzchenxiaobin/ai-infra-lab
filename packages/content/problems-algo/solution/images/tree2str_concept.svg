<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">括号省略规则：右空可省，左空需看右</text>

  <!-- ===== 示例1：root=[1,2,3,4] ===== -->
  <text x="150" y="56" text-anchor="middle" font-size="12" fill="#888">示例1：左子有、右子无 → 右空可省</text>
  <g filter="url(#rough2)">
    <!-- root 1 -->
    <circle cx="150" cy="84" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="150" y="89" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
    <!-- 2 -->
    <circle cx="110" cy="140" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="110" y="145" text-anchor="middle" font-size="11" fill="#446688">2</text>
    <line x1="138" y1="96" x2="118" y2="128" stroke="#446688" stroke-width="1.2"/>
    <!-- 3 -->
    <circle cx="190" cy="140" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="190" y="145" text-anchor="middle" font-size="11" fill="#446688">3</text>
    <line x1="162" y1="96" x2="182" y2="128" stroke="#446688" stroke-width="1.2"/>
    <!-- 4 -->
    <circle cx="80" cy="196" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="80" y="201" text-anchor="middle" font-size="10" fill="#446688">4</text>
    <line x1="102" y1="152" x2="84" y2="184" stroke="#446688" stroke-width="1.1"/>
  </g>

  <!-- 箭头 -->
  <path d="M 150 216 L 150 244" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结果1 -->
  <rect x="60" y="248" width="180" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="269" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">1(2(4))(3)</text>

  <!-- 标注 -->
  <text x="150" y="298" text-anchor="middle" font-size="10" fill="#4a7a3a">节点3无右子 → 省掉 (3()) 尾巴的 ()</text>
  <text x="150" y="314" text-anchor="middle" font-size="10" fill="#4a7a3a">节点2无右子 → 省掉 (2(4)()) 尾巴的 ()</text>

  <!-- ===== 示例2：root=[1,2,3,null,4] ===== -->
  <text x="430" y="56" text-anchor="middle" font-size="12" fill="#888">示例2：左空、右有 → 左空必留</text>
  <g filter="url(#rough2)">
    <!-- root 1 -->
    <circle cx="430" cy="84" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="430" y="89" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
    <!-- 2 -->
    <circle cx="390" cy="140" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="390" y="145" text-anchor="middle" font-size="11" fill="#d6a040">2</text>
    <line x1="418" y1="96" x2="398" y2="128" stroke="#d6a040" stroke-width="1.2"/>
    <!-- 3 -->
    <circle cx="470" cy="140" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="470" y="145" text-anchor="middle" font-size="11" fill="#d6a040">3</text>
    <line x1="442" y1="96" x2="462" y2="128" stroke="#d6a040" stroke-width="1.2"/>
    <!-- null 位置（虚线圈） -->
    <circle cx="362" cy="196" r="12" fill="none" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,2"/>
    <text x="362" y="201" text-anchor="middle" font-size="9" fill="#b85450">×</text>
    <line x1="382" y1="152" x2="366" y2="184" stroke="#b85450" stroke-width="1.1" stroke-dasharray="2,2"/>
    <!-- 4 -->
    <circle cx="418" cy="196" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="418" y="201" text-anchor="middle" font-size="10" fill="#d6a040">4</text>
    <line x1="398" y1="152" x2="414" y2="184" stroke="#d6a040" stroke-width="1.1"/>
  </g>

  <!-- 红色标注：左空 -->
  <text x="362" y="222" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">左空</text>
  <path d="M 362 226 L 362 238" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- 箭头 -->
  <path d="M 430 216 L 430 244" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结果2 -->
  <rect x="340" y="248" width="180" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="430" y="269" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">1(2()(4))(3)</text>

  <!-- 标注 -->
  <text x="430" y="298" text-anchor="middle" font-size="10" fill="#b85450">节点2左空但有右子4</text>
  <text x="430" y="314" text-anchor="middle" font-size="10" fill="#b85450">若省 () → 1(2(4)) 会误判4为左子！</text>

  <!-- ===== 底部规则总结 ===== -->
  <rect x="40" y="338" width="500" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="60" y="358" font-size="11" fill="#446688" font-weight="bold">省略规则（前序 + 括号）：</text>
  <text x="60" y="376" font-size="10" fill="#555">① 节点有右子 → 左子部分必须写（左空也要写 () 占位）</text>
  <text x="300" y="376" font-size="10" fill="#555">② 节点无右子 → 左空不写、右空也不写</text>
</svg>
