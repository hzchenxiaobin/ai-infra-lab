<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：n = 3，commands = [DOWN, RIGHT, UP] → 返回 1</text>

  <!-- 网格标题 -->
  <text x="75" y="50" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">初始</text>
  <text x="193" y="50" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">DOWN 后</text>
  <text x="311" y="50" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">RIGHT 后</text>
  <text x="429" y="50" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">UP 后（终局）</text>

  <!-- 网格 1：pos = 0 -->
  <rect x="36" y="58" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="62" y="58" width="26" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="88" y="58" width="26" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="36" y="84" width="26" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="62" y="84" width="26" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="88" y="84" width="26" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="36" y="110" width="26" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="62" y="110" width="26" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="88" y="110" width="26" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="49" y="75" text-anchor="middle" font-size="11" fill="#b07818" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="75" y="75" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="101" y="75" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="49" y="101" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="75" y="101" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4</text>
  <text x="101" y="101" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">5</text>
  <text x="49" y="127" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">6</text>
  <text x="75" y="127" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">7</text>
  <text x="101" y="127" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">8</text>

  <!-- 网格 2：pos = 3 -->
  <rect x="154" y="58" width="26" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="180" y="58" width="26" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="206" y="58" width="26" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="154" y="84" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="180" y="84" width="26" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="206" y="84" width="26" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="154" y="110" width="26" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="180" y="110" width="26" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="206" y="110" width="26" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="167" y="75" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <text x="193" y="75" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="219" y="75" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="167" y="101" text-anchor="middle" font-size="11" fill="#b07818" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="193" y="101" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4</text>
  <text x="219" y="101" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">5</text>
  <text x="167" y="127" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">6</text>
  <text x="193" y="127" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">7</text>
  <text x="219" y="127" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">8</text>

  <!-- 网格 3：pos = 4 -->
  <rect x="272" y="58" width="26" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="298" y="58" width="26" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="324" y="58" width="26" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="272" y="84" width="26" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="298" y="84" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="324" y="84" width="26" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="272" y="110" width="26" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="298" y="110" width="26" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="324" y="110" width="26" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="285" y="75" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <text x="311" y="75" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="337" y="75" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="285" y="101" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="311" y="101" text-anchor="middle" font-size="11" fill="#b07818" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="337" y="101" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">5</text>
  <text x="285" y="127" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">6</text>
  <text x="311" y="127" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">7</text>
  <text x="337" y="127" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">8</text>

  <!-- 网格 4：pos = 1（终局） -->
  <rect x="390" y="58" width="26" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="416" y="58" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="442" y="58" width="26" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="390" y="84" width="26" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="416" y="84" width="26" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="442" y="84" width="26" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="390" y="110" width="26" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="416" y="110" width="26" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="442" y="110" width="26" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="403" y="75" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <text x="429" y="75" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="455" y="75" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="403" y="101" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="429" y="101" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4</text>
  <text x="455" y="101" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">5</text>
  <text x="403" y="127" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">6</text>
  <text x="429" y="127" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">7</text>
  <text x="455" y="127" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">8</text>

  <!-- 增量箭头 -->
  <path d="M 118 96 L 148 96" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="133" y="88" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">+3</text>
  <path d="M 236 96 L 266 96" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="251" y="88" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+1</text>
  <path d="M 354 96 L 384 96" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" fill="none" filter="url(#rough2)"/>
  <text x="369" y="88" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">−3</text>

  <!-- pos 标签 -->
  <text x="75" y="148" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">pos = 0</text>
  <text x="193" y="148" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">pos = 3</text>
  <text x="311" y="148" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">pos = 4</text>
  <text x="429" y="148" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">pos = 1 ✓</text>

  <!-- 步骤表 -->
  <rect x="70" y="168" width="380" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="117" y="184" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">指令</text>
  <text x="212" y="184" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">增量 Δ</text>
  <text x="307" y="184" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">坐标 (i, j)</text>
  <text x="402" y="184" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">pos 编号</text>

  <rect x="70" y="194" width="380" height="24" rx="4" fill="#ffffff" stroke="#99a" stroke-width="1" filter="url(#rough2)"/>
  <text x="117" y="210" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">（起点）</text>
  <text x="212" y="210" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">—</text>
  <text x="307" y="210" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(0, 0)</text>
  <text x="402" y="210" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>

  <rect x="70" y="220" width="380" height="24" rx="4" fill="#ffffff" stroke="#99a" stroke-width="1" filter="url(#rough2)"/>
  <text x="117" y="236" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">DOWN</text>
  <text x="212" y="236" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">+n = +3</text>
  <text x="307" y="236" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(1, 0)</text>
  <text x="402" y="236" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="70" y="246" width="380" height="24" rx="4" fill="#ffffff" stroke="#99a" stroke-width="1" filter="url(#rough2)"/>
  <text x="117" y="262" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">RIGHT</text>
  <text x="212" y="262" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">+1</text>
  <text x="307" y="262" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(1, 1)</text>
  <text x="402" y="262" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>

  <rect x="70" y="272" width="380" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="117" y="288" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">UP</text>
  <text x="212" y="288" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">−n = −3</text>
  <text x="307" y="288" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(0, 1)</text>
  <text x="402" y="288" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- 底注 -->
  <text x="260" y="318" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">0 + 3 + 1 − 3 = 1 —— 终局编号 = 各指令增量之和（起点编号 0）</text>
  <text x="260" y="342" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">对照示例 1：n = 2，[RIGHT, DOWN] → 0 + 1 + 2 = 3 ✓</text>
</svg>
