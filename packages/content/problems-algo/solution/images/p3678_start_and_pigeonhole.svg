<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#446688" stroke-width="1.8"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#b85450" stroke-width="1.8"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="17" fill="#333"
        filter="url(#rough2)">核心观察：从 floor(avg)+1 起跳 + 鸽笼上界</text>

  <!-- 示例框 -->
  <rect x="36" y="44" width="210" height="64" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="141" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">示例 nums = [3, 5]</text>
  <text x="141" y="90" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">avg = (3+5)/2 = 4.0</text>

  <!-- 数轴格子 1..8 -->
  <rect x="80"  y="152" width="40" height="42" fill="#ffffff" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="120" y="152" width="40" height="42" fill="#ffffff" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="160" y="152" width="40" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="200" y="152" width="40" height="42" fill="#ffffff" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="240" y="152" width="40" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="280" y="152" width="40" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <rect x="320" y="152" width="40" height="42" fill="#ffffff" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="360" y="152" width="40" height="42" fill="#ffffff" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="100" y="178" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="140" y="178" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="180" y="178" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="220" y="178" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="260" y="178" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="300" y="178" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="340" y="178" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <text x="380" y="178" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>

  <!-- avg 标注（指向格子 4 中心） -->
  <text x="150" y="116" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">avg = 4.0</text>
  <path d="M 162 122 L 178 148" stroke="#446688" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 起点 x0 标注（指向格子 5 中心） -->
  <text x="318" y="106" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">x₀ = floor(avg)+1 = 5</text>
  <path d="M 300 112 L 266 148" stroke="#b85450" stroke-width="1.3" marker-end="url(#arrRed)" filter="url(#rough2)"/>

  <!-- 数轴轴线 -->
  <path d="M 66 214 L 412 214" stroke="#666666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 格 5 下方：跳过 -->
  <text x="252" y="238" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">在 S 中 → 跳过</text>
  <!-- 格 6 下方：答案 -->
  <path d="M 300 196 L 300 246" stroke="#b85450" stroke-width="1.2" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="300" y="266" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans = 6</text>

  <!-- 右侧框 1：起点 -->
  <rect x="424" y="96" width="126" height="100" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="487" y="118" text-anchor="middle" font-size="13" fill="#b3541e" font-weight="bold" filter="url(#rough2)">起点</text>
  <text x="487" y="138" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">floor(avg)+1 是严格</text>
  <text x="487" y="154" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">大于 avg 的最小整数</text>
  <text x="487" y="176" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">avg &lt; 0 时取 1</text>

  <!-- 右侧框 2：鸽笼 -->
  <rect x="424" y="214" width="126" height="118" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="487" y="236" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">鸽笼上界</text>
  <text x="487" y="256" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">候选 x₀ … x₀+n</text>
  <text x="487" y="272" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">共 n+1 个，数组至多</text>
  <text x="487" y="288" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">占用 n 个</text>
  <text x="487" y="310" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">⇒ 循环 ≤ n+1 步</text>

  <!-- 底注 -->
  <text x="280" y="366" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">y 严格大于 avg ⟺ y·n &gt; sum（整数判定，无浮点误差）</text>
</svg>
