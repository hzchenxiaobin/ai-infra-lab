<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>

  <rect width="760" height="400" fill="#fdfcf7"/>

  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">统计相似字符串对：掩码签名 + 分组配对</text>
  <path d="M 250 38 Q 380 46 510 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Left panel: word -> set -> mask -->
  <text x="60" y="72" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">① 字符集合 → 26 位掩码</text>

  <g filter="url(#sk)"><rect x="60" y="86" width="70" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="95" y="107" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">"aba"</text>

  <path d="M 95 120 L 95 146" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="55" y="150" width="80" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="95" y="171" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a5a2a" filter="url(#sk)">{a, b}</text>

  <path d="M 95 184 L 95 210" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="50" y="214" width="90" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="95" y="232" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">mask = ...011</text>
  <text x="95" y="248" text-anchor="middle" font-size="10" fill="#7a5415" filter="url(#sk)">bit a=1, bit b=1</text>

  <g filter="url(#sk)"><rect x="40" y="272" width="300" height="100" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/></g>
  <text x="55" y="296" font-size="12" font-weight="bold" fill="#444" filter="url(#sk)">关键不变式</text>
  <text x="55" y="318" font-size="11" fill="#444" filter="url(#sk)">· 相似 = 字符集合相等（频次/顺序无关）</text>
  <text x="55" y="338" font-size="11" fill="#444" filter="url(#sk)">· 集合相等 ⟺ 26 位掩码相等</text>
  <text x="55" y="358" font-size="11" fill="#7a5415" filter="url(#sk)">· "aba" 与 "aabb" 集合都是 {a,b} → 相似</text>

  <!-- Right panel: grouping -->
  <text x="400" y="72" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">② 同掩码分组，组内 C(k,2) 对</text>

  <g filter="url(#sk)"><rect x="400" y="86" width="320" height="56" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="412" y="108" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">组 {a, b}：2 个 → C(2,2)=1 对</text>
  <text x="412" y="130" font-size="11" fill="#3a5a2a" filter="url(#sk)">"aba" , "aabb"</text>

  <g filter="url(#sk)"><rect x="400" y="154" width="320" height="56" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="412" y="176" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">组 {a, b, c}：2 个 → C(2,2)=1 对</text>
  <text x="412" y="198" font-size="11" fill="#3a5a2a" filter="url(#sk)">"bac" , "aabc"</text>

  <g filter="url(#sk)"><rect x="400" y="222" width="320" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="412" y="244" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">组 {a, b, c, d}：1 个 → C(1,2)=0 对</text>
  <text x="412" y="266" font-size="11" fill="#b85450" filter="url(#sk)">"abcd"</text>

  <path d="M 560 282 L 560 302" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="470" y="306" width="180" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="560" y="328" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415" filter="url(#sk)">总对数 = 1 + 1 + 0 = 2</text>
  <text x="560" y="345" text-anchor="middle" font-size="10" fill="#7a5415" filter="url(#sk)">各组组合数之和</text>
</svg>
