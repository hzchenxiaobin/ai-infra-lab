<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：word1 = "cbaaabc"，word2 = "abc"</text>
  <text x="260" y="38" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">need：a:1 / b:1 / c:1，初始 less = 3（三种都欠着）</text>

  <!-- 表头 -->
  <rect x="36" y="48" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="76" y="48" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="112" y="48" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="158" y="48" width="158" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="316" y="48" width="76" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="392" y="48" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="434" y="48" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="56" y="68" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">right</text>
  <text x="94" y="68" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">入窗</text>
  <text x="135" y="68" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">less</text>
  <text x="237" y="68" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">收缩动作</text>
  <text x="354" y="68" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">收敛窗口</text>
  <text x="413" y="68" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">贡献</text>
  <text x="457" y="68" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">累计</text>

  <!-- 行 0 -->
  <rect x="36" y="78" width="40" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="76" y="78" width="36" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="112" y="78" width="46" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="158" y="78" width="158" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="316" y="78" width="76" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="392" y="78" width="42" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="434" y="78" width="46" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="56" y="97" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="94" y="97" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="135" y="97" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">3→2</text>
  <text x="237" y="97" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">—（还欠着）</text>
  <text x="354" y="97" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">[0,0]「c」</text>
  <text x="413" y="97" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">+0</text>
  <text x="457" y="97" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">0</text>

  <!-- 行 1 -->
  <rect x="36" y="106" width="40" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="76" y="106" width="36" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="112" y="106" width="46" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="158" y="106" width="158" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="316" y="106" width="76" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="392" y="106" width="42" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="434" y="106" width="46" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="56" y="125" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="94" y="125" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="135" y="125" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">2→1</text>
  <text x="237" y="125" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">—（还欠着）</text>
  <text x="354" y="125" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">[0,1]「cb」</text>
  <text x="413" y="125" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">+0</text>
  <text x="457" y="125" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">0</text>

  <!-- 行 2（首次覆盖） -->
  <rect x="36" y="134" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="76" y="134" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="112" y="134" width="46" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="158" y="134" width="158" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="316" y="134" width="76" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="392" y="134" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="434" y="134" width="46" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="56" y="153" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="94" y="153" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="135" y="153" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1→0 ✓</text>
  <text x="237" y="153" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">踢 'c'：less=1，left=1</text>
  <text x="354" y="153" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">[1,2]「ba」</text>
  <text x="413" y="153" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">+1</text>
  <text x="457" y="153" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- 行 3 -->
  <rect x="36" y="162" width="40" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="76" y="162" width="36" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="112" y="162" width="46" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="158" y="162" width="158" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="316" y="162" width="76" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="392" y="162" width="42" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="434" y="162" width="46" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="56" y="181" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="94" y="181" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="135" y="181" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="237" y="181" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">—（a 富余，不跨界）</text>
  <text x="354" y="181" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">[1,3]「baa」</text>
  <text x="413" y="181" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">+1</text>
  <text x="457" y="181" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">2</text>

  <!-- 行 4 -->
  <rect x="36" y="190" width="40" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="76" y="190" width="36" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="112" y="190" width="46" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="158" y="190" width="158" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="316" y="190" width="76" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="392" y="190" width="42" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="434" y="190" width="46" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="56" y="209" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="94" y="209" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="135" y="209" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="237" y="209" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">—（a 富余，不跨界）</text>
  <text x="354" y="209" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">[1,4]「baaa」</text>
  <text x="413" y="209" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">+1</text>
  <text x="457" y="209" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">3</text>

  <!-- 行 5 -->
  <rect x="36" y="218" width="40" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="76" y="218" width="36" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="112" y="218" width="46" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="158" y="218" width="158" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="316" y="218" width="76" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="392" y="218" width="42" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="434" y="218" width="46" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="56" y="237" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="94" y="237" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="135" y="237" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="237" y="237" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">—（cnt[b]=2 富余）</text>
  <text x="354" y="237" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">[1,5]「baaab」</text>
  <text x="413" y="237" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">+1</text>
  <text x="457" y="237" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">4</text>

  <!-- 行 6（连踢弹跳） -->
  <rect x="36" y="246" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="76" y="246" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="112" y="246" width="46" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="158" y="246" width="158" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="316" y="246" width="76" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="392" y="246" width="42" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="434" y="246" width="46" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="56" y="265" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="94" y="265" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="135" y="265" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">1→0 ✓</text>
  <text x="237" y="265" text-anchor="middle" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">连踢 b,a,a,a：left=5</text>
  <text x="354" y="265" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">[5,6]「bc」</text>
  <text x="413" y="265" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">+5</text>
  <text x="457" y="265" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">9</text>

  <!-- 底部结论 -->
  <rect x="36" y="286" width="444" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="258" y="306" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">ans = 0+0+1+1+1+1+5 = 9 ✓（与 O(n²) 暴力对拍一致）</text>
  <text x="258" y="324" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">r=6 一次 while 连踢 4 个字符：left 从 1 弹跳到 5（均摊的直观样本）</text>

  <text x="258" y="356" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">全表 left 总移动：0→1→5 共 5 步 ≤ n=7，right 恰走 7 步 → 合计 12 ≤ 2n</text>
  <text x="258" y="374" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">三个官方示例分别得 1 / 10 / 0；随机对拍 3000 组与暴力全部一致</text>
</svg>
