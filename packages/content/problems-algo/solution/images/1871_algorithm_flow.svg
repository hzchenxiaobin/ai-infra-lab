<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：DP + 滑动窗口计数</text>

  <!-- Step 1: Init -->
  <rect x="180" y="44" width="200" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">初始化</text>
  <text x="280" y="78" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">dp[0]=true, count=0</text>
  <path d="M 280 90 L 280 104" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: Loop condition -->
  <polygon points="280,106 380,136 280,166 180,136" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="134" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">j = 1 .. n−1 ?</text>
  <text x="280" y="150" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">遍历每个位置</text>
  <path d="M 280 168 L 280 182" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: Add right edge -->
  <rect x="130" y="184" width="300" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="204" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">右端入窗</text>
  <text x="280" y="222" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">if j−minJump ≥ 0 and dp[j−minJump]: count++</text>
  <path d="M 280 236 L 280 250" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: Remove left edge -->
  <rect x="130" y="252" width="300" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="272" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">左端出窗</text>
  <text x="280" y="290" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">if j−maxJump−1 ≥ 0 and dp[j−maxJump−1]: count−−</text>
  <path d="M 280 304 L 280 318" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: Decision -->
  <polygon points="280,320 400,350 280,380 160,350" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="348" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">s[j]=='0' 且 count&gt;0?</text>
  <path d="M 220 372 L 160 396" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 340 372 L 400 396" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="388" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <text x="372" y="388" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- Yes branch -->
  <rect x="80" y="398" width="120" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="140" y="416" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">dp[j] = true</text>
  <text x="140" y="430" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">可达</text>

  <!-- No branch -->
  <rect x="340" y="398" width="120" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="400" y="416" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">dp[j] = false</text>
  <text x="400" y="430" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">不可达</text>

  <!-- Loop back arrow -->
  <path d="M 140 436 Q 60 436 60 300 Q 60 136 178 136" stroke="#666" stroke-width="1.2" fill="none" stroke-dasharray="4,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="44" y="290" font-size="9" fill="#888" filter="url(#rough2)">j++</text>

  <!-- Return -->
  <rect x="200" y="428" width="160" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="446" text-anchor="middle" font-size="11" fill="#444" font-weight="bold" filter="url(#rough2)">返回 dp[n−1]</text>
</svg>
