<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold">分发糖果：评分「严格大于」邻居才需更多糖果，相等则无约束</text>

  <!-- ratings label -->
  <text x="18" y="82" font-size="11" fill="#888">ratings</text>

  <!-- rating boxes: x = 47,115,183,251,319,387,455 ; w=58 h=40 y=60 ; centers 76,144,212,280,348,416,484 -->
  <rect x="47"  y="60" width="58" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="76"  y="85" text-anchor="middle" font-size="13" fill="#333">1</text>

  <rect x="115" y="60" width="58" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="144" y="85" text-anchor="middle" font-size="13" fill="#333">2</text>

  <!-- plateau (equal ratings) highlighted orange -->
  <rect x="183" y="60" width="58" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="212" y="85" text-anchor="middle" font-size="13" fill="#333">5</text>

  <rect x="251" y="60" width="58" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="85" text-anchor="middle" font-size="13" fill="#333">5</text>

  <rect x="319" y="60" width="58" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="348" y="85" text-anchor="middle" font-size="13" fill="#333">5</text>

  <rect x="387" y="60" width="58" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="416" y="85" text-anchor="middle" font-size="13" fill="#333">2</text>

  <rect x="455" y="60" width="58" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="484" y="85" text-anchor="middle" font-size="13" fill="#333">1</text>

  <!-- index labels -->
  <text x="76"  y="53" text-anchor="middle" font-size="9.5" fill="#aaa">0</text>
  <text x="144" y="53" text-anchor="middle" font-size="9.5" fill="#aaa">1</text>
  <text x="212" y="53" text-anchor="middle" font-size="9.5" fill="#aaa">2</text>
  <text x="280" y="53" text-anchor="middle" font-size="9.5" fill="#aaa">3</text>
  <text x="348" y="53" text-anchor="middle" font-size="9.5" fill="#aaa">4</text>
  <text x="416" y="53" text-anchor="middle" font-size="9.5" fill="#aaa">5</text>
  <text x="484" y="53" text-anchor="middle" font-size="9.5" fill="#aaa">6</text>

  <!-- plateau bracket under boxes 2,3,4 -->
  <path d="M 186 108 L 186 116 L 374 116 L 374 108" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="280" y="132" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">评分相等 ⇏ 糖果相等（无约束）</text>

  <!-- left boundary constraint (between idx1 and idx2) -->
  <path d="M 178 100 Q 150 124 120 138" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="96" y="152" text-anchor="middle" font-size="10.5" fill="#446688">5 &gt; 2 ⇒ c₂ &gt; c₁</text>

  <!-- right boundary constraint (between idx4 and idx5) -->
  <path d="M 382 100 Q 412 124 442 138" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="466" y="152" text-anchor="middle" font-size="10.5" fill="#b85450">5 &gt; 2 ⇒ c₄ &gt; c₅</text>

  <!-- rule 1 box -->
  <rect x="34" y="172" width="232" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="150" y="194" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">规则 1</text>
  <text x="150" y="214" text-anchor="middle" font-size="11.5" fill="#333">每个孩子至少 1 颗糖果</text>
  <text x="150" y="230" text-anchor="middle" font-size="10" fill="#888">candy[i] ≥ 1</text>

  <!-- rule 2 box -->
  <rect x="294" y="172" width="232" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="410" y="194" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">规则 2</text>
  <text x="410" y="214" text-anchor="middle" font-size="11.5" fill="#333">评分严格 &gt; 邻居 ⇒ 糖果 &gt; 邻居</text>
  <text x="410" y="230" text-anchor="middle" font-size="10" fill="#888">评分相等时无约束 ⚠</text>

  <!-- conclusion box -->
  <rect x="34" y="252" width="492" height="108" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="276" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">结论：每个位置的糖果受「左、右」两侧同时约束</text>
  <text x="280" y="300" text-anchor="middle" font-size="11.5" fill="#333">① 左→右扫一遍：保证比「左邻居」多（若评分更高）</text>
  <text x="280" y="320" text-anchor="middle" font-size="11.5" fill="#333">② 右→左扫一遍：保证比「右邻居」多（若评分更高）</text>
  <text x="280" y="344" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">③ candy[i] = max(left[i], right[i])，取大者兼顾两侧 ✓</text>
</svg>
