<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：建一次状态，每次调用「先取后增」</text>

  <!-- Step 1: createCounter -->
  <rect x="40" y="50" width="240" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="160" y="74" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">createCounter(n)</text>
  <text x="160" y="94" text-anchor="middle" font-size="11" fill="#333">捕获 n 作为闭包的私有状态</text>

  <path d="M 160 112 L 160 140" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: call -->
  <rect x="40" y="144" width="240" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="160" y="170" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">调用 counter()</text>

  <path d="M 160 190 L 160 214" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: take current -->
  <rect x="40" y="218" width="240" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="160" y="244" text-anchor="middle" font-size="12" fill="#333">tmp = n   （记住要返回的值）</text>

  <path d="M 160 264 L 160 286" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: increment -->
  <rect x="40" y="290" width="240" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="160" y="316" text-anchor="middle" font-size="12" fill="#333">n += 1   （私有状态自增）</text>

  <!-- return to caller -->
  <path d="M 280 312 L 340 312" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="340" y="290" width="220" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="450" y="316" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return tmp</text>

  <!-- loop back arrow: call again -->
  <path d="M 450 290 L 450 166 L 284 166" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="158" text-anchor="middle" font-size="11" fill="#888">下一次调用，n 已 +1</text>

  <text x="300" y="372" text-anchor="middle" font-size="11" fill="#888">⚠️ 顺序不能反：若先 n+=1 再返回 n，会多涨 1（除非返回 n−1）</text>
</svg>
