<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：一次遍历，遇 1 累加，遇 0 清零，maxCount 记全局最大</text>

  <!-- scan arrow -->
  <text x="60" y="80" font-size="11" fill="#888">扫描方向 →</text>
  <line x1="92" y1="76" x2="460" y2="76" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- array cells: [1,1,0,1,1,1] -->
  <rect x="100" y="90" width="56" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="128" y="122" text-anchor="middle" font-size="18" fill="#2a4a66" font-weight="bold">1</text>

  <rect x="156" y="90" width="56" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="184" y="122" text-anchor="middle" font-size="18" fill="#2a4a66" font-weight="bold">1</text>

  <rect x="212" y="90" width="56" height="50" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="122" text-anchor="middle" font-size="18" fill="#a67830" font-weight="bold">0</text>

  <rect x="268" y="90" width="56" height="50" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="296" y="122" text-anchor="middle" font-size="18" fill="#3a5a2a" font-weight="bold">1</text>

  <rect x="324" y="90" width="56" height="50" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="352" y="122" text-anchor="middle" font-size="18" fill="#3a5a2a" font-weight="bold">1</text>

  <rect x="380" y="90" width="56" height="50" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="408" y="122" text-anchor="middle" font-size="18" fill="#3a5a2a" font-weight="bold">1</text>

  <!-- index labels -->
  <text x="128" y="158" text-anchor="middle" font-size="10" fill="#888">i=0</text>
  <text x="184" y="158" text-anchor="middle" font-size="10" fill="#888">i=1</text>
  <text x="240" y="158" text-anchor="middle" font-size="10" fill="#888">i=2</text>
  <text x="296" y="158" text-anchor="middle" font-size="10" fill="#888">i=3</text>
  <text x="352" y="158" text-anchor="middle" font-size="10" fill="#888">i=4</text>
  <text x="408" y="158" text-anchor="middle" font-size="10" fill="#888">i=5</text>

  <!-- group brackets -->
  <path d="M 100 168 L 100 178 L 212 178 L 212 168" fill="none" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="156" y="196" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">连续 1 × 2</text>

  <path d="M 268 168 L 268 178 L 436 178 L 436 168" fill="none" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="352" y="196" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">连续 1 × 3 ← 最大</text>

  <!-- variables -->
  <rect x="110" y="222" width="150" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="185" y="240" text-anchor="middle" font-size="11" fill="#2a4a66" font-weight="bold">count（当前连续）</text>
  <text x="185" y="258" text-anchor="middle" font-size="12" fill="#2a4a66">随 1 累加，遇 0 清零</text>

  <rect x="300" y="222" width="150" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="375" y="240" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">maxCount（全局最大）</text>
  <text x="375" y="258" text-anchor="middle" font-size="12" fill="#3a5a2a">每步取 max 更新</text>

  <!-- arrow from count to maxCount -->
  <line x1="260" y1="244" x2="300" y2="244" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- caption -->
  <rect x="50" y="290" width="460" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="280" y="310" text-anchor="middle" font-size="11" fill="#555">count 像弹簧——遇 1 蓄力、遇 0 归零；maxCount 是天花板，只升不降</text>
  <text x="280" y="326" text-anchor="middle" font-size="11" fill="#555">无需回溯、无需额外空间：O(n) 时间 / O(1) 空间即为最优</text>
</svg>
