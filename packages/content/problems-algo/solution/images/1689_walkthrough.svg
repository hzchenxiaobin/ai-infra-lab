<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：n = "82734" → 答案 = 8</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">第 k 行在第 i 列放 1 ⟺ digit[i] ≥ k（阶梯形构造）</text>

  <!-- Column header: digits 8 2 7 3 4 -->
  <text x="56" y="76" font-size="11" fill="#888">n =</text>
  <g font-size="14" fill="#b85450" font-weight="bold" text-anchor="middle">
    <rect x="100" y="62" width="48" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
    <text x="124" y="83">8</text>
    <rect x="150" y="62" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="174" y="83" fill="#333">2</text>
    <rect x="200" y="62" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="224" y="83" fill="#333">7</text>
    <rect x="250" y="62" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="274" y="83" fill="#333">3</text>
    <rect x="300" y="62" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="324" y="83" fill="#333">4</text>
  </g>

  <!-- 8 rows: k=1..8, columns: 8 2 7 3 4 -->
  <!-- k=1: all ≥1 -> 1 1 1 1 1 -->
  <!-- k=2: all ≥2 -> 1 1 1 1 1 -->
  <!-- k=3: 8,7,3,4≥3; 2<3 -> 1 0 1 1 1 -->
  <!-- k=4: 8,7,4≥4; 2,3<4 -> 1 0 1 0 1 -->
  <!-- k=5: 8,7≥5 -> 1 0 1 0 0 -->
  <!-- k=6: 8,7≥6 -> 1 0 1 0 0 -->
  <!-- k=7: 8,7≥7 -> 1 0 1 0 0 -->
  <!-- k=8: 8≥8 -> 1 0 0 0 0 -->

  <g font-size="12.5" text-anchor="middle">
    <!-- k=1 -->
    <text x="84" y="112" font-size="10.5" fill="#888">k=1</text>
    <rect x="100" y="98" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="124" y="116" fill="#333">1</text>
    <rect x="150" y="98" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="174" y="116" fill="#333">1</text>
    <rect x="200" y="98" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="224" y="116" fill="#333">1</text>
    <rect x="250" y="98" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="274" y="116" fill="#333">1</text>
    <rect x="300" y="98" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="324" y="116" fill="#333">1</text>

    <!-- k=2 -->
    <text x="84" y="140" font-size="10.5" fill="#888">k=2</text>
    <rect x="100" y="126" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="124" y="144" fill="#333">1</text>
    <rect x="150" y="126" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="174" y="144" fill="#333">1</text>
    <rect x="200" y="126" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="224" y="144" fill="#333">1</text>
    <rect x="250" y="126" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="274" y="144" fill="#333">1</text>
    <rect x="300" y="126" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="324" y="144" fill="#333">1</text>

    <!-- k=3 -->
    <text x="84" y="168" font-size="10.5" fill="#888">k=3</text>
    <rect x="100" y="154" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="124" y="172" fill="#333">1</text>
    <rect x="150" y="154" width="48" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="174" y="172" fill="#888">0</text>
    <rect x="200" y="154" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="224" y="172" fill="#333">1</text>
    <rect x="250" y="154" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="274" y="172" fill="#333">1</text>
    <rect x="300" y="154" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="324" y="172" fill="#333">1</text>

    <!-- k=4 -->
    <text x="84" y="196" font-size="10.5" fill="#888">k=4</text>
    <rect x="100" y="182" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="124" y="200" fill="#333">1</text>
    <rect x="150" y="182" width="48" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="174" y="200" fill="#888">0</text>
    <rect x="200" y="182" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="224" y="200" fill="#333">1</text>
    <rect x="250" y="182" width="48" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="274" y="200" fill="#888">0</text>
    <rect x="300" y="182" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="324" y="200" fill="#333">1</text>

    <!-- k=5 -->
    <text x="84" y="224" font-size="10.5" fill="#888">k=5</text>
    <rect x="100" y="210" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="124" y="228" fill="#333">1</text>
    <rect x="150" y="210" width="48" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="174" y="228" fill="#888">0</text>
    <rect x="200" y="210" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="224" y="228" fill="#333">1</text>
    <rect x="250" y="210" width="48" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="274" y="228" fill="#888">0</text>
    <rect x="300" y="210" width="48" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="324" y="228" fill="#888">0</text>

    <!-- k=6 -->
    <text x="84" y="252" font-size="10.5" fill="#888">k=6</text>
    <rect x="100" y="238" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="124" y="256" fill="#333">1</text>
    <rect x="150" y="238" width="48" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="174" y="256" fill="#888">0</text>
    <rect x="200" y="238" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="224" y="256" fill="#333">1</text>
    <rect x="250" y="238" width="48" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="274" y="256" fill="#888">0</text>
    <rect x="300" y="238" width="48" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="324" y="256" fill="#888">0</text>

    <!-- k=7 -->
    <text x="84" y="280" font-size="10.5" fill="#888">k=7</text>
    <rect x="100" y="266" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="124" y="284" fill="#333">1</text>
    <rect x="150" y="266" width="48" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="174" y="284" fill="#888">0</text>
    <rect x="200" y="266" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="224" y="284" fill="#333">1</text>
    <rect x="250" y="266" width="48" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="274" y="284" fill="#888">0</text>
    <rect x="300" y="266" width="48" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="324" y="284" fill="#888">0</text>

    <!-- k=8 -->
    <text x="84" y="308" font-size="10.5" fill="#888">k=8</text>
    <rect x="100" y="294" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="124" y="312" fill="#333">1</text>
    <rect x="150" y="294" width="48" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="174" y="312" fill="#888">0</text>
    <rect x="200" y="294" width="48" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="224" y="312" fill="#888">0</text>
    <rect x="250" y="294" width="48" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="274" y="312" fill="#888">0</text>
    <rect x="300" y="294" width="48" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/><text x="324" y="312" fill="#888">0</text>
  </g>

  <!-- Sum line -->
  <path d="M 96 326 L 352 326" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- Column sums: 8 2 7 3 4 -->
  <g font-size="14" text-anchor="middle" font-weight="bold">
    <rect x="100" y="330" width="48" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="124" y="350" fill="#b85450">8</text>
    <rect x="150" y="330" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="174" y="350" fill="#333">2</text>
    <rect x="200" y="330" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="224" y="350" fill="#333">7</text>
    <rect x="250" y="330" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="274" y="350" fill="#333">3</text>
    <rect x="300" y="330" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="324" y="350" fill="#333">4</text>
  </g>

  <!-- Right side notes -->
  <text x="372" y="116" font-size="10.5" fill="#4a7a3a">↑ 8 行（= max_d）</text>
  <text x="372" y="132" font-size="10" fill="#888">每行都是合法十-二进制数</text>
  <text x="372" y="148" font-size="10" fill="#888">（首位为 1，无前导零）</text>

  <text x="372" y="230" font-size="10.5" fill="#d6a040">← 阶梯形：</text>
  <text x="372" y="246" font-size="10" fill="#888">列越高，1 越往下延伸；</text>
  <text x="372" y="262" font-size="10" fill="#888">列矮则早早变 0</text>

  <!-- Conclusion -->
  <rect x="80" y="384" width="400" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="402" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">列和恰好 = 各位数字 → 8 个数之和 = 82734 ✓</text>
  <text x="280" y="418" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">答案 = max(8,2,7,3,4) = 8，无需真正构造</text>
</svg>
