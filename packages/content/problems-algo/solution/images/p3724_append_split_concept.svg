<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：一次追加 = 一个值裂变成两段旅程</text>

  <!-- 面板一：裂变结构 -->
  <rect x="18" y="34" width="484" height="162" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="56" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">① 长度差 1 ⇒ 恰好一次追加，副本钉死在末位 n</text>

  <text x="30" y="94" font-size="11" fill="#666" filter="url(#rough2)">nums1：</text>
  <rect x="82" y="72" width="38" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="101" y="93" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a₀</text>
  <text x="132" y="93" font-size="12" fill="#666" filter="url(#rough2)">…</text>
  <rect x="146" y="72" width="44" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="168" y="93" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">aⱼ</text>
  <text x="202" y="93" font-size="12" fill="#666" filter="url(#rough2)">…</text>
  <rect x="214" y="72" width="52" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="240" y="93" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">aₙ₋₁</text>

  <path d="M 274 88 L 304 88" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="289" y="78" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">追加</text>
  <rect x="310" y="72" width="38" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="329" y="93" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">v</text>
  <text x="356" y="93" font-size="10" fill="#666" filter="url(#rough2)">← 末位新元素</text>

  <!-- 两段旅程 -->
  <path d="M 168 106 C 164 116, 163 122, 163 134" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="124" font-size="10" fill="#446688" filter="url(#rough2)">|aⱼ−v| + |v−bⱼ|</text>
  <rect x="78" y="138" width="160" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="158" y="158" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">bⱼ = nums2[j]</text>

  <path d="M 329 106 C 338 118, 352 124, 362 134" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="348" y="124" font-size="10" fill="#446688" filter="url(#rough2)">|v − t|</text>
  <rect x="272" y="138" width="170" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="357" y="158" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">t = nums2[n]</text>

  <text x="260" y="186" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">其余位置 i ≠ j 各付 |aᵢ − bᵢ|；任何时序都被 (j, v) 吸收</text>

  <!-- 面板二：三点中位数 -->
  <rect x="18" y="206" width="484" height="102" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="228" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">② v 取三点中位数：|aⱼ−v| + |v−bⱼ| + |v−t| = max − min</text>

  <path d="M 80 258 L 440 258" fill="none" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>

  <path d="M 140 252 L 140 264" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="140" cy="258" r="3.5" fill="#b85450" filter="url(#rough2)"/>
  <text x="140" y="246" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">bⱼ = 1</text>

  <path d="M 260 252 L 260 264" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="260" cy="258" r="3.5" fill="#446688" filter="url(#rough2)"/>
  <text x="260" y="246" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">aⱼ = 2</text>
  <circle cx="260" cy="258" r="8" fill="none" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>

  <path d="M 380 252 L 380 264" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="380" cy="258" r="3.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="380" y="246" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">t = 3</text>

  <text x="438" y="246" text-anchor="end" font-size="10" fill="#d6a040" filter="url(#rough2)">◎ v = 中位数（必与某点重合）</text>

  <path d="M 140 266 L 140 274 L 260 274 L 260 266" fill="none" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="200" y="290" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">|v−bⱼ| = 1</text>

  <path d="M 260 266 L 260 274 L 380 274 L 380 266" fill="none" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="320" y="290" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">|v−t| = 1</text>

  <text x="260" y="302" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">合计 = 3 − 1 = 2 = max − min（|aⱼ−v| = 0，v 与 aⱼ 重合）</text>

  <!-- 底部公式 -->
  <rect x="18" y="316" width="484" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="332" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans = 1 + min_j [ S − |aⱼ−bⱼ| + (max−min)(aⱼ, bⱼ, t) ]</text>
  <text x="260" y="348" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">S = Σ|aᵢ−bᵢ|，t = nums2[n]；range ≥ |aⱼ−bⱼ| 恒成立 ⇒ 答案 ≥ S + 1</text>
</svg>
