<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L8 5 L0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="500" height="460" fill="#fafafa"/>

  <text x="250" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：排序 → 双重遍历 → 子串判定 → 收集答案</text>

  <!-- 开始 -->
  <rect x="200" y="40" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="250" y="58" text-anchor="middle" font-size="12" fill="#333">开始</text>

  <!-- 排序 -->
  <path d="M 250 70 L 250 82" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <rect x="120" y="86" width="260" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="106" text-anchor="middle" font-size="12" fill="#333">按长度升序排序 words</text>

  <!-- 初始化 -->
  <path d="M 250 118 L 250 130" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <rect x="170" y="134" width="160" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="152" text-anchor="middle" font-size="12" fill="#333">i = 0, ans = []</text>

  <!-- 遍历（外层 + 内层） -->
  <path d="M 250 162 L 250 178" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <rect x="80" y="182" width="340" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="202" text-anchor="middle" font-size="12" fill="#333">对每个 words[i]: 在 words[j] (j &gt; i) 中查找</text>

  <!-- 判定菱形 -->
  <path d="M 250 214 L 250 224" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <polygon points="250,228 380,268 250,308 120,268" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="264" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">words[j] 含</text>
  <text x="250" y="280" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">words[i] ?</text>

  <!-- 是 → 加入 ans -->
  <path d="M 250 308 L 250 318" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="266" y="314" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <rect x="150" y="322" width="200" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="342" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">ans.push(words[i]), break</text>

  <!-- 否 → 跳过 -->
  <text x="388" y="264" font-size="11" fill="#446688" font-weight="bold">否</text>
  <text x="386" y="280" font-size="11" fill="#888">跳过</text>

  <!-- 回环箭头：是分支 → 下一个 i -->
  <path d="M 350 338 L 440 338 L 440 198 L 420 198" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="448" y="272" font-size="10" fill="#4a7a3a" font-weight="bold">下</text>
  <text x="448" y="284" font-size="10" fill="#4a7a3a" font-weight="bold">一</text>
  <text x="448" y="296" font-size="10" fill="#4a7a3a" font-weight="bold">个 i</text>

  <!-- 回环箭头：否分支 → 下一个 j -->
  <path d="M 380 268 L 440 268" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="386" y="252" font-size="10" fill="#446688">j++</text>

  <!-- 遍历完 → 返回 ans -->
  <path d="M 80 198 L 50 198 L 50 388 L 170 388" stroke="#446688" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="58" y="294" font-size="10" fill="#888" font-weight="bold">遍历完</text>

  <!-- 返回 ans -->
  <rect x="170" y="372" width="160" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="392" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 ans</text>

  <!-- 结束 -->
  <path d="M 250 404 L 250 416" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <rect x="200" y="420" width="100" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="250" y="434" text-anchor="middle" font-size="11" fill="#333">结束</text>
</svg>
