<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrF" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">算法流程：筛 → 收集 → 扫相邻 → 取最小</text>

  <!-- Step 1 -->
  <rect x="30" y="70" width="140" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="100" y="96" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① 埃氏筛</text>
  <text x="100" y="116" text-anchor="middle" font-size="10" fill="#555">isPrime[0..right]</text>
  <text x="100" y="129" text-anchor="middle" font-size="10" fill="#555">从 i·i 划倍数到 √right</text>

  <!-- arrow -->
  <path d="M 172 102 L 208 102" stroke="#446688" stroke-width="2.2" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="210" y="70" width="140" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="96" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">② 收集</text>
  <text x="280" y="116" text-anchor="middle" font-size="10" fill="#555">取 left≤p≤right 的质数</text>
  <text x="280" y="129" text-anchor="middle" font-size="10" fill="#555">得到有序数组 primes</text>

  <!-- arrow -->
  <path d="M 352 102 L 388 102" stroke="#446688" stroke-width="2.2" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="390" y="70" width="140" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="460" y="96" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">③ 扫相邻间距</text>
  <text x="460" y="116" text-anchor="middle" font-size="10" fill="#555">维护最小 gap + 对应对</text>
  <text x="460" y="129" text-anchor="middle" font-size="10" fill="#555">命中 gap=2 即早停</text>

  <!-- early stop callout -->
  <path d="M 460 134 Q 470 165 440 178" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <rect x="378" y="180" width="164" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="460" y="198" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">奇质数最小间距 = 2</text>
  <text x="460" y="213" text-anchor="middle" font-size="10" fill="#b85450">(2,3) 间距 1 必先命中</text>

  <!-- guard branch: fewer than 2 primes -->
  <path d="M 280 134 L 280 175" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <rect x="190" y="180" width="180" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="198" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">若 |primes| &lt; 2</text>
  <text x="280" y="213" text-anchor="middle" font-size="10" fill="#b85450">返回 [-1, -1]</text>

  <!-- complexity strip -->
  <rect x="40" y="250" width="480" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)" opacity="0.5"/>
  <text x="280" y="272" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">复杂度</text>
  <text x="60" y="296" font-size="11" fill="#444">• 时间：O(right · log log right) 筛 + O(right−left) 收集 + O(π(right)) 扫描</text>
  <text x="60" y="316" font-size="11" fill="#444">• 空间：O(right)（isPrime 数组）</text>
</svg>
