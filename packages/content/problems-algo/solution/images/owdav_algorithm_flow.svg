<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：虚拟源点 + Kruskal MST</text>

  <!-- Step 1: create virtual node -->
  <rect x="50" y="48" width="440" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <circle cx="76" cy="70" r="14" fill="#b85450" filter="url(#rough2)"/>
  <text x="76" y="75" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">1</text>
  <text x="100" y="66" font-size="11.5" fill="#333" font-weight="bold">创建虚拟源点 0（代表水源）</text>
  <text x="100" y="82" font-size="10" fill="#888">wells[i-1] → 边 (0, i, wells[i-1])，每口井变成一条从源点到村 i 的边</text>

  <line x1="270" y1="96" x2="270" y2="116" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: collect edges -->
  <rect x="50" y="120" width="440" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <circle cx="76" cy="142" r="14" fill="#d6a040" filter="url(#rough2)"/>
  <text x="76" y="147" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">2</text>
  <text x="100" y="138" font-size="11.5" fill="#333" font-weight="bold">收集所有边：井边 + 管道边</text>
  <text x="100" y="154" font-size="10" fill="#888">edges = [(0,i,wells[i-1]) for i in 1..n] + pipes，共 n + len(pipes) 条边</text>

  <line x1="270" y1="168" x2="270" y2="188" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: sort -->
  <rect x="50" y="192" width="440" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <circle cx="76" cy="214" r="14" fill="#446688" filter="url(#rough2)"/>
  <text x="76" y="219" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">3</text>
  <text x="100" y="210" font-size="11.5" fill="#333" font-weight="bold">按费用升序排序所有边</text>
  <text x="100" y="226" font-size="10" fill="#888">edges.sort(key=cost)，费用小的边优先尝试选入 MST</text>

  <line x1="270" y1="240" x2="270" y2="260" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: Kruskal -->
  <rect x="50" y="264" width="440" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <circle cx="76" cy="292" r="14" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="76" y="297" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">4</text>
  <text x="100" y="282" font-size="11.5" fill="#333" font-weight="bold">Kruskal 选边：并查集判环</text>
  <text x="100" y="298" font-size="10" fill="#888">逐条扫描：find(u) ≠ find(v) → union + 累加 cost + count++</text>
  <text x="100" y="312" font-size="10" fill="#888">find(u) = find(v) → 跳过（成环）。选满 n 条边即停（n+1 节点的 MST 有 n 条边）</text>

  <line x1="270" y1="324" x2="270" y2="344" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: return -->
  <rect x="50" y="348" width="440" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <circle cx="76" cy="368" r="14" fill="#b85450" filter="url(#rough2)"/>
  <text x="76" y="373" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">5</text>
  <text x="100" y="372" font-size="11.5" fill="#333" font-weight="bold">返回累加总费用 ans（即 MST 权值 = 最小供水成本）</text>
</svg>
