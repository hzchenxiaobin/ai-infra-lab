<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">什么是「连通分量」？</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">链表中连续且都在 nums 中的极长段，每个这样的段算一个分量</text>

  <!-- ===== 链表节点：head = [0,1,2,3,4], nums = [0,3,1,4] ===== -->
  <text x="40" y="80" font-size="11" fill="#888" font-weight="bold">链表：</text>
  <g font-size="13">
    <rect x="80" y="68" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="108" y="90" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>
    <line x1="136" y1="85" x2="164" y2="85" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

    <rect x="170" y="68" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="198" y="90" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <line x1="226" y1="85" x2="254" y2="85" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

    <rect x="260" y="68" width="56" height="34" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
    <text x="288" y="90" text-anchor="middle" fill="#aaa">2</text>
    <line x1="316" y1="85" x2="344" y2="85" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

    <rect x="350" y="68" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="378" y="90" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <line x1="406" y1="85" x2="434" y2="85" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

    <rect x="440" y="68" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="468" y="90" text-anchor="middle" fill="#4a7a3a" font-weight="bold">4</text>
    <line x1="496" y1="85" x2="524" y2="85" stroke="#446688" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="536" y="90" font-size="12" fill="#888">∅</text>
  </g>

  <!-- 图例 -->
  <rect x="80" y="112" width="20" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="106" y="124" font-size="10" fill="#555">在 nums 中</text>
  <rect x="180" y="112" width="20" height="14" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="206" y="124" font-size="10" fill="#555">不在 nums 中</text>

  <!-- ===== 分量括号 1: [0,1] ===== -->
  <path d="M 80 148 Q 80 160 92 160 L 124 160 Q 136 160 136 148" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 108 160 L 108 168" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <rect x="74" y="168" width="68" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="108" y="184" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">分量 ①</text>

  <!-- ===== 分量括号 2: [3,4] ===== -->
  <path d="M 350 148 Q 350 160 362 160 L 454 160 Q 466 160 466 148" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 408 160 L 408 168" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <rect x="374" y="168" width="68" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="408" y="184" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">分量 ②</text>

  <!-- ===== 核心规则说明 ===== -->
  <rect x="40" y="210" width="500" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="52" y="230" font-size="11" fill="#8a6a20" font-weight="bold">核心：每个分量 = 一段「在 nums 中」的连续节点</text>
  <text x="52" y="248" font-size="10" fill="#555">节点 2 不在 nums 中 → 切断链 → [0,1] 和 [3,4] 被分成两个独立分量</text>

  <!-- ===== 计数规则 ===== -->
  <rect x="40" y="280" width="500" height="84" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="52" y="300" font-size="11" fill="#4a7a3a" font-weight="bold">如何计数？数「分量的起点」：</text>
  <text x="52" y="318" font-size="10" fill="#555">一个节点是分量起点 ⟺ 它在 nums 中 且 前驱不在 nums 中（或它是头节点）</text>
  <text x="52" y="336" font-size="10" fill="#555">节点 0：在 nums ✓，无前驱 → 起点，count=1</text>
  <text x="52" y="354" font-size="10" fill="#555">节点 3：在 nums ✓，前驱 2 不在 nums → 起点，count=2</text>
</svg>
