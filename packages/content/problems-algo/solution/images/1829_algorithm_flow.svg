<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="520" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：算总异或 → 从右端逐个剔除填答案</text>

  <!-- Start oval -->
  <ellipse cx="200" cy="55" rx="46" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="60" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">开始</text>

  <!-- arrow start -> box1 -->
  <path d="M 200 73 L 200 86" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box1: total xor -->
  <rect x="80" y="88" width="240" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="200" y="114" text-anchor="middle" font-size="12" fill="#333">cur = nums[0] ⊕ … ⊕ nums[n−1]</text>
  <text x="338" y="114" font-size="10" fill="#888">① 一次遍历 O(n)</text>

  <!-- arrow box1 -> box2 -->
  <path d="M 200 130 L 200 148" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box2: mask -->
  <rect x="80" y="150" width="240" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="200" y="176" text-anchor="middle" font-size="12" fill="#333">mask = (1 &lt;&lt; maximumBit) − 1</text>
  <text x="338" y="176" font-size="10" fill="#888">② 低位全 1</text>

  <!-- arrow box2 -> box3 -->
  <path d="M 200 192 L 200 210" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box3: init i -->
  <rect x="110" y="212" width="180" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="200" y="235" text-anchor="middle" font-size="12" fill="#333">i ← n − 1</text>

  <!-- arrow box3 -> diamond -->
  <path d="M 200 248 L 200 260" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: i >= 0 ? -->
  <polygon points="200,262 262,285 200,308 138,285" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="290" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">i ≥ 0 ?</text>

  <!-- No branch: right -->
  <text x="270" y="278" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M 262 285 L 303 285" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="305" y="268" width="100" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="355" y="291" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 ans</text>
  <path d="M 405 285 L 430 285" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="468" cy="285" rx="36" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="468" y="290" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">结束</text>

  <!-- Yes branch: down -->
  <text x="208" y="322" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 200 308 L 200 333" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box4: ans -->
  <rect x="80" y="335" width="240" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="200" y="361" text-anchor="middle" font-size="12" fill="#333">ans[n−1−i] = cur ⊕ mask</text>
  <text x="338" y="361" font-size="10" fill="#888">③ 按位取反 O(1)</text>

  <!-- arrow box4 -> box5 -->
  <path d="M 200 377 L 200 395" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box5: remove -->
  <rect x="80" y="397" width="240" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="200" y="423" text-anchor="middle" font-size="12" fill="#333">cur ⊕= nums[i]  （剔除末尾）</text>
  <text x="338" y="423" font-size="10" fill="#888">自逆消去 O(1)</text>

  <!-- arrow box5 -> box6 -->
  <path d="M 200 439 L 200 457" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box6: decrement -->
  <rect x="110" y="459" width="180" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="200" y="482" text-anchor="middle" font-size="12" fill="#333">i ← i − 1</text>

  <!-- Loop back: from box6 left, up, right to diamond left point -->
  <path d="M 110 477 L 50 477 L 50 285 L 136 285" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="42" y="385" font-size="10" fill="#888" transform="rotate(-90 42 385)">回到判定</text>

  <!-- bottom note -->
  <text x="280" y="510" text-anchor="middle" font-size="10" fill="#888">每轮循环 O(1)：一次按位取反填答案 + 一次异或剔除末尾；共 n 轮 ⇒ 总 O(n)</text>
</svg>
