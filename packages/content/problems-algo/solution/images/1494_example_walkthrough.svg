<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1 演算：n=4, k=2, relations=[[2,1],[3,1],[1,4]]</text>

  <rect x="20" y="44" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">学期</text>
  <rect x="90" y="44" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">mask</text>
  <rect x="180" y="44" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">可选集 can</text>
  <rect x="280" y="44" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">本学期选</text>
  <rect x="380" y="44" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="425" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">新 mask</text>
  <rect x="470" y="44" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="500" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">dp</text>

  <rect x="20" y="76" width="70" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="101" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">第 1</text>
  <rect x="90" y="76" width="90" height="40" fill="#fafafa" stroke="#888" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="135" y="101" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0000</text>
  <rect x="180" y="76" width="100" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="95" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{2, 3}</text>
  <text x="230" y="109" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">无先修，直接可选</text>
  <rect x="280" y="76" width="100" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="95" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">{2, 3}</text>
  <text x="330" y="109" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">|can|=2 ≤ k 全选</text>
  <rect x="380" y="76" width="90" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="425" y="101" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">0110</text>
  <rect x="470" y="76" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="500" y="101" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>

  <path d="M280,116 L280,124" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr3)" filter="url(#rough2)"/>

  <rect x="20" y="128" width="70" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="153" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">第 2</text>
  <rect x="90" y="128" width="90" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="153" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0110</text>
  <rect x="180" y="128" width="100" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="147" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{1}</text>
  <text x="230" y="161" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">pre[1]={2,3}已完成</text>
  <rect x="280" y="128" width="100" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="147" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">{1}</text>
  <text x="330" y="161" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">|can|=1 ≤ k 全选</text>
  <rect x="380" y="128" width="90" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="425" y="153" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">0111</text>
  <rect x="470" y="128" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="500" y="153" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>

  <path d="M280,168 L280,176" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr3)" filter="url(#rough2)"/>

  <rect x="20" y="180" width="70" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="55" y="205" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">第 3</text>
  <rect x="90" y="180" width="90" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="205" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0111</text>
  <rect x="180" y="180" width="100" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="199" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{4}</text>
  <text x="230" y="213" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">pre[4]={1}已完成</text>
  <rect x="280" y="180" width="100" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="199" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">{4}</text>
  <text x="330" y="213" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">|can|=1 ≤ k 全选</text>
  <rect x="380" y="180" width="90" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="425" y="205" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">1111</text>
  <rect x="470" y="180" width="60" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="500" y="205" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>

  <path d="M425,220 L425,236" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr3)" filter="url(#rough2)"/>

  <rect x="280" y="238" width="290" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="425" y="258" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">mask = 1111 → 返回 dp[1111] = 3</text>

  <rect x="30" y="286" width="500" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="308" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">关键步骤解读</text>
  <text x="50" y="328" font-size="10" fill="#333" filter="url(#rough2)">• pre[i] = 课程 i 的先修课位掩码。pre[1]=0110（课程 2、3），pre[4]=0001（课程 1）</text>
  <text x="50" y="346" font-size="10" fill="#333" filter="url(#rough2)">• can = 所有满足 pre[i] ⊆ mask 且 i ∉ mask 的课程。第 1 学期 mask=0000，只有 2、3 无先修</text>
  <text x="50" y="364" font-size="10" fill="#333" filter="url(#rough2)">• 本题每步 |can| ≤ k，均走「全选」分支；当 |can| &gt; k 时才需枚举大小恰为 k 的子集</text>
  <text x="50" y="382" font-size="10" fill="#4a7a3a" filter="url(#rough2)">• 状态转移：dp[mask | sub] = min(dp[mask | sub], dp[mask] + 1)</text>
  <text x="50" y="398" font-size="10" fill="#888" filter="url(#rough2)">  mask | sub = 把本学期选的课并入学完集合，得到下一状态</text>
</svg>
