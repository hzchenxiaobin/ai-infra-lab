<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心思路：滑动窗口 + 前缀最小长度 DP</text>

  <!-- target label -->
  <text x="60" y="64" font-size="13" fill="#b85450" font-weight="bold">target = 7</text>

  <!-- ===== Array row: [7, 3, 4, 7] ===== -->
  <!-- index labels -->
  <text x="135" y="82" text-anchor="middle" font-size="10" fill="#aaa">idx 0</text>
  <text x="205" y="82" text-anchor="middle" font-size="10" fill="#aaa">1</text>
  <text x="275" y="82" text-anchor="middle" font-size="10" fill="#aaa">2</text>
  <text x="345" y="82" text-anchor="middle" font-size="10" fill="#aaa">3</text>

  <!-- Subarray A: [7] at index 0 — blue highlight -->
  <rect x="110" y="90" width="50" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="135" y="118" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">7</text>

  <!-- element 3 -->
  <rect x="180" y="90" width="50" height="44" fill="#fafafa" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="205" y="118" text-anchor="middle" font-size="16" fill="#999">3</text>

  <!-- element 4 -->
  <rect x="250" y="90" width="50" height="44" fill="#fafafa" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="275" y="118" text-anchor="middle" font-size="16" fill="#999">4</text>

  <!-- Subarray B: [7] at index 3 — green highlight -->
  <rect x="320" y="90" width="50" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="345" y="118" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">7</text>

  <!-- Subarray A bracket + label -->
  <path d="M 110 146 L 110 152 L 160 152 L 160 146" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="135" y="168" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">子数组 A</text>
  <text x="135" y="182" text-anchor="middle" font-size="10" fill="#446688">sum=7 ✓ len=1</text>

  <!-- Subarray B bracket + label -->
  <path d="M 320 146 L 320 152 L 370 152 L 370 146" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="345" y="168" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">子数组 B</text>
  <text x="345" y="182" text-anchor="middle" font-size="10" fill="#4a7a3a">sum=7 ✓ len=1</text>

  <!-- "不重叠" label between them -->
  <rect x="215" y="160" width="80" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="255" y="176" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">不重叠 ✓</text>

  <!-- ===== dp array row ===== -->
  <text x="60" y="222" font-size="13" fill="#555" font-weight="bold">dp[i] = arr[0..i] 中和为 target 的最短子数组长度</text>

  <!-- dp boxes -->
  <rect x="110" y="234" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="135" y="258" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">1</text>

  <rect x="180" y="234" width="50" height="36" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="205" y="258" text-anchor="middle" font-size="14" fill="#999">1</text>

  <rect x="250" y="234" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="275" y="258" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>

  <rect x="320" y="234" width="50" height="36" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="345" y="258" text-anchor="middle" font-size="14" fill="#999">1</text>

  <!-- dp index labels -->
  <text x="135" y="286" text-anchor="middle" font-size="10" fill="#aaa">dp[0]</text>
  <text x="205" y="286" text-anchor="middle" font-size="10" fill="#aaa">dp[1]</text>
  <text x="275" y="286" text-anchor="middle" font-size="10" fill="#aaa">dp[2]</text>
  <text x="345" y="286" text-anchor="middle" font-size="10" fill="#aaa">dp[3]</text>

  <!-- running min arrow -->
  <path d="M 165 252 L 175 252" stroke="#888" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 235 252 L 245 252" stroke="#888" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 305 252 L 315 252" stroke="#888" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="280" y="300" text-anchor="middle" font-size="10" fill="#aaa">← 前缀最小值传递 →</text>

  <!-- ===== Combine formula ===== -->
  <path d="M 275 300 L 275 312 L 135 312 L 135 276" stroke="#446688" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Formula box -->
  <rect x="80" y="322" width="400" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="340" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">当窗口 [left, right] 命中 target 时：</text>
  <text x="280" y="358" text-anchor="middle" font-size="13" fill="#a87020" font-weight="bold">ans = min(ans, dp[left−1] + (right−left+1))</text>
</svg>
