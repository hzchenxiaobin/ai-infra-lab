<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="33" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="41" result="n2"/>
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="1.3"/>
    </filter>
  </defs>
  <rect width="720" height="420" fill="#fdfcf7"/>

  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：["abc","ab","bc","b"] → [5,4,3,2]</text>
  <path d="M 210 42 Q 360 50 510 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="360" y="60" text-anchor="middle" font-size="11" fill="#888">建 Trie 后各节点 cnt：a=2, a→b=2, a→b→c=1, b=2, b→c=1</text>

  <!-- table header -->
  <g filter="url(#sk)">
    <rect x="40" y="80" width="640" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="120" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">word</text>
  <text x="400" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">各前缀（cnt）</text>
  <text x="620" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">求和 = answer</text>

  <!-- row 1 abc -->
  <g filter="url(#sk2)">
    <rect x="40" y="118" width="640" height="40" rx="4" fill="#ffffff" stroke="#ccc" stroke-width="1"/>
  </g>
  <text x="120" y="143" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"abc"</text>
  <text x="400" y="143" text-anchor="middle" font-size="11" fill="#444">a(2) + ab(2) + abc(1)</text>
  <text x="620" y="143" text-anchor="middle" font-size="12" fill="#c04050" font-weight="bold">5</text>

  <!-- row 2 ab -->
  <g filter="url(#sk2)">
    <rect x="40" y="160" width="640" height="40" rx="4" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
  </g>
  <text x="120" y="185" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"ab"</text>
  <text x="400" y="185" text-anchor="middle" font-size="11" fill="#444">a(2) + ab(2)</text>
  <text x="620" y="185" text-anchor="middle" font-size="12" fill="#c04050" font-weight="bold">4</text>

  <!-- row 3 bc -->
  <g filter="url(#sk2)">
    <rect x="40" y="202" width="640" height="40" rx="4" fill="#ffffff" stroke="#ccc" stroke-width="1"/>
  </g>
  <text x="120" y="227" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"bc"</text>
  <text x="400" y="227" text-anchor="middle" font-size="11" fill="#444">b(2) + bc(1)</text>
  <text x="620" y="227" text-anchor="middle" font-size="12" fill="#c04050" font-weight="bold">3</text>

  <!-- row 4 b -->
  <g filter="url(#sk2)">
    <rect x="40" y="244" width="640" height="40" rx="4" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
  </g>
  <text x="120" y="269" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"b"</text>
  <text x="400" y="269" text-anchor="middle" font-size="11" fill="#444">b(2)</text>
  <text x="620" y="269" text-anchor="middle" font-size="12" fill="#c04050" font-weight="bold">2</text>

  <!-- note -->
  <g filter="url(#sk)">
    <rect x="40" y="300" width="640" height="100" rx="6" fill="#fff8e1" stroke="#c98a2b" stroke-width="0.9"/>
  </g>
  <text x="60" y="324" font-size="12" font-weight="bold" fill="#8a6a1a">💡 关键观察</text>
  <g font-size="11" fill="#5a4a2a">
    <text x="60" y="346">"b" 作为 "bc"/"b" 的前缀（根→b，cnt=2），与 "ab" 中的 b（根→a→b，cnt=2）是</text>
    <text x="60" y="364">不同 Trie 节点——前缀身份由「根到节点的完整路径」决定，而非末字符。</text>
    <text x="60" y="386" fill="#2e8b57">查询 "abc" 时沿 root→a→b→c 累加 2+2+1=5，路径天然枚举了它的全部前缀。</text>
  </g>
</svg>
