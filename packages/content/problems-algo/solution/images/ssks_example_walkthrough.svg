<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold">示例 1 演算：三行按第 k=2 列降序，第 1 行浮顶、第 0 行居中、第 2 行沉底</text>

  <!-- labels -->
  <text x="116" y="56" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">排序前</text>
  <text x="426" y="56" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">排序后</text>

  <!-- original row labels -->
  <text x="26" y="90" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">#0</text>
  <text x="26" y="120" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">#1</text>
  <text x="26" y="150" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">#2</text>

  <!-- original matrix: [10,6,9,1],[7,5,11,2],[4,8,3,15] -->
  <!-- Row 0 -->
  <rect x="40" y="70" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="59" y="90" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">10</text>
  <rect x="78" y="70" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="97" y="90" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">6</text>
  <rect x="116" y="70" width="38" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="135" y="90" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">9</text>
  <rect x="154" y="70" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="173" y="90" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">1</text>

  <!-- Row 1 -->
  <rect x="40" y="100" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="59" y="120" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">7</text>
  <rect x="78" y="100" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="97" y="120" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">5</text>
  <rect x="116" y="100" width="38" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="135" y="120" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">11</text>
  <rect x="154" y="100" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="173" y="120" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">2</text>

  <!-- Row 2 -->
  <rect x="40" y="130" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="59" y="150" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">4</text>
  <rect x="78" y="130" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="97" y="150" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">8</text>
  <rect x="116" y="130" width="38" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="135" y="150" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">3</text>
  <rect x="154" y="130" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="173" y="150" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">15</text>

  <!-- middle reorder arrow -->
  <path d="M 194 110 L 346 110" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="270" y="100" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">按第 k 列降序</text>

  <!-- result row labels (which original row) -->
  <text x="336" y="90" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">#1</text>
  <text x="336" y="120" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">#0</text>
  <text x="336" y="150" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">#2</text>

  <!-- result matrix: row1, row0, row2 data; kth col now 11,9,3 (descending, green) -->
  <!-- Row 0 (= orig #1): 7,5,11,2 -->
  <rect x="350" y="70" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="369" y="90" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">7</text>
  <rect x="388" y="70" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="407" y="90" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">5</text>
  <rect x="426" y="70" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="445" y="90" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">11</text>
  <rect x="464" y="70" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="483" y="90" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">2</text>

  <!-- Row 1 (= orig #0): 10,6,9,1 -->
  <rect x="350" y="100" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="369" y="120" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">10</text>
  <rect x="388" y="100" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="407" y="120" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">6</text>
  <rect x="426" y="100" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="445" y="120" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">9</text>
  <rect x="464" y="100" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="483" y="120" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">1</text>

  <!-- Row 2 (= orig #2): 4,8,3,15 -->
  <rect x="350" y="130" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="369" y="150" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">4</text>
  <rect x="388" y="130" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="407" y="150" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">8</text>
  <rect x="426" y="130" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="445" y="150" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">3</text>
  <rect x="464" y="130" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="483" y="150" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">15</text>

  <!-- bottom note -->
  <rect x="40" y="180" width="462" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="271" y="204" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold">第 k 列值  [9, 11, 3]   →   降序  [11, 9, 3]</text>
  <text x="271" y="226" text-anchor="middle" font-size="12" fill="#446688">对应原行号  [#0, #1, #2]   →   [#1, #0, #2]</text>
  <text x="271" y="248" text-anchor="middle" font-size="11.5" fill="#4a7a3a">把行整体按此顺序重排 → 结果矩阵</text>
</svg>
