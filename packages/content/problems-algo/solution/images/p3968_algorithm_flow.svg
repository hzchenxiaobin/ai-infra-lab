<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14.5" fill="#333" filter="url(#rough2)">算法流程：一次遍历计数，最后套公式</text>

  <!-- 初始化 -->
  <rect x="200" y="36" width="120" height="30" rx="8" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="56" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">x = 0, y = 0, k = 0</text>

  <path d="M 260 66 L 260 82" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取字符 -->
  <rect x="195" y="86" width="130" height="30" rx="8" fill="#fafafa"
        stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="106" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">取下一个字符 c</text>

  <!-- 分发箭头 -->
  <g fill="none" stroke="#446688" stroke-width="1.4" filter="url(#rough2)">
    <path d="M 260 116 C 260 140, 66 138, 66 166" marker-end="url(#arr)"/>
    <path d="M 260 116 C 260 140, 163 140, 163 166" marker-end="url(#arr)"/>
    <path d="M 260 116 L 260 166" marker-end="url(#arr)"/>
    <path d="M 260 116 C 260 140, 357 140, 357 166" marker-end="url(#arr)"/>
    <path d="M 260 116 C 260 140, 454 138, 454 166" marker-end="url(#arr)"/>
  </g>

  <!-- 五个分支 -->
  <g stroke-width="1.6" filter="url(#rough2)">
    <rect x="24" y="170" width="84" height="44" rx="6" fill="#e8f0fe" stroke="#446688"/>
    <rect x="121" y="170" width="84" height="44" rx="6" fill="#e8f0fe" stroke="#446688"/>
    <rect x="218" y="170" width="84" height="44" rx="6" fill="#e8f0fe" stroke="#446688"/>
    <rect x="315" y="170" width="84" height="44" rx="6" fill="#e8f0fe" stroke="#446688"/>
    <rect x="412" y="170" width="84" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#666" filter="url(#rough2)">
    <text x="66" y="187">c == 'R'</text>
    <text x="163" y="187">c == 'L'</text>
    <text x="260" y="187">c == 'U'</text>
    <text x="357" y="187">c == 'D'</text>
    <text x="454" y="187">c == '_'</text>
  </g>
  <g font-size="12.5" text-anchor="middle" font-weight="bold" filter="url(#rough2)">
    <text x="66" y="205" fill="#446688">x += 1</text>
    <text x="163" y="205" fill="#446688">x −= 1</text>
    <text x="260" y="205" fill="#446688">y += 1</text>
    <text x="357" y="205" fill="#446688">y −= 1</text>
    <text x="454" y="205" fill="#d6a040">k += 1</text>
  </g>

  <!-- 汇合 -->
  <g fill="none" stroke="#446688" stroke-width="1.4" filter="url(#rough2)">
    <path d="M 66 214 C 66 232, 260 222, 260 236" marker-end="url(#arr)"/>
    <path d="M 163 214 C 163 232, 260 226, 260 236" marker-end="url(#arr)"/>
    <path d="M 357 214 C 357 232, 260 226, 260 236" marker-end="url(#arr)"/>
    <path d="M 454 214 C 454 232, 260 222, 260 236" marker-end="url(#arr)"/>
  </g>

  <!-- 判断菱形 -->
  <polygon points="260,238 328,264 260,290 192,264" fill="#fce4ec" fill-opacity="0.6"
           stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="268" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">遍历结束？</text>

  <!-- 否：回环 -->
  <path d="M 192 264 L 90 264 L 90 101 L 191 101" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="170" y="256" text-anchor="end" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- 是：出结果 -->
  <path d="M 260 290 L 260 304" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="302" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="150" y="306" width="220" height="34" rx="8" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="328" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 |x| + |y| + k</text>

  <text x="260" y="356" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">时间 O(n)，空间 O(1)——边读边数，字符串本身无需修改或存储</text>
</svg>
