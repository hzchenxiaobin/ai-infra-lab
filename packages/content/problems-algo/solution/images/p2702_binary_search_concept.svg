<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：基线 t·y + 额外 cᵢ·(x−y)，再贪心核对总量</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">一次操作：选 i，则 nums[i] −= x（多减），其余 −= y（基线）</text>

  <!-- Operation model row -->
  <text x="30" y="74" font-size="11" fill="#666" font-weight="bold">一次操作</text>

  <!-- chosen index (big decrement) -->
  <rect x="120" y="58" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="142" y="78" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">i</text>
  <text x="174" y="78" font-size="12" fill="#b85450" font-weight="bold">− x</text>

  <!-- others (baseline) -->
  <rect x="240" y="58" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="258" y="78" text-anchor="middle" font-size="12" fill="#333">其余</text>
  <text x="286" y="78" font-size="12" fill="#446688" font-weight="bold">− y</text>

  <text x="360" y="78" font-size="11" fill="#888">被选多减 (x−y)</text>

  <!-- Derivation box -->
  <rect x="30" y="100" width="500" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="120" font-size="11.5" fill="#333" font-weight="bold">做 t 步、下标 i 被选 cᵢ 次：</text>
  <text x="40" y="140" font-size="12" fill="#333">削减ᵢ = cᵢ·x + (t−cᵢ)·y = </text>
  <text x="225" y="140" font-size="12.5" fill="#b85450" font-weight="bold">t·y</text>
  <text x="252" y="140" font-size="12" fill="#333">（基线） + </text>
  <text x="300" y="140" font-size="12.5" fill="#4a7a3a" font-weight="bold">cᵢ·(x−y)</text>
  <text x="362" y="140" font-size="12" fill="#333">（额外）</text>
  <text x="40" y="156" font-size="11" fill="#555">要 nums[i] ≤ 0 ⟺ cᵢ ≥ ⌈(nums[i] − t·y) / (x−y)⌉（若 nums[i] &gt; t·y）</text>

  <!-- check function -->
  <text x="30" y="184" font-size="11" fill="#666" font-weight="bold">贪心判定 check(t)</text>
  <rect x="30" y="190" width="290" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="42" y="210" font-size="11.5" fill="#333">遍历每个 v = nums[i]：</text>
  <text x="42" y="226" font-size="11" fill="#555">  v ≤ t·y → cᵢ = 0；否则 cᵢ = ⌈(v − t·y)/(x−y)⌉</text>
  <text x="42" y="240" font-size="11" fill="#555">  return Σ cᵢ ≤ t</text>

  <!-- arrow to monotonicity -->
  <path d="M335 218 L372 218" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="345" y="212" font-size="10" fill="#888">O(n)</text>

  <!-- monotonicity -->
  <rect x="380" y="190" width="150" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="455" y="212" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">单调性</text>
  <text x="455" y="228" text-anchor="middle" font-size="10.5" fill="#4a7a3a">t 可行 ⟹ t+1 可行</text>
  <text x="455" y="242" text-anchor="middle" font-size="10.5" fill="#4a7a3a">⟹ 二分最小 t</text>

  <!-- binary search bar -->
  <text x="30" y="272" font-size="11" fill="#666" font-weight="bold">二分区间 [0, max(nums)]</text>
  <line x1="30" y1="296" x2="500" y2="296" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <!-- ticks -->
  <line x1="30" y1="292" x2="30" y2="300" stroke="#888" stroke-width="1.4"/>
  <text x="30" y="314" text-anchor="middle" font-size="10.5" fill="#888">0</text>
  <line x1="500" y1="292" x2="500" y2="300" stroke="#888" stroke-width="1.4"/>
  <text x="500" y="314" text-anchor="middle" font-size="10.5" fill="#888">max(nums)</text>

  <!-- mid marker -->
  <line x1="265" y1="288" x2="265" y2="304" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="265" y="282" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">mid</text>

  <!-- green zone (feasible) -->
  <rect x="265" y="296" width="235" height="6" fill="#4a7a3a" opacity="0.35" filter="url(#rough2)"/>
  <text x="440" y="332" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">可行（收缩 r=mid）</text>
  <!-- red zone (infeasible) -->
  <rect x="30" y="296" width="235" height="6" fill="#b85450" opacity="0.30" filter="url(#rough2)"/>
  <text x="100" y="332" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">不可行（l=mid+1）</text>

  <!-- bottom note -->
  <rect x="30" y="346" width="500" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="363" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">右界够用：y≥1 ⟹ t=max 时 t·y≥每个 v，Σcᵢ=0≤t 必可行</text>
</svg>
