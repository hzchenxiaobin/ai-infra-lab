<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：逐位剥离 + 桶计数 + 贡献累加，最后 ÷2</text>

  <rect x="110" y="42" width="300" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">开始：ans = 0（long long），D = nums[0] 的位数</text>

  <path d="M 260 76 L 260 90" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="92" width="300" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="114" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">第 p 位（p 从 0 起，即个位）：cnt[0..9] ← 0</text>

  <path d="M 260 126 L 260 140" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="142" width="300" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="162" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">遍历 i：cnt[nums[i] % 10]++</text>
  <text x="260" y="180" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">nums[i] /= 10（原地剥位，下轮自动进一位）</text>

  <path d="M 260 188 L 260 202" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="204" width="300" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="226" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">ans += Σ_d cnt[d]·(n − cnt[d])</text>

  <path d="M 260 238 L 260 252" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,254 362,300 260,346 158,300" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="260" y="294" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">p 加 1 之后</text>
  <text x="260" y="312" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">还 &lt; D 吗？</text>

  <path d="M 158 300 L 62 300 L 62 109 L 106 109" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="106" y="288" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是：还有位，回去清零再数</text>

  <path d="M 260 346 L 260 362" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="358" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="110" y="364" width="300" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="386" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">返回 ans / 2（不同数对被双计，除回来）</text>

  <text x="260" y="416" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">时间 O(n·D)，D ≤ 9；空间 O(1)（10 槽计数数组逐轮复用）</text>
</svg>
