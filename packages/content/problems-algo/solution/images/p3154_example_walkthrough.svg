<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="450" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：k = 1，答案 = 1 + 2 + 1 = 4</text>

  <text x="70" y="50" text-anchor="middle" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">(x, y) 分解</text>
  <text x="255" y="50" text-anchor="middle" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">操作序列（U = 向上跳，D = 向下）</text>
  <text x="452" y="50" text-anchor="middle" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">贡献</text>

  <rect x="30" y="60" width="86" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="73" y="80" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">① x=0, y=0</text>

  <rect x="140" y="63" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="13" filter="url(#rough2)"/>
  <text x="153" y="81" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="184" y="81" font-size="10.5" fill="#888" filter="url(#rough2)">（原地一步不走，已在 k = 1）</text>

  <text x="452" y="81" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">C(1,0) = 1</text>

  <rect x="30" y="112" width="86" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="73" y="132" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">② x=1, y=1</text>

  <rect x="140" y="115" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="13" filter="url(#rough2)"/>
  <text x="153" y="133" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1</text>
  <path d="M 168 128 L 182 128" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="175" y="119" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">U</text>
  <rect x="186" y="115" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="13" filter="url(#rough2)"/>
  <text x="199" y="133" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">2</text>
  <path d="M 214 128 L 228 128" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="221" y="119" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">D</text>
  <rect x="232" y="115" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="13" filter="url(#rough2)"/>
  <text x="245" y="133" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="272" y="133" font-size="10.5" fill="#888" filter="url(#rough2)">（D 放空档 1）</text>

  <rect x="410" y="118" width="86" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="453" y="145" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">C(2,1) = 2</text>
  <text x="453" y="164" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">（方案 ② ③</text>
  <text x="453" y="178" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">合并计数）</text>

  <rect x="30" y="164" width="86" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="73" y="184" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">③ x=1, y=1</text>

  <rect x="140" y="167" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="13" filter="url(#rough2)"/>
  <text x="153" y="185" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1</text>
  <path d="M 168 180 L 182 180" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="175" y="171" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">D</text>
  <rect x="186" y="167" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="13" filter="url(#rough2)"/>
  <text x="199" y="185" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">0</text>
  <path d="M 214 180 L 228 180" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="221" y="171" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">U</text>
  <rect x="232" y="167" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="13" filter="url(#rough2)"/>
  <text x="245" y="185" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="272" y="185" font-size="10.5" fill="#888" filter="url(#rough2)">（D 放空档 0）</text>

  <rect x="30" y="224" width="86" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="73" y="244" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">④ x=2, y=3</text>

  <rect x="130" y="227" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="13" filter="url(#rough2)"/>
  <text x="143" y="245" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1</text>
  <path d="M 158 240 L 172 240" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="165" y="231" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">D</text>
  <rect x="176" y="227" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="13" filter="url(#rough2)"/>
  <text x="189" y="245" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">0</text>
  <path d="M 204 240 L 218 240" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="211" y="231" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">U</text>
  <rect x="222" y="227" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="13" filter="url(#rough2)"/>
  <text x="235" y="245" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1</text>
  <path d="M 250 240 L 264 240" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="257" y="231" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">D</text>
  <rect x="268" y="227" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="13" filter="url(#rough2)"/>
  <text x="281" y="245" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">0</text>
  <path d="M 296 240 L 310 240" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="303" y="231" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">U</text>
  <rect x="314" y="227" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="13" filter="url(#rough2)"/>
  <text x="327" y="245" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">2</text>
  <path d="M 342 240 L 356 240" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="349" y="231" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">D</text>
  <rect x="360" y="227" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="13" filter="url(#rough2)"/>
  <text x="373" y="245" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="392" y="245" font-size="10.5" fill="#888" filter="url(#rough2)">（3 个空档全放 D）</text>

  <text x="452" y="245" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">C(3,3) = 1</text>

  <rect x="30" y="268" width="460" height="30" fill="#f7f7f7" stroke="#aaa" stroke-width="1.2" stroke-dasharray="3 2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="288" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">x = 3 时 y = 2³ − 1 = 7 &gt; 空档数 x+1 = 4；x 更大时 y 更大 ⇒ 后续全为 0，枚举终止</text>

  <rect x="30" y="312" width="460" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="336" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">k = 1：ans = 1 + 2 + 1 = 4 ✓（与示例 2 一致）</text>
  <text x="260" y="360" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">顺带验证 k = 0：x=0 时 C(1,1)=1，x=1 时 C(2,2)=1 ⇒ ans = 2 ✓</text>

  <text x="260" y="404" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">同一个 (x, y) 的多条方案，区别只在「向下插在哪个空档」——这正是 C(x+1, y) 数的东西</text>
</svg>
