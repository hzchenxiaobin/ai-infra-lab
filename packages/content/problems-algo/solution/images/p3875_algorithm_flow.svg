<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：两条支路殊途同归 —— 恒返回 true</text>

  <!-- 开始 -->
  <rect x="185" y="32" width="150" height="26" rx="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="49" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">开始：读入 nums1</text>

  <path d="M 260 58 L 260 70" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="260,74 350,110 260,146 170,110" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="114" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">nums1 中有奇数吗？</text>
  <text x="205" y="100" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">无</text>
  <text x="312" y="100" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">有</text>

  <!-- 左支：无奇数 -->
  <path d="M 170 110 L 130 110 L 130 160" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="34" y="162" width="192" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="130" y="180" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">每个 i 都选操作一</text>
  <text x="130" y="198" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">nums2[i] = nums1[i]</text>

  <path d="M 130 208 L 130 222" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="34" y="224" width="192" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="130" y="243" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">nums2 = nums1 → 全偶 ✓</text>

  <!-- 右支：有奇数 -->
  <path d="M 350 110 L 392 110 L 392 154" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="296" y="156" width="192" height="62" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="392" y="174" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">目标定为全奇</text>
  <text x="392" y="192" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">奇位 i：操作一取原值（仍奇）</text>
  <text x="392" y="208" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">偶位 i：减去任一奇数（变奇）</text>

  <path d="M 392 218 L 392 226" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="296" y="228" width="192" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="392" y="247" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">nums2 全为奇数 ✓</text>

  <!-- 汇合 -->
  <path d="M 130 254 L 130 274 L 224 292" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 392 258 L 392 274 L 296 292" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 返回 -->
  <rect x="168" y="290" width="184" height="38" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="260" y="308" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">return true</text>
  <text x="260" y="322" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">（恒真，与输入无关）</text>

  <!-- 底部吐槽 -->
  <rect x="30" y="336" width="460" height="20" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="260" y="350" text-anchor="middle" font-size="10" fill="#a0433f" filter="url(#rough2)">💡 分支判定纯属“仪式感”——两条路都到终点，实战一行 return true 收工</text>
</svg>
