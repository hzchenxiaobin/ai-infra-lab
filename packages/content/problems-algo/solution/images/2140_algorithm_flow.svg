<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="10" markerHeight="10" refX="5" refY="9" orient="auto">
      <path d="M0,0 L5,9 L10,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：反向递推填 dp 数组</text>

  <!-- ===== Step 1 ===== -->
  <rect x="70" y="44" width="420" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">Step 1：初始化 dp 数组</text>
  <text x="86" y="86" font-size="11.5" fill="#555" font-family="'Comic Sans MS', monospace">dp = [0] * (n + 1)   // dp[n] = 0 哨兵</text>
  <text x="86" y="102" font-size="11" fill="#888">长度 n+1，越界自动取 0</text>

  <!-- Arrow down -->
  <path d="M 280 110 L 280 134" stroke="#888" stroke-width="2.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- ===== Step 2: reverse loop ===== -->
  <rect x="100" y="140" width="360" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="162" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">Step 2：反向遍历 i = n-1 downto 0</text>
  <text x="280" y="180" text-anchor="middle" font-size="10.5" fill="#888">从后往前，保证依赖项已就绪</text>

  <!-- Arrow down -->
  <path d="M 280 192 L 280 216" stroke="#888" stroke-width="2.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- ===== Step 3: compute j and dp[i] ===== -->
  <rect x="70" y="222" width="420" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="244" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">Step 3：计算跳跃目标与转移</text>
  <text x="96" y="266" font-size="11.5" fill="#4a7a3a" font-family="'Comic Sans MS', monospace">j = min(i + brainpower[i] + 1, n)</text>
  <text x="96" y="288" font-size="11.5" fill="#555" font-family="'Comic Sans MS', monospace">solve = points[i] + dp[j]</text>
  <text x="96" y="310" font-size="11.5" fill="#b85450" font-family="'Comic Sans MS', monospace" font-weight="bold">dp[i] = max(dp[i+1], solve)</text>
  <text x="96" y="330" font-size="10.5" fill="#888">min(j,n) 利用 dp[n]=0 处理越界</text>

  <!-- Arrow down -->
  <path d="M 280 344 L 280 368" stroke="#888" stroke-width="2.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- ===== Answer ===== -->
  <rect x="120" y="372" width="320" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="392" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">Step 4：返回 dp[0]</text>
  <text x="280" y="410" text-anchor="middle" font-size="10.5" fill="#888">从第 0 题到最后一题的最大分数</text>
</svg>
