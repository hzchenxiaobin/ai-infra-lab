<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：5 笔销售 → 3 位用户 → 按消费额降序输出（并列 75 按 user_id 升序）</text>

  <!-- ===== Left: per-sale amount table ===== -->
  <text x="150" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">JOIN 后逐笔金额（qty × price）</text>
  <rect x="20" y="60" width="260" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="44" y="74" text-anchor="middle" font-size="9" fill="#446688">sale</text>
  <text x="92" y="74" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">user_id</text>
  <text x="146" y="74" text-anchor="middle" font-size="9" fill="#446688">qty</text>
  <text x="194" y="74" text-anchor="middle" font-size="9" fill="#4a7a3a">price</text>
  <text x="248" y="74" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">amount</text>
  <rect x="220" y="82" width="60" height="90" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="44" y="98" text-anchor="middle" font-size="9" fill="#333">1</text><text x="92" y="98" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">101</text><text x="146" y="98" text-anchor="middle" font-size="9" fill="#333">10</text><text x="194" y="98" text-anchor="middle" font-size="9" fill="#4a7a3a">10</text><text x="248" y="98" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">100</text>
  <text x="44" y="116" text-anchor="middle" font-size="9" fill="#333">2</text><text x="92" y="116" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">101</text><text x="146" y="116" text-anchor="middle" font-size="9" fill="#333">1</text><text x="194" y="116" text-anchor="middle" font-size="9" fill="#4a7a3a">25</text><text x="248" y="116" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">25</text>
  <text x="44" y="134" text-anchor="middle" font-size="9" fill="#333">3</text><text x="92" y="134" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">102</text><text x="146" y="134" text-anchor="middle" font-size="9" fill="#333">3</text><text x="194" y="134" text-anchor="middle" font-size="9" fill="#4a7a3a">15</text><text x="248" y="134" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">45</text>
  <text x="44" y="152" text-anchor="middle" font-size="9" fill="#333">4</text><text x="92" y="152" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">102</text><text x="146" y="152" text-anchor="middle" font-size="9" fill="#333">2</text><text x="194" y="152" text-anchor="middle" font-size="9" fill="#4a7a3a">15</text><text x="248" y="152" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">30</text>
  <text x="44" y="170" text-anchor="middle" font-size="9" fill="#333">5</text><text x="92" y="170" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">103</text><text x="146" y="170" text-anchor="middle" font-size="9" fill="#333">3</text><text x="194" y="170" text-anchor="middle" font-size="9" fill="#4a7a3a">25</text><text x="248" y="170" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">75</text>
  <line x1="68" y1="60" x2="68" y2="172" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="116" y1="60" x2="116" y2="172" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="170" y1="60" x2="170" y2="172" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="218" y1="60" x2="218" y2="172" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="20" y1="82" x2="280" y2="82" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <rect x="20" y="60" width="260" height="112" fill="none" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>

  <!-- bridge: GROUP BY + SUM -->
  <path d="M286 116 L322 116" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="304" y="108" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">GROUP BY</text>
  <text x="304" y="130" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">+SUM</text>

  <!-- ===== Middle: grouped per user ===== -->
  <text x="420" y="52" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">每用户总消费 spending</text>
  <rect x="330" y="60" width="180" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="74" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">user_id</text>
  <text x="470" y="74" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">spending</text>
  <text x="370" y="98" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">101</text><text x="470" y="98" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">125</text>
  <text x="370" y="116" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">102</text><text x="470" y="116" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">75</text>
  <text x="370" y="134" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">103</text><text x="470" y="134" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">75</text>
  <line x1="330" y1="60" x2="330" y2="140" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="410" y1="60" x2="410" y2="140" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="330" y1="82" x2="510" y2="82" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>
  <rect x="330" y="60" width="180" height="80" fill="none" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>

  <!-- tie highlight box around 102 & 103 spending=75 -->
  <rect x="335" y="104" width="170" height="34" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 3" rx="6" filter="url(#rough2)"/>
  <text x="420" y="158" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">↑ 并列 75（需 tie-break）</text>

  <!-- bridge: ORDER BY -->
  <path d="M516 116 L552 116" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="534" y="108" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">ORDER</text>
  <text x="534" y="130" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">BY</text>

  <!-- ===== Right: final output ===== -->
  <text x="150" y="200" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">最终输出（spending DESC, user_id ASC）</text>
  <rect x="60" y="208" width="240" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="222" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">user_id</text>
  <text x="240" y="222" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">spending</text>
  <text x="120" y="246" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">101</text><text x="240" y="246" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">125</text>
  <text x="120" y="266" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">102</text><text x="240" y="266" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">75</text>
  <text x="120" y="286" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">103</text><text x="240" y="286" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">75</text>
  <line x1="60" y1="208" x2="60" y2="292" stroke="#b85450" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="180" y1="208" x2="180" y2="292" stroke="#b85450" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="60" y1="230" x2="300" y2="230" stroke="#b85450" stroke-width="0.6" filter="url(#rough2)"/>
  <rect x="60" y="208" width="240" height="84" fill="none" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>

  <!-- tie-break explanation on the right of output -->
  <rect x="330" y="210" width="270" height="80" fill="none" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="5 3" rx="6" filter="url(#rough2)"/>
  <text x="465" y="228" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">并列 tie-break 规则</text>
  <text x="350" y="246" text-anchor="start" font-size="9" fill="#666">• 102 与 103 都 = 75 → spending 相等</text>
  <text x="350" y="262" text-anchor="start" font-size="9" fill="#666">• 次级键 user_id 升序：102 &lt; 103</text>
  <text x="350" y="278" text-anchor="start" font-size="9" fill="#666">• 故 102 排在 103 前（不丢并列，仅定序）</text>

  <!-- summary line -->
  <rect x="40" y="310" width="540" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="310" y="328" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">用户 101：10×10 + 1×25 = 125 ；用户 102：3×15 + 2×15 = 75 ；用户 103：3×25 = 75</text>
  <text x="310" y="344" text-anchor="middle" font-size="9" fill="#666">输出顺序：125（101）→ 75（102）→ 75（103）　并列 75 时按 user_id 升序确定 102 先于 103</text>
</svg>
