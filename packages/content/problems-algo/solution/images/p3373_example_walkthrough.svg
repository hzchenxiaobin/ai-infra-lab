<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算（示例 1）：两趟染色，一次拼装</text>
  <text x="260" y="40" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">蓝 = 深度偶，橙 = 深度奇；同色两点距离必为偶数</text>

  <!-- ===== 树 1 ===== -->
  <rect x="25" y="70" width="225" height="266" fill="none" stroke="#446688" stroke-width="1.2"
        stroke-dasharray="5,4" opacity="0.55" rx="10" filter="url(#rough2)"/>
  <text x="137" y="90" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">树 1（n = 5）</text>

  <line x1="130" y1="120" x2="70" y2="192" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="130" y1="120" x2="190" y2="184" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="190" y1="184" x2="148" y2="262" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="190" y1="184" x2="230" y2="256" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>

  <circle cx="130" cy="120" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="130" y="125" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">0</text>
  <circle cx="70" cy="192" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="70" y="197" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="190" cy="184" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="190" y="189" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="148" cy="262" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="148" y="267" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">3</text>
  <circle cx="230" cy="256" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="261" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">4</text>

  <text x="137" y="300" text-anchor="middle" font-size="9" fill="#33506b" font-weight="bold" filter="url(#rough2)">蓝 = {0,3,4}（3 个）　橙 = {1,2}（2 个）</text>
  <text x="137" y="318" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">even = [3, 2, 2, 3, 3]</text>

  <!-- ===== 树 2 ===== -->
  <rect x="272" y="70" width="225" height="266" fill="none" stroke="#4a7a3a" stroke-width="1.2"
        stroke-dasharray="5,4" opacity="0.55" rx="10" filter="url(#rough2)"/>
  <text x="384" y="90" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">树 2（m = 8）</text>

  <line x1="385" y1="112" x2="322" y2="160" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="385" y1="112" x2="392" y2="170" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="385" y1="112" x2="450" y2="158" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="392" y1="170" x2="402" y2="234" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="322" y1="160" x2="300" y2="228" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="300" y1="228" x2="278" y2="290" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="300" y1="228" x2="336" y2="290" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>

  <circle cx="385" cy="112" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="385" y="117" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">0</text>
  <circle cx="322" cy="160" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="322" y="165" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="392" cy="170" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="392" y="175" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="450" cy="158" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="450" y="163" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">3</text>
  <circle cx="402" cy="234" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="402" y="239" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">7</text>
  <circle cx="300" cy="228" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="233" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">4</text>
  <circle cx="278" cy="290" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="278" y="295" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">5</text>
  <circle cx="336" cy="290" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="336" y="295" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">6</text>

  <text x="384" y="300" text-anchor="middle" font-size="9" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">蓝 = {0,4,7}（3 个）　橙 = {1,2,3,5,6}（5 个）</text>
  <text x="384" y="318" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">best2 = max(3, 5) = 5</text>

  <!-- ===== 拼装 ===== -->
  <path d="M 137 336 L 137 348" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 384 336 L 384 348" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <text x="260" y="362" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">拼装：answer[i] = even[i] + 5　（蓝 3+5=8，橙 2+5=7）</text>

  <rect x="150" y="372" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="172" y="394" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="196" y="372" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="218" y="394" text-anchor="middle" font-size="13" fill="#a07830" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="242" y="372" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="264" y="394" text-anchor="middle" font-size="13" fill="#a07830" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="288" y="372" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="310" y="394" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="334" y="372" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="356" y="394" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">8</text>

  <text x="172" y="422" text-anchor="middle" font-size="8" fill="#666" filter="url(#rough2)">i=0</text>
  <text x="218" y="422" text-anchor="middle" font-size="8" fill="#666" filter="url(#rough2)">i=1</text>
  <text x="264" y="422" text-anchor="middle" font-size="8" fill="#666" filter="url(#rough2)">i=2</text>
  <text x="310" y="422" text-anchor="middle" font-size="8" fill="#666" filter="url(#rough2)">i=3</text>
  <text x="356" y="422" text-anchor="middle" font-size="8" fill="#666" filter="url(#rough2)">i=4</text>

  <text x="445" y="394" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 与官方</text>
  <text x="445" y="408" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">输出一致</text>
</svg>
