<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n=8 命中 x=6；n=4 不命中返回 −1</text>

  <!-- ===== Row 1: n=8 (hit) ===== -->
  <text x="30" y="56" font-size="13" fill="#4a7a3a" font-weight="bold">n = 8</text>
  <text x="80" y="56" font-size="11" fill="#888">t = 8·9/2 = 36，√36 = 6，6·6 = 36 ✓</text>

  <rect x="30" y="66" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="45" y="84" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="64" y="66" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="79" y="84" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="98" y="66" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="113" y="84" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="132" y="66" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="147" y="84" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="166" y="66" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="181" y="84" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="200" y="66" width="30" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="215" y="84" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">6</text>
  <rect x="234" y="66" width="30" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="249" y="84" text-anchor="middle" font-size="12" fill="#333">7</text>
  <rect x="268" y="66" width="30" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="283" y="84" text-anchor="middle" font-size="12" fill="#333">8</text>

  <path d="M 30 96 L 30 106 L 230 106 L 230 96" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 130 106 L 130 114" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 200 96 L 200 106 L 298 106 L 298 96" stroke="#d6a040" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 249 106 L 249 114" stroke="#d6a040" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <text x="130" y="126" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1..6 = 21</text>
  <text x="249" y="126" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">6..8 = 21</text>

  <rect x="330" y="74" width="180" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="420" y="96" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">命中 → return 6</text>

  <path d="M 30 142 L 510 142" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>

  <!-- ===== Row 2: n=4 (miss) ===== -->
  <text x="30" y="166" font-size="13" fill="#b85450" font-weight="bold">n = 4</text>
  <text x="80" y="166" font-size="11" fill="#888">t = 4·5/2 = 10，3²=9≠10，4²=16≠10 → 非完全平方</text>

  <rect x="30" y="178" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="45" y="196" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="64" y="178" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="79" y="196" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="98" y="178" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="113" y="196" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="132" y="178" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="147" y="196" text-anchor="middle" font-size="12" fill="#333">4</text>

  <rect x="200" y="182" width="310" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="355" y="204" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">无整数 x 使两段和相等 → return −1</text>

  <!-- ===== bottom summary ===== -->
  <rect x="40" y="232" width="460" height="112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="254" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">规律：中枢整数存在 ⇔ n(n+1)/2 是完全平方数</text>
  <text x="270" y="276" text-anchor="middle" font-size="10.5" fill="#555">命中：n=8 → 36=6²，n=1 → 1=1²，n=49 → 1225=35² …</text>
  <text x="270" y="296" text-anchor="middle" font-size="10.5" fill="#555">不命中：n=4 → 10 非平方，n=2 → 3 非平方 …</text>
  <text x="270" y="320" text-anchor="middle" font-size="10" fill="#888">枚举验证 O(n) → 公式 O(1)：把「逐个试 x」压成「开一次平方」</text>
</svg>
