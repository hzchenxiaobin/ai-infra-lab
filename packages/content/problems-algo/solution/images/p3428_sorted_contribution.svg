<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：排序 + 贡献法 —— 每个子序列的最值有唯一「代言人」</text>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">最大值并列归「最右」、最小值并列归「最左」⇒ 计数不重不漏</text>

  <text x="80" y="58" font-size="10.5" fill="#666" filter="url(#rough2)">示例：排序后 [1,2,2,4,5]，k=3，看 i=3 的 4 当最大值 →</text>

  <g filter="url(#rough2)">
    <rect x="80" y="66" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="136" y="66" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="192" y="66" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="248" y="66" width="46" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <rect x="304" y="66" width="46" height="36" fill="#fafafa" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 3" rx="4"/>
    <text x="103" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#33506b">1</text>
    <text x="159" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#33506b">2</text>
    <text x="215" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#33506b">2</text>
    <text x="271" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a6d1f">4</text>
    <text x="327" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450">5</text>
    <text x="103" y="116" text-anchor="middle" font-size="9.5" fill="#888">i=0</text>
    <text x="159" y="116" text-anchor="middle" font-size="9.5" fill="#888">i=1</text>
    <text x="215" y="116" text-anchor="middle" font-size="9.5" fill="#888">i=2</text>
    <text x="271" y="116" text-anchor="middle" font-size="9.5" fill="#8a6d1f" font-weight="bold">i=3</text>
    <text x="327" y="116" text-anchor="middle" font-size="9.5" fill="#b85450">i=4</text>
    <path d="M 80 122 q 0 8 7 8 h 144 q 7 0 7 -8" fill="none" stroke="#4a7a3a" stroke-width="2"/>
    <path d="M 332 60 l 5 8 M 337 60 l -5 8" stroke="#b85450" stroke-width="1.6" fill="none"/>
  </g>
  <text x="340" y="64" font-size="10" fill="#b85450" filter="url(#rough2)">✗</text>

  <text x="159" y="146" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">左侧池 i=3 个（相等的 2,2 也能进）</text>
  <text x="159" y="161" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">任选至多 k−1=2 个：C(3,0)+C(3,1)+C(3,2)</text>
  <text x="327" y="140" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">右侧元素 ≥ 4</text>
  <text x="327" y="155" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">一入选就顶替 / 抢走代言</text>

  <g filter="url(#rough2)">
    <rect x="18" y="172" width="236" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="136" y="192" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33506b">① nums[i] 当最大值（并列归最右）</text>
    <text x="136" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">贡献 = nums[i] × T(i)</text>
    <text x="136" y="230" text-anchor="middle" font-size="9.5" fill="#55677d">T(i)=C(i,0)+C(i,1)+⋯+C(i,k−1)</text>

    <rect x="266" y="172" width="236" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="384" y="192" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f5d24">② nums[i] 当最小值（并列归最左）</text>
    <text x="384" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">贡献 = nums[i] × T(n−1−i)</text>
    <text x="384" y="230" text-anchor="middle" font-size="9.5" fill="#4a6a3f">右侧 n−1−i 个选至多 k−1 个（镜像）</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="50" y="250" width="420" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.5" stroke-dasharray="6 4" rx="10"/>
    <text x="260" y="271" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450">ans = Σᵢ nums[i] · ( T(i) + T(n−1−i) )  mod (10⁹+7)</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="292" width="460" height="58" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="10"/>
    <text x="260" y="312" text-anchor="middle" font-size="10" fill="#33506b">· 每个子序列恰有一个最大代言人 + 一个最小代言人，两份贡献独立相加</text>
    <text x="260" y="328" text-anchor="middle" font-size="10" fill="#33506b">· 排序只是下标置换，max/min 只看所选值的多重集 → 计数一一对应</text>
    <text x="260" y="344" text-anchor="middle" font-size="10" fill="#8a6d1f">· T(i) 只依赖 (i, k)，与数值无关 → 一张 O(n) 递推表搞定（见下图）</text>
  </g>
</svg>
