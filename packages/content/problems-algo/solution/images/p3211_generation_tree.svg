<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">增量构造：合法前缀只会长出合法后缀（n = 3）</text>

  <!-- 层标签 -->
  <text x="32" y="66" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">长0</text>
  <text x="32" y="132" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">长1</text>
  <text x="32" y="200" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">长2</text>
  <text x="32" y="270" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">长3</text>

  <!-- 边 -->
  <line x1="216" y1="74" x2="128" y2="115" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="228" y1="74" x2="316" y2="115" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="122" y1="141" x2="122" y2="183" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="314" y1="141" x2="262" y2="183" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="330" y1="141" x2="384" y2="183" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="110" y1="209" x2="86" y2="253" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="134" y1="209" x2="152" y2="253" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="255" y1="209" x2="253" y2="253" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="378" y1="209" x2="348" y2="253" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="402" y1="209" x2="426" y2="253" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- 被剪的边（红虚线） -->
  <line x1="135" y1="136" x2="180" y2="184" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <line x1="243" y1="209" x2="216" y2="254" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <!-- 内部节点 -->
  <rect x="209" y="50" width="26" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="222" y="66" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ε</text>

  <rect x="109" y="115" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="122" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>

  <rect x="309" y="115" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="322" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <rect x="105" y="183" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="122" y="200" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">01</text>

  <rect x="238" y="183" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="255" y="200" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10</text>

  <rect x="373" y="183" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="390" y="200" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">11</text>

  <!-- 被剪掉的节点 -->
  <rect x="178" y="185" width="44" height="22" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="200" y="200" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">00 ✗</text>

  <rect x="184" y="256" width="44" height="22" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="206" y="271" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">100 ✗</text>

  <!-- 叶子（答案） -->
  <rect x="53" y="253" width="44" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="75" y="270" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">010</text>

  <rect x="136" y="253" width="44" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="158" y="270" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">011</text>

  <rect x="230" y="253" width="44" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="252" y="270" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">101</text>

  <rect x="318" y="253" width="44" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="340" y="270" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">110</text>

  <rect x="410" y="253" width="44" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="432" y="270" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">111</text>

  <!-- 规则框 -->
  <rect x="55" y="300" width="410" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="320" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">末位是 0 → 只能接 1；末位是 1（或空串）→ 接 0 接 1 都行</text>
  <text x="260" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a10" filter="url(#rough2)">搜索树 = 答案 + 答案的前缀，一个废节点都没有</text>
</svg>
