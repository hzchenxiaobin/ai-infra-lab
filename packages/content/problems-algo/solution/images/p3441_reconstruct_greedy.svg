<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="18" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：倒序 DP 估价，正序逐字符贪心重建</text>
  <text x="260" y="34" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">可行性判据：已花代价 + |s[i]−x| + 新状态的后缀最小代价 == F[0]（全局最小代价）</text>

  <!-- 左列：主流程 -->
  <polygon points="48,80 145,52 242,80 145,108" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="145" y="78" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">n ＜ 3 ?</text>
  <text x="145" y="93" text-anchor="middle" font-size="7.5" fill="#2f5d24" filter="url(#rough2)">（无法凑出一段）</text>

  <path d="M 242 80 L 284 80" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="262" y="72" text-anchor="middle" font-size="8.5" fill="#99443f" filter="url(#rough2)">是</text>
  <rect x="286" y="66" width="104" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="338" y="84" text-anchor="middle" font-size="10" fill="#99443f" font-weight="bold" filter="url(#rough2)">返回空串 ""</text>

  <path d="M 145 108 L 145 116" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="153" y="116" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">否</text>

  <rect x="48" y="118" width="194" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="145" y="134" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">① 倒序 i = n−1 → 0，填 F / G1 / H 表</text>
  <path d="M 145 142 L 145 148" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="48" y="150" width="194" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="145" y="166" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">② B ← F[0]；i ← 0；状态 ← 待新起组</text>
  <path d="M 145 174 L 145 180" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="48" y="182" width="194" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="145" y="198" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">③ 逐位置 i 决定一个字符</text>
  <path d="M 145 206 L 145 212" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="48" y="214" width="194" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="145" y="230" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">④ i 走到 n：输出答案串（代价 = F[0]）</text>

  <!-- 每个位置的决策 -->
  <path d="M 242 194 C 268 194, 272 156, 294 152" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="300,152 392,116 484,152 392,188" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="392" y="148" text-anchor="middle" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">当前组未满 3 个？</text>
  <text x="392" y="163" text-anchor="middle" font-size="7.5" fill="#a07830" filter="url(#rough2)">（组字符 c，已填 1~2 个）</text>

  <path d="M 385 190 L 315 206" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="348" y="194" text-anchor="middle" font-size="8.5" fill="#99443f" filter="url(#rough2)">是</text>

  <rect x="250" y="210" width="120" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="228" text-anchor="middle" font-size="10" fill="#99443f" font-weight="bold" filter="url(#rough2)">被迫填 c</text>
  <text x="310" y="243" text-anchor="middle" font-size="8.5" fill="#99443f" filter="url(#rough2)">res += c</text>
  <text x="310" y="257" text-anchor="middle" font-size="8.5" fill="#99443f" filter="url(#rough2)">B −= |s[i]−c|</text>

  <path d="M 478 158 C 496 178, 466 198, 448 206" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="487" y="186" text-anchor="middle" font-size="8.5" fill="#a07830" filter="url(#rough2)">否</text>

  <rect x="380" y="210" width="124" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="442" y="226" text-anchor="middle" font-size="9" fill="#a07830" font-weight="bold" filter="url(#rough2)">x 从 'a' 到 'z' 试：</text>
  <text x="442" y="240" text-anchor="middle" font-size="8" fill="#a07830" filter="url(#rough2)">|s[i]−x| + 后缀DP[x] == B ?</text>
  <text x="442" y="254" text-anchor="middle" font-size="8" fill="#a07830" filter="url(#rough2)">取最先满足的 x，B ← 新后缀值</text>

  <!-- 示例演算 -->
  <rect x="16" y="280" width="488" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="296" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">示例演算：cdcd → cccc（最小代价 2）</text>
  <text x="260" y="312" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">i=0 待新起组：'a' 2+8=10≠2 ✗　'b' 1+5=6≠2 ✗　'c' 0+2=2 ✓ → 填 c，B=2</text>
  <text x="260" y="326" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">i=1、i=2 组未满 → 被迫填 c（B=1）；i=3 组已满 → 延长 c：1+0=1=B ✓ → 填 c</text>
  <text x="260" y="340" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">输出 "cccc"——与 "dddd" 同为代价 2，但字典序更小</text>

  <text x="260" y="357" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">每一步取「最小可行字符」⇒ 整串字典序最小；未满 3 时无选择，只能填 c</text>
</svg>
