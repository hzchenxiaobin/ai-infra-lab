<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一遍累加 score，一遍查找 score == n−1</text>

  <!-- Step 1: start -->
  <rect x="200" y="44" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="14" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始</text>
  <line x1="260" y1="74" x2="260" y2="86" stroke="#888" stroke-width="1.6" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: init score -->
  <rect x="170" y="88" width="180" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="110" text-anchor="middle" font-size="11.5" fill="#333">score[1..n] = 0</text>
  <line x1="260" y1="122" x2="260" y2="134" stroke="#888" stroke-width="1.6" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 3: loop trust -->
  <rect x="150" y="136" width="220" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="158" text-anchor="middle" font-size="11" fill="#333">遍历 trust 每条 [a, b]</text>
  <line x1="260" y1="170" x2="260" y2="182" stroke="#888" stroke-width="1.6" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 4: update score -->
  <rect x="130" y="184" width="260" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="200" text-anchor="middle" font-size="11.5" fill="#333">score[a] −−   （a 信任别人）</text>
  <text x="260" y="216" text-anchor="middle" font-size="11.5" fill="#333">score[b] ++   （b 被信任）</text>
  <line x1="260" y1="224" x2="260" y2="238" stroke="#888" stroke-width="1.6" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 5: diamond decision -->
  <polygon points="260,240 360,272 260,304 160,272" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="268" text-anchor="middle" font-size="10.5" fill="#333">遍历 i=1..n</text>
  <text x="260" y="282" text-anchor="middle" font-size="10.5" fill="#333">score[i]==n−1?</text>

  <!-- Yes branch: right -->
  <line x1="360" y1="272" x2="392" y2="272" stroke="#888" stroke-width="1.6" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="376" y="266" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="394" y="256" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="444" y="278" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 i</text>

  <!-- No branch: down -->
  <line x1="260" y1="304" x2="260" y2="318" stroke="#888" stroke-width="1.6" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="276" y="314" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- Step 6: return -1 -->
  <rect x="200" y="320" width="120" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="342" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 −1</text>

  <!-- left annotation -->
  <rect x="20" y="184" width="96" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="68" y="200" text-anchor="middle" font-size="10" fill="#446688">一遍遍历</text>
  <text x="68" y="214" text-anchor="middle" font-size="10" fill="#446688">O(m)</text>
  <line x1="116" y1="204" x2="128" y2="204" stroke="#446688" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="20" y="256" width="96" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="68" y="272" text-anchor="middle" font-size="10" fill="#446688">一遍扫描</text>
  <text x="68" y="286" text-anchor="middle" font-size="10" fill="#446688">O(n)</text>
  <line x1="116" y1="276" x2="156" y2="272" stroke="#446688" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <text x="260" y="372" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">总复杂度 O(n + m)</text>
</svg>
