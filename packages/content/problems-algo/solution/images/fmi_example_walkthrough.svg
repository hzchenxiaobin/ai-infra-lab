<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：Customers = {1, 4, 5, 6, 8}</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">递归 CTE 生成 [1..8]，逐位判定是否在表中</text>

  <!-- Row label -->
  <text x="78" y="86" text-anchor="end" font-size="11" fill="#555" font-weight="bold">序列</text>

  <!-- 8 sequence cells (blue) -->
  <rect x="88" y="68" width="46" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="111" y="96" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">1</text>
  <rect x="134" y="68" width="46" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="157" y="96" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">2</text>
  <rect x="180" y="68" width="46" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="203" y="96" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">3</text>
  <rect x="226" y="68" width="46" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="249" y="96" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">4</text>
  <rect x="272" y="68" width="46" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="295" y="96" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">5</text>
  <rect x="318" y="68" width="46" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="341" y="96" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">6</text>
  <rect x="364" y="68" width="46" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="387" y="96" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">7</text>
  <rect x="410" y="68" width="46" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="433" y="96" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">8</text>

  <!-- Row label: in table? -->
  <text x="78" y="146" text-anchor="end" font-size="11" fill="#555" font-weight="bold">在表中?</text>

  <!-- status ticks: 1✓ 2✗ 3✗ 4✓ 5✓ 6✓ 7✗ 8✓ -->
  <text x="111" y="150" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="157" y="150" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">✗</text>
  <text x="203" y="150" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">✗</text>
  <text x="249" y="150" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="295" y="150" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="341" y="150" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="387" y="150" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">✗</text>
  <text x="433" y="150" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- arrow down to result -->
  <path d="M 280 168 L 280 196" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Result label -->
  <text x="280" y="216" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">反连接保留 ✗ → 遗失的 ids</text>

  <!-- Result cells: 2,3,7 aligned under their positions -->
  <rect x="134" y="232" width="46" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="157" y="258" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">2</text>
  <rect x="180" y="232" width="46" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="203" y="258" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">3</text>
  <rect x="364" y="232" width="46" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="387" y="258" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">7</text>

  <!-- Note -->
  <rect x="60" y="296" width="440" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="316" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">序列长度 = max − min + 1 = 8 − 1 + 1 = 8</text>
  <text x="280" y="332" text-anchor="middle" font-size="10" fill="#666">遗失数 = 序列长度 − 表中行数 = 8 − 5 = 3</text>
</svg>
