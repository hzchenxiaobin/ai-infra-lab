<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：f(x,y) = x+y, z = 5</text>
  <text x="280" y="40" text-anchor="middle" font-size="10.5" fill="#446688">双指针从 (1, 5) 出发，9 步找到全部 4 组解</text>

  <!-- Table header -->
  <rect x="50" y="52" width="460" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="75" y="70" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">步骤</text>
  <text x="140" y="70" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">(x, y)</text>
  <text x="210" y="70" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">f(x,y)</text>
  <text x="275" y="70" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">vs z=5</text>
  <text x="400" y="70" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">动作</text>

  <!-- Row 1 -->
  <rect x="50" y="78" width="460" height="24" fill="#fafafa" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="75" y="94" text-anchor="middle" font-size="10" fill="#555">1</text>
  <text x="140" y="94" text-anchor="middle" font-size="10" fill="#333">(1, 5)</text>
  <text x="210" y="94" text-anchor="middle" font-size="10" fill="#333">6</text>
  <text x="275" y="94" text-anchor="middle" font-size="10" fill="#d6a040">&gt; 5</text>
  <text x="400" y="94" text-anchor="middle" font-size="10" fill="#d6a040">y-- ↓</text>

  <!-- Row 2: SOLUTION -->
  <rect x="50" y="102" width="460" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="75" y="118" text-anchor="middle" font-size="10" fill="#555">2</text>
  <text x="140" y="118" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">(1, 4)</text>
  <text x="210" y="118" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">5</text>
  <text x="275" y="118" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">= 5 ✓</text>
  <text x="400" y="118" text-anchor="middle" font-size="10" fill="#4a7a3a">记录, x++ →</text>

  <!-- Row 3 -->
  <rect x="50" y="126" width="460" height="24" fill="#fafafa" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="75" y="142" text-anchor="middle" font-size="10" fill="#555">3</text>
  <text x="140" y="142" text-anchor="middle" font-size="10" fill="#333">(2, 4)</text>
  <text x="210" y="142" text-anchor="middle" font-size="10" fill="#333">6</text>
  <text x="275" y="142" text-anchor="middle" font-size="10" fill="#d6a040">&gt; 5</text>
  <text x="400" y="142" text-anchor="middle" font-size="10" fill="#d6a040">y-- ↓</text>

  <!-- Row 4: SOLUTION -->
  <rect x="50" y="150" width="460" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="75" y="166" text-anchor="middle" font-size="10" fill="#555">4</text>
  <text x="140" y="166" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">(2, 3)</text>
  <text x="210" y="166" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">5</text>
  <text x="275" y="166" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">= 5 ✓</text>
  <text x="400" y="166" text-anchor="middle" font-size="10" fill="#4a7a3a">记录, x++ →</text>

  <!-- Row 5 -->
  <rect x="50" y="174" width="460" height="24" fill="#fafafa" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="75" y="190" text-anchor="middle" font-size="10" fill="#555">5</text>
  <text x="140" y="190" text-anchor="middle" font-size="10" fill="#333">(3, 3)</text>
  <text x="210" y="190" text-anchor="middle" font-size="10" fill="#333">6</text>
  <text x="275" y="190" text-anchor="middle" font-size="10" fill="#d6a040">&gt; 5</text>
  <text x="400" y="190" text-anchor="middle" font-size="10" fill="#d6a040">y-- ↓</text>

  <!-- Row 6: SOLUTION -->
  <rect x="50" y="198" width="460" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="75" y="214" text-anchor="middle" font-size="10" fill="#555">6</text>
  <text x="140" y="214" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">(3, 2)</text>
  <text x="210" y="214" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">5</text>
  <text x="275" y="214" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">= 5 ✓</text>
  <text x="400" y="214" text-anchor="middle" font-size="10" fill="#4a7a3a">记录, x++ →</text>

  <!-- Row 7 -->
  <rect x="50" y="222" width="460" height="24" fill="#fafafa" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="75" y="238" text-anchor="middle" font-size="10" fill="#555">7</text>
  <text x="140" y="238" text-anchor="middle" font-size="10" fill="#333">(4, 2)</text>
  <text x="210" y="238" text-anchor="middle" font-size="10" fill="#333">6</text>
  <text x="275" y="238" text-anchor="middle" font-size="10" fill="#d6a040">&gt; 5</text>
  <text x="400" y="238" text-anchor="middle" font-size="10" fill="#d6a040">y-- ↓</text>

  <!-- Row 8: SOLUTION -->
  <rect x="50" y="246" width="460" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="75" y="262" text-anchor="middle" font-size="10" fill="#555">8</text>
  <text x="140" y="262" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">(4, 1)</text>
  <text x="210" y="262" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">5</text>
  <text x="275" y="262" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">= 5 ✓</text>
  <text x="400" y="262" text-anchor="middle" font-size="10" fill="#4a7a3a">记录, x++ →</text>

  <!-- Row 9: STOP -->
  <rect x="50" y="270" width="460" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="75" y="286" text-anchor="middle" font-size="10" fill="#555">9</text>
  <text x="140" y="286" text-anchor="middle" font-size="10" fill="#333">(5, 1)</text>
  <text x="210" y="286" text-anchor="middle" font-size="10" fill="#333">6</text>
  <text x="275" y="286" text-anchor="middle" font-size="10" fill="#b85450">&gt; 5</text>
  <text x="400" y="286" text-anchor="middle" font-size="10" fill="#b85450">y-- → y=0, 停止</text>

  <!-- Summary -->
  <rect x="50" y="306" width="460" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="10.5" fill="#333">💡 9 次函数调用 → 4 组解：<tspan fill="#4a7a3a" font-weight="bold">[(1,4), (2,3), (3,2), (4,1)]</tspan></text>
  <text x="280" y="338" text-anchor="middle" font-size="10" fill="#888">路径呈锯齿形：每找到一个解右移，值变大后下移回到 z，沿反对角线扫描</text>
</svg>
