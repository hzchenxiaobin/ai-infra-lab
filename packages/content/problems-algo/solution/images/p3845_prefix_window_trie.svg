<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：前缀异或化「两数异或」+ 滑窗定左端点 + 可撤销 01-Trie</text>

  <!-- ============ 左上：nums 与 pref ============ -->
  <text x="30" y="50" font-size="9.5" fill="#666" filter="url(#rough2)">nums</text>
  <rect x="74" y="50" width="150" height="42" rx="8" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="149" y="45" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">合法子数组：极差 ≤ k</text>

  <rect x="30" y="56" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="76" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="78" y="56" width="44" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="76" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="126" y="56" width="44" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="148" y="76" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="174" y="56" width="44" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="196" y="76" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>

  <text x="52" y="99" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="100" y="99" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="148" y="99" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="196" y="99" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">3</text>

  <text x="30" y="122" font-size="9.5" fill="#666" filter="url(#rough2)">pref</text>
  <rect x="12" y="128" width="36" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="30" y="145" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="58" y="128" width="36" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="76" y="145" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="106" y="128" width="36" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="124" y="145" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="154" y="128" width="36" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="172" y="145" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="200" y="128" width="36" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="218" y="145" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">2</text>

  <path d="M 76 158 Q 147 176 216 158" fill="none" stroke="#d6a040" stroke-width="1.8" marker-start="url(#arrO)" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="147" y="178" text-anchor="middle" font-size="9" fill="#8a6d1a" filter="url(#rough2)">配对异或</text>

  <text x="124" y="196" text-anchor="middle" font-size="10.5" fill="#8a6d1a" filter="url(#rough2)">XOR(nums[1..3]) = pref[1] ⊕ pref[4]</text>
  <text x="124" y="212" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">= 5 ⊕ 2 = 7</text>

  <!-- ============ 右上：01-Trie 贪心 ============ -->
  <text x="450" y="44" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">01-Trie：从高位到低位贪心（共 15 层）</text>

  <g filter="url(#rough2)">
    <path d="M 450 68 L 412 106" fill="none" stroke="#446688" stroke-width="1.5"/>
    <path d="M 450 68 L 488 106" fill="none" stroke="#446688" stroke-width="1.5"/>
    <path d="M 412 106 L 386 144" fill="none" stroke="#446688" stroke-width="1.5"/>
    <path d="M 412 106 L 438 144" fill="none" stroke="#446688" stroke-width="1.5"/>
    <path d="M 488 106 L 464 144" fill="none" stroke="#446688" stroke-width="1.5"/>
    <path d="M 488 106 L 516 144" fill="none" stroke="#446688" stroke-width="1.5"/>
  </g>

  <path d="M 450 68 L 488 106 L 516 144" fill="none" stroke="#b85450" stroke-width="2.4" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <text x="426" y="86" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">0</text>
  <text x="474" y="86" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="393" y="124" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">0</text>
  <text x="433" y="124" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">1</text>
  <text x="470" y="124" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">0</text>
  <text x="506" y="124" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="497" y="96" font-size="8" fill="#b85450" filter="url(#rough2)">x 该位=0 → 走 1</text>

  <ellipse cx="450" cy="68" rx="13" ry="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="450" y="72" text-anchor="middle" font-size="8.5" fill="#33506b" filter="url(#rough2)">root</text>

  <circle cx="412" cy="106" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="488" cy="106" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="386" cy="144" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="438" cy="144" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="464" cy="144" r="9" fill="#f0f0f0" stroke="#999" stroke-width="1.4" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <circle cx="516" cy="144" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <text x="461" y="164" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">同位边 ✗</text>
  <text x="517" y="164" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">反位边 ✓</text>

  <rect x="360" y="172" width="185" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="452" y="190" text-anchor="middle" font-size="9" fill="#8a6d1a" filter="url(#rough2)">① 查询：优先走与 x 相反的边</text>
  <text x="452" y="205" text-anchor="middle" font-size="9" fill="#8a6d1a" filter="url(#rough2)">② 插入：路径 cnt + 1</text>
  <text x="452" y="218" text-anchor="middle" font-size="9" fill="#8a6d1a" filter="url(#rough2)">③ 删除：路径 cnt − 1</text>

  <!-- ============ 中部：左端点活动范围 ============ -->
  <text x="275" y="234" text-anchor="middle" font-size="9.5" fill="#444" filter="url(#rough2)">固定 r：合法左端点是后缀 [L, r]，L 随 r 单调右移（双单调队列 O(1) 维护极差）</text>

  <rect x="60" y="240" width="140" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="254" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">l &lt; L：窗口外</text>
  <text x="130" y="266" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">pref[l] 已从 Trie 删除</text>

  <rect x="200" y="240" width="220" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="254" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">L ≤ l ≤ r：pref[l] 都在 Trie 中</text>
  <text x="310" y="266" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">查询 max pref[l] ⊕ pref[r+1]</text>

  <rect x="420" y="240" width="80" height="32" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="460" y="259" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">l &gt; r</text>

  <text x="200" y="286" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">L</text>
  <text x="420" y="286" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">r</text>
  <path d="M 210 282 L 262 282" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="268" y="286" font-size="8.5" fill="#b85450" filter="url(#rough2)">L 只右移</text>

  <!-- ============ 底部：三步流水线 ============ -->
  <rect x="25" y="302" width="165" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="107" y="322" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">① 前缀异或</text>
  <text x="107" y="340" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">子数组异或 → 两数异或</text>

  <path d="M 190 326 L 205 326" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="205" y="302" width="165" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="287" y="322" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">② 滑窗定左端点</text>
  <text x="287" y="340" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">合法 l = 后缀 [L, r]</text>

  <path d="M 370 326 L 385 326" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="385" y="302" width="165" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="467" y="322" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">③ 可撤销 01-Trie</text>
  <text x="467" y="340" text-anchor="middle" font-size="9" fill="#8a6d1a" filter="url(#rough2)">查询 / 删除均 O(15)</text>
</svg>
