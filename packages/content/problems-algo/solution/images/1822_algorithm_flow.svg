<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一次遍历，遇 0 即提前返回</text>

  <!-- N1: neg = 0 -->
  <rect x="110" y="40" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="170" y="60" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">neg = 0</text>
  <path d="M 170 70 L 170 86" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- N2: 取下一个 x -->
  <rect x="110" y="86" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="170" y="106" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">取下一个 x ∈ nums</text>
  <path d="M 170 116 L 170 132" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- N3: diamond x == 0 ?  center (170,147) -->
  <polygon points="170,132 222,147 170,162 118,147" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="151" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">x == 0 ?</text>
  <!-- N3 Yes -> right: 返回 0 -->
  <path d="M 222 147 L 330 147" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="142" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="330" y="132" width="110" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="385" y="152" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 0</text>
  <!-- N3 No -> down -->
  <path d="M 170 162 L 170 184" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="184" y="176" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- N4: diamond x < 0 ?  center (170,199) -->
  <polygon points="170,184 222,199 170,214 118,199" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="203" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">x &lt; 0 ?</text>
  <!-- N4 Yes -> right: neg += 1 -->
  <path d="M 222 199 L 330 199" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="194" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="330" y="184" width="110" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="385" y="204" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">neg += 1</text>
  <!-- neg++ box down then left to N4b right point (222,259) -->
  <path d="M 385 214 L 385 259 L 226 259" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- N4 No -> down to N4b -->
  <path d="M 170 214 L 170 244" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="184" y="232" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- N4b: diamond 还有下一个 x ?  center (170,259) -->
  <polygon points="170,244 226,259 170,274 114,259" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="263" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">还有下一个 x ?</text>
  <!-- N4b Yes -> loop back to N2: left to x=50, up to y=101, right to N2 left (110,101) -->
  <path d="M 114 259 L 50 259 L 50 101 L 106 101" stroke="#666" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="58" y="180" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">是：继续</text>
  <!-- N4b No -> down -->
  <path d="M 170 274 L 170 300" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="184" y="292" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- N5: 遍历结束 -->
  <rect x="110" y="300" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="170" y="320" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">遍历结束</text>
  <path d="M 170 330 L 170 346" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- N6: diamond neg 为奇 ?  center (170,361) -->
  <polygon points="170,346 228,361 170,376 112,361" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="365" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">neg 为奇 ?</text>
  <!-- N6 Yes -> right: 返回 -1 -->
  <path d="M 228 361 L 335 361" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="356" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="335" y="346" width="110" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="390" y="366" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 −1</text>
  <!-- N6 No -> down: 返回 +1 -->
  <path d="M 170 376 L 170 402" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="184" y="394" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="110" y="402" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="170" y="422" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 +1</text>

  <!-- Legend -->
  <path d="M 40 448 L 540 448" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="290" y="462" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">蓝=处理框  橙=判定  红=返回 0 / −1  绿=返回 +1  虚线=循环回边</text>
</svg>
