<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：points = [[0,0],[2,2],[3,10],[5,2],[7,0]]</text>

  <!-- ===== Left: graph visualization ===== -->
  <rect x="30" y="48" width="250" height="200" fill="#fff" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>

  <!-- grid lines (faint) -->
  <line x1="30" y1="88" x2="280" y2="88" stroke="#f0f0f0" stroke-width="0.5"/>
  <line x1="30" y1="128" x2="280" y2="128" stroke="#f0f0f0" stroke-width="0.5"/>
  <line x1="30" y1="168" x2="280" y2="168" stroke="#f0f0f0" stroke-width="0.5"/>
  <line x1="30" y1="208" x2="280" y2="208" stroke="#f0f0f0" stroke-width="0.5"/>
  <line x1="80" y1="48" x2="80" y2="248" stroke="#f0f0f0" stroke-width="0.5"/>
  <line x1="130" y1="48" x2="130" y2="248" stroke="#f0f0f0" stroke-width="0.5"/>
  <line x1="180" y1="48" x2="180" y2="248" stroke="#f0f0f0" stroke-width="0.5"/>
  <line x1="230" y1="48" x2="230" y2="248" stroke="#f0f0f0" stroke-width="0.5"/>

  <!-- MST edges (green, highlighted) -->
  <!-- 0→1: (40,240)→(96,204) dist=4 -->
  <line x1="40" y1="240" x2="96" y2="204" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <!-- 1→3: (96,204)→(180,204) dist=3 -->
  <line x1="96" y1="204" x2="180" y2="204" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <!-- 3→4: (180,204)→(236,240) dist=4 -->
  <line x1="180" y1="204" x2="236" y2="240" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <!-- 1→2: (96,204)→(124,60) dist=9 -->
  <line x1="96" y1="204" x2="124" y2="60" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>

  <!-- edge labels -->
  <rect x="56" y="210" width="22" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="67" y="220" text-anchor="middle" font-size="9" fill="#444" font-weight="bold">4</text>
  <rect x="126" y="210" width="22" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="137" y="220" text-anchor="middle" font-size="9" fill="#444" font-weight="bold">3</text>
  <rect x="196" y="210" width="22" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="207" y="220" text-anchor="middle" font-size="9" fill="#444" font-weight="bold">4</text>
  <rect x="99" y="120" width="22" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="110" y="130" text-anchor="middle" font-size="9" fill="#444" font-weight="bold">9</text>

  <!-- Points: scale x*28+40, y: 240-y*18 -->
  <!-- 0: (0,0) -> (40, 240) -->
  <circle cx="40" cy="240" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="40" y="244" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>

  <!-- 1: (2,2) -> (96, 204) -->
  <circle cx="96" cy="204" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="96" y="208" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>

  <!-- 2: (3,10) -> (124, 60) -->
  <circle cx="124" cy="60" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="124" y="64" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>

  <!-- 3: (5,2) -> (180, 204) -->
  <circle cx="180" cy="204" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="180" y="208" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>

  <!-- 4: (7,0) -> (236, 240) -->
  <circle cx="236" cy="240" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="236" y="244" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>

  <text x="155" y="266" text-anchor="middle" font-size="10" fill="#888">绿线=MST 边：0-1(4) + 1-3(3) + 3-4(4) + 1-2(9) = 20</text>

  <!-- ===== Right: step table ===== -->
  <text x="415" y="56" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">Prim 逐步执行</text>

  <!-- table header -->
  <text x="320" y="78" font-size="9" fill="#888" font-weight="bold">步</text>
  <text x="360" y="78" font-size="9" fill="#888" font-weight="bold">弹出</text>
  <text x="410" y="78" font-size="9" fill="#888" font-weight="bold">dist</text>
  <text x="458" y="78" font-size="9" fill="#888" font-weight="bold">ans</text>
  <text x="515" y="78" font-size="9" fill="#888" font-weight="bold">S</text>

  <!-- Step 0: init -->
  <rect x="305" y="84" width="245" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="320" y="102" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">初始</text>
  <text x="380" y="102" text-anchor="middle" font-size="10" fill="#888">—</text>
  <text x="415" y="102" text-anchor="middle" font-size="10" fill="#888" font-family="monospace">—</text>
  <text x="462" y="102" text-anchor="middle" font-size="10" fill="#888" font-family="monospace">0</text>
  <text x="520" y="102" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" font-family="monospace">{0}</text>

  <!-- Step 1: pop (4,1) -->
  <rect x="305" y="116" width="245" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="320" y="134" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="380" y="134" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">(4,1)</text>
  <text x="415" y="134" text-anchor="middle" font-size="10" fill="#444" font-family="monospace">4</text>
  <text x="462" y="134" text-anchor="middle" font-size="10" fill="#444" font-family="monospace">4</text>
  <text x="520" y="134" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" font-family="monospace">{0,1}</text>

  <!-- Step 2: pop (3,3) -->
  <rect x="305" y="148" width="245" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="320" y="166" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="380" y="166" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">(3,3)</text>
  <text x="415" y="166" text-anchor="middle" font-size="10" fill="#444" font-family="monospace">3</text>
  <text x="462" y="166" text-anchor="middle" font-size="10" fill="#444" font-family="monospace">7</text>
  <text x="520" y="166" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" font-family="monospace">{0,1,3}</text>

  <!-- Step 3: pop (4,4) -->
  <rect x="305" y="180" width="245" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="320" y="198" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="380" y="198" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">(4,4)</text>
  <text x="415" y="198" text-anchor="middle" font-size="10" fill="#444" font-family="monospace">4</text>
  <text x="462" y="198" text-anchor="middle" font-size="10" fill="#444" font-family="monospace">11</text>
  <text x="520" y="198" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" font-family="monospace">{0,1,3,4}</text>

  <!-- Step 4: pop (9,2) -->
  <rect x="305" y="212" width="245" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="320" y="230" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">4</text>
  <text x="380" y="230" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">(9,2)</text>
  <text x="415" y="230" text-anchor="middle" font-size="10" fill="#444" font-family="monospace">9</text>
  <text x="462" y="230" text-anchor="middle" font-size="10" fill="#444" font-family="monospace">20</text>
  <text x="520" y="230" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" font-family="monospace">全部</text>

  <!-- Conclusion -->
  <path d="M 280 280 L 280 300" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="80" y="302" width="400" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">MST 总代价 = 4 + 3 + 4 + 9 = 20</text>
  <text x="280" y="340" text-anchor="middle" font-size="11" fill="#555">4 条边连接 5 个点，全部连通</text>

  <!-- notes -->
  <rect x="40" y="360" width="480" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="60" y="382" font-size="11" fill="#444" font-weight="bold">逐步说明：</text>
  <text x="60" y="400" font-size="10" fill="#555">初始 S={0}，堆放入 0 到各点距离: (4,1),(13,2),(7,3),(7,4)</text>
  <text x="60" y="416" font-size="10" fill="#555">步骤1: 弹 (4,1)→加入1，ans=4。更新: 1→2=9&lt;13✓, 1→3=3&lt;7✓, 1→4=7≤7 不更新</text>
  <text x="60" y="432" font-size="10" fill="#555">步骤2: 弹 (3,3)→加入3，ans=7。更新: 3→2=10&gt;9 不更新, 3→4=4&lt;7✓</text>
  <text x="60" y="448" font-size="10" fill="#555">步骤3: 弹 (4,4)→加入4，ans=11。4→2=14&gt;9 不更新</text>
  <text x="60" y="464" font-size="10" fill="#555">步骤4: 跳过已访问的(7,3)(7,4)，弹 (9,2)→加入2，ans=20。全部连通！</text>
  <text x="60" y="478" font-size="10" fill="#d6a040">⚠ 弹出已 visited 的记录直接跳过（懒删除），不浪费时间</text>
</svg>
