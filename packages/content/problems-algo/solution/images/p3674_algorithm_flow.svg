<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#b85450" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="17" fill="#333"
        filter="url(#rough2)">算法流程：一遍扫描判全相等，答案 ∈ {0, 1}</text>

  <!-- ① 扫描 -->
  <rect x="60" y="54" width="300" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="210" y="78" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">① 依次比较 nums[i] 与 nums[0]（i = 1..n−1）</text>

  <path d="M 210 94 L 210 110" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 -->
  <polygon points="210,112 292,152 210,192 128,152" fill="#fafafa" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="210" y="157" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">存在 nums[i] ≠ nums[0] ?</text>

  <!-- 是 → 返回 1 -->
  <path d="M 292 152 L 336 152" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="312" y="144" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="340" y="132" width="110" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="395" y="157" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 1</text>
  <text x="395" y="188" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">选整段一次操作</text>
  <text x="395" y="204" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">全部广播成 T</text>

  <!-- 否 → 返回 0 -->
  <path d="M 210 192 L 210 216" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="220" y="208" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="130" y="220" width="160" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="210" y="245" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 0</text>
  <text x="210" y="284" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">本来全相等（n = 1 也走这里）</text>

  <!-- 继续循环回环 -->
  <path d="M 128 152 L 44 152 L 44 74 L 56 74" stroke="#446688" stroke-width="1.3" stroke-dasharray="6 4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="52" y="126" font-size="10" fill="#446688" filter="url(#rough2)">继续 i++</text>

  <!-- 证明注释框 -->
  <rect x="40" y="300" width="440" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" stroke-dasharray="5 4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">答案 ≤ 1：整段可选 ⇒ 单值广播；不全等 ⇒ 0 次不够 ⇒ ≥ 1</text>
  <text x="260" y="338" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">⚠️ 别推区间 DP——"按位与"与"子数组"都是烟雾弹</text>
</svg>
