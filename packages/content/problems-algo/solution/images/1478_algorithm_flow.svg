<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    算法流程：排序 → 预处理 cost → 划分型 DP
  </text>

  <!-- ===== 步骤 1：排序 ===== -->
  <rect x="30" y="56" width="150" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="105" y="80" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">① 排序</text>
  <text x="105" y="100" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">房屋按位置升序</text>

  <path d="M180,84 L210,84" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== 步骤 2：预处理 cost ===== -->
  <rect x="210" y="56" width="180" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="78" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">② 预处理 cost[i][j]</text>
  <text x="300" y="97" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">邮筒放中位数 m=(i+j)/2</text>
  <text x="300" y="110" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">前缀和 O(1) 算区间和</text>

  <path d="M390,84 L420,84" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== 步骤 3：划分 DP ===== -->
  <rect x="420" y="56" width="120" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="480" y="80" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">③ 划分 DP</text>
  <text x="480" y="100" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">枚举切分点 j</text>

  <!-- ===== cost 公式区 ===== -->
  <rect x="30" y="136" width="510" height="74" fill="#fafafa" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" rx="8" filter="url(#rough2)"/>
  <text x="40" y="158" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">cost[i][j] =</text>
  <text x="60" y="178" font-size="11" fill="#333" filter="url(#rough2)">
    左半 [i,m−1]：houses[m]·(m−i) − Σ[i..m−1]
  </text>
  <text x="300" y="178" font-size="11" fill="#333" filter="url(#rough2)">
    ｜ 右半 [m+1,j]：Σ[m+1..j] − houses[m]·(j−m)
  </text>
  <text x="60" y="198" font-size="10.5" fill="#888" filter="url(#rough2)">
    区间和用前缀和 prefix[] 一次预处理，每个 cost O(1)
  </text>

  <!-- ===== DP 转移区 ===== -->
  <rect x="30" y="228" width="510" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="40" y="250" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">状态转移</text>
  <text x="40" y="272" font-size="12" fill="#333" filter="url(#rough2)">
    dp[t][i] = 前 i 个房屋用 t 个邮筒的最小总距离
  </text>
  <text x="40" y="294" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">
    dp[t][i] = min&#160;{ dp[t−1][j] + cost[j][i−1] } ,  j ∈ [t−1, i−1]
  </text>
  <text x="40" y="308" font-size="10.5" fill="#888" filter="url(#rough2)">
    前 j 个房屋交给 t−1 个邮筒，剩余 [j..i−1] 交给第 t 个邮筒
  </text>

  <!-- 底部答案 -->
  <rect x="150" y="328" width="260" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">
    答案 = dp[k][n]   （恰好用 k 个邮筒）
  </text>
</svg>
