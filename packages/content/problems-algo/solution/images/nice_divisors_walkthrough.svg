<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算</text>

  <!-- ===== Example 1: p=5 ===== -->
  <text x="60" y="56" font-size="12" fill="#446688" font-weight="bold">示例 1：primeFactors = 5</text>

  <rect x="40" y="64" width="440" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="260" y="84" text-anchor="middle" font-size="11" fill="#333">5 = 3 × 1 + 2 → q = 1, r = 2 → 答案 = 3¹ × 2 = 6</text>

  <!-- factor split visual -->
  <rect x="80" y="104" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="110" y="120" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">a₁ = 3</text>
  <text x="110" y="134" text-anchor="middle" font-size="9" fill="#888">p₁³</text>

  <text x="150" y="128" font-size="14" fill="#888">+</text>

  <rect x="165" y="104" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="195" y="120" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">a₂ = 2</text>
  <text x="195" y="134" text-anchor="middle" font-size="9" fill="#888">p₂²</text>

  <text x="240" y="128" font-size="11" fill="#888">→ n = p₁³·p₂² = 200</text>

  <rect x="40" y="152" width="440" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="171" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">好因子数 = 3 × 2 = 6  ✓</text>

  <!-- divider -->
  <line x1="40" y1="192" x2="480" y2="192" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Example 2: p=8 ===== -->
  <text x="60" y="214" font-size="12" fill="#4a7a3a" font-weight="bold">示例 2：primeFactors = 8</text>

  <rect x="40" y="222" width="440" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="260" y="242" text-anchor="middle" font-size="11" fill="#333">8 = 3 × 2 + 2 → q = 2, r = 2 → 答案 = 3² × 2 = 18</text>

  <!-- factor split visual -->
  <rect x="50" y="262" width="55" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="77" y="278" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">a₁=3</text>
  <text x="77" y="292" text-anchor="middle" font-size="9" fill="#888">p₁³</text>

  <text x="113" y="286" font-size="14" fill="#888">+</text>

  <rect x="128" y="262" width="55" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="155" y="278" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">a₂=3</text>
  <text x="155" y="292" text-anchor="middle" font-size="9" fill="#888">p₂³</text>

  <text x="191" y="286" font-size="14" fill="#888">+</text>

  <rect x="206" y="262" width="55" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="233" y="278" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">a₃=2</text>
  <text x="233" y="292" text-anchor="middle" font-size="9" fill="#888">p₃²</text>

  <text x="275" y="286" font-size="11" fill="#888">→ n = p₁³·p₂³·p₃²</text>

  <rect x="40" y="310" width="440" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="329" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">好因子数 = 3 × 3 × 2 = 18  ✓</text>

  <!-- ===== General pattern ===== -->
  <rect x="40" y="350" width="440" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="260" y="368" text-anchor="middle" font-size="10" fill="#666">💡 规律：余数 r=2 时，直接补一个指数为 2 的质因数</text>
  <text x="260" y="384" text-anchor="middle" font-size="10" fill="#666">余数 r=1 时，借一个 3 凑成 4（即两个指数为 2 的质因数）</text>
</svg>
