<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="540" height="360" fill="#fafafa"/>
<text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：选种子 → 链式扩散 → 全染红</text>
  <rect x="40" y="70" width="120" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="100" y="94" text-anchor="middle" font-size="10" fill="#333">① 构造种子集</text>
  <text x="100" y="110" text-anchor="middle" font-size="10" fill="#333">按 4 行周期放置 k 个红三角</text>
  <text x="100" y="126" text-anchor="middle" font-size="10" fill="#333">（含被迫的顶点 (1,1)）</text>
  <rect x="210" y="70" width="120" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="94" text-anchor="middle" font-size="10" fill="#333">② 链式染色</text>
  <text x="270" y="110" text-anchor="middle" font-size="10" fill="#333">找白色三角，若其红色</text>
  <text x="270" y="126" text-anchor="middle" font-size="10" fill="#333">邻居 ≥2 则染红</text>
  <rect x="380" y="70" width="120" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="440" y="94" text-anchor="middle" font-size="10" fill="#333">③ 全染红</text>
  <text x="440" y="110" text-anchor="middle" font-size="10" fill="#333">重复 ② 直至无白色</text>
  <text x="440" y="126" text-anchor="middle" font-size="10" fill="#333">三角满足条件</text>
  <path d="M 162 110 L 208 110" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 332 110 L 378 110" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 270 150 Q 270 178 240 178 Q 210 178 210 150" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="172" text-anchor="middle" font-size="9" fill="#888">仍有满足条件的白三角</text>
  <rect x="60" y="230" width="420" height="96" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="270" y="252" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">关键观察：被追染的三角必须「红色邻居 ≥ 2」</text>
  <text x="270" y="270" text-anchor="middle" font-size="10" fill="#333">顶点 (1,1) 度=1（只与 (2,2) 相邻）→ 算法永不满足条件</text>
  <text x="270" y="286" text-anchor="middle" font-size="10" fill="#333">底行两端 (n,1) 与 (n,2n−1) 度=1 → 同理被迫手动染色</text>
  <text x="270" y="306" text-anchor="middle" font-size="10" fill="#4a7a3a">4 行周期恰好覆盖所有「被迫种子」，达成最小 k</text>
</svg>