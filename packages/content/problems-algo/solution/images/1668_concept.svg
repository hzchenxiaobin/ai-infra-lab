<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">核心：word*k 是否为 sequence 子串 — 关于 k 单调递减</text>

  <!-- ===== Top: sequence display ===== -->
  <text x="40" y="56" font-size="11" fill="#666">sequence</text>
  <!-- "ababc" : highlight first 4 chars "abab" (= word*2) -->
  <rect x="110" y="44" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="64" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="140" y="44" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="64" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>
  <rect x="170" y="44" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="185" y="64" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="200" y="44" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="215" y="64" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>
  <rect x="230" y="44" width="30" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="245" y="64" text-anchor="middle" font-size="14" fill="#999" font-weight="bold">c</text>

  <!-- brace under "abab" -->
  <path d="M 110 80 Q 110 88 125 88 L 215 88 Q 230 88 230 80" stroke="#4a7a3a" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="170" y="100" text-anchor="middle" font-size="10" fill="#4a7a3a">word*2 命中于此</text>

  <text x="300" y="60" font-size="11" fill="#666">word = </text>
  <rect x="338" y="46" width="46" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="361" y="64" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">ab</text>

  <!-- ===== Middle: repetition ladder ===== -->
  <text x="40" y="130" font-size="11" fill="#666" font-weight="bold">重复值阶梯</text>

  <!-- k=0 row -->
  <text x="40" y="158" font-size="11" fill="#446688" font-weight="bold">k=0</text>
  <rect x="90" y="142" width="46" height="26" fill="none" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="113" y="160" text-anchor="middle" font-size="11" fill="#999">∅</text>
  <text x="300" y="160" font-size="16" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- +word arrow k0->k1 -->
  <path d="M 113 172 L 113 184" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="122" y="182" font-size="9" fill="#888">+word</text>

  <!-- k=1 row -->
  <text x="40" y="190" font-size="11" fill="#446688" font-weight="bold">k=1</text>
  <rect x="90" y="174" width="46" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="113" y="192" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ab</text>
  <text x="300" y="192" font-size="16" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- +word arrow k1->k2 -->
  <path d="M 113 204 L 113 216" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="122" y="214" font-size="9" fill="#888">+word</text>

  <!-- k=2 row  (K = answer, highlight) -->
  <text x="40" y="222" font-size="11" fill="#b85450" font-weight="bold">k=2</text>
  <rect x="90" y="206" width="46" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="113" y="224" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ab</text>
  <rect x="138" y="206" width="46" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="161" y="224" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ab</text>
  <text x="300" y="224" font-size="16" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- K=2 bracket marker -->
  <path d="M 322 210 L 322 232" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="330" y="224" font-size="11" fill="#b85450" font-weight="bold">← K=2 最大</text>

  <!-- +word arrow k2->k3 (red, failing) -->
  <path d="M 113 236 L 113 248" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="122" y="246" font-size="9" fill="#b85450">+word</text>

  <!-- k=3 row (failing, grayed) -->
  <text x="40" y="254" font-size="11" fill="#999" font-weight="bold">k=3</text>
  <rect x="90" y="238" width="46" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="113" y="256" text-anchor="middle" font-size="12" fill="#999" font-weight="bold">ab</text>
  <rect x="138" y="238" width="46" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="161" y="256" text-anchor="middle" font-size="12" fill="#999" font-weight="bold">ab</text>
  <rect x="186" y="238" width="46" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="209" y="256" text-anchor="middle" font-size="12" fill="#999" font-weight="bold">ab</text>
  <text x="300" y="256" font-size="16" fill="#b85450" font-weight="bold">✗</text>

  <!-- "从此全失败" annotation -->
  <path d="M 322 242 L 322 264" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="330" y="256" font-size="10" fill="#b85450">k≥3 全 ✗</text>

  <!-- ===== Bottom: insight box ===== -->
  <rect x="30" y="282" width="500" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="48" y="304" font-size="12" fill="#446688" font-weight="bold">关键洞察（单调性）</text>
  <text x="48" y="324" font-size="11" fill="#555">• word*k 是 word*(k+1) 的前缀；「子串的前缀仍是子串」</text>
  <text x="48" y="342" font-size="11" fill="#555">• 故 { k : word*k ⊆ sequence } = {0,1,…,K} 一段连续前缀</text>
  <text x="48" y="360" font-size="11" fill="#b85450" font-weight="bold">• 最大重复值 = 最后一个成立的 k；失败一次即永败，可立即停止</text>
</svg>
