<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    <marker id="arL" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="920" height="560" fill="#fafafa"/>
  <text x="460" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：先算删除数，再定向搜索</text>
  <path d="M 300 46 Q 460 54 620 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 输入字符串 -->
  <text x="80" y="92" font-size="13" font-weight="bold" fill="#555">输入 s =</text>
  <g filter="url(#sk)">
    <rect x="150" y="76" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="194" y="76" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="238" y="76" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="282" y="76" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="326" y="76" width="44" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="370" y="76" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="414" y="76" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="172" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">(</text>
  <text x="216" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">)</text>
  <text x="260" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">(</text>
  <text x="304" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">)</text>
  <text x="348" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450">)</text>
  <text x="392" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">(</text>
  <text x="436" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">)</text>
  <text x="348" y="68" text-anchor="middle" font-size="11" fill="#b85450">多余</text>

  <!-- 右侧目标框 -->
  <g filter="url(#sk)">
    <rect x="540" y="74" width="300" height="40" rx="8" fill="#fffdf3" stroke="#d6a040"/>
  </g>
  <text x="690" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">两阶段策略</text>
  <text x="690" y="108" text-anchor="middle" font-size="12" fill="#7a5415">阶段一算删除数 · 阶段二定向 DFS</text>

  <!-- 左侧：扫描过程表 -->
  <text x="260" y="148" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688">阶段一：扫描计算删除数</text>

  <!-- 表头 -->
  <g filter="url(#sk)">
    <rect x="80" y="160" width="60" height="26" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="140" y="160" width="60" height="26" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="200" y="160" width="90" height="26" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="290" y="160" width="90" height="26" rx="4" fill="#e8f0fe" stroke="#446688"/>
    <rect x="380" y="160" width="100" height="26" rx="4" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="110" y="178" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">下标</text>
  <text x="170" y="178" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">字符</text>
  <text x="245" y="178" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">balance</text>
  <text x="335" y="178" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">l_rem</text>
  <text x="430" y="178" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">r_rem</text>

  <!-- 表行 -->
  <g filter="url(#sk)">
    <rect x="80" y="190" width="60" height="24" rx="2" fill="#fff" stroke="#ccc"/>
    <rect x="140" y="190" width="60" height="24" rx="2" fill="#fff" stroke="#ccc"/>
    <rect x="200" y="190" width="90" height="24" rx="2" fill="#fff" stroke="#ccc"/>
    <rect x="290" y="190" width="90" height="24" rx="2" fill="#fff" stroke="#ccc"/>
    <rect x="380" y="190" width="100" height="24" rx="2" fill="#fff" stroke="#ccc"/>
  </g>
  <text x="110" y="207" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="170" y="207" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">(</text>
  <text x="245" y="207" text-anchor="middle" font-size="11" fill="#4a7a3a">0→1</text>
  <text x="335" y="207" text-anchor="middle" font-size="11" fill="#666">0</text>
  <text x="430" y="207" text-anchor="middle" font-size="11" fill="#666">0</text>

  <g filter="url(#sk)">
    <rect x="80" y="216" width="60" height="24" rx="2" fill="#fff" stroke="#ccc"/>
    <rect x="140" y="216" width="60" height="24" rx="2" fill="#fff" stroke="#ccc"/>
    <rect x="200" y="216" width="90" height="24" rx="2" fill="#fff" stroke="#ccc"/>
    <rect x="290" y="216" width="90" height="24" rx="2" fill="#fff" stroke="#ccc"/>
    <rect x="380" y="216" width="100" height="24" rx="2" fill="#fff" stroke="#ccc"/>
  </g>
  <text x="110" y="233" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="170" y="233" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">)</text>
  <text x="245" y="233" text-anchor="middle" font-size="11" fill="#4a7a3a">1→0</text>
  <text x="335" y="233" text-anchor="middle" font-size="11" fill="#666">0</text>
  <text x="430" y="233" text-anchor="middle" font-size="11" fill="#666">0</text>

  <g filter="url(#sk)">
    <rect x="80" y="242" width="60" height="24" rx="2" fill="#fff" stroke="#ccc"/>
    <rect x="140" y="242" width="60" height="24" rx="2" fill="#fff" stroke="#ccc"/>
    <rect x="200" y="242" width="90" height="24" rx="2" fill="#fff" stroke="#ccc"/>
    <rect x="290" y="242" width="90" height="24" rx="2" fill="#fff" stroke="#ccc"/>
    <rect x="380" y="242" width="100" height="24" rx="2" fill="#fff" stroke="#ccc"/>
  </g>
  <text x="110" y="259" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="170" y="259" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">(</text>
  <text x="245" y="259" text-anchor="middle" font-size="11" fill="#4a7a3a">0→1</text>
  <text x="335" y="259" text-anchor="middle" font-size="11" fill="#666">0</text>
  <text x="430" y="259" text-anchor="middle" font-size="11" fill="#666">0</text>

  <g filter="url(#sk)">
    <rect x="80" y="268" width="60" height="24" rx="2" fill="#fff" stroke="#ccc"/>
    <rect x="140" y="268" width="60" height="24" rx="2" fill="#fff" stroke="#ccc"/>
    <rect x="200" y="268" width="90" height="24" rx="2" fill="#fff" stroke="#ccc"/>
    <rect x="290" y="268" width="90" height="24" rx="2" fill="#fff" stroke="#ccc"/>
    <rect x="380" y="268" width="100" height="24" rx="2" fill="#fff" stroke="#ccc"/>
  </g>
  <text x="110" y="285" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="170" y="285" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">)</text>
  <text x="245" y="285" text-anchor="middle" font-size="11" fill="#4a7a3a">1→0</text>
  <text x="335" y="285" text-anchor="middle" font-size="11" fill="#666">0</text>
  <text x="430" y="285" text-anchor="middle" font-size="11" fill="#666">0</text>

  <!-- 关键行：i=4 多余的 ) -->
  <g filter="url(#sk)">
    <rect x="80" y="294" width="60" height="24" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="140" y="294" width="60" height="24" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="200" y="294" width="90" height="24" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="290" y="294" width="90" height="24" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="380" y="294" width="100" height="24" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="110" y="311" text-anchor="middle" font-size="11" fill="#b85450">4</text>
  <text x="170" y="311" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">)</text>
  <text x="245" y="311" text-anchor="middle" font-size="11" fill="#b85450">0（没(可配）</text>
  <text x="335" y="311" text-anchor="middle" font-size="11" fill="#666">0</text>
  <text x="430" y="311" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">0→1 ↑</text>

  <g filter="url(#sk)">
    <rect x="80" y="320" width="60" height="24" rx="2" fill="#fff" stroke="#ccc"/>
    <rect x="140" y="320" width="60" height="24" rx="2" fill="#fff" stroke="#ccc"/>
    <rect x="200" y="320" width="90" height="24" rx="2" fill="#fff" stroke="#ccc"/>
    <rect x="290" y="320" width="90" height="24" rx="2" fill="#fff" stroke="#ccc"/>
    <rect x="380" y="320" width="100" height="24" rx="2" fill="#fff" stroke="#ccc"/>
  </g>
  <text x="110" y="337" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="170" y="337" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">(</text>
  <text x="245" y="337" text-anchor="middle" font-size="11" fill="#4a7a3a">0→1</text>
  <text x="335" y="337" text-anchor="middle" font-size="11" fill="#666">0</text>
  <text x="430" y="337" text-anchor="middle" font-size="11" fill="#666">1</text>

  <g filter="url(#sk)">
    <rect x="80" y="346" width="60" height="24" rx="2" fill="#fff" stroke="#ccc"/>
    <rect x="140" y="346" width="60" height="24" rx="2" fill="#fff" stroke="#ccc"/>
    <rect x="200" y="346" width="90" height="24" rx="2" fill="#fff" stroke="#ccc"/>
    <rect x="290" y="346" width="90" height="24" rx="2" fill="#fff" stroke="#ccc"/>
    <rect x="380" y="346" width="100" height="24" rx="2" fill="#fff" stroke="#ccc"/>
  </g>
  <text x="110" y="363" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="170" y="363" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">)</text>
  <text x="245" y="363" text-anchor="middle" font-size="11" fill="#4a7a3a">1→0</text>
  <text x="335" y="363" text-anchor="middle" font-size="11" fill="#666">0</text>
  <text x="430" y="363" text-anchor="middle" font-size="11" fill="#666">1</text>

  <!-- 结束结果 -->
  <g filter="url(#sk)">
    <rect x="80" y="378" width="400" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="280" y="398" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">结果：l_rem = 0, r_rem = 1 → 只需删 1 个 )</text>

  <!-- 右侧：DFS vs BFS 对比 -->
  <text x="720" y="148" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688">阶段二：定向 DFS</text>

  <g filter="url(#sk)">
    <rect x="560" y="162" width="320" height="80" rx="8" fill="#fce4ec" stroke="#b85450"/>
  </g>
  <text x="578" y="184" font-size="12" font-weight="bold" fill="#b85450">BFS（暴力）</text>
  <text x="578" y="202" font-size="11" fill="#555">逐层删 1 个括号，逐层检查</text>
  <text x="578" y="218" font-size="11" fill="#555">不知道删几个、删什么</text>
  <text x="578" y="234" font-size="11" fill="#b85450">层间膨胀 C(n,k) 严重</text>

  <path d="M 720 246 L 720 266" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="560" y="270" width="320" height="100" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="578" y="292" font-size="12" font-weight="bold" fill="#4a7a3a">DFS + 剪枝（推荐）</text>
  <text x="578" y="310" font-size="11" fill="#555">带着 l_rem / r_rem 做搜索</text>
  <text x="578" y="326" font-size="11" fill="#555">只在"该删的位置"分支</text>
  <text x="578" y="342" font-size="11" fill="#555">三道剪枝：剩余不足 /</text>
  <text x="578" y="358" font-size="11" fill="#555">l_cnt&gt;r_cnt / 删除配额</text>

  <!-- 底部关键点 -->
  <g filter="url(#sk)">
    <rect x="80" y="420" width="760" height="50" rx="8" fill="#fff8e1" stroke="#d6a040"/>
  </g>
  <text x="460" y="440" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">关键：删除数 = l_rem + r_rem，既是下界也是精确值</text>
  <text x="460" y="458" text-anchor="middle" font-size="12" fill="#7a5415">删掉多余 ) 后剩余 ) 全能配对；删掉多余 ( 后 balance 归零——串必合法。</text>

  <!-- 搜索空间对比 -->
  <g filter="url(#sk)">
    <rect x="80" y="486" width="350" height="44" rx="8" fill="#fce4ec" stroke="#b85450"/>
  </g>
  <text x="255" y="506" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">BFS：盲目生成 7 个一层子串</text>
  <text x="255" y="522" text-anchor="middle" font-size="11" fill="#b85450">逐个检查有效性</text>

  <g filter="url(#sk)">
    <rect x="490" y="486" width="350" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a"/>
  </g>
  <text x="665" y="506" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">DFS：只在 4 个 ) 位置分支</text>
  <text x="665" y="522" text-anchor="middle" font-size="11" fill="#4a7a3a">受 l_cnt&gt;r_cnt 约束，精准搜索</text>

  <text x="460" y="548" text-anchor="middle" font-size="12" fill="#888">一次 O(n) 扫描把"无目标搜索"变成"有目标搜索"。</text>
</svg>
