<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 352" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrY" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="352" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：先建索引（扫 s），再查索引求和（扫 t）</text>

  <!-- left annotation near init box -->
  <text x="132" y="102" text-anchor="end" font-size="9.5" fill="#446688" filter="url(#rough2)">int[26] 直接当哈希表</text>
  <text x="132" y="116" text-anchor="end" font-size="9.5" fill="#446688" filter="url(#rough2)">连冲突处理都免了</text>

  <!-- box 1: start -->
  <rect x="140" y="40" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="250" y="59" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">开始：s、t（t 是 s 的排列，n ≤ 26）</text>

  <path d="M 250 70 L 250 86" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- box 2: init -->
  <rect x="140" y="90" width="220" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="250" y="109" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">pos[26] = {0}，ans = 0</text>

  <path d="M 250 120 L 250 136" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- box 3: pass over s -->
  <rect x="130" y="140" width="240" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="250" y="157" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">① for (i, c) in s：</text>
  <text x="250" y="172" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">pos[c − 'a'] = i</text>

  <path d="M 250 180 L 250 192" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- box 4: pass over t -->
  <rect x="130" y="196" width="240" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="250" y="213" text-anchor="middle" font-size="10.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">② for (j, c) in t：</text>
  <text x="250" y="228" text-anchor="middle" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">ans += |pos[c − 'a'] − j|</text>

  <path d="M 250 236 L 250 248" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- box 5: return -->
  <rect x="140" y="252" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="250" y="271" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <!-- right annotations -->
  <path d="M 386 157 L 374 157" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="390" y="152" text-anchor="start" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">字符不重复</text>
  <text x="390" y="166" text-anchor="start" font-size="10" fill="#4a7a3a" filter="url(#rough2)">⇒ 一键一值，无冲突</text>

  <path d="M 386 213 L 374 213" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arrY)" filter="url(#rough2)"/>
  <text x="390" y="208" text-anchor="start" font-size="10" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">t 是 s 的排列</text>
  <text x="390" y="222" text-anchor="start" font-size="10" fill="#8a6a1f" filter="url(#rough2)">⇒ 查表必命中，无 miss 分支</text>

  <path d="M 386 266 L 364 266" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="390" y="262" text-anchor="start" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">ans ≤ 26 × 25 = 650</text>
  <text x="390" y="276" text-anchor="start" font-size="10" fill="#446688" filter="url(#rough2)">int 绰绰有余</text>

  <!-- bottom note -->
  <rect x="12" y="298" width="496" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="316" text-anchor="middle" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">两趟是自然结构：t[j] 的贡献依赖 pos(t[j])，而该字符在 s 中可能很靠后才出现——</text>
  <text x="260" y="334" text-anchor="middle" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">先建全索引、再统一查询（先扫 t 记位置、再扫 s 累加，同样成立）</text>
</svg>
