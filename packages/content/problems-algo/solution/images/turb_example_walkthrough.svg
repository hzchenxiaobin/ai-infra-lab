<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="430" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：arr = [9, 4, 2, 10, 7, 8, 8, 1, 9]，求最长湍流子数组</text>

  <!-- Index labels -->
  <text x="35" y="52" font-size="11" fill="#888">下标:</text>
  <text x="122" y="52" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">0</text>
  <text x="166" y="52" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">1</text>
  <text x="210" y="52" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">2</text>
  <text x="254" y="52" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">3</text>
  <text x="298" y="52" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">4</text>
  <text x="342" y="52" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">5</text>
  <text x="386" y="52" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">6</text>
  <text x="430" y="52" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">7</text>
  <text x="474" y="52" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">8</text>

  <!-- Array cells -->
  <rect x="100" y="56" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122" y="77" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">9</text>
  <rect x="144" y="56" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="166" y="77" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="188" y="56" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="77" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="232" y="56" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="254" y="77" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">10</text>
  <rect x="276" y="56" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="298" y="77" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
  <rect x="320" y="56" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="342" y="77" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>
  <rect x="364" y="56" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="386" y="77" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>
  <rect x="408" y="56" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="77" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="452" y="56" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="474" y="77" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">9</text>

  <!-- Comparison signs between cells -->
  <text x="144" y="104" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">&gt;</text>
  <text x="188" y="104" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">&gt;</text>
  <text x="232" y="104" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">&lt;</text>
  <text x="276" y="104" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">&gt;</text>
  <text x="320" y="104" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">&lt;</text>
  <text x="364" y="104" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">=</text>
  <text x="408" y="104" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">&gt;</text>
  <text x="452" y="104" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">&lt;</text>

  <!-- Table header -->
  <text x="35" y="126" font-size="11" fill="#444" font-weight="bold">步骤</text>
  <text x="85" y="126" font-size="11" fill="#444" font-weight="bold">right</text>
  <text x="145" y="126" font-size="11" fill="#444" font-weight="bold">比较</text>
  <text x="225" y="126" font-size="11" fill="#444" font-weight="bold">动作</text>
  <text x="365" y="126" font-size="11" fill="#444" font-weight="bold">窗口</text>
  <text x="485" y="126" font-size="11" fill="#444" font-weight="bold">max</text>

  <line x1="25" y1="132" x2="520" y2="132" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Step 1: right=1, 9>4, first pair, [9,4], max=2 -->
  <text x="35" y="150" font-size="11" fill="#333">1</text>
  <text x="90" y="150" font-size="11" fill="#333">1</text>
  <text x="155" y="150" font-size="11" fill="#333" font-weight="bold">9 &gt; 4</text>
  <text x="225" y="150" font-size="11" fill="#82b366">首对扩展</text>
  <text x="365" y="150" font-size="11" fill="#4a7a3a" font-weight="bold">[9, 4]</text>
  <text x="490" y="150" font-size="11" fill="#333" font-weight="bold">2</text>

  <!-- Step 2: right=2, 4>2, same sign, left→1, [4,2], max=2 -->
  <text x="35" y="170" font-size="11" fill="#333">2</text>
  <text x="90" y="170" font-size="11" fill="#333">2</text>
  <text x="155" y="170" font-size="11" fill="#333" font-weight="bold">4 &gt; 2</text>
  <text x="225" y="170" font-size="11" fill="#d6a040">同号重启 left→1</text>
  <text x="365" y="170" font-size="11" fill="#d6a040" font-weight="bold">[4, 2]</text>
  <text x="490" y="170" font-size="11" fill="#333">2</text>

  <!-- Step 3: right=3, 2<10, flip, [4,2,10], max=3 -->
  <text x="35" y="190" font-size="11" fill="#333">3</text>
  <text x="90" y="190" font-size="11" fill="#333">3</text>
  <text x="155" y="190" font-size="11" fill="#333" font-weight="bold">2 &lt; 10</text>
  <text x="225" y="190" font-size="11" fill="#82b366">翻转扩展</text>
  <text x="365" y="190" font-size="11" fill="#4a7a3a" font-weight="bold">[4, 2, 10]</text>
  <text x="490" y="190" font-size="11" fill="#333" font-weight="bold">3</text>

  <!-- Step 4: right=4, 10>7, flip, [4,2,10,7], max=4 -->
  <text x="35" y="210" font-size="11" fill="#333">4</text>
  <text x="90" y="210" font-size="11" fill="#333">4</text>
  <text x="155" y="210" font-size="11" fill="#333" font-weight="bold">10 &gt; 7</text>
  <text x="225" y="210" font-size="11" fill="#82b366">翻转扩展</text>
  <text x="365" y="210" font-size="11" fill="#4a7a3a" font-weight="bold">[4, 2, 10, 7]</text>
  <text x="490" y="210" font-size="11" fill="#333" font-weight="bold">4</text>

  <!-- Step 5: right=5, 7<8, flip, [4,2,10,7,8], max=5 ⭐ -->
  <text x="35" y="230" font-size="11" fill="#333">5</text>
  <text x="90" y="230" font-size="11" fill="#333">5</text>
  <text x="155" y="230" font-size="11" fill="#333" font-weight="bold">7 &lt; 8</text>
  <text x="225" y="230" font-size="11" fill="#82b366">翻转扩展</text>
  <text x="365" y="230" font-size="11" fill="#4a7a3a" font-weight="bold">[4, 2, 10, 7, 8]</text>
  <text x="490" y="230" font-size="11" fill="#b85450" font-weight="bold">5 ⭐</text>

  <!-- Step 6: right=6, 8==8, equal, left→6, [8], max=5 -->
  <text x="35" y="250" font-size="11" fill="#333">6</text>
  <text x="90" y="250" font-size="11" fill="#333">6</text>
  <text x="155" y="250" font-size="11" fill="#888" font-weight="bold">8 = 8</text>
  <text x="225" y="250" font-size="11" fill="#b85450">相等中断 left→6</text>
  <text x="365" y="250" font-size="11" fill="#b85450" font-weight="bold">[8]</text>
  <text x="490" y="250" font-size="11" fill="#333">5</text>

  <!-- Step 7: right=7, 8>1, first pair, [8,1], max=5 -->
  <text x="35" y="270" font-size="11" fill="#333">7</text>
  <text x="90" y="270" font-size="11" fill="#333">7</text>
  <text x="155" y="270" font-size="11" fill="#333" font-weight="bold">8 &gt; 1</text>
  <text x="225" y="270" font-size="11" fill="#82b366">首对扩展</text>
  <text x="365" y="270" font-size="11" fill="#4a7a3a" font-weight="bold">[8, 1]</text>
  <text x="490" y="270" font-size="11" fill="#333">5</text>

  <!-- Step 8: right=8, 1<9, flip, [8,1,9], max=5 -->
  <text x="35" y="290" font-size="11" fill="#333">8</text>
  <text x="90" y="290" font-size="11" fill="#333">8</text>
  <text x="155" y="290" font-size="11" fill="#333" font-weight="bold">1 &lt; 9</text>
  <text x="225" y="290" font-size="11" fill="#82b366">翻转扩展</text>
  <text x="365" y="290" font-size="11" fill="#4a7a3a" font-weight="bold">[8, 1, 9]</text>
  <text x="490" y="290" font-size="11" fill="#333">5</text>

  <!-- Result box -->
  <rect x="50" y="312" width="440" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="334" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">答案 = 5，最长湍流子数组 [4, 2, 10, 7, 8]（下标 1–5）</text>
  <text x="270" y="354" text-anchor="middle" font-size="11" fill="#888">left 只增不减，right 只增不减 → 整体 O(n)</text>

  <!-- Legend -->
  <rect x="50" y="384" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="70" y="395" font-size="11" fill="#555">翻转/首对扩展</text>
  <rect x="170" y="384" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="190" y="395" font-size="11" fill="#555">同号重启</text>
  <rect x="270" y="384" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="290" y="395" font-size="11" fill="#555">相等中断</text>
  <text x="380" y="395" font-size="11" fill="#888">⭐ = 当前全局最大</text>
</svg>
