<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：aliceSizes = [1,1], bobSizes = [2,2]</text>

  <!-- Alice row -->
  <text x="30" y="62" font-size="11" fill="#446688" font-weight="bold">Alice：</text>
  <g filter="url(#rough2)">
    <rect x="74" y="48" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="94" y="68" text-anchor="middle" font-size="12" fill="#333">1</text>
    <rect x="118" y="48" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="138" y="68" text-anchor="middle" font-size="12" fill="#333">1</text>
  </g>
  <text x="170" y="66" font-size="11" fill="#446688" font-weight="bold">sumA = 2</text>

  <!-- Bob row -->
  <text x="300" y="62" font-size="11" fill="#4a7a3a" font-weight="bold">Bob：</text>
  <g filter="url(#rough2)">
    <rect x="344" y="48" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="364" y="68" text-anchor="middle" font-size="12" fill="#333">2</text>
    <rect x="388" y="48" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="408" y="68" text-anchor="middle" font-size="12" fill="#333">2</text>
  </g>
  <text x="440" y="66" font-size="11" fill="#4a7a3a" font-weight="bold">sumB = 4</text>

  <!-- arrow down -->
  <path d="M 290 84 L 290 104" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- delta computation -->
  <rect x="140" y="108" width="300" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="290" y="134" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">delta = (2 − 4) / 2 = −1</text>

  <!-- arrow down -->
  <path d="M 290 150 L 290 168" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- setB -->
  <rect x="140" y="172" width="300" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="290" y="198" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">setB = { 2 }</text>

  <!-- arrow down -->
  <path d="M 290 214 L 290 232" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- lookup table -->
  <rect x="40" y="236" width="500" height="100" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="56" y="256" font-size="11" fill="#888" font-weight="bold">遍历 Alice：</text>

  <!-- table header -->
  <rect x="56" y="262" width="468" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <g font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">
    <text x="100" y="278" text-anchor="middle">x (Alice)</text>
    <text x="220" y="278" text-anchor="middle">y = x − delta</text>
    <text x="340" y="278" text-anchor="middle">y ∈ setB?</text>
    <text x="470" y="278" text-anchor="middle">结果</text>
  </g>

  <!-- row 1: x=1 -->
  <rect x="56" y="286" width="468" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <g font-size="11" filter="url(#rough2)">
    <text x="100" y="302" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <text x="220" y="302" text-anchor="middle" fill="#333">1 − (−1) = 2</text>
    <text x="340" y="302" text-anchor="middle" fill="#4a7a3a" font-weight="bold">✅ 是</text>
    <text x="470" y="302" text-anchor="middle" fill="#4a7a3a" font-weight="bold">[1, 2] ✓</text>
  </g>

  <!-- result arrow -->
  <path d="M 290 338 L 290 356" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="170" y="360" width="240" height="36" fill="#446688" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="290" y="384" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">返回 [1, 2]</text>

  <!-- verification -->
  <rect x="40" y="404" width="500" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="290" y="422" text-anchor="middle" font-size="10" fill="#4a7a3a">验证：Alice 2−1+2=3, Bob 4−2+1=3 ✓</text>
</svg>
