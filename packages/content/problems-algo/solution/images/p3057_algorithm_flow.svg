<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：先聚合出均值表 T，再回连到明细逐行过滤</text>

  <!-- 第一排 -->
  <rect x="24" y="52" width="146" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="97" y="71" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① JOIN 贴标签</text>
  <text x="97" y="88" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">Project ⋈ Employees</text>
  <text x="97" y="102" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">USING(employee_id)</text>
  <text x="97" y="116" text-anchor="middle" font-size="8.5" fill="#555" filter="url(#rough2)">明细行带上 team</text>

  <rect x="198" y="52" width="146" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="271" y="71" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">② 分组求均值</text>
  <text x="271" y="88" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">GROUP BY team</text>
  <text x="271" y="102" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">AVG(workload)</text>
  <text x="271" y="116" text-anchor="middle" font-size="8.5" fill="#555" filter="url(#rough2)">→ 小表 T（g 行）</text>

  <rect x="372" y="52" width="146" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="445" y="71" text-anchor="middle" font-size="10.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">③ 回连均值表</text>
  <text x="445" y="88" text-anchor="middle" font-size="9" fill="#7a5a10" filter="url(#rough2)">明细 JOIN T</text>
  <text x="445" y="102" text-anchor="middle" font-size="9" fill="#7a5a10" filter="url(#rough2)">USING(team)</text>
  <text x="445" y="116" text-anchor="middle" font-size="8.5" fill="#555" filter="url(#rough2)">每行自带团队阈值</text>

  <path d="M 172 86 L 194 86" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 346 86 L 368 86" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 肘形换行箭头 -->
  <path d="M 445 122 L 445 142 L 97 142 L 97 160" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 第二排 -->
  <rect x="24" y="164" width="146" height="68" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="97" y="183" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">④ 逐行过滤</text>
  <text x="97" y="200" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">WHERE workload &gt; avg_workload</text>
  <text x="97" y="215" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">（严格大于）</text>
  <text x="97" y="228" text-anchor="middle" font-size="8.5" fill="#555" filter="url(#rough2)">压线不算</text>

  <rect x="198" y="164" width="146" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="271" y="183" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">⑤ 重命名输出</text>
  <text x="271" y="200" text-anchor="middle" font-size="8" fill="#446688" filter="url(#rough2)">name → employee_name</text>
  <text x="271" y="214" text-anchor="middle" font-size="8" fill="#446688" filter="url(#rough2)">workload → project_workload</text>
  <text x="271" y="228" text-anchor="middle" font-size="8.5" fill="#555" filter="url(#rough2)">列名拼错即打回</text>

  <rect x="372" y="164" width="146" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="445" y="183" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">⑥ 排序</text>
  <text x="445" y="200" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">ORDER BY employee_id,</text>
  <text x="445" y="214" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">project_id 升序</text>
  <text x="445" y="228" text-anchor="middle" font-size="8.5" fill="#555" filter="url(#rough2)">双键排序</text>

  <path d="M 172 198 L 194 198" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 346 198 L 368 198" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 底部两张注记卡 -->
  <rect x="24" y="246" width="232" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="140" y="263" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">💡 为什么不 O(n²)？</text>
  <text x="140" y="278" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">相关子查询：每行重算团队均值</text>
  <text x="140" y="292" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">本题：T 物化 g 行，均值只算一次</text>
  <text x="140" y="306" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">回连按 team 点查，整体两趟 O(n)</text>

  <rect x="264" y="246" width="232" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="380" y="263" text-anchor="middle" font-size="9.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">⚙ 窗口函数替代（解法 B）</text>
  <text x="380" y="278" text-anchor="middle" font-size="8" fill="#7a5a10" filter="url(#rough2)">AVG(workload) OVER (PARTITION BY team)</text>
  <text x="380" y="292" text-anchor="middle" font-size="8.5" fill="#7a5a10" filter="url(#rough2)">一趟扫描：均值直接广播回每一行</text>
  <text x="380" y="306" text-anchor="middle" font-size="8.5" fill="#7a5a10" filter="url(#rough2)">WHERE 见不到窗口 → 包一层派生表</text>

  <rect x="24" y="322" width="472" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="339" text-anchor="middle" font-size="9" fill="#8f3a36" filter="url(#rough2)">⚠️ 输出是重命名后的四列、employee_id 在前 —— 列名 / 顺序 / 排序键任一不符都会被判题打回</text>
</svg>
