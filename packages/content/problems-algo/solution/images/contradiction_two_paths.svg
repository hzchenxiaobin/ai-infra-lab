<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#888"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：矛盾 = 两条路径算出不同比值</text>

  <!-- ===== nodes ===== -->
  <!-- le (top) -->
  <ellipse cx="280" cy="92" rx="34" ry="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="97" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">le</text>

  <!-- et (bottom-left) -->
  <ellipse cx="140" cy="270" rx="34" ry="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="140" y="275" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">et</text>

  <!-- code (bottom-right) -->
  <ellipse cx="420" cy="270" rx="40" ry="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="420" y="275" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">code</text>

  <!-- ===== edges (given equations) ===== -->
  <!-- le to et : le/et = 2 -->
  <path d="M 262 108 L 158 256" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="178" y="178" font-size="11" fill="#446688" font-weight="bold">le/et = 2</text>

  <!-- le to code : le/code = 5 -->
  <path d="M 300 108 L 398 256" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="352" y="178" font-size="11" fill="#446688" font-weight="bold">le/code = 5</text>

  <!-- code to et : code/et = 0.5 (claimed, red) -->
  <path d="M 378 270 L 176 270" stroke="#b85450" stroke-width="2.2" fill="none" stroke-dasharray="6 4" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="250" y="288" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">第三式声称 code/et = 0.5</text>

  <!-- ===== derived path code -> le -> et ===== -->
  <!-- code -> le -->
  <path d="M 392 256 L 296 112" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <!-- le -> et -->
  <path d="M 264 112 L 162 256" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- derived formula box -->
  <rect x="40" y="316" width="480" height="86" fill="#e6f4ea" fill-opacity="0.4" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="338" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">已有路径 code → le → et 推出：</text>
  <text x="280" y="360" text-anchor="middle" font-size="13" fill="#333">code/et = (code/le) × (le/et) = (1/5) × 2 = 0.4</text>
  <text x="280" y="386" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">0.4 ≠ 0.5  →  矛盾！</text>
</svg>
