<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：数 0 定零区，再数零区里的非零元素</text>

  <rect x="115" y="38" width="290" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="61" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① 一趟扫描：数出 0 的个数 k</text>

  <path d="M 260 74 L 260 90" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="105" y="94" width="310" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="117" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② 零区 = 末尾 k 个下标 [n−k, n−1]</text>

  <path d="M 260 130 L 260 146" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="92" y="150" width="336" height="92" fill="none" stroke="#888" stroke-width="1.4" stroke-dasharray="6 5" rx="12" filter="url(#rough2)"/>
  <text x="104" y="168" font-size="11" fill="#666" filter="url(#rough2)">遍历零区 i = n−k … n−1</text>

  <rect x="125" y="178" width="270" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="201" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ nums[i] ≠ 0 ⇒ ans++（钉子户 +1）</text>

  <path d="M 395 196 L 448 196 L 448 172 L 400 172" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="424" y="166" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i++</text>

  <path d="M 260 242 L 260 256" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="105" y="260" width="310" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="280" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">④ 返回 ans = 零区中非零元素的个数</text>
  <text x="260" y="298" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">时间 O(n) · 空间 O(1)；k = 0 时零区为空，ans = 0 天然成立</text>

  <rect x="20" y="318" width="232" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="136" y="332" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">为什么恰好最优？</text>
  <text x="136" y="347" text-anchor="middle" font-size="9" fill="#7a5c1a" filter="url(#rough2)">错位两类相等 · 一换修俩 ⇒ ans = a</text>

  <rect x="268" y="318" width="232" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="384" y="332" text-anchor="middle" font-size="10" fill="#33507a" font-weight="bold" filter="url(#rough2)">口算验证</text>
  <text x="384" y="347" text-anchor="middle" font-size="9" fill="#3d5a80" filter="url(#rough2)">[0,1,0,2]：末 2 位 [0,2] ⇒ ans = 1 ✓</text>
</svg>
