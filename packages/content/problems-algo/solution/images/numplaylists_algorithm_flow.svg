<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">播放列表计数：DP 填表流程</text>

  <!-- Step 1: Init -->
  <rect x="180" y="44" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="12" fill="#333">① 初始化 dp[0][0] = 1</text>
  <text x="280" y="76" text-anchor="middle" font-size="10" fill="#888">空播放列表算 1 种</text>

  <path d="M 280 88 L 280 108" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: Loop -->
  <rect x="120" y="112" width="320" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="132" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 双层循环：i = 1..goal，j = 1..min(i, n)</text>
  <text x="280" y="150" text-anchor="middle" font-size="10" fill="#888">位置 i 最多用 i 首（每位置一首）</text>
  <text x="280" y="164" text-anchor="middle" font-size="10" fill="#888">最多用 n 首（总共就 n 首）</text>

  <path d="M 280 172 L 280 192" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: Recurrence (decision diamond) -->
  <polygon points="280,196 400,236 280,276 160,236" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="226" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">③ 对每个 (i, j)</text>
  <text x="280" y="242" text-anchor="middle" font-size="10" fill="#d6a040">累加两种转移</text>
  <text x="280" y="256" text-anchor="middle" font-size="10" fill="#888">取模 MOD</text>

  <!-- Two branches -->
  <path d="M 160 236 L 80 236 L 80 300" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 400 236 L 480 236 L 480 300" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Branch A: new song -->
  <rect x="20" y="304" width="120" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="80" y="322" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">放新歌</text>
  <text x="80" y="338" text-anchor="middle" font-size="9" fill="#333">dp[i−1][j−1]</text>
  <text x="80" y="350" text-anchor="middle" font-size="9" fill="#333">× (n−j+1)</text>

  <!-- Branch B: replay -->
  <rect x="420" y="304" width="120" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="480" y="322" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">重放旧歌</text>
  <text x="480" y="338" text-anchor="middle" font-size="9" fill="#333">dp[i−1][j]</text>
  <text x="480" y="350" text-anchor="middle" font-size="9" fill="#333">× max(j−k, 0)</text>

  <!-- Merge arrows down -->
  <path d="M 80 358 L 80 372 L 280 372" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 480 358 L 480 372 L 280 372" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- Step 4: Result -->
  <rect x="180" y="372" width="200" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="388" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">④ 返回 dp[goal][n]</text>
</svg>
