<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="240" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">状态递推流程：每轮 O(1)，共 O(log n) 轮</text>

  <!-- 开始框 -->
  <rect x="90" y="40" width="220" height="32" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="60" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">初始化 head=1 · step=1 · rem=n · left=1</text>

  <line x1="200" y1="72" x2="200" y2="88" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 1：rem > 1 ? -->
  <g filter="url(#rough2)">
    <polygon points="200,88 290,120 200,152 110,120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="200" y="116" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">rem &gt; 1 ?</text>
    <text x="200" y="132" text-anchor="middle" font-size="10" fill="#2f5d24">还有数可删吗</text>
  </g>

  <!-- 否 → 返回 -->
  <line x1="290" y1="120" x2="356" y2="120" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="316" y="112" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="358" y="104" width="136" height="32" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="426" y="124" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">返回 head ✓</text>

  <!-- 是 → 菱形 2 -->
  <line x1="200" y1="152" x2="200" y2="170" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="214" y="165" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">是</text>

  <g filter="url(#rough2)">
    <polygon points="200,170 300,204 200,238 100,204" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="200" y="200" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">本轮方向 = 右</text>
    <text x="200" y="216" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">且 rem 是偶数 ?</text>
    <text x="200" y="231" text-anchor="middle" font-size="9.5" fill="#b85450">(!left &amp;&amp; rem%2==0)</text>
  </g>

  <!-- 是 → head += step -->
  <line x1="300" y1="204" x2="362" y2="204" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="328" y="196" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="364" y="188" width="130" height="32" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="429" y="208" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">head += step</text>

  <!-- 否 → head 不变 -->
  <line x1="200" y1="238" x2="200" y2="256" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="216" y="252" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否（head 不变）</text>

  <!-- 更新框 -->
  <rect x="70" y="258" width="260" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="276" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">step ×= 2 · rem = (rem+1) / 2</text>
  <text x="200" y="294" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">left 取反（左右交替）</text>

  <!-- 回环箭头 -->
  <path d="M 70 280 L 36 280 L 36 120 L 106 120" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="30" y="204" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">进入下一轮</text>

  <!-- 右下注释框 -->
  <g filter="url(#rough2)">
    <rect x="352" y="240" width="158" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="431" y="259" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold">rem 每轮至少减半</text>
    <text x="431" y="275" text-anchor="middle" font-size="10" fill="#2f5d24">n = 10¹⁵ 也只需 ~50 轮</text>
    <text x="431" y="291" text-anchor="middle" font-size="10" fill="#2f5d24">全程 64 位整数即可</text>
  </g>

  <text x="260" y="336" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">对照 390 消除游戏：那边是「从左删，或 rem 为奇」时 head += step，象限恰好互补</text>
</svg>
