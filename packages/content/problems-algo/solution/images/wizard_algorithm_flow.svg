<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：双前缀和预处理 → 两次单调栈定边界 → 逐元素结算贡献</text>

  <rect x="30" y="40" width="220" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="140" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 预处理 P 与 PP</text>
  <text x="140" y="78" text-anchor="middle" font-size="10" fill="#555">P[0]=0，P[k]=Σ strength[0..k−1]</text>
  <text x="140" y="94" text-anchor="middle" font-size="10" fill="#555">PP[0]=0，PP[k]=Σ P[0..k−1]</text>
  <text x="140" y="106" text-anchor="middle" font-size="9.5" fill="#888">O(n) 一次扫描搞定</text>

  <rect x="290" y="40" width="240" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="410" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 左边界 L[i]（严格更小）</text>
  <text x="410" y="78" text-anchor="middle" font-size="10" fill="#555">左→右，递增栈</text>
  <text x="410" y="94" text-anchor="middle" font-size="10" fill="#555">弹条件：栈顶值 ≥ strength[i]</text>
  <text x="410" y="106" text-anchor="middle" font-size="9.5" fill="#888">留严格更小，L=新栈顶或 −1</text>

  <path d="M 250 75 L 288 75" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <rect x="30" y="126" width="220" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="140" y="146" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ 右边界 R[i]（更小或相等）</text>
  <text x="140" y="164" text-anchor="middle" font-size="10" fill="#555">右→左，递增栈</text>
  <text x="140" y="180" text-anchor="middle" font-size="10" fill="#555">弹条件：栈顶值 &gt; strength[i]</text>
  <text x="140" y="192" text-anchor="middle" font-size="9.5" fill="#888">留更小或相等，R=新栈顶或 n</text>

  <rect x="290" y="126" width="240" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="410" y="146" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">④ 逐元素结算贡献</text>
  <text x="410" y="164" text-anchor="middle" font-size="10" fill="#555">sumS = (i−L)·(PP[R+1]−PP[i+1])</text>
  <text x="410" y="180" text-anchor="middle" font-size="10" fill="#555">      − (R−i)·(PP[i+1]−PP[L+1])</text>
  <text x="410" y="192" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">ans += strength[i] × sumS</text>

  <path d="M 140 196 L 140 224" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 410 196 L 410 224" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <rect x="120" y="228" width="320" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="248" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">每步对 10^9+7 取模，全程用 64 位整数</text>
  <text x="280" y="264" text-anchor="middle" font-size="10" fill="#555">最终 ans 即所有子数组 min×sum 之和</text>

  <path d="M 280 272 L 280 300" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="304" width="440" height="138" fill="#fafafa" stroke="#bbb" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">取模细节（易错点）</text>

  <rect x="78" y="336" width="404" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="86" y="356" font-size="10" fill="#333">• strength[i] ≤ 10^9，PP 差 ≤ 10^14，乘 strength 后 ≤ 10^23 → 中间必须逐步取模</text>

  <rect x="78" y="370" width="404" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="86" y="390" font-size="10" fill="#333">• PP 在前缀和时即取模；做减法出现负数时 +MOD 再取模修正</text>

  <rect x="78" y="404" width="404" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="86" y="424" font-size="10" fill="#333">• 左/右弹栈条件不对称：左弹 ≥（留严格小），右弹 &gt;（留小或等），防等值重复</text>
</svg>
