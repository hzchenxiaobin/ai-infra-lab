<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：每个 '?' 至多 2 个邻居禁令，至少 24 个字母可选</text>

  <!-- String row: v ? w  (对应 "ubv?w" 中的 ? ) -->
  <text x="60" y="92" font-size="11" fill="#888">s =</text>

  <!-- left neighbor v (orange) -->
  <rect x="200" y="66" width="44" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="222" y="93" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">v</text>
  <text x="222" y="122" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">左邻居</text>

  <!-- ? (blue, highlighted) -->
  <rect x="258" y="66" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="93" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">?</text>
  <text x="280" y="122" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">待填</text>

  <!-- right neighbor w (green) -->
  <rect x="316" y="66" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="338" y="93" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">w</text>
  <text x="338" y="122" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">右邻居</text>

  <!-- Forbidden arrows pointing inward to ? -->
  <path d="M 244 86 L 258 86" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="251" y="80" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">≠v</text>
  <path d="M 316 86 L 302 86" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="309" y="80" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">≠w</text>

  <!-- Divider -->
  <line x1="30" y1="140" x2="530" y2="140" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- Alphabet label -->
  <text x="280" y="162" text-anchor="middle" font-size="11" fill="#666">26 个小写字母中，禁用 v、w 后剩余：</text>

  <!-- Alphabet row: 26 boxes, step 18, start x=47, y=178, w=16 h=22 -->
  <rect x="47"  y="178" width="16" height="22" fill="#e6f4ea" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="55"  y="194" text-anchor="middle" font-size="11" fill="#333">a</text>
  <rect x="65"  y="178" width="16" height="22" fill="#e6f4ea" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="73"  y="194" text-anchor="middle" font-size="11" fill="#333">b</text>
  <rect x="83"  y="178" width="16" height="22" fill="#e6f4ea" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="91"  y="194" text-anchor="middle" font-size="11" fill="#333">c</text>
  <rect x="101" y="178" width="16" height="22" fill="#e6f4ea" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="109" y="194" text-anchor="middle" font-size="11" fill="#333">d</text>
  <rect x="119" y="178" width="16" height="22" fill="#e6f4ea" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="127" y="194" text-anchor="middle" font-size="11" fill="#333">e</text>
  <rect x="137" y="178" width="16" height="22" fill="#e6f4ea" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="145" y="194" text-anchor="middle" font-size="11" fill="#333">f</text>
  <rect x="155" y="178" width="16" height="22" fill="#e6f4ea" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="163" y="194" text-anchor="middle" font-size="11" fill="#333">g</text>
  <rect x="173" y="178" width="16" height="22" fill="#e6f4ea" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="181" y="194" text-anchor="middle" font-size="11" fill="#333">h</text>
  <rect x="191" y="178" width="16" height="22" fill="#e6f4ea" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="199" y="194" text-anchor="middle" font-size="11" fill="#333">i</text>
  <rect x="209" y="178" width="16" height="22" fill="#e6f4ea" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="217" y="194" text-anchor="middle" font-size="11" fill="#333">j</text>
  <rect x="227" y="178" width="16" height="22" fill="#e6f4ea" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="235" y="194" text-anchor="middle" font-size="11" fill="#333">k</text>
  <rect x="245" y="178" width="16" height="22" fill="#e6f4ea" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="253" y="194" text-anchor="middle" font-size="11" fill="#333">l</text>
  <rect x="263" y="178" width="16" height="22" fill="#e6f4ea" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="271" y="194" text-anchor="middle" font-size="11" fill="#333">m</text>
  <rect x="281" y="178" width="16" height="22" fill="#e6f4ea" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="289" y="194" text-anchor="middle" font-size="11" fill="#333">n</text>
  <rect x="299" y="178" width="16" height="22" fill="#e6f4ea" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="307" y="194" text-anchor="middle" font-size="11" fill="#333">o</text>
  <rect x="317" y="178" width="16" height="22" fill="#e6f4ea" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="325" y="194" text-anchor="middle" font-size="11" fill="#333">p</text>
  <rect x="335" y="178" width="16" height="22" fill="#e6f4ea" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="343" y="194" text-anchor="middle" font-size="11" fill="#333">q</text>
  <rect x="353" y="178" width="16" height="22" fill="#e6f4ea" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="361" y="194" text-anchor="middle" font-size="11" fill="#333">r</text>
  <rect x="371" y="178" width="16" height="22" fill="#e6f4ea" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="379" y="194" text-anchor="middle" font-size="11" fill="#333">s</text>
  <rect x="389" y="178" width="16" height="22" fill="#e6f4ea" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="397" y="194" text-anchor="middle" font-size="11" fill="#333">t</text>
  <rect x="407" y="178" width="16" height="22" fill="#e6f4ea" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="415" y="194" text-anchor="middle" font-size="11" fill="#333">u</text>

  <!-- v (forbidden, red + strike) -->
  <rect x="425" y="178" width="16" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="433" y="194" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">v</text>
  <line x1="427" y1="182" x2="441" y2="196" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- w (forbidden, red + strike) -->
  <rect x="443" y="178" width="16" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="451" y="194" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">w</text>
  <line x1="445" y1="182" x2="459" y2="196" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>

  <rect x="461" y="178" width="16" height="22" fill="#e6f4ea" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="469" y="194" text-anchor="middle" font-size="11" fill="#333">x</text>
  <rect x="479" y="178" width="16" height="22" fill="#e6f4ea" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="487" y="194" text-anchor="middle" font-size="11" fill="#333">y</text>
  <rect x="497" y="178" width="16" height="22" fill="#e6f4ea" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="505" y="194" text-anchor="middle" font-size="11" fill="#333">z</text>

  <!-- Count label -->
  <text x="280" y="226" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">26 − 2 = 24 个字母可选 ⇒ 局部必然有解</text>

  <!-- Key insight box -->
  <rect x="30" y="244" width="500" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="50" y="266" font-size="12" fill="#444" font-weight="bold">贪心安全性：从左到右替换，无需回溯</text>
  <text x="50" y="288" font-size="11" fill="#666">① 每个 '?' 至多被左、右 2 个邻居约束 → 禁 ≤ 2 字母 → 剩 ≥ 24 可选</text>
  <text x="50" y="308" font-size="11" fill="#666">② 替换 s[i] 时左邻居已定；右邻居若仍是 '?' 则不构成约束（'?' ≠ 字母）</text>
  <text x="50" y="330" font-size="11" fill="#666">③ 每次选择最多给下一个 '?' 增加 1 条禁令，仍剩 ≥ 24 → 永不走进死胡同</text>
  <text x="50" y="352" font-size="12" fill="#b85450" font-weight="bold">→ 选首个与左右都不同的字母即可，无需回溯</text>
</svg>
