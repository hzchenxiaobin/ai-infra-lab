<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="560" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：前后缀分解 + 双指针计数</text>

  <!-- 开始 -->
  <rect x="215" y="42" width="90" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.5" rx="15" filter="url(#rough2)"/>
  <text x="260" y="61" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M 260 72 L 260 88" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 求 x -->
  <rect x="140" y="92" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="113" text-anchor="middle" font-size="12" fill="#33506e" filter="url(#rough2)">一趟扫描求 x（递增前缀末尾）</text>
  <path d="M 260 126 L 260 142" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形：整体递增？ -->
  <polygon points="260,146 380,182 260,218 140,182" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="187" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">x == n-1 ?</text>

  <path d="M 380 182 L 404 182" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="174" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="408" y="162" width="100" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="458" y="179" text-anchor="middle" font-size="11" fill="#7a2e2a" filter="url(#rough2)">返回</text>
  <text x="458" y="195" text-anchor="middle" font-size="11" fill="#7a2e2a" filter="url(#rough2)">n(n+1)/2</text>

  <path d="M 260 218 L 260 234" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="230" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">否</text>

  <!-- 求 y -->
  <rect x="140" y="238" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="259" text-anchor="middle" font-size="12" fill="#33506e" filter="url(#rough2)">一趟扫描求 y（递增后缀起点）</text>
  <path d="M 260 272 L 260 288" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- l=0 记账 -->
  <rect x="130" y="292" width="260" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="313" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">ans = n - y + 1（l = 0 的贡献）</text>
  <path d="M 260 326 L 260 342" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环菱形 -->
  <polygon points="260,346 380,380 260,414 140,380" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="385" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">l ≤ x+1 ?</text>

  <path d="M 380 380 L 402 380" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="372" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="406" y="362" width="100" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="456" y="385" text-anchor="middle" font-size="12" fill="#7a2e2a" filter="url(#rough2)">返回 ans</text>

  <path d="M 260 414 L 260 430" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="426" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">是</text>

  <!-- 推进 k -->
  <rect x="125" y="434" width="270" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="450" text-anchor="middle" font-size="11" fill="#33506e" filter="url(#rough2)">while k &lt; n 且 nums[k] ≤ nums[l-1]：k++</text>
  <text x="260" y="466" text-anchor="middle" font-size="10" fill="#66788c" filter="url(#rough2)">（后缀中找第一个大于 nums[l-1] 的下标）</text>
  <path d="M 260 474 L 260 488" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 记账 -->
  <rect x="125" y="492" width="270" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="508" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">ans += n - max(l, k-1)</text>
  <text x="260" y="524" text-anchor="middle" font-size="10" fill="#5a7a50" filter="url(#rough2)">（k = n 时公式自动退化为 1）</text>

  <!-- 回环 -->
  <path d="M 260 532 L 260 546 L 78 546 L 78 380 L 136 380" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="88" y="540" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">l++</text>
</svg>
