<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n2"/>
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="2"/>
    </filter>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="880" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">三种「行寻址」模型：如何精确定位第 10 行</text>
  <path d="M 230 46 Q 440 54 650 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ============ shared file.txt column ============ -->
  <text x="70" y="84" font-size="12" fill="#888">file.txt（行号 = NR）</text>
  <g filter="url(#sk)">
    <rect x="44" y="92" width="120" height="226" rx="8" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.4" stroke-dasharray="4 3"/>
  </g>
  <!-- line rows -->
  <g font-size="11" font-family="'Courier New',monospace" fill="#333">
    <text x="58" y="116">Line 1</text>
    <text x="58" y="134">Line 2</text>
    <text x="58" y="152">Line 3</text>
    <text x="58" y="170">Line 4</text>
    <text x="58" y="188">Line 5</text>
    <text x="58" y="206">Line 6</text>
    <text x="58" y="224">Line 7</text>
    <text x="58" y="242">Line 8</text>
    <text x="58" y="260">Line 9</text>
  </g>
  <!-- highlighted line 10 -->
  <g filter="url(#sk)">
    <rect x="50" y="270" width="108" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="58" y="286" font-size="12" font-weight="bold" fill="#d6a040" font-family="'Courier New',monospace">Line 10</text>
  <text x="58" y="308" font-size="11" fill="#999" font-family="'Courier New',monospace">Line 11</text>
  <text x="58" y="326" font-size="11" fill="#999" font-family="'Courier New',monospace">Line 12</text>
  <text x="100" y="350" text-anchor="middle" font-size="10" fill="#aaa">目标：第 10 行</text>

  <!-- ============ Model A: awk NR==10 ============ -->
  <text x="300" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">A. awk 谓词过滤</text>
  <g filter="url(#sk)">
    <rect x="210" y="92" width="190" height="148" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="305" y="120" text-anchor="middle" font-size="12" fill="#446688">逐行读取，维护计数器</text>
  <text x="305" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e" font-family="'Courier New',monospace">NR</text>
  <text x="305" y="166" text-anchor="middle" font-size="11" fill="#888">每读一行 NR++</text>
  <g filter="url(#sk)">
    <rect x="232" y="180" width="146" height="26" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="305" y="198" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" font-family="'Courier New',monospace">NR==10 ? print</text>
  <text x="305" y="226" text-anchor="middle" font-size="10" fill="#446688">条件为真才输出</text>
  <text x="305" y="262" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" font-family="'Courier New',monospace">awk 'NR==10'</text>
  <text x="305" y="284" text-anchor="middle" font-size="10" fill="#888">行数 &lt; 10 → 无匹配 → 空</text>

  <!-- ============ Model B: sed -n 10p ============ -->
  <text x="560" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">B. sed 地址 + 命令</text>
  <g filter="url(#sk)">
    <rect x="470" y="92" width="190" height="148" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="565" y="120" text-anchor="middle" font-size="12" fill="#4a7a3a">地址定位 + 动作</text>
  <g filter="url(#sk)">
    <rect x="488" y="134" width="50" height="26" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="513" y="152" text-anchor="middle" font-size="14" font-weight="bold" fill="#d6a040" font-family="'Courier New',monospace">10</text>
  <text x="555" y="152" font-size="14" fill="#888" font-family="'Courier New',monospace">→</text>
  <g filter="url(#sk)">
    <rect x="572" y="134" width="64" height="26" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="604" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" font-family="'Courier New',monospace">p</text>
  <text x="513" y="178" text-anchor="middle" font-size="10" fill="#888">地址</text>
  <text x="604" y="178" text-anchor="middle" font-size="10" fill="#888">print 命令</text>
  <text x="565" y="206" text-anchor="middle" font-size="11" fill="#4a7a3a">-n 关闭自动输出</text>
  <text x="565" y="226" text-anchor="middle" font-size="11" fill="#4a7a3a">仅 10 号地址触发 p</text>
  <text x="565" y="262" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" font-family="'Courier New',monospace">sed -n '10p'</text>
  <text x="565" y="284" text-anchor="middle" font-size="10" fill="#888">无第 10 行 → 不触发 → 空</text>

  <!-- ============ Model C: tail + head ============ -->
  <text x="800" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">C. tail 范围 + head</text>
  <g filter="url(#sk)">
    <rect x="710" y="92" width="190" height="148" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="805" y="120" text-anchor="middle" font-size="12" fill="#b85450">从第 10 行起截断</text>
  <g filter="url(#sk)">
    <rect x="730" y="134" width="150" height="26" rx="6" fill="#ffffff" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="805" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" font-family="'Courier New',monospace">tail -n +10</text>
  <text x="805" y="178" text-anchor="middle" font-size="10" fill="#888">+10 = 第 10 行到末尾</text>
  <text x="805" y="200" text-anchor="middle" font-size="11" fill="#b85450">→ 取首行 = 第 10 行</text>
  <g filter="url(#sk)">
    <rect x="740" y="212" width="130" height="24" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="805" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" font-family="'Courier New',monospace">| head -n 1</text>
  <text x="805" y="262" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e" font-family="'Courier New',monospace">tail -n +10 | head -n 1</text>
  <text x="805" y="284" text-anchor="middle" font-size="10" fill="#888">行数 &lt; 10 → 空输入 → 空</text>

  <!-- arrows from file to each model -->
  <path d="M 166 178 Q 188 178 206 178" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 166 178 Q 318 178 466 178" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 166 178 Q 438 178 706 178" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ============ bottom summary callout ============ -->
  <g filter="url(#sk)">
    <rect x="44" y="310" width="800" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="60" y="334" font-size="12" fill="#7a5415">三种模型本质相同：都在「行序」上做一次寻址，差异在于寻址语言——</text>
  <text x="60" y="354" font-size="11.5" fill="#7a5415">awk 用<b>谓词</b>（NR==10）· sed 用<b>地址</b>（10）· tail 用<b>范围起点</b>（+10）。三者对「行数 &lt; 10」都天然输出空。</text>
</svg>
