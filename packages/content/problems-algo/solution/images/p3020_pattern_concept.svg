<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">模式长啥样：一座「指数倍增」的山峰</text>

  <!-- generic pattern bar -->
  <rect x="45" y="38" width="430" height="28" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="260" y="57" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">[ x, x², x⁴, …, x<tspan dy="-5" font-size="9">2m</tspan><tspan dy="5">, …, x⁴, x², x ]　指数 1, 2, 4, …, 2m 全是 2 的幂</tspan></text>

  <!-- mountain: [2, 4, 16, 4, 2] -->
  <text x="260" y="80" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">峰顶只出现 1 次</text>
  <path d="M 260 84 L 260 94" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <rect x="82" y="98" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="108" y="120" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="158" y="132" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="184" y="154" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="234" y="98" width="52" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="120" text-anchor="middle" font-size="15" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">16</text>
  <rect x="310" y="132" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="336" y="154" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="386" y="98" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="412" y="120" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- symmetric pair dashed links -->
  <path d="M 108 176 C 108 196, 412 196, 412 176" stroke="#446688" stroke-width="1.2" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <path d="M 184 168 C 184 188, 336 188, 336 168" stroke="#4a7a3a" stroke-width="1.2" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <text x="260" y="222" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">两侧完全对称：每个非峰顶的值恰好出现 2 次（两个 2、两个 4）</text>
  <text x="260" y="242" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">指数 1 → 2 → 4，每步 ×2，必须都是 2 的幂</text>

  <!-- example rows -->
  <text x="48" y="284" text-anchor="start" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">[3, 9, 3]：</text>
  <rect x="118" y="266" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="133" y="285" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <rect x="154" y="266" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="169" y="285" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">9</text>
  <rect x="190" y="266" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="205" y="285" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="238" y="285" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">9 = 3²，指数 2 ✓</text>
  <text x="175" y="316" text-anchor="middle" font-size="19" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <text x="290" y="284" text-anchor="start" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">[2, 4, 8, 4, 2]：</text>
  <rect x="382" y="266" width="26" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="395" y="285" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">2</text>
  <rect x="412" y="266" width="26" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="425" y="285" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">4</text>
  <rect x="442" y="266" width="26" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="455" y="285" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">8</text>
  <path d="M 442 268 L 466 292 M 466 268 L 442 292" stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="455" y="314" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">8 = 2³，指数 3 不是 2 的幂 ✗</text>
  <text x="492" y="285" text-anchor="middle" font-size="19" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <!-- bottom warning -->
  <rect x="40" y="330" width="440" height="58" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="353" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">⚠️ 模式长度恒为奇数：峰顶 1 份 + 左右各 m 层 × 2 份 = 2m + 1</text>
  <text x="260" y="374" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">像 [2, 4, 4, 2] 这种偶数长度的「回文」没有唯一峰顶，不合法</text>
</svg>
