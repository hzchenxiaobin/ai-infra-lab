<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="250" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：定左端点 l，向右增量维护 g / mn / cnt</text>

  <!-- 枚举 l -->
  <rect x="185" y="30" width="150" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="47" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">枚举左端点 l = 0 … n−1</text>
  <path d="M260,56 L260,68" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="170" y="72" width="180" height="26" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="89" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">g = 0, mn = 30, cnt = 0</text>
  <path d="M260,98 L260,108" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- r 循环 -->
  <rect x="155" y="112" width="210" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="129" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">r 从 l 到 n−1，取 x = nums[r]</text>
  <path d="M260,138 L260,148" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 增量维护 -->
  <rect x="135" y="152" width="250" height="46" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="170" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">v = v2(x)；g = gcd(g, x)</text>
  <text x="260" y="188" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">v &lt; mn → 重置 (mn,cnt)=(v,1)；v = mn → cnt++</text>
  <path d="M260,198 L260,208" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 打分 -->
  <rect x="155" y="212" width="210" height="26" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="229" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">score = (r − l + 1) × g</text>
  <path d="M260,238 L260,248" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <path d="M260,246 L340,272 L260,298 L180,272 z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="276" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">cnt ≤ k ?</text>

  <!-- 是分支 -->
  <text x="348" y="263" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M340,272 L368,272" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="372" y="258" width="118" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="431" y="276" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">score ×= 2</text>

  <!-- 否分支 -->
  <path d="M260,298 L260,314" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="270" y="312" font-size="9.5" fill="#b85450" filter="url(#rough2)">否：GCD 抬不动</text>

  <!-- 汇入 ans -->
  <path d="M431,286 C431,306 400,316 372,329" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="155" y="316" width="213" height="26" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="261" y="333" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">ans = max(ans, score)</text>

  <!-- 循环回边 -->
  <path d="M260,342 L260,356 L470,356 L470,125 L371,125" stroke="#446688" stroke-width="1.2" stroke-dasharray="5 4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="482" y="230" font-size="9.5" fill="#446688" transform="rotate(90 482 230)" text-anchor="middle" filter="url(#rough2)">r+1；r 用尽则 l+1 重新初始化</text>

  <!-- 返回 -->
  <path d="M155,329 L134,329" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="93" y="311" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">l 全枚举完</text>
  <rect x="28" y="316" width="104" height="26" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="333" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">返回 ans</text>
</svg>
