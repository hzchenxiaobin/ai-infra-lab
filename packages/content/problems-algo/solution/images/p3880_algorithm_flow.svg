<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="16" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold" filter="url(#rough2)">流程：一趟扫描 + 两个「最近下标」指针，收尾判一次哨兵</text>

  <rect x="228" y="24" width="64" height="24" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">开始</text>

  <path d="M 260 48 L 260 56" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="58" width="240" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="76" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">last1 ← −1，last2 ← −1，ans ← n（哨兵）</text>

  <path d="M 260 86 L 260 92" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="175" y="94" width="170" height="26" rx="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="111" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">对每个下标 k = 0 … n−1</text>

  <path d="M 260 120 L 260 126" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,128 352,160 260,192 168,160" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="164" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">nums[k] = ?</text>

  <path d="M 260 192 L 260 202" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="52" y="204" width="416" height="64" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>

  <rect x="62" y="212" width="30" height="17" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="77" y="224" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">=1</text>
  <text x="100" y="224" font-size="9.5" fill="#333" filter="url(#rough2)">last2 ≥ 0 ⇒ ans = min(ans, k − last2)；然后 last1 ← k</text>

  <rect x="62" y="234" width="30" height="17" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="77" y="246" text-anchor="middle" font-size="9.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">=2</text>
  <text x="100" y="246" font-size="9.5" fill="#333" filter="url(#rough2)">last1 ≥ 0 ⇒ ans = min(ans, k − last1)；然后 last2 ← k</text>

  <rect x="62" y="256" width="30" height="17" rx="4" fill="#f5f5f5" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="77" y="268" text-anchor="middle" font-size="9.5" fill="#777" font-weight="bold" filter="url(#rough2)">=0</text>
  <text x="100" y="268" font-size="9.5" fill="#777" filter="url(#rough2)">既不是 1 也不是 2，直接跳过</text>

  <path d="M 260 268 L 260 278" fill="none" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="260" cy="278" r="2.5" fill="#888" filter="url(#rough2)"/>

  <path d="M 260 278 L 36 278 L 36 107 L 171 107" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="110" y="272" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">下一个 k</text>

  <path d="M 260 278 L 260 286" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="284" font-size="9" fill="#888" filter="url(#rough2)">k = n，扫完</text>

  <polygon points="260,288 336,310 260,332 184,310" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="314" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">ans == n ?</text>

  <path d="M 336 310 L 350 310" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="340" y="302" text-anchor="middle" font-size="9" fill="#a0433f" filter="url(#rough2)">是</text>
  <rect x="354" y="299" width="96" height="22" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="402" y="314" text-anchor="middle" font-size="10.5" fill="#a0433f" font-weight="bold" filter="url(#rough2)">返回 −1</text>

  <path d="M 260 332 L 260 340" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="248" y="340" text-anchor="end" font-size="9" fill="#2f5d24" filter="url(#rough2)">否</text>
  <rect x="204" y="341" width="112" height="19" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="354" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 ans ✓</text>

  <text x="440" y="270" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">n 本身不可达：</text>
  <text x="440" y="282" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">|i−j| ≤ n−1 &lt; n</text>
</svg>
