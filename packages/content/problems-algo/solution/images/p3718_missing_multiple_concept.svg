<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：沿数轴跳跃枚举倍数，集合 O(1) 判定</text>

  <text x="260" y="44" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">nums = [8,2,3,4,6]，k = 2</text>

  <!-- 哈希集合 -->
  <rect x="100" y="54" width="280" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="124" y="83" font-size="13" fill="#446688" filter="url(#rough2)">S =</text>
  <rect x="150" y="63" width="36" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="168" y="83" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="190" y="63" width="36" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="208" y="83" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="230" y="63" width="36" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="248" y="83" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="270" y="63" width="36" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="288" y="83" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <rect x="310" y="63" width="36" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="328" y="83" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>

  <path d="M 260 102 L 260 128" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="120" font-size="10" fill="#666" filter="url(#rough2)">候选 m 逐个查集合（O(1)）</text>

  <!-- 数轴 -->
  <path d="M 40 210 L 472 210" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 跳跃弧线 -->
  <path d="M 86 202 Q 105 172 124 202" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 156 202 Q 175 172 194 202" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 226 202 Q 245 172 264 202" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 296 202 Q 314 172 330 198" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="175" y="162" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">m += k（步长 = k）</text>

  <!-- 倍数节点 -->
  <circle cx="70" cy="210" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="215" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <circle cx="140" cy="210" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="215" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <circle cx="210" cy="210" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="215" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <circle cx="280" cy="210" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="215" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>

  <rect x="330" y="190" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="350" y="215" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">10</text>

  <circle cx="424" cy="210" r="16" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="424" y="215" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">12</text>
  <text x="452" y="214" font-size="13" fill="#999" filter="url(#rough2)">…</text>

  <!-- 判定标注 -->
  <text x="175" y="252" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓ 在 S 中（被挡）</text>
  <text x="350" y="252" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗ 不在 S</text>
  <text x="424" y="250" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">未检查</text>

  <!-- 答案横幅 -->
  <rect x="130" y="262" width="260" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="281" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">答案 = 第一个落空的候选 = 10</text>

  <!-- 鸽巢原理说明 -->
  <rect x="15" y="300" width="490" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">鸽巢：前 n+1 个倍数至多被 n 个元素挡住 ⇒ 答案 ≤ (n+1)·k，循环至多 n+1 轮</text>
  <text x="260" y="334" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">本题值域 ≤ 100 ⇒ 任何 m &gt; 100 必缺失，答案 ≤ 100 + k</text>

  <text x="16" y="354" font-size="10" fill="#999" filter="url(#rough2)">⚠️ 3 ∈ S 但不是 k 的倍数 → 永远轮不到它；判定只发生在候选序列 k, 2k, 3k, … 上</text>
</svg>
