<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：一次 BFS + 一次快速幂</text>

  <!-- 主流程（左侧竖排） -->
  <g filter="url(#rough2)">
    <ellipse cx="150" cy="66" rx="44" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="150" y="71" text-anchor="middle" font-size="13" fill="#446688">开始</text>

    <rect x="76" y="106" width="148" height="44" rx="8" fill="#fafafa" stroke="#446688" stroke-width="1.6"/>
    <text x="150" y="124" text-anchor="middle" font-size="12.5" fill="#333">建邻接表 g</text>
    <text x="150" y="141" text-anchor="middle" font-size="11" fill="#888">edges → g[u].push(v)…</text>

    <rect x="76" y="172" width="148" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="150" y="190" text-anchor="middle" font-size="12.5" fill="#333">BFS 从节点 1 出发</text>
    <text x="150" y="207" text-anchor="middle" font-size="11" fill="#888">逐层记录深度 depth[v]</text>

    <polygon points="150,238 214,272 150,306 86,272" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="150" y="268" text-anchor="middle" font-size="12" fill="#4a7a3a">d = 最大深度</text>
    <text x="150" y="285" text-anchor="middle" font-size="11" fill="#888">n ≥ 2 ⇒ d ≥ 1</text>

    <rect x="76" y="324" width="148" height="0" rx="8" fill="none" stroke="none"/>

    <rect x="76" y="322" width="148" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="150" y="342" text-anchor="middle" font-size="12.5" fill="#333">返回 2^(d−1) mod 10⁹+7</text>
  </g>

  <path d="M 150 86 L 150 104" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 150 150 L 150 170" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 150 216 L 150 236" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 150 306 L 150 320" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 右侧提示框 -->
  <g filter="url(#rough2)">
    <rect x="268" y="96" width="232" height="70" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="280" y="118" font-size="13" fill="#b85450">⚠️ 别用递归 DFS</text>
    <text x="280" y="136" font-size="12" fill="#333">n 可达 10⁵，链状树递归深度同阶，</text>
    <text x="280" y="154" font-size="12" fill="#333">Python 默认栈深 1000 会爆栈</text>

    <rect x="268" y="184" width="232" height="70" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="206" font-size="13" fill="#446688">💡 答案只依赖 d</text>
    <text x="280" y="224" font-size="12" fill="#333">所有最深节点路径长度都是 d，</text>
    <text x="280" y="242" font-size="12" fill="#333">选哪个 x 结果相同，无须枚举</text>

    <rect x="268" y="272" width="232" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="280" y="294" font-size="13" fill="#4a7a3a">⚡ 快速幂 O(log d)</text>
    <text x="280" y="312" font-size="12" fill="#333">C++ 手写；Python 直接</text>
    <text x="280" y="326" font-size="12" fill="#333">pow(2, d−1, MOD) 三参内置</text>
  </g>

  <path d="M 226 194 C 244 190, 250 180, 264 170" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
</svg>
