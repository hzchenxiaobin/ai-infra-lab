<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例 1：points = [[3,10],[5,15],[10,2],[4,4]]</text>

  <!-- 上表：变换与极值 -->
  <text x="30" y="50" font-size="11" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">变换 u = x−y，v = x+y（★ = 极值点）</text>

  <rect x="30" y="58" width="480" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="50" y="74" font-size="10" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="115" y="74" font-size="10" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">(x, y)</text>
  <text x="225" y="74" font-size="10" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">u = x−y</text>
  <text x="335" y="74" font-size="10" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">v = x+y</text>
  <text x="430" y="74" font-size="10" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">角色</text>

  <rect x="30" y="82" width="480" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="50" y="99" font-size="10" fill="#555" filter="url(#rough2)">0</text>
  <text x="115" y="99" font-size="10" fill="#555" filter="url(#rough2)">(3, 10)</text>
  <text x="225" y="99" font-size="10" fill="#555" filter="url(#rough2)">−7</text>
  <text x="335" y="99" font-size="10" fill="#555" filter="url(#rough2)">13</text>
  <text x="408" y="99" font-size="9" fill="#999" filter="url(#rough2)">非极值：删了直径不变</text>

  <rect x="30" y="108" width="480" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <rect x="205" y="108" width="90" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <rect x="315" y="108" width="90" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="50" y="125" font-size="10" fill="#555" filter="url(#rough2)">1</text>
  <text x="115" y="125" font-size="10" fill="#555" filter="url(#rough2)">(5, 15)</text>
  <text x="225" y="125" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">−10 ★</text>
  <text x="335" y="125" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">20 ★</text>
  <text x="408" y="125" font-size="9" fill="#555" filter="url(#rough2)">min u &amp; max v</text>

  <rect x="30" y="134" width="480" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <rect x="205" y="134" width="90" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="50" y="151" font-size="10" fill="#555" filter="url(#rough2)">2</text>
  <text x="115" y="151" font-size="10" fill="#555" filter="url(#rough2)">(10, 2)</text>
  <text x="225" y="151" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">8 ★</text>
  <text x="335" y="151" font-size="10" fill="#555" filter="url(#rough2)">12</text>
  <text x="408" y="151" font-size="9" fill="#555" filter="url(#rough2)">max u</text>

  <rect x="30" y="160" width="480" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <rect x="315" y="160" width="90" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="50" y="177" font-size="10" fill="#555" filter="url(#rough2)">3</text>
  <text x="115" y="177" font-size="10" fill="#555" filter="url(#rough2)">(4, 4)</text>
  <text x="225" y="177" font-size="10" fill="#555" filter="url(#rough2)">0</text>
  <text x="335" y="177" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">8 ★</text>
  <text x="408" y="177" font-size="9" fill="#555" filter="url(#rough2)">min v</text>

  <!-- top-2 记录 -->
  <text x="30" y="208" font-size="10" fill="#8a6d3b" filter="url(#rough2)">top-2 记录：u 的 max 8 / 次 0，min −10 / 次 −7；v 的 max 20 / 次 13，min 8 / 次 12</text>
  <text x="30" y="226" font-size="10" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">候选 C = {2, 1, 3} —— 点 0 是非极值点，删它直径不变，跳过</text>

  <!-- 下表：候选核对 -->
  <text x="30" y="254" font-size="11" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">逐候选核对（被删极值换用次值）</text>

  <rect x="30" y="262" width="480" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="50" y="278" font-size="10" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">删除</text>
  <text x="175" y="278" font-size="10" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">range′ᵤ</text>
  <text x="290" y="278" font-size="10" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">range′ᵥ</text>
  <text x="400" y="278" font-size="10" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">max</text>

  <rect x="30" y="286" width="480" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="2" filter="url(#rough2)"/>
  <text x="50" y="303" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">i = 2 (max u)</text>
  <text x="175" y="303" font-size="10" fill="#2f5d24" filter="url(#rough2)">0−(−10) = 10</text>
  <text x="290" y="303" font-size="10" fill="#2f5d24" filter="url(#rough2)">20−8 = 12</text>
  <text x="400" y="303" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">12 ✓</text>

  <rect x="30" y="312" width="480" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="50" y="329" font-size="10" fill="#555" filter="url(#rough2)">i = 1 (min u, max v)</text>
  <text x="175" y="329" font-size="10" fill="#555" filter="url(#rough2)">8−(−7) = 15</text>
  <text x="290" y="329" font-size="10" fill="#555" filter="url(#rough2)">13−8 = 5</text>
  <text x="400" y="329" font-size="10" fill="#555" filter="url(#rough2)">15</text>

  <rect x="30" y="338" width="480" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="50" y="355" font-size="10" fill="#555" filter="url(#rough2)">i = 3 (min v)</text>
  <text x="175" y="355" font-size="10" fill="#555" filter="url(#rough2)">8−(−10) = 18</text>
  <text x="290" y="355" font-size="10" fill="#555" filter="url(#rough2)">20−12 = 8</text>
  <text x="400" y="355" font-size="10" fill="#555" filter="url(#rough2)">18</text>

  <!-- 结论 -->
  <rect x="30" y="382" width="480" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="400" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">ans = min(12, 15, 18) = 12</text>
  <text x="260" y="418" text-anchor="middle" font-size="9.5" fill="#8a6d3b" filter="url(#rough2)">删掉 (10, 2) 后，最远点对变为 (5, 15) 与 (4, 4)</text>
</svg>
