<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>

  <text x="30" y="22" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：23 全过返回 true；39 在 k = 1 就短路</text>

  <!-- 面板一：num = 23 -->
  <rect x="20" y="38" width="252" height="170" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="36" y="58" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">① num = 23（n = 2）</text>

  <rect x="36" y="68" width="222" height="76" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 36 92 L 258 92" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 36 118 L 258 118" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 78 68 L 78 144" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 120 68 L 120 144" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 162 68 L 162 144" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 204 68 L 204 144" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <text x="57" y="84" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">k</text>
  <text x="99" y="84" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">前缀</text>
  <text x="141" y="84" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">质数?</text>
  <text x="183" y="84" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">后缀</text>
  <text x="231" y="84" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">质数?</text>

  <text x="57" y="108" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">1</text>
  <text x="99" y="108" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">2</text>
  <text x="141" y="108" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="183" y="108" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">3</text>
  <text x="231" y="108" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <text x="57" y="134" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">2</text>
  <text x="99" y="134" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">23</text>
  <text x="141" y="134" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="183" y="134" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">23</text>
  <text x="231" y="134" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <text x="36" y="170" font-size="10.5" fill="#33506b" filter="url(#rough2)">前缀 2, 23 与后缀 3, 23 都是质数</text>
  <text x="36" y="194" font-size="12.5" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">⇒ return true</text>

  <!-- 面板二：num = 39 -->
  <rect x="288" y="38" width="252" height="170" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="304" y="58" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">② num = 39（n = 2）</text>

  <rect x="304" y="68" width="222" height="76" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 304 92 L 526 92" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 304 118 L 526 118" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 346 68 L 346 144" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 388 68 L 388 144" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 430 68 L 430 144" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 472 68 L 472 144" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>

  <text x="325" y="84" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">k</text>
  <text x="367" y="84" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">前缀</text>
  <text x="409" y="84" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">质数?</text>
  <text x="451" y="84" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">后缀</text>
  <text x="499" y="84" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">质数?</text>

  <text x="325" y="108" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">1</text>
  <text x="367" y="108" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">3</text>
  <text x="409" y="108" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="451" y="108" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">9</text>
  <text x="499" y="108" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <text x="325" y="134" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">2</text>
  <text x="367" y="134" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">39</text>
  <text x="409" y="134" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>
  <text x="451" y="134" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">39</text>
  <text x="499" y="134" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>
  <path d="M 308 121 L 522 141" stroke="#999" stroke-width="1" opacity="0.55" filter="url(#rough2)"/>
  <text x="304" y="158" font-size="9.5" fill="#999" filter="url(#rough2)">k = 2 还没轮到就短路了</text>

  <text x="304" y="178" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">k = 1 时后缀 9 = 3×3 不是质数</text>
  <text x="304" y="198" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">⇒ 立即 return false（短路）</text>

  <!-- 面板三：个位数 -->
  <rect x="20" y="224" width="520" height="88" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="36" y="246" font-size="12" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">③ 个位数：前缀 = 后缀 = 自身，判一次即可</text>
  <text x="36" y="272" font-size="10.5" fill="#2d5a24" filter="url(#rough2)">• num = 7：7 是质数 ⇒ true；num = 2, 3, 5 同理</text>
  <text x="36" y="296" font-size="10.5" fill="#2d5a24" filter="url(#rough2)">• num = 1：1 不是质数（质数须大于 1 且恰有两个因子）⇒ false</text>
</svg>
