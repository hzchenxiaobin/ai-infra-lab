<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：search(".ad") 与 search("b..")</text>

  <!-- ============ Left panel: search(".ad") ============ -->
  <rect x="16" y="42" width="264" height="356" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="5,3" rx="10" filter="url(#rough2)"/>
  <text x="148" y="62" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">search(".ad") → true</text>

  <!-- mini Trie: root at (148, 92) -->
  <g filter="url(#rough2)"><circle cx="148" cy="92" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="148" y="96" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">root</text>

  <!-- level1 b/d/m -->
  <path d="M 140 104 L 104 130" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 148 105 L 148 128" stroke="#d6a040" stroke-width="1.2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 156 104 L 192 130" stroke="#d6a040" stroke-width="1.2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <g filter="url(#rough2)"><circle cx="100" cy="138" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="100" y="142" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">b</text>
  <g filter="url(#rough2)"><circle cx="148" cy="138" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/></g>
  <text x="148" y="142" text-anchor="middle" font-size="9" fill="#888">d</text>
  <g filter="url(#rough2)"><circle cx="196" cy="138" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/></g>
  <text x="196" y="142" text-anchor="middle" font-size="9" fill="#888">m</text>

  <text x="148" y="162" text-anchor="middle" font-size="9" fill="#d6a040">① '.' 分叉 b/d/m</text>

  <!-- level2 a (only b's path highlighted green) -->
  <path d="M 100 149 L 100 172" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><circle cx="100" cy="182" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="100" y="186" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">a</text>
  <text x="118" y="178" font-size="9" fill="#4a7a3a">② a 确定</text>

  <!-- level3 d★ -->
  <path d="M 100 193 L 100 216" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><circle cx="100" cy="226" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="100" y="230" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">d★</text>
  <text x="118" y="222" font-size="9" fill="#4a7a3a">③ is_end</text>

  <!-- result box -->
  <rect x="40" y="262" width="216" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="148" y="284" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">b→a→d★ 命中 → return true</text>

  <!-- note: short-circuit -->
  <rect x="40" y="306" width="216" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="148" y="324" text-anchor="middle" font-size="10" fill="#b85450">短路：第一条分支命中即返回</text>
  <text x="148" y="338" text-anchor="middle" font-size="9" fill="#888">不再试 d / m 分支</text>

  <!-- ============ Right panel: search("b..") ============ -->
  <rect x="296" y="42" width="248" height="356" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" stroke-dasharray="5,3" rx="10" filter="url(#rough2)"/>
  <text x="420" y="62" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">search("b..") → true</text>

  <!-- mini Trie: root at (420, 92) -->
  <g filter="url(#rough2)"><circle cx="420" cy="92" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="420" y="96" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">root</text>

  <!-- level1: b determined (blue), d/m dimmed -->
  <path d="M 412 104 L 376 130" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><circle cx="372" cy="138" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="372" y="142" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">b</text>
  <text x="392" y="128" font-size="9" fill="#446688">① b 确定</text>

  <g filter="url(#rough2)"><circle cx="420" cy="138" r="11" fill="#f0f0f0" stroke="#bbb" stroke-width="1"/></g>
  <text x="420" y="142" text-anchor="middle" font-size="9" fill="#bbb">d</text>
  <g filter="url(#rough2)"><circle cx="468" cy="138" r="11" fill="#f0f0f0" stroke="#bbb" stroke-width="1"/></g>
  <text x="468" y="142" text-anchor="middle" font-size="9" fill="#bbb">m</text>

  <!-- level2: a (only one under b, '.' matches it) -->
  <path d="M 372 149 L 372 172" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><circle cx="372" cy="182" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="372" y="186" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">a</text>
  <text x="390" y="178" font-size="9" fill="#d6a040">② '.'→a 唯一非空</text>

  <!-- level3: d★ -->
  <path d="M 372 193 L 372 216" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><circle cx="372" cy="226" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="372" y="230" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">d★</text>
  <text x="390" y="222" font-size="9" fill="#4a7a3a">③ '.'→d★ is_end</text>

  <!-- result box -->
  <rect x="320" y="262" width="200" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="420" y="284" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">b→a→d★ → return true</text>

  <!-- note -->
  <rect x="320" y="306" width="200" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="420" y="324" text-anchor="middle" font-size="10" fill="#d6a040">每层 '.' 只展开非空子节点</text>
  <text x="420" y="338" text-anchor="middle" font-size="9" fill="#888">Trie 限定搜索空间</text>
</svg>
