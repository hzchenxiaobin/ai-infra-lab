<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：单调栈 + 前缀 DP（一趟扫描）</text>

  <!-- 开始 -->
  <ellipse cx="170" cy="56" rx="70" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="61" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">开始：st = []，f[·] = 0</text>

  <path d="M 170 74 L 170 84" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环判定 -->
  <polygon points="170,88 240,112 170,136 100,112" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="116" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">i &lt; n ?</text>
  <path d="M 240 112 L 344 112" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="104" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>

  <path d="M 170 136 L 170 148" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="147" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 弹栈 -->
  <rect x="86" y="152" width="168" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="170" y="166" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">弹栈：栈内重量 ≤ w[i]</text>
  <text x="170" y="180" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">者全部出栈（含相等！）</text>

  <path d="M 170 188 L 170 202" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 栈空判定 -->
  <polygon points="170,206 242,230 170,254 98,230" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="234" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">栈空 ?</text>
  <path d="M 242 230 L 316 230" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="222" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="322" y="214" width="132" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="388" y="228" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">j = -1：左侧无</text>
  <text x="388" y="241" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">严格更大者</text>

  <path d="M 170 254 L 170 264" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="263" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="98" y="268" width="144" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="170" y="286" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">j = st.top()</text>

  <!-- j=-1 分支汇入转移框 -->
  <path d="M 388 246 C 388 312 330 348 269 348" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 170 296 L 170 310" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 转移 -->
  <rect x="75" y="314" width="190" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="170" y="334" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">f[i] = max( f[i-1] ,</text>
  <text x="170" y="352" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(j ≥ 0 ? <tspan fill="#b85450" font-weight="bold">f[j-1]+1</tspan> : 0) )</text>

  <path d="M 170 366 L 170 378" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="95" y="382" width="150" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="170" y="401" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">st.push(i)，i++</text>

  <!-- 回边 -->
  <path d="M 95 397 L 44 397 L 44 112 L 94 112" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="36" y="260" text-anchor="middle" font-size="10" fill="#666" transform="rotate(-90 36 260)" filter="url(#rough2)">下一轮</text>

  <!-- 返回 -->
  <rect x="350" y="94" width="142" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="421" y="116" text-anchor="middle" font-size="11.5" fill="#2f5d25" filter="url(#rough2)">返回 f[n-1]</text>
  <text x="421" y="146" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">（f 单调不减，末项即答案）</text>

  <!-- 栈不变量示意 -->
  <text x="448" y="262" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">栈不变量：重量严格递减</text>
  <rect x="400" y="272" width="96" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="448" y="287" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">w=3 (i=4)</text>
  <rect x="400" y="296" width="96" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="448" y="311" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">w=4 (i=3)</text>
  <rect x="400" y="320" width="96" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="448" y="335" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">w=5 (i=1)</text>
  <text x="394" y="286" text-anchor="end" font-size="9.5" fill="#666" filter="url(#rough2)">栈顶</text>
  <text x="448" y="358" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">（示例 1 扫描结束后）</text>
</svg>
