<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：nums=[3,6,1,2,5], k=2 → 答案 2</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">排序后 [1,2,3,5,6]，贪心扫描两遍</text>

  <!-- ===== Sorted array (reference row) ===== -->
  <text x="18" y="68" font-size="10.5" fill="#666">排序后</text>
  <rect x="80" y="50" width="38" height="30" fill="#ffffff" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="99" y="70" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="120" y="50" width="38" height="30" fill="#ffffff" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="139" y="70" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="160" y="50" width="38" height="30" fill="#ffffff" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="179" y="70" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="200" y="50" width="38" height="30" fill="#ffffff" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="219" y="70" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <rect x="240" y="50" width="38" height="30" fill="#ffffff" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="259" y="70" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>

  <!-- ===== Pass 1 ===== -->
  <text x="18" y="108" font-size="10.5" fill="#4a7a3a" font-weight="bold">第1组</text>
  <!-- array with group1 highlighted -->
  <rect x="76" y="90" width="126" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="80" y="92" width="38" height="30" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="99" y="112" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="120" y="92" width="38" height="30" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="139" y="112" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="160" y="92" width="38" height="30" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="179" y="112" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <!-- remaining ungrouped -->
  <rect x="200" y="92" width="38" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="219" y="112" text-anchor="middle" font-size="13" fill="#aaa">5</text>
  <rect x="240" y="92" width="38" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="259" y="112" text-anchor="middle" font-size="13" fill="#aaa">6</text>
  <text x="296" y="112" font-size="10" fill="#4a7a3a">s=1, 收纳 ≤3 → {1,2,3}</text>
  <text x="296" y="124" font-size="9.5" fill="#888">5 &gt; 1+2=3 停, count=1</text>

  <!-- ===== Pass 2 ===== -->
  <text x="18" y="158" font-size="10.5" fill="#446688" font-weight="bold">第2组</text>
  <rect x="196" y="140" width="86" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="200" y="142" width="38" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="219" y="162" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <rect x="240" y="142" width="38" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="259" y="162" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <text x="296" y="162" font-size="10" fill="#446688">s=5, 收纳 ≤7 → {5,6}</text>
  <text x="296" y="174" font-size="9.5" fill="#888">6 ≤ 5+2=7 收, count=2</text>

  <!-- ===== Result ===== -->
  <rect x="40" y="190" width="440" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="213" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">i 到达 n，返回 count = 2 ⭐</text>

  <!-- ===== Counter example: k=0 ===== -->
  <text x="18" y="252" font-size="10.5" fill="#666">k=0 特例</text>
  <rect x="80" y="238" width="38" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="99" y="258" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="120" y="238" width="38" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="139" y="258" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="160" y="238" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="179" y="258" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="200" y="238" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="219" y="258" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <text x="250" y="258" font-size="10" fill="#b85450">每组上界 = s+0 = s</text>
  <text x="250" y="270" font-size="9.5" fill="#888">只能容相等值 → 每个等值桶自成一组</text>

  <!-- ===== Summary table-ish ===== -->
  <rect x="40" y="286" width="440" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="306" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">关键不变量</text>
  <text x="260" y="324" text-anchor="middle" font-size="10.5" fill="#555">排序后同组必为连续段（非连续可压缩为连续，不劣）</text>
  <text x="260" y="340" text-anchor="middle" font-size="10.5" fill="#555">每组上界 = s+k，下界 = s，差恰由首尾决定 → 贪心取满不越界</text>
  <text x="260" y="356" text-anchor="middle" font-size="10.5" fill="#555">下一组起点 = 本组首个被跳过元素，单调右移不回头</text>
</svg>
