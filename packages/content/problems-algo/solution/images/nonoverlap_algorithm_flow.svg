<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="440" height="480" fill="#fafafa"/>

  <text x="220" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">和为目标值且不重叠子数组：算法流程</text>

  <!-- Init -->
  <rect x="70" y="40" width="300" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="220" y="60" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">初始化</text>
  <text x="220" y="80" text-anchor="middle" font-size="11" fill="#555">sum = 0,  ans = 0,  seen = {0}</text>

  <path d="M 220 96 L 220 108" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Loop entry -->
  <rect x="70" y="110" width="300" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="220" y="130" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">for num in nums</text>
  <text x="220" y="146" text-anchor="middle" font-size="10.5" fill="#555">遍历每个元素</text>

  <path d="M 220 158 L 220 172" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- sum += num -->
  <rect x="100" y="176" width="240" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="220" y="199" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">sum += num</text>

  <path d="M 220 216 L 220 230" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="220,232 310,282 220,332 130,282" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="220" y="276" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">sum − target</text>
  <text x="220" y="292" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">∈ seen ?</text>

  <!-- Yes branch (left) -->
  <path d="M 130 282 L 55 282 L 55 356" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="85" y="274" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="20" y="360" width="180" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="110" y="380" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans += 1</text>
  <text x="110" y="396" text-anchor="middle" font-size="11" fill="#4a7a3a">seen.clear()</text>
  <text x="110" y="412" text-anchor="middle" font-size="11" fill="#4a7a3a">seen.add(sum)</text>

  <!-- No branch (right) -->
  <path d="M 310 282 L 385 282 L 385 356" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="355" y="274" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">否</text>

  <rect x="325" y="360" width="120" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="385" y="385" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">seen.add(sum)</text>

  <!-- Merge lines -->
  <path d="M 110 422 L 110 438 L 385 438" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <path d="M 385 400 L 385 438" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>

  <!-- Loop back -->
  <path d="M 385 438 L 415 438 L 415 132 L 372 132" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <text x="423" y="290" font-size="9.5" fill="#aaa" transform="rotate(-90 423 290)">循环</text>

  <!-- Final -->
  <text x="220" y="462" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">遍历结束 → return ans</text>
  <text x="220" y="474" text-anchor="middle" font-size="10" fill="#aaa">O(n) 时间, O(n) 空间</text>
</svg>
