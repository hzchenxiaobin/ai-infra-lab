<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：s = "abc"，shifts 三次区间移位</text>

  <!-- column headers (diff index) -->
  <text x="150" y="60" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">diff[0]</text>
  <text x="214" y="60" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">diff[1]</text>
  <text x="278" y="60" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">diff[2]</text>
  <text x="342" y="60" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">diff[3]</text>

  <!-- Row 1: shift [0,1,0] δ=-1 -->
  <text x="40" y="106" font-size="10.5" fill="#333" filter="url(#rough2)">[0,1,0] δ=−1</text>
  <rect x="124" y="90" width="52" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="110" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">−1</text>
  <rect x="188" y="90" width="52" height="30" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="214" y="110" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <rect x="252" y="90" width="52" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="278" y="110" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+1</text>
  <rect x="316" y="90" width="52" height="30" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="342" y="110" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <text x="392" y="108" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">←diff[0]+=δ</text>
  <text x="392" y="120" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">←diff[2]−=δ</text>

  <!-- Row 2: shift [1,2,1] δ=+1 -->
  <text x="40" y="144" font-size="10.5" fill="#333" filter="url(#rough2)">[1,2,1] δ=+1</text>
  <rect x="124" y="128" width="52" height="30" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="150" y="148" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">−1</text>
  <rect x="188" y="128" width="52" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="214" y="148" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+1</text>
  <rect x="252" y="128" width="52" height="30" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="278" y="148" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">+1</text>
  <rect x="316" y="128" width="52" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="342" y="148" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1</text>

  <!-- Row 3: shift [0,2,1] δ=+1  (final diff) -->
  <text x="40" y="182" font-size="10.5" fill="#333" filter="url(#rough2)">[0,2,1] δ=+1</text>
  <rect x="124" y="166" width="52" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="186" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="188" y="166" width="52" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="214" y="186" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">+1</text>
  <rect x="252" y="166" width="52" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="278" y="186" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">+1</text>
  <rect x="316" y="166" width="52" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="342" y="186" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">−2</text>
  <text x="376" y="184" font-size="9.5" fill="#888" filter="url(#rough2)">final diff</text>

  <!-- separator -->
  <line x1="40" y1="206" x2="440" y2="206" stroke="#bbb" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <path d="M 278 210 L 278 228" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="224" font-size="9.5" fill="#666" filter="url(#rough2)">前缀和</text>

  <!-- net row (3 cells) -->
  <text x="40" y="254" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">net</text>
  <rect x="124" y="238" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="258" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="188" y="238" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="214" y="258" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="252" y="238" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="278" y="258" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- s row -->
  <text x="40" y="292" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">s</text>
  <rect x="124" y="276" width="52" height="30" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="150" y="296" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a</text>
  <rect x="188" y="276" width="52" height="30" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="214" y="296" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b</text>
  <rect x="252" y="276" width="52" height="30" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="278" y="296" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">c</text>

  <!-- res row -->
  <text x="40" y="330" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">res</text>
  <rect x="124" y="314" width="52" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="334" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="188" y="314" width="52" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="214" y="334" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="252" y="314" width="52" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="278" y="334" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">e</text>

  <!-- small computation hints -->
  <text x="376" y="258" font-size="9.5" fill="#888" filter="url(#rough2)">0+1+1 的累加</text>
  <text x="376" y="296" font-size="9.5" fill="#888" filter="url(#rough2)">(0/1/2)+net</text>
  <text x="376" y="334" font-size="9.5" fill="#888" filter="url(#rough2)">mod 26 落字母</text>

  <!-- result box -->
  <rect x="100" y="362" width="340" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="388" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">最终结果 = "ace"  ✓</text>
</svg>
