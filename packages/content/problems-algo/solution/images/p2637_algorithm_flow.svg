<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：构造竞速 → 返回 race Promise</text>

  <!-- step 1: timeLimit called -->
  <rect x="220" y="48" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="320" y="72" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">timeLimit(fn, t) 被调用</text>

  <path d="M 320 90 L 320 112" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2: return async function -->
  <rect x="180" y="116" width="280" height="40" fill="#f5f5f5" stroke="#888" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="320" y="140" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">return async function(...args)</text>

  <path d="M 320 158 L 320 182" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision: limited(...args) invoked -->
  <polygon points="320,186 440,228 320,270 200,228" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="224" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">limited(...args)</text>
  <text x="320" y="242" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">被 await / .then 调用</text>

  <path d="M 200 228 L 100 228 L 100 282" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 440 228 L 540 228 L 540 282" stroke="#b85450" stroke-width="2" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <text x="110" y="266" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">发起 fn</text>
  <text x="470" y="266" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">发起超时</text>

  <!-- left lane: fn(...args) -->
  <rect x="40" y="288" width="120" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="100" y="306" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">fn(...args)</text>
  <text x="100" y="322" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">返回 Promise A</text>

  <!-- right lane: timeout promise -->
  <rect x="480" y="288" width="120" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="540" y="306" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">setTimeout</text>
  <text x="540" y="322" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">t ms 后 reject</text>

  <!-- merge into Promise.race -->
  <path d="M 100 334 L 100 358 L 260 378" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" fill="none" filter="url(#rough2)"/>
  <path d="M 540 334 L 540 358 L 380 378" stroke="#b85450" stroke-width="2" marker-end="url(#arrr)" fill="none" filter="url(#rough2)"/>

  <!-- race box -->
  <rect x="220" y="370" width="200" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="320" y="394" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">Promise.race([A, B])</text>
</svg>
