<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">层数最深叶子节点的和：最深层叶子值之和</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">最深叶子 = 深度最大且无子节点的节点（图中 7、8，深度 3）</text>

  <!-- ===== Tree ===== -->
  <text x="20" y="86" font-size="10" fill="#b85450" font-weight="bold">L0</text>
  <text x="20" y="156" font-size="10" fill="#446688" font-weight="bold">L1</text>
  <text x="20" y="226" font-size="10" fill="#4a7a3a" font-weight="bold">L2</text>
  <text x="20" y="296" font-size="10" fill="#d6a040" font-weight="bold">L3</text>

  <g font-size="12">
    <!-- edges (drawn first so nodes cover ends) -->
    <line x1="270" y1="92" x2="190" y2="150" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="270" y1="92" x2="360" y2="150" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="190" y1="162" x2="140" y2="220" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="190" y1="162" x2="240" y2="220" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="360" y1="162" x2="400" y2="220" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="140" y1="232" x2="110" y2="290" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="400" y1="232" x2="440" y2="290" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>

    <!-- root -->
    <circle cx="270" cy="80" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="270" y="85" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <!-- L1 -->
    <circle cx="190" cy="150" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="190" y="155" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <circle cx="360" cy="150" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="360" y="155" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
    <!-- L2 -->
    <circle cx="140" cy="220" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="140" y="225" text-anchor="middle" fill="#4a7a3a" font-weight="bold">4</text>
    <circle cx="240" cy="220" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="240" y="225" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>
    <circle cx="400" cy="220" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="400" y="225" text-anchor="middle" fill="#4a7a3a" font-weight="bold">6</text>
    <!-- L3 deepest leaves (highlight) -->
    <circle cx="110" cy="290" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
    <text x="110" y="295" text-anchor="middle" fill="#b85450" font-weight="bold">7</text>
    <circle cx="440" cy="290" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
    <text x="440" y="295" text-anchor="middle" fill="#b85450" font-weight="bold">8</text>

    <!-- highlight ring annotation -->
    <text x="110" y="320" text-anchor="middle" font-size="9" fill="#b85450">最深层叶子</text>
    <text x="440" y="320" text-anchor="middle" font-size="9" fill="#b85450">最深层叶子</text>
  </g>

  <!-- deepest layer bracket -->
  <path d="M 80 308 Q 80 318 95 318 L 455 318 Q 470 318 470 308" stroke="#b85450" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="275" y="316" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">深度 3 = 最大深度 → 7 + 8 = 15</text>

  <!-- ===== Approach boxes ===== -->
  <rect x="30" y="346" width="235" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="48" y="366" font-size="11" fill="#4a7a3a" font-weight="bold">思路 A：BFS 逐层求和</text>
  <text x="48" y="384" font-size="10" fill="#333">复用 102 层序遍历模板</text>
  <text x="48" y="400" font-size="10" fill="#333">每层开始 sum = 0 重置</text>
  <text x="48" y="416" font-size="10" fill="#333">最后一层结束时的 sum 即答案</text>

  <rect x="275" y="346" width="235" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="293" y="366" font-size="11" fill="#d6a040" font-weight="bold">思路 B：DFS 记最大深度</text>
  <text x="293" y="384" font-size="10" fill="#333">维护 maxDepth 与 sum</text>
  <text x="293" y="400" font-size="10" fill="#333">depth &gt; maxDepth → 重置 sum</text>
  <text x="293" y="416" font-size="10" fill="#333">depth == maxDepth → 累加</text>
</svg>
