<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：特殊序列 = 0⁺ → 1⁺ → 2⁺ 三段，三计数器分阶段累计</text>
  <text x="320" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">f0 数「纯 0⁺」，f1 数「0⁺1⁺」，f2 数「0⁺1⁺2⁺」——阶段单向前进，永不回退</text>

  <!-- 三段序列示意 -->
  <g font-size="14">
    <rect x="70" y="90" width="150" height="50" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="145" y="120" text-anchor="middle" fill="#333" font-weight="bold" filter="url(#rough2)">0 0 0 … 0</text>
    <text x="145" y="158" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">第 1 段：0⁺（≥1 个 0）</text>

    <rect x="245" y="90" width="150" height="50" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="320" y="120" text-anchor="middle" fill="#333" font-weight="bold" filter="url(#rough2)">1 1 1 … 1</text>
    <text x="320" y="158" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">第 2 段：1⁺（≥1 个 1）</text>

    <rect x="420" y="90" width="150" height="50" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="495" y="120" text-anchor="middle" fill="#333" font-weight="bold" filter="url(#rough2)">2 2 2 … 2</text>
    <text x="495" y="158" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">第 3 段：2⁺（≥1 个 2）</text>
  </g>

  <!-- 段间单向箭头 -->
  <path d="M 222 115 L 243 115" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 397 115 L 418 115" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 计数器盒子 -->
  <g font-size="14">
    <rect x="70" y="195" width="150" height="70" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
    <text x="145" y="220" text-anchor="middle" fill="#446688" font-weight="bold" filter="url(#rough2)">f₀</text>
    <text x="145" y="244" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">已凑出 0⁺ 的子序列数</text>

    <rect x="245" y="195" width="150" height="70" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="320" y="220" text-anchor="middle" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">f₁</text>
    <text x="320" y="244" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">已凑出 0⁺1⁺ 的子序列数</text>

    <rect x="420" y="195" width="150" height="70" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="495" y="220" text-anchor="middle" fill="#d6a040" font-weight="bold" filter="url(#rough2)">f₂</text>
    <text x="495" y="244" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">已凑出 0⁺1⁺2⁺ 的子序列数</text>
  </g>

  <!-- 喂养箭头：f0 → f1 → f2 -->
  <path d="M 222 230 Q 233 236 243 230" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="232" y="270" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">升级</text>
  <path d="M 397 230 Q 408 236 418 230" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="407" y="270" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">升级</text>

  <!-- 说明框 -->
  <rect x="60" y="300" width="520" height="120" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="324" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">为什么三个计数器就够？</text>
  <text x="80" y="346" font-size="12" fill="#555" filter="url(#rough2)">① 任一子序列要么没开始，要么在 0 段(f₀)、1 段(f₁)、2 段(f₂) 之一</text>
  <text x="80" y="366" font-size="12" fill="#555" filter="url(#rough2)">② 阶段只能 0 → 1 → 2 单向前进：进入 1 段后不能再补 0，进入 2 段后不能再补 0/1</text>
  <text x="80" y="386" font-size="12" fill="#555" filter="url(#rough2)">⇒ f₁ 只依赖 f₀，f₂ 只依赖 f₁，无后效性，一遍扫描即可</text>
  <text x="80" y="408" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">⇒ 答案 = f₂（已完整凑出三段的子序列数）</text>
</svg>
