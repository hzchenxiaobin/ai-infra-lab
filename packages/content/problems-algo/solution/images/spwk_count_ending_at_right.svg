<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：以 right 结尾的合法子数组有 (right − left + 1) 个</text>

  <!-- nums label -->
  <text x="40" y="86" font-size="12" fill="#888">nums:</text>
  <text x="40" y="62" font-size="11" fill="#888">下标:</text>

  <!-- index labels -->
  <text x="138" y="62" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">0</text>
  <text x="198" y="62" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">1</text>
  <text x="258" y="62" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">2</text>
  <text x="318" y="62" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">3</text>

  <!-- cells: idx0 greyed (excluded), idx1..3 green (window) -->
  <rect x="110" y="70" width="56" height="42" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="138" y="98" text-anchor="middle" font-size="14" fill="#999" font-weight="bold">10</text>
  <rect x="170" y="70" width="56" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="198" y="98" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <rect x="230" y="70" width="56" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="258" y="98" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="290" y="70" width="56" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="318" y="98" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>

  <!-- left / right pointer labels -->
  <path d="M 198 120 L 198 116" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="198" y="134" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">left=1</text>
  <path d="M 318 120 L 318 116" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="318" y="134" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">right=3</text>

  <!-- note about idx0 excluded -->
  <text x="138" y="154" text-anchor="middle" font-size="10" fill="#b85450">纳入则乘积=600≥100</text>

  <!-- three brackets: subarrays ending at right=3 -->
  <!-- [6] -->
  <path d="M 290 170 Q 290 178 296 178 L 340 178 Q 346 178 346 170" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="318" y="194" text-anchor="middle" font-size="11" fill="#446688">[6] = 6 ✓</text>

  <!-- [2,6] -->
  <path d="M 230 206 Q 230 214 236 214 L 340 214 Q 346 214 346 206" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="288" y="230" text-anchor="middle" font-size="11" fill="#446688">[2,6] = 12 ✓</text>

  <!-- [5,2,6] -->
  <path d="M 170 242 Q 170 250 176 250 L 340 250 Q 346 250 346 242" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="258" y="266" text-anchor="middle" font-size="11" fill="#446688">[5,2,6] = 60 ✓</text>

  <!-- count note box (right side) -->
  <rect x="378" y="168" width="186" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="471" y="190" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">以 right=3 结尾</text>
  <text x="471" y="208" text-anchor="middle" font-size="11" fill="#666">合法子数组共 3 个</text>
  <text x="471" y="226" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">= right − left + 1</text>
  <text x="471" y="244" text-anchor="middle" font-size="11" fill="#888">= 3 − 1 + 1 = 3</text>
  <text x="471" y="258" text-anchor="middle" font-size="10" fill="#888">起点取 left..right 各一个</text>

  <!-- bottom callout -->
  <rect x="40" y="288" width="524" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="310" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">核心：正数数组下，窗口 [left,right] 合法 ⇒ 以 right 结尾的合法子数组恰有 (right−left+1) 个</text>
  <text x="290" y="330" text-anchor="middle" font-size="11" fill="#666">起点 &lt; left 的子数组会包含 nums[left−1]，乘积 ≥ k，必然不合法</text>
  <text x="290" y="348" text-anchor="middle" font-size="11" fill="#888">因此按右端点 right 分组累加，不重复也不遗漏</text>
</svg>
