<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算</text>
  <text x="270" y="52" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">示例1：nums=[8,12,6]，target=[2,14,10]（全偶，奇组为空）</text>

  <text x="270" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">偶组（排序后）按下标配对</text>

  <rect x="188" y="80" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="210" y="101" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>
  <rect x="248" y="80" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="101" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">8</text>
  <rect x="308" y="80" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="101" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">12</text>

  <path d="M210,114 L210,166" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M270,114 L270,166" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M330,114 L330,166" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="224" y="145" font-size="12" fill="#b85450" filter="url(#rough2)">−4</text>
  <text x="284" y="145" font-size="12" fill="#4a7a3a" filter="url(#rough2)">+2</text>
  <text x="344" y="145" font-size="12" fill="#4a7a3a" filter="url(#rough2)">+2</text>

  <rect x="188" y="170" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="210" y="191" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="248" y="170" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="191" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">10</text>
  <rect x="308" y="170" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="191" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">14</text>

  <rect x="70" y="218" width="400" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="245" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">正差之和 = (+2) + (+2) = 4 → ans = 4 ÷ 2 = 2 次</text>

  <text x="270" y="288" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">两次操作即可实现（+2 与 −2 配对）：</text>

  <g filter="url(#rough2)">
    <rect x="41" y="300" width="34" height="28" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="58" y="319" text-anchor="middle" font-size="13" fill="#333">8</text>
    <rect x="83" y="300" width="34" height="28" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="100" y="319" text-anchor="middle" font-size="13" fill="#333">12</text>
    <rect x="125" y="300" width="34" height="28" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="142" y="319" text-anchor="middle" font-size="13" fill="#333">6</text>
  </g>

  <path d="M163,314 L207,314" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="185" y="306" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">op1</text>
  <text x="185" y="332" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">+2@0,−2@2</text>

  <g filter="url(#rough2)">
    <rect x="211" y="300" width="34" height="28" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="228" y="319" text-anchor="middle" font-size="13" fill="#333">10</text>
    <rect x="253" y="300" width="34" height="28" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="270" y="319" text-anchor="middle" font-size="13" fill="#333">12</text>
    <rect x="295" y="300" width="34" height="28" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="312" y="319" text-anchor="middle" font-size="13" fill="#333">4</text>
  </g>

  <path d="M333,314 L377,314" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="355" y="306" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">op2</text>
  <text x="355" y="332" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">+2@1,−2@2</text>

  <g filter="url(#rough2)">
    <rect x="381" y="300" width="34" height="28" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="398" y="319" text-anchor="middle" font-size="13" fill="#333">10</text>
    <rect x="423" y="300" width="34" height="28" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="440" y="319" text-anchor="middle" font-size="13" fill="#333">14</text>
    <rect x="465" y="300" width="34" height="28" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="482" y="319" text-anchor="middle" font-size="13" fill="#333">2</text>
  </g>
  <text x="440" y="352" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">= target ✓</text>
</svg>
