<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心：半开区间不相交判定 + 有序集合 O(log n) 定位</text>

  <text x="40" y="62" font-size="12" fill="#888" font-weight="bold">已有事件（按起点有序、互不相交）</text>

  <line x1="80" y1="92" x2="500" y2="92" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="80" y1="88" x2="80" y2="96" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="160" y1="88" x2="160" y2="96" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="240" y1="88" x2="240" y2="96" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="320" y1="88" x2="320" y2="96" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="400" y1="88" x2="400" y2="96" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="480" y1="88" x2="480" y2="96" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="110" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="160" y="110" text-anchor="middle" font-size="10" fill="#888">10</text>
  <text x="240" y="110" text-anchor="middle" font-size="10" fill="#888">20</text>
  <text x="320" y="110" text-anchor="middle" font-size="10" fill="#888">30</text>
  <text x="400" y="110" text-anchor="middle" font-size="10" fill="#888">40</text>
  <text x="480" y="110" text-anchor="middle" font-size="10" fill="#888">50</text>

  <rect x="160" y="122" width="80" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="320" y="122" width="80" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="200" y="135" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">[10,20)</text>
  <text x="360" y="135" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">[30,40)</text>

  <rect x="200" y="148" width="104" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" rx="3" filter="url(#rough2)"/>
  <text x="252" y="159" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">book(15, 28)</text>

  <text x="40" y="190" font-size="12" fill="#b85450" font-weight="bold">重叠判定（半开区间）</text>

  <rect x="70" y="200" width="420" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="280" y="218" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">[s₁, e₁) ∩ [s₂, e₂) ≠ ∅  ⟺  s₁ &lt; e₂  且  s₂ &lt; e₁</text>

  <text x="70" y="248" font-size="10.5" fill="#555">• 新事件 [s, e)：只需与「前一段」和「后一段」各比一次</text>
  <text x="70" y="266" font-size="10.5" fill="#555">• 前一段 prev：若 prev.end &gt; s  → 重叠（左边伸进来）</text>
  <text x="70" y="284" font-size="10.5" fill="#555">• 后一段 it ：若 it.start &lt; e → 重叠（右边伸进来）</text>

  <path d="M 280 296 L 280 318" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="312" font-size="10.5" fill="#666" font-weight="bold">两侧都不重叠 → 可预订</text>

  <text x="40" y="344" font-size="11.5" fill="#888" font-weight="bold">有序 set&lt;pair&lt;int,int&gt;&gt;（按 start 排序）</text>
  <rect x="180" y="332" width="220" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="290" y="350" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">{ (10,20), (30,40) }</text>

  <rect x="36" y="372" width="488" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="394" font-size="12" fill="#4a7a3a" font-weight="bold">为什么只需查两段？</text>
  <text x="56" y="412" font-size="11" fill="#555">• 互不相交 + 按起点有序 → lower_bound(start) 一步定位「分界点」，前一段/后一段必覆盖所有可能重叠</text>
  <text x="56" y="424" font-size="11" fill="#b85450" font-weight="bold">• 单次 book = O(log n)，无需扫描全部事件</text>
</svg>
