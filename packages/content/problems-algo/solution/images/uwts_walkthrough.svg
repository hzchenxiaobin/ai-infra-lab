<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s1 = "this apple is sweet", s2 = "this apple is sour"</text>

  <!-- s1 words -->
  <text x="40" y="60" font-size="11" fill="#446688" font-weight="bold">s1 词流：</text>
  <g font-size="11" filter="url(#rough2)">
    <rect x="92" y="46" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="120" y="64" text-anchor="middle" fill="#333">this</text>
    <rect x="156" y="46" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="184" y="64" text-anchor="middle" fill="#333">apple</text>
    <rect x="220" y="46" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="240" y="64" text-anchor="middle" fill="#333">is</text>
    <rect x="268" y="46" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="296" y="64" text-anchor="middle" fill="#333" font-weight="bold">sweet</text>
  </g>

  <!-- s2 words -->
  <text x="40" y="92" font-size="11" fill="#d6a040" font-weight="bold">s2 词流：</text>
  <g font-size="11" filter="url(#rough2)">
    <rect x="92" y="78" width="56" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="120" y="96" text-anchor="middle" fill="#333">this</text>
    <rect x="156" y="78" width="56" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="184" y="96" text-anchor="middle" fill="#333">apple</text>
    <rect x="220" y="78" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="240" y="96" text-anchor="middle" fill="#333">is</text>
    <rect x="268" y="78" width="56" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="296" y="96" text-anchor="middle" fill="#333" font-weight="bold">sour</text>
  </g>

  <!-- merge arrow -->
  <path d="M 180 110 L 180 130" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="196" y="126" font-size="10" fill="#666">合并计数</text>

  <!-- hash table -->
  <rect x="40" y="134" width="540" height="180" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="154" font-size="12" fill="#b85450" font-weight="bold">合并哈希表 cnt（s1 + s2 总频次）：</text>

  <!-- table header -->
  <text x="80" y="176" font-size="11" fill="#888" font-weight="bold">单词</text>
  <text x="200" y="176" font-size="11" fill="#888" font-weight="bold">总频次</text>
  <text x="300" y="176" font-size="11" fill="#888" font-weight="bold">单词</text>
  <text x="420" y="176" font-size="11" fill="#888" font-weight="bold">总频次</text>

  <!-- rows -->
  <g font-size="12" filter="url(#rough2)">
    <text x="80" y="198" fill="#333">this</text>
    <text x="200" y="198" fill="#b85450" font-weight="bold">2</text>
    <text x="300" y="198" fill="#333" font-weight="bold">sweet</text>
    <text x="420" y="198" fill="#4a7a3a" font-weight="bold">1 ✓</text>

    <text x="80" y="220" fill="#333">apple</text>
    <text x="200" y="220" fill="#b85450" font-weight="bold">2</text>
    <text x="300" y="220" fill="#333" font-weight="bold">sour</text>
    <text x="420" y="220" fill="#4a7a3a" font-weight="bold">1 ✓</text>

    <text x="80" y="242" fill="#333">is</text>
    <text x="200" y="242" fill="#b85450" font-weight="bold">2</text>
    <text x="300" y="242" fill="#888" font-style="italic">（仅 4 个不同词）</text>
  </g>

  <text x="56" y="268" font-size="10" fill="#888">注：this/apple/is 在两句各 1 次 → 总频次 2；sweet/sour 仅一句出现 → 总频次 1。</text>

  <!-- filter arrow -->
  <path d="M 310 280 L 310 302" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="294" font-size="11" fill="#b85450" font-weight="bold">过滤 c == 1</text>

  <!-- result -->
  <rect x="180" y="306" width="260" height="50" fill="#446688" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="310" y="326" text-anchor="middle" font-size="11" fill="#bcd" font-weight="bold">总频次为 1 的词</text>
  <text x="310" y="346" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">返回 ["sweet", "sour"]</text>

  <!-- takeaway -->
  <rect x="40" y="368" width="540" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="388" font-size="11" fill="#4a7a3a" font-weight="bold">关键：this/apple/is 虽各句恰一次，但两句都出现 → 总频次 2，归约自动排除。</text>
  <text x="56" y="406" font-size="10" fill="#666">无需特判「另一句是否出现」，合并频次一刀切：c == 1 即不常见。</text>
</svg>
