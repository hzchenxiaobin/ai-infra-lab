<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：建 target 需求表 → 统计 s 供应 → 整除取最小</text>

  <!-- Step 1 label -->
  <text x="40" y="48" font-size="11" fill="#4a7a3a" font-weight="bold">第一步：遍历 target 建需求表 req</text>

  <ellipse cx="270" cy="74" rx="130" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="78" text-anchor="middle" font-size="12" fill="#333">req = Counter(target)</text>

  <path d="M 270 92 L 270 106" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 label -->
  <text x="40" y="124" font-size="11" fill="#446688" font-weight="bold">第二步：遍历 s 统计供应表 cnt</text>

  <!-- Loop: for each char in s -->
  <polygon points="270,110 400,144 270,178 140,144" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="140" text-anchor="middle" font-size="12" fill="#333">s 中还有</text>
  <text x="270" y="156" text-anchor="middle" font-size="11" fill="#666">字符 ch ?</text>

  <!-- Yes -> down -->
  <path d="M 270 178 L 270 194" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="190" font-size="11" fill="#82b366">是</text>

  <rect x="110" y="196" width="320" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="216" text-anchor="middle" font-size="12" fill="#333">cnt[ch] ++（只记 target 涉及的字母即可）</text>

  <!-- loop back -->
  <path d="M 110 211 L 80 211 L 80 144 L 140 144" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="62" y="180" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 62 180)">下一字符</text>

  <!-- No -> right -->
  <path d="M 400 144 L 440 144" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="416" y="136" text-anchor="middle" font-size="11" fill="#b85450">否</text>

  <!-- Step 3 label -->
  <text x="40" y="250" font-size="11" fill="#d6a040" font-weight="bold">第三步：对 target 每个字母整除，取最小</text>
  <path d="M 440 144 L 440 254 L 430 254" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Division + min box -->
  <rect x="50" y="258" width="440" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="278" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans = min&#160;{ cnt[c] // req[c] , 对每个 c ∈ target }</text>
  <text x="270" y="298" text-anchor="middle" font-size="10.5" fill="#666">注意：只在 target 出现的字母上迭代，缺键按 0 处理</text>

  <path d="M 270 318 L 270 332" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- bottleneck highlight -->
  <rect x="110" y="336" width="320" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="356" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">瓶颈字母（最短缺者）决定答案</text>

  <path d="M 270 368 L 270 382" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Return -->
  <ellipse cx="270" cy="404" rx="90" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="408" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 ans</text>

  <!-- summary -->
  <text x="270" y="450" text-anchor="middle" font-size="10" fill="#888">时间 O(|s|+|target|) · 空间 O(1)（仅 26 个字母计数器）</text>
</svg>
