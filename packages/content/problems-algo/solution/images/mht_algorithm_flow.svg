<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrf" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arra" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    剥叶子算法流程（多源 BFS 按层剥离）
  </text>

  <!-- 1. 建图 -->
  <rect x="200" y="46" width="160" height="34" rx="6" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="12.5" fill="#2a4a6a">建图: 邻接表 + 度数</text>
  <line x1="280" y1="80" x2="280" y2="98" stroke="#446688" stroke-width="1.5" marker-end="url(#arrf)"/>

  <!-- 2. 判 n==1 -->
  <polygon points="280,100 360,138 280,176 200,138" fill="#fff8e1"
           stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="135" text-anchor="middle" font-size="12" fill="#7a5a20">n == 1 ?</text>
  <text x="280" y="150" text-anchor="middle" font-size="12" fill="#7a5a20">单节点特判</text>

  <!-- yes 分支：返回 [0] -->
  <line x1="360" y1="138" x2="430" y2="138" stroke="#b85450" stroke-width="1.5" marker-end="url(#arra)"/>
  <text x="395" y="132" text-anchor="middle" font-size="11" fill="#b85450">是</text>
  <rect x="430" y="120" width="110" height="36" rx="6" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="485" y="143" text-anchor="middle" font-size="12" fill="#b85450">返回 [0]</text>

  <!-- no 分支：入队 -->
  <line x1="280" y1="176" x2="280" y2="196" stroke="#446688" stroke-width="1.5" marker-end="url(#arrf)"/>
  <text x="295" y="190" font-size="11" fill="#446688">否</text>
  <rect x="180" y="196" width="200" height="34" rx="6" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="218" text-anchor="middle" font-size="12.5" fill="#2a4a6a">度数==1 的叶子全部入队</text>
  <line x1="280" y1="230" x2="280" y2="248" stroke="#446688" stroke-width="1.5" marker-end="url(#arrf)"/>

  <!-- 3. 循环条件 remaining > 2 -->
  <polygon points="280,250 376,288 280,326 184,288" fill="#fff8e1"
           stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="285" text-anchor="middle" font-size="12" fill="#7a5a20">remaining</text>
  <text x="280" y="300" text-anchor="middle" font-size="12" fill="#7a5a20">&gt; 2 ?</text>

  <!-- no 分支：返回剩余 -->
  <line x1="376" y1="288" x2="430" y2="288" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrf)"/>
  <text x="403" y="282" text-anchor="middle" font-size="11" fill="#4a7a3a">否</text>
  <rect x="430" y="270" width="110" height="36" rx="6" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="485" y="287" text-anchor="middle" font-size="11.5" fill="#2a5a2a">返回队列中</text>
  <text x="485" y="301" text-anchor="middle" font-size="11.5" fill="#2a5a2a">剩余 1~2 节点</text>

  <!-- yes 分支：取当前层 -->
  <line x1="280" y1="326" x2="280" y2="344" stroke="#446688" stroke-width="1.5" marker-end="url(#arrf)"/>
  <text x="295" y="338" font-size="11" fill="#446688">是</text>
  <rect x="160" y="344" width="240" height="34" rx="6" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="366" text-anchor="middle" font-size="12.5" fill="#2a4a6a">取当前层 sz 个叶子 u</text>
  <line x1="280" y1="378" x2="280" y2="396" stroke="#446688" stroke-width="1.5" marker-end="url(#arrf)"/>

  <!-- 4. 松弛邻居 -->
  <rect x="120" y="396" width="320" height="34" rx="6" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="418" text-anchor="middle" font-size="12" fill="#2a4a6a">∀邻居 v: degree[v]-=1; ==1 则入下一层</text>

  <!-- 回到循环条件 -->
  <line x1="280" y1="430" x2="280" y2="438" stroke="#446688" stroke-width="1.5"/>
  <path d="M 280 438 L 80 438 L 80 288 L 184 288" fill="none" stroke="#446688"
        stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrf)" filter="url(#rough2)"/>
  <text x="92" y="360" font-size="11" fill="#446688" filter="url(#rough2)">remaining -= sz</text>
  <text x="92" y="376" font-size="11" fill="#446688" filter="url(#rough2)">回到判断</text>
</svg>
