<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：建哈希集合 → 对正数 x 检测 -x ∈ seen → 取最大命中</text>

  <!-- Stage A: nums array -->
  <text x="98" y="67" font-size="12" fill="#888">nums =</text>
  <rect x="148" y="44" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="67" text-anchor="middle" font-size="16" fill="#333">-1</text>
  <rect x="192" y="44" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="214" y="67" text-anchor="middle" font-size="16" fill="#333">10</text>
  <rect x="236" y="44" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="258" y="67" text-anchor="middle" font-size="16" fill="#333">6</text>
  <rect x="280" y="44" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="302" y="67" text-anchor="middle" font-size="16" fill="#333">7</text>
  <rect x="324" y="44" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="346" y="67" text-anchor="middle" font-size="16" fill="#333">-7</text>
  <rect x="368" y="44" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="390" y="67" text-anchor="middle" font-size="16" fill="#333">1</text>

  <!-- Arrow 1 -->
  <path d="M 280 82 L 280 100" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="290" y="95" font-size="11" fill="#446688">① 建哈希集合 seen ← nums 全部元素</text>

  <!-- Stage B: seen set (sorted) -->
  <text x="98" y="131" font-size="12" fill="#888">seen =</text>
  <rect x="148" y="108" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="170" y="131" text-anchor="middle" font-size="16" fill="#333">-7</text>
  <rect x="192" y="108" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="214" y="131" text-anchor="middle" font-size="16" fill="#333">-1</text>
  <rect x="236" y="108" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="258" y="131" text-anchor="middle" font-size="16" fill="#333">1</text>
  <rect x="280" y="108" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="302" y="131" text-anchor="middle" font-size="16" fill="#333">6</text>
  <rect x="324" y="108" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="346" y="131" text-anchor="middle" font-size="16" fill="#333">7</text>
  <rect x="368" y="108" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="390" y="131" text-anchor="middle" font-size="16" fill="#333">10</text>

  <!-- Arrow 2 -->
  <path d="M 280 146 L 280 164" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="290" y="159" font-size="11" fill="#446688">② 对每个正数 x：-x ∈ seen?（O(1) 查询）</text>

  <!-- Stage C: pairing cards (4) -->
  <!-- card1: 10 miss -->
  <rect x="28" y="176" width="120" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="88" y="202" text-anchor="middle" font-size="20" fill="#b85450" font-weight="bold">10</text>
  <text x="88" y="224" text-anchor="middle" font-size="11" fill="#b85450">-10 不在 ✗</text>
  <!-- card2: 6 miss -->
  <rect x="156" y="176" width="120" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="216" y="202" text-anchor="middle" font-size="20" fill="#b85450" font-weight="bold">6</text>
  <text x="216" y="224" text-anchor="middle" font-size="11" fill="#b85450">-6 不在 ✗</text>
  <!-- card3: 7 hit winner -->
  <rect x="284" y="176" width="120" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="8" filter="url(#rough2)"/>
  <text x="396" y="192" text-anchor="end" font-size="10" fill="#d6a040" font-weight="bold">★ 最大</text>
  <text x="344" y="202" text-anchor="middle" font-size="20" fill="#4a7a3a" font-weight="bold">7</text>
  <text x="344" y="224" text-anchor="middle" font-size="11" fill="#4a7a3a">-7 在 ✓</text>
  <!-- card4: 1 hit -->
  <rect x="412" y="176" width="120" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="472" y="202" text-anchor="middle" font-size="20" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="472" y="224" text-anchor="middle" font-size="11" fill="#4a7a3a">-1 在 ✓</text>

  <!-- Arrow 3 -->
  <path d="M 280 240 L 280 258" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="290" y="253" font-size="11" fill="#4a7a3a">③ 命中正数 {7, 1}，取最大 → 7</text>

  <!-- Result -->
  <rect x="180" y="262" width="200" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="290" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">ans = 7 ✓</text>

  <!-- Notes -->
  <text x="28" y="336" font-size="10.5" fill="#888">• 哈希集合把「-x 是否存在」从 O(n) 扫描降到 O(1) 查询，整体 O(n)</text>
  <text x="28" y="354" font-size="10.5" fill="#888">• {k, -k} 对称配对：两半都在集合中即命中；10、6 因相反数缺失被淘汰</text>
</svg>
