<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：收集 key → 差分标记 → 前缀求并集 → 收集答案</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888">差分数组法 O(n+m)：区间两端 O(1) 更新，前缀和一次还原</text>

  <!-- ===== Start node ===== -->
  <ellipse cx="90" cy="74" rx="42" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="90" y="78" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">开始</text>

  <!-- arrow start -> init -->
  <path d="M 90 94 L 90 116" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Init: diff[n+1]=0, j=0 ===== -->
  <rect x="30" y="118" width="120" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="90" y="136" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">初始化</text>
  <text x="90" y="152" text-anchor="middle" font-size="10" fill="#555">diff[0..n]=0, j=0</text>

  <!-- arrow init -> loop cond -->
  <path d="M 90 162 L 90 186" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Loop condition diamond ===== -->
  <polygon points="90,188 162,222 90,256 18,222" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="90" y="218" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">j &lt; n?</text>
  <text x="90" y="234" text-anchor="middle" font-size="10" fill="#555">(还有元素)</text>

  <!-- ===== YES branch: go right ===== -->
  <path d="M 162 222 L 200 222" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="181" y="216" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- ===== Check nums[j]==key ===== -->
  <polygon points="300,196 400,222 300,248 200,222" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="218" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">nums[j]==key?</text>

  <!-- ===== key YES: mark interval ===== -->
  <path d="M 300 248 L 300 270" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="262" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="200" y="272" width="200" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="300" y="290" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">L=max(0,j−k), R=min(n−1,j+k)</text>
  <text x="300" y="306" text-anchor="middle" font-size="10" fill="#555">diff[L]+=1, diff[R+1]−=1</text>

  <!-- j++ and back to loop -->
  <path d="M 400 294 L 440 294 L 440 222 L 400 222" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="450" y="260" font-size="9.5" fill="#888">j++</text>

  <!-- ===== key NO: skip, j++ ===== -->
  <path d="M 400 222 L 440 222" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="216" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- ===== NO branch: go down to prefix sum ===== -->
  <path d="M 90 256 L 90 280" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="102" y="272" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- ===== Prefix sum phase ===== -->
  <rect x="20" y="282" width="140" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="90" y="300" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">前缀求并集</text>
  <text x="90" y="316" text-anchor="middle" font-size="10" fill="#555">running+=diff[i], &gt;0 则加入 ans</text>

  <!-- arrow to return -->
  <path d="M 90 326 L 90 340" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Footer -->
  <text x="300" y="346" text-anchor="middle" font-size="9.5" fill="#aaa">时间 O(n+m) · 空间 O(n)</text>
</svg>
