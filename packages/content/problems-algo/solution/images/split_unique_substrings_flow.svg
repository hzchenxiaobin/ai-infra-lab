<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">回溯 + 哈希集合去重：算法流程</text>

  <!-- 入口 -->
  <rect x="210" y="48" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="70" text-anchor="middle" font-size="12" fill="#333">dfs(start, seen)</text>

  <path d="M 300 82 L 300 98" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 上界剪枝 -->
  <polygon points="300,100 470,148 300,196 130,148" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="140" text-anchor="middle" font-size="11" fill="#333">len(seen) + (n - start)</text>
  <text x="300" y="158" text-anchor="middle" font-size="11" fill="#333">&lt;= maxSplit ?</text>
  <text x="300" y="176" text-anchor="middle" font-size="10" fill="#888">上界剪枝</text>

  <!-- 是 → return -->
  <path d="M 130 148 L 70 148 L 70 200" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="78" y="140" font-size="10" fill="#b85450">是</text>
  <rect x="20" y="204" width="100" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="70" y="224" text-anchor="middle" font-size="11" fill="#333">剪枝返回</text>

  <!-- 否 → 终止判定 -->
  <path d="M 300 196 L 300 214" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="210" font-size="10" fill="#82b366">否</text>

  <polygon points="300,216 420,258 300,300 180,258" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="254" text-anchor="middle" font-size="12" fill="#333">start == n ?</text>
  <text x="300" y="272" text-anchor="middle" font-size="10" fill="#888">切完整串</text>

  <!-- 是 → 更新 -->
  <path d="M 300 300 L 300 320" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="316" font-size="10" fill="#82b366">是</text>
  <rect x="220" y="324" width="160" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="344" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">maxSplit = max(…, len(seen))</text>

  <!-- 否 → 循环 -->
  <path d="M 420 258 L 500 258 L 500 324" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="250" font-size="10" fill="#b85450">否</text>

  <rect x="420" y="328" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="500" y="348" text-anchor="middle" font-size="11" fill="#333">for end = start .. n-1</text>

  <path d="M 500 358 L 500 376" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="500,378 580,398 500,418 420,398" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="500" y="395" text-anchor="middle" font-size="10" fill="#333">sub 在 seen?</text>

  <!-- 否 → 加入/递归/移除 -->
  <path d="M 420 398 L 370 398 L 370 344" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="392" font-size="10" fill="#82b366">否</text>

  <rect x="250" y="382" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="310" y="400" text-anchor="middle" font-size="10" fill="#333">seen.add → dfs → erase</text>

  <text x="180" y="395" font-size="10" fill="#888">回溯撤销</text>

  <text x="20" y="404" font-size="10" fill="#888">时间 O(n·2^n)，空间 O(n²)</text>
</svg>
