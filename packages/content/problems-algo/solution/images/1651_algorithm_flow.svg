<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">Hopper 公司查询 III：算法流程（CTE 流水线）</text>

  <!-- ===== CTE 1: months ===== -->
  <rect x="160" y="40" width="320" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="320" y="58" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">CTE 1：months（生成 1→12 月骨架）</text>
  <text x="320" y="74" text-anchor="middle" font-size="9" fill="#446688">WITH RECURSIVE months AS (SELECT 1 UNION ALL SELECT m+1 WHERE m&lt;12)</text>
  <text x="320" y="84" text-anchor="middle" font-size="8" fill="#888">→ 12 行，保证无数据月也输出 0</text>

  <!-- Arrow 1→2 -->
  <path d="M320 90 L320 104" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ===== CTE 2: accepted_with_month ===== -->
  <rect x="120" y="108" width="400" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="320" y="126" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">CTE 2：accepted_with_month（已接单 + 月份）</text>
  <text x="320" y="142" text-anchor="middle" font-size="9" fill="#4a7a3a">AcceptedRides ar JOIN Rides r ON ar.ride_id = r.ride_id</text>
  <text x="320" y="154" text-anchor="middle" font-size="9" fill="#4a7a3a">WHERE YEAR(r.requested_at) = 2020 → 取 MONTH() 作为 ride_month</text>

  <!-- Arrow 2→3 -->
  <path d="M320 166 L320 180" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== CTE 3: monthly_totals ===== -->
  <rect x="120" y="184" width="400" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="320" y="202" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">CTE 3：monthly_totals（月度汇总 + 补零）</text>
  <text x="320" y="218" text-anchor="middle" font-size="9" fill="#d6a040">months LEFT JOIN accepted_with_month ON ride_month = month</text>
  <text x="320" y="230" text-anchor="middle" font-size="9" fill="#d6a040">COALESCE(SUM(distance), 0) + GROUP BY month → 12 行月度合计</text>

  <!-- Arrow 3→branch -->
  <path d="M320 242 L320 256" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- Branch line -->
  <path d="M200 256 L440 256" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M200 256 L200 270" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M440 256 L440 270" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ===== Branch A: Self-join ===== -->
  <rect x="80" y="274" width="220" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="190" y="292" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">解法 A：自连接三表</text>
  <text x="190" y="308" text-anchor="middle" font-size="8.5" fill="#b85450">m1 JOIN m2 ON m2.month=m1.month+1</text>
  <text x="190" y="320" text-anchor="middle" font-size="8.5" fill="#b85450">JOIN m3 ON m3.month=m1.month+2</text>

  <!-- ===== Branch B: Window function ===== -->
  <rect x="340" y="274" width="220" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="450" y="292" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">解法 B：窗口函数</text>
  <text x="450" y="308" text-anchor="middle" font-size="8.5" fill="#446688">SUM(total) OVER (ORDER BY month</text>
  <text x="450" y="320" text-anchor="middle" font-size="8.5" fill="#446688">ROWS BETWEEN 0 AND 2 FOLLOWING)</text>

  <!-- Merge arrows -->
  <path d="M190 332 L190 346 L320 346" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M450 332 L450 346 L320 346" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M320 346 L320 360" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- ===== Final SELECT ===== -->
  <rect x="120" y="364" width="400" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="320" y="382" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">Final SELECT（取整 + 排序）</text>
  <text x="320" y="398" text-anchor="middle" font-size="9" fill="#d6a040">ROUND(window_sum / 3, 2)  WHERE month ≤ 10  ORDER BY month</text>

  <!-- Arrow final→output -->
  <path d="M320 414 L320 428" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- ===== Output ===== -->
  <rect x="180" y="432" width="280" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="320" y="448" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">→ 10 行输出（month: 1→10，含 avg_distance / avg_duration）</text>
</svg>
