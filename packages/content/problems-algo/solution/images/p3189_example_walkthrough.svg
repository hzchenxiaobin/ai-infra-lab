<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="410" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：rooks = [[0,0],[1,0],[1,1]]</text>

  <!-- 表 A：行指派 -->
  <text x="36" y="48" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 行指派（竖直步）</text>

  <rect x="36" y="56" width="118" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="95" y="73" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">排序后位次 i</text>
  <rect x="158" y="56" width="74" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="195" y="73" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="236" y="56" width="74" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="273" y="73" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="314" y="56" width="74" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="351" y="73" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="36" y="84" width="118" height="26" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="95" y="101" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">行坐标 x(i)</text>
  <rect x="158" y="84" width="74" height="26" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="195" y="101" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="236" y="84" width="74" height="26" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="273" y="101" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="314" y="84" width="74" height="26" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="351" y="101" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <rect x="36" y="112" width="118" height="26" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="95" y="129" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">目标行</text>
  <rect x="158" y="112" width="74" height="26" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="195" y="129" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="236" y="112" width="74" height="26" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="273" y="129" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="314" y="112" width="74" height="26" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="351" y="129" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>

  <rect x="36" y="140" width="118" height="26" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="95" y="157" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">竖直步 |x(i)−i|</text>
  <rect x="158" y="140" width="74" height="26" fill="#f6f6f6" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="195" y="157" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <rect x="236" y="140" width="74" height="26" fill="#f6f6f6" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="273" y="157" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <rect x="314" y="140" width="74" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="351" y="157" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="398" y="112" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">行代价</text>
  <text x="398" y="130" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">= 0+0+1 = 1</text>

  <!-- 表 B：列指派 -->
  <text x="36" y="192" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 列指派（水平步）</text>

  <rect x="36" y="200" width="118" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="95" y="217" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">排序后位次 i</text>
  <rect x="158" y="200" width="74" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="195" y="217" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="236" y="200" width="74" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="273" y="217" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="314" y="200" width="74" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="351" y="217" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="36" y="228" width="118" height="26" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="95" y="245" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">列坐标 y(i)</text>
  <rect x="158" y="228" width="74" height="26" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="195" y="245" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="236" y="228" width="74" height="26" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="273" y="245" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="314" y="228" width="74" height="26" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="351" y="245" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <rect x="36" y="256" width="118" height="26" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="95" y="273" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">目标列</text>
  <rect x="158" y="256" width="74" height="26" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="195" y="273" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="236" y="256" width="74" height="26" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="273" y="273" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="314" y="256" width="74" height="26" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="351" y="273" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>

  <rect x="36" y="284" width="118" height="26" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="95" y="301" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">水平步 |y(i)−i|</text>
  <rect x="158" y="284" width="74" height="26" fill="#f6f6f6" stroke="#b8c4d0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="195" y="301" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <rect x="236" y="284" width="74" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="273" y="301" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="314" y="284" width="74" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="351" y="301" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="398" y="256" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">列代价</text>
  <text x="398" y="274" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">= 0+1+1 = 2</text>

  <!-- 结果 -->
  <rect x="36" y="322" width="352" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="212" y="345" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">答案 = 行代价 1 + 列代价 2 = 3 ✓</text>

  <rect x="36" y="366" width="448" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="389" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">示例 2：行代价 0+1+2+3 = 6，列代价 0 → 答案 6 ✓</text>
</svg>
