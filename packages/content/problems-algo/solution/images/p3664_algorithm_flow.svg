<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：分类计数 → 枚举 xx 分配 → 两侧公式求解</text>

  <!-- 开始 -->
  <rect x="210" y="32" width="100" height="24" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="48" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">开始</text>
  <path d="M 260 56 L 260 68" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 ① -->
  <rect x="140" y="70" width="240" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="89" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">① 一遍扫描分类计数：both、cnt1[·]、cnt2[·]</text>
  <path d="M 260 100 L 260 112" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 ② -->
  <rect x="140" y="114" width="240" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="133" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">② 预处理 S₁、S₂（总和）与 M₁、M₂（最大计数）</text>
  <path d="M 260 144 L 260 156" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 ③：循环判断 -->
  <polygon points="260,158 352,192 260,226 168,192" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="190" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">③ i ≤ both ？</text>
  <text x="260" y="204" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">i：分给侧 1 的 xx 张数</text>

  <!-- 否 → 返回 -->
  <path d="M 352 192 L 390 192" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="368" y="184" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="394" y="178" width="106" height="28" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="447" y="196" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">返回 ans</text>

  <!-- 是 → 两侧求解 -->
  <path d="M 260 226 L 260 240" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="270" y="238" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 260 240 L 202 252" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 260 240 L 318 252" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- 侧 1 -->
  <rect x="105" y="254" width="190" height="56" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="273" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">侧 1：T₁ = S₁ + i</text>
  <text x="200" y="291" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">p₁ = min(⌊T₁/2⌋, T₁ − max(M₁, i))</text>

  <!-- 侧 2 -->
  <rect x="315" y="254" width="190" height="56" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="410" y="273" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">侧 2：T₂ = S₂ + both − i</text>
  <text x="410" y="291" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">p₂ = min(⌊T₂/2⌋, T₂ − max(M₂, both−i))</text>

  <!-- 汇合 → 步骤 ④ -->
  <path d="M 200 310 L 234 324" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 410 310 L 286 324" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="185" y="326" width="150" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="343" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">④ ans = max(ans, p₁ + p₂)</text>

  <!-- 循环回边 -->
  <path d="M 185 339 L 58 339 L 58 192 L 164 192" fill="none" stroke="#446688" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="46" y="268" text-anchor="middle" font-size="9" fill="#446688" transform="rotate(-90 46 268)" filter="url(#rough2)">i += 1</text>

  <!-- 复杂度注记 -->
  <text x="447" y="348" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">时间 O(n + Σ + both) · 空间 O(Σ)</text>
</svg>
