<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：逐学生判定 queryTime 是否落在 [start, end] 内</text>

  <!-- ============ Example 1 ============ -->
  <text x="40" y="54" font-size="12.5" fill="#333" font-weight="bold">示例 1：start = [1,2,3]，end = [3,2,7]，queryTime = 4 → <tspan fill="#4a7a3a">1</tspan></text>

  <!-- Timeline: t=0..8, x = 80 + 48*t -->
  <!-- Student 0 bar: [1,3] x=128 to 224, y=78 -->
  <rect x="128" y="78" width="96" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="176" y="93" text-anchor="middle" font-size="10.5" fill="#333">学生0 [1,3]</text>
  <!-- Student 1: point at t=2, x=176, y=120 -->
  <circle cx="176" cy="131" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="176" y="134" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">2</text>
  <text x="220" y="135" font-size="10" fill="#888">学生1 [2,2]</text>
  <!-- Student 2 bar: [3,7] x=224 to 416, y=152. highlight green (contains q=4) -->
  <rect x="224" y="152" width="192" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="320" y="167" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">学生2 [3,7]</text>

  <!-- queryTime=4 vertical dashed line at x=272 -->
  <path d="M 272 70 L 272 184" stroke="#b85450" stroke-width="2.2" stroke-dasharray="6,4" fill="none" filter="url(#rough2)"/>
  <rect x="250" y="56" width="44" height="20" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="272" y="70" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">q=4</text>

  <!-- axis line -->
  <path d="M 70 188 L 480 188" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="80" y="204" text-anchor="middle" font-size="9.5" fill="#888">0</text>
  <text x="128" y="204" text-anchor="middle" font-size="9.5" fill="#888">1</text>
  <text x="176" y="204" text-anchor="middle" font-size="9.5" fill="#888">2</text>
  <text x="224" y="204" text-anchor="middle" font-size="9.5" fill="#888">3</text>
  <text x="272" y="204" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">4</text>
  <text x="320" y="204" text-anchor="middle" font-size="9.5" fill="#888">5</text>
  <text x="368" y="204" text-anchor="middle" font-size="9.5" fill="#888">6</text>
  <text x="416" y="204" text-anchor="middle" font-size="9.5" fill="#888">7</text>
  <text x="464" y="204" text-anchor="middle" font-size="9.5" fill="#888">8</text>

  <!-- Table header -->
  <rect x="80" y="220" width="46" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="103" y="236" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">学生</text>
  <rect x="126" y="220" width="56" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="154" y="236" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">区间</text>
  <rect x="182" y="220" width="72" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="218" y="236" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">start≤4?</text>
  <rect x="254" y="220" width="72" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="290" y="236" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">4≤end?</text>
  <rect x="326" y="220" width="72" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="362" y="236" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">计数?</text>

  <!-- Row 0: student 0, [1,3], 1≤4 ✓, 4≤3 ✗, no -->
  <rect x="80" y="244" width="46" height="24" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="103" y="260" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <rect x="126" y="244" width="56" height="24" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="154" y="260" text-anchor="middle" font-size="10.5" fill="#333">[1,3]</text>
  <rect x="182" y="244" width="72" height="24" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="218" y="260" text-anchor="middle" font-size="10.5" fill="#4a7a3a">✓</text>
  <rect x="254" y="244" width="72" height="24" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="290" y="260" text-anchor="middle" font-size="10.5" fill="#b85450">✗</text>
  <rect x="326" y="244" width="72" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="362" y="260" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">否</text>

  <!-- Row 1: student 1, [2,2], 2≤4 ✓, 4≤2 ✗, no -->
  <rect x="80" y="268" width="46" height="24" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="103" y="284" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <rect x="126" y="268" width="56" height="24" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="154" y="284" text-anchor="middle" font-size="10.5" fill="#333">[2,2]</text>
  <rect x="182" y="268" width="72" height="24" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="218" y="284" text-anchor="middle" font-size="10.5" fill="#4a7a3a">✓</text>
  <rect x="254" y="268" width="72" height="24" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="290" y="284" text-anchor="middle" font-size="10.5" fill="#b85450">✗</text>
  <rect x="326" y="268" width="72" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="362" y="284" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">否</text>

  <!-- Row 2: student 2, [3,7], 3≤4 ✓, 4≤7 ✓, yes -->
  <rect x="80" y="292" width="46" height="24" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="103" y="308" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <rect x="126" y="292" width="56" height="24" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="154" y="308" text-anchor="middle" font-size="10.5" fill="#333">[3,7]</text>
  <rect x="182" y="292" width="72" height="24" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="218" y="308" text-anchor="middle" font-size="10.5" fill="#4a7a3a">✓</text>
  <rect x="254" y="292" width="72" height="24" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="290" y="308" text-anchor="middle" font-size="10.5" fill="#4a7a3a">✓</text>
  <rect x="326" y="292" width="72" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="362" y="308" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">是 ✓</text>

  <!-- Result -->
  <text x="240" y="338" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">仅学生 2 满足 3 ≤ 4 ≤ 7 ⟹ count = 1</text>

  <!-- separator -->
  <path d="M 60 352 L 560 352" stroke="#e0e0e0" stroke-width="1.2" stroke-dasharray="5,5" fill="none" filter="url(#rough2)"/>

  <!-- ============ Example 5 ============ -->
  <text x="40" y="378" font-size="12.5" fill="#333" font-weight="bold">示例 5：start = [9,8,7,6,5,4,3,2,1]，end = [10,10,…,10]，queryTime = 5 → <tspan fill="#4a7a3a">5</tspan></text>

  <!-- Timeline: t=0..10, x = 80 + 44*t, bars at y=396 -->
  <!-- Students with start ≤ 5: starts 1,2,3,4,5 (indices 8,7,6,5,4) all end at 10, so all 5 match -->
  <!-- draw 5 highlighted small bars from their start to 10 -->
  <rect x="124" y="396" width="418" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="316" y="410" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">5 名学生区间 [1..5, 10] 均覆盖 q=5</text>

  <!-- queryTime=5 vertical line at x=300 (t=5 -> 80+44*5=300) -->
  <path d="M 300 392 L 300 424" stroke="#b85450" stroke-width="2" stroke-dasharray="5,3" fill="none" filter="url(#rough2)"/>
  <rect x="282" y="424" width="36" height="18" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="300" y="437" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">q=5</text>

  <!-- axis -->
  <path d="M 80 424 L 560 424" stroke="#666" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="124" y="456" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="168" y="456" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="212" y="456" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="256" y="456" text-anchor="middle" font-size="9" fill="#888">4</text>
  <text x="300" y="456" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">5</text>
  <text x="344" y="456" text-anchor="middle" font-size="9" fill="#888">6</text>
  <text x="388" y="456" text-anchor="middle" font-size="9" fill="#888">7</text>
  <text x="432" y="456" text-anchor="middle" font-size="9" fill="#888">8</text>
  <text x="476" y="456" text-anchor="middle" font-size="9" fill="#888">9</text>
  <text x="520" y="456" text-anchor="middle" font-size="9" fill="#888">10</text>
</svg>
