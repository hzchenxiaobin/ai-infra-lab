<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">Dijkstra 变体算法流程：最小化路径最大高度</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">距离定义改为 max(grid[路径])，堆按「当前最大高度」取最小者弹出</text>

  <!-- 1. 初始化 -->
  <rect x="170" y="62" width="220" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="82" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">初始化</text>
  <text x="280" y="98" text-anchor="middle" font-size="10" fill="#446688">dist 网格 = ∞；dist[0][0]=grid[0][0]</text>

  <path d="M 280 110 L 280 124" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. push start -->
  <rect x="150" y="126" width="260" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="151" text-anchor="middle" font-size="10" fill="#d6a040">堆 push (grid[0][0], (0,0))</text>

  <path d="M 280 168 L 280 182" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. loop: pop -->
  <rect x="130" y="184" width="300" height="40" fill="#f6f6f6" stroke="#888" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="209" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">弹出堆顶 (d, u)：d 最小的「最大高度」</text>

  <path d="M 280 226 L 280 240" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4. decision: d > dist[u] ? -->
  <polygon points="280,242 400,288 280,334 160,288" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="284" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">d &gt; dist[u] ?</text>
  <text x="280" y="300" text-anchor="middle" font-size="9" fill="#888">懒删除判定</text>

  <!-- yes branch: skip -->
  <path d="M 400 288 L 440 288" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="412" y="282" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="442" y="270" width="100" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="492" y="293" text-anchor="middle" font-size="10" fill="#b85450">跳过（过期）</text>

  <!-- no branch -->
  <path d="M 280 334 L 280 348" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="346" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- 5. decision: u == end ? -->
  <polygon points="280,350 400,392 280,434 160,392" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="389" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">u == (n−1,n−1) ?</text>

  <!-- yes: return d -->
  <path d="M 400 392 L 446 392" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="416" y="386" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="448" y="374" width="96" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="496" y="398" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回 d</text>

  <!-- no: relax neighbors -->
  <path d="M 160 392 L 120 392 L 120 208 L 130 208" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="92" y="300" font-size="10" fill="#446688" font-weight="bold">否</text>

  <!-- relax box (left side) -->
  <rect x="40" y="244" width="156" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="118" y="264" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">松弛四邻格 v</text>
  <text x="118" y="284" text-anchor="middle" font-size="10" fill="#446688">nd = max(d, grid[v])</text>
  <text x="118" y="302" text-anchor="middle" font-size="10" fill="#446688">若 nd &lt; dist[v]：</text>
  <text x="118" y="318" text-anchor="middle" font-size="10" fill="#446688">  dist[v] = nd</text>
  <text x="118" y="334" text-anchor="middle" font-size="10" fill="#446688">  push (nd, v)</text>

  <!-- loop back arrow label -->
  <text x="78" y="200" font-size="9" fill="#888">回到弹堆顶</text>
</svg>
