<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：单次遍历，连续匹配计数判定</text>

  <!-- Start -->
  <ellipse cx="280" cy="52" rx="100" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="56" text-anchor="middle" font-size="11" fill="#333">count = 0，i = 0</text>

  <path d="M 280 70 L 280 82" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond 1: i <= n-1-m? -->
  <polygon points="280,82 392,114 280,146 168,114" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="110" text-anchor="middle" font-size="11" fill="#333">i ≤ n−1−m ?</text>
  <text x="280" y="126" text-anchor="middle" font-size="10" fill="#888">(可比较?)</text>

  <!-- No -> return false -->
  <path d="M 392 114 L 432 114" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="412" y="106" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <rect x="432" y="96" width="100" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="482" y="119" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回 false</text>

  <!-- Yes -> down -->
  <path d="M 280 146 L 280 160" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="156" font-size="10" fill="#82b366">是</text>

  <!-- Diamond 2: arr[i] == arr[i+m]? -->
  <polygon points="280,160 392,192 280,224 168,192" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="188" text-anchor="middle" font-size="11" fill="#333">arr[i] == arr[i+m]?</text>
  <text x="280" y="204" text-anchor="middle" font-size="10" fill="#888">(匹配?)</text>

  <!-- No -> count = 0 -->
  <path d="M 392 192 L 404 192" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="398" y="184" text-anchor="middle" font-size="10" fill="#446688">否</text>
  <rect x="404" y="176" width="100" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="454" y="197" text-anchor="middle" font-size="11" fill="#333">count = 0</text>

  <!-- Yes -> down to count++ -->
  <path d="M 280 224 L 280 238" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="234" font-size="10" fill="#b85450">是</text>

  <rect x="180" y="240" width="200" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="260" text-anchor="middle" font-size="11" fill="#333">① count++</text>

  <path d="M 280 270 L 280 282" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond 3: count >= m*(k-1)? -->
  <polygon points="280,282 384,314 280,346 176,314" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="310" text-anchor="middle" font-size="11" fill="#333">count ≥ m×(k−1)?</text>
  <text x="280" y="326" text-anchor="middle" font-size="10" fill="#888">(达到阈值?)</text>

  <!-- Yes -> return true -->
  <path d="M 384 314 L 432 314" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="408" y="306" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="432" y="296" width="100" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="482" y="314" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">返回 true</text>
  <text x="482" y="328" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">⭐</text>

  <!-- No -> down to i++ -->
  <path d="M 280 346 L 280 390" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="368" font-size="10" fill="#888">否</text>

  <!-- count=0 branch: down then left to i++ -->
  <path d="M 454 208 L 454 244 L 530 244 L 530 406" stroke="#888" stroke-width="1.2" stroke-dasharray="5,3" fill="none" filter="url(#rough2)"/>
  <path d="M 530 406 L 360 406" stroke="#888" stroke-width="1.2" stroke-dasharray="5,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i++ box -->
  <rect x="200" y="390" width="160" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="411" text-anchor="middle" font-size="11" fill="#333">i++，回到循环</text>

  <!-- Loop back arrow -->
  <path d="M 200 406 L 56 406 L 56 114 L 168 114" stroke="#888" stroke-width="1.2" stroke-dasharray="5,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="48" y="260" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 48 260)">继续下一个</text>

  <!-- Note -->
  <rect x="110" y="428" width="340" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="444" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">⚠️ 匹配则 count++，不匹配则清零，达 m×(k−1) 即返回 true</text>
</svg>
