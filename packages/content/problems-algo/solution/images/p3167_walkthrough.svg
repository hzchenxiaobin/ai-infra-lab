<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算："a3c9b2c1" → 逐对入桶 → "a3b2c10"</text>

  <!-- header row -->
  <rect x="36" y="48" width="58" height="30" fill="#446688" rx="4" filter="url(#rough2)"/>
  <text x="65" y="68" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold" filter="url(#rough2)">步骤</text>
  <rect x="94" y="48" width="108" height="30" fill="#446688" rx="4" filter="url(#rough2)"/>
  <text x="148" y="68" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold" filter="url(#rough2)">解析出 (c, x)</text>
  <rect x="202" y="48" width="158" height="30" fill="#446688" rx="4" filter="url(#rough2)"/>
  <text x="281" y="68" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold" filter="url(#rough2)">计数桶快照</text>
  <rect x="360" y="48" width="124" height="30" fill="#446688" rx="4" filter="url(#rough2)"/>
  <text x="422" y="68" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold" filter="url(#rough2)">说明</text>

  <!-- row 0 -->
  <rect x="36" y="82" width="58" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="65" y="105" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">0</text>
  <rect x="94" y="82" width="108" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="148" y="105" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">—</text>
  <rect x="202" y="82" width="158" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="281" y="105" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">全零</text>
  <rect x="360" y="82" width="124" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="422" y="105" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">初始化</text>

  <!-- row 1 -->
  <rect x="36" y="122" width="58" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="65" y="145" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="94" y="122" width="108" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="148" y="145" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">(a, 3)</text>
  <rect x="202" y="122" width="158" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="281" y="145" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">a:3</text>
  <rect x="360" y="122" width="124" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="422" y="145" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">新字符入桶</text>

  <!-- row 2 -->
  <rect x="36" y="162" width="58" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="65" y="185" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="94" y="162" width="108" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="148" y="185" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">(c, 9)</text>
  <rect x="202" y="162" width="158" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="281" y="185" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">a:3  c:9</text>
  <rect x="360" y="162" width="124" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="422" y="185" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">新字符入桶</text>

  <!-- row 3 -->
  <rect x="36" y="202" width="58" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="65" y="225" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">3</text>
  <rect x="94" y="202" width="108" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="148" y="225" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">(b, 2)</text>
  <rect x="202" y="202" width="158" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="281" y="225" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">a:3  b:2  c:9</text>
  <rect x="360" y="202" width="124" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="422" y="225" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">新字符入桶</text>

  <!-- row 4 highlighted -->
  <rect x="36" y="242" width="58" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="65" y="265" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="94" y="242" width="108" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="148" y="265" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">(c, 1)</text>
  <rect x="202" y="242" width="158" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="281" y="265" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">a:3  b:2  c:10</text>
  <rect x="360" y="242" width="124" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="422" y="258" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">c 已在桶中</text>
  <text x="422" y="272" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">9 + 1 = 10</text>

  <!-- row output -->
  <rect x="36" y="282" width="58" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="65" y="305" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">输出</text>
  <rect x="94" y="282" width="108" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="148" y="305" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">—</text>
  <rect x="202" y="282" width="158" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="281" y="305" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">按 a..z 遍历</text>
  <rect x="360" y="282" width="124" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="422" y="305" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">"a3b2c10"</text>

  <rect x="36" y="332" width="448" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="356" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">重复字符不是错误而是常态——桶累加天然处理；输出阶段免排序（桶下标即字典序）</text>
</svg>
