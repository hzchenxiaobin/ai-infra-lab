<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：n = 10</text>

  <!-- stage 1: sieve result -->
  <text x="30" y="60" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">① 埃氏筛后 isPrime[0..10]</text>

  <g font-size="11" filter="url(#rough2)">
    <!-- index labels -->
    <g fill="#888" font-size="10">
      <text x="56" y="86" text-anchor="middle">0</text>
      <text x="100" y="86" text-anchor="middle">1</text>
      <text x="144" y="86" text-anchor="middle">2</text>
      <text x="188" y="86" text-anchor="middle">3</text>
      <text x="232" y="86" text-anchor="middle">4</text>
      <text x="276" y="86" text-anchor="middle">5</text>
      <text x="320" y="86" text-anchor="middle">6</text>
      <text x="364" y="86" text-anchor="middle">7</text>
      <text x="408" y="86" text-anchor="middle">8</text>
      <text x="452" y="86" text-anchor="middle">9</text>
      <text x="496" y="86" text-anchor="middle">10</text>
    </g>
    <!-- cells -->
    <rect x="38" y="94" width="36" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="4"/>
    <text x="56" y="116" text-anchor="middle" fill="#999" font-weight="bold">F</text>

    <rect x="82" y="94" width="36" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="4"/>
    <text x="100" y="116" text-anchor="middle" fill="#999" font-weight="bold">F</text>

    <rect x="126" y="94" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="144" y="116" text-anchor="middle" fill="#4a7a3a" font-weight="bold">T</text>

    <rect x="170" y="94" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="188" y="116" text-anchor="middle" fill="#4a7a3a" font-weight="bold">T</text>

    <rect x="214" y="94" width="36" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="4"/>
    <text x="232" y="116" text-anchor="middle" fill="#999" font-weight="bold">F</text>

    <rect x="258" y="94" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="276" y="116" text-anchor="middle" fill="#4a7a3a" font-weight="bold">T</text>

    <rect x="302" y="94" width="36" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="4"/>
    <text x="320" y="116" text-anchor="middle" fill="#999" font-weight="bold">F</text>

    <rect x="346" y="94" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="364" y="116" text-anchor="middle" fill="#4a7a3a" font-weight="bold">T</text>

    <rect x="390" y="94" width="36" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="4"/>
    <text x="408" y="116" text-anchor="middle" fill="#999" font-weight="bold">F</text>

    <rect x="434" y="94" width="36" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="4"/>
    <text x="452" y="116" text-anchor="middle" fill="#999" font-weight="bold">F</text>

    <rect x="478" y="94" width="36" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="4"/>
    <text x="496" y="116" text-anchor="middle" fill="#999" font-weight="bold">F</text>
  </g>

  <text x="540" y="116" font-size="10" fill="#888" filter="url(#rough2)">质数：2,3,5,7</text>

  <!-- divider -->
  <line x1="30" y1="152" x2="590" y2="152" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <!-- stage 2: pairing table -->
  <text x="30" y="176" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">② 枚举 x∈[2, 5]，查 isPrime[x] &amp; isPrime[10−x]</text>

  <!-- table header -->
  <g font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">
    <rect x="30" y="188" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="70" y="206" text-anchor="middle">x</text>

    <rect x="114" y="188" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="154" y="206" text-anchor="middle">y=10−x</text>

    <rect x="198" y="188" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="258" y="206" text-anchor="middle">两数皆质?</text>

    <rect x="322" y="188" width="180" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="412" y="206" text-anchor="middle">操作</text>
  </g>

  <!-- rows -->
  <g font-size="12" filter="url(#rough2)">
    <!-- x=2 -->
    <rect x="30" y="220" width="80" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="70" y="240" text-anchor="middle" fill="#333" font-weight="bold">2</text>
    <rect x="114" y="220" width="80" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="154" y="240" text-anchor="middle" fill="#333" font-weight="bold">8</text>
    <rect x="198" y="220" width="120" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <text x="258" y="240" text-anchor="middle" fill="#b85450" font-weight="bold">✗ 8 非质</text>
    <rect x="322" y="220" width="180" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="412" y="240" text-anchor="middle" fill="#999">跳过</text>

    <!-- x=3 -->
    <rect x="30" y="252" width="80" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="70" y="272" text-anchor="middle" fill="#333" font-weight="bold">3</text>
    <rect x="114" y="252" width="80" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="154" y="272" text-anchor="middle" fill="#333" font-weight="bold">7</text>
    <rect x="198" y="252" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="258" y="272" text-anchor="middle" fill="#4a7a3a" font-weight="bold">✓ 皆质</text>
    <rect x="322" y="252" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="412" y="272" text-anchor="middle" fill="#4a7a3a" font-weight="bold">ans = [[3,7]]</text>

    <!-- x=4 -->
    <rect x="30" y="284" width="80" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="70" y="304" text-anchor="middle" fill="#333" font-weight="bold">4</text>
    <rect x="114" y="284" width="80" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="154" y="304" text-anchor="middle" fill="#333" font-weight="bold">6</text>
    <rect x="198" y="284" width="120" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <text x="258" y="304" text-anchor="middle" fill="#b85450" font-weight="bold">✗ 4 非质</text>
    <rect x="322" y="284" width="180" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="412" y="304" text-anchor="middle" fill="#999">跳过</text>

    <!-- x=5 -->
    <rect x="30" y="316" width="80" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="70" y="336" text-anchor="middle" fill="#333" font-weight="bold">5</text>
    <rect x="114" y="316" width="80" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="154" y="336" text-anchor="middle" fill="#333" font-weight="bold">5</text>
    <rect x="198" y="316" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="258" y="336" text-anchor="middle" fill="#4a7a3a" font-weight="bold">✓ 皆质</text>
    <rect x="322" y="316" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="412" y="336" text-anchor="middle" fill="#4a7a3a" font-weight="bold">ans = [[3,7],[5,5]]</text>
  </g>

  <!-- arrow down to result -->
  <path d="M 412 350 L 412 366" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- final result -->
  <rect x="30" y="370" width="560" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="310" y="392" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">输出：[[3,7],[5,5]]（x 递增 ⇒ 天然非递减序）</text>
</svg>
