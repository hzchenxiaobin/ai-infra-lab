<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrL" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">行星碰撞：方向与碰撞规则</text>

  <!-- Direction legend -->
  <text x="40" y="56" font-size="12" fill="#444" font-weight="bold">方向：</text>
  <circle cx="90" cy="52" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">+</text>
  <text x="110" y="56" font-size="11" fill="#666">向右 →</text>
  <circle cx="195" cy="52" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="195" y="56" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−</text>
  <text x="215" y="56" font-size="11" fill="#666">向左 ←</text>

  <!-- Row 1: no collision (same direction) -->
  <text x="40" y="96" font-size="11" fill="#888" font-weight="bold">不碰撞：</text>
  <circle cx="120" cy="100" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="104" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <line x1="140" y1="100" x2="165" y2="100" stroke="#446688" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <circle cx="195" cy="100" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="195" y="104" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">10</text>
  <line x1="215" y1="100" x2="240" y2="100" stroke="#446688" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="280" y="104" font-size="11" fill="#4a7a3a">都向右 → 不碰</text>

  <!-- Row 2: no collision (both left) -->
  <circle cx="120" cy="140" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="144" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <line x1="115" y1="140" x2="90" y2="140" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <circle cx="195" cy="140" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="195" y="144" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">10</text>
  <line x1="190" y1="140" x2="165" y2="140" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="280" y="144" font-size="11" fill="#4a7a3a">都向左 ← 不碰</text>

  <!-- Row 3: collision - bigger wins -->
  <text x="40" y="184" font-size="11" fill="#888" font-weight="bold">碰撞：</text>
  <circle cx="120" cy="188" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="192" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">10</text>
  <line x1="140" y1="188" x2="165" y2="188" stroke="#446688" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <circle cx="195" cy="188" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="195" y="192" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">5</text>
  <line x1="190" y1="188" x2="165" y2="188" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="280" y="192" font-size="11" fill="#b85450">10 > 5 → 5 爆炸💥</text>

  <!-- Row 4: collision - smaller wins (left bigger) -->
  <circle cx="120" cy="228" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="232" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">5</text>
  <line x1="140" y1="228" x2="165" y2="228" stroke="#446688" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <circle cx="195" cy="228" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="195" y="232" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">15</text>
  <line x1="190" y1="228" x2="165" y2="228" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="280" y="232" font-size="11" fill="#b85450">15 > 5 → 5 爆炸💥</text>

  <!-- Row 5: equal - both explode -->
  <circle cx="120" cy="268" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="272" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">8</text>
  <line x1="140" y1="268" x2="165" y2="268" stroke="#446688" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <circle cx="195" cy="268" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="195" y="272" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">8</text>
  <line x1="190" y1="268" x2="165" y2="268" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="280" y="272" font-size="11" fill="#b85450">8 = 8 → 都爆炸💥💥</text>

  <!-- Stack concept -->
  <rect x="40" y="300" width="480" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">核心：用栈模拟 → 向右的入栈，向左的与栈顶碰撞</text>
  <text x="280" y="340" text-anchor="middle" font-size="11" fill="#666">栈顶向右 &amp; 当前向左 → 碰撞；否则当前入栈</text>
  <text x="280" y="355" text-anchor="middle" font-size="11" fill="#888">只有「栈顶向右、当前向左」才会碰撞，其余情况一律入栈</text>
</svg>
