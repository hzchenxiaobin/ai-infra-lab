<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 620"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="620" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">单词规律 II：回溯 + 双向哈希流程</text>

  <rect x="150" y="50" width="260" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="280" y="72" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">dfs(pi, si) ; c2w={}, w2c={}</text>
  <line x1="280" y1="84" x2="280" y2="104" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,106 400,146 280,186 160,146" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="142" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">pi == len(p) ?</text>
  <line x1="160" y1="146" x2="110" y2="146" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="135" y="140" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="14" y="126" width="96" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="62" y="146" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">return</text>
  <text x="62" y="161" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">si == len(s)</text>
  <line x1="400" y1="146" x2="450" y2="146" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="425" y="140" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">否</text>

  <rect x="180" y="196" width="200" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="217" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">ch = pattern[pi]</text>
  <line x1="280" y1="210" x2="280" y2="196" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)" transform="translate(0,-8)"/>
  <line x1="450" y1="146" x2="450" y2="180" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="450" y1="180" x2="280" y2="180" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="280" y1="180" x2="280" y2="196" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="280" y1="228" x2="280" y2="248" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,250 380,290 280,330 180,290" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="286" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ch 在 c2w 中 ?</text>
  <line x1="280" y1="330" x2="280" y2="350" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="344" font-size="11" fill="#4a7a3a" filter="url(#rough2)">未映射</text>
  <line x1="180" y1="290" x2="120" y2="290" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="284" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">已映射</text>

  <rect x="30" y="334" width="180" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="120" y="356" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">w = c2w[ch]</text>
  <text x="120" y="374" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">s[si:] 以 w 开头?</text>
  <text x="120" y="392" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是→dfs(pi+1, si+|w|)</text>
  <text x="120" y="404" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否→false（剪枝）</text>

  <rect x="220" y="352" width="300" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="370" y="374" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">枚举 len = 1 .. 剩余长度</text>
  <line x1="232" y1="384" x2="508" y2="384" stroke="#446688" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="370" y="404" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">w = s[si : si+len]</text>
  <text x="370" y="422" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">w 已被占? skip（保反向单射）</text>
  <text x="370" y="442" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">登记 c2w[ch]=w , w2c[w]=ch</text>
  <text x="370" y="460" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">dfs(pi+1, si+len)? 成功→true</text>

  <rect x="250" y="486" width="240" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="370" y="508" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">失败→撤销 c2w[w]/w2c[w]，试下一 len</text>
  <line x1="370" y1="472" x2="370" y2="486" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 490 503 Q 540 503 540 412 Q 540 412 520 412" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="510" y="460" font-size="10" fill="#b85450" filter="url(#rough2)">回溯</text>

  <rect x="60" y="486" width="170" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="145" y="508" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">所有 len 试完→false</text>
  <line x1="120" y1="410" x2="120" y2="486" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="120" y="548" width="320" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="570" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">两剪枝即 290 双射规则</text>
  <text x="280" y="588" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">已映射：前缀校验｜未映射：跳过占用子串</text>
</svg>
