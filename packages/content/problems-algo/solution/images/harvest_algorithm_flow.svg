<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrU" markerWidth="8" markerHeight="8" refX="4" refY="1" orient="auto">
      <path d="M0,8 L4,1 L8,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="480" height="440" fill="#fafafa"/>

  <text x="240" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">摘水果 · 滑动窗口流程</text>

  <!-- Step 1: Init -->
  <rect x="110" y="42" width="260" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="240" y="62" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">初始化</text>
  <text x="240" y="78" text-anchor="middle" font-size="11" fill="#555">l = 0, ans = 0, 预处理 prefix[]</text>

  <path d="M 240 90 L 240 108" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: for r = 0 to n-1 -->
  <rect x="100" y="112" width="280" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="240" y="138" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">for r = 0  to  n − 1</text>

  <path d="M 240 156 L 240 174" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Diamond: cost(l,r) > k? -->
  <polygon points="240,178 350,220 240,262 130,220" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="240" y="214" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">cost(l, r) &gt; k ?</text>
  <text x="240" y="232" text-anchor="middle" font-size="10" fill="#777">代价超限？</text>

  <!-- Yes branch: l++ -->
  <path d="M 130 220 L 50 220 L 50 250" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="64" y="212" font-size="11" fill="#b85450" font-weight="bold">Yes</text>

  <rect x="12" y="254" width="76" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="50" y="274" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">l ++</text>
  <text x="50" y="290" text-anchor="middle" font-size="9.5" fill="#888">收缩窗口</text>

  <!-- Loop back from l++ to diamond -->
  <path d="M 50 254 L 50 200 L 130 200 L 130 215" stroke="#888" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- No branch: update ans -->
  <path d="M 350 220 L 420 220 L 420 250" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="392" y="212" font-size="11" fill="#4a7a3a" font-weight="bold">No</text>

  <rect x="370" y="254" width="98" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="419" y="274" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">更新答案</text>
  <text x="419" y="290" text-anchor="middle" font-size="9.5" fill="#555">ans = max(ans,</text>
  <text x="419" y="304" text-anchor="middle" font-size="9.5" fill="#555">prefix[r+1]−prefix[l])</text>

  <!-- Both branches converge, loop back to for -->
  <path d="M 50 304 L 50 340" stroke="#888" stroke-width="1.8" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <path d="M 419 318 L 419 340" stroke="#888" stroke-width="1.8" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <path d="M 50 340 L 419 340" stroke="#888" stroke-width="1.8" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <path d="M 240 340 L 240 132 L 100 132" stroke="#888" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="252" y="335" font-size="10" fill="#888" font-style="italic">下一轮 r</text>

  <!-- Return -->
  <rect x="150" y="390" width="180" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="240" y="412" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">return ans  (O(n), O(n))</text>
</svg>
