<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="360" fill="#fafafa"/>

  <text x="290" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：14 次提及 → 11 组 → 9 标签并列靠 hashtag 降序截断</text>

  <rect x="18" y="44" width="146" height="234" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="91" y="62" text-anchor="middle" font-size="10" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">炸行：14 行提及</text>
  <text x="26" y="80" font-size="8" fill="#888" filter="url(#rough2)">13</text>
  <text x="44" y="80" font-size="8" fill="#b85450" filter="url(#rough2)">#HappyDay</text>
  <text x="26" y="93" font-size="8" fill="#888" filter="url(#rough2)">13</text>
  <text x="44" y="93" font-size="8" fill="#b85450" filter="url(#rough2)">#MorningVibes</text>
  <text x="26" y="106" font-size="8" fill="#888" filter="url(#rough2)">14</text>
  <text x="44" y="106" font-size="8" fill="#b85450" filter="url(#rough2)">#HappyDay</text>
  <text x="26" y="119" font-size="8" fill="#888" filter="url(#rough2)">14</text>
  <text x="44" y="119" font-size="8" fill="#b85450" filter="url(#rough2)">#FeelGood</text>
  <text x="26" y="132" font-size="8" fill="#888" filter="url(#rough2)">15</text>
  <text x="44" y="132" font-size="8" fill="#b85450" filter="url(#rough2)">#WorkLife</text>
  <text x="26" y="145" font-size="8" fill="#888" filter="url(#rough2)">15</text>
  <text x="44" y="145" font-size="8" fill="#b85450" filter="url(#rough2)">#ProductiveDay</text>
  <text x="26" y="158" font-size="8" fill="#888" filter="url(#rough2)">16</text>
  <text x="44" y="158" font-size="8" fill="#b85450" filter="url(#rough2)">#TechLife</text>
  <text x="26" y="171" font-size="8" fill="#888" filter="url(#rough2)">16</text>
  <text x="44" y="171" font-size="8" fill="#b85450" filter="url(#rough2)">#Innovation</text>
  <text x="26" y="184" font-size="8" fill="#888" filter="url(#rough2)">17</text>
  <text x="44" y="184" font-size="8" fill="#b85450" filter="url(#rough2)">#HappyDay</text>
  <text x="26" y="197" font-size="8" fill="#888" filter="url(#rough2)">17</text>
  <text x="44" y="197" font-size="8" fill="#b85450" filter="url(#rough2)">#Thankful</text>
  <text x="26" y="210" font-size="8" fill="#888" filter="url(#rough2)">18</text>
  <text x="44" y="210" font-size="8" fill="#b85450" filter="url(#rough2)">#TechLife</text>
  <text x="26" y="223" font-size="8" fill="#888" filter="url(#rough2)">18</text>
  <text x="44" y="223" font-size="8" fill="#b85450" filter="url(#rough2)">#FutureTech</text>
  <text x="26" y="236" font-size="8" fill="#888" filter="url(#rough2)">19</text>
  <text x="44" y="236" font-size="8" fill="#b85450" filter="url(#rough2)">#Nature</text>
  <text x="26" y="249" font-size="8" fill="#888" filter="url(#rough2)">19</text>
  <text x="44" y="249" font-size="8" fill="#b85450" filter="url(#rough2)">#Peaceful</text>
  <text x="91" y="270" text-anchor="middle" font-size="8.5" fill="#8a6d1a" filter="url(#rough2)">7 推文 × 2 标签 = 14 ✓</text>

  <path d="M 166 160 L 180 160" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="173" y="150" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">分组</text>

  <rect x="184" y="44" width="140" height="234" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="254" y="62" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">11 组计数</text>
  <text x="194" y="84" font-size="9" fill="#333" filter="url(#rough2)">#HappyDay</text>
  <text x="314" y="84" text-anchor="end" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="194" y="104" font-size="9" fill="#333" filter="url(#rough2)">#TechLife</text>
  <text x="314" y="104" text-anchor="end" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="194" y="126" font-size="8.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">以下 9 个并列 1 次：</text>
  <text x="194" y="142" font-size="8" fill="#333" filter="url(#rough2)">#WorkLife</text>
  <text x="194" y="156" font-size="8" fill="#333" filter="url(#rough2)">#Thankful</text>
  <text x="194" y="170" font-size="8" fill="#333" filter="url(#rough2)">#ProductiveDay</text>
  <text x="194" y="184" font-size="8" fill="#333" filter="url(#rough2)">#Peaceful</text>
  <text x="258" y="142" font-size="8" fill="#333" filter="url(#rough2)">#Nature</text>
  <text x="258" y="156" font-size="8" fill="#333" filter="url(#rough2)">#MorningVibes</text>
  <text x="258" y="170" font-size="8" fill="#333" filter="url(#rough2)">#Innovation</text>
  <text x="258" y="184" font-size="8" fill="#333" filter="url(#rough2)">#FutureTech #FeelGood</text>
  <text x="254" y="212" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">3 + 2 + 9 × 1 = 14 ✓</text>
  <text x="254" y="232" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">9 个标签并列第 3，</text>
  <text x="254" y="246" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">hashtag 降序定生死</text>
  <text x="254" y="266" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">W &gt; T &gt; P &gt; N &gt; M &gt; I &gt; F</text>

  <path d="M 326 160 L 340 160" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="333" y="150" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">Top-3</text>

  <rect x="344" y="44" width="104" height="234" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="396" y="64" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">输出</text>
  <rect x="354" y="76" width="84" height="30" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="396" y="95" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">#HappyDay 3</text>
  <rect x="354" y="112" width="84" height="30" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="396" y="131" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">#TechLife 2</text>
  <rect x="354" y="148" width="84" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="396" y="167" text-anchor="middle" font-size="9" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">#WorkLife 1 ★</text>
  <text x="396" y="200" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">其余 8 个出局</text>
  <text x="396" y="222" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">(count, hashtag)</text>
  <text x="396" y="236" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">全序 ⇒ 截断</text>
  <text x="396" y="250" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">唯一确定</text>

  <rect x="462" y="44" width="100" height="234" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="512" y="64" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">并列 9 选 1</text>
  <text x="470" y="86" font-size="8" fill="#b85450" font-weight="bold" filter="url(#rough2)">1. #WorkLife</text>
  <text x="470" y="104" font-size="8" fill="#333" filter="url(#rough2)">2. #Thankful</text>
  <text x="470" y="122" font-size="8" fill="#333" filter="url(#rough2)">3. #ProductiveDay</text>
  <text x="470" y="140" font-size="8" fill="#333" filter="url(#rough2)">4. #Peaceful</text>
  <text x="470" y="158" font-size="8" fill="#333" filter="url(#rough2)">5. #Nature</text>
  <text x="470" y="176" font-size="8" fill="#333" filter="url(#rough2)">6. #MorningVibes</text>
  <text x="470" y="194" font-size="8" fill="#333" filter="url(#rough2)">7. #Innovation</text>
  <text x="470" y="212" font-size="8" fill="#333" filter="url(#rough2)">8. #FutureTech</text>
  <text x="470" y="230" font-size="8" fill="#333" filter="url(#rough2)">9. #FeelGood</text>
  <text x="512" y="256" text-anchor="middle" font-size="8" fill="#b85450" filter="url(#rough2)">按字典序降序</text>
  <text x="512" y="270" text-anchor="middle" font-size="8" fill="#b85450" filter="url(#rough2)">首名即第 3 行</text>

  <rect x="18" y="292" width="544" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="290" y="311" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">惯性写 hashtag ASC 会输出 #FeelGood 直接 WA——并列规模从前作的 2 个膨胀到 9 个；</text>
  <text x="290" y="328" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">双降序让 (count, hashtag) 构成全序：9 个并列 1 次的标签谁进第 3 行由字典序唯一确定，</text>
  <text x="290" y="342" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">LIMIT 3 的截断结果不再依赖引擎心情——tie-break 不是装饰，是判题的对错线</text>
</svg>
