<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="500" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：唯一解 vs 多解</text>

  <!-- ===== Example 1: unique ===== -->
  <rect x="20" y="42" width="540" height="190" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)" fill-opacity="0.3"/>
  <text x="40" y="62" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">示例 1：pairs = [[1,2],[2,3]] → 返回 1（唯一）</text>

  <!-- adj sets -->
  <g filter="url(#rough2)" font-size="10" fill="#555">
    <text x="40" y="84">adj[1] = {2}　deg=1</text>
    <text x="40" y="100">adj[2] = {1,3}　deg=2　← 根 (n−1=2) ✓</text>
    <text x="40" y="116">adj[3] = {2}　deg=1</text>
  </g>

  <!-- sorted -->
  <text x="40" y="138" font-size="10" fill="#888" filter="url(#rough2)">排序（度降序）：[2, 1, 3]</text>

  <!-- process table -->
  <g filter="url(#rough2)" font-size="9">
    <rect x="40" y="148" width="500" height="22" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <text x="50" y="163" font-weight="bold" fill="#446688">x</text>
    <text x="100" y="163" font-weight="bold" fill="#446688">parent</text>
    <text x="190" y="163" font-weight="bold" fill="#446688">验证</text>
    <text x="350" y="163" font-weight="bold" fill="#446688">deg(x)==deg(p)?</text>
    <text x="490" y="163" font-weight="bold" fill="#446688">结果</text>

    <rect x="40" y="170" width="500" height="22" fill="#f6fff6" stroke="#ddd" stroke-width="0.8" rx="3"/>
    <text x="50" y="185" fill="#555">1</text>
    <text x="100" y="185" fill="#555">2</text>
    <text x="190" y="185" fill="#4a7a3a">adj[1]\{2}=∅ ⊆ adj[2] ✓</text>
    <text x="350" y="185" fill="#4a7a3a">1 ≠ 2 → 否</text>
    <text x="490" y="185" fill="#4a7a3a" font-weight="bold">—</text>

    <rect x="40" y="192" width="500" height="22" fill="#f6fff6" stroke="#ddd" stroke-width="0.8" rx="3"/>
    <text x="50" y="207" fill="#555">3</text>
    <text x="100" y="207" fill="#555">2</text>
    <text x="190" y="207" fill="#4a7a3a">adj[3]\{2}=∅ ⊆ adj[2] ✓</text>
    <text x="350" y="207" fill="#4a7a3a">1 ≠ 2 → 否</text>
    <text x="490" y="207" fill="#4a7a3a" font-weight="bold">—</text>
  </g>

  <!-- result -->
  <rect x="350" y="220" width="120" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="410" y="237" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 1 ✓</text>

  <!-- tree sketch -->
  <g filter="url(#rough2)" font-size="11" font-weight="bold" text-anchor="middle">
    <circle cx="100" cy="210" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="100" y="214" fill="#446688">2</text>
    <circle cx="70" cy="246" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="70" y="250" font-size="9" fill="#4a7a3a">1</text>
    <circle cx="130" cy="246" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="130" y="250" font-size="9" fill="#4a7a3a">3</text>
  </g>
  <g filter="url(#rough2)" stroke="#888" stroke-width="1.5" fill="none">
    <path d="M 94 222 L 74 234" marker-end="url(#arr)"/>
    <path d="M 106 222 L 126 234" marker-end="url(#arr)"/>
  </g>

  <!-- ===== Example 2: multiple ===== -->
  <rect x="20" y="252" width="540" height="240" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)" fill-opacity="0.3"/>
  <text x="40" y="272" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">示例 2：pairs = [[1,2],[2,3],[1,3]] → 返回 2（多解）</text>

  <!-- adj sets -->
  <g filter="url(#rough2)" font-size="10" fill="#555">
    <text x="40" y="294">adj[1] = {2,3}　deg=2　← 根 (n−1=2) ✓</text>
    <text x="40" y="310">adj[2] = {1,3}　deg=2</text>
    <text x="40" y="326">adj[3] = {1,2}　deg=2</text>
  </g>

  <text x="40" y="348" font-size="10" fill="#888" filter="url(#rough2)">排序（度降序）：[1, 2, 3]（三者度相同）</text>

  <!-- process table -->
  <g filter="url(#rough2)" font-size="9">
    <rect x="40" y="358" width="500" height="22" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <text x="50" y="373" font-weight="bold" fill="#446688">x</text>
    <text x="100" y="373" font-weight="bold" fill="#446688">parent</text>
    <text x="190" y="373" font-weight="bold" fill="#446688">验证</text>
    <text x="350" y="373" font-weight="bold" fill="#446688">deg(x)==deg(p)?</text>
    <text x="490" y="373" font-weight="bold" fill="#446688">结果</text>

    <rect x="40" y="380" width="500" height="22" fill="#fff5f5" stroke="#ddd" stroke-width="0.8" rx="3"/>
    <text x="50" y="395" fill="#555">2</text>
    <text x="100" y="395" fill="#555">1</text>
    <text x="190" y="395" fill="#4a7a3a">adj[2]\{1}={3} ⊆ adj[1] ✓</text>
    <text x="350" y="395" fill="#b85450" font-weight="bold">2 == 2 → 是!</text>
    <text x="490" y="395" fill="#b85450" font-weight="bold">multiple</text>

    <rect x="40" y="402" width="500" height="22" fill="#fff5f5" stroke="#ddd" stroke-width="0.8" rx="3"/>
    <text x="50" y="417" fill="#555">3</text>
    <text x="100" y="417" fill="#555">2</text>
    <text x="190" y="417" fill="#4a7a3a">adj[3]\{2}={1} ⊆ adj[2] ✓</text>
    <text x="350" y="417" fill="#b85450" font-weight="bold">2 == 2 → 是!</text>
    <text x="490" y="417" fill="#b85450" font-weight="bold">multiple</text>
  </g>

  <!-- result -->
  <rect x="350" y="432" width="120" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="410" y="449" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 2 ✓</text>

  <!-- possible trees -->
  <text x="40" y="452" font-size="9" fill="#888" filter="url(#rough2)">三种合法树：</text>
  <g filter="url(#rough2)" font-size="9" text-anchor="middle">
    <!-- tree 1: 1→2→3 -->
    <circle cx="80" cy="466" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="80" y="469" fill="#446688">1</text>
    <circle cx="80" cy="486" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="80" y="489" font-size="8" fill="#4a7a3a">2</text>
    <circle cx="80" cy="506" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <text x="80" y="509" font-size="7" fill="#d6a040">3</text>
    <path d="M 80 476 L 80 477" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
    <path d="M 80 495 L 80 498" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>

    <!-- tree 2: 2→1→3 -->
    <circle cx="180" cy="466" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="180" y="469" fill="#446688">2</text>
    <circle cx="180" cy="486" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="180" y="489" font-size="8" fill="#4a7a3a">1</text>
    <circle cx="180" cy="506" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <text x="180" y="509" font-size="7" fill="#d6a040">3</text>

    <!-- tree 3: 3→2→1 -->
    <circle cx="280" cy="466" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="469" fill="#446688">3</text>
    <circle cx="280" cy="486" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="280" y="489" font-size="8" fill="#4a7a3a">2</text>
    <circle cx="280" cy="506" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <text x="280" y="509" font-size="7" fill="#d6a040">1</text>
  </g>
  <text x="180" y="424" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">…等（3! / 2 = 3 种链）</text>

  <!-- Footer -->
  <text x="290" y="496" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">deg(x)==deg(parent) ⟹ adj[x]∪{x}=adj[p]∪{p} → 两节点可互换父/子角色 → 多解</text>
</svg>
