<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：n 恰好 3 个除数 ⟺ n = p²（p 为质数）</text>

  <!-- Left: pairing illustration for n = 4 -->
  <text x="150" y="58" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold">除数成对：以 n = 4 为例</text>

  <!-- Pair (1, 4) -->
  <rect x="70" y="74" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="93" y="94" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="184" y="74" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="207" y="94" text-anchor="middle" font-size="13" fill="#333">4</text>
  <path d="M 116 89 L 184 89" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrD)" marker-start="url(#arrD)" filter="url(#rough2)"/>
  <text x="150" y="70" text-anchor="middle" font-size="10.5" fill="#888">配对 (1, 4)</text>

  <!-- Self-paired 2 -->
  <rect x="127" y="124" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="146" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">2</text>
  <text x="150" y="172" text-anchor="middle" font-size="10.5" fill="#d6a040">自配对：2 = √4</text>

  <!-- Count box -->
  <rect x="70" y="186" width="160" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="207" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">除数 = {1, 2, 4} → 3 个 ✓</text>

  <!-- Pairing principle note -->
  <path d="M 40 236 L 260 236" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="150" y="256" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">配对原理</text>
  <text x="48" y="276" font-size="11" fill="#555">• 每个除数 d 配 n/d，成对出现</text>
  <text x="48" y="294" font-size="11" fill="#555">• 总数奇 ⟹ 必有自配对 d = √n</text>
  <text x="48" y="312" font-size="11" fill="#555">• 自配对唯一 ⟹ n 必为完全平方</text>

  <!-- Right: conclusion chain -->
  <text x="410" y="58" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold">两步推演</text>

  <!-- Step 1 -->
  <rect x="300" y="74" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="410" y="91" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">① 总数 = 3（奇）</text>
  <text x="410" y="107" text-anchor="middle" font-size="11" fill="#555">⟹ n = k²（完全平方）</text>

  <path d="M 410 116 L 410 132" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="300" y="132" width="220" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="410" y="149" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">② 恰好 {1, k, k²} 三者</text>
  <text x="410" y="165" text-anchor="middle" font-size="11" fill="#555">⟹ k 无 (1, k) 内因子 ⟹ k 质数</text>

  <path d="M 410 174 L 410 190" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Conclusion -->
  <rect x="300" y="190" width="220" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="410" y="210" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">n = p²，p 质数</text>
  <text x="410" y="227" text-anchor="middle" font-size="11" fill="#4a7a3a">⟺ d(n) = 3</text>

  <!-- Right notes -->
  <path d="M 280 246 L 540 246" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="410" y="266" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">为何 k 必须是质数</text>
  <text x="294" y="286" font-size="11" fill="#555">• k 复合 ⟹ k = a·b (1&lt;a&lt;k)</text>
  <text x="294" y="304" font-size="11" fill="#555">  ⟹ a | k | k²，a 是第 4 个除数</text>
  <text x="294" y="322" font-size="11" fill="#555">• 故 k 必须只有 {1, k} 两个因子</text>

  <!-- Bottom: examples strip -->
  <path d="M 40 346 L 540 346" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="280" y="366" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">实例对照</text>

  <rect x="48" y="378" width="86" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="91" y="398" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">4 = 2² ✓</text>

  <rect x="146" y="378" width="86" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="189" y="398" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">9 = 3² ✓</text>

  <rect x="244" y="378" width="86" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="287" y="398" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">25 = 5² ✓</text>

  <rect x="342" y="378" width="96" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="390" y="398" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">16 = 4² ✗</text>

  <rect x="448" y="378" width="96" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="496" y="398" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">36 = 6² ✗</text>
</svg>
