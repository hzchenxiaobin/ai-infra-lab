<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例 2 演算：枚举 k 求最大美丽值</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">sorted [2,3,4,5]，target=5，full=2，partial=6，newFlowers=10</text>

  <!-- Table frame -->
  <!-- columns: k | 后缀(完善) | completeCost | remain | 前缀最小 m | 美丽值 -->
  <!-- x: 40 120 230 320 390 470 ; width 560 -->
  <rect x="40" y="58" width="480" height="270" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>

  <!-- header row -->
  <rect x="40" y="58" width="480" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="78" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">k</text>
  <text x="160" y="78" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">后缀(完善)</text>
  <text x="260" y="78" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">completeCost</text>
  <text x="350" y="78" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">remain</text>
  <text x="420" y="78" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">前缀最小 m</text>
  <text x="495" y="78" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">美丽值</text>

  <!-- column separators -->
  <path d="M110,58 L110,328" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M210,58 L210,328" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M310,58 L310,328" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M390,58 L390,328" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M460,58 L460,328" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- row k=4 (invalid) y=88..128 -->
  <text x="70" y="112" text-anchor="middle" font-size="11" fill="#888">4</text>
  <text x="160" y="112" text-anchor="middle" font-size="10.5" fill="#888">∅</text>
  <text x="260" y="112" text-anchor="middle" font-size="10.5" fill="#888">0</text>
  <text x="350" y="112" text-anchor="middle" font-size="10.5" fill="#888">10</text>
  <text x="420" y="112" text-anchor="middle" font-size="9.5" fill="#b85450">含已完善→跳过</text>
  <text x="495" y="112" text-anchor="middle" font-size="10.5" fill="#888">—</text>
  <path d="M40,128 L520,128" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- row k=3 y=128..168 -->
  <text x="70" y="152" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="160" y="152" text-anchor="middle" font-size="10.5" fill="#4a7a3a">[5]</text>
  <text x="260" y="152" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <text x="350" y="152" text-anchor="middle" font-size="10.5" fill="#333">10</text>
  <text x="420" y="152" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">4</text>
  <text x="495" y="152" text-anchor="middle" font-size="10.5" fill="#333">26</text>
  <path d="M40,168 L520,168" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- row k=2 y=168..208 -->
  <text x="70" y="192" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="160" y="192" text-anchor="middle" font-size="10.5" fill="#4a7a3a">[4,5]</text>
  <text x="260" y="192" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <text x="350" y="192" text-anchor="middle" font-size="10.5" fill="#333">9</text>
  <text x="420" y="192" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">4</text>
  <text x="495" y="192" text-anchor="middle" font-size="10.5" fill="#333">28</text>
  <path d="M40,208 L520,208" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- row k=1 (highlight) y=208..248 -->
  <rect x="41" y="208" width="478" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="70" y="233" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <text x="160" y="233" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">[3,4,5]</text>
  <text x="260" y="233" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">3</text>
  <text x="350" y="233" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">7</text>
  <text x="420" y="233" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">4</text>
  <text x="495" y="233" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">30 ←max</text>

  <!-- row k=0 y=248..288 -->
  <text x="70" y="272" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="160" y="272" text-anchor="middle" font-size="10.5" fill="#4a7a3a">[2,3,4,5]</text>
  <text x="260" y="272" text-anchor="middle" font-size="10.5" fill="#333">6</text>
  <text x="350" y="272" text-anchor="middle" font-size="10.5" fill="#333">4</text>
  <text x="420" y="272" text-anchor="middle" font-size="9.5" fill="#4a7a3a">全完善</text>
  <text x="495" y="272" text-anchor="middle" font-size="10.5" fill="#333">8</text>

  <!-- footer note -->
  <text x="280" y="316" text-anchor="middle" font-size="10" fill="#555">completeCost 随 k 递减而累加：每步 += target − flowers[k−1]</text>
  <text x="280" y="332" text-anchor="middle" font-size="10" fill="#555">m 由二分求得：remain 越多、前缀越短，m 越高（此处恒为 4 = target−1）</text>
  <text x="280" y="348" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">答案 = 30</text>
</svg>
