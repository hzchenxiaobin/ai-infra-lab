<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="860" height="430" fill="#fafafa"/>

  <text x="430" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n=5, minProfit=3, group=[2,2], profit=[2,3]</text>
  <text x="430" y="42" text-anchor="middle" font-size="11" fill="#888">dp[j][p] = 用 j 名成员、利润 ≥ p 的方案数（p 截断到 3）</text>

  <!-- ===== 表格通用参数 =====
       每张表: 行标签列 36, 4 数据列各 46 = 220 宽; 表头 22, 6 数据行各 30 = 202 高
       表1 tx=24, 表2 tx=320, 表3 tx=616 -->

  <!-- ===== 初始 ===== -->
  <text x="24" y="74" font-size="11" fill="#666" font-weight="bold">初始</text>
  <text x="24" y="88" font-size="9" fill="#999">dp[0][0]=1</text>
  <!-- 表头 p=0..3 -->
  <rect x="60" y="92" width="46" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="83" y="108" text-anchor="middle" font-size="10" fill="#888">p=0</text>
  <rect x="106" y="92" width="46" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="129" y="108" text-anchor="middle" font-size="10" fill="#888">p=1</text>
  <rect x="152" y="92" width="46" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="175" y="108" text-anchor="middle" font-size="10" fill="#888">p=2</text>
  <rect x="198" y="92" width="46" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="221" y="108" text-anchor="middle" font-size="10" fill="#888">p=3</text>
  <!-- 行 j=0..5 -->
  <rect x="24" y="114" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="42" y="134" text-anchor="middle" font-size="10" fill="#888">j=0</text>
  <rect x="60" y="114" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="83" y="134" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <rect x="106" y="114" width="46" height="30" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="152" y="114" width="46" height="30" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="198" y="114" width="46" height="30" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <!-- j=1..5 全 0 -->
  <rect x="24" y="144" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="42" y="164" text-anchor="middle" font-size="10" fill="#888">j=1</text>
  <rect x="60" y="144" width="184" height="30" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="24" y="174" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="42" y="194" text-anchor="middle" font-size="10" fill="#888">j=2</text>
  <rect x="60" y="174" width="184" height="30" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="24" y="204" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="42" y="224" text-anchor="middle" font-size="10" fill="#888">j=3</text>
  <rect x="60" y="204" width="184" height="30" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="24" y="234" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="42" y="254" text-anchor="middle" font-size="10" fill="#888">j=4</text>
  <rect x="60" y="234" width="184" height="30" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="24" y="264" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="42" y="284" text-anchor="middle" font-size="10" fill="#888">j=5</text>
  <rect x="60" y="264" width="184" height="30" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>

  <!-- 箭头到表2 -->
  <path d="M 248 170 L 316 170" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="252" y="162" font-size="9" fill="#888">犯罪0</text>
  <text x="252" y="184" font-size="9" fill="#999">g=2,pr=2</text>

  <!-- ===== 处理犯罪0 (g=2,pr=2) ===== -->
  <text x="320" y="74" font-size="11" fill="#666" font-weight="bold">处理犯罪 0</text>
  <text x="320" y="88" font-size="9" fill="#999">g=2, pr=2</text>
  <rect x="356" y="92" width="46" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="379" y="108" text-anchor="middle" font-size="10" fill="#888">p=0</text>
  <rect x="402" y="92" width="46" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="425" y="108" text-anchor="middle" font-size="10" fill="#888">p=1</text>
  <rect x="448" y="92" width="46" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="471" y="108" text-anchor="middle" font-size="10" fill="#888">p=2</text>
  <rect x="494" y="92" width="46" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="517" y="108" text-anchor="middle" font-size="10" fill="#888">p=3</text>
  <!-- j=0 -->
  <rect x="320" y="114" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="338" y="134" text-anchor="middle" font-size="10" fill="#888">j=0</text>
  <rect x="356" y="114" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="379" y="134" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="402" y="114" width="46" height="30" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="448" y="114" width="46" height="30" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="494" y="114" width="46" height="30" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <!-- j=1 -->
  <rect x="320" y="144" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="338" y="164" text-anchor="middle" font-size="10" fill="#888">j=1</text>
  <rect x="356" y="144" width="184" height="30" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <!-- j=2: dp[2][2]=1 -->
  <rect x="320" y="174" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="338" y="194" text-anchor="middle" font-size="10" fill="#888">j=2</text>
  <rect x="356" y="174" width="46" height="30" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="402" y="174" width="46" height="30" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="448" y="174" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="471" y="194" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <rect x="494" y="174" width="46" height="30" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="546" y="194" font-size="9" fill="#999">dp[2][2]</text>
  <text x="546" y="206" font-size="8" fill="#999">=dp[0][0]</text>
  <!-- j=3 -->
  <rect x="320" y="204" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="338" y="224" text-anchor="middle" font-size="10" fill="#888">j=3</text>
  <rect x="356" y="204" width="184" height="30" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <!-- j=4 -->
  <rect x="320" y="234" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="338" y="254" text-anchor="middle" font-size="10" fill="#888">j=4</text>
  <rect x="356" y="234" width="184" height="30" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <!-- j=5 -->
  <rect x="320" y="264" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="338" y="284" text-anchor="middle" font-size="10" fill="#888">j=5</text>
  <rect x="356" y="264" width="184" height="30" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>

  <!-- 箭头到表3 -->
  <path d="M 544 170 L 612 170" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="548" y="162" font-size="9" fill="#888">犯罪1</text>
  <text x="548" y="184" font-size="9" fill="#999">g=2,pr=3</text>

  <!-- ===== 处理犯罪1 (g=2,pr=3) ===== -->
  <text x="616" y="74" font-size="11" fill="#666" font-weight="bold">处理犯罪 1</text>
  <text x="616" y="88" font-size="9" fill="#999">g=2, pr=3</text>
  <rect x="652" y="92" width="46" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="675" y="108" text-anchor="middle" font-size="10" fill="#888">p=0</text>
  <rect x="698" y="92" width="46" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="721" y="108" text-anchor="middle" font-size="10" fill="#888">p=1</text>
  <rect x="744" y="92" width="46" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="767" y="108" text-anchor="middle" font-size="10" fill="#888">p=2</text>
  <rect x="790" y="92" width="46" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="813" y="108" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">p=3</text>
  <!-- j=0 -->
  <rect x="616" y="114" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="634" y="134" text-anchor="middle" font-size="10" fill="#888">j=0</text>
  <rect x="652" y="114" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="675" y="134" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="698" y="114" width="46" height="30" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="744" y="114" width="46" height="30" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="790" y="114" width="46" height="30" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <!-- j=1 -->
  <rect x="616" y="144" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="634" y="164" text-anchor="middle" font-size="10" fill="#888">j=1</text>
  <rect x="652" y="144" width="184" height="30" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <!-- j=2: dp[2][2]=1(旧), dp[2][3]=1(新) -->
  <rect x="616" y="174" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="634" y="194" text-anchor="middle" font-size="10" fill="#888">j=2</text>
  <rect x="652" y="174" width="46" height="30" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="698" y="174" width="46" height="30" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="744" y="174" width="46" height="30" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="767" y="194" text-anchor="middle" font-size="9" fill="#bbb">1</text>
  <rect x="790" y="174" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="813" y="194" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <text x="836" y="186" font-size="8" fill="#999">犯罪1</text>
  <text x="836" y="197" font-size="8" fill="#999">单独</text>
  <!-- j=3 -->
  <rect x="616" y="204" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="634" y="224" text-anchor="middle" font-size="10" fill="#888">j=3</text>
  <rect x="652" y="204" width="184" height="30" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <!-- j=4: dp[4][3]=1 (犯罪0+1) -->
  <rect x="616" y="234" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="634" y="254" text-anchor="middle" font-size="10" fill="#888">j=4</text>
  <rect x="652" y="234" width="184" height="30" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="790" y="234" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="813" y="254" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <text x="836" y="246" font-size="8" fill="#999">犯罪0</text>
  <text x="836" y="257" font-size="8" fill="#999">+1</text>
  <!-- j=5 -->
  <rect x="616" y="264" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="634" y="284" text-anchor="middle" font-size="10" fill="#888">j=5</text>
  <rect x="652" y="264" width="184" height="30" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>

  <!-- 结论 -->
  <rect x="120" y="320" width="620" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="430" y="342" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">答案 = Σ dp[j][3] = dp[2][3] + dp[4][3] = 1 + 1 = 2 ⭐</text>
  <text x="430" y="362" text-anchor="middle" font-size="11" fill="#333">dp[2][3]=1：只选犯罪1（2 人，利润 3 ≥ 3）</text>
  <text x="430" y="380" text-anchor="middle" font-size="11" fill="#333">dp[4][3]=1：选犯罪0+1（4 人，利润 5 ≥ 3，截断到 3）</text>

  <text x="430" y="414" text-anchor="middle" font-size="11" fill="#888">关键：利润 5 超过 minProfit=3，被 min(3,2+3)=3 截断并入 p=3 格</text>
</svg>
