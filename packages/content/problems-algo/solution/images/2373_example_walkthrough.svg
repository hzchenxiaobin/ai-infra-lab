<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="320" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：grid 4×4，4 个 3×3 窗口 → 2×2 输出</text>
  <text x="300" y="42" text-anchor="middle" font-size="11" fill="#888">红字 = 该窗口最大值；橙色窗口 = 当前格</text>

  <!-- ===== Table frame =====
       cols: 输出格[40..110] | 窗口范围[110..250] | 九个值[250..480] | max[480..560] -->
  <!-- Header -->
  <rect x="40" y="54" width="520" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <g font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">
    <text x="75"  y="73" text-anchor="middle">输出格</text>
    <text x="180" y="73" text-anchor="middle">窗口范围 (行×列)</text>
    <text x="365" y="73" text-anchor="middle">3×3 中的 9 个值</text>
    <text x="520" y="73" text-anchor="middle">max</text>
  </g>

  <!-- column separators -->
  <g stroke="#cdd6e0" stroke-width="0.8" filter="url(#rough2)">
    <line x1="110" y1="54" x2="110" y2="254"/>
    <line x1="250" y1="54" x2="250" y2="254"/>
    <line x1="480" y1="54" x2="480" y2="254"/>
  </g>
  <!-- row separators -->
  <g stroke="#cdd6e0" stroke-width="0.8" filter="url(#rough2)">
    <line x1="40" y1="84"  x2="560" y2="84"/>
    <line x1="40" y1="124" x2="560" y2="124"/>
    <line x1="40" y1="164" x2="560" y2="164"/>
    <line x1="40" y1="204" x2="560" y2="204"/>
    <line x1="40" y1="254" x2="560" y2="254"/>
  </g>

  <!-- ===== Row 1 : maxLocal[0][0] ===== -->
  <g filter="url(#rough2)">
    <rect x="40" y="84" width="70" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <text x="75" y="109" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">[0][0]</text>
    <text x="180" y="109" text-anchor="middle" font-size="12" fill="#444">行 0–2，列 0–2</text>
    <!-- 9 values as 3x3 mini grid: origin x=270 y=88, cell 34 -->
    <rect x="270" y="88" width="34" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/><text x="287" y="97" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">9</text>
    <rect x="304" y="88" width="34" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/><text x="321" y="97" text-anchor="middle" font-size="9" fill="#333">9</text>
    <rect x="338" y="88" width="34" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/><text x="355" y="97" text-anchor="middle" font-size="9" fill="#333">8</text>
    <rect x="270" y="99" width="34" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/><text x="287" y="108" text-anchor="middle" font-size="9" fill="#333">5</text>
    <rect x="304" y="99" width="34" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/><text x="321" y="108" text-anchor="middle" font-size="9" fill="#333">6</text>
    <rect x="338" y="99" width="34" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/><text x="355" y="108" text-anchor="middle" font-size="9" fill="#333">2</text>
    <rect x="270" y="110" width="34" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/><text x="287" y="119" text-anchor="middle" font-size="9" fill="#333">8</text>
    <rect x="304" y="110" width="34" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/><text x="321" y="119" text-anchor="middle" font-size="9" fill="#333">2</text>
    <rect x="338" y="110" width="34" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/><text x="355" y="119" text-anchor="middle" font-size="9" fill="#333">6</text>
    <text x="520" y="109" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">9</text>
  </g>

  <!-- ===== Row 2 : maxLocal[0][1] ===== -->
  <g filter="url(#rough2)">
    <rect x="40" y="124" width="70" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <text x="75" y="149" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">[0][1]</text>
    <text x="180" y="149" text-anchor="middle" font-size="12" fill="#444">行 0–2，列 1–3</text>
    <rect x="270" y="128" width="34" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/><text x="287" y="137" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">9</text>
    <rect x="304" y="128" width="34" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/><text x="321" y="137" text-anchor="middle" font-size="9" fill="#333">8</text>
    <rect x="338" y="128" width="34" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/><text x="355" y="137" text-anchor="middle" font-size="9" fill="#333">1</text>
    <rect x="270" y="139" width="34" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/><text x="287" y="148" text-anchor="middle" font-size="9" fill="#333">6</text>
    <rect x="304" y="139" width="34" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/><text x="321" y="148" text-anchor="middle" font-size="9" fill="#333">2</text>
    <rect x="338" y="139" width="34" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/><text x="355" y="148" text-anchor="middle" font-size="9" fill="#333">6</text>
    <rect x="270" y="150" width="34" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/><text x="287" y="159" text-anchor="middle" font-size="9" fill="#333">2</text>
    <rect x="304" y="150" width="34" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/><text x="321" y="159" text-anchor="middle" font-size="9" fill="#333">6</text>
    <rect x="338" y="150" width="34" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/><text x="355" y="159" text-anchor="middle" font-size="9" fill="#333">4</text>
    <text x="520" y="149" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">9</text>
  </g>

  <!-- ===== Row 3 : maxLocal[1][0] ===== -->
  <g filter="url(#rough2)">
    <rect x="40" y="164" width="70" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <text x="75" y="189" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">[1][0]</text>
    <text x="180" y="189" text-anchor="middle" font-size="12" fill="#444">行 1–3，列 0–2</text>
    <rect x="270" y="168" width="34" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/><text x="287" y="177" text-anchor="middle" font-size="9" fill="#333">5</text>
    <rect x="304" y="168" width="34" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/><text x="321" y="177" text-anchor="middle" font-size="9" fill="#333">6</text>
    <rect x="338" y="168" width="34" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/><text x="355" y="177" text-anchor="middle" font-size="9" fill="#333">2</text>
    <rect x="270" y="179" width="34" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/><text x="287" y="188" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">8</text>
    <rect x="304" y="179" width="34" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/><text x="321" y="188" text-anchor="middle" font-size="9" fill="#333">2</text>
    <rect x="338" y="179" width="34" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/><text x="355" y="188" text-anchor="middle" font-size="9" fill="#333">6</text>
    <rect x="270" y="190" width="34" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/><text x="287" y="199" text-anchor="middle" font-size="9" fill="#333">6</text>
    <rect x="304" y="190" width="34" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/><text x="321" y="199" text-anchor="middle" font-size="9" fill="#333">2</text>
    <rect x="338" y="190" width="34" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/><text x="355" y="199" text-anchor="middle" font-size="9" fill="#333">2</text>
    <text x="520" y="189" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">8</text>
  </g>

  <!-- ===== Row 4 : maxLocal[1][1] ===== -->
  <g filter="url(#rough2)">
    <rect x="40" y="204" width="70" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <text x="75" y="229" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">[1][1]</text>
    <text x="180" y="229" text-anchor="middle" font-size="12" fill="#444">行 1–3，列 1–3</text>
    <rect x="270" y="208" width="34" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/><text x="287" y="217" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">6</text>
    <rect x="304" y="208" width="34" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/><text x="321" y="217" text-anchor="middle" font-size="9" fill="#333">2</text>
    <rect x="338" y="208" width="34" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/><text x="355" y="217" text-anchor="middle" font-size="9" fill="#333">6</text>
    <rect x="270" y="219" width="34" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/><text x="287" y="228" text-anchor="middle" font-size="9" fill="#333">2</text>
    <rect x="304" y="219" width="34" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/><text x="321" y="228" text-anchor="middle" font-size="9" fill="#333">6</text>
    <rect x="338" y="219" width="34" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/><text x="355" y="228" text-anchor="middle" font-size="9" fill="#333">4</text>
    <rect x="270" y="230" width="34" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/><text x="287" y="239" text-anchor="middle" font-size="9" fill="#333">2</text>
    <rect x="304" y="230" width="34" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/><text x="321" y="239" text-anchor="middle" font-size="9" fill="#333">2</text>
    <rect x="338" y="230" width="34" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/><text x="355" y="239" text-anchor="middle" font-size="9" fill="#333">2</text>
    <text x="520" y="229" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">6</text>
  </g>

  <!-- result summary -->
  <rect x="40" y="268" width="520" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="286" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">输出 maxLocal = [[9,9],[8,6]]</text>
  <text x="300" y="302" text-anchor="middle" font-size="11" fill="#888">每个输出格 = 以 (i+1,j+1) 为中心的 3×3 窗口最大值</text>
</svg>
