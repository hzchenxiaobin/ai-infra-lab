<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 2 演算：nums1=[1,3,2,1], nums2=[2,2,3,4]</text>

  <!-- table grid -->
  <!-- column x positions: i=70(60w), a=130(90w), b=220(90w), dp0=310(95w), dp1=405(95w); right edge 500 -->
  <!-- header -->
  <rect x="70" y="56" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="100" y="76" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i</text>
  <rect x="130" y="56" width="90" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="175" y="76" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a=nums1[i]</text>
  <rect x="220" y="56" width="90" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="265" y="76" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">b=nums2[i]</text>
  <rect x="310" y="56" width="95" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="357" y="70" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">dp[i][0]</text>
  <text x="357" y="82" text-anchor="middle" font-size="9" fill="#4a7a3a">选 a</text>
  <rect x="405" y="56" width="95" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="452" y="70" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">dp[i][1]</text>
  <text x="452" y="82" text-anchor="middle" font-size="9" fill="#d6a040">选 b</text>

  <!-- row i=0 -->
  <rect x="70" y="92" width="60" height="34" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="114" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="130" y="92" width="90" height="34" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="175" y="114" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="220" y="92" width="90" height="34" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="265" y="114" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="310" y="92" width="95" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="357" y="114" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="405" y="92" width="95" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="452" y="114" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <!-- row i=1 -->
  <rect x="70" y="128" width="60" height="34" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="150" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="130" y="128" width="90" height="34" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="175" y="150" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="220" y="128" width="90" height="34" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="265" y="150" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="310" y="128" width="95" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="357" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="405" y="128" width="95" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="452" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

  <!-- row i=2 -->
  <rect x="70" y="164" width="60" height="34" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="186" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="130" y="164" width="90" height="34" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="175" y="186" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="220" y="164" width="90" height="34" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="265" y="186" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="310" y="164" width="95" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="357" y="186" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <rect x="405" y="164" width="95" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="452" y="186" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <!-- note: i=2 a 续自 B 行 -->
  <text x="357" y="160" text-anchor="middle" font-size="9" fill="#d6a040">↑ 续 b₁=2</text>

  <!-- row i=3 -->
  <rect x="70" y="200" width="60" height="34" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="222" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="130" y="200" width="90" height="34" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="175" y="222" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="220" y="200" width="90" height="34" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="265" y="222" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="310" y="200" width="95" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="357" y="222" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="405" y="200" width="95" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="452" y="224" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">4</text>

  <!-- annotations under table -->
  <text x="270" y="262" text-anchor="middle" font-size="11" fill="#333">i=3 选 b=4：4≥a₂=2 与 4≥b₂=3 都成立 ⇒ dp[3][1] = dp[2][0]+1 = 4</text>

  <!-- answer banner -->
  <rect x="60" y="280" width="420" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="270" y="305" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">答案 = max{1,1,2,2,3,3,1,4} = 4</text>

  <!-- construction -->
  <text x="270" y="340" text-anchor="middle" font-size="11" fill="#4a7a3a">对应构造 nums3 = [a₀, b₁, b₂, b₃] = [1,2,3,4] ✓</text>
</svg>
