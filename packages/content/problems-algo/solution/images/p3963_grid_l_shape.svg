<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：只保留一条 L 形走廊，其余格子全部封死</text>
  <text x="260" y="38" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">自由格 = 第一行 ∪ 最后一列 —— 每一步移动都被障碍逼到唯一选择</text>

  <!-- 列标号 j=0..4 -->
  <text x="74" y="58" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">0</text>
  <text x="110" y="58" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">1</text>
  <text x="146" y="58" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">2</text>
  <text x="182" y="58" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">3</text>
  <text x="218" y="58" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">4</text>
  <!-- 行标号 i=0..3 -->
  <text x="44" y="86" text-anchor="end" font-size="9" fill="#aaa" filter="url(#rough2)">0</text>
  <text x="44" y="122" text-anchor="end" font-size="9" fill="#aaa" filter="url(#rough2)">1</text>
  <text x="44" y="158" text-anchor="end" font-size="9" fill="#aaa" filter="url(#rough2)">2</text>
  <text x="44" y="194" text-anchor="end" font-size="9" fill="#aaa" filter="url(#rough2)">3</text>

  <!-- 障碍格：行 1..3，列 0..3 -->
  <rect x="56" y="100" width="36" height="36" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="92" y="100" width="36" height="36" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="128" y="100" width="36" height="36" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="164" y="100" width="36" height="36" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="56" y="136" width="36" height="36" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="92" y="136" width="36" height="36" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="128" y="136" width="36" height="36" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="164" y="136" width="36" height="36" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="56" y="172" width="36" height="36" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="92" y="172" width="36" height="36" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="128" y="172" width="36" height="36" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="164" y="172" width="36" height="36" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="74" y="123" text-anchor="middle" font-size="14" fill="#bbb" font-weight="bold" filter="url(#rough2)">#</text>
  <text x="110" y="123" text-anchor="middle" font-size="14" fill="#bbb" font-weight="bold" filter="url(#rough2)">#</text>
  <text x="146" y="123" text-anchor="middle" font-size="14" fill="#bbb" font-weight="bold" filter="url(#rough2)">#</text>
  <text x="182" y="123" text-anchor="middle" font-size="14" fill="#bbb" font-weight="bold" filter="url(#rough2)">#</text>
  <text x="74" y="159" text-anchor="middle" font-size="14" fill="#bbb" font-weight="bold" filter="url(#rough2)">#</text>
  <text x="110" y="159" text-anchor="middle" font-size="14" fill="#bbb" font-weight="bold" filter="url(#rough2)">#</text>
  <text x="146" y="159" text-anchor="middle" font-size="14" fill="#bbb" font-weight="bold" filter="url(#rough2)">#</text>
  <text x="182" y="159" text-anchor="middle" font-size="14" fill="#bbb" font-weight="bold" filter="url(#rough2)">#</text>
  <text x="74" y="195" text-anchor="middle" font-size="14" fill="#bbb" font-weight="bold" filter="url(#rough2)">#</text>
  <text x="110" y="195" text-anchor="middle" font-size="14" fill="#bbb" font-weight="bold" filter="url(#rough2)">#</text>
  <text x="146" y="195" text-anchor="middle" font-size="14" fill="#bbb" font-weight="bold" filter="url(#rough2)">#</text>
  <text x="182" y="195" text-anchor="middle" font-size="14" fill="#bbb" font-weight="bold" filter="url(#rough2)">#</text>

  <!-- 走廊格：第 0 行全部 + 末列 -->
  <rect x="56" y="64" width="36" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="92" y="64" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="128" y="64" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="164" y="64" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="200" y="64" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="200" y="100" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="200" y="136" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="200" y="172" width="36" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="74" y="87" text-anchor="middle" font-size="13" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">起</text>
  <text x="218" y="195" text-anchor="middle" font-size="13" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">终</text>

  <!-- 唯一路径的被迫箭头：第 0 行向右 ×4 -->
  <path d="M 80 82 L 102 82" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 116 82 L 138 82" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 152 82 L 174 82" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 188 82 L 210 82" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <!-- 末列向下 ×3 -->
  <path d="M 218 88 L 218 110" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 218 124 L 218 146" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 218 160 L 218 182" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <text x="56" y="226" font-size="10" fill="#8a6d1f" filter="url(#rough2)">起点 (0,0)</text>
  <text x="236" y="226" text-anchor="end" font-size="10" fill="#8a6d1f" filter="url(#rough2)">终点 (m−1, n−1)</text>

  <!-- 右侧论证面板 -->
  <rect x="286" y="64" width="222" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="397" y="84" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">① 在 (0, j)，j &lt; n−1</text>
  <text x="397" y="100" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">下方是 #，右边才是 '.'</text>
  <text x="397" y="114" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">只能向右 →</text>

  <rect x="286" y="130" width="222" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="397" y="150" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">② 在 (0, n−1)</text>
  <text x="397" y="166" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">向右出界，(1, n−1) 恰是 '.'</text>
  <text x="397" y="180" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">只能向下 ↓</text>

  <rect x="286" y="196" width="222" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="397" y="216" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">③ 在 (i, n−1)，i &lt; m−1</text>
  <text x="397" y="232" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">向右始终出界</text>
  <text x="397" y="246" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">只能一路向下 ↓</text>

  <rect x="286" y="262" width="222" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="397" y="282" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">每一步都没有第二个选择</text>
  <text x="397" y="298" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">路径不存在任何分岔点</text>
  <text x="397" y="312" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">→ 恰好一条路径 ✓</text>

  <text x="260" y="344" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">对照：全 '.' 网格本有 C(m+n−2, m−1) 条路径；把自由格削成「无分叉走廊」后恰好剩 1 条</text>
</svg>
