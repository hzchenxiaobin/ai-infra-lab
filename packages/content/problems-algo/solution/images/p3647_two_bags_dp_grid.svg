<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrK" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#888888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：三个去向，压进一张「袋1用量 × 袋2用量」网格</text>

  <!-- 左侧：物品三去向 -->
  <rect x="98" y="34" width="68" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="132" y="53" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">物品 w</text>

  <path d="M 112 66 C 95 80, 82 90, 74 102" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="84" y="82" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">进袋1</text>
  <path d="M 152 66 C 169 80, 182 90, 190 102" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="180" y="82" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">进袋2</text>

  <rect x="26" y="106" width="94" height="126" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="73" y="126" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">袋 1</text>
  <text x="73" y="141" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">容量 c₁</text>
  <rect x="50" y="152" width="24" height="22" rx="3" fill="#fff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="62" y="167" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">8</text>

  <rect x="144" y="106" width="94" height="126" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="191" y="126" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">袋 2</text>
  <text x="191" y="141" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">容量 c₂</text>
  <rect x="160" y="152" width="24" height="22" rx="3" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="172" y="167" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <rect x="192" y="152" width="24" height="22" rx="3" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="204" y="167" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4</text>

  <path d="M 132 66 L 132 254" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrK)" filter="url(#rough2)"/>
  <rect x="100" y="258" width="64" height="24" rx="6" fill="#f5f5f5" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="132" y="274" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">不放</text>

  <rect x="26" y="292" width="212" height="56" rx="8" fill="#fafafa" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="132" y="310" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">reach[a][b]：袋1已用 a、袋2已用 b</text>
  <text x="132" y="325" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">是否存在一种选法（可达性）</text>
  <text x="132" y="341" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">答案 = max(a + b)</text>

  <!-- 右侧：二维可达网格（示例 2：c1=9, c2=7） -->
  <text x="370" y="68" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">每来一个物品 w：可达格向 +a 或 +b 方向「扩散」一格</text>

  <rect x="290" y="80" width="160" height="200" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <g stroke="#e0e0e0" stroke-width="0.8" filter="url(#rough2)">
    <line x1="310" y1="80" x2="310" y2="280"/>
    <line x1="330" y1="80" x2="330" y2="280"/>
    <line x1="350" y1="80" x2="350" y2="280"/>
    <line x1="370" y1="80" x2="370" y2="280"/>
    <line x1="390" y1="80" x2="390" y2="280"/>
    <line x1="410" y1="80" x2="410" y2="280"/>
    <line x1="430" y1="80" x2="430" y2="280"/>
    <line x1="290" y1="100" x2="450" y2="100"/>
    <line x1="290" y1="120" x2="450" y2="120"/>
    <line x1="290" y1="140" x2="450" y2="140"/>
    <line x1="290" y1="160" x2="450" y2="160"/>
    <line x1="290" y1="180" x2="450" y2="180"/>
    <line x1="290" y1="200" x2="450" y2="200"/>
    <line x1="290" y1="220" x2="450" y2="220"/>
    <line x1="290" y1="240" x2="450" y2="240"/>
    <line x1="290" y1="260" x2="450" y2="260"/>
  </g>

  <!-- 其它可达格（浅蓝） -->
  <g fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)">
    <rect x="290" y="200" width="20" height="20"/>
    <rect x="290" y="140" width="20" height="20"/>
    <rect x="290" y="80" width="20" height="20"/>
    <rect x="350" y="140" width="20" height="20"/>
    <rect x="410" y="200" width="20" height="20"/>
    <rect x="370" y="80" width="20" height="20"/>
    <rect x="410" y="120" width="20" height="20"/>
    <rect x="350" y="100" width="20" height="20"/>
    <rect x="430" y="140" width="20" height="20"/>
    <rect x="410" y="260" width="20" height="20"/>
  </g>

  <!-- 最优路径（橙） -->
  <g fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)">
    <rect x="290" y="260" width="20" height="20"/>
    <rect x="350" y="260" width="20" height="20"/>
    <rect x="430" y="260" width="20" height="20"/>
  </g>

  <!-- 终点格（红） -->
  <rect x="430" y="100" width="20" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>

  <!-- 路径箭头 -->
  <path d="M 312 270 L 346 270" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="329" y="255" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">+3</text>
  <path d="M 372 270 L 426 270" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="399" y="255" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">+4</text>
  <path d="M 440 257 L 440 124" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="455" y="192" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">+8</text>

  <text x="440" y="94" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">最优 (8,7)</text>
  <text x="458" y="114" font-size="9" fill="#b85450" filter="url(#rough2)">8+7=15</text>

  <!-- 坐标轴 -->
  <text x="283" y="277" font-size="8" fill="#999" filter="url(#rough2)">0</text>
  <text x="281" y="92" font-size="8" fill="#999" filter="url(#rough2)">9</text>
  <text x="290" y="293" font-size="8" fill="#999" filter="url(#rough2)">0</text>
  <text x="447" y="293" font-size="8" fill="#999" filter="url(#rough2)">7</text>
  <text x="370" y="300" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">b（袋2 已用容量）→</text>
  <text x="272" y="180" text-anchor="middle" font-size="10" fill="#446688" transform="rotate(-90 272 180)" filter="url(#rough2)">a（袋1 已用容量）→</text>

  <!-- 图例 -->
  <rect x="298" y="306" width="14" height="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="318" y="315" font-size="9" fill="#333" filter="url(#rough2)">最优路径（示例 2：袋2 装 3、4，袋1 装 8）</text>
  <rect x="298" y="322" width="14" height="11" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="318" y="331" font-size="9" fill="#333" filter="url(#rough2)">其它可达格（部分）</text>
  <rect x="298" y="338" width="14" height="11" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="318" y="347" font-size="9" fill="#333" filter="url(#rough2)">白格 = 不可达</text>
</svg>
