<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 1 演算：n=6, src1=0, src2=1, dest=5</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">三次 Dijkstra 后逐节点求和，取最小值</text>

  <!-- column headers x=0..5 -->
  <g font-size="11" fill="#888">
    <text x="40" y="82" font-size="10" fill="#666" font-weight="bold">节点 x</text>
    <text x="150" y="82" text-anchor="middle">0</text>
    <text x="210" y="82" text-anchor="middle">1</text>
    <text x="270" y="82" text-anchor="middle">2</text>
    <text x="330" y="82" text-anchor="middle">3</text>
    <text x="390" y="82" text-anchor="middle">4</text>
    <text x="450" y="82" text-anchor="middle">5</text>
  </g>

  <!-- row label column -->
  <!-- dist1 row (blue) -->
  <text x="40" y="118" font-size="10" fill="#446688" font-weight="bold">dist1[]</text>
  <text x="40" y="130" font-size="8" fill="#888">从 src1=0</text>
  <g font-size="11">
    <rect x="120" y="100" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="150" y="124" text-anchor="middle" fill="#446688" font-weight="bold">0</text>
    <rect x="180" y="100" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="210" y="124" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
    <rect x="240" y="100" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="270" y="124" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <rect x="300" y="100" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="330" y="124" text-anchor="middle" fill="#446688" font-weight="bold">5</text>
    <rect x="360" y="100" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="390" y="124" text-anchor="middle" fill="#446688" font-weight="bold">7</text>
    <rect x="420" y="100" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="450" y="124" text-anchor="middle" fill="#446688" font-weight="bold">6</text>
  </g>

  <!-- dist2 row (green) -->
  <text x="40" y="166" font-size="10" fill="#4a7a3a" font-weight="bold">dist2[]</text>
  <text x="40" y="178" font-size="8" fill="#888">从 src2=1</text>
  <g font-size="11">
    <rect x="120" y="148" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="150" y="172" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="180" y="148" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="210" y="172" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>
    <rect x="240" y="148" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="270" y="172" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>
    <rect x="300" y="148" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="330" y="172" text-anchor="middle" fill="#4a7a3a" font-weight="bold">8</text>
    <rect x="360" y="148" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="390" y="172" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>
    <rect x="420" y="148" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="450" y="172" text-anchor="middle" fill="#4a7a3a" font-weight="bold">6</text>
  </g>

  <!-- distDest row (orange) -->
  <text x="40" y="214" font-size="10" fill="#d6a040" font-weight="bold">distDest[]</text>
  <text x="40" y="226" font-size="8" fill="#888">到 dest=5</text>
  <g font-size="11">
    <rect x="120" y="196" width="60" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="150" y="220" text-anchor="middle" fill="#d6a040" font-weight="bold">6</text>
    <rect x="180" y="196" width="60" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="210" y="220" text-anchor="middle" fill="#d6a040" font-weight="bold">6</text>
    <rect x="240" y="196" width="60" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="270" y="220" text-anchor="middle" fill="#d6a040" font-weight="bold">6</text>
    <rect x="300" y="196" width="60" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="330" y="220" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
    <rect x="360" y="196" width="60" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="390" y="220" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <rect x="420" y="196" width="60" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="450" y="220" text-anchor="middle" fill="#d6a040" font-weight="bold">0</text>
  </g>

  <!-- separator -->
  <path d="M 120 244 L 480 244" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- sum row -->
  <text x="40" y="270" font-size="10" fill="#444" font-weight="bold">三者求和</text>
  <text x="40" y="282" font-size="8" fill="#888">d1+d2+dD</text>
  <g font-size="11">
    <rect x="120" y="252" width="60" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="150" y="276" text-anchor="middle" fill="#b85450" font-weight="bold">9</text>
    <rect x="180" y="252" width="60" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="210" y="276" text-anchor="middle" fill="#b85450" font-weight="bold">9</text>
    <rect x="240" y="252" width="60" height="36" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="270" y="276" text-anchor="middle" fill="#888">13</text>
    <rect x="300" y="252" width="60" height="36" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="330" y="276" text-anchor="middle" fill="#888">16</text>
    <rect x="360" y="252" width="60" height="36" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="390" y="276" text-anchor="middle" fill="#888">13</text>
    <rect x="420" y="252" width="60" height="36" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="450" y="276" text-anchor="middle" fill="#888">12</text>
  </g>

  <!-- min markers -->
  <text x="150" y="304" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">↑ 最小</text>
  <text x="210" y="304" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">↑ 最小</text>

  <!-- explanation for x=0 and x=1 -->
  <rect x="36" y="318" width="508" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="48" y="338" font-size="10" fill="#4a7a3a" font-weight="bold">x=0：d(src1,0)=0, d(src2,0)=3, d(0,dest)=6  →  子图 {1→0(3), 0→5(6)} 权和 = 9</text>
  <text x="48" y="356" font-size="10" fill="#4a7a3a" font-weight="bold">x=1：d(src1,1)=3, d(src2,1)=0, d(1,dest)=6  →  子图 {0→2(2), 2→1(1), 1→4(5), 4→5(1)} 权和 = 9</text>
  <text x="48" y="376" font-size="9" fill="#666">两个汇合点都得到 9，对应题目给出的两种最优子图</text>

  <!-- answer -->
  <rect x="36" y="402" width="508" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="422" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">答案 = min{9, 9, 13, 16, 13, 12} = 9  ✓</text>
</svg>
