<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：首组吸收余数，从尾部按 k 分组</text>

  <!-- ===== Example A: n % k == 0 (even split) ===== -->
  <text x="44" y="66" font-size="12.5" fill="#446688" font-weight="bold">例 A：n=8, k=4</text>
  <text x="44" y="82" font-size="10.5" fill="#888">8 % 4 = 0 → 首组 = k</text>

  <!-- cleaned string 5F3Z2E9W -->
  <text x="44" y="112" font-size="10.5" fill="#888">去横线大写后</text>
  <rect x="170" y="92" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="190" y="114" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <rect x="212" y="92" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="232" y="114" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">F</text>
  <rect x="254" y="92" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="274" y="114" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="296" y="92" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="316" y="114" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">Z</text>
  <rect x="338" y="92" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="358" y="114" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="380" y="92" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="400" y="114" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">E</text>
  <rect x="422" y="92" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="442" y="114" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">9</text>
  <rect x="464" y="92" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="484" y="114" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">W</text>

  <!-- grouping brackets: two groups of 4 -->
  <path d="M 170 130 L 170 138 L 336 138 L 336 130" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 338 130 L 338 138 L 504 138 L 504 130" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="253" y="154" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">首组 = k = 4</text>
  <text x="421" y="154" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">第二组 = 4</text>

  <!-- result -->
  <text x="44" y="178" font-size="10.5" fill="#888">结果</text>
  <rect x="170" y="162" width="166" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="253" y="184" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5F3Z</text>
  <text x="342" y="184" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">-</text>
  <rect x="354" y="162" width="166" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="437" y="184" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2E9W</text>

  <!-- ===== Example B: n % k != 0 (remainder) ===== -->
  <text x="44" y="232" font-size="12.5" fill="#d6a040" font-weight="bold">例 B：n=5, k=2</text>
  <text x="44" y="248" font-size="10.5" fill="#888">5 % 2 = 1 → 首组 = 1</text>

  <!-- cleaned string 25G3J -->
  <text x="44" y="278" font-size="10.5" fill="#888">去横线大写后</text>
  <rect x="170" y="258" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="280" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">2</text>
  <rect x="212" y="258" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="232" y="280" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <rect x="254" y="258" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="274" y="280" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">G</text>
  <rect x="296" y="258" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="316" y="280" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="338" y="258" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="358" y="280" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">J</text>

  <!-- grouping: first=1 (remainder), then groups of 2 -->
  <path d="M 170 296 L 170 304 L 210 304 L 210 296" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 212 296 L 212 304 L 294 304 L 294 296" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 296 296 L 296 304 L 378 304 L 378 296" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="190" y="320" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">首组=1</text>
  <text x="190" y="334" text-anchor="middle" font-size="10" fill="#888">(余数)</text>
  <text x="253" y="320" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">= k = 2</text>
  <text x="337" y="320" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">= k = 2</text>

  <!-- result -->
  <text x="44" y="362" font-size="10.5" fill="#888">结果</text>
  <rect x="170" y="346" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="190" y="368" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2</text>
  <text x="222" y="368" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">-</text>
  <rect x="234" y="346" width="82" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="275" y="368" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5G</text>
  <text x="328" y="368" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">-</text>
  <rect x="340" y="346" width="82" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="381" y="368" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3J</text>

  <!-- bottom note -->
  <rect x="40" y="394" width="480" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="408" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">首组长度 = n % k（若为 0 则取 k），其余各组恰为 k</text>
</svg>
