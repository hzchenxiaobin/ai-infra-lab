<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">剩余参数 ...args：把散落的实参收拢成一个真数组</text>

  <!-- function call: scattered arguments -->
  <text x="320" y="62" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">调用：argumentsLength(5, "hi", null)</text>

  <!-- three scattered argument bubbles -->
  <ellipse cx="120" cy="96" rx="34" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="120" y="101" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>

  <ellipse cx="320" cy="96" rx="38" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="320" y="101" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">"hi"</text>

  <ellipse cx="520" cy="96" rx="34" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="520" y="101" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">null</text>

  <!-- labels -->
  <text x="120" y="72" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">实参 1</text>
  <text x="320" y="72" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">实参 2</text>
  <text x="520" y="72" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">实参 3</text>

  <!-- arrows converging into ...args collector -->
  <path d="M 120 120 Q 160 170 280 190" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 320 120 L 320 178" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 520 120 Q 480 170 360 190" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ...args collector funnel -->
  <rect x="200" y="180" width="240" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="320" y="204" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold" filter="url(#rough2)">...args  (剩余参数收拢)</text>

  <path d="M 320 220 L 320 248" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- the real array -->
  <rect x="120" y="256" width="400" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="140" y="268" font-size="10" fill="#4a7a3a" filter="url(#rough2)">args =</text>

  <rect x="190" y="266" width="80" height="30" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="286" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="200" y="278" font-size="8" fill="#888" filter="url(#rough2)">0</text>

  <rect x="280" y="266" width="80" height="30" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="286" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">"hi"</text>
  <text x="290" y="278" font-size="8" fill="#888" filter="url(#rough2)">1</text>

  <rect x="370" y="266" width="80" height="30" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="286" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">null</text>
  <text x="380" y="278" font-size="8" fill="#888" filter="url(#rough2)">2</text>

  <text x="470" y="286" font-size="11" fill="#888" filter="url(#rough2)">length=3</text>

  <!-- result -->
  <path d="M 320 310 L 320 336" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <rect x="210" y="342" width="220" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="320" y="367" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return args.length  →  3</text>
</svg>
