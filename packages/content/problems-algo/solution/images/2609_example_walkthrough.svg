<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">示例演算：s = "01000111"（初始 prev=0, cur=1, ans=0）</text>

  <!-- Table grid: outer border -->
  <rect x="30" y="40" width="496" height="280" fill="none" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- Header row -->
  <rect x="30" y="40" width="496" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="48"  y="58" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i</text>
  <text x="86"  y="58" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">s[i]</text>
  <text x="133" y="58" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">prev</text>
  <text x="187" y="58" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">cur</text>
  <text x="337" y="58" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">事件 / 动作</text>
  <text x="493" y="58" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans</text>

  <!-- Vertical separators (y 40..320) -->
  <line x1="66"  y1="40" x2="66"  y2="320" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="106" y1="40" x2="106" y2="320" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="160" y1="40" x2="160" y2="320" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="214" y1="40" x2="214" y2="320" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="460" y1="40" x2="460" y2="320" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- Horizontal separators between rows (rows of height 28 from y=68) -->
  <line x1="30" y1="96"  x2="526" y2="96"  stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="124" x2="526" y2="124" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="152" x2="526" y2="152" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="180" x2="526" y2="180" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="208" x2="526" y2="208" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="236" x2="526" y2="236" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="264" x2="526" y2="264" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="292" x2="526" y2="292" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Highlight final row (i=7) -->
  <rect x="30" y="292" width="496" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- Row i=0 -->
  <text x="48"  y="86" text-anchor="middle" font-size="10.5" fill="#555">0</text>
  <text x="86"  y="86" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <text x="133" y="86" text-anchor="middle" font-size="10.5" fill="#555">0</text>
  <text x="187" y="86" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <text x="220" y="86" font-size="9.5" fill="#555">起始（s[0]='0' 作为当前段）</text>
  <text x="493" y="86" text-anchor="middle" font-size="10.5" fill="#555">0</text>

  <!-- Row i=1 -->
  <text x="48"  y="114" text-anchor="middle" font-size="10.5" fill="#555">1</text>
  <text x="86"  y="114" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="133" y="114" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <text x="187" y="114" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <text x="220" y="114" font-size="9.5" fill="#333">段切 0→1：prev=1, cur=1；是 '1' → 2·min(1,1)=2</text>
  <text x="493" y="114" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">2</text>

  <!-- Row i=2 -->
  <text x="48"  y="142" text-anchor="middle" font-size="10.5" fill="#555">2</text>
  <text x="86"  y="142" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <text x="133" y="142" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <text x="187" y="142" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <text x="220" y="142" font-size="9.5" fill="#555">段切 1→0：prev=1, cur=1（非 '1'，不更新）</text>
  <text x="493" y="142" text-anchor="middle" font-size="10.5" fill="#555">2</text>

  <!-- Row i=3 -->
  <text x="48"  y="170" text-anchor="middle" font-size="10.5" fill="#555">3</text>
  <text x="86"  y="170" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <text x="133" y="170" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <text x="187" y="170" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <text x="220" y="170" font-size="9.5" fill="#555">同段 cur++</text>
  <text x="493" y="170" text-anchor="middle" font-size="10.5" fill="#555">2</text>

  <!-- Row i=4 -->
  <text x="48"  y="198" text-anchor="middle" font-size="10.5" fill="#555">4</text>
  <text x="86"  y="198" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <text x="133" y="198" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <text x="187" y="198" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <text x="220" y="198" font-size="9.5" fill="#555">同段 cur++（0 段长到 3）</text>
  <text x="493" y="198" text-anchor="middle" font-size="10.5" fill="#555">2</text>

  <!-- Row i=5 -->
  <text x="48"  y="226" text-anchor="middle" font-size="10.5" fill="#555">5</text>
  <text x="86"  y="226" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="133" y="226" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <text x="187" y="226" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <text x="220" y="226" font-size="9.5" fill="#333">段切 0→1：prev=3, cur=1；是 '1' → 2·min(3,1)=2</text>
  <text x="493" y="226" text-anchor="middle" font-size="10.5" fill="#555">2</text>

  <!-- Row i=6 -->
  <text x="48"  y="254" text-anchor="middle" font-size="10.5" fill="#555">6</text>
  <text x="86"  y="254" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="133" y="254" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <text x="187" y="254" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <text x="220" y="254" font-size="9.5" fill="#333">同段 cur++；是 '1' → 2·min(3,2)=4</text>
  <text x="493" y="254" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">4</text>

  <!-- Row i=7 (highlighted) -->
  <text x="48"  y="310" text-anchor="middle" font-size="10.5" fill="#555">7</text>
  <text x="86"  y="310" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="133" y="310" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <text x="187" y="310" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <text x="220" y="310" font-size="9.5" fill="#333" font-weight="bold">同段 cur++；是 '1' → 2·min(3,3)=6  ✓ 最优</text>
  <text x="493" y="310" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">6</text>

  <!-- Footer -->
  <text x="280" y="344" text-anchor="middle" font-size="10.5" fill="#888">最长平衡子串 = "000111"，长度 6</text>
</svg>
