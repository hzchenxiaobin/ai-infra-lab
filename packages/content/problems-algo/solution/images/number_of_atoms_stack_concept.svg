<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：栈暂存外层计数，遇 ) 倍乘合并</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">遇 ( 把外层计数表压栈；遇 ) 弹出，cur×mult 后并入 top</text>

  <!-- ===== Left: nested formula structure ===== -->
  <text x="150" y="76" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">嵌套结构（外层包内层，各带倍数）</text>
  <g>
    <!-- outer box K4(...)2 -->
    <rect x="34" y="88" width="232" height="150" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
    <text x="46" y="105" font-size="11" fill="#446688" font-weight="bold">外层 ×2</text>
    <text x="60" y="178" font-size="16" fill="#333">K4</text>
    <text x="92" y="176" font-size="14" fill="#888">+</text>
    <!-- middle box ON(...)2 -->
    <rect x="104" y="118" width="150" height="108" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
    <text x="114" y="135" font-size="11" fill="#d6a040" font-weight="bold">中层 ×2</text>
    <text x="124" y="190" font-size="14" fill="#333">ON</text>
    <text x="150" y="188" font-size="13" fill="#888">+</text>
    <!-- inner box SO3 -->
    <rect x="162" y="148" width="84" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
    <text x="204" y="176" text-anchor="middle" font-size="14" fill="#333">SO3</text>
    <text x="204" y="200" text-anchor="middle" font-size="9" fill="#4a7a3a">内层无倍数=1</text>
  </g>

  <!-- ===== Right: stack state (at inner ')') ===== -->
  <text x="430" y="76" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">读到内层 ) 时的栈状态</text>
  <g font-size="11" fill="#333">
    <text x="350" y="100" text-anchor="middle" font-size="10" fill="#555">stack（底→顶）</text>
    <!-- top entry: {O:1,N:1} -->
    <rect x="318" y="108" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="378" y="128" text-anchor="middle" fill="#d6a040" font-weight="bold">{O:1, N:1}</text>
    <!-- bottom entry: {K:4} -->
    <rect x="318" y="142" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="378" y="162" text-anchor="middle" fill="#446688" font-weight="bold">{K:4}</text>
    <text x="448" y="125" font-size="9" fill="#888">← top</text>

    <!-- cur table -->
    <text x="478" y="100" text-anchor="middle" font-size="10" fill="#555">cur（内层）</text>
    <rect x="450" y="108" width="90" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="495" y="128" text-anchor="middle" fill="#333">S:1</text>
    <text x="495" y="146" text-anchor="middle" fill="#333">O:3</text>
    <text x="495" y="162" text-anchor="middle" font-size="9" fill="#4a7a3a">待倍乘</text>
  </g>

  <!-- pop + multiply annotation -->
  <path d="M 378 108 L 378 92" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="378" y="86" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">弹栈 pop</text>

  <!-- connector: inner box -> cur -->
  <path d="M 246 182 C 290 182, 320 140, 448 138" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="300" y="120" font-size="9" fill="#b85450">内层结果 cur</text>

  <!-- ===== Bottom: merge formula ===== -->
  <line x1="20" y1="252" x2="540" y2="252" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <rect x="40" y="266" width="480" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="288" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">遇 ) 弹栈：top, mult = pop()；mult=2</text>
  <text x="280" y="312" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">cur ← merge(top, cur × mult)</text>
  <text x="280" y="332" text-anchor="middle" font-size="10" fill="#555">cur×2={S:2,O:6} 并入 top={O:1,N:1} → {O:7,N:1,S:2}（同名原子累加）</text>
</svg>
