<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：把「子串 → 出现过的下标集合」记进一张哈希表</text>

  <!-- left: strings -->
  <text x="70" y="56" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">arr（全部子串入表）</text>

  <rect x="24" y="70" width="92" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="48" y="89" font-size="11" fill="#333" filter="url(#rough2)">i=0 "cab"</text>

  <rect x="24" y="106" width="92" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="48" y="125" font-size="11" fill="#333" filter="url(#rough2)">i=1 "ad"</text>

  <rect x="24" y="142" width="92" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="48" y="161" font-size="11" fill="#333" filter="url(#rough2)">i=2 "bad"</text>

  <rect x="24" y="178" width="92" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="48" y="197" font-size="11" fill="#333" filter="url(#rough2)">i=3 "c"</text>

  <!-- arrows into table -->
  <path d="M 118 84 C 168 84 176 118 216 118" fill="none" stroke="#888" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 118 120 C 160 120 172 152 216 152" fill="none" stroke="#888" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 118 156 C 160 156 172 186 216 186" fill="none" stroke="#888" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 118 192 C 168 192 176 220 216 220" fill="none" stroke="#888" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- right: hash table -->
  <rect x="222" y="60" width="188" height="196" fill="#ffffff" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="316" y="80" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">mask：子串 → 掩码</text>

  <line x1="234" y1="88" x2="398" y2="88" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <text x="250" y="106" font-size="11" fill="#b85450" filter="url(#rough2)">"a"</text>
  <text x="296" y="106" font-size="11" fill="#333" filter="url(#rough2)">→</text>
  <text x="316" y="106" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">{0,1,2} ✗</text>

  <text x="250" y="128" font-size="11" fill="#b85450" filter="url(#rough2)">"c"</text>
  <text x="296" y="128" font-size="11" fill="#333" filter="url(#rough2)">→</text>
  <text x="316" y="128" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">{0,3} ✗</text>

  <text x="250" y="150" font-size="11" fill="#b85450" filter="url(#rough2)">"ad"</text>
  <text x="296" y="150" font-size="11" fill="#333" filter="url(#rough2)">→</text>
  <text x="316" y="150" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">{1,2} ✗</text>

  <text x="250" y="176" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">"ab"</text>
  <text x="296" y="176" font-size="11" fill="#333" filter="url(#rough2)">→</text>
  <text x="316" y="176" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">{0} ✓</text>

  <text x="250" y="198" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">"ba"</text>
  <text x="296" y="198" font-size="11" fill="#333" filter="url(#rough2)">→</text>
  <text x="316" y="198" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">{2} ✓</text>

  <text x="250" y="220" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">"ca"</text>
  <text x="296" y="220" font-size="11" fill="#333" filter="url(#rough2)">→</text>
  <text x="316" y="220" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">{0} ✓</text>

  <text x="250" y="242" font-size="10.5" fill="#888" filter="url(#rough2)">...（每串 ≤210 个子串）</text>

  <!-- formula box -->
  <rect x="24" y="272" width="512" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="294" text-anchor="middle" font-size="11.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">判定：mask[s] == 1 &lt;&lt; i  ⟺  s 只被 arr[i] 自己包含</text>
  <text x="280" y="312" text-anchor="middle" font-size="10.5" fill="#2d5a1e" filter="url(#rough2)">同一串内重复出现只占同一位（集合语义），不会误伤成「公共」</text>

  <!-- note box -->
  <rect x="24" y="338" width="512" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="358" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">💡 n ≤ 100：Python 用任意精度 int、C++ 用 bitset&lt;100&gt;，</text>
  <text x="280" y="374" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">一次按位或 + 一次相等比较即完成「含不含别人」的盘查</text>
</svg>
