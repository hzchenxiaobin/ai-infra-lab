<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：n = 10, m = 3</text>
  <text x="280" y="46" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">闭式逐步求值，与逐项带符号求和 1+2−3+…+10 相互印证</text>

  <!-- table header -->
  <g filter="url(#rough2)">
    <rect x="70" y="62" width="150" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="220" y="62" width="210" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="430" y="62" width="80" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="145" y="83" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">步骤</text>
    <text x="325" y="83" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">计算</text>
    <text x="470" y="83" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">结果</text>
  </g>

  <!-- rows -->
  <g filter="url(#rough2)" font-size="12">
    <rect x="70" y="94" width="150" height="32" fill="#fff" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="220" y="94" width="210" height="32" fill="#fff" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="430" y="94" width="80" height="32" fill="#fff" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="145" y="115" text-anchor="middle" fill="#333">全体和 total</text>
    <text x="325" y="115" text-anchor="middle" fill="#333">10 × 11 / 2</text>
    <text x="470" y="115" text-anchor="middle" fill="#333">55</text>

    <rect x="70" y="126" width="150" height="32" fill="#fff" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="220" y="126" width="210" height="32" fill="#fff" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="430" y="126" width="80" height="32" fill="#fff" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="145" y="147" text-anchor="middle" fill="#333">倍数个数 k</text>
    <text x="325" y="147" text-anchor="middle" fill="#333">⌊10 / 3⌋</text>
    <text x="470" y="147" text-anchor="middle" fill="#333">3</text>

    <rect x="70" y="158" width="150" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="220" y="158" width="210" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="430" y="158" width="80" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="145" y="179" text-anchor="middle" fill="#b07818">倍数和 num2</text>
    <text x="325" y="179" text-anchor="middle" fill="#b07818">3 × (3×4/2) = 3 × 6</text>
    <text x="470" y="179" text-anchor="middle" fill="#b07818" font-weight="bold">18</text>

    <rect x="70" y="190" width="150" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="220" y="190" width="210" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="430" y="190" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="145" y="211" text-anchor="middle" fill="#4a7a3a">非倍数和 num1</text>
    <text x="325" y="211" text-anchor="middle" fill="#4a7a3a">total − num2 = 55 − 18</text>
    <text x="470" y="211" text-anchor="middle" fill="#4a7a3a" font-weight="bold">37</text>

    <rect x="70" y="222" width="150" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="220" y="222" width="210" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="430" y="222" width="80" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="145" y="245" text-anchor="middle" fill="#b85450" font-weight="bold">答案 num1−num2</text>
    <text x="325" y="245" text-anchor="middle" fill="#b85450" font-weight="bold">37 − 18 = 55 − 2×18</text>
    <text x="470" y="245" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">19 ✓</text>
  </g>

  <!-- mini case: m > n -->
  <rect x="60" y="288" width="218" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="169" y="310" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 2：n = 5, m = 6（m &gt; n）</text>
  <text x="169" y="328" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">k = ⌊5/6⌋ = 0，num2 = 0</text>
  <text x="169" y="346" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">ans = 15 − 0 = 15（免特判）</text>

  <!-- mini case: m = 1 -->
  <rect x="302" y="288" width="218" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="411" y="310" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">示例 3：n = 5, m = 1（全是倍数）</text>
  <text x="411" y="328" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">k = 5，num2 = 1×15 = 15</text>
  <text x="411" y="346" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">ans = 15 − 30 = −15 ✓</text>
</svg>
