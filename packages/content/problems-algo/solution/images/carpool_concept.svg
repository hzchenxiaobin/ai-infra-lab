<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">拼车：行程=区间加乘客数，前缀和=车上人数，检查不超容量</text>

  <!-- ===== Section 1: 行程区间条 ===== -->
  <text x="30" y="58" font-size="12" fill="#888">行程区间：</text>

  <!-- Trip 1: [2,1,5] green bar from loc1 to loc5 -->
  <rect x="140" y="56" width="200" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="240" y="70" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">行程① +2 人 [1,5)</text>

  <!-- Trip 2: [3,3,7] orange bar from loc3 to loc7 -->
  <rect x="240" y="80" width="200" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="340" y="94" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">行程② +3 人 [3,7)</text>

  <!-- location axis labels 0..7 -->
  <text x="90" y="118" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="140" y="118" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="190" y="118" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="240" y="118" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="290" y="118" text-anchor="middle" font-size="10" fill="#888">4</text>
  <text x="340" y="118" text-anchor="middle" font-size="10" fill="#888">5</text>
  <text x="390" y="118" text-anchor="middle" font-size="10" fill="#888">6</text>
  <text x="440" y="118" text-anchor="middle" font-size="10" fill="#888">7</text>
  <path d="M 80 110 L 470 110" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3" fill="none" filter="url(#rough2)"/>
  <text x="486" y="114" font-size="10" fill="#888">位置</text>

  <!-- ===== Section 2: diff 标记 ===== -->
  <text x="30" y="146" font-size="12" fill="#888">差分标记：</text>

  <!-- +2 at loc1 -->
  <rect x="125" y="134" width="30" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="140" y="149" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+2</text>
  <!-- +3 at loc3 -->
  <rect x="225" y="134" width="30" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="240" y="149" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">+3</text>
  <!-- -2 at loc5 -->
  <rect x="325" y="134" width="30" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="340" y="149" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−2</text>
  <!-- -3 at loc7 -->
  <rect x="425" y="134" width="30" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="440" y="149" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−3</text>

  <!-- arrow down to passenger count -->
  <path d="M 265 158 L 265 178" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="277" y="172" font-size="10" fill="#446688">前缀和</text>

  <!-- ===== Section 3: 车上人数（前缀和）阶梯 ===== -->
  <!-- exceed zone: red tint where count > capacity (loc3..loc5) -->
  <rect x="240" y="186" width="100" height="62" fill="#fce4ec" stroke="none" opacity="0.55" filter="url(#rough2)"/>

  <!-- capacity ceiling line at y=248 (=count 4) -->
  <line x1="70" y1="248" x2="470" y2="248" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="486" y="252" font-size="11" fill="#b85450" font-weight="bold">容量=4</text>

  <text x="30" y="226" font-size="12" fill="#888">车上人数：</text>

  <!-- step function path: count at each loc -->
  <!-- mapping: count 0 -> y=320, count 5 -> y=230; one unit = 18px -->
  <path d="M 90 320 L 140 320 L 140 284 L 240 284 L 240 230 L 340 230 L 340 266 L 440 266 L 440 320"
        stroke="#446688" stroke-width="2.4" fill="none" filter="url(#rough2)"/>

  <!-- count value labels -->
  <text x="115" y="316" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="190" y="280" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="290" y="226" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5 ✗ 超载</text>
  <text x="390" y="262" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">3</text>

  <!-- dots at jump points -->
  <circle cx="140" cy="284" r="3" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="240" cy="230" r="3.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="340" cy="266" r="3" fill="#d6a040" filter="url(#rough2)"/>
  <circle cx="440" cy="320" r="3" fill="#888" filter="url(#rough2)"/>

  <!-- bottom equation / takeaway box -->
  <rect x="40" y="338" width="480" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">trip [num, from, to]  ⇔  diff[from] += num ,  diff[to] −= num</text>
  <text x="280" y="378" text-anchor="middle" font-size="12" fill="#b85450">前缀和 = 车上人数，任意时刻 &gt; capacity 即返回 false</text>
</svg>
