<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="470" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1, 4, 3, 3, 2]</text>

  <!-- header -->
  <rect x="35" y="40" width="26" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="61" y="40" width="26" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="87" y="40" width="108" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="195" y="40" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="229" y="40" width="216" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="445" y="40" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="48" y="56" text-anchor="middle" font-size="10.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="74" y="56" text-anchor="middle" font-size="10.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">x</text>
  <text x="141" y="56" text-anchor="middle" font-size="10.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">弹出（值 ≤ x）</text>
  <text x="212" y="56" text-anchor="middle" font-size="10.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">cnt</text>
  <text x="337" y="56" text-anchor="middle" font-size="10.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">压栈后栈（底 → 顶）</text>
  <text x="465" y="56" text-anchor="middle" font-size="10.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">ans</text>

  <!-- row 0 -->
  <rect x="35" y="64" width="450" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="48" y="83" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <text x="74" y="83" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="141" y="83" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">—（栈空）</text>
  <text x="212" y="83" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <rect x="237" y="69" width="52" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="263" y="83" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">(1, 1)</text>
  <text x="465" y="83" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>

  <!-- row 1 -->
  <rect x="35" y="94" width="450" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="48" y="113" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="74" y="113" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4</text>
  <text x="141" y="113" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">(1,1) 丢弃</text>
  <text x="212" y="113" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <rect x="237" y="99" width="52" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="263" y="113" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">(4, 1)</text>
  <text x="465" y="113" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>

  <!-- row 2 -->
  <rect x="35" y="124" width="450" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="48" y="143" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="74" y="143" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="141" y="143" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">—（4 &gt; 3 挡住）</text>
  <text x="212" y="143" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <rect x="237" y="129" width="52" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="263" y="143" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">(4, 1)</text>
  <rect x="295" y="129" width="52" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="321" y="143" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">(3, 1)</text>
  <text x="465" y="143" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>

  <!-- row 3 (highlight) -->
  <rect x="35" y="154" width="450" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="48" y="173" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="74" y="173" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="141" y="173" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">(3,1) 等值合并</text>
  <text x="212" y="173" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="237" y="159" width="52" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="263" y="173" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">(4, 1)</text>
  <rect x="295" y="159" width="52" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="321" y="173" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">(3, 2)</text>
  <text x="465" y="173" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">5</text>

  <!-- row 4 (final) -->
  <rect x="35" y="184" width="450" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="48" y="203" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">4</text>
  <text x="74" y="203" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">2</text>
  <text x="141" y="203" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">—（3 &gt; 2 挡住）</text>
  <text x="212" y="203" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="237" y="189" width="52" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="263" y="203" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">(4, 1)</text>
  <rect x="295" y="189" width="52" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="321" y="203" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">(3, 2)</text>
  <rect x="353" y="189" width="52" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="379" y="203" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">(2, 1)</text>
  <text x="465" y="203" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">6</text>

  <!-- Example 2 mini table -->
  <text x="260" y="240" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">示例② nums = [3,3,3]：等值连环合并</text>

  <rect x="35" y="250" width="26" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="61" y="250" width="26" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="87" y="250" width="108" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="195" y="250" width="34" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="229" y="250" width="216" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="445" y="250" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="48" y="266" text-anchor="middle" font-size="10.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="74" y="266" text-anchor="middle" font-size="10.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">x</text>
  <text x="141" y="266" text-anchor="middle" font-size="10.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">弹出（值 ≤ x）</text>
  <text x="212" y="266" text-anchor="middle" font-size="10.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">cnt</text>
  <text x="337" y="266" text-anchor="middle" font-size="10.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">压栈后栈（底 → 顶）</text>
  <text x="465" y="266" text-anchor="middle" font-size="10.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">ans</text>

  <rect x="35" y="274" width="450" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="48" y="292" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <text x="74" y="292" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="141" y="292" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">—（栈空）</text>
  <text x="212" y="292" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <rect x="237" y="278" width="52" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="263" y="292" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">(3, 1)</text>
  <text x="465" y="292" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>

  <rect x="35" y="302" width="450" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="48" y="320" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="74" y="320" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="141" y="320" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">(3,1) 等值合并</text>
  <text x="212" y="320" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <rect x="237" y="306" width="52" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="263" y="320" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">(3, 2)</text>
  <text x="465" y="320" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>

  <rect x="35" y="330" width="450" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="48" y="348" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="74" y="348" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="141" y="348" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">(3,2) 等值合并</text>
  <text x="212" y="348" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="237" y="334" width="52" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="263" y="348" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">(3, 3)</text>
  <text x="465" y="348" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">6</text>

  <!-- Bottom notes -->
  <rect x="12" y="374" width="496" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="396" text-anchor="middle" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">行③ 亮点：弹出的 (3,1) 与当前 x=3 等值 ⇒ cnt = 1+1 = 2，对应子数组 [3,3] 与 [3]</text>
  <text x="260" y="416" text-anchor="middle" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">行① 弹出的 (1,1) 是小值：被 4 遮蔽丢弃，之后任何查询都不再需要它</text>
  <text x="260" y="436" text-anchor="middle" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">示例②：等值连环合并 cnt = 1,2,3，总数 6 = C(4,2)——全等数组的所有子数组都合法</text>
</svg>
