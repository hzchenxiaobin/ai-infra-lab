<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    互补配对：r + (B−r) ≡ 0，每对 1 开心
  </text>

  <!-- ===== Top: pair illustration for batchSize=5, r=2 and r=3 ===== -->
  <text x="280" y="52" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">
    示例：batchSize = 5，配对余数 2 与 3
  </text>

  <!-- Step 1: rem=0, serve group r=2 (happy) -->
  <rect x="30" y="64" width="150" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="105" y="84" text-anchor="middle" font-size="11" fill="#2a4a1a" filter="url(#rough2)">rem=0 → 服务 r=2</text>

  <!-- arrow down -->
  <path d="M105,94 L105,108" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="130" y="104" font-size="9" fill="#4a7a3a" filter="url(#rough2)">开心 ✓</text>

  <!-- Step 2: rem=3, serve group r=3 (not happy) -->
  <rect x="30" y="112" width="150" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="105" y="132" text-anchor="middle" font-size="11" fill="#5a1a1a" filter="url(#rough2)">rem=3 → 服务 r=3</text>

  <!-- arrow down -->
  <path d="M105,142 L105,156" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="130" y="152" font-size="9" fill="#b85450" filter="url(#rough2)">不开心</text>

  <!-- Step 3: rem=0 again -->
  <rect x="30" y="160" width="150" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="105" y="178" text-anchor="middle" font-size="11" fill="#2a4a1a" filter="url(#rough2)">rem=0（归零！）</text>

  <!-- formula box on right of step chain -->
  <rect x="200" y="78" width="150" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="275" y="98" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">rem 变化：</text>
  <text x="275" y="116" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0 →(服2)→ 3</text>
  <text x="275" y="132" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3 →(服3)→ 0</text>
  <text x="275" y="146" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">2+3 = 5 ≡ 0</text>

  <!-- ===== Middle: pairing efficiency ===== -->
  <rect x="370" y="64" width="170" height="124" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="455" y="84" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">配对效率</text>
  <line x1="380" y1="90" x2="530" y2="90" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="380" y="106" font-size="10" fill="#4a7a3a" filter="url(#rough2)">2 组 → 1 开心</text>
  <text x="380" y="122" font-size="10" fill="#888" filter="url(#rough2)">最高效率（非零余数）</text>
  <text x="380" y="140" font-size="10" fill="#b85450" filter="url(#rough2)">不配对：3+ 组/开心</text>
  <text x="380" y="156" font-size="10" fill="#888" filter="url(#rough2)">效率 ≤ 配对</text>
  <text x="380" y="176" font-size="9" fill="#4a7a3a" filter="url(#rough2)">⇒ 贪心配对不减总开心</text>

  <!-- ===== Bottom: before/after pairing comparison ===== -->
  <text x="280" y="210" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">
    配对前 vs 配对后：状态空间缩减
  </text>

  <!-- Before pairing -->
  <rect x="30" y="222" width="240" height="78" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="240" text-anchor="middle" font-size="11" fill="#5a1a1a" filter="url(#rough2)">配对前（8 种余数）</text>
  <line x1="40" y1="246" x2="260" y2="246" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="262" font-size="10" fill="#333" filter="url(#rough2)">余数：1 2 3 4 5 6 7 8</text>
  <text x="40" y="278" font-size="10" fill="#b85450" filter="url(#rough2)">状态数 ≈ C(38,8)×9</text>
  <text x="40" y="294" font-size="10" fill="#b85450" filter="url(#rough2)">≈ 4.4 × 10⁸  ✗ TLE</text>

  <!-- arrow -->
  <path d="M275,261 L295,261" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="285" y="254" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">配对</text>

  <!-- After pairing -->
  <rect x="300" y="222" width="240" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="420" y="240" text-anchor="middle" font-size="11" fill="#2a4a1a" filter="url(#rough2)">配对后（≤4 种余数）</text>
  <line x1="310" y1="246" x2="530" y2="246" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="310" y="262" font-size="10" fill="#333" filter="url(#rough2)">余数：1 _ _ 4 _ 6 _ _</text>
  <text x="310" y="278" font-size="10" fill="#4a7a3a" filter="url(#rough2)">状态数 ≈ C(34,4)×9</text>
  <text x="310" y="294" font-size="10" fill="#4a7a3a" filter="url(#rough2)">≈ 4.2 × 10⁵  ✓ AC</text>

  <!-- ===== Bottom note ===== -->
  <rect x="40" y="312" width="480" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="330" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">
    每个互补对 (r, B−r) 中至多一侧有剩余 → 非零种类数 8→4
  </text>
  <text x="280" y="348" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">
    状态空间缩减约 1000 倍，这是从 TLE 到 AC 的转折点
  </text>

  <text x="280" y="378" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">
    绿=开心/归零；红=不开心/剩余；橙=状态变化
  </text>
</svg>
