<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="16.5" fill="#333"
        filter="url(#rough2)">核心观察：固定 g 缩放计数，倒序容斥出精确值</text>

  <!-- ① 缩放计数 -->
  <rect x="24" y="44" width="512" height="112" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="40" y="68" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">① 固定 g，缩放后数严格递增子序列（例：nums = [4,6]，g = 2）</text>

  <rect x="48" y="86" width="34" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="65" y="104" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="82" y="86" width="34" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="99" y="104" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <text x="82" y="134" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">全是 2 的倍数</text>

  <path d="M 126 99 L 156 99" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="141" y="90" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">÷ g</text>

  <rect x="164" y="86" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="181" y="104" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="198" y="86" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="215" y="104" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="198" y="134" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">缩放保序：x&lt;y ⟺ x/g&lt;y/g</text>

  <path d="M 242 99 L 272 99" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="280" y="90" font-size="11.5" fill="#333" filter="url(#rough2)">树状数组按名次维护 dp 前缀和</text>
  <text x="280" y="108" font-size="11.5" fill="#333" filter="url(#rough2)">dp = 1 + Σ dp[值更小者]</text>

  <rect x="410" y="78" width="112" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="466" y="97" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">cnt₂ = 3</text>
  <text x="466" y="114" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">[2] [3] [2,3]</text>

  <!-- ② 超集计数 -->
  <rect x="24" y="170" width="512" height="108" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="40" y="194" font-size="13" fill="#b3541e" font-weight="bold" filter="url(#rough2)">② cnt_g 是「GCD 为 g 的倍数」的超集计数，不全是恰好 g</text>

  <rect x="44" y="208" width="142" height="46" fill="#ffffff" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="115" y="227" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[4] → GCD = 4</text>
  <text x="115" y="245" text-anchor="middle" font-size="11" fill="#b3541e" filter="url(#rough2)">F₄ = 1</text>

  <rect x="208" y="208" width="142" height="46" fill="#ffffff" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="279" y="227" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[6] → GCD = 6</text>
  <text x="279" y="245" text-anchor="middle" font-size="11" fill="#b3541e" filter="url(#rough2)">F₆ = 1</text>

  <rect x="372" y="208" width="142" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="443" y="227" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[4,6] → GCD = 2</text>
  <text x="443" y="245" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">F₂ = 1（恰好）</text>

  <text x="280" y="272" text-anchor="middle" font-size="12.5" fill="#b3541e"
        filter="url(#rough2)">三个都被缩放序列 [2,3] 数进去 ⟹ cnt₂ = F₂ + F₄ + F₆ = 3</text>

  <!-- ③ 倒序容斥 -->
  <rect x="24" y="292" width="512" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="40" y="316" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">③ g 从 M 到 1 倒序容斥，再按 g 加权汇总</text>
  <text x="280" y="342" text-anchor="middle" font-size="13" fill="#333"
        filter="url(#rough2)">F[g] = cnt[g] − F[2g] − F[3g] − …（倒序保证倍数的 F 已算好）</text>
  <text x="280" y="368" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold"
        filter="url(#rough2)">答案 = Σ g × F[g]（mod 1e9+7）</text>
</svg>
