<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">O(n) 哈希聚合演算：arr = [2,3,1,6,7]</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888">维护 cnt[v]=前缀值 v 已出现次数、tot[v]=对应下标之和；查询后把 s 入账下标 (k+1)</text>

  <!-- ===== table ===== -->
  <!-- columns: k | arr[k] | s=s_{k+1} | cnt[s]·k − tot[s] | ans 累计 | map 状态(简) -->
  <!-- col x: 40, 110, 180, 250, 410, 490 ; widths 70,70,70,160,80,110 -->
  <g filter="url(#rough2)">
    <!-- header -->
    <rect x="40" y="70" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="110" y="70" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="180" y="70" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="250" y="70" width="160" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="410" y="70" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="480" y="70" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
  </g>
  <text x="75"  y="88" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">k</text>
  <text x="145" y="88" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">arr[k]</text>
  <text x="215" y="88" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">s=s_{k+1}</text>
  <text x="330" y="88" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">cnt[s]·k − tot[s]</text>
  <text x="445" y="88" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">ans 累计</text>
  <text x="540" y="88" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">入账后</text>

  <!-- data rows: init, k0..k4 ; row height 30, y starts 98 -->
  <g filter="url(#rough2)">
    <rect x="40" y="98"  width="560" height="30" fill="#f7f7f7" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="40" y="128" width="560" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="40" y="158" width="560" height="30" fill="#f7f7f7" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="40" y="188" width="560" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/>
    <rect x="40" y="218" width="560" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="40" y="248" width="560" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/>
  </g>

  <!-- init row -->
  <text x="75"  y="117" text-anchor="middle" font-size="10" fill="#888">init</text>
  <text x="145" y="117" text-anchor="middle" font-size="10" fill="#888">—</text>
  <text x="215" y="117" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">0</text>
  <text x="330" y="117" text-anchor="middle" font-size="10" fill="#888">—</text>
  <text x="445" y="117" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">0</text>
  <text x="540" y="117" text-anchor="middle" font-size="9"  fill="#446688">cnt{0:1} tot{0:0}</text>

  <!-- k=0 -->
  <text x="75"  y="147" text-anchor="middle" font-size="10" fill="#333">0</text>
  <text x="145" y="147" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="215" y="147" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>
  <text x="330" y="147" text-anchor="middle" font-size="10" fill="#888">0·0 − 0 = 0</text>
  <text x="445" y="147" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">0</text>
  <text x="540" y="147" text-anchor="middle" font-size="9"  fill="#446688">+s₁=2 @1</text>

  <!-- k=1 -->
  <text x="75"  y="177" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="145" y="177" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="215" y="177" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>
  <text x="330" y="177" text-anchor="middle" font-size="10" fill="#888">0·1 − 0 = 0</text>
  <text x="445" y="177" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">0</text>
  <text x="540" y="177" text-anchor="middle" font-size="9"  fill="#446688">+s₂=1 @2</text>

  <!-- k=2  (highlight) -->
  <text x="75"  y="207" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">2</text>
  <text x="145" y="207" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="215" y="207" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">0</text>
  <text x="330" y="207" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">1·2 − 0 = 2</text>
  <text x="445" y="207" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">2</text>
  <text x="540" y="207" text-anchor="middle" font-size="9"  fill="#446688">+s₃=0 @3</text>

  <!-- k=3 -->
  <text x="75"  y="237" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="145" y="237" text-anchor="middle" font-size="10" fill="#333">6</text>
  <text x="215" y="237" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">6</text>
  <text x="330" y="237" text-anchor="middle" font-size="10" fill="#888">0·3 − 0 = 0</text>
  <text x="445" y="237" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>
  <text x="540" y="237" text-anchor="middle" font-size="9"  fill="#446688">+s₄=6 @4</text>

  <!-- k=4 (highlight) -->
  <text x="75"  y="267" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">4</text>
  <text x="145" y="267" text-anchor="middle" font-size="10" fill="#333">7</text>
  <text x="215" y="267" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">1</text>
  <text x="330" y="267" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">1·4 − 2 = 2</text>
  <text x="445" y="267" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">4</text>
  <text x="540" y="267" text-anchor="middle" font-size="9"  fill="#446688">+s₅=1 @5</text>

  <!-- ===== summary box ===== -->
  <rect x="40" y="300" width="540" height="124" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="322" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">为什么是 cnt·k − tot？</text>
  <text x="56" y="344" font-size="11" fill="#4a7a3a">对每个同前缀值的下标 i，贡献 (k − i)；求和 = Σk − Σi = cnt·k − tot</text>
  <text x="56" y="364" font-size="11" fill="#4a7a3a">查询用「之前」的统计（保证 i ≤ k−1），入账用「当前」下标 (k+1)</text>
  <text x="56" y="384" font-size="11" fill="#b85450" font-weight="bold">关键：k=2 时 cnt[0]=1、tot[0]=0（来自 s₀@0）⇒ 1·2−0=2</text>
  <text x="56" y="402" font-size="11" fill="#b85450" font-weight="bold">　　　k=4 时 cnt[1]=1、tot[1]=2（来自 s₂@2）⇒ 1·4−2=2，合计 4 ✓</text>
</svg>
