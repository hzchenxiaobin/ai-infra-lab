<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 416" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="416" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：一趟扫描，只维护 first / last 两个变量</text>

  <text x="260" y="46" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 1：nums = [4, 2, 9, 5, 3]</text>

  <!-- header row -->
  <g filter="url(#rough2)">
    <rect x="40" y="56" width="70" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="110" y="56" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="190" y="56" width="100" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="290" y="56" width="100" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="390" y="56" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
  </g>
  <g font-size="10.5" fill="#446688" font-weight="bold" text-anchor="middle" filter="url(#rough2)">
    <text x="75" y="72">i</text><text x="150" y="72">nums[i]</text><text x="240" y="72">判定</text>
    <text x="340" y="72">first</text><text x="435" y="72">last</text>
  </g>

  <!-- row 0: composite -->
  <g fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)">
    <rect x="40" y="80" width="70" height="26" rx="4"/><rect x="110" y="80" width="80" height="26" rx="4"/>
    <rect x="190" y="80" width="100" height="26" rx="4"/><rect x="290" y="80" width="100" height="26" rx="4"/>
    <rect x="390" y="80" width="90" height="26" rx="4"/>
  </g>
  <g font-size="10.5" fill="#777" text-anchor="middle" filter="url(#rough2)">
    <text x="75" y="97">0</text><text x="150" y="97">4</text><text x="240" y="97">✗ 合数</text>
    <text x="340" y="97">−</text><text x="435" y="97">−</text>
  </g>

  <!-- row 1: prime -->
  <g fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)">
    <rect x="40" y="106" width="70" height="26" rx="4"/><rect x="110" y="106" width="80" height="26" rx="4"/>
    <rect x="190" y="106" width="100" height="26" rx="4"/><rect x="290" y="106" width="100" height="26" rx="4"/>
    <rect x="390" y="106" width="90" height="26" rx="4"/>
  </g>
  <g font-size="10.5" fill="#2f5d24" text-anchor="middle" filter="url(#rough2)">
    <text x="75" y="123">1</text><text x="150" y="123" font-weight="bold">2</text><text x="240" y="123">✓ 质数</text>
    <text x="340" y="123" font-weight="bold">1 ← 记下</text><text x="435" y="123">1</text>
  </g>

  <!-- row 2: composite -->
  <g fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)">
    <rect x="40" y="132" width="70" height="26" rx="4"/><rect x="110" y="132" width="80" height="26" rx="4"/>
    <rect x="190" y="132" width="100" height="26" rx="4"/><rect x="290" y="132" width="100" height="26" rx="4"/>
    <rect x="390" y="132" width="90" height="26" rx="4"/>
  </g>
  <g font-size="10.5" fill="#777" text-anchor="middle" filter="url(#rough2)">
    <text x="75" y="149">2</text><text x="150" y="149">9</text><text x="240" y="149">✗ 合数</text>
    <text x="340" y="149">1</text><text x="435" y="149">1</text>
  </g>

  <!-- row 3: prime -->
  <g fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)">
    <rect x="40" y="158" width="70" height="26" rx="4"/><rect x="110" y="158" width="80" height="26" rx="4"/>
    <rect x="190" y="158" width="100" height="26" rx="4"/><rect x="290" y="158" width="100" height="26" rx="4"/>
    <rect x="390" y="158" width="90" height="26" rx="4"/>
  </g>
  <g font-size="10.5" fill="#2f5d24" text-anchor="middle" filter="url(#rough2)">
    <text x="75" y="175">3</text><text x="150" y="175" font-weight="bold">5</text><text x="240" y="175">✓ 质数</text>
    <text x="340" y="175">1</text><text x="435" y="175" font-weight="bold">3 ← 更新</text>
  </g>

  <!-- row 4: prime -->
  <g fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)">
    <rect x="40" y="184" width="70" height="26" rx="4"/><rect x="110" y="184" width="80" height="26" rx="4"/>
    <rect x="190" y="184" width="100" height="26" rx="4"/><rect x="290" y="184" width="100" height="26" rx="4"/>
    <rect x="390" y="184" width="90" height="26" rx="4"/>
  </g>
  <g font-size="10.5" fill="#2f5d24" text-anchor="middle" filter="url(#rough2)">
    <text x="75" y="201">4</text><text x="150" y="201" font-weight="bold">3</text><text x="240" y="201">✓ 质数</text>
    <text x="340" y="201">1</text><text x="435" y="201" font-weight="bold">4 ← 更新</text>
  </g>

  <path d="M 260 212 L 260 224" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="260" y="240" text-anchor="middle" font-size="11" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">答案 = last − first = 4 − 1 = 3</text>

  <!-- example 2 -->
  <text x="260" y="272" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 2：nums = [4, 8, 2, 8]</text>

  <rect x="140" y="282" width="48" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="164" y="303" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="196" y="282" width="48" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="303" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8</text>
  <rect x="252" y="282" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="276" y="303" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="308" y="282" width="48" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="332" y="303" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8</text>

  <g font-size="9.5" fill="#777" text-anchor="middle" filter="url(#rough2)">
    <text x="164" y="326">0</text><text x="220" y="326">1</text><text x="276" y="326">2</text><text x="332" y="326">3</text>
  </g>

  <text x="260" y="348" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">唯一质数 2 在下标 2 → first = last = 2 → 答案 0（两个质数可以是同一个）</text>

  <!-- bottom notes -->
  <rect x="12" y="360" width="496" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="378" text-anchor="middle" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">全是质数（如全 2）→ 答案 n − 1；只有一个质数 → 0：同一个公式 last − first 自动覆盖</text>
  <text x="260" y="396" text-anchor="middle" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">⚠️ 1 不是质数：判定记得加 x ≥ 2，别被 isComposite[1] = false 骗到</text>
</svg>
