<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>
  <text x="300" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：预处理 O(n log n) + 每查询 O(log n)</text>
  <text x="300" y="44" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">倍增跳跃表 = 把「贪心跳 R」打包成 2^k 步直达</text>

  <!-- 列标题 -->
  <text x="160" y="58" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">预处理（一次）</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">查询处理（q 次）</text>

  <!-- 左列：预处理 -->
  <rect x="30" y="66" width="260" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="84" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">① 按值排序</text>
  <text x="160" y="100" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">得有序数组 a[] 与映射 pos[]</text>
  <path d="M 160 110 L 160 124" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="124" width="260" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="142" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">② 双指针求 R[i]（一步最右可达）</text>
  <text x="160" y="160" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">a[R[i]] − a[i] ≤ maxDiff</text>
  <path d="M 160 172 L 160 186" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="186" width="260" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="204" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">③ 扫描断口标段号 comp[]</text>
  <text x="160" y="222" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">相邻差 &gt; maxDiff 处段号 +1</text>
  <path d="M 160 234 L 160 248" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="248" width="260" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="266" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">④ 建倍增表（K = ⌈log₂ n⌉ 层）</text>
  <text x="160" y="284" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">up[0] = R</text>
  <text x="160" y="300" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">up[k][i] = up[k−1][up[k−1][i]]</text>

  <!-- 右列：查询处理 -->
  <rect x="340" y="66" width="160" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="420" y="84" text-anchor="middle" font-size="11.5" fill="#2a5a2a" filter="url(#rough2)">取 p = pos[u]，q = pos[v]</text>
  <text x="420" y="100" text-anchor="middle" font-size="11" fill="#2a5a2a" filter="url(#rough2)">若 p &gt; q 则交换</text>
  <path d="M 420 110 L 420 122" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <polygon points="420,122 495,152 420,182 345,152" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="420" y="156" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">comp[p]==comp[q] ?</text>
  <path d="M 495 152 L 510 152" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="500" y="142" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="512" y="139" width="52" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="538" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">−1</text>
  <path d="M 420 182 L 420 196" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="430" y="194" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <polygon points="420,196 495,226 420,256 345,226" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="420" y="230" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">p == q ?</text>
  <path d="M 495 226 L 510 226" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="500" y="216" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="512" y="213" width="52" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="538" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">0</text>
  <path d="M 420 256 L 420 268" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="430" y="266" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="340" y="268" width="160" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="420" y="284" text-anchor="middle" font-size="11" fill="#2a5a2a" filter="url(#rough2)">高位 → 低位试跳：</text>
  <text x="420" y="300" text-anchor="middle" font-size="11" fill="#2a5a2a" filter="url(#rough2)">up[k][cur] &lt; q 则跳</text>
  <text x="420" y="316" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">答案 = steps + 1</text>

  <!-- 底部：倍增示意 -->
  <rect x="30" y="330" width="540" height="80" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="350" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">倍增 = 把贪心跳「打包翻倍」</text>

  <circle cx="70" cy="382" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="130" cy="382" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="190" cy="382" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="250" cy="382" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="310" cy="382" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="70" y="400" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">i</text>

  <path d="M 70 373 C 70 362, 130 362, 130 373" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="100" y="360" text-anchor="middle" font-size="9.5" fill="#2a5a2a" filter="url(#rough2)">1 跳</text>
  <path d="M 70 373 C 70 352, 190 352, 190 373" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="130" y="350" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">2 跳</text>
  <path d="M 70 373 C 70 340, 310 340, 310 373" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="190" y="338" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">4 跳</text>

  <text x="355" y="370" font-size="11" fill="#333" filter="url(#rough2)">up[k][i]：从 i 跳 2^k 步的最右位置</text>
  <text x="355" y="386" font-size="11" fill="#333" filter="url(#rough2)">查询：二进制拼出「仍到不了 q」的最大步数</text>
  <text x="355" y="402" font-size="11" fill="#333" filter="url(#rough2)">总复杂度 O((n + q) log n)</text>
</svg>
