<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：造 x 份合金的花费与单调性</text>
  <text x="310" y="46" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">f_i(x) = Σ max(0, x·comp[i][j] − stock[j]) × cost[j] —— 先白拿库存，超出才花钱</text>

  <!-- left: one metal's ledger -->
  <rect x="30" y="64" width="290" height="170" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="175" y="86" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">金属 j 的账本（comp=2, stock=5, cost=3）</text>
  <text x="46" y="112" font-size="11" fill="#333" filter="url(#rough2)">造 x = 4 份 → 共需 4 × 2 = 8 份金属</text>

  <path d="M 52 126 L 52 118 L 212 118 L 212 126" fill="none" stroke="#999" stroke-width="1" filter="url(#rough2)"/>

  <rect x="52" y="130" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="102" y="148" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">库存 5 份白拿</text>
  <rect x="152" y="130" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="182" y="148" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">买 3 份</text>

  <text x="46" y="182" font-size="11" fill="#333" filter="url(#rough2)">缺口 = max(0, 4×2 − 5) = 3</text>
  <text x="46" y="202" font-size="11" fill="#b85450" filter="url(#rough2)">花费 = 3 × 3 = 9 元</text>
  <text x="46" y="224" font-size="10" fill="#999" filter="url(#rough2)">每种金属独立算账，n 种求和即总花费</text>

  <!-- right: monotone cost curve -->
  <rect x="372" y="178" width="122" height="62" fill="#e6f4ea" opacity="0.55" filter="url(#rough2)"/>
  <path d="M 372 240 L 372 80" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 372 240 L 592 240" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="384" y="84" font-size="10" fill="#666" filter="url(#rough2)">花费 f(x)</text>
  <text x="592" y="258" text-anchor="end" font-size="10" fill="#666" filter="url(#rough2)">份数 x</text>

  <path d="M 372 232 L 420 232 L 462 210 L 580 92" fill="none" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <path d="M 372 178 L 588 178" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="556" y="170" font-size="11" fill="#b85450" filter="url(#rough2)">budget</text>
  <path d="M 494 178 L 494 240" fill="none" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="494" y="258" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">X_i</text>

  <text x="430" y="206" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">可行 ✓</text>
  <text x="545" y="212" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">超支 ✗</text>
  <text x="480" y="276" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">可行份数 = 前缀 [0, X_i]</text>

  <!-- conclusion -->
  <rect x="30" y="288" width="560" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="310" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">x 增大 → 缺口只增不减 → f_i(x) 单调不减 → 可行 x 是前缀 → 二分找右边界</text>
  <text x="310" y="332" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">答案 = 各机器 X_i 的最大值（「同一台机器制造」保证机器间互不干扰）</text>

  <text x="310" y="362" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">上界：库存白拿 ≤ 10⁸ 份 + 预算最多再买 10⁸ 份 → 二分区间 [0, 2×10⁸]</text>
</svg>
