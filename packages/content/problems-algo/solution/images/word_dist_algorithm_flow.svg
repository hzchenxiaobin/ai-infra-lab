<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：双游标单遍扫描</text>

  <!-- init box -->
  <rect x="170" y="46" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="71" text-anchor="middle" font-size="12" fill="#333">p1 = −1, p2 = −1, ans = ∞</text>
  <line x1="270" y1="86" x2="270" y2="104" stroke="#666" stroke-width="1.5" marker-end="url(#arrD)"/>

  <!-- loop decision -->
  <polygon points="270,108 370,148 270,188 170,148" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="146" text-anchor="middle" font-size="11.5" fill="#333">i &lt; n ?</text>
  <text x="270" y="162" text-anchor="middle" font-size="11" fill="#555">遍历每个下标</text>

  <!-- no branch -> return -->
  <line x1="370" y1="148" x2="430" y2="148" stroke="#666" stroke-width="1.5" marker-end="url(#arrD)"/>
  <text x="380" y="142" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="432" y="132" width="92" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="478" y="154" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">return ans</text>

  <!-- yes branch down -->
  <line x1="270" y1="188" x2="270" y2="206" stroke="#666" stroke-width="1.5" marker-end="url(#arrD)"/>
  <text x="278" y="200" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- decision: == word1? -->
  <polygon points="270,210 380,252 270,294 160,252" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="248" text-anchor="middle" font-size="11.5" fill="#333">words[i]</text>
  <text x="270" y="264" text-anchor="middle" font-size="11.5" fill="#333">== word1 ?</text>

  <!-- yes word1 branch: left -->
  <line x1="160" y1="252" x2="100" y2="252" stroke="#666" stroke-width="1.5" marker-end="url(#arrD)"/>
  <text x="110" y="246" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="20" y="288" width="160" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="100" y="310" text-anchor="middle" font-size="11.5" fill="#333">p1 = i</text>
  <text x="100" y="328" text-anchor="middle" font-size="11" fill="#555">if p2 ≠ −1:</text>
  <text x="100" y="344" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">ans = min(ans, p1−p2)</text>
  <path d="M 100 288 Q 100 268 130 256" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 100 352 Q 100 372 200 372 Q 270 372 270 372" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- no -> word2 decision: right -->
  <line x1="380" y1="252" x2="440" y2="252" stroke="#666" stroke-width="1.5" marker-end="url(#arrD)"/>
  <text x="392" y="246" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <polygon points="440,252 470,212 530,252 470,292" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="485" y="248" text-anchor="middle" font-size="10.5" fill="#333">== word2 ?</text>
  <text x="485" y="262" text-anchor="middle" font-size="10.5" fill="#555">是 → 右下</text>

  <!-- word2 branch box -->
  <rect x="360" y="318" width="160" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="440" y="340" text-anchor="middle" font-size="11.5" fill="#333">p2 = i</text>
  <text x="440" y="358" text-anchor="middle" font-size="11" fill="#555">if p1 ≠ −1:</text>
  <text x="440" y="374" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">ans = min(ans, p2−p1)</text>
  <path d="M 485 292 Q 460 304 440 318" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- loop back -->
  <path d="M 100 372 Q 100 410 270 410 Q 270 410 270 410" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 440 382 Q 440 410 270 410" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <line x1="270" y1="410" x2="270" y2="108" stroke="none"/>
  <path d="M 270 410 L 270 420 L 40 420 L 40 148 L 168 148" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)" marker-end="url(#arrD)"/>
  <text x="60" y="436" font-size="10.5" fill="#888">i++ 后回到循环判断</text>
</svg>
