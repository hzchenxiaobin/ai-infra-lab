<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="520" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：nums=[2,4,3,3,5,4,9,6], k=4</text>
  <text x="290" y="42" text-anchor="middle" font-size="11" fill="#888">每步：当前值进来，能弹则弹（栈顶&gt;当前且预算够），再按需入栈</text>

  <!-- nums row -->
  <text x="20" y="64" font-size="10" fill="#446688" font-weight="bold">nums</text>
  <g font-size="9">
    <rect x="50" y="50" width="34" height="22" fill="#f6f6f6" stroke="#ccc" rx="3" filter="url(#rough2)"/>
    <text x="67" y="65" text-anchor="middle" fill="#333">2</text>
    <rect x="86" y="50" width="34" height="22" fill="#f6f6f6" stroke="#ccc" rx="3" filter="url(#rough2)"/>
    <text x="103" y="65" text-anchor="middle" fill="#333">4</text>
    <rect x="122" y="50" width="34" height="22" fill="#f6f6f6" stroke="#ccc" rx="3" filter="url(#rough2)"/>
    <text x="139" y="65" text-anchor="middle" fill="#333">3</text>
    <rect x="158" y="50" width="34" height="22" fill="#f6f6f6" stroke="#ccc" rx="3" filter="url(#rough2)"/>
    <text x="175" y="65" text-anchor="middle" fill="#333">3</text>
    <rect x="194" y="50" width="34" height="22" fill="#f6f6f6" stroke="#ccc" rx="3" filter="url(#rough2)"/>
    <text x="211" y="65" text-anchor="middle" fill="#333">5</text>
    <rect x="230" y="50" width="34" height="22" fill="#f6f6f6" stroke="#ccc" rx="3" filter="url(#rough2)"/>
    <text x="247" y="65" text-anchor="middle" fill="#333">4</text>
    <rect x="266" y="50" width="34" height="22" fill="#f6f6f6" stroke="#ccc" rx="3" filter="url(#rough2)"/>
    <text x="283" y="65" text-anchor="middle" fill="#333">9</text>
    <rect x="302" y="50" width="34" height="22" fill="#f6f6f6" stroke="#ccc" rx="3" filter="url(#rough2)"/>
    <text x="319" y="65" text-anchor="middle" fill="#333">6</text>
  </g>

  <!-- table header -->
  <rect x="20" y="86" width="540" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="40" y="101" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">i</text>
  <text x="90" y="101" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">nums[i]</text>
  <text x="250" y="101" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">动作</text>
  <text x="440" y="101" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">栈（栈底→栈顶）</text>

  <!-- row i=0 -->
  <rect x="20" y="110" width="540" height="28" fill="#fff" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="40" y="128" text-anchor="middle" font-size="9" fill="#333">0</text>
  <text x="90" y="128" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="250" y="128" text-anchor="middle" font-size="9" fill="#333">空栈，入栈</text>
  <g font-size="9">
    <rect x="400" y="116" width="26" height="18" fill="#e6f4ea" stroke="#4a7a3a" rx="2" filter="url(#rough2)"/>
    <text x="413" y="129" text-anchor="middle" fill="#333">2</text>
  </g>

  <!-- row i=1 -->
  <rect x="20" y="138" width="540" height="28" fill="#fafafa" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="40" y="156" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="90" y="156" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="250" y="156" text-anchor="middle" font-size="9" fill="#333">2&lt;4，入栈</text>
  <g font-size="9">
    <rect x="400" y="144" width="26" height="18" fill="#e6f4ea" stroke="#4a7a3a" rx="2" filter="url(#rough2)"/>
    <text x="413" y="157" text-anchor="middle" fill="#333">2</text>
    <rect x="428" y="144" width="26" height="18" fill="#e6f4ea" stroke="#4a7a3a" rx="2" filter="url(#rough2)"/>
    <text x="441" y="157" text-anchor="middle" fill="#333">4</text>
  </g>

  <!-- row i=2 -->
  <rect x="20" y="166" width="540" height="28" fill="#fff" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="40" y="184" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="90" y="184" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="250" y="184" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">4&gt;3 且预算够→弹4，入3</text>
  <g font-size="9">
    <rect x="400" y="172" width="26" height="18" fill="#e6f4ea" stroke="#4a7a3a" rx="2" filter="url(#rough2)"/>
    <text x="413" y="185" text-anchor="middle" fill="#333">2</text>
    <rect x="428" y="172" width="26" height="18" fill="#e6f4ea" stroke="#4a7a3a" rx="2" filter="url(#rough2)"/>
    <text x="441" y="185" text-anchor="middle" fill="#333">3</text>
  </g>

  <!-- row i=3 -->
  <rect x="20" y="194" width="540" height="28" fill="#fafafa" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="40" y="212" text-anchor="middle" font-size="9" fill="#333">3</text>
  <text x="90" y="212" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="250" y="212" text-anchor="middle" font-size="9" fill="#333">3=3 不弹，入栈</text>
  <g font-size="9">
    <rect x="400" y="200" width="26" height="18" fill="#e6f4ea" stroke="#4a7a3a" rx="2" filter="url(#rough2)"/>
    <text x="413" y="213" text-anchor="middle" fill="#333">2</text>
    <rect x="428" y="200" width="26" height="18" fill="#e6f4ea" stroke="#4a7a3a" rx="2" filter="url(#rough2)"/>
    <text x="441" y="213" text-anchor="middle" fill="#333">3</text>
    <rect x="456" y="200" width="26" height="18" fill="#e6f4ea" stroke="#4a7a3a" rx="2" filter="url(#rough2)"/>
    <text x="469" y="213" text-anchor="middle" fill="#333">3</text>
  </g>

  <!-- row i=4 -->
  <rect x="20" y="222" width="540" height="28" fill="#fff" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="40" y="240" text-anchor="middle" font-size="9" fill="#333">4</text>
  <text x="90" y="240" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">5</text>
  <text x="250" y="240" text-anchor="middle" font-size="9" fill="#333">3&lt;5，入栈（满 k=4）</text>
  <g font-size="9">
    <rect x="400" y="228" width="26" height="18" fill="#e6f4ea" stroke="#4a7a3a" rx="2" filter="url(#rough2)"/>
    <text x="413" y="241" text-anchor="middle" fill="#333">2</text>
    <rect x="428" y="228" width="26" height="18" fill="#e6f4ea" stroke="#4a7a3a" rx="2" filter="url(#rough2)"/>
    <text x="441" y="241" text-anchor="middle" fill="#333">3</text>
    <rect x="456" y="228" width="26" height="18" fill="#e6f4ea" stroke="#4a7a3a" rx="2" filter="url(#rough2)"/>
    <text x="469" y="241" text-anchor="middle" fill="#333">3</text>
    <rect x="484" y="228" width="26" height="18" fill="#fff8e1" stroke="#d6a040" rx="2" filter="url(#rough2)"/>
    <text x="497" y="241" text-anchor="middle" fill="#333">5</text>
  </g>

  <!-- row i=5 -->
  <rect x="20" y="250" width="540" height="28" fill="#fafafa" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="40" y="268" text-anchor="middle" font-size="9" fill="#333">5</text>
  <text x="90" y="268" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="250" y="268" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">5&gt;4 且预算够→弹5，入4</text>
  <g font-size="9">
    <rect x="400" y="256" width="26" height="18" fill="#e6f4ea" stroke="#4a7a3a" rx="2" filter="url(#rough2)"/>
    <text x="413" y="269" text-anchor="middle" fill="#333">2</text>
    <rect x="428" y="256" width="26" height="18" fill="#e6f4ea" stroke="#4a7a3a" rx="2" filter="url(#rough2)"/>
    <text x="441" y="269" text-anchor="middle" fill="#333">3</text>
    <rect x="456" y="256" width="26" height="18" fill="#e6f4ea" stroke="#4a7a3a" rx="2" filter="url(#rough2)"/>
    <text x="469" y="269" text-anchor="middle" fill="#333">3</text>
    <rect x="484" y="256" width="26" height="18" fill="#e6f4ea" stroke="#4a7a3a" rx="2" filter="url(#rough2)"/>
    <text x="497" y="269" text-anchor="middle" fill="#333">4</text>
  </g>

  <!-- row i=6 -->
  <rect x="20" y="278" width="540" height="28" fill="#fff" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="40" y="296" text-anchor="middle" font-size="9" fill="#333">6</text>
  <text x="90" y="296" text-anchor="middle" font-size="9" fill="#888" font-weight="bold">9</text>
  <text x="250" y="296" text-anchor="middle" font-size="9" fill="#888">满且 4&lt;9，跳过</text>
  <g font-size="9">
    <rect x="400" y="284" width="26" height="18" fill="#f6f6f6" stroke="#ccc" rx="2" filter="url(#rough2)"/>
    <text x="413" y="297" text-anchor="middle" fill="#888">2</text>
    <rect x="428" y="284" width="26" height="18" fill="#f6f6f6" stroke="#ccc" rx="2" filter="url(#rough2)"/>
    <text x="441" y="297" text-anchor="middle" fill="#888">3</text>
    <rect x="456" y="284" width="26" height="18" fill="#f6f6f6" stroke="#ccc" rx="2" filter="url(#rough2)"/>
    <text x="469" y="297" text-anchor="middle" fill="#888">3</text>
    <rect x="484" y="284" width="26" height="18" fill="#f6f6f6" stroke="#ccc" rx="2" filter="url(#rough2)"/>
    <text x="497" y="297" text-anchor="middle" fill="#888">4</text>
  </g>

  <!-- row i=7 -->
  <rect x="20" y="306" width="540" height="28" fill="#fafafa" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="40" y="324" text-anchor="middle" font-size="9" fill="#333">7</text>
  <text x="90" y="324" text-anchor="middle" font-size="9" fill="#888" font-weight="bold">6</text>
  <text x="250" y="324" text-anchor="middle" font-size="9" fill="#888">满且 4&lt;6，跳过</text>
  <g font-size="9">
    <rect x="400" y="312" width="26" height="18" fill="#f6f6f6" stroke="#ccc" rx="2" filter="url(#rough2)"/>
    <text x="413" y="325" text-anchor="middle" fill="#888">2</text>
    <rect x="428" y="312" width="26" height="18" fill="#f6f6f6" stroke="#ccc" rx="2" filter="url(#rough2)"/>
    <text x="441" y="325" text-anchor="middle" fill="#888">3</text>
    <rect x="456" y="312" width="26" height="18" fill="#f6f6f6" stroke="#ccc" rx="2" filter="url(#rough2)"/>
    <text x="469" y="325" text-anchor="middle" fill="#888">3</text>
    <rect x="484" y="312" width="26" height="18" fill="#f6f6f6" stroke="#ccc" rx="2" filter="url(#rough2)"/>
    <text x="497" y="325" text-anchor="middle" fill="#888">4</text>
  </g>

  <!-- Result box -->
  <rect x="20" y="346" width="540" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="368" font-size="11" fill="#4a7a3a" font-weight="bold">结果：[2, 3, 3, 4]</text>
  <text x="40" y="384" font-size="9" fill="#555">关键在 i=2 与 i=5：用更小值替换高位，让子序列字典序更小</text>
  <text x="40" y="396" font-size="9" fill="#888">i=2 弹掉 4 换 3；i=5 弹掉 5 换 4——两次弹栈把答案从 [2,4,3,5] 压成 [2,3,3,4]</text>

  <!-- legend -->
  <rect x="20" y="416" width="540" height="40" fill="#f6f6f6" stroke="#ddd" rx="4" filter="url(#rough2)"/>
  <rect x="40" y="428" width="16" height="12" fill="#e6f4ea" stroke="#4a7a3a" rx="2" filter="url(#rough2)"/>
  <text x="62" y="438" font-size="9" fill="#555">选中保留</text>
  <rect x="130" y="428" width="16" height="12" fill="#fff8e1" stroke="#d6a040" rx="2" filter="url(#rough2)"/>
  <text x="152" y="438" font-size="9" fill="#555">栈顶待评估</text>
  <rect x="230" y="428" width="16" height="12" fill="#fce4ec" stroke="#b85450" rx="2" filter="url(#rough2)"/>
  <text x="252" y="438" font-size="9" fill="#555">被弹出</text>
  <rect x="310" y="428" width="16" height="12" fill="#f6f6f6" stroke="#ccc" rx="2" filter="url(#rough2)"/>
  <text x="332" y="438" font-size="9" fill="#555">已满跳过</text>
</svg>
