<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">前序遍历字符串编码：连字符个数 = 节点深度</text>

  <!-- 原始字符串 -->
  <text x="40" y="56" font-size="12" fill="#888">traversal =</text>
  <text x="120" y="56" font-size="13" fill="#333" font-weight="bold">1-2--3--4-5--6--7</text>

  <!-- 分解 token 行 -->
  <text x="40" y="86" font-size="11" fill="#888">分解为 token：</text>

  <!-- token 1: 1 (depth 0) -->
  <rect x="40" y="94" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="62" y="108" text-anchor="middle" font-size="9" fill="#b85450">d=0</text>
  <text x="62" y="122" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <!-- token 2: -2 (depth 1) -->
  <rect x="92" y="94" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="114" y="108" text-anchor="middle" font-size="9" fill="#446688">d=1</text>
  <text x="114" y="122" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

  <!-- token 3: --3 (depth 2) -->
  <rect x="144" y="94" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="166" y="108" text-anchor="middle" font-size="9" fill="#4a7a3a">d=2</text>
  <text x="166" y="122" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>

  <!-- token 4: --4 (depth 2) -->
  <rect x="196" y="94" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="218" y="108" text-anchor="middle" font-size="9" fill="#4a7a3a">d=2</text>
  <text x="218" y="122" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>

  <!-- token 5: -5 (depth 1) -->
  <rect x="248" y="94" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="270" y="108" text-anchor="middle" font-size="9" fill="#446688">d=1</text>
  <text x="270" y="122" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>

  <!-- token 6: --6 (depth 2) -->
  <rect x="300" y="94" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="322" y="108" text-anchor="middle" font-size="9" fill="#4a7a3a">d=2</text>
  <text x="322" y="122" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>

  <!-- token 7: --7 (depth 2) -->
  <rect x="352" y="94" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="374" y="108" text-anchor="middle" font-size="9" fill="#4a7a3a">d=2</text>
  <text x="374" y="122" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">7</text>

  <!-- 连字符说明 -->
  <text x="62" y="146" text-anchor="middle" font-size="9" fill="#b85450">0 个「-」</text>
  <text x="114" y="146" text-anchor="middle" font-size="9" fill="#446688">1 个「-」</text>
  <text x="166" y="146" text-anchor="middle" font-size="9" fill="#4a7a3a">2 个「-」</text>

  <!-- 还原的树 -->
  <text x="40" y="172" font-size="12" fill="#888">还原的二叉树：</text>

  <!-- 根节点 1 (depth 0) -->
  <circle cx="200" cy="196" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="200" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <line x1="186" y1="206" x2="130" y2="236" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="214" y1="206" x2="270" y2="236" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>

  <!-- 节点 2 (depth 1, 左) -->
  <circle cx="120" cy="246" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="250" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>

  <!-- 节点 5 (depth 1, 右) -->
  <circle cx="280" cy="246" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="250" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>

  <line x1="108" y1="256" x2="78" y2="286" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="132" y1="256" x2="162" y2="286" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="268" y1="256" x2="238" y2="286" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="292" y1="256" x2="322" y2="286" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 节点 3 (depth 2) -->
  <circle cx="70" cy="296" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="70" y="300" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>

  <!-- 节点 4 (depth 2) -->
  <circle cx="170" cy="296" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="170" y="300" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">4</text>

  <!-- 节点 6 (depth 2) -->
  <circle cx="230" cy="296" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="230" y="300" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">6</text>

  <!-- 节点 7 (depth 2) -->
  <circle cx="330" cy="296" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="330" y="300" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">7</text>

  <!-- 说明框 -->
  <rect x="40" y="324" width="500" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="60" y="348" font-size="12" fill="#333" font-weight="bold">核心：前序序列 + 深度信息 ⇒ 唯一确定树形</text>
  <text x="60" y="368" font-size="11" fill="#555">每个 token = D 个连字符 + 数值，D 即该节点深度</text>
  <text x="60" y="382" font-size="11" fill="#b85450" font-weight="bold">单孩子必为左孩子（题目约定），保证构造唯一</text>
</svg>
