<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrOut" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">凸包优化：最大三角形顶点必在凸包上</text>

  <!-- Convex hull polygon -->
  <polygon points="80,250 160,80 340,90 440,180 360,290 140,300"
           fill="#e8f0fe" fill-opacity="0.35" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>

  <!-- Max triangle on hull: (80,250), (340,90), (360,290) -->
  <polygon points="80,250 340,90 360,290" fill="#fce4ec" fill-opacity="0.55" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>

  <!-- Hull vertices -->
  <circle cx="80" cy="250" r="5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="160" cy="80" r="5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="340" cy="90" r="5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="440" cy="180" r="5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="360" cy="290" r="5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="140" cy="300" r="5" fill="#b85450" filter="url(#rough2)"/>

  <!-- Interior points -->
  <circle cx="240" cy="190" r="5" fill="#aaa" filter="url(#rough2)"/>
  <circle cx="300" cy="230" r="5" fill="#aaa" filter="url(#rough2)"/>
  <circle cx="200" cy="240" r="5" fill="#aaa" filter="url(#rough2)"/>

  <!-- Arrow from interior point outward -->
  <path d="M 240,190 L 300,110" fill="none" stroke="#d6a040" stroke-width="2" filter="url(#rough2)" marker-end="url(#arrOut)"/>
  <text x="250" y="150" font-size="10" fill="#d6a040" filter="url(#rough2)">外推 → 面积增大</text>

  <!-- Legend -->
  <rect x="350" y="42" width="160" height="72" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="62" font-size="11" fill="#b85450" filter="url(#rough2)">● 凸包顶点（候选集）</text>
  <text x="360" y="82" font-size="11" fill="#aaa" filter="url(#rough2)">● 内部点（可外推）</text>
  <text x="360" y="102" font-size="11" fill="#b85450" filter="url(#rough2)">▲ 最大三角形（在包上）</text>
</svg>
