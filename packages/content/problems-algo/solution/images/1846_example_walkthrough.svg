<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：arr = [100, 1, 1000] → 排序 [1, 100, 1000]</text>

  <!-- Table header -->
  <rect x="40" y="48" width="520" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <line x1="90" y1="48" x2="90" y2="78" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="180" y1="48" x2="180" y2="78" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="250" y1="48" x2="250" y2="78" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="400" y1="48" x2="400" y2="78" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i</text>
  <text x="135" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">sorted[i]</text>
  <text x="215" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">prev</text>
  <text x="325" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">min(sorted[i], prev+1)</text>
  <text x="470" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">封顶后数组</text>

  <!-- Row 0: i=0 -->
  <rect x="40" y="80" width="520" height="32" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="100" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="135" y="100" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="215" y="100" text-anchor="middle" font-size="10" fill="#888">—（锚定）</text>
  <text x="325" y="100" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="470" y="100" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[1, 100, 1000]</text>

  <!-- Row 1: i=1, 100 capped to 2 -->
  <rect x="40" y="114" width="520" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="65" y="134" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="135" y="134" text-anchor="middle" font-size="11" fill="#333">100</text>
  <text x="215" y="134" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="325" y="134" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">min(100, 2) = 2</text>
  <text x="470" y="134" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[1, 2, 1000]</text>

  <!-- Row 2: i=2, 1000 capped to 3 -->
  <rect x="40" y="148" width="520" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="65" y="168" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="135" y="168" text-anchor="middle" font-size="11" fill="#333">1000</text>
  <text x="215" y="168" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="325" y="168" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">min(1000, 3) = 3</text>
  <text x="470" y="168" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[1, 2, 3]</text>

  <!-- Result box -->
  <rect x="120" y="196" width="360" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="140" y="219" font-size="11" fill="#555">最终结果：</text>
  <text x="220" y="220" font-size="14" fill="#4a7a3a" font-weight="bold">最大值 = arr[n-1] = 3</text>

  <!-- Array transformation visualization -->
  <text x="300" y="256" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">数组变化可视化</text>

  <!-- Sorted array -->
  <text x="50" y="286" font-size="11" fill="#888">排序后：</text>
  <rect x="120" y="272" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="292" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="190" y="272" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="292" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">100</text>
  <rect x="260" y="272" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="292" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1000</text>

  <!-- Arrow down -->
  <path d="M 220 308 L 220 324" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="232" y="320" font-size="10" fill="#888">封顶</text>

  <!-- Final array -->
  <text x="50" y="352" font-size="11" fill="#888">封顶后：</text>
  <rect x="120" y="338" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="358" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="190" y="338" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="358" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="260" y="338" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="290" y="358" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">3</text>

  <!-- Constraint check boxes -->
  <text x="50" y="398" font-size="11" fill="#888" font-weight="bold">约束验证：</text>
  <rect x="120" y="386" width="220" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="230" y="403" text-anchor="middle" font-size="10" fill="#4a7a3a">arr[0]=1 ✓</text>
  <rect x="350" y="386" width="220" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="460" y="403" text-anchor="middle" font-size="10" fill="#4a7a3a">|2−1|=1, |3−2|=1 ✓</text>

  <!-- Bottom note -->
  <rect x="40" y="424" width="520" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="441" text-anchor="middle" font-size="10" fill="#666">红 = 被封顶（减小）的位置；100→2, 1000→3，每个恰取 prev+1</text>
</svg>
