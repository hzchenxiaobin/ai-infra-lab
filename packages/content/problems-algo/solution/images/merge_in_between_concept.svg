<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="940" height="420" fill="#fdfcf7"/>

  <text x="470" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">合并两个链表：定位 prevA / nodeB，切除 [a, b] 段并接入 list2</text>
  <path d="M 300 40 Q 470 48 640 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="470" y="66" text-anchor="middle" font-size="12" fill="#666">list1 = 10→1→13→6→9→5,  a = 3,  b = 4,  list2 = 1000000→1000001→1000002</text>

  <!-- list1 row with index labels -->
  <text x="50" y="100" font-size="13" font-weight="bold" fill="#2b6e9e">list1（下标标注于上方）</text>

  <!-- index labels -->
  <text x="130" y="120" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="200" y="120" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="270" y="120" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="340" y="120" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3=a</text>
  <text x="410" y="120" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">4=b</text>
  <text x="480" y="120" text-anchor="middle" font-size="10" fill="#888">5</text>

  <!-- list1 nodes -->
  <g filter="url(#sk)"><rect x="100" y="128" width="60" height="40" rx="4" fill="#fff" stroke="#ddd" stroke-width="1.2"/></g>
  <text x="130" y="152" text-anchor="middle" font-size="13" fill="#444">10</text>
  <g filter="url(#sk)"><rect x="170" y="128" width="60" height="40" rx="4" fill="#fff" stroke="#ddd" stroke-width="1.2"/></g>
  <text x="200" y="152" text-anchor="middle" font-size="13" fill="#444">1</text>
  <g filter="url(#sk)"><rect x="240" y="128" width="60" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="270" y="152" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">13</text>
  <g filter="url(#sk)"><rect x="310" y="128" width="60" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="340" y="152" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">6</text>
  <g filter="url(#sk)"><rect x="380" y="128" width="60" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="410" y="152" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">9</text>
  <g filter="url(#sk)"><rect x="450" y="128" width="60" height="40" rx="4" fill="#fff" stroke="#ddd" stroke-width="1.2"/></g>
  <text x="480" y="152" text-anchor="middle" font-size="13" fill="#444">5</text>
  <text x="530" y="152" font-size="11" fill="#888">→ null</text>

  <!-- arrows -->
  <path d="M 160 148 L 166 148" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 230 148 L 236 148" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 300 148 L 306 148" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 370 148 L 376 148" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 440 148 L 446 148" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- bracket for deletion range -->
  <path d="M 310 188 Q 360 200 410 188" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4 2" filter="url(#sk)"/>
  <text x="360" y="214" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">删除区间 [a, b] = [3, 4]</text>

  <!-- pointer labels -->
  <text x="270" y="100" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">prevA（下标 a−1）</text>
  <path d="M 270 104 L 270 126" stroke="#2b6e9e" stroke-width="1" fill="none" stroke-dasharray="3 2" filter="url(#sk)"/>
  <text x="410" y="100" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">nodeB（下标 b）</text>
  <path d="M 410 104 L 410 126" stroke="#b85450" stroke-width="1" fill="none" stroke-dasharray="3 2" filter="url(#sk)"/>

  <!-- list2 row -->
  <text x="50" y="252" font-size="13" font-weight="bold" fill="#2e6e2e">list2（整体接入删除位置）</text>
  <g filter="url(#sk)"><rect x="100" y="270" width="80" height="40" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="140" y="294" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">1000000</text>
  <g filter="url(#sk)"><rect x="210" y="270" width="80" height="40" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="250" y="294" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">1000001</text>
  <g filter="url(#sk)"><rect x="320" y="270" width="80" height="40" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="360" y="294" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">1000002</text>
  <text x="420" y="294" font-size="11" fill="#888">→ null</text>

  <path d="M 180 290 L 206 290" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 290 290 L 316 290" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="360" y="328" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">tail（list2 末尾）</text>
  <path d="M 360 324 L 360 312" stroke="#2e6e2e" stroke-width="1" fill="none" stroke-dasharray="3 2" filter="url(#sk)"/>

  <!-- splice arrows: prevA → list2 head, list2 tail → nodeB.next -->
  <path d="M 270 168 Q 200 210 140 268" stroke="#2b6e9e" stroke-width="1.6" fill="none" stroke-dasharray="4 2" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="190" y="220" font-size="10" fill="#2b6e9e" font-weight="bold">① prevA.next = list2</text>

  <path d="M 400 308 Q 460 220 480 170" stroke="#2e6e2e" stroke-width="1.6" fill="none" stroke-dasharray="4 2" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="470" y="226" font-size="10" fill="#2e6e2e" font-weight="bold">② tail.next = nodeB.next</text>

  <!-- result row -->
  <text x="50" y="362" font-size="13" font-weight="bold" fill="#7a5415">结果链表</text>
  <g filter="url(#sk)"><rect x="100" y="378" width="50" height="34" rx="4" fill="#fff" stroke="#ddd" stroke-width="1.2"/></g>
  <text x="125" y="400" text-anchor="middle" font-size="12" fill="#444">10</text>
  <g filter="url(#sk)"><rect x="160" y="378" width="40" height="34" rx="4" fill="#fff" stroke="#ddd" stroke-width="1.2"/></g>
  <text x="180" y="400" text-anchor="middle" font-size="12" fill="#444">1</text>
  <g filter="url(#sk)"><rect x="210" y="378" width="50" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="235" y="400" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">13</text>
  <g filter="url(#sk)"><rect x="270" y="378" width="65" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="302" y="400" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">1000000</text>
  <g filter="url(#sk)"><rect x="345" y="378" width="65" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="377" y="400" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">1000001</text>
  <g filter="url(#sk)"><rect x="420" y="378" width="65" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="452" y="400" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">1000002</text>
  <g filter="url(#sk)"><rect x="495" y="378" width="40" height="34" rx="4" fill="#fff" stroke="#ddd" stroke-width="1.2"/></g>
  <text x="515" y="400" text-anchor="middle" font-size="12" fill="#444">5</text>
  <text x="550" y="400" font-size="11" fill="#888">→ null</text>

  <path d="M 150 395 L 156 395" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 200 395 L 206 395" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 260 395 L 266 395" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 335 395 L 341 395" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 410 395 L 416 395" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 485 395 L 491 395" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
</svg>
