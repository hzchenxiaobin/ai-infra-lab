<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：text="helloworld", w=80, h=20</text>
  <text x="280" y="40" text-anchor="middle" font-size="11" fill="#888">fonts = [6, 8, 10, 12, 14, 16, 18, 24, 36]（下标 0–8）</text>

  <!-- Table header -->
  <rect x="20" y="54" width="520" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <g font-size="11" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="50"  y="72">步</text>
    <text x="110" y="72">left</text>
    <text x="170" y="72">right</text>
    <text x="230" y="72">mid</text>
    <text x="310" y="72">fonts[mid]</text>
    <text x="400" y="72">check ?</text>
    <text x="500" y="72">动作</text>
  </g>

  <!-- Step 1 -->
  <rect x="20" y="84" width="520" height="28" fill="#fafafa" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="50"  y="103">1</text>
    <text x="110" y="103">0</text>
    <text x="170" y="103">8</text>
    <text x="230" y="103">4</text>
    <text x="310" y="103" fill="#b85450" font-weight="bold">14</text>
    <text x="400" y="103" fill="#b85450" font-weight="bold">✗ 放不下</text>
    <text x="500" y="103" fill="#b85450">right=3</text>
  </g>

  <!-- Step 2 -->
  <rect x="20" y="114" width="520" height="28" fill="#f7f7f7" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="50"  y="133">2</text>
    <text x="110" y="133">0</text>
    <text x="170" y="133">3</text>
    <text x="230" y="133">2</text>
    <text x="310" y="133" fill="#b85450" font-weight="bold">10</text>
    <text x="400" y="133" fill="#b85450" font-weight="bold">✗ 放不下</text>
    <text x="500" y="133" fill="#b85450">right=1</text>
  </g>

  <!-- Step 3 -->
  <rect x="20" y="144" width="520" height="28" fill="#fafafa" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="50"  y="163">3</text>
    <text x="110" y="163">0</text>
    <text x="170" y="163">1</text>
    <text x="230" y="163">1</text>
    <text x="310" y="163" fill="#b85450" font-weight="bold">8</text>
    <text x="400" y="163" fill="#b85450" font-weight="bold">✗ 放不下</text>
    <text x="500" y="163" fill="#b85450">right=0</text>
  </g>

  <!-- Step 4: exit -->
  <rect x="20" y="174" width="520" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="50"  y="193">4</text>
    <text x="110" y="193" fill="#4a7a3a" font-weight="bold">0</text>
    <text x="170" y="193" fill="#4a7a3a" font-weight="bold">0</text>
    <text x="230" y="193" fill="#888">—</text>
    <text x="310" y="193" fill="#4a7a3a" font-weight="bold">6</text>
    <text x="400" y="193" fill="#4a7a3a" font-weight="bold">✓ 放得下</text>
    <text x="500" y="193" fill="#4a7a3a" font-weight="bold">return 6</text>
  </g>

  <!-- Binary search range visualization -->
  <text x="30" y="232" font-size="11" fill="#555" font-weight="bold">搜索区间收缩过程：</text>

  <!-- fonts array row -->
  <g font-size="10" fill="#333" text-anchor="middle">
    <rect x="60"  y="244" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="82"  y="259">6</text>
    <rect x="108" y="244" width="44" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="130" y="259">8</text>
    <rect x="156" y="244" width="44" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="178" y="259">10</text>
    <rect x="204" y="244" width="44" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="226" y="259">12</text>
    <rect x="252" y="244" width="44" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="274" y="259">14</text>
    <rect x="300" y="244" width="44" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="322" y="259">16</text>
    <rect x="348" y="244" width="44" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="370" y="259">18</text>
    <rect x="396" y="244" width="44" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="418" y="259">24</text>
    <rect x="444" y="244" width="44" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="466" y="259">36</text>
  </g>

  <!-- Step labels with brackets -->
  <text x="60" y="282" font-size="9" fill="#888">下标:</text>
  <g font-size="9" fill="#888" text-anchor="middle">
    <text x="82" y="282">0</text>
    <text x="130" y="282">1</text>
    <text x="178" y="282">2</text>
    <text x="226" y="282">3</text>
    <text x="274" y="282">4</text>
    <text x="322" y="282">5</text>
    <text x="370" y="282">6</text>
    <text x="418" y="282">7</text>
    <text x="466" y="282">8</text>
  </g>

  <!-- Step 1 bracket: [0,8] mid=4 -->
  <path d="M 60 292 L 60 298 L 488 298 L 488 292" fill="none" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="274" y="312" text-anchor="middle" font-size="9" fill="#d6a040">步1: [0,8] mid=4 → fonts[4]=14 ✗ → right=3</text>

  <!-- Step 2 bracket: [0,3] mid=2 -->
  <path d="M 60 320 L 60 326 L 248 326 L 248 320" fill="none" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="154" y="340" text-anchor="middle" font-size="9" fill="#d6a040">步2: [0,3] mid=2 → fonts[2]=10 ✗ → right=1</text>

  <!-- Step 3 bracket: [0,1] mid=1 -->
  <path d="M 60 348 L 60 354 L 152 354 L 152 348" fill="none" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="106" y="368" text-anchor="middle" font-size="9" fill="#d6a040">步3: [0,1] mid=1 → fonts[1]=8 ✗ → right=0</text>
</svg>
