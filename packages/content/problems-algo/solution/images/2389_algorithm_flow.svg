<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：排序 → 前缀和 → 逐查询二分</text>

  <!-- Start oval -->
  <ellipse cx="280" cy="60" rx="86" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="65" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">输入 nums, queries</text>

  <!-- arrow down -->
  <path d="M 280 82 L 280 100" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 1: sort -->
  <rect x="150" y="104" width="260" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="126" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① sort(nums)  升序排序</text>

  <!-- arrow down -->
  <path d="M 280 140 L 280 158" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: prefix sum in place -->
  <rect x="110" y="162" width="340" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="184" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 原地累加：nums[i] += nums[i−1]（前缀和）</text>

  <!-- arrow down -->
  <path d="M 280 198 L 280 216" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop box -->
  <rect x="150" y="220" width="260" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="242" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ 遍历 queries 中每个 q</text>

  <!-- arrow down -->
  <path d="M 280 256 L 280 274" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: upper_bound (two-line box) -->
  <rect x="80" y="278" width="400" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="298" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">④ j = upper_bound(nums, q) − nums.begin()</text>
  <text x="280" y="316" text-anchor="middle" font-size="11" fill="#888">首个前缀和 &gt; q 的下标</text>

  <!-- arrow down -->
  <path d="M 280 328 L 280 346" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: answer -->
  <rect x="120" y="350" width="320" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="372" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">⑤ ans[k] = j（和 ≤ q 的元素个数）</text>

  <!-- dashed back arrow to loop -->
  <path d="M 120 367 L 70 367 L 70 237 L 150 237" stroke="#666" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="58" y="300" text-anchor="middle" font-size="10" fill="#888">下一个</text>
  <text x="58" y="314" text-anchor="middle" font-size="10" fill="#888">query</text>

  <!-- End oval -->
  <ellipse cx="280" cy="404" rx="80" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="409" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">返回 ans[]</text>

  <!-- bottom note -->
  <rect x="40" y="432" width="480" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="447" text-anchor="middle" font-size="11" fill="#666">O(n log n + m log n)，前缀和因 nums[i]≥1 严格递增，二分语义干净</text>
</svg>
