<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：六组输入验证公式</text>

  <!-- ===== Table header ===== -->
  <!-- column x positions: num=40, 过程=120, num%9=250, 公式=330, dr=460 -->
  <rect x="32" y="40" width="496" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>

  <text x="68" y="59" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">num</text>
  <line x1="104" y1="44" x2="104" y2="66" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <text x="170" y="59" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">数位和过程</text>
  <line x1="236" y1="44" x2="236" y2="66" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <text x="276" y="59" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">num%9</text>
  <line x1="316" y1="44" x2="316" y2="66" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <text x="392" y="59" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1+(num−1)%9</text>
  <line x1="468" y1="44" x2="468" y2="66" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <text x="500" y="59" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">dr</text>

  <!-- ===== Row 1: num=38, normal case ===== -->
  <rect x="32" y="72" width="496" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="68" y="91" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">38</text>
  <text x="170" y="91" text-anchor="middle" font-size="11" fill="#555">38 → 11 → 2</text>
  <text x="276" y="91" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>
  <text x="392" y="91" text-anchor="middle" font-size="11" fill="#555">1 + 37%9 = 2</text>
  <rect x="484" y="76" width="32" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="500" y="91" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- ===== Row 2: num=0, boundary ===== -->
  <rect x="32" y="104" width="496" height="30" fill="#fff8e1" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="68" y="123" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <text x="170" y="123" text-anchor="middle" font-size="11" fill="#555">0（已是一位）</text>
  <text x="276" y="123" text-anchor="middle" font-size="12" fill="#888">0</text>
  <text x="392" y="123" text-anchor="middle" font-size="11" fill="#888">— 特判 return 0</text>
  <rect x="484" y="108" width="32" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="500" y="123" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>

  <!-- ===== Row 3: num=9, multiple of 9 ===== -->
  <rect x="32" y="136" width="496" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="68" y="155" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9</text>
  <text x="170" y="155" text-anchor="middle" font-size="11" fill="#555">9（已是一位）</text>
  <text x="276" y="155" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0 ⚠</text>
  <text x="392" y="155" text-anchor="middle" font-size="11" fill="#555">1 + 8%9 = 9</text>
  <rect x="484" y="140" width="32" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="500" y="155" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">9</text>

  <!-- ===== Row 4: num=18, multiple of 9 ===== -->
  <rect x="32" y="168" width="496" height="30" fill="#fff8e1" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="68" y="187" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">18</text>
  <text x="170" y="187" text-anchor="middle" font-size="11" fill="#555">18 → 9</text>
  <text x="276" y="187" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0 ⚠</text>
  <text x="392" y="187" text-anchor="middle" font-size="11" fill="#555">1 + 17%9 = 9</text>
  <rect x="484" y="172" width="32" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="500" y="187" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">9</text>

  <!-- ===== Row 5: num=123, normal ===== -->
  <rect x="32" y="200" width="496" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="68" y="219" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">123</text>
  <text x="170" y="219" text-anchor="middle" font-size="11" fill="#555">123 → 6</text>
  <text x="276" y="219" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">6</text>
  <text x="392" y="219" text-anchor="middle" font-size="11" fill="#555">1 + 122%9 = 6</text>
  <rect x="484" y="204" width="32" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="500" y="219" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">6</text>

  <!-- ===== Row 6: num=999, multiple of 9 ===== -->
  <rect x="32" y="232" width="496" height="30" fill="#fff8e1" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="68" y="251" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">999</text>
  <text x="170" y="251" text-anchor="middle" font-size="11" fill="#555">999 → 27 → 9</text>
  <text x="276" y="251" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0 ⚠</text>
  <text x="392" y="251" text-anchor="middle" font-size="11" fill="#555">1 + 998%9 = 9</text>
  <rect x="484" y="236" width="32" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="500" y="251" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">9</text>

  <!-- ===== Annotations ===== -->
  <rect x="32" y="276" width="496" height="68" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="48" y="296" font-size="11" fill="#b85450" font-weight="bold">⚠ 关键规律：</text>
  <text x="48" y="314" font-size="11" fill="#333">• num % 9 == 0 且 num &gt; 0 时，数字根是 <tspan font-weight="bold" fill="#b85450">9</tspan> 而非 0（如 9, 18, 999）</text>
  <text x="48" y="330" font-size="11" fill="#333">• num == 0 时数字根是 <tspan font-weight="bold" fill="#b85450">0</tspan>，须单独特判</text>
  <text x="300" y="320" font-size="12" fill="#4a7a3a" font-weight="bold">公式 1+(n−1)%9</text>
  <text x="300" y="336" font-size="10.5" fill="#4a7a3a">自动处理这两种边界</text>
</svg>
