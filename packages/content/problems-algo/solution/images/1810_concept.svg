<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：1778 等权 → BFS / 1810 加权 → Dijkstra</text>

  <!-- Left Panel: 1778 uniform -->
  <rect x="20" y="44" width="225" height="146" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="132" y="64" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1778：每步消耗 = 1</text>

  <rect x="45" y="78" width="40" height="36" fill="#fff" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="65" y="100" text-anchor="middle" font-size="11" fill="#446688">1</text>
  <rect x="90" y="78" width="40" height="36" fill="#fff" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="110" y="100" text-anchor="middle" font-size="11" fill="#446688">1</text>
  <rect x="135" y="78" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="155" y="100" text-anchor="middle" font-size="11" fill="#4a7a3a">T</text>
  <rect x="45" y="119" width="40" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="65" y="141" text-anchor="middle" font-size="13" fill="#b85450">#</text>
  <rect x="90" y="119" width="40" height="36" fill="#fff" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="110" y="141" text-anchor="middle" font-size="11" fill="#446688">1</text>
  <rect x="135" y="119" width="40" height="36" fill="#fff" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="155" y="141" text-anchor="middle" font-size="11" fill="#446688">1</text>

  <text x="132" y="172" text-anchor="middle" font-size="10.5" fill="#555">边权全相同 → BFS 逐层扩展</text>

  <!-- Right Panel: 1810 weighted -->
  <rect x="275" y="44" width="225" height="146" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="387" y="64" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1810：每步消耗 1 ~ 100</text>

  <rect x="300" y="78" width="40" height="36" fill="#fff" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="320" y="100" text-anchor="middle" font-size="11" fill="#d6a040">5</text>
  <rect x="345" y="78" width="40" height="36" fill="#fff" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="365" y="100" text-anchor="middle" font-size="11" fill="#d6a040">3</text>
  <rect x="390" y="78" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="410" y="100" text-anchor="middle" font-size="11" fill="#4a7a3a">T</text>
  <rect x="300" y="119" width="40" height="36" fill="#fff" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="320" y="141" text-anchor="middle" font-size="11" fill="#d6a040">1</text>
  <rect x="345" y="119" width="40" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="365" y="141" text-anchor="middle" font-size="13" fill="#b85450">#</text>
  <rect x="390" y="119" width="40" height="36" fill="#fff" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="410" y="141" text-anchor="middle" font-size="11" fill="#d6a040">2</text>

  <text x="387" y="172" text-anchor="middle" font-size="10.5" fill="#555">边权各异 → Dijkstra 按消耗排序</text>

  <!-- Two-phase box -->
  <rect x="30" y="206" width="460" height="138" fill="none" stroke="#446688" stroke-width="1.2" stroke-dasharray="6,4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="226" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">两阶段：先探图，后寻路（与 1778 同构）</text>

  <!-- Phase 1 -->
  <rect x="50" y="240" width="190" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="145" y="260" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">阶段 1：DFS 盲探</text>
  <text x="145" y="280" text-anchor="middle" font-size="10" fill="#555">move(d) → 返回消耗或 −1</text>
  <text x="145" y="296" text-anchor="middle" font-size="10" fill="#555">记录每格进入消耗 cost[(r,c)]</text>
  <text x="145" y="312" text-anchor="middle" font-size="10" fill="#555">move(oppo) 回溯</text>
  <text x="145" y="326" text-anchor="middle" font-size="10" fill="#b85450">→ 输出：加权图 + 目标坐标</text>

  <!-- arrow -->
  <path d="M248 286 L278 286" stroke="#446688" stroke-width="2.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Phase 2 -->
  <rect x="285" y="240" width="190" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="380" y="260" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">阶段 2：Dijkstra 寻路</text>
  <text x="380" y="280" text-anchor="middle" font-size="10" fill="#555">小顶堆按 dist 弹最小</text>
  <text x="380" y="296" text-anchor="middle" font-size="10" fill="#555">边权 = cost[目标格]</text>
  <text x="380" y="312" text-anchor="middle" font-size="10" fill="#555">松弛 nd = d + cost[邻居]</text>
  <text x="380" y="326" text-anchor="middle" font-size="10" fill="#b85450">→ 弹出目标即返回最小消耗</text>
</svg>
