<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="372" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">三矩形的所有布局：3 种切割类型 × 朝向 = 6 种规范形态</text>

  <!-- 形态 1：三竖条 -->
  <rect x="37.5" y="64" width="41" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <rect x="80.5" y="64" width="45" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <rect x="127.5" y="64" width="41" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <line x1="80.5" y1="56" x2="80.5" y2="140" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <line x1="127.5" y1="56" x2="127.5" y2="140" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="58" y="101" text-anchor="middle" font-size="12" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">①</text>
  <text x="103" y="101" text-anchor="middle" font-size="12" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">②</text>
  <text x="148" y="101" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">③</text>
  <text x="102.5" y="160" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">① 三竖条「川」</text>
  <text x="102.5" y="177" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">两刀竖切 i&lt;j，O(n²)</text>

  <!-- 形态 2：三横条 -->
  <rect x="222.5" y="64" width="130" height="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <rect x="222.5" y="87" width="130" height="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <rect x="222.5" y="110" width="130" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <line x1="214" y1="86" x2="362" y2="86" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <line x1="214" y1="109" x2="362" y2="109" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="287.5" y="80" text-anchor="middle" font-size="12" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">①</text>
  <text x="287.5" y="103" text-anchor="middle" font-size="12" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">②</text>
  <text x="287.5" y="126" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">③</text>
  <text x="287.5" y="160" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">② 三横条「三」</text>
  <text x="287.5" y="177" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">两刀横切 i&lt;j，O(m²)</text>

  <!-- 形态 3：上整下切 -->
  <rect x="407.5" y="64" width="130" height="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <rect x="407.5" y="87" width="64" height="43" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <rect x="473.5" y="87" width="64" height="43" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <line x1="399" y1="86" x2="547" y2="86" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <line x1="473.5" y1="86" x2="473.5" y2="140" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="472.5" y="80" text-anchor="middle" font-size="12" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">①</text>
  <text x="439.5" y="113" text-anchor="middle" font-size="12" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">②</text>
  <text x="505.5" y="113" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">③</text>
  <text x="472.5" y="160" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">③ T 型：上整 · 下切</text>
  <text x="472.5" y="177" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">先横切，下段再竖切</text>

  <!-- 形态 4：下整上切 -->
  <rect x="37.5" y="220" width="64" height="43" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <rect x="103.5" y="220" width="64" height="43" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <rect x="37.5" y="265" width="130" height="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <line x1="29" y1="263" x2="177" y2="263" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <line x1="103.5" y1="212" x2="103.5" y2="263" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="69.5" y="246" text-anchor="middle" font-size="12" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">①</text>
  <text x="135.5" y="246" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">②</text>
  <text x="102.5" y="281" text-anchor="middle" font-size="12" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">③</text>
  <text x="102.5" y="316" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">④ T 型：下整 · 上切</text>
  <text x="102.5" y="333" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">先横切，上段再竖切</text>

  <!-- 形态 5：左整右切 -->
  <rect x="222.5" y="220" width="40" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <rect x="264.5" y="220" width="88" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <rect x="264.5" y="254" width="88" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <line x1="264.5" y1="212" x2="264.5" y2="296" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <line x1="256" y1="253" x2="360" y2="253" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="242.5" y="257" text-anchor="middle" font-size="12" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">③</text>
  <text x="308.5" y="240" text-anchor="middle" font-size="12" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">①</text>
  <text x="308.5" y="274" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">②</text>
  <text x="287.5" y="316" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">⑤ T 型：左整 · 右切</text>
  <text x="287.5" y="333" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">先竖切，右段再横切</text>

  <!-- 形态 6：右整左切 -->
  <rect x="407.5" y="220" width="88" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <rect x="407.5" y="254" width="88" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <rect x="497.5" y="220" width="40" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <line x1="497.5" y1="212" x2="497.5" y2="296" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <line x1="399" y1="253" x2="503" y2="253" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="451.5" y="240" text-anchor="middle" font-size="12" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">①</text>
  <text x="451.5" y="274" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">②</text>
  <text x="517.5" y="257" text-anchor="middle" font-size="12" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">③</text>
  <text x="472.5" y="316" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">⑥ T 型：右整 · 左切</text>
  <text x="472.5" y="333" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">先竖切，左段再横切</text>

  <!-- 底部注释 -->
  <rect x="20" y="344" width="520" height="22" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="280" y="359" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">两刀同向 → ①②；一横一竖 → ③④⑤⑥。任何不重叠的三矩形布局都可微调成六者之一且面积不增</text>
</svg>
