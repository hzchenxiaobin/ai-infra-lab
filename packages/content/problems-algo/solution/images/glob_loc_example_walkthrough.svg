<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：从右向左维护 mn = min(nums[i+2..])</text>

  <!-- ===== Example A: [1,0,2] -> true ===== -->
  <text x="40" y="60" font-size="12.5" fill="#4a7a3a" font-weight="bold">A. nums = [1, 0, 2]  →  true</text>

  <!-- array A -->
  <rect x="40"  y="70" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="63"  y="91" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="86"  y="70" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="109" y="91" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="132" y="70" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="155" y="91" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <text x="63"  y="116" text-anchor="middle" font-size="9.5" fill="#aaa">i=0</text>
  <text x="109" y="116" text-anchor="middle" font-size="9.5" fill="#aaa">i=1</text>
  <text x="155" y="116" text-anchor="middle" font-size="9.5" fill="#aaa">i=2</text>
  <text x="155" y="60" font-size="9.5" fill="#4a7a3a">← mn 初始 = 2</text>

  <!-- table A -->
  <rect x="40" y="130" width="320" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="76"  y="146" text-anchor="middle" font-size="10.5" fill="#444" font-weight="bold">i</text>
  <text x="130" y="146" text-anchor="middle" font-size="10.5" fill="#444" font-weight="bold">nums[i]</text>
  <text x="196" y="146" text-anchor="middle" font-size="10.5" fill="#444" font-weight="bold">mn=min(nums[i+2..])</text>
  <text x="298" y="146" text-anchor="middle" font-size="10.5" fill="#444" font-weight="bold">nums[i]&gt;mn?</text>

  <rect x="40" y="154" width="320" height="22" fill="#fafafa" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>
  <text x="76"  y="169" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <text x="130" y="169" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <text x="196" y="169" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <text x="298" y="169" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">否（1≯2）</text>

  <text x="40" y="192" font-size="10.5" fill="#4a7a3a" font-weight="bold">→ 无远距离倒置，G==L==1，返回 true ✓</text>

  <!-- divider -->
  <line x1="40" y1="212" x2="520" y2="212" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Example B: [1,2,0] -> false ===== -->
  <text x="40" y="238" font-size="12.5" fill="#b85450" font-weight="bold">B. nums = [1, 2, 0]  →  false</text>

  <!-- array B -->
  <rect x="40"  y="248" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="63"  y="269" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="86"  y="248" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="109" y="269" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="132" y="248" width="46" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="155" y="269" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <text x="63"  y="294" text-anchor="middle" font-size="9.5" fill="#aaa">i=0</text>
  <text x="109" y="294" text-anchor="middle" font-size="9.5" fill="#aaa">i=1</text>
  <text x="155" y="294" text-anchor="middle" font-size="9.5" fill="#aaa">i=2</text>
  <text x="155" y="238" font-size="9.5" fill="#b85450">← mn 初始 = 0</text>

  <!-- far inversion arc B: (0,2) 1>0 -->
  <path d="M 63 242 Q 109 214 155 242" stroke="#d6a040" stroke-width="2.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="109" y="226" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">远距离倒置 1&gt;0</text>

  <!-- table B -->
  <rect x="40" y="308" width="320" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="76"  y="324" text-anchor="middle" font-size="10.5" fill="#444" font-weight="bold">i</text>
  <text x="130" y="324" text-anchor="middle" font-size="10.5" fill="#444" font-weight="bold">nums[i]</text>
  <text x="196" y="324" text-anchor="middle" font-size="10.5" fill="#444" font-weight="bold">mn=min(nums[i+2..])</text>
  <text x="298" y="324" text-anchor="middle" font-size="10.5" fill="#444" font-weight="bold">nums[i]&gt;mn?</text>

  <rect x="40" y="332" width="320" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="76"  y="347" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <text x="130" y="347" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <text x="196" y="347" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <text x="298" y="347" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">是（1&gt;0）</text>

  <text x="40" y="370" font-size="10.5" fill="#b85450" font-weight="bold">→ 命中远距离倒置 (0,2)，G=2 ≠ L=1，返回 false ✗</text>

  <!-- conclusion box -->
  <rect x="40" y="392" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="414" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">关键：mn 始终代表「位置 i 之后第 2 位起的最小值」</text>
  <text x="280" y="432" text-anchor="middle" font-size="11" fill="#666">若 nums[i] 比它还大 ⇒ 存在 j≥i+2 使 nums[i]&gt;nums[j] ⇒ 远距离倒置 ⇒ G&gt;L</text>
</svg>
