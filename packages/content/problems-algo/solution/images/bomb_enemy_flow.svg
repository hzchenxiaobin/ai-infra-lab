<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：逐行扫描，遇墙重算，空格取 max</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">rowHits 每行重置；colHits[n] 跨行复用，遇墙重算</text>

  <!-- Step 1: init -->
  <rect x="170" y="58" width="180" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="82" text-anchor="middle" font-size="11" fill="#446688">colHits[0..n-1] = 0, ans = 0</text>
  <path d="M 260 96 L 260 106" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 2: for i -->
  <rect x="170" y="108" width="180" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="132" text-anchor="middle" font-size="11" fill="#446688">for i = 0 to m-1: rowHits = 0</text>
  <path d="M 260 146 L 260 156" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 3: for j -->
  <rect x="170" y="158" width="180" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="182" text-anchor="middle" font-size="11" fill="#446688">for j = 0 to n-1:</text>
  <path d="M 260 196 L 260 206" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Diamond 1: row segment start? -->
  <polygon points="260,208 360,248 260,288 160,248" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="244" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">j==0 或</text>
  <text x="260" y="258" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">grid[i][j-1]=='W'?</text>

  <!-- Yes branch: recompute rowHits -->
  <path d="M 360 248 L 400 248" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="372" y="242" font-size="9" fill="#4a7a3a">是</text>
  <rect x="400" y="228" width="110" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="455" y="245" text-anchor="middle" font-size="9" fill="#4a7a3a">向右扫描到墙</text>
  <text x="455" y="259" text-anchor="middle" font-size="9" fill="#4a7a3a">重算 rowHits</text>
  <!-- No branch: reuse -->
  <path d="M 160 248 L 120 248" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="132" y="242" font-size="9" fill="#888">否</text>
  <rect x="10" y="228" width="110" height="42" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="65" y="245" text-anchor="middle" font-size="9" fill="#888">复用上一格的</text>
  <text x="65" y="259" text-anchor="middle" font-size="9" fill="#888">rowHits</text>

  <path d="M 260 288 L 260 298" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Diamond 2: col segment start? -->
  <polygon points="260,300 360,340 260,380 160,340" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="336" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">i==0 或</text>
  <text x="260" y="350" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">grid[i-1][j]=='W'?</text>

  <!-- Yes branch: recompute colHits -->
  <path d="M 360 340 L 400 340" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="372" y="334" font-size="9" fill="#4a7a3a">是</text>
  <rect x="400" y="320" width="110" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="455" y="337" text-anchor="middle" font-size="9" fill="#4a7a3a">向下扫描到墙</text>
  <text x="455" y="351" text-anchor="middle" font-size="9" fill="#4a7a3a">重算 colHits[j]</text>
  <!-- No branch: reuse -->
  <path d="M 160 340 L 120 340" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="132" y="334" font-size="9" fill="#888">否</text>
  <rect x="10" y="320" width="110" height="42" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="65" y="337" text-anchor="middle" font-size="9" fill="#888">复用上一行的</text>
  <text x="65" y="351" text-anchor="middle" font-size="9" fill="#888">colHits[j]</text>

  <path d="M 260 380 L 260 390" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Final: if empty cell, update ans -->
  <rect x="130" y="392" width="260" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="410" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">若 grid[i][j]=='0'：</text>
  <text x="260" y="424" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">ans = max(ans, rowHits + colHits[j])</text>
</svg>
