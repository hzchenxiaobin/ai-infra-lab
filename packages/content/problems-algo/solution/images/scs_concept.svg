<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">最短公共超序列：以 LCS 为骨架合并两串，共享字符只出现一次</text>

  <!-- ===== str1 row ===== -->
  <text x="36" y="80" font-size="12" fill="#888" font-weight="bold">str1</text>
  <text x="74" y="80" font-size="10" fill="#999">= "abac"</text>

  <!-- LCS bracket above str1 -->
  <path d="M 183 50 L 183 44 L 277 44 L 277 50" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="230" y="38" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">LCS = "ab"</text>

  <!-- str1 boxes: a(green) b(green) a(blue) c(blue) -->
  <rect x="183" y="58" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="205" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="233" y="58" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>
  <rect x="283" y="58" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="305" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="333" y="58" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="355" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">c</text>

  <!-- arrow down from str1 to SCS -->
  <path d="M 280 100 L 280 120" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="114" font-size="10" fill="#888">合并</text>

  <!-- ===== SCS row ===== -->
  <text x="36" y="160" font-size="12" fill="#888" font-weight="bold">SCS</text>
  <text x="74" y="160" font-size="10" fill="#999">= "cabac"</text>

  <!-- SCS boxes: c(orange) a(green) b(green) a(blue) c(blue) -->
  <rect x="158" y="138" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="160" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">c</text>
  <rect x="208" y="138" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="160" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="258" y="138" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="160" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>
  <rect x="308" y="138" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="160" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="358" y="138" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="160" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">c</text>

  <!-- arrow up from str2 to SCS -->
  <path d="M 280 196 L 280 176" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="190" font-size="10" fill="#888">合并</text>

  <!-- ===== str2 row ===== -->
  <text x="36" y="220" font-size="12" fill="#888" font-weight="bold">str2</text>
  <text x="74" y="220" font-size="10" fill="#999">= "cab"</text>

  <!-- str2 boxes: c(orange) a(green) b(green) -->
  <rect x="208" y="198" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="220" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">c</text>
  <rect x="258" y="198" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="220" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="308" y="198" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="220" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>

  <!-- LCS bracket below str2 -->
  <path d="M 258 240 L 258 246 L 352 246 L 352 240" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="305" y="258" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">LCS = "ab"</text>

  <!-- ===== Formula / legend ===== -->
  <rect x="60" y="270" width="440" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="290" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">|SCS| = |str1| + |str2| − |LCS| = 4 + 3 − 2 = 5</text>
  <text x="280" y="308" text-anchor="middle" font-size="11" fill="#666">绿色 = LCS 共享字符（只出现一次） · 蓝色 = str1 独有 · 橙色 = str2 独有</text>
  <text x="280" y="322" text-anchor="middle" font-size="11" fill="#666">非 LCS 字符全部保留 → SCS 是同时包含两串的最短字符串</text>
</svg>
