<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="540" height="500" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">找到最大整数索引 · 算法流程</text>

  <!-- A: init -->
  <rect x="180" y="44" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="69" text-anchor="middle" font-size="12" fill="#333">left = 0, right = n − 1</text>

  <path d="M270 86 L270 104" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B: loop diamond -->
  <polygon points="270,108 350,144 270,180 190,144" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="140" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">left &lt; right ?</text>
  <text x="270" y="156" text-anchor="middle" font-size="9.5" fill="#888">区间是否 &gt; 1 个元素</text>

  <!-- B No -> return left -->
  <path d="M350 144 L420 144" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="136" font-size="10.5" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="420" y="124" width="100" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="470" y="146" text-anchor="middle" font-size="10.5" fill="#333">返回</text>
  <text x="470" y="160" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">left</text>

  <!-- B Yes -> down -->
  <path d="M270 180 L270 200" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="278" y="194" font-size="10.5" fill="#b85450" font-weight="bold">是</text>

  <!-- D: compute half -->
  <rect x="150" y="204" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="229" text-anchor="middle" font-size="11.5" fill="#333">half = ⌊(right − left + 1) / 2⌋</text>

  <path d="M270 244 L270 262" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- E: compare box -->
  <rect x="90" y="266" width="360" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="287" text-anchor="middle" font-size="11" fill="#333">cmp = compareSub(left, left+half−1,</text>
  <text x="270" y="306" text-anchor="middle" font-size="11" fill="#333">right−half+1, right)</text>

  <path d="M270 322 L270 340" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- F: cmp diamond -->
  <polygon points="270,344 350,380 270,416 190,380" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="385" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">cmp = ?</text>

  <!-- cmp == 1 -> left -->
  <path d="M190 380 L150 380" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="160" y="372" font-size="10.5" fill="#446688" font-weight="bold">1</text>
  <rect x="20" y="360" width="130" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="85" y="380" text-anchor="middle" font-size="10.5" fill="#333">大数在左半</text>
  <text x="85" y="395" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">right = left+half−1</text>
  <!-- loop back to B left point (190,144): up at x=85 from y=360 to y=144 then right to 190 -->
  <path d="M85 360 L85 144 L188 144" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- cmp == -1 -> right -->
  <path d="M350 380 L390 380" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="360" y="372" font-size="10.5" fill="#4a7a3a" font-weight="bold">−1</text>
  <rect x="390" y="360" width="130" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="455" y="380" text-anchor="middle" font-size="10.5" fill="#333">大数在右半</text>
  <text x="455" y="395" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">left = right−half+1</text>
  <!-- loop back to B right point (350,144): up at x=455 from y=360 to y=144 then left to 350 -->
  <path d="M455 360 L455 144 L352 144" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- cmp == 0 -> down return mid -->
  <path d="M270 416 L270 434" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="278" y="428" font-size="10.5" fill="#d6a040" font-weight="bold">0</text>
  <rect x="160" y="438" width="220" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="458" text-anchor="middle" font-size="11" fill="#333">大数即中点（仅奇数长度）</text>
  <text x="270" y="474" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">return left + half</text>
</svg>
