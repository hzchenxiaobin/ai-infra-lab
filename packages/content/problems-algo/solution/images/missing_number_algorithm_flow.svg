<svg xmlns="http://www.w3.org/2000/svg" width="860" height="640" viewBox="0 0 860 640" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="860" height="640" fill="#fafafa"/>
  <text x="430" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：异或法一次遍历求缺失数</text>
  <path d="M 280 44 Q 430 52 580 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 开始 -->
  <g filter="url(#sk)">
    <ellipse cx="430" cy="86" rx="56" ry="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="430" y="91" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">开始</text>
  <path d="M 430 110 L 430 134" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 初始化 -->
  <g filter="url(#sk)">
    <rect x="320" y="136" width="220" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="430" y="158" text-anchor="middle" font-size="14" fill="#5a4530">ans = n   （补上完整集的 n）</text>
  <text x="430" y="174" text-anchor="middle" font-size="12" fill="#7a5415">i = 0</text>
  <path d="M 430 182 L 430 206" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 判断 i < n -->
  <g filter="url(#sk)">
    <path d="M 430 256 L 330 206 L 430 206 L 530 206 Z" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" transform="translate(0,50)"/>
  </g>
  <text x="430" y="282" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">i &lt; n ?</text>

  <!-- 是：异或 -->
  <path d="M 330 256 L 200 256 L 200 320" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="245" y="248" font-size="13" font-weight="bold" fill="#4a7a3a">是</text>
  <g filter="url(#sk)">
    <rect x="90" y="322" width="220" height="56" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="200" y="346" text-anchor="middle" font-size="13" fill="#2b4a20">ans ^= i ^ nums[i]</text>
  <text x="200" y="364" text-anchor="middle" font-size="12" fill="#4a7a3a">同时吃掉一个下标和一个值</text>
  <path d="M 200 378 L 200 416 L 430 416 L 430 256" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="285" y="408" font-size="12" fill="#666">i++，回到判断</text>

  <!-- 否：返回 -->
  <path d="M 530 256 L 660 256 L 660 320" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="585" y="248" font-size="13" font-weight="bold" fill="#b85450">否</text>
  <g filter="url(#sk)">
    <rect x="540" y="322" width="240" height="56" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="660" y="346" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">return ans</text>
  <text x="660" y="364" text-anchor="middle" font-size="12" fill="#b85450">此时 ans = 缺失的数</text>
  <path d="M 660 378 L 660 470" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 结束 -->
  <g filter="url(#sk)">
    <ellipse cx="660" cy="492" rx="56" ry="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="660" y="497" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">结束</text>

  <!-- 底部不变式说明 -->
  <g filter="url(#sk)">
    <rect x="90" y="540" width="680" height="86" rx="8" fill="#fffdf3" stroke="#d6a040"/>
  </g>
  <text x="110" y="564" font-size="13" font-weight="bold" fill="#7a5415">循环不变式：</text>
  <text x="110" y="586" font-size="12" fill="#5a4530">每轮结束后，ans = (完整集 {n} ∪ {0..i}) ⊕ (数组 {nums[0..i]})</text>
  <text x="110" y="606" font-size="12" fill="#5a4530">已处理的部分成对相消为 0，ans 始终等于「未处理部分 + 缺失数」的异或。</text>
  <text x="110" y="624" font-size="12" font-weight="bold" fill="#7a5415">遍历结束 i = n，完整集与数组全部异或完毕 → ans 恰为缺失数。</text>
</svg>
