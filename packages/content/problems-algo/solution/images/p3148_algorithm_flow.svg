<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一趟行优先扫描 + 一维滚动数组</text>

  <!-- init -->
  <rect x="60" y="32" width="240" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="180" y="51" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">premin ← [+∞]×n ， ans ← −∞</text>
  <path d="M 180 62 L 180 78" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- loop -->
  <rect x="60" y="82" width="240" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="180" y="100" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">逐格扫描 (i, j)：行 0→m−1，列 0→n−1</text>
  <path d="M 180 110 L 180 126" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- best -->
  <rect x="50" y="130" width="260" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="180" y="147" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">best ← min( premin[j]，premin[j−1] )</text>
  <text x="180" y="163" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">（j = 0 时只看 premin[j]）</text>
  <path d="M 180 170 L 180 186" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="180,188 258,214 180,240 102,214" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="218" text-anchor="middle" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">best &lt; +∞ ?</text>

  <!-- yes branch -->
  <path d="M 258 214 L 322 214" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="286" y="208" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="326" y="196" width="180" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="416" y="212" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">ans ← max( ans,</text>
  <text x="416" y="226" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">grid[i][j] − best )</text>

  <!-- no branch -->
  <path d="M 180 240 L 180 258" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="188" y="254" font-size="9.5" fill="#666" filter="url(#rough2)">否：(0,0) 无可选起点</text>

  <!-- ans return path -->
  <path d="M 416 232 L 416 278 L 324 278" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- update -->
  <rect x="60" y="262" width="260" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="190" y="282" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">premin[j] ← min( best，grid[i][j] )</text>

  <!-- loop back -->
  <path d="M 60 278 L 34 278 L 34 96 L 56 96" stroke="#446688" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="26" y="190" font-size="9.5" fill="#666" filter="url(#rough2)" transform="rotate(-90 26 190)">下一格</text>

  <!-- end -->
  <path d="M 180 294 L 180 306" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="60" y="310" width="240" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="180" y="327" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">全部扫完 → return ans</text>

  <!-- annotation: read old / read new -->
  <rect x="340" y="36" width="170" height="140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="350" y="55" font-size="10" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">读旧读新，一维两用：</text>
  <text x="350" y="73" font-size="9.5" fill="#8a6a1f" filter="url(#rough2)">premin[j] 未更新 = 上一行</text>
  <text x="356" y="88" font-size="9.5" fill="#8a6a1f" filter="url(#rough2)">⇒ 上方块 [0..i−1]×[0..j]</text>
  <text x="350" y="106" font-size="9.5" fill="#8a6a1f" filter="url(#rough2)">premin[j−1] 已更新 = 本行</text>
  <text x="356" y="121" font-size="9.5" fill="#8a6a1f" filter="url(#rough2)">⇒ 左块 [0..i]×[0..j−1]</text>
  <text x="350" y="139" font-size="9.5" fill="#8a6a1f" filter="url(#rough2)">两者取 min = 左上区域去掉</text>
  <text x="350" y="154" font-size="9.5" fill="#8a6a1f" filter="url(#rough2)">(i,j) 自身后的最小值</text>
  <text x="350" y="170" font-size="9.5" fill="#8a6a1f" filter="url(#rough2)">（起点 ≠ 终点）</text>

  <!-- annotation: negative init -->
  <rect x="336" y="296" width="176" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="424" y="314" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">ans 从 −∞ 起步：</text>
  <text x="424" y="330" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">必须动一次，全递减矩阵</text>
  <text x="424" y="344" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">答案为负（示例 2 = −1）</text>
</svg>
