<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="280" y="32" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">数据结构：tweetName → 有序时间列表 + 区间切分</text>

  <!-- 左侧：HashMap 面板 -->
  <rect x="28" y="60" width="220" height="200" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="138" y="82" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">HashMap</text>

  <!-- key -->
  <rect x="48" y="100" width="80" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="88" y="122" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">tweet3</text>

  <!-- 有序时间列表 -->
  <text x="48" y="158" font-size="12" fill="#555" filter="url(#rough2)">有序时间列表：</text>
  <g filter="url(#rough2)">
    <rect x="48"  y="168" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="92"  y="168" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="136" y="168" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="180" y="168" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="68"  y="189" text-anchor="middle" font-size="12" fill="#333">0</text>
    <text x="112" y="189" text-anchor="middle" font-size="12" fill="#333">10</text>
    <text x="156" y="189" text-anchor="middle" font-size="12" fill="#333">60</text>
    <text x="200" y="189" text-anchor="middle" font-size="12" fill="#333">120</text>
  </g>
  <text x="138" y="226" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">recordTweet 用 insort 维持升序</text>

  <!-- 右侧：区间切分面板 -->
  <rect x="300" y="60" width="232" height="200" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="416" y="82" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">查询区间 [0, 180]，minute</text>

  <!-- 时间轴 -->
  <line x1="316" y1="130" x2="516" y2="130" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="316" y="120" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="516" y="120" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">180</text>

  <!-- 三个 chunk -->
  <g filter="url(#rough2)">
    <rect x="316" y="142" width="66" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="384" y="142" width="66" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="452" y="142" width="64" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="349" y="161" text-anchor="middle" font-size="11" fill="#333">[0,59]</text>
    <text x="417" y="161" text-anchor="middle" font-size="11" fill="#333">[60,119]</text>
    <text x="484" y="161" text-anchor="middle" font-size="11" fill="#333">[120,179]</text>
  </g>

  <!-- 每个 chunk 的计数 -->
  <g filter="url(#rough2)">
    <text x="349" y="196" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">2</text>
    <text x="417" y="196" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">1</text>
    <text x="484" y="196" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">1</text>
    <text x="416" y="222" text-anchor="middle" font-size="12" fill="#555">每段计数 = 该段内的时间个数</text>
  </g>

  <!-- 连接箭头 -->
  <path d="M248,160 Q274,160 300,158" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 底部要点 -->
  <rect x="40" y="288" width="480" height="68" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="312" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">time 高达 10⁹ 且稀疏 → 不能用数组按下标存</text>
  <text x="280" y="334" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">用 HashMap 聚合同名推文，有序列表支撑二分计数</text>
</svg>
