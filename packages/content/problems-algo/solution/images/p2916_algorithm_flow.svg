<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#555"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="450" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一轮一次区间加，平方和直接进答案</text>

  <rect x="170" y="38" width="220" height="36" rx="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="61" text-anchor="middle" font-size="12" fill="#333">r = 0，last 全为 −1</text>

  <path d="M 280 74 L 280 90" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,94 396,140 280,186 164,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="145" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">r &lt; n ?</text>

  <path d="M 396 140 L 444 140" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="418" y="132" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="446" y="118" width="98" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="495" y="136" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 ans</text>
  <text x="495" y="153" text-anchor="middle" font-size="10" fill="#555">(mod 1e9+7)</text>

  <path d="M 280 186 L 280 206" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="202" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="130" y="210" width="300" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="232" text-anchor="middle" font-size="12" fill="#333">取 p = last[nums[r]]（不存在则 −1）</text>

  <path d="M 280 244 L 280 260" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="262" width="340" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="282" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">对区间 [p+1, r] 整体 +1</text>
  <text x="280" y="300" text-anchor="middle" font-size="10.5" fill="#555">BIT：先查 T，S += 2T + len，再区间加 1</text>
  <text x="280" y="314" text-anchor="middle" font-size="10.5" fill="#555">线段树：区间更新后 S = 根节点 s2</text>

  <path d="M 280 320 L 280 336" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="338" width="280" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="12" fill="#333">ans = (ans + S) mod 1e9+7</text>

  <path d="M 280 372 L 280 388" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="390" width="280" height="34" fill="#ffffff" stroke="#aaa" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="280" y="412" text-anchor="middle" font-size="12" fill="#333">last[nums[r]] = r；r += 1</text>

  <path d="M 140 407 L 84 407 L 84 140 L 158 140" fill="none" stroke="#446688" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="84" y="268" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">下一轮</text>
</svg>
