<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="560" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：离散化 + BIT 滑动窗口</text>

  <!-- 开始 -->
  <ellipse cx="110" cy="56" rx="40" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="61" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M 110 74 L 110 88" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 离散化 -->
  <rect x="30" y="90" width="160" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="107" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">离散化：nums → 排名 1..n</text>
  <text x="110" y="122" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">（值域 10⁹ 压成 n 档）</text>
  <path d="M 110 128 L 110 140" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 首窗口 -->
  <rect x="16" y="142" width="188" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="162" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">建首个窗口 [0, k−1]</text>
  <text x="110" y="180" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">inv = Σ 插入时比它大的个数</text>
  <text x="110" y="198" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ans = inv</text>
  <path d="M 110 200 L 110 216" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 出窗 -->
  <rect x="16" y="218" width="188" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="110" y="238" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">❶ 出窗 nums[l]（先出！）</text>
  <text x="110" y="256" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">inv −= query(rk[l] − 1)</text>
  <text x="110" y="272" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">BIT(rk[l], −1)</text>
  <path d="M 110 276 L 110 292" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 进窗 -->
  <rect x="16" y="294" width="188" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="110" y="314" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">❷ 进窗 nums[l+k]（后进）</text>
  <text x="110" y="332" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">inv += (k−1) − query(rk)</text>
  <text x="110" y="348" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">BIT(rk, +1)</text>
  <path d="M 110 352 L 110 368" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 取 min -->
  <rect x="38" y="370" width="144" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="110" y="391" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">ans = min(ans, inv)</text>
  <path d="M 110 404 L 110 418" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <path d="M 110 420 L 178 456 L 110 492 L 42 456 z" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="110" y="452" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">窗口还能右滑？</text>
  <text x="110" y="468" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">(l + k &lt; n)</text>

  <!-- 是：回到出窗 -->
  <path d="M 178 456 L 214 456 L 214 247 L 206 247" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="191" y="448" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 否：返回 -->
  <path d="M 110 492 L 110 508" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="120" y="504" text-anchor="start" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="44" y="510" width="132" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="110" y="533" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">返回 ans</text>

  <!-- 右侧要点 -->
  <rect x="250" y="90" width="296" height="110" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="398" y="114" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">要点</text>
  <text x="398" y="136" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">· 每个元素恰好进窗、出窗各一次</text>
  <text x="398" y="156" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">· 每次出/进 = 1 次查询 + 1 次更新</text>
  <text x="398" y="176" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">· 全程 O(n log n)，空间 O(n)</text>
  <text x="398" y="192" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">⚠️ 先出后进，顺序不能反</text>
</svg>
