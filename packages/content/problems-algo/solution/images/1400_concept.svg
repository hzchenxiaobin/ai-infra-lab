<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：奇频字符数 ≤ k 才能构造 k 个回文</text>

  <text x="40" y="62" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">A. 一个回文 → 至多 1 个奇频字符（放正中）</text>

  <path d="M112,76 Q212,40 312,76" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="212" y="44" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">e↔e 成对</text>
  <path d="M162,76 Q212,52 262,76" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="262" y="58" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">l↔l</text>

  <rect x="90" y="76" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="102" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">e</text>
  <rect x="140" y="76" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="162" y="102" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">l</text>
  <rect x="190" y="76" width="44" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="212" y="102" text-anchor="middle" font-size="18" fill="#b85450" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="240" y="76" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="262" y="102" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">l</text>
  <rect x="290" y="76" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="312" y="102" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">e</text>

  <text x="112" y="132" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">e:2 偶</text>
  <text x="162" y="132" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">l:2 偶</text>
  <text x="212" y="132" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">b:1 奇</text>
  <text x="262" y="132" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">l:2 偶</text>
  <text x="312" y="132" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">e:2 偶</text>
  <text x="390" y="102" font-size="11" fill="#888" filter="url(#rough2)">← 正中 1 个奇频</text>

  <text x="40" y="168" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">B. k 个回文 → 至多容纳 k 个奇频字符</text>

  <rect x="50" y="182" width="130" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="80" y="210" font-size="12" fill="#333" filter="url(#rough2)">回文 1</text>
  <circle cx="150" cy="206" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="232" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">槽位</text>

  <rect x="205" y="182" width="130" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="235" y="210" font-size="12" fill="#333" filter="url(#rough2)">回文 2</text>
  <circle cx="305" cy="206" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="305" y="232" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">槽位</text>

  <rect x="360" y="182" width="130" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="390" y="210" font-size="12" fill="#333" filter="url(#rough2)">回文 k</text>
  <circle cx="460" cy="206" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="460" y="232" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">槽位</text>

  <text x="80" y="250" font-size="11" fill="#888" filter="url(#rough2)">… …</text>
  <text x="270" y="250" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">每个回文正中 1 个槽位 → k 个回文容纳 k 个奇频字符</text>

  <rect x="30" y="272" width="480" height="116" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="296" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">充要条件（两个不等式同时成立）</text>
  <text x="55" y="320" font-size="12" fill="#333" filter="url(#rough2)">• oddCount ≤ k ：s 中奇频字符需各占一个回文的正中，槽位不够则无法构造</text>
  <text x="55" y="342" font-size="12" fill="#333" filter="url(#rough2)">• k ≤ len(s) ：每个回文至少 1 个字符，回文数不能超过总字符数</text>
  <text x="55" y="364" font-size="12" fill="#333" filter="url(#rough2)">• 偶频字符可任意铺到两侧，不构成约束 → 两条件即可，无需搜索划分</text>
  <text x="55" y="382" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">充要性：必要性由回文结构给出；充分性由「奇频当中心 + 偶频任意配对」构造给出</text>
</svg>
