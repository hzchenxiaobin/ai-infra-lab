<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">两表关联：Employees LEFT JOIN Logs（保全员工）</text>

  <!-- ===== Employees table ===== -->
  <rect x="24" y="50" width="190" height="150" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="119" y="70" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">Employees</text>
  <line x1="34" y1="78" x2="204" y2="78" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="36" y="94" font-size="11" fill="#b85450" font-weight="bold">employee_id  PK</text>
  <text x="36" y="110" font-size="11" fill="#d6a040" font-weight="bold">needed_hours</text>
  <text x="36" y="132" font-size="10" fill="#888">1  →  20</text>
  <text x="36" y="146" font-size="10" fill="#888">2  →  12</text>
  <text x="36" y="160" font-size="10" fill="#888">3  →   2</text>
  <text x="36" y="184" font-size="9" fill="#446688">每位员工须工作的小时数</text>

  <!-- ===== Logs table ===== -->
  <rect x="372" y="50" width="190" height="150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="467" y="70" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">Logs</text>
  <line x1="382" y1="78" x2="552" y2="78" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="384" y="94" font-size="11" fill="#b85450" font-weight="bold">employee_id  FK</text>
  <text x="384" y="110" font-size="11" fill="#333">in_time  (datetime)</text>
  <text x="384" y="126" font-size="11" fill="#333">out_time (datetime)</text>
  <text x="384" y="148" font-size="10" fill="#888">1 · 09:00 → 17:00</text>
  <text x="384" y="162" font-size="10" fill="#888">2 · 12:00 → 23:58</text>
  <text x="384" y="184" font-size="9" fill="#4a7a3a">打卡进出记录（可多行/可无）</text>

  <!-- Join arrow -->
  <path d="M 214 116 L 372 116" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="293" y="108" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">LEFT JOIN ON employee_id</text>
  <text x="293" y="130" text-anchor="middle" font-size="9" fill="#b85450">无打卡者保留为 NULL 行</text>

  <!-- ===== Formula box ===== -->
  <rect x="60" y="226" width="460" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="248" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">worked = COALESCE( SUM( TIMESTAMPDIFF(HOUR, in_time, out_time) ), 0 )</text>
  <text x="290" y="268" text-anchor="middle" font-size="10" fill="#888">无打卡者 SUM 为 NULL → COALESCE 归 0；0 &lt; needed_hours 必被开除</text>

  <!-- ===== Output ===== -->
  <rect x="120" y="304" width="340" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="324" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">输出：employee_id（worked &lt; needed_hours 者）</text>
  <text x="290" y="342" text-anchor="middle" font-size="10" fill="#888">HAVING worked &lt; needed_hours</text>

  <path d="M 290 282 L 290 304" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
