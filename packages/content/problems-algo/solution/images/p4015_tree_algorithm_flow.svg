<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="16" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">算法流程：建邻接表 → BFS 逐层求深度 → 按层乘数加权求和</text>

  <!-- 主流程 -->
  <rect x="105" y="34" width="190" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="58" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">① 由 parent 建孩子邻接表</text>

  <path d="M 200 74 L 200 94" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="105" y="98" width="190" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="122" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">② depth[0] = 1，根 0 入队</text>

  <path d="M 200 138 L 200 158" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="105" y="162" width="190" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="186" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">③ 出队 u：h ← max(h, depth[u])</text>

  <path d="M 200 202 L 200 222" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="105" y="226" width="190" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="243" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">④ 对 u 的每个孩子 v：</text>
  <text x="200" y="258" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">depth[v] = depth[u] + 1，v 入队</text>

  <path d="M 200 266 L 200 280" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="200,284 272,308 200,332 128,308" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="312" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">队列空？</text>

  <path d="M 128 308 L 58 308 L 58 182 L 101 182" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="48" y="262" text-anchor="end" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>

  <path d="M 200 332 L 200 346" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="212" y="343" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="75" y="350" width="250" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="367" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5527" filter="url(#rough2)">⑤ ans = Σ nums[i] × (h − depth[i] + 1)</text>
  <text x="200" y="383" text-anchor="middle" font-size="9" fill="#2f5527" filter="url(#rough2)">（C++ 记得 long long，答案上界约 5×10¹⁵）</text>

  <!-- 右侧：复杂度 -->
  <rect x="322" y="96" width="176" height="104" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="410" y="114" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">复杂度</text>
  <text x="410" y="133" text-anchor="middle" font-size="9.5" fill="#7a5c1a" filter="url(#rough2)">时间 O(n)：每个节点恰好</text>
  <text x="410" y="147" text-anchor="middle" font-size="9.5" fill="#7a5c1a" filter="url(#rough2)">入队、出队一次</text>
  <text x="410" y="165" text-anchor="middle" font-size="9.5" fill="#7a5c1a" filter="url(#rough2)">空间 O(n)：邻接表 +</text>
  <text x="410" y="179" text-anchor="middle" font-size="9.5" fill="#7a5c1a" filter="url(#rough2)">depth 数组</text>

  <!-- 右侧：实现坑 -->
  <rect x="322" y="214" width="176" height="148" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="410" y="232" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">实现上的坑</text>
  <text x="410" y="251" text-anchor="middle" font-size="9.5" fill="#8a3a35" filter="url(#rough2)">① 链状树递归 DFS 深达 n，</text>
  <text x="410" y="265" text-anchor="middle" font-size="9.5" fill="#8a3a35" filter="url(#rough2)">Python 必爆递归上限</text>
  <text x="410" y="283" text-anchor="middle" font-size="9.5" fill="#8a3a35" filter="url(#rough2)">② parent[i] 不保证 &lt; i，</text>
  <text x="410" y="297" text-anchor="middle" font-size="9.5" fill="#8a3a35" filter="url(#rough2)">不能按编号顺序递推深度</text>
  <text x="410" y="315" text-anchor="middle" font-size="9.5" fill="#8a3a35" filter="url(#rough2)">③ 答案上界约 5×10¹⁵，</text>
  <text x="410" y="329" text-anchor="middle" font-size="9.5" fill="#8a3a35" filter="url(#rough2)">32 位整数装不下</text>
</svg>
