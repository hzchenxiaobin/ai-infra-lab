<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="18" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：特判 n=1，其余一步定胜负</text>
  <text x="260" y="35" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">Alice 首轮一刀清场——删掉 n−1 个元素、只留较大端点</text>

  <!-- Start -->
  <rect x="150" y="50" width="190" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="245" y="69" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">开始：数组 nums，长度 n</text>

  <path d="M 245 82 L 245 95" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Diamond: n == 1? -->
  <polygon points="245,98 315,126 245,154 175,126" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="245" y="130" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">n == 1 ?</text>

  <path d="M 315 126 L 345 126" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="328" y="118" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="350" y="111" width="145" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="422" y="130" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">返回 nums[0]</text>

  <path d="M 245 154 L 245 169" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="256" y="166" font-size="9" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- Alice one-cut box -->
  <rect x="140" y="172" width="210" height="54" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="245" y="191" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">Alice 一刀删掉 n−1 个</text>
  <text x="245" y="207" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">（删后缀留首 / 删前缀留尾，取较大端点）</text>
  <text x="245" y="221" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">合法性：n−1 &lt; n ✓</text>

  <path d="M 245 226 L 245 243" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Game over box -->
  <rect x="140" y="246" width="210" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="245" y="265" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">游戏当场结束，Bob 无从出手</text>

  <path d="M 245 276 L 245 291" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Final return box -->
  <rect x="120" y="294" width="250" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="245" y="313" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">返回 max(nums[0], nums[n−1])</text>
  <text x="245" y="330" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">O(1) 时间 / O(1) 空间</text>

  <!-- Reasoning side box -->
  <rect x="360" y="180" width="150" height="130" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="435" y="200" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">为何拿不到更高？</text>
  <text x="435" y="219" text-anchor="middle" font-size="8.5" fill="#555" filter="url(#rough2)">中间元素要活到最后，</text>
  <text x="435" y="234" text-anchor="middle" font-size="8.5" fill="#555" filter="url(#rough2)">左右须各删一段（≥2 步），</text>
  <text x="435" y="249" text-anchor="middle" font-size="8.5" fill="#555" filter="url(#rough2)">期间必轮到 Bob 出刀——</text>
  <text x="435" y="264" text-anchor="middle" font-size="8.5" fill="#555" filter="url(#rough2)">他一刀删掉含它的整段 ✗</text>
  <text x="435" y="282" text-anchor="middle" font-size="8.5" fill="#555" filter="url(#rough2)">或直接清场拿 min(两端)</text>
  <text x="435" y="300" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">⇒ 中间的最大值守不住</text>
</svg>
